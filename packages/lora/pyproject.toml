[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "codex-ml-lora"
dynamic = ["version"]
description = "Import-light LoRA contracts and optional PEFT adapters for Codex ML"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["adapters", "contracts", "lora", "peft"]
authors = [{ name = "Aries Serpent" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
peft = ["peft>=0.20.0,<1"]
test = ["pytest>=9.0.3,<10"]

[project.urls]
Documentation = "https://aries-serpent.github.io/_codex_/"
Issues = "https://github.com/Aries-Serpent/_codex_/issues"
Source = "https://github.com/Aries-Serpent/_codex_"

[tool.hatch.version]
path = "src/codex_lora/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_lora"]

[tool.coverage.run]
source_pkgs = ["codex_lora", "tests"]
branch = true
