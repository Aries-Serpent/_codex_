[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "codex-ml-evaluation"
dynamic = ["version"]
description = "Import-light evaluation contracts and adapters for Codex ML"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Aries Serpent" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.optional-dependencies]
hf = [
  "datasets>=5.0.0,<6",
  "torch>=2.6.1,<3.0.0; platform_system != 'Windows'",
  "transformers>=5.16.1,<6",
]
framework = ["evaluate>=0.4.6,<1"]
test = ["pytest>=9.0.3,<10"]

[tool.hatch.version]
path = "src/codex_evaluation/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_evaluation"]

[tool.coverage.run]
source_pkgs = ["codex_evaluation", "tests"]
branch = true
