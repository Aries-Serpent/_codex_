[build-system]
requires = [
    "setuptools>=78.1.1,<82",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "codex-ml"
description = "Codex ML training, evaluation, and plugin framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Aries Serpent" },
]
keywords = [
    "ml",
    "training",
    "evaluation",
    "plugins",
    "hydra",
    "cli",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    # Essential configuration & validation (offline-first)
    "omegaconf>=2.3",
    "hydra-core==1.3.4",
    "pydantic>=2.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "marshmallow>=3.7.1,<5",
    # CLI support
    "typer>=0.12",
    # Code analysis (core feature)
    "libcst>=1.0.0",
    "parso>=0.8.0",
    "radon>=6.0.1",
    "jinja2>=3.1.6",
    # Security (CVE fixes)
    "cryptography>=50.0.0,<51.0.0",  # Security: CVE fixes (46.0.5+ required for CVE:2026-26007)
    "PyJWT>=2.13.0,<3.0.0",  # Security: CVE fixes (2.7.0 had 7 CVEs)
    "PyNaCl>=1.5.0,<2.0.0",  # Security: Cryptographic library
    # Standard library replacements & utilities
    "certifi>=2026.6.17",
    "filelock>=3.29.0",
    "idna>=3.18",
    "urllib3>=2.7.0",
    "requests>=2.34.2",
    "defusedxml>=0.7.1",
]
version = "0.1.0"

[project.optional-dependencies]
# ==============================================================================
# THREE-PROFILE PACKAGING STRATEGY (as of v0.1.0)
# ==============================================================================
# 
# Core Profile (8-15 MB): Essential OODA loop APIs, offline-first, stdlib only
#   - Use: pip install codex-ml[core]
#   - For: lightweight deployment, offline environments, edge devices
#   - Includes: configuration, CLI, safety enforcement
#
# Runtime Profile (20-35 MB): ML inference + pattern learning
#   - Use: pip install codex-ml[runtime]
#   - For: production inference, pattern recognition, API services
#   - Includes: torch, transformers, datasets, ray[serve], fastapi
#
# Full Profile (100+ MB): Complete development environment
#   - Use: pip install codex-ml[full]
#   - For: development, testing, experimentation
#   - Includes: core + runtime + all dev tools, test utilities, plugins
#

# CORE PROFILE (minimum viable, offline-first)
core = [
    # Configuration management (already in base)
    "hydra-core==1.3.4",
    "omegaconf>=2.3",
    # Data validation (already in base)
    "pydantic>=2.4",
    "pydantic-settings>=2.14.2",
    # Serialization (already in base)
    "marshmallow>=3.7.1,<5",
    "PyYAML>=6.0",
    # CLI support
    "typer>=0.12",
    "click>=8.1",
    # Code parsing/analysis (core features)
    "libcst>=1.0.0",
    "parso>=0.8.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.20.0",
    "tree-sitter-yaml>=0.7.2",
    "sqlparse>=0.5.5",
]

# RUNTIME PROFILE (inference + pattern learning)
runtime = [
    # Data processing & ML
    "pandas>=2.0.3,<3",
    "numpy>=2.4.6,<3",
    "scikit-learn>=1.9.0,<2",
    "sentencepiece>=0.1.99",
    # ML inference & training
    "torch>=2.6.1,<3.0.0; platform_system != 'Windows'",
    "transformers>=5.12.1,<6",
    "datasets>=5.0.0,<6",
    "accelerate>=1.14.0,<2",
    "peft>=0.19.1,<1",
    # Web services
    "fastapi>=0.135.3,<1",
    "litestar>=2.22.0,<3",
    "starlette>=1.0.1,<2",
    "slowapi>=0.1.9",
    # API clients
    "httpx>=0.26,<1",
    # Distributed computing
    "ray[serve]>=2.9,<3",
    # Monitoring & telemetry
    "prometheus-client>=0.19.0",
    "psutil>=5.9",
    # Evidence generation
    "evidently>=0.7.21,<1",
    # Database
    "duckdb>=1.5.4",
    # RAG pipeline
    "sentence-transformers>=5.5.1,<6.0.0",
    "chromadb>=1.5.8,<2.0.0",
    "faiss-cpu>=1.13.2,<2.0.0",
]

# FULL PROFILE (development + all features)
full = [
    # All core + runtime
    "hydra-core==1.3.4",
    "omegaconf>=2.3",
    "pydantic>=2.4",
    "pydantic-settings>=2.14.2",
    "marshmallow>=3.7.1,<5",
    "PyYAML>=6.0",
    "typer>=0.12",
    "click>=8.1",
    "libcst>=1.0.0",
    "parso>=0.8.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.20.0",
    "tree-sitter-yaml>=0.7.2",
    "sqlparse>=0.5.5",
    "torch>=2.6.1,<3.0.0; platform_system != 'Windows'",
    "transformers>=5.12.1,<6",
    "datasets>=5.0.0,<6",
    "accelerate>=1.14.0,<2",
    "peft>=0.19.1,<1",
    "scikit-learn>=1.9.0,<2",
    "fastapi>=0.135.3,<1",
    "litestar>=2.22.0,<3",
    "starlette>=1.0.1,<2",
    "slowapi>=0.1.9",
    "httpx>=0.26,<1",
    "ray[serve]>=2.9,<3",
    "pandas>=2.0.3,<3",
    "numpy>=2.4.6,<3",
    "prometheus-client>=0.19.0",
    "psutil>=5.9",
    "sentence-transformers>=5.5.1,<6.0.0",
    "chromadb>=1.5.8,<2.0.0",
    "faiss-cpu>=1.13.2,<2.0.0",
    "evidently>=0.7.21,<1",
    # Testing & quality
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-randomly>=3.15",
    "pytest-rerunfailures>=12.0",
    "pytest-split>=0.11.0",
    "hypothesis>=6.152.4,<7.0.0",
