    "jsonschema>=4.26.0",
    "yamllint>=1.35.1,<2.0.0",
    "detect-secrets>=1.5.0",
    "packaging>=24.0,<27.0",
    "tomli>=2.0; python_version < '3.11'",
    "nox>=2026.4.10",
    "nbstripout>=0.6",
    "responses>=0.26.1",
    "pyotp>=2.8.0",
    # Additional features
    "lm-eval>=0.4.2,<1",
    "nltk>=3.8",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.6.0",
    "scipy>=1.15,<2",
