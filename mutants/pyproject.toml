    "nvidia-ml-py3>=7.352.0",
    "tensorboard>=2.14",
    "mlflow>=2.22.4,<4",
    "wandb>=0.16",
    "playwright>=1.40",
    "requests>=2.34.2",
    "PyJWT>=2.13.0,<3.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "PyNaCl>=1.5.0,<2.0.0",
    "xxhash>=3.0.0",
    "importlib-metadata; python_version < '3.10'",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.15",
    "openai>=2.38.0; python_version >= '3.8'",
]

# BACKWARDS COMPATIBILITY ALIASES (for existing scripts)
# These are deprecated and will be removed in v1.0.0
all = ["codex-ml[full]"]
dev = ["codex-ml[full]"]
ml = ["codex-ml[runtime]"]
train = ["codex-ml[full]"]
test-core = ["codex-ml[core]"]

