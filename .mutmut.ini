[mutmut]
source_paths = src/

pytest_add_cli_args_test_selection = tests/

# Mutation operators
mutation_types = string,keyword,operator,number,literal,dict,set,list,index,decorator

# Performance settings
test_time_multiplier = 2.0
test_time_base = 5.0

# Exclusions
exclude_patterns = 
    */tests/*
    */test_*
    */mock*
    */conftest.py
    */__pycache__/*

# Output options
show_times = False
swallow_output = True
