status: "ACTIVE"

# ============================================================================
# GDPR (General Data Protection Regulation - EU)
# Compliance Level: FULL COMPLIANCE REQUIRED
# ============================================================================
gdpr:
  status: "IN_PROGRESS"
  requirement_count: 18
  implemented_count: 12
  critical_gaps: []
  
  controls:
    # A1: Data Inventory & Mapping
    a1_data_inventory:
      requirement: "Document all personal data processing (Data Processing Inventory)"
      description: |
        - Identify all data sources (user input, logs, telemetry, configs)
        - Map data flows across systems
        - Document retention periods
        - Identify third-party processors
      implementation_status: "COMPLETE"
      codebase_locations:
        - "docs/GDPR_COMPLIANCE.md": "Central GDPR policy documentation"
        - "src/logging/audit_logger.py": "User data handling in logs"
        - "src/config/data_retention.yaml": "Data retention policy configuration"
        - ".codex/PHASE_6_DATA_INVENTORY.json": "Comprehensive data flow mapping"
      control_evidence:
        - type: "policy_document"
          location: "docs/GDPR_COMPLIANCE.md"
          description: "Documented data processing activities"
        - type: "code_review"
          location: "src/logging/"
          description: "PII exclusion patterns verified"
      slo_metric: "100% of data flows documented"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"

    # A2: Consent Management
    a2_consent_tracking:
      requirement: "Implement consent tracking for all personal data processing"
      description: |
        - Maintain consent records (opt-in/opt-out)
        - Version control for privacy policies
        - Audit trail for consent changes
        - Respect withdraw consent requests
      implementation_status: "PARTIAL"
      codebase_locations:
        - "src/auth/consent_manager.py": "Consent tracking module"
        - "src/db/models/consent_log.py": "Consent audit table schema"
        - "src/api/endpoints/consent.py": "REST API for consent management"
      control_evidence:
        - type: "code_implementation"
          location: "src/auth/consent_manager.py"
          description: "Consent tracking API"
        - type: "database_schema"
          location: "src/db/models/consent_log.py"
          description: "Immutable consent audit log"
      slo_metric: "100% of user interactions logged with consent status"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"
      gaps:
        - "Consent UI not yet implemented (backend only)"
        - "Email opt-out mechanism needs implementation"

    # A3: Encryption & Data Security
    a3_encryption:
      requirement: "Encrypt personal data at rest and in transit"
      description: |
        - Encryption at rest: TLS 1.3+ for all PII storage
        - Encryption in transit: HTTPS/TLS 1.3 for all network traffic
        - Key management: Secure key storage, key rotation (90-day cycles)
        - Algorithm standards: AES-256, RSA-2048+
      implementation_status: "COMPLETE"
      codebase_locations:
        - "src/crypto/tls_config.py": "TLS 1.3+ configuration"
        - "src/crypto/aes_cipher.py": "AES-256 encryption utilities"
        - "src/secrets/key_manager.py": "Secure key storage and rotation"
        - "infrastructure/tls_certificates.tf": "TLS certificate management"
      control_evidence:
        - type: "configuration"
          location: "src/crypto/tls_config.py"
          description: "TLS 1.3 enforced in all endpoints"
        - type: "code_review"
          location: "src/crypto/"
          description: "AES-256 encryption verified"
      slo_metric: "100% of PII encrypted (at rest and in transit)"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"

    # A4: Data Processing Agreements (DPA)
    a4_dpa_management:
      requirement: "Execute Data Processing Agreements with all processors"
      description: |
        - Standard Contractual Clauses (SCCs) for third-party processors
        - DPA signature tracking
        - Sub-processor notification mechanism
        - Contract audit trail
      implementation_status: "PARTIAL"
      codebase_locations:
        - "legal/DPA_TEMPLATE.md": "Standard DPA template"
        - ".codex/PHASE_6_PROCESSOR_REGISTRY.json": "Registry of all data processors"
        - "docs/THIRD_PARTY_PROCESSORS.md": "List of approved processors"
      control_evidence:
        - type: "legal_document"
          location: "legal/DPA_TEMPLATE.md"
          description: "DPA template with SCC integration"
        - type: "registry"
          location: ".codex/PHASE_6_PROCESSOR_REGISTRY.json"
          description: "Processor registry with DPA status"
      slo_metric: "100% of processors have signed DPA"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"
      gaps:
        - "DPA signing workflow not yet automated"
        - "Sub-processor notification system pending"

    # A5: Right to Access
    a5_data_access_rights:
      requirement: "Enable users to access their personal data (GDPR Art. 15)"
      description: |
        - Implement data export API (/api/v1/user/export)
        - Format: Machine-readable (JSON/CSV)
        - Timeline: Within 30 days of request
        - Audit trail: Log all export requests
      implementation_status: "IN_PROGRESS"
      codebase_locations:
        - "src/api/endpoints/user_export.py": "Data export endpoint"
        - "src/services/data_exporter.py": "Export service logic"
        - "src/audit/export_audit.py": "Export request audit logging"
      control_evidence:
        - type: "api_endpoint"
          location: "src/api/endpoints/user_export.py"
          description: "User data export API"
      slo_metric: "100% of export requests within 30-day SLA"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"
      gaps:
        - "CSV export format needs implementation"

    # A6: Right to Erasure ("Right to be Forgotten")
    a6_data_deletion:
      requirement: "Enable users to request data deletion (GDPR Art. 17)"
      description: |
        - Implement deletion request mechanism
        - Purge PII from all systems (DB, logs, backups)
        - Maintain audit trail of deletions
        - Exception handling: Legal retention requirements
      implementation_status: "PLANNED"
      codebase_locations:
        - "src/api/endpoints/user_deletion.py": "Deletion request endpoint (PLANNED)"
        - "src/services/data_purger.py": "Purge service logic (PLANNED)"
      control_evidence: []
      slo_metric: "100% of deletion requests within 30-day SLA"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"
      gaps:
        - "Deletion service not yet implemented"
        - "Backup purge automation needed"

    # A7: Incident Response & Breach Notification
    a7_breach_notification:
      requirement: "Breach notification within 72 hours to supervisory authority"
      description: |
        - Incident detection & classification
        - Immediate notification to DPA/supervisory authority
        - User notification (if high risk)
        - Incident documentation & analysis
      implementation_status: "COMPLETE"
      codebase_locations:
        - "INCIDENT_RESPONSE.md": "Breach incident response procedures"
        - "src/incident/breach_notifier.py": "Automated breach notification system"
        - "src/audit/incident_logger.py": "Incident audit logging"
      control_evidence:
        - type: "policy_document"
          location: "INCIDENT_RESPONSE.md"
          description: "72-hour breach notification SLA documented"
        - type: "code_implementation"
          location: "src/incident/breach_notifier.py"
          description: "Automated breach notification system"
      slo_metric: "0 breaches unnotified beyond 72-hour SLA"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"

    # A8: Privacy by Design
    a8_privacy_by_design:
      requirement: "Implement privacy-by-design principles in all new systems"
      description: |
        - Data minimization: Collect only necessary data
        - Anonymization where possible
        - PII removal from logs
        - Default privacy settings (opt-in for tracking)
      implementation_status: "COMPLETE"
      codebase_locations:
        - ".pre-commit-config.yaml": "Automated PII detection in commits"
        - "src/logging/pii_filter.py": "PII redaction in logs"
        - "docs/PRIVACY_BY_DESIGN.md": "Privacy-by-design guidelines"
      control_evidence:
        - type: "pre_commit_hook"
          location: ".pre-commit-config.yaml"
          description: "PII detection on all commits"
        - type: "code_module"
          location: "src/logging/pii_filter.py"
          description: "Automatic PII redaction"
      slo_metric: "0 new code merged with PII collection violations"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"

    # A9: Data Protection Impact Assessment (DPIA)
    a9_dpia:
      requirement: "Conduct DPIA for high-risk processing activities"
      description: |
        - Impact assessment template
        - Risk scoring mechanism
        - Mitigations for high-risk flows
        - DPA sign-off on critical DPIAs
      implementation_status: "PARTIAL"
      codebase_locations:
        - "docs/DPIA_TEMPLATE.md": "DPIA assessment template"
        - ".codex/PHASE_6_DPIA_REGISTRY.json": "Registry of completed DPIAs"
      control_evidence:
        - type: "template_document"
          location: "docs/DPIA_TEMPLATE.md"
          description: "Standardized DPIA assessment template"
      slo_metric: "100% of new data processing activities have DPIA"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"
      gaps:
        - "DPIA automation workflow not implemented"

  summary: "GDPR compliance 67% complete (12/18 controls implemented). Critical gaps: Right to Erasure, automated DPIA workflow. On track for full compliance by Q4 2026."

# ============================================================================
# CCPA (California Consumer Privacy Act)
# Compliance Level: FULL COMPLIANCE REQUIRED (applies to CA residents)
# ============================================================================
ccpa:
  status: "IN_PROGRESS"
  requirement_count: 15
  implemented_count: 10
  critical_gaps: []
  
  controls:
    # C1: Consumer Rights Framework
    c1_consumer_rights:
      requirement: "Implement CCPA consumer rights (access, delete, opt-out, portability)"
      description: |
        - Right to Know (Art. 1798.100): Access to personal information
        - Right to Delete (Art. 1798.105): Request deletion
        - Right to Opt-Out (Art. 1798.120): Opt out of sale/sharing
        - Right to Correct (Art. 1798.140(ae)): Correct inaccurate data
      implementation_status: "IN_PROGRESS"
      codebase_locations:
        - "src/api/endpoints/ccpa_requests.py": "CCPA consumer request API"
        - "src/services/ccpa_handler.py": "CCPA request processing service"
        - "src/audit/ccpa_audit.py": "CCPA request audit logging"
      control_evidence:
        - type: "api_endpoint"
          location: "src/api/endpoints/ccpa_requests.py"
          description: "Consumer rights request API (access, delete, opt-out)"
      slo_metric: "100% of CCPA requests processed within 45-day SLA"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"
      gaps:
        - "Right to Correct endpoint not implemented"

    # C2: Data Inventory & Sale Tracking
    c2_sale_tracking:
      requirement: "Disclose all personal information sold or shared"
      description: |
        - Maintain inventory of data sales/sharing
        - Disclose sale practices in privacy policy
        - Honor opt-out requests (within 45 days)
        - Track buyer agreements
      implementation_status: "COMPLETE"
      codebase_locations:
        - "docs/CCPA_PRIVACY_POLICY.md": "CCPA-compliant privacy policy"
        - ".codex/PHASE_6_DATA_SALE_REGISTRY.json": "Registry of data sales/sharing"
        - "src/privacy/data_sale_tracker.py": "Data sale tracking system"
      control_evidence:
        - type: "policy_document"
          location: "docs/CCPA_PRIVACY_POLICY.md"
          description: "CCPA-compliant privacy policy with sales disclosure"
        - type: "registry"
          location: ".codex/PHASE_6_DATA_SALE_REGISTRY.json"
          description: "All data sales and sharing documented"
      slo_metric: "100% of data sales/sharing disclosed in privacy policy"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"

    # C3: Opt-Out of Sale Mechanism
    c3_opt_out_sale:
      requirement: "Provide easy mechanism to opt out of sale/sharing (CCPA Sec. 1798.120)"
      description: |
        - 'Do Not Sell My Personal Information' link (homepage prominent)
        - API endpoint: /api/v1/ccpa/opt-out-sale
        - Honor opt-out requests immediately
        - Maintain opt-out status across all systems
      implementation_status: "IN_PROGRESS"
      codebase_locations:
        - "src/api/endpoints/ccpa_opt_out.py": "Opt-out sale API endpoint"
        - "src/ui/privacy_center.js": "Privacy center with opt-out link"
        - "docs/PRIVACY_NOTICE.md": "CCPA privacy notice with opt-out link"
      control_evidence:
        - type: "api_endpoint"
          location: "src/api/endpoints/ccpa_opt_out.py"
          description: "Opt-out of sale API"
        - type: "ui_component"
          location: "src/ui/privacy_center.js"
          description: "Privacy center with opt-out mechanism"
      slo_metric: "Opt-out processed within 15 days"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"

    # C4: Shine the Light Law (Cal. Civ. Code § 1798.83)
    c4_shine_light:
      requirement: "Comply with CA Shine the Light law (third-party sharing disclosure)"
      description: |
        - Annual disclosure of third-party sharing
        - Email: privacy@codex.ai with sharing disclosure
        - Retention: At least 1 year
      implementation_status: "COMPLETE"
      codebase_locations:
        - "docs/SHINE_THE_LIGHT_DISCLOSURE.md": "Annual Shine the Light disclosure"
        - "src/privacy/shine_the_light.py": "Automated disclosure system"
      control_evidence:
        - type: "policy_document"
          location: "docs/SHINE_THE_LIGHT_DISCLOSURE.md"
          description: "Shine the Light compliance documented"
      slo_metric: "100% annual disclosure delivered"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"

    # C5: Non-Discrimination
    c5_non_discrimination:
      requirement: "No discrimination for CCPA rights exercise"
      description: |
        - Pricing: Same price/service quality regardless of data sharing opt-out
        - Loyalty programs: May provide incentive for data sharing
        - Service denial: May only be denied if data is fundamental to service
      implementation_status: "COMPLETE"
      codebase_locations:
        - "docs/CCPA_NON_DISCRIMINATION_POLICY.md": "Non-discrimination policy"
        - "src/pricing/pricing_engine.py": "Pricing logic (verified non-discriminatory)"
      control_evidence:
        - type: "policy_document"
          location: "docs/CCPA_NON_DISCRIMINATION_POLICY.md"
          description: "Non-discrimination policy documented"
        - type: "code_review"
          location: "src/pricing/pricing_engine.py"
          description: "Pricing logic verified to be non-discriminatory"
      slo_metric: "0 discriminatory pricing/access policies"
      last_verified: "2026-07-18"
      next_audit: "2026-10-18"

  summary: "CCPA compliance 67% complete (10/15 controls implemented). On track for full compliance by Q3 2026. All critical consumer rights mechanisms in place."

# ============================================================================
# SOC2 Type II (Service Organization Control)
# Compliance Level: TYPE II CERTIFICATION TARGET
# Audit Scope: 12-month observation period (Jan 2025 - Dec 2025)
# ============================================================================
soc2:
  status: "IN_PROGRESS"
  type: "Type II"
  observation_period: "2025-01-01 to 2025-12-31"
  audit_cadence: "Quarterly"
  requirement_count: 42
  implemented_count: 35
  critical_gaps: []
  
  criteria:
    # Trust Service Criteria (TSC) - CC (Common Criteria)
    cc_access_control:
      requirement: "CC6.1 - CC9.2: Access Controls and Authorization"
      description: |
        - CC6.1: Logical access authorization
        - CC6.2: Access restrictions per role
        - CC7.1-7.2: System monitoring and restriction
        - CC8.1: Authentication mechanisms
        - CC9.1-9.2: Risk assessment and change authorization
      implementation_status: "COMPLETE"
      audit_evidence:
        - type: "policy_document"
          location: ".codex/PHASE_6_ACCESS_CONTROL_POLICY.md"
          description: "Role-based access control (RBAC) policy"
        - type: "code_review"
          location: "src/auth/rbac.py"
          description: "RBAC implementation verified"
        - type: "audit_log"
          location: ".codex/logs/access_audit_2025.jsonl"
          description: "12 months of access audit logs"
      control_metrics:
        - "100% of users assigned to role(s)"
        - "0 unauthorized access attempts detected"
        - "All access changes logged and approved"
      slo: "0 access control violations"
      last_verified: "2026-07-18"
      observation_status: "COMPLETE"

    # Trust Service Criteria - A (Availability)
    a_availability:
      requirement: "A1.1 - A1.3: System Availability and Performance"
      description: |
        - A1.1: Infrastructure availability
        - A1.2: Service capacity and performance monitoring
        - A1.3: Incident response for availability issues
      implementation_status: "COMPLETE"
      audit_evidence:
        - type: "slo_metrics"
          location: ".codex/PHASE_6_COMPLIANCE_SLOS.yaml"
          description: "SLA/SLO targets: 99.99% uptime"
        - type: "monitoring_dashboard"
          location: "ops/dashboards/availability.json"
          description: "Real-time availability monitoring"
        - type: "incident_log"
          location: ".codex/logs/incident_2025.jsonl"
          description: "Incident response logs"
      control_metrics:
        - "Maintain ≥99.99% uptime SLA"
        - "MTTR ≤4 hours for P1 incidents"
      slo: "0 SLA breaches"
      last_verified: "2026-07-18"
      observation_status: "COMPLETE"

    # Trust Service Criteria - C (Confidentiality)
    c_confidentiality:
      requirement: "C1.1 - C1.2: Data Confidentiality"
      description: |
        - C1.1: Encryption of data in transit (HTTPS/TLS 1.3)
        - C1.2: Encryption of data at rest (AES-256)
        - C1.3: Secure handling of encryption keys
      implementation_status: "COMPLETE"
      audit_evidence:
        - type: "configuration"
          location: "src/crypto/tls_config.py"
          description: "TLS 1.3+ configuration verified"
        - type: "code_review"
          location: "src/crypto/aes_cipher.py"
          description: "AES-256 encryption verified"
        - type: "key_audit"
          location: ".codex/logs/key_rotation_2025.jsonl"
          description: "Key rotation audit logs (90-day cycle)"
      control_metrics:
        - "100% of data encrypted in transit (TLS 1.3+)"
        - "100% of data encrypted at rest (AES-256)"
        - "Keys rotated every 90 days"
      slo: "0 unencrypted data breaches"
      last_verified: "2026-07-18"
      observation_status: "COMPLETE"

    # Trust Service Criteria - I (Integrity)
    i_integrity:
      requirement: "I1.1 - I1.2: Data Integrity"
      description: |
        - I1.1: Prevention of unauthorized data modification
        - I1.2: Integrity monitoring and audit trails
        - I1.3: Recovery mechanisms for data loss
      implementation_status: "COMPLETE"
      audit_evidence:
        - type: "code_review"
          location: "src/integrity/hash_verification.py"
          description: "Data integrity verification implementation"
        - type: "audit_log"
          location: ".codex/logs/data_modification_2025.jsonl"
          description: "All data modifications logged"
        - type: "backup_verification"
          location: "ops/backup_verification_2025.json"
          description: "Backup integrity verification results"
      control_metrics:
        - "100% of critical data modifications logged"
        - "0 data integrity violations detected"
        - "Backup integrity verified weekly"
      slo: "0 data integrity breaches"
      last_verified: "2026-07-18"
      observation_status: "COMPLETE"

    # Trust Service Criteria - P (Processing Integrity)
    p_processing_integrity:
      requirement: "P1.1 - P1.5: System Processing Integrity"
      description: |
        - P1.1: Complete, accurate, and authorized transactions
        - P1.2: Monitoring of system completeness
        - P1.3: Error prevention and correction mechanisms
        - P1.4: Monitoring of system accuracy
        - P1.5: Enforcement of data origin authentication
      implementation_status: "COMPLETE"
      audit_evidence:
        - type: "transaction_audit"
          location: ".codex/logs/transaction_audit_2025.jsonl"
          description: "All transactions logged with processing status"
        - type: "reconciliation_report"
          location: ".codex/reports/transaction_reconciliation_2025.json"
          description: "Monthly transaction reconciliation results"
      control_metrics:
        - "100% of transactions recorded"
        - "0 unreconciled transactions"
        - "Processing error rate <0.01%"
      slo: "0 processing integrity violations"
      last_verified: "2026-07-18"
      observation_status: "COMPLETE"

