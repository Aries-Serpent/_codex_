---
# DEPLOYMENT NOTES

# 1. Deployment Steps:
#    - Copy this file to /etc/prometheus/prometheus.yml
#    - Create alert rules files in /etc/prometheus/rules/
#    - Start Prometheus: systemctl restart prometheus
#    - Verify: curl http://localhost:9090/api/v1/targets

# 2. Required Exporters (must be running):
#    - node-exporter (system metrics)
#    - kube-state-metrics (Kubernetes objects)
#    - postgres_exporter (PostgreSQL)
#    - redis_exporter (Redis)
#    - docker-exporter (if Docker-based)

# 3. Storage Configuration:
#    - Default: /var/lib/prometheus/ (15 days retention)
#    - Modify startup flags for different retention:
#      --storage.tsdb.retention.time=30d (30 days)
#      --storage.tsdb.retention.size=50GB

# 4. Verification:
#    - http://localhost:9090/status (Prometheus web UI)
#    - http://localhost:9090/api/v1/status/runtimeinfo (Runtime info)
#    - Check targets: http://localhost:9090/api/v1/targets

# 5. Performance Tuning:
#    - scrape_interval: 60s (default), adjust based on load
#    - max_samples_per_send: 500
#    - capacity: adjust based on available memory

# 6. High Availability (optional):
#    - Run 2+ Prometheus instances with identical configs
#    - Use Thanos or similar for deduplication
#    - Point AlertManager to both instances

# SUCCESS CRITERIA (Post-Deployment):
# ✓ Prometheus collecting metrics every 60 seconds
# ✓ All targets reporting UP status
# ✓ Metrics retention configured correctly
# ✓ Remote storage (if applicable) receiving data
# ✓ Alert rules loading without errors
