# Phase Validation Gates
# This file defines the specific validation criteria for each phase progression
# from 34.63% baseline to ≥95% target coverage.
#
# Reference: .codex/COVERAGE_VALIDATION_CRITERIA.md (Section 3.2)
# Last Updated: 2026-07-02T02:22:00Z

# ============================================================================
# BASELINE_PHASE - Current State (Day 0+)
# ============================================================================
baseline_phase:
  coverage_target: 34.63
  tolerance_pct: 1.5
  acceptable_range:
    min: 33.13
    max: 36.13
  test_count_min: 2467
  test_count_min_required: true
  
  # Tier-level minimums
  tier_1_min: 90.0  # Security - maintain
  tier_2_min: 85.0  # Auth - maintain
  tier_3_min: 77.0  # Infrastructure - minimum target
  tier_4_min: 62.0  # Extended - minimum target
  
  # Quality metrics - all must pass
  quality_metrics:
    test_pass_rate_min: 99.5
    test_flakiness_max: 1.0
    regression_rate_max: 1.0
    test_determinism_min: 99.5
  
  # Module-level stability
  module_loss_tolerance:
    tier_1: 0.5  # Security can't lose more than 0.5%
    tier_2: 1.0  # Auth can't lose more than 1.0%
    tier_3: 2.0  # Infrastructure can't lose more than 2.0%
    tier_4: 3.0  # Extended can't lose more than 3.0%
  
  # Validation duration
  stability_verification_days: 30
  approval_required: false
  escalation_on_breach: unified-coverage-agent
  
  success_criteria:
    - Coverage maintains 34.63% ±1.5% for 30 days
    - All 2,467+ tests pass consistently
    - Zero regressions detected
    - Module tiers maintain minimums
    - All quality metrics pass

# ============================================================================
# PHASE_1 - 40% Coverage (Days 3-15)
# ============================================================================
phase_1_40_percent:
  coverage_target: 40.0
  tolerance_pct: 0.5
  acceptable_range:
    min: 39.5
    max: 40.5
  test_count_min: 2800
  test_count_min_required: true
  delta_from_baseline: 5.37
  
  # Tier-level targets
  tier_1_min: 92.0  # Maintain
  tier_2_min: 85.0  # Maintain
  tier_3_min: 77.0  # New minimum (from infrastructure raise)
  tier_4_min: 70.0  # Raise from 62% to 70% (+8%)
  
  # Quality gates - stricter than baseline
  quality_metrics:
    test_pass_rate_min: 99.5
    test_flakiness_max: 0.5
    regression_rate_max: 0.5
    test_determinism_min: 100.0
  
  # Module-level stability (stricter)
  module_loss_tolerance:
    tier_1: 0.3
    tier_2: 0.5
    tier_3: 1.0
    tier_4: 2.0
  
  module_gain_expectation:
    tier_1: 0.0  # Maintain
    tier_2: 0.0  # Maintain
    tier_3: 1.0  # Small gain
    tier_4: 9.0  # Large gain
  
  # Priority modules for Phase 1
  priority_modules:
    - group: zero_coverage_tier_a_critical
      count: 8
      target_gain: "3.5%"
      test_target: 600
    - group: zero_coverage_tier_b_high_usage
      count: 24
      target_gain: "1.5%"
      test_target: 550
    - group: tier_3_cli_modules
      count: 2
      target_gain: "0.37%"
      test_target: 100
  
  # Approval requirements
  approval_required: true
  approval_body: unified-coverage-agent + human reviewer
  escalation_on_breach: unified-coverage-agent
  escalation_timeout_hours: 4
  
  success_criteria:
    - Coverage reaches 40.0% ±0.5%
    - Zero regressions in existing modules
    - Tier 4 modules gain +8% on average
    - All 2,800+ tests pass with ≤0.5% flakiness
    - Quality metrics all pass

