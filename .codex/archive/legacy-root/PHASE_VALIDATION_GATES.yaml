# ============================================================================
# Validation Gates - Global Rules
# ============================================================================
validation_gates:
  baseline_comparison:
    enabled: true
    check_variance: true
    check_regression: true
    check_module_tiers: true
  
  test_quality:
    enabled: true
    check_pass_rate: true
    check_flakiness: true
    check_determinism: true
    check_isolation: true
  
  module_stability:
    enabled: true
    track_per_module: true
    flag_regression: true
    flag_gains: true
  
  escalation:
    enabled: true
    levels:
      - variance: "-1.5 to 0%"
        action: "Log and continue monitoring"
      - variance: "-3.0 to -1.5%"
        action: "Escalate to unified-coverage-agent"
      - variance: "< -3.0%"
        action: "Block merge + escalate to @mbaetiong"
    
    timeout_hours: 4
    max_retries: 2
    auto_escalate_on_timeout: true
