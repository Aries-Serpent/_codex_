# ============================================================================
# SECTION 4: Escalation Procedures
# ============================================================================

escalation:
  new_critical_alert: |
    If a NEW critical alert is detected:
    1. Block PR immediately (gate workflow)
    2. Create GitHub issue with [SECURITY] label
    3. Assign to @security-team
    4. Provide 1-hour SLA for triage
  
  new_high_alert: |
    If a NEW high alert is detected:
    1. Block PR immediately (gate workflow)
    2. Create GitHub issue with [SECURITY] label
    3. Assign to @security-team
    4. Provide 4-hour SLA for remediation plan
  
  suppression_bypass: |
    If suppression bypass is detected (code changes invalidate suppression):
    1. Automatically create issue
    2. Block merge (gate workflow)
    3. Require security team approval
    4. Update suppression justification

