# @package _global_
experiment:
  name: lambda
  type: serverless
  description: "Configuration for Lambda/serverless deployment"

  # Serverless-specific settings
  seed: 42
  deterministic: true

  # Resource constraints for serverless
  max_iterations: 50
  batch_size: 1
  num_workers: 0

  # Minimal resource usage
  enable_logging: true
  save_checkpoints: false
  eval_frequency: 0

# Model config - use only ModelCfg fields
model:
  name: lambda_model
  dtype: float32
  lora_enable: false

# Training config
training:
  max_epochs: 1
  batch_size: 1
  seed: 42
  deterministic: true

# Optimizer config for learning rate
optim:
  learning_rate: 0.001
  weight_decay: 0.0

# Data config - use only DataCfg fields
data:
  format: jsonl
  train_path: data/train.jsonl
  val_fraction: 0.0
