# Copilot Space Workflow Spec (v1.5.0)
# Codex-Specific Enhancements:
# - Extended domain patterns for ML serving, security, status, archival
# - P5 features: token similarity, coverage stats, security severity
# - Auto-prefix validation in manifest stage
# - Enhanced safeguard keywords and documentation synonyms
# - Dynamic detector loading for new capabilities
# - Enforce low maturity and missing-detector gates during `validate`.
# - Score regression guard remains; thresholds unchanged.
# - v1.5.0: Trend database for historical analysis
# - v1.5.x: Visualization dashboards and webhook notifications

version: 1.5.0
metrics_schema_version: "2.0.0"

stages:
  - id: index
    script: ./scripts/space_traversal/audit_runner.py
    entry: stage
    args: ["S1"]
  - id: facets
    script: ./scripts/space_traversal/audit_runner.py
    entry: stage
    args: ["S2"]
  - id: capabilities
    script: ./scripts/space_traversal/audit_runner.py
    entry: stage
    args: ["S3"]
  - id: scoring
    script: ./scripts/space_traversal/audit_runner.py
    entry: stage
    args: ["S4"]
  - id: gaps
    script: ./scripts/space_traversal/audit_runner.py
    entry: stage
    args: ["S5"]
  - id: render
    script: ./scripts/space_traversal/audit_runner.py
    entry: stage
    args: ["S6"]
  - id: manifest
    script: ./scripts/space_traversal/audit_runner.py
    entry: stage
    args: ["S7"]

weights:
  # Weight factors for each capability category in overall score calculation.
  # All weights must sum to 1.0 (100%).
  functionality: 0.25  # Core feature implementation completeness
  consistency: 0.20    # Code style and API consistency
  tests: 0.25          # Test coverage and quality
  safeguards: 0.15     # Security and validation checks
  documentation: 0.15  # Code and API documentation

scoring:
  thresholds:
    # Maturity level thresholds for capability scores (0.0 to 1.0 scale)
    # low: Minimum acceptable score - below this requires immediate attention
    # medium: Target score for production-ready capabilities
    low: 0.70     # 70% - Minimum acceptable maturity level
    medium: 0.85  # 85% - Target for production-ready code

  # Optional component caps. Any missing key defaults to 1.0.
  # Caps limit the maximum contribution of each category to prevent over-weighting.
  component_caps:
    functionality: 1.0
    consistency: 1.0
    tests: 1.0
    safeguards: 1.0
    documentation: 1.0

  # Optional duplication heuristic switch (experimental).
  # - simple: current file-stem duplication ratio (default)
  # - token_similarity: use scripts/space_traversal/dup_similarity.py if present, else fallback
  dup:
    heuristic: token_similarity  # Enabled per Phase 2 of Audit Improvement Plan
    # threshold: Similarity threshold above which code is considered duplicated
    threshold: 0.7  # 70% - Files with >70% token similarity flagged as duplicates
    # max_pairwise: Maximum number of file pairs to compare (performance limit)
    max_pairwise: 1000

  # Coverage integration (Phase 2 of Audit Improvement Plan)
  coverage:
    enabled: true
    xml_patterns:
      - coverage.xml
      - htmlcov/coverage.xml
      - .coverage
    weight: 0.2  # Coverage contributes to test score

capability_map:
  overrides:
    # Training capabilities - merge related detectors
    training-engine: ["train-loop", "functional-training"]
    # ML Serving - ml-serving and inference-serving detectors produce the same evidence
    ml-serving: ["inference-serving"]
    # MCP capabilities - no overrides needed as detectors produce unique IDs
  dynamic: true

output:
  reports_dir: reports
  artifacts_dir: audit_artifacts
  matrix_template: templates/audit/capability_matrix.md.j2

options:
  # diff: non-zero exit if any capability score drops beyond threshold
  fail_on_score_regression: true
  regression_delta_threshold: 0.02
  # validate: non-zero exit if any capability is below low threshold
  fail_on_low_maturity: true
  # validate: non-zero exit if any capability_map.overrides ID is missing from scored capabilities
  fail_on_missing_detector: false

# Optional safeguards override (P3). If present, the runner will use this list instead of its defaults.
# Sorted alphabetically for determinism per v1.4.0 spec.
# Expanded per Phase 2 of Audit Improvement Plan
safeguards:
  keywords:
    - audit_log
    - authenticate
    - authentication
    - authorization
    - baseline
    - bounds_check
    - checksum
    - circuit_breaker
    - deterministic
    - manifest
    - offline
    - rate_limit
    - reproduce
    - rng
    - rollback
    - sanitize
    - seed
    - secret
    - sha256
    - timeout
    - validate
    - validation
    - WANDB_MODE

inference:
  model_path: "models/deterministic_dummy"
  seed: 42
  deterministic: true
  max_input_length: 512
  preprocessor_override: null

# v1.5.0 Trend Configuration
trends:
  enabled: true
  database_path: "audit_artifacts/trends.db"
  auto_store: true  # Store snapshot after each audit run

  retention:
    max_runs: 1000
    max_age_days: 365

  regression_detection:
    enabled: true
    threshold: 0.02
    lookback_runs: 5
    fail_on_high_severity: true

# v1.5.4 Webhook Configuration (optional)
webhooks:
  enabled: false
  endpoints: []
  # Example:
  # - url: "https://hooks.slack.com/services/..."
  #   type: slack
  #   events: ["audit_complete", "regression_detected"]
  # - url: "https://example.com/webhook"
  #   type: generic
  #   secret: "${WEBHOOK_SECRET}"
  #   events: ["audit_complete"]

