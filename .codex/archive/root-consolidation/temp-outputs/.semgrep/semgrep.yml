# Semgrep configuration for Aries-Serpent/_codex_
# Manages rule exclusions, suppressions, and baseline mode
#
# Baseline Mode: Enabled after remediation completion
# Only new alerts will fail CI; historical alerts are tracked.

rules: []

# Rule exclusions - disable broken or redundant built-in Semgrep rules
# The semgrep.url-substring-check rule from Semgrep's registry has a parse error
# in its pattern definition. Since we use custom suppression rules instead, we
# explicitly disable it to prevent parse errors.
rule-excludes:
  - semgrep.url-substring-check

# Baseline configuration - M-01 remediation checkpoint
# This baseline captures the state after URL substring remediation (M-01 merge)
baseline:
  created_at: "2026-02-21T00:00:00Z"
  mode: comment  # Options: comment, block, ignore
  alert_count_at_baseline: 5614  # Updated to current alert count including suppressions (5,614 = 5,577 suppressions + 37 config checks)

# Path exclusions for all rules
paths:
  exclude:
    # Test files with intentional patterns
    - "tests/**"
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/*_tests.py"
    - ".github/agents/*/tests/**"
    - ".github/copilot-*/tests/**"
    - ".github/workflows/*.tests.yml"

    # Example and documentation code
    - "examples/**"
    - "docs/code-samples/**"
    - "**/README*.md"
    - "docs/**/*.py"  # Python examples in docs

    # Generated and vendored code
    - "**/generated/**"
    - "**/vendor/**"
    - "**/.venv/**"
    - "**/node_modules/**"
    - "**/venv/**"

    # Build artifacts
    - "build/**"
    - "dist/**"
    - "*.egg-info/**"
    - ".eggs/**"

    # Archive and deprecated code
    - "archive/**"
    - "**/deprecated/**"
    - ".github/workflow-archive/**"
    - ".github/workflows.backup*/**"

    # Temporary and cache files
    - ".hypothesis/**"
    - "__pycache__/**"
    - ".pytest_cache/**"
    - ".mypy_cache/**"
    - ".tox/**"
    - ".venv_test/**"

    # Utility/script code with known URL patterns
    - "scripts/**"
    - "fix_*.py"
    - "src/codex/cli/**"
    - "src/codex/logging/**"
    - "automation/**"
    - ".scripts/**"

    # Workbench and analysis
    - "workbench/**"
    - "analysis/**"
    - "notebooks/**"

    # CI artifacts
    - "reports/**"
    - ".codex/reports/**"
    - "security-suite-artifacts/**"
    - "coverage_reports/**"

    # Config and data files (not python code in executable context)
    - "configs/**"
    - "config_legacy/**"
    - "config/**"
    - "data/**"
    - "datasets/**"
    - "samples/**"

# Note: Severity mapping for priority scoring moved to scripts/security/score_alerts.py
# The severity_weights configuration is not a valid semgrep config key
