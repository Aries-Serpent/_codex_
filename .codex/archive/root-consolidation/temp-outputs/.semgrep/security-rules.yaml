rules:
  # Command Injection Prevention
  - id: subprocess-shell-injection
    pattern: subprocess.run(..., shell=True, ...)
    message: "Avoid shell=True in subprocess calls to prevent command injection. Use shlex.split() and shell=False instead."
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
      references:
        - https://owasp.org/www-community/attacks/Command_Injection

  - id: subprocess-call-shell-injection
    pattern: subprocess.call(..., shell=True, ...)
    message: "Avoid shell=True in subprocess.call() to prevent command injection"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"

  - id: subprocess-popen-shell-injection
    pattern: subprocess.Popen(..., shell=True, ...)
    message: "Avoid shell=True in subprocess.Popen() to prevent command injection"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"

  # XML Security
  - id: unsafe-xml-parsing
    patterns:
      - pattern-either:
          - pattern: import xml.etree.ElementTree
          - pattern: import xml.etree.ElementTree as $VAR
          - pattern: from xml.etree import ElementTree
          - pattern: from xml.etree.ElementTree import $FUNC
      - pattern-not-inside: |
          try:
              from defusedxml import ElementTree
          except ImportError:
              ...
      - pattern-not: from defusedxml import ElementTree
    message: "Use defusedxml instead of xml.etree.ElementTree to prevent XXE attacks"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-611: Improper Restriction of XML External Entity Reference"
      owasp: "A04:2021 - Insecure Design"

  # Cryptographic Hash Security
  - id: weak-hash-without-flag
    patterns:
      - pattern: hashlib.md5(...)
      - pattern-not: hashlib.md5(..., usedforsecurity=False)
      - pattern-not-inside: |
          # nosec B324
          ...
    message: "MD5 for security purposes is weak. Use SHA-256 or add usedforsecurity=False if not used for security"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"

  - id: sha1-without-flag
    patterns:
      - pattern: hashlib.sha1(...)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False)
      - pattern-not-inside: |
          # nosec
          ...
    message: "SHA1 for security purposes is weak. Use SHA-256 or add usedforsecurity=False"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-327"

  # Pickle Security
  - id: unsafe-pickle-load
    pattern: pickle.load(...)
    message: "pickle.load() can execute arbitrary code. Use safe_pickle_load() from utils.safe_pickle instead"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"

  - id: unsafe-pickle-loads
    pattern: pickle.loads(...)
    message: "pickle.loads() can execute arbitrary code. Use safe_pickle_load() or RestrictedUnpickler"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-502"

  # File Permissions
  - id: insecure-file-permissions
    patterns:
      - pattern: os.chmod($PATH, 0o644)
      - pattern-inside: |
          def $FUNC(...):
            ...
    message: "File permissions 0o644 allow world-readable access. Use 0o600 for sensitive files"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-732: Incorrect Permission Assignment for Critical Resource"

  - id: insecure-file-permissions-world-writable
    pattern: os.chmod($PATH, 0o666)
    message: "File permissions 0o666 allow world-writable access. This is a serious security risk"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-732"

  # URL Security
  # NOTE: M-01 Remediation - Disabled due to high false positive rate
  # The rule triggers on legitimate non-user-input substring checks (code analysis,
  # error handling, config checking, etc). Suppression rules handle safe patterns.
  # Actual user input validation should use urllib.parse.urlparse() or regex patterns.
  # NOTE: url-substring-check rule disabled in M-01 remediation
  # Reason: Had 99%+ false positive rate on legitimate URL validation code
  # Alternative: Use urllib.parse.urlparse() for user URL validation with explicit
  #             scheme/netloc checks, or use regex with word boundaries
  # See: .semgrep/rules/suppress-utility-scripts.yaml for suppression patterns



  - id: urllib-urlopen-dynamic
    patterns:
      - pattern: urllib.request.urlopen($URL, ...)
      - pattern-not: urllib.request.urlopen("https://...", ...)
    message: "Dynamic URL in urllib.urlopen() may allow file:// scheme abuse. Validate URL scheme"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"

  # CORS Security
  - id: wildcard-cors
    patterns:
      - pattern: allow_origins=["*"]
    message: "Wildcard CORS allows any origin. Use specific allowed origins instead"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-942: Overly Permissive Cross-domain Whitelist"
      owasp: "A01:2021 - Broken Access Control"

  - id: cors-with-credentials-wildcard
    patterns:
      - pattern: |
          CORSMiddleware(
            ...,
            allow_origins=["*"],
            ...,
            allow_credentials=True,
            ...
          )
    message: "CRITICAL: CORS with wildcard origins and credentials enabled is a major security vulnerability"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-942"

  # Environment Variable Injection
  - id: env-in-subprocess
    patterns:
      - pattern: subprocess.run(..., env=os.environ, ...)
    message: "Passing os.environ directly to subprocess can lead to environment variable injection. Filter to only needed variables"
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-88: Argument Injection or Modification"

  # SQL Injection (if applicable)
  - id: sql-string-format
    patterns:
      - pattern: $CURSOR.execute(f"... {$VAR} ...")
      - pattern-not-inside: |
          # Safe query
          ...
    message: "SQL query with f-string may be vulnerable to SQL injection. Use parameterized queries"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"

  # Path Traversal
  - id: path-traversal-user-input
    patterns:
      - pattern-either:
          - pattern: open(request.args.get(...), ...)
          - pattern: open(request.form.get(...), ...)
          - pattern: open(request.GET[...], ...)
          - pattern: open(request.POST[...], ...)
          - pattern: open(request.FILES[...], ...)
          - pattern: open(os.environ[...], ...)
          - pattern: open(sys.argv[...], ...)
          - pattern: |
              $PATH = request.$METHOD(...)
              ...
              open($PATH, ...)
          - pattern: |
              $PATH = os.environ[...]
              ...
              open($PATH, ...)
          # Multi-step taint flow patterns
          - pattern: |
              $TMP = request.$METHOD(...)
              ...
              $PATH = $TMP
              ...
              open($PATH, ...)
          - pattern: |
              $TMP = request.$METHOD(...)
              ...
              $PATH = os.path.join(..., $TMP, ...)
              ...
              open($PATH, ...)
          - pattern: |
              $TMP = request.$METHOD(...)
              ...
              $PATH = $TMP + ...
              ...
              open($PATH, ...)
      - pattern-not: open(os.path.abspath(...), ...)
      - pattern-not: open(Path(...).resolve(), ...)
    message: "Path traversal vulnerability: user input used in file path. Validate and normalize with os.path.abspath() or Path.resolve()"
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-22: Path Traversal"
