# PHASE 7B TRACK C: MUTATION HARDENING CONFIGURATION
# Comprehensive mutation testing with Track B's 169 new edge case tests
# Target: Increase mutation score from 82% → 90%+

[mutmut]
# Source code to mutate
source_paths = src/

# Test suite including Track B edge case tests
tests_dir = tests/

# Test patterns to include
test_patterns =
    test_*.py
    *_test.py
    test_phase7b_edge_cases_*.py

# Mutation operators to apply
mutation_types =
    string
    keyword
    operator
    number
    literal
    dict
    set
    list
    index
    decorator
    attribute
    assignment
    slice
    same_node

# Timeout configuration (mutants can cause hangs)
test_time_multiplier = 2.5
test_time_base = 15.0

# Exclude patterns (non-testable code, fixtures, etc)
exclude_patterns =
    __pycache__
    *.pyc
    */__pycache__
    */tests/*
    */test_*
    */mock*
    */stub*
    */fixtures/*
    *conftest.py
    *__init__.py
    */codex_client/*
    */prompts/*
    */templates/*

# Cache and performance settings
cache_only = False
show_times = False
swallow_output = True
rerun_all = False
use_coverage = False

# Parallel execution (use multiple workers for faster testing)
workers = 4

# Output format
output_format = text,html

# Coverage settings (optional - helps focus mutations)
use_coverage = True
coverage_data = .coverage

# Specific modules to prioritize for mutation testing
# These are the weak modules identified in Track B
priority_modules =
    src/codex_ml/
    src/codex/
    src/security/
    src/auth/
    src/api/
    src/agents/
    src/cli.py
    src/bridge_types.py
    src/tokenization/
    src/archive/

# Heuristics for faster mutation testing
only_return_one_of_multiple_mutations = False
