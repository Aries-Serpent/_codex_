# Phase 12 WS3 Tier 2 Lane 3 - Comprehensive Mutation Testing Configuration
# Focus: Critical security paths (auth, RAG, validation)

[mutmut]
# Paths to mutate - security and validation modules (not test files)
source_paths = src/codex/auth,src/codex/rag,src/codex/authz

# Test command - only security tests (avoid torch dependencies)
pytest_add_cli_args_test_selection = tests/rag/test_security_enhanced.py tests/test_security_auth.py tests/test_security_input_validation.py

# Timeout configuration
test_time_base = 10.0
test_time_multiplier = 3.0

# Paths to exclude from mutation
exclude_patterns = 
    */__pycache__/*
    *.pyc
    */.pytest_cache/*
    */prompts/*
    */codex_client/*
    */_test.py

# Mutation types to apply
only_mutate = 
    src/codex/auth/*.py
    src/codex/rag/*.py
    src/codex/authz/*.py

# Advanced options
use_coverage = True
rerun_all = False
show_times = True
swallow_output = False

# Specific mutations to avoid
do_not_mutate = 
    """
    import
    from
    """
