[mutmut]
# Batch B: Test effectiveness improvements
paths_to_mutate = tests
tests_dir = tests
test_time_multiplier = 3
timeout = 120
max_workers = 4

# Prioritize critical test modules
# Focus on mutation killers: edge cases, assertions, condition coverage
# Target modules with highest mutation potential

# Mutation operators to test
operators = 
    comparison
    logical
    arithmetic
    conditional
    return_value
    boolean_constant
    assignment

# Exclude trivial mutations
exclude_lines = 
    pragma: no mutate
    @.*
    def __.*__
    if __name__
    raise NotImplementedError

# Quick execution mode for initial scan
# Full run will be slower
