    resolution: "S177: rm stale venv + --clear + pip upgrade in all 3 resilient pip blocks; cascade brake 10→5; cache-version v2→v3"

cognitive_notes: |
  The 'self-healing' count in CI health alerts measures the cascade rate.
  With the S172 venv-recreation fix, this should drop from ~126/week toward ~0.
  After S172 fix lands: expect failure rate to drop from 13.3% → ~0.5% (7 non-cascade failures / 1000).
  The 'unknown' count dropped from 52 (S3534) to 2 (S172) — pattern library coverage is working.
  Key threshold insight: CODEX_CI_FAILURE_THRESHOLD=10.0 means the 'healthy' cascade rate of
  ~120/week will still trigger alerts if the underlying run count is low. Monitor after S172 fix.
  S177 update (issue #3977): cascade persisted at 54.3% (189/348). Root cause: corrupted partial-cache
  venvs survived the S172 fallback because `python3 -m venv` without `--clear` does not remove stale
