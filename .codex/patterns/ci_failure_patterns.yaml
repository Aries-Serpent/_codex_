## PATTERN DEFINITIONS

### Category 1: Build & Configuration

```yaml
---
pattern_id: BUILD_001
name: "pyproject.toml License Format Incompatibility"
category: build_configuration
priority: 1
severity: critical

description: |
  PEP 621 table format for license field breaks setuptools build.
  Error: "configuration error: `project.license` must be string"

detection:
  error_signatures:
    - "configuration error.*license.*must be string"
    - "subprocess-exited-with-error.*pyproject.toml"
    - "invalid pyproject.toml config.*license"
  file_patterns:
    - "pyproject.toml"
  log_locations:
    - "pip install.*Getting requirements to build editable"

root_cause:
  technical: "Setuptools doesn't fully support PEP 621 table syntax"
  specific: "license = {text = 'MIT'} format incompatible"
  underlying: "Implementation lag behind specification"

impact:
  blocks: "All package installation"
  affects: "All CI workflows requiring pip install"
  cascade: "Prevents testing, coverage, quality analysis"
  estimated_failures: "14+ workflows"

fix_steps:
  1:
    action: "Convert license to string format"
    file: "pyproject.toml"
    change: |
      # Before
      license = {text = "MIT"}

      # After
      license = "MIT"

  2:
    action: "Move license-files to setuptools section"
    file: "pyproject.toml"
    change: |
      # Before (in [project] section)
      license-files = {paths = ["LICENSE", "LICENSES/*"]}

      # After (in [tool.setuptools] section)
      [tool.setuptools]
      license-files = ["LICENSE", "LICENSES/*"]

  3:
    action: "Update tests to handle both formats"
    file: "tests/test_packaging_metadata.py"
    change: |
      # Add fallback logic
      if isinstance(license_val, dict):
          assert license_val.get("text") == "MIT"
      else:
          assert license_val == "MIT"

validation:
  command: "pip install --no-deps -e ."
  expected: "Successfully installed"
  time: "< 30 seconds"

prevention:
  pre_commit_hook: "Test build before commit"
  ci_check: "Packaging Validation Agent"
  documentation: "Build compatibility guidelines"

metadata:
  discovered: "2026-02-18"
  session: "PR #3248 Session 2"
  confidence: 100
  reuse_count: 0
  effectiveness: "Not yet measured"

examples:
  - pr: 3248
    commit: "5b89cf9"
    files_changed: 2
    time_to_fix: "15 minutes"
    validation: "Local + CI"

related_patterns:
  - "BUILD_002"  # Setuptools version compatibility
  - "PKG_001"    # PEP 621 vs implementation

cognitive_notes: |
  CRITICAL LEARNING: PEP spec compliance != implementation support
  Always test actual builds, not just spec validation
  Setuptools compatibility more important than PEP 621 purity

---
pattern_id: BUILD_002
name: "Package Installation Dependency Failure"
category: build_configuration
priority: 1
severity: high

description: |
  Dependencies fail to install, blocking package build.
  Common in CI environments with version conflicts.

detection:
  error_signatures:
    - "ERROR: Failed to build.*when getting requirements"
    - "Could not find a version that satisfies"
    - "No matching distribution found"
  file_patterns:
    - "pyproject.toml"
    - "requirements*.txt"

root_cause:
  technical: "Dependency version conflicts or unavailability"
  specific: "Version pinning too strict or package not found"

fix_steps:
  1:
    action: "Check dependency availability"
    command: "pip index versions <package>"

  2:
    action: "Relax version constraints if needed"
    file: "pyproject.toml"
    example: "package>=1.0,<3.0  # Instead of package==1.2.3"

  3:
    action: "Update lock files"
    command: "pip-compile pyproject.toml"

validation:
  command: "pip install -e ."
  expected: "Successfully installed"

metadata:
  discovered: "Historical pattern"
  confidence: 95
  reuse_count: 0

---
```

### Category 2: DateTime & Timezone

```yaml
---
pattern_id: DATETIME_001
name: "Offset-Naive and Offset-Aware DateTime Mixing"
category: datetime_timezone
priority: 2
severity: high

description: |
  Mixing timezone-naive and timezone-aware datetime objects.
  TypeError: can't subtract offset-naive and offset-aware datetimes

detection:
  error_signatures:
    - "can't subtract offset-naive and offset-aware"
    - "TypeError.*datetime.*timezone"
  file_patterns:
    - "*.py"
  common_locations:
    - "monitoring.py"
    - "timestamp calculations"
    - "age/duration computations"

root_cause:
  technical: "datetime.now() returns naive, stored timestamps are aware"
  specific: "Missing timezone.utc in datetime.now()"
  underlying: "Inconsistent timezone handling"

impact:
  blocks: "Timestamp comparison operations"
  affects: "Monitoring, SLA tracking, freshness checks"
  cascade: "Multiple test failures with same root cause"
  batch_fix_potential: true  # One fix resolves multiple tests

fix_steps:
  1:
    action: "Add timezone import"
    file: "Source file with datetime operations"
    change: |
      from datetime import datetime, timezone

  2:
    action: "Update all datetime.now() calls"
    pattern: "datetime.now()"
    replacement: "datetime.now(timezone.utc)"
    locations: "All timestamp generation points"

  3:
    action: "Verify consistency"
    check: "All timestamps use UTC timezone"

validation:
  test_pattern: "test_*monitoring*"
  expected: "All datetime comparison tests pass"

batch_fix:
  enabled: true
  description: "Single fix pattern applies to multiple tests"
  example: "6 tests fixed with same datetime.now(timezone.utc) change"

metadata:
  discovered: "2026-02-18"
  session: "PR #3248 Session 1"
  confidence: 100
  reuse_count: 6  # Fixed 6 tests with one pattern
  effectiveness: "600%"  # 1 fix → 6 tests

examples:
  - file: "src/codex_ml/features/monitoring.py"
    lines: [165, 214, 232, 268, 295, 312, 340]
    tests_fixed: 6

cognitive_notes: |
  HIGH-VALUE PATTERN: Batch fix opportunity
  Look for multiple failures with same error signature
  One fix can resolve 5-10 tests if root cause is shared
  Categorization enables 6x efficiency gain

---
```

### Category 3: Mock & Fixture

```yaml
---
pattern_id: MOCK_001
name: "Mock Namespace Mismatch After Refactoring"
category: mock_fixture
priority: 3
severity: medium

description: |
  @patch decorator paths don't match actual import paths.
  Common after code reorganization/refactoring.

detection:
  error_signatures:
    - "AttributeError.*Mock.*not found"
    - "patch.*invalid target"
    - "Mock object has no attribute"
  test_patterns:
    - "@patch\\('old\\.namespace"

root_cause:
  technical: "Import paths changed but test mocks not updated"
  specific: "Old namespace in @patch doesn't exist"
  underlying: "Refactoring without test update"

impact:
  blocks: "Tests using outdated mocks"
  affects: "Unit tests with mocking"
  cascade: "Multiple tests if refactoring was broad"

fix_steps:
  1:
    action: "Find actual import path"
    command: "grep -r 'from .* import TargetClass' tests/"

  2:
    action: "Update @patch decorator"
    pattern: "@patch('old.namespace.TargetClass')"
    replacement: "@patch('actual.namespace.TargetClass')"
    note: "Must match EXACT import path in test"

  3:
    action: "Verify all patches in file"
    check: "grep '@patch' affected_test.py"

validation:
  command: "pytest affected_test.py -v"
  expected: "All mocked tests pass"

batch_fix:
  enabled: true
  description: "Multiple @patch decorators need same namespace update"
  example: "12 patches updated in Session 1"

metadata:
  discovered: "2026-02-18"
  session: "PR #3248 Session 1"
  confidence: 100
  reuse_count: 12
  effectiveness: "1200%"

examples:
  - file: "tests/agents/test_autonomous_runner.py"
    patches_updated: 12
    old: "agent.autonomous_runner"
    new: "src.agents.autonomous_runner"

cognitive_notes: |
  REFACTORING PATTERN: Check after code reorganization
  Use grep to find actual import paths
  Batch fix all @patch decorators in affected tests
  Prevention: Update tests during refactoring

---
pattern_id: MOCK_002
name: "Function-Scoped Import Mock Patching"
category: mock_fixture
priority: 3
severity: medium

description: |
  Mocking imports that occur inside functions requires
  patching the source module, not the importing module.

detection:
  error_signatures:
    - "TypeError: Need a valid target to patch"
    - "You supplied: 'module_name'"
  test_patterns:
    - "@patch\\('module'\\)"  # Module without attribute

root_cause:
  technical: "Function-scoped imports don't create module-level attributes"
  specific: "@patch requires 'module.attribute' format"
  underlying: "Lazy imports inside functions"

fix_steps:
  1:
    action: "Use sys.modules dict patching"
    old: "@patch('mlflow')"
    new: "@patch.dict('sys.modules', {'mlflow': Mock()})"

  2:
    action: "Access mocked module in test"
    code: "mocked_mlflow = sys.modules['mlflow']"

validation:
  test: "pytest test_file.py::test_function -v"
  expected: "No TypeError about patch target"

metadata:
  discovered: "2026-02-18"
  session: "PR #3248 Phase 3"
  confidence: 100
  reuse_count: 8

cognitive_notes: |
  INVALID PATTERN LEARNED: @patch("module") without attribute fails
  CORRECT PATTERN: Use @patch.dict("sys.modules", {"module": Mock()})
  Source: Agent made this mistake, corrected by main orchestrator

---
```

### Category 4: Optional Dependencies

```yaml
---
pattern_id: OPTDEP_001
name: "Wrapper Module Import Success Without Actual Dependency"
category: optional_dependencies
priority: 4
severity: low

description: |
  Wrapper modules import successfully even when underlying
  dependency (torch, faiss, etc.) is missing. Skip markers fail.

detection:
  error_signatures:
    - "ModuleNotFoundError.*torch"  # But test wasn't skipped
    - "ImportError.*faiss"  # During test execution, not collection
  test_patterns:
    - "pytest.mark.skipif.*not.*available"

root_cause:
  technical: "Wrapper uses lazy imports that defer errors"
  specific: "import codex_ml.rag succeeds without torch"
  underlying: "Imports checked at function call, not module load"

fix_steps:
  1:
    action: "Check actual dependency"
    code: |
      try:
          import torch  # Check ACTUAL dependency
          TORCH_AVAILABLE = True
      except ImportError:
          TORCH_AVAILABLE = False

  2:
    action: "Use explicit availability in skip marker"
    old: "pytestmark = pytest.mark.skipif(not has_rag, ...)"
    new: "pytestmark = pytest.mark.skipif(not TORCH_AVAILABLE, ...)"

validation:
  test: "pytest -v (without torch installed)"
  expected: "Tests skipped, not failed"

batch_fix:
  enabled: true
  description: "Multiple tests using same wrapper module"
  example: "6 tests updated in Session 1"

metadata:
  discovered: "2026-02-18"
  session: "PR #3248 Session 1"
  confidence: 100
  reuse_count: 6

cognitive_notes: |
  LAZY IMPORT PATTERN: Check actual deps, not wrappers
  Common with: torch, faiss, mlflow, optional ML libraries
  Prevention: Explicit dependency checks at module level

---
```

