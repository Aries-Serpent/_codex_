# ── Pattern: BRANCH_BEHIND_BASE ─────────────────────────────────────────────
pattern_id: BRANCH_BEHIND_BASE
name: "Branch Behind Base — Rebase Required"
category: branch_hygiene
priority: 0
severity: blocker
first_seen: "2026-03-16"
last_seen: "2026-03-16"
pr_source: "3586"
session: "S117"

detection:
  log_signature: "BRANCH_REBASE_REQUIRED"
  workflow: "branch-rebase-gate.yml"
  job_pattern: "REQ-10: Branch Rebase Check"
  error_pattern: "is N commit(s) BEHIND|has DIVERGED from"
  comment_marker: "BRANCH_REBASE_REQUIRED"

root_cause: |
  The PR branch was not rebased after the base branch received new commits.
  The Copilot Coding Agent started work on a stale branch.  This causes:
    - Re-introduction of already-fixed code
    - Merge conflicts at merge time
    - CI failures from stale state

fix:
  type: git_operation
  priority: IMMEDIATE_FIRST
  steps:
    - "git fetch origin <base_branch>"
    - "git rebase origin/<base_branch>"
    - "git push --force-with-lease"
  verified: true

cognitive_note: |
  REQ-10 (Tier-1 hard block): The agent MUST NOT start any other work
  until the branch is rebased.  This is the FIRST action in every session
  when a BRANCH_REBASE_REQUIRED comment is present on the PR.

