pattern_id: COST_GATE_001
name: "Cost Gate RED — 10-minute polling blocks CI runner"
category: cost_gate
severity: medium
first_seen: "2026-03-14"
last_seen: "2026-03-14"
pr_source: "3579"
session: "30"

detection:
  log_signature: "⏳ Attempt N/10: waiting 60s for stakeholder"
  workflow: "cost-gate.yml"
  job_pattern: "🚦 Cost gate (RED)"
  error_pattern: "🔴 Cost gate timed out after 10 minutes"

root_cause: |
  The RED tier polls the PR body every 60s for up to 10 minutes (10 attempts).
  This burns runner time even when no one is monitoring the PR.
  The polling loop ran 10 iterations × 60s = 600s wasted per blocked workflow.

fix:
  type: workflow_change
  file: ".github/workflows/cost-gate.yml"
  change: |
    Reduce maxAttempts from 10 to 3, pollInterval from 60 to 30 seconds (90 sec max).
    Add guard: if context.issue.number is undefined, auto-approve (non-PR context).
    Update error message to include "Re-run this job after ticking the checkbox."
  verified: true

cognitive_note: |
  The fix reduces wasted runner time from 10 min to 90 sec per blocked RED workflow.
  Non-PR contexts (push triggers that somehow reach RED path) are now auto-approved.

