pattern_id: AUTH_DELEGATION_REBASE_001
name: "Agent Auth Delegation Blocked by REQ-10 Branch Divergence"
classifier: auth-delegation
severity: high
auto_healable: true
comment_marker: "BRANCH_REBASE_REQUIRED"
log_signature: "REQ-10 FAIL: A BRANCH_REBASE_REQUIRED marker is present"
workflow: "agent-auth-delegation.yml"

root_cause: |
  agent-auth-delegation.yml cognitive-preflight REQ-10 reads the PR comments
  for a BRANCH_REBASE_REQUIRED marker.  If the branch is still behind/diverged
  from its base when the agent session starts, REQ-10 hard-blocks activation.
  The escalation comment posted by iterative-self-healing-ci.yml (pattern:
  auth-delegation) indicates the self-healing loop could not automatically fix
  this — typically because the fix requires the GitHub Merges API (contents:write)
  which was not available in the previous heal job.

fix:
  type: api_call
  command: >
    python scripts/ci/branch_rebase_check.py
      --repo Aries-Serpent/_codex_ --pr <PR_NUMBER>
      --auto-merge-skip-ci --post-comment --upsert-dashboard
      --github-output --github-summary
  description: >
    Calls branch_rebase_check.py with --auto-merge-skip-ci.  When all gap
    commits are [skip ci] bot commits, merges them via the GitHub Merges API
    and posts the REQ-10 RESOLVED comment.  The next agent session start will
    see BRANCH_REBASE_RESOLVED > BRANCH_REBASE_REQUIRED and pass REQ-10.
  auto_fix_available: true
  verified: true

cognitive_note: |
  iterative-self-healing-ci.yml now includes auth-delegation in the fixable
  patterns set and dispatches to branch_rebase_check.py in the Apply auto-fix
  step.  The GH_TOKEN / CODEX_MASTER_KEY must have contents:write scope.

