pattern_id: CODEQL_001
name: "CodeQL Language Matrix Leg Fails — No Source Files Found"
category: codeql_configuration
priority: 3
severity: warning

description: |
  A CodeQL language matrix leg (e.g., `javascript`) fails with exit code 32 because
  the repository has no source files of that language type. CodeQL cannot build an
  extraction database for a language that has no files, and exits with:
  "Only found files that were empty or contained syntax errors."

  This does NOT indicate a code defect. It happens when the GHAS configuration includes
  a language that existed historically or is planned but has no current source files.

detection:
  workflow_path: ".github/workflows/codeql-analysis.yml"
  job_name: "Analyze (javascript)"
  step_name: "Perform CodeQL Analysis"
  error_signatures:
    - "Only found files that were empty or contained syntax errors"
    - "No source files for javascript"
    - "Process completed with exit code 32"
    - "Analyze (javascript) › Perform CodeQL Analysis"
  ghas_symptom: "6 configurations not found (when python+go+javascript each have +security-extended)"

root_cause:
  technical: |
    The codeql-analysis.yml matrix includes 'javascript' but the repository has no .js/.ts files.
    CodeQL exits 32 when it cannot produce a SARIF output. GitHub GHAS then reports the matrix
    leg as failed. When `queries: +security-extended` is used, GHAS expects 6 configurations
    (3 languages × 2 query suites) but only finds results from python+go (4 configurations).
  not_caused_by: "Actual security vulnerabilities — this is a configuration gap"

fix:
  automated: false
  manual_steps:
    - "Add `continue-on-error: ${{ matrix.language == 'javascript' }}` at the job level"
    - "This allows python and go to complete and upload SARIF while JS fails gracefully"
    - "Do NOT remove javascript from matrix — it may cause GHAS rule count drift on main"
  prevention:
    - "When adding a new language to CodeQL matrix, verify source files exist first"
    - "Use continue-on-error for any language leg that may have zero source files"

examples:
  - run_id: 22701029363
    date: "2026-03-05"
    commit: "52afd2d"
    error: "Perform CodeQL Analysis — exit code 32"
    resolution: "Added continue-on-error at job level in codeql-analysis.yml (commit 8e1d59e)"

cognitive_notes: |
  The 'javascript' matrix leg was added to codeql-analysis.yml to match GHAS configuration.
  The repo (Aries-Serpent/_codex_) is a Python project with Go in tools/github-secrets-cli/.
  There are no .js/.ts source files. The JS leg will always fail without continue-on-error.
  The "6 configurations not found" GHAS check is a pre-existing condition on main that requires
  a main branch GHAS configuration update to fully resolve — it is not blocking for this PR.

