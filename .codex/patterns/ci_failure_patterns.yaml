  The Deferral Language Gate scans PR body text for deferral phrases.
  PR descriptions that document or explain deferral scanner behavior
  will contain the exact phrases the scanner is designed to catch,
  triggering false positives.  Three escalating scenarios have been
  observed across Sessions 22–24 of PR #3575:
    1. Plain backtick span:  `future task`  (Session 22 fix)
    2. Double-backtick span: `` `future task` ``  (Session 23 fix)
    3. Outer-single-bt display wrapper: ` `` `future task` `` `  (Session 24 fix)

detection:
  error_signatures:
    - "PR body contains deferral language — policy violation"
    - "PR_SCAN: failure"
    - "Future deferral: punting to future work"
  workflow: "deferral-language-gate.yml"
  job: "deferral-language-check"

root_cause:
  technical: "PR body scanner does not distinguish prose from code examples"
  common_triggers:
    - "PR description contains example phrases like 'future task' in plain text"
    - "Changelog entries quoting deferral language"
    - "Policy documentation embedded in PR body"
    - "Session notes describing previous scanner fix using nested backtick syntax"

fix_steps:
  - "Wrap example phrases in backtick code spans: `future task` instead of 'future task'"
  - "Add <!-- noqa: deferral --> HTML comment at end of specific lines to suppress scanning"
  - "Use code fences (``` ```) for multi-line examples"

