    resolution: "Recreated .venv_ci virtualenv on cache miss (`python3 -m venv .venv_ci` then `.venv_ci/bin/pip`); added self-healing case to triage (S172)"
  - issue_type: "ci-health-alert"
    issue_number: 3977
    date: "2026-04-13"
    failure_rate: "34.8%"
    pattern_distribution:
      self_healing: 189
      auto_fix: 119
      unknown: 38
