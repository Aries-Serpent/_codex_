pattern_id: RUST_SWARM_STATUS_001
name: "Rust Swarm CI — Overall Status fails when rust_tests is skipped"
category: cascading_failure
severity: low
first_seen: "2026-03-14"
last_seen: "2026-03-14"
pr_source: "3579"
session: "30"

detection:
  log_signature: "❌ Rust tests failed"
  workflow: "rust_swarm_ci.yml"
  job_pattern: "Overall Status"
  error_pattern: "if [[ 'skipped' != 'success' ]]; then"

root_cause: |
  The Overall Status job checks `needs.rust_tests.result != "success"` which FAILS
  when rust_tests is "skipped" (skipped because cost gate blocked the job).
  This cascades: cost gate RED → rust_tests skipped → Overall Status fails.

fix:
  type: workflow_change
  file: ".github/workflows/rust_swarm_ci.yml"
  change: |
    Change `!= "success"` to `== "failure"` in the Overall Status job.
    Add "skipped" case with ⚠️ warning message instead of error.
  verified: true

cognitive_note: |
  "Skipped" != "failed". The distinction matters for cascading failures from cost gate.
  Always use `== "failure"` (not `!= "success"`) when jobs can legitimately be skipped.

