---
pattern_id: DETECT_SECRETS_002
name: "detect-secrets Baseline Line Number Drift (agent-auth-delegation.yml)"
category: security_baseline
priority: 2
severity: error

description: |
  detect-secrets exits with code 3 ("baseline file was updated") because
  `agent-auth-delegation.yml` gained or lost lines (due to a merge or new step being added),
  shifting the line numbers for the two Base64 High Entropy String false-positive entries.
  The hashes themselves do NOT change — only the line_number fields in `.secrets.baseline`.

  Common mistake: manually computing line numbers via Python `readlines()[N]` picks the WRONG
  token (a nearby base64 string). Always use `detect-secrets scan` to get canonical positions.

detection:
  workflow_path: ".github/workflows/validate.yml"
  job_name: "Fast Validation"
  hook_id: "detect-secrets"
  error_signatures:
    - "hook id: detect-secrets"
    - "exit code: 3"
    - "The baseline file was updated."
    - "Probably to keep line numbers of secrets up-to-date."
  affected_file: ".secrets.baseline"
  tracked_secrets_file: ".github/workflows/agent-auth-delegation.yml"

root_cause:
  technical: |
    `.secrets.baseline` stores the line number of every detected secret. When
    `agent-auth-delegation.yml` has lines inserted or deleted (e.g., a new workflow step),
    the two base64-encoded Python scripts (REQ-8 REQ-9) shift position. detect-secrets
    compares stored line numbers against the actual file and exits 3 on mismatch.
  not_caused_by: "Hash value changes — hashes for these entries remain 417c84ca (REQ-8) and 1565169a (REQ-9)"

fix:
  automated: true
  manual_steps:
    - "Run: detect-secrets scan .github/workflows/agent-auth-delegation.yml CODEX_MANIFEST.json"
    - "Copy the exact line_number values reported by detect-secrets into .secrets.baseline"
    - "Update generated_at timestamp to current UTC"
    - "Verify: detect-secrets scan --baseline .secrets.baseline exits 0"
  prevention:
    - "After ANY modification to agent-auth-delegation.yml, re-run the scan immediately"
    - "Never use manual Python readlines() counting — always use detect-secrets scan output"
    - "CODEX_MANIFEST.json entry stays at line 1653 hash f88d271f unless integrity_sha256 changes"

examples:
  - run_id: 22701614369
    date: "2026-03-05"
    commit: "8e1d59e"
    error: "exit code: 3 — The baseline file was updated."
    resolution: "Re-ran detect-secrets scan locally; corrected lines to 561/592 (hash unchanged)"
  - run_id: 22701029372
    date: "2026-03-05"
    commit: "52afd2d"
    error: "exit code: 3 — stale line numbers after main merge c0a71f3"
    resolution: "Updated .secrets.baseline with correct line numbers"

cognitive_notes: |
  REQ-8 token (hash 417c84ca): base64-encoded Python URL-lib memory check script.
  REQ-9 token (hash 1565169a): base64-encoded Python YAML-parse helper.
  Both are intentional false positives — they ARE base64 high-entropy strings but not secrets.
  The line numbers as of 2026-03-05 after main merge c0a71f3: REQ-8=561, REQ-9=592.
  These shift every time agent-auth-delegation.yml gains/loses lines above them.

metadata:
  reuse_count: 3
  effectiveness: "100% (re-scan resolves)"
  confidence: 1.0
  auto_fixable: true

---
pattern_id: PREFLIGHT_001
name: "Cognitive Pre-flight REQ-5: CHANGELOG.md Not Touched in Last Commit"
category: preflight_gate
priority: 2
severity: error

description: |
  The `agent-auth-delegation.yml` Cognitive Pre-flight Check (REQ-5) runs
  `git diff --name-only HEAD~1 HEAD | grep -qF "CHANGELOG.md"` and exits 1 if
  CHANGELOG.md is not in the diff. This blocks the `activate-delegation` job from running.

  Every commit to this branch must touch CHANGELOG.md with a new `## [Unreleased]` entry.
  Failure to do so produces: "Failing step: Verify CHANGELOG.md updated in last commit".

detection:
  workflow_path: ".github/workflows/agent-auth-delegation.yml"
  job_name: "🧠 Cognitive Pre-flight Check"
  step_name: "Verify CHANGELOG.md updated in last commit"
  error_signatures:
    - "FAIL — `CHANGELOG.md` was NOT updated in the last commit"
    - "Verify CHANGELOG.md updated in last commit"
    - "Process completed with exit code 1"
  check_command: "git diff --name-only HEAD~1 HEAD | grep -qF CHANGELOG.md"

root_cause:
  technical: |
    REQ-5 in agent-auth-delegation.yml requires CHANGELOG.md to appear in every commit's diff.
    When a commit only changes workflow files, test fixtures, or baselines — but not CHANGELOG.md —
    the gate exits 1 and blocks session activation (activate-delegation never runs).
  not_caused_by: "CHANGELOG.md content — any non-empty change (even a comment line) satisfies the gate"

fix:
  automated: false
