pattern_id: EMBED_PYTHON_001
name: "Embedding Index Rebuild — Python 3.11 venv used instead of 3.12"
category: python_version
severity: high
first_seen: "2026-03-14"
last_seen: "2026-03-14"
pr_source: "3579"
session: "30"

detection:
  log_signature: "Package 'codex-ml' requires a different Python: 3.11.14 not in '>=3.12'"
  workflow: "embedding-index-rebuild.yml"
  job_pattern: "Rebuild FAISS Embedding Index"
  step_pattern: "Set up Python"

root_cause: |
  The setup-python-cached composite action restores a cached .venv_ci from a previous
  Python 3.11 run via restore-key fallback. Even though setup-python@v5 sets up 3.12,
  the restored venv's pip binary is Python 3.11. When pip installs codex-ml which
  requires Python >=3.12, it fails with a version mismatch error.
  pythonLocation shows 3.11.14 despite requesting 3.12.

fix:
  type: workflow_change
  file: ".github/workflows/embedding-index-rebuild.yml"
  change: |
    Replace `uses: ./.github/actions/setup-python-cached` with `uses: actions/setup-python@v5`.
    The embedding job only needs the Python interpreter (installs its own deps via pip install),
    so the full 4-layer venv cache is unnecessary and counter-productive here.
  verified: true

cognitive_note: |
  The setup-python-cached composite action is optimized for the main project venv.
  For jobs that install their own isolated dependencies, use setup-python@v5 directly.
  The composite action's venv cache can be a source of version conflicts.

