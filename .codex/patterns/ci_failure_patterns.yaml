pattern_id: COV_002
name: "secrets.baseline Version Mismatch"
category: ci_configuration
priority: 2
severity: warning

description: |
  .secrets.baseline declares version "1.5.0" but .pre-commit-config.yaml pins
  detect-secrets at v1.4.0. Detect-secrets v1.4.0 may refuse to load a v1.5.0
  baseline, causing pre-commit hook to fail or behave unexpectedly.
  Fix: downgrade .secrets.baseline version to "1.4.0".

detection:
  error_signatures:
    - "detect-secrets.*version.*mismatch"
    - "Unable to load secrets baseline"
  file_patterns:
    - ".secrets.baseline"
    - ".pre-commit-config.yaml"

root_cause:
  technical: "detect-secrets generates baselines with its own version; if version differs from pre-commit pin, load fails"
  fix: "Set .secrets.baseline version to match pre-commit pin"

fix_steps:
  - "1. Check .pre-commit-config.yaml: grep detect-secrets to find pinned version (e.g. v1.4.0)"
  - "2. Edit .secrets.baseline line 2: change version to match (e.g. '1.4.0')"
  - "3. Run sync_tracked_files.py --fix to update CODEX_MANIFEST hash"

auto_fix: true
references:
  - ".secrets.baseline"
  - ".pre-commit-config.yaml"
