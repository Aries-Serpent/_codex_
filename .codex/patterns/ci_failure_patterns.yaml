# ── Pattern: DEAD_CODE_100_CONFIDENCE ───────────────────────────────────────
pattern_id: DEAD_CODE_100_CONFIDENCE
name: "Dead Code — 100% Confidence (vulture)"
category: code_quality
priority: 2
severity: error
first_seen: "2026-03-16"
last_seen: "2026-03-16"
pr_source: "3586"
session: "S117"

detection:
  log_signature: "unreachable code after|unused variable.*100%"
  workflow: "pre-commit (dead-code-scan hook)"
  tool: "vulture"
  confidence: 100

root_cause: |
  Code that is provably never executed:
    - Statements after unconditional raise/return/break
    - Variables assigned but never read (100% confidence)
  These are NOT false positives at 100% confidence.

fix:
  type: code_change
  command: "python scripts/ci/dead_code_scan.py src/ tests/ --min-confidence 100 --format github"
  steps:
    - "Run: python scripts/ci/dead_code_scan.py src/ tests/ --min-confidence 100"
    - "Remove each unreachable block or unused variable"
    - "Re-run scan to confirm 0 findings"
  verified: true

cognitive_note: |
  Only 100%-confidence items are auto-fixed.  60–79% items require human
  review because vulture cannot resolve dynamic dispatch, __all__ exports,
  or TYPE_CHECKING guards.  Use scripts/ci/dead_code_scan.py for triage.

