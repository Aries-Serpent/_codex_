pattern_id: COV_001
name: "RAG Coverage Scope Dilution"
category: test_coverage
priority: 2
severity: critical

description: |
  The RAG Module Tests workflow uses `--cov=src` which measures coverage for
  ALL of src/ (50,000+ lines) but only RAG tests run. This produces a ~5%
  line-rate in coverage.xml, failing the 95% threshold gate.
  Fixed in S235/S237: use `--cov=src/codex/rag` + `--cov-config=tests/rag/.coveragerc`
  to scope coverage to the RAG module only.

detection:
  error_signatures:
    - "Coverage.*% is below 95% threshold"
    - "line-rate.*0\\.0[0-9]"
    - "❌ Coverage.*below 95%"
  file_patterns:
    - ".github/workflows/test-rag.yml"
    - "coverage.xml"
  log_locations:
    - "test-rag (3.12) — Check coverage threshold"

root_cause:
  technical: "--cov=src measures ALL src/ modules; RAG tests only cover src/codex/rag"
  specific: "Global .coveragerc has source=src; overrides --cov=src/codex/rag without explicit --cov-config"
  underlying: "Coverage scope not properly scoped to the tested module"

fix_steps:
  - "1. Create tests/rag/.coveragerc with source=src/codex/rag and omit=*/benchmarks/*,*/analytics/*,*/providers/gpt4all*,*/providers/llama*,*/providers/ollama*"
  - "2. Add --cov-config=tests/rag/.coveragerc to pytest command in test-rag.yml"
  - "3. Verify coverage.xml line-rate rises to >=0.95"

auto_fix: false
manual_steps_required: true
estimated_fix_time: "15 minutes"

references:
  - "tests/rag/.coveragerc"
  - ".github/workflows/test-rag.yml"
  - ".codex/plans/codebase_wide_coverage_plan.md"

