pattern_id: BRANCH_DIVERGED_001
name: "Branch Diverged from Base (Scheduled Bot Commits)"
classifier: branch-diverged
severity: medium
auto_healable: true
log_signature: "BRANCH_REBASE_REQUIRED"
workflow: "branch-rebase-gate.yml"
triggers:
  - "branch is behind"
  - "branch has diverged"
  - "REQ-10 FAIL"
  - "BRANCH_REBASE_REQUIRED"

root_cause: |
  Five scheduled GitHub Actions workflows commit directly to main every 2-24 hours:
    - codex-manifest-refresh.yml  (every 6h)
    - embedding-index-rebuild.yml (daily 02:00 UTC)
    - cognitive-analysis-feed.yml (daily 02:00 UTC)
    - repo-var-sync-schedule.yml  (daily 06:00 UTC)
    - vars-guide-sync.yml         (daily 06:00 UTC)
  Any open PR branch will diverge from main within ~6 hours of being created.
  This triggers the REQ-10 hard block in agent-auth-delegation.yml even though
  no functional code changes were made to main.

fix:
  type: api_call
  command: >
    python scripts/ci/branch_rebase_check.py
      --repo Aries-Serpent/_codex_ --pr <PR_NUMBER>
      --auto-merge-skip-ci --post-comment --upsert-dashboard
      --github-output --github-summary
  description: >
    When ALL gap commits are [skip ci] github-actions[bot] commits,
    branch_rebase_check.py calls the GitHub Merges API to auto-merge them
    into the PR branch — no git checkout required.  Posts a rich helper
    comment with: gap commit table, conflict risk analysis, click-by-click
    resolution instructions, and a copy-pasteable Copilot agent prompt.
    Also updates the PR Status Dashboard section.
  auto_fix_available: true
  verified: true

prevention: |
  branch-rebase-gate.yml now runs --auto-merge-skip-ci on every PR push.
  If the gap is 100% bot [skip ci] commits, it auto-merges without creating
  a REQ-10 block.  Only human-authored functional commits in the gap require
  a manual rebase.

cognitive_note: |
  This pattern recurs every 6-24 hours for any long-running PR.  The
  auto-merge path is safe because [skip ci] bot commits only touch metadata
  files (.codex/, docs/admin/, CODEX_MANIFEST.json) with no overlap with
  typical PR changes.

