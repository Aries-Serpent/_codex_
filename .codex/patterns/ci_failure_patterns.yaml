# ── Pattern: STALE_BRANCH_NOT_MERGED ────────────────────────────────────────
pattern_id: STALE_BRANCH_NOT_MERGED
name: "Stale Unmerged Branch — Manual Review"
category: branch_hygiene
priority: 3
severity: warning
first_seen: "2026-03-16"
last_seen: "2026-03-16"
pr_source: "3586"
session: "S117"

detection:
  log_signature: "stale (.*d) but NOT merged"
  workflow: "branch-cleanup.yml"
  job_pattern: "Branch Cleanup"

root_cause: |
  A branch has had no commit activity for more than STALE_DAYS days
  but has NOT been merged into the default branch.  It may contain
  uncommitted work-in-progress or be an abandoned feature branch.

fix:
  type: manual_review
  steps:
    - "Review the branch contents: git log origin/<branch> --oneline"
    - "If work is valuable: open a PR or rebase onto main"
    - "If abandoned: delete the branch manually or via branch-cleanup.yml --force-prefix"
  verified: false

cognitive_note: |
  Stale unmerged branches are NOT automatically deleted by the cleanup
  workflow because code may be lost.  They require human review.

