### Pattern #25: Deferral Language Gate — Documentation Examples

```yaml
---
pattern_id: DEFERRAL_001
name: "Deferral Language Gate False Positive — Doc Examples"
category: ci_compliance
priority: 2
severity: medium
auto_fixable: false

