pattern_id: SELF_HEALING_001
name: "Self-Healing CI: Cascade Failure — .venv_ci/bin/pip Missing on Cache Miss"
category: ci_infrastructure
priority: 1
severity: high

description: |
  The iterative-self-healing-ci workflow itself fails when triggered by other workflow
  failures.  There are two sub-scenarios:

  **Sub-scenario A — .venv_ci/bin/pip cache miss (PRIMARY, S172)**:
    The triage job's "Classify failure" step calls `.venv_ci/bin/pip install requests`
    directly.  When the Layer-3 venv cache misses (fresh runner, cache expiry, or
    cache-bust via CODEX_CACHE_VERSION bump), `.venv_ci/bin/pip` does not exist and
    the step exits 1.  This fails the triage job, causing the entire workflow run to
    be marked as "failure" — before any classify-run or heal logic executes.
    The same issue exists in the heal job's "Install tools" step which calls
    `.venv_ci/bin/pip install ruff black isort`.

    Observed distribution (2026-03-21, issue ci-health-alert):
      self_healing: 126  ← these are the cascade failures from Sub-scenario A
      unknown:        2
      embedding-rebuild: 1
      auto-fix:       1
      integration-branch-direct-session: 1
      coverage-timeout: 1
      security-scan:  1
    Failure rate: 13.3% (CODEX_CI_FAILURE_THRESHOLD = 10.0 → degraded status)

  **Sub-scenario B — 'unknown' pattern gaps (HISTORICAL, issue #3534)**:
    When a failure does not match any pattern in PATTERN_KEYWORDS, it is classified
    as 'unknown'.  The heal job runs but produces no fix, and the workflow completes
    with fixable=false.  The overall run may still succeed (escalate job runs instead).

  **Key insight on threshold change:**
    The CODEX_CI_FAILURE_THRESHOLD was previously hardcoded at 20% in
    ci-health-monitor.yml.  After P2.3 wiring to the repo variable (default 10%),
    the existing ~120-126/week self-healing cascade rate now exceeds the threshold,
    triggering ci-health-alert issues even though the underlying workflows are healthy.

detection:
  workflow_path: ".github/workflows/iterative-self-healing-ci.yml"
  job_name: "Self-Healing CI"
  error_signatures:
    - ".venv_ci/bin/pip: No such file or directory"
    - ".venv_ci/bin/pip install requests"
    - "Self-Healing Cascade Detected (SELF_HEALING_001)"
    - "Pattern: unknown"
    - "iterative self-healing CI could not automatically fix this failure"
    - "The iterative self-healing CI could not automatically fix"
  issue_indicators:
    - "self-healing: N (dominant count in ci-health-alert, >50% of failures)"
    - "unknown: N (any non-zero count warrants pattern addition)"

root_cause:
  primary_s172: |
    .venv_ci/bin/pip does not exist on a fresh runner when the Layer-3 venv cache
    misses.  The setup-python-cached action creates .venv_ci/ only when the venv
    cache hits OR when pip install -e . completes successfully.  If the install is
    skipped or fails, .venv_ci/bin/pip is absent.  Any subsequent direct call to
    .venv_ci/bin/pip exits 1, failing the workflow step and the whole workflow run.
  historical_s3534: |
    Pattern library gaps cause failures to be classified as 'unknown'.
    The self-healing CI cannot auto-fix 'unknown' patterns, so it escalates.
    If the escalate job also fails (e.g., no open PR), the workflow run fails.
  threshold_change: |
    CODEX_CI_FAILURE_THRESHOLD lowered from implicit 20% to explicit 10.0 (P2.3 wiring).
    The self-healing cascade rate (~120/week) was always present but only recently
    crossed the new lower threshold, triggering alerts.
  distribution_issue_3534:
    self_healing: 120  # S3534 baseline (sub-scenario B)
    unknown: 52
    workflow_cascade: 2
    security_scan: 1
  distribution_s172:
    self_healing: 126  # S172 cascade (sub-scenario A + sub-scenario B)
    unknown: 2         # major improvement from 52 — pattern library coverage working
    embedding_rebuild: 1
    auto_fix: 1
    integration_branch_direct_session: 1
    coverage_timeout: 1
    security_scan: 1

fix:
  automated: true
  applied_in: "S172 — PR copilot/investigate-ci-failure-rate"
  code_changes:
    - file: ".github/workflows/iterative-self-healing-ci.yml"
      change: |
        # Triage job — Classify failure step:
        # BEFORE: .venv_ci/bin/pip install requests --quiet
        # AFTER:
        #   if ! .venv_ci/bin/pip install requests --quiet 2>/dev/null; then
        #     python3 -m venv .venv_ci
        #     .venv_ci/bin/pip install requests --quiet
        #   fi
        #
        # Heal job — Install tools step:
        # BEFORE: .venv_ci/bin/pip install ruff black isort --quiet
        # AFTER:
        #   if ! .venv_ci/bin/pip install ruff black isort --quiet 2>/dev/null; then
        #     python3 -m venv .venv_ci
        #     .venv_ci/bin/pip install ruff black isort --quiet
        #   fi
        #
        # Recreating the venv (not falling back to system pip) keeps all installs
        # inside an isolated virtualenv and avoids polluting the runner's global
        # site-packages.
        # Also added 'self-healing' case to the triage case statement with cascade
        # detection message — prevents escalate job from being skipped on this pattern.
  manual_steps:
    - "For each 'unknown' run, retrieve logs and match against DOC_METRICS_001/PREFLIGHT_001/002"
    - "If it is a doc-metrics failure: run python scripts/tools/doc_metrics_sync.py --fix"
    - "If it is a preflight CHANGELOG/accountability failure: add entries to both files"
    - "If neither: check for CODEX_MANIFEST.json freshness (must be < 24h for E→D gate)"
    - "Re-run the failed workflow after committing the fix"
  prevention:
    - "Every commit must touch CHANGELOG.md + AGENT_ACCOUNTABILITY_REPORT.md"
    - "Run doc_metrics_sync --fix after any fail_under or metric change in pyproject.toml"
    - "Add new patterns immediately when a new 'unknown' failure is resolved"
    - "Use hardened venv recreation pattern for any .venv_ci/bin/ binary calls in workflow steps:"
    - "  if ! .venv_ci/bin/<cmd> ... 2>/dev/null; then rm -rf .venv_ci && python3 -m venv --clear .venv_ci && .venv_ci/bin/pip install --upgrade pip setuptools --quiet && .venv_ci/bin/<cmd> ...; fi"

examples:
  - issue_number: 3534
    date: "2026-03-10"
    pattern_distribution:
      self_healing: 120
      unknown: 52
      workflow_cascade: 2
      security_scan: 1
    resolution: "Added DOC_METRICS_001, PREFLIGHT_002, SELF_HEALING_001 to pattern library"
  - issue_type: "ci-health-alert"
