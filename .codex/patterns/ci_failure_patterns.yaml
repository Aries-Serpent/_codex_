pattern_id: PREMERGE_TIMEOUT_001
name: "Pre-Merge Validation — runner preempted running full test suite"
category: runner_timeout
severity: medium
first_seen: "2026-03-14"
last_seen: "2026-03-14"
pr_source: "3579"
session: "30"

detection:
  log_signature: "The runner has received a shutdown signal"
  workflow: "pre-merge-validation.yml"
  job_pattern: "Final Pre-Merge Checks"
  error_pattern: "The operation was canceled"

root_cause: |
  The "quick pre-merge validation" job ran `pytest tests/` which includes all 1500+
  tests. After ~8 minutes, the GitHub Actions runner received a shutdown signal
  (preemption/cancellation). The job is described as "quick validation" but was
  running the full suite.

fix:
  type: workflow_change
  file: ".github/workflows/pre-merge-validation.yml"
  change: |
    Change `pytest tests/` (1500+ tests, ~8 min) to
    `pytest tests/capabilities/ci_test/` (50 CI tests, ~30s).
    This matches the stated purpose: "quick pre-merge validation".
  verified: true

cognitive_note: |
  "Quick validation" jobs must ONLY run fast tests (~30s).
  Full test suite belongs in Resilient Validation Suite / Art_Validation Pipeline.
  Use `tests/capabilities/ci_test/` for pre-merge smoke checks.

