### Category 6: Test Infrastructure

```yaml
---
pattern_id: TEST_001
name: "Test Fallback Design for Optional Features"
category: test_infrastructure
priority: 3
severity: low

description: |
  Tests should validate optional features if present,
  or fall back to minimum requirements check.

detection:
  symptom: "Test fails when optional config absent"
  pattern: "KeyError or AttributeError on optional field"

best_practice:
  pattern: |
    def test_optional_feature():
        data = load_config()
        optional = data.get("optional", {}).get("feature")

        if optional:
            # Primary: Validate feature if present
            assert validate_feature(optional)
        else:
            # Fallback: Check minimum requirements
            assert minimum_requirements_met()

benefits:
  - "Tests robust to configuration changes"
  - "No false negatives from missing optional features"
  - "Clear separation of required vs optional"

metadata:
  discovered: "2026-02-18"
  session: "PR #3248 Session 2"
  confidence: 100

cognitive_notes: |
  DEFENSIVE DESIGN: Optionals need fallbacks
  Prevents test fragility
  Makes tests more maintainable

---
```

## Pattern Usage Guide

### How to Use This Library

1. **Detection Phase**
   - Run CI and collect failure logs
   - Search patterns by error signature
   - Match against detection criteria

2. **Categorization Phase**
   - Group failures by pattern ID
   - Sort by priority (1 highest)
   - Identify batch fix opportunities

3. **Resolution Phase**
   - Follow fix_steps for each pattern
   - Apply batch fixes where applicable
   - Validate after each category

4. **Learning Phase**
   - Store new patterns discovered
   - Update effectiveness metrics
   - Refine detection signatures

### Pattern Matching Algorithm

```python
def match_failure_to_pattern(error_log):
    """
    Search pattern library for matches
    Returns: List of matching patterns, sorted by confidence
    """
    matches = []

    for pattern in pattern_library:
        confidence = 0

        # Check error signatures
        for signature in pattern['detection']['error_signatures']:
            if re.search(signature, error_log):
                confidence += 40

        # Check file patterns
        if pattern['detection'].get('file_patterns'):
            for file in changed_files:
                if any(fnmatch(file, p) for p in pattern['file_patterns']):
                    confidence += 30

        # Check context
        if pattern['detection'].get('context'):
            if matches_context(pattern['context']):
                confidence += 30

        if confidence >= 50:  # Threshold
            matches.append({
                'pattern': pattern,
                'confidence': confidence,
                'priority': pattern['priority']
            })

    return sorted(matches, key=lambda x: (x['priority'], -x['confidence']))
```

### Batch Fix Detection

```python
def identify_batch_opportunities(categorized_failures):
    """
    Find patterns that can fix multiple failures at once
    """
    batch_opportunities = []

    for category, failures in categorized_failures.items():
        pattern = get_pattern(category)

        if pattern.get('batch_fix', {}).get('enabled'):
            batch_opportunities.append({
                'pattern': pattern,
                'affected_tests': len(failures),
                'efficiency_gain': f"{len(failures)}x",
                'estimated_time': pattern['fix_steps']
            })

    return sorted(batch_opportunities,
                  key=lambda x: x['affected_tests'],
                  reverse=True)
```

