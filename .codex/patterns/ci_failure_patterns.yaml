pattern_id: SELF_HEALING_001
name: "Self-Healing CI: 'unknown' Pattern Classification — Preflight + Doc-Metrics Root Causes"
category: ci_infrastructure
priority: 2
severity: warning

description: |
  The iterative-self-healing-ci workflow classifies CI failures into known patterns.
  When a failure does not match any pattern signature in ci_failure_patterns.yaml, it
  is reported as 'Pattern: unknown'. Issue #3534 shows 52 unknown-pattern failures over
  7 days, indicating systemic gaps in the pattern library.

  Root causes of 'unknown' classification (in descending frequency):
  1. DOC_METRICS_001: doc_metrics_sync stale metrics (pre-commit hook output, not pytest)
  2. PREFLIGHT_001/002: CHANGELOG.md or AGENT_ACCOUNTABILITY_REPORT.md not in commit diff
  3. Transient runner shutdowns (exit code 1 with no matching test failure)
  4. CODEX_MANIFEST.json freshness > 24h (E→D Transition Gate C2)

detection:
  workflow_path: ".github/workflows/iterative-self-healing-ci.yml"
  job_name: "Self-Healing CI"
  error_signatures:
    - "Pattern: unknown"
    - "iterative self-healing CI could not automatically fix this failure"
    - "The iterative self-healing CI could not automatically fix"
  issue_indicators:
    - "self-healing: N (large count in ci-health-alert)"
    - "unknown: N (any non-zero count warrants pattern addition)"

root_cause:
  technical: |
    The self-healing CI matches log lines against `error_signatures` in ci_failure_patterns.yaml.
    Pre-commit hook output (doc-metrics-check, accountability report gate) uses different
    phrasing than pytest failure output, so it falls through to 'unknown'. Fix: add patterns
    with the exact error_signatures from the pre-commit and preflight log output.
  distribution_issue_3534:
    self_healing: 120  # correctly classified; these are transient retry loops
    unknown: 52        # DOC_METRICS_001 + PREFLIGHT_001/002 cover ~80% of these
    workflow_cascade: 2
    security_scan: 1

fix:
  automated: false
  manual_steps:
    - "For each 'unknown' run, retrieve logs and match against DOC_METRICS_001/PREFLIGHT_001/002"
    - "If it is a doc-metrics failure: run python scripts/tools/doc_metrics_sync.py --fix"
    - "If it is a preflight CHANGELOG/accountability failure: add entries to both files"
    - "If neither: check for CODEX_MANIFEST.json freshness (must be < 24h for E→D gate)"
    - "Re-run the failed workflow after committing the fix"
  prevention:
    - "Every commit must touch CHANGELOG.md + AGENT_ACCOUNTABILITY_REPORT.md"
    - "Run doc_metrics_sync --fix after any fail_under or metric change in pyproject.toml"
    - "Add new patterns immediately when a new 'unknown' failure is resolved"

examples:
