pattern_id: DOC_METRICS_001
name: "doc_metrics_sync Pre-commit Hook: Stale Coverage/Test-Count Metrics in Docs"
category: documentation_sync
priority: 2
severity: error

description: |
  The `doc-metrics-check` pre-commit hook runs `scripts/tools/doc_metrics_sync.py` and
  exits 1 when documentation files contain stale metric values that no longer match the
  live metrics derived from `pyproject.toml` and repo state (e.g. coverage_threshold,
  test_count, agent_count).

  The most common trigger is raising `fail_under` in `pyproject.toml` (e.g. 75→80):
  the hook finds `75%` still present in Mermaid diagrams, architecture docs, and README
  nodes. Exit code 2 is propagated from run_validation.sh to the CI job, failing it.

detection:
  workflow_path: ".github/workflows/validate.yml"
  job_name: "Fast Validation"
  step_name: "Run fast validation"
  error_signatures:
    - "Doc Metrics Check (Mermaid/KPI alignment)...Failed"
    - "stale metric(s) found"
    - "Run  python scripts/tools/doc_metrics_sync.py --fix  to update automatically"
    - "exit code: 1"
    - "readme_mermaid_eval_coverage"
    - "arch_codex_node"
    - "repo_arch_diag_coverage"
  affected_files:
    - "README.md"
    - "docs/ARCHITECTURE.md"
    - "docs/REPOSITORY_ARCHITECTURE_DIAGRAMS.md"
    - "docs/evolution/COGNITIVE_CODEBASE_MAP.md"

root_cause:
  technical: |
    When `pyproject.toml fail_under` is changed, `doc_metrics_sync.py` reads the new
    value and compares it against hard-coded strings in documentation files. If any file
    still contains the old value (e.g. '75% Coverage'), the hook reports stale metrics
    and exits 1, which propagates as exit code 2 from run_validation.sh.
  not_caused_by: "Test failures — this is a documentation synchronization check only"

fix:
  automated: true
  auto_fix_command: "python scripts/tools/doc_metrics_sync.py --fix"
  manual_steps:
    - "Run: python scripts/tools/doc_metrics_sync.py --fix"
    - "Commit all files listed in the 'stale metric(s) found' output"
    - "Ensure CHANGELOG.md and AGENT_ACCOUNTABILITY_REPORT.md are also updated (preflight gate)"
  prevention:
    - "Run doc_metrics_sync --fix immediately after any pyproject.toml fail_under change"
    - "doc_metrics_sync --check is part of pre-commit; run pre-commit locally before pushing"

examples:
  - run_id: 22926716902
    date: "2026-03-10"
    commit: "bac190f"
    error: "7 stale metric(s) found — coverage 75→80 not propagated to docs"
    files_affected:
      - "README.md line 35: '📊 75% Coverage' → '📊 80% Coverage'"
      - "docs/ARCHITECTURE.md line 36"
      - "docs/REPOSITORY_ARCHITECTURE_DIAGRAMS.md lines 15, 32, 96"
      - "docs/evolution/COGNITIVE_CODEBASE_MAP.md line 132"
    resolution: "python scripts/tools/doc_metrics_sync.py --fix; committed all 4 files"

cognitive_notes: |
  This is one of the top contributors to 'unknown' pattern failures in CI health alerts.
  The self-healing CI does not auto-classify this pattern because the error message appears
  in pre-commit hook output rather than a pytest failure. Adding this pattern enables
  the CI health alert agent to propose the --fix command automatically.
  Pattern triggered on every coverage threshold bump (75→80, 80→85, etc.).

metadata:
  reuse_count: 1
  effectiveness: "100% (auto-fix command resolves)"
  confidence: 1.0
  auto_fixable: true
  auto_fix_command: "python scripts/tools/doc_metrics_sync.py --fix"
  issue_refs:
