# SLA-Based Auto-Upgrade Strategy

## Overview
This configuration defines Service Level Agreements (SLAs) for automated dependency updates
across all ecosystems. Each severity level has specific auto-merge timelines and conditions.

---

## SLA Definitions

### Critical CVE Updates
**SLA Window**: 4 hours
**Auto-Merge**: YES (if CI passes)
**Manual Review**: Required AFTER merge (for post-incident analysis)

**Conditions**:
1. Dependabot creates PR with CVE details in title
2. CI (tests, linting, security) must pass (required)
3. No merge conflicts
4. Automatic merge triggers after 4 hours if conditions met
5. Slack/email notification to security team before auto-merge

**Example**: cryptography private key extraction (CRITICAL)
```
Title: chore(deps): upgrade cryptography to 48.0.1 [PYSEC-2026-XXXXX Critical]
Labels: security-critical, critical-cve, dependencies
→ Auto-merge after 4h if CI ✓
```

---

### High CVE Updates
**SLA Window**: 24 hours
**Auto-Merge**: YES (if CI passes + no blocking comments)
**Manual Review**: Optional, auto-merge proceeds after 24h even without review

**Conditions**:
1. Dependabot creates PR with CVE details
2. CI (tests, linting, security) must pass (required)
3. No merge conflicts
4. If code review comments present: auto-merge delayed until comments resolved OR 24h expires
5. Auto-merge triggers after 24 hours
6. Slack notification to security team at 12h mark

**Example**: JWT signature bypass (HIGH)
```
Title: chore(deps): upgrade PyJWT to 2.13.0 [PYSEC-2026-120 High]
Labels: security-high, dependencies
→ Auto-merge after 24h if CI ✓
```

---

### Medium Severity Updates
**SLA Window**: 48 hours
**Auto-Merge**: NO (manual approval required)
**Manual Review**: Required

**Conditions**:
1. Dependabot creates PR
2. CI must pass (required)
3. Code review + approval required (PR requires min 1 reviewer)
4. After approval, auto-merge possible
5. If no review after 48h: auto-merge allowed without approval (to prevent stale CVEs)
6. Label: `dependencies`, `security-medium`, package tier

**Example**: pip privilege escalation vulnerability
```
Title: chore(deps): upgrade pip to 26.1.2 [PYSEC-2026-196 Medium]
Labels: security-medium, dependencies, python
→ Requires review + approval (auto-merge after 48h if unreviewed)
```

---

### Low Severity / Informational Updates
**SLA Window**: 1 week (no hard deadline)
**Auto-Merge**: NO
**Manual Review**: Optional

**Conditions**:
1. Dependabot creates PR
2. CI must pass
3. Manual review recommended but not required
4. Can be merged at developer discretion
5. Batch updates by dependency tier for efficiency

**Example**: Certificate store update (LOW)
```
Title: chore(deps): update certifi to 2024.7.4 [PYSEC-2024-230 Low]
Labels: dependencies, low-priority
→ Merge when convenient (no deadline)
```

