# Dependabot Configuration Enhancements

## Python (pip)

```yaml
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "daily"          # Check daily for faster CVE response
    time: "08:00"
    timezone: "UTC"
  
  # SLA-based auto-merge rules
  pull-request-branch-name:
    separator: "/"
  
  labels:
    - "dependencies"
    - "python"
  
  reviewers:
    - "security-team"          # Required reviewer
  
  assignees:
    - "dependabot"
  
  # Grouping strategy: group by severity tier
  groups:
    critical-security:
      patterns:
        - "cryptography*"
        - "PyJWT*"
        - "wheel*"
      update-types:
        - "patch"
        - "minor"
      allow-post-release: false
    
    high-security:
      patterns:
        - "jinja2*"
        - "urllib3*"
        - "requests*"
        - "pyopenssl*"
      update-types:
        - "patch"
        - "minor"
      allow-post-release: false
    
    medium-security:
      patterns:
        - "pip*"
        - "setuptools*"
        - "twisted*"
      update-types:
        - "patch"
        - "minor"
      allow-post-release: false
    
    framework-updates:
      patterns:
        - "fastapi*"
        - "starlette*"
        - "pydantic*"
        - "jinja2*"
      update-types:
        - "patch"
        - "minor"
      allow-post-release: false
    
    utility-updates:
      patterns:
        - "pytest*"
        - "black*"
        - "ruff*"
        - "mypy*"
      update-types:
        - "patch"
        - "minor"
    
    torch-updates:
      patterns:
        - "torch*"
      update-types:
        - "minor"
      allow-post-release: false
  
  commit-message:
    prefix: "deps"
    prefix-scope: "python"
    include: "scope"
  
  ignore:
    - dependency-name: "nbconvert"
      versions:
        - ">=7.0.0"
    - dependency-name: "torch"
      versions:
        - ">=2.5.0"      # Require manual review for major torch upgrades
  
  open-pull-requests-limit: 10   # Increase limit to handle security urgency
```

