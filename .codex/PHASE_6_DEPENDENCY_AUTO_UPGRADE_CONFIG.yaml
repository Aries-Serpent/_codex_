# Testing SLA Behavior

## Synthetic Test Scenario

To verify SLA automation works correctly, execute:

```bash
# 1. Create synthetic critical CVE update
git checkout -b test/critical-cve-sla
echo "cryptography==48.0.1  # Critical update for testing" >> requirements.txt
git commit -am "test: synthetic critical CVE [PYSEC-2026-TEST]"
git push origin test/critical-cve-sla

# 2. Create PR with critical label
# Use GitHub API or UI to add 'security-critical' label

# 3. Verify:
# - PR created ✓
# - CI runs ✓
# - Dependabot commentary present ✓
# - SLA timer started ✓
# - Auto-merge scheduled after 4h ✓

# 4. Check logs
gh pr view <pr-number> --json comments,statusCheckRollup

# 5. Verify auto-merge was executed
# (After 4 hours or manual test trigger)
```

---

# Exemptions & Emergency Procedures

## Exemption Cases

1. **Breaking Changes Detected**: SLA paused until compatibility verified
2. **Test Failure**: SLA paused until root cause identified
3. **Merge Conflicts**: SLA extends by 24h to allow manual conflict resolution
4. **Integration Issues**: Security team can request manual review pause

## Emergency Rollback

If auto-merged update causes production issues:

```bash
# 1. Revert PR immediately
gh pr revert <pr-number>

# 2. File incident report
# 3. Add to breaking-changes ignore list for 30 days
# 4. Notify Dependabot to hold updates for affected package
```

