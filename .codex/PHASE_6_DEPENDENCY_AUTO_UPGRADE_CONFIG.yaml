# Monitoring & Reporting

## SLA Compliance Dashboard

**Location**: `.github/workflows/dependency-sla-monitor.yml`

**Metrics Tracked**:
1. Critical CVE: % merged within 4 hours (target: 100%)
2. High CVE: % merged within 24 hours (target: 95%)
3. Medium CVE: % merged within 48 hours (target: 90%)
4. Average time-to-merge by severity
5. Failed CI reasons

**Reporting Frequency**: Daily digest in #security channel (or equivalent)

