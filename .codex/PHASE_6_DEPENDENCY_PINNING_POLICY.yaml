version: "1.0"
policy_name: "Phase 6 Dependency Pinning Strategy"
effective_date: "2026-07-18"
rationale: |
  This policy defines version pinning strategies across three dependency tiers to balance security,
  stability, and maintainability. Core security-critical dependencies are pinned to specific minor
  versions with security patches. Framework dependencies allow controlled patch updates. Utility
  dependencies allow flexible minor updates.

---

# Dependency Tier Classification

## Tier 1: Core Security-Critical (🔒 Strict Pinning)
**Pinning Strategy**: `~=X.Y.Z` (patch updates only, e.g., 1.2.0 → 1.2.5 allowed, but NOT 1.3.0)

**Rationale**:
- Security vulnerabilities in these packages can compromise the entire application
- Even minor version changes may introduce breaking changes in cryptographic behavior
- Must be thoroughly tested before any upgrade
- Requires explicit security review before version bump

**Packages in Tier 1**:

```yaml
python:
  security_core:
    # Authentication & Authorization
    - pyjwt: ">=2.13.0,<3.0.0"              # JWT token processing - auth bypass risks
    - pynacl: ">=1.5.0,<2.0.0"              # Cryptographic library - key extraction risks
    
    # Cryptography & Encryption
    - cryptography: ">=48.0.0,<50.0.0"      # TLS/encryption - private key extraction risks
    - pyopenssl: ">=26.0.0,<27.0.0"         # SSL/TLS wrapper - connection security
    
    # HTTP Security
    - urllib3: ">=2.7.0,<3.0.0"             # Connection pooling - SSL bypass risks
    
    # Build System Security
    - wheel: ">=0.46.2,<1.0.0"              # Python packaging - code execution during build
    - setuptools: ">=78.1.1,<82"            # Package metadata - potential injection vectors

javascript:
  security_core:
    # Authentication
    - "@types/jsonwebtoken": ">=9.0.0"      # JWT type definitions
    
    # Cryptography
    - "tweetnacl": ">=1.0.0"                # JavaScript NaCl implementation

rust:
  security_core:
    # Cryptography
    - "pyo3": "=0.24.1"                     # Python interop - FFI safety
    - "cryptographic libraries": "TBD"
```

---

## Tier 2: Framework Dependencies (🟡 Controlled Minor Updates)
**Pinning Strategy**: `~=X.Y` (patch and minor updates, e.g., 1.2.3 → 1.5.8 allowed, but NOT 2.0.0)

**Rationale**:
- Provides security patch flexibility while preventing major breaking changes
- Framework changes between minor versions are typically additive/backward-compatible
- Reduces maintenance burden vs. pinning to specific patch versions
- Still requires monitoring for CVE announcements and patch releases

**Packages in Tier 2**:

```yaml
python:
  framework:
    # Web Framework
    - fastapi: "~=0.110"                    # HTTP API framework - moderate security impact
    - starlette: "~=0.37"                   # ASGI framework - connection/routing security
    - flask: "~=3.0"                        # Alternative web framework if used
    
    # Data Serialization
    - pydantic: "~=2.4"                     # Data validation - injection vulnerability surface
    - pyyaml: "~=6.0"                       # YAML parsing - deserialization attacks (YAML bombs)
    - marshmallow: "~=3.7"                  # Object serialization
    
    # Template Engine
    - jinja2: "~=3.1"                       # HTML templating - template injection surface
    
    # Request Processing
    - requests: "~=2.32"                    # HTTP client library - connection security
    
    # Configuration
    - hydra-core: "==1.3.2"                 # Hydra config management - exact pin for consistency
    - omegaconf: "~=2.3"                    # Configuration handling
    
    # CLI Support
    - click: "~=8.1"                        # CLI framework - command processing
    - typer: "~=0.12"                       # Modern CLI framework
    
    # Code Analysis (for Codex features)
    - libcst: "~=1.0"                       # AST transformation library
    - parso: "~=0.8"                        # Python parser library
    - radon: "~=6.0"                        # Code metrics/complexity

javascript:
  framework:
    - "@vitejs/plugin-react": "~=4.2"       # Vite React plugin
    - "react": "~=18.2"                     # React framework
    - "react-dom": "~=18.2"                 # React DOM rendering
    - "typescript": "~=5.2"                 # TypeScript compiler
    - "vite": "~=5.0"                       # Build tool
    - "express": "~=4.18"                   # Node.js web framework (copilot/extension)
```

---

## Tier 3: Utility Dependencies (🟢 Flexible Updates)
**Pinning Strategy**: `^X.Y.Z` (allow minor+patch updates, e.g., 1.2.3 → 1.8.9 allowed, but NOT 2.0.0)

**Rationale**:
- These are non-critical utilities with lower impact on security/stability
- Allows developers to pull in security patches and bug fixes automatically
- Breaking changes are typically limited to major version bumps
- Reduces dependency lock maintenance overhead

**Packages in Tier 3**:

```yaml
python:
  utility:
    # Development & Testing
    - pytest: "^7.0"                        # Test runner
    - pytest-cov: "^4.0"                    # Coverage plugin
    - black: "^23.0"                        # Code formatter
    - ruff: "^0.1"                          # Linter
    - mypy: "^1.0"                          # Type checker
    - pre-commit: "^3.0"                    # Git hooks
    
    # Logging & Monitoring
    - loguru: "^0.7"                        # Logging library
    - structlog: "^23.0"                    # Structured logging
    
    # Data Processing
    - numpy: "^1.24"                        # Numerical computing
    - pandas: "^2.0"                        # Data frames (if used)
    - polars: "^0.19"                       # High-performance data frames
    
    # Machine Learning (Codex-specific)
    - torch: ">=2.3.0"                      # PyTorch (special handling - see note below)
    - transformers: "^4.30"                 # Hugging Face transformers
    - scikit-learn: "^1.3"                  # Scikit-learn ML toolkit
    
    # Utilities
    - python-dotenv: "^1.0"                 # .env file loader
    - pydantic-settings: "~=2.14"           # Pydantic configuration management (could be Tier 2)
    - tqdm: "^4.66"                         # Progress bars
    - colorama: "^0.4"                      # Terminal colors
    - attrs: "^23.0"                        # Class decorators

javascript:
  utility:
    - "eslint": "^8.0"                      # JavaScript linter
    - "prettier": "^3.0"                    # Code formatter
    - "@types/node": "^20.0"                # Node.js types
    - "axios": "^1.6"                       # HTTP client (if used)
    - "lodash": "^4.17"                     # Utility library
    - "dotenv": "^16.0"                     # .env loader
    - "uuid": "^9.0"                        # UUID generation
    - "vitest": "^0.34"                     # Test framework
    - "playwright": "^1.40"                 # E2E testing

rust:
  utility:
    - "tokio": "~=1.36"                     # Async runtime
    - "serde": "~=1.0"                      # Serialization
    - "anyhow": "~=1.0"                     # Error handling
    - "rayon": "~=1.8"                      # Data parallelism
    - "criterion": "^0.5"                   # Benchmarking
```

