# Special Cases & Exceptions

## torch (PyTorch) - Special Handling
**Current Constraint**: `>=2.3.0` (upper bound intentionally omitted)

**Rationale**:
- PyTorch 2.3.0+ is required for specific Model optimization features in Codex
- torch has different versioning semantics (major.minor release cycles)
- Often requires binary compatibility with CUDA/cudnn at system level
- Machine learning updates often require end-to-end retraining/validation

**Policy**:
- Allow 2.3.x, 2.4.x, 2.5.x releases
- Manual review required before upgrading to 3.0.0 or major version bump
- Keep separate from other dependency updates in CI/CD (may require GPU/extended test time)

