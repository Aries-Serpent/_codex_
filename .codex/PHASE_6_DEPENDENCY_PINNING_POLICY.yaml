# Enforcement Mechanisms

## CI/CD Checks
1. **Pre-commit Hook**: Validate pinning format matches tier classification
2. **PR Check**: Alert if Tier 1 package versions modified without security justification
3. **Dependabot Configuration**: Automatically group updates by tier (see `.codex/PHASE_6_DEPENDENCY_AUTO_UPGRADE_CONFIG.yaml`)

## Review Process

**Tier 1 Updates** (Manual):
1. Security team reviews CVE details
2. Tests run to validate no breaking changes
3. Approval required before merge (blocking CR)

**Tier 2 Updates** (Dependabot Auto-PR):
1. Dependabot creates PR with changeset
2. CI must pass (tests + linting)
3. Manual review for compatibility assessment
4. Auto-merge if CI passes + no manual concerns

**Tier 3 Updates** (Dependabot Auto-Merge):
1. Dependabot creates PR
2. CI must pass
3. Auto-merge after 4 hours if all checks green

