# Application Guidelines

## For pyproject.toml (Python)

**Core Security - Tier 1**:
```toml
[project]
dependencies = [
    "cryptography>=48.0.0,<50.0.0",    # Tier 1: Strict patch pinning
    "PyJWT>=2.13.0,<3.0.0",            # Tier 1: Strict patch pinning
]

[build-system]
requires = [
    "setuptools>=78.1.1,<82",          # Tier 1: Build-time security
    "wheel>=0.46.2",                   # Tier 1: Exact constraint for security
]
```

**Framework - Tier 2**:
```toml
[project]
dependencies = [
    "fastapi~=0.110",                  # Tier 2: Minor+patch updates allowed
    "pydantic~=2.4",                   # Tier 2: Minor+patch updates allowed
    "jinja2~=3.1",                     # Tier 2: Minor+patch updates allowed
]
```

**Utility - Tier 3**:
```toml
[project]
dependencies = [
    "numpy^1.24",                      # Tier 3: Flexible minor+patch updates
    "scikit-learn^1.3",                # Tier 3: Flexible minor+patch updates
]
```

## For package.json (Node.js)

**Core Security - Tier 1**:
```json
{
  "dependencies": {
    "@types/jsonwebtoken": "^9.0.0",  // Tier 1: At least 9.0.0
    "crypto-js": "^4.1.1"              // Tier 1: Cryptography
  }
}
```

**Framework - Tier 2**:
```json
{
  "dependencies": {
    "express": "~4.18",                // Tier 2: Minor+patch updates
    "react": "~18.2",                  // Tier 2: Minor+patch updates
    "typescript": "~5.2"               // Tier 2: Minor+patch updates
  }
}
```

**Utility - Tier 3**:
```json
{
  "devDependencies": {
    "eslint": "^8.0",                  // Tier 3: Flexible updates
    "prettier": "^3.0",                // Tier 3: Flexible updates
    "vitest": "^0.34"                  // Tier 3: Flexible updates
  }
}
```

