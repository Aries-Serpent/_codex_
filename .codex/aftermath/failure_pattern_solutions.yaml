  # ── _repo_root / path robustness ──────────────────────────────────────────

  - pattern_id: RP-REPO-ROOT-ORDER
    display_name: "Module-level constant calls function defined later (NameError)"
    category: python
    occurrences: 1
    fix_success_rate: 1.0
    root_cause: >
      `_DEFAULT_AGENTS_ROOT = _repo_root() / ".github" / "agents"` was placed at
      module level BEFORE the `_repo_root()` function definition. Python executes
      module-level code top-to-bottom, so this raises `NameError: '_repo_root' is
      not defined` on import.
    fix_template: |
      # Move the function definition BEFORE any module-level call to it.
      # In doc_loader.py: move _repo_root() before _DEFAULT_AGENTS_ROOT assignment.
    verification_cmd: "python -c 'from codex.skills.doc_loader import load_agent_docs_as_skills; print(\"OK\")'"
    affected_workflows:
      - "Validation Pipeline"
    last_session: S283
    last_seen: "2026-04-02T18:54Z"
