    display_name: "Unused import (ruff F401)"
    category: python
    occurrences: 8
    fix_success_rate: 1.0
    root_cause: >
      An import statement is present but the name is never referenced in the module.
      The pre-merge-validation workflow runs `ruff check` with F401 enabled and
      fails if unused imports are found.
    fix_template: |
      # Auto-fix with ruff:
      python -m ruff check --fix --select F401 <file_or_dir>

      # Or run the full auto-fix pipeline:
      python scripts/ci/auto_fix_common_issues.py --pattern 1
    verification_cmd: "python -m ruff check --select F401 tests/skills/ tests/test_fast_forward_safe_files.py"
    affected_workflows:
      - "Auto-Fix Common CI Issues"
      - "PR Auto-Fix Check"
      - "Pre-Merge Validation"
    last_session: S283
    last_seen: "2026-04-02T17:09Z"
    notes: "Recurring in test files: test_browse_command.py (Path), test_candidate_skills.py (pytest), test_fast_forward_safe_files.py (pytest)."

  - pattern_id: RP-UNSORTED-IMPORT
    display_name: "Unsorted imports (ruff I001)"
    category: python
    occurrences: 4
    fix_success_rate: 1.0
    root_cause: >
      Import statements are not in isort-canonical order. ruff I001 flags this when
      imports are not alphabetically sorted within each group.
    fix_template: |
      python -m ruff check --fix --select I001 <file>
      # Or via pipeline:
      python scripts/ci/auto_fix_common_issues.py --pattern 9
    verification_cmd: "python -m ruff check --select I001 tests/skills/ tests/test_fast_forward_safe_files.py"
