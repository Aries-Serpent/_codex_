solutions:

  # ── Shell / Workflow patterns ──────────────────────────────────────────────

  - pattern_id: RP-SC2089
    display_name: "SC2089/SC2090 Bash array quoting"
    category: shell
    occurrences: 4
    fix_success_rate: 1.0
    root_cause: >
      Optional CLI argument groups built as shell strings are word-split on expansion.
      Quotes/backslashes in the variable are not respected (SC2089); when the variable
      is expanded unquoted, glob characters can execute unintended expansions (SC2090).
    fix_template: |
      # Before (broken):
      FILES_ARG=""; [ -n "$FILES" ] && FILES_ARG="--files $FILES"
      cmd $FILES_ARG

      # After (correct — Bash arrays):
      FILES_ARG=()
      if [ -n "$FILES" ]; then
        read -ra _FL <<< "$FILES"
        FILES_ARG=(--files "${_FL[@]}")
      fi
      cmd "${FILES_ARG[@]}"
    verification_cmd: "actionlint .github/workflows/workflow-execution-gate.yml"
    affected_workflows:
      - "Workflow Compliance Audit (actionlint)"
      - "fast-forward-safe-files.yml"
      - "workflow-execution-gate.yml"
    last_session: S283
    last_seen: "2026-04-02T18:54Z"
    notes: "Fixed in S281 (fast-forward-safe-files.yml) and S283 (workflow-execution-gate.yml fast-forward job)."

  - pattern_id: RP-DUPLICATE-ENV
    display_name: "Duplicate env: key in workflow step"
    category: workflow
    occurrences: 1
    fix_success_rate: 1.0
    root_cause: >
      A workflow step has two separate `env:` blocks. actionlint rejects duplicate
      YAML keys because the second silently overwrites the first.
    fix_template: |
      # Before (broken — two env: blocks in same step):
      - name: My step
        env:
          FOO: bar
        run: ...
        env:               # duplicate — invalid!
          BAZ: qux

      # After (correct — single env: block):
      - name: My step
        env:
          FOO: bar
          BAZ: qux
        run: ...
    verification_cmd: "actionlint .github/workflows/workflow-execution-gate.yml"
    affected_workflows:
      - "workflow-execution-gate.yml"
    last_session: S281
    last_seen: "2026-04-02T16:27Z"

  # ── Python type-check patterns ─────────────────────────────────────────────

  - pattern_id: RP-MYPY-UNUSED-IGNORE
    display_name: "mypy unused type: ignore comment"
    category: python
    occurrences: 3
    fix_success_rate: 1.0
    root_cause: >
      A `# type: ignore[X]` comment is present on a line that no longer triggers
      that mypy error. This happens when: (a) the error is fixed but the comment
      is not removed, or (b) `--ignore-missing-imports` is active and the import
      falls back to `Any`, making the annotation valid without the ignore.
    fix_template: |
      # Remove the unused comment. Example:
      # Before:
      _PkgVersion = None  # type: ignore[assignment,misc]
      # After:
      _PkgVersion = None  # type: ignore[assignment]
      # Or fully remove if no type error remains.

      # Systematic sweep:
      python -m mypy src/ --no-error-summary 2>&1 | grep "unused-ignore"
    verification_cmd: "python -m mypy src/ --no-error-summary 2>&1 | tail -3"
    affected_workflows:
      - "mypy Baseline (Type-Check Anti-Regression)"
    last_session: S281
    last_seen: "2026-04-02T16:27Z"

  - pattern_id: RP-MYPY-LITERAL
    display_name: "mypy arg-type: str where Literal expected"
    category: python
    occurrences: 2
    fix_success_rate: 1.0
    root_cause: >
      A function parameter typed as `Literal["ok", "error"]` receives a plain `str`
      annotation at the call site. mypy reports `arg-type` because str is not a subtype
      of the Literal type.
    fix_template: |
      # Add Literal to imports and narrow the annotation:
      from typing import Literal

      # Before:
      def run(self, status: str = "ok") -> dict: ...
      # After:
      def run(self, status: Literal["ok", "error"] = "ok") -> dict: ...
    verification_cmd: "python -m mypy src/codex/skills/telemetry.py --no-error-summary"
    affected_workflows:
      - "mypy Baseline (Type-Check Anti-Regression)"
    last_session: S281
    last_seen: "2026-04-02T16:27Z"

  # ── Security patterns ──────────────────────────────────────────────────────

  - pattern_id: RP-ZIP-SLIP
    display_name: "Zip Slip path traversal in ZipFile.extractall()"
    category: security
    occurrences: 1
    fix_success_rate: 1.0
    root_cause: >
      `ZipFile.extractall(tmp)` does not validate member paths. A crafted archive
      containing `../../../etc/passwd` as a member name will extract outside the
      target directory, enabling arbitrary file write (Zip Slip, CWE-22).
    fix_template: |
      with zipfile.ZipFile(archive_path) as zf:
          for member in zf.infolist():
              member_path = (tmp / member.filename).resolve()
              if not str(member_path).startswith(str(tmp.resolve())):
                  raise ValueError(
                      f"Zip Slip detected: '{member.filename}' "
                      "would extract outside target dir"
                  )
          zf.extractall(tmp)
    verification_cmd: "python -m pytest tests/skills/test_compression.py -v"
    affected_workflows:
      - "code-scanning-remediation-agent"
    last_session: S283
    last_seen: "2026-04-02T18:54Z"
    notes: "Fixed in src/codex/skills/compression.py install_skill() in S283."

