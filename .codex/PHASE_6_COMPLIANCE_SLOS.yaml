# ============================================================================
# SLO ESCALATION PROCEDURES
# ============================================================================
escalation_procedures:
  
  # Escalation Path for CRITICAL SLO Breaches
  critical_breach:
    trigger_condition: "Any CRITICAL SLO violation"
    escalation_steps:
      t_0_minutes:
        action: "Alert triggered (automated)"
        notification:
          - "SMS: CISO, CCO, On-call Security Engineer"
          - "Slack: #security-incidents (auto-post)"
          - "PagerDuty: Page on-call incident commander"
      
      t_15_minutes:
        action: "Initial incident assessment"
        owner: "On-call Incident Commander"
        notification:
          - "If no response: Escalate to CISO directly"
      
      t_30_minutes:
        action: "CISO joins incident response"
        owner: "CISO"
        notification:
          - "If CISO unavailable: Page CISO backup"
      
      t_1_hour:
        action: "Executive notification"
        owner: "CISO"
        notification:
          - "CCO, CEO (if major breach)"
          - "General Counsel (for legal implications)"
      
      t_4_hours:
        action: "Status update & escalation decision"
        owner: "CISO + CCO"
        decision_points:
          - "Does this meet regulatory breach criteria?"
          - "Is external notification required? (72-hour SLA)"
          - "Board notification needed?"
      
      t_24_hours:
        action: "Post-incident review"
        owner: "CISO + Team"
        requirements:
          - "Root cause analysis"
          - "Remediation plan"
          - "Incident documentation in audit trail"
    
    documentation:
      required_fields:
        - "Incident ID (unique)"
        - "Severity level"
        - "Timeline of events"
        - "Root cause"
        - "Remediation steps"
        - "Preventative measures"
        - "Assigned owner"
        - "Target resolution date"
      
      location: ".codex/incidents/incident_<ID>.json"
  
  # Escalation Path for HIGH SLO Breaches
  high_breach:
    trigger_condition: "Any HIGH SLO violation"
    escalation_steps:
      t_0_minutes:
        action: "Alert triggered"
        notification:
          - "Email: CISO, Compliance Team"
          - "Slack: #compliance-team"
      
      t_1_hour:
        action: "Incident created & assigned"
        owner: "Compliance Lead"
      
      t_4_hours:
        action: "Status update"
        owner: "Assigned team"
      
      t_24_hours:
        action: "Resolution plan due"
        owner: "Team lead + CISO"
    
    sla_resolution: "Within 5 business days"
  
  # Escalation Path for MEDIUM SLO Breaches
  medium_breach:
    trigger_condition: "Any MEDIUM SLO violation"
    escalation_steps:
      t_0_minutes:
        action: "Alert triggered"
        notification:
          - "Dashboard alert (no email)"
      
      t_1_day:
        action: "Incident created"
        owner: "Team member"
      
      t_2_days:
        action: "Status update"
        owner: "Assigned team"
    
    sla_resolution: "Within 10 business days"

