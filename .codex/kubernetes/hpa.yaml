# Kubernetes Horizontal Pod Autoscaler for Aries-Serpent API
# Autoscaling based on CPU utilization (70% target)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aries-serpent-api-hpa
  namespace: default
  labels:
    app: aries-serpent
    component: api
    version: 0.1.0-final
  annotations:
    description: "Horizontal autoscaler for Aries-Serpent API pods"
    owner: "DevOps Team"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aries-serpent-api
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
