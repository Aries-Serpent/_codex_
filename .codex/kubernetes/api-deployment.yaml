# Kubernetes Deployment for Aries-Serpent API Server
# Production-grade deployment with 3 replicas, resource limits, and health checks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aries-serpent-api
  namespace: default
  labels:
    app: aries-serpent
    component: api
    version: 0.1.0-final
  annotations:
    description: "Aries-Serpent FastAPI inference server"
    owner: "DevOps Team"
    last-updated: "2026-07-09"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aries-serpent
      component: api
  template:
    metadata:
      labels:
        app: aries-serpent
        component: api
        version: 0.1.0-final
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aries-serpent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        readOnlyRootFilesystem: true
      containers:
      - name: api
        image: aries-serpent:0.1.0-final-api
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: aries-serpent-config
              key: log_level
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: aries-serpent-config
              key: cors_origins
        - name: API_TIMEOUT
          value: "30"
        - name: WORKERS
          value: "4"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: cache
          mountPath: /app/cache
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - aries-serpent
                - key: component
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
