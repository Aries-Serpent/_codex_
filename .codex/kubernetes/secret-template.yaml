# Kubernetes Secret Template for Aries-Serpent
# TEMPLATE ONLY - populate with actual secrets using kubectl
# DO NOT COMMIT ACTUAL SECRETS TO REPOSITORY

# Instructions for creating the secret:
# 1. Create file: aries-serpent-secrets.env with:
#    API_KEY=your-api-key-here
#    DATABASE_URL=******host:5432/db
#    MODEL_SIGNING_KEY=your-signing-key
#    JWT_SECRET=your-jwt-secret
#
# 2. Create secret: kubectl create secret generic aries-serpent-secrets --from-env-file=aries-serpent-secrets.env -n default
#
# 3. Verify: kubectl get secret aries-serpent-secrets -n default -o yaml

apiVersion: v1
kind: Secret
metadata:  # pragma: allowlist secret  # pragma: allowlist secret  # pragma: allowlist secret  # pragma: allowlist secret  # pragma: allowlist secret  # pragma: allowlist secret
  name: aries-serpent-secrets
  namespace: default
  labels:
    app: aries-serpent
    version: 0.1.0-final
  annotations:
    description: "Aries-Serpent sensitive secrets (API keys, credentials)"
    owner: "DevOps Team"
    warning: "DO NOT COMMIT ACTUAL SECRET VALUES"
type: Opaque
stringData:
  # API Authentication
  api_key: "REPLACE_WITH_ACTUAL_API_KEY"
  
  # Database credentials
  database_url: "REPLACE_WITH_ACTUAL_DATABASE_URL"
  
  # JWT and security
  jwt_secret: "REPLACE_WITH_ACTUAL_JWT_SECRET"
  jwt_algorithm: "HS256"
  
  # Model signing
  model_signing_key: "REPLACE_WITH_ACTUAL_SIGNING_KEY"
  
  # Optional: encryption keys
  encryption_key: "REPLACE_WITH_ACTUAL_ENCRYPTION_KEY"
  
  # Optional: external service credentials
  external_api_key: "REPLACE_WITH_EXTERNAL_API_KEY"
---
# Example usage in Deployment:
# env:
# - name: API_KEY
#   valueFrom:
#     secretKeyRef:
#       name: aries-serpent-secrets
#       key: api_key
# - name: DATABASE_URL
#   valueFrom:
#     secretKeyRef:
#       name: aries-serpent-secrets
#       key: database_url
