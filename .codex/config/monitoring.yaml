# Monitoring Configuration for Autonomous Artifact Monitor
# Version: 1.1.0
# Last Updated: 2026-05-24 (Phase 10 continued)

# Monitoring behavior
monitoring:
  # Polling interval (cron schedule in workflow)
  schedule: "0 */3 * * *"  # Every 3 hours

  # Workflow selection patterns
  workflows:
    # Include patterns (glob-style: *, ?, etc.)
    # Empty list or ['*'] = monitor all workflows
    include_patterns:
      - '*'
    # Exclude patterns (checked first, takes precedence)
    exclude_patterns: []

  # Failure detection thresholds and rate limiting
  failure_detection:
    consecutive_failures_threshold: 2  # Create issue after N consecutive failures
    rate_limit_margin: 500  # Reserve buffer for API rate limit

  # Recovery threshold
  recovery_threshold: 3  # Close issue after N consecutive successes

  # Flakiness detection
  flakiness:
    enabled: true
    window_size: 20  # Look at last N runs
    threshold: 0.15  # 15% failure rate indicates flakiness
    min_runs: 5  # Minimum runs before analyzing flakiness

  # Rate limit handling (additional settings)
  rate_limit:
    requests_per_hour: 5000  # GitHub API limit
    buffer: 500  # Reserve buffer
    backoff_multiplier: 2  # Exponential backoff multiplier
    max_retries: 3

# Issue management
issues:
  # Deduplication window (hours)
  deduplication_window: 24

  # Issue labels
  labels:
    workflow_failure: "workflow:failure"
    auto_created: "auto:monitor"
    flaky_test: "test:flaky"
    dependency_issue: "deps:conflict"
    security_issue: "security:alert"
    coverage_issue: "coverage:low"

  # Issue assignment (empty = no auto-assignment)
  auto_assign: []

  # Close stale issues after N days of recovery
  close_after_recovery_days: 1

# Pattern recognition
patterns:
  # Confidence threshold for pattern matching (0.0-1.0)
  confidence_threshold: 0.6

  # Pattern database location
  signature_file: ".codex/monitoring/patterns/error_signatures.yaml"

  # Pattern categories with weights
  categories:
    dependency: 1.0
    test: 1.0
    build: 0.9
    coverage: 0.8
    lint: 0.7
    infrastructure: 0.9
    security: 1.0
    documentation: 0.6

# Agent orchestration
agents:
  # Confidence threshold for agent routing (0.0-1.0)
  routing_threshold: 0.7

  # Agent routing map (category -> agent)
  routing:
    test: "ci-testing-agent"
    dependency: "dependency-conflict-agent"
    coverage: "coverage-gapfill-agent"
    security: "security-agent"
    lint: "repository-hygiene-agent"
    documentation: "documentation-quality-agent"

  # Multi-agent orchestration
  enable_multi_agent: true
  max_agents_per_failure: 3

# State persistence
state:
  # Local state file
  file: ".codex/monitoring/state/monitor_state.json"

  # GitHub Actions artifact (for persistence across runs)
  artifact_name: "artifact-monitor-state"
  artifact_retention_days: 90

  # Backup frequency (runs)
  backup_frequency: 1

# Cognitive Brain integration (Phase 6)
cognitive_brain:
  enabled: true  # Phase 6 integration enabled (2026-05-24)
  sensor_module: "scripts/cognitive/sensors/monitoring_sensor.py"
  confidence_threshold: 0.8
  auto_fix_enabled: false  # Requires human approval

  # Phase 8a threshold configuration (hot-reloaded by sensor/actions modules)
  thresholds:
    severity_threshold: 0.8
    consecutive_threshold: 3
    confidence_threshold: 0.8
    per_workflow_overrides: {}

  # Phase 10 coverage regression gate (updated 2026-05-24)
  coverage:
    agents_floor_pct: 34           # Phase 9.4 exit baseline (rounded to match threshold file) — any drop blocks merge
    agents_floor_exact: 34.56      # Exact measured value from Phase 9.4
    full_stack_fail_under: 80      # pyproject.toml fail_under (full deps CI only)
    phase10_target_pct: 50         # 10B target: overall statement coverage
    phase10_new_test_modules: 6    # 10B: knowledge_distiller, context_compressor, safety_guards, rl_algorithms, qec_k1_tuning, transfer_learning_scaffold
    threshold_file: ".github/coverage_threshold.txt"  # Uses rounded value (34) for enforcement

  # Phase 10D QEC k₁ tuning thresholds
  qec:
    k1_initial: 0.40              # Starting k₁ value
    k1_target: 0.35               # Regression guard boundary (≤ 0.35)
    k1_formula: "0.40 * (1 - (accuracy - 0.5) * 0.2)"
    scoring_weights:
      compliance: 0.38            # Phase 8.0 optimized
      risk: 0.32
      cost: 0.15
      impact: 0.15

  # Phase 10E operational targets
  ops:
    copilot_session_ttl_target_seconds: 3600   # Target: reduce from 43200 (12h) to 3600 (1h)
    webhook_deployment_status: "blocked"        # Requires WEBHOOK_RECEIVER_URL + WEBHOOK_SECRET
    t03_security_events_scope: "pending_admin"  # CODEX_MASTER_KEY needs security_events:read

# Logging and reporting
logging:
  level: "INFO"
  file: ".codex/monitoring/logs/monitor.log"
  max_file_size_mb: 10
  backup_count: 5

# Dry-run mode (testing)
dry_run:
  enabled: false  # Set to true via CLI/workflow for testing
  log_actions: true
  skip_issue_creation: true

# Feature flags
features:
  meta_monitoring: true  # Create issue if monitoring workflow fails
  secret_scrubbing: false  # PII scrubbing (Phase 6)
  auto_remediation: false  # Autonomous fixes (Phase 6)
  metrics_collection: true
