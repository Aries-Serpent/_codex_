lessons:
  - title: "Coverage scope dilution: --cov=src vs --cov=src/codex/rag"
    outcome: >
      When test-rag.yml uses --cov=src, coverage.xml line-rate is measured across
      ALL of src/ (50k+ lines) but only RAG tests run → ~5% aggregate rate. Fix:
      use --cov=src/codex/rag + --cov-config=tests/rag/.coveragerc (dedicated config
      prevents global .coveragerc source=src from being merged). This pattern (COV_001)
      is now in ci_failure_patterns.yaml.

  - title: "pytest-cov --cov vs .coveragerc source interaction"
    outcome: >
      Coverage(source=['src/codex/rag']) in pytest-cov overrides .coveragerc source=src
      ONLY when --cov-config is NOT the global .coveragerc. If the global .coveragerc
      is loaded, its [run] source may be combined. Using --cov-config=tests/rag/.coveragerc
      (a dedicated file) prevents this interaction entirely.

  - title: "detect-secrets baseline version must match pre-commit hook pin"
    outcome: >
      detect-secrets v1.5.0 (system) writes baselines with version:1.5.0. Pre-commit
      hooks pinned at v1.4.0 may fail to parse a v1.5.0 baseline. Pattern COV_002:
      always check .pre-commit-config.yaml rev: against .secrets.baseline version field
      after any detect-secrets run. Fix: sed -i 's/"version": "1.5.0"/"version": "1.4.0"/'
      .secrets.baseline.

  - title: "PR comment dedup: SHA tag inside body vs upsert key"
    outcome: >
      To track per-commit scan status without creating new comments, embed
      <!-- ci-review-scanned:{sha_short} --> INSIDE the comment body. Keep the PR-scoped
      <!-- ci-rescue:{pr_number} --> as the upsert key. This gives agents per-commit
      staleness visibility via comment body inspection while keeping exactly 1 rescue
      comment per PR.

  - title: "Paginated comment search for PRs with >100 comments"
    outcome: >
      GitHub's issues.listComments API returns max 100 per page. A single
      github.rest.issues.listComments({per_page:100}) call misses comments if PR has
      >100 comments. Fix: while loop with page++ until batch.length < 100 or marker found.
      This is now in comment-review-gate.yml rescue-comment step.

  - title: "YAML multiline BODY= assignment trips actionlint"
    outcome: >
      BODY="...\n..." assignments that span multiple lines in YAML strings can confuse
      actionlint's YAML parser (Pattern 20). Fix: printf '%s\n' line1 line2 > ${RUNNER_TEMP}/file.txt
      then BODY=$(cat file.txt). This avoids embedded newlines in YAML double-quoted strings.

  - title: "PR dashboard 90→100: test/quality gate = RAG Module Tests"
    outcome: >
      The 10-point gap from 90→100 on the PR status dashboard was entirely the
      Test/quality gate (10%). Root cause: RAG Module Tests failure on main.
      Scope fix (--cov-config) resolves the gate. Pattern: always check dashboard
      score breakdown to identify the exact weighted component causing the gap.

decisions:
  - what: "Omit benchmarks/, analytics/, and llamacpp/ollama/gpt4all providers from RAG coverage"
    why: >
      These modules require binary services (llama binaries, ollama daemon, gpt4all models)
      or a running database (analytics/metrics_db.py) that are not available in the CI
      Ubuntu runner. Omitting them gives a coverage metric that reflects testable code only.
    tradeoff: "True coverage of providers is unknown; manual review required for those modules"

  - what: "SHA tag inside comment body, not as upsert key"
    why: >
      Using SHA as the upsert key (<!-- ci-rescue:{pr_number}:{sha} -->) would create
      a new comment for every commit push, flooding the PR with noise. PR-scoped key
      with embedded SHA tag gives staleness information without proliferating comments.
    tradeoff: "If a stale checklist is never overwritten (e.g. same SHA pushed twice), the SHA tag is identical"

  - what: "COV_001/COV_002 added to ci_failure_patterns.yaml (not just accountability report)"
    why: >
      The patterns file is machine-readable and consumed by ci_rescue.py pattern matching.
      Adding coverage-related patterns enables automated detection and guided resolution
      in future CI failure triage runs.
    tradeoff: "ci_rescue.py does not yet have handlers for COV_001/COV_002 auto-fix (manual fix required)"

