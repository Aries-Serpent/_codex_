lessons:
- title: Bot-skip-ci auto-merge prevents spurious REQ-10 blocks
  outcome: "Five scheduled workflows commit [skip ci] metadata to main every 2\u2013\
    24h; implementing all_skip_ci_bot_commits() + Merges API auto-merge in branch_rebase_check.py\
    \ eliminates the REQ-10 divergence cycle without human intervention"
- title: PIPESTATUS masking in piped commands silently drops exit codes
  outcome: cmd | tee always exits 0; must use explicit if [ "${PIPESTATUS[0]}" -ne
    0 ] block so fallback logic actually fires in iterative-self-healing-ci.yml
- title: REQ-11 integration-branch guard requires both hard-block and redirect
  outcome: 'Blocking a direct Copilot session on 0D_base_ requires: (1) core.setFailed
    in cognitive-preflight, (2) needs: chain blocking activate-delegation, AND (3)
    rich redirect comment with Option A/B and copilot-session-chain.yml dispatch command'
- title: workflow_run triggers only resolve from default branch
  outcome: copilot-review-responder.yml and copilot-agent-session-done.yml only fire
    once cherry-picked to main; any workflow using workflow_run must be on main to
    work
- title: Unused import bindings in test conftest can fail lint despite side-effect
    intent
  outcome: Using importlib.import_module() instead of a bare import statement preserves
    shard-isolation side-effects without creating a lint-visible unused binding
