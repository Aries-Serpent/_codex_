# Prompt Registry
# Central inventory of all system, task, continuation, and domain prompts.
#
# Blueprint: .codex/docs/AUTONOMY_BLUEPRINT.md — Phase 4
# Schema version: 1.0.0
#
# Fields per entry:
#   prompt_id         — unique identifier  (kebab-case)
#   path              — source file relative to repo root
#   type              — system | task | continuation | domain
#   risk_class        — READ_ONLY | ADVISORY_WRITE | REPO_STATE_WRITE | INFRA_WRITE
#   consumers         — list of surface IDs / workflow files that use this prompt
#   owner             — accountable maintainer
#   version           — semantic or date version string
#   approved_for_modes — list of autonomy modes in which this prompt may run
#   description       — one-line human summary
#
# CI validation: python -m codex.autonomy.prompt_registry --validate

schema_version: "1.0.0"

prompts:

  # ── System prompts ───────────────────────────────────────────────────────

  - prompt_id: system-copilot-agent
    path: .github/copilot-prompts/system/copilot_agent_system_prompt.md
