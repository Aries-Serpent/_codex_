# Agent configuration skeleton (pre-token)
#
# IMPORTANT: This configuration has autonomous actions DISABLED by default.
# Human admin must review and enable after Genesis Protocol completion.

agent:
  name: ai_org_repo_admin
  version: "0.0.0-template"
  repository_id: "1040037790"
  organization: "Aries-Serpent"
  
  # HUMAN: Set to true only AFTER Genesis and secrets are verified
  autonomous_actions_enabled: false
  
  allowed_operations:
    - maintenance
    - testing
    - documentation
  
  escalation_policy:
    security: escalate
    config_changes: escalate
    dependency_updates: approval_required
    refactoring: approval_required

runtime:
  network_mode: isolated
  isolated_path: "/codex/network/isolated"
  log_level: "INFO"
  audit_retention_days: 90

security:
  # HUMAN: These placeholders must be replaced with actual secrets in GitHub repository settings
  master_key_placeholder: "<<HUMAN: inject CODEX_MASTER_KEY as repo secret>>"
  webhook_secret_placeholder: "<<HUMAN: inject CODEX_WEBHOOK_SECRET as repo secret>>"
  backup_key_placeholder: "<<HUMAN: inject CODEX_BACKUP_KEY as repo secret (optional)>>"
  
  # Token rotation schedule
  token_rotation_days: 90
  rotation_reminder_days: 14

guardrails:
  max_pr_per_day: 5
  require_human_approval:
    - security_changes
    - configuration_changes
    - secret_operations
  
  forbidden_operations:
    - rotate_secrets
    - expose_secrets
    - delete_branches
    - force_push

monitoring:
  enable_telemetry: true
  report_interval_hours: 24
  alert_on_escalation: true

# Human admin instructions:
# 1. Create CODEX_MASTER_KEY in repository Secrets (Settings → Secrets and variables → Actions)
# 2. Review .codex/guardrails.md for policy details
# 3. Remove 'if: false' guard in .github/workflows/genesis-bootstrap.yml
# 4. Execute genesis-bootstrap workflow with genesis_validation=true
# 5. After successful validation, set autonomous_actions_enabled: true (above)
