[mutmut]
source_paths = agents/agent_memory.py
pytest_add_cli_args_test_selection = tests/agents/test_agent_memory.py tests/agents/test_agent_memory_comprehensive.py tests/agents/test_agent_memory_mutation_killers.py -v --tb=short
test_time_multiplier = 3.0
test_time_base = 5.0
timeout = 30

exclude_patterns =
    __pycache__
    *.pyc
    */tests/*
    *_test.py
    conftest.py

# Focus on logic-critical mutations
mutation_types = keyword,operator,string,number,literal,dict
