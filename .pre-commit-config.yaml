repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: "^mkdocs\\.yml$|^.codex/reports/.*\\.yml$|^.codex/patterns/.*\\.yaml$|^.github/agents/.*\\.yml$|^.github/agents/.*\\.yaml$|^.github/actions/doc-test-scribe-action/action\\.yml$|^.github/docs/PR_2207_CI_CD_VALIDATION_ARTIFACTS\\.yaml$|^tests/fixtures/malformed_config\\.yaml$|^k8s/monitoring/agent_dashboard\\.yaml$"
      - id: check-added-large-files
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "bandit.yaml", "-r", "src", "training", "-lll"]
        pass_filenames: false
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--no-verify", "--baseline", ".secrets.baseline"]
  # Security scanning: pip-audit for dependency vulnerabilities
  - repo: https://github.com/pypa/pip-audit
    rev: v2.6.1
    hooks:
      - id: pip-audit
        name: pip-audit (dependency vulnerability scan)
        args: ["--desc", "--skip-editable"]
        # Note: May require requirements files to be present
        # Run manually with: pre-commit run pip-audit --all-files

  # Security scanning: gitleaks for secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        name: gitleaks (secrets detection)
        args: ["detect", "--source=.", "--config=.gitleaks.toml", "--verbose"]
        # Note: Requires .gitleaks.toml config file
        # To generate baseline: gitleaks detect --source=. --report-path=.gitleaks-baseline.json

  - repo: local
    hooks:
      # Security checks - Command injection prevention
      - id: check-shell-true
        name: Check for subprocess shell=True (command injection risk)
        entry: .pre-commit-scripts/check-shell-true.sh
        language: system
        pass_filenames: false

      # Security checks - Unsafe XML parsing
      - id: check-unsafe-xml
        name: Check for unsafe XML parsing (XXE vulnerability risk)
        entry: |
          bash -c '
            files=$(grep -r "import xml.etree.ElementTree" --include="*.py" . \
              | grep -v ".git" \
              | grep -v "test_\|_test\.py" \
              | grep -v ".venv_ci" \
              | grep -v ".venv_validation" \
              | grep -v "tools/codemods/" \
              | grep -v "tools/validate.py" \
              || true);
            if [ -n "$files" ]; then
              echo "$files";
              echo "ERROR: Found unsafe XML parsing. Use defusedxml instead.";
              exit 1;
            else
              exit 0;
            fi
          '
        language: system
        pass_filenames: false

      # Security checks - Weak hash algorithms without explicit non-security flag
      - id: check-weak-hash
        name: Check for weak hash algorithms without usedforsecurity=False
        entry: |
          bash -c '
            files=$(grep -r "hashlib\.md5\|hashlib\.sha1" --include="*.py" . | grep -v "usedforsecurity=False" | grep -v ".git" | grep -v "test_\|_test\.py" | grep -v "# nosec" || true);
            if [ -n "$files" ]; then
              echo "$files";
              echo "WARNING: Found MD5/SHA1 without usedforsecurity=False. Add the parameter if not used for security.";
            fi
          '
        language: system
        pass_filenames: false

      # Test file naming convention enforcement
      - id: check-test-utility-naming
        name: Check for test_*.py utility files (pytest collection risk)
        entry: .pre-commit-scripts/check-test-utility-naming.sh
        language: system
        pass_filenames: false
        # Run on all commits to catch existing problematic files

      - id: pip-compile
        name: pip-compile (manual)
        entry: bash -c 'if [ -f requirements.in ]; then pip-compile requirements.in -o requirements.txt; fi'
        language: system
        stages: [manual]

      # Auto-update codex package __init__.py files
      - id: generate-codex-init
        name: Generate codex __init__.py files
        entry: python3 scripts/generate_codex_init.py
        language: system
        pass_filenames: false
        files: 'src/codex/.*\.py$'
        stages: [manual]

      # Auto-update pytest.ini with discovered markers
      - id: generate-pytest-config
        name: Update pytest.ini with markers
        entry: python3 scripts/generate_pytest_config.py
        language: system
        pass_filenames: false
        files: '(tests/.*_test\.py$|tests/test_.*\.py$)'
        stages: [manual]

      # Generate AI-optimized repository indices
      - id: generate-ai-index
        name: Generate AI repository search indices
        entry: python3 scripts/generate_ai_index.py
        language: system
        pass_filenames: false
        stages: [manual]

      # Cognitive brain - Pre-commit file verification
      - id: verify-expected-files
        name: Verify expected files from action log are staged
        entry: python scripts/hooks/pre_commit_verify.py --check-only --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

      # AST Code Smell Detection
      - id: ast-smell-check
        name: AST Code Smell Check (error-level only)
        entry: python3 -c
        language: system
        types: [python]
        pass_filenames: true
        # Only check Python files in src/, agents/, scripts/
        files: ^(src|agents|scripts)/.*\.py$
        args:
          - |
            import sys
            from pathlib import Path
            try:
                from codex.ast import CodeSmellDetector, SmellSeverity
            except ImportError:
                print('Warning: codex.ast module not installed, skipping smell check', file=sys.stderr)
                sys.exit(0)
            detector = CodeSmellDetector()
            has_errors = False
            for filepath in sys.argv[1:]:
                try:
                    smells = detector.detect_file(filepath)
                    for smell in smells:
                        if smell.severity == SmellSeverity.ERROR:
                            print(f'{filepath}:{smell.line_start}: [{smell.rule_id}] {smell.message}')
                            has_errors = True
                except Exception as e:
                    print(f'Warning: Failed to analyze {filepath}: {e}', file=sys.stderr)
            sys.exit(1 if has_errors else 0)

  # Windows filename compatibility check
  - repo: local
    hooks:
      - id: check-windows-filenames
        name: Check for Windows-incompatible filenames
        entry: python scripts/remediation/check_windows_filenames.py
        language: system
        pass_filenames: true
        types: [file]

      # Test Pattern Guardian - Proactive test quality enforcement
      - id: test-pattern-guardian
        name: Test Pattern Guardian (mock exhaustion, serialization issues)
        entry: python scripts/analyze_test_patterns.py
        language: system
        types: [python]
        files: ^tests/.*\.py$
        pass_filenames: false

      # Meta Tensor Validator - Prevent PyTorch meta tensor issues
      - id: check-meta-tensors
        name: Meta Tensor Validator (PyTorch model loading patterns)
        entry: python .pre-commit-scripts/check-meta-tensors.py
        language: system
        types: [python]
        files: ^(src/|scripts/).*\.py$
        pass_filenames: true
        # Fails if high-severity issues found (mock exhaustion, serialization problems)

      # Config Validator - Hydra config integrity
      - id: config-validator
        name: Config Validator (Hydra experiment configs)
        entry: bash scripts/verify_hydra_configs.sh
        language: system
        files: ^(config/.*\.yaml|tests/.*\.py)$
        pass_filenames: false
        # Validates that all Hydra configs referenced in tests exist

      # Auto-fix Common CI Issues - Detect patterns that cause workflow failures
      - id: auto-fix-ci-issues
        name: Auto-Fix Common CI Issues (unused imports, coverage, etc.)
        entry: python scripts/ci/auto_fix_common_issues.py --check-only
        language: system
        pass_filenames: false
        # Detects 8 common patterns: unused imports, coverage thresholds, YAML issues, etc.

      # PR #3248 Preventive Tooling - Link validation
      - id: markdown-link-check
        name: Markdown Link Checker (sample docs)
        entry: bash -c 'find docs -name "*.md" 2>/dev/null | head -5 | xargs -r npx --yes markdown-link-check --quiet || true'
        language: system
        pass_filenames: false
        # Checks sample markdown files for broken links (non-blocking)

      # PR #3365 - Intelligent link validator (internal links, .github/agents, docs/)
      - id: validate-internal-links
        name: Validate Internal Doc Links (.github/agents + docs/)
        entry: python .github/scripts/validate-links.py --fail-on-errors
        language: system
        pass_filenames: false
        files: '\.md$'
        stages: [commit]
        # Runs full internal-link scan whenever .md files are staged; exits 1 on errors

      # PR #3248 Preventive Tooling - Ruff linting
      - id: ruff-check
        name: Ruff Linting (F401, F841 - unused imports/variables)
        entry: bash -c 'command -v ruff >/dev/null 2>&1 && ruff check --select F401,F841 . || echo "⚠️ ruff not installed"'
        language: system
        pass_filenames: false
        # Checks for unused imports and variables

      # PR #3319 Code Quality - F821 strict enforcement
      - id: ruff-f821-strict
        name: Ruff F821 Strict (undefined names - ZERO TOLERANCE)
        entry: bash -c 'command -v ruff >/dev/null 2>&1 && ruff check --select F821 . || echo "⚠️ ruff not installed, F821 check skipped"'
        language: system
        pass_filenames: false
        # ZERO TOLERANCE for undefined names (F821) - prevents runtime failures

      # PR #3319 Code Quality - E402 quality check (informational)
      - id: ruff-e402-check
        name: Ruff E402 Check (import organization - informational)
        entry: bash -c 'command -v ruff >/dev/null 2>&1 && ruff check --select E402 . --exit-zero || echo "⚠️ ruff not installed"'
        language: system
        pass_filenames: false
        stages: [manual]
        # E402 check is informational only - many acceptable patterns documented
        # Run manually with: pre-commit run ruff-e402-check

      # PR #3248 Preventive Tooling - Quick test validation
      - id: quick-tests
        name: Quick Test Validation (fast tests only)
        entry: bash -c 'command -v pytest >/dev/null 2>&1 && pytest tests/ -v -m "not slow" --timeout=60 --maxfail=3 -x || echo "⚠️ Quick tests had issues"'
        language: system
        pass_filenames: false
        stages: [manual]
        # Runs fast tests only (use: pre-commit run quick-tests)
