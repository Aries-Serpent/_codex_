repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "bandit.yaml", "-r", "src", "training"]
        pass_filenames: false
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--no-verify"]
  # Security scanning: pip-audit for dependency vulnerabilities
  - repo: https://github.com/pypa/pip-audit
    rev: v2.6.1
    hooks:
      - id: pip-audit
        name: pip-audit (dependency vulnerability scan)
        args: ["--desc", "--skip-editable"]
        # Note: May require requirements files to be present
        # Run manually with: pre-commit run pip-audit --all-files

  # Security scanning: gitleaks for secrets detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        name: gitleaks (secrets detection)
        args: ["detect", "--source=.", "--config=.gitleaks.toml", "--verbose"]
        # Note: Requires .gitleaks.toml config file
        # To generate baseline: gitleaks detect --source=. --report-path=.gitleaks-baseline.json

  - repo: local
    hooks:
      # Security checks - Command injection prevention
      - id: check-shell-true
        name: Check for subprocess shell=True (command injection risk)
        entry: bash -c 'files=$(find . \( -path "./.git" -o -path "./tests" -o -path "./scripts" -o -path "./security/fix" -o -path "./security/validate" \) -prune -o -name "*.py" -print | xargs grep -n "shell=True" 2>/dev/null || true); if [ -n "$files" ]; then echo "$files"; echo "ERROR: Found shell=True in production code. Use shlex.split() and shell=False instead."; exit 1; else exit 0; fi'
        language: system
        pass_filenames: false
        
      # Security checks - Unsafe XML parsing
      - id: check-unsafe-xml
        name: Check for unsafe XML parsing (XXE vulnerability risk)
        entry: bash -c 'files=$(grep -r "import xml.etree.ElementTree" --include="*.py" . | grep -v ".git" | grep -v "test_\|_test\.py" || true); if [ -n "$files" ]; then echo "$files"; echo "ERROR: Found unsafe XML parsing. Use defusedxml instead."; exit 1; else exit 0; fi'
        language: system
        pass_filenames: false
        
      # Security checks - Weak hash algorithms without explicit non-security flag
      - id: check-weak-hash
        name: Check for weak hash algorithms without usedforsecurity=False
        entry: bash -c 'files=$(grep -r "hashlib\.md5\|hashlib\.sha1" --include="*.py" . | grep -v "usedforsecurity=False" | grep -v ".git" | grep -v "test_\|_test\.py" | grep -v "# nosec" || true); if [ -n "$files" ]; then echo "$files"; echo "WARNING: Found MD5/SHA1 without usedforsecurity=False. Add the parameter if not used for security."; fi'
        language: system
        pass_filenames: false
        
      - id: pip-compile
        name: pip-compile (manual)
        entry: bash -c 'if [ -f requirements.in ]; then pip-compile requirements.in -o requirements.txt; fi'
        language: system
        stages: [manual]

      # Auto-update codex package __init__.py files
      - id: generate-codex-init
        name: Generate codex __init__.py files
        entry: python3 scripts/generate_codex_init.py
        language: system
        pass_filenames: false
        files: 'src/codex/.*\.py$'
        stages: [manual]

      # Auto-update pytest.ini with discovered markers
      - id: generate-pytest-config
        name: Update pytest.ini with markers
        entry: python3 scripts/generate_pytest_config.py
        language: system
        pass_filenames: false
        files: '(tests/.*_test\.py$|tests/test_.*\.py$)'
        stages: [manual]

      # Generate AI-optimized repository indices
      - id: generate-ai-index
        name: Generate AI repository search indices
        entry: python3 scripts/generate_ai_index.py
        language: system
        pass_filenames: false
        stages: [manual]

      # AST Code Smell Detection
      - id: ast-smell-check
        name: AST Code Smell Check (error-level only)
        entry: python3 -c
        language: system
        types: [python]
        pass_filenames: true
        # Only check Python files in src/, agents/, scripts/
        files: ^(src|agents|scripts)/.*\.py$
        args:
          - |
            import sys
            from pathlib import Path
            try:
                from codex.ast import CodeSmellDetector, SmellSeverity
            except ImportError:
                print('Warning: codex.ast module not installed, skipping smell check', file=sys.stderr)
                sys.exit(0)
            detector = CodeSmellDetector()
            has_errors = False
            for filepath in sys.argv[1:]:
                try:
                    smells = detector.detect_file(filepath)
                    for smell in smells:
                        if smell.severity == SmellSeverity.ERROR:
                            print(f'{filepath}:{smell.line_start}: [{smell.rule_id}] {smell.message}')
                            has_errors = True
                except Exception as e:
                    print(f'Warning: Failed to analyze {filepath}: {e}', file=sys.stderr)
            sys.exit(1 if has_errors else 0)

  # Windows filename compatibility check
  - repo: local
    hooks:
      - id: check-windows-filenames
        name: Check for Windows-incompatible filenames
        entry: python scripts/remediation/check_windows_filenames.py
        language: system
        pass_filenames: true
        types: [file]


