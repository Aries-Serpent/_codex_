# Lambda experiment configuration
# Serverless/edge deployment settings

# @package _global_

defaults:
  - /model: mini
  - /optimizer: adamw
  - /scheduler: linear

experiment:
  name: lambda
  seed: 42
  max_epochs: 10
  fast_dev_run: false

training:
  batch_size: 8
  num_workers: 1
  log_every_n_steps: 20
  val_check_interval: 250
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4

model:
  hidden_dim: 64
  num_layers: 3
  dropout: 0.1
  # Optimize for inference
  use_flash_attention: false
  quantize_weights: true
  prune_threshold: 0.01

optimizer:
  lr: 1e-4
  weight_decay: 0.05
  eps: 1e-8

scheduler:
  warmup_ratio: 0.1
  num_training_steps: 10000

deployment:
  target: lambda
  max_memory_mb: 512
  timeout_seconds: 30
  cold_start_optimization: true

logging:
  verbose: false
  save_checkpoints: true
  checkpoint_every_n_epochs: 2
  track_metrics:
    - latency
    - memory_usage
    - inference_time
