# Fast experiment configuration
# Quick training for validation

# @package _global_

defaults:
  - /model: base
  - /optimizer: adam
  - /scheduler: cosine

experiment:
  name: fast
  seed: 42
  max_epochs: 5
  fast_dev_run: false

training:
  batch_size: 32
  num_workers: 2
  log_every_n_steps: 10
  val_check_interval: 100
  gradient_clip_val: 1.0

model:
  hidden_dim: 128
  num_layers: 4

optimizer:
  lr: 3e-4
  weight_decay: 0.01

scheduler:
  warmup_steps: 100
  total_steps: 5000

logging:
  verbose: true
  save_checkpoints: true
  checkpoint_every_n_epochs: 1
