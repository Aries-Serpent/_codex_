[pytest]
# Override pytest configuration for mutation testing
# This bypasses pyproject.toml's --ignore=tests/agents

testpaths = tests/agents
pythonpath = src
addopts =
    -q
    --strict-markers
    -v
    --tb=short
filterwarnings =
    ignore::DeprecationWarning

markers =
    edge_case: Edge case tests
    concurrency: Concurrency tests
    advanced: Advanced tests
    error_handling: Error handling tests
    security_aware: Security aware tests
