openapi: 3.0.3
info:
  title: _codex_ Actions (Local)
  version: "0.1.0"
  description: >
    Local Actions for CustomGPT to interact with the _codex_ repository.
    Guarded, offline-first, no CI triggers. Serve via tools/actions_server.py.
servers:
  - url: http://localhost:8010
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /repo/branches:
    get:
      summary: List branches for Aries-Serpent/_codex_
      parameters:
        - in: query
          name: owner
          schema: { type: string, default: "Aries-Serpent" }
        - in: query
          name: repo
          schema: { type: string, default: "_codex_" }
      responses:
        "200":
          description: Branch list
  /repo/files:
    get:
      summary: Get text file at ref and path
      parameters:
        - in: query
          name: owner
          schema: { type: string, default: "Aries-Serpent" }
        - in: query
          name: repo
          schema: { type: string, default: "_codex_" }
        - in: query
          name: ref
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Raw text content
  /repo/search:
    get:
      summary: Lightweight code search (path and lines)
      parameters:
        - in: query
          name: owner
          schema: { type: string, default: "Aries-Serpent" }
        - in: query
          name: repo
          schema: { type: string, default: "_codex_" }
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: ref
          schema: { type: string, default: "main" }
      responses:
        "200":
          description: Matched snippets with context

  /repo/most_recent_branch:
    get:
      summary: Return the most recently updated branch for the repository
      parameters:
        - in: query
          name: owner
          schema: { type: string, default: "Aries-Serpent" }
        - in: query
          name: repo
          schema: { type: string, default: "_codex_" }
      responses:
        "200":
          description: Most recently updated branch name
