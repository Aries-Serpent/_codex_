[build-system]
requires = [
    "setuptools>=78.1.1,<82",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "aries-serpent-core"
version = "0.1.0-beta2"
description = "Aries-Serpent Core — Lightweight utilities, configuration, security, and resilience patterns for standalone applications and integrations with zero ML coupling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Aries Serpent" },
]
keywords = [
    "core",
    "configuration",
    "security",
    "resilience",
    "utilities",
    "hydra",
    "secrets",
    "session",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "hydra-core>=1.3.4,<2.0.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.0",
    "cryptography>=48.0.0,<50.0.0",
    "PyJWT>=2.13.0,<3.0.0",
    "PyNaCl>=1.5.0,<2.0.0",
    "filelock>=3.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/Aries-Serpent/_codex_"
Documentation = "https://aries-serpent.github.io/_codex_/"
Repository = "https://github.com/Aries-Serpent/_codex_.git"
Issues = "https://github.com/Aries-Serpent/_codex_/issues"

[tool.setuptools]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "aries_serpent_core.config*",
    "aries_serpent_core.security*",
    "aries_serpent_core.secrets*",
    "aries_serpent_core.resilience*",
    "aries_serpent_core.logging*",
    "aries_serpent_core.session*",
    "aries_serpent_core.utils*",
    "aries_serpent_core.observability*",
    "aries_serpent_core.db*",
    "aries_serpent_core.metrics*",
]
exclude = [
    "aries_serpent_core.cognitive*",
    "aries_serpent_core.rag*",
    "aries_serpent_core.skills*",
    "aries_serpent_core.mcp*",
    "aries_serpent_core.training*",
    "aries_serpent_core.auth*",
    "aries_serpent_core.cache*",
    "aries_serpent_core.api*",
    "aries_serpent_core.clients*",
    "aries_serpent_core.cli*",
    "tests*",
]

[tool.setuptools.package-data]
"aries_serpent_core.config" = ["py.typed"]
"aries_serpent_core.security" = ["py.typed"]
"aries_serpent_core.secrets" = ["py.typed"]
"aries_serpent_core.resilience" = ["py.typed"]
"aries_serpent_core.logging" = ["py.typed"]
"aries_serpent_core.session" = ["py.typed"]
"aries_serpent_core.utils" = ["py.typed"]
"aries_serpent_core.observability" = ["py.typed"]
"aries_serpent_core.db" = ["py.typed"]
"aries_serpent_core.metrics" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
source = ["src/aries_serpent_core"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 70
