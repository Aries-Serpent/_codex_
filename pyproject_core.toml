[build-system]
requires = [
    "setuptools>=78.1.1,<82",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "aries-serpent-core"
version = "0.1.0-beta2"
description = "Aries-Serpent Core — Lightweight utilities, configuration, security, and resilience patterns for standalone applications and integrations with zero ML coupling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Aries Serpent" },
]
keywords = [
    "core",
    "configuration",
    "security",
    "resilience",
    "utilities",
    "hydra",
    "secrets",
    "session",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "hydra-core>=1.3.0,<2.0.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.0",
    "cryptography>=48.0.0,<50.0.0",
    "PyJWT>=2.13.0,<3.0.0",
    "PyNaCl>=1.5.0,<2.0.0",
    "filelock>=3.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/Aries-Serpent/_codex_"
Documentation = "https://aries-serpent.github.io/_codex_/"
Repository = "https://github.com/Aries-Serpent/_codex_.git"
Issues = "https://github.com/Aries-Serpent/_codex_/issues"

[tool.setuptools]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "codex.config*",
    "codex.security*",
    "codex.secrets*",
    "codex.resilience*",
    "codex.logging*",
    "codex.session*",
    "codex.utils*",
    "codex.auth*",
    "codex.observability*",
    "codex.db*",
    "codex.cache*",
    "codex.metrics*",
    "codex.cli*",
    "codex.clients*",
    "codex.api*",
]
exclude = [
    "codex.cognitive*",
    "codex.rag*",
    "codex.skills*",
    "codex.mcp*",
    "codex.training*",
    "tests*",
]

[tool.setuptools.package-data]
"codex.config" = ["py.typed"]
"codex.security" = ["py.typed"]
"codex.secrets" = ["py.typed"]
"codex.resilience" = ["py.typed"]
"codex.logging" = ["py.typed"]
"codex.session" = ["py.typed"]
"codex.utils" = ["py.typed"]
"codex.auth" = ["py.typed"]
"codex.observability" = ["py.typed"]
"codex.db" = ["py.typed"]
"codex.cache" = ["py.typed"]
"codex.metrics" = ["py.typed"]
"codex.cli" = ["py.typed"]
"codex.clients" = ["py.typed"]
"codex.api" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
branch = true
source = ["src/codex"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 70
