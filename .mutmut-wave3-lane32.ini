[mutmut]
# Source paths - focus on core modules
source_paths = src/codex/utils,src/codex/cache

# Test selection - focused tests
pytest_add_cli_args_test_selection = tests/codex/test_utils_*.py tests/cache/test_*.py

# Mutation operators (20+ types)
mutation_operators = ArithmeticOperator,ComparisonOperator,LogicalOperator,ConditionalOperator,AssignmentOperator,DecoratorOperator,DecoratorChainOperator,AssignmentOperator,MembershipOperator,MutationOperator,ROR

# Timeouts
test_time_multiplier = 2.0
test_time_base = 10.0

# Performance
use_coverage = False
use_multiprocessing = True
multiprocessing_workers = 4

# Output
show_times = False
swallow_output = True

# Paths to exclude
exclude_patterns = __pycache__,*.pyc,*/tests/*

# Cache
cache_only = False
