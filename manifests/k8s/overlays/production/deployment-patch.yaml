apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-ml-server
spec:
  replicas: 5
  template:
    spec:
      containers:
      - name: codex-ml
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
