apiVersion: v1
kind: Service
metadata:
  name: codex-ml-service
  labels:
    app: codex-ml
    component: inference
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: codex-ml
    component: inference
