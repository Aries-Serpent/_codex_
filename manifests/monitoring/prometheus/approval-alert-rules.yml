---
# Prometheus Alert Rules — Phase 12.2 Approval SLA Enforcement
# Authority: @mbaetiong (D-tier)
# Status: Production-Ready
# Integration: Track 12.2 Approval Policies, Track 12.3 Telemetry

groups:
  - name: approval_sla_enforcement
    interval: 30s
    rules:
      # ========================================================================
      # CRITICAL: SLA Breach Alerts
      # ========================================================================
      
      - alert: ApprovalP95ExceedsSLA
        expr: |
          histogram_quantile(0.95, 
            approval_request_latency_seconds{policy_category=~"D|S|R|C|G|E"}
          ) > 14400
        for: 5m
        labels:
          severity: critical
          track: "12.2"
          component: "approval"
        annotations:
          summary: "Approval p95 latency exceeds SLA threshold (4h)"
          description: |
            Policy category: {{ $labels.policy_category }}
            Approval stage: {{ $labels.approval_stage }}
            Current p95: {{ $value | humanizeDuration }}
            SLA threshold: 4h (14400s)
          action: "Escalate to approver's manager; check approval queue depth"
          dashboard: "Approval SLA & Governance Dashboard"
      
      - alert: ApprovalIncidentP95ExceedsSLA
        expr: |
          histogram_quantile(0.95, 
            approval_request_latency_seconds{policy_category="I"}
          ) > 7200
        for: 2m
        labels:
          severity: critical
          track: "12.2"
          component: "approval"
          policy_category: "incident"
        annotations:
          summary: "Incident approval SLA breach (2h emergency SLA)"
          description: |
            Current p95: {{ $value | humanizeDuration }}
            SLA threshold: 2h (7200s)
            Policy: Incident Response (I)
          action: "IMMEDIATE: Escalate to Incident Commander and VP"
      
      - alert: ApprovalAuditP95ExceedsSLA
        expr: |
          histogram_quantile(0.95, 
            approval_request_latency_seconds{policy_category="A"}
          ) > 28800
        for: 10m
        labels:
          severity: high
          track: "12.2"
          component: "approval"
          policy_category: "audit"
        annotations:
          summary: "Audit approval exceeds SLA (8h per-stage)"
          description: |
            Current p95: {{ $value | humanizeDuration }}
            SLA threshold: 8h per-stage (28800s)
          action: "Review audit queue; escalate to Compliance team"
      
      - alert: ApprovalSLABreach
        expr: |
          increase(approval_sla_breached_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
          track: "12.2"
          component: "approval"
        annotations:
          summary: "Approval SLA threshold breached in the last hour"
          description: |
            Breaches in last 1h: {{ $value }}
            Category: {{ $labels.policy_category }}
            Breach type: {{ $labels.breach_type }}
          action: |
            1. IMMEDIATE: Create incident ticket
            2. Review pending approvals in approval_queue
            3. Escalate to release manager / security lead
            4. Check approval authority capacity
            5. Update SLA tracking dashboard
          runbook: "https://wiki/approval-sla-breach"
      
      - alert: ApprovalAuditSLABreach
        expr: |
          increase(approval_sla_breached_total{policy_category="A"}[24h]) > 0
        labels:
          severity: high
          track: "12.2"
          component: "approval"
          compliance: "required"
        annotations:
          summary: "Audit approval SLA breach (24-hour window) — Compliance Alert"
          description: |
            Breaches in last 24h: {{ $value }}
            SLA: 8h per-stage, 24h total
          action: |
            1. Document breach in compliance log
            2. Notify Compliance & Legal teams
            3. Review audit approval process
            4. File corrective action plan if needed
      
      # ========================================================================
      # HIGH: Escalation & Conflict Detection
      # ========================================================================
      
      - alert: EscalationRateHigh
        expr: |
          increase(escalation_triggered_total[5m]) > 3
        for: 10m
        labels:
          severity: high
          track: "12.2"
          component: "approval"
        annotations:
          summary: "High escalation rate detected (>3 in 5m)"
          description: |
            Escalations in last 5m: {{ $value }}
            Trigger type: {{ $labels.trigger_type }}
            Policy category: {{ $labels.policy_category }}
          action: |
            1. Check if approvers are on vacation / unavailable
            2. Verify escalation policy configuration
            3. Consider increasing authority capacity
      
      - alert: EscalationTimeoutHigh
        expr: |
          histogram_quantile(0.95, escalation_time_to_resolution_seconds) > 14400
        for: 15m
        labels:
          severity: high
          track: "12.2"
          component: "approval"
        annotations:
          summary: "Escalation resolution time exceeds 4h SLA"
          description: |
            Escalation p95: {{ $value | humanizeDuration }}
            Level: {{ $labels.escalation_level }}
            Category: {{ $labels.policy_category }}
          action: "Check escalation authority availability; escalate to VP"
      
      # ========================================================================
      # MEDIUM: Queue Depth & Bottleneck Detection
      # ========================================================================
      
      - alert: ApprovalQueueDepthHigh
        expr: |
          approval_queue_depth > 20
        for: 30m
        labels:
          severity: medium
          track: "12.2"
          component: "approval"
        annotations:
          summary: "Approval queue depth high (>20 pending)"
          description: |
            Current queue depth: {{ $value }}
            Category: {{ $labels.policy_category }}
          action: |
            1. Notify approval authorities to process pending requests
            2. Check for policy configuration issues
            3. Consider auto-escalation if threshold exceeded
      
      - alert: ApprovalAuthorityCapacity
        expr: |
          (increase(approval_request_submitted_total[1h]) / 
           count(approval_authority_decision_latency_seconds)) > 50
        for: 60m
        labels:
          severity: medium
          track: "12.2"
          component: "approval"
        annotations:
          summary: "Approval authority at high capacity (>50 requests/person/hour)"
          description: |
            Throughput: {{ $value | humanize }} requests/person/hour
            Category: {{ $labels.policy_category }}
          action: |
            1. Review workload distribution
            2. Consider adding backup approvers
            3. Check policy rules for optimization
      
      # ========================================================================
      # SECURITY: Unauthorized Access & Policy Violations
      # ========================================================================
      
      - alert: UnauthorizedApprovalAttempt
        expr: |
          increase(approval_unauthorized_attempt_count_total[5m]) > 0
        labels:
          severity: high
          track: "12.2"
          component: "approval"
          security: "true"
        annotations:
          summary: "Unauthorized approval attempt detected — SECURITY ALERT"
          description: |
            Attempts in last 5m: {{ $value }}
            Attempted by: {{ $labels.agent_id }}
          action: |
            1. IMMEDIATE: Review security logs
            2. Verify agent's RBAC permissions
            3. Check for policy configuration errors
            4. Notify security team if malicious activity suspected
      
      - alert: ApprovalPolicyViolation
        expr: |
          increase(approval_policy_violation_count_total[1h]) > 0
        labels:
          severity: high
          track: "12.2"
          component: "approval"
        annotations:
          summary: "Approval policy violation detected"
          description: |
            Violations in last 1h: {{ $value }}
            Violation type: {{ $labels.violation_type }}
            Policy: {{ $labels.policy_id }}
          action: |
            1. Review policy enforcement rules
            2. Check RBAC configuration (Track 12.1)
            3. Verify policy implementation
            4. File corrective action ticket
      
      - alert: DelegationAbuseDetected
        expr: |
          (increase(approval_delegation_count_total[1h]) / 
           increase(approval_request_submitted_total[1h])) > 0.2
        for: 30m
        labels:
          severity: medium
          track: "12.2"
          component: "approval"
          security: "true"
        annotations:
          summary: "High delegation rate detected (>20% of requests)"
          description: |
            Delegation ratio: {{ $value | humanizePercentage }}
            Period: 1h
          action: |
            1. Review delegation justifications
            2. Verify source and target roles are legitimate
            3. Check for delegation authority limits
      
      # ========================================================================
      # COMPLIANCE & AUDIT
      # ========================================================================
      
      - alert: AuditLogAnomalyDetected
        expr: |
          abs(rate(approval_audit_log_entries_total[5m]) - 
              avg_over_time(rate(approval_audit_log_entries_total[5m])[1h:5m])) > 
          2 * stddev_over_time(rate(approval_audit_log_entries_total[5m])[1h:5m])
        for: 15m
        labels:
          severity: medium
          track: "12.2"
          component: "approval"
          compliance: "true"
        annotations:
          summary: "Audit log rate anomaly (potential data loss or duplication)"
          description: |
            Current rate: {{ $value | humanize }} events/sec
            Normal range: μ ± 2σ
          action: |
            1. Check audit log ingestion pipeline
            2. Verify event schema compliance
            3. Review for data integrity issues
      
      - alert: ComplianceReportingMissed
        expr: |
          time() - max(approval_compliance_report_generated_timestamp{policy_category="A"}) > 86400
        for: 60m
        labels:
          severity: medium
          track: "12.2"
          component: "approval"
          compliance: "required"
        annotations:
          summary: "Compliance report generation missed (>24h)"
          description: |
            Last report: {{ $value | humanizeDuration }} ago
            Category: Audit (A)
          action: |
            1. Trigger manual compliance report generation
            2. Check scheduled report job status
            3. Investigate any ingestion pipeline issues
      
      # ========================================================================
      # MONITORING & HEALTH
      # ========================================================================
      
      - alert: ApprovalMetricsStale
        expr: |
          time() - max(approval_request_submitted_total) > 300
        for: 5m
        labels:
          severity: medium
          track: "12.2"
          component: "approval"
        annotations:
          summary: "Approval metrics are stale (>5min without update)"
          description: |
            Last update: {{ $value | humanizeDuration }} ago
          action: |
            1. Check approval collector health
            2. Verify D2.2 approval service is running
            3. Check network connectivity to metrics receiver
      
      - alert: CardinalityLimitApproaching
        expr: |
          count(count by (__name__) (approval_.*{})) > 700
        for: 30m
        labels:
          severity: medium
          track: "12.3"
          component: "telemetry"
        annotations:
          summary: "Approval metrics cardinality approaching limit (700+ timeseries)"
          description: |
            Current timeseries count: {{ $value }}
            Limit: 900
            Remaining: {{ 900 - $value }}
          action: |
            1. Review dimension cardinality in active metrics
            2. Consider aggregating low-impact dimensions
            3. Check for unexpected agent registrations
      
      - alert: CardinalityLimitExceeded
        expr: |
          count(count by (__name__) (approval_.*{})) > 850
        labels:
          severity: critical
          track: "12.3"
          component: "telemetry"
        annotations:
          summary: "Approval metrics cardinality LIMIT EXCEEDED (>850 timeseries)"
          description: |
            Current timeseries count: {{ $value }}
            Hard limit: 900
            Risk: Performance degradation, cost overrun
          action: |
            1. IMMEDIATE: Review and reduce dimensions
            2. Aggregate per-agent metrics to per-role
            3. Disable low-value metric breakdowns
            4. Update cardinality management policy


