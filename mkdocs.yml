repo_name: Aries-Serpent/_codex_
repo_url: https://github.com/Aries-Serpent/_codex_
site_url: https://aries-serpent.github.io/_codex_/
site_description: "Project documentation - v0.2.0 (MkDocs Material)"
site_name: Codex Docs v0.2.0
strict: false
theme:
  name: material
  language: en

  # Dark/Light mode toggle - Three-way toggle (auto/light/dark)
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  # Enhanced features for better navigation and usability
  features:
    - navigation.instant      # XHR loading for faster page transitions
    - navigation.tracking     # URL updates in browser history
    - navigation.tabs         # Top-level navigation tabs
    - navigation.sections     # Section grouping in navigation
    - navigation.expand       # Expand sections by default
    - navigation.top          # Back to top button
    - search.suggest          # Search suggestions
    - search.highlight        # Highlight search terms
    - search.share            # Share search results
    - content.tabs.link       # Link content tabs across pages
    - content.code.copy       # Copy code button
    - content.code.annotate   # Code annotations

  icon:
    repo: fontawesome/brands/github
    logo: material/book-open-page-variant
validation:
  links:
    absolute_links: ignore
    anchors: ignore
    not_found: ignore
    unrecognized_links: ignore
  nav:
    not_found: ignore
    omitted_files: ignore

# Custom CSS for table formatting and styling
extra_css:
  - stylesheets/extra.css
