[mutmut]
# Mutation Testing Configuration for Phase 7D Track 2
# Target: agents/agent_memory.py with comprehensive test coverage

# Source paths to mutate (focus on agent memory)
source_paths = agents/agent_memory.py

# Test selection - use agents tests only (override pyproject.toml --ignore)
# This should be passed via pytest configuration override
pytest_add_cli_args_test_selection = tests/agents/test_agent_memory.py tests/agents/test_agent_memory_comprehensive.py tests/agents/test_agent_memory_mutation_killers.py -v

# Parallel workers for faster mutation execution
max_children = 8

# Time multiplier for test timeouts
test_time_multiplier = 3.0

# Mutation operators to focus on (comment out to enable all)
# swap_operators = true
# also_mutate_return_values = true

# Skip certain files/patterns
# only_mutate = agents/agent_memory.py

# Don't mutate these patterns
do_not_mutate = __version__, __all__

# Output format
json = false
