[mypy]
python_version = 3.12
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
disallow_untyped_defs = False
no_site_packages = False
ignore_missing_imports = True
# Source packages are installed from src/, not from a package named "src".
namespace_packages = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR/src
# Non-importable resource/backup directories only. The workflow backup's Python
# files are byte-identical to services/workflow_backup/, which is checked.
exclude = (?x)(
    ^(?:.*/)?src/agents/prompts/self-healing/
    | ^(?:.*/)?src/services/workflow[.]backup/
    )

[mypy-tests.*]
ignore_errors = True

[mypy-torch]
ignore_errors = True

[mypy-omegaconf]
ignore_errors = True
