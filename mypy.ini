[mypy]
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
disallow_untyped_defs = False
no_site_packages = False
ignore_missing_imports = True

# Ignore missing stubs for third-party libraries
[[tool.mypy.overrides]]
module = [
    "typer",
    "typer.*",
    "yaml",
    "yaml.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "datasets",
    "datasets.*",
    "sentencepiece",
    "sentencepiece.*",
]
ignore_missing_imports = true

[mypy-tests.*]
ignore_errors = True
