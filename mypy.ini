[mypy]
python_version = 3.12
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
disallow_untyped_defs = False
no_site_packages = False
ignore_missing_imports = True

[mypy-tests.*]
ignore_errors = True

[mypy-torch]
ignore_errors = True

[mypy-omegaconf]
ignore_errors = True
