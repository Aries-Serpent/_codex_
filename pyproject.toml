  "pytest-mock>=3.12.0,<4.0.0",
  "pytest-rerunfailures>=12.0",
  "pytest-randomly>=3.10",
  "hypothesis>=6.98.0,<7.0.0",
  "packaging>=24.0,<26.0",  # Pin to <26 for mlflow-tracing/mlflow-skinny compatibility
  "transformers>=5.5.3,<6",  # Security: updated from 4.41 to fix deserialization
  "torch>=2.6.0,<3.0.0; platform_system != 'Windows'",  # Security: updated from 2.2.2 to fix RCE
