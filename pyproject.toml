csv = "codex_ml.data.registry:load_csv"

[project.entry-points."codex_ml.trainers"]
functional = "codex_ml.registry.trainers:_load_functional_trainer"

[tool.setuptools]
license-files = [
    "LICENSE",
    "LICENSES/*",
]

[tool.setuptools.package-dir]
"" = "src"
agents = "agents"
codex_addons = "codex_addons"
codex_digest = "codex_digest"
codex_utils = "codex_utils"
codex_regression = "codex_regression"
configs = "configs"
interfaces = "interfaces"
tokenization = "src/tokenization"
tools = "tools"
training = "src/training"
examples = "examples"
cli = "cli"
services = "services"

[tool.setuptools.packages.find]
where = [
    ".",
    "src",
]
include = [
    "agents*",
    "codex_ml*",
    "codex*",
    "cli*",
    "common*",
    "cognitive_brain*",
    "services*",
    "tokenization*",
    "training*",
    "codex_utils*",
    "interfaces*",
    "hhg_logistics*",
    "hydra_extra*",
    "examples*",
    "security",
    "security.*",
    "tools*",
    "tools.*",
    "quantum*",
    "cognitive_brain*",
    "zendesk*",
]
exclude = [
    "tests*",
    "torch_stub*",
    ".stubs*",
    "*__pycache__*",
    "security-suite-artifacts*",
    "configs*",
    "config*",
    "config_legacy*",
    "cli",
    "cli.*",
    "codex_addons*",
    "codex_digest*",
    "codex_regression*",
    "examples",
    "examples.*",
    "interfaces",
    "interfaces.*",
    "build*",
    "dist*",
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
    "*.__pycache__",
    "*.pycache",
    "*.__pycache__.*",
    "__pycache__",
]
namespaces = true

[tool.setuptools.package-data]
codex_ml = [
    "**/*.md",
    "**/*.jinja2",
    "**/*.j2",
    "configs/**/*.yaml",
    "configs/**/*.yml",
    "configs/**/*.json",
    "configs/**/*.csv",
]
hhg_logistics = []
configs = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/*.csv",
    "**/*.env",
    "**/*.md",
]
codex_crm = [
    "cdm/data/**/*.csv",
]
common = []

[tool.setuptools.exclude-package-data]
codex_ml = [
    "**/tests/*",
    "torch_stub/*",
    ".stubs/*",
]

[tool.black]
line-length = 100
target-version = [
    "py39",
    "py310",
    "py311",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E402",
    "F811",
]
"tests/*.py" = [
    "E402",
    "F811",
]
"torch/**/*.py" = [
    "F811",
]
"tests/stub_packages/**/*.py" = [
    "E402",
    "F811",
]
"scripts/ci/rate_limit_orchestrator.py" = [
    "E501",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
branch = true
source = [
    "src",
    "agents",
    "training",
    "scripts",
    "services",
]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.pip-audit]
ignore-vulns = [
    "CVE-2025-69872",
    "CVE-2024-35515",
]

[tool.uv]
environments = [
    "python_version == '3.12.*' and sys_platform == 'linux'",
]
conflicts = [
    [
        { extra = "ge" },
        { extra = "marshmallow-v4" },
    ],
]
constraint-dependencies = [
    "dulwich>=1.2.5",
    "aiohttp>=3.14.0",
]

[tool.mutmut]
also_copy = [
    "src/",
    "tests/smoke/",
    "tests/repro/",
    "tests/unit/",
]
pytest_add_cli_args = [
    "-x",
    "-q",
    "--no-header",
    "--ignore=tests/agents",
    "--ignore=tests/services",
]
tests_dir = [
    "tests/smoke/test_determinism.py",
    "tests/unit/test_gap22_mutation_killers.py",
]
do_not_mutate = ["*__pycache__*", "*.pyc"]
debug = true
paths_to_mutate = [
    "src/codex_ml/utils/determinism.py",
    "src/codex_ml/utils/seed.py",
]
