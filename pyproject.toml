# BACKWARDS COMPATIBILITY ALIASES (for existing scripts)
# These are deprecated and will be removed in v1.0.0
all = ["codex-ml[full]"]
dev = ["codex-ml[full]"]
ml = ["codex-ml[runtime]"]
train = ["codex-ml[full]"]
test-core = ["codex-ml[core]"]

[project.scripts]
# Core entry points (bundled in all profiles)
codex = "codex_ml.cli.main:cli"
codex-ml = "codex_ml.cli.main:cli"
codex-ml-cli = "codex_ml.cli.main:cli"
codex-cli = "codex_ml.cli.simple_cli:main"
codex-smoke = "codex_cli.app:app"
# Removed: codex-import-ndjson (aries_serpent_core not in setuptools include list - external dependency)

# Extended entry points (require additional dependencies, marked for future profiles)
# NOTE: The following entry points are commented out because they require dependencies
# not in the [core] profile. They will be activated in [runtime] and [full] profiles.
# See docs/ENTRY_POINTS_REMOVED.md for detailed rationale and activation timeline.
# docs-mcp-server = "tools.docs_agent.mcp_server:main"

[project.entry-points."codex_ml.tokenizers"]
hf = "codex_ml.registry.tokenizers:build_hf_tokenizer"

[project.entry-points."codex.skills"]

[project.entry-points."codex_ml.reward_models"]
heuristic = "codex_ml.plugins.registries:reward_model_heuristic"

[project.entry-points."codex_ml.models"]
minilm = "codex_ml.models.registry:build_minilm"
bert_base_uncased = "codex_ml.models.registry:build_default_bert"

[project.entry-points."codex_ml.metrics"]
token_accuracy = "codex_ml.metrics.registry:token_accuracy"
ppl = "codex_ml.metrics.registry:perplexity"
exact_match = "codex_ml.metrics.registry:exact_match"
f1 = "codex_ml.metrics.registry:f1"

[project.entry-points."codex_ml.plugins"]
# Removed: hello (examples module excluded from bundling via setuptools)
# Removed: token_accuracy_plugin (examples module excluded from bundling via setuptools)

[project.entry-points."codex_ml.data_loaders"]
lines = "codex_ml.data.registry:load_line_dataset"
jsonl = "codex_ml.data.registry:load_jsonl"
csv = "codex_ml.data.registry:load_csv"

[project.entry-points."codex_ml.datasets"]
lines = "codex_ml.data.registry:load_line_dataset"
jsonl = "codex_ml.data.registry:load_jsonl"
csv = "codex_ml.data.registry:load_csv"

[project.entry-points."codex_ml.trainers"]
functional = "codex_ml.registry.trainers:load_functional_trainer"

[tool.setuptools]
# Standardized package discovery: all packages in src/ by default,
# with explicit mappings for root-level packages that need inclusion
# and package-discovery configuration

[tool.setuptools.package-dir]
"" = "src"
# Root-level packages with explicit mappings
codex = "src/codex"
codex_utils = "codex_utils"
training = "training"
services = "services"
tools = "tools"
agents = "agents"
tokenization = "tokenization"
interfaces = "interfaces"
# Note: Packages not listed here but found in include[] will be searched in src/ by default

[tool.setuptools.packages.find]
where = [
    ".",
    "src",
]
# Bundled packages (production code and AI subsystems)
include = [
    "agents*",              # AI agents subsystem
    "aries_serpent_core*",  # Core Aries Serpent logging and utilities (required by CLI)
    "codex_ml*",            # ML training, evaluation, and utilities
    "codex*",               # Core utilities (codex, codex_bridge, etc.)
    "common*",              # Common utilities
    "cognitive_brain*",     # Cognitive Brain AI system
    "services*",            # Service integrations
    "tokenization*",        # Tokenization infrastructure
    "training*",            # Training pipeline
    "codex_utils*",         # Codex utilities
    "interfaces*",          # Public interfaces
    "hhg_logistics*",       # HHG logistics subsystem
    "hydra_extra*",         # Hydra configuration extensions
    "security",             # Security infrastructure (core package)
    "security.*",           # Security submodules
    "tools*",               # Tools and utilities
    "tools.*",              # Tool submodules
    "quantum*",             # Quantum orchestrator
    "zendesk*",             # Zendesk integration
    "config",               # Configuration (core package)
    "codex_bridge",         # Bridge infrastructure
]
# Excluded packages (development-only, test, or temporary code)
exclude = [
    "tests*",                       # Test suites (development only)
    "torch_stub*",                  # Stub implementations
    ".stubs*",                      # Type stub files
    "*__pycache__*",                # Python cache (all variants)
    "security-suite-artifacts*",    # Artifact storage
    "configs*",                     # Configuration files (not Python packages)
    "config_legacy*",               # Legacy configuration (deprecated)
    "cli",                          # CLI module (development only)
    "cli.*",                        # CLI submodules
    "codex_addons*",                # Add-on packages (not bundled)
    "codex_digest*",                # Digest utilities (not bundled)
    "codex_regression*",            # Regression testing (not bundled)
    "examples",                     # Examples/demos (development only)
    "examples.*",                   # Example submodules (development only)
    "interfaces",                   # Excluded to prevent duplication (see include)
    "interfaces.*",                 # Interface submodules (excluded due to specificity)
    "build*",                       # Build artifacts
    "dist*",                        # Distribution artifacts
    "*.tests",                      # Test modules (any package)
    "*.tests.*",                    # Test submodules
    "tests.*",                      # Test packages
    "tests",                        # Root tests directory
    "*.__pycache__",                # Cache variant
    "*.pycache",                    # Cache variant
    "*.__pycache__.*",              # Cache variant
    "__pycache__",                  # Python cache directory
    "codex.db*",                    # Database files
]
namespaces = true

[tool.setuptools.package-data]
codex_ml = [
    "**/*.md",
    "**/*.jinja2",
    "**/*.j2",
    "configs/**/*.yaml",
    "configs/**/*.yml",
    "configs/**/*.json",
    "configs/**/*.csv",
]
hhg_logistics = []
configs = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/*.csv",
    "**/*.env",
    "**/*.md",
]
codex_crm = [
    "cdm/data/**/*.csv",
]
common = []

[tool.setuptools.exclude-package-data]
codex_ml = [
    "**/tests/*",
    "torch_stub/*",
    ".stubs/*",
]

[tool.black]
line-length = 100
target-version = [
    "py39",
    "py310",
    "py311",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E402",
    "F811",
    "F821",
    "F841",
]
"tests/github/*.py" = [
    "F841",
]
"tests/*.py" = [
    "E402",
    "F811",
    "F821",
]
"torch/**/*.py" = [
    "F811",
]
"tests/stub_packages/**/*.py" = [
    "E402",
    "F811",
]
"tests/security/*.py" = [
    "F821",  # xfail tests with intentionally undefined decorators for features not yet implemented
]
"scripts/ci/rate_limit_orchestrator.py" = [
    "E501",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
branch = true
source = [
    "src",
    "agents",
    "training",
    "scripts",
    "services",
]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# BASELINE_PHASE: fail_under locked to 34 (2026-07-02)
# Baseline coverage: 34.63% ± 1.5% (33.13% - 36.13%)
# See .codex/COVERAGE_BASELINE_34_63.json and .codex/COVERAGE_VALIDATION_CRITERIA.md
# Previous fail_under = 70 archived as ASPIRATIONAL_PHASE_30 target
fail_under = 34
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.pip-audit]
ignore-vulns = [
    "CVE-2025-69872",
    "CVE-2024-35515",
    "PYSEC-2026-597",
    "CVE-2025-3000",
]

[tool.uv]
environments = [
    "python_version == '3.12.*' and sys_platform == 'linux'",
]
conflicts = [
    [
        { extra = "ge" },
        { extra = "marshmallow-v4" },
    ],
]
constraint-dependencies = [
    "dulwich>=1.2.5",
    "aiohttp>=3.14.0",
]

[tool.mutmut]
also_copy = [
    "src/",
    "tests/smoke/",
    "tests/repro/",
    "tests/unit/",
]
pytest_add_cli_args = [
    "-x",
    "-q",
    "--no-header",
    "--ignore=tests/agents",
    "--ignore=tests/services",
]
tests_dir = [
    "tests/smoke/test_determinism.py",
    "tests/unit/test_gap22_mutation_killers.py",
]
do_not_mutate = ["*__pycache__*", "*.pyc"]
debug = true
paths_to_mutate = [
    "src/codex_ml/utils/determinism.py",
    "src/codex_ml/utils/seed.py",
]
