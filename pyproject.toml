[project.scripts]
# Canonical entrypoints
codex-train = "codex_ml.cli.entrypoints:train_main"
codex-eval = "codex_ml.cli.entrypoints:eval_main"
codex-list-plugins = "codex_ml.cli.list_plugins:main"
# Preserve legacy/extended scripts present in this repo
codex = "codex.cli:cli"
codex-smoke = "codex_cli.app:app"
codex-import-ndjson = "codex.logging.import_ndjson:main"
codex-ml = "codex_ml.cli.main:cli"
codex-ml-cli = "codex_ml.cli.main:cli"
codex-cli = "codex_ml.cli.simple_cli:main"
codex-generate = "codex_ml.cli.generate:main"
codex-infer = "codex_ml.cli.infer:main"
codex-validate-config = "codex_ml.cli.validate:main"
codex-perf = "codex_ml.cli.perf.bench:main"
# NEW: Analysis and Quality Tools (Phase 1 - REPO_ADMIN_IMPLEMENTATION_DECISIONS.md)
codex-analyze = "codex.analysis.cli:analyze_main"
codex-audit = "codex.audit.cli:audit_main"
codex-smell = "codex.quality.cli:smell_main"
codex-metrics = "codex.ast.cli:metrics_main"
# AST framework CLI (Phase 7.2 - Multi-language parser CLI)
codex-ast = "codex.cli.ast_cli:main"
# NEW: Reporting Tools
codex-report = "codex.reporting.cli:report_main"
codex-dashboard = "codex.reporting.cli:dashboard_main"
codex-ndjson = "codex_utils.cli.ndjson_summary:main"
codex-offline-bootstrap = "codex_ml.cli.offline_bootstrap:main"
fence-check = "tools.validate_fences:main"
hhg-train = "hhg_logistics.main:main"
hhg-serve = "hhg_logistics.serve.app:main"
hhg-serve-smoke = "hhg_logistics.serve.smoke:main"
hhg-monitor-serve = "hhg_logistics.monitor.serve_report:main"
hhg-monitor-data = "hhg_logistics.monitor.data_report:main"
hhg-monitor-snapshot = "hhg_logistics.monitor.snapshot:main"
codex-tokenizer = "tokenization.cli:app"
# Consolidated Codex CLI entry points
codex-setup = "cli.setup:main"
codex-patch-runner = "cli.patch_runner:main"
codex-update-runner = "cli.update_runner:main"
codex-script = "cli.script_polish:main"
codex-workflow = "cli.workflow:main"
codex-task-sequence = "cli.task_sequence:main"
codex-ast-upgrade = "cli.ast_upgrade:main"
codex-audit-runner = "cli.audit_runner_root:main"
codex-status-audit = "cli.status_audit:main"
# Cognitive Brain Skills Registry CLI
codex-skill = "codex.skills.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*"]

[tool.setuptools.package-dir]
"" = "src"
agents = "agents"
codex_addons = "codex_addons"
codex_digest = "codex_digest"
codex_utils = "codex_utils"
codex_regression = "codex_regression"
configs = "configs"
interfaces = "interfaces"
tokenization = "src/tokenization"
tools = "tools"
training = "src/training"
examples = "examples"
cli = "cli"
services = "services"

[tool.setuptools.packages.find]
where = [".", "src"]
include = [
  "agents*",
  "codex_ml*",
  "codex*",
  # "config*",  # REMOVED: config/ is a data directory (Hydra configs), not a Python package
  "cli*",
  "common*",
  "cognitive_brain*",
  "services*",  # Re-enabled: Tests need to import from services/ directory
  # Root services/ contains application entry points (not library code), src/services/ is imported as src.services.*
  "tokenization*",
  "training*",
  "codex_utils*",
  "interfaces*",
  "hhg_logistics*",
  "hydra_extra*",
  "examples*",
  "security*",
  "tools*",
  "tools.*",
  "quantum*",
  "cognitive_brain*",
  "zendesk*",
]
exclude = [
  "tests*",
  "torch_stub*",
  ".stubs*",
  "*__pycache__*",
  "configs*",
  "config*",      # Exclude config/ data directory
  "config_legacy*",
  "cli",
  "cli.*",
  "codex_addons*",
  "codex_digest*",
  "codex_regression*",
  "examples",
  "examples.*",
  "interfaces",
  "interfaces.*",
  "build*",
  "dist*",
  "*.tests",
  "*.tests.*",
  "tests.*",
  "tests",
  "*.__pycache__",
  "*.pycache",
  "*.__pycache__.*",
  "__pycache__",
]
namespaces = true

[tool.setuptools.package-data]
# Ensure runtime resources remain available in installed wheels
codex_ml = [
  "**/*.md",
  "**/*.jinja2",
  "**/*.j2",
  "configs/**/*.yaml",
  "configs/**/*.yml",
  "configs/**/*.json",
  "configs/**/*.csv",
]
hhg_logistics = []
configs = [
  "**/*.yaml",
  "**/*.yml",
  "**/*.json",
  "**/*.csv",
  "**/*.env",
  "**/*.md",
]
codex_crm = ["cdm/data/**/*.csv"]
common = []

[tool.setuptools.exclude-package-data]
codex_ml = ["**/tests/*", "torch_stub/*", ".stubs/*"]

[project.entry-points."codex_ml.tokenizers"]
hf = "codex_ml.registry.tokenizers:_build_hf_tokenizer"

# ---------------------------------------------------------------------------
# codex.skills — skill self-registration entry-point group.
# Third-party packages that ship skills register here.  Each entry point
# must point at a SkillManifest instance or a zero-arg factory returning one.
# Built-in skills (under src/codex/skills/) are discovered via filesystem scan
# and intentionally absent here.
# ---------------------------------------------------------------------------
[project.entry-points."codex.skills"]
# (built-in skills discovered via filesystem — no entries needed here)
# Example for a third-party skill package:
#   my_skill = "my_package.skills.my_skill:manifest"

[project.entry-points."codex_ml.reward_models"]
heuristic = "codex_ml.plugins.registries:_reward_model_heuristic"

[project.entry-points."codex_ml.models"]
minilm = "codex_ml.models.registry:_build_minilm"
bert_base_uncased = "codex_ml.models.registry:_build_default_bert"

[project.entry-points."codex_ml.metrics"]
token_accuracy = "codex_ml.metrics.registry:token_accuracy"
ppl = "codex_ml.metrics.registry:perplexity"
exact_match = "codex_ml.metrics.registry:exact_match"
f1 = "codex_ml.metrics.registry:f1"

[project.entry-points."codex_ml.plugins"]
hello = "examples.plugins.hello_plugin:HelloPlugin"
token_accuracy_plugin = "examples.plugins.metrics_token_accuracy_plugin:TokenAccuracyPlugin"

[project.entry-points."codex_ml.data_loaders"]
lines = "codex_ml.data.registry:load_line_dataset"
jsonl = "codex_ml.data.registry:load_jsonl"
csv = "codex_ml.data.registry:load_csv"

[project.entry-points."codex_ml.datasets"]
lines = "codex_ml.data.registry:load_line_dataset"
jsonl = "codex_ml.data.registry:load_jsonl"
csv = "codex_ml.data.registry:load_csv"

[project.entry-points."codex_ml.trainers"]
functional = "codex_ml.registry.trainers:_load_functional_trainer"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# test files frequently use pytest.importorskip() which forces subsequent
# imports to appear after non-import statements — E402 is expected/correct here.
# F811 (redefinition) is intentional in conftest fixtures and importorskip guards.
"tests/**/*.py" = ["E402", "F811"]
"tests/*.py"    = ["E402", "F811"]
# stub packages ship deliberate re-definitions for compatibility — F811 expected.
"torch/**/*.py"               = ["F811"]
"tests/stub_packages/**/*.py" = ["E402", "F811"]

[tool.isort]
profile = "black"
line_length = 100

# Pytest configuration is in pytest.ini (avoids config conflicts)
# See: pytest.ini for complete test configuration including markers, addopts, and filterwarnings

[tool.coverage.run]
branch = true
source = ["src", "agents", "training"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# NOTE: Coverage threshold actively raised each S-session (S107 roadmap).
# Local (minimal env): ~27.5% | CI (torch+full stack): ≥50%.
# Target coverage: 75% (Phase 11 final), then 100%.
#
# ============================================================================
# COVERAGE THRESHOLD - SINGLE SOURCE OF TRUTH (P10-09 — S96 2026-02-28)
# ============================================================================
# This pyproject.toml setting is the authoritative coverage threshold.
# All other tools (.coveragerc, pytest.ini) defer to this configuration.
#
# Incremental roadmap (all dates are targets):
# - Phase 21: 0%  (permissive during migration — completed)
# - Phase 23: 30% (target: 2026-02-15 — completed ✅ S96)
# - Phase 24: 35% (target: 2026-02-28 — completed ✅ S104)
# - Phase 25: 40% (target: 2026-02-28 — completed ✅ S106)
# - Phase 26: 50% (target: 2026-02-28 — completed ✅ S107 — archive+metrics+health+path_utils tests)
# - Phase 27: 60% (target: 2026-03-07 — completed ✅ S116 — autonomy tests added)
# - Phase 28: 65% (target: 2026-03-14 — completed ✅ S116/W-142 — feast+budget exhaustion tests)
# - Phase 29: 75% (target: 2026-03-21 — completed ✅ S116/W-142 — feast backends + integration tests)
# - Phase 30: 80% (target: 2026-03-14 — completed ✅ PR-3514 — sentencepiece contract + ci fixes)
# - Phase 31: 85% (target: 2026-04-01)
# - Phase 32: 90% (target: 2026-04-15)
# - Phase 33+: 100% (aspirational: 2026-05-01)
# Owner: @mbaetiong
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.pip-audit]
# CVE-2025-69872: diskcache <=5.6.3 uses pickle serialization by default,
# enabling RCE if an attacker has write access to the cache directory.
# Status: No patched version available (5.6.3 is the latest release).
# diskcache is an indirect dependency via dvc-data -> dvc (dev extra only)
# and is not used directly in application code.
# Tracked in Dependabot alert #89. Re-evaluate when a fix is published.
ignore-vulns = ["CVE-2025-69872"]
