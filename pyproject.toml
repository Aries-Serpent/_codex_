[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B",
    "E402",
    "F811",
    "F821",
    "F841",
    "UP",
]
"tests/github/*.py" = [
    "F841",
]
"tests/*.py" = [
    "E402",
    "F811",
    "F821",
]
"torch/**/*.py" = [
    "F811",
]
"tests/stub_packages/**/*.py" = [
    "E402",
    "F811",
]
"tests/security/*.py" = [
    "F821",  # xfail tests with intentionally undefined decorators for features not yet implemented
]
"scripts/ci/rate_limit_orchestrator.py" = [
    "E501",
]
# Legacy operational tooling and agent prompt scripts: defer full E/B/UP/LOG
# remediation to the Phase 3 burn-down plan to keep the Phase 0 diff minimal.
"scripts/**/*.py" = [
    "B",
    "E",
    "LOG",
    "UP",
]
"tools/**/*.py" = [
    "B",
    "E",
    "LOG",
    "UP",
]
"agents/**/*.py" = [
    "B",
    "E",
    "LOG",
    "UP",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
branch = true
source = [
    "src",
    "agents",
    "training",
    "scripts",
    "services",
]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# BASELINE_PHASE: fail_under locked to 34 (2026-07-02)
# Baseline coverage: 34.63% ± 1.5% (33.13% - 36.13%)
# See .codex/COVERAGE_BASELINE_34_63.json and .codex/COVERAGE_VALIDATION_CRITERIA.md
# Previous fail_under = 70 archived as ASPIRATIONAL_PHASE_30 target
fail_under = 34
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.pip-audit]
ignore-vulns = [
    "CVE-2025-69872",
    "CVE-2024-35515",
    "PYSEC-2026-597",
    "CVE-2025-3000",
]

[tool.uv]
environments = [
    "python_version == '3.12.*' and sys_platform == 'linux'",
]
conflicts = [
    [
        { extra = "ge" },
        { extra = "marshmallow-v4" },
    ],
]
constraint-dependencies = [
    "dulwich>=1.2.5",
    "aiohttp>=3.14.0",
]

[tool.mutmut]
also_copy = [
    "src/",
    "tests/smoke/",
    "tests/repro/",
    "tests/unit/",
]
pytest_add_cli_args = [
    "-x",
    "-q",
    "--no-header",
    "--ignore=tests/agents",
    "--ignore=tests/services",
]
tests_dir = [
    "tests/smoke/test_determinism.py",
    "tests/unit/test_gap22_mutation_killers.py",
]
do_not_mutate = ["*__pycache__*", "*.pyc"]
debug = true
paths_to_mutate = [
    "src/codex_ml/utils/determinism.py",
    "src/codex_ml/utils/seed.py",
]
