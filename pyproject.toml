[build-system]
requires = ["setuptools>=78.1.1", "wheel"]  # Security: Updated from 67 to fix CVE-2024-6345, CVE-2025-47273 (RCE)
build-backend = "setuptools.build_meta"

# Rust extension module configuration (optional, for future migration)
# To enable Rust extension: uncomment below and comment out above
# [build-system]
# requires = ["maturin>=1.4,<2.0"]
# build-backend = "maturin"

[project]
name = "codex-ml"
description = "Codex ML training, evaluation, and plugin framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Aries Serpent" }
]
keywords = ["ml", "training", "evaluation", "plugins", "hydra", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
# Ensure runtime dependencies remain declared so console entrypoints import successfully
dependencies = [
  "omegaconf>=2.3",
  "hydra-core==1.3.2",
  "pydantic>=2.4",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "pandas>=2.1",
  "marshmallow>=4.0.0,<5",  # Upgraded to 4.x; great-expectations (requires <4) moved to [ge] extras
  "mlflow>=2.22.4,<4",  # Security: Updated from 2.4 to fix 43+ vulnerabilities (RCE, auth bypass, path traversal)
  "transformers>=5.5.3,<6",  # Security: Updated from 4.41 to fix deserialization vulnerabilities
  "peft>=0.11,<1",
  "accelerate>=0.31,<2",
  "datasets>=2.19,<5",
  "lm-eval>=0.4.2,<1",
  "ray[serve]>=2.9,<3",
  "fastapi>=0.135.3,<1",
  "slowapi>=0.1.9",
  "starlette>=0.37.2,<0.51",
  "httpx>=0.26,<1",
  "evidently>=0.4.28,<1",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "duckdb>=0.10",
  "sentencepiece>=0.1.99",
  "torch>=2.6.0,<3.0.0",  # Security: Updated from 2.2.2 to fix RCE in torch.load with weights_only=True
  "typer>=0.12",
  # AST Analysis Core Dependencies
  "libcst>=1.0.0",
  "radon>=6.0.0",
  "parso>=0.8.0",
  # Security: IP-005 dependency updates - addressing 26 known vulnerabilities
  "jinja2>=3.1.6",  # Security: Fixes CVE-2024-56326, CVE-2024-56201 (RCE via sandbox escape)
  "certifi>=2024.7.4",  # Security: Fixes CVE-2024-39689 (root cert trust issue)
  "filelock>=3.20.3",  # Security: Fixes CVE-2025-68146, CVE-2026-22701 (TOCTOU attacks)
  "idna>=3.7",  # Security: Fixes CVE-2024-3651 (DoS via quadratic complexity)
  "urllib3>=2.6.3",  # Security: Fixes CVE-2024-37891, CVE-2025-50181 (proxy/redirect issues)
  "requests>=2.32.4",  # Security: Fixes CVE-2024-35195, CVE-2024-47081 (TLS bypass, credential leak)
  "defusedxml>=0.7.1",  # Security: XXE prevention for XML parsing (cli.py defuse_stdlib, solution_xml.py)
]

# Version may be injected by CI or read dynamically.
# If you keep a __version__ in package, uncomment the next line and remove the explicit version field.
# dynamic = ["version"]
version = "0.9.0"

[project.optional-dependencies]
analysis = ["libcst>=1.0", "parso>=0.10"]
ast = [
  "tree-sitter>=0.20.0",
  "tree-sitter-python>=0.20.0",
  "tree-sitter-yaml>=0.20.0",
  "sqlparse>=0.5.0",
]
auth = [
  "PyJWT>=2.12.1,<3.0.0",  # >=2.12.0 fixes CVE-2026-32597 (crit header bypass, CVSS 7.5)
  "cryptography>=42.0.0,<47.0.0",
  "PyNaCl>=1.5.0,<2.0.0",
]
cli = ["typer>=0.9", "click>=8.1"]
ge = [
  "great_expectations>=0.18.7,<2",
  "marshmallow>=3.7.1,<4",  # GE requires marshmallow<4; conflicts with marshmallow 4.x core dep
]
configs = [
  "hydra-core[hydra_plugins]>=1.3",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
]
hydra = [
  "hydra-core[hydra_plugins]>=1.3",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
]
dev = [
  "pytest>=8.2.0,<10.0.0",
  "pytest-cov>=4.1.0,<6.0.0",
  "pytest-xdist>=3.5.0,<4.0.0",
  "pytest-timeout>=2.2.0,<3.0.0",
  "pytest-asyncio>=0.23.0,<2.0.0",
  "pytest-mock>=3.12.0,<4.0.0",
  "pytest-randomly>=3.15",
  "pytest-rerunfailures>=12.0",
  "pytest-split>=0.11.0",  # For test sharding in CI
  "hypothesis>=6.98.0,<7.0.0",
  "ruff>=0.1.15,<1.0.0",
  "jsonschema>=4.0",
  "black>=24.0.0,<27.0.0",
  "isort>=8.0.1",
  "mypy>=1.8.0,<2.0.0",
  "dvc==3.67.0",
  "pre-commit>=3.6.0,<5.0.0",
  "nox>=2024.4.15",
  "nbstripout>=0.6",
  "tomli>=2.0; python_version < '3.11'",
  "yamllint>=1.35.1,<2.0.0",
]
dist = ["torch>=2.6.0,<3.0.0; platform_system != 'Windows'"]  # Security: match main dependencies
github = [
  "PyGithub>=2.1.1,<3.0.0",  # GitHub API client for workflow monitoring
]
gpu = ["nvidia-ml-py3>=7.352.0"]
logging = [
  "duckdb>=0.10",
  "jsonschema>=4.18",
  "pandas>=2.0",
  "tensorboard>=2.14",
]
metrics = [
  "nltk>=3.8",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4",
]
ml = [
  "datasets>=2.19,<5",
  "peft>=0.11,<1",
  "sentencepiece>=0.1.99",
  "torch>=2.6.0,<3.0.0",  # Security: updated from 2.2.2 to fix RCE
  "transformers>=5.5.3,<6",  # Security: updated from 4.41 to fix deserialization
  "accelerate>=0.31,<2",
]
monitoring = ["prometheus-client>=0.14", "psutil>=5.9", "pynvml>=11.5"]
ops = ["requests>=2.32.4", "PyJWT>=2.12.1"]  # Security: >=2.12.0 fixes CVE-2026-32597 (crit header bypass)
playwright = ["playwright>=1.40"]  # Optional: browser-based alert scraping (scripts/security/playwright_scraper.py)
perf = ["numpy>=1.24; python_version<'3.13'", "mlflow>=2.22.4,<4"]  # Security: updated from 2.0
sharding = ["xxhash>=3.0.0"]  # Optional: 10-100x faster hashing for index sharding (PS-06)
plugins = ["importlib-metadata; python_version < '3.10'"]
rag = [
  # sentence-transformers>=5.2.0 supports transformers<6.0.0 (i.e., transformers 5.x)
