[build-system]
requires = ["setuptools>=67", "wheel", "maturin>=1.4,<2.0"]
build-backend = "setuptools.build_meta"

# Rust extension module configuration (optional, for future migration)
# To enable Rust extension: change build-backend to "maturin"
# [build-system]
# requires = ["maturin>=1.4,<2.0"]
# build-backend = "maturin"

[project]
name = "codex-ml"
description = "Codex ML training, evaluation, and plugin framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  { name = "Aries Serpent" }
]
keywords = ["ml", "training", "evaluation", "plugins", "hydra", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
# Ensure runtime dependencies remain declared so console entrypoints import successfully
dependencies = [
  "omegaconf>=2.3",
  "hydra-core==1.3.2",
  "pydantic>=2.4",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "pandas>=2.1",
  "great_expectations==0.18.7",
  "mlflow>=2.22.4,<4",  # Security: Updated from 2.4 to fix 43+ vulnerabilities (RCE, auth bypass, path traversal)
  "transformers>=4.48.0,<5",  # Security: Updated from 4.41 to fix deserialization vulnerabilities
  "peft>=0.11,<1",
  "accelerate>=0.31,<2",
  "datasets>=2.19,<5",
  "lm-eval>=0.4.2,<1",
  "ray[serve]>=2.9,<3",
  "fastapi>=0.110,<1",
  "starlette>=0.37.2,<0.51",
  "httpx>=0.26,<1",
  "evidently>=0.4.28,<1",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "duckdb>=0.10",
  "sentencepiece>=0.1.99",
  "torch>=2.6.0,<3.0.0",  # Security: Updated from 2.2.2 to fix RCE in torch.load with weights_only=True
  "typer>=0.12",
  # AST Analysis Core Dependencies
  "libcst>=1.0.0",
  "radon>=6.0.0",
  "parso>=0.8.0",
]

# Version may be injected by CI or read dynamically.
# If you keep a __version__ in package, uncomment the next line and remove the explicit version field.
# dynamic = ["version"]
version = "0.0.0"

[project.optional-dependencies]
analysis = ["libcst>=1.0", "parso>=0.10"]
ast = [
  "tree-sitter>=0.20.0",
  "tree-sitter-python>=0.20.0",
  "tree-sitter-yaml>=0.20.0",
  "sqlparse>=0.5.0",
]
cli = ["typer>=0.9", "click>=8.1"]
configs = [
  "hydra-core[hydra_plugins]>=1.3",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
]
hydra = [
  "hydra-core[hydra_plugins]>=1.3",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-randomly>=3.15",
  "pytest-timeout>=2.1",
  "pytest-split>=0.8",  # For test sharding in CI
  "hypothesis>=6.100",
  "ruff>=0.4",
  "jsonschema>=4.0",
  "black>=24.8",
  "isort>=5.13",
  "mypy>=1.10",
  "dvc==3.64.2",
  "pre-commit>=3.7",
  "nox>=2024.4.15",
  "nbstripout>=0.6",
  "pytest-mock>=3.14",
  "tomli>=2.0; python_version < '3.11'",
]
dist = ["torch>=2.6.0,<3.0.0; platform_system != 'Windows'"]  # Security: match main dependencies
gpu = ["nvidia-ml-py3>=7.352.0"]
logging = [
  "duckdb>=0.10",
  "jsonschema>=4.18",
  "pandas>=2.0",
  "tensorboard>=2.14",
]
metrics = [
  "nltk>=3.8",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4",
]
ml = [
  "datasets>=2.19,<5",
  "peft>=0.11,<1",
  "sentencepiece>=0.1.99",
  "torch>=2.6.0,<3.0.0",  # Security: updated from 2.2.2 to fix RCE
  "transformers>=4.48.0,<5",  # Security: updated from 4.41 to fix deserialization
  "accelerate>=0.31,<2",
]
monitoring = ["prometheus-client>=0.14", "psutil>=5.9", "pynvml>=11.5"]
ops = ["requests>=2.31", "PyJWT>=2.8"]
perf = ["numpy>=1.24; python_version<'3.13'", "mlflow>=2.22.4,<4"]  # Security: updated from 2.0
sharding = ["xxhash>=3.0.0"]  # Optional: 10-100x faster hashing for index sharding (PS-06)
plugins = ["importlib-metadata; python_version < '3.10'"]
rag = [
  "sentence-transformers>=2.2",
  "faiss-cpu>=1.7.4",
  "openai>=1.0; python_version >= '3.8'",  # Optional for OpenAI embeddings
]
symbolic = ["sentencepiece>=0.1.99", "tokenizers>=0.14"]
"test-core" = [
  "hydra-core[hydra_plugins]>=1.3",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-randomly>=3.10",
  "hypothesis>=6.100",
  "packaging>=21.0",  # Required for packaging.version.parse() in integration tests
  "tomli>=2.0; python_version < '3.11'",
]
test = [
  "hydra-core[hydra_plugins]>=1.3",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-randomly>=3.10",
  "hypothesis>=6.100",
  "packaging>=21.0",  # Required for packaging.version.parse() in integration tests
  "transformers>=4.48.0,<5",  # Security: updated from 4.41 to fix deserialization
  "torch>=2.6.0,<3.0.0; platform_system != 'Windows'",  # Security: updated from 2.2.2 to fix RCE
  "datasets>=2.19,<5",
  "accelerate>=0.31,<2",
  "sentencepiece>=0.1.99",
  "tokenizers>=0.15",
]
tokenizer = ["sentencepiece>=0.1.99"]
tokenizers = ["tokenizers>=0.15"]
tracking = [
  "mlflow>=2.22.4,<4",  # Security: updated from 2.11 to fix 43+ vulnerabilities
  "wandb>=0.16",
  "pandas>=2.0",
]
train = [
  "torch>=2.6.0,<3.0.0; platform_system != 'Windows'",  # Security: updated from 2.2.2 to fix RCE
  "transformers>=4.48.0,<5",  # Security: updated from 4.41 to fix deserialization
  "accelerate>=0.31,<2",
  "peft>=0.11,<1",
  "mlflow>=2.22.4,<4",  # Security: updated from 2.11 to fix 43+ vulnerabilities
]

all = [
  "accelerate>=0.31,<2",
  "datasets>=2.19,<5",
  "duckdb>=0.10",
  "hydra-core[hydra_plugins]>=1.3",
  "hypothesis>=6.100",
  "importlib-metadata; python_version < '3.10'",
  "jsonschema>=4.18",
  "mlflow>=2.22.4,<4",  # Security: updated from 2.11 to fix 43+ vulnerabilities
  "mypy>=1.10",
  "nox>=2024.4.15",
  "numpy>=1.24; python_version<'3.13'",
  "omegaconf>=2.3",
  "pandas>=2.0",
  "peft>=0.11,<1",
  "pre-commit>=3.7",
  "prometheus-client>=0.14",
  "psutil>=5.9",
  "PyJWT>=2.8",
  "PyYAML>=6.0",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-randomly>=3.10",
  "pynvml>=11.5",
  "ruff>=0.4",
  "sentencepiece>=0.1.99",
  "tensorboard>=2.14",
  "tokenizers>=0.15",
  "tomli>=2.0; python_version < '3.11'",
  "torch>=2.6.0,<3.0.0",  # Security: updated from 2.2.2 to fix RCE
  "transformers>=4.48.0,<5",  # Security: updated from 4.41 to fix deserialization
  "wandb>=0.16",
]


[project.scripts]
# Canonical entrypoints
codex-train = "codex_ml.cli.entrypoints:train_main"
codex-eval = "codex_ml.cli.entrypoints:eval_main"
codex-list-plugins = "codex_ml.cli.list_plugins:main"
# Preserve legacy/extended scripts present in this repo
codex = "codex.cli:cli"
codex-smoke = "codex_cli.app:app"
codex-import-ndjson = "codex.logging.import_ndjson:main"
codex-ml = "codex_ml.cli.main:cli"
codex-ml-cli = "codex_ml.cli.main:cli"
codex-cli = "codex_ml.cli.simple_cli:main"
codex-generate = "codex_ml.cli.generate:main"
codex-infer = "codex_ml.cli.infer:main"
codex-validate-config = "codex_ml.cli.validate:main"
codex-perf = "codex_ml.cli.perf.bench:main"
# NEW: Analysis and Quality Tools (Phase 1 - REPO_ADMIN_IMPLEMENTATION_DECISIONS.md)
codex-analyze = "codex.analysis.cli:analyze_main"
codex-audit = "codex.audit.cli:audit_main"
codex-smell = "codex.quality.cli:smell_main"
codex-metrics = "codex.ast.cli:metrics_main"
# AST Standardization Tools (Phase 1 Complete)
codex-ast = "codex.ast.cli:app"
# NEW: Reporting Tools  
codex-report = "codex.reporting.cli:report_main"
codex-dashboard = "codex.reporting.cli:dashboard_main"
codex-ndjson = "codex_utils.cli.ndjson_summary:main"
codex-offline-bootstrap = "codex_ml.cli.offline_bootstrap:main"
fence-check = "tools.validate_fences:main"
hhg-train = "hhg_logistics.main:main"
hhg-serve = "hhg_logistics.serve.app:main"
hhg-serve-smoke = "hhg_logistics.serve.smoke:main"
hhg-monitor-serve = "hhg_logistics.monitor.serve_report:main"
hhg-monitor-data = "hhg_logistics.monitor.data_report:main"
hhg-monitor-snapshot = "hhg_logistics.monitor.snapshot:main"
codex-tokenizer = "tokenization.cli:app"
# Consolidated Codex CLI entry points
codex-setup = "cli.setup:main"
codex-patch-runner = "cli.patch_runner:main"
codex-update-runner = "cli.update_runner:main"
codex-script = "cli.script_polish:main"
codex-workflow = "cli.workflow:main"
codex-task-sequence = "cli.task_sequence:main"
codex-ast-upgrade = "cli.ast_upgrade:main"
codex-audit-runner = "cli.audit_runner_root:main"
codex-status-audit = "cli.status_audit:main"

[tool.setuptools]

[tool.setuptools.package-dir]
"" = "src"
agents = "agents"
codex_addons = "codex_addons"
codex_digest = "codex_digest"
codex_utils = "codex_utils"
codex_regression = "codex_regression"
configs = "configs"
interfaces = "interfaces"
tokenization = "src/tokenization"
tools = "tools"
training = "src/training"
examples = "examples"
cli = "cli"

[tool.setuptools.packages.find]
where = [".", "src"]
include = [
  "agents*",
  "codex_ml*",
  "codex*",
  "config*",
  "cli*",
  "common*",
  "cognitive_brain*",
  # NOTE: services* intentionally excluded - see AGENTS.md "Project Structure" section for services/ layout and import patterns.
  # Root services/ contains application entry points (not library code), src/services/ is imported as src.services.*
  "tokenization*",
  "training*",
  "codex_utils*",
  "interfaces*",
  "hhg_logistics*",
  "hydra_extra*",
  "examples*",
  "security*",
  "tools*",
  "tools.*",
  "quantum*",
  "cognitive_brain*",
  "zendesk*",
]
exclude = [
  "tests*",
  "torch_stub*",
  ".stubs*",
  "*__pycache__*",
  "configs*",
  "config_legacy*",
  "cli",
  "cli.*",
  "codex_addons*",
  "codex_digest*",
  "codex_regression*",
  "examples",
  "examples.*",
  "interfaces",
  "interfaces.*",
  "build*",
  "dist*",
  "*.tests",
  "*.tests.*",
  "tests.*",
  "tests",
  "*.__pycache__",
  "*.pycache",
  "*.__pycache__.*",
  "__pycache__",
]
namespaces = true

[tool.setuptools.package-data]
# Ensure runtime resources remain available in installed wheels
codex_ml = [
  "**/*.md",
  "**/*.jinja2",
  "**/*.j2",
  "configs/**/*.yaml",
  "configs/**/*.yml",
  "configs/**/*.json",
  "configs/**/*.csv",
]
hhg_logistics = []
configs = [
  "**/*.yaml",
  "**/*.yml",
  "**/*.json",
  "**/*.csv",
  "**/*.env",
  "**/*.md",
]
codex_crm = ["cdm/data/**/*.csv"]
common = []

[tool.setuptools.exclude-package-data]
codex_ml = ["**/tests/*", "torch_stub/*", ".stubs/*"]

[project.entry-points."codex_ml.tokenizers"]
hf = "codex_ml.registry.tokenizers:_build_hf_tokenizer"

[project.entry-points."codex_ml.reward_models"]
heuristic = "codex_ml.plugins.registries:_reward_model_heuristic"

[project.entry-points."codex_ml.models"]
minilm = "codex_ml.models.registry:_build_minilm"
bert_base_uncased = "codex_ml.models.registry:_build_default_bert"

[project.entry-points."codex_ml.metrics"]
token_accuracy = "codex_ml.metrics.registry:token_accuracy"
ppl = "codex_ml.metrics.registry:perplexity"
exact_match = "codex_ml.metrics.registry:exact_match"
f1 = "codex_ml.metrics.registry:f1"

[project.entry-points."codex_ml.plugins"]
hello = "examples.plugins.hello_plugin:HelloPlugin"
token_accuracy_plugin = "examples.plugins.metrics_token_accuracy_plugin:TokenAccuracyPlugin"

[project.entry-points."codex_ml.data_loaders"]
lines = "codex_ml.data.registry:load_line_dataset"
jsonl = "codex_ml.data.registry:load_jsonl"
csv = "codex_ml.data.registry:load_csv"

[project.entry-points."codex_ml.datasets"]
lines = "codex_ml.data.registry:load_line_dataset"
jsonl = "codex_ml.data.registry:load_jsonl"
csv = "codex_ml.data.registry:load_csv"

[project.entry-points."codex_ml.trainers"]
functional = "codex_ml.registry.trainers:_load_functional_trainer"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E","F","I"]
ignore = []

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "smoke: quick smoke tests for CLI",
    "integration: integration tests",
    "slow: slow/resource-intensive tests",
    "templates: documentation template validation",
]

[tool.coverage.run]
branch = true
source = ["src", "agents", "training"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
