[tool.setuptools]
# Standardized package discovery: all packages in src/ by default,
# with explicit mappings for root-level packages that need inclusion
# and package-discovery configuration

[tool.setuptools.package-dir]
"" = "src"
agents = "agents"
services = "services"
scripts = "scripts"
tools = "tools"
training = "training"
tokenization = "tokenization"
codex_utils = "codex_utils"
interfaces = "interfaces"

[tool.setuptools.packages.find]
where = [
    ".",
    "src",
]
# Bundled packages (production code and AI subsystems)
include = [
    "agents*",              # AI agents subsystem
    "aries_serpent_core*",  # Core Aries Serpent logging and utilities (required by CLI)
    "codex_ml*",            # ML training, evaluation, and utilities
    "codex*",               # Core utilities (codex, codex_bridge, etc.)
    "common*",              # Common utilities
    "cognitive_brain*",     # Cognitive Brain AI system
    "services*",            # Service integrations
    "tokenization*",        # Tokenization infrastructure
    "training*",            # Training pipeline
    "codex_utils*",         # Codex utilities
    "interfaces*",          # Public interfaces
    "hhg_logistics*",       # HHG logistics subsystem
    "hydra_extra*",         # Hydra configuration extensions
    "offline_zip_keymaster*", # Standalone ZIP key generation package
    "offline_zip_keymaster.*",
    "scripts*",             # Repo-local scripts package for packaged tooling
    "scripts.*",            # Scripts submodules
    "security",             # Security infrastructure (core package)
    "security.*",           # Security submodules
    "tools*",               # Tools and utilities
    "tools.*",              # Tool submodules
    "quantum*",             # Quantum orchestrator
    "zendesk*",             # Zendesk integration
    "config",               # Configuration (core package)
    "codex_bridge",         # Bridge infrastructure
]
# Excluded packages (development-only, test, or temporary code)
exclude = [
    "tests*",                       # Test suites (development only)
    "torch*",                       # Local PyTorch stub (not part of runtime package)
    "torch.*",                      # Local PyTorch stub modules
    "torch_stub*",                  # Stub implementations
    ".stubs*",                      # Type stub files
    "*__pycache__*",                # Python cache (all variants)
    "security-suite-artifacts*",    # Artifact storage
    "configs*",                     # Configuration files (not Python packages)
    "cli",                          # CLI module (development only)
    "cli.*",                        # CLI submodules
    "codex_addons*",                # Add-on packages (not bundled)
    "codex_digest*",                # Digest utilities (not bundled)
    "codex_regression*",            # Regression testing (not bundled)
    "examples",                     # Examples/demos (development only)
    "examples.*",                   # Example submodules (development only)
    "interfaces",                   # Excluded to prevent duplication (see include)
    "interfaces.*",                 # Interface submodules (excluded due to specificity)
    "build*",                       # Build artifacts
    "dist*",                        # Distribution artifacts
    "*.tests",                      # Test modules (any package)
    "*.tests.*",                    # Test submodules
    "tests.*",                      # Test packages
    "tests",                        # Root tests directory
    "*.__pycache__",                # Cache variant
    "*.pycache",                    # Cache variant
    "*.__pycache__.*",              # Cache variant
    "__pycache__",                  # Python cache directory
    "codex.db*",                    # Database files
]
namespaces = true

[tool.setuptools.package-data]
codex_ml = [
    "**/*.md",
    "**/*.jinja2",
    "**/*.j2",
    "configs/**/*.yaml",
    "configs/**/*.yml",
    "configs/**/*.json",
    "configs/**/*.csv",
]
hhg_logistics = []
configs = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/*.csv",
    "**/*.env",
    "**/*.md",
]
codex_crm = [
    "cdm/data/**/*.csv",
]
common = []

[tool.setuptools.exclude-package-data]
"*" = [
    "**/__pycache__/*",
    "**/*.py[cod]",
]
codex_ml = [
    "**/tests/*",
    "torch_stub/*",
    ".stubs/*",
]

[tool.black]
line-length = 100
target-version = [
    "py39",
    "py310",
    "py311",
]

[tool.ruff]
line-length = 100
# Exclude non-first-party trees (archived consolidation dumps, generated
# artifacts, historical reports). Phase 0: these are not maintained source.
exclude = [
    ".codex/**",
]

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear (Phase 0 production readiness)
    "E",
    "F",
    "I",
    "LOG",  # flake8-logging (Phase 0 production readiness)
    "UP",  # pyupgrade (Phase 0 production readiness)
]
# Global ignores below keep CI green while pre-existing findings are burned
# down incrementally; see the Phase 3 burn-down plan.
# E501/E402/F401/I001/F841/F821/F631/F541 were already enabled (E,F,I) and
# failing repo-wide before Phase 0 (~13.9k errors at baseline); they are
# temporarily parked here so `ruff check` is green while they are burned
# down in Phase 3 alongside the new B/LOG/UP findings.
ignore = [
    # --- Pre-existing E/F/I backlog (baseline failure at Phase 0 start) ---
    "E501",  # line-too-long (9717 baseline hits; Phase 3 burn-down)
    "E402",  # module-import-not-at-top-of-file (1324 baseline hits; Phase 3 burn-down)
    "F401",  # unused-import (790 baseline hits; Phase 3 burn-down)
    "I001",  # unsorted-imports (550 baseline hits; Phase 3 burn-down)
    "F841",  # unused-variable (344 baseline hits; Phase 3 burn-down)
    "F821",  # undefined-name (377 baseline hits; Phase 3 burn-down)
    "F631",  # assert-tuple (248 baseline hits; Phase 3 burn-down)
    "F541",  # f-string-missing-placeholders (231 baseline hits; Phase 3 burn-down)
    # --- New B/LOG/UP rules enabled in Phase 0 ---
    "B904",  # raise-without-from-inside-except (185 hits; Phase 3 burn-down)
    "B017",  # assert-raises-exception (155 hits; mostly tests; Phase 3 burn-down)
    "B018",  # useless-expression (748 hits; Phase 3 burn-down)
    "B008",  # function-call-in-default-argument (65 hits; Phase 3 burn-down)
    "B007",  # unused-loop-control-variable (48 hits; Phase 3 burn-down)
    "B905",  # zip-without-explicit-strict (40 hits; Phase 3 burn-down)
    "UP045",  # non-pep604-annotation-optional (8585 hits; requires py310+ target; Phase 3 burn-down)
    "UP007",  # non-pep604-annotation-union (72 hits; requires py310+ target; Phase 3 burn-down)
    "UP042",  # replace-str-enum (103 hits; requires py311+ target; Phase 3 burn-down)
    "UP006",  # non-pep585-annotation (1504 hits; Phase 3 burn-down)
    "UP024",  # os-error-alias (757 hits; Phase 3 burn-down)
    "UP017",  # datetime-timezone-utc (520 hits; Phase 3 burn-down)
    "UP035",  # deprecated-import (386 hits; Phase 3 burn-down)
    "UP037",  # quoted-annotation (95 hits; Phase 3 burn-down)
    "UP015",  # redundant-open-modes (71 hits; Phase 3 burn-down)
    "UP047",  # non-pep695-generic-function (37 hits; requires py312+ target; Phase 3 burn-down)
    "UP046",  # non-pep695-generic-class (14 hits; requires py312+ target; Phase 3 burn-down)
    "UP040",  # non-pep695-type-alias (11 hits; requires py312+ target; Phase 3 burn-down)
    # --- Residual low-count rules parked for Phase 3 (231 -> 0 target) ---
    "E741",  # ambiguous-variable-name (28 hits; Phase 3 burn-down)
    "E722",  # bare-except (20 hits; Phase 3 burn-down)
    "E721",  # type-comparison (20 hits; Phase 3 burn-down)
    "F822",  # undefined-export (13 hits; Phase 3 burn-down)
    "UP041",  # timeout-error-alias (11 hits; Phase 3 burn-down)
    "B028",  # no-explicit-stacklevel (9 hits; Phase 3 burn-down)
    "LOG015",  # root-logger-call (9 hits; Phase 3 burn-down)
    "B023",  # function-uses-loop-variable (8 hits; Phase 3 burn-down)
    "B009",  # get-attr-with-constant (7 hits; Phase 3 burn-down)
    "B027",  # empty-method-without-abstract-decorator (6 hits; Phase 3 burn-down)
    "B010",  # set-attr-with-constant (6 hits; Phase 3 burn-down)
    "UP031",  # printf-string-formatting (4 hits; Phase 3 burn-down)
    "LOG004",  # log-exception-outside-except-handler (3 hits; Phase 3 burn-down)
    "B024",  # abstract-base-class-without-abstract-method (2 hits; Phase 3 burn-down)
    "LOG014",  # exc-info-outside-except-handler (2 hits; Phase 3 burn-down)
    "UP034",  # extraneous-parentheses (2 hits; Phase 3 burn-down)
    "UP032",  # f-string (2 hits; Phase 3 burn-down)
    "F402",  # import-shadowed-by-loop-var (2 hits; Phase 3 burn-down)
    "F811",  # redefined-while-unused (2 hits; Phase 3 burn-down)
    "B005",  # strip-with-multi-characters (2 hits; Phase 3 burn-down)
    "B004",  # unreliable-callable-check (2 hits; Phase 3 burn-down)
    "UP009",  # utf8-encoding-declaration (2 hits; Phase 3 burn-down)
    "B019",  # cached-instance-method (1 hit; Phase 3 burn-down)
    "B025",  # duplicate-try-block-exception (1 hit; Phase 3 burn-down)
    "E731",  # lambda-assignment (1 hit; Phase 3 burn-down)
    "F601",  # multi-value-repeated-key-literal (1 hit; Phase 3 burn-down)
    "E711",  # none-comparison (1 hit; Phase 3 burn-down)
    "UP036",  # outdated-version-block (1 hit; Phase 3 burn-down)
