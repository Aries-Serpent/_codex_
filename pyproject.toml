    # Monitoring & telemetry
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    # Evidence generation
    "evidently>=0.7.21,<1",
    # Database
    "duckdb>=1.5.5",
    # RAG pipeline
    "sentence-transformers>=6.0.0,<7.0.0",
    "chromadb>=1.5.9",  # Security: Issue #5299 - Code injection vulnerability in <=1.5.9, using latest stable
    "faiss-cpu>=1.15.0,<2.0.0",
]

