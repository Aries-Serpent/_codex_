# Training configuration schema (subset of fields)
$schema: https://json-schema.org/draft/2020-12/schema
$title: CodexTrainingConfig
$type: object
required:
  - training
properties:
  training:
    type: object
    required:
      - seed
      - learning_rate
      - batch_size
      - epochs
    properties:
      seed:
        type: integer
        minimum: 0
      learning_rate:
        type: number
        exclusiveMinimum: 0
      batch_size:
        type: integer
        minimum: 1
      epochs:
        type: integer
        minimum: 1
      deterministic:
        type: boolean
      checkpoint:
        type: object
        properties:
          dir:
            type: string
          keep_best_k:
            type: integer
            minimum: 1
