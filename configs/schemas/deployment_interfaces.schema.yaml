$schema: https://json-schema.org/draft/2020-12/schema
$id: https://codexml.dev/schemas/deployment_interfaces.schema.yaml
title: DeploymentInterfaces
type: object
additionalProperties: false
patternProperties:
  ".*":
    type: object
    additionalProperties: false
    required:
      - path
    properties:
      path:
        type: string
        description: Python import path to the implementation.
      kwargs:
        type: object
        description: Keyword arguments forwarded to the constructor.
