# Reasoning evaluation preset for local CI gates.

defaults:
  - base

output:
  dir: ${oc.env:CODEX_REASONING_EVAL_DIR, ${hydra:runtime.cwd}/artifacts/reasoning_eval/local_ci}

# Keep the run lightweight for developers.
datasets:
  proof_logs:
    path: ${oc.env:CODEX_REASONING_DATA_DIR, ${hydra:runtime.cwd}/data/sample/reasoning}/proof_logs.jsonl
    limit: ${oc.env:CODEX_REASONING_PROOF_LIMIT, 10}
  math_word_problems:
    path: ${oc.env:CODEX_REASONING_DATA_DIR, ${hydra:runtime.cwd}/data/sample/reasoning}/math_word_problems.jsonl
    limit: ${oc.env:CODEX_REASONING_MATH_LIMIT, 10}
  tool_traces:
    path: ${oc.env:CODEX_REASONING_DATA_DIR, ${hydra:runtime.cwd}/data/sample/reasoning}/tool_traces.jsonl
    limit: ${oc.env:CODEX_REASONING_TOOL_LIMIT, 10}
