# Base Hydra model configuration
# Used for testing and default model setup

defaults:
  - _self_

# Model architecture
model:
  # Model type
  type: "transformer"
  
  # Architecture parameters
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  
  # Dropout
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  
  # Activation
  hidden_act: "gelu"
  
  # Initialization
  initializer_range: 0.02
  
  # Tokenization
  vocab_size: 50257
  max_position_embeddings: 1024
