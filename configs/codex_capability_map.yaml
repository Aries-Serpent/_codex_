      - "src/mcp/auth.py"
      - "src/mcp/server/http.py"
    tests:
      - "tests/mcp/test_http_server.py"
    docs:
      - "docs/mcp/authentication.md"

  mcp-rate-limiting:
    code:
      - "src/mcp/rate_limit.py"
      - "src/mcp/server/http.py"
    tests:
      - "tests/mcp/test_http_server.py"
    docs:
      - "docs/mcp/rate_limiting.md"

  mcp-observability:
    code:
      - "src/mcp/observability.py"
      - "src/mcp/server/http.py"
    tests:
      - "tests/mcp/test_http_server.py"
    docs:
      - "docs/mcp/observability.md"

  mcp-versioning:
    code:
      - "src/mcp/versioning.py"
    tests:
      - "tests/mcp/test_server.py"
    docs:
      - "docs/mcp/version_negotiation.md"
