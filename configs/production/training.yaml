# Production Training Configuration
# Phase 6.5: Training Enhancements
# Early stopping, schedulers, and training optimizations

training:
  # Early stopping configuration
  early_stopping:
    enabled: true
    
    # What metric to monitor
    monitor: "val_loss"
    
    # Mode: min (for loss) or max (for accuracy)
    mode: "min"
    
    # Number of epochs with no improvement to wait
    patience: 5
    
    # Minimum change to qualify as improvement
    min_delta: 0.001
    
    # Restore best weights on early stop
    restore_best_weights: true
    
    # Start monitoring after N epochs
    start_epoch: 0
    
    # Verbose logging
    verbose: true
    
  # Learning rate scheduler
  scheduler:
    # Scheduler type
    # Options: cosine, cosine_with_restarts, step, exponential, reduce_on_plateau, polynomial
    type: "cosine_with_restarts"
    
    # Warmup configuration
    warmup:
      enabled: true
      warmup_steps: 1000
      warmup_init_lr: 1e-6
      
    # Cosine scheduler params
    cosine:
      t_max: 10000
      eta_min: 1e-6
      
    # Cosine with restarts params
    cosine_with_restarts:
      t_0: 5000  # Initial restart period
      t_mult: 2  # Period multiplier after each restart
      eta_min: 1e-6
      cycles: 3
      
    # Step scheduler params
    step:
      step_size: 1000
      gamma: 0.1
      
    # Exponential scheduler params
    exponential:
      gamma: 0.95
      
    # Reduce on plateau params
    reduce_on_plateau:
      mode: "min"
      factor: 0.5
      patience: 3
      threshold: 0.0001
      cooldown: 0
      min_lr: 1e-7
      
  # Checkpointing
  checkpointing:
    enabled: true
    
    # Save best only or all checkpoints
    save_best_only: true
    
    # Save frequency
    save_freq: "epoch"  # Options: epoch, step
    save_interval: 1  # Save every N epochs/steps
    
    # Monitor metric for best checkpoint
    monitor: "val_loss"
    mode: "min"
    
    # Checkpoint directory
    checkpoint_dir: "artifacts/checkpoints"
    
    # Number of checkpoints to keep
    max_checkpoints: 5
    
    # Save optimizer state
    save_optimizer: true
    
    # Save scheduler state
    save_scheduler: true
    
  # Gradient accumulation
  gradient_accumulation:
    enabled: false
    accumulation_steps: 4
    
  # Mixed precision training
  mixed_precision:
    enabled: false  # Enable for GPU training
    dtype: "float16"  # Options: float16, bfloat16
    
  # Gradient clipping
  gradient_clipping:
    enabled: true
    max_norm: 1.0
    norm_type: 2
    
  # Logging
  logging:
    log_interval: 10  # Log every N steps
    log_gradients: false
    log_parameters: false
    log_learning_rate: true
    
  # Performance monitoring
  performance:
    track_duration: true
    track_throughput: true
    track_memory: true
    track_gpu_utilization: true
    
  # Model-specific scheduler recommendations
  scheduler_recommendations:
    # Large language models
    llm:
      type: "cosine_with_restarts"
      warmup_steps: 2000
      cycles: 2
      
    # Vision models
    vision:
      type: "cosine"
      warmup_steps: 500
      
    # Small models / fine-tuning
    small:
      type: "reduce_on_plateau"
      patience: 3
      
    # Reinforcement learning
    rl:
      type: "exponential"
      gamma: 0.99
