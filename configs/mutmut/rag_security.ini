# Mutation Testing Configuration for RAG Security Paths
#
# This configuration focuses mutation testing on security-critical
# code paths in the RAG (Retrieval-Augmented Generation) module.
#
# Usage:
#   mutmut run --paths-to-mutate src/codex/rag/
#   OR
#   mutmut run --config configs/mutmut/rag_security.ini
#
# Metrics Target:
#   - Mutation Score: >80%
#   - Security Path Coverage: 100%
#
# Last Updated: 2026-02-04
# Phase: 44 - Coverage Improvement

[mutmut]
# Paths to mutate - focused on RAG security-critical modules
paths_to_mutate =
    src/codex/rag/embeddings.py
    src/codex/rag/retriever.py
    src/codex/rag/indexer.py
    src/codex/rag/utils.py
    src/codex/rag/prompt.py
    src/codex/rag/postprocess.py

# Test command to run after each mutation
runner = pytest tests/test_rag*.py tests/rag/ -x --tb=short --no-cov -q

# Timeout configuration
test_time_multiplier = 2.5
test_time_base = 5.0

# Paths to exclude from mutation
exclude_patterns =
    __pycache__
    *.pyc
    *_test.py
    */tests/*
    */benchmarks/*
    */analytics/*

# Mutation types - focus on security-relevant mutations
mutations =
    string           # String literal changes
    number           # Numeric value changes
    operator         # Comparison and arithmetic operators
    keyword          # Boolean and None keywords
    statement        # Statement removal
    decorator        # Decorator removal
    function_call    # Function call argument changes

# Security-focused mutation targets
# These represent common security anti-patterns:
# - Boundary condition changes (off-by-one)
# - Comparison operator flips (< to <=, == to !=)
# - Boolean logic inversions
# - Default value modifications

# Cache settings
cache_only = False

# Coverage integration
use_coverage = True
coverage_data = .coverage

# Output configuration
show_times = True
output_format = text

# Advanced options
swallow_output = True
rerun_all = False

# Parallelization (if available)
# parallel = True
# jobs = 4
