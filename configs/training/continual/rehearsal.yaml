defaults:
  - base

training:
  continual: ${continual}

continual:
  strategy: replay
  buffer_size: 2048
  phases:
    - name: warmup
      epochs: 1
      dataset:
        role: warmup
        path: data/continual/warmup.jsonl
        format: jsonl
    - name: rehearsal
      epochs: 1
      replay_ratio: 0.3
      dataset:
        role: train
        path: data/continual/task1.jsonl
        format: jsonl
    - name: evaluation
      epochs: 1
      dataset:
        role: eval
        path: data/continual/eval.jsonl
        format: jsonl
