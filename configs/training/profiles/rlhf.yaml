# RLHF (Reinforcement Learning from Human Feedback) Training Configuration
# WARNING: STATUS: STUB - Full RLHF implementation is deferred
#
# This configuration group is a placeholder for future RLHF capabilities.
# RLHF training requires additional infrastructure including:
#   - Reward model training
#   - PPO (Proximal Policy Optimization) trainer
#   - KL divergence penalty computation
#   - Reference model for policy constraint
#
# For current implementation status, see:
#   - docs/arch/ADR-YYYYMMDD-rlhf-deferred.md (if exists)
#   - .codex/capability_checklist.md
#
# Usage (when implemented):
#   codex-train train=rlhf model=<your_model> reward_model=<reward_model>
#
# References:
#   - InstructGPT: https://arxiv.org/abs/2203.02155
#   - PPO: https://arxiv.org/abs/1707.06347
#   - trl library: https://github.com/huggingface/trl

# RLHF-specific parameters (placeholder values)
rlhf:
  enabled: false  # Not implemented yet
  
  # Reward model configuration
  reward_model:
    path: null  # Path to pre-trained reward model
    device: null  # Auto-detect
    dtype: null  # Auto-detect
  
  # PPO parameters (based on InstructGPT paper)
  ppo:
    # Number of PPO epochs per batch
    epochs: 4
    
    # Mini-batch size for PPO updates
    mini_batch_size: 4
    
    # Number of rollouts per batch
    batch_size: 16
    
    # Learning rate for policy
    learning_rate: 1.4e-5
    
    # Clipping parameter for policy loss
    clip_range: 0.2
    
    # Coefficient for value function loss
    vf_coef: 0.1
    
    # Entropy bonus coefficient
    entropy_coef: 0.01
    
    # Max gradient norm for clipping
    max_grad_norm: 0.5
  
  # KL divergence penalty
  kl:
    # KL penalty coefficient
    coef: 0.2
    
    # Target KL divergence
    target: 6.0
    
    # Adaptive KL penalty
    adaptive: true
  
  # Reference model (for KL constraint)
  reference_model:
    # Path to reference model (usually same as base model)
    path: null
    # Whether to keep reference model frozen
    frozen: true
  
  # Generation parameters during RLHF
  generation:
    # Maximum generation length
    max_length: 512
    
    # Temperature for sampling
    temperature: 0.7
    
    # Top-k sampling
    top_k: 50
    
    # Top-p (nucleus) sampling
    top_p: 0.9
    
    # Number of sequences to generate per prompt
    num_return_sequences: 1

# Training overrides (when RLHF is implemented)
training:
  # RLHF typically needs smaller learning rates
  learning_rate: 1.4e-5
  
  # Batch size for RLHF
  batch_size: 16
  
  # Number of RLHF iterations
  epochs: 3
  max_epochs: ${.epochs}
  
  # RLHF inherits rlhf config above
  rlhf: ${rlhf}
  
  # Optimizer settings
  optimizer:
    name: adamw_torch
    weight_decay: 0.0  # RLHF often uses no weight decay
    betas: [0.9, 0.95]
    eps: 1.0e-08
  
  # Scheduler settings
  scheduler:
    name: constant_with_warmup
    warmup_steps: 100
  
  # Checkpointing
  checkpoint:
    dir: runs/rlhf/checkpoints
    every_n_steps: 50
    keep_best_k: 5

# Device and precision
device: null  # Auto-detect
dtype: null   # Auto-detect
mixed_precision: true

# Enable telemetry
tensorboard: true
mlflow_enable: false

# Output directory
output_dir: runs/rlhf

# Reproducibility
seed: 42
deterministic: false  # RLHF involves stochastic generation

# Implementation notes:
#
# To implement RLHF, the following components are needed:
#
# 1. Reward Model Training:
#    - Binary classification model trained on human preferences
#    - Input: (prompt, response) pairs
#    - Output: scalar reward score
#
# 2. PPO Trainer:
#    - Proximal Policy Optimization algorithm
#    - Policy network (language model being trained)
#    - Value network (estimates state value)
#    - Reference policy (frozen copy of initial policy)
#
# 3. KL Divergence Computation:
#    - Measure divergence between current policy and reference
#    - Prevents policy from deviating too far from reference
#
# 4. Rollout Collection:
#    - Generate completions using current policy
#    - Score completions using reward model
#    - Compute advantages and returns
#
# 5. Integration Points:
#    - src/codex_ml/training/rlhf_trainer.py (to be created)
#    - src/codex_ml/models/reward_model.py (to be created)
#    - src/codex_ml/training/ppo.py (to be created)
#
# Dependencies needed:
#    - trl>=0.7.0 (Transformer Reinforcement Learning)
#    - OR custom PPO implementation
#
# See ADR for full design and implementation plan.
