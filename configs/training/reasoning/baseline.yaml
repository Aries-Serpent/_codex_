# Template: Baseline reasoning overlay enabling traces and curriculum hooks.
# @package _global_
defaults:
  - ../base

reasoning:
  template: baseline

curriculum:
  phase_schedule: starter

training:
  reasoning:
    enabled: true
    # trace_mode tells the reasoning harness how to record "traces".
    #
    #   - "param-slice"
    #       CURRENT / LEGACY BEHAVIOR.
    #       Take a deterministic slice of the first trainable parameter
    #       tensor, flatten it, and log it. This is ONLY a diagnostic
    #       fingerprint for reproducibility / regression tracking.
    #       It is NOT an actual chain-of-thought or internal reasoning
    #       narrative from the model.
    #
    #   - "activation-snapshot"
    #       TARGET / PREFERRED BEHAVIOR.
    #       Capture pooled forward-pass activations (e.g. hidden states)
    #       along with metadata:
    #         * active curriculum phase
    #         * tool usage (if any)
    #         * evaluation preset context
    #       This is the mode we ultimately want to ship to stakeholders.
    #
    trace_mode: "param-slice"  # default until activation snapshots land
    trace_history: 128
    log_probability_threshold: 0.15
    objective:
      mode: chain_of_thought
      weight: 1.0
      max_traces_per_epoch: 6
      log_top_k: 5
      trace_store: reasoning_traces.ndjson
    head:
      hidden_size: 768
      projection_size: 256
      trace_vocab_size: 64
      dropout: 0.05
    tool_adapter:
      enabled: false

logging:
  reasoning_trace: true
