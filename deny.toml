# Cargo deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow common open source licenses used by our dependencies
# All licenses NOT in this list are denied by default (v2 schema)
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unlicense",
    "0BSD",
]

# Confidence threshold for license detection
confidence-threshold = 0.8

[advisories]
yanked = "deny"
# Note: 'unmaintained' advisories should be handled via 'ignore' field with specific IDs if needed

[bans]
# Multiple versions of the same crate are allowed for now
multiple-versions = "allow"

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
