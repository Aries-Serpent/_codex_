version: "3.9"
services:
  codex-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CODEX_IMAGE:-codex:cpu}
    command: ["codex-infer", "--prompt", "hello from codex"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      CODEX_OFFLINE: ${CODEX_OFFLINE:-1}
      MODEL_NAME: ${MODEL_NAME:-sshleifer/tiny-gpt2}
      TOKENIZER_NAME: ${TOKENIZER_NAME:-sshleifer/tiny-gpt2}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-20}
      API_RATE_LIMIT: 50
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts

  codex-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: ${CODEX_GPU_IMAGE:-codex:gpu}
    command: ["codex-infer", "--device", "cuda", "--prompt", "hello gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    device_requests:
      - driver: nvidia
        count: all
        capabilities: [["gpu"]]
    environment:
      CODEX_OFFLINE: ${CODEX_OFFLINE:-1}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      MODEL_NAME: ${MODEL_NAME:-sshleifer/tiny-gpt2}
      TOKENIZER_NAME: ${TOKENIZER_NAME:-sshleifer/tiny-gpt2}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-20}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./artifacts:/app/artifacts

  mcp-http:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.mcp.server.http:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MCP_API_KEY: ${MCP_API_KEY:-dev-key}
      MCP_OFFLINE: ${MCP_OFFLINE:-false}
      MCP_RATE_LIMIT_RPM_READ: ${MCP_RATE_LIMIT_RPM_READ:-60}
      MCP_RATE_LIMIT_RPM_WRITE: ${MCP_RATE_LIMIT_RPM_WRITE:-30}
    ports:
      - "8001:8001"
    depends_on:
      - mcp-vector-db
    volumes:
      - ./:/app

  mcp-vector-db:
    profiles: ["mcp"]
    image: chromadb/chroma:0.5.3
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ./artifacts/chroma:/chroma/.chroma/index
