[pytest]
# Removed global coverage flags to prevent duplication with nox 'coverage' session.
# Fast local runs can use 'nox -s tests'. CI coverage uses 'nox -s coverage'.
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning

markers =
    smoke: Quick validation tests
    determinism: Deterministic behavior tests
    gpu: GPU-specific tests
    eval: Evaluation loop tests
    training: Training pipeline tests
    regression: Regression (bug fix) tests
    data: Data layer tests
    integration: Cross-component integration tests
    timeout: Tests with explicit timeout decoration
    ml: ML model or tensor dependent tests
    perf: Performance snapshot tests
    requires_torch: Requires PyTorch
    requires_sentencepiece: Requires sentencepiece library
    requires_transformers: Requires transformers library
    templates: Template system tests
    infra: Repository operational tests
    slow: Long-running tests
    not_slow: Explicitly marked as not slow
    tokenizer: Tokenizer functionality
    net: Network-dependent tests
    deferred: Deferred/experimental tests