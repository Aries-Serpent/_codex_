[pytest]
addopts = -q --maxfail=1 --strict-markers --disable-warnings
testpaths = tests
xfail_strict = true
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
# Coverage (optional; CI can override with --cov)
# Example: --cov=src --cov-report=term-missing --cov-fail-under=35
