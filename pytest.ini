[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# pythonpath ensures src/ is on sys.path for ALL pytest workers including
# pytest-xdist parallel workers.  This resolves `from codex.xxx` / `from mcp.xxx`
# etc. imports directly.  Root '.' was removed (S262) to eliminate the dual-package
# shadow where ./training/ and ./tokenization/ at repo root diverged from src/training/
# and src/tokenization/.  See S258 research for full analysis.
pythonpath = src agents/codex_client
addopts =
    -q
    --strict-markers
    # Coverage options removed from pytest.ini to avoid conflicts with pytest-xdist
    # Use: pytest --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing
    # Note: pytest-cov does not enforce pyproject.toml fail_under without --cov-fail-under.
    # When using coverage, add: --cov-fail-under=70
# Removed -p no:socket to allow pytest-xdist to work properly
# timeout = 60  # Moved to command-line to avoid conflicts with --timeout argument
# timeout_method = thread

# Note: Plugins auto-register via setuptools entry points.
# The 'required_plugins' directive causes worker crashes with xdist.
# Install plugins with: pip install pytest-timeout pytest-xdist pytest-asyncio

filterwarnings =
    ignore::DeprecationWarning

markers =
    edge_case: Edge case tests
    concurrency: Concurrency tests
    advanced: Advanced tests

    smoke: Quick validation tests
    determinism: Deterministic behavior tests
    gpu: GPU specific tests
    cpu: CPU specific tests
    eval: Evaluation loop tests
    training: Training pipeline tests
    regression: Regression (bug fix) tests
    data: Data layer tests
    integration: Cross-component integration tests
    recorded: Integration tests that use recorded fixtures
    live: Integration tests that call live providers (gated)
    not_live: Tests that must run without live provider access
    timeout: Tests with explicit timeout
    ml: ML / tensor dependent
    ml_comprehensive: Comprehensive ML tests for callback systems
    perf: Performance snapshot tests
    requires_torch: Needs torch import
    requires_sentencepiece: Needs sentencepiece
    requires_transformers: Needs transformers
    requires_faiss: Needs faiss-cpu installed
    templates: Template system tests
    infra: Repository operational tests
    slow: Long-running tests (e.g., Docker builds >5min) - excluded from coverage workflow
    not_slow: Explicitly not slow
    tokenizer: Tokenizer functionality
    net: Network-dependent tests
    deferred: Deferred/experimental tests
    interfaces: Interface contract tests
    deployment: Deployment scenario tests
    pool_disable_reuse: Disable connection reuse during pooling fixtures
    chaos: Chaos engineering and fault injection tests
    regression_R1: Data regression coverage
    regression_R2: Model regression coverage
    regression_R3: Infrastructure regression coverage
    regression_R4: Performance regression coverage
    regression_R5: Safety/honesty regression coverage

    asyncio: Asynchronous test execution
