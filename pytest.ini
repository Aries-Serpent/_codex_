[pytest]
addopts = -q --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    distributed: distributed/accelerate related tests (opt-in via ACCELERATE_TEST=1)
    lora: LoRA related tests (opt-in via RUN_LORA_TESTS=1)
    perf_smoke: performance smoke tests (opt-in via RUN_PERF_SMOKE=1)
    smoke: quick smoke tests for CLI
    requires_torch: tests requiring PyTorch
    slow: slow/resource-intensive tests
    cpu_only: tests that should only run on CPU
    unit: Unit tests
    integration: Integration tests
    regression: Regression tests
    data: Dataset-related validations
    timeout: Tests with explicit timeout expectations
    ml: Machine learning model integration scenarios
    perf: Performance-focused test cases
    templates: Template discovery/validation tests
    infra: Infrastructure and CLI integration checks
    not_slow: Opt-in fast-path for otherwise slow suites
    tokenizer: Tokenizer-specific behaviour checks
    requires_sentencepiece: Tests requiring sentencepiece dependency
    interfaces: Interface layer coverage
    asyncio: AsyncIO-driven integration tests
    cpu: CPU-specific execution paths
xfail_strict = true
filterwarnings =
    ignore::DeprecationWarning
