[pytest]
addopts = -q
testpaths = tests
markers =
    distributed: distributed/accelerate related tests (opt-in via ACCELERATE_TEST=1)
    lora: LoRA related tests (opt-in via RUN_LORA_TESTS=1)
    perf_smoke: performance smoke tests (opt-in via RUN_PERF_SMOKE=1)
xfail_strict = true
# Third-party libraries emit DeprecationWarning; ignore until upstream fixes land.
filterwarnings =
    ignore::DeprecationWarning
