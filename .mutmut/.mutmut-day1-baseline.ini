[mutmut]
source_paths = agents/
pytest_add_cli_args_test_selection = tests/agents/ -v --tb=short
test_time_multiplier = 3.0
test_time_base = 5.0
timeout = 30

# Exclude test files and internal files
exclude_patterns =
    __pycache__
    *.pyc
    */tests/*
    *_test.py
    conftest.py
    */__init__.py

# Include all standard mutations
mutation_types = keyword,operator,string,number,literal,dict,set,list,index
