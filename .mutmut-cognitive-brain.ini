# Mutation Testing Configuration for Cognitive Brain Modules
# Phase B Track 1 Lanes 4-5: Cognitive brain coverage via mutation testing

[mutmut]
# ============================================================================
# SOURCE CODE PATHS - HIGH-IMPACT COGNITIVE MODULES
# ============================================================================
source_paths =
    agents/agent_memory.py
    agents/mental_mapping.py
    agents/sqlite_memory.py
    agents/cognitive_adapter.py
    agents/self_healing.py

# ============================================================================
# TEST CONFIGURATION
# ============================================================================
tests_dir = tests/agents
test_time_multiplier = 3.0
test_time_base = 5.0
timeout = 30

# Run pytest with verbose output on failures
pytest_add_cli_args_test_selection = -v --tb=short -x

# ============================================================================
# MUTATION FILTERING
# ============================================================================
only_mutate =
    # Core memory operations
    agents/agent_memory.py:MemoryEntry
    agents/agent_memory.py:PatternLibrary
    agents/agent_memory.py:AgentMemory
    # Mental mapping
    agents/mental_mapping.py:MentalMapNode
    agents/mental_mapping.py:MentalMap
    # SQLite persistence
    agents/sqlite_memory.py:*

exclude_patterns =
    __pycache__
    *.pyc
    */tests/*
    */codex_client/*
    */prompts/*
    */config/*
    *_test.py
    conftest.py

# ============================================================================
# MUTATION TYPES (security and logic-critical)
# ============================================================================
# Comment out to disable specific mutation types
mutations =
    keyword
    operator
    string
    number
    dict
    collections

# ============================================================================
# PERFORMANCE & OUTPUT
# ============================================================================
use_coverage = True
coverage_data = .coverage
show_times = True
swallow_output = True
rerun_all = False
verbose = True

# ============================================================================
# OUTPUT OPTIONS
# ============================================================================
# Report format: html, txt, json
output_format = txt
