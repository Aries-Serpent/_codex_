# Capability → locations mapping for _codex_.
# This is used to enrich the gap registry with suggested code, test, and docs
# locations per capability.

capabilities:
  tokenization:
    code:
      - "src/codex_ml/tokenization/"
    tests:
      - "tests/codex_ml/test_tokenization_basic.py"
    docs:
      - "docs/examples/minimal_run.md"

  training:
    code:
      - "src/codex_ml/training/"
    tests:
      - "tests/codex_ml/test_training_loop_smoke.py"
      - "tests/codex_ml/test_minimal_train_cli.py"
    docs:
      - "docs/examples/minimal_run.md"

  data_handling:
    code:
      - "src/codex_ml/data/"
    tests:
      - "tests/codex_ml/test_dataloader_determinism.py"
      - "tests/codex_ml/test_simple_dataset.py"
    docs:
      - "docs/examples/minimal_run.md"

  evaluation:
    code:
      - "src/codex_ml/eval/"
    tests:
      - "tests/codex_ml/test_eval_smoke.py"
    docs:
      - "docs/examples/minimal_run.md"

  logging:
    code:
      - "src/codex_ml/logging/"
    tests:
      - "tests/codex_ml/test_logging_registry.py"

  checkpointing:
    code:
      - "src/codex_ml/checkpointing/"
    tests:
      - "tests/codex_ml/test_checkpoint_utils.py"

  experiment_tracking:
    code:
      - "src/codex_ml/tracking/"
    tests:
      - "tests/codex_ml/test_mlflow_wrapper_stub.py"

  extensibility:
    code:
      - "src/codex_ml/registry.py"
    tests:
      - "tests/codex_ml/test_registry_basic.py"
