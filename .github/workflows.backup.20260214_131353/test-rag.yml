name: Art_RAG Module Tests

"on":
  push:
    branches: [main, develop, copilot/**]
    paths:
      - 'src/codex/rag/**'
      - 'tests/test_rag_**'
      - 'pyproject.toml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/codex/rag/**'
      - 'tests/test_rag_**'
      - 'pyproject.toml'

jobs:
  test-rag:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cache sentence-transformers models (small, ~400MB, high value)
      # This significantly reduces test time by avoiding model re-downloads
      - name: Cache sentence-transformers models
        uses: actions/cache@v5
        with:
          path: ~/.cache/torch/sentence_transformers
          key: ${{ runner.os }}-sentence-transformers-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-sentence-transformers-py${{ matrix.python-version }}-
            ${{ runner.os }}-sentence-transformers-

      # Note: pip cache remains disabled due to disk space constraints with large ML dependencies
      # Caching pip packages consumes significant disk space (~3-5GB) when restoring
      # and compounds with build artifacts, causing "No space left on device" errors
      # during installation of torch, transformers, and other RAG dependencies.

      - name: Free disk space
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h
          echo ""
          echo "=== Removing large system packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo ""
          echo "=== Cleaning Docker and apt cache ==="
          sudo docker system prune --all --force --volumes
          sudo apt-get clean
          echo ""
          echo "=== Disk space AFTER cleanup ==="
          df -h

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install the main package FIRST (may install older plugin versions)
          pip install --no-cache-dir -e ".[rag,test]"
          # Then force reinstall pytest plugins with pinned versions
          # This ensures xdist workers have correct versions at consistent paths
          pip install --no-cache-dir --force-reinstall \
            pytest==9.0.2 \
            pytest-cov==7.0.0 \
            pytest-xdist==3.8.0 \
            pytest-timeout==2.3.1 \
            pytest-rerunfailures==14.0 \
            pytest-randomly==3.16.0 \
            'coverage>=7.10.6,<8'
          # Verify plugins are installed and discoverable
          python -c "import pytest_cov; import xdist; import pytest_timeout; print('All pytest plugins verified')"
          python -m pytest --version

      - name: Pre-download embedding models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer
          import os
          cache_dir = os.path.expanduser('~/.cache/torch/sentence_transformers')
          os.makedirs(cache_dir, exist_ok=True)
          print('Pre-downloading sentence-transformers model...')
          # Use token for authentication
          model = SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2',
                                      cache_folder=cache_dir,
                                      token=os.getenv('HF_TOKEN'))
          print(f'Model cached successfully to {cache_dir}')
          "

      - name: Run RAG tests with coverage
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          RAG_OPENAI_KEY: ${{ secrets.RAG_OPENAI_KEY }}
        run: |
          # Ensure plugins are loaded before running tests
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"

          # Run with explicit plugin verification
          python -m pytest tests/test_rag_*.py \
            -p xdist \
            -p pytest_cov \
            -n auto \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: rag-modules
          name: rag-coverage-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 30
          if-no-files-found: warn

      - name: Check coverage threshold
        run: |
          # Parse coverage from XML report
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          print(float(root.attrib['line-rate']) * 100)
          ")
          echo "Coverage: ${COVERAGE}%"
          # Temporarily lowered to 0% during Phase 14 foundation work (baseline is ~27.5%)
          # TODO: Restore to 90% threshold after Phase 14 completes
          if (( $(echo "$COVERAGE < 0" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below 0% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"

      - name: Security scan
        run: |
          pip install bandit
          bandit -r src/codex/rag/ -f txt -o bandit-report.txt || true
          # Ensure file exists even if bandit fails or produces no output
          touch bandit-report.txt
          if [ -s bandit-report.txt ]; then
            cat bandit-report.txt
          else
            echo "No security issues found by Bandit" > bandit-report.txt
            cat bandit-report.txt
          fi

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow test-rag --health 2>/dev/null || echo '{"status": "cache health check skipped"}'

      - name: Upload security report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-report-${{ matrix.python-version }}
          path: bandit-report.txt
          retention-days: 30
          if-no-files-found: warn
