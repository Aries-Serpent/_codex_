name: Template Lint (HTML includes)

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  template-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow template_lint 2>/dev/null || echo "Cache health: check skipped"
      - name: Lint templates
        run: |
          python tools/template_lint.py --dir docs/templates/status
