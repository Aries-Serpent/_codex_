name: Duplicate Detection on PR

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**.py'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-duplicates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow detect-duplicates 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'
