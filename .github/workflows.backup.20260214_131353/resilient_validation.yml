name: Resilient Validation Suite

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.codex/**'
      - 'src/**'
      - 'scripts/**'

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: false

    strategy:
      fail-fast: false
      matrix:
        test-group: [quick, documentation, integration, slow]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}

      - name: Install dependencies
        run: |
          pip install -e .[dev]
          npm install -g markdown-link-check

      - name: Run validation
        id: validate
        timeout-minutes: 45
        run: |
          case "${{ matrix.test-group }}" in
            quick)
              pytest tests/ -v -m "not slow and not integration" --timeout=60 --tb=short
              ;;
            documentation)
              npx markdown-link-check docs/**/*.md --retry --timeout 5000 || true
              python scripts/validate_docs.py --fix || echo "Doc validation warnings (non-blocking)"
              ;;
            integration)
              pytest tests/ -v -m "integration and not slow" --timeout=300 --tb=short
              ;;
            slow)
              pytest tests/ -v -m "slow" --timeout=600 --maxfail=5 --tb=short
              ;;
          esac

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ matrix.test-group }}
          path: |
            test-results/
            .coverage
            htmlcov/
          retention-days: 7

      - name: Comment on PR (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const group = '${{ matrix.test-group }}';
            const body = `⚠️ **Validation failed for \`${group}\` tests**

            ### Common fixes:
            - **Documentation**: Run \`bash scripts/fix_pr3248_dead_links.sh\`
            - **Tests**: Add \`@pytest.mark.slow\` for long-running tests
            - **Dependencies**: Run \`pip install -e .[dev]\` and \`pip check\`
            - **Timeouts**: Increase test timeout or optimize test logic

            📋 [View detailed logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
