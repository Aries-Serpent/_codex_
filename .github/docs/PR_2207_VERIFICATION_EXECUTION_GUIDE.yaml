verification_phases:
  phase_1_automated_checks:
    name: "Automated Pre-Merge Checks"
    duration_minutes: 5
    commands:
      - name: "Workflow Syntax Validation"
        command: "yamllint .github/workflows/ .github/*.yml"
        expected_output: "All files are valid YAML"
        failure_action: "Block merge, fix YAML syntax"

      - name: "JSON Schema Validation"
        command: "python -m jsonschema audit_run_manifest.json"
        expected_output: "Valid JSON"
        failure_action: "Investigate malformed JSON"

      - name: "Mergeable State Check"
        command: "gh pr view 2207 --json mergeable,mergeStateStatus"
        expected_output: "mergeable: true, mergeStateStatus: CLEAN"
        failure_action: "Resolve merge conflicts before proceeding"

      - name: "Status Check Review"
        command: "gh pr checks 2207"
        expected_output: "All required checks PASS"
        failure_action: "Investigate failed checks, request re-run if applicable"

  phase_2_security_validation:
    name: "Security Scanning & Verification"
    duration_minutes: 15
    commands:
      - name: "Bandit Security Scan"
        command: "bandit -r src/ -f json -o bandit-report.json --severity-level=MEDIUM"
        expected_output: "No HIGH or CRITICAL issues"
        failure_action: "Review findings, update security_allowlist.json if needed"

      - name: "Secrets Detection"
        command: "detect-secrets scan --baseline .secrets.baseline"
        expected_output: "No new secrets detected"
        failure_action: "Remove secrets, update baseline"

      - name: "Dependency Vulnerability Check"
        command: "pip-audit --cache-dir /tmp/pip-audit-cache"
        expected_output: "No known vulnerabilities"
        failure_action: "Update vulnerable packages or document acceptance"

      - name: "GPU Package Verification"
        command: |
          grep -E "(torch|cuda|tensorflow|nvidia)" uv.lock | wc -l
          grep -E "(torch|cuda|tensorflow)" requirements.txt | wc -l
        expected_output: "0 matches in both commands"
        failure_action: "Remove GPU packages, regenerate uv.lock"

  phase_3_test_coverage:
    name: "Test Coverage & Quality Gates"
    duration_minutes: 20
    commands:
      - name: "Run Test Suite with Coverage"
        command: "pytest --cov=src --cov-report=term-missing --cov-report=html"
        expected_output: "Coverage >= 96%, all tests pass"
        failure_action: "Add missing test coverage or adjust threshold in .github/coverage_threshold.txt"

      - name: "Verify Coverage Threshold File"
        command: "cat .github/coverage_threshold.txt && test $(cat .github/coverage_threshold.txt | grep -oP '\\d+') -eq 96"
        expected_output: "Coverage Threshold: 96%"
        failure_action: "Confirm threshold setting with team leads"

      - name: "Code Quality Linting"
        command: "nox -s lint"
        expected_output: "All linting checks pass"
        failure_action: "Address linting errors with Black/isort/Ruff"

      - name: "Type Checking"
        command: "nox -s type_check"
        expected_output: "All type checks pass"
        failure_action: "Fix type annotation errors"

  phase_4_dependency_validation:
    name: "Dependency & Lock File Validation"
    duration_minutes: 10
    commands:
      - name: "Lock File Integrity"
        command: "uv sync --check && pip install --dry-run -r requirements.txt"
        expected_output: "All dependencies resolve without conflict"
        failure_action: "Regenerate uv.lock with 'uv lock --upgrade'"

      - name: "Audit Log Verification"
        command: "test -f .codex/evidence/dependency_ops.jsonl && jq . .codex/evidence/dependency_ops.jsonl | head -5"
        expected_output: "Valid JSON entries with operations logged"
        failure_action: "Ensure audit log entries are properly formatted"

      - name: "Environment Reproducibility Test"
        command: |
          python -m venv .venv_test
          source .venv_test/bin/activate
          pip install -r requirements.txt
          python --version
        expected_output: "Environment created successfully"
        failure_action: "Debug dependency installation failures"

  phase_5_documentation_review:
    name: "Documentation & Configuration Review"
    duration_minutes: 5
    commands:
      - name: "Copilot.md Content Validation"
        command: "grep -E '^(#|##|###)' .github/Copilot.md | head -20"
        expected_output: "Proper Markdown structure"
        failure_action: "Fix Markdown formatting"

      - name: "AGENTS_PR2224 Review Doc Check"
        command: "test -f .github/docs/AGENTS_PR2224_Review_Comments_Response_Copilot.md && wc -l .github/docs/AGENTS_PR2224_Review_Comments_Response_Copilot.md"
        expected_output: "File exists with substantial content (>100 lines)"
        failure_action: "Verify documentation completeness"

      - name: "Bandit Configuration Validation"
        command: "python -c \"import yaml; print(yaml.safe_load(open('.bandit.yaml')))\""
        expected_output: "Valid YAML configuration"
        failure_action: "Fix YAML syntax in .bandit.yaml"

  phase_6_ownership_verification:
    name: "CODEOWNERS & Responsibility Assignment"
    duration_minutes: 3
    commands:
      - name: "CODEOWNERS Coverage Check"
        command: |
          git diff HEAD~102..HEAD --name-only | while read file; do
            if ! grep -q "^$file" .github/CODEOWNERS; then
              echo "ORPHANED: $file"
            fi
          done
        expected_output: "No orphaned files"
        failure_action: "Add missing CODEOWNERS entries"

      - name: "Verify Modified Files Ownership"
        command: "cat .github/CODEOWNERS | grep -E '(.github/Copilot|coverage_threshold|AGENTS_PR2224|bandit.yaml)'"
        expected_output: "All modified config files have assigned owners"
        failure_action: "Assign owners to critical files"

  phase_7_docker_image_validation:
    name: "Docker Build & Image Validation (if applicable)"
    duration_minutes: 15
    commands:
      - name: "Build CPU-Only Docker Image"
        command: "docker build -t codex:test . --no-cache"
        expected_output: "Build succeeds, no GPU dependencies"
        failure_action: "Debug Docker build errors"

      - name: "Verify Image Contents"
        command: "docker run --rm codex:test python -c \"import sys; print(f'Python {sys.version}')\""
        expected_output: "Python version output, no GPU warnings"
        failure_action: "Investigate GPU package inclusion"

