metadata:
  pr_number: 2207
  pr_title: "0D to main"
  repository: "Aries-Serpent/_codex_"
  branch_source: "0D_base_"
  branch_target: "main"
  total_files_changed: 126
  total_commits: 102
  validation_phase: "PRE-DEPLOYMENT"
  created_at: "2025-11-14T17:46:51Z"
  expires_at: "2025-11-21T17:46:51Z"

validation_gates:
  gate_1_workflow_syntax:
    name: "GitHub Workflow YAML Syntax Validation"
    enabled: true
    critical: true
    commands:
      - yamllint .github/workflows/ -d relaxed
      - yamllint .github/*.yml -d relaxed
      - python3 -c "import yaml; yaml.safe_load(open('.github/workflows/tests.yml'))"
      - python3 -c "import yaml; yaml.safe_load(open('.github/workflows/security_gates.yml'))"
      - python3 -c "import yaml; yaml.safe_load(open('.github/workflows/post-merge-validation-optimized.yml'))"
    expected_exit_code: 0
    expected_output: "All files valid YAML"
    failure_action: "BLOCK_MERGE"
    failure_message: "Workflow YAML syntax errors detected"

  gate_2_security_scanning:
    name: "Security Vulnerability Scanning"
    enabled: true
    critical: true
    commands:
      - bandit -r src/ -f json -o bandit-report.json --severity-level=MEDIUM
      - detect-secrets scan --baseline .secrets.baseline
      - pip-audit --cache-dir /tmp/pip-audit-cache --output json
      - semgrep --config=semgrep_rules/ src/ --json -o semgrep-report.json
    expected_exit_code: 0
    expected_output: "No HIGH or CRITICAL vulnerabilities"
    failure_action: "BLOCK_MERGE"
    failure_message: "Security vulnerabilities detected - manual review required"
    timeout_minutes: 10
    retry_count: 1

  gate_3_dependency_validation:
    name: "Dependency Lock File & GPU Package Verification"
    enabled: true
    critical: true
    commands:
      - grep -E "(torch|cuda|tensorflow|nvidia|jax)" uv.lock || true
      - wc -l uv.lock
      - python3 -c "import json; json.load(open('uv.lock'))" || echo "JSON validation"
      - uv sync --check
      - pip install --dry-run -r requirements.txt
    expected_exit_code: 0
    expected_output: "No GPU packages, lock file valid, dependencies resolve"
    failure_action: "BLOCK_MERGE"
    failure_message: "Dependency inconsistencies or GPU packages detected"
    timeout_minutes: 5

  gate_4_test_coverage:
    name: "Test Coverage Threshold Enforcement (96%)"
    enabled: true
    critical: true
    commands:
      - pytest tests/ --cov=src --cov-report=term-missing --cov-report=json
      - python3 -c "import json; cov=json.load(open('coverage.json')); print(f'Coverage: {cov[\"totals\"][\"percent_covered\"]}%')"
      - grep -oP '\d+' .github/coverage_threshold.txt | head -1
    expected_exit_code: 0
    expected_output: "Coverage >= 96%"
    failure_action: "BLOCK_MERGE (or conditional with approval)"
    failure_message: "Test coverage below 96% threshold"
    timeout_minutes: 20

  gate_5_code_quality:
    name: "Code Linting & Type Checking"
    enabled: true
    critical: false
    commands:
      - black --check src/
      - isort --check-only src/
      - ruff check src/
      - mypy src/ --ignore-missing-imports
      - pylint src/ --exit-zero
    expected_exit_code: 0
    expected_output: "All style checks passed"
    failure_action: "WARN (non-blocking)"
    failure_message: "Code quality issues found - review for context"
    timeout_minutes: 15

  gate_6_codeowners:
    name: "CODEOWNERS Assignment Verification"
    enabled: true
    critical: true
    commands:
      - |
        git diff HEAD~102..HEAD --name-only | while read file; do
          if ! grep -q "^$file" .github/CODEOWNERS && [ -n "$file" ]; then
            echo "ORPHANED: $file"
          fi
        done
      - wc -l .github/CODEOWNERS
      - grep -E "^\.github/(Copilot|coverage_threshold|docs/)" .github/CODEOWNERS
    expected_exit_code: 0
    expected_output: "All 126 files have owners assigned"
    failure_action: "BLOCK_MERGE"
    failure_message: "CODEOWNERS coverage incomplete"

  gate_7_documentation:
    name: "Documentation Completeness & Format"
    enabled: true
    critical: false
    commands:
      - test -f .github/Copilot.md && wc -l .github/Copilot.md
      - test -f .github/coverage_threshold.txt && cat .github/coverage_threshold.txt
      - test -f .github/docs/AGENTS_PR2224*.md && wc -l .github/docs/AGENTS_PR2224*.md
      - grep -E "^(#|##|###)" .github/Copilot.md | wc -l
    expected_exit_code: 0
    expected_output: "All documentation files present and valid"
    failure_action: "WARN (non-blocking)"
    failure_message: "Documentation incomplete or improperly formatted"

  gate_8_merge_status:
    name: "PR Mergeable State Confirmation"
    enabled: true
    critical: true
    commands:
      - gh pr view 2207 --json mergeable,mergeStateStatus,commits
      - git fetch origin
      - git checkout 0D_base_
      - git merge-base --is-ancestor main 0D_base_ && echo "Branch is ancestor of main"
    expected_exit_code: 0
    expected_output: "mergeable: true, mergeStateStatus: CLEAN"
    failure_action: "BLOCK_MERGE"
    failure_message: "Merge conflicts detected or PR not mergeable"

automation_workflows:
  pre_merge_validation:
    trigger: "On PR ready for merge"
    duration_minutes: 60
    jobs:
      - name: "Gate 1: Workflow Syntax"
        timeout_minutes: 5
        critical: true
        
      - name: "Gate 2: Security Scan"
        timeout_minutes: 10
        critical: true
        
      - name: "Gate 3: Dependencies"
        timeout_minutes: 5
        critical: true
        
      - name: "Gate 4: Coverage"
        timeout_minutes: 20
        critical: true
        
      - name: "Gate 5: Code Quality"
        timeout_minutes: 15
        critical: false
        
      - name: "Gate 6: CODEOWNERS"
        timeout_minutes: 2
        critical: true
        
      - name: "Gate 7: Documentation"
        timeout_minutes: 3
        critical: false
        
      - name: "Gate 8: Merge Status"
        timeout_minutes: 2
        critical: true

  post_merge_validation:
    trigger: "On merge to main"
    duration_minutes: 35
    jobs:
      - name: "Checkout & Setup"
        timeout_minutes: 2
        
      - name: "Dependency Resolution"
        timeout_minutes: 3
        
      - name: "Full Test Suite"
        timeout_minutes: 15
        
      - name: "Coverage Report"
        timeout_minutes: 3
        
      - name: "Docker Build"
        timeout_minutes: 8
        
      - name: "Artifact Upload"
        timeout_minutes: 2
        
      - name: "Notification & Status"
        timeout_minutes: 2

