rollback_triggers:
  critical_triggers:
    - "Post-merge workflow fails (exit code ≠ 0)"
    - "Coverage drops below 96%"
    - "Security vulnerability discovered post-merge"
    - "Application fails to start"
    - "Error rate exceeds 5x baseline"
    
  manual_triggers:
    - "Multiple user-reported issues"
    - "Data corruption detected"
    - "Performance degradation > 2x"
    - "Security breach confirmed"

rollback_procedure:
  step_1:
    description: "Notify team"
    duration_minutes: 1
    command: "Send Slack alert to #incidents"
    
  step_2:
    description: "Execute revert"
    duration_minutes: 2
    command: "gh pr revert 2207"
    
  step_3:
    description: "Create incident report"
    duration_minutes: 5
    command: "gh issue create --title 'Incident: PR #2207 Rollback'"
    
  step_4:
    description: "Schedule post-incident review"
    duration_minutes: 2
    command: "Calendar invite to team"
    
  total_rollback_time_minutes: 10

monitoring_alerts:
  - metric: "Application Error Rate"
    threshold: "5x baseline"
    action: "Escalate to on-call"
    
  - metric: "Response Latency"
    threshold: "> 500ms"
    action: "Notify DevOps"
    
  - metric: "CPU Usage"
    threshold: "> 85%"
    action: "Monitor and escalate if persistent"
    
  - metric: "Memory Usage"
    threshold: "> 90%"
    action: "Monitor and escalate if persistent"

notifications:
  pre_deployment:
    channel: "#deployments"
    message_template: "deployment_notification_template"
    
  post_deployment_success:
    channels:
      - "#deployments"
      - "@maintainers"
    message_template: "success_notification_template"
    
  post_deployment_failure:
    channels:
      - "#incidents"
      - "#deployments"
      - "@maintainers"
      - "@on-call"
    message_template: "failure_notification_template"

artifacts:
