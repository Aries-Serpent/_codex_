name-template: "Release v$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"
categories:
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🛠 Fixes"
    labels: ["fix", "bug"]
  - title: "🧪 Tests"
    labels: ["test", "tests"]
  - title: "🧰 Tooling/CI"
    labels: ["ci", "tooling"]
  - title: "📚 Docs"
    labels: ["docs"]
change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
template: |
  ## What's Changed
  $CHANGES

  ## New Contributors
  $CONTRIBUTORS
