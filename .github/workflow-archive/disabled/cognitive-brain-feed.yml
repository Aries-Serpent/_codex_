name: Art_Cognitive Brain Pattern Feeding

on:
  # Daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # After workflow health checks complete
  workflow_run:
    workflows: ["Workflow Health Check"]
    types: [completed]

  # Manual trigger with parameters
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days of history to analyze'
        required: false
        default: '30'
        type: choice
        options:
          - '7'
          - '14'
          - '30'
          - '60'
          - '90'

jobs:
  feed-patterns:
    name: Extract & Feed Patterns
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy

      - name: Extract workflow patterns
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          python scripts/cognitive/extract_workflow_patterns.py \
            --days-back ${{ github.event.inputs.days_back || '30' }} \
            --repo ${{ github.repository }}

      - name: Commit cognitive brain updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [[ -n $(git status --porcelain .codex/cognitive_brain/) ]]; then
            git add .codex/cognitive_brain/
            git commit -m "🧠 Update cognitive brain patterns [automated]

            - Analysis period: ${{ github.event.inputs.days_back || '30' }} days
            - Triggered by: ${{ github.event_name }}
            - Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            git push
            echo "✅ Cognitive brain updated"
          else
            echo "ℹ️  No changes to cognitive brain"
          fi

      - name: Upload pattern artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-brain-patterns-${{ github.run_id }}
          path: .codex/cognitive_brain/
          retention-days: 90

      - name: Create issue on anomalies
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Cognitive Brain Pattern Extraction Failed';
            const body = `
            ## Pattern Extraction Failure

            The cognitive brain pattern extraction workflow failed.

            **Details:**
            - Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Triggered by: ${{ github.event_name }}
            - Branch: ${{ github.ref }}
            - Commit: ${{ github.sha }}

            **Action Required:**
            Review the workflow logs and fix any issues with:
            1. GitHub API access
            2. Pattern extraction logic
            3. Cognitive brain database integrity

            **Quantum Status:** Wave function collapsed to error state 🌊
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automated', 'cognitive-brain', 'priority-high']
            });
