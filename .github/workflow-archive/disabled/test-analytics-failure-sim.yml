name: Analytics Failure Simulator
# Auto-generated by AI Agent (Task 2.8) - 2026-01-22T05:52:45Z
# Purpose: Provides controlled failure scenarios for testing workflow analytics

on:
  workflow_dispatch:
    inputs:
      failure_type:
        type: choice
        description: 'Type of failure to simulate'
        required: true
        default: 'import_error'
        options:
          - import_error
          - timeout
          - assertion_failure
          - permission_denied

permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  simulate-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow test-analytics-failure-sim 2>/dev/null || echo "Cache health: check skipped"
      - name: Simulate Failure
        run: |
          echo "Simulating failure type: ${{ github.event.inputs.failure_type }}"

          case "${{ github.event.inputs.failure_type }}" in
            import_error)
              echo "Simulating ImportError..."
              python3 -c "import nonexistent_module_for_analytics_testing"
              ;;
            timeout)
              echo "Simulating timeout..."
              timeout 1s sleep 60 || exit 1
              ;;
            assertion_failure)
              echo "Simulating assertion failure..."
              python3 -c "assert False, 'Simulated assertion failure for analytics testing'"
              ;;
            permission_denied)
              echo "Simulating permission denied..."
              cat /etc/shadow 2>&1 || true
              exit 1
              ;;
            *)
              echo "Unknown failure type"
              exit 1
              ;;
          esac

      - name: Cleanup
        if: always()
        run: echo "Test failure simulation complete"
