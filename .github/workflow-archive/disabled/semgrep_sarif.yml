name: Semgrep SAST (SARIF Upload)

on:
  push:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow semgrep_sarif 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'live'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          echo "Running Semgrep security scan..."

          # Run semgrep with fallback configurations
          # Try primary configs first, fall back to auto if they fail
          semgrep scan \
            --config=p/security-audit \
            --config=p/python \
            --config=p/flask \
            --config=p/sqlalchemy \
            --sarif \
            --output=semgrep-results.sarif \
            --verbose \
            2>&1 | tee semgrep-scan.log || {
              echo "Primary configs failed, falling back to auto..."
              semgrep scan \
                --config=auto \
                --sarif \
                --output=semgrep-results.sarif \
                --verbose \
                2>&1 | tee semgrep-scan-fallback.log
            }

          EXIT_CODE=$?

          # Also generate human-readable output
          if [ -f semgrep-results.sarif ]; then
            semgrep scan \
              --config=p/security-audit \
              --config=p/python \
              --config=p/flask \
              --config=p/sqlalchemy \
              --text \
              --output=semgrep-results.txt \
              2>&1 || semgrep scan \
                --config=auto \
                --text \
                --output=semgrep-results.txt \
                2>&1 || true

            if [ -f semgrep-results.txt ]; then
              echo "=== Semgrep Results ==="
              cat semgrep-results.txt
            fi
          fi

          # Exit with actual code (continue-on-error prevents blocking)
          exit ${EXIT_CODE:-0}

      - name: Chunk SARIF results
        if: always() && hashFiles('semgrep-results.sarif') != ''
        run: |
          echo "🔧 Chunking SARIF to comply with GitHub 5000-result limit..."
          python scripts/chunk_sarif.py \
            semgrep-results.sarif \
            sarif-chunks/ \
            --chunk-size 4999 \
            --base-name semgrep \
            --verbose

      - name: Upload chunked SARIF to GitHub Security
        if: always() && hashFiles('sarif-chunks/*.sarif') != ''
        run: |
          echo "📤 Uploading SARIF chunks to GitHub Code Scanning..."

          CHUNKS=(sarif-chunks/*.sarif)
          CHUNK_COUNT=${#CHUNKS[@]}

          if [ "$CHUNK_COUNT" -eq 0 ]; then
            echo "⚠️  No SARIF files found to upload"
            exit 0
          fi

          echo "Found $CHUNK_COUNT chunk(s) to upload"

          for i in "${!CHUNKS[@]}"; do
            sarif_file="${CHUNKS[$i]}"
            chunk_num=$((i + 1))

            echo "Uploading chunk $chunk_num/$CHUNK_COUNT: $sarif_file"

            # Extract chunk suffix for category
            chunk_suffix=$(basename "$sarif_file" .sarif | sed 's/semgrep-chunk-//')

            # Upload via GitHub API
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/code-scanning/sarifs" \
              -F "sarif=@$sarif_file" \
              -F "commit_sha=${{ github.sha }}" \
              -F "ref=${{ github.ref }}" \
              -F "checkout_uri=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}" \
              -F "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -F "tool_name=Semgrep" \
              -F "category=semgrep-chunk-$chunk_suffix" \
              && echo "✅ Chunk $chunk_num uploaded" \
              || echo "❌ Chunk $chunk_num failed"
          done

          echo "✅ Upload complete: $CHUNK_COUNT chunks processed"
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: Upload Semgrep results as artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: semgrep-results
          path: |
            semgrep-results.sarif
            semgrep-results.txt
            sarif-chunks/
          retention-days: 30

      - name: Post findings to PR dashboard
        if: github.event_name == 'pull_request' && always()
        uses: ./.github/actions/post-pr-summary
        with:
          workflow-name: 'Semgrep Security Scan'
          status: >-
            ${{ steps.semgrep.outcome == 'failure' && 'failure' || 'success' }}
          summary: >-
            ${{ steps.semgrep.outcome == 'failure'
                && 'Security issues detected — review required'
                || 'No security issues found' }}
          details: |
            Semgrep scan completed. See workflow artifacts for full SARIF output.
            Run `@copilot Use code-scanning-remediation-agent to fix alerts` to auto-remediate.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: semgrep
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Semgrep SARIF Scan"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
