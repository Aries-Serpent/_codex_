name: Art_CI/CD Health Suite

"on":
  # Scheduled monitoring
  schedule:
    # Health check: Every 3 hours
    - cron: '0 */3 * * *'
    # Diagnostics: Every 6 hours
    - cron: '0 */6 * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - 'all'
          - 'health-monitor'
          - 'diagnostics'
          - 'artifact-check'
          - 'runner-check'
        default: 'all'
      create-issues:
        description: 'Create issues for failures'
        required: false
        type: boolean
        default: true

  # Enable workflow_call for AI agent integration
  workflow_call:
    inputs:
      operation:
        description: 'Operation to perform'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read
  issues: write
  actions: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  # Job 1: CI/CD Health Monitor
  health-monitor:
    name: CI/CD Health Monitoring
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 */3 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'all' || inputs.operation == 'health-monitor')) ||
      github.event_name == 'workflow_call'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common

      - name: Install dependencies
        run: |
          pip install PyGithub requests PyYAML pandas tabulate

      - name: Check workflow health
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python << 'EOF'
          import os
          import json
          import requests
          from datetime import datetime, timedelta
          from collections import defaultdict

          token = os.environ['GH_TOKEN']
          repo = '${{ github.repository }}'
          headers = {'Authorization': f'token {token}'}

          # Fetch recent workflow runs (last 24 hours)
          since = (datetime.utcnow() - timedelta(hours=24)).isoformat() + 'Z'
          url = f'https://api.github.com/repos/{repo}/actions/runs'
          params = {'created': f'>={since}', 'per_page': 100}

          response = requests.get(url, headers=headers, params=params)
          runs = response.json().get('workflow_runs', [])

          # Analyze workflow health
          workflow_stats = defaultdict(lambda: {'total': 0, 'success': 0, 'failure': 0})

          for run in runs:
              workflow_name = run['name']
              status = run['conclusion']

              workflow_stats[workflow_name]['total'] += 1
              if status == 'success':
                  workflow_stats[workflow_name]['success'] += 1
              elif status in ['failure', 'cancelled', 'timed_out']:
                  workflow_stats[workflow_name]['failure'] += 1

          # Calculate health scores
          unhealthy_workflows = []
          for workflow, stats in workflow_stats.items():
              if stats['total'] > 0:
                  success_rate = (stats['success'] / stats['total']) * 100
                  if success_rate < 80:  # Less than 80% success rate
                      unhealthy_workflows.append({
                          'name': workflow,
                          'success_rate': success_rate,
                          'failures': stats['failure']
                      })

          # Output results
          print(f"Total workflows checked: {len(workflow_stats)}")
          print(f"Unhealthy workflows: {len(unhealthy_workflows)}")

          if unhealthy_workflows:
              print("\n⚠️  Workflows requiring attention:")
              for wf in unhealthy_workflows:
                  print(f"  - {wf['name']}: {wf['success_rate']:.1f}% success rate ({wf['failures']} failures)")

              # Save for issue creation
              with open('/tmp/unhealthy_workflows.json', 'w') as f:
                  json.dump(unhealthy_workflows, f)

              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('unhealthy=true\n')
          else:
              print("\n✅ All workflows are healthy (>80% success rate)")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('unhealthy=false\n')
          EOF

      - name: Create issue for unhealthy workflows
        if: steps.health.outputs.unhealthy == 'true' && (inputs.create-issues || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python << 'EOF'
          import json
          import os
          import subprocess
          from datetime import datetime

          with open('/tmp/unhealthy_workflows.json') as f:
              workflows = json.load(f)

          # Create issue body
          body = f"## CI/CD Health Alert\n\n"
          body += f"**Date:** {datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}\n\n"
          body += "The following workflows have success rates below 80% in the last 24 hours:\n\n"

          for wf in workflows:
              body += f"### {wf['name']}\n"
              body += f"- **Success Rate:** {wf['success_rate']:.1f}%\n"
              body += f"- **Failures:** {wf['failures']}\n\n"

          body += "\n**Recommended Actions:**\n"
          body += "1. Review recent workflow run logs\n"
          body += "2. Check for infrastructure issues\n"
          body += "3. Validate workflow configurations\n"
          body += "4. Consider enabling self-healing if applicable\n"

          # Create issue using gh CLI
          subprocess.run([
              'gh', 'issue', 'create',
              '--title', f'CI/CD Health Alert: {len(workflows)} Unhealthy Workflows',
              '--body', body,
              '--label', 'ci-health,automated'
          ])
          EOF

      - name: Generate health report
        run: |
          echo "## CI/CD Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.health.outputs.unhealthy == 'true' && '⚠️ Issues Detected' || '✅ Healthy' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Check Period:** Last 24 hours" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.health.outputs.unhealthy }}" == "true" ]; then
            echo "See created issue for details on unhealthy workflows." >> $GITHUB_STEP_SUMMARY
          else
            echo "All workflows are operating normally (>80% success rate)." >> $GITHUB_STEP_SUMMARY
          fi

  # Job 2: Artifact Monitoring
  artifact-monitoring:
    name: Artifact Health Check
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'all' || inputs.operation == 'artifact-check'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common

      - name: Install dependencies
        run: |
          pip install PyGithub requests PyYAML

      - name: Check artifact health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python << 'EOF'
          import os
          import requests
          from datetime import datetime, timedelta

          token = os.environ['GH_TOKEN']
          repo = '${{ github.repository }}'
          headers = {'Authorization': f'token {token}'}

          # Fetch artifacts
          url = f'https://api.github.com/repos/{repo}/actions/artifacts'
          response = requests.get(url, headers=headers, params={'per_page': 100})
          artifacts = response.json().get('artifacts', [])

          print(f"Total artifacts: {len(artifacts)}")

          # Check for expiring artifacts
          now = datetime.utcnow()
          expiring_soon = []

          for artifact in artifacts:
              expires_at = datetime.fromisoformat(artifact['expires_at'].replace('Z', '+00:00'))
              days_until_expiry = (expires_at - now.replace(tzinfo=expires_at.tzinfo)).days

              if days_until_expiry < 7:
                  expiring_soon.append({
                      'name': artifact['name'],
                      'days': days_until_expiry,
                      'size_mb': artifact['size_in_bytes'] / (1024 * 1024)
                  })

          if expiring_soon:
              print(f"\n⚠️  {len(expiring_soon)} artifacts expiring within 7 days:")
              for art in expiring_soon[:10]:
                  print(f"  - {art['name']}: {art['days']} days, {art['size_mb']:.2f} MB")
          else:
              print("\n✅ No artifacts expiring soon")
          EOF

  # Job 3: Runner Diagnostics
  runner-diagnostics:
    name: Runner Health Check
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'all' || inputs.operation == 'runner-check'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner health
        run: |
          echo "## Runner Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** ${{ runner.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**OS:** ${{ runner.os }}" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** ${{ runner.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # System resources
          echo "### System Resources" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "CPU cores: $(nproc)" >> $GITHUB_STEP_SUMMARY
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')" >> $GITHUB_STEP_SUMMARY
          echo "Disk space: $(df -h / | tail -1 | awk '{print $4}' ) available" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check Python environment
        run: |
          python --version
          pip --version
          echo "Python packages: $(pip list | wc -l)"

      - name: Network connectivity check
        run: |
          ping -c 3 github.com || echo "⚠️ Network connectivity issue"
          curl -I https://pypi.org/ || echo "⚠️ PyPI connectivity issue"

  # Job 4: CI Diagnostics Automation
  ci-diagnostics:
    name: Automated CI Diagnostics
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'all' || inputs.operation == 'diagnostics'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: ephemeral

      - name: Run diagnostic checks
        run: |
          echo "Running comprehensive CI diagnostics..."

          # Check for common issues
          echo "## Diagnostic Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 1. Check workflow syntax
          echo "### Workflow Syntax" >> $GITHUB_STEP_SUMMARY
          python << 'EOF' >> $GITHUB_STEP_SUMMARY || echo "⚠️ Syntax check failed"
          import yaml
          from pathlib import Path

          workflows = Path('.github/workflows').glob('*.yml')
          errors = []

          for wf in workflows:
              try:
                  with open(wf) as f:
                      yaml.safe_load(f)
              except yaml.YAMLError as e:
                  errors.append(f"{wf.name}: {str(e)}")

          if errors:
              print("⚠️ Syntax errors found:")
              for err in errors:
                  print(f"  - {err}")
          else:
              print("✅ All workflow files have valid YAML syntax")
          EOF

          # 2. Check for Python 3.12 usage
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Python Version Compliance" >> $GITHUB_STEP_SUMMARY
          if grep -r "python-version.*3\.1[01]" .github/workflows/*.yml > /dev/null; then
            echo "⚠️ Some workflows still use Python 3.10/3.11" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All workflows use Python 3.12" >> $GITHUB_STEP_SUMMARY
          fi

  # Summary job
  ci-health-summary:
    name: CI/CD Health Suite Summary
    runs-on: ubuntu-latest
    needs: [health-monitor, artifact-monitoring, runner-diagnostics, ci-diagnostics]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## CI/CD Health Suite - Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Health Monitor:** ${{ needs.health-monitor.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact Monitoring:** ${{ needs.artifact-monitoring.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Runner Diagnostics:** ${{ needs.runner-diagnostics.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**CI Diagnostics:** ${{ needs.ci-diagnostics.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All health checks completed. See individual job outputs for details." >> $GITHUB_STEP_SUMMARY
