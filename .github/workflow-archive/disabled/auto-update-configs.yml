name: Auto-update Package Configs

on:
  push:
    branches: [main, develop, 'copilot/**']
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'scripts/generate_*.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'
