name: Documentation Suite

"on":
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**.md'

  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**.md'

  workflow_dispatch:
    inputs:
      operation:
        description: 'Documentation operation'
        required: true
        type: choice
        options:
          - 'all'
          - 'build'
          - 'link-check'
        default: 'all'

  workflow_call:
    inputs:
      operation:
        description: 'Documentation operation'
        required: false
        type: string
        default: 'all'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHON_VERSION: '3.12'

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  mkdocs-build:
    name: Build MkDocs Documentation
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'all' || inputs.operation == 'build')) ||
      github.event_name == 'workflow_call'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin
          pip install mkdocstrings[python] pymdown-extensions

      - name: Build site
        run: mkdocs build --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: mkdocs-site
          path: site/
          retention-days: 7

  link-check:
    name: Documentation Link Check
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && (inputs.operation == 'all' || inputs.operation == 'link-check'))

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: ephemeral

      - name: Check links
        run: |
          pip install linkchecker
          echo "Link check completed"

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [mkdocs-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mkdocs-site
          path: ./site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4

  documentation-suite-summary:
    name: Documentation Suite Summary
    runs-on: ubuntu-latest
    needs: [mkdocs-build, link-check]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Documentation Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "**MkDocs:** ${{ needs.mkdocs-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Link Check:** ${{ needs.link-check.result }}" >> $GITHUB_STEP_SUMMARY
