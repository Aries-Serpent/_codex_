name: Testing Suite

"on":
  # Run on all PRs
  pull_request:
    branches: [main, develop]

  # Run on push to main
  push:
    branches: [main]

  # Manual trigger with test selection
  workflow_dispatch:
    inputs:
      test-scope:
        description: 'Test scope to run'
        required: true
        type: choice
        options:
          - 'all'
          - 'core'
          - 'rag'
          - 'auth'
          - 'integration'
          - 'determinism'
        default: 'all'
      python-version:
        description: 'Python version'
        required: false
        default: '3.12'
      fail-fast:
        description: 'Fail fast on first error'
        required: false
        type: boolean
        default: false
      xdist-workers:
        description: 'Number of xdist workers (0=auto, 1=sequential)'
        required: false
        type: number
        default: 4
      xdist-dist:
        description: 'xdist distribution strategy'
        required: false
        type: choice
        options:
          - 'worksteal'
          - 'loadgroup'
          - 'loadscope'
          - 'loadfile'
        default: 'worksteal'

  # Enable workflow_call for AI agent integration
  workflow_call:
    inputs:
      test-scope:
        description: 'Test scope to run'
        required: false
        type: string
        default: 'all'
      python-version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'

permissions:
  contents: read
  checks: write  # For test reporting
  pull-requests: write  # For PR comments

env:
  PYTHON_VERSION: '3.12'
  # PYTEST_ADDOPTS removed - environment variable causes pytest-xdist workers to crash during plugin initialization;
  # pytest options are passed directly on the command line instead to avoid these worker crashes.

jobs:
  # Job 1: Core Tests - Main test suite
  core-tests:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'core')) ||
      github.event_name == 'workflow_call'

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ matrix.python-version }}
          cache-tier: live  # Use live tier for critical tests

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install pytest plugins BEFORE editable install to ensure worker availability
          pip install "pytest>=8.2,<9.0" "pytest-cov>=5.0,<6.0" "pytest-xdist>=3.5,<4.0" "pytest-timeout>=2.3,<3.0" "coverage>=7.5"
          pip install -e ".[test]"

      - name: Python interpreter and plugin diagnostics
        run: |
          echo "=== Controller Environment ==="
          python -c "import sys; print(f'sys.executable: {sys.executable}')"
          python -m pytest --version
          python -c "import xdist; print(f'pytest-xdist: {xdist.__version__}')"
          python -c "import pytest_cov; print(f'pytest-cov: {pytest_cov.__version__}')"
          python -c "import coverage; print(f'coverage: {coverage.__version__}')"
          echo ""

      - name: Validate core dependencies before testing
        run: |
          echo "=== Validating Core Test Dependencies ==="
          python -c "import sys; sys.path.insert(0, 'src'); import pytest; print(f'✓ pytest {pytest.__version__}')" || echo "❌ pytest import failed"
          python -c "import sys; sys.path.insert(0, 'src'); import codex; print('✓ codex module')" || echo "❌ codex import failed"
          python -c "import numpy; print(f'✓ numpy {numpy.__version__}')" || echo "⚠️  numpy not installed (some tests will be skipped)"
          python -c "import torch; print(f'✓ torch {torch.__version__}')" || echo "⚠️  torch not installed (some tests will be skipped)"
          echo ""

      - name: Show test collection diagnostics
        run: |
          echo "=== Test Collection Diagnostics ==="
          # Temporarily disable errexit to capture full output even on collection errors
          set +e
          COLLECT_OUTPUT="$(python -m pytest tests/ --collect-only -vv 2>&1)"
          COLLECT_STATUS=$?
          set -e

          # Show summary of collection
          echo "$COLLECT_OUTPUT" | tail -20
          echo ""

          if [ "$COLLECT_STATUS" -eq 0 ]; then
            echo "✅ Test collection successful"
            # Count collected tests
            echo "$COLLECT_OUTPUT" | grep -E "^collected [0-9]+ item" || echo "$COLLECT_OUTPUT" | tail -5
          elif [ "$COLLECT_STATUS" -eq 2 ]; then
            echo "⚠️  Test collection completed with import errors (exit code 2)"
            echo "This is expected if optional dependencies are not installed."
            echo ""
            echo "=== Import Error Summary ==="
            echo "$COLLECT_OUTPUT" | grep -E "ERROR collecting|ModuleNotFoundError|ImportError" | head -20
            echo ""
            echo "=== Collected vs Skipped ==="
            echo "$COLLECT_OUTPUT" | grep -E "(collected|errors|skipped)" | tail -5
            # Don't fail on import errors - these are expected for optional dependencies
            echo "Note: Tests requiring missing dependencies will be skipped during execution"
          else
            echo "❌ Test collection failed with exit code $COLLECT_STATUS"
            echo "=== Full pytest output ==="
            printf '%s\n' "$COLLECT_OUTPUT"
            exit 1
          fi

          echo ""
          echo "=== Test Directory Structure ==="
          find tests/ -name "test_*.py" -type f | wc -l | xargs echo "Total test files:"
          echo ""

      - name: Run core tests with coverage (layered fallbacks)
        run: |
          set -euo pipefail

          # Tier 1: Plugin-driven parallel with pytest-cov
          echo "=== Tier 1: Plugin-driven parallel execution ==="
          # Use --continue-on-collection-errors to not fail on import errors
          if pytest tests/ \
            --color=yes \
            --verbose \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=junit.xml \
            --continue-on-collection-errors \
            -n 4 \
            --dist worksteal \
            --maxfail=10; then
            echo "✅ Plugin-driven parallel succeeded"
            exit 0
          fi

          # Tier 2: Coverage-run with parallel pytest
          echo "⚠️ Plugin-driven parallel failed; trying coverage-run with parallel pytest"
          rm -f .coverage .coverage.* coverage.xml junit.xml
          if coverage run -m pytest tests/ \
            --color=yes \
            --verbose \
            --junitxml=junit.xml \
            --continue-on-collection-errors \
            --maxfail=10; then
            echo "✅ Coverage-run parallel succeeded"
            coverage combine || true
            coverage xml || true
            coverage html || true
            coverage report || true
            exit 0
          fi

          # Tier 3: Sequential coverage-run (last resort)
          echo "⚠️ Parallel coverage-run failed; falling back to sequential execution"
          rm -f .coverage .coverage.* coverage.xml junit.xml
          if coverage run -m pytest tests/ \
            --color=yes \
            --verbose \
            --junitxml=junit.xml \
            --continue-on-collection-errors \
            --maxfail=10; then
            echo "✅ Sequential coverage-run completed"
            exit 0
          else
            echo "❌ All test tiers failed"
            exit 1
          fi
        env:
          PYTHONPATH: ${{ github.workspace }}
          CODEX_FORCE_CPU: "1"
          RAG_EMBEDDING_PROVIDER: sentence-transformers
          CODEX_ML_SUPPORTED_MODEL: dummy

      - name: Combine and report coverage
        if: always()
        run: |
          echo "=== Combining coverage data ==="
          coverage combine || echo "No coverage data to combine (may be single .coverage file)"

          echo "=== Generating coverage reports ==="
          coverage html || echo "HTML report generation failed"
          coverage xml || echo "XML report generation failed"

          echo "=== Coverage summary ==="
          # Enforce a minimum coverage level for CI. This is a soft gate:
          # - CI will emit a warning if coverage is below the threshold
          # - The job will not fail solely due to low coverage
          # If you adjust this threshold, update associated documentation/roadmap.
          coverage report --fail-under=70 || {
            echo "⚠️ Soft gate: Coverage below 70%"
            coverage report || true
          }

      - name: Validate coverage artifacts before upload
        if: always()
        run: |
          # Validate that pytest actually generated coverage data
          # Only create placeholders if coverage.xml is missing (which indicates test collection/execution issues)
          if [ -f "coverage.xml" ]; then
            echo "✅ Coverage XML generated by pytest"
            # Verify it's not empty or malformed
            if grep -q '<coverage' coverage.xml; then
              echo "✅ Coverage XML appears valid"
            else
              echo "⚠️ Coverage XML exists but may be malformed"
            fi
          else
            echo "⚠️ Coverage XML not found - creating placeholder to prevent upload failure"
            python scripts/ensure_test_artifacts.py --coverage --junit
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          name: coverage-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-report-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Generate test summary
        if: always()
        run: |
          echo "## Core Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Python Version:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show test counts from JUnit XML if available using Python for robust parsing
          if [ -f junit.xml ]; then
            python3 .github/scripts/parse_junit_xml.py junit.xml >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "See attached artifacts for detailed coverage reports." >> $GITHUB_STEP_SUMMARY

  # Job 2: RAG Tests - Specialized RAG testing
  rag-tests:
    name: RAG Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'rag'))

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ matrix.python-version }}
          cache-tier: common

      - name: Cache sentence transformers models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: ${{ runner.os }}-sentence-transformers-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-sentence-transformers-py${{ matrix.python-version }}-
            ${{ runner.os }}-sentence-transformers-

      - name: Install RAG dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,rag]"

      - name: Run RAG tests
        run: |
          pytest tests/rag/ \
            --cov=src/codex/rag \
            --cov-report=xml \
            -v

      - name: Upload RAG coverage
        uses: actions/upload-artifact@v6
        with:
          name: rag-coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  # Job 3: Auth Tests - Authentication & security tests
  auth-tests:
    name: Auth Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'auth'))

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ matrix.python-version }}
          cache-tier: common

      - name: Install auth dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,auth]"

      - name: Run auth tests
        env:
          # Use test secrets (not real)
          TEST_JWT_SECRET: test_secret_key_for_testing_only
          TEST_MASTER_KEY: test_master_key_for_testing_only
        run: |
          pytest tests/auth/ tests/security/ \
            --cov=src/codex/auth \
            --cov=src/codex/security \
            --cov-report=xml \
            -v

      - name: Security scan of auth code
        run: |
          pip install bandit safety
          bandit -r src/codex/auth/ src/codex/security/ -f json -o /tmp/bandit-auth.json || true
          safety check --json > /tmp/safety-auth.json || true

      - name: Upload auth security report
        uses: actions/upload-artifact@v6
        with:
          name: auth-security-report-${{ matrix.python-version }}
          path: |
            /tmp/bandit-auth.json
            /tmp/safety-auth.json
          retention-days: 7

  # Job 4: Integration Tests - Cross-component testing
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'integration'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --cov=src \
            --cov-report=xml \
            --timeout=300 \
            -v

      - name: Upload integration coverage
        uses: actions/upload-artifact@v6
        with:
          name: integration-coverage
          path: coverage.xml
          retention-days: 7

  # Job 5: Determinism Tests - Ensure reproducibility
  determinism-tests:
    name: Determinism Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'determinism'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common

      - name: Install dependencies
        run: |
          pip install -e ".[test]"

      - name: Run determinism tests (iteration 1)
        id: run1
        run: |
          pytest tests/determinism/ -v --json-report --json-report-file=/tmp/results1.json

      - name: Run determinism tests (iteration 2)
        id: run2
        run: |
          pytest tests/determinism/ -v --json-report --json-report-file=/tmp/results2.json

      - name: Compare results
        run: |
          python .github/scripts/compare_test_results.py /tmp/results1.json /tmp/results2.json

  # Summary job
  test-suite-summary:
    name: Test Suite Summary
    runs-on: ubuntu-latest
    needs: [core-tests, rag-tests, auth-tests, integration-tests, determinism-tests]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Testing Suite - Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Core Tests:** ${{ needs.core-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**RAG Tests:** ${{ needs.rag-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Auth Tests:** ${{ needs.auth-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Integration Tests:** ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Determinism Tests:** ${{ needs.determinism-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine overall status
          if [ "${{ needs.core-tests.result }}" == "success" ]; then
            echo "✅ All critical tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed - review individual job outputs" >> $GITHUB_STEP_SUMMARY
          fi
