# [Inventory]: Shim & Canonical Module Registry (v1.2.9)
# > Generated: 2025-12-05 | Author: mbaetiong
# Purpose: Govern legacy shims and canonical modules during convergence.
# Fields:
# - module: logical module name
# - legacy_path: root path of legacy module (if any)
# - canonical_path: src path of canonical module (or planned target)
# - owner: primary maintainer
# - status: one of [active, shim, migrated, scheduled]
# - rationale: brief reason for shim
# - deprecation_date: ISO date if scheduled to deprecate
# - whitelist_duplicates: list of known, approved duplicates for strict checks
# - notes: free-form

