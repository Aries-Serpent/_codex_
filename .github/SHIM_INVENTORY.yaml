policy:
  strict_conflicts:
    enabled: true
    whitelist_source: ".github/SHIM_INVENTORY.yaml"
  decision_gates:
    min_equivalence_overlap: 3
    usage_trend_threshold_pct: 10
    usage_trend_window_days: 90
    low_risk_tests_threshold: 10
