  # === Intentional Duplicates (Added 2025-12-08) ===

  - module: repository.markers
    legacy_path: ""
    canonical_path: ""
    owner: repository-admin
    status: intentional
    rationale: "Empty files serving as directory markers (.gitkeep) and Python package markers (__init__.py)"
    deprecation_date: null
    whitelist_duplicates:
      - ".gitkeep"
      - "__init__.py"
      - "artifacts/.gitkeep"
      - "monitoring/.gitkeep"
      - "data/.gitkeep"
    notes: "Standard practice - these files serve specific purposes (git tracking, Python imports). Not actual duplicates requiring remediation."

  - module: python.common_patterns
    legacy_path: ""
    canonical_path: ""
    owner: python-team
    status: intentional
    rationale: "Standard Python magic methods and common function names"
    deprecation_date: null
    whitelist_duplicates:
      - "__init__"
      - "__repr__"
      - "__str__"
      - "__call__"
      - "main"
      - "forward"
      - "to_dict"
    notes: "These are standard Python patterns and language idioms, not code duplication requiring refactoring. Each implementation is contextually appropriate."

  - module: pytest.fixtures
    legacy_path: ""
    canonical_path: ""
    owner: qa-team
    status: intentional
    rationale: "pytest conftest.py files provide directory-specific test fixtures"
    deprecation_date: null
    whitelist_duplicates:
      - "tests/*/conftest.py"
      - "conftest.py"
    notes: "pytest design pattern - each test directory can have its own conftest.py for scoped fixtures. This is correct test infrastructure, not duplication."

policy:
  strict_conflicts:
    enabled: true
    whitelist_source: ".github/SHIM_INVENTORY.yaml"
  decision_gates:
    min_equivalence_overlap: 3
    usage_trend_threshold_pct: 10
    usage_trend_window_days: 90
    low_risk_tests_threshold: 10
  
  # Duplicate file detection policy
  duplicate_policy:
    # Patterns to ignore in duplicate detection (intentional duplicates)
    ignore_patterns:
      - "**/__init__.py"      # Python package markers
      - "**/conftest.py"       # Pytest configuration files
      - "**/.gitkeep"          # Git directory placeholder files
    
    # Files that require investigation or documentation
    requires_investigation:
      - path: "src/tokenization/loader.py"
        duplicate_of: "tokenization/loader.py"
        status: "pending_review"
        notes: "Determine canonical location and remove duplicate"
    
    # Reference documentation
    policy_document: ".github/DUPLICATE_FILES_POLICY.md"
