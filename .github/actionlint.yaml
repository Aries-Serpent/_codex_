self-hosted-runner:
  # Labels of self-hosted runner in array of strings.
  labels:
    - ubuntu-latest-m

# Secrets defined in your repository.
# Custom secrets used throughout the repository for token fallback patterns.
secrets:
  - CODEX_MASTER_KEY
  - CODEX_BACKUP_KEY

# Configuration variables in array of strings defined in your repository or
# organization. `null` means disabling configuration variables check.
config-variables: null

# Suppress selected ShellCheck findings repo-wide.
#
# Suppressed codes (info/style/warning/error — stylistic false-positives):
#   SC2086 - Double quote to prevent globbing and word splitting  (info)
#   SC2012 - Use find instead of ls (info)
#   SC2016 - Expressions don't expand in single quotes (info)
#   SC2002 - Useless cat (style)
#   SC2129 - Consider using { } >> file instead of individual redirects (style)
#   SC2001 - See if you can use ${variable//search/replace} instead (style)
#   SC2006 - Use $(...) notation instead of legacy backticks (style)
#   SC2155 - Declare and assign separately to avoid masking return values (warning)
#   SC2046 - Quote this to prevent word splitting (warning)
#   SC2034 - Variable appears unused (warning)
#   SC1012 - \n is just literal 'n' (warning)
#   SC2026 - This word is outside of quotes (info)
#   SC2153 - Possible misspelling (info)
#   SC2223 - This default assignment may cause DoS (info)
#   SC2162 - read without -r will mangle backslashes (info)
#   SC2015 - A && B || C is not if-then-else (info)
#   SC2181 - Check exit code directly with e.g. 'if mycmd', not indirectly via $? (style)
#
# Suppressed codes (false-positives from Python code in shell heredocs):
#   SC1036 - '(' is invalid here — triggered by Python code in << 'HEREDOC' (error)
#   SC1088 - Parsing stopped here — triggered by Python code in << 'HEREDOC' (error)
#   SC2283 - Remove spaces around = — triggered by Python assignments in heredoc (error)
#
# Suppressed codes (false-positives from pip version specifiers):
#   SC2261 - Multiple redirections compete — triggered by pkg>=ver in pip install (error)
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'SC2086:info:'
      - 'SC2012:info:'
      - 'SC2016:info:'
      - 'SC2002:style:'
      - 'SC2129:style:'
      - 'SC2001:style:'
      - 'SC2006:style:'
      - 'SC2155:warning:'
      - 'SC2046:warning:'
      - 'SC2034:warning:'
      - 'SC1012:warning:'
      - 'SC2026:info:'
      - 'SC2153:info:'
      - 'SC2223:info:'
      - 'SC2162:info:'
      - 'SC2015:info:'
      - 'SC2181:style:'
      - 'SC1036:error:'
      - 'SC1088:error:'
      - 'SC2283:error:'
      - 'SC2261:error:'
