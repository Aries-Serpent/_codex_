name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1) ... 2) ... 3) ..."
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs Actual }
    validations: { required: true }
