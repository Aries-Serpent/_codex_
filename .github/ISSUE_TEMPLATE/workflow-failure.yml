name: Workflow Failure Report
description: Automated workflow failure report generated by Artifact Monitor Agent
title: "[AUTO-MONITOR] Workflow Failure: "
labels: ["automated", "workflow-failure", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🤖 Automated Workflow Failure Report
        
        This issue was automatically generated by the **Artifact Monitor Agent** based on detected workflow failures.
        
        **DO NOT EDIT** this template - it is auto-populated by the monitoring system.

  - type: input
    id: workflow_name
    attributes:
      label: Workflow Name
      description: Name of the failed workflow
      placeholder: "test-comprehensive.yml"
    validations:
      required: true

  - type: input
    id: run_id
    attributes:
      label: Workflow Run ID
      description: GitHub Actions run ID
      placeholder: "12345678"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Current Status
      description: Current failure status
      options:
        - Failed (1 consecutive)
        - Failed (2 consecutive)
        - Failed (3+ consecutive)
        - Flaky (intermittent failures)
        - Recovered
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Failure Category
      description: Category based on pattern analysis
      options:
        - Dependency
        - Test
        - Build
        - Coverage
        - Lint
        - Security
        - Infrastructure
        - Documentation
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Issue severity based on analysis
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: error_pattern
    attributes:
      label: Error Pattern
      description: Matched error pattern with confidence score
      placeholder: |
        Pattern ID: import_error_001
        Pattern Name: Missing Python Module Import
        Confidence: 95%
        Suggested Fix: Install missing dependency
      render: markdown
    validations:
      required: false

  - type: textarea
    id: diagnostic_links
    attributes:
      label: Diagnostic Links
      description: Links to workflow run, logs, artifacts, etc.
      placeholder: |
        | Resource | Link |
        |----------|------|
        | Workflow Run | [#12345](https://github.com/.../runs/12345) |
        | Logs | [View Logs](https://github.com/.../runs/12345/logs) |
      render: markdown
    validations:
      required: true

  - type: textarea
    id: agent_analysis
    attributes:
      label: Agent Analysis
      description: Analysis and recommendations from specialized agents
      placeholder: |
        ### CI Testing Agent Analysis
        **Confidence**: 85%
        **Root Cause**: Missing dependency
        **Recommended Actions**: Add to requirements.txt
      render: markdown
    validations:
      required: false

  - type: textarea
    id: historical_context
    attributes:
      label: Historical Context
      description: Failure history and trends
      placeholder: |
        - First Occurrence: 2026-01-22T03:30:00Z
        - Failure Count: 3 consecutive
        - Last Success: 2026-01-21T14:30:00Z
        - Flakiness Score: 0.05
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: recommended_actions
    attributes:
      label: Recommended Actions
      description: Suggested remediation steps
      options:
        - label: Add missing dependency
        - label: Fix test assertion
        - label: Update configuration
        - label: Increase timeout
        - label: Optimize performance
        - label: Review security alert
        - label: Fix documentation
        - label: Other (see agent analysis)

  - type: markdown
    attributes:
      value: |
        ---
        
        **Auto-generated by Artifact Monitor Agent**
        
        - [Configuration](.codex/config/monitoring.yaml)
        - [Architecture](.codex/monitoring/ARCHITECTURE.md)
        - [Pattern Database](.codex/monitoring/patterns/error_signatures.yaml)
