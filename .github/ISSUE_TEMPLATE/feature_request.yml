name: Feature request
description: Propose an enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: input
    id: motivation
    attributes: { label: Motivation / Business value }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use GIVEN–WHEN–THEN bullets.
