name: "Active PR Guard"
description: |
  Checks whether any open or draft pull request targets the given base branch.
  If any active PR exists, sets output `skip=true` so callers can skip their
  auto-commit/push step.  This prevents scheduled or workflow-triggered auto-pushes
  (e.g. manifest refresh, health sweep, embedding index rebuild) from creating
  divergence that causes merge conflicts in in-progress PRs.

  Usage:
    - uses: ./.github/actions/active-pr-guard
      id: pr_guard
      with:
        base-branch: main          # branch the auto-push would target
        gh-token: ${{ secrets.CODEX_MASTER_KEY || github.token }}

    - name: Push changes
      if: steps.pr_guard.outputs.skip != 'true'
      run: git push origin HEAD:main

inputs:
  base-branch:
    description: "Base branch to check for open/draft PRs (e.g. main, 0D_base_)"
    required: false
    default: "main"
  gh-token:
    description: "GitHub token with repo read access"
    required: true
  repo:
    description: "Repository in owner/name format (defaults to github.repository)"
    required: false
    default: ""

outputs:
  skip:
    description: "'true' if any open/draft PR targets base-branch; 'false' otherwise"
    value: ${{ steps.check.outputs.skip }}
  pr-count:
    description: "Number of open/draft PRs found"
    value: ${{ steps.check.outputs.pr_count }}
  pr-numbers:
    description: "Space-separated list of open/draft PR numbers"
    value: ${{ steps.check.outputs.pr_numbers }}

runs:
  using: "composite"
  steps:
    - name: Check for active PRs targeting base-branch
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        REPO: ${{ inputs.repo || github.repository }}
      run: |
        # ── Active-PR guard ──────────────────────────────────────────────────────
        # Any open or draft PR (state=open includes drafts) targeting BASE_BRANCH
        # means we must skip the auto-push to avoid creating merge-conflict divergence.
        #
        # Root cause this guard prevents:
        #   Scheduled/triggered CI workflows regenerate files (CODEX_MANIFEST.json,
        #   .secrets.baseline, etc.) and push directly to main/0D_base_.  If an
        #   active PR also modifies those files, the auto-push produces a 1-commit
        #   divergence that GitHub displays as "merge conflict" on the PR, requiring
        #   manual resolution and burning agent session time.
        #
        # Implementation note: we use per_page=1 because we only need to know
        # whether ANY PR exists — we do not need to enumerate all of them.
        # This avoids the pagination problem (per_page=100 misses PR #101+) and
        # makes the check O(1) regardless of repository size.
        # ─────────────────────────────────────────────────────────────────────────

        # First: fast existence check (per_page=1 — we only need "any or none")
        PR_EXISTS=$(gh api "repos/${REPO}/pulls?base=${BASE_BRANCH}&state=open&per_page=1" \
          --jq 'length' 2>/dev/null || echo "0")

        if [ "${PR_EXISTS}" -gt "0" ]; then
          # Second: fetch up to 10 PR numbers/titles for the summary (informational only)
          PR_JSON=$(gh api "repos/${REPO}/pulls?base=${BASE_BRANCH}&state=open&per_page=10" \
            --jq '[.[] | {number: .number, draft: .draft, title: .title}]' \
            2>/dev/null || echo "[]")
          PR_COUNT=$(echo "$PR_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))" 2>/dev/null || echo "1")
          PR_NUMBERS=$(echo "$PR_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(str(p['number']) for p in d))" 2>/dev/null || echo "")
        else
          PR_COUNT=0
          PR_NUMBERS=""
          PR_JSON="[]"
        fi

        echo "pr_count=${PR_COUNT}" >> "$GITHUB_OUTPUT"
        echo "pr_numbers=${PR_NUMBERS}" >> "$GITHUB_OUTPUT"

        if [ "${PR_COUNT}" -gt "0" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "## ⛔ Active-PR Guard: Push Deferred" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**${PR_COUNT}+ open/draft PR(s)** targeting \`${BASE_BRANCH}\` detected." >> "$GITHUB_STEP_SUMMARY"
          echo "Auto-push skipped to prevent merge-conflict divergence." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR | Draft | Title |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_JSON" | python3 -c "
        import sys, json
        for p in json.load(sys.stdin):
            draft = '✏️ draft' if p['draft'] else 'open'
            title = p['title'][:60] + ('…' if len(p['title']) > 60 else '')
            print(f\"| #{p['number']} | {draft} | {title} |\")
        " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> The auto-refresh will run automatically once all active PRs are merged." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "✅ No open/draft PRs targeting \`${BASE_BRANCH}\` — auto-push is safe." >> "$GITHUB_STEP_SUMMARY"
        fi
