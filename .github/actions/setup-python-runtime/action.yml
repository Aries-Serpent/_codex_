name: Set up Python runtime
description: Configure the requested Python interpreter without installing project dependencies.

inputs:
  python-version:
    description: Python version to configure
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
