name: 'Setup Python with Shared Cache'
description: >
  Set up Python with a 4-layer cache hierarchy so large packages (PyTorch,
  Transformers, datasets) are never re-downloaded on repeated CI runs.

  Layer 1 — pip download cache  (~/.cache/pip)         shared across ALL workflows
  Layer 2 — PyTorch CPU wheels  (~/.cache/torch-whl)   keyed on torch slot (2.x)
  Layer 3 — installed venv      (.venv_ci)              keyed on extras+flags+pyproject hash
  Layer 4 — npm tool cache      (~/.npm)                keyed on tool names

  Any cache miss falls back to the nearest matching restore-key so the
  freshly-downloaded wheels are at least served from the pip download cache
  and not fetched from PyPI again.
author: 'Aries-Serpent'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  extras:
    description: 'Package extras to install from pyproject.toml (e.g. "dev")'
    required: false
    default: 'dev'
  install-torch:
    description: >
      Install PyTorch CPU build (true/false).  Wheels are cached separately
      under ~/.cache/torch-whl so re-installs after a venv cache miss are fast.
    required: false
    default: 'false'
  install-preflight-extras:
    description: >
      Pre-install all optional extras required by the full test matrix:
        libcst (analysis), sqlparse/tree-sitter (ast), numpy/mlflow (perf),
        transformers/datasets/peft/accelerate (ml), hydra/omegaconf (configs).
      Torch is excluded here — handled by install-torch to avoid the
      CPU/GPU version conflict.  Set to "true" for the Resilient Validation
      Suite and any workflow that exercises the complete test suite.
    required: false
    default: 'false'
  install-npm-tools:
    description: 'Install npm tools such as markdown-link-check (true/false)'
    required: false
    default: 'false'

outputs:
  venv-python:
    description: 'Absolute path to the venv Python binary'
    value: ${{ steps.venv-path.outputs.venv-python }}
  cache-hit:
    description: 'Whether the venv cache was hit exactly (true/false)'
    value: ${{ steps.cache-venv.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    # ─────────────────────────────────────────────────────────────────
    # 1. Python interpreter
    # ─────────────────────────────────────────────────────────────────
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # ─────────────────────────────────────────────────────────────────
    # 2. LAYER 1 — pip download cache (~/.cache/pip)
    #    Shared by every workflow on this OS+Python combination.
    #    A restore-key without the hash means any prior run can seed it.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Cache L1: pip downloads (~/.cache/pip)'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-py${{ inputs.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/lock.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-py${{ inputs.python-version }}-

    # ─────────────────────────────────────────────────────────────────
    # 3. LAYER 2 — PyTorch CPU wheel cache (~/.cache/torch-whl)
    #    Keyed on the torch major-minor slot (2.x) only so it survives
    #    pyproject.toml edits that don't touch the torch version range.
    #    Only populated/restored when install-torch == true.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Cache L2: PyTorch CPU wheels (~/.cache/torch-whl)'
      if: inputs.install-torch == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/torch-whl
        key: ${{ runner.os }}-torch-cpu-py${{ inputs.python-version }}-slot2x
        restore-keys: |
          ${{ runner.os }}-torch-cpu-py${{ inputs.python-version }}-

    # ─────────────────────────────────────────────────────────────────
    # 4. LAYER 3 — installed venv (.venv_ci)
    #    Cache key encodes everything that affects the installed set:
    #      • extras string       (dev / dev,ml / ...)
    #      • torch flag          (changes what's in the venv)
    #      • preflight flag      (adds ml/analysis/ast/perf layers)
    #      • pyproject.toml hash (dep version bumps)
    #    Restore-keys give progressively looser matches so a cache
    #    that differs only by pyproject hash still seeds the venv and
    #    only a `pip install --upgrade` is needed, not a full rebuild.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Cache L3: installed venv (.venv_ci)'
      id: cache-venv
      uses: actions/cache@v4
      with:
        path: .venv_ci
        key: ${{ runner.os }}-venv-py${{ inputs.python-version }}-extras=${{ inputs.extras }}-torch=${{ inputs.install-torch }}-preflight=${{ inputs.install-preflight-extras }}-${{ hashFiles('pyproject.toml', 'requirements/lock.txt') }}
        restore-keys: |
          ${{ runner.os }}-venv-py${{ inputs.python-version }}-extras=${{ inputs.extras }}-torch=${{ inputs.install-torch }}-preflight=${{ inputs.install-preflight-extras }}-
          ${{ runner.os }}-venv-py${{ inputs.python-version }}-extras=${{ inputs.extras }}-torch=${{ inputs.install-torch }}-
          ${{ runner.os }}-venv-py${{ inputs.python-version }}-extras=${{ inputs.extras }}-

    # ─────────────────────────────────────────────────────────────────
    # 5. Build / refresh venv
    #
    #    5a. Full build (cache miss) — create venv from scratch.
    #    5b. Refresh (restore-key hit) — venv exists but pyproject.toml
    #        changed; run pip install --upgrade to sync to new versions.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Venv: full build (cache miss)'
      if: steps.cache-venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "::group::Create venv and install base packages"
        python -m venv .venv_ci
        .venv_ci/bin/pip install --cache-dir ~/.cache/pip -U pip setuptools wheel
        # Pinned pytest plugin set — keeps CI reproducible
        .venv_ci/bin/pip install --cache-dir ~/.cache/pip \
          pytest==8.4.2 \
          pytest-timeout==2.4.0 \
          pytest-xdist==3.8.0 \
          pytest-cov==5.0.0 \
          pytest-asyncio==1.3.0 \
          pytest-mock==3.15.1 \
          pytest-randomly>=3.15 \
          pytest-rerunfailures>=12.0
        # Project extras (always includes core deps)
        .venv_ci/bin/pip install --cache-dir ~/.cache/pip -e ".[${{ inputs.extras }}]"
        echo "::endgroup::"

    - name: 'Venv: refresh on restore-key hit (pyproject changed)'
      if: steps.cache-venv.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "::group::Refresh venv after restore-key hit"
        .venv_ci/bin/pip install --cache-dir ~/.cache/pip -U pip setuptools wheel --quiet
        .venv_ci/bin/pip install --cache-dir ~/.cache/pip -e ".[${{ inputs.extras }}]" --quiet
        echo "::endgroup::"

    # ─────────────────────────────────────────────────────────────────
    # 6. PyTorch CPU install
    #    Uses a dedicated wheel download dir (--find-links) that feeds
    #    into Layer 2 cache so subsequent runs don't re-download from
    #    download.pytorch.org.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Install PyTorch CPU (from L2 cache or download)'
      if: inputs.install-torch == 'true'
      shell: bash
      run: |
        echo "::group::PyTorch CPU install"
        mkdir -p ~/.cache/torch-whl
        # --find-links: serve wheels from local cache before hitting PyPI
        # --extra-index-url: fall back to PyTorch CPU index for cache misses
        .venv_ci/bin/pip install \
          --cache-dir ~/.cache/pip \
          --find-links ~/.cache/torch-whl \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          torch torchvision torchaudio
        # Re-export any newly downloaded wheels to the L2 cache so the
        # next run can serve them locally without hitting the network.
        .venv_ci/bin/pip download \
          --cache-dir ~/.cache/pip \
          --dest ~/.cache/torch-whl \
          --find-links ~/.cache/torch-whl \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          --quiet \
          torch torchvision torchaudio 2>/dev/null || true
        echo "::endgroup::"

    # ─────────────────────────────────────────────────────────────────
    # 7. Preflight extras — all packages needed by the full test matrix
    #    Installed AFTER torch so the CPU wheels take precedence.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Install preflight extras (full test-matrix deps)'
      if: inputs.install-preflight-extras == 'true'
      shell: bash
      run: |
        echo "::group::Preflight extras install"
        CACHE="--cache-dir ~/.cache/pip"
        # ML stack (torch already pinned to CPU above; exclude it here)
        .venv_ci/bin/pip install $CACHE \
          "transformers>=4.48.0,<6" \
          "datasets>=2.19,<5" \
          "peft>=0.11,<1" \
          "accelerate>=0.31,<2" \
          "sentencepiece>=0.1.99" \
          --quiet

        # Analysis / AST extras
        .venv_ci/bin/pip install $CACHE \
          "libcst>=1.0" \
          "sqlparse>=0.5.0" \
          "tree-sitter>=0.20.0" \
          --quiet

        # Perf / numeric extras
        .venv_ci/bin/pip install $CACHE \
          "numpy>=1.24" \
          "mlflow>=2.22.4,<4" \
          "scipy>=1.11" \
          --quiet

        # Config / infra extras
        .venv_ci/bin/pip install $CACHE \
          "hydra-core>=1.3" \
          "omegaconf>=2.3" \
          "PyYAML>=6.0" \
          "psutil>=5.9" \
          "pydantic-settings>=2.2" \
          --quiet

        echo "::endgroup::"

    # ─────────────────────────────────────────────────────────────────
    # 8. Preflight env validation — runs after all installs, reports
    #    package inventory and flags unexpected missing packages.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Preflight env validation'
      if: inputs.install-preflight-extras == 'true'
      shell: bash
      run: |
        echo "::group::Preflight env report"
        .venv_ci/bin/python scripts/ci/rvs_env_preflight.py --report || true
        echo "::endgroup::"

    # ─────────────────────────────────────────────────────────────────
    # 9. npm tools (Layer 4 cache)
    # ─────────────────────────────────────────────────────────────────
    - name: 'Cache L4: npm tools (~/.npm)'
      if: inputs.install-npm-tools == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-mlc-v1

    - name: Install npm tools
      if: inputs.install-npm-tools == 'true'
      shell: bash
      run: npm install -g markdown-link-check

    # ─────────────────────────────────────────────────────────────────
    # 10. Expose venv on PATH and emit outputs
    # ─────────────────────────────────────────────────────────────────
    - name: Add venv to PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.venv_ci/bin" >> "$GITHUB_PATH"

    - name: Set venv-python output
      id: venv-path
      shell: bash
      run: |
        echo "venv-python=$GITHUB_WORKSPACE/.venv_ci/bin/python" >> "$GITHUB_OUTPUT"
        echo "VENV_PYTHON=$GITHUB_WORKSPACE/.venv_ci/bin/python" >> "$GITHUB_ENV"

    - name: Report cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-venv.outputs.cache-hit }}" == "true" ]; then
          echo "✅ Venv cache EXACT HIT — skipped rebuild"
        else
          echo "⚠️  Venv cache MISS (or restore-key partial) — venv built/refreshed"
        fi
        echo "  extras              : ${{ inputs.extras }}"
        echo "  install-torch       : ${{ inputs.install-torch }}"
        echo "  install-preflight   : ${{ inputs.install-preflight-extras }}"

