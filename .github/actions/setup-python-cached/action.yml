name: 'Setup Python with Tiered Shared Cache'
description: 'Set up Python with optimized tiered pip cache (live/common/ephemeral) across all workflows'
author: 'Aries-Serpent'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  cache-tier:
    description: 'Cache tier: "live" (common workflows, never deleted), "common" (lesser common, 7-day retention), "ephemeral" (frequently deleted, 1-day retention)'
    required: false
    default: 'common'
  architecture:
    description: 'Python architecture (x64, x86, arm64)'
    required: false
    default: 'x64'

outputs:
  python-version:
    description: 'The installed Python version'
    value: ${{ steps.setup-python.outputs.python-version }}
  cache-hit:
    description: 'Whether cache was hit'
    value: ${{ steps.cache-pip.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        architecture: ${{ inputs.architecture }}
        # Don't use built-in cache - we'll use our own shared cache

    - name: Get pip cache directory
      id: pip-cache-dir
      shell: bash
      run: |
        echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

    - name: Create tiered cache key
      id: cache-key
      shell: bash
      run: |
        # Create a stable hash of all dependency files
        DEPS_HASH=$(cat requirements*.txt pyproject.toml 2>/dev/null | sha256sum | cut -d' ' -f1 | head -c 12)
        
        # Python version without patch (e.g., 3.11)
        PY_VERSION="${{ inputs.python-version }}"
        PY_MAJOR_MINOR=$(echo "$PY_VERSION" | cut -d. -f1,2)
        
        # Determine cache tier and prefix
        TIER="${{ inputs.cache-tier }}"
        case "$TIER" in
          live)
            PREFIX="live-pip"
            echo "🟢 Using LIVE cache tier (permanent, high priority)"
            ;;
          common)
            PREFIX="common-pip"
            echo "🟡 Using COMMON cache tier (7-day retention)"
            ;;
          ephemeral)
            PREFIX="ephemeral-pip"
            echo "🔴 Using EPHEMERAL cache tier (1-day retention)"
            ;;
          *)
            PREFIX="common-pip"
            echo "⚠️  Unknown tier '$TIER', defaulting to COMMON"
            ;;
        esac
        
        # Build tiered cache keys
        CACHE_KEY="${PREFIX}-${{ runner.os }}-py${PY_MAJOR_MINOR}-${DEPS_HASH}"
        
        # Restore keys cascade through tiers: try same tier first, then fallback to live
        RESTORE_KEY_1="${PREFIX}-${{ runner.os }}-py${PY_MAJOR_MINOR}-"
        RESTORE_KEY_2="live-pip-${{ runner.os }}-py${PY_MAJOR_MINOR}-"
        RESTORE_KEY_3="common-pip-${{ runner.os }}-py${PY_MAJOR_MINOR}-"
        
        echo "primary=${CACHE_KEY}" >> $GITHUB_OUTPUT
        echo "restore-1=${RESTORE_KEY_1}" >> $GITHUB_OUTPUT
        echo "restore-2=${RESTORE_KEY_2}" >> $GITHUB_OUTPUT
        echo "restore-3=${RESTORE_KEY_3}" >> $GITHUB_OUTPUT
        echo "tier=${TIER}" >> $GITHUB_OUTPUT
        
        echo "📦 Cache key: ${CACHE_KEY}"

    - name: Tiered pip cache
      id: cache-pip
      uses: actions/cache@v4
      with:
        path: ${{ steps.pip-cache-dir.outputs.dir }}
        key: ${{ steps.cache-key.outputs.primary }}
        restore-keys: |
          ${{ steps.cache-key.outputs.restore-1 }}
          ${{ steps.cache-key.outputs.restore-2 }}
          ${{ steps.cache-key.outputs.restore-3 }}
        # Enable cache sharing across workflows
        enableCrossOsArchive: false
        lookup-only: false

    - name: Upgrade pip
      shell: bash
      run: |
        python -m pip install --upgrade pip wheel setuptools
        pip --version

    - name: Cache statistics
      shell: bash
      run: |
        TIER="${{ steps.cache-key.outputs.tier }}"
        if [ "${{ steps.cache-pip.outputs.cache-hit }}" == "true" ]; then
          echo "✅ Cache HIT - Using cached pip packages from $TIER tier"
        else
          echo "⚠️  Cache MISS - Will download and cache pip packages to $TIER tier"
        fi
        echo "Cache directory: ${{ steps.pip-cache-dir.outputs.dir }}"
        echo "Cache tier: $TIER"
