name: 'Setup Python with Shared Cache'
description: >
  Set up Python, cache the pip download cache and the .venv_ci installed
  virtualenv.  A venv cache hit skips reinstall entirely; a miss builds the
  venv from scratch and saves it for the next run.
author: 'Aries-Serpent'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  extras:
    description: 'Package extras to install (e.g. "dev")'
    required: false
    default: 'dev'
  install-torch:
    description: 'Install PyTorch CPU build (true/false)'
    required: false
    default: 'false'
  install-npm-tools:
    description: 'Install npm tools such as markdown-link-check (true/false)'
    required: false
    default: 'false'

outputs:
  venv-python:
    description: 'Absolute path to the venv Python binary'
    value: ${{ steps.venv-path.outputs.venv-python }}
  cache-hit:
    description: 'Whether the venv cache was hit (true/false)'
    value: ${{ steps.cache-venv.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    # ------------------------------------------------------------------
    # 1. Set up the Python interpreter (no built-in cache – we own it)
    # ------------------------------------------------------------------
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # ------------------------------------------------------------------
    # 2. Cache pip download cache (~/.cache/pip) – shared across all
    #    workflows so wheels are never downloaded twice.
    # ------------------------------------------------------------------
    - name: Cache pip downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-py${{ inputs.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/lock.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-py${{ inputs.python-version }}-

    # ------------------------------------------------------------------
    # 3. Cache the installed virtualenv (.venv_ci) – if this hits we can
    #    skip the entire pip install step.
    # ------------------------------------------------------------------
    - name: Cache venv (.venv_ci)
      id: cache-venv
      uses: actions/cache@v4
      with:
        path: .venv_ci
        key: ${{ runner.os }}-venv-py${{ inputs.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/lock.txt') }}
        restore-keys: |
          ${{ runner.os }}-venv-py${{ inputs.python-version }}-

    # ------------------------------------------------------------------
    # 4. Build venv on cache miss
    # ------------------------------------------------------------------
    - name: Install dependencies (venv cache miss)
      if: steps.cache-venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv .venv_ci
        .venv_ci/bin/pip install --cache-dir ~/.cache/pip -U pip setuptools wheel
        .venv_ci/bin/pip install --cache-dir ~/.cache/pip \
          pytest==8.4.2 \
          pytest-timeout==2.4.0 \
          pytest-xdist==3.8.0 \
          pytest-cov==5.0.0 \
          pytest-asyncio==1.3.0 \
          pytest-mock==3.15.1
        .venv_ci/bin/pip install --cache-dir ~/.cache/pip -e ".[${{ inputs.extras }}]"

    - name: Install PyTorch CPU (venv cache miss)
      if: steps.cache-venv.outputs.cache-hit != 'true' && inputs.install-torch == 'true'
      shell: bash
      run: |
        .venv_ci/bin/pip install --cache-dir ~/.cache/pip \
          torch torchvision torchaudio \
          --index-url https://download.pytorch.org/whl/cpu

    # ------------------------------------------------------------------
    # 5. npm tools (cached via ~/.npm)
    # ------------------------------------------------------------------
    - name: Cache npm
      if: inputs.install-npm-tools == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-markdown-link-check

    - name: Install npm tools
      if: inputs.install-npm-tools == 'true'
      shell: bash
      run: npm install -g markdown-link-check

    # ------------------------------------------------------------------
    # 6. Expose venv on PATH and emit outputs
    # ------------------------------------------------------------------
    - name: Add venv to PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.venv_ci/bin" >> "$GITHUB_PATH"

    - name: Set venv-python output
      id: venv-path
      shell: bash
      run: |
        echo "venv-python=$GITHUB_WORKSPACE/.venv_ci/bin/python" >> "$GITHUB_OUTPUT"
        echo "VENV_PYTHON=$GITHUB_WORKSPACE/.venv_ci/bin/python" >> "$GITHUB_ENV"

    - name: Report cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-venv.outputs.cache-hit }}" == "true" ]; then
          echo "✅ Venv cache HIT — skipped install"
        else
          echo "⚠️  Venv cache MISS — installed from scratch"
        fi
