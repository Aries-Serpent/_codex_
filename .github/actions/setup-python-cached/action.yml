name: 'Setup Python with Shared Cache'
description: >
  Set up Python with a 4-layer cache hierarchy so large packages (PyTorch,
  Transformers, datasets) are never re-downloaded on repeated CI runs.

  Layer 1 — pip download cache  (~/.cache/pip)         shared across ALL workflows
  Layer 2 — PyTorch CPU wheels  (~/.cache/torch-whl)   keyed on torch slot (2.x)
  Layer 3 — installed venv      (.venv_ci)              keyed on extras+flags+pyproject hash
  Layer 4 — npm tool cache      (~/.npm)                keyed on tool names

  Any cache miss falls back to the nearest matching restore-key so the
  freshly-downloaded wheels are at least served from the pip download cache
  and not fetched from PyPI again.
author: 'Aries-Serpent'

inputs:
  python-version:
    description: 'Python version to use. Keep this aligned with .python-version.'
    required: false
    default: '3.12.10'
  extras:
    description: 'Package extras to install from pyproject.toml (e.g. "dev")'
    required: false
    default: 'dev'
  install-torch:
    description: >
      Install PyTorch CPU build (true/false).  Wheels are cached separately
      under ~/.cache/torch-whl so re-installs after a venv cache miss are fast.
    required: false
    default: 'false'
  install-preflight-extras:
    description: >
      Pre-install all optional extras required by the full test matrix:
        libcst (analysis), sqlparse/tree-sitter (ast), numpy/scipy (perf),
        transformers/datasets/peft/accelerate (ml), hydra/omegaconf (configs).
      Torch is excluded here — handled by install-torch to avoid the
      CPU/GPU version conflict.  MLflow remains intentionally optional and is
      not forced into this preflight step because it can deadlock the resolver
      with the project's pinned scientific stack.  Set to "true" for the
      Resilient Validation Suite and any workflow that exercises the complete
      test suite.
    required: false
    default: 'false'
  install-npm-tools:
    description: 'Install npm tools such as markdown-link-check (true/false)'
    required: false
    default: 'false'
  enable-l5-brain-cache:
    description: >
      Layer 5 — Cognitive Brain SQLite cache.  When 'true', restores the
      cognitive brain SQLite DB (.codex/cognitive_brain/) from the L5 cache
      before the run and saves it afterwards.  This gives agents fast access
      to accumulated session patterns without a cold-start rebuild.
      Only effective when the DB path exists in the repo.
    required: false
    default: 'false'
  cache-tier:
    description: >
      Cache tier: live | common | ephemeral.
      Prefix is embedded in the L1/L3 cache keys so each tier maintains
      its own cache namespace.  Fallback restore-keys always include the
      'live' prefix so ephemeral/common workflows can still seed from
      the most-used cache.  Defaults to 'live' when unset.
    required: false
    default: 'live'
  cache-version:
    description: >
      Cache-bust version token — mirrors the CODEX_CACHE_VERSION repo variable (default v2).
      Increment to invalidate the entire shared cache hierarchy without deleting
      individual entries.  Pass in as: cache-version: vars.CODEX_CACHE_VERSION (fallback v2).
    required: false
    default: 'v2'

outputs:
  venv-python:
    description: 'Absolute path to the venv Python binary'
    value: ${{ steps.venv-path.outputs.venv-python }}
  cache-hit:
    description: 'Whether the venv cache was hit exactly (true/false)'
    value: ${{ steps.cache-venv.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    # ─────────────────────────────────────────────────────────────────
    # 1. Python interpreter
    # ─────────────────────────────────────────────────────────────────
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    # ─────────────────────────────────────────────────────────────────
    # 2. LAYER 1 — pip download cache (~/.cache/pip)
    #    Shared by every workflow on this OS+Python combination.
    #    A restore-key without the hash means any prior run can seed it.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Cache L1: pip downloads (~/.cache/pip)'
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-${{ inputs.cache-tier || 'live' }}-pip-${{ inputs.cache-version || 'v2' }}-py${{ inputs.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/lock.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-tier || 'live' }}-pip-${{ inputs.cache-version || 'v2' }}-py${{ inputs.python-version }}-
          ${{ runner.os }}-live-pip-${{ inputs.cache-version || 'v2' }}-py${{ inputs.python-version }}-

    # ─────────────────────────────────────────────────────────────────
    # 3. LAYER 2 — PyTorch CPU wheel cache (~/.cache/torch-whl)
    #    Keyed on the torch major-minor slot (2.x) only so it survives
    #    pyproject.toml edits that don't touch the torch version range.
    #    Only populated/restored when install-torch == true.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Cache L2: PyTorch CPU wheels (~/.cache/torch-whl)'
      if: inputs.install-torch == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.cache/torch-whl
        key: ${{ runner.os }}-torch-cpu-py${{ inputs.python-version }}-slot2x
        restore-keys: |
          ${{ runner.os }}-torch-cpu-py${{ inputs.python-version }}-

    # ─────────────────────────────────────────────────────────────────
    # 4. LAYER 3 — installed venv (.venv_ci)
    #    Cache key encodes everything that affects the installed set:
    #      • extras string       (dev / dev,ml / ...)
    #      • torch flag          (changes what's in the venv)
    #      • preflight flag      (adds ml/analysis/ast/perf layers)
    #      • pyproject.toml hash (dep version bumps)
    #    Restore-keys give progressively looser matches so a cache
    #    that differs only by pyproject hash still seeds the venv and
    #    only a `pip install --upgrade` is needed, not a full rebuild.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Cache L3: installed venv (.venv_ci)'
      id: cache-venv
      uses: actions/cache@v5
      with:
        path: .venv_ci
        key: ${{ runner.os }}-${{ inputs.cache-tier || 'live' }}-venv-${{ inputs.cache-version || 'v2' }}-py${{ inputs.python-version }}-extras=${{ inputs.extras }}-torch=${{ inputs.install-torch }}-preflight=${{ inputs.install-preflight-extras }}-${{ hashFiles('pyproject.toml', 'requirements/lock.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-tier || 'live' }}-venv-${{ inputs.cache-version || 'v2' }}-py${{ inputs.python-version }}-extras=${{ inputs.extras }}-torch=${{ inputs.install-torch }}-preflight=${{ inputs.install-preflight-extras }}-
          ${{ runner.os }}-${{ inputs.cache-tier || 'live' }}-venv-${{ inputs.cache-version || 'v2' }}-py${{ inputs.python-version }}-extras=${{ inputs.extras }}-torch=${{ inputs.install-torch }}-
          ${{ runner.os }}-${{ inputs.cache-tier || 'live' }}-venv-${{ inputs.cache-version || 'v2' }}-py${{ inputs.python-version }}-extras=${{ inputs.extras }}-
          ${{ runner.os }}-live-venv-${{ inputs.cache-version || 'v2' }}-py${{ inputs.python-version }}-extras=${{ inputs.extras }}-

    # ─────────────────────────────────────────────────────────────────
    # 5. Build / refresh venv
    #
    #    5a. Full build (cache miss or restore-key hit) — create venv from
    #         scratch. Also clears any stale venv left by a restore-key
    #         partial cache hit that has a broken Python binary (e.g. venv
    #         was cached on Python 3.12.12 but runner now has 3.12.13 —
    #         the cache key only pins the minor version, not the patch).
    #    5b. Refresh (exact cache hit) — venv exists; run pip install
    #         --upgrade to sync pyproject changes. Includes a self-healing
    #         fallback: if the Python binary in the restored venv is broken
    #         (cross-patch-version cache artifact), rebuild from scratch.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Venv: full build (cache miss or restore-key hit)'
      if: steps.cache-venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "::group::Create venv and install base packages"
        # Remove any stale venv from a restore-key partial hit to prevent
        # broken Python binary symlinks across Python patch upgrades.
        # Use chmod to handle read-only files left by pip inside the
        # restored cache (fixes silent rm -rf failures — see #3565/#3569).
        if [ -d .venv_ci ]; then
          chmod -R u+w .venv_ci 2>/dev/null || true
          rm -rf .venv_ci
        fi
        python -m venv .venv_ci
        # Verify the venv was created successfully before proceeding.
        # If python -m venv silently fails (e.g. disk full, permission
        # denied), catch it here instead of a cryptic pip error later.
        if [ ! -x .venv_ci/bin/python ]; then
          echo "::error::Venv creation failed — .venv_ci/bin/python does not exist or is not executable"
          exit 1
        fi
        PYTHON_BIN=".venv_ci/bin/python"
        "$PYTHON_BIN" -m pip install --cache-dir ~/.cache/pip -U pip "setuptools>=78.1.1,<82" wheel
        # Pinned pytest plugin set — keeps CI reproducible
        "$PYTHON_BIN" -m pip install --cache-dir ~/.cache/pip \
          pytest==8.4.2 \
          pytest-timeout==2.4.0 \
          pytest-xdist==3.8.0 \
          pytest-cov==5.0.0 \
          pytest-asyncio==1.3.0 \
          pytest-mock==3.15.1 \
          pytest-randomly>=3.15 \
          pytest-rerunfailures>=12.0
        # Project extras (always includes core deps)
        "$PYTHON_BIN" -m pip install --cache-dir ~/.cache/pip -e ".[${{ inputs.extras }}]"
        echo "::endgroup::"

    - name: 'Venv: refresh on exact cache hit (pyproject changed)'
      if: steps.cache-venv.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "::group::Refresh venv after exact cache hit"
        # Self-healing: rebuild the venv if either:
        #   (a) the Python binary is broken (cross-patch cache artifact), OR
        #   (b) the Python major.minor version does not match the requested version
        #       (e.g. venv was cached on Python 3.11, runner now provides 3.12).
        REQUESTED_MINOR=$(echo "${{ inputs.python-version }}" | cut -d. -f1,2)
        PYTHON_BIN=".venv_ci/bin/python"
        ACTUAL_MINOR=$("$PYTHON_BIN" -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" 2>/dev/null || echo "unknown")
        if ! "$PYTHON_BIN" --version &>/dev/null || [ "${ACTUAL_MINOR}" != "${REQUESTED_MINOR}" ]; then
          echo "::warning::Stale venv — Python version mismatch (venv=${ACTUAL_MINOR}, requested=${REQUESTED_MINOR}). Rebuilding."
          chmod -R u+w .venv_ci 2>/dev/null || true
          rm -rf .venv_ci
          python -m venv .venv_ci
          PYTHON_BIN=".venv_ci/bin/python"
          "$PYTHON_BIN" -m pip install --cache-dir ~/.cache/pip -U pip "setuptools>=78.1.1,<82" wheel
          "$PYTHON_BIN" -m pip install --cache-dir ~/.cache/pip \
            pytest==8.4.2 \
            pytest-timeout==2.4.0 \
            pytest-xdist==3.8.0 \
            pytest-cov==5.0.0 \
            pytest-asyncio==1.3.0 \
            pytest-mock==3.15.1 \
            "pytest-randomly>=3.15" \
            "pytest-rerunfailures>=12.0"
          "$PYTHON_BIN" -m pip install --cache-dir ~/.cache/pip -e ".[${{ inputs.extras }}]"
        fi
        "$PYTHON_BIN" -m pip install --cache-dir ~/.cache/pip -U pip "setuptools>=78.1.1,<82" wheel --quiet
        "$PYTHON_BIN" -m pip install --cache-dir ~/.cache/pip -e ".[${{ inputs.extras }}]" --quiet
        echo "::endgroup::"

    # ─────────────────────────────────────────────────────────────────
    # 6. PyTorch CPU install
    #    Uses a dedicated wheel download dir (--find-links) that feeds
    #    into Layer 2 cache so subsequent runs don't re-download from
    #    download.pytorch.org.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Install PyTorch CPU (from L2 cache or download)'
      if: inputs.install-torch == 'true'
      shell: bash
      run: |
        echo "::group::PyTorch CPU install"
        PYTHON_BIN=".venv_ci/bin/python"
        mkdir -p ~/.cache/torch-whl
        # --find-links: serve wheels from local cache before hitting PyPI
        # --extra-index-url: fall back to PyTorch CPU index for cache misses
        "$PYTHON_BIN" -m pip install \
          --cache-dir ~/.cache/pip \
          --find-links ~/.cache/torch-whl \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          torch torchvision torchaudio
        # Re-export any newly downloaded wheels to the L2 cache so the
        # next run can serve them locally without hitting the network.
        "$PYTHON_BIN" -m pip download \
          --cache-dir ~/.cache/pip \
          --dest ~/.cache/torch-whl \
          --find-links ~/.cache/torch-whl \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          --quiet \
          torch torchvision torchaudio 2>/dev/null || true
        echo "::endgroup::"

    # ─────────────────────────────────────────────────────────────────
    # 7. Preflight extras — all packages needed by the full test matrix
    #    Installed AFTER torch so the CPU wheels take precedence.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Install preflight extras (full test-matrix deps)'
      if: inputs.install-preflight-extras == 'true'
      shell: bash
      run: |
        echo "::group::Preflight extras install"
        PYTHON_BIN=".venv_ci/bin/python"
        CACHE="--cache-dir ~/.cache/pip"
        # ML stack (torch already pinned to CPU above; exclude it here)
        "$PYTHON_BIN" -m pip install $CACHE \
          "transformers>=4.48.0,<6" \
          "datasets>=2.19,<5" \
          "peft>=0.11,<1" \
          "accelerate>=0.31,<2" \
          "sentencepiece>=0.1.99" \
          --quiet

        # Analysis / AST extras
        "$PYTHON_BIN" -m pip install $CACHE \
          "libcst>=1.0" \
          "sqlparse>=0.5.0" \
          "tree-sitter>=0.20.0" \
          --quiet

        # Perf / numeric extras
        # MLflow is intentionally left out of the shared preflight step.
        # Keep it optional for jobs that opt into tracking explicitly rather
        # than forcing an incompatible resolver path into every workflow.
        "$PYTHON_BIN" -m pip install $CACHE \
          "numpy>=1.24" \
          "scipy>=1.11" \
          --quiet

        # Config / infra extras
        "$PYTHON_BIN" -m pip install $CACHE \
          "hydra-core>=1.3" \
          "omegaconf>=2.3" \
          "PyYAML>=6.0" \
          "psutil>=5.9" \
          "pydantic-settings>=2.2" \
          --quiet

        echo "::endgroup::"

    # ─────────────────────────────────────────────────────────────────
    # 8. Preflight env validation — runs after all installs, reports
    #    package inventory and flags unexpected missing packages.
    # ─────────────────────────────────────────────────────────────────
    - name: 'Preflight env validation'
      if: inputs.install-preflight-extras == 'true'
      shell: bash
      run: |
        echo "::group::Preflight env report"
        PYTHON_BIN=".venv_ci/bin/python"
        "$PYTHON_BIN" scripts/ci/rvs_env_preflight.py --report || true
        echo "::endgroup::"

    # ─────────────────────────────────────────────────────────────────
    # 9. npm tools (Layer 4 cache)
    # ─────────────────────────────────────────────────────────────────
    - name: 'Cache L4: npm tools (~/.npm)'
      if: inputs.install-npm-tools == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-mlc-v1

    - name: Install npm tools
      if: inputs.install-npm-tools == 'true'
      shell: bash
      run: |
        # Pin to the official npm registry to prevent a repo-level .npmrc in the
        # checked-out code from redirecting to a malicious registry when this action
        # is called in a privileged workflow_run context.
        # CodeQL: untrusted-checkout-exec-pr-code mitigation (alert 13171).
        npm install -g --registry https://registry.npmjs.org markdown-link-check

    # ─────────────────────────────────────────────────────────────────
    # 10. Expose venv on PATH and emit outputs
    # ─────────────────────────────────────────────────────────────────
    - name: Add venv to PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.venv_ci/bin" >> "$GITHUB_PATH"

    - name: Set venv-python output
      id: venv-path
      shell: bash
      run: |
        echo "venv-python=$GITHUB_WORKSPACE/.venv_ci/bin/python" >> "$GITHUB_OUTPUT"
        echo "VENV_PYTHON=$GITHUB_WORKSPACE/.venv_ci/bin/python" >> "$GITHUB_ENV"

    # ─────────────────────────────────────────────────────────────────
    # L5 — Cognitive Brain SQLite cache (optional)
    # Restores accumulated session patterns to avoid cold-start rebuild.
    # ─────────────────────────────────────────────────────────────────
    - name: L5 Cognitive Brain cache — restore
      if: inputs.enable-l5-brain-cache == 'true'
      uses: actions/cache@v5
      with:
        path: .codex/cognitive_brain
        key: ${{ runner.os }}-l5-brain-${{ inputs.cache-version || 'v2' }}-${{ hashFiles('.codex/cognitive_brain/**') }}
        restore-keys: |
          ${{ runner.os }}-l5-brain-${{ inputs.cache-version || 'v2' }}-
          ${{ runner.os }}-l5-brain-

    - name: Report cache status
      shell: bash
      run: |
        if [ "${{ steps.cache-venv.outputs.cache-hit }}" == "true" ]; then
          echo "✅ Venv cache EXACT HIT — skipped rebuild"
        else
          echo "⚠️  Venv cache MISS (or restore-key partial) — venv built/refreshed"
        fi
        echo "  extras              : ${{ inputs.extras }}"
        echo "  install-torch       : ${{ inputs.install-torch }}"
        echo "  install-preflight   : ${{ inputs.install-preflight-extras }}"
