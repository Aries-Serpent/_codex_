name: 'Compressed Cache'
description: 'Cache with zstd compression (3-5x size reduction)'

inputs:
  key:
    description: 'Cache key'
    required: true
  path:
    description: 'Path to cache'
    required: true
  compression-level:
    description: 'zstd compression level (1-22, higher = smaller but slower)'
    required: false
    default: '19'
  restore-only:
    description: 'Only restore, do not save'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether cache was restored'
    value: ${{ steps.cache-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install zstd
      shell: bash
      run: |
        if ! command -v zstd &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y zstd
        fi

    - name: Restore compressed cache
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.path }}.tar.zst
        key: ${{ inputs.key }}-zstd
        restore-keys: |
          ${{ inputs.key }}-

    - name: Decompress cache
      if: steps.cache-restore.outputs.cache-hit == 'true'
      shell: bash
      env:
        CACHE_PATH: ${{ inputs.path }}
      run: |
        echo "📦 Decompressing cache from ${CACHE_PATH}.tar.zst"
        zstd -d "${CACHE_PATH}.tar.zst" -o "${CACHE_PATH}.tar" --force
        mkdir -p "$(dirname "${CACHE_PATH}")"
        tar -xf "${CACHE_PATH}.tar" -C "$(dirname "${CACHE_PATH}")"
        rm -f "${CACHE_PATH}.tar" "${CACHE_PATH}.tar.zst"
        echo "✅ Cache decompressed successfully"

    - name: Compress and save cache
      if: steps.cache-restore.outputs.cache-hit != 'true' && inputs.restore-only != 'true'
      shell: bash
      env:
        CACHE_PATH: ${{ inputs.path }}
        COMPRESSION_LEVEL: ${{ inputs.compression-level }}
      run: |
        # zstd supports levels 1..22; constrain input to prevent option injection
        # through the dynamic -LEVEL flag.
        if ! [[ "${COMPRESSION_LEVEL}" =~ ^([1-9]|1[0-9]|2[0-2])$ ]]; then
          echo "❌ Invalid compression level: ${COMPRESSION_LEVEL}"
          exit 1
        fi

        if [ -e "${CACHE_PATH}" ]; then
          echo "📦 Compressing ${CACHE_PATH} with zstd level ${COMPRESSION_LEVEL}"
          tar -cf "${CACHE_PATH}.tar" -C "$(dirname "${CACHE_PATH}")" "$(basename "${CACHE_PATH}")"
          zstd -"${COMPRESSION_LEVEL}" "${CACHE_PATH}.tar" -o "${CACHE_PATH}.tar.zst" --force
          rm -f "${CACHE_PATH}.tar"
          echo "✅ Compressed size: $(du -h "${CACHE_PATH}.tar.zst" | cut -f1)"
        else
          echo "⚠️ Path ${CACHE_PATH} does not exist, skipping compression"
        fi

    - name: Save compressed cache
      if: steps.cache-restore.outputs.cache-hit != 'true' && inputs.restore-only != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.path }}.tar.zst
        key: ${{ inputs.key }}-zstd
