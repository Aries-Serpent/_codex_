name: Commit to Staging Chain
description: |
  Resolve the deepest staging branch, stage files, commit, rebase onto the
  latest target, and push. If the resolved target does not yet exist on the
  remote, creates it from the current checkout SHA and pushes the new commit
  directly. Falls back to main if no staging layer is active.
inputs:
  message:
    description: 'Commit message first line (must include [skip ci])'
    required: true
  files:
    description: 'Space-separated list of files/paths to commit'
    required: true
outputs:
  target_branch:
    description: 'Branch the commit was pushed to'
    value: ${{ steps.resolve.outputs.branch }}
runs:
  using: composite
  steps:
    - name: \ud83d\udd00 Resolve push target
      id: resolve
      uses: ./.github/actions/resolve-push-target
      with:
        ensure-exists: true
    - name: \ud83d\udce6 Stage, commit, and push
      shell: bash
      env:
        TARGET: ${{ steps.resolve.outputs.branch }}
        MESSAGE: ${{ inputs.message }}
        FILE_LIST: ${{ inputs.files }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # If the target branch exists remotely, base our local branch off it so
        # we can rebase deterministically.  Otherwise, create the target branch
        # from the current checkout SHA; there is no rebase to perform.
        # Detect remote branch presence, distinguishing "ref not found" (exit 2)
        # from unexpected failures like network or auth errors.  Any failure other
        # than exit 2 is treated as a hard error to avoid pushing to the wrong target.
        ls_rc=0
        git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1 || ls_rc=$?
        if [ "$ls_rc" -eq 0 ]; then
          git fetch origin "$TARGET" --depth=5
          git checkout -B "$TARGET" "origin/${TARGET}"
          REMOTE_EXISTS=true
        elif [ "$ls_rc" -eq 2 ]; then
          echo "ℹ️  Remote branch origin/${TARGET} does not exist; creating from current HEAD"
          git checkout -B "$TARGET"
          REMOTE_EXISTS=false
        else
          echo "❌ ls-remote failed with exit code ${ls_rc} — possible network or auth error; aborting to prevent push to wrong target"
          exit "$ls_rc"
        fi

        # Stage the requested files, failing loudly on any error.
        while IFS= read -r -d ' ' f || [ -n "$f" ]; do
          [ -n "$f" ] || continue
          mkdir -p "$(dirname "$f")"
          git add "$f"
        done < <(printf '%s ' "$FILE_LIST")

        git diff --cached --quiet && { echo "No changes to commit"; exit 0; }

        # Capture the tree state before commit so a rebase failure can be replayed
        # deterministically instead of relying on the reflog.
        git commit -m "$MESSAGE"
        STAGING_SHA=$(git rev-parse HEAD)

        # Only attempt a rebase when the target branch already exists remotely.
        if [ "$REMOTE_EXISTS" = "true" ]; then
          git pull --rebase --autostash origin "$TARGET" || {
            echo "⚠️ Rebase failed — resetting to latest origin/$TARGET and re-applying ${STAGING_SHA}"
            git rebase --abort 2>/dev/null || true
            git fetch origin "$TARGET" --depth=5
            git checkout -B "$TARGET" "origin/${TARGET}"
            git cherry-pick "$STAGING_SHA" --no-commit || {
              echo "❌ Could not re-apply changes from ${STAGING_SHA}"
              exit 1
            }
            git commit -m "$MESSAGE (post-rebase retry)"
          }
        fi

        git push origin "HEAD:${TARGET}"
        echo "target_branch=${TARGET}" >> "$GITHUB_OUTPUT"
