name: datetime-modernizer
description: Modernize datetime handling to use timezone-aware objects and deprecate naive datetime usage in Python code
model: "MAI-Code-1.1-Flash"

capabilities:
  - Detect deprecated datetime.utcnow() usage
  - Replace with timezone-aware datetime.now(UTC)
  - Fix datetime.utcfromtimestamp() calls
  - Ensure ISO 8601 compliance
  - Batch file modernization

triggers:
  pr:
    events: [pull_request]
    paths: ["**/*.py"]
  manual:
    command: "/modernize-datetime"

permissions:
  contents: write
  pull-requests: write

metadata:
  version: "1.0.0"
  created: "2026-01-09"
