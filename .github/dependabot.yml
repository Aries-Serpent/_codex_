# Dependabot configuration for automated dependency updates
# Corrected to reduce update_graph unknown_error risk and keep behavior stable.

version: 2
updates:
  # GitHub Actions - Monitor workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5

  # Python - Monitor pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Keep ignore rules that are clearly intentional and low-risk
    ignore:
      - dependency-name: "nbconvert"
        versions:
          - ">=7.0.0"
      - dependency-name: "torch"
        versions:
          - ">=2.3.0"
    # Start with simple grouping; expand later only after green runs
    groups:
      python-core:
        patterns:
          - "pyjwt*"
          - "starlette*"
          - "fastapi*"
          - "pydantic*"
          - "cryptography*"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff*"
          - "black*"
          - "mypy*"
          - "pre-commit*"
    open-pull-requests-limit: 5

  # Docker - Monitor base images (if using Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    open-pull-requests-limit: 3
