# Dependabot configuration for automated dependency updates
# Corrected to reduce update_graph unknown_error risk and keep behavior stable.

version: 2
updates:
  # GitHub Actions - Monitor workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5

  # Python - Monitor pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Keep ignore rules that are clearly intentional and low-risk
    ignore:
      - dependency-name: "nbconvert"
        versions:
          - ">=7.0.0"
      - dependency-name: "torch"
        versions:
          - ">=2.3.0"
    # Start with simple grouping; expand later only after green runs
    groups:
      python-core:
        patterns:
          - "pyjwt*"
          - "starlette*"
          - "fastapi*"
          - "pydantic*"
          - "cryptography*"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff*"
          - "black*"
          - "mypy*"
          - "pre-commit*"
    open-pull-requests-limit: 5

  # Docker - Monitor base images (if using Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    open-pull-requests-limit: 3

  # npm - Monitor root-level JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5

  # npm - Monitor cognitive_app JavaScript/TypeScript dependencies
  # (consolidated here; cognitive_app/.github/dependabot.yml was not
  # discovered by GitHub Dependabot since only the repo-root
  # .github/dependabot.yml is read for a single, non-submodule repo)
  - package-ecosystem: "npm"
    directory: "/cognitive_app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "javascript"
      - "cognitive-app"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5

  # npm - Monitor copilot/extension JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/copilot/extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "javascript"
      - "copilot-extension"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5

  # Cargo - Monitor Rust workspace dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5
