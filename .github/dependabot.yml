version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    ignore:
      - dependency-name: "github/codeql-action/upload-sarif"
        versions:
          - ">= 4.0.0"
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    ignore:
      - dependency-name: "nbconvert"
        versions:
          - ">= 7.0.0"
      - dependency-name: "torch"
        versions:
          - ">= 2.3.0"
    groups:
      python-all:
        patterns:
          - "*"
    # Keep Python dependency bumps manual unless there is a concrete need;
    # this prevents the broad "python-all" update PR from re-opening for the same
    # dependency set when no change is required.
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: "npm"
    directory: "/cognitive_app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    ignore:
      - dependency-name: "vite"
        versions:
          - ">= 8.0.0"
      - dependency-name: "typescript"
        versions:
          - ">= 6.0.0"
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 1
