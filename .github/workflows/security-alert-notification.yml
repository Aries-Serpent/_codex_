name: Security Alert Notification

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: read
  issues: write
  pull-requests: write

jobs:
  advisory-summary:
    name: Advisory summary (non-blocking)
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      action_required: ${{ steps.summary.outputs.action_required }}
      total_open_alerts: ${{ steps.summary.outputs.total_open_alerts }}
      source_of_truth: ${{ steps.summary.outputs.source_of_truth }}
      status: ${{ steps.summary.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch live GitHub security snapshot
        id: fetch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/reconcile_live_security.py \
            --repo "${GITHUB_REPOSITORY}" \
            --artifact ".codex/security-findings-comprehensive.json" \
            --output ".codex/live-security-reconciliation.json" \
            --markdown ".codex/live-security-reconciliation.md" \
            --strict-artifact \
            --require-live-source \
            --fail-on-delta
          echo "fetch_status=ok" >> "$GITHUB_OUTPUT"

      - name: Summarize advisory state
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          total_open_alerts="0"
          status="clean"
          source_of_truth="artifact"
          if [ "${{ steps.fetch.outcome }}" = "failure" ] || [ ! -f ".codex/live-security-reconciliation.json" ]; then
            status="compliance-unknown"
            source_of_truth="artifact"
            echo "action_required=false" >> "$GITHUB_OUTPUT"
            echo "total_open_alerts=$total_open_alerts" >> "$GITHUB_OUTPUT"
            echo "source_of_truth=$source_of_truth" >> "$GITHUB_OUTPUT"
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "## 🔐 Security alert advisory summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- Source of truth: $source_of_truth" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: $status" >> "$GITHUB_STEP_SUMMARY"
            echo "- Compliance is unknown because the live GitHub security fetch did not complete successfully." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -f ".codex/live-security-reconciliation.json" ]; then
            total_open_alerts=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          if not path.exists():
              print('0')
          else:
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  payload = {'total_open_alerts': 0}
              print(payload.get('total_open_alerts', 0))
          PY
            )
            source_of_truth=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          if not path.exists():
              print('artifact')
          else:
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  print('artifact')
                  raise SystemExit
              print(payload.get('source_of_truth', 'artifact'))
          PY
            )
            status=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          if not path.exists():
              print('clean')
          else:
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  print('clean')
                  raise SystemExit
              print(payload.get('status', 'clean'))
          PY
            )
          fi
          if [ "$total_open_alerts" = "0" ] || [ "$status" = "clean" ] || [ "$status" = "artifact-only" ]; then
            echo "action_required=false" >> "$GITHUB_OUTPUT"
            echo "total_open_alerts=$total_open_alerts" >> "$GITHUB_OUTPUT"
            echo "source_of_truth=$source_of_truth" >> "$GITHUB_OUTPUT"
            echo "status=$status" >> "$GITHUB_OUTPUT"
            echo "## 🔐 Security alert advisory summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- Source of truth: $source_of_truth" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: $status" >> "$GITHUB_STEP_SUMMARY"
            echo "- GitHub reports no open alerts right now." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "action_required=true" >> "$GITHUB_OUTPUT"
          echo "total_open_alerts=$total_open_alerts" >> "$GITHUB_OUTPUT"
          echo "source_of_truth=$source_of_truth" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "## 🔐 Security alert advisory summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source of truth: $source_of_truth" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: $status" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub reports $total_open_alerts open alerts." >> "$GITHUB_STEP_SUMMARY"
          if [ -f ".codex/live-security-reconciliation.md" ]; then
            cat ".codex/live-security-reconciliation.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  enforcement:
    name: Security alert enforcement
    needs: advisory-summary
    if: needs.advisory-summary.outputs.action_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce alert threshold
        shell: bash
        run: |
          set -euo pipefail
          total_open_alerts="${{ needs.advisory-summary.outputs.total_open_alerts }}"
          echo "::error::Action required: GitHub reports $total_open_alerts open security alerts."
          exit 1

  live-security-reconciliation:
    name: Live GitHub security reconciliation
    needs: advisory-summary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_of_truth: ${{ steps.publish.outputs.source_of_truth }}
      status: ${{ steps.publish.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish reconciliation report
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/reconcile_live_security.py \
            --repo "${GITHUB_REPOSITORY}" \
            --artifact ".codex/security-findings-comprehensive.json" \
            --output ".codex/live-security-reconciliation.json" \
            --markdown ".codex/live-security-reconciliation.md" \
            --strict-artifact \
            --require-live-source \
            --fail-on-delta
          source_of_truth=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          payload = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'source_of_truth': 'artifact'}
          print(payload.get('source_of_truth', 'artifact'))
          PY
          )
          status=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          payload = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'status': 'clean'}
          print(payload.get('status', 'clean'))
          PY
          )
          echo "source_of_truth=$source_of_truth" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "## Live GitHub security reconciliation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source of truth: $source_of_truth" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: $status" >> "$GITHUB_STEP_SUMMARY"
          cat ".codex/live-security-reconciliation.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-security-reconciliation
          path: |
            .codex/security-findings-comprehensive.json
            .codex/live-security-reconciliation.json
            .codex/live-security-reconciliation.md
          if-no-files-found: error
