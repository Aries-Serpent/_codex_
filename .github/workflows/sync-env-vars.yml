name: Sync Environment Variables

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/cognitive_brain/quantum/ghz_states.py'
      - 'src/cognitive_brain/quantum/multi_agent_coordinator.py'
      - 'src/cognitive_brain/quantum/topology_manager.py'
      - 'src/codex_ml/data/validation.py'
      - '.github/scripts/env_var_converter.py'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      dry_run:
        description: 'Dry run (no actual sync)'
        required: false
        default: true
        type: boolean

jobs:
  sync-env-vars:
    name: Sync Environment Variables
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # For GitHub API access
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git describe
      
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'common'
