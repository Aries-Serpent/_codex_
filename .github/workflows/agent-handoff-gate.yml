name: Agent Handoff Gate

# Tier-1 GROUNDED gate: validates AgentHandoffManifest v1.1 payloads posted in PR comments.
# Trigger: issue_comment containing "AGENT_HANDOFF:" on pull_request context.
#
# Tier: GROUNDED — Tier-1 hard gate (exit 1 on schema violations).
# Promoted from Tier-2 canary after 2-sprint observation period.
#
# Schema: .codex/schemas/AgentHandoffManifest_v1.1.json
# Protocol: docs/plans/Agentic_AI_System/soft_to_GROUNDED.md Domain 3

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: agent-handoff-gate-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate-handoff:
    name: Validate Agent Handoff Manifest
    runs-on: ubuntu-latest
    # Job timeout kept at 5 minutes (GitHub Actions expressions do not support
    # arithmetic, so seconds-to-minutes conversion cannot be done inline).
    # AGENT_HANDOFF_TIMEOUT_SECONDS is passed to the validate step as an env
    # var so the Python validator can respect it for request/wait logic.
    timeout-minutes: 5
    # Only run on PR comments containing AGENT_HANDOFF:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'AGENT_HANDOFF:')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema pyyaml --quiet

      - name: Extract and validate handoff manifest
        id: validate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
          # P2.4: AGENT_HANDOFF_TIMEOUT_SECONDS wired from repo variable.
          # Used by the validator for request timeout logic.  Defaults to 120s.
          AGENT_HANDOFF_TIMEOUT_SECONDS: ${{ vars.AGENT_HANDOFF_TIMEOUT_SECONDS || '120' }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import re
          import sys

          comment = os.environ["COMMENT_BODY"]
          pr_number = os.environ["PR_NUMBER"]

          # Extract JSON block after "AGENT_HANDOFF:"
          match = re.search(r"AGENT_HANDOFF:\s*```(?:json)?\s*(\{.*?\})\s*```", comment, re.DOTALL)
          if not match:
              # Try without code fence
              match = re.search(r"AGENT_HANDOFF:\s*(\{.*?\})", comment, re.DOTALL)

          if not match:
              print("::warning::agent-handoff-gate: No JSON payload found after AGENT_HANDOFF: — skipping validation")
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write("validation_status=skipped\n")
              sys.exit(0)

          raw_json = match.group(1).strip()

          # Guard against oversized payloads before parsing
          if len(raw_json) > 10000:
              print("::warning::agent-handoff-gate: AGENT_HANDOFF payload too large (>10KB) — skipping")
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write("validation_status=skipped\n")
              sys.exit(0)

          try:
              payload = json.loads(raw_json)
          except json.JSONDecodeError as e:
              print(f"::warning::agent-handoff-gate: Invalid JSON in AGENT_HANDOFF payload: {e}")
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write("validation_status=invalid_json\n")
                  f.write(f"error={str(e)}\n")
              sys.exit(0)

          # Validate against AgentHandoffManifest v1.1 schema
          import jsonschema
          schema_path = ".codex/schemas/AgentHandoffManifest_v1.1.json"
          with open(schema_path) as sf:
              schema = json.load(sf)

          errors = []
          try:
              jsonschema.validate(payload, schema)
          except jsonschema.ValidationError as e:
              errors.append(str(e.message))

          delegating = payload.get("delegating_agent", "unknown")
          receiving = payload.get("receiving_agent", "unknown")
          task_id = payload.get("task_id", "unknown")
          operating_model = payload.get("operating_model", "E")
          trace_depth = len(payload.get("delegation_trace", []))
          checklist = payload.get("checklist_items", [])
          tier1_gates = payload.get("policy_compliance", {}).get("tier1_gates_passed", [])
          violations = payload.get("policy_compliance", {}).get("violation_count", 0)
          snapshot_tier = payload.get("context_snapshot", {}).get("current_enforcement_tier", "SOFT")

          output_file = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(output_file, "a") as f:
              f.write(f"delegating_agent={delegating}\n")
              f.write(f"receiving_agent={receiving}\n")
              f.write(f"task_id={task_id}\n")
              f.write(f"operating_model={operating_model}\n")
              f.write(f"trace_depth={trace_depth}\n")
              f.write(f"violation_count={violations}\n")
              f.write(f"enforcement_tier={snapshot_tier}\n")
              f.write(f"tier1_gates_count={len(tier1_gates)}\n")
              if errors:
                  f.write("validation_status=invalid\n")
                  f.write(f"schema_errors={json.dumps(errors)}\n")
                  # TIER-1: exit 1 — blocks merge on schema violations
                  print(f"::error::agent-handoff-gate: Schema validation failed for {delegating}→{receiving}: {errors[0]}")
                  sys.exit(1)
              else:
                  f.write("validation_status=valid\n")
                  print(f"✅ agent-handoff-gate: Valid handoff {delegating}→{receiving} (model={operating_model})")
          PYEOF

      - name: Post handoff summary comment
        if: steps.validate.outputs.validation_status != 'skipped'
        uses: actions/github-script@v7
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.validation_status }}
          DELEGATING_AGENT: ${{ steps.validate.outputs.delegating_agent }}
          RECEIVING_AGENT: ${{ steps.validate.outputs.receiving_agent }}
          TASK_ID: ${{ steps.validate.outputs.task_id }}
          OPERATING_MODEL: ${{ steps.validate.outputs.operating_model }}
          TRACE_DEPTH: ${{ steps.validate.outputs.trace_depth }}
          VIOLATION_COUNT: ${{ steps.validate.outputs.violation_count }}
          ENFORCEMENT_TIER: ${{ steps.validate.outputs.enforcement_tier }}
          TIER1_GATES_COUNT: ${{ steps.validate.outputs.tier1_gates_count }}
          SCHEMA_ERRORS: ${{ steps.validate.outputs.schema_errors }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = process.env.VALIDATION_STATUS;
            const delegating = process.env.DELEGATING_AGENT || 'unknown';
            const receiving = process.env.RECEIVING_AGENT || 'unknown';
            const taskId = process.env.TASK_ID || 'unknown';
            const model = process.env.OPERATING_MODEL || 'E';
            const tier = process.env.ENFORCEMENT_TIER || 'SOFT';
            const traceDepth = process.env.TRACE_DEPTH || '0';
            const violations = process.env.VIOLATION_COUNT || '0';
            const tier1Count = process.env.TIER1_GATES_COUNT || '0';
            const schemaErrors = process.env.SCHEMA_ERRORS || '[]';

            const statusIcon = status === 'valid' ? '✅' : status === 'invalid_json' ? '🔴' : '⚠️';
            const statusLabel = status === 'valid' ? 'VALID' : status === 'invalid_json' ? 'INVALID JSON' : 'SCHEMA VIOLATION';

            let body = `🔀 **AGENT_HANDOFF** \`v1.1\` | ${statusIcon} **${statusLabel}**\n\n`;
            body += `| Field | Value |\n|-------|-------|\n`;
            body += `| **From** | \`${delegating}\` |\n`;
            body += `| **To** | \`${receiving}\` |\n`;
            body += `| **Task** | \`${taskId}\` |\n`;
            body += `| **Model** | \`${model}\` |\n`;
            body += `| **Tier** | \`${tier}\` |\n`;
            body += `| **Delegation depth** | ${traceDepth} hops |\n`;
            body += `| **Tier-1 gates passed** | ${tier1Count} |\n`;
            body += `| **Violations this chain** | ${violations} |\n\n`;

            if (status !== 'valid') {
              let errors = [];
              try { errors = JSON.parse(schemaErrors); } catch {}
              if (errors.length > 0) {
                body += `**Schema errors:**\n`;
                errors.forEach(e => { body += `- ${e}\n`; });
                body += `\n`;
              }
              // TIER-1: hard block on schema violations
              body += `> ❌ **Blocked** — schema violation detected. Fix the handoff manifest before proceeding.\n\n`;
            }

            body += `_[agent-handoff-gate.yml](.github/workflows/agent-handoff-gate.yml) | `;
            body += `[AgentHandoffManifest v1.1](.codex/schemas/AgentHandoffManifest_v1.1.json) | `;
            body += `Tier-1 GROUNDED gate_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
