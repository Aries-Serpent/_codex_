name: Session Recovery Continuous Monitoring
on:
  schedule:
  - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose output
        required: false
        default: 'false'
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  monitor-recovery-status:
    name: Monitor Session Recovery Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Mask secrets
      run: |
        echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Generate recovery monitoring report
      id: monitor
      run: "python scripts/ci/session_recovery_monitor.py > /tmp/monitor_output.txt\
        \ 2>&1\ncat /tmp/monitor_output.txt\n\n# Check if report was created\nif [\
        \ -f .codex/session_recovery_monitoring_report.json ]; then\n  echo \"\u2705\
        \ Monitoring report generated successfully\"\n  REPORT_CONTENT=$(cat .codex/session_recovery_monitoring_report.json)\n\
        \  echo \"report_created=true\" >> $GITHUB_OUTPUT\nelse\n  echo \"\u26A0\uFE0F\
        \ Monitoring report not created\"\n  echo \"report_created=false\" >> $GITHUB_OUTPUT\n\
        fi\n"
    - name: Parse recovery metrics
      id: parse_metrics
      if: steps.monitor.outputs.report_created == 'true'
      run: "python3 << 'PYTHON_EOF'\nimport json\n\nwith open('.codex/session_recovery_monitoring_report.json')\
        \ as f:\n    report = json.load(f)\n\nmetrics = report.get('metrics', {})\n\
        total_checkpoints = metrics.get('total_checkpoints', 0)\ntotal_failures =\
        \ metrics.get('total_failures', 0)\nrecovery_success_rate = metrics.get('recovery_success_rate',\
        \ 0.0)\n\nprint(f\"\u2705 Total Checkpoints: {total_checkpoints}\")\nprint(f\"\
        \U0001F4CA Total Failures: {total_failures}\")\nprint(f\"\U0001F4C8 Recovery\
        \ Success Rate: {recovery_success_rate * 100:.1f}%\")\n\n# Check for issues\n\
        recent_failures = report.get('recent_failures', [])\nif len(recent_failures)\
        \ > 0:\n    print(f\"\\n\u26A0\uFE0F  Recent events: {len(recent_failures)}\"\
        )\n    for failure in recent_failures[-3:]:\n        print(f\"   - {failure.get('type',\
        \ 'unknown')}: {failure.get('timestamp', 'N/A')}\")\n\nPYTHON_EOF\n"
    - name: Check recovery system health
      run: "echo \"\U0001F50D Session Recovery System Health Check\"\necho \"========================================\"\
        \n\nif [ -f .codex/session_recovery_config.yml ]; then\n    echo \"\u2705\
        \ Recovery configuration found\"\n    echo \"   Location: .codex/session_recovery_config.yml\"\
        \nfi\n\nif [ -f .github/workflows/session-recovery-handler.yml ]; then\n \
        \   echo \"\u2705 Recovery workflow found\"\n    echo \"   Location: .github/workflows/session-recovery-handler.yml\"\
        \nfi\n\nif [ -f scripts/ci/session_recovery.py ]; then\n    echo \"\u2705\
        \ Recovery script found\"\n    echo \"   Location: scripts/ci/session_recovery.py\"\
        \nfi\n\nSESSION_DIR=\".codex/sessions\"\nif [ -d \"$SESSION_DIR\" ]; then\n\
        \    CHECKPOINT_COUNT=$(find \"$SESSION_DIR\" -name \"checkpoint_*.json\"\
        \ 2>/dev/null | wc -l)\n    echo \"\u2705 Session checkpoint directory found\"\
        \n    echo \"   Checkpoints stored: $CHECKPOINT_COUNT\"\nfi\n\nif [ -f .codex/session_recovery_log.jsonl\
        \ ]; then\n    LOG_LINES=$(wc -l < .codex/session_recovery_log.jsonl)\n  \
        \  echo \"\u2705 Recovery log found\"\n    echo \"   Log entries: $LOG_LINES\"\
        \nfi\n\necho \"\"\necho \"\U0001F7E2 Recovery System: OPERATIONAL\"\n"
    - name: Upload monitoring report
      if: steps.monitor.outputs.report_created == 'true'
      uses: actions/upload-artifact@v5
      with:
      name: session-recovery-monitoring-${{ github.run_number }}
        path: .codex/session_recovery_monitoring_report.json
        retention-days: 30
    - name: Comment on recent failed sessions
      if: failure()
      uses: actions/github-script@v8
      with:
        script: "const fs = require('fs');\nconst report = JSON.parse(fs.readFileSync('.codex/session_recovery_monitoring_report.json',\
          \ 'utf8'));\n\nif (report.recent_failures.length > 0) {\n  github.rest.issues.createComment({\n\
        \    issue_number: process.env.GITHUB_PR_NUMBER,\n    owner: context.repo.owner,\n\
        \    repo: context.repo.repo,\n    body: `## \U0001F504 Session Recovery\
        \ Monitoring Report\\n\\n` +\n          `Generated: ${report.timestamp}\\\
        n` +\n          `Recovery System Status: ${report.recovery_system_status}\\\
          n\\n` +\n          `### Recent Events\\n` +\n          report.recent_failures.map(f\
        \ =>\n            `- **${f.type}**: ${f.timestamp} (Session: ${f.session_id})`\n\
          \          ).join('\\n')\n  });\n}\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  report-recovery-metrics:
    name: Report Recovery Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: monitor-recovery-status
    if: always()
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Generate recovery trend report
      run: "echo \"## Session Recovery Trend Report\"\necho \"\"\necho \"**Report\
        \ Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)\"\necho \"**Run ID:** ${{ github.run_id\
        \ }}\"\necho \"\"\necho \"### System Status\"\necho \"- Recovery Workflow:\
        \ \u2705 Deployed\"\necho \"- Recovery Script: \u2705 Operational\"\necho\
        \ \"- Monitoring: \u2705 Active\"\necho \"- Auto-Recovery: \u2705 Enabled\"\
        \necho \"\"\necho \"### Configuration\"\necho \"- Auto-recovery attempts:\
        \ 2 (before escalation)\"\necho \"- Checkpoint interval: 15 minutes\"\necho\
        \ \"- Heartbeat interval: 1 minute\"\necho \"- Escalation contact: @mbaetiong\"\
        \necho \"\"\necho \"### Recommendations\"\necho \"1. Review recovery metrics\
        \ weekly\"\necho \"2. Update configuration if needed\"\necho \"3. Escalate\
        \ repeated failures to @mbaetiong\"\necho \"4. Archive old recovery logs (>30\
        \ days)\"\n"

