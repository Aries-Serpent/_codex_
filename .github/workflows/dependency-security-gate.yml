name: Dependency Security Gate

on:
  push:
    branches:
      - main
      - develop
      - release/**
      - feature/**
      - copilot/**
    paths:
      - pyproject.toml
      - requirements*.txt
      - package.json
      - package-lock.json
      - Cargo.toml
      - Cargo.lock
      - cognitive_app/package.json
      - copilot/extension/package.json
  pull_request:
    branches:
      - main
      - develop
    paths:
      - pyproject.toml
      - requirements*.txt
      - package.json
      - package-lock.json
      - Cargo.toml
      - Cargo.lock
      - cognitive_app/package.json
      - copilot/extension/package.json
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  security-events: read

jobs:
  dependency-security-gate:
    name: Dependency Security Gate Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        ecosystem:
          - python
          - npm
          - rust
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        if: matrix.ecosystem == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: matrix.ecosystem == 'npm'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        if: matrix.ecosystem == 'rust'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Scan Python dependencies with pip-audit
        if: matrix.ecosystem == 'python'
        id: python-audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex/security
          python -m pip install --upgrade pip pip-audit
          audit_file=".codex/security/pip-audit.json"
          summary_file=".codex/security/pip-audit-summary.json"
          tool_status='passed'
          set +e
          pip-audit --format json --desc > "$audit_file" 2> .codex/security/pip-audit.err
          audit_exit=$?
          set -e
          if [ "$audit_exit" -ne 0 ] && [ ! -s "$audit_file" ]; then
            tool_status='tool_failed'
          fi
          python - "$audit_file" "$summary_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          audit_file = Path(sys.argv[1])
          summary_file = Path(sys.argv[2])
          payload = []
          try:
              with audit_file.open('r', encoding='utf-8') as handle:
                  payload = json.load(handle)
          except (FileNotFoundError, json.JSONDecodeError):
              payload = []

          counts = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0, 'INFO': 0}
          for dependency in payload:
              for vuln in dependency.get('vulns', []):
                  severity = str(vuln.get('severity', 'info')).upper()
                  if severity == 'MODERATE':
                      severity = 'MEDIUM'
                  counts.setdefault(severity, 0)
                  counts[severity] += 1

          summary = {
              'ecosystem': 'python',
              'status': 'failed' if any(counts[k] for k in ('CRITICAL', 'HIGH')) else 'passed',
              'counts': counts,
              'total_vulnerabilities': sum(counts.values()),
              'tool_status': 'tool_failed' if not payload and not audit_file.exists() else 'vuln_found' if any(counts[k] for k in ('CRITICAL', 'HIGH', 'MEDIUM', 'LOW')) else 'clean',
          }
          summary_file.write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
          critical=$(python - "$summary_file" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(summary.get('counts', {}).get('CRITICAL', 0))
          PY
          )
          high=$(python - "$summary_file" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(summary.get('counts', {}).get('HIGH', 0))
          PY
          )
          medium=$(python - "$summary_file" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(summary.get('counts', {}).get('MEDIUM', 0))
          PY
          )
          echo "status=$tool_status" >> "$GITHUB_OUTPUT"
          echo "critical_count=$critical" >> "$GITHUB_OUTPUT"
          echo "high_count=$high" >> "$GITHUB_OUTPUT"
          echo "medium_count=$medium" >> "$GITHUB_OUTPUT"
          echo "summary_path=$summary_file" >> "$GITHUB_OUTPUT"
          echo "## Python dependency audit" >> "$GITHUB_STEP_SUMMARY"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
            echo "::error::Python audit found $critical critical and $high high vulnerabilities."
            exit 1
          fi

      - name: Scan npm dependencies
        if: matrix.ecosystem == 'npm'
        id: npm-audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex/security
          files=(
            'root:. ./. '
            'cognitive_app:cd cognitive_app'
            'extension:cd copilot/extension'
          )
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          summary = {'ecosystem': 'npm', 'status': 'passed', 'tool_status': 'clean', 'counts': {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0, 'INFO': 0}, 'projects': {}}
          project_matrix = [
              ('root', '.'),
              ('cognitive_app', 'cognitive_app'),
              ('extension', 'copilot/extension'),
          ]
          for name, directory in project_matrix:
              target = Path(directory)
              if not target.exists():
                  continue
              out_file = Path('.codex/security') / f'npm-{name}-audit.json'
              try:
                  result = subprocess.run(['npm', 'audit', '--json'], cwd=directory, capture_output=True, text=True, check=False)
                  if result.stdout.strip():
                      out_file.write_text(result.stdout, encoding='utf-8')
                  else:
                      out_file.write_text('{"metadata":{"vulnerabilities":{"critical":0,"high":0,"moderate":0,"low":0}},"vulnerabilities":{}}', encoding='utf-8')
                  if result.returncode not in (0, 1):
                      summary['tool_status'] = 'tool_failed'
                  data = json.loads(out_file.read_text(encoding='utf-8')) if out_file.exists() else {'metadata': {'vulnerabilities': {'critical': 0, 'high': 0, 'moderate': 0, 'low': 0}}}
              except Exception:
                  data = {'metadata': {'vulnerabilities': {'critical': 0, 'high': 0, 'moderate': 0, 'low': 0}}}
                  summary['tool_status'] = 'tool_failed'
              metadata = data.get('metadata', {}).get('vulnerabilities', {})
              project_counts = {
                  'CRITICAL': int(metadata.get('critical', 0) or 0),
                  'HIGH': int(metadata.get('high', 0) or 0),
                  'MEDIUM': int(metadata.get('moderate', 0) or 0),
                  'LOW': int(metadata.get('low', 0) or 0),
                  'INFO': 0,
              }
              summary['projects'][name] = project_counts
              for key in ('CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'INFO'):
                  summary['counts'][key] += project_counts.get(key, 0)
              if project_counts['CRITICAL'] > 0 or project_counts['HIGH'] > 0:
                  summary['status'] = 'failed'
                  summary['tool_status'] = 'vuln_found'
          summary_path = Path('.codex/security/npm-audit-summary.json')
          summary_path.write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
          critical=$(python - '.codex/security/npm-audit-summary.json' <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(summary.get('counts', {}).get('CRITICAL', 0))
          PY
          )
          high=$(python - '.codex/security/npm-audit-summary.json' <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(summary.get('counts', {}).get('HIGH', 0))
          PY
          )
          medium=$(python - '.codex/security/npm-audit-summary.json' <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(summary.get('counts', {}).get('MEDIUM', 0))
          PY
          )
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "critical_count=$critical" >> "$GITHUB_OUTPUT"
          echo "high_count=$high" >> "$GITHUB_OUTPUT"
          echo "medium_count=$medium" >> "$GITHUB_OUTPUT"
          echo "summary_path=.codex/security/npm-audit-summary.json" >> "$GITHUB_OUTPUT"
          echo "## npm dependency audit" >> "$GITHUB_STEP_SUMMARY"
          cat ".codex/security/npm-audit-summary.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
            echo "::error::npm audit found $critical critical and $high high vulnerabilities."
            exit 1
          fi

      - name: Scan Rust dependencies
        if: matrix.ecosystem == 'rust'
        id: rust-audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex/security
          tool_status='passed'
          set +e
          cargo tree --depth 1 > .codex/security/cargo-tree.txt 2>&1
          cargo_exit=$?
          set -e
          if [ "$cargo_exit" -ne 0 ]; then
            tool_status='tool_failed'
          fi
          if [ "$cargo_exit" -ne 0 ]; then
            summary='{"ecosystem":"rust","status":"tool_failed","tool_status":"tool_failed","counts":{"CRITICAL":0,"HIGH":0,"MEDIUM":0,"LOW":0,"INFO":0},"notes":["cargo tree inspection failed; cargo-audit is not configured in this workflow"]}'
          else
            summary='{"ecosystem":"rust","status":"passed","tool_status":"clean","counts":{"CRITICAL":0,"HIGH":0,"MEDIUM":0,"LOW":0,"INFO":0},"notes":["cargo tree inspection completed; cargo-audit is not configured in this workflow"]}'
          fi
          printf '%s\n' "$summary" > .codex/security/rust-audit-summary.json
          echo "status=$tool_status" >> "$GITHUB_OUTPUT"
          echo "tool_status=$tool_status" >> "$GITHUB_OUTPUT"
          echo "critical_count=0" >> "$GITHUB_OUTPUT"
          echo "high_count=0" >> "$GITHUB_OUTPUT"
          echo "medium_count=0" >> "$GITHUB_OUTPUT"
          echo "summary_path=.codex/security/rust-audit-summary.json" >> "$GITHUB_OUTPUT"
          echo "## Rust dependency audit" >> "$GITHUB_STEP_SUMMARY"
          cat .codex/security/rust-audit-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce dependency gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = {
              'python': Path('.codex/security/pip-audit-summary.json'),
              'npm': Path('.codex/security/npm-audit-summary.json'),
              'rust': Path('.codex/security/rust-audit-summary.json'),
          }
          total_critical = 0
          total_high = 0
          total_medium = 0
          total_low = 0
          for name, path in artifacts.items():
              if not path.exists():
                  continue
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  continue
              counts = payload.get('counts', {})
              total_critical += int(counts.get('CRITICAL', 0) or 0)
              total_high += int(counts.get('HIGH', 0) or 0)
              total_medium += int(counts.get('MEDIUM', 0) or 0)
              total_low += int(counts.get('LOW', 0) or 0)

          print(f'critical={total_critical} high={total_high} medium={total_medium} low={total_low}')
          if total_critical > 0 or total_high > 0:
              raise SystemExit(1)
          PY

  report-health:
    name: Generate Dependency Health Report
    runs-on: ubuntu-latest
    needs: dependency-security-gate
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Publish health summary
        shell: bash
        run: |
          set -euo pipefail
          echo '## Dependency Security Health Report' >> "$GITHUB_STEP_SUMMARY"
          echo '- Status: ${{ needs.dependency-security-gate.result }}' >> "$GITHUB_STEP_SUMMARY"
          echo "- Policy: Fail on critical/high findings; record medium/low warnings separately." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.dependency-security-gate.result }}" != "success" ]; then
            echo '::error::Dependency security gate blocked the merge because critical/high findings are present.'
            exit 1
          fi
