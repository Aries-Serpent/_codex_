name: Test Variables API
true:
  workflow_dispatch:
    inputs:
      run_org_tests:
        description: Also test org-level variable CRUD (requires admin:org scope)
        type: boolean
        default: false
      dry_run:
        description: "Print token info only \u2014 do not create/delete variables"
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  validate-token:
    name: Validate Token Scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_repo_scope: ${{ steps.check.outputs.has_repo_scope }}
      has_admin_org: ${{ steps.check.outputs.has_admin_org }}
      token_source: ${{ steps.check.outputs.token_source }}
    steps:
    - name: Identify available token and scopes
      id: check
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
      run: "# Determine best available token\nif [ -n \"$CODEX_MASTER_KEY\" ]; then\n\
        \  TOKEN=\"$CODEX_MASTER_KEY\"\n  SOURCE=\"CODEX_MASTER_KEY\"\nelif [ -n \"\
        $CODEX_BACKUP_KEY\" ]; then\n  TOKEN=\"$CODEX_BACKUP_KEY\"\n  SOURCE=\"CODEX_BACKUP_KEY\"\
        \nelse\n  TOKEN=\"${{ github.token }}\"\n  SOURCE=\"GITHUB_TOKEN (installation\
        \ \u2014 limited)\"\nfi\n\necho \"token_source=${SOURCE}\" >> \"$GITHUB_OUTPUT\"\
        \n\n# Fetch scopes from rate_limit header\nSCOPES=$(curl -s -I \\\n  -H \"\
        Authorization: Bearer ${TOKEN}\" \\\n  -H \"Accept: application/vnd.github+json\"\
        \ \\\n  -H \"X-GitHub-Api-Version: 2026-03-10\" \\\n  https://api.github.com/rate_limit\
        \ \\\n  | grep -i \"x-oauth-scopes\" | cut -d' ' -f2- | tr -d '\\r')\n\necho\
        \ \"X-OAuth-Scopes: ${SCOPES:-'(none)'}\"\necho \"Token source:   ${SOURCE}\"\
        \n\nHAS_REPO=\"false\"\nHAS_ADMIN=\"false\"\nif echo \"$SCOPES\" | grep -q\
        \ \"repo\"; then\n  HAS_REPO=\"true\"\nfi\nif echo \"$SCOPES\" | grep -q \"\
        admin:org\"; then\n  HAS_ADMIN=\"true\"\nfi\n\necho \"has_repo_scope=${HAS_REPO}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"has_admin_org=${HAS_ADMIN}\" >> \"$GITHUB_OUTPUT\"\
        \n\necho \"\"\necho \"Summary:\"\necho \"  has repo scope:  ${HAS_REPO}\"\n\
        echo \"  has admin:org:   ${HAS_ADMIN}\"\n\nif [ \"$HAS_REPO\" = \"false\"\
        \ ]; then\n  echo \"::warning::Token lacks 'repo' scope \u2014 repo variable\
        \ CRUD will fail (HTTP 403)\"\n  echo \"::warning::Add CODEX_MASTER_KEY or\
        \ CODEX_BACKUP_KEY to repository secrets\"\nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  test-repo-variables:
    name: Test Repo Variables (CREATE/GET/UPDATE/DELETE)
    needs: validate-token
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      ORG: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        sparse-checkout: scripts/ci/test_variables_api.py
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.12
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Run repo variable tests
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        REPO: ${{ github.repository }}
        ORG: ${{ github.repository_owner }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: "echo \"Token source: ${{ needs.validate-token.outputs.token_source }}\"\
        \necho \"Has repo scope: ${{ needs.validate-token.outputs.has_repo_scope }}\"\
        \necho \"\"\n\nif [ \"$DRY_RUN\" = \"true\" ]; then\n  echo \"DRY RUN \u2014\
        \ skipping variable CRUD tests\"\n  python scripts/ci/test_variables_api.py\
        \ 2>&1 | head -30\n  exit 0\nfi\n\npython scripts/ci/test_variables_api.py\n"
    - name: Post result to PR Status Dashboard
      if: always() && github.event.pull_request.number != ''
      uses: ./.github/actions/post-pr-summary
      with:
        workflow-name: "Test Variables API \u2014 Repo Scope"
        status: ${{ job.status }}
        summary: Repo variable CRUD test (CREATE/GET/UPDATE/DELETE)
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
    timeout-minutes: 30
  test-org-variables:
    name: Test Org Variables (CREATE/GET/UPDATE/DELETE)
    needs: validate-token
    if: inputs.run_org_tests == true
    runs-on: ubuntu-latest
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        sparse-checkout: scripts/ci/test_variables_api.py
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.12
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Run org variable tests
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        REPO: ${{ github.repository }}
        ORG: ${{ github.repository_owner }}
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "echo \"Token source: ${{ needs.validate-token.outputs.token_source }}\"\
        \necho \"Has admin:org scope: ${{ needs.validate-token.outputs.has_admin_org\
        \ }}\"\necho \"\"\n\nif [ \"${{ needs.validate-token.outputs.has_admin_org\
        \ }}\" = \"false\" ]; then\n  echo \"::warning::Skipping org tests \u2014\
        \ token lacks admin:org scope\"\n  echo \"Required: classic PAT with admin:org\
        \ OR fine-grained PAT with 'Variables: write' org permission\"\n  exit 0\n\
        fi\n\npython scripts/ci/test_variables_api.py\n"
    - name: Post result to PR Status Dashboard
      if: always() && github.event.pull_request.number != ''
      uses: ./.github/actions/post-pr-summary
      with:
        workflow-name: "Test Variables API \u2014 Org Scope"
        status: ${{ job.status }}
        summary: Org variable CRUD test (CREATE/GET/UPDATE/DELETE)
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
    timeout-minutes: 30
  summary:
    name: Test Summary
    needs:
    - validate-token
    - test-repo-variables
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Print summary
      env:
        TOKEN_SOURCE: ${{ needs.validate-token.outputs.token_source }}
        HAS_REPO: ${{ needs.validate-token.outputs.has_repo_scope }}
        HAS_ADMIN: ${{ needs.validate-token.outputs.has_admin_org }}
        REPO_RESULT: ${{ needs.test-repo-variables.result }}
      run: "echo \"## GitHub Variables API Test Results\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"| Test Suite | Result |\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"|-----------|--------|\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"| Token validation | \u2705 completed |\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"| Repo variable CRUD | $([[ '${{ needs.test-repo-variables.result\
        \ }}' == 'success' ]] && echo '\u2705 passed' || echo '\u274C failed') |\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"**Token source:** \\`${TOKEN_SOURCE}\\`\" >> \"$GITHUB_STEP_SUMMARY\"\n\
        echo \"**Has \\`repo\\` scope:** ${HAS_REPO}\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"**Has \\`admin:org\\` scope:** ${HAS_ADMIN}\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"**Reference:** [GITHUB_VARIABLES_SECRETS_REFERENCE.md](docs/reference/GITHUB_VARIABLES_SECRETS_REFERENCE.md)\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
