name: CI — Optimized with Caching

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: optimized-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_FORCE_CPU: "1"
  UV_CACHE_DIR: /tmp/.uv-cache
  PIP_CACHE_DIR: /tmp/.pip-cache

jobs:
  # Dependency caching job
  cache-dependencies:
    name: Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.PIP_CACHE_DIR }}
            ~/.cache/pre-commit
          key: deps-${{ runner.os }}-py3.12-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-py3.12-
      
      - name: Install uv
        if: steps.cache.outputs.cache-hit != 'true'
        run: pip install uv
      
      - name: Pre-cache dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv pip install --system nox pytest pytest-xdist pytest-split
          uv pip install --system -e ".[dev,test]" || true

  # Parallel test execution
  parallel-tests:
    name: "Tests (${{ matrix.shard }}/${{ strategy.job-total }})"
    needs: cache-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.PIP_CACHE_DIR }}
          key: deps-${{ runner.os }}-py3.12-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
      
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system nox pytest pytest-xdist pytest-split
          uv pip install --system -e ".[dev,test]" || pip install -e ".[dev,test]"
      
      - name: Run parallel tests (shard ${{ matrix.shard }})
        run: |
          # Use pytest-split for test sharding
          pytest tests/ \
            --splits 4 \
            --group ${{ matrix.shard }} \
            -x --tb=short -q \
            --ignore=tests/integration \
            --ignore=tests/e2e
        env:
          CODEX_CPU_MINIMAL: "1"

  # Quick lint check (runs in parallel)
  lint:
    name: Lint & Type Check
    needs: cache-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.PIP_CACHE_DIR }}
            ~/.cache/pre-commit
          key: deps-${{ runner.os }}-py3.12-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
      
      - name: Install tools
        run: pip install ruff black mypy
      
      - name: Run ruff
        run: ruff check src/ --output-format=github || true
      
      - name: Run black check
        run: black --check src/ || true

  # Security scanning
  security:
    name: Security Scan
    needs: cache-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install security tools
        run: pip install bandit safety pip-audit
      
      - name: Run bandit
        run: bandit -r src/ -c bandit.yaml || true
      
      - name: Run pip-audit
        run: pip-audit --desc || true

  # Summary job
  ci-summary:
    name: CI Summary
    needs: [parallel-tests, lint, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "=== CI Summary ==="
          echo "Parallel tests: ${{ needs.parallel-tests.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Security: ${{ needs.security.result }}"
