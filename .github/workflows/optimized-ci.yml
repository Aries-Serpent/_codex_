name: "CI \u2014 Optimized with Caching"
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - src/**
    - tests/**
    - packages/**
    - pyproject.toml
    - requirements/**
    - uv.lock
    - .github/actions/setup-python-cached/**
    - .github/workflows/optimized-ci.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CODEX_FORCE_CPU: '1'
  UV_CACHE_DIR: ~/.cache/uv
  PIP_CACHE_DIR: ~/.cache/pip
jobs:
  cache-dependencies:
    name: Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Python
      id: cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: live
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --type pip --workflow optimized-ci
        --health 2>/dev/null || echo ''{"status": "cache health check skipped"}''

        '
    timeout-minutes: 10
