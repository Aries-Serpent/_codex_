name: CI — Optimized with Caching

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: optimized-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_FORCE_CPU: "1"
  UV_CACHE_DIR: /tmp/.uv-cache
  PIP_CACHE_DIR: /tmp/.pip-cache

jobs:
  # Dependency caching job
  cache-dependencies:
    name: Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Python
        id: cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.12
          cache-tier: 'live'

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow optimized-ci --health 2>/dev/null || echo '{"status": "cache health check skipped"}'
