name: Code Quality & Coverage Suite
on:
  pull_request:
    branches:
    - main
    - develop
    - 0D_base_
    - copilot/integrate-codex-status-template
    - master
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  push:
    branches:
    - main
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  workflow_dispatch:
    inputs:
      mode:
        description: Analysis mode
        required: true
        type: choice
        options:
        - coverage-only
        - quality-only
        - full-suite
        default: full-suite
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  change_filter:
    name: Determine Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_coverage: ${{ steps.filter.outputs.run_coverage }}
      run_quality: ${{ steps.filter.outputs.run_quality }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Compute coverage/quality scope
      id: filter
      shell: bash
      run: "MODE=\"${{ inputs.mode || '' }}\"\nEVENT=\"${{ github.event_name }}\"\n\
        \nif [[ \"$EVENT\" == \"workflow_dispatch\" ]]; then\n  case \"$MODE\" in\n\
        \    coverage-only)\n      echo \"run_coverage=true\" >> \"$GITHUB_OUTPUT\"\
        \n      echo \"run_quality=false\" >> \"$GITHUB_OUTPUT\"\n      ;;\n    quality-only)\n\
        \      echo \"run_coverage=false\" >> \"$GITHUB_OUTPUT\"\n      echo \"run_quality=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n      ;;\n    *)\n      echo \"run_coverage=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n      echo \"run_quality=true\" >> \"$GITHUB_OUTPUT\"\
        \n      ;;\n  esac\n  exit 0\nfi\n\nif [[ \"$EVENT\" == \"pull_request\" ]];\
        \ then\n  git fetch --no-tags origin \"${{ github.base_ref }}\" --depth=1\n\
        \  RANGE=\"origin/${{ github.base_ref }}...${{ github.sha }}\"\nelse\n  if\
        \ [[ \"${{ github.event.before }}\" == \"0000000000000000000000000000000000000000\"\
        \ ]]; then\n    echo \"Initial push detected (null before SHA); running both\
        \ suites.\"\n    echo \"run_coverage=true\" >> \"$GITHUB_OUTPUT\"\n    echo\
        \ \"run_quality=true\" >> \"$GITHUB_OUTPUT\"\n    exit 0\n  fi\n  RANGE=\"\
        ${{ github.event.before }}...${{ github.sha }}\"\nfi\n\nCHANGED=\"$(git diff\
        \ --name-only \"$RANGE\" || true)\"\necho \"Changed files:\"\necho \"$CHANGED\"\
        \n\nif [[ -z \"$CHANGED\" ]]; then\n  echo \"Empty diff range or diff resolution\
        \ failed; defaulting to run both suites.\"\n  echo \"run_coverage=true\" >>\
        \ \"$GITHUB_OUTPUT\"\n  echo \"run_quality=true\" >> \"$GITHUB_OUTPUT\"\n\
        \  exit 0\nfi\n\nCOVERAGE_PATTERN='^(src/|tests/|pyproject\\.toml$|pytest\\\
        .ini$|\\.coveragerc$|requirements[^/]*\\.txt$|requirements/.*\\.txt$|tools/coverage_.*\\\
        .py$|\\.github/workflows/code-quality-coverage-suite\\.yml$)'\nQUALITY_PATTERN='^(src/|tests/|agents/|scripts/|pyproject\\\
        .toml$|mypy\\.ini$|ruff\\.toml$|\\.github/workflows/code-quality-coverage-suite\\\
        .yml$)'\n\nif printf '%s\\n' \"$CHANGED\" | grep -Eq \"$COVERAGE_PATTERN\"\
        ; then\n  echo \"run_coverage=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"\
        run_coverage=false\" >> \"$GITHUB_OUTPUT\"\nfi\n\nif printf '%s\\n' \"$CHANGED\"\
        \ | grep -Eq \"$QUALITY_PATTERN\"; then\n  echo \"run_quality=true\" >> \"\
        $GITHUB_OUTPUT\"\nelse\n  echo \"run_quality=false\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  coverage_analysis:
    name: Coverage Report Generation
    needs:
    - change_filter
    runs-on: ubuntu-latest
    if: '(github.event_name == ''pull_request'' && needs.change_filter.outputs.run_coverage
      == ''true'') ||

      (github.event_name == ''push'' && needs.change_filter.outputs.run_coverage ==
      ''true'') ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''coverage-only''
      || inputs.mode == ''full-suite''))

      '
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: live
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        # Install package with test extras to get all test dependencies

        # Pin pytest plugins (PR  #3248)

        # Pin pytest plugins before package install (PR  #3248 stability fix)

        pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0
        pytest-asyncio==1.3.0

        pip install -e ".[dev]"

        # Additional coverage tools

        pip install ''pytest>=9.0,<10'' ''pytest-cov>=7.0,<8'' ''coverage>=7.10.6,<8''

        # Install pytest-xdist for parallel test execution and pytest-timeout

        pip install pytest-xdist pytest-timeout

        '
    - name: Run tests with coverage
      run: '# Run tests with coverage, allow test failures but ensure coverage data
        is collected

        # Timeout: 7s per test (pytest-timeout), fail fast after 50 failures, run
        in parallel with 6 workers

        coverage run -m pytest -q -m "not slow" --timeout=7 --maxfail=50 -n auto --dist=loadscope
        || true


        # Ensure coverage data file exists even if no tests ran

        coverage json -o .coverage.json || echo ''{}'' > .coverage.json

        '
    - name: Generate coverage HTML report
      run: "# Generate HTML report only if coverage data exists\nif [ -f .coverage.json\
        \ ] && [ -s .coverage.json ]; then\n  coverage html -d htmlcov || mkdir -p\
        \ htmlcov\nelse\n  mkdir -p htmlcov\n  echo \"<html><body><p>No coverage data\
        \ generated</p></body></html>\" > htmlcov/index.html\nfi\n"
    - name: Generate function index PDF (72 DPI, black & white)
      run: "# Generate PDF only if HTML report exists\nif [ -d htmlcov ] && [ -f htmlcov/index.html\
        \ ]; then\n  python tools/coverage_html_to_pdf.py --input-dir htmlcov --output\
        \ coverage_functions.pdf --dpi 72 || touch coverage_functions.pdf\nelse\n\
        \  touch coverage_functions.pdf\nfi\n"
    - name: Extract per-module coverage
      run: "# Extract module coverage only if coverage JSON exists\nif [ -f .coverage.json\
        \ ] && [ -s .coverage.json ]; then\n  python tools/coverage_extract.py --coverage-json\
        \ .coverage.json --out coverage_modules.json || echo '{}' > coverage_modules.json\n\
        else\n  echo '{}' > coverage_modules.json\nfi\n"
    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: '.coverage.json

          coverage_modules.json

          coverage_functions.pdf

          '
        if-no-files-found: warn
        retention-days: 90
        name: coverage-artifacts-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  quality-ruff:
    name: Quality Analysis - Ruff Linting
    needs:
    - change_filter
    runs-on: ubuntu-latest
    if: '(github.event_name == ''pull_request'' && needs.change_filter.outputs.run_quality
      == ''true'') ||

      (github.event_name == ''push'' && needs.change_filter.outputs.run_quality ==
      ''true'') ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''quality-only''
      || inputs.mode == ''full-suite''))

      '
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: live
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install ruff

        '
    - name: Run Ruff linting (Observation Mode)
      id: ruff
      continue-on-error: true
      run: 'echo "## Ruff Analysis" >> $GITHUB_STEP_SUMMARY

        ruff check src/ tests/ --output-format=github || true

        ruff check src/ tests/ --statistics >> $GITHUB_STEP_SUMMARY 2>&1 || true

        '
    - name: Upload ruff report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: ruff-output.txt
        if-no-files-found: ignore
        retention-days: 30
        name: code-quality-ruff-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  quality-mypy:
    name: Quality Analysis - Type Checking (mypy)
    needs:
    - change_filter
    runs-on: ubuntu-latest
    if: '(github.event_name == ''pull_request'' && needs.change_filter.outputs.run_quality
      == ''true'') ||

      (github.event_name == ''push'' && needs.change_filter.outputs.run_quality ==
      ''true'') ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''quality-only''
      || inputs.mode == ''full-suite''))

      '
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: live
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -e ".[dev]"

        pip install mypy

        '
    - name: Run mypy type checking (Observation Mode)
      id: mypy
      continue-on-error: true
      run: 'echo "## Type Checking (mypy)" >> $GITHUB_STEP_SUMMARY

        mypy src/ --ignore-missing-imports --no-error-summary 2>&1 | tee mypy-output.txt
        || true

        echo ''```'' >> $GITHUB_STEP_SUMMARY

        head -20 mypy-output.txt >> $GITHUB_STEP_SUMMARY || echo "No issues found"
        >> $GITHUB_STEP_SUMMARY

        echo ''```'' >> $GITHUB_STEP_SUMMARY

        '
    - name: Upload mypy report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: mypy-output.txt
        if-no-files-found: ignore
        retention-days: 30
        name: code-quality-mypy-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  quality-bandit:
    name: "Quality Analysis - Security (Bandit) \u2014 ENFORCED"
    needs:
    - change_filter
    runs-on: ubuntu-latest
    if: '(github.event_name == ''pull_request'' && needs.change_filter.outputs.run_quality
      == ''true'') ||

      (github.event_name == ''push'' && needs.change_filter.outputs.run_quality ==
      ''true'') ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''quality-only''
      || inputs.mode == ''full-suite''))

      '
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: live
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install bandit

        '
    - name: Run Bandit security analysis (ENFORCED)
      id: bandit
      run: "set -euo pipefail\necho \"## Security Analysis (Bandit) \u2014 ENFORCED\"\
        \ >> $GITHUB_STEP_SUMMARY\n# Run Bandit with JSON output\nbandit -r src/ -f\
        \ json -o bandit-report.json || true\nbandit -r src/ -f txt | tee bandit-output.txt\
        \ || true\n\n# Parse results for blocking\nCRITICAL_COUNT=$(jq '[.results[]\
        \ | select(.severity == \"HIGH\" and .confidence == \"HIGH\")] | length' bandit-report.json\
        \ 2>/dev/null || echo \"0\")\nHIGH_COUNT=$(jq '[.results[] | select(.severity\
        \ == \"HIGH\")] | length' bandit-report.json 2>/dev/null || echo \"0\")\n\n\
        echo \"critical_findings=${CRITICAL_COUNT}\" >> \"$GITHUB_OUTPUT\"\necho \"\
        high_findings=${HIGH_COUNT}\" >> \"$GITHUB_OUTPUT\"\n\n# Add findings to summary\n\
        echo \"**High Severity Issues:** ${HIGH_COUNT}\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"**Critical Issues:** ${CRITICAL_COUNT}\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho '```' >> $GITHUB_STEP_SUMMARY\ntail\
        \ -30 bandit-output.txt >> $GITHUB_STEP_SUMMARY || echo \"No issues found\"\
        \ >> $GITHUB_STEP_SUMMARY\necho '```' >> $GITHUB_STEP_SUMMARY\n\n# Fail if\
        \ CRITICAL issues found\nif [ \"${CRITICAL_COUNT}\" -gt 0 ]; then\n  echo\
        \ \"::error::Bandit found ${CRITICAL_COUNT} CRITICAL security issues \u2014\
        \ blocking\"\n  exit 1\nfi\n\n# Warning if HIGH issues found\nif [ \"${HIGH_COUNT}\"\
        \ -gt 0 ]; then\n  echo \"::warning::Bandit found ${HIGH_COUNT} HIGH severity\
        \ issues \u2014 review required\"\nfi\n"
    - name: Upload bandit reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: 'bandit-report.json

          bandit-output.txt

          '
        if-no-files-found: ignore
        retention-days: 30
        name: code-quality-bandit-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  quality-radon:
    name: Quality Analysis - Code Complexity (Radon)
    needs:
    - change_filter
    runs-on: ubuntu-latest
    if: '(github.event_name == ''pull_request'' && needs.change_filter.outputs.run_quality
      == ''true'') ||

      (github.event_name == ''push'' && needs.change_filter.outputs.run_quality ==
      ''true'') ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''quality-only''
      || inputs.mode == ''full-suite''))

      '
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: live
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install radon

        '
    - name: Calculate code complexity (Observation Mode)
      id: complexity
      continue-on-error: true
      run: 'echo "## Code Complexity (Radon)" >> $GITHUB_STEP_SUMMARY

        radon cc src/ -a -s | tee radon-output.txt || true

        echo ''```'' >> $GITHUB_STEP_SUMMARY

        head -30 radon-output.txt >> $GITHUB_STEP_SUMMARY || echo "Analysis complete"
        >> $GITHUB_STEP_SUMMARY

        echo ''```'' >> $GITHUB_STEP_SUMMARY

        '
    - name: Upload radon report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: radon-output.txt
        if-no-files-found: ignore
        retention-days: 30
        name: code-quality-radon-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  unified_summary:
    name: Generate Unified Summary
    runs-on: ubuntu-latest
    needs:
    - change_filter
    - coverage_analysis
    - quality-ruff
    - quality-mypy
    - quality-bandit
    - quality-radon
    if: always()
    steps:
    - name: Checkout for cache health
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: scripts/ci
    - name: Cache health report
      continue-on-error: true
      run: 'pip install -q pip 2>/dev/null

        python scripts/ci/generate_cache_keys.py --type pip --workflow code-quality-coverage-suite
        --health 2>/dev/null || echo ''{"status": "cache health check skipped"}''

        '
    - name: Generate comprehensive summary
      run: "echo \"## \U0001F4CA Code Quality & Coverage Summary\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Mode:** ${{ inputs.mode || github.event_name\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\necho \"\
        ### Job Status (OPT-001: Parallel Quality Analysis)\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Change Filter: ${{ needs.change_filter.result }}\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Coverage Analysis: ${{ needs.coverage_analysis.result || 'skipped'\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"- Quality - Ruff: ${{ needs.quality-ruff.result\
        \ || 'skipped' }}\" >> $GITHUB_STEP_SUMMARY\necho \"- Quality - mypy: ${{\
        \ needs.quality-mypy.result || 'skipped' }}\" >> $GITHUB_STEP_SUMMARY\necho\
        \ \"- Quality - Bandit: ${{ needs.quality-bandit.result || 'skipped' }}\"\
        \ >> $GITHUB_STEP_SUMMARY\necho \"- Quality - Radon: ${{ needs.quality-radon.result\
        \ || 'skipped' }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"### Artifacts Generated\" >> $GITHUB_STEP_SUMMARY\necho \"- Coverage\
        \ reports (JSON, HTML, PDF)\" >> $GITHUB_STEP_SUMMARY\necho \"- Quality reports:\
        \ Ruff, mypy, Bandit, Radon (parallel execution - OPT-001)\" >> $GITHUB_STEP_SUMMARY\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: unified_summary
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Code Quality & Coverage Suite
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
