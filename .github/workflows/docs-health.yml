name: Docs Health (Post-Merge)

# Post-merge documentation health check.
# Runs after every push to main that touches docs/ or mkdocs.yml to confirm
# the documentation tree is clean and all nav entries resolve to real files.
# Also available as workflow_dispatch for on-demand verification.
#
# Priority 1 deliverable: confirms docs-health.yml auto-run is clean post-merge.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-health:
    name: "📚 Docs Health Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml --quiet

      - name: Run docs_lint --strict (nav + file existence)
        id: docs_lint
        run: |
          python scripts/ci/docs_lint.py --strict 2>&1 | tee /tmp/docs_lint_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify cost-dashboard page exists
        run: |
          if [ ! -f "docs/ops/cost-dashboard.md" ]; then
            echo "::error::docs/ops/cost-dashboard.md missing — cost-dashboard nav entry will 404"
            exit 1
          fi
          echo "✅ docs/ops/cost-dashboard.md present"

      - name: Post docs health summary
        if: always()
        run: |
          {
            echo "## 📚 Docs Health Check"
            echo ""
            if [ -f /tmp/docs_lint_output.txt ]; then
              echo '```'
              cat /tmp/docs_lint_output.txt
              echo '```'
            fi
            if [ "${{ steps.docs_lint.outputs.exit_code }}" = "0" ]; then
              echo "✅ **All nav entries resolve to existing files — GitHub Pages safe to deploy.**"
            else
              echo "❌ **Docs lint errors detected — fix before next deployment.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
