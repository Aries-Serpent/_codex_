name: "\U0001F50D Issue Resolution Gate"
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number whose body should be scanned for issue references
        required: false
        default: ''
      issue_numbers:
        description: Space-separated issue/PR numbers to verify directly (overrides
          auto-scan)
        required: false
        default: ''
      allow_in_progress:
        description: Treat IN_PROGRESS as resolved (do not block on pending checks)
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read
jobs:
  verify:
    if: ${{ github.event.pull_request.number != 5328 }}
    name: Verify referenced issues are resolved
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Set up Python 3.12
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Extract issue references from PR body
      id: extract
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        ISSUE_OVERRIDE: ${{ inputs.issue_numbers }}
      run: "set -euo pipefail\n\n# If explicit list provided, use it directly\nif\
        \ [[ -n \"${ISSUE_OVERRIDE:-}\" ]]; then\n  echo \"issues=${ISSUE_OVERRIDE}\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"source=manual-override\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"\u2139\uFE0F  Using manual issue override: ${ISSUE_OVERRIDE}\"\n\
        \  exit 0\nfi\n\nif [[ -z \"${PR_NUMBER:-}\" ]]; then\n  echo \"issues=\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"source=none\" >> \"$GITHUB_OUTPUT\"\n  echo\
        \ \"\u2139\uFE0F  No PR number \u2014 skipping issue extraction\"\n  exit\
        \ 0\nfi\n\n# Fetch PR body and extract issue references\n# Use || true so\
        \ a transient API rate-limit or network error does not\n# fail the gate \u2014\
        \ in that case we simply find no issue references and\n# exit 0 (non-blocking).\n\
        PR_BODY=$(gh api \"repos/${{ github.repository }}/pulls/${PR_NUMBER}\" \\\n\
        \  --jq '.body // \"\"' 2>/dev/null) || {\n  echo \"\u26A0\uFE0F  Could not\
        \ fetch PR body (API error / rate limit) \u2014 skipping issue extraction\"\
        \n  echo \"issues=\" >> \"$GITHUB_OUTPUT\"\n  echo \"source=api-error\" >>\
        \ \"$GITHUB_OUTPUT\"\n  exit 0\n}\n\n# Only extract issues explicitly targeted\
        \ for closure (matches GitHub\n# auto-close semantics).  Bare \"#N\" references\
        \ are informational and\n# should NOT trigger the resolution gate \u2014 they\
        \ are cross-references,\n# not closure directives.\nRAW_NUMBERS=$(echo \"\
        ${PR_BODY}\" | \\\n  grep -oP '(?i)(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\\
        s+#\\K\\d+' | \\\n  sort -u | tr '\\n' ' ' | xargs || true)\n\n# Exclude the\
        \ current PR number to avoid circular dependency:\n# the gate checking its\
        \ own PR \u2192 BLOCKED (because this gate is\n# failing) \u2192 exit 1 \u2192\
        \ gate stays failed forever.\nISSUE_NUMBERS=\"\"\nfor n in ${RAW_NUMBERS};\
        \ do\n  if [[ \"$n\" != \"${PR_NUMBER}\" ]]; then\n    ISSUE_NUMBERS=\"${ISSUE_NUMBERS}\
        \ ${n}\"\n  else\n    echo \"\u2139\uFE0F  Excluding self-reference  #${n}\
        \ (this PR)\"\n  fi\ndone\nISSUE_NUMBERS=$(echo \"${ISSUE_NUMBERS}\" | xargs\
        \ || true)\n\necho \"issues=${ISSUE_NUMBERS}\" >> \"$GITHUB_OUTPUT\"\necho\
        \ \"source=pr-body\" >> \"$GITHUB_OUTPUT\"\nif [[ -n \"${ISSUE_NUMBERS}\"\
        \ ]]; then\n  echo \"\u2139\uFE0F  Found issue references in PR  #${PR_NUMBER}:\
        \ ${ISSUE_NUMBERS}\"\nelse\n  echo \"\u2139\uFE0F  No issue references found\
        \ in PR body\"\nfi\n"
    - name: Run issue resolution verifier
      id: verify
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        ISSUES: ${{ steps.extract.outputs.issues }}
      run: "set -euo pipefail\n\nif [[ -z \"${ISSUES:-}\" ]]; then\n  echo \"\u2705\
        \ No issue references found \u2014 nothing to verify\"\n  echo '## \U0001F50D\
        \ Issue Resolution Gate' >> \"$GITHUB_STEP_SUMMARY\"\n  echo '' >> \"$GITHUB_STEP_SUMMARY\"\
        \n  echo '> \u2139\uFE0F No issue/PR references found in PR body \u2014 gate\
        \ skipped.' >> \"$GITHUB_STEP_SUMMARY\"\n  exit 0\nfi\n\nALLOW_FLAG=\"\"\n\
        if [[ \"${{ inputs.allow_in_progress }}\" == \"true\" ]]; then\n  ALLOW_FLAG=\"\
        --allow-in-progress\"\nfi\n\n# Convert space-separated numbers to --issues\
        \ args\n# shellcheck disable=SC2086\npython scripts/ci/verify_issue_resolution.py\
        \ \\\n  --issues ${ISSUES} \\\n  --repo \"${{ github.repository }}\" \\\n\
        \  --step-summary \\\n  ${ALLOW_FLAG}\n"
    - name: Generate JSON report artifact
      if: always()
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        ISSUES: ${{ steps.extract.outputs.issues }}
      run: "mkdir -p /tmp/issue-resolution-reports\nif [[ -n \"${ISSUES:-}\" ]]; then\n\
        \  # shellcheck disable=SC2086\n  python scripts/ci/verify_issue_resolution.py\
        \ \\\n    --issues ${ISSUES} \\\n    --repo \"${{ github.repository }}\" \\\
        \n    --output-json /tmp/issue-resolution-reports/report.json \\\n    --allow-in-progress\
        \ || true  # don't fail artifact generation\nelse\n  echo '[]' > /tmp/issue-resolution-reports/report.json\n\
        fi\n"
    - name: Upload resolution report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: /tmp/issue-resolution-reports/
        retention-days: 30
        name: issue-resolution-report
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
