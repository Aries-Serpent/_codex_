name: Behavior Compare
true:
  workflow_call:
    inputs:
      snapshot_id:
        required: true
        type: string
        description: Snapshot identifier
      baseline_ref:
        required: true
        type: string
        description: Git ref for baseline code
      patched_ref:
        required: true
        type: string
        description: Git ref for patched code
      tolerance:
        required: false
        type: string
        default: strict
        description: Comparison tolerance (strict, fuzzy, semantic)
    outputs:
      comparison_result:
        description: 'Result: pass | fail | warn'
        value: ${{ jobs.compare.outputs.result }}
jobs:
  compare:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.compare.outputs.result }}
    steps:
    - name: Checkout baseline
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.baseline_ref }}
        path: baseline
    - name: Checkout patched
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.patched_ref }}
        path: patched
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.12.13
    - name: Install dependencies
      run: 'pip install -e ./baseline[dev] || pip install -e ./baseline

        pip install -e ./patched[dev] || pip install -e ./patched

        '
    - name: Create artifacts directory
      run: mkdir -p artifacts
    - name: Run baseline harness
      run: "cd baseline\nPYTHONHASHSEED=42 python -c \"\nimport sys\nimport json\n\
        from pathlib import Path\n\n# Find and run main script\nmain_files = list(Path('.').glob('**/main.py'))[:1]\n\
        if main_files:\n    exec(main_files[0].read_text())\nelse:\n    print('No\
        \ main.py found')\n\" > ../artifacts/baseline-output.txt 2>&1 || true\n"
    - name: Run patched harness
      run: "cd patched\nPYTHONHASHSEED=42 python -c \"\nimport sys\nimport json\n\
        from pathlib import Path\n\n# Find and run main script\nmain_files = list(Path('.').glob('**/main.py'))[:1]\n\
        if main_files:\n    exec(main_files[0].read_text())\nelse:\n    print('No\
        \ main.py found')\n\" > ../artifacts/patched-output.txt 2>&1 || true\n"
    - name: Compare outputs
      id: compare
      run: "python3 << 'EOF'\nimport json\nimport difflib\nfrom pathlib import Path\n\
        \nbaseline = Path(\"artifacts/baseline-output.txt\").read_text()\npatched\
        \ = Path(\"artifacts/patched-output.txt\").read_text()\n\ntolerance = \"${{\
        \ inputs.tolerance }}\"\n\n# Normalize based on tolerance\nif tolerance ==\
        \ \"fuzzy\":\n    baseline = \"\\n\".join(sorted(baseline.strip().split(\"\
        \\n\")))\n    patched = \"\\n\".join(sorted(patched.strip().split(\"\\n\"\
        )))\nelif tolerance == \"semantic\":\n    import re\n    baseline = re.sub(r'\\\
        d{4}-\\d{2}-\\d{2}', '<DATE>', baseline)\n    patched = re.sub(r'\\d{4}-\\\
        d{2}-\\d{2}', '<DATE>', patched)\n\nmatch = baseline.strip() == patched.strip()\n\
        \nresult = {\n    \"result\": \"pass\" if match else \"fail\",\n    \"baseline_len\"\
        : len(baseline),\n    \"patched_len\": len(patched),\n    \"tolerance\": tolerance,\n\
        }\n\nif not match:\n    diff = list(difflib.unified_diff(\n        baseline.splitlines(),\n\
        \        patched.splitlines(),\n        fromfile=\"baseline\",\n        tofile=\"\
        patched\",\n    ))\n    result[\"diff\"] = \"\\n\".join(diff[:50])  # Truncate\n\
        \nPath(\"artifacts/behavior-diff.json\").write_text(json.dumps(result, indent=2))\n\
        \nprint(f\"result={result['result']}\")\nwith open(\"$GITHUB_OUTPUT\", \"\
        a\") as f:\n    f.write(f\"result={result['result']}\\n\")\nEOF\n"
    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: behavior-comparison-${{ inputs.snapshot_id }}
        path: artifacts/
        retention-days: 30
    - name: Fail on divergence
      if: steps.compare.outputs.result == 'fail'
      run: 'echo "::error::Behavioral divergence detected"

        cat artifacts/behavior-diff.json

        exit 1

        '
    timeout-minutes: 30
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
