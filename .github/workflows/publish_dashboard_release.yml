name: Publish Status Dashboard Release
true:
  workflow_dispatch: null
  schedule:
  - cron: 15 10 * * 1
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions: read-all
jobs:
  publish-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow publish_dashboard_release
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
