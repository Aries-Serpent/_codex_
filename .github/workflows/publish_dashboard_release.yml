name: Publish Status Dashboard Release

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * 1" # weekly Monday 10:15 UTC


permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false  # deployment: never cancel in-progress — leaves prod in unknown state
jobs:
  publish-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow publish_dashboard_release 2>/dev/null || echo "Cache health: check skipped"
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'
