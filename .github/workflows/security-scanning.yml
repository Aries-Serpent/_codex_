name: Security Scanning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  security-events: write

jobs:
  # Static Application Security Testing
  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install bandit
        run: pip install bandit[toml]
      
      - name: Run bandit scan
        run: |
          bandit -r src/ -c bandit.yaml -f json -o bandit-results.json || true
          bandit -r src/ -c bandit.yaml -f txt || true
      
      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json

  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install scanning tools
        run: pip install pip-audit safety
      
      - name: Run pip-audit
        run: |
          pip-audit --desc --format json --output pip-audit.json || true
          pip-audit --desc || true
      
      - name: Run safety check
        run: safety check --output json > safety-results.json || true
        continue-on-error: true
      
      - name: Upload dependency scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-results
          path: |
            pip-audit.json
            safety-results.json

  # Secret scanning
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run detect-secrets
        uses: reviewdog/action-detect-secrets@v0.17.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_on_error: false
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # License compliance
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install pip-licenses
        run: pip install pip-licenses
      
      - name: Check licenses
        run: |
          pip install -e . || true
          pip-licenses --format=json --output-file=licenses.json || true
          pip-licenses --format=markdown || true
      
      - name: Upload license report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-report
          path: licenses.json

  # Security summary
  security-summary:
    name: Security Summary
    needs: [sast, dependency-scan, secret-scan, license-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "=== Security Scan Summary ==="
          echo "SAST (Bandit): ${{ needs.sast.result }}"
          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "Secret Detection: ${{ needs.secret-scan.result }}"
          echo "License Check: ${{ needs.license-check.result }}"
