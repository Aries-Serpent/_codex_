name: Reasoning Engine Monitor
'on':
  schedule:
  - cron: 0 2 * * *
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run mode
        required: false
        default: daily
jobs:
  monitor:
    name: Monitor Reasoning Engine Health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Set up Python with cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-reasoning-engine-monitor-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-reasoning-engine-monitor-
          ${{ runner.os }}-pip-
    - name: Cache pytest
      uses: actions/cache@v5
      with:
        path: .pytest_cache
        key: ${{ runner.os }}-pytest-${{ hashFiles('**/pyproject.toml') }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install numpy pytest pytest-asyncio

        '
    - name: Run reasoning engine tests
      id: tests
      run: "python -m pytest tests/cognitive_brain/test_reasoning_engine.py \\\\\n\
        \  \\ -v --tb=short --json-report --json-report-file=test_report.json"
      continue-on-error: true
    - name: Generate synthetic workload
      id: workload
      run: "python3 << \"EOF\"\nimport asyncio\nimport json\nimport time\nfrom pathlib\\\
        \ import Path\nfrom src.codex.cognitive_brain.reasoning_engine import ReasoningEngine\n\
        from src.codex.cognitive_brain.knowledge_base import KnowledgeBase\n\nasync\\\
        \ def run_workload():\n    # Initialize\n    kb = KnowledgeBase()\n    engine\\\
        \ = ReasoningEngine(knowledge_base=kb)\n\n    # Run 1000+ decisions\n    print(\\\
        \"Running 1000+ decisions...\\\")\n    latencies = []\n    accuracies = []\n\
        \n\\    for i in range(1000):\n        decision = engine.make_decision(\n\
        \    \\         goal=f\\\"Decision {i}\\\",\n            constraints=[\\\"\
        safety\\\", \\\"performance\\\"],\n            decision_history=[\n      \
        \          {\\\"option\\\": \\\"choice_a\\\", \\\"success\\\": True},\n  \
        \              {\\\"option\\\": \\\"choice_b\\\", \\\"success\\\": False},\n\
        \            ],\n            current_state={\\\"metric\\\": i % 100},\n  \
        \          category=[\\\"coverage\\\", \\\"performance\\\", \\\"security\\\
        \"][i % 3],\n        )\n        latencies.append(decision.latency_ms)\n\n\
        \  \\      # Simulate outcomes\n        if i % 2 == 0:\n            await\
        \ engine.record_outcome(\n\\                decision.id,\n               \
        \ success=decision.confidence\\ > 0.75,\n                actual_result=f\\\
        \"result_{i}\\\",\n            )\n\n    # Run improvement cycle\n    print(\\\
        \"Running improvement cycle...\\\")\n    improvement = engine.improve()\n\n\
        \    # Get metrics\n    metrics =\\ engine.get_metrics()\n\n    # Generate\
        \ report\n    report = {\n        \\\"timestamp\\\": time.strftime(\\\"%Y-%m-%dT%H:%M:%SZ\\\
        \"),\n        \\\"decisions_run\\\": 1000,\n        \\\"latency_ms\\\": {\n\
        \            \\\"mean\\\": float(sum(latencies)\\ / len(latencies)),\n   \
        \         \\\"p99\\\": float(sorted(latencies)[990]),\n\\            \\\"\
        max\\\": float(max(latencies)),\n        },\n        \\\"brier_score\\\":\
        \ metrics[\\\"calibration\\\"][\\\"overall_brier_score\\\"],\n        \\\"\
        strategy_weights\\\": metrics[\\\"strategy_weights\\\"],\n        \\\"total_decisions\\\
        \": metrics[\\\"total_decisions\\\"],\n    }\n\n    # Save report\n    Path(\\\
        \".codex/reasoning\\\").mkdir(parents=True, exist_ok=True)\n    with open(\\\
        \".codex/reasoning/daily_monitor_report.json\\\", \\\"w\\\") as f:\n     \
        \   json.dump(report, f, indent=2)\n\n    print(json.dumps(report,\\ indent=2))\n\
        \    return report\n\nreport = asyncio.run(run_workload())\n\n# Output for\
        \ next step\nwith open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a')\
        \ as f:\n    f.write(f\"brier_score={report['brier_score']}\\n\")\n    f.write(f\"\
        p99_latency={report['latency_ms']['p99']}\\n\")\n\nEOF"
    - name: Check calibration drift
      id: calibration
      if: always()
      run: "python3 << \"EOF\"\nimport json\nfrom pathlib import Path\n\nreport_file\\\
        \ = Path(\\\".codex/reasoning/daily_monitor_report.json\\\")\nif not report_file.exists():\n\
        \\    print(\\\"No report generated\\\")\n    exit(0)\n\nwith open(report_file)\\\
        \ as f:\n    report = json.load(f)\n\nbrier = report.get(\\\"brier_score\\\
        \",\\ 0.0)\np99 = report.get(\\\"latency_ms\\\", {}).get(\\\"p99\\\", 0.0)\n\
        \nprint(f\\\"Brier Score: {brier:.4f}\\\")\nprint(f\\\"p99 Latency: {p99:.1f}ms\\\
        \")\n\n# Check\\ thresholds\nif brier > 0.20:\n    print(\\\"::warning::Brier\
        \ score exceeded\\ threshold (0.20)\\\")\nif p99 > 500:\n    print(\\\"::warning::p99\
        \ latency exceeded\\ threshold (500ms)\\\")\n\nif brier < 0.15 and p99 < 500:\n\
        \    print(\\\"\u2705 All\\ metrics within target\\\")\n\nEOF"
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: '.codex/reasoning/daily_monitor_report.json

          test_report.json

          '
        name: reasoning-engine-reports
    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2  # v3.0.0
      with:
        path: test_report.json
        reporter: java-junit
        fail-on-error: false
        name: Reasoning Engine Tests
    - name: Slack notification (on failure)
      if: failure()
      uses: slackapi/slack-github-action@70cd7be8e40a46e8ac0db8f384edfaa7eb9e44f7
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: "{\n  \"text\": \"\u274C Reasoning Engine Monitor Failed\",\n  \"\
          blocks\": [\n    {\n      \"type\": \"section\",\n      \"text\": {\n  \
          \      \"type\": \"mrkdwn\",\n        \"text\": \"**Reasoning Engine Monitor**\
          \ failed\\ n*Repository*: ${{ github.repository }}\\n*Run*: <${{ github.server_url\
          \ }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>\"\
          \n      }\n    }\n  ]\n}\n"
    continue-on-error: true
    timeout-minutes: 30
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
