name: Validate Secrets Documentation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/SECRETS_AND_ENVIRONMENT_VARIABLES.md'
      - '.codex/security/secrets_usage_matrix.json'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-secrets-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan workflows for secrets
        id: scan
        run: |
          python3 << 'EOF'
          import json
          import re
          import sys
          from pathlib import Path
          from collections import defaultdict

          workflows_dir = Path(".github/workflows")
          secrets_usage = defaultdict(list)

          # Scan all workflow files
          for workflow_file in workflows_dir.glob("*.yml"):
              content = workflow_file.read_text()
              # Find all secrets references
              for match in re.finditer(r'secrets\.([A-Z_]+)', content):
                  secret_name = match.group(1)
                  if workflow_file.name not in secrets_usage[secret_name]:
                      secrets_usage[secret_name].append(workflow_file.name)

          print(f"Found {len(secrets_usage)} unique secrets")
          
          # Save results
          with open("scanned_secrets.json", "w") as f:
              json.dump(dict(secrets_usage), f, indent=2)
          
          # Output for GitHub Actions
          print(f"::set-output name=secret_count::{len(secrets_usage)}")
          EOF

      - name: Load documented secrets
        id: documented
        run: |
          python3 << 'EOF'
          import re
          from pathlib import Path

          docs_file = Path("docs/SECRETS_AND_ENVIRONMENT_VARIABLES.md")
          content = docs_file.read_text()
          
          # Extract secret names from documentation (looking for #### `SECRET_NAME`)
          documented = set(re.findall(r'####\s+`([A-Z_]+)`', content))
          
          print(f"Found {len(documented)} documented secrets")
          print("Documented secrets:", sorted(documented))
          
          with open("documented_secrets.txt", "w") as f:
              f.write("\n".join(sorted(documented)))
          
          print(f"::set-output name=doc_count::{len(documented)}")
          EOF

      - name: Compare and find undocumented secrets
        id: compare
        run: |
          python3 << 'EOF'
          import json
          import sys

          # Load scanned secrets
          with open("scanned_secrets.json") as f:
              scanned = set(json.load(f).keys())
          
          # Load documented secrets
          with open("documented_secrets.txt") as f:
              documented = set(line.strip() for line in f if line.strip())
          
          # Find undocumented secrets
          undocumented = scanned - documented
          
          # Exclude GITHUB_TOKEN as it's auto-managed
          undocumented.discard("GITHUB_TOKEN")
          
          if undocumented:
              print(f"❌ Found {len(undocumented)} undocumented secrets:")
              for secret in sorted(undocumented):
                  print(f"  - {secret}")
              
              # Save for issue creation
              with open("undocumented_secrets.txt", "w") as f:
                  f.write("\n".join(sorted(undocumented)))
              
              print(f"::set-output name=has_undocumented::true")
              print(f"::set-output name=undocumented_count::{len(undocumented)}")
              sys.exit(1)
          else:
              print("✅ All secrets are documented!")
              print(f"::set-output name=has_undocumented::false")
              print(f"::set-output name=undocumented_count::0")
          EOF

      - name: Create issue for undocumented secrets
        if: failure() && steps.compare.outputs.has_undocumented == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const undocumented = fs.readFileSync('undocumented_secrets.txt', 'utf8').trim().split('\n');
            
            const body = `## 🔒 Undocumented Secrets Detected

            **Workflow**: Validate Secrets Documentation
            **Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Branch**: ${{ github.ref_name }}

            ### Undocumented Secrets (${undocumented.length})

            The following secrets are used in workflows but not documented in \`docs/SECRETS_AND_ENVIRONMENT_VARIABLES.md\`:

            ${undocumented.map(s => `- \`${s}\``).join('\n')}

            ### Action Required

            1. **Document each secret** in \`docs/SECRETS_AND_ENVIRONMENT_VARIABLES.md\`:
               - Purpose
               - Format
               - Used In (workflows)
               - Security Level
               - Required (Yes/No)
               - Rotation schedule

            2. **Update secrets usage matrix**: \`.codex/security/secrets_usage_matrix.json\`

            3. **Add to rotation schedule**: \`.codex/security/rotation_schedule.md\`

            ### Documentation Template

            \`\`\`markdown
            #### \`SECRET_NAME\`
            - **Purpose**: [Description of what this secret is used for]
            - **Format**: [Format description, e.g., "API key string", "Base64-encoded key"]
            - **Used In**: [List of workflows]
            - **Generation**: [Command or process to generate]
            - **Security Level**: [CRITICAL/HIGH/MEDIUM/LOW]
            - **Required**: [Yes/No]
            - **Rotation**: [Frequency, e.g., "Every 90 days"]
            \`\`\`

            ### References

            - Secrets Documentation: \`docs/SECRETS_AND_ENVIRONMENT_VARIABLES.md\`
            - Usage Matrix: \`.codex/security/secrets_usage_matrix.json\`
            - Rotation Schedule: \`.codex/security/rotation_schedule.md\`

            ---
            *This issue was automatically created by the secrets validation workflow. Close this issue after documenting all secrets.*`;

            // Check if similar issue exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,undocumented-secrets'
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔒 Undocumented Secrets Detected in Workflows',
                body: body,
                labels: ['security', 'undocumented-secrets', 'documentation']
              });
              console.log('Created new issue for undocumented secrets');
            } else {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `### Update: ${new Date().toISOString()}\n\n${body}`
              });
              console.log(`Updated existing issue #${issues.data[0].number}`);
            }

      - name: Comment on PR if undocumented secrets found
        if: failure() && github.event_name == 'pull_request' && steps.compare.outputs.has_undocumented == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const undocumented = fs.readFileSync('undocumented_secrets.txt', 'utf8').trim().split('\n');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ Undocumented Secrets Detected

              This PR introduces or modifies workflows that reference ${undocumented.length} undocumented secret(s):

              ${undocumented.map(s => `- \`${s}\``).join('\n')}

              **Action Required**: Please document these secrets in \`docs/SECRETS_AND_ENVIRONMENT_VARIABLES.md\` before merging.

              See the [secrets documentation guide](../blob/main/docs/SECRETS_AND_ENVIRONMENT_VARIABLES.md) for the required format.`
            });

      - name: Success summary
        if: success()
        run: |
          echo "✅ All secrets are properly documented!"
          echo ""
          echo "Summary:"
          echo "  - Scanned secrets: ${{ steps.scan.outputs.secret_count }}"
          echo "  - Documented secrets: ${{ steps.documented.outputs.doc_count }}"
          echo "  - Undocumented: 0"
