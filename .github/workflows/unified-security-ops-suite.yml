name: unified-security-ops-suite

on:
  push:
    branches:
      - main
    paths:
      - security/**
      - src/**
      - .github/workflows/security-*.yml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - security/**
      - src/**
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: false
        default: all
        type: choice
        options:
          - all
          - alert-notify
          - copilot-commands
          - findings-api
          - findings-handoff
          - pr-enhancement
          - scan-phase-16
          - tools-bootstrap

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write
  pull-requests: write
  security-events: read
  id-token: write

jobs:
  security-preflight:
    name: Security preflight (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_path: ${{ steps.prepare.outputs.artifact_path }}
      status: ${{ steps.prepare.outputs.status }}
      generated_at: ${{ steps.prepare.outputs.generated_at }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare generated findings artifact
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex
          artifact_path=".codex/security-findings-comprehensive.json"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ ! -f "$artifact_path" ]; then
            cat > "$artifact_path" <<JSON
          {
            "scan_metadata": {
              "timestamp": "$generated_at",
              "repository": "${GITHUB_REPOSITORY}",
              "run_id": "${GITHUB_RUN_ID}"
            },
            "summary": {
              "total_findings": 0,
              "critical_count": 0,
              "high_count": 0,
              "medium_count": 0,
              "low_count": 0,
              "info_count": 0
            },
            "findings_by_severity": {
              "CRITICAL": [],
              "HIGH": [],
              "MEDIUM": [],
              "LOW": [],
              "INFO": []
            },
            "findings_by_tool": {},
            "finding_index": []
          }
          JSON
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/security-findings-comprehensive.json')
          if not path.exists():
              raise SystemExit('artifact missing after preflight')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(payload, dict) or not isinstance(payload.get('summary'), dict):
              raise SystemExit('artifact root is not a valid findings summary object')
          PY
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "status=validated" >> "$GITHUB_OUTPUT"
          echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
          echo "## Security preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact path: $artifact_path" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generated at: $generated_at" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: validated" >> "$GITHUB_STEP_SUMMARY"

  security-live-reconciliation:
    name: Live GitHub security reconciliation (enforcement)
    needs: security-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      total_live_alerts: ${{ steps.reconcile.outputs.total_live_alerts }}
      status: ${{ steps.reconcile.outputs.status }}
      delta: ${{ steps.reconcile.outputs.delta }}
      default_branch_only: ${{ steps.reconcile.outputs.default_branch_only }}
      source_of_truth: ${{ steps.reconcile.outputs.source_of_truth }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log token fallback tier
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.CODEX_MASTER_KEY }}" ]; then
            TOKEN_TIER="TIER_1_MASTER_KEY"
          elif [ -n "${{ secrets.CODEX_BACKUP_KEY }}" ]; then
            TOKEN_TIER="TIER_2_BACKUP_KEY"
          else
            TOKEN_TIER="TIER_3_GITHUB_TOKEN"
          fi
          echo "[TELEMETRY] workflow=unified-security-ops-suite | job=security-live-reconciliation | event=token-selection | tier=${TOKEN_TIER}"
          echo "## 🔑 Token fallback tier" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected tier: \`${TOKEN_TIER}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile live repo security state
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s ".codex/security-findings-comprehensive.json" ]; then
            echo "::error::Missing required artifact: .codex/security-findings-comprehensive.json"
            exit 1
          fi
          python scripts/ci/reconcile_live_security.py \
            --repo "${GITHUB_REPOSITORY}" \
            --artifact ".codex/security-findings-comprehensive.json" \
            --output ".codex/live-security-reconciliation.json" \
            --markdown ".codex/live-security-reconciliation.md" \
            --strict-artifact \
            --require-live-source \
            --fail-on-delta
          if [ ! -s ".codex/live-security-reconciliation.json" ] || [ ! -s ".codex/live-security-reconciliation.md" ]; then
            echo "::error::Live security reconciliation output is missing or empty."
            exit 1
          fi
          total_live_alerts=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          if not path.exists():
              print('0')
          else:
              payload = json.loads(path.read_text(encoding='utf-8'))
              print(payload.get('total_open_alerts', 0))
          PY
          )
          delta=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          if not path.exists():
              print('0')
          else:
              payload = json.loads(path.read_text(encoding='utf-8'))
              print(payload.get('delta', {}).get('total_findings', 0))
          PY
          )
          default_branch_only=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          if not path.exists():
              print('false')
          else:
              payload = json.loads(path.read_text(encoding='utf-8'))
              print('true' if payload.get('default_branch_only') else 'false')
          PY
          )
          source_of_truth=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          payload = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'source_of_truth': 'artifact'}
          print(payload.get('source_of_truth', 'artifact'))
          PY
          )
          status=$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.codex/live-security-reconciliation.json')
          payload = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'status': 'clean'}
          print(payload.get('status', 'clean'))
          PY
          )
          echo "total_live_alerts=$total_live_alerts" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "source_of_truth=$source_of_truth" >> "$GITHUB_OUTPUT"
          echo "delta=$delta" >> "$GITHUB_OUTPUT"
          echo "default_branch_only=$default_branch_only" >> "$GITHUB_OUTPUT"
          echo "## Live security reconciliation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Default branch only: $default_branch_only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source of truth: $source_of_truth" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: $status" >> "$GITHUB_STEP_SUMMARY"
          cat ".codex/live-security-reconciliation.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reconciliation artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: live-security-reconciliation
          path: |
            .codex/security-findings-comprehensive.json
            .codex/live-security-reconciliation.json
            .codex/live-security-reconciliation.md
          if-no-files-found: error

  security-summary:
    name: Security Operations Summary
    needs:
      - security-preflight
      - security-live-reconciliation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish final summary
        shell: bash
        run: |
          set -euo pipefail
          echo "## Unified Security Operations Suite Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact path: ${{ needs.security-preflight.outputs.artifact_path }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source of truth: ${{ needs.security-live-reconciliation.outputs.source_of_truth }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reconciliation status: ${{ needs.security-live-reconciliation.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live open alerts: ${{ needs.security-live-reconciliation.outputs.total_live_alerts }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reconciliation delta: ${{ needs.security-live-reconciliation.outputs.delta }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.security-live-reconciliation.outputs.status }}" = "clean" ] || [ "${{ needs.security-live-reconciliation.outputs.total_live_alerts }}" = "0" ]; then
            echo "- Action required: no" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Action required: yes" >> "$GITHUB_STEP_SUMMARY"
          fi
