name: Performance Gate
on:
  workflow_dispatch: null
  pull_request:
    paths:
    - src/**
    - benchmarks/**
    - codex_ml/**
  schedule:
  - cron: 30 4 * * 1-5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  performance-gate:
    if: ${{ github.event.pull_request.number != 5328 }}
    name: Latency Baseline Policy Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13

    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install pyyaml

        '
    - name: Validate baseline exists
      run: "if [ ! -f benchmarks/perf/latency_baseline.json ]; then\n  echo \"::error::Missing\
        \ benchmarks/perf/latency_baseline.json\"\n  exit 1\nfi\n"
    - name: Run baseline policy check
      run: "python -c \"\nimport json, sys\n\nwith open('benchmarks/perf/latency_baseline.json')\
        \ as f:\n    data = json.load(f)\n\nfailed = []\nfor bench in data['benchmarks']:\n\
        \    name = bench['name']\n    baseline = bench['baseline']\n    threshold\
        \ = bench['threshold']\n    if baseline > threshold:\n        failed.append(f'{name}:\
        \ baseline {baseline} > threshold {threshold}')\n    print(f'  \u2705 {name}:\
        \ {baseline} {bench[\\\"unit\\\"]} (threshold: {threshold})')\n\nif failed:\n\
        \    print()\n    for f in failed:\n        print(f'  \u274C {f}')\n    sys.exit(1)\n\
        \nprint()\nprint(f'  All {len(data[\\\"benchmarks\\\"])} benchmarks within\
        \ thresholds.')\n\"\n"
    - name: Upload baseline artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: benchmarks/perf/latency_baseline.json
        retention-days: 90
        name: perf-baseline
    timeout-minutes: 45
