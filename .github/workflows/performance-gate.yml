# D10 Performance Gate — Latency Baseline Policy Validation
#
# Runs on PR and nightly schedule. Validates the committed
# latency baseline policy in benchmarks/perf/latency_baseline.json.

name: Performance Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "benchmarks/**"
      - "codex_ml/**"
  schedule:
    - cron: "30 4 * * 1-5"  # Weekdays 04:30 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  performance-gate:
    name: Latency Baseline Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate baseline exists
        run: |
          if [ ! -f benchmarks/perf/latency_baseline.json ]; then
            echo "::error::Missing benchmarks/perf/latency_baseline.json"
            exit 1
          fi

      - name: Run baseline policy check
        run: |
          python -c "
          import json, sys

          with open('benchmarks/perf/latency_baseline.json') as f:
              data = json.load(f)

          failed = []
          for bench in data['benchmarks']:
              name = bench['name']
              baseline = bench['baseline']
              threshold = bench['threshold']
              if baseline > threshold:
                  failed.append(f'{name}: baseline {baseline} > threshold {threshold}')
              print(f'  ✅ {name}: {baseline} {bench[\"unit\"]} (threshold: {threshold})')

          if failed:
              print()
              for f in failed:
                  print(f'  ❌ {f}')
              sys.exit(1)

          print()
          print(f'  All {len(data[\"benchmarks\"])} benchmarks within thresholds.')
          "

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: perf-baseline
          path: benchmarks/perf/latency_baseline.json
          retention-days: 90
