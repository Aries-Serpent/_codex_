name: Security Scan

on:
  push:
    branches: [main, copilot/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays at midnight UTC

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space for CI
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h

          # Remove unnecessary packages to free space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean apt caches
          sudo apt-get clean

          # Remove Docker images if present
          docker rmi $(docker images -q) 2>/dev/null || true

          echo "=== Disk usage after cleanup ==="
          df -h

      - uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'live'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt -o bandit-report.txt || true
          if [ -f bandit-report.txt ]; then
            cat bandit-report.txt
          fi

      - name: Run Safety check for known vulnerabilities
        run: |
          pip install safety
          safety check --json --output safety-report.json || true
          safety check --output safety-report.txt || true
          if [ -f safety-report.txt ]; then
            cat safety-report.txt
          fi

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --format json --output pip-audit-report.json || true
          pip-audit --format text --output pip-audit-report.txt || true
          if [ -f pip-audit-report.txt ]; then
            cat pip-audit-report.txt
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            *-report.json
            *-report.txt
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          echo "Security scan complete. Check uploaded artifacts for detailed reports."
          if [ -f bandit-report.json ]; then
            CRITICAL=$(jq -r '.results[] | select(.issue_severity=="HIGH") | .issue_text' bandit-report.json 2>/dev/null | wc -l || echo "0")
            if [ "$CRITICAL" -gt "0" ]; then
              echo "⚠️  Found $CRITICAL high-severity security issues"
            fi
          fi
