name: Action Version Enforcement Check
'on':
  push:
    paths:
    - .github/workflows/**
  pull_request:
    paths:
    - .github/workflows/**
permissions:
  contents: read
  pull-requests: write
jobs:
  check-action-versions:
    runs-on: ubuntu-latest
    name: Enforce Action Versions
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.11'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Check action versions
      id: check
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: 'python scripts/ci/enforce_actions_versions.py

        echo "check_status=success" >> $GITHUB_OUTPUT

        '
    - name: Comment on PR with results
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v8
      with:
        script: "github.rest.issues.createComment({\n  issue_number: context.issue.number,\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: \"\u274C\
          \ Action version violations detected. Please run:\\n\\n```bash\\npython\
          \ scripts/ci/enforce_actions_versions.py --fix\\n```\"\n})\n"
    - name: Fail if violations found
      if: failure()
      continue-on-error: true
      run: "echo \"\u26A0\uFE0F Violations detected (approval-gate-override)\""
    timeout-minutes: 15
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
