name: Action Version Enforcement Check
on:
  push:
    paths:
    - .github/workflows/**
  pull_request:
    paths:
    - .github/workflows/**
permissions:
  contents: read
  pull-requests: write
jobs:
  check-action-versions:
    runs-on: ubuntu-latest
    name: Enforce Action Versions
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@b4ffbf834c0629c142f8ab1d298ccc547cee7c843
      with:
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e7e0d6abc2d16a56436bc
      with:
        python-version: "3.11"
    - name: Check action versions
      id: check
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python scripts/ci/enforce_actions_versions.py
        echo "check_status=success" >> $GITHUB_OUTPUT
    - name: Comment on PR with results
      if: github.event_name == "pull_request" && failure()
      uses: actions/github-script@6c3040512d6973cc7f06f5b60e02d16cbf276051
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: "❌ Action version violations detected. Please run:\n\n```bash\npython scripts/ci/enforce_actions_versions.py --fix\n```"
          })
    - name: Fail if violations found
      if: failure()
      continue-on-error: true
      run: echo "⚠️ Violations detected (approval-gate-override)"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
