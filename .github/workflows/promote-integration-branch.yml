name: "\U0001F680 Promote Commit SHA to Target Branch"
true:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Commit SHA to push to the target branch (default: resolve from
          source_branch)'
        required: false
        default: ''
      source_branch:
        description: Source branch used to resolve SHA when source_sha is empty
        required: false
        default: copilot/update-ci-failure-rate-and-confirm-transition
      target_branch:
        description: Branch to create/update from source SHA
        required: false
        default: 0D_base_
      pr_base_branch:
        description: Base branch for optional PR creation/update
        required: false
        default: main
      pr_title:
        description: PR title (used when create_or_update_pr=true)
        required: false
        default: "promote(S174): 0D_base_ \u2192 main \u2014 S174 consolidation +\
          \ Agent Token Delegation"
      session_label:
        description: Session label for PR body (e.g. 'S174', 'S137'). Defaults to
          'S174' for backward compatibility.
        required: false
        default: S174
      create_or_update_pr:
        description: Create or update a PR from target_branch to pr_base_branch
        required: false
        default: true
        type: boolean
      force_recreate:
        description: Delete and recreate target_branch if it already exists
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  promote:
    name: Create/update target branch and optional PR
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Install package (for mcp_poster CLI)
      run: pip install -e . --quiet
    - name: Resolve source SHA
      id: resolve_sha
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        SOURCE_BRANCH: ${{ inputs.source_branch }}
      run: "if [ -n \"${SOURCE_SHA}\" ]; then\n  echo \"sha=${SOURCE_SHA}\" >> \"\
        $GITHUB_OUTPUT\"\n  echo \"\u2705 Using provided SHA: ${SOURCE_SHA}\"\nelse\n\
        \  # Resolve SHA from branch name\n  SHA=$(gh api \"repos/${{ github.repository\
        \ }}/git/ref/heads/${SOURCE_BRANCH}\" \\\n    --jq '.object.sha' 2>/dev/null\
        \ || true)\n  if [ -z \"${SHA}\" ]; then\n    echo \"\u274C Could not resolve\
        \ SHA for branch '${SOURCE_BRANCH}'\" >&2\n    exit 1\n  fi\n  echo \"sha=${SHA}\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"\u2705 Resolved ${SOURCE_BRANCH} \u2192\
        \ ${SHA}\"\nfi\n"
    - name: Delete existing target branch (force recreate)
      if: inputs.force_recreate
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "TARGET_BRANCH=\"${{ inputs.target_branch }}\"\nif gh api \"repos/${{ github.repository\
        \ }}/git/ref/heads/${TARGET_BRANCH}\" > /dev/null 2>&1; then\n  gh api \"\
        repos/${{ github.repository }}/git/refs/heads/${TARGET_BRANCH}\" \\\n    --method\
        \ DELETE && echo \"\u2705 Deleted existing ${TARGET_BRANCH}\"\nelse\n  echo\
        \ \"\u2139\uFE0F  ${TARGET_BRANCH} does not exist \u2014 nothing to delete\"\
        \nfi\n"
    - name: Create or update target branch
      id: create_branch
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        SHA: ${{ steps.resolve_sha.outputs.sha }}
      run: "# Pattern C: retry with exponential backoff for PATCH ref updates\n_api_with_retry()\
        \ {\n  local attempt=0\n  local max_attempts=3\n  while [ $attempt -lt $max_attempts\
        \ ]; do\n    if \"$@\"; then\n      return 0\n    fi\n    attempt=$(( attempt\
        \ + 1 ))\n    local backoff=$(( 2 ** attempt * 5 ))  # attempt 1\u219210s,\
        \ attempt 2\u219220s (3 total attempts: 0,1,2)\n    echo \"::warning::API\
        \ call failed (attempt $attempt/$max_attempts) \u2014 retrying in ${backoff}s\"\
        \n    sleep \"$backoff\"\n  done\n  echo \"::error::API call failed after\
        \ $max_attempts attempts\"\n  return 1\n}\n\nTARGET_BRANCH=\"${{ inputs.target_branch\
        \ }}\"\n# Try to create the branch; if it already exists, update it via PATCH\n\
        python -m codex.github.mcp_poster create-branch \\\n  --repo \"${{ github.repository\
        \ }}\" \\\n  --ref \"refs/heads/${TARGET_BRANCH}\" \\\n  --sha \"${SHA}\"\
        \ 2>&1 || {\n  EXIT=$?\n  echo \"create-branch returned $EXIT \u2014 branch\
        \ may already exist\"\n  # Fall back to force-update via gh api PATCH (with\
        \ retry)\n  if [ \"$EXIT\" -ne 0 ]; then\n    if _api_with_retry gh api \"\
        repos/${{ github.repository }}/git/refs/heads/${TARGET_BRANCH}\" \\\n    \
        \  --method PATCH \\\n      -H \"Accept: application/vnd.github+json\" \\\n\
        \      -f sha=\"${SHA}\" \\\n      -f force=true; then\n      echo \"\u2705\
        \ Force-updated ${TARGET_BRANCH} \u2192 ${SHA}\"\n    else\n      echo \"\u274C\
        \ Failed to create or update ${TARGET_BRANCH} after retries\" >&2\n      exit\
        \ 1\n    fi\n  fi\n}\necho \"branch_sha=${SHA}\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Check for existing PR
      id: check_pr
      if: inputs.create_or_update_pr
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "TARGET_BRANCH=\"${{ inputs.target_branch }}\"\nBASE_BRANCH=\"${{ inputs.pr_base_branch\
        \ }}\"\nEXISTING=$(gh pr list \\\n  --repo \"${{ github.repository }}\" \\\
        \n  --head \"${TARGET_BRANCH}\" \\\n  --base \"${BASE_BRANCH}\" \\\n  --state\
        \ open \\\n  --json number \\\n  --jq '.[0].number' 2>/dev/null || echo \"\
        \")\necho \"existing_pr=${EXISTING}\" >> \"$GITHUB_OUTPUT\"\nif [ -n \"${EXISTING}\"\
        \ ]; then\n  echo \"\u2139\uFE0F  Existing promotion PR  #${EXISTING} found\"\
        \nelse\n  echo \"\u2139\uFE0F  No existing promotion PR \u2014 will create\
        \ one\"\nfi\n"
    - name: Open promotion PR
      if: inputs.create_or_update_pr && steps.check_pr.outputs.existing_pr == ''
      id: create_pr
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        SHA: ${{ steps.resolve_sha.outputs.sha }}
        PR_TITLE: ${{ inputs.pr_title }}
        SESSION_LABEL: ${{ inputs.session_label }}
      run: "# Build PR body with variable concatenation to avoid shellcheck SC2215\n\
        # (printf multi-arg form with lines starting '-' is mis-flagged as a flag).\n\
        TARGET_BRANCH=\"${{ inputs.target_branch }}\"\nBASE_BRANCH=\"${{ inputs.pr_base_branch\
        \ }}\"\nPR_BODY=\"## \U0001F680 ${SESSION_LABEL} Promotion: \\`${TARGET_BRANCH}\\\
        ` \u2192 \\`${BASE_BRANCH}\\`\"$'\\n'\nPR_BODY+=\"\"$'\\n'\nPR_BODY+=\"This\
        \ PR promotes the **${SESSION_LABEL} integration branch** (\\`${TARGET_BRANCH}\\\
        `) into \\`${BASE_BRANCH}\\`.\"$'\\n'\nPR_BODY+=\"\"$'\\n'\nPR_BODY+=\"###\
        \ Contents\"$'\\n'\nPR_BODY+=\"- See PR title and session notes for ${SESSION_LABEL}\
        \ contents\"$'\\n'\nPR_BODY+=\"\"$'\\n'\nPR_BODY+=\"### Branch created from\"\
        $'\\n'\nPR_BODY+=\"\\`${SHA}\\` (\\`${{ inputs.source_branch }}\\` @ ${SESSION_LABEL})\"\
        $'\\n'\nPR_BODY+=\"\"$'\\n'\nPR_BODY+=\"### Architecture\"$'\\n'\nPR_BODY+=\"\
        \\`\\`\\`\"$'\\n'\nPR_BODY+=\"${{ inputs.source_branch }}  \u2500\u2500\u25BA\
        \  ${TARGET_BRANCH}  \u2500\u2500\u25BA  ${BASE_BRANCH}\"$'\\n'\nPR_BODY+=\"\
        \              (${SESSION_LABEL} session)            (this PR)\"$'\\n'\nPR_BODY+=\"\
        \\`\\`\\`\"$'\\n'\nPR_BODY+=\"\"$'\\n'\nPR_BODY+=\"---\"$'\\n'\nPR_BODY+=\"\
        _Auto-created by \\`promote-integration-branch.yml\\` workflow_\"$'\\n'\n\
        PR_BODY+=\"_Source: \\`mcp_poster create-branch\\` + \\`create-pr\\` (${SESSION_LABEL})_\"\
        $'\\n'\nPR_BODY+=\"\"$'\\n'\nPR_BODY+=\"---\"$'\\n'\nPR_BODY+=\"\"$'\\n'\n\
        PR_BODY+=\"**\U0001F504 Workflow Execution Checklist**:\"$'\\n'\nPR_BODY+=\"\
        \"$'\\n'\nPR_BODY+=\"\U0001F510 Agent Token Delegation\"$'\\n'\nPR_BODY+=\"\
        - [x] \U0001F510 Enable Agent Token Delegation (\\`COPILOT_AGENT_AUTH_ENABLED\\\
        `)\"$'\\n'\nPR_BODY+=\"- [ ] \U0001F4B0 Cost Proposal Approved\"$'\\n'\nPR_BODY+=\"\
        - [ ] \U0001F504 Auto-Post @copilot review After Agent Session\"$'\\n'\n\n\
        GH_TOKEN=\"${CODEX_MASTER_KEY}\" gh pr create \\\n  --repo \"${{ github.repository\
        \ }}\" \\\n  --title \"${PR_TITLE}\" \\\n  --body \"${PR_BODY}\" \\\n  --head\
        \ \"${TARGET_BRANCH}\" \\\n  --base \"${BASE_BRANCH}\"\n"
    - name: Update existing promotion PR (title + body)
      if: inputs.create_or_update_pr && steps.check_pr.outputs.existing_pr != ''
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        SHA: ${{ steps.resolve_sha.outputs.sha }}
        PR_TITLE: ${{ inputs.pr_title }}
        SESSION_LABEL: ${{ inputs.session_label }}
      run: "PR_NUM=\"${{ steps.check_pr.outputs.existing_pr }}\"\nTARGET_BRANCH=\"\
        ${{ inputs.target_branch }}\"\nBASE_BRANCH=\"${{ inputs.pr_base_branch }}\"\
        \n# Build PR body with variable concatenation to avoid shellcheck SC2215.\n\
        PR_BODY=\"## \U0001F680 ${SESSION_LABEL} Promotion (updated): \\`${TARGET_BRANCH}\\\
        ` \u2192 \\`${BASE_BRANCH}\\`\"$'\\n'\nPR_BODY+=\"\"$'\\n'\nPR_BODY+=\"This\
        \ PR promotes the **${SESSION_LABEL} integration branch** (\\`${TARGET_BRANCH}\\\
        `) into \\`${BASE_BRANCH}\\`.\"$'\\n'\nPR_BODY+=\"PR updated automatically\
        \ \u2014 latest ${TARGET_BRANCH} SHA: \\`${SHA}\\`.\"$'\\n'\nPR_BODY+=\"\"\
        $'\\n'\nPR_BODY+=\"---\"$'\\n'\nPR_BODY+=\"\"$'\\n'\nPR_BODY+=\"**\U0001F504\
        \ Workflow Execution Checklist**:\"$'\\n'\nPR_BODY+=\"\"$'\\n'\nPR_BODY+=\"\
        \U0001F510 Agent Token Delegation\"$'\\n'\nPR_BODY+=\"- [x] \U0001F510 Enable\
        \ Agent Token Delegation (\\`COPILOT_AGENT_AUTH_ENABLED\\`)\"$'\\n'\nPR_BODY+=\"\
        - [x] \U0001F4B0 Cost Proposal Approved\"$'\\n'\nPR_BODY+=\"- [ ] \U0001F504\
        \ Auto-Post @copilot review After Agent Session\"$'\\n'\n\ngh pr edit \"${PR_NUM}\"\
        \ \\\n  --repo \"${{ github.repository }}\" \\\n  --title \"${PR_TITLE}\"\
        \ \\\n  --body \"${PR_BODY}\"\necho \"\u2705 Updated existing PR  #${PR_NUM}\
        \ title and body\"\n"
    - name: Summary
      if: always()
      run: "echo \"## \U0001F680 Commit SHA Branch Promotion\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"| Item | Value |\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"|------|-------|\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"| Target branch\
        \ | \\`${{ inputs.target_branch }}\\` |\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"| Target SHA | \\`${{ steps.resolve_sha.outputs.sha }}\\` |\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"| Base branch | \\`${{ inputs.pr_base_branch }}\\` |\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"| Source branch | \\`${{ inputs.source_branch }}\\` |\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"| Existing PR | \\`${{ steps.check_pr.outputs.existing_pr || 'none'\
        \ }}\\` |\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"### Next Steps\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"1. Confirm target\
        \ branch update result\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"2. If PR mode\
        \ enabled, review and merge \\`${{ inputs.target_branch }}\\` \u2192 \\`${{\
        \ inputs.pr_base_branch }}\\`\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"3. Agent\
        \ Token Delegation activates automatically after PR description triggers \\\
        `agent-auth-delegation.yml\\`\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
