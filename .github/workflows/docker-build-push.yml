name: CI - Build, Smoke Test, and Push Docker (GHCR) — OWNER APPROVED (NO-MARKETPLACE)
on:
  push:
    branches:
    - main
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  pull_request:
    branches:
    - main
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  workflow_dispatch:
    inputs:
      approval_duration:
        description: OWNER_APPROVED_DURATION (e.g., "24h")
        required: false
        default: ''
      approval_until:
        description: OWNER_APPROVED_UNTIL (ISO8601 Z, e.g., "2025-10-21T00:00:00Z")
        required: false
        default: ''
      push_platforms:
        description: PUSH_PLATFORMS (e.g., "linux/amd64,linux/arm64")
        required: false
        default: ''
      check_only:
        type: boolean
        description: Run approval check only (skip build and push)
        required: false
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  OWNER_APPROVED_DURATION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.approval_duration
    != '' && github.event.inputs.approval_duration || vars.OWNER_APPROVED_DURATION
    }}
  OWNER_APPROVED_UNTIL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.approval_until
    != '' && github.event.inputs.approval_until || vars.OWNER_APPROVED_UNTIL }}
  PUSH_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.push_platforms
    != '' && github.event.inputs.push_platforms || vars.PUSH_PLATFORMS }}
  BUILDX_CACHE_DIR: /var/tmp/codex-buildx-cache
jobs:
  cost-gate:
    name: 💰 Cost Gate
    uses: ./.github/workflows/cost-gate.yml
    with:
      workflow_name: Build & Push Docker (GHCR)
      runner: self-hosted
      timeout_minutes: 45
      matrix_count: 1
      pushes_to_ghcr: true
  approval-check:
    needs: cost-gate
    name: Owner approval — check-only gate
    runs-on:
    - self-hosted
    - linux
    timeout-minutes: 10
    steps:
    - name: Raw checkout (git)
      shell: bash
      run: bash scripts/ci/raw_checkout.sh
    - name: Show owner approval context
      shell: bash
      run: "echo \"OWNER_APPROVED_UNTIL=${OWNER_APPROVED_UNTIL}\"\necho \"OWNER_APPROVED_DURATION=${OWNER_APPROVED_DURATION}\"\
        \nif [ -f .github/OWNER_APPROVAL.yml ]; then\n  echo \".github/OWNER_APPROVAL.yml\
        \ present\"\nelse\n  echo \".github/OWNER_APPROVAL.yml missing\"\nfi\n"
    - name: Evaluate owner approval (guard)
      shell: bash
      run: bash scripts/ci/owner_approval_guard.sh
      env:
        TOOL_KEY: docker-build-push
        OWNER_APPROVED_UNTIL: ${{ env.OWNER_APPROVED_UNTIL }}
        OWNER_APPROVED_DURATION: ${{ env.OWNER_APPROVED_DURATION }}
    - name: Write approval status to summary
      shell: bash
      run: bash scripts/ci/owner_approval_summary.sh docker-build-push
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  build-and-smoke:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (github.event.inputs.check_only
      == 'true' || github.event.inputs.check_only == true)) }}
    needs:
    - cost-gate
    - approval-check
    name: Build image and run smoke test
    runs-on:
    - self-hosted
    - linux
    timeout-minutes: 45
    steps:
    - name: Raw checkout (git)
      shell: bash
      run: bash scripts/ci/raw_checkout.sh
    - name: Show owner approval context (no-op)
      shell: bash
      run: "echo \"OWNER_APPROVED_UNTIL=${OWNER_APPROVED_UNTIL}\"\necho \"OWNER_APPROVED_DURATION=${OWNER_APPROVED_DURATION}\"\
        \nif [ -f .github/OWNER_APPROVAL.yml ]; then\n  echo \".github/OWNER_APPROVAL.yml\
        \ present\"\nelse\n  echo \".github/OWNER_APPROVAL.yml missing\"\nfi\n"
    - name: Show owner approval status (helper)
      shell: bash
      run: bash scripts/ci/owner_approval_summary.sh docker-build-push || true
    - name: Check OWNER approval window
      shell: bash
      run: bash scripts/ci/owner_approval_guard.sh
      env:
        TOOL_KEY: docker-build-push
        OWNER_APPROVED_UNTIL: ${{ env.OWNER_APPROVED_UNTIL }}
        OWNER_APPROVED_DURATION: ${{ env.OWNER_APPROVED_DURATION }}
    - name: Ensure Buildx and builder
      shell: bash
      run: 'set -euo pipefail

        bash scripts/ci/buildx_setup.sh

        '
    - name: Set up QEMU (optional for multi-arch)
      if: env.PUSH_PLATFORMS != ''
      shell: bash
      run: 'set -euo pipefail

        bash scripts/ci/qemu_setup.sh

        '
    - name: Restore local buildx cache directory (best-effort)
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "${BUILDX_CACHE_DIR}"

        '
    - name: Build image (local load for smoke test) with cache and OCI labels
      shell: bash
      run: "set -euo pipefail\nSRC=\"${BUILDX_CACHE_DIR}\"\nDST=\"${BUILDX_CACHE_DIR}.new\"\
        \nrm -rf \"${DST}\"\ndocker buildx build \\\n  --file Dockerfile \\\n  --tag\
        \ codex:ci \\\n  --load \\\n  --label \"org.opencontainers.image.source=${{\
        \ github.server_url }}/${{ github.repository }}\" \\\n  --label \"org.opencontainers.image.revision=${{\
        \ github.sha }}\" \\\n  --label \"org.opencontainers.image.ref.name=${{ github.ref_name\
        \ }}\" \\\n  --cache-from \"type=local,src=${SRC}\" \\\n  --cache-to \"type=local,dest=${DST},mode=max\"\
        \ \\\n  .\nrm -rf \"${SRC}\"\nmv \"${DST}\" \"${SRC}\"\n"
    - name: Smoke test container
      shell: bash
      run: bash scripts/ci/container_smoke.sh codex:ci 8000 18000
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  push:
    if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch'
      && (github.event.inputs.check_only == 'true' || github.event.inputs.check_only
      == true)) }}
    name: Push image to GHCR (on main)
    needs:
    - build-and-smoke
    runs-on:
    - self-hosted
    - linux
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
    - name: Raw checkout (git)
      shell: bash
      run: bash scripts/ci/raw_checkout.sh
    - name: Ensure Buildx and builder
      shell: bash
      run: 'set -euo pipefail

        bash scripts/ci/buildx_setup.sh

        '
    - name: Set up QEMU (optional for multi-arch)
      if: env.PUSH_PLATFORMS != ''
      shell: bash
      run: 'set -euo pipefail

        bash scripts/ci/qemu_setup.sh

        '
    - name: Derive tags (lowercase for GHCR)
      id: vars
      shell: bash
      run: "set -euo pipefail\nREPO_IMAGE=\"ghcr.io/${{ github.repository }}\"\nREPO_IMAGE_LC=\"\
        $(echo \"${REPO_IMAGE}\" | tr '[:upper:]' '[:lower:]')\"\nSHA_TAG=\"${REPO_IMAGE_LC}:sha-${GITHUB_SHA::12}\"\
        \nBRANCH=\"${GITHUB_REF_NAME}\"\nif [ \"${BRANCH}\" = \"main\" ]; then\n \
        \ BRANCH_TAG=\"${REPO_IMAGE_LC}:latest\"\nelse\n  SAFE_BRANCH=\"${BRANCH//\\\
        //-}\"\n  SAFE_BRANCH_LC=\"$(echo \"${SAFE_BRANCH}\" | tr '[:upper:]' '[:lower:]')\"\
        \n  BRANCH_TAG=\"${REPO_IMAGE_LC}:${SAFE_BRANCH_LC}\"\nfi\n{\n  echo \"image_sha=${SHA_TAG}\"\
        \n  echo \"image_branch=${BRANCH_TAG}\"\n} >> \"${GITHUB_OUTPUT}\"\n"
    - name: Check OWNER approval window (push)
      shell: bash
      run: bash scripts/ci/owner_approval_guard.sh
      env:
        TOOL_KEY: docker-build-push
        OWNER_APPROVED_UNTIL: ${{ env.OWNER_APPROVED_UNTIL }}
        OWNER_APPROVED_DURATION: ${{ env.OWNER_APPROVED_DURATION }}
    - name: Show owner approval status (helper, push)
      shell: bash
      run: bash scripts/ci/owner_approval_summary.sh docker-build-push || true
    - name: Login to GHCR with GITHUB_TOKEN
      shell: bash
      env:
        CR_PAT: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: 'set -euo pipefail

        echo "${CR_PAT}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

        '
    - name: Build and push (single-arch)
      if: env.PUSH_PLATFORMS == ''
      shell: bash
      run: "set -euo pipefail\ndocker buildx build \\\n  --file Dockerfile \\\n  --label\
        \ \"org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository\
        \ }}\" \\\n  --label \"org.opencontainers.image.revision=${{ github.sha }}\"\
        \ \\\n  --label \"org.opencontainers.image.ref.name=${{ github.ref_name }}\"\
        \ \\\n  --tag \"${{ steps.vars.outputs.image_sha }}\" \\\n  --tag \"${{ steps.vars.outputs.image_branch\
        \ }}\" \\\n  --push \\\n  .\n"
    - name: Build and push (multi-arch)
      if: env.PUSH_PLATFORMS != ''
      shell: bash
      run: "set -euo pipefail\ndocker buildx build \\\n  --platform \"${PUSH_PLATFORMS}\"\
        \ \\\n  --file Dockerfile \\\n  --label \"org.opencontainers.image.source=${{\
        \ github.server_url }}/${{ github.repository }}\" \\\n  --label \"org.opencontainers.image.revision=${{\
        \ github.sha }}\" \\\n  --label \"org.opencontainers.image.ref.name=${{ github.ref_name\
        \ }}\" \\\n  --tag \"${{ steps.vars.outputs.image_sha }}\" \\\n  --tag \"\
        ${{ steps.vars.outputs.image_branch }}\" \\\n  --push \\\n  .\n"
    - name: GHCR pull and smoke test (branch/latest tag)
      shell: bash
      env:
        PULLED_IMAGE: ${{ steps.vars.outputs.image_branch }}
      run: 'set -euo pipefail

        echo "[post-push] docker pull ${PULLED_IMAGE} with retry logic"

        # Exponential backoff retry for image pull (handles rate limiting) for attempt
        in 1 2 3; do if docker pull "${PULLED_IMAGE}"; then echo "[post-push] Pull
        succeeded on attempt $attempt" break else if [ $attempt -lt 3 ]; then delay=$((2
        ** ($attempt - 1))) echo "[post-push] Pull failed on attempt $attempt, retrying
        in ${delay}s..." sleep $delay else echo "[post-push] Pull failed after 3 attempts"
        exit 1 fi fi done

        echo "[post-push] smoke test ${PULLED_IMAGE} on host port 18001"

        bash scripts/ci/container_smoke.sh "${PULLED_IMAGE}" 8000 18001

        '
    - name: Summary — published image tags
      if: always()
      shell: bash
      run: "{\n  echo \"## Docker push results\"\n  echo\n  echo \"- Image (sha):\
        \ ${{ steps.vars.outputs.image_sha }}\"\n  echo \"- Image (branch/latest):\
        \ ${{ steps.vars.outputs.image_branch }}\"\n} >> \"${GITHUB_STEP_SUMMARY}\"\
        \n"
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --type pip --workflow docker-build-push
        --health 2>/dev/null || echo ''{"status": "cache health check skipped"}''

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: push
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Docker Build & Push
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
