name: manifest-drift-guard
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  validate-manifest-drift:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.number != 5328 }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Verify CODEX_MANIFEST references resolve
      run: "set -euo pipefail\n\nif [ ! -f CODEX_MANIFEST ]; then\n  echo \"::warning::CODEX_MANIFEST\
        \ not present at repo root; skipping strict path validation.\"\n  exit 0\n\
        fi\n\necho \"Validating CODEX_MANIFEST path references...\"\npython - <<'PY'\n\
        import json\nimport os\nimport re\nimport sys\nfrom pathlib import Path\n\n\
        manifest = Path(\"CODEX_MANIFEST\")\nraw = manifest.read_text(encoding=\"\
        utf-8\")\n\n# Supports either JSON manifest or simple line-based \"path: ...\"\
        \npaths = []\n\ntry:\n    data = json.loads(raw)\n\n    def walk(v):\n   \
        \     if isinstance(v, dict):\n            for k, vv in v.items():\n     \
        \           if k.lower() in {\"path\", \"file\", \"filepath\"} and isinstance(vv,\
        \ str):\n                    paths.append(vv)\n                walk(vv)\n\
        \        elif isinstance(v, list):\n            for i in v:\n            \
        \    walk(i)\n\n    walk(data)\nexcept Exception:\n    for line in raw.splitlines():\n\
        \        m = re.search(r'(?:^|\\s)(?:path|file|filepath)\\s*[:=]\\s*[\"']?([^\"\
        ']+)[\"']?', line, re.I)\n        if m:\n            paths.append(m.group(1).strip())\n\
        \nmissing = []\nfor p in sorted(set(paths)):\n    # Ignore obvious URLs\n\
        \    if p.startswith(\"http://\") or p.startswith(\"https://\"):\n       \
        \ continue\n    if not os.path.exists(p):\n        missing.append(p)\n\nif\
        \ missing:\n    print(\"Missing manifest-referenced paths:\")\n    for p in\
        \ missing:\n        print(f\" - {p}\")\n    sys.exit(1)\n\nprint(f\"Manifest\
        \ validation passed. Checked {len(set(paths))} referenced path(s).\")\nPY\n"
    timeout-minutes: 15
