name: "GitHub Guru Agent"

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: full | pr_only | hygiene | dependency'
        required: false
        default: 'full'

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write
  actions: read

env:
  SAFE_MODE: "true"
  OFFLINE_MODE: "false"


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  github-guru:
    name: GitHub Guru Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !contains(github.event.head_commit.message, '[skip-guru]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          pip install --quiet requests

      - name: Determine run mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "mode=pr_only" >> "$GITHUB_OUTPUT"
            echo "entity_id=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "event_type=pull_request" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            echo "mode=issue" >> "$GITHUB_OUTPUT"
            echo "entity_id=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "event_type=issues" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"
            echo "entity_id=" >> "$GITHUB_OUTPUT"
            echo "event_type=schedule" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GitHub Guru Agent
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          GURU_EVENT_TYPE: ${{ steps.mode.outputs.event_type }}
          GURU_ENTITY_ID: ${{ steps.mode.outputs.entity_id }}
          GURU_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python3 - << 'PYEOF'
          import os, sys
          sys.path.insert(0, ".github/agents/github-guru-agent")
          from main import GitHubGuruAgent

          owner, repo = os.environ.get("GITHUB_REPOSITORY", "unknown/unknown").split("/", 1)
          agent = GitHubGuruAgent(
              owner=owner,
              repo=repo,
              token=os.environ.get("GITHUB_TOKEN", ""),
              safe_mode=True,
          )
          event_type = os.environ.get("GURU_EVENT_TYPE", "schedule")
          entity_id = os.environ.get("GURU_ENTITY_ID", "")
          event = {"event_type": event_type}
          if entity_id:
              event["entity_id"] = int(entity_id)
          result = agent.handle_event(event)
          print(result.get("result_md", "No output"))
          sys.exit(0 if result.get("success") else 1)
          PYEOF

      - name: Upload session metrics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: github-guru-metrics-${{ github.run_number }}
          path: audit_artifacts/baselines/github_guru_session_*.json
          retention-days: 30
          if-no-files-found: ignore

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: github-guru
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "GitHub Guru"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
