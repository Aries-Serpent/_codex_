name: "GitHub Guru Agent"

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: full | pr_only | hygiene | dependency'
        required: false
        default: 'full'

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write
  actions: read

env:
  SAFE_MODE: "true"
  OFFLINE_MODE: "false"


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  github-guru:
    name: GitHub Guru Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !contains(github.event.head_commit.message, '[skip-guru]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          pip install --quiet requests

      - name: Determine run mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "mode=pr_only" >> "$GITHUB_OUTPUT"
            echo "entity_id=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "event_type=pull_request" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            echo "mode=issue" >> "$GITHUB_OUTPUT"
            echo "entity_id=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "event_type=issues" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"
            echo "entity_id=" >> "$GITHUB_OUTPUT"
            echo "event_type=schedule" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GitHub Guru Agent
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          GURU_EVENT_TYPE: ${{ steps.mode.outputs.event_type }}
          GURU_ENTITY_ID: ${{ steps.mode.outputs.entity_id }}
          GURU_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python3 - << 'PYEOF'
          import os, sys
          sys.path.insert(0, ".github/agents/github-guru-agent")
          from main import GitHubGuruAgent

          owner, repo = os.environ.get("GITHUB_REPOSITORY", "unknown/unknown").split("/", 1)
          agent = GitHubGuruAgent(
              owner=owner,
              repo=repo,
              token=os.environ.get("GITHUB_TOKEN", ""),
              safe_mode=True,
          )
          event_type = os.environ.get("GURU_EVENT_TYPE", "schedule")
          entity_id = os.environ.get("GURU_ENTITY_ID", "")
          event = {"event_type": event_type}
          if entity_id:
              event["entity_id"] = int(entity_id)
          result = agent.handle_event(event)
          print(result.get("result_md", "No output"))
          sys.exit(0 if result.get("success") else 1)
          PYEOF

      - name: Upload session metrics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: github-guru-metrics-${{ github.run_number }}
          path: audit_artifacts/baselines/github_guru_session_*.json
          retention-days: 30
          if-no-files-found: ignore

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: github-guru
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "GitHub Guru"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue:{pr_number} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: github-guru.yml → rescue-comment job (S227)_

---
_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
