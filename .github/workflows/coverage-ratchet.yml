name: Coverage Ratchet

# Enforces a minimum coverage threshold aligned with pyproject.toml `fail_under`.
# Blocks PRs when coverage drops below the ratchet floor.
#
# The pyproject.toml `fail_under = 10` is the single source of truth for the
# current regression floor (Phase 5 planning; Phase 10B target is ≥50%).
# The default threshold here matches pyproject.toml to avoid spurious failures.
#
# Domain: D7 · Test System Maturity (completion rubric v1)
# Evidence: coverage ratchet blocks regression → score 4 evidence

on:
  pull_request:
    branches: [main, develop, "0D_base_"]
    paths:
      - "src/**"
      - "tests/**"
      - "agents/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Coverage threshold % (default: 10)"
        type: string
        default: "10"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-ratchet-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-check:
    name: "🧪 Coverage Ratchet"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install with test dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 --quiet
          pip install -e ".[dev,test]" --quiet 2>/dev/null || pip install -e ".[test]" --quiet

      - name: Run coverage with ratchet threshold
        id: coverage
        env:
          THRESHOLD: ${{ inputs.threshold || '10' }}
        run: |
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under="${THRESHOLD}" \
            -q \
            --timeout=120 \
            -x \
            tests/ \
            2>&1 | tee "$RUNNER_TEMP/coverage_output.txt"
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Extract coverage percentage
          COVERAGE_PCT=$(awk '/^TOTAL[[:space:]]/ { for (i = 1; i <= NF; i++) if ($i ~ /^[0-9]+([.][0-9]+)?%$/) cov = $i } END { gsub(/%/, "", cov); print cov }' "$RUNNER_TEMP/coverage_output.txt")
          if ! [[ "$COVERAGE_PCT" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            COVERAGE_PCT="unknown"
          fi
          echo "coverage_pct=$COVERAGE_PCT" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        continue-on-error: true

      - name: Post PR comment on regression
        if: >
          github.event_name == 'pull_request' &&
          steps.coverage.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          THRESHOLD: ${{ inputs.threshold || '10' }}
        run: |
          printf "%s\n" \
            "## 🧪 Coverage Ratchet — Regression Detected" \
            "" \
            "Coverage dropped below the **${THRESHOLD}%** ratchet floor." \
            "Current: \`${{ steps.coverage.outputs.coverage_pct }}%\`" \
            "" \
            "Please add tests to restore coverage before merging." \
            "" \
            "<details><summary>Coverage output</summary>" \
            "" \
            "\`\`\`" \
            "$(cat "$RUNNER_TEMP/coverage_output.txt" | tail -30)" \
            "\`\`\`" \
            "" \
            "</details>" \
            "" \
            "See \`pyproject.toml → [tool.coverage.report]\` for configuration." \
            > "$RUNNER_TEMP/coverage_body.txt"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/coverage_body.txt" 2>/dev/null || true

      - name: Fail on coverage regression
        if: steps.coverage.outputs.exit_code != '0'
        run: |
          echo "::error::Coverage ${{ steps.coverage.outputs.coverage_pct }}% is below ratchet threshold ${{ inputs.threshold || '10' }}%"
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🧪 Coverage Ratchet"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Coverage | ${{ steps.coverage.outputs.coverage_pct }}% |"
            echo "| Threshold | ${{ inputs.threshold || '10' }}% |"
            echo "| Status | ${{ steps.coverage.outputs.exit_code == '0' && '✅ PASS' || '❌ FAIL' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
