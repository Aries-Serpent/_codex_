name: Coverage Ratchet
on:
  pull_request:
    branches:
    - main
    - develop
    - 0D_base_
    paths:
    - src/**
    - tests/**
    - agents/**
    - pyproject.toml
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Coverage threshold % (default: 35)'
        type: string
        default: '35'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  coverage-check:
    if: ${{ github.event.pull_request.number != 5328 && (!startsWith(github.head_ref,
      'copilot/') || github.base_ref == 'main' || github.base_ref == '0D_base_') }}
    name: "\U0001F9EA Coverage Ratchet"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13

    - name: Install with test dependencies
      run: 'pip install --upgrade pip --quiet

        pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 --quiet

        pip install -e ".[dev]" --quiet 2>/dev/null || pip install -e ".[dev]" --quiet

        '
    - name: Run coverage with ratchet threshold
      id: coverage
      env:
        THRESHOLD: ${{ inputs.threshold || '35' }}
      run: "set +e\npython -m pytest \\\n  --cov=src \\\n  --cov-report=term-missing\
        \ \\\n  --cov-report=xml:coverage.xml \\\n  --cov-fail-under=\"${THRESHOLD}\"\
        \ \\\n  -q \\\n  --timeout=120 \\\n  --continue-on-collection-errors \\\n\
        \  tests/ \\\n  2>&1 | tee \"$RUNNER_TEMP/coverage_output.txt\"\nEXIT_CODE=${PIPESTATUS[0]}\n\
        set -e\necho \"exit_code=$EXIT_CODE\" >> \"$GITHUB_OUTPUT\"\n# Extract coverage\
        \ percentage\nCOVERAGE_PCT=$(awk '/^TOTAL[[:space:]]/ { for (i = 1; i <= NF;\
        \ i++) if ($i ~ /^[0-9]+([.][0-9]+)?%$/) cov = $i } END { gsub(/%/, \"\",\
        \ cov); print cov }' \"$RUNNER_TEMP/coverage_output.txt\")\nif ! [[ \"$COVERAGE_PCT\"\
        \ =~ ^[0-9]+(\\.[0-9]+)?$ ]]; then\n  COVERAGE_PCT=\"unknown\"\nfi\nif [[\
        \ \"$COVERAGE_PCT\" == \"unknown\" ]]; then\n  THRESHOLD_BREACHED=\"true\"\
        \n  echo \"::warning::Coverage percentage is unknown; treating as ratchet\
        \ breach.\"\nelse\n  THRESHOLD_BREACHED=\"false\"\n  if ! THRESHOLD_BREACHED=$(python\
        \ -c 'import sys; print(str(float(sys.argv[1]) < float(sys.argv[2])).lower())'\
        \ \"$COVERAGE_PCT\" \"$THRESHOLD\"); then\n    THRESHOLD_BREACHED=\"true\"\
        \n    echo \"::warning::Failed to compare coverage ($COVERAGE_PCT) against\
        \ threshold ($THRESHOLD); treating as ratchet breach.\"\n  fi\nfi\necho \"\
        coverage_pct=$COVERAGE_PCT\" >> \"$GITHUB_OUTPUT\"\necho \"threshold_breached=$THRESHOLD_BREACHED\"\
        \ >> \"$GITHUB_OUTPUT\"\nexit $EXIT_CODE\n"
      continue-on-error: true
    - name: Post PR comment on regression
      if: 'github.event_name == ''pull_request'' && steps.coverage.outputs.threshold_breached
        == ''true''

        '
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        THRESHOLD: ${{ inputs.threshold || '35' }}
      run: "printf \"%s\\n\" \\\n  \"## \U0001F9EA Coverage Ratchet \u2014 Regression\
        \ Detected\" \\\n  \"\" \\\n  \"Coverage dropped below the **${THRESHOLD}%**\
        \ ratchet floor.\" \\\n  \"Current: \\`${{ steps.coverage.outputs.coverage_pct\
        \ }}%\\`\" \\\n  \"\" \\\n  \"Please add tests to restore coverage before\
        \ merging.\" \\\n  \"\" \\\n  \"<details><summary>Coverage output</summary>\"\
        \ \\\n  \"\" \\\n  \"\\`\\`\\`\" \\\n  \"$(cat \"$RUNNER_TEMP/coverage_output.txt\"\
        \ | tail -30)\" \\\n  \"\\`\\`\\`\" \\\n  \"\" \\\n  \"</details>\" \\\n \
        \ \"\" \\\n  \"See \\`pyproject.toml \u2192 [tool.coverage.report]\\` for\
        \ configuration.\" \\\n  > \"$RUNNER_TEMP/coverage_body.txt\"\ngh pr comment\
        \ \"$PR_NUMBER\" --body-file \"$RUNNER_TEMP/coverage_body.txt\" 2>/dev/null\
        \ || true\n"
    - name: Fail on coverage regression
      if: steps.coverage.outputs.threshold_breached == 'true'
      run: 'echo "::error::Coverage ${{ steps.coverage.outputs.coverage_pct }}% is
        below ratchet threshold ${{ inputs.threshold || ''35'' }}%"

        exit 1

        '
    - name: Job summary
      if: always()
      run: "{\n  echo \"## \U0001F9EA Coverage Ratchet\"\n  echo \"\"\n  echo \"|\
        \ Item | Value |\"\n  echo \"|------|-------|\"\n  echo \"| Coverage | ${{\
        \ steps.coverage.outputs.coverage_pct }}% |\"\n  echo \"| Threshold | ${{\
        \ inputs.threshold || '35' }}% |\"\n  echo \"| Status | ${{ steps.coverage.outputs.exit_code\
        \ == '0' && '\u2705 PASS' || '\u274C FAIL' }} |\"\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  notify-exempt:
    name: "\U0001F9EA Coverage Ratchet (exempt)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: 'github.event_name == ''pull_request'' && startsWith(github.head_ref, ''copilot/'')
      && github.base_ref != ''main'' && github.base_ref != ''0D_base_''

      '
    permissions:
      pull-requests: write
    steps:
    - name: Post exemption notice
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
      run: "printf \"%s\\n\" \\\n  \"## \U0001F9EA Coverage Ratchet \u2014 Exempt\
        \ \u2705\" \\\n  \"\" \\\n  \"Coverage ratchet enforcement is **skipped**\
        \ for Copilot-generated branches targeting \\`${BASE_REF}\\`.\" \\\n  \"\"\
        \ \\\n  \"| Item | Value |\" \\\n  \"|------|-------|\" \\\n  \"| Head branch\
        \ | \\`${HEAD_REF}\\` |\" \\\n  \"| Base branch | \\`${BASE_REF}\\` |\" \\\
        \n  \"| Status | \u23ED\uFE0F Exempt |\" \\\n  \"\" \\\n  \"> **Note:** Full\
        \ ratchet enforcement resumes when this branch (or its changes) targets \\\
        `main\\` or \\`0D_base_\\`.\" \\\n  > \"${RUNNER_TEMP}/exempt_body.txt\"\n\
        gh pr comment \"$PR_NUMBER\" --body-file \"${RUNNER_TEMP}/exempt_body.txt\"\
        \ 2>/dev/null || true\n"
    - name: Job summary
      env:
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
      run: "{\n  echo \"## \U0001F9EA Coverage Ratchet (exempt)\"\n  echo \"\"\n \
        \ echo \"| Item | Value |\"\n  echo \"|------|-------|\"\n  echo \"| Head\
        \ branch | \\`${HEAD_REF}\\` |\"\n  echo \"| Base branch | \\`${BASE_REF}\\\
        ` |\"\n  echo \"| Status | \u23ED\uFE0F Exempt \u2014 Copilot branch targeting\
        \ non-trunk |\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
