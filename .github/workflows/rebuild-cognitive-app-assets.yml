name: Rebuild Cognitive App Assets
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for rebuild'
        required: false
        default: 'Stale deployment recovery'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  rebuild:
    name: Rebuild and Redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      rebuild_status: ${{ steps.build.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cognitive_app/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
