name: Rebuild Cognitive App Assets
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for rebuild'
        required: false
        default: 'Stale deployment recovery'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  rebuild:
    name: Rebuild and Redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      rebuild_status: ${{ steps.build.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cognitive_app/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: 3.12.13

      - name: Log rebuild start
        run: |
          echo "🔄 Starting cognitive app rebuild..."
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo ""
          
          python scripts/ci/deployment_history_tracker.py record \
            --type rebuild \
            --status started \
            --reason "${{ github.event.inputs.reason }}"

      - name: Clean node_modules and dist
        working-directory: cognitive_app
        run: |
          echo "🧹 Cleaning build artifacts..."
          rm -rf node_modules package-lock.json
          rm -rf dist
          rm -rf .dist
          echo "✓ Cleaned: node_modules, package-lock.json, dist"
          echo ""

      - name: Fresh npm install
        working-directory: cognitive_app
        run: |
          echo "📦 Fresh npm install..."
          npm install --verbose
          
          if [ $? -ne 0 ]; then
            echo "❌ npm install failed"
            exit 1
          fi
          echo ""

      - name: Pre-build validation
        working-directory: cognitive_app
        run: |
          echo "🔍 Pre-build validation..."
          python ../scripts/ci/validate_cognitive_app_build.py --pre-build-only
          
          if [ $? -ne 0 ]; then
            echo "❌ Pre-build validation failed"
            exit 1
          fi
          echo ""

      - name: Build cognitive app
        id: build
        working-directory: cognitive_app
        env:
          VITE_API_MODE: ${{ vars.COGNITIVE_APP_API_MODE || 'github' }}
          VITE_CLI_API_URL: ${{ vars.COGNITIVE_APP_API_URL || '' }}
          VITE_DOCS_FETCH_LIVE: 'true'
        run: |
          echo "🏗️  Building cognitive app (fresh)..."
          echo "   API mode: ${VITE_API_MODE}"
          echo "   CLI URL:  ${VITE_CLI_API_URL:-<not set>}"
          echo ""
          
          npm run build 2>&1 | tee build.log
          
          if [ $? -ne 0 ]; then
            echo "❌ Build failed"
            echo ""
            echo "Last 50 lines of build log:"
            tail -50 build.log
            exit 1
          fi
          
          echo "✓ Build successful"
          echo "status=success" >> $GITHUB_OUTPUT
          echo ""

      - name: Post-build validation
        working-directory: cognitive_app
        run: |
          echo "✅ Post-build validation..."
          python ../scripts/ci/validate_cognitive_app_build.py --post-build-only
          
          if [ $? -ne 0 ]; then
            echo "❌ Post-build validation failed"
            exit 1
          fi
          echo ""

      - name: List build artifacts
        working-directory: cognitive_app
        run: |
          echo "📋 Build artifacts:"
          echo ""
          find dist -type f -name "*.js" -o -name "*.css" | head -20
          echo ""
          echo "Total files:"
          find dist -type f | wc -l

      - name: Apply cache invalidation
        run: |
          echo "🔄 Applying cache invalidation..."
          python scripts/ci/cognitive_app_cache_invalidator.py \
            --url "https://aries-serpent.github.io/_codex_/cognitive_app/" \
            --reason "Rebuild: ${{ github.event.inputs.reason }}"
          echo ""

      - name: Deploy to site
        run: |
          echo "📤 Deploying to site/cognitive_app..."
          
          mkdir -p site/cognitive_app
          cp -r cognitive_app/dist/* site/cognitive_app/
          
          ASSET_COUNT=$(find site/cognitive_app -type f | wc -l)
          echo "✓ Deployed $ASSET_COUNT files"
          echo ""
          
          echo "Deployed structure:"
          ls -lah site/cognitive_app/ | head -20

      - name: Verify local build
        run: |
          echo "🔍 Verifying local build artifacts..."
          
          if [ -d "site/cognitive_app/assets" ]; then
            echo "✓ assets/ directory exists"
            JS_COUNT=$(find site/cognitive_app/assets -name "*.js" | wc -l)
            CSS_COUNT=$(find site/cognitive_app/assets -name "*.css" | wc -l)
            echo "  - JavaScript files: $JS_COUNT"
            echo "  - CSS files: $CSS_COUNT"
          fi
          
          if [ -f "site/cognitive_app/index.html" ]; then
            echo "✓ index.html exists"
            
            if grep -q 'id="root"' site/cognitive_app/index.html; then
              echo "✓ React root element found"
            else
              echo "❌ React root element NOT found"
              exit 1
            fi
          fi
          
          echo ""

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Verify deployment with hash checking
        id: verify
        run: |
          echo "✅ Verifying deployed assets..."
          echo ""
          
          python scripts/ci/cognitive_app_asset_manifest_verifier.py \
            --manifest cognitive_app/dist/manifest.json \
            --url "https://aries-serpent.github.io/_codex_/cognitive_app/"
          
          VERIFY_RESULT=$?
          
          if [ $VERIFY_RESULT -eq 0 ]; then
            echo ""
            echo "✅ Deployment verification PASSED"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "⚠️ Asset verification result: $VERIFY_RESULT"
            echo "result=verification_warning" >> $GITHUB_OUTPUT
          fi

      - name: Log rebuild completion
        if: always()
        run: |
          RESULT="${{ steps.build.outputs.status }}"
          
          python scripts/ci/deployment_history_tracker.py record \
            --type rebuild \
            --status "$RESULT" \
            --url "https://aries-serpent.github.io/_codex_/cognitive_app/" \
            --reason "${{ github.event.inputs.reason }}"

      - name: Summary
        if: always()
        run: |
          VERIFY_RESULT="${{ steps.verify.outputs.result || 'unknown' }}"
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          
          echo "## 🔄 Cognitive App Rebuild Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outputs.status || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | Success |" >> $GITHUB_STEP_SUMMARY
          echo "| Verification | $VERIFY_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: [\`${PAGE_URL}cognitive_app/\`](${PAGE_URL}cognitive_app/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason**: ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
