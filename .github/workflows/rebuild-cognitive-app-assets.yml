name: Rebuild Cognitive App Assets
true:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for rebuild
        required: false
        default: Stale deployment recovery
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  rebuild:
    name: Rebuild and Redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      rebuild_status: ${{ steps.build.outputs.status }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: cognitive_app/package-lock.json
    - name: Set up Python 3.12
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Log rebuild start
      run: "echo \"\U0001F504 Starting cognitive app rebuild...\"\necho \"Reason:\
        \ ${{ github.event.inputs.reason }}\"\necho \"\"\n\npython scripts/ci/deployment_history_tracker.py\
        \ record \\\n  --type rebuild \\\n  --status started \\\n  --reason \"${{\
        \ github.event.inputs.reason }}\"\n"
    - name: Clean node_modules and dist
      working-directory: cognitive_app
      run: "echo \"\U0001F9F9 Cleaning build artifacts...\"\nrm -rf node_modules package-lock.json\n\
        rm -rf dist\nrm -rf .dist\necho \"\u2713 Cleaned: node_modules, package-lock.json,\
        \ dist\"\necho \"\"\n"
    - name: Fresh npm install
      working-directory: cognitive_app
      run: "echo \"\U0001F4E6 Fresh npm install...\"\nnpm install --verbose\n\nif\
        \ [ $? -ne 0 ]; then\n  echo \"\u274C npm install failed\"\n  exit 1\nfi\n\
        echo \"\"\n"
    - name: Pre-build validation
      working-directory: cognitive_app
      run: "echo \"\U0001F50D Pre-build validation...\"\npython ../scripts/ci/validate_cognitive_app_build.py\
        \ --pre-build-only\n\nif [ $? -ne 0 ]; then\n  echo \"\u274C Pre-build validation\
        \ failed\"\n  exit 1\nfi\necho \"\"\n"
    - name: Build cognitive app
      id: build
      working-directory: cognitive_app
      env:
        VITE_API_MODE: ${{ vars.COGNITIVE_APP_API_MODE || 'github' }}
        VITE_CLI_API_URL: ${{ vars.COGNITIVE_APP_API_URL || '' }}
        VITE_DOCS_FETCH_LIVE: 'true'
      run: "echo \"\U0001F3D7\uFE0F  Building cognitive app (fresh)...\"\necho \"\
        \   API mode: ${VITE_API_MODE}\"\necho \"   CLI URL:  ${VITE_CLI_API_URL:-<not\
        \ set>}\"\necho \"\"\n\nnpm run build 2>&1 | tee build.log\n\nif [ $? -ne\
        \ 0 ]; then\n  echo \"\u274C Build failed\"\n  echo \"\"\n  echo \"Last 50\
        \ lines of build log:\"\n  tail -50 build.log\n  exit 1\nfi\n\necho \"\u2713\
        \ Build successful\"\necho \"status=success\" >> $GITHUB_OUTPUT\necho \"\"\
        \n"
    - name: Post-build validation
      working-directory: cognitive_app
      run: "echo \"\u2705 Post-build validation...\"\npython ../scripts/ci/validate_cognitive_app_build.py\
        \ --post-build-only\n\nif [ $? -ne 0 ]; then\n  echo \"\u274C Post-build validation\
        \ failed\"\n  exit 1\nfi\necho \"\"\n"
    - name: List build artifacts
      working-directory: cognitive_app
      run: "echo \"\U0001F4CB Build artifacts:\"\necho \"\"\nfind dist -type f -name\
        \ \"*.js\" -o -name \"*.css\" | head -20\necho \"\"\necho \"Total files:\"\
        \nfind dist -type f | wc -l\n"
    - name: Apply cache invalidation
      run: "echo \"\U0001F504 Applying cache invalidation...\"\npython scripts/ci/cognitive_app_cache_invalidator.py\
        \ \\\n  --url \"https://aries-serpent.github.io/_codex_/cognitive_app/\" \\\
        \n  --reason \"Rebuild: ${{ github.event.inputs.reason }}\"\necho \"\"\n"
    - name: Deploy to site
      run: "echo \"\U0001F4E4 Deploying to site/cognitive_app...\"\n\nmkdir -p site/cognitive_app\n\
        cp -r cognitive_app/dist/* site/cognitive_app/\n\nASSET_COUNT=$(find site/cognitive_app\
        \ -type f | wc -l)\necho \"\u2713 Deployed $ASSET_COUNT files\"\necho \"\"\
        \n\necho \"Deployed structure:\"\nls -lah site/cognitive_app/ | head -20\n"
    - name: Verify local build
      run: "echo \"\U0001F50D Verifying local build artifacts...\"\n\nif [ -d \"site/cognitive_app/assets\"\
        \ ]; then\n  echo \"\u2713 assets/ directory exists\"\n  JS_COUNT=$(find site/cognitive_app/assets\
        \ -name \"*.js\" | wc -l)\n  CSS_COUNT=$(find site/cognitive_app/assets -name\
        \ \"*.css\" | wc -l)\n  echo \"  - JavaScript files: $JS_COUNT\"\n  echo \"\
        \  - CSS files: $CSS_COUNT\"\nfi\n\nif [ -f \"site/cognitive_app/index.html\"\
        \ ]; then\n  echo \"\u2713 index.html exists\"\n  \n  if grep -q 'id=\"root\"\
        ' site/cognitive_app/index.html; then\n    echo \"\u2713 React root element\
        \ found\"\n  else\n    echo \"\u274C React root element NOT found\"\n    exit\
        \ 1\n  fi\nfi\n\necho \"\"\n"
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
      with:
        path: site/
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
    - name: Verify deployment with hash checking
      id: verify
      run: "echo \"\u2705 Verifying deployed assets...\"\necho \"\"\n\npython scripts/ci/cognitive_app_asset_manifest_verifier.py\
        \ \\\n  --manifest cognitive_app/dist/manifest.json \\\n  --url \"https://aries-serpent.github.io/_codex_/cognitive_app/\"\
        \n\nVERIFY_RESULT=$?\n\nif [ $VERIFY_RESULT -eq 0 ]; then\n  echo \"\"\n \
        \ echo \"\u2705 Deployment verification PASSED\"\n  echo \"result=success\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"\"\n  echo \"\u26A0\uFE0F Asset verification\
        \ result: $VERIFY_RESULT\"\n  echo \"result=verification_warning\" >> $GITHUB_OUTPUT\n\
        fi\n"
    - name: Log rebuild completion
      if: always()
      run: "RESULT=\"${{ steps.build.outputs.status }}\"\n\npython scripts/ci/deployment_history_tracker.py\
        \ record \\\n  --type rebuild \\\n  --status \"$RESULT\" \\\n  --url \"https://aries-serpent.github.io/_codex_/cognitive_app/\"\
        \ \\\n  --reason \"${{ github.event.inputs.reason }}\"\n"
    - name: Summary
      if: always()
      run: "VERIFY_RESULT=\"${{ steps.verify.outputs.result || 'unknown' }}\"\nPAGE_URL=\"\
        ${{ steps.deployment.outputs.page_url }}\"\n\necho \"## \U0001F504 Cognitive\
        \ App Rebuild Complete\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"| Status | Result |\" >> $GITHUB_STEP_SUMMARY\necho \"|--------|--------|\"\
        \ >> $GITHUB_STEP_SUMMARY\necho \"| Build | ${{ steps.build.outputs.status\
        \ || 'unknown' }} |\" >> $GITHUB_STEP_SUMMARY\necho \"| Deployment | Success\
        \ |\" >> $GITHUB_STEP_SUMMARY\necho \"| Verification | $VERIFY_RESULT |\"\
        \ >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\necho \"**URL**:\
        \ [\\`${PAGE_URL}cognitive_app/\\`](${PAGE_URL}cognitive_app/)\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Reason**: ${{ github.event.inputs.reason\
        \ }}\" >> $GITHUB_STEP_SUMMARY\n"
