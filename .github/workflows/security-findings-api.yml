concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  query-findings:
    outputs:
      findings: ${{ steps.query.outputs.findings }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - env:
        QUERY_TYPE: ${{ github.event.client_payload.query_type }}
        QUERY_VALUE: ${{ github.event.client_payload.value }}
      id: query
      name: Query Findings
      run: "python scripts/ci/security_findings_api.py query \\\n  --query-type \"\
        $QUERY_TYPE\" \\\n  --value \"$QUERY_VALUE\" \\\n  --cache-dir \".codex/security-cache\"\
        \ \\\n  --output \"findings.json\"\n\nFINDINGS=$(cat findings.json)\necho\
        \ \"findings<<EOF\" >> $GITHUB_OUTPUT\necho \"$FINDINGS\" >> $GITHUB_OUTPUT\n\
        echo \"EOF\" >> $GITHUB_OUTPUT\n"
    - name: Upload Results
      uses: actions/upload-artifact@v5
      with:
        path: findings.json
        retention-days: 1
        name: api-findings-result
    timeout-minutes: 30
name: Security Findings API
'on':
  repository_dispatch:
    types:
    - security-findings-query
permissions:
  contents: read
