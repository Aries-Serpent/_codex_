name: Nightly Security MTTR Tracker

# Tracks mean-time-to-remediation (MTTR) for CodeQL/Dependabot security alerts.
# Reports are written to reports/security/mttr_report.json and posted as a PR
# comment on any open security-fix PR.
#
# SLA reference: docs/security/SECURITY_SLA.md
# Domain: D5 · Security Posture (completion rubric v1)
# Evidence: MTTR metric collected nightly → score 5 evidence

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no artifact upload)"
        type: boolean
        default: false

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: nightly-security-mttr
  cancel-in-progress: true

jobs:
  compute-mttr:
    name: "🔐 Compute Security MTTR"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyGithub requests --quiet

      - name: Compute MTTR from CodeQL alerts
        id: mttr
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          try:
              from github import Github
          except ImportError:
              print("PyGithub not available; using stub report.", file=sys.stderr)
              report = {
                  "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "repo": os.environ.get("REPO", "unknown"),
                  "note": "PyGithub unavailable in this environment; connect GH_TOKEN to enable live data",
                  "open_critical": 0,
                  "open_high": 0,
                  "overdue_critical": 0,
                  "overdue_high": 0,
                  "mttr_critical_days": None,
                  "mttr_high_days": None,
                  "sla_status": "unknown",
              }
              Path("reports/security").mkdir(parents=True, exist_ok=True)
              Path("reports/security/mttr_report.json").write_text(
                  json.dumps(report, indent=2)
              )
              print(json.dumps(report, indent=2))
              sys.exit(0)

          token = os.environ.get("GH_TOKEN", "")
          repo_name = os.environ.get("REPO", "")
          g = Github(token) if token else Github()

          try:
              repo = g.get_repo(repo_name)
              alerts = list(repo.get_code_scanning_alerts(state="open"))
          except Exception as exc:
              print(f"Could not fetch alerts: {exc}", file=sys.stderr)
              alerts = []

          now = datetime.now(timezone.utc)
          sla_days = {"critical": 3, "high": 10, "medium": 30, "low": 90}

          counts = {sev: {"open": 0, "overdue": 0, "ages": []} for sev in sla_days}

          for alert in alerts:
              sev = (alert.rule.severity or "low").lower()
              if sev not in counts:
                  sev = "low"
              created = alert.created_at
              if created.tzinfo is None:
                  created = created.replace(tzinfo=timezone.utc)
              age_days = (now - created).days
              counts[sev]["open"] += 1
              counts[sev]["ages"].append(age_days)
              if age_days > sla_days[sev]:
                  counts[sev]["overdue"] += 1

          def mean_age(ages):
              return round(sum(ages) / len(ages), 1) if ages else None

          sla_status = "ok"
          if counts["critical"]["overdue"] > 0 or counts["high"]["overdue"] > 0:
              sla_status = "breached"
          elif counts["critical"]["open"] > 0:
              sla_status = "at_risk"

          report = {
              "generated_at": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "repo": repo_name,
              "open_critical": counts["critical"]["open"],
              "open_high": counts["high"]["open"],
              "open_medium": counts["medium"]["open"],
              "open_low": counts["low"]["open"],
              "overdue_critical": counts["critical"]["overdue"],
              "overdue_high": counts["high"]["overdue"],
              "mttr_critical_days": mean_age(counts["critical"]["ages"]),
              "mttr_high_days": mean_age(counts["high"]["ages"]),
              "sla_status": sla_status,
              "sla_thresholds": sla_days,
          }

          Path("reports/security").mkdir(parents=True, exist_ok=True)
          Path("reports/security/mttr_report.json").write_text(
              json.dumps(report, indent=2)
          )
          print(json.dumps(report, indent=2))

          # Surface key outputs for downstream steps
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"sla_status={sla_status}\n")
              fh.write(f"overdue_critical={counts['critical']['overdue']}\n")
              fh.write(f"overdue_high={counts['high']['overdue']}\n")
          PYEOF

      - name: Upload MTTR report artifact
        if: inputs.dry_run != 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: security-mttr-report-${{ github.run_id }}
          path: reports/security/mttr_report.json
          retention-days: 90

      - name: Warn on SLA breach
        if: steps.mttr.outputs.sla_status == 'breached'
        run: |
          echo "::warning::Security SLA BREACHED — overdue critical: ${{ steps.mttr.outputs.overdue_critical }}, overdue high: ${{ steps.mttr.outputs.overdue_high }}"
          echo "See docs/security/SECURITY_SLA.md for remediation guidance."

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🔐 Security MTTR Report"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            if [ -f reports/security/mttr_report.json ]; then
              python3 -c "
          import json
          r = json.load(open('reports/security/mttr_report.json'))
          print(f'| Open Critical | {r.get(\"open_critical\", \"n/a\")} |')
          print(f'| Open High | {r.get(\"open_high\", \"n/a\")} |')
          print(f'| Overdue Critical | {r.get(\"overdue_critical\", \"n/a\")} |')
          print(f'| Overdue High | {r.get(\"overdue_high\", \"n/a\")} |')
          print(f'| MTTR Critical (days) | {r.get(\"mttr_critical_days\", \"n/a\")} |')
          print(f'| MTTR High (days) | {r.get(\"mttr_high_days\", \"n/a\")} |')
          print(f'| SLA Status | {r.get(\"sla_status\", \"n/a\")} |')
              "
            fi
            echo ""
            echo "SLA reference: \`docs/security/SECURITY_SLA.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
