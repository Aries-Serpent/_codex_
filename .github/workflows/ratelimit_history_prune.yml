name: Rate-Limit History Prune

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *" # Monthly at 05:00 UTC


permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow ratelimit_history_prune 2>/dev/null || echo "Cache health: check skipped"
      - name: Prune history (keep 90 days)
        run: |
          python scripts/connectors/prune_rate_limit_history.py --days 90
      - name: Upload post-prune listing
        run: |
          ls -la connectors/history || true
