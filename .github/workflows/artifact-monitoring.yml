name: Artifact Monitoring

on:
  # Scheduled execution every 3-6 hours
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours at minute 0

  # Manual trigger for testing and on-demand execution
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no issues created)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      workflow_filter:
        description: 'Check specific workflow only (optional)'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # RL-3b: Rate-limit dashboard guard
  GH_TRICKLE_POLITE_SLEEP: "0.5"
  GH_TRICKLE_MIN_REMAINING: "50"

jobs:
  monitor-workflows:
    name: Monitor Workflows & Create Issues
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: RL-3b — Rate-limit pre-check
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        run: |
          REMAINING=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo "0")
          echo "GitHub API rate-limit remaining: $REMAINING"
          if [ "$REMAINING" -lt "${GH_TRICKLE_MIN_REMAINING}" ]; then
            echo "⚠️  Rate limit low ($REMAINING remaining < ${GH_TRICKLE_MIN_REMAINING} threshold) — skipping artifact monitoring to protect CI"
            echo "RATE_LIMIT_OK=false" >> "$GITHUB_ENV"
          else
            echo "RATE_LIMIT_OK=true" >> "$GITHUB_ENV"
          fi

      - name: CacheManager health check
        if: env.RATE_LIMIT_OK != 'false'
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow artifact-monitoring 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python 3.12 with tiered cache
        if: env.RATE_LIMIT_OK != 'false'
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common

      - name: Install dependencies
        if: env.RATE_LIMIT_OK != 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[github]"

      - name: Download previous state
        if: env.RATE_LIMIT_OK != 'false'
        id: download_state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monitor-state
          path: .codex/monitoring/state/
        continue-on-error: true

      - name: Run monitoring check
        if: env.RATE_LIMIT_OK != 'false'
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WORKFLOW_FILTER: ${{ github.event.inputs.workflow_filter || '' }}
        run: |
          # Determine dry-run flag
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "🔍 Running in DRY-RUN mode"
          fi

          # Determine workflow filter
          WORKFLOW_FLAG=""
          if [ -n "$WORKFLOW_FILTER" ]; then
            WORKFLOW_FLAG="--workflow $WORKFLOW_FILTER"
            echo "🎯 Filtering to workflow: $WORKFLOW_FILTER"
          fi

          # Run monitoring
          echo "🚀 Starting artifact monitoring..."
          python scripts/monitoring/artifact_monitor.py \
            --config .codex/config/monitoring.yaml \
            --state .codex/monitoring/state/monitor_state.json \
            $DRY_RUN_FLAG \
            $WORKFLOW_FLAG \
            --verbose

          echo "✅ Monitoring check complete"

      - name: Upload monitoring state
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: monitor-state
          path: .codex/monitoring/state/
          retention-days: 90

      - name: Generate monitoring report
        if: always()
        run: |
          echo "## 📊 Monitoring Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f .codex/monitoring/state/monitor_state.json ]; then
            echo "### State Summary" >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          with open('.codex/monitoring/state/monitor_state.json', 'r') as f:
              state = json.load(f)
              stats = state.get('stats', {})
              print(f\"- **Total Runs Checked**: {stats.get('total_runs_checked', 0)}\")
              print(f\"- **Failures Detected**: {stats.get('failures_detected', 0)}\")
              print(f\"- **Issues Created**: {stats.get('issues_created', 0)}\")
              print(f\"- **Issues Closed**: {stats.get('issues_closed', 0)}\")
              print(f\"- **Last Check**: {state.get('last_check_timestamp', 'Never')}\")
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "_No state file found_" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check rate limit
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          echo "## 🔍 GitHub API Rate Limit" >> $GITHUB_STEP_SUMMARY
          gh api rate_limit | jq -r '.resources.core | "- **Remaining**: \(.remaining)/\(.limit)\n- **Reset**: \(.reset | strflocaltime("%Y-%m-%d %H:%M:%S UTC"))"' >> $GITHUB_STEP_SUMMARY || true

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issue_body = `## ⚠️ Artifact Monitoring Workflow Failed

            The automated artifact monitoring workflow has failed.

            **Run**: [#${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Workflow**: ${context.workflow}
            **Event**: ${context.eventName}
            **Time**: ${new Date().toISOString()}

            This is a meta-failure - the monitoring system itself has encountered an error.
            Please review the workflow logs and resolve the issue to restore monitoring.

            ---

            **Auto-generated by Artifact Monitoring Workflow**
            `;

            // Only create issue if not in dry-run mode
            const isDryRun = '${{ github.event.inputs.dry_run }}' === 'true';
            if (!isDryRun) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[META-MONITOR] Artifact Monitoring Workflow Failed',
                body: issue_body,
                labels: ['automated', 'monitoring-failure', 'critical']
              });
            }
