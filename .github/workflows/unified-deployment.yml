name: Unified Deployment Suite
on:
  push:
    branches:
    - main
    paths:
    - cognitive_app/**
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        required: true
        type: choice
        options:
        - cognitive-app-only
        - pre-release-only
        - full-deployment
        default: full-deployment
      version:
        description: Version for pre-release (e.g., 1.5.5)
        required: false
        type: string
      skip_tests:
        description: Skip test execution (not recommended)
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  pull-requests: write
  packages: write
jobs:
  pre_release_validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: '(github.event_name == ''workflow_dispatch'' && (inputs.mode == ''pre-release-only''
      || inputs.mode == ''full-deployment''))

      '
    outputs:
      validation_passed: ${{ steps.validation.outputs.passed }}
    steps:
      - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
      - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow unified-deployment
        2>/dev/null || echo "Cache health: check skipped"

        '
      - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
      - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        # Pin pytest plugins (PR #3248)

        # Pin pytest plugins before package install (PR #3248 stability fix)

        pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0
        pytest-asyncio==1.3.0



        pip install -e ".[dev,test]"

        '
      - name: Run validation
      id: validation
      run: "if [ \"${{ inputs.skip_tests }}\" != \"true\" ]; then\n  pytest tests/\
        \ -v --tb=short --timeout=300 || exit 1\nfi\necho \"passed=true\" >> $GITHUB_OUTPUT\n"
      - name: Validate version format
      if: inputs.version != ''
      run: "if ! echo \"${{ inputs.version }}\" | grep -E '^[0-9]+\\.[0-9]+\\.[0-9]+$';\
        \ then\n  echo \"Invalid version format. Expected: X.Y.Z\"\n  exit 1\nfi\n"
  build_cognitive_app:
    name: "Build Cognitive App (artifact only \u2014 no Pages deploy)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: 'github.event_name == ''push'' ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''cognitive-app-only''
      || inputs.mode == ''full-deployment''))

      '
    steps:
      - name: Checkout repository
      uses: actions/checkout@v7
      - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: cognitive_app/package-lock.json
      - name: Install dependencies
      working-directory: cognitive_app
      run: npm ci
      - name: Build application
      working-directory: cognitive_app
      env:
        GITHUB_ACTIONS: true
      run: npm run build
      - name: Upload cognitive_app build artifact
      uses: actions/upload-artifact@v5
      with:
        name: cognitive-app-dist-${{ github.sha }}
        path: cognitive_app/dist
        retention-days: 7
  pre_release_build:
    name: Build Pre-Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - pre_release_validate
    if: 'needs.pre_release_validate.result == ''success'' &&

      needs.pre_release_validate.outputs.validation_passed == ''true''

      '
    steps:
      - name: Checkout Code
      uses: actions/checkout@v7
      - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
      - name: Build package
      run: 'python -m pip install --upgrade pip build

        python -m build

        '
      - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: pre-release-build-${{ inputs.version || github.sha }}
        path: dist/
        retention-days: 90
  pre_release_publish:
    name: Publish Pre-Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - pre_release_build
    if: needs.pre_release_build.result == 'success'
    steps:
      - name: Checkout Code
      uses: actions/checkout@v7
      - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: pre-release-build-${{ inputs.version || github.sha }}
        path: dist/
      - name: Create GitHub Release
      if: inputs.version != ''
      env:
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "gh release create \"v${{ inputs.version }}\" \\\n  --title \"Pre-Release\
        \ v${{ inputs.version }}\" \\\n  --notes \"Pre-release version ${{ inputs.version\
        \ }}\" \\\n  --prerelease \\\n  dist/*\n"
  deployment_summary:
    name: Generate Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - build_cognitive_app
      - pre_release_validate
      - pre_release_build
      - pre_release_publish
    if: always()
    steps:
      - name: Generate summary
      run: "echo \"## \U0001F680 Unified Deployment Summary\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Mode:** ${{ inputs.mode || 'cognitive-app\
        \ (auto)' }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"### Job Status\" >> $GITHUB_STEP_SUMMARY\necho \"- Cognitive App Build:\
        \ ${{ needs.build_cognitive_app.result || 'skipped' }}\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Cognitive App Deploy: handled by pages-mkdocs.yml (MkDocs is the\
        \ sole Pages deployer)\" >> $GITHUB_STEP_SUMMARY\necho \"- Pre-Release Validation:\
        \ ${{ needs.pre_release_validate.result || 'skipped' }}\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Pre-Release Build: ${{ needs.pre_release_build.result || 'skipped'\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"- Pre-Release Publish: ${{ needs.pre_release_publish.result\
        \ || 'skipped' }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
        if [ \"${{ inputs.version }}\" != \"\" ]; then\n  echo \"\u2705 Pre-release\
        \ version: ${{ inputs.version }}\" >> $GITHUB_STEP_SUMMARY\nfi\n"
