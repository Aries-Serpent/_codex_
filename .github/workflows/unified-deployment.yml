name: Unified Deployment Suite

on:
  # Cognitive app deployment
  push:
    branches:
      - main
    paths:
      - 'cognitive_app/**'

  # Manual deployment with full control
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deployment mode'
        required: true
        type: choice
        options:
          - cognitive-app-only
          - pre-release-only
          - full-deployment
        default: 'full-deployment'
      version:
        description: 'Version for pre-release (e.g., 1.5.5)'
        required: false
        type: string
      skip_tests:
        description: 'Skip test execution (not recommended)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # pages: write  # REMOVED — pages deployment is exclusively via pages-mkdocs.yml
  id-token: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  # Pre-release validation
  pre_release_validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'pre-release-only' || inputs.mode == 'full-deployment'))
    outputs:
      validation_passed: ${{ steps.validation.outputs.passed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow unified-deployment 2>/dev/null || echo "Cache health: check skipped"
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin pytest plugins (PR #3248)
          # Pin pytest plugins before package install (PR #3248 stability fix)
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0


          pip install -e ".[dev,test]"

      - name: Run validation
        id: validation
        run: |
          if [ "${{ inputs.skip_tests }}" != "true" ]; then
            pytest tests/ -v --tb=short --timeout=300 || exit 1
          fi
          echo "passed=true" >> $GITHUB_OUTPUT

      - name: Validate version format
        if: inputs.version != ''
        run: |
          if ! echo "${{ inputs.version }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format. Expected: X.Y.Z"
            exit 1
          fi

  # Cognitive app build
  # NOTE: This job builds the cognitive app but uploads a standard artifact
  # (NOT a Pages artifact). The MkDocs workflow (pages-mkdocs.yml) is the ONLY
  # authorised GitHub Pages deployer. It already includes the cognitive_app
  # build via its "Build cognitive_app dashboard" step.
  # Removed: configure-pages, upload-pages-artifact — they competed with
  # pages-mkdocs.yml and caused the MkDocs site to be overwritten on every
  # cognitive_app/** push.
  build_cognitive_app:
    name: Build Cognitive App (artifact only — no Pages deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'cognitive-app-only' || inputs.mode == 'full-deployment'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cognitive_app/package-lock.json

      - name: Install dependencies
        working-directory: cognitive_app
        run: npm ci

      - name: Build application
        working-directory: cognitive_app
        env:
          GITHUB_ACTIONS: true
        run: npm run build

      # Upload as a plain artifact for inspection/caching.
      # Pages deployment is handled exclusively by pages-mkdocs.yml.
      - name: Upload cognitive_app build artifact
        uses: actions/upload-artifact@v5
        with:
          name: cognitive-app-dist-${{ github.sha }}
          path: cognitive_app/dist
          retention-days: 7

  # deploy_cognitive_app REMOVED — was competing with pages-mkdocs.yml.
  # The MkDocs workflow is the single authorised GitHub Pages deployer.
  # It merges the cognitive_app into site/cognitive_app/ at build time.

  # Pre-release build
  pre_release_build:
    name: Build Pre-Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [pre_release_validate]
    if: |
      needs.pre_release_validate.result == 'success' &&
      needs.pre_release_validate.outputs.validation_passed == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pre-release-build-${{ inputs.version || github.sha }}
          path: dist/
          retention-days: 90

  # Pre-release publish
  pre_release_publish:
    name: Publish Pre-Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [pre_release_build]
    if: needs.pre_release_build.result == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: pre-release-build-${{ inputs.version || github.sha }}
          path: dist/

      - name: Create GitHub Release
        if: inputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "Pre-Release v${{ inputs.version }}" \
            --notes "Pre-release version ${{ inputs.version }}" \
            --prerelease \
            dist/*

  # Unified summary
  deployment_summary:
    name: Generate Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build_cognitive_app, pre_release_validate, pre_release_build, pre_release_publish]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 Unified Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.mode || 'cognitive-app (auto)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Cognitive App Build: ${{ needs.build_cognitive_app.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Cognitive App Deploy: handled by pages-mkdocs.yml (MkDocs is the sole Pages deployer)" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-Release Validation: ${{ needs.pre_release_validate.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-Release Build: ${{ needs.pre_release_build.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-Release Publish: ${{ needs.pre_release_publish.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.version }}" != "" ]; then
            echo "✅ Pre-release version: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
