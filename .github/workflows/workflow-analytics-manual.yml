name: Manual Workflow Analytics

on:
  workflow_dispatch:
    inputs:
      analysis_period:
        description: 'Number of recent workflow runs to analyze'
        required: true
        default: '50'
        type: choice
        options:
          - '20'
          - '50'
          - '100'
          - '200'
      
      workflow_filter:
        description: 'Filter by specific workflow name (leave empty for all)'
        required: false
        type: string
      
      status_filter:
        description: 'Filter by workflow status'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'failure'
          - 'success'
          - 'action_required'
          - 'cancelled'
      
      create_report:
        description: 'Generate detailed markdown report'
        required: true
        default: true
        type: boolean
      
      create_issue:
        description: 'Create GitHub issue with findings if patterns detected'
        required: true
        default: false
        type: boolean
      
      create_pr:
        description: 'Create PR with proposed improvements (experimental)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  analyze-workflows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyyaml jq
      
      - name: Run Workflow Analytics
        id: analytics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/workflow_analytics_runner.py \
            --analysis-period "${{ inputs.analysis_period }}" \
            --workflow-filter "${{ inputs.workflow_filter }}" \
            --status-filter "${{ inputs.status_filter }}" \
            --output-dir ".codex/reports" \
            --create-report "${{ inputs.create_report }}" \
            --run-id "${{ github.run_id }}"
      
      - name: Upload Analytics Report
        if: inputs.create_report == true
        uses: actions/upload-artifact@v4
        with:
          name: workflow-analytics-report-${{ github.run_id }}
          path: |
            .codex/reports/workflow_analytics_*.json
            .codex/reports/workflow_analytics_*.md
          retention-days: 90
      
      - name: Create Issue with Findings
        if: inputs.create_issue == true && steps.analytics.outputs.patterns_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_FILE=$(ls -t .codex/reports/workflow_analytics_*.md | head -1)
          
          # Extract key findings
          SUMMARY=$(grep -A 10 "## Executive Summary" "$REPORT_FILE" || echo "See full report")
          
          gh issue create \
            --title "🔍 Workflow Analytics: Patterns Detected (Run #${{ github.run_id }})" \
            --body-file "$REPORT_FILE" \
            --label "ci/cd,analytics,automation" \
            --assignee "${{ github.actor }}"
      
      - name: Create Improvement PR
        if: inputs.create_pr == true && steps.analytics.outputs.has_suggestions == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create branch for improvements
          BRANCH_NAME="workflow-improvements-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          
          # Apply any auto-generated improvements
          if [ -f .codex/reports/workflow_improvements.patch ]; then
            git apply .codex/reports/workflow_improvements.patch
          fi
          
          # Commit changes
          git add .
          git commit -m "chore: Apply workflow improvements from analytics

          Generated by Workflow Analytics Agent
          Run ID: ${{ github.run_id }}
          Analysis Period: ${{ inputs.analysis_period }} runs
          
          See report: .codex/reports/workflow_analytics_*.md"
          
          # Push and create PR
          git push origin "$BRANCH_NAME"
          
          gh pr create \
            --title "🚀 Workflow Improvements from Analytics" \
            --body "## Automated Improvements

          This PR contains workflow improvements identified by the Workflow Analytics Agent.

          **Run ID**: ${{ github.run_id }}
          **Analysis Period**: ${{ inputs.analysis_period }} runs
          **Status Filter**: ${{ inputs.status_filter }}

          ### Changes Applied
          
          See the full analytics report in the artifacts for details.

          ### Review Checklist
          - [ ] Review proposed changes
          - [ ] Verify improvements are safe
          - [ ] Test in isolated workflow runs
          - [ ] Merge when validated

          **Auto-generated by**: Workflow Analytics Agent" \
            --label "ci/cd,enhancement,automation" \
            --assignee "${{ github.actor }}"
      
      - name: Comment Summary
        if: always()
        run: |
          echo "## 📊 Workflow Analytics Summary"
          echo ""
          echo "**Analysis Period**: ${{ inputs.analysis_period }} runs"
          echo "**Workflow Filter**: ${{ inputs.workflow_filter || 'All workflows' }}"
          echo "**Status Filter**: ${{ inputs.status_filter }}"
          echo ""
          echo "**Reports Created**: ${{ inputs.create_report }}"
          echo "**Issue Created**: ${{ inputs.create_issue }}"
          echo "**PR Created**: ${{ inputs.create_pr }}"
          echo ""
          echo "Check artifacts for detailed reports."
          
          # Output to step summary
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 📊 Workflow Analytics Complete
          
          ### Configuration
          - **Analysis Period**: ${{ inputs.analysis_period }} runs
          - **Workflow Filter**: ${{ inputs.workflow_filter || 'All workflows' }}
          - **Status Filter**: ${{ inputs.status_filter }}
          
          ### Actions Taken
          - **Report Generated**: ${{ inputs.create_report }}
          - **Issue Created**: ${{ inputs.create_issue }}
          - **PR Created**: ${{ inputs.create_pr }}
          
          ### Next Steps
          1. Review the generated report in artifacts
          2. Check for any created issues or PRs
          3. Implement recommended improvements
          
          EOF
