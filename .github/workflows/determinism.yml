name: Determinism & Audit Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'training/**'
      - 'tokenization/**'
  workflow_dispatch:

jobs:
  determinism-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2
      
      - name: Run full audit
        id: audit
        continue-on-error: true
        run: |
          python scripts/space_traversal/audit_runner.py run || echo "Audit skipped (dependencies missing)"
      
      - name: Run determinism verification (2 runs)
        id: determinism
        continue-on-error: true
        run: |
          python scripts/space_traversal/verify_determinism.py --runs 2 || echo "Determinism check skipped (dependencies missing)"
      
      - name: Strict conflicts check (CI gating)
        id: conflicts
        run: |
          python scripts/remediation/verify_conflicts.py \
            --mode strict \
            --output audit_artifacts/conflicts.json
      
      - name: Generate audit dashboard
        id: dashboard
        continue-on-error: true
        run: |
          python scripts/generate_audit_dashboard.py
          echo "Dashboard generated successfully"
      
      - name: Upload determinism artifacts
        uses: actions/upload-artifact@v6
        with:
          name: determinism-audit-${{ github.run_number }}
          path: |
            index.html
            audit_artifacts/**
            audit_run_manifest.json
            reports/capability_matrix_*.md
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let conflicts = {};
            try {
              conflicts = JSON.parse(fs.readFileSync('audit_artifacts/conflicts.json', 'utf8'));
            } catch (e) {
              conflicts = {duplicates: [], violations: []};
            }
            
            const body = `## 🔍 Determinism & Validation Results
            
            **Audit**: ${{ steps.audit.outcome }}
            **Determinism**: ${{ steps.determinism.outcome }}
            **Conflicts**: ${{ steps.conflicts.outcome }}
            **Dashboard**: ${{ steps.dashboard.outcome }}
            
            ### Conflict Detection (Strict Mode)
            - Duplicates found: ${conflicts.duplicates ? conflicts.duplicates.length : 0}
            - Whitelisted: ${conflicts.whitelisted ? conflicts.whitelisted.length : 0}
            - Violations: ${conflicts.violations ? conflicts.violations.length : 0}
            
            ${conflicts.violations && conflicts.violations.length > 0 ? 
              '⚠️ **Non-whitelisted duplicates detected** - see artifacts for details' : 
              '✅ All duplicates are whitelisted or no conflicts found'}
            
            ### Artifacts
            - [Download audit artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 📊 **View the interactive dashboard** by downloading the artifacts and opening \`index.html\`
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
