name: Sigstore Dependency Verification
on:
  workflow_dispatch:
    inputs:
      requirements_file:
        description: 'Path to requirements/lock file (default: requirements/lock.txt)'
        required: false
        default: requirements/lock.txt
      critical_only:
        description: Verify critical packages only
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
    - requirements/**
    - uv.lock
    - pyproject.toml
    - scripts/security/sigstore_verify.py
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sigstore-verify:
    name: Sigstore Signature Verification
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13

    - name: Install sigstore SDK (best-effort)
      run: 'pip install sigstore --quiet || echo "sigstore SDK not available; running
        in structured-warning mode"

        '
    - name: Determine requirements file
      id: req_file
      run: "if [ \"${{ github.event_name }}\" = \"workflow_dispatch\" ]; then\n  REQ=\"\
        ${{ github.event.inputs.requirements_file }}\"\nelif [ -f \"requirements/lock.txt\"\
        \ ]; then\n  REQ=\"requirements/lock.txt\"\nelif [ -f \"uv.lock\" ]; then\n\
        \  REQ=\"uv.lock\"\nelse\n  REQ=\"requirements.txt\"\nfi\necho \"path=${REQ}\"\
        \ >> \"${GITHUB_OUTPUT}\"\necho \"Using requirements file: ${REQ}\"\n"
    - name: Run Sigstore verification
      id: verify
      run: "EXTRA_FLAGS=\"\"\nif [ \"${{ github.event.inputs.critical_only }}\" =\
        \ \"true\" ]; then\n  EXTRA_FLAGS=\"--critical-only\"\nfi\npython scripts/security/sigstore_verify.py\
        \ \\\n  --requirements \"${{ steps.req_file.outputs.path }}\" \\\n  --output\
        \ sigstore-report.json \\\n  ${EXTRA_FLAGS}\n"
    - name: Display verification summary
      if: always()
      run: "if [ -f sigstore-report.json ]; then\n  echo \"=== Sigstore Verification\
        \ Summary ===\"\n  python - <<'EOF'\nimport json, sys\nwith open(\"sigstore-report.json\"\
        ) as f:\n    r = json.load(f)\ns = r[\"summary\"]\nprint(f\"Total packages:\
        \    {s['total']}\")\nprint(f\"Verified:          {s['verified']}\")\nprint(f\"\
        Unverified:        {s['unverified']}  (no Sigstore bundle \u2014 expected\
        \ for most packages)\")\nprint(f\"Errors/Mismatches: {s['errors']}\")\nprint(f\"\
        Sigstore SDK:      {'available' if r['sigstore_sdk_available'] else 'not installed\
        \ (warning mode)'}\")\nif r[\"errors\"]:\n    print(\"\\n--- Errors/Mismatches\
        \ ---\")\n    for e in r[\"errors\"]:\n        crit = \" [CRITICAL]\" if e.get(\"\
        critical\") else \"\"\n        print(f\"  {e['name']}=={e['version']} ({e['status']}){crit}:\
        \ {e['detail']}\")\nEOF\nelse\n  echo \"No report file generated.\"\nfi\n"
    - name: Upload verification report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: sigstore-report.json
        if-no-files-found: warn
        retention-days: 30
        name: sigstore-verification-report-${{ github.run_id }}
    timeout-minutes: 30
