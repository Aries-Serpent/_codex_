    - name: 'REQ-10: Branch rebase check (hard block if behind/diverged)'
      id: req10
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const REQUIRED_MARKER = 'BRANCH_REBASE_REQUIRED';\nconst RESOLVED_MARKER\
          \ = 'BRANCH_REBASE_RESOLVED';\nconst prNumber = context.issue.number;\n\n\
          core.info(`REQ-10: Checking rebase status for PR  #${prNumber}`);\n\n//\
          \ Helper: check whether all commits in an array are automated\n// [skip\
          \ ci] github-actions[bot] commits.  When true the gap\n// contains only\
          \ metadata updates and is safe to auto-pass.\nconst BOT_LOGINS = new Set([\n\
          \  'github-actions[bot]',\n  '41898282+github-actions[bot]',\n]);\nfunction\
          \ gapIsAllBotSkipCi(commits) {\n  if (!commits || commits.length === 0)\
          \ return false;\n  return commits.every(c => {\n    const login = (c.author\
          \  && c.author.login)          || '';\n    const msg   = (c.commit  && c.commit.message)\
          \        || '';\n    return BOT_LOGINS.has(login) && msg.toLowerCase().includes('[skip\
          \ ci]');\n  });\n}\n\n// Helper: fetch commits that `base` has but `head`\
          \ is missing\n// (the \"gap\" \u2014 what the PR branch needs to absorb).\n\
          async function fetchGapCommits(base, head) {\n  try {\n    const { data:\
          \ rev } = await github.rest.repos.compareCommitsWithBasehead({\n      owner:\
          \ context.repo.owner,\n      repo:  context.repo.repo,\n      basehead:\
          \ `${head}...${base}`,   // reversed: commits in base \u2216 head\n    });\n\
          \    return rev.commits || [];\n  } catch (e) {\n    core.warning(`REQ-10:\
          \ could not fetch gap commits: ${e.message}`);\n    return [];\n  }\n}\n\
          \n// Fetch all PR comments\nconst { data: comments } = await github.rest.issues.listComments({\n\
          \  owner: context.repo.owner,\n  repo:  context.repo.repo,\n  issue_number:\
          \ prNumber,\n  per_page: 100,\n});\n\n// Find the latest REQUIRED and RESOLVED\
          \ markers\nconst required = comments.filter(c => (c.body || '').includes(REQUIRED_MARKER));\n\
          const resolved = comments.filter(c => (c.body || '').includes(RESOLVED_MARKER));\n\
          \nif (required.length === 0) {\n  // No rebase-required marker \u2192 check\
          \ live compare API as fallback\n  const pr = context.payload.pull_request;\n\
          \  if (pr) {\n    const base = pr.base.ref;\n    const head = pr.head.ref;\n\
          \    try {\n      const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({\n\
          \        owner: context.repo.owner,\n        repo:  context.repo.repo,\n\
          \        basehead: `${base}...${head}`,\n      });\n      const status \
          \  = cmp.status;\n      const behindBy = cmp.behind_by || 0;\n      core.info(`Compare\
          \ ${base}...${head}: status=${status}, behind_by=${behindBy}`);\n\n    \
          \  await core.summary\n        .addHeading('REQ-10: Branch Rebase Check',\
          \ 3)\n        .addRaw(`\\n\\`${head}\\` vs \\`${base}\\`: **${status}**\
          \ (behind=${behindBy})\\n`)\n        .write();\n\n      if (status === 'behind'\
          \ || status === 'diverged') {\n        // Auto-pass when the entire gap\
          \ is [skip ci] bot commits.\n        const gap       = await fetchGapCommits(base,\
          \ head);\n        const allBotGap = gapIsAllBotSkipCi(gap);\n        if\
          \ (allBotGap) {\n          core.info(\n            `REQ-10 PASS: branch\
          \ is ${status} but all ${gap.length} gap ` +\n            `commit(s) are\
          \ [skip ci] bot metadata commits \u2014 no rebase needed.`\n          );\n\
          \        } else {\n          core.setFailed(\n            `REQ-10 FAIL:\
          \ Branch '${head}' is ${behindBy} commit(s) BEHIND '${base}'. ` +\n    \
          \        `Rebase before starting agent work:\\n  git fetch origin ${base}\\\
          n  git rebase origin/${base}\\n  git push --force-with-lease`\n        \
          \  );\n        }\n      } else {\n        core.info(`REQ-10 PASS: branch\
          \ is ${status} (no rebase needed)`);\n      }\n    } catch (err) {\n   \
          \   core.warning(`REQ-10: Could not compare branches: ${err.message} \u2014\
          \ soft warning`);\n    }\n  }\n  return;\n}\n\n// There is a REQUIRED marker\
          \ \u2014 check if a RESOLVED marker follows it\nconst latestRequired = required.sort(\n\
          \  (a, b) => new Date(b.updated_at) - new Date(a.updated_at)\n)[0];\nconst\
          \ latestResolved = resolved.length > 0\n  ? resolved.sort((a, b) => new\
          \ Date(b.updated_at) - new Date(a.updated_at))[0]\n  : null;\n\nconst requiredTs\
          \ = new Date(latestRequired.updated_at);\nconst resolvedTs = latestResolved\
          \ ? new Date(latestResolved.updated_at) : null;\n\nconst markerResolved\
          \ = resolvedTs && resolvedTs > requiredTs;\n\n// Even if no RESOLVED marker,\
          \ check the live branch comparison API.\n// The branch may have been rebased\
          \ since the REQUIRED marker was posted,\n// in which case the live check\
          \ should confirm it is up-to-date.\nlet liveResolved = false;\nconst pr\
          \ = context.payload.pull_request;\nif (!markerResolved && pr) {\n  try {\n\
          \    const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({\n\
          \      owner: context.repo.owner,\n      repo:  context.repo.repo,\n   \
          \   basehead: `${pr.base.ref}...${pr.head.ref}`,\n    });\n    const liveStatus\
          \ = cmp.status;\n    const behindBy   = cmp.behind_by || 0;\n    core.info(`Live\
          \ compare ${pr.base.ref}...${pr.head.ref}: status=${liveStatus}, behind_by=${behindBy}`);\n\
          \    liveResolved = (liveStatus === 'ahead' || liveStatus === 'identical');\n\
          \    if (liveResolved) {\n      core.info('REQ-10: Live compare shows branch\
          \ is up-to-date \u2014 treating REQUIRED marker as stale.');\n    } else\
          \ if (liveStatus === 'behind' || liveStatus === 'diverged') {\n      //\
          \ Auto-pass when the entire gap is [skip ci] bot commits.\n      const gap\
          \       = await fetchGapCommits(pr.base.ref, pr.head.ref);\n      const\
          \ allBotGap = gapIsAllBotSkipCi(gap);\n      if (allBotGap) {\n        core.info(\n\
          \          `REQ-10: All ${gap.length} gap commit(s) are [skip ci] bot metadata\
          \ ` +\n          `commits \u2014 treating REQUIRED marker as auto-resolved.`\n\
          \        );\n        liveResolved = true;\n      }\n    }\n  } catch (err)\
          \ {\n    core.warning(`REQ-10: Could not perform live compare: ${err.message}`);\n\
          \  }\n}\n\nconst isResolved = markerResolved || liveResolved;\n\nawait core.summary\n\
          \  .addHeading('REQ-10: Branch Rebase Check', 3)\n  .addRaw(isResolved\n\
          \    ? `\\n\u2705 PASS \u2014 Branch is up-to-date (marker resolved or live\
          \ compare confirms no rebase needed)\\n`\n    : `\\n\U0001F534 FAIL \u2014\
          \ \\`BRANCH_REBASE_REQUIRED\\` marker present (${requiredTs.toISOString()})\
          \ and branch still behind/diverged.\\n`\n  )\n  .write();\n\nif (!isResolved)\
          \ {\n  core.setFailed(\n    'REQ-10 FAIL: A BRANCH_REBASE_REQUIRED marker\
          \ is present and branch is still behind/diverged. ' +\n    'The Copilot\
          \ Agent MUST rebase the branch before starting work. ' +\n    'See the BRANCH_REBASE_REQUIRED\
          \ comment on this PR for instructions.'\n  );\n} else {\n  core.info('REQ-10\
          \ PASS: Branch is up-to-date \u2014 rebase gate cleared.');\n}\n"
    - name: Cognitive Pre-flight Final Status
      if: always()
      run: "echo \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"---\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nif [ \"${{ job.status }}\" == \"success\" ]; then\n  echo \"## \U0001F7E2\
        \ COGNITIVE PRE-FLIGHT: ALL CHECKS PASSED\" >> \"$GITHUB_STEP_SUMMARY\"\n\
        \  echo \"Session activation is **unblocked**. \\`activate-delegation\\` may\
        \ proceed.\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"## \U0001F6AB COGNITIVE\
        \ PRE-FLIGHT: SESSION BLOCKED\" >> \"$GITHUB_STEP_SUMMARY\"\n  echo \"Resolve\
        \ all \u274C items above. \\`activate-delegation\\` will not run until this\
        \ job passes.\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"_WF-001 | cognitive-preflight gate | .codex/CODEBASE_AGENCY_POLICY.md_\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  activate-delegation:
    name: Activate token delegation
    needs:
    - detect-checkbox
    - await-approval
    - cognitive-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: 'always() &&

      github.event.action != ''closed'' &&

      github.actor != ''dependabot[bot]'' &&

      github.actor != ''dependabot-preview[bot]'' &&

      needs.detect-checkbox.result == ''success'' &&

      needs.detect-checkbox.outputs.auth_requested == ''true'' &&

      (needs.cognitive-preflight.result == ''success'' || needs.cognitive-preflight.result
      == ''failure'') &&

      (needs.await-approval.result == ''success'' || needs.await-approval.result ==
      ''skipped'')

      '
    steps:
    - name: Cache Python dependencies (Layer 1)
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml')
          }}
        restore-keys: '${{ runner.os }}-pip-

          '
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        ref: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name
          }}
    - name: Validate/Refresh Session ID (CAPI Readiness Check)
      id: session_validation
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "if [ -n \"${COPILOT_AGENT_SESSION_ID:-}\" ]; then\n  echo \"Checking session\
        \ validity...\"\n  HTTP_CODE=$(curl -s -o /dev/null -w \"%{http_code}\" \\\
        \n    -H \"Authorization: ******\" \\\n    -H \"Accept: application/vnd.github+json\"\
        \ \\\n    \"https://api.github.com/repos/${{ github.repository }}/copilot/sessions/${COPILOT_AGENT_SESSION_ID}\"\
        \ \\\n    2>/dev/null || echo \"000\")\n\n  if [ \"$HTTP_CODE\" = \"200\"\
        \ ]; then\n    echo \"\u2705 Session valid. Proceeding with reuse.\"\n   \
        \ echo \"session_status=valid\" >> \"$GITHUB_OUTPUT\"\n  else\n    echo \"\
        \u26A0\uFE0F Session expired (HTTP ${HTTP_CODE}). Clearing for refresh.\"\n\
        \    unset COPILOT_AGENT_SESSION_ID\n    echo \"session_status=refreshed\"\
        \ >> \"$GITHUB_OUTPUT\"\n  fi\nelse\n  echo \"\u2139\uFE0F No session in environment.\
        \ Will be created fresh.\"\n  echo \"session_status=fresh\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
    - name: Set repo variables via CODEX_MASTER_KEY (maintainer auth)
      id: set_vars
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "// Helper: upsert a repo variable (create if 404, patch if exists)\n\
          async function upsertVar(name, value) {\n  try {\n    await github.request('PATCH\
          \ /repos/{owner}/{repo}/actions/variables/{name}', {\n      owner: context.repo.owner,\n\
          \      repo:  context.repo.repo,\n      name,\n      value,\n    });\n \
          \   core.info(`\u2705 PATCH ${name} = ${value}`);\n  } catch (e) {\n   \
          \ if (e.status === 404) {\n      await github.request('POST /repos/{owner}/{repo}/actions/variables',\
          \ {\n        owner: context.repo.owner,\n        repo:  context.repo.repo,\n\
          \        name,\n        value,\n      });\n      core.info(`\u2705 POST\
          \ (create) ${name} = ${value}`);\n    } else {\n      throw e;\n    }\n\
          \  }\n}\n\n// 1. Enable agent auth flag\nawait upsertVar('COPILOT_AGENT_AUTH_ENABLED',\
          \ 'true');\n\n// 2. Ensure all three delegated agent identities are present\n\
          //    (S110 Set-based exact-match pattern \u2014 no partial-name false positives)\n\
          const REQUIRED_AGENTS = [\n  'copilot-swe-agent[bot]',   // GitHub Copilot\
          \ coding agent\n  'github-copilot[bot]',       // Copilot custom agents\n\
          \  'github-actions[bot]',       // CI/AI workflow agents\n];\n\nlet currentActors\
          \ = 'mbaetiong,github-actions[bot]';\ntry {\n  const resp = await github.request(\n\
          \    'GET /repos/{owner}/{repo}/actions/variables/{name}',\n    { owner:\
          \ context.repo.owner, repo: context.repo.repo,\n      name: 'COGNITIVE_BRAIN_ALLOWED_ACTORS'\
          \ }\n  );\n  currentActors = resp.data.value || currentActors;\n} catch\
          \ (e) {\n  core.warning(`Could not fetch COGNITIVE_BRAIN_ALLOWED_ACTORS:\
          \ ${e.message}`);\n}\n\nconst actorSet = new Set(\n  currentActors.split(',').map(a\
          \ => a.trim()).filter(a => a.length > 0)\n);\nfor (const agent of REQUIRED_AGENTS)\
          \ { actorSet.add(agent); }\nconst updatedActors = Array.from(actorSet).join(',');\n\
          \nawait upsertVar('COGNITIVE_BRAIN_ALLOWED_ACTORS', updatedActors);\ncore.info(`\u2705\
          \ COGNITIVE_BRAIN_ALLOWED_ACTORS: ${updatedActors}`);\n\ncore.setOutput('updated_actors',\
          \ updatedActors);\n"
    - name: Dispatch hub for token delegation approval (agent-auth-delegation)
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner = context.repo.owner;\nconst repo = context.repo.repo;\n\
          const prNumber = parseInt('${{ needs.detect-checkbox.outputs.pr_number }}',\
          \ 10);\n\ncore.info(`Dispatching auto-approve-workflows.yml for agent token\
          \ delegation (PR  #${prNumber})`);\n\ntry {\n  await github.rest.actions.createWorkflowDispatch({\n\
          \    owner,\n    repo,\n    workflow_id: 'auto-approve-workflows.yml',\n\
          \    ref: 'main',\n    inputs: {\n      approval_source: 'agent-auth-delegation',\n\
          \      approval_intent: 'conditional_approve',\n      target_pr: prNumber.toString(),\n\
          \      approval_reason: 'Agent token delegation approval from owner',\n\
          \      approval_ttl_hours: '8',\n      dry_run: 'false'\n    }\n  });\n\
          \  core.info('\u2705 auto-approve-workflows.yml dispatched for token delegation');\n\
          } catch (err) {\n  core.warning(`Hub dispatch failed: ${err.message}`);\n\
          }\n"
      continue-on-error: true
    - name: Write provenance session token (.codex/agent_auth_session.json)
      run: "mkdir -p .codex\nEXPIRY=$(( $(date +%s) + 43200 ))\ncat > .codex/agent_auth_session.json\
        \ <<EOF\n{\n  \"issued_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n  \"expires_at\"\
        : ${EXPIRY},\n  \"issued_by\": \"agent-auth-delegation\",\n  \"run_id\": \"\
        ${{ github.run_id }}\",\n  \"run_url\": \"https://github.com/${{ github.repository\
        \  }}/actions/runs/${{ github.run_id }}\",\n  \"pr_number\": \"${{ needs.detect-checkbox.outputs.pr_number\
        \  }}\",\n  \"bypass_tools\": \"\",\n  \"note\": \"Provenance-chain token.\
        \ Allows all agent sessions to bypass owner_approval_guard within TTL. Renew\
        \ by re-triggering agent-auth-delegation.\"\n}\nEOF\necho \"\u2705 Session\
        \ token written (expires in 12h at epoch ${EXPIRY})\"\ncat .codex/agent_auth_session.json\n"
      shell: bash
    - name: Commit session token to branch
      env:
        TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.head_ref ||
          '' }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number
          || '' }}
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "# S932 rebasing guard:\n# During active PR iteration, avoid writing housekeeping\
        \ commits to the PR branch.\n# This prevents churn/rebase loops caused by\
        \ repeated auth-token refresh commits.\nif [ \"${{ github.event_name }}\"\
        \ = \"pull_request\" ]; then\n  echo \"\u2139\uFE0F Skipping session-token\
        \ commit on pull_request to avoid branch churn.\"\n  exit 0\nfi\n\n# Resolve\
        \ TARGET_BRANCH \u2014 fall back to API lookup when event context lacks head.ref\n\
        if [ -z \"${TARGET_BRANCH}\" ] && [ -n \"${PR_NUMBER}\" ]; then\n  TARGET_BRANCH=$(gh\
        \ pr view \"${PR_NUMBER}\" --json headRefName -q .headRefName 2>/dev/null\
        \ || true)\nfi\nif [ -z \"${TARGET_BRANCH}\" ] || echo \"${TARGET_BRANCH}\"\
        \ | grep -qE '^[0-9]+/merge$'; then\n  echo \"::warning::Could not resolve\
        \ target branch (got '${TARGET_BRANCH}'). Skipping commit.\"\n  exit 0\nfi\n\
        git config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\
        \ngit add .codex/agent_auth_session.json\nif git diff --cached --quiet; then\n\
        \  echo \"No changes to commit\"\nelse\n  git commit -m \"chore(auth): write\
        \ provenance session token [skip ci]\"\n  git pull --rebase --autostash origin\
        \ \"${TARGET_BRANCH}\" || true\n  git push origin HEAD:refs/heads/${TARGET_BRANCH}\n\
        fi\n"
    - name: Dispatch GitHub Guru (maintainer verification)
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        script: "try {\n  await github.rest.actions.createWorkflowDispatch({\n   \
          \ owner:       context.repo.owner,\n    repo:        context.repo.repo,\n\
          \    workflow_id: 'github-guru.yml',\n    ref:         context.ref || 'main',\n\
          \    inputs: {\n      mode: 'pr_only',\n    },\n  });\n  core.info('\u2705\
          \ GitHub Guru dispatched for maintainer variable verification');\n} catch\
          \ (e) {\n  core.warning(`GitHub Guru dispatch skipped: ${e.message}`);\n\
          }\n"
    - name: D-00 Session Bootstrap (write context digest)
      id: session_bootstrap
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        PR_BODY: ${{ github.event.pull_request.body || '' }}
        PR_NUMBER: ${{ needs.detect-checkbox.outputs.pr_number }}
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
      run: "set -euo pipefail\necho \"## \U0001F50D D-00 Session Bootstrap\" >> \"\
        $GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\nif [ ! -f\
        \ \"scripts/ci/session_bootstrap.py\" ]; then\n  echo \"\u26A0\uFE0F session_bootstrap.py\
        \ not found \u2014 skipping D-00 step\" | tee -a \"$GITHUB_STEP_SUMMARY\"\n\
        \  exit 0\nfi\n\n# Build a minimal context string: PR URL + body\nREPO=\"\
        ${{ github.repository }}\"\nPR_URL=\"https://github.com/${REPO}/pull/${PR_NUMBER}\"\
        \nCONTEXT_TEXT=\"${PR_URL}\"$'\\n'\"${PR_BODY}\"\n\n# Run bootstrap in offline\
        \ mode (no external URL fetching in CI),\n# skip triage (already runs in cognitive-preflight\
        \ job).\necho \"${CONTEXT_TEXT}\" | \\\n  python scripts/ci/session_bootstrap.py\
        \ \\\n    --offline \\\n    --skip-triage \\\n    --json-out .codex/session_context_latest.json\
        \ \\\n    2>&1 | tail -20 | tee -a \"$GITHUB_STEP_SUMMARY\" || true\n\n# S932\
        \ rebasing guard:\n# Skip digest commit on pull_request to prevent repeated\
        \ housekeeping commits\n# that force local rebases during active PR coding\
        \ sessions.\nif [ \"${{ github.event_name }}\" = \"pull_request\" ]; then\n\
        \  echo \"\u2139\uFE0F Skipping context-digest commit on pull_request to avoid\
        \ branch churn.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\n  exit 0\nfi\n\n# Commit\
        \ the context digest if it was written/modified\nif git diff --quiet .codex/session_context_latest.md\
        \ .codex/session_context_latest.json 2>/dev/null; then\n  echo \"\u2139\uFE0F\
        \ Context digest unchanged \u2014 no commit needed.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\
        \nelse\n  git add .codex/session_context_latest.md .codex/session_context_latest.json\
        \ 2>/dev/null || true\n  _commit_ok=false\n  _push_ok=false\n  if git commit\
        \ -m \"chore(d00): update session context digest [skip ci]\" 2>/dev/null;\
        \ then\n    _commit_ok=true\n    if git push origin HEAD 2>/dev/null; then\n\
        \      _push_ok=true\n    fi\n  fi\n  if [ \"$_commit_ok\" = \"true\" ] &&\
        \ [ \"$_push_ok\" = \"true\" ]; then\n    echo \"\u2705 Context digest committed\
        \ and pushed.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\n  elif [ \"$_commit_ok\"\
        \ = \"true\" ]; then\n    echo \"\u26A0\uFE0F Context digest committed but\
        \ push failed \u2014 will retry on next run.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\
        \n  else\n    echo \"\u26A0\uFE0F Context digest staged but commit failed\
        \ (possibly nothing to commit).\" | tee -a \"$GITHUB_STEP_SUMMARY\"\n  fi\n\
        fi\n"
    - name: Retrieve CB patterns for session context
      id: cb_patterns
      continue-on-error: true
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
      run: "CB_BLOCK=$(python -m codex.github.mcp_poster retrieve-patterns --limit\
        \ 8 2>/dev/null || true)\n# Escape for multiline GitHub output\n{\n  echo\
        \ 'cb_markdown<<CB_EOF'\n  echo \"$CB_BLOCK\"\n  echo 'CB_EOF'\n} >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Session Concurrency Gate
      id: session_gate
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        script: "const prNumber = parseInt('${{ needs.detect-checkbox.outputs.pr_number\
          \  }}', 10);\nif (isNaN(prNumber) || prNumber <= 0) {\n  core.warning('Invalid\
          \ PR number for session gate \u2014 skipping lock');\n  core.setOutput('acquired',\
          \ 'true');\n  core.setOutput('queued', 'false');\n  return;\n}\nconst multiSession\
          \ = '${{ needs.detect-checkbox.outputs.multi_session }}' === 'true';\n//\
          \ TTL is configurable via the COPILOT_SESSION_TTL_SECONDS repo variable.\n\
          // Default: 43200 (12 h) for initial system operation; tighten to 3600 (1\
          \ h)\n// once concurrency is stable by setting the repo variable.\nconst\
          \ TTL_SECONDS = parseInt('${{ vars.COPILOT_SESSION_TTL_SECONDS }}', 10)\
          \ || 43200;\nconst now = Math.floor(Date.now() / 1000);\nconst { isRateLimit\
          \ } = require('./scripts/ci/github_rate_limit_helper.js');\n\n// Helper:\
          \ get repo variable (returns null if not found)\nasync function getVar(name)\
          \ {\n  try {\n    const { data } = await github.request('GET /repos/{owner}/{repo}/actions/variables/{name}',\
          \ {\n      owner: context.repo.owner, repo: context.repo.repo, name,\n \
          \   });\n    return data.value || '';\n  } catch (e) {\n    if (e.status\
          \ === 404) return '';\n    if (isRateLimit(e)) {\n      core.warning(`Rate\
          \ limit while reading ${name}; continuing without queue mutation.`);\n \
          \     return '';\n    }\n    throw e;\n  }\n}\n\n// Helper: upsert repo\
          \ variable\nasync function upsertVar(name, value) {\n  try {\n    await\
          \ github.request('PATCH /repos/{owner}/{repo}/actions/variables/{name}',\
          \ {\n      owner: context.repo.owner, repo: context.repo.repo, name, value,\n\
          \    });\n  } catch (e) {\n    if (e.status === 404) {\n      await github.request('POST\
          \ /repos/{owner}/{repo}/actions/variables', {\n        owner: context.repo.owner,\
          \ repo: context.repo.repo, name, value,\n      });\n    } else if (isRateLimit(e))\
          \ {\n      core.warning(`Rate limit while writing ${name}; continuing without\
          \ queue mutation.`);\n    } else { throw e; }\n  }\n}\n// GitHub API rejects\
          \ empty-string variable values (422). Use DELETE to clear.\nasync function\
          \ clearVar(name) {\n  try {\n    await github.request('DELETE /repos/{owner}/{repo}/actions/variables/{name}',\
          \ {\n      owner: context.repo.owner, repo: context.repo.repo, name,\n \
          \   });\n  } catch (e) {\n    if (isRateLimit(e)) {\n      core.warning(`Rate\
          \ limit while clearing ${name}; continuing without queue mutation.`);\n\
          \      return;\n    }\n    if (e.status !== 404) throw e;\n  }\n}\n\nconst\
          \ activeSession = await getVar('COPILOT_ACTIVE_SESSION');\n\n// Check if\
          \ there's an active, non-expired session\nlet sessionBusy = false;\nlet\
          \ activePR = '';\nif (activeSession) {\n  const parts = activeSession.split('|');\n\
          \  activePR = parts[0] || '';\n  const lockEpoch = parseInt(parts[1] ||\
          \ '0', 10);\n\n  if (isNaN(lockEpoch)) {\n    core.warning(`Corrupted session\
          \ lock format: '${activeSession}' \u2014 clearing`);\n    await clearVar('COPILOT_ACTIVE_SESSION');\n\
          \    sessionBusy = false;\n  } else {\n    const age = now - lockEpoch;\n\
          \n    if (age < TTL_SECONDS && activePR !== String(prNumber)) {\n      sessionBusy\
          \ = true;\n      core.info(`Active session on PR  #${activePR} (age: ${age}s,\
          \ TTL: ${TTL_SECONDS}s)`);\n    } else if (age >= TTL_SECONDS) {\n     \
          \ core.warning(`Stale session lock cleared (PR  #${activePR}, age: ${age}s\
          \ > TTL ${TTL_SECONDS}s)`);\n      await clearVar('COPILOT_ACTIVE_SESSION');\n\
          \      sessionBusy = false;\n\n      // S230 fix: when a stale TTL lock\
          \ is cleared, also dequeue\n      // and retrigger any PRs that were waiting\
          \ in the queue.\n      // Previously only the `session-release` job (fired\
          \ on PR close)\n      // processed the queue, leaving queued PRs stranded\
          \ when a\n      // session expired naturally (never closed).\n      const\
          \ staleClearedQueue = await getVar('COPILOT_SESSION_QUEUE');\n      if (staleClearedQueue)\
          \ {\n        const staleClearedList = staleClearedQueue.split(',').filter(Boolean);\n\
          \        // Peek at the first entry before mutating the array.\n       \
          \ const nextQueuedPR = parseInt(staleClearedList[0], 10);\n        if (!isNaN(nextQueuedPR)\
          \ && nextQueuedPR > 0 && nextQueuedPR !== prNumber) {\n          core.info(`\U0001F513\
          \ Stale lock cleared \u2014 retriggering queued PR  #${nextQueuedPR}`);\n\
          \          try {\n            await github.rest.issues.createComment({\n\
          \              owner: context.repo.owner,\n              repo: context.repo.repo,\n\
          \              issue_number: nextQueuedPR,\n              body: [\n    \
          \            '<!-- session-gate-dequeued -->',\n                '## \U0001F513\
          \ Session Available (Stale Lock Cleared)',\n                '',\n      \
          \          `Previous session (PR  #${activePR}) exceeded the ${TTL_SECONDS\
          \ / 3600}h TTL and was cleared.`,\n                'This PR has been dequeued\
          \ and the session is now starting.',\n                '',\n            \
          \    '@copilot continue',\n              ].join('\\n'),\n            });\n\
          \            // Remove the dequeued PR from the queue only after the\n \
          \           // comment was successfully posted (review: avoid removing\n\
          \            // from queue if comment creation throws).\n            staleClearedList.shift();\n\
          \            await upsertVar('COPILOT_SESSION_QUEUE', staleClearedList.join(','));\n\
          \            core.info(`\u2705 Retriggered PR  #${nextQueuedPR} after stale\
          \ TTL cleanup`);\n          } catch (err) {\n            core.warning(`Failed\
          \ to retrigger PR  #${nextQueuedPR} after stale lock clear: ${err.message}`);\n\
          \          }\n        } else if (!isNaN(nextQueuedPR) && nextQueuedPR ===\
          \ prNumber) {\n          // Current PR is first in queue \u2014 just clear\
          \ it from the queue\n          staleClearedList.shift();\n          await\
          \ upsertVar('COPILOT_SESSION_QUEUE', staleClearedList.join(','));\n    \
          \      core.info(`Current PR  #${prNumber} was first in queue \u2014 clearing\
          \ from queue and proceeding`);\n        }\n      }\n    } else {\n     \
          \ // Same PR \u2014 re-acquire is fine\n      sessionBusy = false;\n   \
          \ }\n  }\n}\n\nif (sessionBusy && !multiSession) {\n  // Queue this PR \u2014\
          \ don't post @copilot continue\n  core.setOutput('acquired', 'false');\n\
          \  core.setOutput('queued', 'true');\n\n  // Append to queue variable\n\
          \  const queue = await getVar('COPILOT_SESSION_QUEUE');\n  const queueList\
          \ = queue ? queue.split(',').filter(Boolean) : [];\n  if (!queueList.includes(String(prNumber)))\
          \ {\n    queueList.push(String(prNumber));\n    await upsertVar('COPILOT_SESSION_QUEUE',\
          \ queueList.join(','));\n  }\n\n  // S239: upsert the \"\u23F3 Session Queued\"\
          \ comment \u2014 update it with the latest\n  // queue position if it already\
          \ exists, otherwise create it. This keeps\n  // the queue position live\
          \ so observers can see where they stand.\n  // Fetches the most-recent 100\
          \ comments (GitHub max per_page). On very active PRs\n  // (>100 comments)\
          \ an earlier queued marker may not be found; worst case: one extra\n  //\
          \ notification per 100-comment boundary, which is acceptable.\n  const {\
          \ data: prComments } = await github.rest.issues.listComments({\n    owner:\
          \ context.repo.owner, repo: context.repo.repo,\n    issue_number: prNumber,\
          \ per_page: 100,\n  });\n  const queuedCommentBody = [\n    '<!-- session-gate-queued\
          \ -->',\n    '## \u23F3 Session Queued',\n    '',\n    `Another Copilot\
          \ session is active on PR  #${activePR}.`,\n    'This PR has been added\
          \ to the session queue and will be triggered automatically when the active\
          \ session completes.',\n    '',\n    '| Detail | Value |',\n    '|--------|-------|',\n\
          \    `| Active Session | PR  #${activePR} |`,\n    `| Queue Position | ${queueList.length}\
          \ |`,\n    `| Multi-Session | \\`${multiSession}\\` (default: disabled)\
          \ |`,\n    '',\n    '> To enable parallel sessions, check the **Multiple\
          \ Copilot Coding Agent Sessions** checkbox in the PR body.',\n    '',\n\
          \    `_Session Concurrency Gate \u2014 [design](docs/plans/AUTONOMOUS_SELF_HEALING_PROPOSAL_S182.md#session-concurrency-control-design)_`,\n\
          \  ].join('\\n');\n  const existingQueuedComment = prComments.find(c =>\n\
          \    (c.body || '').includes('<!-- session-gate-queued -->')\n  );\n  if\
          \ (existingQueuedComment) {\n    // Update the existing comment with the\
          \ latest queue position.\n    await github.rest.issues.updateComment({\n\
          \      owner: context.repo.owner, repo: context.repo.repo,\n      comment_id:\
          \ existingQueuedComment.id,\n      body: queuedCommentBody,\n    });\n \
          \   core.info(`\u23F3 PR  #${prNumber} queue position updated (position\
          \ ${queueList.length}, active: PR  #${activePR}).`);\n  } else {\n    //\
          \ Post a new queued notification on the PR.\n    await github.rest.issues.createComment({\n\
          \      owner: context.repo.owner,\n      repo: context.repo.repo,\n    \
          \  issue_number: prNumber,\n      body: queuedCommentBody,\n    });\n  \
          \  core.info(`\u23F3 PR  #${prNumber} queued (position ${queueList.length},\
          \ active: PR #${activePR}).`);\n  }\n  core.info(`\u23F3 PR  #${prNumber}\
          \ queued \u2014 active session on PR  #${activePR}`);\n} else {\n  // Acquire\
          \ the session lock\n  const lockValue = `${prNumber}|${now}|${context.runId}`;\n\
          \  await upsertVar('COPILOT_ACTIVE_SESSION', lockValue);\n  core.setOutput('acquired',\
          \ 'true');\n  core.setOutput('queued', 'false');\n  core.info(`\U0001F512\
          \ Session lock acquired: ${lockValue}`);\n}\n"
    - name: Post @copilot continue
      id: post_copilot_comment
      if: steps.session_gate.outputs.acquired == 'true'
      uses: actions/github-script@v9
      env:
        CB_PATTERNS: ${{ steps.cb_patterns.outputs.cb_markdown || '' }}
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const prNumber = parseInt('${{ needs.detect-checkbox.outputs.pr_number\
          \  }}', 10);\nif (!prNumber || prNumber <= 0) {\n  core.setFailed('Invalid\
          \ PR number \u2014 cannot post comment');\n  return;\n}\nconst actors  \
          \  = '${{ steps.set_vars.outputs.updated_actors }}';\nconst runUrl    =\
          \ `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;\n\
          // Read via process.env to prevent code injection via backticks or ${...}\n\
          // in markdown content from breaking the JS template literal.\n// (See review\
          \ comment: cbPatterns interpolation, PR  #3671.)\nconst cbPatterns = (process.env.CB_PATTERNS\
          \ || '').trim();\n\nconst UPSERT_MARKER_DELEGATION = '<!-- agent-token-delegation-result\
          \ -->';\nconst cbSection = cbPatterns\n  ? ['', '---', '', cbPatterns, '']\n\
          \  : [];\nconst body = [\n  UPSERT_MARKER_DELEGATION,\n  '## \U0001F510\
          \ Agent Token Delegation Activated',\n  '',\n  `Owner approval received\
          \ ([workflow run](${runUrl})). Repo variables updated:`,\n  '',\n  '| Variable\
          \ | Value |',\n  '|----------|-------|',\n  '| `COPILOT_AGENT_AUTH_ENABLED`\
          \ | `true` |',\n  `| \\`COGNITIVE_BRAIN_ALLOWED_ACTORS\\` | \\`${actors}\\\
          ` |`,\n  '',\n  '**Delegated agent coverage:**',\n  '- \u2705 `copilot-swe-agent[bot]`\
          \ \u2014 GitHub Copilot coding agent',\n  '- \u2705 `github-copilot[bot]`\
          \ \u2014 Copilot custom agents',\n  '- \u2705 `github-actions[bot]` \u2014\
          \ CI/AI workflow agents',\n  '',\n  '> GitHub Guru (maintainer) has been\
          \ dispatched to verify variable state.',\n  ...cbSection,\n  '',\n  '@copilot\
          \ continue',\n].join('\\n');\n\n// Upsert: update existing or create new\n\
          const { data: delegationComments } = await github.rest.issues.listComments({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  issue_number:\
          \ prNumber,\n  per_page: 100,\n});\nconst existingDelegation = delegationComments.find(c\
          \ => c.body && c.body.includes(UPSERT_MARKER_DELEGATION));\nif (existingDelegation)\
          \ {\n  await github.rest.issues.updateComment({\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    comment_id: existingDelegation.id,\n\
          \    body,\n  });\n} else {\n  await github.rest.issues.createComment({\n\
          \    owner:        context.repo.owner,\n    repo:         context.repo.repo,\n\
          \    issue_number: prNumber,\n    body,\n  });\n}\ncore.info(`\u2705 Posted\
          \ @copilot continue on PR  #${prNumber}`);\n"
    - name: Increment COGNITIVE_BRAIN_SESSION_NUMBER
      if: steps.session_gate.outputs.acquired == 'true'
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "CURRENT=\"${{ vars.COGNITIVE_BRAIN_SESSION_NUMBER }}\"\nif [ -z \"${GH_TOKEN}\"\
        \ ]; then\n  echo \"\u26A0\uFE0F CODEX_MASTER_KEY not available \u2014 session\
        \ number increment skipped\"\n  exit 0\nfi\nNEXT=$((CURRENT + 1))\nif gh api\
        \ \\\n  --method PATCH \\\n  -H \"Accept: application/vnd.github+json\" \\\
        \n  \"/repos/${{ github.repository }}/actions/variables/COGNITIVE_BRAIN_SESSION_NUMBER\"\
        \ \\\n  -f name='COGNITIVE_BRAIN_SESSION_NUMBER' \\\n  -f value=\"${NEXT}\"\
        \ \\\n  > /dev/null 2>&1; then\n  echo \"\u2705 COGNITIVE_BRAIN_SESSION_NUMBER:\
        \ ${CURRENT} \u2192 ${NEXT}\"\nelse\n  echo \"\u26A0\uFE0F Failed to increment\
        \ COGNITIVE_BRAIN_SESSION_NUMBER (${CURRENT} \u2192 ${NEXT}). Check CODEX_MASTER_KEY\
        \ has variables:write scope.\"\nfi\n"
    - name: Report completion to AgentBrainAPI (ACE L6)
      if: success() && steps.session_gate.outputs.acquired == 'true'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number
          || '' }}
        SESSION_NUMBER: ${{ vars.COGNITIVE_BRAIN_SESSION_NUMBER }}
      run: "python3 - <<'PYEOF'\nimport os, sys\nsys.path.insert(0, os.path.join(os.getcwd(),\
        \ 'src'))\npr = os.environ.get('PR_NUMBER', 'unknown')\nsession = os.environ.get('SESSION_NUMBER',\
        \ 'unknown')\ntry:\n    from codex.cognitive.agent_brain_api import AgentBrainAPI,\
        \ ImprovementArea\n    api = AgentBrainAPI(agent_id=f\"agent-auth-delegation-s{session}\"\
        )\n    report = api.report_completion(\n        area=ImprovementArea.CI_CD,\n\
        \        step_id=f\"AUTH-DELEGATION-PR{pr}\",\n        outcome=\"success\"\
        ,\n        notes=f\"Token delegation activated for PR  #{pr} (session S{session})\"\
        ,\n    )\n    print(f\"\u2705 report_completion() \u2192 pattern_id={report.pattern_id}\"\
        )\nexcept Exception as exc:\n    print(f\"\u26A0\uFE0F  AgentBrainAPI.report_completion()\
        \ unavailable: {exc}\")\n    print(\"    (non-fatal \u2014 cognitive brain\
        \ module not installed in CI env)\")\nPYEOF\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  self-approve-after-delegation:
    name: "\u26A1 Approve action_required runs (post-delegation)"
    runs-on: ubuntu-latest
    needs:
    - activate-delegation
    if: 'always() &&

      github.event.action != ''closed'' &&

      github.event.pull_request.number != '''' &&

      (needs.activate-delegation.result == ''success'' || needs.activate-delegation.result
      == ''failure'')

      '
    permissions:
      actions: write
      pull-requests: read
      contents: read
    steps:
    - name: Checkout (for approve_pending_runs.py)
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        ref: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name
          }}
    - name: Generate Cognitive Brain App token
      id: app-token
      uses: actions/create-github-app-token@v3
      continue-on-error: true
      with:
        app-id: ${{ secrets._GITHUB_APP_ID }}
        private-key: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Approve all action_required runs for this PR
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY ||
          secrets.CODEX_BACKUP_KEY || github.token }}
        GITHUB_APP_PRIVATE_KEY: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
        GITHUB_APP_ID: ${{ secrets._GITHUB_APP_ID }}
        GITHUB_APP_INSTALLATION_ID: ${{ secrets._GITHUB_APP_INSTALLATION_ID }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MAX_WAIT_SEC: '30'
      run: "python scripts/ci/approve_pending_runs.py || {\n  echo \"::warning::approve_pending_runs.py\
        \ failed; continuing to avoid blocking delegation workflow.\"\n  exit 0\n\
        }\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  session-release:
    name: "\U0001F513 Release session lock"
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
    - name: Checkout repository for shared helpers
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Release COPILOT_ACTIVE_SESSION and trigger next queued PR
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const closedPR = context.payload.pull_request?.number;\nif (!closedPR)\
          \ {\n  core.info('No PR context \u2014 skipping session release');\n  return;\n\
          }\n\nconst { isRateLimit } = require('./scripts/ci/github_rate_limit_helper.js');\n\
          \nasync function getVar(name) {\n  try {\n    const { data } = await github.request('GET\
          \ /repos/{owner}/{repo}/actions/variables/{name}', {\n      owner: context.repo.owner,\
          \ repo: context.repo.repo, name,\n    });\n    return data.value || '';\n\
          \  } catch (e) {\n    if (e.status === 404) return '';\n    if (isRateLimit(e))\
          \ {\n      core.warning(`Rate limit while reading ${name}; continuing without\
          \ releasing session lock.`);\n      return '';\n    }\n    throw e;\n  }\n\
          }\n\n// Helper: upsert repo variable\nasync function upsertVar(name, value)\
          \ {\n  try {\n    await github.request('PATCH /repos/{owner}/{repo}/actions/variables/{name}',\
          \ {\n      owner: context.repo.owner, repo: context.repo.repo, name, value,\n\
          \    });\n  } catch (e) {\n    if (e.status === 404) {\n      await github.request('POST\
          \ /repos/{owner}/{repo}/actions/variables', {\n        owner: context.repo.owner,\
          \ repo: context.repo.repo, name, value,\n      });\n    } else if (isRateLimit(e))\
          \ {\n      core.warning(`Rate limit while writing ${name}; continuing without\
          \ releasing session lock.`);\n    } else { throw e; }\n  }\n}\n// GitHub\
          \ API rejects empty-string variable values (422). Use DELETE to clear.\n\
          async function clearVar(name) {\n  try {\n    await github.request('DELETE\
          \ /repos/{owner}/{repo}/actions/variables/{name}', {\n      owner: context.repo.owner,\
          \ repo: context.repo.repo, name,\n    });\n  } catch (e) {\n    if (isRateLimit(e))\
          \ {\n      core.warning(`Rate limit while clearing ${name}; continuing without\
          \ releasing session lock.`);\n      return;\n    }\n    if (e.status !==\
          \ 404) throw e;\n  }\n}\n\n// Check if the closing PR holds the active session\
          \ lock\nconst activeSession = await getVar('COPILOT_ACTIVE_SESSION');\n\
          if (!activeSession) {\n  core.info('No active session lock to release');\n\
          \  return;\n}\n\nconst activePR = activeSession.split('|')[0];\nif (activePR\
          \ !== String(closedPR)) {\n  core.info(`Lock held by PR  #${activePR}, not\
          \ closing PR  #${closedPR} \u2014 skipping`);\n  return;\n}\n\n// Release\
          \ the lock\nawait clearVar('COPILOT_ACTIVE_SESSION');\ncore.info(`\U0001F513\
          \ Released session lock (was: ${activeSession})`);\n\n// Dequeue next PR\n\
          const queue = await getVar('COPILOT_SESSION_QUEUE');\nif (!queue) {\n  core.info('Session\
          \ queue is empty \u2014 no PR to trigger');\n  return;\n}\n\nconst queueList\
          \ = queue.split(',').filter(Boolean);\nconst nextPR = queueList.shift();\n\
          \nif (nextPR) {\n  const nextPRNumber = parseInt(nextPR, 10);\n  if (isNaN(nextPRNumber)\
          \ || nextPRNumber <= 0) {\n    core.warning(`Invalid PR number in queue:\
          \ '${nextPR}' \u2014 skipping`);\n    await upsertVar('COPILOT_SESSION_QUEUE',\
          \ queueList.join(','));\n    return;\n  }\n\n  // Post @copilot continue\
          \ on the dequeued PR to trigger its session\n  try {\n    await github.rest.issues.createComment({\n\
          \      owner: context.repo.owner,\n      repo: context.repo.repo,\n    \
          \  issue_number: nextPRNumber,\n      body: [\n        '<!-- session-gate-dequeued\
          \ -->',\n        '## \U0001F513 Session Available',\n        '',\n     \
          \   `Previous session (PR  #${closedPR}) has completed.`,\n        'This\
          \ PR has been dequeued and the session is now starting.',\n        '',\n\
          \        '@copilot continue',\n      ].join('\\n'),\n    });\n    // Only\
          \ remove from queue after successful comment posting\n    await upsertVar('COPILOT_SESSION_QUEUE',\
          \ queueList.join(','));\n    core.info(`\u2705 Dequeued PR  #${nextPR} \u2014\
          \ posted @copilot continue`);\n\n    // S239: Update the \"\u23F3 Session\
          \ Queued\" comment on any remaining PRs\n    // in the queue so they see\
          \ their new (shifted) queue position.\n    for (let i = 0; i < queueList.length;\
          \ i++) {\n      const waitingPR = parseInt(queueList[i], 10);\n      if\
          \ (isNaN(waitingPR) || waitingPR <= 0) continue;\n      try {\n        const\
          \ { data: waitingComments } = await github.rest.issues.listComments({\n\
          \          owner: context.repo.owner, repo: context.repo.repo,\n       \
          \   issue_number: waitingPR, per_page: 100,\n        });\n        const\
          \ queuedComment = waitingComments.find(c =>\n          (c.body || '').includes('<!--\
          \ session-gate-queued -->')\n        );\n        if (queuedComment) {\n\
          \          const newPos = i + 1; // 1-based position\n          const updatedBody\
          \ = [\n            '<!-- session-gate-queued -->',\n            '## \u23F3\
          \ Session Queued',\n            '',\n            `Another Copilot session\
          \ is now active on PR  #${nextPRNumber} (just dequeued).`,\n           \
          \ 'This PR will be triggered automatically when that session completes.',\n\
          \            '',\n            '| Detail | Value |',\n            '|--------|-------|',\n\
          \            `| Active Session | PR  #${nextPRNumber} |`,\n            `|\
          \ Queue Position | ${newPos} |`,\n            `| Ahead in queue | ${newPos\
          \ - 1} PR(s) |`,\n            '',\n            '> To enable parallel sessions,\
          \ check the **Multiple Copilot Coding Agent Sessions** checkbox in the PR\
          \ body.',\n            '',\n            `_Session Concurrency Gate \u2014\
          \ [design](docs/plans/AUTONOMOUS_SELF_HEALING_PROPOSAL_S182.md#session-concurrency-control-design)_`,\n\
          \          ].join('\\n');\n          await github.rest.issues.updateComment({\n\
          \            owner: context.repo.owner, repo: context.repo.repo,\n     \
          \       comment_id: queuedComment.id,\n            body: updatedBody,\n\
          \          });\n          core.info(`\u2705 Updated queue position for PR\
          \  #${waitingPR} \u2192 position ${newPos}`);\n        }\n      } catch\
          \ (err) {\n        core.warning(`Failed to update queue position for PR\
          \  #${queueList[i]}: ${err.message}`);\n      }\n    }\n  } catch (err)\
          \ {\n    core.warning(`Failed to post @copilot continue on PR  #${nextPR}:\
          \ ${err.message}`);\n    // Don't remove from queue \u2014 will retry on\
          \ next release\n  }\n} else {\n  await clearVar('COPILOT_SESSION_QUEUE');\n\
          }\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 60
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: activate-delegation
    if: 'failure() &&

      (github.event_name == ''pull_request'' || github.event_name == ''pull_request_review'')
      &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Agent Auth Delegation
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
