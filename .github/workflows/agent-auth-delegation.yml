name: Agent Token Delegation

# Reads the "Enable Agent Token Delegation (COPILOT_AGENT_AUTH_ENABLED)" checkbox
# from the PR body. When checked:
#   1. Pauses at the `agent-auth-delegation` environment gate — owner approves in GH UI.
#   2. Sets `COPILOT_AGENT_AUTH_ENABLED=true` repo variable via CODEX_MASTER_KEY.
#   3. Adds all three delegated agent identities to COGNITIVE_BRAIN_ALLOWED_ACTORS
#      using the Set-based exact-match pattern (S110).
#   4. Dispatches GitHub Guru agent to verify and document the variable change
#      (maintainer role).
#   5. Posts `@copilot continue` as a PR comment to resume the Copilot session.
#
# One-time admin setup required (see §9 in ADMIN_MANUAL_SETUP_GUIDE.md):
#   • Create an environment named `agent-auth-delegation` in repo Settings → Environments
#   • Add @mbaetiong as a required reviewer
#
# Secrets required: CODEX_MASTER_KEY (or CODEX_BACKUP_KEY as fallback)

on:
  pull_request:
    # synchronize REMOVED (S155): The checkbox can only be added/changed when a
    # PR is first created or edited. Firing on every push (synchronize) caused
    # concurrent auto-commits that created rebase conflicts on the next report_progress.
    # ready_for_review triggers draft→ready transitions (important for approval).
    # closed added (S182) for session-release job — clears COPILOT_ACTIVE_SESSION lock.
    types: [opened, edited, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to activate delegation for"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # ── Job 0: PR body checkpoint guardian ────────────────────────────────────
  # REASON THIS JOB EXISTS:
  # The `report_progress` tool (used by Copilot coding agent) OVERWRITES the PR
  # description with only its checklist content. This strips out the mandatory:
  #   - "### 💰 Cost Governance" checkbox (read by cost-gate.yml)
  #   - "### 🔐 Agent Token Delegation" checkbox (read by detect-checkbox below)
  # Without these, the cost gate blocks indefinitely and delegation never activates.
  # This job detects missing checkboxes and restores them to the PR body BEFORE
  # the detect-checkbox job reads the body.
  pr-body-checkpoint-guardian:
    name: "🛡️ Restore required PR checkboxes"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: "Checkout (needed for session_wrapup_autofix.py)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Hardened WEC preservation — re-apply all maintainer selections"
        # HARDENED (S259 mandate): replaces the old fragile shell grep-and-append.
        # session_wrapup_autofix.py --fix-pr-body ALWAYS:
        #   1. Reads the live PR body
        #   2. Extracts every maintainer-checked [x] item
        #   3. Rebuilds the canonical WEC block with those selections preserved
        #   4. Compares to what's currently in the body — only updates if drifted
        # This fires on EVERY PR push/open/sync so that no report_progress update
        # can permanently lose a maintainer's WEC selection.
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/ci/session_wrapup_autofix.py \
            --fix-pr-body \
            --pr-number "${PR_NUM}" \
            || echo "⚠️  WEC preservation script exited non-zero (non-fatal — workflow continues)"

  # ── Job 1: detect whether the checkbox is checked ───────────────────────────
  detect-checkbox:
    name: "Detect COPILOT_AGENT_AUTH_ENABLED checkbox"
    needs: [pr-body-checkpoint-guardian]
    if: always() && github.event.action != 'closed'
    # Always runs when the PR is not closed (not just when delegation is inactive).
    # The approval gate (await-approval) only fires when delegation is NOT yet active.
    # activate-delegation runs for both cases: first-time approval AND re-delegation
    # (when already active, it upserts the existing @copilot continue comment rather
    # than creating a new one, so no duplicate Copilot sessions are triggered).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      auth_requested: ${{ steps.check.outputs.auth_requested }}
      multi_session: ${{ steps.check.outputs.multi_session }}
      pr_number: ${{ steps.check.outputs.pr_number }}

    steps:
      - name: "Parse PR body for delegation checkbox"
        id: check
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"

          # On workflow_dispatch, github.event.pull_request.body is empty.
          # Fetch the PR body via gh CLI so checkbox detection works for
          # manually triggered delegation runs.
          RESOLVED_BODY="${PR_BODY}"
          if [ -z "${RESOLVED_BODY}" ] && [ -n "${PR_NUM}" ]; then
            RESOLVED_BODY=$(gh pr view "${PR_NUM}" \
              --repo Aries-Serpent/_codex_ \
              --json body --jq '.body' 2>/dev/null || true)
            echo "ℹ️  PR body fetched via gh pr view (workflow_dispatch path)"
          fi

          # Match a checked markdown checkbox that contains the variable name.
          # Pattern: "- [x]" followed by anything then "COPILOT_AGENT_AUTH_ENABLED"
          # Use POSIX extended regex (-E) for broad grep compatibility across runners.
          if printf '%s' "${RESOLVED_BODY}" | grep -qiE '\-[[:space:]]*\[x\].*COPILOT_AGENT_AUTH_ENABLED'; then
            echo "auth_requested=true"  >> "$GITHUB_OUTPUT"
            echo "✅ COPILOT_AGENT_AUTH_ENABLED checkbox is checked — requesting approval"
          else
            echo "auth_requested=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  COPILOT_AGENT_AUTH_ENABLED checkbox not checked — nothing to do"
          fi

          # Detect "Multiple Copilot Coding Agent Sessions" checkbox (S182)
          # Default: disabled (single-session mode). When checked, allows parallel sessions.
          if printf '%s' "${RESOLVED_BODY}" | grep -qiE '\-[[:space:]]*\[x\].*COPILOT_MULTI_SESSION'; then
            echo "multi_session=true"  >> "$GITHUB_OUTPUT"
            echo "✅ COPILOT_MULTI_SESSION checkbox is checked — parallel sessions allowed"
          else
            echo "multi_session=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  COPILOT_MULTI_SESSION not checked — single-session mode (default)"
          fi

  # ── Job 2: owner approval gate ───────────────────────────────────────────────
  # This job is intentionally minimal — its only purpose is to pause here until
  # @mbaetiong clicks "Approve" in the GitHub Actions "Waiting for approval" UI.
  # timeout-minutes: 120 — gives the owner a 2-hour window to approve.
  # (Previously 30; raised per S112 requirement: delegation must stay open for 2 h.)
  await-approval:
    name: "⏳ Awaiting owner approval"
    needs: detect-checkbox
    if: needs.detect-checkbox.outputs.auth_requested == 'true' && vars.COPILOT_AGENT_AUTH_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: agent-auth-delegation   # ← protection rule triggers approval gate

    steps:
      - name: "Approval received"
        run: |
          echo "✅ Owner approved agent token delegation for PR #${{ needs.detect-checkbox.outputs.pr_number }}"
          echo "Proceeding to activate COPILOT_AGENT_AUTH_ENABLED..."

  # ── Job 3: cognitive-preflight — GATE ───────────────────────────────────────
  # Runs in parallel with detect-checkbox / await-approval.
  # activate-delegation cannot start until this passes.
  #
  # REQ-1: Post mandatory checklist as PR comment BEFORE @copilot fires
  # REQ-2: Parse .codex/patterns/ci_failure_patterns.yaml → job summary
  # REQ-3: Verify .gitignore ALLOWS .codex/agent_auth_session.json
  # REQ-4: Verify docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md touched in last commit
  # REQ-5: Verify CHANGELOG.md touched in last commit
  # REQ-6: Verify SESSION_TIMEBOX_EXPIRED acknowledged (Session Summary posted) before reactivation
  # REQ-7:  Warn when PR has only 1 commit (NEVER stop after one commit — Tier-2 enforcement)
  # REQ-8:  Memory system health check (soft gate — server not running in CI is expected)
  # REQ-9:  Iterative self-healing validation (5-pass self-review)
  # REQ-10: Branch rebase status — HARD BLOCK if branch is behind/diverged from base
  #         Agent MUST rebase before starting any work when this fires.
  #
  # Policy: .codex/CODEBASE_AGENCY_POLICY.md | WF-001-cognitive-preflight-FINAL.md
  cognitive-preflight:
    name: "🧠 Cognitive Pre-flight Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.action != 'closed'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 50  # Enough for commit-count check (REQ-7); avoids full-clone cost

      # ── Session Requirements Injection ────────────────────────────────────
      # Download unaddressed comment requirements from the comment-review-gate
      # artifact (uploaded by that workflow's scan step).  When present, the
      # requirements are pre-pended to the cognitive-preflight checklist so the
      # agent sees them as the FIRST item in its session prompt — not as a CI
      # blocker.  This implements the "pre-pend to session prompt" contract
      # described in .codex/CODEBASE_AGENCY_POLICY.md §0a.
      - name: "Download pending session requirements (if any)"
        id: session_reqs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "has_requirements=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Try to download the latest session-requirements artifact for this PR
          gh run download \
            --repo "${{ github.repository }}" \
            --name "session-requirements-${PR_NUMBER}" \
            --dir /tmp/session-req-download \
            2>/dev/null || true
          if [ -f "/tmp/session-req-download/session_requirements.md" ]; then
            echo "has_requirements=true" >> "$GITHUB_OUTPUT"
            echo "requirements_path=/tmp/session-req-download/session_requirements.md" >> "$GITHUB_OUTPUT"
            echo "📋 Session requirements found — will inject into preflight checklist"
          else
            echo "has_requirements=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No pending session requirements found"
          fi

      # ── REQ-11: Integration-branch direct-session guard ───────────────────
      # 0D_base_ is the STAGING GATE — a Copilot session must NEVER run
      # directly on it.  All agent work happens through sub-PRs that target
      # 0D_base_.  If this guard fires, post clear redirect instructions and
      # hard-block the session.
      #
      # Architecture:
      #   copilot/session-* (sub-PR)  ──►  0D_base_  ──►  main
      #   Agent works here                 staging gate    promotion PR
      #
      # See: .codex/docs/INTEGRATION_BRANCH_MODEL.md
      - name: "REQ-11: Integration-branch direct-session guard"
        if: >
          github.event_name == 'pull_request' ||
          github.event_name == 'pull_request_review'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Branches that are staging gates — never the HEAD of an agent session.
            const INTEGRATION_BRANCHES = ['0D_base_'];
            const PROMOTION_TARGETS = ['main', 'master'];
            const pr = context.payload.pull_request;
            if (!pr) return;

            const head = pr.head.ref;
            const base = pr.base.ref;

            if (!INTEGRATION_BRANCHES.includes(head)) {
              core.info(`REQ-11 PASS: head='${head}' is not an integration branch.`);
              return;
            }

            // Exception: this is a promotion PR (integration_branch → main/master).
            // Promotion merges are the intended flow; REQ-11 only blocks direct
            // coding sessions, not the staging-gate → main promotion PR.
            if (PROMOTION_TARGETS.includes(base)) {
              core.info(`REQ-11 PASS: '${head}' → '${base}' is a promotion PR. Promotion merges are allowed.`);
              return;
            }

            // HEAD is an integration branch opened against a non-promotion target
            // — build redirect comment.
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const ts = new Date().toISOString();
            const MARKER = '<!-- req11-integration-branch-guard -->';
            const body = [
              MARKER,
              `## 🚫 REQ-11: Direct Session on Integration Branch Blocked`,
              ``,
              `**Branch \`${head}\` is a staging integration branch** — Copilot Coding Agent sessions`,
              `must never run directly on it.`,
              ``,
              `### Why`,
              `\`${head}\` is the **staging gate** that accumulates reviewed sub-PR work before`,
              `promotion to \`main\`.  Running a session directly on \`${head}\` bypasses the`,
              `sub-PR review cycle and risks polluting the staging branch with unreviewed changes.`,
              ``,
              `### Architecture`,
              `\`\`\``,
              `copilot/session-*  ──►  ${head}  ──►  main`,
              `(your work here)        (staging gate)   (promotion PR)`,
              `\`\`\``,
              ``,
              `### ✅ How to Start a New Agent Session`,
              ``,
              `**Option A — Automated (recommended):** Trigger the session-chain workflow:`,
              `\`\`\`bash`,
              `gh workflow run copilot-session-chain.yml \\`,
              `  -f source_branch=${head} \\`,
              `  -f session_title="Describe your task here" \\`,
              `  -f auto_start=true`,
              `\`\`\``,
              `This automatically creates a new \`copilot/session-*\` branch, opens a sub-PR`,
              `targeting \`${head}\`, and posts the \`@copilot\` trigger comment.`,
              ``,
              `**Option B — Manual:**`,
              `1. Create a new branch from \`${head}\`:`,
              `   \`\`\`bash`,
              `   git fetch origin ${head}`,
              `   git checkout -b copilot/session-$(date +%Y%m%d-%H%M%S) origin/${head}`,
              `   git push origin HEAD`,
              `   \`\`\``,
              `2. Open a PR targeting \`${head}\` (NOT \`main\`).`,
              `3. Post \`@copilot+claude-sonnet-4.6 continue\` on the new PR.`,
              ``,
              `**Copy-paste Copilot prompt for a new session:**`,
              `\`\`\``,
              `@copilot+claude-sonnet-4.6 continue`,
              ``,
              `Open a new sub-PR targeting \`${head}\` for this agent session.`,
              `Architecture: sub-PR → ${head} → main.`,
              `Do NOT commit directly to \`${head}\`.`,
              `\`\`\``,
              ``,
              `---`,
              `_Auto-posted by \`cognitive-preflight\` REQ-11 gate at ${ts}_`,
              `_[View run](${runUrl}) · [INTEGRATION_BRANCH_MODEL.md](.codex/docs/INTEGRATION_BRANCH_MODEL.md)_`,
            ].join('\n');

            // Upsert: replace any previous REQ-11 guard comment.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

            await core.summary
              .addHeading('REQ-11: Integration-Branch Guard', 3)
              .addRaw(
                `\n🚫 FAIL — \`${head}\` is an integration/staging branch.\n` +
                `Copilot sessions must use a sub-PR.  See comment on PR #${pr.number} for instructions.\n`
              )
              .write();

            core.setFailed(
              `REQ-11 FAIL: Branch '${head}' is the staging integration branch. ` +
              `Copilot sessions must NOT run directly on '${head}'. ` +
              `Create a sub-PR branch targeting '${head}' instead. ` +
              `See the REQ-11 comment on this PR for step-by-step instructions, ` +
              `or run: gh workflow run copilot-session-chain.yml -f source_branch=${head}`
            );

      # ── REQ-1: Post mandatory checklist as PR comment ─────────────────────
      - name: Post Mandatory Agent Checklist to PR
        uses: actions/github-script@v8
        if: >
          github.event_name == 'pull_request' ||
          github.event_name == 'pull_request_review'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const sha = (context.sha || 'unknown').slice(0, 7);
            const MARKER = 'COGNITIVE PRE-FLIGHT CHECKLIST';

            // Upsert: find existing comment by stable anchor marker
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            // Scan for existing priority directive to surface inline
            const directive = comments.find(c =>
              c.body.includes('Priority for this session:')
            );
            const priorityLine = directive
              ? (() => {
                  const m = directive.body.match(/Priority for this session:\s*(.+)/);
                  return m
                    ? `\n> ⚡ **ACTIVE SESSION PRIORITY:** ${m[1].trim()} _(set by @${directive.user.login})_\n`
                    : '';
                })()
              : '\n> ℹ️ No session priority directive found. Post a comment with `Priority for this session: X` to set one.\n';

            const UPSERT_MARKER = '<!-- cognitive-preflight-checklist -->';

            // Inject pending session requirements (from comment-review-gate) at top of checklist.
            // Read actual file content — the session_reqs step downloads to a known path.
            const sessionReqsHasReq = '${{ steps.session_reqs.outputs.has_requirements }}' === 'true';
            let sessionReqsContent = '';
            if (sessionReqsHasReq) {
              try {
                sessionReqsContent = fs.readFileSync(
                  '/tmp/session-req-download/session_requirements.md', 'utf8'
                ).trim();
              } catch (e) {
                core.warning(`Could not read session requirements file: ${e.message}`);
              }
            }
            const pendingRequirementsBlock = sessionReqsHasReq && sessionReqsContent
              ? [
                  '',
                  '---',
                  '',
                  '### 📋 Pending Comment Requirements (Pre-pended from Comment Review Gate)',
                  '',
                  '> **These comments were unaddressed on the previous scan and are injected here**',
                  '> **as session requirements. Address each one BEFORE making file changes.**',
                  '',
                  sessionReqsContent,
                  '',
                  '---',
                  '',
                ].join('\n')
              : '';

            const body = [
              UPSERT_MARKER,
              `## 🧠 ${MARKER} — SHA: ${sha}`,
              '',
              '> **Auto-posted by `cognitive-preflight` job BEFORE session activation.**',
              '> Treat this as active instruction — NOT background memory. This is a CI gate.',
              priorityLine,
              pendingRequirementsBlock,
              '---',
              '',
              '### ✅ Agent Pre-flight Checklist',
              '',
              '> **⚠️ MANDATORY: Complete items 0a and 0b BEFORE any file changes.**',
              '',
              '- [ ] **0a. 🤖 Review ALL bot-posted comments** — fetch and address every open thread from `copilot-pull-request-reviewer[bot]`, `github-advanced-security[bot]`, `github-code-quality[bot]`, `github-actions[bot]` on this PR _(per §0 of CODEBASE_AGENCY_POLICY.md)_',
              '- [ ] **0b. ❌ Fix ALL failing CI checks** — review every failing/warning check in the latest workflow runs; fix all code-fixable failures before pushing new commits _(per §0 of CODEBASE_AGENCY_POLICY.md)_',
              '- [ ] **0c. 🔀 REQ-10: Check branch rebase status** — if a `BRANCH_REBASE_REQUIRED` comment is present on this PR, rebase BEFORE any other work: `git fetch origin && git rebase origin/<base> && git push --force-with-lease` _(CI hard block if unresolved)_',
              '- [ ] **1.** Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md` in your commit _(CI will fail if not touched)_',
              '- [ ] **2.** Review CI failure patterns in the Actions job summary (Actions tab → this run → Job Summary)',
              '- [ ] **3.** Confirm `.gitignore` allows `.codex/agent_auth_session.json` _(CI will fail if blocked)_',
              '- [ ] **4.** Read the `Priority for this session: X` comment on this PR — that is your **PRIMARY directive**',
              '- [ ] **5.** Post your Phase execution plan as a PR comment BEFORE making any file changes',
              '- [ ] **6.** Follow `.codex/CODEBASE_AGENCY_POLICY.md` at all times — violations must be self-corrected',
              '- [ ] **7. REQ-13 (HARD STOP):** Address ALL comments from `@mbaetiong` and ALL bot-posted comments (copilot-pull-request-reviewer, github-actions, github-advanced-security, github-code-quality) **before** committing any new changes. CI gate `comment-review-gate.yml` enforces this.',
              '',
              '### ⚙️ Policy Quick Reference',
              '',
              '| Rule | Requirement |',
              '|------|-------------|',
              '| **Pre-session** | Review ALL bot comments + fix ALL failing CI checks FIRST |',
              '| **REQ-13** | Reply to ALL `mbaetiong` + critical-bot comments before new commits (enforced by `comment-review-gate.yml`) |',
              '| Execution trigger | Within 60 seconds of reading a clear task |',
              '| Self-review | Minimum 5 passes before session close |',
              '| Deferral | NEVER without: documented blocker + 5 attempts + follow-up `@copilot` comment |',
              '| Terminology | pre-commit/commit cycles — NOT days/weeks |',
              '| Follow-up | Post `@copilot ...` PR comment if session ends with incomplete work |',
              '| **PR requirement** | Sessions no longer create PRs by default (GitHub change 2026-03). **Always work on a pre-existing PR branch.** If none exists, run `gh pr create --base 0D_base_` before starting work. Include "open a pull request" in any `@copilot` prompt posted on an issue. |',
              '',
              '### 🔗 Policy References',
              '',
              '| File | Purpose |',
              '|------|---------|',
              '| `.codex/CODEBASE_AGENCY_POLICY.md` | Master policy (§0 pre-session review) |',
              '| `.codex/patterns/ci_failure_patterns.yaml` | CI pattern library (25 patterns) |',
              '| `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md` | Session accountability |',
              '',
              '---',
              `_Auto-posted: ${new Date().toISOString()} | cognitive-preflight gate | WF-001_`,
              `_Last updated for SHA: \`${sha}\` | ${new Date().toISOString()}_`,
              '',
              '---',
              `_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            // Paginated upsert: search ALL pages so PRs with >100 comments are handled.
            let existing = null;
            let page = 1;
            while (!existing && page <= 20) {
              const { data: batch } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
                page,
              });
              existing = batch.find(c => c.body && c.body.includes(UPSERT_MARKER));
              if (existing || batch.length < 100) break;
              page++;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`✅ Checklist updated in-place for SHA ${sha}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log(`✅ Checklist posted for SHA ${sha}`);
            }

      # ── REQ-1b: Surface session-type directives (exploration/timebox/no-auto-proceed) ──
      # Reads SESSION_TIMEBOX_START / SESSION_TYPE_EXPLORATION markers posted by session-watchdog.yml
      # and injects matching enforcement items into the agent checklist.
      # Policy: .github/docs/SessionContinuityPolicy.md | WF-002
      - name: Surface Session-Type Directives to Checklist
        uses: actions/github-script@v8
        if: >
          github.event_name == 'pull_request' ||
          github.event_name == 'pull_request_review'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha    = (context.sha || 'unknown').slice(0, 7);
            const MARKER = 'COGNITIVE SESSION-TYPE DIRECTIVE';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            // Detect session signals from session-watchdog.yml markers
            const hasExploration   = comments.some(c => c.body.includes('SESSION_TYPE_EXPLORATION'));
            const doNotAutoProceed = comments.some(c => /do\s+not\s+auto.?proceed/i.test(c.body));

            // Detect active (non-expired) timebox
            let activeTimebox = null;
            const now = new Date();
            for (const c of comments.filter(c => c.body.includes('SESSION_TIMEBOX_START'))) {
              const m = c.body.match(/\*\*Expires:\*\*\s*(\S+)/);
              if (m) {
                const exp = new Date(m[1]);
                if (!isNaN(exp.getTime()) && now < exp) {
                  const minsLeft = Math.round((exp - now) / 60000);
                  activeTimebox = { expiresISO: m[1], minsLeft };
                }
              }
            }

            // Only post if there is something to surface
            if (!hasExploration && !activeTimebox && !doNotAutoProceed) {
              console.log('No session-type directives detected — skipping injection.');
              return;
            }

            const UPSERT_MARKER_WF002 = '<!-- cognitive-preflight-session-directives -->';
            const lines = [
              UPSERT_MARKER_WF002,
              `## 🎯 ${MARKER} — SHA: ${sha}`,
              '',
              '> **Auto-posted by `cognitive-preflight` — session-type specific enforcement rules.**',
              '> These items are IN ADDITION to the standard Pre-flight Checklist above.',
              '',
            ];

            if (activeTimebox) {
              lines.push(`> ⏱ **ACTIVE TIMEBOX: ~${activeTimebox.minsLeft} minutes remaining** (expires \`${activeTimebox.expiresISO}\`)`);
              lines.push('> Complete your work and post `## 🧠 Session Summary` BEFORE this expires.');
              lines.push('');
            }

            if (hasExploration) {
              lines.push('### 🔍 Exploration Session Active — [Session Continuity Policy](.github/docs/SessionContinuityPolicy.md) applies:');
              lines.push('');
              lines.push('- [ ] **A.** After each agenda item: post PR comment with findings; ask "proceed or go deeper?"');
              lines.push('- [ ] **B.** Every ~10 minutes: post an incremental progress summary as a PR comment');
              lines.push('- [ ] **C.** Treat silence from human as PAUSE — do NOT auto-proceed to next item');
              lines.push('- [ ] **D.** On session close: post `## 🧠 Session Summary` with topics, key findings, and a follow-up `@copilot` prompt');
              lines.push('');
            }

            if (doNotAutoProceed) {
              lines.push('### 🛑 "Do NOT Auto-Proceed" Directive Active:');
              lines.push('');
              lines.push('- [ ] After each agenda item: **STOP.** Post findings. Wait for explicit human "continue" reply.');
              lines.push('- [ ] Do NOT start the next item without an explicit human response.');
              lines.push('');
            }

            lines.push('_auto-posted by cognitive-preflight | WF-002 | [SessionContinuityPolicy.md](.github/docs/SessionContinuityPolicy.md)_');
            lines.push('');
            lines.push('---');
            lines.push(`_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`);

            // Upsert: update existing or create new
            const directiveBody = lines.join('\n');
            const existingDirective = comments.find(c => c.body && c.body.includes(UPSERT_MARKER_WF002));
            if (existingDirective) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingDirective.id,
                body: directiveBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: directiveBody,
              });
            }
            console.log('Session-type directives surfaced in preflight comment.');

      # ── REQ-2: Read ci_failure_patterns.yaml → output to job summary ──────
      - name: Parse CI Failure Patterns → Job Summary
        run: |
          # shellcheck disable=SC2129
          PATTERN_FILE=".codex/patterns/ci_failure_patterns.yaml"

          echo "## 🧠 Active CI Failure Patterns" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "$PATTERN_FILE" ]; then
            echo "⚠️ Pattern file not found: \`${PATTERN_FILE}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Agent should create this file from session learnings." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Source:** \`${PATTERN_FILE}\` (missing)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "**Source:** \`${PATTERN_FILE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          python3 - "$PATTERN_FILE" "$GITHUB_STEP_SUMMARY" << 'PYEOF'
          import re, sys

          pattern_file = sys.argv[1]
          summary_file = sys.argv[2]

          with open(pattern_file, "r", encoding="utf-8") as f:
              content = f.read()

          blocks = re.findall(r'```yaml\n(.*?)```', content, re.DOTALL)

          rows = []
          for block in blocks:
              pid_m   = re.search(r'^pattern_id:\s*(.+)', block, re.MULTILINE)
              name_m  = re.search(r'^name:\s*"?(.+?)"?\s*$', block, re.MULTILINE)
              pri_m   = re.search(r'^priority:\s*(\d+)', block, re.MULTILINE)
              sev_m   = re.search(r'^severity:\s*(\w+)', block, re.MULTILINE)
              batch_m = re.search(r'batch_fix[_\s]*(?:potential|enabled)?:\s*(true)', block, re.IGNORECASE)
              notes_m = re.search(r'cognitive_notes:\s*\|(.*?)(?=\n\w|\Z)', block, re.DOTALL)

              if not pid_m:
                  continue

              pid   = pid_m.group(1).strip()
              name  = name_m.group(1).strip() if name_m else "—"
              pri   = f"P{pri_m.group(1).strip()}" if pri_m else "?"
              sev   = sev_m.group(1).strip() if sev_m else "?"
              batch = "✅" if batch_m else ""
              note  = ""
              if notes_m:
                  lines = [l.strip() for l in notes_m.group(1).strip().split("\n") if l.strip()]
                  note  = lines[0] if lines else ""

              rows.append(f"| `{pid}` | {name} | {pri} | {sev} | {batch} | {note} |")

          with open(summary_file, "a", encoding="utf-8") as out:
              if rows:
                  out.write("| Pattern ID | Name | Priority | Severity | Batch Fix | Key Insight |\n")
                  out.write("|-----------|------|----------|----------|:---------:|-------------|\n")
                  for row in rows:
                      out.write(row + "\n")
                  out.write(f"\n**Total patterns loaded:** {len(rows)}\n\n")
                  p1 = [r for r in rows if "| P1 |" in r]
                  if p1:
                      out.write(f"⚠️ **{len(p1)} Priority-1 (blocking) pattern(s) active — review before coding.**\n\n")
              else:
                  out.write("No parseable patterns found in pattern file.\n\n")
          PYEOF

      # ── REQ-3: Verify .gitignore ALLOWS .codex/agent_auth_session.json ────
      - name: Verify .gitignore allows .codex/agent_auth_session.json
        id: gitignore_check
        run: |
          TARGET=".codex/agent_auth_session.json"
          GITIGNORE=".gitignore"

          echo "### 🔍 .gitignore Check: \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "$GITIGNORE" ]; then
            echo "⚠️ No .gitignore found — \`${TARGET}\` is implicitly allowed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git check-ignore -q "$TARGET" 2>/dev/null; then
            NEGATION=$(grep -E "^!.*agent_auth_session" "$GITIGNORE" 2>/dev/null || true)
            if [ -n "$NEGATION" ]; then
              echo "✅ **PASS** — \`${TARGET}\` is explicitly un-ignored via negation: \`${NEGATION}\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **FAIL** — \`${TARGET}\` is BLOCKED by .gitignore with no negation rule." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Fix:** Add to \`.gitignore\`:" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "!.codex/agent_auth_session.json" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "✅ **PASS** — \`${TARGET}\` is NOT ignored by .gitignore." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── REQ-3b: Detect and warn on empty (no-file-change) commits ────────
      # Empty commits are placeholders (e.g., "Initial plan" from copilot-swe-agent[bot])
      # that carry no code value but are classified as AGENT-COMMIT by the divergence
      # monitor. This check warns the agent so they know the commit will appear in the
      # monitor's count. It is a WARN (not hard stop) since empty commits are sometimes
      # intentional (e.g., triggering CI without a code change).
      - name: Detect empty commits in PR
        id: empty_commit_check
        continue-on-error: true
        run: |
          echo "### 🔍 Empty Commit Check (REQ-3b)" >> "$GITHUB_STEP_SUMMARY"

          # Ensure the base ref is available locally so git log does not fail silently
          if ! git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null; then
            echo "⚠️ **WARN** — Unable to fetch base ref origin/${{ github.base_ref }}; skipping empty-commit check." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Empty-commit check skipped — could not fetch origin/${{ github.base_ref }}."
            exit 0
          fi

          # Obtain commit list relative to the base ref; if this fails, emit WARN instead of a false PASS
          COMMITS=$(git log --format="%H %an: %s" "origin/${{ github.base_ref }}"..HEAD 2>/dev/null) || {
            echo "⚠️ **WARN** — git log failed for range origin/${{ github.base_ref }}..HEAD; skipping empty-commit check." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Empty-commit check skipped — git log failed for origin/${{ github.base_ref }}..HEAD."
            exit 0
          }

          # Count commits with no file-tree changes
          EMPTY_COMMITS=$(printf '%s\n' "$COMMITS" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            SHA=$(echo "$line" | awk '{print $1}')
            # Capture diff-tree output first; if the command fails (e.g., shallow
            # checkout missing objects) skip this commit rather than treating it
            # as empty, which would be a false-positive empty-commit warning.
            CHANGES_OUTPUT=$(git diff-tree --no-commit-id -r --name-only "$SHA" 2>/dev/null) || {
              echo "::warning::Empty-commit check: git diff-tree failed for $SHA; skipping." >&2
              continue
            }
            CHANGES=$(printf '%s\n' "$CHANGES_OUTPUT" | grep -c . || true)
            # grep -c . counts non-empty lines (exit 1 when 0 matches is silenced
            # by || true); this correctly handles the empty-output case without
            # needing pipefail or a separate wc call.
            [ "$CHANGES" -eq 0 ] && echo "$line"
          done)

          if [ -z "$EMPTY_COMMITS" ]; then
            echo "✅ **PASS** — No empty commits detected in this PR." >> "$GITHUB_STEP_SUMMARY"
          else
            COUNT=$(echo "$EMPTY_COMMITS" | grep -c . || true)
            echo "⚠️ **WARN** — ${COUNT} empty commit(s) detected (no file changes):" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$EMPTY_COMMITS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Impact:** Empty commits will appear as AGENT-COMMIT in \`branch-divergence-monitor.yml\`" >> "$GITHUB_STEP_SUMMARY"
            echo "and will be auto-absorbed by the fast-forward sync. No action required unless" >> "$GITHUB_STEP_SUMMARY"
            echo "these commits were unintentional — if so, use \`git rebase -i\` to drop them" >> "$GITHUB_STEP_SUMMARY"
            echo "**before** pushing to remote (after push, force-push is required to remove)." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${COUNT} empty commit(s) found in PR — will be AGENT-COMMIT in divergence monitor (auto-absorbed)"
          fi

      # ── REQ-4: Verify accountability report touched in last commit ─────────
      - name: Verify Accountability Report updated in last commit
        id: accountability_check
        run: |
          REPORT="docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md"

          echo "### 🔍 Accountability Report Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "$REPORT" ]; then
            echo "❌ **FAIL** — \`${REPORT}\` does not exist." >> "$GITHUB_STEP_SUMMARY"
            echo "**Fix:** Create this file and commit it before activating a session." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qF "$REPORT"; then
            echo "✅ **PASS** — \`${REPORT}\` was updated in the last commit." >> "$GITHUB_STEP_SUMMARY"
          else
            LAST_TOUCH=$(git log -1 --format="%ar" -- "$REPORT" 2>/dev/null || echo "unknown")
            echo "❌ **FAIL** — \`${REPORT}\` was NOT updated in the last commit." >> "$GITHUB_STEP_SUMMARY"
            echo "Last modified: ${LAST_TOUCH}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Fix:** Update the accountability report in your next commit before session activation." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ── REQ-5: Verify CHANGELOG.md touched in last commit ────────────────
      # Tier-1 hard stop — same pattern as REQ-4.
      # Rationale: CHANGELOG.md is frequently skipped (documented in grounded enforcement audit).
      # Promoting from Tier-3 (policy text) → Tier-1 (CI hard block).
      - name: Verify CHANGELOG.md updated in last commit
        id: changelog_check
        run: |
          CHANGELOG="CHANGELOG.md"

          echo "### 🔍 CHANGELOG.md Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "$CHANGELOG" ]; then
            echo "⚠️ **SKIP** — \`${CHANGELOG}\` does not exist in repo root." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qF "$CHANGELOG"; then
            echo "✅ **PASS** — \`${CHANGELOG}\` was updated in the last commit." >> "$GITHUB_STEP_SUMMARY"
          else
            LAST_TOUCH=$(git log -1 --format="%ar" -- "$CHANGELOG" 2>/dev/null || echo "unknown")
            echo "❌ **FAIL** — \`${CHANGELOG}\` was NOT updated in the last commit." >> "$GITHUB_STEP_SUMMARY"
            echo "Last modified: ${LAST_TOUCH}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Fix:** Add a \`## [Unreleased]\` entry to \`CHANGELOG.md\` in your next commit." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ── AUTO-FIX: Self-healing doc update when REQ-4 or REQ-5 fails ─────────
      # Triggered automatically when the accountability report or CHANGELOG was
      # not updated in the last commit.  Runs session_wrapup_autofix.py, then
      # commits and pushes the fix back to the PR branch so the next run passes.
      # Uses CODEX_MASTER_KEY (PAT) for the push; falls back to CODEX_BACKUP_KEY.
      # The commit uses [skip ci] to avoid triggering another full workflow run
      # while still satisfying the REQ-4/REQ-5 "touched in last commit" check on
      # the *next* non-skip run triggered by the push.
      - name: "Auto-fix: self-heal accountability report and CHANGELOG (REQ-4/5)"
        id: autofix_docs
        if: >
          always() &&
          (steps.accountability_check.outcome == 'failure' ||
           steps.changelog_check.outcome == 'failure')
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.head_ref || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || '' }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        run: |
          set -euo pipefail

          echo "### 🔧 Auto-Fix: Session Wrap-Up Compliance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Determine which fixes are needed
          FIX_ACCT=""
          FIX_CL=""
          if [ "${{ steps.accountability_check.outcome }}" = "failure" ]; then
            FIX_ACCT="--fix-accountability"
            echo "- REQ-4 (accountability report): **needs fix**" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.changelog_check.outcome }}" = "failure" ]; then
            FIX_CL="--fix-changelog"
            echo "- REQ-5 (CHANGELOG): **needs fix**" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Run the auto-fix script
          python3 scripts/ci/session_wrapup_autofix.py \
            --pr-number "${PR_NUMBER:-unknown}" \
            --sha "${GIT_SHA:0:8}" \
            --run-url "${RUN_URL}" \
            ${FIX_ACCT} ${FIX_CL}

          # Resolve TARGET_BRANCH via API when event context lacks head.ref
          if [ -z "${TARGET_BRANCH}" ] && [ -n "${PR_NUMBER}" ]; then
            TARGET_BRANCH=$(gh pr view "${PR_NUMBER}" --json headRefName -q .headRefName 2>/dev/null || true)
          fi
          if [ -z "${TARGET_BRANCH}" ] || echo "${TARGET_BRANCH}" | grep -qE '^[0-9]+/merge$'; then
            echo "⚠️ Could not resolve target branch ('${TARGET_BRANCH}') — auto-fix files written but not committed." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Auto-fix: could not resolve branch for commit-back. Files updated locally only."
            exit 0
          fi

          # Commit and push the auto-fixed files back to the branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md \
            CHANGELOG.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "- No file changes to commit (files may already have been correct)." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "fix(docs): auto-update accountability report + CHANGELOG [cognitive-preflight][skip ci]"
            git pull --rebase --autostash origin "${TARGET_BRANCH}" || true
            git push origin HEAD:refs/heads/"${TARGET_BRANCH}"
            echo "- ✅ Auto-fix commit pushed to \`${TARGET_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "- Next cognitive-preflight run will pass REQ-4/REQ-5." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # ── Workflow Execution Checklist — inject into PR body if missing ─────
      # Ensures Copilot Agent can check off only the workflows needed for this
      # session.  Unchecked items are skipped by workflow-execution-gate.yml.
      # PRESERVATION RULE: any checkbox the maintainer set to [x] is retained.
      # "always required" items (pre-merge-validation, comment-review-gate,
      # agent-auth-delegation) are unconditionally [x].
      # See: docs/workflows/plans/WORKFLOW_CHECKLIST_WIRING_PLAN.md
      - name: Ensure Workflow Execution Checklist in PR body
        id: inject-wec
        if: >
          github.event_name == 'pull_request' ||
          github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY=$(gh pr view "${PR_NUMBER}" --repo "${{ github.repository }}" --json body --jq '.body // ""')

          # Detect new canonical heading format
          if echo "$BODY" | grep -qF '## 🔄 Workflow Execution Checklist'; then
            echo "✅ Canonical Workflow Execution Checklist (heading format) already present in PR #${PR_NUMBER} — no injection needed"
            printf '### ✅ Workflow Execution Checklist\n\nAlready present (canonical format) — no injection required.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Also accept legacy bold-text marker to avoid double-injection during migration
          if echo "$BODY" | grep -qF '**🔄 Workflow Execution Checklist**:'; then
            echo "⚠️  Legacy WEC format detected in PR #${PR_NUMBER} — migrating to canonical heading format"
          fi

          # Extract existing checkbox state so maintainer selections are preserved.
          # Lines of form:  - [x] some-workflow.yml — description
          _checked() {
            local fname="$1" always="$2"
            if [ "$always" = "true" ]; then printf 'x'; return; fi
            if echo "$BODY" | grep -qP "^\- \[x\] ${fname}"; then printf 'x'; else printf ' '; fi
          }

          # Strip ALL existing WEC variants to avoid duplication
          STRIPPED_BODY=$(printf '%s' "$BODY" \
            | sed '/^## 🔄 Workflow Execution Checklist/,$d' \
            | sed '/^\*\*🔄 Workflow Execution Checklist\*\*:/,$d' \
            | sed '/^### 💰 Cost Governance/,$d' \
            | sed '/^### 🔐 Agent Token Delegation/,$d')

          # Build new canonical WEC block preserving maintainer checkbox state
          WEC=$(printf '%s\n' \
            '' \
            '---' \
            '' \
            '## 🔄 Workflow Execution Checklist' \
            '' \
            '### ✅ Always Required — fire automatically on every push (cannot be skipped)' \
            "- [x] pre-merge-validation.yml — Pre-merge checks (always required)" \
            "- [x] comment-review-gate.yml — Comment review gate (always required)" \
            "- [x] deferral-language-gate.yml — Deferral language guard (always required)" \
            "- [x] agent-auth-delegation.yml — Agent token delegation (always required)" \
            "- [x] workflow-execution-gate.yml — WEC gate — parse checklist & arm allowed workflows (always required)" \
            '' \
            '### 🔄 Always Active — fire via push/workflow_run (need approval in Actions tab)' \
            "- [x] copilot-agent-checkin.yml — Agent check-in / S221 guard (fires on push)" \
            "- [x] copilot-agent-session-done.yml — Auto-post @copilot review after agent session (fires on workflow_run)" \
            "- [x] copilot-iterative-self-healing.yml — Iterative self-healing CI loop (fires on workflow_run — needs approval)" \
            "- [x] cost-gate.yml — Cost governance gate (called by agent-auth-delegation)" \
            '' \
            '### ⚡ Auto-Approve' \
            "- [$(_checked auto-approve-workflows false)] auto-approve-workflows — Auto-Approve workflow to run (approves all pending runs on last commit SHA)" \
            '' \
            '### 🧪 Opt-In: Testing & Validation' \
            "- [$(_checked validate.yml false)] validate.yml — Validation Pipeline (detect-secrets, ruff, pre-commit, sync-tracked)" \
            "- [$(_checked resilient_validation.yml false)] resilient_validation.yml — Resilient Validation Suite (full pytest, 4 shards)" \
            "- [$(_checked test-rag.yml false)] test-rag.yml — RAG Module Tests (coverage ≥95%)" \
            "- [$(_checked nox_gates.yml false)] nox_gates.yml — Nox quality gates (ruff, mypy, coverage)" \
            '' \
            '### 🔒 Opt-In: Security & Quality' \
            "- [$(_checked security-scanning-suite.yml false)] security-scanning-suite.yml — Full security audit (bandit, pip-audit)" \
            '' \
            '### 📄 Opt-In: Documentation' \
            "- [$(_checked documentation-link-checker.yml false)] documentation-link-checker.yml — Documentation link checker" \
            '' \
            '> Instructions for Copilot Agent: During wrap-up, check ONLY the workflows needed for' \
            '> this session. Unchecked workflows will be SKIPPED by the gate.')

          UPDATED_BODY="${STRIPPED_BODY}${WEC}"
          gh pr edit "${PR_NUMBER}" --repo "${{ github.repository }}" --body "${UPDATED_BODY}"
          echo "✅ Canonical Workflow Execution Checklist (heading format) injected into PR #${PR_NUMBER}"
          printf '### ✅ Workflow Execution Checklist\n\nCanonical format injected — approval gates are now armed.\n' >> "$GITHUB_STEP_SUMMARY"

      # ── REQ-6: Timebox expiry acknowledgment gate ────────────────────────
      # Tier-1 hard stop — promotes SESSION_TIMEBOX_EXPIRED from Tier-2 (visible comment, ignorable)
      # to Tier-1 (CI blocks activate-delegation until a Session Summary is posted).
      # Logic: scan PR comments for SESSION_TIMEBOX_EXPIRED; if found, require a
      # "## 🧠 Session Summary" comment posted AFTER the expiry notice.
      # Rationale: Timebox expiry was Tier-2 PARTIAL — agent could ignore the posted notice.
      # Bypass cost (grounded): agent MUST post a Session Summary or no activation occurs.
      - name: Verify SESSION_TIMEBOX_EXPIRED acknowledged
        id: timebox_ack_check
        if: >
          github.event_name == 'pull_request' ||
          github.event_name == 'pull_request_review'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const EXPIRED_MARKER  = 'SESSION_TIMEBOX_EXPIRED';
            const SUMMARY_MARKER  = '## 🧠 Session Summary';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            // Find most recent SESSION_TIMEBOX_EXPIRED comment
            const expiredComment = comments
              .filter(c => c.body.includes(EXPIRED_MARKER))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            if (!expiredComment) {
              core.summary.addRaw('### ⏱ Timebox Acknowledgment Check\n\n✅ **PASS** — No `SESSION_TIMEBOX_EXPIRED` found. No acknowledgment required.\n\n');
              await core.summary.write();
              return;
            }

            const expiredAt = new Date(expiredComment.created_at);

            // Check for Session Summary comment posted AFTER the expiry notice
            const summaryAfterExpiry = comments.find(c =>
              c.body.includes(SUMMARY_MARKER) &&
              new Date(c.created_at) > expiredAt
            );

            if (summaryAfterExpiry) {
              const poster = summaryAfterExpiry.user.login;
              const postedAt = summaryAfterExpiry.created_at;
              core.summary.addRaw(
                `### ⏱ Timebox Acknowledgment Check\n\n` +
                `✅ **PASS** — Session Summary posted by @${poster} at ${postedAt}, after timebox expiry.\n\n`
              );
              await core.summary.write();
            } else {
              core.summary.addRaw(
                `### ⏱ Timebox Acknowledgment Check\n\n` +
                `❌ **FAIL** — \`SESSION_TIMEBOX_EXPIRED\` was posted at ${expiredComment.created_at} ` +
                `but no \`## 🧠 Session Summary\` comment has been posted since then.\n\n` +
                `**Fix:** Post a PR comment containing \`## 🧠 Session Summary\` covering:\n` +
                `- Topics covered and key findings\n` +
                `- Suggested follow-up \`@copilot\` prompt for the next session\n\n` +
                `_Session activation is blocked until the Session Summary is posted._\n`
              );
              await core.summary.write();
              core.setFailed('SESSION_TIMEBOX_EXPIRED requires a "## 🧠 Session Summary" comment before reactivation.');
            }

      # ── REQ-7: Warn when PR has only 1 commit (Tier-2: present-tense injection) ──────
      # Promotes "NEVER stop after one commit" from Tier-3 (store_memory) to Tier-2
      # (present-tense warning in job summary, visible on every push).
      # A single-commit PR may indicate a premature session close — surface this prominently.
      # This is a WARNING, not a hard block (hard block would require session-duration tracking).
      # Policy: .codex/docs/GROUNDED_VS_SOFT_ENFORCEMENT.md REQ-7
      - name: Warn on single-commit PR (REQ-7 — NEVER stop after one commit)
        if: >
          github.event_name == 'pull_request' ||
          github.event_name == 'pull_request_review'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fetch base branch so we can count commits precisely
          git fetch origin "${BASE_REF}" --depth=50 2>/dev/null || true

          # Count commits on this PR (HEAD not in base)
          COMMIT_COUNT=$(git rev-list --count "origin/${BASE_REF}..HEAD" 2>/dev/null || echo "0")

          echo "### 🔢 REQ-7: Commit Count Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PR commits since base: **${COMMIT_COUNT}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${COMMIT_COUNT}" -le 1 ]; then
            echo "⚠️ **WARNING** — Only ${COMMIT_COUNT} commit(s) on this PR." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Policy:** The agent MUST NOT stop after a single commit. Continue working" >> "$GITHUB_STEP_SUMMARY"
            echo "> until all open tasks are complete. A single commit indicates an incomplete session." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> _See: \`.codex/docs/GROUNDED_VS_SOFT_ENFORCEMENT.md\` — REQ-7 Tier-2 enforcement._" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::REQ-7: Only ${COMMIT_COUNT} commit(s) on this PR — agent must not stop after a single commit (policy: NEVER stop after one commit)"
          else
            echo "✅ **PASS** — ${COMMIT_COUNT} commits detected; single-commit stop rule does not apply." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── REQ-8: Memory system health check (P4.8 GROUNDED soft gate) ───────
      # Policy: /api/memory/state must return stm_count >= 0 — confirms SQLite
      # STM/LTM tables were initialised correctly by cli_api_server.py.
      # Soft gate: warning only (session not blocked if server not running in CI).
      # NOTE: Python script is base64-encoded per YAML embedded-Python rule
      #   (never use python3 -c "..." multiline in run: blocks).
      - name: "REQ-8: Memory system health check"
        id: req8
        if: always()
        continue-on-error: true  # soft gate — warning only (server not started in CI is expected)
        run: |  # pragma: allowlist secret
          echo "### REQ-8: Memory System Health Check" >> "$GITHUB_STEP_SUMMARY"
          # Temporarily disable set -e so python3 non-zero exit (server unreachable) is
          # captured in MEMORY_OK rather than hard-failing this soft gate.
          set +e
          echo "" | base64 -d | python3 2>/dev/null
          # Decoded equivalent (for review):
          # import urllib.request, json, sys
          # try:
          #     with urllib.request.urlopen("http://localhost:8765/api/memory/state", timeout=3) as r:
          #         d = json.loads(r.read())
          #         sys.exit(0 if d.get("stm_count", 0) >= 0 else 1)
          # except Exception:
          #     sys.exit(2)
          MEMORY_OK=$?
          set -e
          if [ "$MEMORY_OK" = "0" ]; then
            echo "PASS: Memory system reachable; STM/LTM tables initialised." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MEMORY_OK" = "2" ]; then
            echo "SOFT GATE: Memory server not reachable (CI environment; server not started). Expected in GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::REQ-8: Memory system not reachable — soft gate (expected in CI when server is not started)"
          else
            echo "SOFT GATE: /api/memory/state returned unexpected data." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::REQ-8: /api/memory/state returned unexpected data — verify SQLite schema migration"
          fi

      # ── REQ-9: Iterative self-healing validation (REQ 2 — 5-pass self-review) ───
      # Runs the 5-pass self-review checklist as a CI gate:
      # Pass 1: Python AST | Pass 2: YAML | Pass 3: Changelog | Pass 4: Tmp | Pass 5: Registry
      - name: "REQ-9: Iterative self-review (5 passes)"
        if: always()
        run: |  # pragma: allowlist secret
          echo "### REQ-9: 5-Pass Self-Review" >> "$GITHUB_STEP_SUMMARY"
          PASS_FAILURES=0
          # Pass 1: Python AST check on changed server file
          if python3 -c "import ast,sys; [ast.parse(open(f).read()) for f in ['cognitive_app/src/server/cli_api_server.py','scripts/ci/collect_telemetry.py'] if __import__('os').path.exists(f)]" 2>/dev/null; then
            echo "Pass 1 (Python AST): OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pass 1 (Python AST): FAIL" >> "$GITHUB_STEP_SUMMARY"
            PASS_FAILURES=$((PASS_FAILURES+1))
          fi
          # Pass 2: YAML parse for all workflows (base64-encoded per YAML embedded-Python rule)
          # Decoded: import yaml,glob,sys; errs=[]; for f in glob('.github/workflows/*.yml'): try safe_load; print(len(errs))
          YAML_ERRORS=$(echo "aW1wb3J0IHlhbWwsZ2xvYixzeXMKZXJycz1bXQpmb3IgZiBpbiBnbG9iLmdsb2IoIi5naXRodWIvd29ya2Zsb3dzLyoueW1sIik6CiAgICB0cnk6IHlhbWwuc2FmZV9sb2FkKG9wZW4oZikpCiAgICBleGNlcHQgRXhjZXB0aW9uIGFzIGU6IGVycnMuYXBwZW5kKGYpCnByaW50KGxlbihlcnJzKSkK" | base64 -d | python3 2>/dev/null || echo "99")
          if [ "$YAML_ERRORS" = "0" ]; then
            echo "Pass 2 (YAML parse): OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pass 2 (YAML parse): FAIL ($YAML_ERRORS errors)" >> "$GITHUB_STEP_SUMMARY"
            PASS_FAILURES=$((PASS_FAILURES+1))
            echo "::error::REQ-9 Pass 2: $YAML_ERRORS workflow YAML parse errors"
          fi
          # Pass 3: CHANGELOG [Unreleased] entry exists
          if grep -q "Unreleased" CHANGELOG.md 2>/dev/null; then
            echo "Pass 3 (CHANGELOG): OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pass 3 (CHANGELOG): FAIL — no [Unreleased] entry" >> "$GITHUB_STEP_SUMMARY"
            PASS_FAILURES=$((PASS_FAILURES+1))
            echo "::error::REQ-9 Pass 3: CHANGELOG missing [Unreleased] entry (WF-001 gate)"
          fi
          # Pass 4: No unexpected /tmp artifacts
          TMP_COUNT=$(ls /tmp/*.py /tmp/*.yml /tmp/*.sh /tmp/*.json 2>/dev/null | wc -l || echo 0)
          if [ "$TMP_COUNT" = "0" ]; then
            echo "Pass 4 (tmp clean): OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pass 4 (tmp clean): WARNING — $TMP_COUNT tmp artifacts" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::REQ-9 Pass 4: $TMP_COUNT /tmp artifacts detected"
          fi
          # Pass 5: AGENT_REGISTRY version parseable
          REGISTRY_OK=$(python3 -c "import yaml; d=yaml.safe_load(open('.github/agents/AGENT_REGISTRY.yaml')); print(f'v{d[\"version\"]}|{d[\"total_agents\"]}')" 2>/dev/null || echo "FAIL")
          if [ "$REGISTRY_OK" != "FAIL" ]; then
            echo "Pass 5 (AGENT_REGISTRY): OK — $REGISTRY_OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pass 5 (AGENT_REGISTRY): FAIL" >> "$GITHUB_STEP_SUMMARY"
            PASS_FAILURES=$((PASS_FAILURES+1))
          fi
          # Summary
          if [ "$PASS_FAILURES" = "0" ]; then
            echo "**5/5 self-review passes: ALL OK**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**$PASS_FAILURES/5 passes FAILED — fix before merge**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::REQ-9: $PASS_FAILURES self-review passes failed"
          fi

      # ── REQ-10: Branch rebase status — HARD BLOCK ────────────────────────
      # Tier-1 hard stop — blocks agent activation when the PR branch is
      # BEHIND or DIVERGED from its base branch.
      #
      # Working on a stale branch causes:
      #   • Merge conflicts at PR merge time
      #   • Re-introduction of already-fixed code
      #   • CI failures from stale dependency state
      #
      # The branch-rebase-gate.yml workflow (WF-010) posts a
      # BRANCH_REBASE_REQUIRED comment on the PR.  This step reads that
      # marker and hard-fails if the comment is present AND unresolved
      # (no BRANCH_REBASE_RESOLVED comment posted AFTER it).
      #
      # The agent MUST:
      #   1. `git fetch origin <base> && git rebase origin/<base>`
      #   2. `git push --force-with-lease`
      #   3. Wait for the next CI run — this step will then pass automatically.
      - name: "REQ-10: Branch rebase check (hard block if behind/diverged)"
        id: req10
        if: >
          github.event_name == 'pull_request' ||
          github.event_name == 'pull_request_review'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const REQUIRED_MARKER = 'BRANCH_REBASE_REQUIRED';
            const RESOLVED_MARKER = 'BRANCH_REBASE_RESOLVED';
            const prNumber = context.issue.number;

            core.info(`REQ-10: Checking rebase status for PR #${prNumber}`);

            // Helper: check whether all commits in an array are automated
            // [skip ci] github-actions[bot] commits.  When true the gap
            // contains only metadata updates and is safe to auto-pass.
            const BOT_LOGINS = new Set([
              'github-actions[bot]',
              '41898282+github-actions[bot]',
            ]);
            function gapIsAllBotSkipCi(commits) {
              if (!commits || commits.length === 0) return false;
              return commits.every(c => {
                const login = (c.author  && c.author.login)          || '';
                const msg   = (c.commit  && c.commit.message)        || '';
                return BOT_LOGINS.has(login) && msg.toLowerCase().includes('[skip ci]');
              });
            }

            // Helper: fetch commits that `base` has but `head` is missing
            // (the "gap" — what the PR branch needs to absorb).
            async function fetchGapCommits(base, head) {
              try {
                const { data: rev } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  basehead: `${head}...${base}`,   // reversed: commits in base ∖ head
                });
                return rev.commits || [];
              } catch (e) {
                core.warning(`REQ-10: could not fetch gap commits: ${e.message}`);
                return [];
              }
            }

            // Fetch all PR comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            // Find the latest REQUIRED and RESOLVED markers
            const required = comments.filter(c => (c.body || '').includes(REQUIRED_MARKER));
            const resolved = comments.filter(c => (c.body || '').includes(RESOLVED_MARKER));

            if (required.length === 0) {
              // No rebase-required marker → check live compare API as fallback
              const pr = context.payload.pull_request;
              if (pr) {
                const base = pr.base.ref;
                const head = pr.head.ref;
                try {
                  const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                    owner: context.repo.owner,
                    repo:  context.repo.repo,
                    basehead: `${base}...${head}`,
                  });
                  const status   = cmp.status;
                  const behindBy = cmp.behind_by || 0;
                  core.info(`Compare ${base}...${head}: status=${status}, behind_by=${behindBy}`);

                  await core.summary
                    .addHeading('REQ-10: Branch Rebase Check', 3)
                    .addRaw(`\n\`${head}\` vs \`${base}\`: **${status}** (behind=${behindBy})\n`)
                    .write();

                  if (status === 'behind' || status === 'diverged') {
                    // Auto-pass when the entire gap is [skip ci] bot commits.
                    const gap       = await fetchGapCommits(base, head);
                    const allBotGap = gapIsAllBotSkipCi(gap);
                    if (allBotGap) {
                      core.info(
                        `REQ-10 PASS: branch is ${status} but all ${gap.length} gap ` +
                        `commit(s) are [skip ci] bot metadata commits — no rebase needed.`
                      );
                    } else {
                      core.setFailed(
                        `REQ-10 FAIL: Branch '${head}' is ${behindBy} commit(s) BEHIND '${base}'. ` +
                        `Rebase before starting agent work:\n  git fetch origin ${base}\n  git rebase origin/${base}\n  git push --force-with-lease`
                      );
                    }
                  } else {
                    core.info(`REQ-10 PASS: branch is ${status} (no rebase needed)`);
                  }
                } catch (err) {
                  core.warning(`REQ-10: Could not compare branches: ${err.message} — soft warning`);
                }
              }
              return;
            }

            // There is a REQUIRED marker — check if a RESOLVED marker follows it
            const latestRequired = required.sort(
              (a, b) => new Date(b.updated_at) - new Date(a.updated_at)
            )[0];
            const latestResolved = resolved.length > 0
              ? resolved.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0]
              : null;

            const requiredTs = new Date(latestRequired.updated_at);
            const resolvedTs = latestResolved ? new Date(latestResolved.updated_at) : null;

            const markerResolved = resolvedTs && resolvedTs > requiredTs;

            // Even if no RESOLVED marker, check the live branch comparison API.
            // The branch may have been rebased since the REQUIRED marker was posted,
            // in which case the live check should confirm it is up-to-date.
            let liveResolved = false;
            const pr = context.payload.pull_request;
            if (!markerResolved && pr) {
              try {
                const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  basehead: `${pr.base.ref}...${pr.head.ref}`,
                });
                const liveStatus = cmp.status;
                const behindBy   = cmp.behind_by || 0;
                core.info(`Live compare ${pr.base.ref}...${pr.head.ref}: status=${liveStatus}, behind_by=${behindBy}`);
                liveResolved = (liveStatus === 'ahead' || liveStatus === 'identical');
                if (liveResolved) {
                  core.info('REQ-10: Live compare shows branch is up-to-date — treating REQUIRED marker as stale.');
                } else if (liveStatus === 'behind' || liveStatus === 'diverged') {
                  // Auto-pass when the entire gap is [skip ci] bot commits.
                  const gap       = await fetchGapCommits(pr.base.ref, pr.head.ref);
                  const allBotGap = gapIsAllBotSkipCi(gap);
                  if (allBotGap) {
                    core.info(
                      `REQ-10: All ${gap.length} gap commit(s) are [skip ci] bot metadata ` +
                      `commits — treating REQUIRED marker as auto-resolved.`
                    );
                    liveResolved = true;
                  }
                }
              } catch (err) {
                core.warning(`REQ-10: Could not perform live compare: ${err.message}`);
              }
            }

            const isResolved = markerResolved || liveResolved;

            await core.summary
              .addHeading('REQ-10: Branch Rebase Check', 3)
              .addRaw(isResolved
                ? `\n✅ PASS — Branch is up-to-date (marker resolved or live compare confirms no rebase needed)\n`
                : `\n🔴 FAIL — \`BRANCH_REBASE_REQUIRED\` marker present (${requiredTs.toISOString()}) and branch still behind/diverged.\n`
              )
              .write();

            if (!isResolved) {
              core.setFailed(
                'REQ-10 FAIL: A BRANCH_REBASE_REQUIRED marker is present and branch is still behind/diverged. ' +
                'The Copilot Agent MUST rebase the branch before starting work. ' +
                'See the BRANCH_REBASE_REQUIRED comment on this PR for instructions.'
              );
            } else {
              core.info('REQ-10 PASS: Branch is up-to-date — rebase gate cleared.');
            }

      # ── Final gate summary ────────────────────────────────────────────────
      - name: Cognitive Pre-flight Final Status
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" == "success" ]; then
            echo "## 🟢 COGNITIVE PRE-FLIGHT: ALL CHECKS PASSED" >> "$GITHUB_STEP_SUMMARY"
            echo "Session activation is **unblocked**. \`activate-delegation\` may proceed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 🚫 COGNITIVE PRE-FLIGHT: SESSION BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "Resolve all ❌ items above. \`activate-delegation\` will not run until this job passes." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_WF-001 | cognitive-preflight gate | .codex/CODEBASE_AGENCY_POLICY.md_" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 4: activate delegation, set variable, post @copilot continue ─────────
  activate-delegation:
    name: "Activate token delegation"
    needs: [detect-checkbox, await-approval, cognitive-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      always() &&
      github.event.action != 'closed' &&
      needs.detect-checkbox.result == 'success' &&
      needs.detect-checkbox.outputs.auth_requested == 'true' &&
      needs.cognitive-preflight.result == 'success' &&
      (needs.await-approval.result == 'success' || needs.await-approval.result == 'skipped')
    # Rationale for 'success' OR 'skipped' on await-approval:
    #   - 'success': First-time activation — human just approved the environment gate.
    #   - 'skipped': Re-activation — delegation is already active (COPILOT_AGENT_AUTH_ENABLED == 'true'),
    #     so await-approval is skipped (no re-approval needed). activate-delegation still runs to
    #     upsert the existing '<!-- agent-token-delegation-result -->' comment (update, not create),
    #     which does NOT trigger duplicate Copilot sessions because GitHub only fires Copilot on
    #     comment CREATION, not on comment UPDATES.
    # always() is required here because GitHub Actions skips dependents of 'skipped' jobs by default.

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CODEX_MASTER_KEY }}
          ref: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}

      # ── 3a: Set COPILOT_AGENT_AUTH_ENABLED + update COGNITIVE_BRAIN_ALLOWED_ACTORS ──
      - name: "Set repo variables via CODEX_MASTER_KEY (maintainer auth)"
        id: set_vars
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CODEX_MASTER_KEY }}
          script: |
            // Helper: upsert a repo variable (create if 404, patch if exists)
            async function upsertVar(name, value) {
              try {
                await github.request('PATCH /repos/{owner}/{repo}/actions/variables/{name}', {
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  name,
                  value,
                });
                core.info(`✅ PATCH ${name} = ${value}`);
              } catch (e) {
                if (e.status === 404) {
                  await github.request('POST /repos/{owner}/{repo}/actions/variables', {
                    owner: context.repo.owner,
                    repo:  context.repo.repo,
                    name,
                    value,
                  });
                  core.info(`✅ POST (create) ${name} = ${value}`);
                } else {
                  throw e;
                }
              }
            }

            // 1. Enable agent auth flag
            await upsertVar('COPILOT_AGENT_AUTH_ENABLED', 'true');

            // 2. Ensure all three delegated agent identities are present
            //    (S110 Set-based exact-match pattern — no partial-name false positives)
            const REQUIRED_AGENTS = [
              'copilot-swe-agent[bot]',   // GitHub Copilot coding agent
              'github-copilot[bot]',       // Copilot custom agents
              'github-actions[bot]',       // CI/AI workflow agents
            ];

            let currentActors = 'mbaetiong,github-actions[bot]';
            try {
              const resp = await github.request(
                'GET /repos/{owner}/{repo}/actions/variables/{name}',
                { owner: context.repo.owner, repo: context.repo.repo,
                  name: 'COGNITIVE_BRAIN_ALLOWED_ACTORS' }
              );
              currentActors = resp.data.value || currentActors;
            } catch (e) {
              core.warning(`Could not fetch COGNITIVE_BRAIN_ALLOWED_ACTORS: ${e.message}`);
            }

            const actorSet = new Set(
              currentActors.split(',').map(a => a.trim()).filter(a => a.length > 0)
            );
            for (const agent of REQUIRED_AGENTS) { actorSet.add(agent); }
            const updatedActors = Array.from(actorSet).join(',');

            await upsertVar('COGNITIVE_BRAIN_ALLOWED_ACTORS', updatedActors);
            core.info(`✅ COGNITIVE_BRAIN_ALLOWED_ACTORS: ${updatedActors}`);

            core.setOutput('updated_actors', updatedActors);

      # ── 3b: Write session token file for provenance-chain bypass (A-001) ──────
      # Writes .codex/agent_auth_session.json with a 1-hour expiry (TTL=3600s).
      # owner_approval_guard.sh reads this file so ALL agent sessions within the TTL
      # bypass the cost-gate without requiring a new environment gate approval.
      # The agent (copilot-swe-agent[bot]) CAN write this file since it has full
      # repo write access. The owner's one-time approval propagates across sessions.
      - name: "Write provenance session token (.codex/agent_auth_session.json)"
        run: |
          mkdir -p .codex
          EXPIRY=$(( $(date +%s) + 3600 ))
          cat > .codex/agent_auth_session.json <<EOF
          {
            "issued_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "expires_at": ${EXPIRY},
            "issued_by": "agent-auth-delegation",
            "run_id": "${{ github.run_id }}",
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "pr_number": "${{ needs.detect-checkbox.outputs.pr_number }}",
            "bypass_tools": "",
            "note": "Provenance-chain token. Allows all agent sessions to bypass owner_approval_guard within TTL. Renew by re-triggering agent-auth-delegation."
          }
          EOF
          echo "✅ Session token written (expires in 1h at epoch ${EXPIRY})"
          cat .codex/agent_auth_session.json
        shell: bash

      - name: "Commit session token to branch"
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.head_ref || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || '' }}
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        run: |
          # Resolve TARGET_BRANCH — fall back to API lookup when event context lacks head.ref
          if [ -z "${TARGET_BRANCH}" ] && [ -n "${PR_NUMBER}" ]; then
            TARGET_BRANCH=$(gh pr view "${PR_NUMBER}" --json headRefName -q .headRefName 2>/dev/null || true)
          fi
          if [ -z "${TARGET_BRANCH}" ] || echo "${TARGET_BRANCH}" | grep -qE '^[0-9]+/merge$'; then
            echo "::warning::Could not resolve target branch (got '${TARGET_BRANCH}'). Skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .codex/agent_auth_session.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(auth): write provenance session token [skip ci]"
            git pull --rebase --autostash origin "${TARGET_BRANCH}" || true
            git push origin HEAD:refs/heads/${TARGET_BRANCH}
          fi

      # ── 3c: Dispatch GitHub Guru to verify & document the variable change ────
      # GitHub Guru acts as the "codebase maintainer" that audits the variable
      # state and posts a structured PR comment confirming the change is visible.
      - name: "Dispatch GitHub Guru (maintainer verification)"
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                workflow_id: 'github-guru.yml',
                ref:         context.ref || 'main',
                inputs: {
                  mode: 'pr_only',
                },
              });
              core.info('✅ GitHub Guru dispatched for maintainer variable verification');
            } catch (e) {
              core.warning(`GitHub Guru dispatch skipped: ${e.message}`);
            }

      # ── 3c-bis: D-00 Session Bootstrap — write context digest before @copilot fires
      # Runs session_bootstrap.py in offline+skip-triage mode to write a fresh
      # .codex/session_context_latest.md from the PR body text.  The digest is
      # committed to the branch so the agent finds it on checkout.  Step is
      # continue-on-error so a bootstrap failure never blocks delegation.
      - name: "D-00 Session Bootstrap (write context digest)"
        id: session_bootstrap
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_NUMBER: ${{ needs.detect-checkbox.outputs.pr_number }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          echo "## 🔍 D-00 Session Bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f "scripts/ci/session_bootstrap.py" ]; then
            echo "⚠️ session_bootstrap.py not found — skipping D-00 step" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Build a minimal context string: PR URL + body
          REPO="${{ github.repository }}"
          PR_URL="https://github.com/${REPO}/pull/${PR_NUMBER}"
          CONTEXT_TEXT="${PR_URL}"$'\n'"${PR_BODY}"

          # Run bootstrap in offline mode (no external URL fetching in CI),
          # skip triage (already runs in cognitive-preflight job).
          echo "${CONTEXT_TEXT}" | \
            python scripts/ci/session_bootstrap.py \
              --offline \
              --skip-triage \
              --json-out .codex/session_context_latest.json \
              2>&1 | tail -20 | tee -a "$GITHUB_STEP_SUMMARY" || true

          # Commit the context digest if it was written/modified
          if git diff --quiet .codex/session_context_latest.md .codex/session_context_latest.json 2>/dev/null; then
            echo "ℹ️ Context digest unchanged — no commit needed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git add .codex/session_context_latest.md .codex/session_context_latest.json 2>/dev/null || true
            _commit_ok=false
            _push_ok=false
            if git commit -m "chore(d00): update session context digest [skip ci]" 2>/dev/null; then
              _commit_ok=true
              if git push origin HEAD 2>/dev/null; then
                _push_ok=true
              fi
            fi
            if [ "$_commit_ok" = "true" ] && [ "$_push_ok" = "true" ]; then
              echo "✅ Context digest committed and pushed." | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ "$_commit_ok" = "true" ]; then
              echo "⚠️ Context digest committed but push failed — will retry on next run." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ Context digest staged but commit failed (possibly nothing to commit)." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # ── 3c-bis: Inject cognitive-brain context into @copilot continue (IMP-013) ──
      - name: "Retrieve CB patterns for session context"
        id: cb_patterns
        continue-on-error: true  # fail-open — pattern retrieval never blocks delegation
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
        run: |
          CB_BLOCK=$(python -m codex.github.mcp_poster retrieve-patterns --limit 8 2>/dev/null || true)
          # Escape for multiline GitHub output
          {
            echo 'cb_markdown<<CB_EOF'
            echo "$CB_BLOCK"
            echo 'CB_EOF'
          } >> "$GITHUB_OUTPUT"

      # ── 3d: Session Concurrency Gate (S182) ──────────────────────────────────
      # Check COPILOT_ACTIVE_SESSION repo variable. If another session is active
      # and COPILOT_MULTI_SESSION is not enabled, queue this PR instead of posting
      # @copilot continue. When the active session completes, the session-release
      # job will trigger the next queued PR.
      # Variable format: "PR#|epoch_timestamp|run_id" (e.g. "3724|1774576800|12345")
      # TTL: 1 hour (3600 seconds) — stale locks are auto-cleared.
      - name: "Session Concurrency Gate"
        id: session_gate
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          script: |
            const prNumber = parseInt('${{ needs.detect-checkbox.outputs.pr_number }}', 10);
            if (isNaN(prNumber) || prNumber <= 0) {
              core.warning('Invalid PR number for session gate — skipping lock');
              core.setOutput('acquired', 'true');
              core.setOutput('queued', 'false');
              return;
            }
            const multiSession = '${{ needs.detect-checkbox.outputs.multi_session }}' === 'true';
            const TTL_SECONDS = 3600; // 1 hour
            const now = Math.floor(Date.now() / 1000);

            // Helper: get repo variable (returns null if not found)
            async function getVar(name) {
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/actions/variables/{name}', {
                  owner: context.repo.owner, repo: context.repo.repo, name,
                });
                return data.value || '';
              } catch (e) {
                if (e.status === 404) return '';
                throw e;
              }
            }

            // Helper: upsert repo variable
            async function upsertVar(name, value) {
              try {
                await github.request('PATCH /repos/{owner}/{repo}/actions/variables/{name}', {
                  owner: context.repo.owner, repo: context.repo.repo, name, value,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.request('POST /repos/{owner}/{repo}/actions/variables', {
                    owner: context.repo.owner, repo: context.repo.repo, name, value,
                  });
                } else { throw e; }
              }
            }
            // GitHub API rejects empty-string variable values (422). Use DELETE to clear.
            async function clearVar(name) {
              try {
                await github.request('DELETE /repos/{owner}/{repo}/actions/variables/{name}', {
                  owner: context.repo.owner, repo: context.repo.repo, name,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            const activeSession = await getVar('COPILOT_ACTIVE_SESSION');

            // Check if there's an active, non-expired session
            let sessionBusy = false;
            let activePR = '';
            if (activeSession) {
              const parts = activeSession.split('|');
              activePR = parts[0] || '';
              const lockEpoch = parseInt(parts[1] || '0', 10);

              if (isNaN(lockEpoch)) {
                core.warning(`Corrupted session lock format: '${activeSession}' — clearing`);
                await clearVar('COPILOT_ACTIVE_SESSION');
                sessionBusy = false;
              } else {
                const age = now - lockEpoch;

                if (age < TTL_SECONDS && activePR !== String(prNumber)) {
                  sessionBusy = true;
                  core.info(`Active session on PR #${activePR} (age: ${age}s, TTL: ${TTL_SECONDS}s)`);
                } else if (age >= TTL_SECONDS) {
                  core.warning(`Stale session lock cleared (PR #${activePR}, age: ${age}s > TTL ${TTL_SECONDS}s)`);
                  await clearVar('COPILOT_ACTIVE_SESSION');
                  sessionBusy = false;

                  // S230 fix: when a stale TTL lock is cleared, also dequeue
                  // and retrigger any PRs that were waiting in the queue.
                  // Previously only the `session-release` job (fired on PR close)
                  // processed the queue, leaving queued PRs stranded when a
                  // session expired naturally (never closed).
                  const staleClearedQueue = await getVar('COPILOT_SESSION_QUEUE');
                  if (staleClearedQueue) {
                    const staleClearedList = staleClearedQueue.split(',').filter(Boolean);
                    // Peek at the first entry before mutating the array.
                    const nextQueuedPR = parseInt(staleClearedList[0], 10);
                    if (!isNaN(nextQueuedPR) && nextQueuedPR > 0 && nextQueuedPR !== prNumber) {
                      core.info(`🔓 Stale lock cleared — retriggering queued PR #${nextQueuedPR}`);
                      try {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: nextQueuedPR,
                          body: [
                            '<!-- session-gate-dequeued -->',
                            '## 🔓 Session Available (Stale Lock Cleared)',
                            '',
                            `Previous session (PR #${activePR}) exceeded the ${TTL_SECONDS / 3600}h TTL and was cleared.`,
                            'This PR has been dequeued and the session is now starting.',
                            '',
                            '@copilot continue',
                          ].join('\n'),
                        });
                        // Remove the dequeued PR from the queue only after the
                        // comment was successfully posted (review: avoid removing
                        // from queue if comment creation throws).
                        staleClearedList.shift();
                        await upsertVar('COPILOT_SESSION_QUEUE', staleClearedList.join(','));
                        core.info(`✅ Retriggered PR #${nextQueuedPR} after stale TTL cleanup`);
                      } catch (err) {
                        core.warning(`Failed to retrigger PR #${nextQueuedPR} after stale lock clear: ${err.message}`);
                      }
                    } else if (!isNaN(nextQueuedPR) && nextQueuedPR === prNumber) {
                      // Current PR is first in queue — just clear it from the queue
                      staleClearedList.shift();
                      await upsertVar('COPILOT_SESSION_QUEUE', staleClearedList.join(','));
                      core.info(`Current PR #${prNumber} was first in queue — clearing from queue and proceeding`);
                    }
                  }
                } else {
                  // Same PR — re-acquire is fine
                  sessionBusy = false;
                }
              }
            }

            if (sessionBusy && !multiSession) {
              // Queue this PR — don't post @copilot continue
              core.setOutput('acquired', 'false');
              core.setOutput('queued', 'true');

              // Append to queue variable
              const queue = await getVar('COPILOT_SESSION_QUEUE');
              const queueList = queue ? queue.split(',').filter(Boolean) : [];
              if (!queueList.includes(String(prNumber))) {
                queueList.push(String(prNumber));
                await upsertVar('COPILOT_SESSION_QUEUE', queueList.join(','));
              }

              // S239: upsert the "⏳ Session Queued" comment — update it with the latest
              // queue position if it already exists, otherwise create it. This keeps
              // the queue position live so observers can see where they stand.
              // Fetches the most-recent 100 comments (GitHub max per_page). On very active PRs
              // (>100 comments) an earlier queued marker may not be found; worst case: one extra
              // notification per 100-comment boundary, which is acceptable.
              const { data: prComments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, per_page: 100,
              });
              const queuedCommentBody = [
                '<!-- session-gate-queued -->',
                '## ⏳ Session Queued',
                '',
                `Another Copilot session is active on PR #${activePR}.`,
                'This PR has been added to the session queue and will be triggered automatically when the active session completes.',
                '',
                '| Detail | Value |',
                '|--------|-------|',
                `| Active Session | PR #${activePR} |`,
                `| Queue Position | ${queueList.length} |`,
                `| Multi-Session | \`${multiSession}\` (default: disabled) |`,
                '',
                '> To enable parallel sessions, check the **Multiple Copilot Coding Agent Sessions** checkbox in the PR body.',
                '',
                `_Session Concurrency Gate — [design](docs/plans/AUTONOMOUS_SELF_HEALING_PROPOSAL_S182.md#session-concurrency-control-design)_`,
              ].join('\n');
              const existingQueuedComment = prComments.find(c =>
                (c.body || '').includes('<!-- session-gate-queued -->')
              );
              if (existingQueuedComment) {
                // Update the existing comment with the latest queue position.
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existingQueuedComment.id,
                  body: queuedCommentBody,
                });
                core.info(`⏳ PR #${prNumber} queue position updated (position ${queueList.length}, active: PR #${activePR}).`);
              } else {
                // Post a new queued notification on the PR.
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: queuedCommentBody,
                });
                core.info(`⏳ PR #${prNumber} queued (position ${queueList.length}, active: PR #${activePR}).`);
              }
              core.info(`⏳ PR #${prNumber} queued — active session on PR #${activePR}`);
            } else {
              // Acquire the session lock
              const lockValue = `${prNumber}|${now}|${context.runId}`;
              await upsertVar('COPILOT_ACTIVE_SESSION', lockValue);
              core.setOutput('acquired', 'true');
              core.setOutput('queued', 'false');
              core.info(`🔒 Session lock acquired: ${lockValue}`);
            }

      # ── 3e: Post @copilot continue on the PR ─────────────────────────────────
      - name: "Post @copilot continue"
        if: steps.session_gate.outputs.acquired == 'true'
        uses: actions/github-script@v8
        env:
          CB_PATTERNS: ${{ steps.cb_patterns.outputs.cb_markdown || '' }}
        with:
          github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          script: |
            const prNumber = parseInt('${{ needs.detect-checkbox.outputs.pr_number }}', 10);
            if (!prNumber || prNumber <= 0) {
              core.setFailed('Invalid PR number — cannot post comment');
              return;
            }
            const actors    = '${{ steps.set_vars.outputs.updated_actors }}';
            const runUrl    = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Read via process.env to prevent code injection via backticks or ${...}
            // in markdown content from breaking the JS template literal.
            // (See review comment: cbPatterns interpolation, PR #3671.)
            const cbPatterns = (process.env.CB_PATTERNS || '').trim();

            const UPSERT_MARKER_DELEGATION = '<!-- agent-token-delegation-result -->';
            const cbSection = cbPatterns
              ? ['', '---', '', cbPatterns, '']
              : [];
            const body = [
              UPSERT_MARKER_DELEGATION,
              '## 🔐 Agent Token Delegation Activated',
              '',
              `Owner approval received ([workflow run](${runUrl})). Repo variables updated:`,
              '',
              '| Variable | Value |',
              '|----------|-------|',
              '| `COPILOT_AGENT_AUTH_ENABLED` | `true` |',
              `| \`COGNITIVE_BRAIN_ALLOWED_ACTORS\` | \`${actors}\` |`,
              '',
              '**Delegated agent coverage:**',
              '- ✅ `copilot-swe-agent[bot]` — GitHub Copilot coding agent',
              '- ✅ `github-copilot[bot]` — Copilot custom agents',
              '- ✅ `github-actions[bot]` — CI/AI workflow agents',
              '',
              '> GitHub Guru (maintainer) has been dispatched to verify variable state.',
              ...cbSection,
              '',
              '@copilot continue',
            ].join('\n');

            // Upsert: update existing or create new
            const { data: delegationComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existingDelegation = delegationComments.find(c => c.body && c.body.includes(UPSERT_MARKER_DELEGATION));
            if (existingDelegation) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingDelegation.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
            core.info(`✅ Posted @copilot continue on PR #${prNumber}`);

      # ── 3f: Auto-increment COGNITIVE_BRAIN_SESSION_NUMBER ────────────────────
      # Fires on every successful token delegation approval — the natural per-session
      # gate. Eliminates the need for manual variable updates in GitHub Settings.
      # The chatops_copilot_trigger.yml increment only fires for /copilot (slash)
      # commands; @copilot continue (at-sign) never triggers it, so the counter
      # historically required a manual bump after every PR. This step closes that gap.
      # Only runs when session gate was acquired (not queued).
      - name: "Increment COGNITIVE_BRAIN_SESSION_NUMBER"
        if: steps.session_gate.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY }}
        run: |
          CURRENT="${{ vars.COGNITIVE_BRAIN_SESSION_NUMBER }}"
          if [ -z "${GH_TOKEN}" ]; then
            echo "⚠️ CODEX_MASTER_KEY not available — session number increment skipped"
            exit 0
          fi
          NEXT=$((CURRENT + 1))
          if gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/variables/COGNITIVE_BRAIN_SESSION_NUMBER" \
            -f name='COGNITIVE_BRAIN_SESSION_NUMBER' \
            -f value="${NEXT}" \
            > /dev/null 2>&1; then
            echo "✅ COGNITIVE_BRAIN_SESSION_NUMBER: ${CURRENT} → ${NEXT}"
          else
            echo "⚠️ Failed to increment COGNITIVE_BRAIN_SESSION_NUMBER (${CURRENT} → ${NEXT}). Check CODEX_MASTER_KEY has variables:write scope."
          fi

      # ── 3g: Report completion via AgentBrainAPI.report_completion() ───────
      # Wires the ACE L6 closed-loop learning gate (AAIS honest-calibration §7).
      # Calls report_completion() from src/codex/cognitive/agent_brain_api.py
      # to mark this delegation session as complete in the cognitive brain and
      # feed the outcome into the pattern store.  Falls back gracefully when
      # the src/ module is unavailable (e.g. shallow clone without extras).
      - name: "Report completion to AgentBrainAPI (ACE L6)"
        if: success() && steps.session_gate.outputs.acquired == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
          SESSION_NUMBER: ${{ vars.COGNITIVE_BRAIN_SESSION_NUMBER }}
        run: |
          python3 - <<'PYEOF'
          import os, sys
          sys.path.insert(0, os.path.join(os.getcwd(), 'src'))
          pr = os.environ.get('PR_NUMBER', 'unknown')
          session = os.environ.get('SESSION_NUMBER', 'unknown')
          try:
              from codex.cognitive.agent_brain_api import AgentBrainAPI, ImprovementArea
              api = AgentBrainAPI(agent_id=f"agent-auth-delegation-s{session}")
              report = api.report_completion(
                  area=ImprovementArea.CI_CD,
                  step_id=f"AUTH-DELEGATION-PR{pr}",
                  outcome="success",
                  notes=f"Token delegation activated for PR #{pr} (session S{session})",
              )
              print(f"✅ report_completion() → pattern_id={report.pattern_id}")
          except Exception as exc:
              print(f"⚠️  AgentBrainAPI.report_completion() unavailable: {exc}")
              print("    (non-fatal — cognitive brain module not installed in CI env)")
          PYEOF

  # ── Job 5: Session Release — clear lock on PR close/merge (S182) ──────────
  # When a PR is closed (merged or abandoned), release the session lock so the
  # next queued PR can proceed. Dequeues the next PR and posts @copilot continue
  # on it to auto-trigger the next session.
  session-release:
    name: "🔓 Release session lock"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.action == 'closed'

    steps:
      - name: "Release COPILOT_ACTIVE_SESSION and trigger next queued PR"
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          script: |
            const closedPR = context.payload.pull_request?.number;
            if (!closedPR) {
              core.info('No PR context — skipping session release');
              return;
            }

            // Helper: get repo variable
            async function getVar(name) {
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/actions/variables/{name}', {
                  owner: context.repo.owner, repo: context.repo.repo, name,
                });
                return data.value || '';
              } catch (e) {
                if (e.status === 404) return '';
                throw e;
              }
            }

            // Helper: upsert repo variable
            async function upsertVar(name, value) {
              try {
                await github.request('PATCH /repos/{owner}/{repo}/actions/variables/{name}', {
                  owner: context.repo.owner, repo: context.repo.repo, name, value,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.request('POST /repos/{owner}/{repo}/actions/variables', {
                    owner: context.repo.owner, repo: context.repo.repo, name, value,
                  });
                } else { throw e; }
              }
            }
            // GitHub API rejects empty-string variable values (422). Use DELETE to clear.
            async function clearVar(name) {
              try {
                await github.request('DELETE /repos/{owner}/{repo}/actions/variables/{name}', {
                  owner: context.repo.owner, repo: context.repo.repo, name,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            // Check if the closing PR holds the active session lock
            const activeSession = await getVar('COPILOT_ACTIVE_SESSION');
            if (!activeSession) {
              core.info('No active session lock to release');
              return;
            }

            const activePR = activeSession.split('|')[0];
            if (activePR !== String(closedPR)) {
              core.info(`Lock held by PR #${activePR}, not closing PR #${closedPR} — skipping`);
              return;
            }

            // Release the lock
            await clearVar('COPILOT_ACTIVE_SESSION');
            core.info(`🔓 Released session lock (was: ${activeSession})`);

            // Dequeue next PR
            const queue = await getVar('COPILOT_SESSION_QUEUE');
            if (!queue) {
              core.info('Session queue is empty — no PR to trigger');
              return;
            }

            const queueList = queue.split(',').filter(Boolean);
            const nextPR = queueList.shift();

            if (nextPR) {
              const nextPRNumber = parseInt(nextPR, 10);
              if (isNaN(nextPRNumber) || nextPRNumber <= 0) {
                core.warning(`Invalid PR number in queue: '${nextPR}' — skipping`);
                await upsertVar('COPILOT_SESSION_QUEUE', queueList.join(','));
                return;
              }

              // Post @copilot continue on the dequeued PR to trigger its session
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: nextPRNumber,
                  body: [
                    '<!-- session-gate-dequeued -->',
                    '## 🔓 Session Available',
                    '',
                    `Previous session (PR #${closedPR}) has completed.`,
                    'This PR has been dequeued and the session is now starting.',
                    '',
                    '@copilot continue',
                  ].join('\n'),
                });
                // Only remove from queue after successful comment posting
                await upsertVar('COPILOT_SESSION_QUEUE', queueList.join(','));
                core.info(`✅ Dequeued PR #${nextPR} — posted @copilot continue`);

                // S239: Update the "⏳ Session Queued" comment on any remaining PRs
                // in the queue so they see their new (shifted) queue position.
                for (let i = 0; i < queueList.length; i++) {
                  const waitingPR = parseInt(queueList[i], 10);
                  if (isNaN(waitingPR) || waitingPR <= 0) continue;
                  try {
                    const { data: waitingComments } = await github.rest.issues.listComments({
                      owner: context.repo.owner, repo: context.repo.repo,
                      issue_number: waitingPR, per_page: 100,
                    });
                    const queuedComment = waitingComments.find(c =>
                      (c.body || '').includes('<!-- session-gate-queued -->')
                    );
                    if (queuedComment) {
                      const newPos = i + 1; // 1-based position
                      const updatedBody = [
                        '<!-- session-gate-queued -->',
                        '## ⏳ Session Queued',
                        '',
                        `Another Copilot session is now active on PR #${nextPRNumber} (just dequeued).`,
                        'This PR will be triggered automatically when that session completes.',
                        '',
                        '| Detail | Value |',
                        '|--------|-------|',
                        `| Active Session | PR #${nextPRNumber} |`,
                        `| Queue Position | ${newPos} |`,
                        `| Ahead in queue | ${newPos - 1} PR(s) |`,
                        '',
                        '> To enable parallel sessions, check the **Multiple Copilot Coding Agent Sessions** checkbox in the PR body.',
                        '',
                        `_Session Concurrency Gate — [design](docs/plans/AUTONOMOUS_SELF_HEALING_PROPOSAL_S182.md#session-concurrency-control-design)_`,
                      ].join('\n');
                      await github.rest.issues.updateComment({
                        owner: context.repo.owner, repo: context.repo.repo,
                        comment_id: queuedComment.id,
                        body: updatedBody,
                      });
                      core.info(`✅ Updated queue position for PR #${waitingPR} → position ${newPos}`);
                    }
                  } catch (err) {
                    core.warning(`Failed to update queue position for PR #${queueList[i]}: ${err.message}`);
                  }
                }
              } catch (err) {
                core.warning(`Failed to post @copilot continue on PR #${nextPR}: ${err.message}`);
                // Don't remove from queue — will retry on next release
              }
            } else {
              await clearVar('COPILOT_SESSION_QUEUE');
            }

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: activate-delegation
    if: |
      failure() &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Agent Auth Delegation"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
