    - name: Verify SESSION_TIMEBOX_EXPIRED acknowledged
      id: timebox_ack_check
      if: 'github.event_name == ''pull_request'' || github.event_name == ''pull_request_review''

        '
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const EXPIRED_MARKER  = 'SESSION_TIMEBOX_EXPIRED';\nconst SUMMARY_MARKER\
          \  = '## \U0001F9E0 Session Summary';\n\nconst { data: comments } = await\
          \ github.rest.issues.listComments({\n  owner: context.repo.owner,\n  repo:\
          \  context.repo.repo,\n  issue_number: context.issue.number,\n  per_page:\
          \ 100,\n});\n\n// Find most recent SESSION_TIMEBOX_EXPIRED comment\nconst\
          \ expiredComment = comments\n  .filter(c => c.body.includes(EXPIRED_MARKER))\n\
          \  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];\n\
          \nif (!expiredComment) {\n  core.summary.addRaw('### \u23F1 Timebox Acknowledgment\
          \ Check\\n\\n\u2705 **PASS** \u2014 No `SESSION_TIMEBOX_EXPIRED` found.\
          \ No acknowledgment required.\\n\\n');\n  await core.summary.write();\n\
          \  return;\n}\n\nconst expiredAt = new Date(expiredComment.created_at);\n\
          \n// Check for Session Summary comment posted AFTER the expiry notice\n\
          const summaryAfterExpiry = comments.find(c =>\n  c.body.includes(SUMMARY_MARKER)\
          \ &&\n  new Date(c.created_at) > expiredAt\n);\n\nif (summaryAfterExpiry)\
          \ {\n  const poster = summaryAfterExpiry.user.login;\n  const postedAt =\
          \ summaryAfterExpiry.created_at;\n  core.summary.addRaw(\n    `### \u23F1\
          \ Timebox Acknowledgment Check\\n\\n` +\n    `\u2705 **PASS** \u2014 Session\
          \ Summary posted by @${poster} at ${postedAt}, after timebox expiry.\\n\\\
          n`\n  );\n  await core.summary.write();\n} else {\n  core.summary.addRaw(\n\
          \    `### \u23F1 Timebox Acknowledgment Check\\n\\n` +\n    `\u274C **FAIL**\
          \ \u2014 \\`SESSION_TIMEBOX_EXPIRED\\` was posted at ${expiredComment.created_at}\
          \ ` +\n    `but no \\`## \U0001F9E0 Session Summary\\` comment has been\
          \ posted since then.\\n\\n` +\n    `**Fix:** Post a PR comment containing\
          \ \\`## \U0001F9E0 Session Summary\\` covering:\\n` +\n    `- Topics covered\
          \ and key findings\\n` +\n    `- Suggested follow-up \\`@copilot\\` prompt\
          \ for the next session\\n\\n` +\n    `_Session activation is blocked until\
          \ the Session Summary is posted._\\n`\n  );\n  await core.summary.write();\n\
          \  core.setFailed('SESSION_TIMEBOX_EXPIRED requires a \"## \U0001F9E0 Session\
          \ Summary\" comment before reactivation.');\n}\n"
    - name: "Warn on single-commit PR (REQ-7 \u2014 NEVER stop after one commit)"
