name: Agent Token Delegation
'on':
  pull_request:
    types:
    - opened
    - edited
    - reopened
    - ready_for_review
    - closed
  pull_request_review:
    types:
    - submitted
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to activate delegation for
        required: true
        type: number
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  pr-body-checkpoint-guardian:
    name: "\U0001F6E1\uFE0F Restore required PR checkboxes"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      pull-requests: write
      contents: read
    steps:
    - name: Checkout (needed for session_wrapup_autofix.py)
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: "Hardened WEC preservation \u2014 re-apply all maintainer selections"
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUM: ${{ github.event.pull_request.number }}
      run: "python3 scripts/ci/session_wrapup_autofix.py \\\n  --fix-pr-body \\\n\
        \  --pr-number \"${PR_NUM}\" \\\n  || echo \"\u26A0\uFE0F  WEC preservation\
        \ script exited non-zero (non-fatal \u2014 workflow continues)\"\n"
    - name: "Mandatory scorecard refresh \u2014 merge-readiness + follow-up prompt"
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUM: ${{ github.event.pull_request.number }}
      run: "python3 scripts/ci/session_wrapup_autofix.py \\\n  --update-pr-description\
        \ \\\n  --pr-number \"${PR_NUM}\" \\\n  || echo \"\u26A0\uFE0F  Scorecard\
        \ refresh non-zero (non-fatal \u2014 workflow continues)\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 15
  detect-checkbox:
    name: Detect COPILOT_AGENT_AUTH_ENABLED checkbox
    needs:
    - pr-body-checkpoint-guardian
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      auth_requested: ${{ steps.check.outputs.auth_requested }}
      multi_session: ${{ steps.check.outputs.multi_session }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
    - name: Parse PR body for delegation checkbox
      id: check
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_BODY: ${{ github.event.pull_request.body || '' }}
        PR_NUM: ${{ github.event.pull_request.number || github.event.inputs.pr_number
          }}
      run: "echo \"pr_number=${PR_NUM}\" >> \"$GITHUB_OUTPUT\"\n\n# On workflow_dispatch,\
        \ github.event.pull_request.body is empty.\n# Fetch the PR body via gh CLI\
        \ so checkbox detection works for\n# manually triggered delegation runs.\n\
        RESOLVED_BODY=\"${PR_BODY}\"\nif [ -z \"${RESOLVED_BODY}\" ] && [ -n \"${PR_NUM}\"\
        \ ]; then\n  RESOLVED_BODY=$(gh pr view \"${PR_NUM}\" \\\n    --repo Aries-Serpent/_codex_\
        \ \\\n    --json body --jq '.body' 2>/dev/null || true)\n  echo \"\u2139\uFE0F\
        \  PR body fetched via gh pr view (workflow_dispatch path)\"\nfi\n\n# \u2500\
        \u2500 PRIMARY: repo variable already true \u2192 always pre-authorized \u2500\
        \u2500\u2500\u2500\u2500\u2500\n# If COPILOT_AGENT_AUTH_ENABLED is already\
        \ set as a repo variable,\n# the owner's approval is permanently recorded.\
        \  No checkbox needed.\nREPO_VAR_ACTIVE=\"${{ vars.COPILOT_AGENT_AUTH_ENABLED\
        \  }}\"\nif [ \"${REPO_VAR_ACTIVE}\" = \"true\" ]; then\n  echo \"auth_requested=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"\u2705 COPILOT_AGENT_AUTH_ENABLED=true (repo\
        \ variable) \u2014 permanently pre-authorized, no checkbox required\"\n# \u2500\
        \u2500 FALLBACK: check PR body checkbox (first-time activation path) \u2500\
        \u2500\nelif printf '%s' \"${RESOLVED_BODY}\" | grep -qiE '\\-[[:space:]]*\\\
        [x\\].*COPILOT_AGENT_AUTH_ENABLED'; then\n  echo \"auth_requested=true\" \
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"\u2705 COPILOT_AGENT_AUTH_ENABLED checkbox\
        \ is checked \u2014 requesting approval\"\nelse\n  echo \"auth_requested=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"\u2139\uFE0F  COPILOT_AGENT_AUTH_ENABLED\
        \ repo var not true and checkbox not checked \u2014 nothing to do\"\nfi\n\n\
        # Detect \"Multiple Copilot Coding Agent Sessions\" checkbox (S182)\n# Default:\
        \ disabled (single-session mode). When checked, allows parallel sessions.\n\
        if printf '%s' \"${RESOLVED_BODY}\" | grep -qiE '\\-[[:space:]]*\\[x\\].*COPILOT_MULTI_SESSION';\
        \ then\n  echo \"multi_session=true\"  >> \"$GITHUB_OUTPUT\"\n  echo \"\u2705\
        \ COPILOT_MULTI_SESSION checkbox is checked \u2014 parallel sessions allowed\"\
        \nelse\n  echo \"multi_session=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"\u2139\
        \uFE0F  COPILOT_MULTI_SESSION not checked \u2014 single-session mode (default)\"\
        \nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  await-approval:
    name: "\u23F3 Auto-approved \u2014 agent is pre-authorized"
    needs: detect-checkbox
    if: needs.detect-checkbox.outputs.auth_requested == 'true' && vars.COPILOT_AGENT_AUTH_ENABLED
      != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Auto-approved
      run: "echo \"\u2705 Agent token delegation auto-approved for PR  #${{ needs.detect-checkbox.outputs.pr_number\
        \  }}\"\necho \"Copilot is permanently pre-authorized \u2014 no human approval\
        \ required.\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  trigger-auto-approval:
    name: "\u26A1 Dispatch Auto-Approve (if auth authorized)"
    needs:
    - detect-checkbox
    - await-approval
    if: needs.detect-checkbox.outputs.auth_requested == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Cache test results (Layer 3)
      uses: actions/cache@v6
      if: always()
      with:
        path: .pytest_cache/
        key: ${{ runner.os }}-pytest-${{ github.sha }}
        restore-keys: '${{ runner.os }}-pytest-

          '
    - name: Require wec:auto-approve label
      id: label_check
      if: ${{ needs.detect-checkbox.outputs.pr_number != '' }}
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ needs.detect-checkbox.outputs.pr_number }}
      run: 'python3 scripts/ci/require_wec_auto_approve.py --pr-number "$PR_NUMBER"
        --repo "$REPO"

        '
    - name: Dispatch auto-approve-workflows.yml
      if: ${{ needs.detect-checkbox.outputs.auth_requested == 'true' && needs.detect-checkbox.outputs.pr_number
        != '' && steps.label_check.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        PR_NUMBER: ${{ needs.detect-checkbox.outputs.pr_number }}
      run: 'gh workflow run auto-approve-workflows.yml \

        -f approval_source=agent-auth-delegation \

        -f approval_intent=auto_approve_action_required \

        -f target_pr="$PR_NUMBER" \

        -f approval_reason="copilot-auth-enabled"

        '
    timeout-minutes: 30
  cognitive-preflight:
    name: "\U0001F9E0 Cognitive Pre-flight Check"
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 50
    - name: Download pending session requirements (if any)
      id: session_reqs
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "PR_NUMBER=\"${{ github.event.pull_request.number || github.event.issue.number\
        \  }}\"\nif [ -z \"$PR_NUMBER\" ]; then\n  echo \"has_requirements=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n# Try to download the latest session-requirements\
        \ artifact for this PR\ngh run download \\\n  --repo \"${{ github.repository\
        \  }}\" \\\n  --name \"session-requirements-${PR_NUMBER}\" \\\n  --dir /tmp/session-req-download\
        \ \\\n  2>/dev/null || true\nif [ -f \"/tmp/session-req-download/session_requirements.md\"\
        \ ]; then\n  echo \"has_requirements=true\" >> \"$GITHUB_OUTPUT\"\n  echo\
        \ \"requirements_path=/tmp/session-req-download/session_requirements.md\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"\U0001F4CB Session requirements found \u2014\
        \ will inject into preflight checklist\"\nelse\n  echo \"has_requirements=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"\u2139\uFE0F No pending session requirements\
        \ found\"\nfi\n"
    - name: 'REQ-11: Integration-branch direct-session guard'
      if: 'github.event_name == ''pull_request'' || github.event_name == ''pull_request_review''

        '
      uses: actions/github-script@v9
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "// Branches that are staging gates \u2014 never the HEAD of an agent\
          \ session.\nconst INTEGRATION_BRANCHES = ['0D_base_'];\nconst PROMOTION_TARGETS\
          \ = ['main', 'master'];\nconst pr = context.payload.pull_request;\nif (!pr)\
          \ return;\n\nconst head = pr.head.ref;\nconst base = pr.base.ref;\n\nif\
          \ (!INTEGRATION_BRANCHES.includes(head)) {\n  core.info(`REQ-11 PASS: head='${head}'\
          \ is not an integration branch.`);\n  return;\n}\n\n// Exception: this is\
          \ a promotion PR (integration_branch \u2192 main/master).\n// Promotion\
          \ merges are the intended flow; REQ-11 only blocks direct\n// coding sessions,\
          \ not the staging-gate \u2192 main promotion PR.\nif (PROMOTION_TARGETS.includes(base))\
          \ {\n  core.info(`REQ-11 PASS: '${head}' \u2192 '${base}' is a promotion\
          \ PR. Promotion merges are allowed.`);\n  return;\n}\n\n// HEAD is an integration\
          \ branch opened against a non-promotion target\n// \u2014 build redirect\
          \ comment.\nconst runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;\n\
          const ts = new Date().toISOString();\nconst MARKER = '<!-- req11-integration-branch-guard\
          \ -->';\nconst body = [\n  MARKER,\n  `## \U0001F6AB REQ-11: Direct Session\
          \ on Integration Branch Blocked`,\n  ``,\n  `**Branch \\`${head}\\` is a\
          \ staging integration branch** \u2014 Copilot Coding Agent sessions`,\n\
          \  `must never run directly on it.`,\n  ``,\n  `### Why`,\n  `\\`${head}\\\
          ` is the **staging gate** that accumulates reviewed sub-PR work before`,\n\
          \  `promotion to \\`main\\`.  Running a session directly on \\`${head}\\\
          ` bypasses the`,\n  `sub-PR review cycle and risks polluting the staging\
          \ branch with unreviewed changes.`,\n  ``,\n  `### Architecture`,\n  `\\\
          `\\`\\``,\n  `copilot/session-*  \u2500\u2500\u25BA  ${head}  \u2500\u2500\
          \u25BA  main`,\n  `(your work here)        (staging gate)   (promotion PR)`,\n\
          \  `\\`\\`\\``,\n  ``,\n  `### \u2705 How to Start a New Agent Session`,\n\
          \  ``,\n  `**Option A \u2014 Automated (recommended):** Trigger the session-chain\
          \ workflow:`,\n  `\\`\\`\\`bash`,\n  `gh workflow run copilot-session-chain.yml\
          \ \\\\`,\n  `  -f source_branch=${head} \\\\`,\n  `  -f session_title=\"\
          Describe your task here\" \\\\`,\n  `  -f auto_start=true`,\n  `\\`\\`\\\
          ``,\n  `This automatically creates a new \\`copilot/session-*\\` branch,\
          \ opens a sub-PR`,\n  `targeting \\`${head}\\`, and posts the \\`@copilot\\\
          ` trigger comment.`,\n  ``,\n  `**Option B \u2014 Manual:**`,\n  `1. Create\
          \ a new branch from \\`${head}\\`:`,\n  `   \\`\\`\\`bash`,\n  `   git fetch\
          \ origin ${head}`,\n  `   git checkout -b copilot/session-$(date +%Y%m%d-%H%M%S)\
          \ origin/${head}`,\n  `   git push origin HEAD`,\n  `   \\`\\`\\``,\n  `2.\
          \ Open a PR targeting \\`${head}\\` (NOT \\`main\\`).`,\n  `3. Post \\`@copilot+claude-haiku-4.5\
          \ /plan\\` on the new PR.`,\n  ``,\n  `**Copy-paste Copilot prompt for a\
          \ new session:**`,\n  `\\`\\`\\``,\n  `@copilot+claude-haiku-4.5 /plan`,\n\
          \  ``,\n  `Open a new sub-PR targeting \\`${head}\\` for this agent session.`,\n\
          \  `Architecture: sub-PR \u2192 ${head} \u2192 main.`,\n  `Do NOT commit\
          \ directly to \\`${head}\\`.`,\n  `Delegate independent subtasks to Custom\
          \ Agents (e.g. ci-auto-healer-agent, unified-coverage-agent) using the task\
          \ tool to work in parallel.`,\n  `\\`\\`\\``,\n  ``,\n  `---`,\n  `_Auto-posted\
          \ by \\`cognitive-preflight\\` REQ-11 gate at ${ts}_`,\n  `_[View run](${runUrl})\
          \ \xB7 [INTEGRATION_BRANCH_MODEL.md](.codex/docs/INTEGRATION_BRANCH_MODEL.md)_`,\n\
          ].join('\\n');\n\n// Upsert: replace any previous REQ-11 guard comment.\n\
          const { data: comments } = await github.rest.issues.listComments({\n  owner:\
          \ context.repo.owner,\n  repo:  context.repo.repo,\n  issue_number: pr.number,\n\
          \  per_page: 100,\n});\nconst existing = comments.find(c => (c.body || '').includes(MARKER));\n\
          if (existing) {\n  await github.rest.issues.updateComment({\n    owner:\
          \      context.repo.owner,\n    repo:       context.repo.repo,\n    comment_id:\
          \ existing.id,\n    body,\n  });\n} else {\n  await github.rest.issues.createComment({\n\
          \    owner:        context.repo.owner,\n    repo:         context.repo.repo,\n\
          \    issue_number: pr.number,\n    body,\n  });\n}\n\nawait core.summary\n\
          \  .addHeading('REQ-11: Integration-Branch Guard', 3)\n  .addRaw(\n    `\\\
          n\U0001F6AB FAIL \u2014 \\`${head}\\` is an integration/staging branch.\\\
          n` +\n    `Copilot sessions must use a sub-PR.  See comment on PR  #${pr.number}\
          \ for instructions.\\n`\n  )\n  .write();\n\ncore.setFailed(\n  `REQ-11\
          \ FAIL: Branch '${head}' is the staging integration branch. ` +\n  `Copilot\
          \ sessions must NOT run directly on '${head}'. ` +\n  `Create a sub-PR branch\
          \ targeting '${head}' instead. ` +\n  `See the REQ-11 comment on this PR\
          \ for step-by-step instructions, ` +\n  `or run: gh workflow run copilot-session-chain.yml\
          \ -f source_branch=${head}`\n);\n"
    - name: Post Mandatory Agent Checklist to PR
      uses: actions/github-script@v9
      if: 'github.event_name == ''pull_request'' || github.event_name == ''pull_request_review''

        '
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const fs = require('fs');\nconst sha = (context.sha || 'unknown').slice(0,\
          \ 7);\nconst MARKER = 'COGNITIVE PRE-FLIGHT CHECKLIST';\n\n// Upsert: find\
          \ existing comment by stable anchor marker\nconst { data: comments } = await\
          \ github.rest.issues.listComments({\n  owner: context.repo.owner,\n  repo:\
          \ context.repo.repo,\n  issue_number: context.issue.number,\n  per_page:\
          \ 100,\n});\n\n// Scan for existing priority directive to surface inline\n\
          const directive = comments.find(c =>\n  c.body.includes('Priority for this\
          \ session:')\n);\nconst priorityLine = directive\n  ? (() => {\n      const\
          \ m = directive.body.match(/Priority for this session:\\s*(.+)/);\n    \
          \  return m\n        ? `\\n> \u26A1 **ACTIVE SESSION PRIORITY:** ${m[1].trim()}\
          \ _(set by @${directive.user.login})_\\n`\n        : '';\n    })()\n  :\
          \ '\\n> \u2139\uFE0F No session priority directive found. Post a comment\
          \ with `Priority for this session: X` to set one.\\n';\n\nconst UPSERT_MARKER\
          \ = '<!-- cognitive-preflight-checklist -->';\n\n// Inject pending session\
          \ requirements (from comment-review-gate) at top of checklist.\n// Read\
          \ actual file content \u2014 the session_reqs step downloads to a known\
          \ path.\nconst sessionReqsHasReq = '${{ steps.session_reqs.outputs.has_requirements\
          \  }}' === 'true';\nlet sessionReqsContent = '';\nif (sessionReqsHasReq)\
          \ {\n  try {\n    sessionReqsContent = fs.readFileSync(\n      '/tmp/session-req-download/session_requirements.md',\
          \ 'utf8'\n    ).trim();\n  } catch (e) {\n    core.warning(`Could not read\
          \ session requirements file: ${e.message}`);\n  }\n}\nconst pendingRequirementsBlock\
          \ = sessionReqsHasReq && sessionReqsContent\n  ? [\n      '',\n      '---',\n\
          \      '',\n      '### \U0001F4CB Pending Comment Requirements (Pre-pended\
          \ from Comment Review Gate)',\n      '',\n      '> **These comments were\
          \ unaddressed on the previous scan and are injected here**',\n      '> **as\
          \ session requirements. Address each one BEFORE making file changes.**',\n\
          \      '',\n      sessionReqsContent,\n      '',\n      '---',\n      '',\n\
          \    ].join('\\n')\n  : '';\n\nconst body = [\n  UPSERT_MARKER,\n  `## \U0001F9E0\
          \ ${MARKER} \u2014 SHA: ${sha}`,\n  '',\n  '> **Auto-posted by `cognitive-preflight`\
          \ job BEFORE session activation.**',\n  '> Treat this as active instruction\
          \ \u2014 NOT background memory. This is a CI gate.',\n  priorityLine,\n\
          \  pendingRequirementsBlock,\n  '---',\n  '',\n  '### \u2705 Agent Pre-flight\
          \ Checklist',\n  '',\n  '> **\u26A0\uFE0F MANDATORY: Complete items 0a and\
          \ 0b BEFORE any file changes.**',\n  '',\n  '- [ ] **0a. \U0001F916 Review\
          \ ALL bot-posted comments** \u2014 fetch and address every open thread from\
          \ `copilot-pull-request-reviewer[bot]`, `github-advanced-security[bot]`,\
          \ `github-code-quality[bot]`, `github-actions[bot]` on this PR _(per \xA7\
          0 of CODEBASE_AGENCY_POLICY.md)_',\n  '- [ ] **0b. \u274C Fix ALL failing\
          \ CI checks** \u2014 review every failing/warning check in the latest workflow\
          \ runs; fix all code-fixable failures before pushing new commits _(per \xA7\
          0 of CODEBASE_AGENCY_POLICY.md)_',\n  '- [ ] **0c. \U0001F500 REQ-10: Check\
          \ branch rebase status** \u2014 if a `BRANCH_REBASE_REQUIRED` comment is\
          \ present on this PR, rebase BEFORE any other work: `git fetch origin &&\
          \ git rebase origin/<base> && git push --force-with-lease` _(CI hard block\
          \ if unresolved)_',\n  '- [ ] **1.** Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\
          \ in your commit _(CI will fail if not touched)_',\n  '- [ ] **2.** Review\
          \ CI failure patterns in the Actions job summary (Actions tab \u2192 this\
          \ run \u2192 Job Summary)',\n  '- [ ] **3.** Confirm `.gitignore` allows\
          \ `.codex/agent_auth_session.json` _(CI will fail if blocked)_',\n  '- [\
          \ ] **4.** Read the `Priority for this session: X` comment on this PR \u2014\
          \ that is your **PRIMARY directive**',\n  '- [ ] **5.** Post your Phase\
          \ execution plan as a PR comment BEFORE making any file changes',\n  '-\
          \ [ ] **6.** Follow `.codex/CODEBASE_AGENCY_POLICY.md` at all times \u2014\
          \ violations must be self-corrected',\n  '- [ ] **7. REQ-13 (HARD STOP):**\
          \ Address ALL comments from `@mbaetiong` and ALL bot-posted comments (copilot-pull-request-reviewer,\
          \ github-actions, github-advanced-security, github-code-quality) **before**\
          \ committing any new changes. CI gate `workflow-execution-gate.yml` enforces\
          \ this.',\n  '',\n  '### \u2699\uFE0F Policy Quick Reference',\n  '',\n\
          \  '| Rule | Requirement |',\n  '|------|-------------|',\n  '| **Pre-session**\
          \ | Review ALL bot comments + fix ALL failing CI checks FIRST |',\n  '|\
          \ **REQ-13** | Reply to ALL `mbaetiong` + critical-bot comments before new\
          \ commits (enforced by `workflow-execution-gate.yml`) |',\n  '| Execution trigger\
          \ | Within 60 seconds of reading a clear task |',\n  '| Self-review | Minimum\
          \ 5 passes before session close |',\n  '| Deferral | NEVER without: documented\
          \ blocker + 5 attempts + follow-up `@copilot` comment |',\n  '| Terminology\
          \ | pre-commit/commit cycles \u2014 NOT days/weeks |',\n  '| Follow-up |\
          \ Post `@copilot ...` PR comment if session ends with incomplete work |',\n\
          \  '| **PR requirement** | Sessions no longer create PRs by default (GitHub\
          \ change 2026-03). **Always work on a pre-existing PR branch.** If none\
          \ exists, run `gh pr create --base 0D_base_` before starting work. Include\
          \ \"open a pull request\" in any `@copilot` prompt posted on an issue. |',\n\
          \  '',\n  '### \U0001F517 Policy References',\n  '',\n  '| File | Purpose\
          \ |',\n  '|------|---------|',\n  '| `.codex/CODEBASE_AGENCY_POLICY.md`\
          \ | Master policy (\xA70 pre-session review) |',\n  '| `.codex/patterns/ci_failure_patterns.yaml`\
          \ | CI pattern library (25 patterns) |',\n  '| `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\
          \ | Session accountability |',\n  '',\n  '---',\n  `_Auto-posted: ${new\
          \ Date().toISOString()} | cognitive-preflight gate | WF-001_`,\n  `_Last\
          \ updated for SHA: \\`${sha}\\` | ${new Date().toISOString()}_`,\n  '',\n\
          \  '---',\n  `_[\U0001F517 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,\n\
          ].join('\\n');\n\n// Paginated upsert: search ALL pages so PRs with >100\
          \ comments are handled.\nlet existing = null;\nlet page = 1;\nwhile (!existing\
          \ && page <= 20) {\n  const { data: batch } = await github.rest.issues.listComments({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    issue_number:\
          \ context.issue.number,\n    per_page: 100,\n    page,\n  });\n  existing\
          \ = batch.find(c => c.body && c.body.includes(UPSERT_MARKER));\n  if (existing\
          \ || batch.length < 100) break;\n  page++;\n}\nif (existing) {\n  await\
          \ github.rest.issues.updateComment({\n    owner: context.repo.owner,\n \
          \   repo: context.repo.repo,\n    comment_id: existing.id,\n    body,\n\
          \  });\n  console.log(`\u2705 Checklist updated in-place for SHA ${sha}`);\n\
          } else {\n  await github.rest.issues.createComment({\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    issue_number: context.issue.number,\n\
          \    body,\n  });\n  console.log(`\u2705 Checklist posted for SHA ${sha}`);\n\
          }\n"
    - name: Surface Session-Type Directives to Checklist
      uses: actions/github-script@v9
      if: 'github.event_name == ''pull_request'' || github.event_name == ''pull_request_review''

        '
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const sha    = (context.sha || 'unknown').slice(0, 7);\nconst MARKER\
          \ = 'COGNITIVE SESSION-TYPE DIRECTIVE';\n\nconst { data: comments } = await\
          \ github.rest.issues.listComments({\n  owner: context.repo.owner,\n  repo:\
          \ context.repo.repo,\n  issue_number: context.issue.number,\n  per_page:\
          \ 100,\n});\n\n// Detect session signals from session-watchdog.yml markers\n\
          const hasExploration   = comments.some(c => c.body.includes('SESSION_TYPE_EXPLORATION'));\n\
          const doNotAutoProceed = comments.some(c => /do\\s+not\\s+auto.?proceed/i.test(c.body));\n\
          \n// Detect active (non-expired) timebox\nlet activeTimebox = null;\nconst\
          \ now = new Date();\nfor (const c of comments.filter(c => c.body.includes('SESSION_TIMEBOX_START')))\
          \ {\n  const m = c.body.match(/\\*\\*Expires:\\*\\*\\s*(\\S+)/);\n  if (m)\
          \ {\n    const exp = new Date(m[1]);\n    if (!isNaN(exp.getTime()) && now\
          \ < exp) {\n      const minsLeft = Math.round((exp - now) / 60000);\n  \
          \    activeTimebox = { expiresISO: m[1], minsLeft };\n    }\n  }\n}\n\n\
          // Only post if there is something to surface\nif (!hasExploration && !activeTimebox\
          \ && !doNotAutoProceed) {\n  console.log('No session-type directives detected\
          \ \u2014 skipping injection.');\n  return;\n}\n\nconst UPSERT_MARKER_WF002\
          \ = '<!-- cognitive-preflight-session-directives -->';\nconst lines = [\n\
          \  UPSERT_MARKER_WF002,\n  `## \U0001F3AF ${MARKER} \u2014 SHA: ${sha}`,\n\
          \  '',\n  '> **Auto-posted by `cognitive-preflight` \u2014 session-type\
          \ specific enforcement rules.**',\n  '> These items are IN ADDITION to the\
          \ standard Pre-flight Checklist above.',\n  '',\n];\n\nif (activeTimebox)\
          \ {\n  lines.push(`> \u23F1 **ACTIVE TIMEBOX: ~${activeTimebox.minsLeft}\
          \ minutes remaining** (expires \\`${activeTimebox.expiresISO}\\`)`);\n \
          \ lines.push('> Complete your work and post `## \U0001F9E0 Session Summary`\
          \ BEFORE this expires.');\n  lines.push('');\n}\n\nif (hasExploration) {\n\
          \  lines.push('### \U0001F50D Exploration Session Active \u2014 [Session\
          \ Continuity Policy](.github/docs/SessionContinuityPolicy.md) applies:');\n\
          \  lines.push('');\n  lines.push('- [ ] **A.** After each agenda item: post\
          \ PR comment with findings; ask \"proceed or go deeper?\"');\n  lines.push('-\
          \ [ ] **B.** Every ~10 minutes: post an incremental progress summary as\
          \ a PR comment');\n  lines.push('- [ ] **C.** Treat silence from human as\
          \ PAUSE \u2014 do NOT auto-proceed to next item');\n  lines.push('- [ ]\
          \ **D.** On session close: post `## \U0001F9E0 Session Summary` with topics,\
          \ key findings, and a follow-up `@copilot` prompt');\n  lines.push('');\n\
          }\n\nif (doNotAutoProceed) {\n  lines.push('### \U0001F6D1 \"Do NOT Auto-Proceed\"\
          \ Directive Active:');\n  lines.push('');\n  lines.push('- [ ] After each\
          \ agenda item: **STOP.** Post findings. Wait for explicit human \"continue\"\
          \ reply.');\n  lines.push('- [ ] Do NOT start the next item without an explicit\
          \ human response.');\n  lines.push('');\n}\n\nlines.push('_auto-posted by\
          \ cognitive-preflight | WF-002 | [SessionContinuityPolicy.md](.github/docs/SessionContinuityPolicy.md)_');\n\
          lines.push('');\nlines.push('---');\nlines.push(`_[\U0001F517 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`);\n\
          \n// Upsert: update existing or create new\nconst directiveBody = lines.join('\\\
          n');\nconst existingDirective = comments.find(c => c.body && c.body.includes(UPSERT_MARKER_WF002));\n\
          if (existingDirective) {\n  await github.rest.issues.updateComment({\n \
          \   owner: context.repo.owner,\n    repo: context.repo.repo,\n    comment_id:\
          \ existingDirective.id,\n    body: directiveBody,\n  });\n} else {\n  await\
          \ github.rest.issues.createComment({\n    owner: context.repo.owner,\n \
          \   repo: context.repo.repo,\n    issue_number: context.issue.number,\n\
          \    body: directiveBody,\n  });\n}\nconsole.log('Session-type directives\
          \ surfaced in preflight comment.');\n"
    - name: "Parse CI Failure Patterns \u2192 Job Summary"
      run: "# shellcheck disable=SC2129\nPATTERN_FILE=\".codex/patterns/ci_failure_patterns.yaml\"\
        \n\necho \"## \U0001F9E0 Active CI Failure Patterns\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\nif [ ! -f \"$PATTERN_FILE\" ];\
        \ then\n  echo \"\u26A0\uFE0F Pattern file not found: \\`${PATTERN_FILE}\\\
        `\" >> \"$GITHUB_STEP_SUMMARY\"\n  echo \"Agent should create this file from\
        \ session learnings.\" >> \"$GITHUB_STEP_SUMMARY\"\n  echo \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n  echo \"**Source:** \\`${PATTERN_FILE}\\` (missing)\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n  exit 0\nfi\n\necho \"**Source:** \\`${PATTERN_FILE}\\`\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\npython3 - \"$PATTERN_FILE\" \"\
        $GITHUB_STEP_SUMMARY\" << 'PYEOF'\nimport re, sys\n\npattern_file = sys.argv[1]\n\
        summary_file = sys.argv[2]\n\nwith open(pattern_file, \"r\", encoding=\"utf-8\"\
        ) as f:\n    content = f.read()\n\nblocks = re.findall(r'```yaml\\n(.*?)```',\
        \ content, re.DOTALL)\n\nrows = []\nfor block in blocks:\n    pid_m   = re.search(r'^pattern_id:\\\
        s*(.+)', block, re.MULTILINE)\n    name_m  = re.search(r'^name:\\s*\"?(.+?)\"\
        ?\\s*$', block, re.MULTILINE)\n    pri_m   = re.search(r'^priority:\\s*(\\\
        d+)', block, re.MULTILINE)\n    sev_m   = re.search(r'^severity:\\s*(\\w+)',\
        \ block, re.MULTILINE)\n    batch_m = re.search(r'batch_fix[_\\s]*(?:potential|enabled)?:\\\
        s*(true)', block, re.IGNORECASE)\n    notes_m = re.search(r'cognitive_notes:\\\
        s*\\|(.*?)(?=\\n\\w|\\Z)', block, re.DOTALL)\n\n    if not pid_m:\n      \
        \  continue\n\n    pid   = pid_m.group(1).strip()\n    name  = name_m.group(1).strip()\
        \ if name_m else \"\u2014\"\n    pri   = f\"P{pri_m.group(1).strip()}\" if\
        \ pri_m else \"?\"\n    sev   = sev_m.group(1).strip() if sev_m else \"?\"\
        \n    batch = \"\u2705\" if batch_m else \"\"\n    note  = \"\"\n    if notes_m:\n\
        \        lines = [l.strip() for l in notes_m.group(1).strip().split(\"\\n\"\
        ) if l.strip()]\n        note  = lines[0] if lines else \"\"\n\n    rows.append(f\"\
        | `{pid}` | {name} | {pri} | {sev} | {batch} | {note} |\")\n\nwith open(summary_file,\
        \ \"a\", encoding=\"utf-8\") as out:\n    if rows:\n        out.write(\"|\
        \ Pattern ID | Name | Priority | Severity | Batch Fix | Key Insight |\\n\"\
        )\n        out.write(\"|-----------|------|----------|----------|:---------:|-------------|\\\
        n\")\n        for row in rows:\n            out.write(row + \"\\n\")\n   \
        \     out.write(f\"\\n**Total patterns loaded:** {len(rows)}\\n\\n\")\n  \
        \      p1 = [r for r in rows if \"| P1 |\" in r]\n        if p1:\n       \
        \     out.write(f\"\u26A0\uFE0F **{len(p1)} Priority-1 (blocking) pattern(s)\
        \ active \u2014 review before coding.**\\n\\n\")\n    else:\n        out.write(\"\
        No parseable patterns found in pattern file.\\n\\n\")\nPYEOF\n"
    - name: Verify .gitignore allows .codex/agent_auth_session.json
      id: gitignore_check
      run: "TARGET=\".codex/agent_auth_session.json\"\nGITIGNORE=\".gitignore\"\n\n\
        echo \"### \U0001F50D .gitignore Check: \\`${TARGET}\\`\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\nif [ ! -f \"$GITIGNORE\" ]; then\n\
        \  echo \"\u26A0\uFE0F No .gitignore found \u2014 \\`${TARGET}\\` is implicitly\
        \ allowed.\" >> \"$GITHUB_STEP_SUMMARY\"\n  exit 0\nfi\n\nif git check-ignore\
        \ -q \"$TARGET\" 2>/dev/null; then\n  NEGATION=$(grep -E \"^!.*agent_auth_session\"\
        \ \"$GITIGNORE\" 2>/dev/null || true)\n  if [ -n \"$NEGATION\" ]; then\n \
        \   echo \"\u2705 **PASS** \u2014 \\`${TARGET}\\` is explicitly un-ignored\
        \ via negation: \\`${NEGATION}\\`\" >> \"$GITHUB_STEP_SUMMARY\"\n  else\n\
        \    echo \"\u274C **FAIL** \u2014 \\`${TARGET}\\` is BLOCKED by .gitignore\
        \ with no negation rule.\" >> \"$GITHUB_STEP_SUMMARY\"\n    echo \"\" >> \"\
        $GITHUB_STEP_SUMMARY\"\n    echo \"**Fix:** Add to \\`.gitignore\\`:\" >>\
        \ \"$GITHUB_STEP_SUMMARY\"\n    echo '```' >> \"$GITHUB_STEP_SUMMARY\"\n \
        \   echo \"!.codex/agent_auth_session.json\" >> \"$GITHUB_STEP_SUMMARY\"\n\
        \    echo '```' >> \"$GITHUB_STEP_SUMMARY\"\n    exit 1\n  fi\nelse\n  echo\
        \ \"\u2705 **PASS** \u2014 \\`${TARGET}\\` is NOT ignored by .gitignore.\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: Detect empty commits in PR
      id: empty_commit_check
      continue-on-error: true
      env:
        BASE_REF: ${{ github.base_ref }}
      run: "echo \"### \U0001F50D Empty Commit Check (REQ-3b)\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n\n# Ensure the base ref is available locally so git log does not fail silently\n\
        if ! git fetch --no-tags origin \"$BASE_REF\" 2>/dev/null; then\necho \"\u26A0\
        \uFE0F  **WARN** \u2014 Unable to fetch base ref origin/$BASE_REF; skipping\
        \ empty-commit check.\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"::warning::Empty-commit\
        \ check skipped \u2014 could not fetch origin/$BASE_REF.\"\nexit 0\nfi\n\n\
        # Obtain commit list relative to the base ref; if this fails, emit WARN instead\
        \ of a false PASS\nCOMMITS=$(git log --format=\"%H %an: %s\" \"origin/$BASE_REF\"\
        ..HEAD 2>/dev/null) || {\necho \"\u26A0\uFE0F  **WARN** \u2014 git log failed\
        \ for range origin/$BASE_REF..HEAD; skipping empty-commit check.\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"::warning::Empty-commit check skipped \u2014 git log failed for origin/$BASE_REF..HEAD.\"\
        \nexit 0\n}\n\n# Count commits with no file-tree changes\nEMPTY_COMMITS=$(printf\
        \ '%s\\n' \"$COMMITS\" | while IFS= read -r line; do\n[ -z \"$line\" ] &&\
        \ continue\nSHA=$(echo \"$line\" | awk '{print $1}')\n# Capture diff-tree\
        \ output first; if the command fails (e.g., shallow\n# checkout missing objects)\
        \ skip this commit rather than treating it\n# as empty, which would be a false-positive\
        \ empty-commit warning.\nCHANGES_OUTPUT=$(git diff-tree --no-commit-id -r\
        \ --name-only \"$SHA\" 2>/dev/null) || {\n  echo \"::warning::Empty-commit\
        \ check: git diff-tree failed for $SHA; skipping.\" >&2\n  continue\n}\nCHANGES=$(printf\
        \ '%s\\n' \"$CHANGES_OUTPUT\" | grep -c . || true)\n# grep -c . counts non-empty\
        \ lines (exit 1 when 0 matches is silenced\n# by || true); this correctly\
        \ handles the empty-output case without\n# needing pipefail or a separate\
        \ wc call.\n[ \"$CHANGES\" -eq 0 ] && echo \"$line\"\ndone)\n\nif [ -z \"\
        $EMPTY_COMMITS\" ]; then\necho \"\u2705 **PASS** \u2014 No empty commits detected\
        \ in this PR.\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\nCOUNT=$(echo \"$EMPTY_COMMITS\"\
        \ | grep -c . || true)\necho \"\u26A0\uFE0F  **WARN** \u2014 ${COUNT} empty\
        \ commit(s) detected (no file changes):\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ '```' >> \"$GITHUB_STEP_SUMMARY\"\necho \"$EMPTY_COMMITS\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho '```' >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"**Impact:** Empty commits will appear as AGENT-COMMIT in \\`branch-divergence-monitor.yml\\\
        `\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"and will be auto-absorbed by the fast-forward\
        \ sync. No action required unless\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"these\
        \ commits were unintentional \u2014 if so, use \\`git rebase -i\\` to drop\
        \ them\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"**before** pushing to remote\
        \ (after push, force-push is required to remove).\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"::warning::${COUNT} empty commit(s) found in PR \u2014 will be AGENT-COMMIT\
        \ in divergence monitor (auto-absorbed)\"\nfi\n"
    - name: Verify Accountability Report updated in last commit
      id: accountability_check
      env:
        GITHUB_ACTOR: ${{ github.actor }}
      run: "REPORT=\"docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md\"\n\necho\
        \ \"### \U0001F50D Accountability Report Check\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\n# Dependabot bots don't maintain\
        \ the accountability report\nACTOR=\"$GITHUB_ACTOR\"\nif [[ \"${ACTOR}\" ==\
        \ \"dependabot[bot]\" || \"${ACTOR}\" == \"dependabot-preview[bot]\" ]]; then\n\
        echo \"\u23ED\uFE0F  **SKIP** \u2014 Actor is \\`${ACTOR}\\` (bot); accountability\
        \ report not required.\" >> \"$GITHUB_STEP_SUMMARY\"\nexit 0\nfi\n\nif [ !\
        \ -f \"$REPORT\" ]; then\necho \"\u274C **FAIL** \u2014 \\`${REPORT}\\` does\
        \ not exist.\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"**Fix:** Create this file\
        \ and commit it before activating a session.\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nexit 1\nfi\n\n# Skip past consecutive infrastructure / [skip ci] commits\
        \ authored\n# by github-actions[bot] (auto-merge, manifest refresh, follow-up\n\
        # prompt regeneration) \u2014 they should never be expected to touch\n# the\
        \ accountability report.  S178: prevents REQ-4 from firing on\n# branches\
        \ where branch-rebase-gate auto-merged main on top of an\n# agent commit that\
        \ DID update the report.\nMAX_LOOKBACK=10\nBASE_REF=\"HEAD~1\"\nSKIPPED=0\n\
        while [ \"$SKIPPED\" -lt \"$MAX_LOOKBACK\" ]; do\nCANDIDATE_IDX=$((SKIPPED\
        \ + 1))\nCANDIDATE=\"HEAD~$((CANDIDATE_IDX - 1))\"\n# Resolve the candidate\
        \ commit metadata. If git rev-parse fails\n# (shallow clone limit reached),\
        \ break out and use whatever\n# BASE_REF we have so far \u2014 never fall\
        \ through silently.\nif ! git rev-parse --verify --quiet \"$CANDIDATE^{commit}\"\
        \ >/dev/null 2>&1; then\n  break\nfi\nCAUTHOR=$(git log -1 --format='%an'\
        \ \"$CANDIDATE\" 2>/dev/null || echo \"\")\nCSUBJECT=$(git log -1 --format='%s'\
        \ \"$CANDIDATE\" 2>/dev/null || echo \"\")\ncase \"$CAUTHOR\" in\n  \"github-actions[bot]\"\
        |\"github-actions\"|\"dependabot[bot]\"|\"dependabot-preview[bot]\")\n   \
        \ IS_INFRA_AUTHOR=1 ;;\n  *) IS_INFRA_AUTHOR=0 ;;\nesac\nIS_INFRA_SUBJECT=0\n\
        case \"$CSUBJECT\" in\n  *\"[skip ci]\"*|\"chore: auto-merge\"*|\"chore(manifest):\"\
        *|\"chore: Generate follow-up\"*|\"chore: generate follow-up\"*)\n    IS_INFRA_SUBJECT=1\
        \ ;;\nesac\nif [ \"$IS_INFRA_AUTHOR\" = \"1\" ] || [ \"$IS_INFRA_SUBJECT\"\
        \ = \"1\" ]; then\n  SKIPPED=$((SKIPPED + 1))\n  continue\nfi\nBASE_REF=\"\
        HEAD~$((SKIPPED + 1))\"\nbreak\ndone\n\nif git diff --name-only \"$BASE_REF\"\
        \ HEAD 2>/dev/null | grep -qF \"$REPORT\"; then\nif [ \"$SKIPPED\" -gt 0 ];\
        \ then\n  echo \"\u2705 **PASS** \u2014 \\`${REPORT}\\` was updated in the\
        \ last agent commit (skipped ${SKIPPED} infra commit(s) on top).\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nelse\n  echo \"\u2705 **PASS** \u2014 \\`${REPORT}\\` was updated in the\
        \ last commit.\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\nelse\nLAST_TOUCH=$(git log\
        \ -1 --format=\"%ar\" -- \"$REPORT\" 2>/dev/null || echo \"unknown\")\necho\
        \ \"\u274C **FAIL** \u2014 \\`${REPORT}\\` was NOT updated in the last commit.\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"Last modified: ${LAST_TOUCH}\" >> \"\
        $GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"**Fix:**\
        \ Update the accountability report in your next commit before session activation.\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nexit 1\nfi\n"
    - name: Verify CHANGELOG.md updated in last commit
      id: changelog_check
      env:
        GITHUB_ACTOR: ${{ github.actor }}
      run: "CHANGELOG=\"CHANGELOG.md\"\n\necho \"### \U0001F50D CHANGELOG.md Check\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\n#\
        \ Dependabot bots don't maintain the CHANGELOG \u2014 same exemption as REQ-4.\n\
        ACTOR=\"$GITHUB_ACTOR\"\nif [[ \"${ACTOR}\" == \"dependabot[bot]\" || \"${ACTOR}\"\
        \ == \"dependabot-preview[bot]\" ]]; then\necho \"\u23ED\uFE0F  **SKIP** \u2014\
        \ Actor is \\`${ACTOR}\\` (bot); CHANGELOG.md not required.\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nexit 0\nfi\n\nif [ ! -f \"$CHANGELOG\" ]; then\necho \"\u26A0\uFE0F  **SKIP**\
        \ \u2014 \\`${CHANGELOG}\\` does not exist in repo root.\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nexit 0\nfi\n\n# Skip past consecutive infrastructure / [skip ci] commits\
        \ before\n# checking REQ-5 \u2014 same logic as REQ-4 above.\nMAX_LOOKBACK=10\n\
        BASE_REF=\"HEAD~1\"\nSKIPPED=0\nwhile [ \"$SKIPPED\" -lt \"$MAX_LOOKBACK\"\
        \ ]; do\nCANDIDATE_IDX=$((SKIPPED + 1))\nCANDIDATE=\"HEAD~$((CANDIDATE_IDX\
        \ - 1))\"\nif ! git rev-parse --verify --quiet \"$CANDIDATE^{commit}\" >/dev/null\
        \ 2>&1; then\n  break\nfi\nCAUTHOR=$(git log -1 --format='%an' \"$CANDIDATE\"\
        \ 2>/dev/null || echo \"\")\nCSUBJECT=$(git log -1 --format='%s' \"$CANDIDATE\"\
        \ 2>/dev/null || echo \"\")\ncase \"$CAUTHOR\" in\n  \"github-actions[bot]\"\
        |\"github-actions\"|\"dependabot[bot]\"|\"dependabot-preview[bot]\")\n   \
        \ IS_INFRA_AUTHOR=1 ;;\n  *) IS_INFRA_AUTHOR=0 ;;\nesac\nIS_INFRA_SUBJECT=0\n\
        case \"$CSUBJECT\" in\n  *\"[skip ci]\"*|\"chore: auto-merge\"*|\"chore(manifest):\"\
        *|\"chore: Generate follow-up\"*|\"chore: generate follow-up\"*)\n    IS_INFRA_SUBJECT=1\
        \ ;;\nesac\nif [ \"$IS_INFRA_AUTHOR\" = \"1\" ] || [ \"$IS_INFRA_SUBJECT\"\
        \ = \"1\" ]; then\n  SKIPPED=$((SKIPPED + 1))\n  continue\nfi\nBASE_REF=\"\
        HEAD~$((SKIPPED + 1))\"\nbreak\ndone\n\nif git diff --name-only \"$BASE_REF\"\
        \ HEAD 2>/dev/null | grep -qF \"$CHANGELOG\"; then\nif [ \"$SKIPPED\" -gt\
        \ 0 ]; then\n  echo \"\u2705 **PASS** \u2014 \\`${CHANGELOG}\\` was updated\
        \ in the last agent commit (skipped ${SKIPPED} infra commit(s) on top).\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"\u2705 **PASS** \u2014 \\`${CHANGELOG}\\\
        ` was updated in the last commit.\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\nelse\n\
        LAST_TOUCH=$(git log -1 --format=\"%ar\" -- \"$CHANGELOG\" 2>/dev/null ||\
        \ echo \"unknown\")\necho \"\u274C **FAIL** \u2014 \\`${CHANGELOG}\\` was\
        \ NOT updated in the last commit.\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"Last\
        \ modified: ${LAST_TOUCH}\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"**Fix:** Add a \\`## [Unreleased]\\` entry to \\`CHANGELOG.md\\`\
        \ in your next commit.\" >> \"$GITHUB_STEP_SUMMARY\"\nexit 1\nfi\n"
    - name: 'Auto-fix: self-heal accountability report and CHANGELOG (REQ-4/5)'
      id: autofix_docs
      if: "always() && (steps.accountability_check.outcome == 'failure' ||\n steps.changelog_check.outcome\
        \ == 'failure')\n"
      env:
        TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.head_ref ||
          '' }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number
          || '' }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id
          }}
        GIT_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "set -euo pipefail\n\necho \"### \U0001F527 Auto-Fix: Session Wrap-Up Compliance\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\n#\
        \ Determine which fixes are needed\nFIX_ACCT=\"\"\nFIX_CL=\"\"\nif [ \"${{\
        \  steps.accountability_check.outcome }}\" = \"failure\" ]; then\n  FIX_ACCT=\"\
        --fix-accountability\"\n  echo \"- REQ-4 (accountability report): **needs\
        \ fix**\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\nif [ \"${{ steps.changelog_check.outcome\
        \  }}\" = \"failure\" ]; then\n  FIX_CL=\"--fix-changelog\"\n  echo \"- REQ-5\
        \ (CHANGELOG): **needs fix**\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n\n# Run the\
        \ auto-fix script\npython3 scripts/ci/session_wrapup_autofix.py \\\n  --pr-number\
        \ \"${PR_NUMBER:-unknown}\" \\\n  --sha \"${GIT_SHA:0:8}\" \\\n  --run-url\
