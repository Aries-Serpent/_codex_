name: HTML Visual Baseline Check

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  visual-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy playwright
          python -m playwright install --with-deps
      - name: Render sample HTML
        run: |
          DATE=$(date -u +%Y-%m-%d)
          python scripts/status/render_html_report.py --json docs/templates/status/example_report_v1.2.json --out reports/daily/${DATE}.html --template docs/templates/status/report_template_themed.html
      - name: Capture screenshot
        run: |
          python scripts/status/screenshot_html.py --html reports/daily/$(date -u +%Y-%m-%d).html --out reports/daily/$(date -u +%Y-%m-%d).png
      - name: Compare with baseline (if present)
        run: |
          CAND="reports/daily/$(date -u +%Y-%m-%d).png"
          BASE="visual_baseline/status_report_themed.png"
          if [ -f "${BASE}" ]; then
            python tools/visual_compare.py --baseline "${BASE}" --candidate "${CAND}" --metric ssim --threshold 0.98
          else
            echo "::warning title=Baseline missing::${BASE} not found. Commit a baseline or update CI."
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: status-html-visual
          path: |
            reports/daily/*.html
            reports/daily/*.png
