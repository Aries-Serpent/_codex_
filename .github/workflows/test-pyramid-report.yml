name: Test Pyramid Health Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 */3 *"   # 03:00 UTC on the 1st of every 3rd month (quarterly)

permissions:
  contents: write
  actions: read

concurrency:
  group: test-pyramid-report
  cancel-in-progress: true

jobs:
  pyramid-report:
    name: Generate quarterly test pyramid health report (D7 #3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements-dev.txt

      - name: Count test pyramid tiers
        run: python scripts/ci/test_pyramid_report.py --output reports/test_pyramid_latest.json

      - name: Upload pyramid report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-pyramid-${{ github.run_id }}
          path: reports/test_pyramid_latest.json

      - name: Gate on pyramid health
        run: |
          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          p = Path("reports/test_pyramid_latest.json")
          if not p.exists():
              print("::warning::Pyramid report not generated")
              exit(0)
          r = json.loads(p.read_text())
          unit = r.get("unit_tests", 0)
          integration = r.get("integration_tests", 0)
          e2e = r.get("e2e_tests", 0)
          ratio = unit / max(integration + e2e, 1)
          print(f"Unit: {unit}  Integration: {integration}  E2E: {e2e}  Ratio: {ratio:.1f}x")
          if ratio >= 4.0:
              print("::notice::✅ D7 exit criteria #3: healthy pyramid ratio >= 4x")
          else:
              print(f"::warning::D7 pyramid ratio {ratio:.1f}x below 4x target")
          PYEOF
