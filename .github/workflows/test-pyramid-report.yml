name: Test Pyramid Health Report
'on':
  workflow_dispatch: null
  schedule:
  - cron: 0 3 1 */3 *
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  pyramid-report:
    name: Generate quarterly test pyramid health report (D7
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - run: pip install -q -r requirements-dev.txt
    - name: Count test pyramid tiers
      run: python scripts/ci/test_pyramid_report.py --output reports/test_pyramid_latest.json
    - name: Upload pyramid report
      uses: actions/upload-artifact@v5
      with:
        path: reports/test_pyramid_latest.json
        name: test-pyramid-${{ github.run_id }}
    - name: Gate on pyramid health
      run: "python3 - <<'PYEOF'\nimport json\nfrom pathlib import Path\n\np = Path(\"\
        reports/test_pyramid_latest.json\")\nif not p.exists():\n    print(\"::warning::Pyramid\
        \ report not generated\")\n    exit(0)\nr = json.loads(p.read_text())\nunit\
        \ = r.get(\"unit_tests\", 0)\nintegration = r.get(\"integration_tests\", 0)\n\
        e2e = r.get(\"e2e_tests\", 0)\nratio = unit / max(integration + e2e, 1)\n\
        print(f\"Unit: {unit}  Integration: {integration}  E2E: {e2e}  Ratio: {ratio:.1f}x\"\
        )\nif ratio >= 4.0:\n    print(\"::notice::\u2705 D7 exit criteria  #3: healthy\
        \ pyramid ratio >= 4x\")\nelse:\n    print(f\"::warning::D7 pyramid ratio\
        \ {ratio:.1f}x below 4x target\")\nPYEOF\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
