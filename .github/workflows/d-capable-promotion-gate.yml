name: D_CAPABLE Agent Promotion Gate
on:
  schedule:
  - cron: 0 3 * * 0
  pull_request:
    branches:
    - main
    paths:
    - .github/agents/AGENT_REGISTRY.yaml
  workflow_dispatch:
    inputs:
      apply_promotions:
        description: Apply D_CAPABLE promotions to AGENT_REGISTRY.yaml
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  promotion-gate:
    name: "\U0001F680 D_CAPABLE Promotion Gate"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13

    - name: Install dependencies
      run: pip install pyyaml --quiet
    - name: Run promotion evaluation
      id: promotion
      run: "# Auto-apply on weekly schedule (per-agent D_CAPABLE promotion auto-apply).\n\
        APPLY_FLAG=\"\"\nif [ \"${{ github.event_name }}\" = \"schedule\" ] || [ \"\
        ${{ github.event.inputs.apply_promotions }}\" = \"true\" ]; then\n  APPLY_FLAG=\"\
        --promote\"\nfi\npython scripts/cognitive/d_capable_promotion.py ${APPLY_FLAG}\n"
    - name: Commit promotion changes (apply only)
      if: 'steps.promotion.outputs.applied == ''true'' && (github.event_name == ''schedule''
        || github.event.inputs.apply_promotions == ''true'')

        '
      run: "git config user.name  \"github-actions[bot]\"\ngit config user.email \"\
        github-actions[bot]@users.noreply.github.com\"\ngit add .github/agents/AGENT_REGISTRY.yaml\n\
        git diff --cached --quiet || \\\n  git commit -m \"feat(agents): promote ${{\
        \ steps.promotion.outputs.eligible_count }} agent(s) to D_CAPABLE [skip ci]\"\
        \ngit push\n"
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Post promotion summary
      if: always()
      run: "{\n  echo \"## D_CAPABLE Promotion Gate\"\n  echo \"\"\n  echo '```json'\n\
        \  cat .codex/promotion_report.json 2>/dev/null || echo \"No promotion report\
        \ generated.\"\n  echo '```'\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload promotion report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: .codex/promotion_report.json
        retention-days: 30
        if-no-files-found: ignore
        name: d-capable-promotion-report
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: promotion-gate
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
