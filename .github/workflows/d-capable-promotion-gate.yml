name: D_CAPABLE Agent Promotion Gate

# Evaluates every E-model agent in AGENT_REGISTRY.yaml against D_CAPABLE
# promotion criteria and emits a promotion report.
#
# Runs:
#   - Weekly on Sunday at 03:00 UTC (scheduled audit)
#   - On any PR that touches AGENT_REGISTRY.yaml (pre-merge preview)
#   - workflow_dispatch (on-demand)
#
# The workflow is advisory — it never blocks a PR merge.
# Use --promote on workflow_dispatch to apply promotions.

on:
  schedule:
    - cron: '0 3 * * 0'   # weekly Sunday 03:00 UTC
  pull_request:
    branches:
      - main
    paths:
      - '.github/agents/AGENT_REGISTRY.yaml'
  workflow_dispatch:
    inputs:
      apply_promotions:
        description: 'Apply D_CAPABLE promotions to AGENT_REGISTRY.yaml'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: d-capable-promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-gate:
    name: "🚀 D_CAPABLE Promotion Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml --quiet

      - name: Run promotion evaluation
        id: promotion
        run: |
          # Auto-apply on weekly schedule (per-agent D_CAPABLE promotion auto-apply).
          # Dry-run on PR triggers (advisory preview only).
          # Manual workflow_dispatch respects the apply_promotions input.
          APPLY_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            APPLY_FLAG="--promote"
          elif [ "${{ github.event.inputs.apply_promotions }}" = "true" ]; then
            APPLY_FLAG="--promote"
          fi
          python scripts/cognitive/d_capable_promotion.py ${APPLY_FLAG}

      - name: Commit promotion changes (apply only)
        if: >
          steps.promotion.outputs.applied == 'true' &&
          (github.event_name == 'schedule' || github.event.inputs.apply_promotions == 'true')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/agents/AGENT_REGISTRY.yaml
          git diff --cached --quiet || \
            git commit -m "feat(agents): promote ${{ steps.promotion.outputs.eligible_count }} agent(s) to D_CAPABLE [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post promotion summary
        if: always()
        run: |
          {
            echo "## 🚀 D_CAPABLE Promotion Gate"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Already D_CAPABLE | ${{ steps.promotion.outputs.already_d_count }} |"
            echo "| Newly eligible | ${{ steps.promotion.outputs.eligible_count }} |"
            echo "| Promotions applied | ${{ steps.promotion.outputs.applied == 'true' && '✅ Yes' || '— (dry-run)' }} |"
            echo ""
            if [ -f ".codex/promotion_report.json" ]; then
              echo '```json'
              cat .codex/promotion_report.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload promotion report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: d-capable-promotion-report
          path: .codex/promotion_report.json
          retention-days: 30
          if-no-files-found: ignore

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: promotion-gate
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "D-Capable Promotion Gate"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: d-capable-promotion-gate.yml → rescue-comment job (S227)_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
