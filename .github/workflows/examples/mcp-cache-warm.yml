name: MCP Cache Warming
on:
  schedule:
  - cron: 15 3 * * *
  workflow_dispatch:
    inputs:
      targets:
        description: 'Cache targets to warm (comma-separated: python,node,playwright)'
        required: false
        default: python,playwright
      force:
        description: Force rebuild even if cache exists
        required: false
        default: 'false'
        type: boolean
env:
  CACHE_VERSION: v1
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
jobs:
  warm-python-cache:
    name: Warm Python Wheels Cache
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.targets, 'python') || github.event_name == 'schedule'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Cache Python wheels
      id: cache-wheels
      uses: actions/cache@v4
      with:
        path: '~/.cache/pip

          ~/.cache/pip-tools

          '
        key: wheels-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements*.txt',
          'pyproject.toml') }}
        restore-keys: 'wheels-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

          '
    - name: Install dependencies and warm cache
      if: steps.cache-wheels.outputs.cache-hit != 'true' || github.event.inputs.force
        == 'true'
      run: "echo \"\U0001F4E6 Installing dependencies to warm cache...\"\npip install\
        \ --upgrade pip wheel setuptools\n\n# Install all requirement files\nif [\
        \ -f requirements.txt ]; then\n  pip install -r requirements.txt\nfi\n\nif\
        \ [ -f requirements-dev.txt ]; then\n  pip install -r requirements-dev.txt\n\
        fi\n\nif [ -f requirements-test.txt ]; then\n  pip install -r requirements-test.txt\n\
        fi\n\necho \"\u2705 Python cache warmed successfully\"\n"
    - name: Generate cache report
      run: 'echo "## Python Cache Report" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "- **Cache Hit**: ${{ steps.cache-wheels.outputs.cache-hit }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Python Version**: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY

        echo "- **Cache Size**: $(du -sh ~/.cache/pip | cut -f1)" >> $GITHUB_STEP_SUMMARY

        echo "- **Package Count**: $(pip list | wc -l)" >> $GITHUB_STEP_SUMMARY

        '
    timeout-minutes: 10
  warm-playwright-cache:
    name: Warm Playwright Browsers Cache
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.targets, 'playwright') || github.event_name ==
      'schedule'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Cache Playwright browsers
      id: cache-playwright
      uses: actions/cache@v4
      with:
        path: '~/.cache/ms-playwright

          '
        key: playwright-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: 'playwright-${{ runner.os }}-

          '
    - name: Install Playwright and browsers
      if: steps.cache-playwright.outputs.cache-hit != 'true' || github.event.inputs.force
        == 'true'
      run: "echo \"\U0001F3AD Installing Playwright browsers...\"\npip install playwright\
        \ pytest-playwright\n\n# Install only Chromium to save space\nplaywright install\
        \ chromium\nplaywright install-deps chromium\n\necho \"\u2705 Playwright cache\
        \ warmed successfully\"\n"
    - name: Generate cache report
      run: 'echo "## Playwright Cache Report" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "- **Cache Hit**: ${{ steps.cache-playwright.outputs.cache-hit }}" >>
        $GITHUB_STEP_SUMMARY

        echo "- **Cache Size**: $(du -sh ~/.cache/ms-playwright | cut -f1)" >> $GITHUB_STEP_SUMMARY

        '
    timeout-minutes: 10
  cleanup-old-caches:
    name: Cleanup Old Caches
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Cleanup caches older than 14 days
      uses: actions/github-script@v8
      with:
        script: "const caches = await github.rest.actions.getActionsCacheList({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  per_page: 100\n\
          });\n\nconst cutoff = Date.now() - (14 * 24 * 60 * 60 * 1000);\nlet deletedCount\
          \ = 0;\n\nfor (const cache of caches.data.actions_caches) {\n  const createdAt\
          \ = new Date(cache.created_at).getTime();\n\n  if (createdAt < cutoff) {\n\
          \    try {\n      await github.rest.actions.deleteActionsCacheById({\n \
          \       owner: context.repo.owner,\n        repo: context.repo.repo,\n \
          \       cache_id: cache.id\n      });\n      console.log(`Deleted cache:\
          \ ${cache.key}`);\n      deletedCount++;\n    } catch (error) {\n      console.log(`Failed\
          \ to delete cache: ${error.message}`);\n    }\n  }\n}\n\nconsole.log(`Total\
          \ caches deleted: ${deletedCount}`);\n"
    timeout-minutes: 10
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
