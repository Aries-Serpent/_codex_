name: ShellCheck IMDS Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**/*.sh'
      - '.shellcheckrc'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/scripts/**/*.sh'
      - '.shellcheckrc'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
      
      - name: Find shell scripts
        id: find-scripts
        run: |
          echo "Finding shell scripts..."
          scripts=$(find .github/scripts -name "*.sh" -type f)
          echo "$scripts"
          echo "script_count=$(echo "$scripts" | wc -l)" >> $GITHUB_OUTPUT
          echo "$scripts" > scripts_to_check.txt
      
      - name: Run ShellCheck on IMDS scripts
        id: shellcheck-imds
        run: |
          echo "## ShellCheck Results for IMDS Scripts" > shellcheck_results.md
          echo "" >> shellcheck_results.md
          
          exit_code=0
          
          while IFS= read -r script; do
            echo "Checking: $script"
            echo "### \`$script\`" >> shellcheck_results.md
            echo "" >> shellcheck_results.md
            
            if shellcheck -f gcc "$script" > shellcheck_output.txt 2>&1; then
              echo "✅ No issues found" >> shellcheck_results.md
            else
              exit_code=1
              echo "❌ Issues found:" >> shellcheck_results.md
              echo '```' >> shellcheck_results.md
              cat shellcheck_output.txt >> shellcheck_results.md
              echo '```' >> shellcheck_results.md
            fi
            echo "" >> shellcheck_results.md
          done < scripts_to_check.txt
          
          exit $exit_code
        continue-on-error: true
      
      - name: Run ShellCheck with SARIF output
        run: |
          mkdir -p shellcheck-results
          
          # Run shellcheck on all shell scripts and generate SARIF
          find .github/scripts -name "*.sh" -type f -exec \
            shellcheck -f json {} \; > shellcheck-results/results.json || true
      
      - name: Upload ShellCheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-results
          path: |
            shellcheck_results.md
            shellcheck-results/
          retention-days: 30
      
      - name: Comment on PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🐚 ShellCheck Analysis Results\n\n';
            
            try {
              if (fs.existsSync('shellcheck_results.md')) {
                const results = fs.readFileSync('shellcheck_results.md', 'utf8');
                comment += results;
              } else {
                comment += '⚠️ No ShellCheck results available.\n';
              }
            } catch (error) {
              comment += `❌ Error reading results: ${error.message}\n`;
            }
            
            comment += '\n---\n';
            comment += '*ShellCheck version: Latest*\n';
            comment += `*Analysis run: ${new Date().toISOString()}*`;
            
            // Find existing ShellCheck comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🐚 ShellCheck Analysis Results')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
      
      - name: Check ShellCheck status
        if: steps.shellcheck-imds.outcome == 'failure'
        run: |
          echo "::error::ShellCheck found issues in one or more scripts"
          echo "Please review the ShellCheck results and fix the issues"
          exit 1
