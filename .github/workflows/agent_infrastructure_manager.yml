name: Agent Infrastructure Manager

# Unified workflow for all three agentic infrastructure operations:
#   1. Repo variable writes  (github_var_writer.py)
#   2. Webhook configuration (webhook_configurator.py)
#   3. GitHub App bootstrap  (github_app_bootstrap.py)
#
# Triggers:
#   - workflow_dispatch        — manual run with operation selector
#   - repository_dispatch      — programmatic trigger (type: agent-infra-*)
#   - issue_comment            — @agent-infra apply / @agent-infra webhook / @agent-infra status
#
# Auth:
#   Variables/Webhooks: CODEX_MASTER_KEY (variables:write + admin:repo_hook)
#   GitHub App:         CODEX_BACKUP_KEY (admin:org_hook + read:org)
#
# Sources:
#   https://docs.github.com/en/rest/actions/variables
#   https://docs.github.com/en/rest/repos/webhooks
#   https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/registering-a-github-app-from-a-manifest

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        type: choice
        options:
          - apply-vars
          - apply-webhooks
          - list-vars
          - list-webhooks
          - app-manifest-url
          - app-status
      extra_args:
        description: "Extra arguments (e.g. --dry-run, --force, --delete VAR_NAME)"
        required: false
        default: ""

  repository_dispatch:
    types:
      - agent-infra-apply-vars
      - agent-infra-apply-webhooks
      - agent-infra-list-vars
      - agent-infra-list-webhooks
      - agent-infra-app-status

  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # ── Guard: only allow authorized actors via issue_comment trigger ────────
  auth-check:
    name: Authorization check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
      operation: ${{ steps.check.outputs.operation }}
      extra_args: ${{ steps.check.outputs.extra_args }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Check actor and parse command
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          ALLOWED_ACTORS: ${{ vars.COGNITIVE_BRAIN_ALLOWED_ACTORS }}
          DISPATCH_OPERATION: ${{ github.event.action }}
          DISPATCH_OPERATION_INPUT: ${{ inputs.operation }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Always authorized for workflow_dispatch and repository_dispatch
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "authorized=true" >> $GITHUB_OUTPUT
            echo "operation=${DISPATCH_OPERATION_INPUT}" >> $GITHUB_OUTPUT
            echo "extra_args=${{ inputs.extra_args }}" >> $GITHUB_OUTPUT
            echo "pr_number=" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            OP="${DISPATCH_OPERATION#agent-infra-}"
            echo "authorized=true" >> $GITHUB_OUTPUT
            echo "operation=${OP}" >> $GITHUB_OUTPUT
            echo "extra_args=${{ github.event.client_payload.extra_args }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.client_payload.pr_number }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # issue_comment: check prefix and actor
          if ! echo "$COMMENT_BODY" | grep -qE "^@agent-infra (apply-vars|apply-webhooks|list-vars|list-webhooks|app-status|app-manifest)"; then
            echo "authorized=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          ALLOWED="${ALLOWED_ACTORS:-mbaetiong,github-actions[bot],copilot-swe-agent[bot],github-copilot[bot]}"
          AUTHORIZED="false"
          IFS=',' read -ra ACTORS <<< "$ALLOWED"
          for a in "${ACTORS[@]}"; do
            if [ "$(echo "$a" | xargs)" = "$COMMENT_ACTOR" ]; then
              AUTHORIZED="true"
              break
            fi
          done

          OP=$(echo "$COMMENT_BODY" | head -1 | awk '{print $2}')
          EXTRA=$(echo "$COMMENT_BODY" | head -1 | cut -d' ' -f3-)

          echo "authorized=${AUTHORIZED}" >> $GITHUB_OUTPUT
          echo "operation=${OP}" >> $GITHUB_OUTPUT
          echo "extra_args=${EXTRA}" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

  # ── 1. Apply repo variables from .codex/pending_var_updates.json ─────────
  apply-vars:
    name: Apply repo variable updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: auth-check
    if: |
      needs.auth-check.outputs.authorized == 'true' &&
      needs.auth-check.outputs.operation == 'apply-vars'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Cache pip downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-infra-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-infra-
      # ── Autonomy Registry gate check (Phase 1 wiring) ──────────────────────
      - name: Autonomy Registry gate check
        continue-on-error: true
        run: |
          python scripts/ci/autonomy_gate_check.py \
            --surface AUT-008 \
            --class INFRA_WRITE \
            --actor "${{ github.actor }}" || true

      - name: Run variable writer
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          CODEX_ADMIN_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXTRA_ARGS: ${{ needs.auth-check.outputs.extra_args }}
        run: |
          pip install -q requests 2>/dev/null || true
          if [ -f ".codex/pending_var_updates.json" ]; then
            python scripts/ci/github_var_writer.py --batch .codex/pending_var_updates.json $EXTRA_ARGS
          else
            echo "No pending_var_updates.json found — nothing to apply"
          fi

      - name: Post result to PR
        if: needs.auth-check.outputs.pr_number != ''
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.auth-check.outputs.pr_number }}
        run: |
          STATUS=$(tail -n 5 .codex/evidence/var_write_audit.jsonl 2>/dev/null || echo "no audit log")
          export STATUS
          BODY=$(python3 -c 'import json,os,sys; s=os.environ.get("STATUS",""); f="```"; b="✅ **Agent Infrastructure:** Variable write complete.\n"+f+"\n"+s+"\n"+f; sys.stdout.write(json.dumps({"body":b}))')
          curl -s -X POST \
            -H "Authorization: Bearer ${CODEX_MASTER_KEY}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -d "${BODY}" \
            > /dev/null

  # ── 2. Apply webhook configuration from .codex/webhook_config.json ───────
  apply-webhooks:
    name: Apply webhook configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: auth-check
    if: |
      needs.auth-check.outputs.authorized == 'true' &&
      needs.auth-check.outputs.operation == 'apply-webhooks'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Configure webhooks
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WEBHOOK_RECEIVER_URL: ${{ vars.WEBHOOK_RECEIVER_URL }}
          EXTRA_ARGS: ${{ needs.auth-check.outputs.extra_args }}
        run: |
          if [ -f ".codex/webhook_config.json" ]; then
            python scripts/ci/webhook_configurator.py --apply .codex/webhook_config.json $EXTRA_ARGS
          else
            echo "No webhook_config.json found"
          fi

  # ── 3. List current repo variables ───────────────────────────────────────
  list-vars:
    name: List repo variables
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: auth-check
    if: |
      needs.auth-check.outputs.authorized == 'true' &&
      needs.auth-check.outputs.operation == 'list-vars'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: List variables and post to PR
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.auth-check.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          OUTPUT=$(python scripts/ci/github_var_writer.py --list 2>&1 || echo "Error listing variables")
          echo "$OUTPUT"

          if [ -n "$PR_NUMBER" ]; then
            FENCE=$(python3 -c 'print(chr(96)*3)')
            BODY=$(OUTPUT="${OUTPUT}" FENCE="${FENCE}" python3 -c \
              'import json,os; output=os.environ.get("OUTPUT",""); fence=os.environ.get("FENCE","```"); print(json.dumps({"body":"## Repo Variables\n\n"+fence+"\n"+output+"\n"+fence}))')
            curl -s -X POST \
              -H "Authorization: Bearer ${CODEX_MASTER_KEY}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -d "${BODY}" \
              > /dev/null
          fi

  # ── 4. List current webhooks ──────────────────────────────────────────────
  list-webhooks:
    name: List repo webhooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: auth-check
    if: |
      needs.auth-check.outputs.authorized == 'true' &&
      needs.auth-check.outputs.operation == 'list-webhooks'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: List webhooks
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/webhook_configurator.py --list

  # ── 5. GitHub App status / manifest URL ──────────────────────────────────
  app-status:
    name: GitHub App status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: auth-check
    if: |
      needs.auth-check.outputs.authorized == 'true' &&
      (needs.auth-check.outputs.operation == 'app-status' ||
       needs.auth-check.outputs.operation == 'app-manifest')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Show app status or generate manifest URL
        env:
          CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
          WEBHOOK_RECEIVER_URL: ${{ vars.WEBHOOK_RECEIVER_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPERATION: ${{ needs.auth-check.outputs.operation }}
        run: |
          if [ "$OPERATION" = "app-manifest" ]; then
            python scripts/ci/github_app_bootstrap.py --generate-manifest-url
          else
            python scripts/ci/github_app_bootstrap.py --show 2>/dev/null \
              || echo "No GitHub App registered yet. Run 'app-manifest' operation first."
          fi

      - name: Post result to PR
        if: needs.auth-check.outputs.pr_number != ''
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.auth-check.outputs.pr_number }}
          OPERATION: ${{ needs.auth-check.outputs.operation }}
        run: |
          CREDENTIALS_FILE=".codex/github_app/app_credentials.json"
          if [ -f "$CREDENTIALS_FILE" ]; then
            APP_ID=$(python3 -c "import json; d=json.load(open('$CREDENTIALS_FILE')); print(d.get('app_id','?'))")
            APP_URL=$(python3 -c "import json; d=json.load(open('$CREDENTIALS_FILE')); print(d.get('html_url','?'))")
            MSG="## 🤖 GitHub App Status\n\n| Field | Value |\n|-------|-------|\n| App ID | \`${APP_ID}\` |\n| URL | ${APP_URL} |\n| Private Key | $(test -f .codex/github_app/private_key.pem && echo '✅ present' || echo '❌ missing') |"
          else
            MSG="## 🤖 GitHub App\n\nNo app registered yet.\n\nRun:\n\`\`\`\n@agent-infra app-manifest\n\`\`\`\nto generate the manifest URL."
          fi
          curl -s -X POST \
            -H "Authorization: Bearer ${CODEX_MASTER_KEY}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -d "{\"body\":\"${MSG}\"}" > /dev/null
