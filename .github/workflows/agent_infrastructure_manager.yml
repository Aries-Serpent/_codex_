name: Agent Infrastructure Manager
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        type: choice
        options:
        - apply-vars
        - apply-webhooks
        - list-vars
        - list-webhooks
        - app-manifest-url
        - app-status
      extra_args:
        description: Extra arguments (e.g. --dry-run, --force, --delete VAR_NAME)
        required: false
        default: ''
  repository_dispatch:
    types:
    - agent-infra-apply-vars
    - agent-infra-apply-webhooks
    - agent-infra-list-vars
    - agent-infra-list-webhooks
    - agent-infra-app-status
  issue_comment:
    types:
    - created
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  auth-check:
    name: Authorization check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
      operation: ${{ steps.check.outputs.operation }}
      extra_args: ${{ steps.check.outputs.extra_args }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
    - name: Check actor and parse command
      id: check
      env:
        EVENT_NAME: ${{ github.event_name }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_ACTOR: ${{ github.event.comment.user.login }}
        ALLOWED_ACTORS: ${{ vars.COGNITIVE_BRAIN_ALLOWED_ACTORS }}
        DISPATCH_OPERATION: ${{ github.event.action }}
        DISPATCH_OPERATION_INPUT: ${{ inputs.operation }}
        PR_NUMBER: ${{ github.event.issue.number }}
      run: "# Always authorized for workflow_dispatch and repository_dispatch\nif\
        \ [ \"$EVENT_NAME\" = \"workflow_dispatch\" ]; then\n  echo \"authorized=true\"\
        \ >> $GITHUB_OUTPUT\n  echo \"operation=${DISPATCH_OPERATION_INPUT}\" >> $GITHUB_OUTPUT\n\
        \  echo \"extra_args=${{ inputs.extra_args }}\" >> $GITHUB_OUTPUT\n  echo\
        \ \"pr_number=\" >> $GITHUB_OUTPUT\n  exit 0\nfi\n\nif [ \"$EVENT_NAME\" =\
        \ \"repository_dispatch\" ]; then\n  OP=\"${DISPATCH_OPERATION#agent-infra-}\"\
        \n  echo \"authorized=true\" >> $GITHUB_OUTPUT\n  echo \"operation=${OP}\"\
        \ >> $GITHUB_OUTPUT\n  echo \"extra_args=${{ github.event.client_payload.extra_args\
        \ }}\" >> $GITHUB_OUTPUT\n  echo \"pr_number=${{ github.event.client_payload.pr_number\
        \ }}\" >> $GITHUB_OUTPUT\n  exit 0\nfi\n\n# issue_comment: check prefix and\
        \ actor\nif ! echo \"$COMMENT_BODY\" | grep -qE \"^@agent-infra (apply-vars|apply-webhooks|list-vars|list-webhooks|app-status|app-manifest)\"\
        ; then\n  echo \"authorized=false\" >> $GITHUB_OUTPUT\n  exit 0\nfi\n\nALLOWED=\"\
        ${ALLOWED_ACTORS:-mbaetiong,github-actions[bot],copilot-swe-agent[bot],github-copilot[bot]}\"\
        \nAUTHORIZED=\"false\"\nIFS=',' read -ra ACTORS <<< \"$ALLOWED\"\nfor a in\
        \ \"${ACTORS[@]}\"; do\n  if [ \"$(echo \"$a\" | xargs)\" = \"$COMMENT_ACTOR\"\
        \ ]; then\n    AUTHORIZED=\"true\"\n    break\n  fi\ndone\n\nOP=$(echo \"\
        $COMMENT_BODY\" | head -1 | awk '{print $2}')\nEXTRA=$(echo \"$COMMENT_BODY\"\
        \ | head -1 | cut -d' ' -f3-)\n\necho \"authorized=${AUTHORIZED}\" >> $GITHUB_OUTPUT\n\
        echo \"operation=${OP}\" >> $GITHUB_OUTPUT\necho \"extra_args=${EXTRA}\" >>\
        \ $GITHUB_OUTPUT\necho \"pr_number=${PR_NUMBER}\" >> $GITHUB_OUTPUT\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  apply-vars:
    name: Apply repo variable updates
    runs-on: ubuntu-latest
    needs: auth-check
    if: 'needs.auth-check.outputs.authorized == ''true'' &&

      needs.auth-check.outputs.operation == ''apply-vars''

      '
    steps:
    - name: Cache Python dependencies (Layer 1)
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml')
          }}
        restore-keys: '${{ runner.os }}-pip-

          '
    - uses: actions/checkout@v5
    - name: Cache pip downloads
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-infra-${{ hashFiles('pyproject.toml') }}
        restore-keys: ${{ runner.os }}-pip-infra-
    - name: Autonomy Registry gate check
      continue-on-error: true
      run: "python scripts/ci/autonomy_gate_check.py \\\n  --surface AUT-008 \\\n\
        \  --class INFRA_WRITE \\\n  --actor \"${{ github.actor }}\" || true\n"
    - name: Run variable writer
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        CODEX_ADMIN_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        EXTRA_ARGS: ${{ needs.auth-check.outputs.extra_args }}
      run: "pip install -q requests 2>/dev/null || true\nif [ -f \".codex/pending_var_updates.json\"\
        \ ]; then\n  python scripts/ci/github_var_writer.py --batch .codex/pending_var_updates.json\
        \ $EXTRA_ARGS\nelse\n  echo \"No pending_var_updates.json found \u2014 nothing\
        \ to apply\"\nfi\n"
    - name: Post result to PR
      if: needs.auth-check.outputs.pr_number != ''
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ needs.auth-check.outputs.pr_number }}
      run: "STATUS=$(tail -n 5 .codex/evidence/var_write_audit.jsonl 2>/dev/null ||\
        \ echo \"no audit log\")\nexport STATUS\nBODY=$(python3 -c 'import json,os,sys;\
        \ s=os.environ.get(\"STATUS\",\"\"); f=\"```\"; b=\"\u2705 **Agent Infrastructure:**\
        \ Variable write complete.\\n\"+f+\"\\n\"+s+\"\\n\"+f; sys.stdout.write(json.dumps({\"\
        body\":b}))')\ncurl -s -X POST \\\n  -H \"Authorization: Bearer ${CODEX_MASTER_KEY}\"\
        \ \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments\"\
        \ \\\n  -d \"${BODY}\" \\\n  > /dev/null\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  apply-webhooks:
    name: Apply webhook configuration
    runs-on: ubuntu-latest
    needs: auth-check
    if: 'needs.auth-check.outputs.authorized == ''true'' &&

      needs.auth-check.outputs.operation == ''apply-webhooks''

      '
    steps:
    - uses: actions/checkout@v5
    - name: Cache test results (Layer 3)
      uses: actions/cache@v5
      if: always()
      with:
        path: .pytest_cache/
        key: ${{ runner.os }}-pytest-${{ github.sha }}
        restore-keys: '${{ runner.os }}-pytest-

          '
    - name: Configure webhooks
      id: webhook_config
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        WEBHOOK_RECEIVER_URL: ${{ vars.WEBHOOK_RECEIVER_URL }}
        EXTRA_ARGS: ${{ needs.auth-check.outputs.extra_args }}
      run: "if [ -f \".codex/webhook_config.json\" ]; then\n  python scripts/ci/webhook_configurator.py\
        \ --apply .codex/webhook_config.json $EXTRA_ARGS\nelse\n  echo \"No webhook_config.json\
        \ found\"\nfi\n"
    timeout-minutes: 30
  list-vars:
    name: List repo variables
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: auth-check
    if: 'needs.auth-check.outputs.authorized == ''true'' &&

      needs.auth-check.outputs.operation == ''list-vars''

      '
    steps:
    - uses: actions/checkout@v5
    - name: List variables and post to PR
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ needs.auth-check.outputs.pr_number }}
        REPO: ${{ github.repository }}
      run: "OUTPUT=$(python scripts/ci/github_var_writer.py --list 2>&1 || echo \"\
        Error listing variables\")\necho \"$OUTPUT\"\n\nif [ -n \"$PR_NUMBER\" ];\
        \ then\n  FENCE=$(python3 -c 'print(chr(96)*3)')\n  BODY=$(OUTPUT=\"${OUTPUT}\"\
        \ FENCE=\"${FENCE}\" python3 -c \\\n    'import json,os; output=os.environ.get(\"\
        OUTPUT\",\"\"); fence=os.environ.get(\"FENCE\",\"```\"); print(json.dumps({\"\
        body\":\"## Repo Variables\\n\\n\"+fence+\"\\n\"+output+\"\\n\"+fence}))')\n\
        \  curl -s -X POST \\\n    -H \"Authorization: Bearer ${CODEX_MASTER_KEY}\"\
        \ \\\n    -H \"Accept: application/vnd.github+json\" \\\n    \"https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments\"\
        \ \\\n    -d \"${BODY}\" \\\n    > /dev/null\nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  list-webhooks:
    name: List repo webhooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: auth-check
    if: 'needs.auth-check.outputs.authorized == ''true'' &&

      needs.auth-check.outputs.operation == ''list-webhooks''

      '
    steps:
    - uses: actions/checkout@v5
    - name: List webhooks
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python scripts/ci/webhook_configurator.py --list
  app-status:
    name: GitHub App status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: auth-check
    if: "needs.auth-check.outputs.authorized == 'true' &&\n(needs.auth-check.outputs.operation\
      \ == 'app-status' ||\n needs.auth-check.outputs.operation == 'app-manifest')\n"
    steps:
    - uses: actions/checkout@v5
    - name: Show app status or generate manifest URL
      env:
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        WEBHOOK_RECEIVER_URL: ${{ vars.WEBHOOK_RECEIVER_URL }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        OPERATION: ${{ needs.auth-check.outputs.operation }}
      run: "if [ \"$OPERATION\" = \"app-manifest\" ]; then\n  python scripts/ci/github_app_bootstrap.py\
        \ --generate-manifest-url\nelse\n  python scripts/ci/github_app_bootstrap.py\
        \ --show 2>/dev/null \\\n    || echo \"No GitHub App registered yet. Run 'app-manifest'\
        \ operation first.\"\nfi\n"
    - name: Post result to PR
      if: needs.auth-check.outputs.pr_number != ''
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ needs.auth-check.outputs.pr_number }}
        OPERATION: ${{ needs.auth-check.outputs.operation }}
      run: "CREDENTIALS_FILE=\".codex/github_app/app_credentials.json\"\nif [ -f \"\
        $CREDENTIALS_FILE\" ]; then\n  APP_ID=$(python3 -c \"import json; d=json.load(open('$CREDENTIALS_FILE'));\
        \ print(d.get('app_id','?'))\")\n  APP_URL=$(python3 -c \"import json; d=json.load(open('$CREDENTIALS_FILE'));\
        \ print(d.get('html_url','?'))\")\n  MSG=\"## \U0001F916 GitHub App Status\\\
        n\\n| Field | Value |\\n|-------|-------|\\n| App ID | \\`${APP_ID}\\` |\\\
        n| URL | ${APP_URL} |\\n| Private Key | $(test -f .codex/github_app/private_key.pem\
        \ && echo '\u2705 present' || echo '\u274C missing') |\"\nelse\n  MSG=\"##\
        \ \U0001F916 GitHub App\\n\\nNo app registered yet.\\n\\nRun:\\n\\`\\`\\`\\\
        n@agent-infra app-manifest\\n\\`\\`\\`\\nto generate the manifest URL.\"\n\
        fi\ncurl -s -X POST \\\n  -H \"Authorization: Bearer ${CODEX_MASTER_KEY}\"\
        \ \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments\"\
        \ \\\n  -d \"{\\\"body\\\":\\\"${MSG}\\\"}\" > /dev/null\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
