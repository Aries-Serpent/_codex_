name: Status Gate (.statusrc)

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  status-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage
      - name: Run coverage
        run: |
          coverage run -m pytest -q || true
          coverage json -o .coverage.json
      - name: Enforce .statusrc.json thresholds
        run: |
          python tools/status_gate_from_statusrc.py
