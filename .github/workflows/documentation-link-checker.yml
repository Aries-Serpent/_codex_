name: Documentation Link Checker

on:
  push:
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - '.codex/*.md'
      - 'scripts/*.md'
  pull_request:
    # Only run on non-draft PRs by default. DRAFT mode: doc link check is optional.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - '.codex/*.md'
      - 'scripts/*.md'
  schedule:
    # Run weekly to catch broken external links
    - cron: '0 0 * * 0'


permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # ── WEC gate — check PR body to decide if link check should run ──────────────
  wec-gate:
    name: "WEC gate — check documentation-link-checker.yml checkbox"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: "Read WEC checkbox and draft status from PR"
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # On non-PR events (push, schedule), always run
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "📋 Non-PR event — link check will run."
            exit 0
          fi

          # Skip on DRAFT PRs — doc link checker is optional in draft mode
          IS_DRAFT="${{ github.event.pull_request.draft }}"
          if [ "$IS_DRAFT" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "📋 DRAFT PR — documentation-link-checker.yml is optional (skip=true)."
            exit 0
          fi

          BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body --jq '.body // ""' 2>/dev/null || echo "")

          # Extract only the WEC section to avoid false matches in code examples/comments.
          WEC_SECTION=$(echo "$BODY" | awk '
            /^## 🔄 Workflow Execution Checklist/ { found=1 }
            found && /^## / && !/^## 🔄 Workflow Execution Checklist/ { found=0 }
            found { print }
          ')

          # If WEC section is present AND documentation-link-checker.yml is explicitly unchecked, skip.
          if [ -n "$WEC_SECTION" ]; then
            if echo "$WEC_SECTION" | grep -qiE '^\s*-\s*\[\s*\]\s*documentation-link-checker\.yml'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "📋 WEC: documentation-link-checker.yml is UNCHECKED — skipping link check."
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "📋 WEC gate passed — proceeding with link check."

  check-links:
    name: "Check documentation links"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    needs: wec-gate
    # Skip when WEC unchecked on PRs; always run on push/schedule
    if: needs.wec-gate.outputs.skip != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Required for git diff on push/PR events

      # Fix 1 + Fix 3: Diff-based file selection for push/PR; full scan for schedule.
      # .github/workflows/*.md is excluded from all scan modes — these are operational
      # docs with many internal/placeholder links outside the stated scope.
      - name: Compute files to check
        id: filelist
        run: |
          EVENT="${{ github.event_name }}"

          # Shared exclusion filter applied to every scan mode
          _find_all_md() {
            find . -name "*.md" \
              -not -path "./node_modules/*" \
              -not -path "./.git/*" \
              -not -path "./temp/*" \
              -not -path "./archive/*" \
              -not -path "./cognitive_app/node_modules/*" \
              -not -path "./.github/workflows/*" \
              | sort
          }

          if [ "$EVENT" = "schedule" ]; then
            echo "📅 Scheduled run — full scan (excluding .github/workflows/)"
            FILES=$(_find_all_md)
          else
            # Diff-based: only files changed vs the merge base
            BASE_SHA="${{ github.event.before || github.event.pull_request.base.sha }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="HEAD~1"
            fi
            # Build the changed list; fall back to full scan if diff fails (e.g. shallow)
            DIFF_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- '*.md' 2>/dev/null \
              | grep -v '^\.github/workflows/' \
              | grep -v '^node_modules/' \
              | grep -v '^temp/' \
              | grep -v '^archive/' \
              | xargs -I{} sh -c '[ -f "{}" ] && echo "{}"' 2>/dev/null || true)

            if [ -z "$DIFF_FILES" ] && [ "$BASE_SHA" != "HEAD~1" ]; then
              echo "⚠️  Diff empty or failed — falling back to full scan"
              FILES=$(_find_all_md)
            else
              FILES="$DIFF_FILES"
            fi
            echo "📝 Diff-based: $(echo "$FILES" | grep -c . || echo 0) file(s) to check"
          fi

          echo "$FILES" > /tmp/md_files.txt
          FILE_COUNT=$(grep -c . /tmp/md_files.txt 2>/dev/null || echo 0)
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "📊 Candidate file count: $FILE_COUNT"

      # Fix 2: Per-file checksum cache — replaces aggregate all-or-nothing approach.
      # Key includes branch name to avoid false hits from other branches.
      - name: Restore per-file checksum cache
        id: per_file_cache
        uses: actions/cache@v5
        with:
          path: .link-check-per-file.json
          key: link-check-per-file-${{ github.ref_name }}
          restore-keys: |
            link-check-per-file-

      # Fix 2 (continued): Compare current hashes against the cached map.
      # Only files with changed/new content are written to /tmp/md_changed.txt.
      - name: Compute changed files vs per-file cache
        id: changed_files
        run: |
          python3 - <<'PYEOF'
          import json, hashlib, os

          CACHE_FILE = ".link-check-per-file.json"
          MD_FILES_LIST = "/tmp/md_files.txt"

          # Load previous per-file results
          prev = {}
          if os.path.exists(CACHE_FILE):
              try:
                  with open(CACHE_FILE) as f:
                      prev = json.load(f)
              except Exception:
                  prev = {}

          # Read candidate files
          with open(MD_FILES_LIST) as f:
              files = [ln.strip() for ln in f if ln.strip()]

          to_check = []
          for fp in files:
              if not os.path.isfile(fp):
                  continue
              with open(fp, "rb") as _fh:
                  _sha = hashlib.sha1()
                  while chunk := _fh.read(65536):
                      _sha.update(chunk)
                  h = _sha.hexdigest()
              if prev.get(fp) != h:
                  to_check.append(fp)

          with open("/tmp/md_changed.txt", "w") as f:
              f.write("\n".join(to_check))

          print(f"Candidate files: {len(files)}, Changed/new: {len(to_check)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"changed_count={len(to_check)}\n")
          PYEOF

      # Fix 4: Skip the check entirely when no files differ from cache.
      # This guards both push/PR runs and the weekly scheduled scan.
      - name: Check if link check is needed
        id: skip_check
        run: |
          CHANGED="${{ steps.changed_files.outputs.changed_count }}"
          if [ "${CHANGED:-0}" = "0" ]; then
            echo "✅ All candidate files are cache-fresh — skipping link check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "📝 ${CHANGED} file(s) changed — running link check"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.skip_check.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install markdown-link-check
        if: steps.skip_check.outputs.skip != 'true'
        run: npm install -g markdown-link-check

      - name: Verify link check config
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          # The .markdown-link-check.json config file should already exist in the repo
          if [ ! -f .markdown-link-check.json ]; then
            echo "❌ ERROR: .markdown-link-check.json not found!"
            exit 1
          fi
          echo "✅ Using existing .markdown-link-check.json configuration"
          cat .markdown-link-check.json

      # Fix 1 (continued): Use the diff-computed /tmp/md_changed.txt instead of
      # re-running find across the entire repo.
      - name: Check links in documentation
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          echo "🔍 Checking $(wc -l < /tmp/md_changed.txt) file(s)..."
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Checking: $file"
            markdown-link-check "$file" --config .markdown-link-check.json || true
          done < /tmp/md_changed.txt

      - name: Check critical documentation files
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          echo "🔍 Checking critical Genesis documentation..."

          CRITICAL_FILES=(
            "docs/admin/GENESIS_SETUP_GUIDE.md"
            "docs/agent/OPERATIONAL_GUIDELINES.md"
            "scripts/AUTONOMOUS_AGENT_README.md"
            "README.md"
            ".codex/guardrails.md"
          )

          FAILED=0
          for file in "${CRITICAL_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "Checking critical file: $file"
              if markdown-link-check "$file" --config .markdown-link-check.json; then
                echo "✅ $file links valid"
              else
                echo "❌ $file has broken links"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "⚠️  $file not found"
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo "❌ $FAILED critical file(s) have broken links"
            exit 1
          else
            echo "✅ All critical documentation links valid"
          fi

      # Fix 2 (continued): Persist updated per-file hash map so the next run
      # can skip unchanged files. Only runs on success to avoid caching bad state.
      - name: Update per-file checksum cache
        if: steps.skip_check.outputs.skip != 'true' && success()
        run: |
          python3 - <<'PYEOF'
          import json, hashlib, os

          CACHE_FILE = ".link-check-per-file.json"
          MD_CHANGED = "/tmp/md_changed.txt"

          # Load existing cache (preserve entries for files not checked this run)
          cache = {}
          if os.path.exists(CACHE_FILE):
              try:
                  with open(CACHE_FILE) as f:
                      cache = json.load(f)
              except Exception:
                  cache = {}

          # Update entries for every file just checked
          with open(MD_CHANGED) as f:
              for fp in [ln.strip() for ln in f if ln.strip()]:
                  if os.path.isfile(fp):
                      with open(fp, "rb") as _fh:
                          _sha = hashlib.sha1()
                          while chunk := _fh.read(65536):
                              _sha.update(chunk)
                          cache[fp] = _sha.hexdigest()

          with open(CACHE_FILE, "w") as f:
              json.dump(cache, f, indent=2)

          print(f"✅ Per-file cache updated: {len(cache)} total entries")
          PYEOF

      - name: Generate link check report
        if: always()
        run: |
          echo "📋 Generating link check report..."
          SKIPPED="${{ steps.skip_check.outputs.skip }}"
          CHANGED="${{ steps.changed_files.outputs.changed_count }}"
          cat > link-check-report.json << EOFREPORT
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow": "documentation-link-checker",
            "branch": "${{ github.ref_name }}",
            "event": "${{ github.event_name }}",
            "status": "completed",
            "skipped": "$SKIPPED",
            "files_checked": "${CHANGED:-0}"
          }
          EOFREPORT

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: link-check-report
          path: link-check-report.json
          retention-days: 30

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow documentation-link-checker 2>/dev/null || echo "Cache health: check skipped"

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: check-links
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Documentation Link Checker"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
