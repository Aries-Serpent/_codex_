name: Documentation Link Checker

on:
  push:
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - '.codex/*.md'
      - 'scripts/*.md'
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - '.codex/*.md'
      - 'scripts/*.md'
  schedule:
    # Run weekly to catch broken external links
    - cron: '0 0 * * 0'


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # ── WEC gate — check PR body to decide if link check should run ──────────────
  wec-gate:
    name: "WEC gate — check documentation-link-checker.yml checkbox"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: "Read WEC checkbox from PR body"
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # On non-PR events (push, schedule), always run
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "📋 Non-PR event — link check will run."
            exit 0
          fi

          BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body --jq '.body // ""' 2>/dev/null || echo "")

          # If WEC section is present AND documentation-link-checker.yml is explicitly unchecked, skip.
          if echo "$BODY" | grep -qE '## 🔄 Workflow Execution Checklist'; then
            if echo "$BODY" | grep -qiE '^\-\s*\[\s*\]\s*documentation-link-checker\.yml'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "📋 WEC: documentation-link-checker.yml is UNCHECKED — skipping link check."
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "📋 WEC gate passed — proceeding with link check."

  check-links:
    name: "Check documentation links"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: wec-gate
    # Skip when WEC unchecked on PRs; always run on push/schedule
    if: needs.wec-gate.outputs.skip != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute documentation checksum
        id: checksum
        run: |
          echo "🔍 Computing checksum of documentation files..."

          # NOTE: This is Phase 1 aggregate caching (all-or-nothing approach).
          # For granular per-folder/per-file caching (Phase 2-3), see:
          # .codex/WORKFLOW_CACHING_IMPLEMENTATION_PLAN.md

          # Find all markdown files to check
          MD_FILES=$(find . -name "*.md" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./temp/*" \
            -not -path "./archive/*" \
            -not -path "./cognitive_app/node_modules/*" \
            | sort)

          # Create sorted list of file paths + content hashes
          CHECKSUM_INPUT=""
          for file in $MD_FILES; do
            if [ -f "$file" ]; then
              FILE_HASH=$(sha1sum "$file" | cut -d' ' -f1)
              CHECKSUM_INPUT="${CHECKSUM_INPUT}${file}:${FILE_HASH}\n"
            fi
          done

          # Compute aggregate checksum
          AGGREGATE_CHECKSUM=$(echo -e "$CHECKSUM_INPUT" | sha1sum | cut -d' ' -f1)
          echo "aggregate_checksum=$AGGREGATE_CHECKSUM" >> $GITHUB_OUTPUT
          echo "✅ Aggregate checksum: $AGGREGATE_CHECKSUM"

          # Store file list for later use
          echo "$MD_FILES" > /tmp/md_files.txt

      - name: Check cache for previous successful run
        id: cache
        uses: actions/cache@v5
        with:
          path: .link-check-success
          key: link-check-${{ steps.checksum.outputs.aggregate_checksum }}
          restore-keys: |
            link-check-

      - name: Determine if link check is needed
        id: skip_check
        run: |
          if [ -f .link-check-success ]; then
            CACHED_CHECKSUM=$(cat .link-check-success)
            CURRENT_CHECKSUM="${{ steps.checksum.outputs.aggregate_checksum }}"

            if [ "$CACHED_CHECKSUM" = "$CURRENT_CHECKSUM" ]; then
              echo "✅ Documentation unchanged since last successful check"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "📝 Documentation has changed, running link check"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "📝 No cache found, running link check"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.skip_check.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install markdown-link-check
        if: steps.skip_check.outputs.skip != 'true'
        run: npm install -g markdown-link-check

      - name: Verify link check config
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          # The .markdown-link-check.json config file should already exist in the repo
          if [ ! -f .markdown-link-check.json ]; then
            echo "❌ ERROR: .markdown-link-check.json not found!"
            exit 1
          fi
          echo "✅ Using existing .markdown-link-check.json configuration"
          cat .markdown-link-check.json

      - name: Check links in documentation
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          echo "🔍 Checking links in documentation files..."

          # Find all markdown files
          find . -name "*.md" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./temp/*" \
            -not -path "./archive/*" \
            -print0 | while IFS= read -r -d '' file; do
            echo "Checking: $file"
            markdown-link-check "$file" --config .markdown-link-check.json || true
          done

      - name: Check critical documentation files
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          echo "🔍 Checking critical Genesis documentation..."

          CRITICAL_FILES=(
            "docs/admin/GENESIS_SETUP_GUIDE.md"
            "docs/agent/OPERATIONAL_GUIDELINES.md"
            "scripts/AUTONOMOUS_AGENT_README.md"
            "README.md"
            ".codex/guardrails.md"
          )

          FAILED=0
          for file in "${CRITICAL_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "Checking critical file: $file"
              if markdown-link-check "$file" --config .markdown-link-check.json; then
                echo "✅ $file links valid"
              else
                echo "❌ $file has broken links"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "⚠️  $file not found"
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo "❌ $FAILED critical file(s) have broken links"
            exit 1
          else
            echo "✅ All critical documentation links valid"
          fi

      - name: Mark successful check
        if: steps.skip_check.outputs.skip != 'true' && success()
        run: |
          echo "${{ steps.checksum.outputs.aggregate_checksum }}" > .link-check-success
          echo "✅ Saved checksum for future cache hits"

      - name: Generate link check report
        if: always()
        run: |
          echo "📋 Generating link check report..."
          SKIPPED="${{ steps.skip_check.outputs.skip }}"
          cat > link-check-report.json << EOFREPORT
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow": "documentation-link-checker",
            "branch": "${{ github.ref_name }}",
            "status": "completed",
            "skipped": "$SKIPPED",
            "checksum": "${{ steps.checksum.outputs.aggregate_checksum }}"
          }
          EOFREPORT

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: link-check-report
          path: link-check-report.json
          retention-days: 30

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow documentation-link-checker 2>/dev/null || echo "Cache health: check skipped"

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: check-links
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Documentation Link Checker"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue:{pr_number} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: documentation-link-checker.yml → rescue-comment job (S227)_\n\n_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
