name: Documentation Link Checker
on:
  push:
    paths:
    - docs/**/*.md
    - README.md
    - .codex/*.md
    - scripts/*.md
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    paths:
    - docs/**/*.md
    - README.md
    - .codex/*.md
    - scripts/*.md
  schedule:
  - cron: 0 0 * * 0
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  wec-gate:
    name: "WEC gate \u2014 check documentation-link-checker.yml checkbox"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
    - name: Read WEC checkbox and draft status from PR
      id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: "# On non-PR events (push, schedule), always run\nif [ \"${{ github.event_name\
        \ }}\" != \"pull_request\" ]; then\n  echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"\U0001F4CB Non-PR event \u2014 link check will run.\"\n  exit 0\n\
        fi\n\n# Skip on DRAFT PRs \u2014 doc link checker is optional in draft mode\n\
        IS_DRAFT=\"${{ github.event.pull_request.draft }}\"\nif [ \"$IS_DRAFT\" =\
        \ \"true\" ]; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"\U0001F4CB\
        \ DRAFT PR \u2014 documentation-link-checker.yml is optional (skip=true).\"\
        \n  exit 0\nfi\n\nBODY=$(gh pr view \"${PR_NUMBER}\" --repo \"${REPO}\" --json\
        \ body --jq '.body // \"\"' 2>/dev/null || echo \"\")\n\n# Extract only the\
        \ WEC section to avoid false matches in code examples/comments.\nWEC_SECTION=$(echo\
        \ \"$BODY\" | awk '\n  /^## \U0001F504 Workflow Execution Checklist/ { found=1\
        \ }\n  found && /^## / && !/^## \U0001F504 Workflow Execution Checklist/ {\
        \ found=0 }\n  found { print }\n')\n\n# If WEC section is present AND documentation-link-checker.yml\
        \ is explicitly unchecked, skip.\nif [ -n \"$WEC_SECTION\" ]; then\n  if echo\
        \ \"$WEC_SECTION\" | grep -qiE '^\\s*-\\s*\\[\\s*\\]\\s*documentation-link-checker\\\
        .yml'; then\n    echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n    echo \"\U0001F4CB\
        \ WEC: documentation-link-checker.yml is UNCHECKED \u2014 skipping link check.\"\
        \n    exit 0\n  fi\nfi\n\necho \"skip=false\" >> \"$GITHUB_OUTPUT\"\necho\
        \ \"\U0001F4CB WEC gate passed \u2014 proceeding with link check.\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  check-links:
    name: Check documentation links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    needs: wec-gate
    if: needs.wec-gate.outputs.skip != 'true'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Compute files to check
      id: filelist
      run: "EVENT=\"${{ github.event_name }}\"\n\n# Shared exclusion filter applied\
        \ to every scan mode\n_find_all_md() {\n  find . -name \"*.md\" \\\n    -not\
        \ -path \"./node_modules/*\" \\\n    -not -path \"./.git/*\" \\\n    -not\
        \ -path \"./temp/*\" \\\n    -not -path \"./archive/*\" \\\n    -not -path\
        \ \"./cognitive_app/node_modules/*\" \\\n    -not -path \"./.github/workflows/*\"\
        \ \\\n    | sort\n}\n\nif [ \"$EVENT\" = \"schedule\" ]; then\n  echo \"\U0001F4C5\
        \ Scheduled run \u2014 full scan (excluding .github/workflows/)\"\n  FILES=$(_find_all_md)\n\
        else\n  # Diff-based: only files changed vs the merge base\n  BASE_SHA=\"\
        ${{ github.event.before || github.event.pull_request.base.sha }}\"\n  if [\
        \ -z \"$BASE_SHA\" ] || [ \"$BASE_SHA\" = \"0000000000000000000000000000000000000000\"\
        \ ]; then\n    BASE_SHA=\"HEAD~1\"\n  fi\n  # Build the changed list; fall\
        \ back to full scan if diff fails (e.g. shallow)\n  DIFF_FILES=$(git diff\
        \ --name-only \"$BASE_SHA\" HEAD -- '*.md' 2>/dev/null \\\n    | grep -v '^\\\
        .github/workflows/' \\\n    | grep -v '^node_modules/' \\\n    | grep -v '^temp/'\
        \ \\\n    | grep -v '^archive/' \\\n    | xargs -I{} sh -c '[ -f \"{}\" ]\
        \ && echo \"{}\"' 2>/dev/null || true)\n\n  if [ -z \"$DIFF_FILES\" ] && [\
        \ \"$BASE_SHA\" != \"HEAD~1\" ]; then\n    echo \"\u26A0\uFE0F  Diff empty\
        \ or failed \u2014 falling back to full scan\"\n    FILES=$(_find_all_md)\n\
        \  else\n    FILES=\"$DIFF_FILES\"\n  fi\n  echo \"\U0001F4DD Diff-based:\
        \ $(echo \"$FILES\" | grep -c . || echo 0) file(s) to check\"\nfi\n\necho\
        \ \"$FILES\" > /tmp/md_files.txt\nFILE_COUNT=$(grep -c . /tmp/md_files.txt\
        \ 2>/dev/null || echo 0)\necho \"file_count=$FILE_COUNT\" >> \"$GITHUB_OUTPUT\"\
        \necho \"\U0001F4CA Candidate file count: $FILE_COUNT\"\n"
    - name: Restore per-file checksum cache
      id: per_file_cache
      uses: actions/cache@v5
      with:
        path: .link-check-per-file.json
        key: link-check-per-file-${{ github.ref_name }}
        restore-keys: 'link-check-per-file-

          '
    - name: Compute changed files vs per-file cache
      id: changed_files
      run: "python3 - <<'PYEOF'\nimport json, hashlib, os\n\nCACHE_FILE = \".link-check-per-file.json\"\
        \nMD_FILES_LIST = \"/tmp/md_files.txt\"\n\n# Load previous per-file results\n\
        prev = {}\nif os.path.exists(CACHE_FILE):\n    try:\n        with open(CACHE_FILE)\
        \ as f:\n            prev = json.load(f)\n    except Exception:\n        prev\
        \ = {}\n\n# Read candidate files\nwith open(MD_FILES_LIST) as f:\n    files\
        \ = [ln.strip() for ln in f if ln.strip()]\n\nto_check = []\nfor fp in files:\n\
        \    if not os.path.isfile(fp):\n        continue\n    with open(fp, \"rb\"\
        ) as _fh:\n        _sha = hashlib.sha1()\n        while chunk := _fh.read(65536):\n\
        \            _sha.update(chunk)\n        h = _sha.hexdigest()\n    if prev.get(fp)\
        \ != h:\n        to_check.append(fp)\n\nwith open(\"/tmp/md_changed.txt\"\
        , \"w\") as f:\n    f.write(\"\\n\".join(to_check))\n\nprint(f\"Candidate\
        \ files: {len(files)}, Changed/new: {len(to_check)}\")\nwith open(os.environ[\"\
        GITHUB_OUTPUT\"], \"a\") as fh:\n    fh.write(f\"changed_count={len(to_check)}\\\
        n\")\nPYEOF\n"
    - name: Check if link check is needed
      id: skip_check
      run: "CHANGED=\"${{ steps.changed_files.outputs.changed_count }}\"\nif [ \"\
        ${CHANGED:-0}\" = \"0\" ]; then\n  echo \"\u2705 All candidate files are cache-fresh\
        \ \u2014 skipping link check\"\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\
        \nelse\n  echo \"\U0001F4DD ${CHANGED} file(s) changed \u2014 running link\
        \ check\"\n  echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Set up Node.js
      if: steps.skip_check.outputs.skip != 'true'
      uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Install markdown-link-check
      if: steps.skip_check.outputs.skip != 'true'
      run: npm install -g markdown-link-check
    - name: Verify link check config
      if: steps.skip_check.outputs.skip != 'true'
      run: "# The .markdown-link-check.json config file should already exist in the\
        \ repo\nif [ ! -f .markdown-link-check.json ]; then\n  echo \"\u274C ERROR:\
        \ .markdown-link-check.json not found!\"\n  exit 1\nfi\necho \"\u2705 Using\
        \ existing .markdown-link-check.json configuration\"\ncat .markdown-link-check.json\n"
    - name: Check links in documentation
      if: steps.skip_check.outputs.skip != 'true'
      run: "echo \"\U0001F50D Checking $(wc -l < /tmp/md_changed.txt) file(s)...\"\
        \nwhile IFS= read -r file; do\n  [ -z \"$file\" ] && continue\n  echo \"Checking:\
        \ $file\"\n  markdown-link-check \"$file\" --config .markdown-link-check.json\
        \ || true\ndone < /tmp/md_changed.txt\n"
    - name: Check critical documentation files
      if: steps.skip_check.outputs.skip != 'true'
      run: "echo \"\U0001F50D Checking critical Genesis documentation...\"\n\nCRITICAL_FILES=(\n\
        \  \"docs/admin/GENESIS_SETUP_GUIDE.md\"\n  \"docs/agent/OPERATIONAL_GUIDELINES.md\"\
        \n  \"scripts/AUTONOMOUS_AGENT_README.md\"\n  \"README.md\"\n  \".codex/guardrails.md\"\
        \n)\n\nFAILED=0\nfor file in \"${CRITICAL_FILES[@]}\"; do\n  if [ -f \"$file\"\
        \ ]; then\n    echo \"Checking critical file: $file\"\n    if markdown-link-check\
        \ \"$file\" --config .markdown-link-check.json; then\n      echo \"\u2705\
        \ $file links valid\"\n    else\n      echo \"\u274C $file has broken links\"\
        \n      FAILED=$((FAILED + 1))\n    fi\n  else\n    echo \"\u26A0\uFE0F  $file\
        \ not found\"\n  fi\ndone\n\nif [ $FAILED -gt 0 ]; then\n  echo \"\u274C $FAILED\
        \ critical file(s) have broken links\"\n  exit 1\nelse\n  echo \"\u2705 All\
        \ critical documentation links valid\"\nfi\n"
    - name: Update per-file checksum cache
      if: steps.skip_check.outputs.skip != 'true' && success()
      run: "python3 - <<'PYEOF'\nimport json, hashlib, os\n\nCACHE_FILE = \".link-check-per-file.json\"\
        \nMD_CHANGED = \"/tmp/md_changed.txt\"\n\n# Load existing cache (preserve\
        \ entries for files not checked this run)\ncache = {}\nif os.path.exists(CACHE_FILE):\n\
        \    try:\n        with open(CACHE_FILE) as f:\n            cache = json.load(f)\n\
        \    except Exception:\n        cache = {}\n\n# Update entries for every file\
        \ just checked\nwith open(MD_CHANGED) as f:\n    for fp in [ln.strip() for\
        \ ln in f if ln.strip()]:\n        if os.path.isfile(fp):\n            with\
        \ open(fp, \"rb\") as _fh:\n                _sha = hashlib.sha1()\n      \
        \          while chunk := _fh.read(65536):\n                    _sha.update(chunk)\n\
        \                cache[fp] = _sha.hexdigest()\n\nwith open(CACHE_FILE, \"\
        w\") as f:\n    json.dump(cache, f, indent=2)\n\nprint(f\"\u2705 Per-file\
        \ cache updated: {len(cache)} total entries\")\nPYEOF\n"
    - name: Generate link check report
      if: always()
      run: "echo \"\U0001F4CB Generating link check report...\"\nSKIPPED=\"${{ steps.skip_check.outputs.skip\
        \ }}\"\nCHANGED=\"${{ steps.changed_files.outputs.changed_count }}\"\ncat\
        \ > link-check-report.json << EOFREPORT\n{\n  \"timestamp\": \"$(date -u +\"\
        %Y-%m-%dT%H:%M:%SZ\")\",\n  \"workflow\": \"documentation-link-checker\",\n\
        \  \"branch\": \"${{ github.ref_name }}\",\n  \"event\": \"${{ github.event_name\
        \ }}\",\n  \"status\": \"completed\",\n  \"skipped\": \"$SKIPPED\",\n  \"\
        files_checked\": \"${CHANGED:-0}\"\n}\nEOFREPORT\n"
    - name: Upload link check report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: link-check-report
        path: link-check-report.json
        retention-days: 30
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow documentation-link-checker
        2>/dev/null || echo "Cache health: check skipped"

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: check-links
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Documentation Link Checker
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

