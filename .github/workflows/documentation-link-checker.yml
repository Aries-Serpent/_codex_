name: Documentation Link Checker

on:
  push:
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - '.codex/*.md'
      - 'scripts/*.md'
  pull_request:
    # Only run on non-draft PRs by default. DRAFT mode: doc link check is optional.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/**/*.md'
      - 'README.md'
      - '.codex/*.md'
      - 'scripts/*.md'
  schedule:
    # Run weekly to catch broken external links
    - cron: '0 0 * * 0'


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # ── WEC gate — check PR body to decide if link check should run ──────────────
  wec-gate:
    name: "WEC gate — check documentation-link-checker.yml checkbox"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: "Read WEC checkbox and draft status from PR"
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # On non-PR events (push, schedule), always run
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "📋 Non-PR event — link check will run."
            exit 0
          fi

          # Skip on DRAFT PRs — doc link checker is optional in draft mode
          IS_DRAFT="${{ github.event.pull_request.draft }}"
          if [ "$IS_DRAFT" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "📋 DRAFT PR — documentation-link-checker.yml is optional (skip=true)."
            exit 0
          fi

          BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body --jq '.body // ""' 2>/dev/null || echo "")

          # Extract only the WEC section to avoid false matches in code examples/comments.
          WEC_SECTION=$(echo "$BODY" | awk '
            /^## 🔄 Workflow Execution Checklist/ { found=1 }
            found && /^## / && !/^## 🔄 Workflow Execution Checklist/ { found=0 }
            found { print }
          ')

          # If WEC section is present AND documentation-link-checker.yml is explicitly unchecked, skip.
          if [ -n "$WEC_SECTION" ]; then
            if echo "$WEC_SECTION" | grep -qiE '^\s*-\s*\[\s*\]\s*documentation-link-checker\.yml'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "📋 WEC: documentation-link-checker.yml is UNCHECKED — skipping link check."
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "📋 WEC gate passed — proceeding with link check."

  check-links:
    name: "Check documentation links"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: wec-gate
    # Skip when WEC unchecked on PRs; always run on push/schedule
    if: needs.wec-gate.outputs.skip != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute documentation checksum
        id: checksum
        run: |
          echo "🔍 Computing checksum of documentation files..."

          # NOTE: This is Phase 1 aggregate caching (all-or-nothing approach).
          # For granular per-folder/per-file caching (Phase 2-3), see:
          # .codex/WORKFLOW_CACHING_IMPLEMENTATION_PLAN.md

          # Find all markdown files to check
          MD_FILES=$(find . -name "*.md" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./temp/*" \
            -not -path "./archive/*" \
            -not -path "./cognitive_app/node_modules/*" \
            | sort)

          # Create sorted list of file paths + content hashes
          CHECKSUM_INPUT=""
          for file in $MD_FILES; do
            if [ -f "$file" ]; then
              FILE_HASH=$(sha1sum "$file" | cut -d' ' -f1)
              CHECKSUM_INPUT="${CHECKSUM_INPUT}${file}:${FILE_HASH}\n"
            fi
          done

          # Compute aggregate checksum
          AGGREGATE_CHECKSUM=$(echo -e "$CHECKSUM_INPUT" | sha1sum | cut -d' ' -f1)
          echo "aggregate_checksum=$AGGREGATE_CHECKSUM" >> $GITHUB_OUTPUT
          echo "✅ Aggregate checksum: $AGGREGATE_CHECKSUM"

          # Store file list for later use
          echo "$MD_FILES" > /tmp/md_files.txt

      - name: Check cache for previous successful run
        id: cache
        uses: actions/cache@v5
        with:
          path: .link-check-success
          key: link-check-${{ steps.checksum.outputs.aggregate_checksum }}
          restore-keys: |
            link-check-

      - name: Determine if link check is needed
        id: skip_check
        run: |
          if [ -f .link-check-success ]; then
            CACHED_CHECKSUM=$(cat .link-check-success)
            CURRENT_CHECKSUM="${{ steps.checksum.outputs.aggregate_checksum }}"

            if [ "$CACHED_CHECKSUM" = "$CURRENT_CHECKSUM" ]; then
              echo "✅ Documentation unchanged since last successful check"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "📝 Documentation has changed, running link check"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "📝 No cache found, running link check"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.skip_check.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install markdown-link-check
        if: steps.skip_check.outputs.skip != 'true'
        run: npm install -g markdown-link-check

      - name: Verify link check config
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          # The .markdown-link-check.json config file should already exist in the repo
          if [ ! -f .markdown-link-check.json ]; then
            echo "❌ ERROR: .markdown-link-check.json not found!"
            exit 1
          fi
          echo "✅ Using existing .markdown-link-check.json configuration"
          cat .markdown-link-check.json

      - name: Check links in documentation
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          echo "🔍 Checking links in documentation files..."

          # Find all markdown files
          find . -name "*.md" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./temp/*" \
            -not -path "./archive/*" \
            -print0 | while IFS= read -r -d '' file; do
            echo "Checking: $file"
            markdown-link-check "$file" --config .markdown-link-check.json || true
          done

      - name: Check critical documentation files
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          echo "🔍 Checking critical Genesis documentation..."

          CRITICAL_FILES=(
            "docs/admin/GENESIS_SETUP_GUIDE.md"
            "docs/agent/OPERATIONAL_GUIDELINES.md"
            "scripts/AUTONOMOUS_AGENT_README.md"
            "README.md"
            ".codex/guardrails.md"
          )

          FAILED=0
          for file in "${CRITICAL_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "Checking critical file: $file"
              if markdown-link-check "$file" --config .markdown-link-check.json; then
                echo "✅ $file links valid"
              else
                echo "❌ $file has broken links"
                FAILED=$((FAILED + 1))
              fi
            else
              echo "⚠️  $file not found"
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo "❌ $FAILED critical file(s) have broken links"
            exit 1
          else
            echo "✅ All critical documentation links valid"
          fi

      - name: Mark successful check
        if: steps.skip_check.outputs.skip != 'true' && success()
        run: |
          echo "${{ steps.checksum.outputs.aggregate_checksum }}" > .link-check-success
          echo "✅ Saved checksum for future cache hits"

      - name: Generate link check report
        if: always()
        run: |
          echo "📋 Generating link check report..."
          SKIPPED="${{ steps.skip_check.outputs.skip }}"
          cat > link-check-report.json << EOFREPORT
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "workflow": "documentation-link-checker",
            "branch": "${{ github.ref_name }}",
            "status": "completed",
            "skipped": "$SKIPPED",
            "checksum": "${{ steps.checksum.outputs.aggregate_checksum }}"
          }
          EOFREPORT

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: link-check-report
          path: link-check-report.json
          retention-days: 30

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow documentation-link-checker 2>/dev/null || echo "Cache health: check skipped"

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: check-links
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Documentation Link Checker"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
