name: "Token Probe — CODEX Master and Backup Key Health"

"on":
  workflow_dispatch:
    inputs:
      pr_number:
        description: Ignored legacy input; results are available in the Actions job summary
        required: false
        type: string
      require_both_keys:
        description: Fail unless both configured keys can read this repository
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe-tokens:
    name: Probe configured credentials
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0D_base_'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch probe implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          sparse-checkout: .github/scripts/token_probe.py
          sparse-checkout-cone-mode: false

      - name: Probe each configured key without writing to GitHub
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRE_BOTH_KEYS: ${{ inputs.require_both_keys }}
        run: python3 .github/scripts/token_probe.py
