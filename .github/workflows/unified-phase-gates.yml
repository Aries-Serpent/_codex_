name: Phase Gates Suite

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:
    inputs:
      operation:
        description: 'Phase gate operation'
        required: false
        type: choice
        options:
          - phase-8-1-health
          - phase-8-2-triage
          - phase-8-3-performance
          - phase-9-2-cascade
          - phase-9-3-router
          - all
        default: 'all'
  push:
    branches: [main]

jobs:
  # Phase 8.1 Health Monitor (from phase-8-1-health-monitor.yml & phase-8-1-enhanced-health-monitor.yml)
  phase-8-1-health:
    if: github.event.inputs.operation == 'phase-8-1-health' || github.event.inputs.operation == 'all' || !contains(github.event_name, 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase 8.1 Health Monitoring
        run: echo "Running Phase 8.1 health checks..."

  # Phase 8.2 Issue Triage (from phase-8-2-issue-triage.yml)
  phase-8-2-triage:
    if: github.event.inputs.operation == 'phase-8-2-triage' || github.event.inputs.operation == 'all'
    runs-on: ubuntu-latest
    needs: [phase-8-1-health]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 8.2 Issue Triage
        run: echo "Running Phase 8.2 issue triage..."

  # Phase 8.3 Performance Monitor (from phase-8-3-perf-monitor.yml)
  phase-8-3-performance:
    if: github.event.inputs.operation == 'phase-8-3-performance' || github.event.inputs.operation == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase 8.3 Performance Monitoring
        run: echo "Running Phase 8.3 performance checks..."

  # Phase 9.2 Cascade (from phase-9-2-cascade.yml)
  phase-9-2-cascade:
    if: github.event.inputs.operation == 'phase-9-2-cascade' || github.event.inputs.operation == 'all'
    runs-on: ubuntu-latest
    needs: [phase-8-1-health, phase-8-2-triage, phase-8-3-performance]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 9.2 Cascade
        run: echo "Executing Phase 9.2 cascade operations..."

  # Phase 9.3 Router (from phase-9-3-router.yml)
  phase-9-3-router:
    if: github.event.inputs.operation == 'phase-9-3-router' || github.event.inputs.operation == 'all'
    runs-on: ubuntu-latest
    needs: [phase-9-2-cascade]
    steps:
      - uses: actions/checkout@v4
      - name: Phase 9.3 Router
        run: echo "Running Phase 9.3 routing logic..."

  summary:
    if: always()
    runs-on: ubuntu-latest
    needs: [phase-8-1-health, phase-8-2-triage, phase-8-3-performance, phase-9-2-cascade, phase-9-3-router]
    steps:
      - name: Phase gates suite completed
        run: echo "All phase gate operations completed"
