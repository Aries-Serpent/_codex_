name: Performance Monitoring - Regression Detection
on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      check_regressions:
        description: 'Check for regressions in current branch'
        required: false
        default: 'false'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  performance-monitor:
    name: Performance Monitoring & SLA Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q numpy scipy pytest pytest-benchmark

      - name: Load baseline metrics
        run: |
          mkdir -p .codex/perf
          if [ -f .codex/perf/baselines.json ]; then
            echo "Baseline metrics found"
            python -c "
          import json
          with open('.codex/perf/baselines.json', 'r') as f:
            data = json.load(f)
          print(f'Loaded baseline from {data.get(\"metadata\", {}).get(\"execution_date\")}')"
          fi

      - name: Collect current metrics
        id: collect_metrics
        run: |
          python scripts/collect_performance_metrics.py \
            --output metrics_current.json \
            --include-tests \
            --include-workflows
        continue-on-error: true

      - name: Detect regressions
        id: detect_regressions
        run: |
          python scripts/detect_performance_regressions.py \
            --baseline .codex/perf/baselines.json \
            --current metrics_current.json \
            --output regression_report.json \
            --format json
        continue-on-error: true

      - name: Generate performance report
        id: generate_report
        run: |
          python scripts/generate_performance_report.py \
            --metrics metrics_current.json \
            --regressions regression_report.json \
            --output performance_report.md \
            --format markdown
        continue-on-error: true

      - name: Check SLA compliance
        id: sla_check
        run: |
          python -m codex.monitoring.sla_enforcer \
            --baseline .codex/perf/baselines.json \
            --metrics metrics_current.json \
            --pr-comment > sla_check_result.md
          exit_code=$?
          echo "sla_passed=$([[ $exit_code -eq 0 ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          exit 0
        continue-on-error: true

      - name: Comment on PR with SLA results
        if: github.event_name == 'pull_request' && steps.sla_check.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('sla_check_result.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: performance-metrics
          path: |
            metrics_current.json
            regression_report.json
            performance_report.md
            sla_check_result.md
          retention-days: 30

      - name: Block PR on critical regression
        if: github.event_name == 'pull_request' && steps.sla_check.outputs.sla_passed == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            core.setFailed('Performance SLA check failed - PR cannot be merged');

      - name: Store metrics in analytics
        if: always()
        run: |
          python scripts/store_performance_analytics.py \
            --metrics metrics_current.json \
            --run-id ${{ github.run_id }} \
            --commit ${{ github.sha }}
        continue-on-error: true

