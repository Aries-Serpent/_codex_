name: Pre-Release Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.5.5)'
        required: true
        type: string
      skip_tests:
        description: 'Skip test execution (not recommended)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  validate:
    name: Validation & Testing
    runs-on: ubuntu-latest
    outputs:
      validation_passed: ${{ steps.validation.outputs.passed }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      
      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/nox
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install nox build wheel
      
      - name: Run Linting
        run: nox -s lint
        continue-on-error: false
      
      - name: Run Type Checking
        run: nox -s mypy
        continue-on-error: true  # Type checking is advisory
      
      - name: Run Tests
        if: ${{ !inputs.skip_tests }}
        run: |
          nox -s tests > test_results.txt 2>&1
          echo "Exit code: $?" >> test_results.txt
        continue-on-error: false
      
      - name: Run Security Scan
        run: nox -s security
        continue-on-error: false
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test_results.txt
          retention-days: 30
      
      - name: Set Validation Output
        id: validation
        run: echo "passed=true" >> $GITHUB_OUTPUT
  
  audit:
    name: Audit Pipeline
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      audit_score: ${{ steps.audit.outputs.score }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      
      - name: Install Dependencies
        run: |
          pip install -e .
      
      - name: Run Full Audit
        id: audit
        run: |
          python -m scripts.space_traversal.audit_runner run \
            --output audit_report.md
          
          # Extract score from audit results
          if [ -f audit_results.json ]; then
            score=$(jq -r '.overall_score // 0' audit_results.json)
            echo "score=$score" >> $GITHUB_OUTPUT
          else
            echo "score=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Store Trend Data
        run: |
          python -m scripts.space_traversal.audit_runner store-trend
      
      - name: Check Regressions
        run: |
          python -m scripts.space_traversal.audit_runner check-regressions
        continue-on-error: true  # Don't fail release on regressions
      
      - name: Generate Dashboard
        run: |
          python -m scripts.space_traversal.audit_runner dashboard \
            --output audit_dashboard.html
      
      - name: Upload Audit Results
        uses: actions/upload-artifact@v6
        with:
          name: audit-results
          path: |
            audit_report.md
            audit_results.json
            audit_dashboard.html
            audit_trends.db
          retention-days: 90
  
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [validate, audit]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      
      - name: Install Build Tools
        run: |
          pip install build wheel setuptools
          pip install -e .
      
      - name: Create Release Directory
        run: mkdir -p release_artifacts
      
      - name: Download Audit Results
        uses: actions/download-artifact@v4
        with:
          name: audit-results
          path: release_artifacts/
      
      - name: Build Python Distributions
        run: |
          python -m build --sdist --wheel --outdir release_artifacts/
      
      - name: Generate Documentation Bundle
        run: |
          # Generate wiki bundle
          python -m scripts.space_traversal.audit_runner wiki \
            --output release_artifacts/wiki_bundle.zip || echo "Wiki generation failed (non-critical)"
          
          # Generate documentation hub
          python -m scripts.space_traversal.audit_runner docs-hub \
            --output release_artifacts/docs_hub.html || echo "Docs hub generation failed (non-critical)"
          
          # Generate agent interface
          python -m scripts.space_traversal.audit_runner agent-interface \
            --output release_artifacts/agent_interface.html || echo "Agent interface generation failed (non-critical)"
      
      - name: Create Release Log
        run: |
          cat > release_artifacts/RELEASE_LOG.md << 'EOF'
          # Release Log - Pre-release v${{ inputs.version }}-pre.$(date +%Y%m%d)
          
          ## Validation Results
          - ✅ Linting: Passed
          - ✅ Type Checking: Completed
          - ✅ Tests: ${{ inputs.skip_tests && 'Skipped' || 'Passed' }}
          - ✅ Security Scan: Passed
          - ✅ Audit Score: ${{ needs.audit.outputs.audit_score }}
          
          ## Generated Artifacts
          - Source distribution (.tar.gz)
          - Wheel distribution (.whl)
          - Audit report (audit_report.md)
          - HTML dashboard (audit_dashboard.html)
          - Wiki bundle (wiki_bundle.zip)
          - Documentation hub (docs_hub.html)
          - Agent interface (agent_interface.html)
          
          ## Build Information
          - Timestamp: $(date -Iseconds)
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Triggered by: ${{ github.actor }}
          
          ## Next Steps
          1. Review generated artifacts
          2. Test installation in clean environment
          3. Create GitHub release with these artifacts
          4. Deploy documentation to GitHub Wiki
          5. Notify team of pre-release availability
          EOF
      
      - name: List Artifacts
        run: |
          echo "Generated artifacts:"
          ls -lh release_artifacts/
      
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-artifacts
          path: release_artifacts/
          retention-days: 90
  
  integration-test:
    name: Integration Testing
    runs-on: ubuntu-latest
    needs: build-artifacts
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release_artifacts/
      
      - name: Test Installation from Wheel
        run: |
          # Create clean virtual environment
          python -m venv test_env
          source test_env/bin/activate
          
          # Install from wheel
          pip install release_artifacts/*.whl
          
          # Test imports
          python -c "
          import sys
          print('Testing imports...')
          
          try:
              import codex.cli
              print('✅ codex.cli imported successfully')
          except Exception as e:
              print(f'❌ Failed to import codex.cli: {e}')
              sys.exit(1)
          
          try:
              import codex.logging.session_logger
              print('✅ codex.logging.session_logger imported successfully')
          except Exception as e:
              print(f'❌ Failed to import codex.logging.session_logger: {e}')
              sys.exit(1)
          
          print('✅ All imports successful')
          "
          
          deactivate
      
      - name: Integration Test Summary
        run: |
          echo "✅ Integration tests passed"
          echo "Package can be installed and core modules imported successfully"
  
  create-pre-release:
    name: Create Pre-Release
    runs-on: ubuntu-latest
    needs: [validate, audit, build-artifacts, integration-test]
    if: success()
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release_artifacts/
      
      - name: Create Release Tag
        id: create_tag
        run: |
          VERSION="v${{ inputs.version }}-pre.$(date +%Y%m%d)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$VERSION" -m "Pre-release $VERSION"
          git push origin "$VERSION"
      
      - name: Create GitHub Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.create_tag.outputs.version }}"
          
          gh release create "$VERSION" \
            --title "Pre-Release $VERSION" \
            --notes-file release_artifacts/RELEASE_LOG.md \
            --prerelease \
            release_artifacts/audit_report.md \
            release_artifacts/audit_dashboard.html \
            release_artifacts/wiki_bundle.zip \
            release_artifacts/docs_hub.html \
            release_artifacts/agent_interface.html \
            release_artifacts/*.tar.gz \
            release_artifacts/*.whl
      
      - name: Log Release Event
        run: |
          mkdir -p .codex/sessions
          echo '{
            "timestamp": "'$(date -Iseconds)'",
            "event_type": "pre_release_created",
            "version": "'${{ steps.create_tag.outputs.version }}'",
            "validation": "passed",
            "audit_score": "${{ needs.audit.outputs.audit_score }}",
            "actor": "${{ github.actor }}",
            "artifacts": ['$(ls -1 release_artifacts/ | jq -R -s -c 'split("\n")[:-1]')']
          }' >> .codex/sessions/release_log.jsonl
      
      - name: Summary
        run: |
          echo "## Pre-Release Created Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.create_tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Audit Score**: ${{ needs.audit.outputs.audit_score }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the pre-release at https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY
          echo "2. Test the pre-release in staging environment" >> $GITHUB_STEP_SUMMARY
          echo "3. Deploy wiki bundle to GitHub Wiki" >> $GITHUB_STEP_SUMMARY
          echo "4. Notify team of pre-release availability" >> $GITHUB_STEP_SUMMARY
          echo "5. Promote to full release when ready" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: create-pre-release
    if: always()
    
    steps:
      - name: Notification Summary
        run: |
          if [ "${{ needs.create-pre-release.result }}" == "success" ]; then
            echo "✅ Pre-release deployment completed successfully"
          else
            echo "❌ Pre-release deployment failed"
          fi
          
          # In production, add webhook notifications here
          # e.g., Slack, Teams, Discord notifications
