name: Workflow Expiry Enforcer — Auto-disable on expiry
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
true:
  push:
    branches:
    - '**'
  workflow_dispatch: {}
  schedule:
  - cron: 17 3 * * *
jobs:
  enforce:
    name: Check approval window and disable workflows if expired
    runs-on:
    - self-hosted
    - linux
    timeout-minutes: 10
    steps:
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow workflow-expiry-enforcer
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Raw checkout (git)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "set -euo pipefail\nREPO=\"https://github.com/${{ github.repository }}.git\"\
        \nif [ -n \"${GITHUB_TOKEN:-}\" ]; then\n  REPO=\"https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${{\
        \ github.repository }}.git\"\nfi\ngit init .\nif git remote get-url origin\
        \ >/dev/null 2>&1; then\n  git remote set-url origin \"${REPO}\"\nelse\n \
        \ git remote add origin \"${REPO}\"\nfi\ngit fetch --no-tags --prune --depth=1\
        \ origin \"${GITHUB_SHA}\"\ngit checkout --force \"${GITHUB_SHA}\"\ngit reset\
        \ --hard \"${GITHUB_SHA}\"\ngit clean -fdx\n"
    - name: Autonomy Registry gate check
      continue-on-error: true
      run: "python scripts/ci/autonomy_gate_check.py \\\n  --surface AUT-009 \\\n\
        \  --class REPO_STATE_WRITE \\\n  --actor \"${{ github.actor }}\" || true\n"
    - name: Enforce expiry (move workflows if expired)
      env:
        GIT_AUTHOR_NAME: codex-bot
        GIT_AUTHOR_EMAIL: codex-bot@users.noreply.github.com
        GIT_COMMITTER_NAME: codex-bot
        GIT_COMMITTER_EMAIL: codex-bot@users.noreply.github.com
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      shell: bash
      run: 'set -euo pipefail

        bash scripts/ci/workflow_expiry_enforcer.sh

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  rescue-comment-push:
    name: Post rescue comment on push failure
    runs-on: ubuntu-latest
    needs: enforce
    if: failure() && github.event_name == 'push'
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Workflow Expiry Enforcer
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.ref_name }}
      run: python scripts/ci/post_rescue_comment.py
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
