name: Workflow Expiry Enforcer — Auto-disable on expiry

permissions:
  contents: write

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"  # daily best-effort check


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  enforce:
    name: Check approval window and disable workflows if expired
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow workflow-expiry-enforcer 2>/dev/null || echo "Cache health: check skipped"
      - name: Raw checkout (git)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          set -euo pipefail
          REPO="https://github.com/${{ github.repository }}.git"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            REPO="https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git init .
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${REPO}"
          else
            git remote add origin "${REPO}"
          fi
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"
          git reset --hard "${GITHUB_SHA}"
          git clean -fdx

      # ── Autonomy Registry gate check (Phase 1 wiring) ──────────────────────
      - name: Autonomy Registry gate check
        continue-on-error: true
        run: |
          python scripts/ci/autonomy_gate_check.py \
            --surface AUT-009 \
            --class REPO_STATE_WRITE \
            --actor "${{ github.actor }}" || true

      - name: Enforce expiry (move workflows if expired)
        # Autonomy gate: REPO_STATE_WRITE (archives/moves workflow files via git)
        env:
          GIT_AUTHOR_NAME: "codex-bot"
          GIT_AUTHOR_EMAIL: "codex-bot@users.noreply.github.com"
          GIT_COMMITTER_NAME: "codex-bot"
          GIT_COMMITTER_EMAIL: "codex-bot@users.noreply.github.com"
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/workflow_expiry_enforcer.sh

  rescue-comment-push:
    name: Post rescue comment on push failure
    runs-on: ubuntu-latest
    needs: enforce
    if: failure() && github.event_name == 'push'
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Workflow Expiry Enforcer"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: python scripts/ci/post_rescue_comment.py
