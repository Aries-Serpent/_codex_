name: "Workflow Expiry Enforcer \u2014 Auto-disable on expiry"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
on:
  push:
    branches:
    - '**'
  workflow_dispatch: {}
  schedule:
  - cron: 17 3 * * *
jobs:
  enforce:
    name: Check approval window and disable workflows if expired
    runs-on:
    - self-hosted
    - linux
    timeout-minutes: 10
    steps:
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow workflow-expiry-enforcer
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Raw checkout (git)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: 'set -euo pipefail

        REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository
        }}.git"

        rm -rf .git

        git init -q

        git remote add origin "${REPO}"

        git fetch --depth=1 origin "${{ github.sha }}"

        git checkout -qf FETCH_HEAD

        '
    - name: Autonomy Registry gate check
      continue-on-error: true
      run: 'python scripts/ci/autonomy_gate_check.py \

        --surface AUT-009 \

        --class INFRA_WRITE \

        --no-fail

        '
    - name: Enforce expiry (move workflows if expired)
      shell: bash
      run: 'set -euo pipefail

        bash scripts/ci/workflow_expiry_enforcer.sh

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  rescue-comment-push:
    name: Post rescue comment on push failure
    runs-on: ubuntu-latest
    needs: enforce
    if: failure() && github.event_name == 'push'
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 45
