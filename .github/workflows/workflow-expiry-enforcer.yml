name: Workflow Expiry Enforcer — Auto-disable on expiry

permissions:
  contents: write

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"  # daily best-effort check


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  enforce:
    name: Check approval window and disable workflows if expired
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow workflow-expiry-enforcer 2>/dev/null || echo "Cache health: check skipped"
      - name: Raw checkout (git)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          set -euo pipefail
          REPO="https://github.com/${{ github.repository }}.git"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            REPO="https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git init .
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${REPO}"
          else
            git remote add origin "${REPO}"
          fi
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"
          git reset --hard "${GITHUB_SHA}"
          git clean -fdx

      - name: Enforce expiry (move workflows if expired)
        env:
          GIT_AUTHOR_NAME: "codex-bot"
          GIT_AUTHOR_EMAIL: "codex-bot@users.noreply.github.com"
          GIT_COMMITTER_NAME: "codex-bot"
          GIT_COMMITTER_EMAIL: "codex-bot@users.noreply.github.com"
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/workflow_expiry_enforcer.sh

  rescue-comment-push:
    name: Post rescue comment on push failure
    runs-on: ubuntu-latest
    needs: enforce
    if: failure() && github.event_name == 'push'
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post @copilot rescue comment to associated PR
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Workflow Expiry Enforcer"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; repo=os.environ["REPO"]
          commit_sha=os.environ["COMMIT_SHA"]; run_id=os.environ["RUN_ID"]
          run_url=os.environ["RUN_URL"]; workflow=os.environ["WORKFLOW_NAME"]
          branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-push:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          owner=repo.split("/")[0]
          _,prs=gh("GET",f"/repos/{repo}/pulls?state=open&head={owner}:{branch}&per_page=10")
          if not prs or not isinstance(prs,list):
            print(f"No open PR for branch {branch} — skipping rescue comment"); sys.exit(0)
          pr_number=prs[0]["number"]
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** workflow failed on push to `{branch}` (commit `{sha_short}`).\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: rescue-comment-push job (S237)_\n\n_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments)<100: break
            page+=1
          if existing_id:
            append=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
