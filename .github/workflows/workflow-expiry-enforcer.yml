name: Workflow Expiry Enforcer — Auto-disable on expiry

permissions:
  contents: write

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"  # daily best-effort check

jobs:
  enforce:
    name: Check approval window and disable workflows if expired
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Raw checkout (git)
        shell: bash
        run: |
          set -euo pipefail
          REPO="https://github.com/${{ github.repository }}.git"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            REPO="https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git init .
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${REPO}"
          else
            git remote add origin "${REPO}"
          fi
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force "${GITHUB_SHA}"
          git reset --hard "${GITHUB_SHA}"
          git clean -fdx

      - name: Enforce expiry (move workflows if expired)
        env:
          GIT_AUTHOR_NAME: "codex-bot"
          GIT_AUTHOR_EMAIL: "codex-bot@users.noreply.github.com"
          GIT_COMMITTER_NAME: "codex-bot"
          GIT_COMMITTER_EMAIL: "codex-bot@users.noreply.github.com"
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/workflow_expiry_enforcer.sh
