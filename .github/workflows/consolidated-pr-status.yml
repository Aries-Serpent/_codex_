---
# consolidated-pr-status.yml
#
# Reusable workflow — Consolidated PR Status Dashboard
#
# GOAL: Replace the pattern where every workflow posts its own separate PR
# comment (creating comment noise) with a single "📊 PR Status Dashboard"
# comment that is updated by all workflows.
#
# HOW TO MIGRATE AN EXISTING WORKFLOW
# ------------------------------------
# Replace the step that creates a standalone comment:
#
#   # ❌ Old pattern (creates comment noise)
#   - uses: actions/github-script@v9
#     with:
#       script: |
#         github.rest.issues.createComment({
#           issue_number: context.issue.number,
#           owner: context.repo.owner,
#           repo: context.repo.repo,
#           body: "## My Workflow Results\n\n..."
#         })
#
#   # ✅ New pattern (updates the consolidated dashboard)
#   - uses: ./.github/actions/post-pr-summary
#     with:
#       workflow-name: 'My Workflow'
#       status: 'success'          # success | failure | warning | info | skipped
#       summary: 'All checks passed'
#       details: |
#         | Check | Result |
#         |-------|--------|
#         | Lint  | ✅ clean |
#
# Or call this reusable workflow:
#
#   consolidate-status:
#     uses: ./.github/workflows/consolidated-pr-status.yml
#     with:
#       workflow-name: 'My Workflow'
#       status: 'success'
#       summary: 'All checks passed'
#     secrets:
#       github-token: ${{ secrets.GITHUB_TOKEN }}

name: 'Consolidated PR Status'

on:
  workflow_call:
    inputs:
      workflow-name:
        description: 'Name of the calling workflow shown in dashboard'
        type: string
        required: true
      status:
        description: 'success | failure | warning | info | skipped | in_progress'
        type: string
        required: true
      summary:
        description: 'One-line result description'
        type: string
        required: false
        default: ''
      details:
        description: 'Extended markdown details (optional)'
        type: string
        required: false
        default: ''
      duration-seconds:
        description: 'Workflow run duration in seconds (included in dashboard for triage)'
        type: number
        required: false
        default: 0
    secrets:
      github-token:
        description: 'GitHub token with issues:write permission'
        required: false

jobs:
  post-dashboard:
    name: 'Update PR Status Dashboard'
    runs-on: ubuntu-latest
    # Only run on pull request context
    if: github.event_name == 'pull_request' || github.event.pull_request != null

    steps:
      - name: Checkout (for consolidator script)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/ci/pr_comment_consolidator.py
            src/codex/monitoring/
            .github/actions/post-pr-summary/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          cache: pip
          python-version: '3.12'

      - name: Build details with duration
        id: build-details
        shell: bash
        run: |
          DETAILS="${{ inputs.details }}"
          DURATION_INPUT="${{ inputs.duration-seconds }}"
          if (( ${DURATION_INPUT:-0} > 0 )) 2>/dev/null; then
            DURATION_MIN=$(( DURATION_INPUT / 60 ))
            DURATION_SEC=$(( DURATION_INPUT % 60 ))
            DETAILS="${DETAILS}\n\n_⏱ Duration: ${DURATION_MIN}m ${DURATION_SEC}s_"
          fi
          # Escape for GitHub Actions output
          echo "details<<EOF" >> "$GITHUB_OUTPUT"
          printf '%b' "$DETAILS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post to consolidated dashboard
        uses: ./.github/actions/post-pr-summary
        with:
          workflow-name: ${{ inputs.workflow-name }}
          status: ${{ inputs.status }}
          summary: ${{ inputs.summary }}
          details: ${{ steps.build-details.outputs.details }}
          github-token: ${{ secrets.github-token || github.token }}
