name: Consolidated PR Status
true:
  workflow_call:
    inputs:
      workflow-name:
        description: Name of the calling workflow shown in dashboard
        type: string
        required: true
      status:
        description: success | failure | warning | info | skipped | in_progress
        type: string
        required: true
      summary:
        description: One-line result description
        type: string
        required: false
        default: ''
      details:
        description: Extended markdown details (optional)
        type: string
        required: false
        default: ''
      duration-seconds:
        description: Workflow run duration in seconds (included in dashboard for triage)
        type: number
        required: false
        default: 0
    secrets:
      github-token:
        description: GitHub token with issues:write permission
        required: false
      CODEX_MASTER_KEY:
        description: Elevated GitHub token for enhanced API access
        required: false
      CODEX_BACKUP_KEY:
        description: Backup elevated GitHub token
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  post-dashboard:
    name: Update PR Status Dashboard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event.pull_request != null
    steps:
    - name: Checkout (for consolidator script)
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        sparse-checkout: 'scripts/ci/pr_comment_consolidator.py

          src/codex/monitoring/

          .github/actions/post-pr-summary/

          '
        sparse-checkout-cone-mode: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Build details with duration
      id: build-details
      shell: bash
      env:
        INPUT_DETAILS: ${{ inputs.details }}
        INPUT_DURATION_SECONDS: ${{ inputs.duration-seconds }}
      run: "DETAILS=\"${INPUT_DETAILS}\"\nDURATION_INPUT=\"${INPUT_DURATION_SECONDS}\"\
        \nif (( ${DURATION_INPUT:-0} > 0 )) 2>/dev/null; then\n  DURATION_MIN=$((\
        \ DURATION_INPUT / 60 ))\n  DURATION_SEC=$(( DURATION_INPUT % 60 ))\n  DETAILS=\"\
        ${DETAILS}\\n\\n_\u23F1 Duration: ${DURATION_MIN}m ${DURATION_SEC}s_\"\nfi\n\
        # Escape for GitHub Actions output\necho \"details<<EOF\" >> \"$GITHUB_OUTPUT\"\
        \nprintf '%b' \"$DETAILS\" >> \"$GITHUB_OUTPUT\"\necho \"EOF\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Post to consolidated dashboard
      uses: ./.github/actions/post-pr-summary
      with:
        workflow-name: ${{ inputs.workflow-name }}
        status: ${{ inputs.status }}
        summary: ${{ inputs.summary }}
        details: ${{ steps.build-details.outputs.details }}
        github-token: ${{ secrets.github-token || github.token }}
    timeout-minutes: 30
