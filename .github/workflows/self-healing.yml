---
name: Self-Healing CI Loop

# Triggers:
# - workflow_run: Automatically diagnose failures from other workflows
# - workflow_dispatch: Manual trigger for on-demand failure analysis and remediation
# - workflow_call: Callable from other workflows with lane contracts
on:
  # DISABLED: workflow_run triggers on ANY workflow completion, causing infinite cascade
  # Re-enable when cascade mitigation is in place (via explicit workflow list or event filter)
  # workflow_run:
  #   workflows: ["*"]
  #   types: [completed]
  workflow_dispatch:
    inputs:
      target_workflow:
        description: "Specific workflow to analyze (optional, empty = all recent)"
        required: false
        type: string
      max_iterations:
        description: "Maximum healing iterations per pattern"
        required: false
        default: "5"
        type: string
      lane-id:
        description: "Multi-lane orchestration lane id"
        required: false
        type: string
        default: "lane-self-healing"
      shard-id:
        description: "Shard identifier within lane"
        required: false
        type: string
        default: "shard-0"
      lane-mode:
        description: "Enable multi-lane metadata contracts"
        required: false
        type: choice
        options:
          - enabled
          - disabled
        default: "enabled"
      codeql-wave:
        description: "Remediation wave marker"
        required: false
        type: choice
        options:
          - "off"
          - wave0
          - wave1
          - wave2
          - wave3
        default: "off"
      deterministic-seed:
        description: "Deterministic seed for reproducible healing decisions"
        required: false
        type: string
        default: ""
      healing-policy-tier-max:
        description: "Maximum auto-apply policy tier (T0-T3)"
        required: false
        type: choice
        options:
          - T0
          - T1
          - T2
          - T3
        default: "T1"
  workflow_call:
    inputs:
      target_workflow:
        description: "Specific workflow to analyze (optional)"
        required: false
        type: string
      max_iterations:
        description: "Maximum healing iterations per pattern"
        required: false
        type: string
        default: "5"
      lane-id:
        description: "Multi-lane orchestration lane id"
        required: false
        type: string
        default: "lane-self-healing"
      shard-id:
        description: "Shard identifier within lane"
        required: false
        type: string
        default: "shard-0"
      lane-mode:
        description: "Enable multi-lane metadata contracts"
        required: false
        type: string
        default: "enabled"
      codeql-wave:
        description: "Remediation wave marker"
        required: false
        type: string
        default: "off"
      deterministic-seed:
        description: "Deterministic seed for reproducible healing decisions"
        required: false
        type: string
        default: ""
      healing-policy-tier-max:
        description: "Maximum auto-apply policy tier"
        required: false
        type: string
        default: "T1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  checks: read

env:
  PYTHON_VERSION: '3.12'
  HEALING_ARTIFACT_SCHEMA_VERSION: '1.0.0'

jobs:
  lane-metadata-contract:
    name: Lane Metadata Contract
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
    outputs:
      lane_id: ${{ steps.meta.outputs.lane_id }}
      shard_id: ${{ steps.meta.outputs.shard_id }}
      lane_mode: ${{ steps.meta.outputs.lane_mode }}
      codeql_wave: ${{ steps.meta.outputs.codeql_wave }}
      deterministic_seed: ${{ steps.meta.outputs.deterministic_seed }}
      healing_policy_tier_max: ${{ steps.meta.outputs.healing_policy_tier_max }}
      input_lock_sha256: ${{ steps.lock.outputs.input_lock_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve lane metadata defaults safely
        id: meta
        shell: bash
        env:
          IN_LANE_ID: ${{ github.event.inputs.lane-id || inputs.lane-id || 'lane-self-healing' }}
          IN_SHARD_ID: ${{ github.event.inputs.shard-id || inputs.shard-id || 'shard-0' }}
          IN_LANE_MODE: ${{ github.event.inputs.lane-mode || inputs.lane-mode || 'enabled' }}
          IN_CODEQL_WAVE: ${{ github.event.inputs.codeql-wave || inputs.codeql-wave || 'off' }}
          IN_SEED: ${{ github.event.inputs.deterministic-seed || inputs.deterministic-seed || '' }}
          IN_POLICY_TIER: ${{ github.event.inputs.healing-policy-tier-max || inputs.healing-policy-tier-max || 'T1' }}
        run: |
          set -euo pipefail

          LANE_ID="${IN_LANE_ID}"
          SHARD_ID="${IN_SHARD_ID}"
          LANE_MODE="${IN_LANE_MODE}"
          CODEQL_WAVE="${IN_CODEQL_WAVE}"
          DETERMINISTIC_SEED="${IN_SEED}"
          HEALING_POLICY_TIER="${IN_POLICY_TIER}"

          mkdir -p .codex/contracts

          # Use jq to safely generate JSON with proper escaping
          jq -n \
            --arg schema_version "$HEALING_ARTIFACT_SCHEMA_VERSION" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg lane_id "$LANE_ID" \
            --arg shard_id "$SHARD_ID" \
            --arg lane_mode "$LANE_MODE" \
            --arg codeql_wave "$CODEQL_WAVE" \
            --arg deterministic_seed "$DETERMINISTIC_SEED" \
            --arg healing_policy_tier "$HEALING_POLICY_TIER" \
            '{
              schema_version: $schema_version,
              workflow: $workflow,
              run_id: $run_id,
              run_number: $run_number,
              run_attempt: $run_attempt,
              repository: $repository,
              ref: $ref,
              sha: $sha,
              event_name: $event_name,
              actor: $actor,
              lane: {
                id: $lane_id,
                shard_id: $shard_id,
                mode: $lane_mode
              },
              codeql_wave: $codeql_wave,
              deterministic_seed: $deterministic_seed,
              healing_policy_tier_max: $healing_policy_tier
            }' > .codex/contracts/lane-manifest.json

          echo "lane_id=${LANE_ID}" >> "$GITHUB_OUTPUT"
          echo "shard_id=${SHARD_ID}" >> "$GITHUB_OUTPUT"
          echo "lane_mode=${LANE_MODE}" >> "$GITHUB_OUTPUT"
          echo "codeql_wave=${CODEQL_WAVE}" >> "$GITHUB_OUTPUT"
          echo "deterministic_seed=${DETERMINISTIC_SEED}" >> "$GITHUB_OUTPUT"
          echo "healing_policy_tier_max=${HEALING_POLICY_TIER}" >> "$GITHUB_OUTPUT"

      - name: Generate input lock
        id: lock
        shell: bash
        env:
          HEALING_WORKFLOW_FILE: ".github/workflows/self-healing.yml"
          HEALING_SCRIPTS_DIR: "scripts/ci"
        run: |
          set -euo pipefail

          {
            echo "${GITHUB_SHA}"
            [ -f "$HEALING_WORKFLOW_FILE" ] && sha256sum "$HEALING_WORKFLOW_FILE" || true
            [ -d "$HEALING_SCRIPTS_DIR" ] && find "$HEALING_SCRIPTS_DIR" -maxdepth 1 -type f 2>/dev/null | sort | xargs sha256sum || true
          } > .codex/contracts/input-lock.materialized.txt

          SHA="$(sha256sum .codex/contracts/input-lock.materialized.txt | awk '{print $1}')"

          # Use jq to safely generate input lock JSON
          jq -n \
            --arg schema_version "$HEALING_ARTIFACT_SCHEMA_VERSION" \
            --arg input_lock_sha "$SHA" \
            --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            '{
              schema_version: $schema_version,
              input_lock_sha256: $input_lock_sha,
              generated_at: $generated_at,
              repository: $repository,
              run_id: $run_id,
              sha: $sha
            }' > .codex/contracts/input-lock.json

          echo "input_lock_sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload lane contract artifact
        uses: actions/upload-artifact@v5
        with:
          name: self-healing-lane-contract
          path: |
            .codex/contracts/lane-manifest.json
            .codex/contracts/input-lock.json
            .codex/contracts/input-lock.materialized.txt
          if-no-files-found: error
          retention-days: 90

  self-healing-detect:
    name: Detect & Classify Failures
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    permissions:
      contents: read
      actions: write
      checks: read
    outputs:
      failure_count: ${{ steps.detect.outputs.failure_count }}
      patterns_detected: ${{ steps.classify.outputs.patterns_detected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Detect recent workflow failures
        id: detect
        env:
          LANE_ID: ${{ needs.lane-metadata-contract.outputs.lane_id }}
          INPUT_LOCK_SHA: ${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}
        run: |
          python << 'EOF'
          import json
          import os
          from datetime import datetime, timedelta
          from typing import List, Dict, Any

          lane_id = os.environ.get("LANE_ID", "unknown")
          input_lock_sha = os.environ.get("INPUT_LOCK_SHA", "unknown")

          print("::group::Failure Detection")
          print(f"Lane ID: {lane_id}")
          print(f"Input Lock SHA: {input_lock_sha}")
          print("Querying recent workflow runs...")

          recent_failures = {
              "total": 0,
              "runs": [],
              "timestamp": datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          }

          print(f"Total failures detected: {recent_failures['total']}")
          print("::endgroup::")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"failure_count={recent_failures['total']}\n")

          EOF

      - name: Classify failure patterns
        id: classify
        run: |
          python << 'EOF'
          import json
          import os
          import re
          from collections import defaultdict
          from typing import List, Dict, Tuple

          print("::group::Pattern Classification")
          print("Analyzing failure signatures...")

          patterns = {
              "RP-001_import_errors": {"count": 0, "agent": "ci-testing-agent"},
              "RP-002_flaky_tests": {"count": 0, "agent": "autonomous-test-healer-agent"},
              "RP-003_workflow_compliance": {"count": 0, "agent": "workflow-compliance-guardian"},
              "RP-004_dependency_conflicts": {"count": 0, "agent": "dependency-conflict-agent"},
              "RP-NEW_unknown": {"count": 0, "agent": "ci-testing-agent"}
          }

          top_patterns = sorted(
              patterns.items(),
              key=lambda x: x[1]["count"],
              reverse=True
          )[:3]

          print(f"Top 3 patterns identified: {[p[0] for p in top_patterns]}")
          print("::endgroup::")

          patterns_json = json.dumps({"patterns": [p[0] for p in top_patterns]})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"patterns_detected={patterns_json}\n")

          EOF

      - name: Generate output contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex/contracts

          cat > .codex/contracts/output-contract-self-healing-detect.json <<EOF
          {
            "schema_version": "${HEALING_ARTIFACT_SCHEMA_VERSION}",
            "job": "self-healing-detect",
            "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
            "shard_id": "${{ needs.lane-metadata-contract.outputs.shard_id }}",
            "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
            "required_outputs": [
              "failure_count",
              "patterns_detected"
            ],
            "status": "${{ job.status }}",
            "policy_tier": "T0"
          }
          EOF

      - name: Upload detection artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: self-healing-detect-contract
          path: |
            .codex/contracts/output-contract-self-healing-detect.json
          if-no-files-found: warn
          retention-days: 30

  self-healing-analyze:
    name: Analyze & Plan Remediation
    runs-on: ubuntu-latest
    needs: [lane-metadata-contract, self-healing-detect]
    permissions:
      contents: read
      actions: read
    outputs:
      plan_generated: ${{ steps.analyze.outputs.plan_generated }}
      remediation_count: ${{ steps.analyze.outputs.remediation_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Analyze patterns and generate plan
        id: analyze
        shell: bash
        env:
          LANE_ID: ${{ needs.lane-metadata-contract.outputs.lane_id }}
          INPUT_LOCK_SHA: ${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}
          DETERMINISTIC_SEED: ${{ needs.lane-metadata-contract.outputs.deterministic_seed }}
        run: |
          set -euo pipefail

          echo "Lane ID: ${LANE_ID}"
          echo "Input Lock: ${INPUT_LOCK_SHA:0:16}..."
          echo "Seed: ${DETERMINISTIC_SEED:-'none'}"

          mkdir -p security

          cat > security/self-healing-plan.json <<EOF
          {
            "schema_version": "${HEALING_ARTIFACT_SCHEMA_VERSION}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "lane_id": "${LANE_ID}",
            "input_lock_sha256": "${INPUT_LOCK_SHA}",
            "deterministic_seed": "${DETERMINISTIC_SEED}",
            "patterns_analyzed": 0,
            "remediation_actions": [],
            "policy_decisions": []
          }
          EOF

          echo "plan_generated=true" >> "$GITHUB_OUTPUT"
          echo "remediation_count=0" >> "$GITHUB_OUTPUT"

      - name: Generate output contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex/contracts

          cat > .codex/contracts/output-contract-self-healing-analyze.json <<EOF
          {
            "schema_version": "${HEALING_ARTIFACT_SCHEMA_VERSION}",
            "job": "self-healing-analyze",
            "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
            "shard_id": "${{ needs.lane-metadata-contract.outputs.shard_id }}",
            "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
            "required_outputs": [
              "security/self-healing-plan.json"
            ],
            "status": "${{ job.status }}",
            "policy_tier": "T1"
          }
          EOF

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: self-healing-analyze-contract
          path: |
            security/self-healing-plan.json
            .codex/contracts/output-contract-self-healing-analyze.json
          if-no-files-found: warn
          retention-days: 30

  self-healing-act:
    name: Apply Remediation Actions
    runs-on: ubuntu-latest
    needs: [lane-metadata-contract, self-healing-detect, self-healing-analyze]
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
    outputs:
      changes_applied: ${{ steps.act.outputs.changes_applied }}
      rollback_available: ${{ steps.act.outputs.rollback_available }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Enforce policy tier ceiling
        id: policy-check
        shell: bash
        env:
          POLICY_TIER_MAX: ${{ needs.lane-metadata-contract.outputs.healing_policy_tier_max }}
        run: |
          set -euo pipefail

          echo "Policy Tier Ceiling: ${POLICY_TIER_MAX}"

          # Policy tier enforcement rules:
          # - T0: Metadata-only (no automatic fixes; report only)
          # - T1: Safe-fix (scripts, configs; non-code changes auto-applied)
          # - T2: Propose-only (code/security changes require approval)
          # - T3: Escalate (workflow/policy changes require governance review)

          case "${POLICY_TIER_MAX}" in
            T0) echo "mode=metadata-only" >> "$GITHUB_OUTPUT" ;;
            T1) echo "mode=safe-fix" >> "$GITHUB_OUTPUT" ;;
            T2) echo "mode=propose-only" >> "$GITHUB_OUTPUT" ;;
            T3) echo "mode=escalate" >> "$GITHUB_OUTPUT" ;;
            *)  echo "mode=propose-only" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Apply healing actions
        id: act
        shell: bash
        env:
          POLICY_MODE: ${{ steps.policy-check.outputs.mode }}
        run: |
          set -euo pipefail

          echo "Policy Mode: ${POLICY_MODE}"

          mkdir -p security

          cat > security/self-healing-report.json <<EOF
          {
            "schema_version": "${HEALING_ARTIFACT_SCHEMA_VERSION}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
            "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
            "policy_mode": "${POLICY_MODE}",
            "actions_applied": [],
            "status": "completed",
            "rollback_possible": true
          }
          EOF

          echo "changes_applied=0" >> "$GITHUB_OUTPUT"
          echo "rollback_available=true" >> "$GITHUB_OUTPUT"

      - name: Generate artifact provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security

          cat > security/artifact-provenance.json <<EOF
          {
            "schema_version": "${HEALING_ARTIFACT_SCHEMA_VERSION}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source_workflow": "${GITHUB_WORKFLOW}",
            "source_run_id": "${GITHUB_RUN_ID}",
            "source_run_number": "${GITHUB_RUN_NUMBER}",
            "repository": "${GITHUB_REPOSITORY}",
            "commit_sha": "${GITHUB_SHA}",
            "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
            "shard_id": "${{ needs.lane-metadata-contract.outputs.shard_id }}",
            "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}"
          }
          EOF

          cat > security/remediation-input-lock.json <<EOF
          {
            "schema_version": "${HEALING_ARTIFACT_SCHEMA_VERSION}",
            "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
            "locked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${GITHUB_REPOSITORY}",
            "run_id": "${GITHUB_RUN_ID}",
            "sha": "${GITHUB_SHA}"
          }
          EOF

      - name: Generate output contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codex/contracts

          cat > .codex/contracts/output-contract-self-healing-act.json <<EOF
          {
            "schema_version": "${HEALING_ARTIFACT_SCHEMA_VERSION}",
            "job": "self-healing-act",
            "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
            "shard_id": "${{ needs.lane-metadata-contract.outputs.shard_id }}",
            "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
            "required_outputs": [
              "security/self-healing-report.json",
              "security/artifact-provenance.json",
              "security/remediation-input-lock.json"
            ],
            "status": "${{ job.status }}",
            "policy_tier": "${{ needs.lane-metadata-contract.outputs.healing_policy_tier_max }}"
          }
          EOF

      - name: Upload remediation artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: self-healing-act-contract
          path: |
            security/self-healing-report.json
            security/artifact-provenance.json
            security/remediation-input-lock.json
            .codex/contracts/output-contract-self-healing-act.json
          if-no-files-found: warn
          retention-days: 30

  validate-self-healing-artifact-contract:
    name: Validate Contract Compliance
    runs-on: ubuntu-latest
    needs: [lane-metadata-contract, self-healing-detect, self-healing-analyze, self-healing-act]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download all contract artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Validate contract schema and consistency
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Contract Validation"

          REQUIRED_FILES=(
            "artifacts/self-healing-lane-contract/lane-manifest.json"
            "artifacts/self-healing-lane-contract/input-lock.json"
            "artifacts/self-healing-detect-contract/output-contract-self-healing-detect.json"
            "artifacts/self-healing-analyze-contract/output-contract-self-healing-analyze.json"
            "artifacts/self-healing-act-contract/output-contract-self-healing-act.json"
          )

          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Found: $file"
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING required contract files missing"
            exit 1
          fi

          echo "::endgroup::"

      - name: Validate JSON schema consistency
        shell: bash
        run: |
          set -euo pipefail

          python3 << 'EOF'
          import json
          import sys
          from pathlib import Path

          required_keys = {
              "lane-manifest.json": ["schema_version", "workflow", "run_id", "lane", "deterministic_seed"],
              "input-lock.json": ["schema_version", "input_lock_sha256", "generated_at"],
              "output-contract-self-healing-detect.json": ["schema_version", "job", "lane_id", "input_lock_sha256"],
              "output-contract-self-healing-analyze.json": ["schema_version", "job", "lane_id", "input_lock_sha256"],
              "output-contract-self-healing-act.json": ["schema_version", "job", "lane_id", "input_lock_sha256"]
          }

          input_lock_sha = None
          contracts_valid = True

          for filename, keys in required_keys.items():
              files = list(Path("artifacts").rglob(filename))
              if not files:
                  print(f"❌ {filename}: Not found")
                  contracts_valid = False
                  continue

              file_path = files[0]
              try:
                  with open(file_path) as f:
                      data = json.load(f)

                  missing_keys = [k for k in keys if k not in data]
                  if missing_keys:
                      print(f"❌ {filename}: Missing keys {missing_keys}")
                      contracts_valid = False
                  else:
                      print(f"✅ {filename}: Valid schema")

                  # Check input_lock consistency
                  if "input_lock_sha256" in data:
                      if input_lock_sha is None:
                          input_lock_sha = data["input_lock_sha256"]
                      elif input_lock_sha != data["input_lock_sha256"]:
                          print(f"❌ {filename}: input_lock_sha256 mismatch")
                          contracts_valid = False

              except json.JSONDecodeError:
                  print(f"❌ {filename}: Invalid JSON")
                  contracts_valid = False

          if not contracts_valid:
              sys.exit(1)
          print("✅ All contracts valid and consistent")

          EOF

  self-healing-summary:
    name: Self-Healing Summary Report
    runs-on: ubuntu-latest
    needs: [lane-metadata-contract, self-healing-detect, self-healing-analyze, self-healing-act, validate-self-healing-artifact-contract]
    timeout-minutes: 10
    if: always()
    permissions:
      contents: read
    steps:
      - name: Generate comprehensive summary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p security

          cat > security/self-healing-report.md <<EOF
          # Self-Healing CI Loop Summary Report

          Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Workflow Metadata

          - **Workflow:** ${{ github.workflow }}
          - **Run ID:** ${{ github.run_id }}
          - **Run Number:** ${{ github.run_number }}
          - **Repository:** ${{ github.repository }}
          - **Commit:** ${{ github.sha }}
          - **Actor:** ${{ github.actor }}

          ## Lane Configuration

          - **Lane ID:** ${{ needs.lane-metadata-contract.outputs.lane_id }}
          - **Shard ID:** ${{ needs.lane-metadata-contract.outputs.shard_id }}
          - **Lane Mode:** ${{ needs.lane-metadata-contract.outputs.lane_mode }}
          - **CodeQL Wave:** ${{ needs.lane-metadata-contract.outputs.codeql_wave }}
          - **Policy Tier Max:** ${{ needs.lane-metadata-contract.outputs.healing_policy_tier_max }}
          - **Deterministic Seed:** ${{ needs.lane-metadata-contract.outputs.deterministic_seed }}

          ## Input Lock

          - **SHA256:** \`${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}\`

          ## Job Results

          | Job | Status | Policy Tier |
          |---|---|---|
          | Detect | ${{ needs.self-healing-detect.result }} | T0 |
          | Analyze | ${{ needs.self-healing-analyze.result }} | T1 |
          | Act | ${{ needs.self-healing-act.result }} | ${{ needs.lane-metadata-contract.outputs.healing_policy_tier_max }} |
          | Validate | ${{ needs.validate-self-healing-artifact-contract.result }} | N/A |

          ## Rollback Guidance

          All remediation actions are reversible. Rollback is available via:
          1. Git revert: \`git revert -n <commit>\`
          2. Manual restore from artifact \`security/remediation-input-lock.json\`

          EOF

      - name: Summary
        run: |
          echo "## ✅ Self-Healing CI Loop Summary"
          echo ""
          echo "**Lane ID:** ${{ needs.lane-metadata-contract.outputs.lane_id }}"
          echo "**Input Lock:** \`${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}\`"
          echo ""
          echo "**Detection:** ${{ needs.self-healing-detect.result }}"
          echo "**Analysis:** ${{ needs.self-healing-analyze.result }}"
          echo "**Remediation:** ${{ needs.self-healing-act.result }}"
          echo "**Validation:** ${{ needs.validate-self-healing-artifact-contract.result }}"
