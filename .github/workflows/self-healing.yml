name: "Self-Healing CI"

# Canonical self-healing entry-point for AAIS Reliability gate.
# Manual trigger alias for iterative-self-healing-ci.yml (Phase 5 healing loop).
#
# NOTE: iterative-self-healing-ci.yml already subscribes to workflow_run: ["*"],
# so autonomous healing fires automatically. This workflow is the manual
# workflow_dispatch entry-point (visible in the Actions UI) and AAIS marker.

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: "Workflow run ID to heal (leave blank for latest failed)"
        required: false
        type: string
      max_iterations:
        description: "Maximum heal iterations (1-5)"
        required: false
        default: "3"
        type: string

permissions: {}

concurrency:
  group: self-healing-manual-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch-healing:
    name: "Dispatch Iterative Self-Healing CI"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
    steps:
      - name: Dispatch iterative-self-healing-ci.yml
        run: |
          TARGET_RUN="${{ inputs.target_run_id }}"
          MAX_ITER="${{ inputs.max_iterations }}"
          echo "Dispatching iterative-self-healing-ci.yml (target_run_id=${TARGET_RUN:-<latest>}, max_iterations=${MAX_ITER})"
          gh workflow run iterative-self-healing-ci.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f "target_run_id=${TARGET_RUN}" \
            -f "max_iterations=${MAX_ITER}"
          echo "✅ Dispatch sent — iterative-self-healing-ci.yml will handle the healing loop."
