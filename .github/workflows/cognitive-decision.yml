name: Cognitive Decision Engine

on:
  schedule:
    - cron: '15 */6 * * *'  # Every 6 hours at :15
  workflow_dispatch:
    inputs:
      force_analysis:
        description: 'Force causal analysis even if no new data'
        required: false
        default: 'false'
      risk_threshold:
        description: 'Risk threshold for decisions (0-1)'
        required: false
        default: '0.7'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  decision_engine:
    name: Execute Decision Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dowhy causalml scikit-optimize
      
      - name: Run Causal Reasoning Analysis
        id: causal
        run: |
          python scripts/cognitive/causal_reasoning.py \
            --perception-dir cognitive/perceptions/ \
            --output cognitive/decisions/causal_analysis.json \
            --treatment "code_changes" \
            --outcome "test_success_rate" \
            --confidence 0.95
        continue-on-error: true
      
      - name: Optimize Resource Allocation
        id: optimize
        run: |
          python scripts/cognitive/optimize_resources.py \
            --agents 10 \
            --tasks cognitive/decisions/pending_tasks.json \
            --output cognitive/decisions/resource_plan.json \
            --max-time 300
        continue-on-error: true
      
      - name: Allocate Tasks to Agents
        id: allocate
        run: |
          python scripts/cognitive/allocate_tasks.py \
            --resource-plan cognitive/decisions/resource_plan.json \
            --agent-capabilities configs/agent_capabilities.json \
            --output cognitive/decisions/task_allocation.json
        continue-on-error: true
      
      - name: Assess Decision Risks
        id: risk
        run: |
          RISK_THRESHOLD=${{ github.event.inputs.risk_threshold || '0.7' }}
          python scripts/cognitive/assess_risks.py \
            --allocation cognitive/decisions/task_allocation.json \
            --causal cognitive/decisions/causal_analysis.json \
            --threshold $RISK_THRESHOLD \
            --output cognitive/decisions/risk_assessment.json
        continue-on-error: true
      
      - name: Generate Decision Report
        if: always()
        run: |
          mkdir -p cognitive/reports
          cat > cognitive/reports/decision_report.md << 'EOF'
          # Cognitive Decision Engine Report
          
          **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## Execution Summary
          
          | Component | Status | Details |
          |-----------|--------|---------|
          | Causal Reasoning | ${{ steps.causal.outcome }} | DoWhy-based causal inference |
          | Resource Optimization | ${{ steps.optimize.outcome }} | Multi-objective optimization |
          | Task Allocation | ${{ steps.allocate.outcome }} | Agent-task matching |
          | Risk Assessment | ${{ steps.risk.outcome }} | Risk threshold: ${{ github.event.inputs.risk_threshold || '0.7' }} |
          
          ## Key Metrics
          
          - **Causal Effects Identified**: $([ -f cognitive/decisions/causal_analysis.json ] && jq -r '.causal_effects | length' cognitive/decisions/causal_analysis.json || echo "N/A")
          - **Tasks Allocated**: $([ -f cognitive/decisions/task_allocation.json ] && jq -r '.allocations | length' cognitive/decisions/task_allocation.json || echo "N/A")
          - **High-Risk Decisions**: $([ -f cognitive/decisions/risk_assessment.json ] && jq -r '.high_risk_count // 0' cognitive/decisions/risk_assessment.json || echo "0")
          
          ## Decision Recommendations
          
          $([ -f cognitive/decisions/risk_assessment.json ] && jq -r '.recommendations[]' cognitive/decisions/risk_assessment.json || echo "No recommendations available")
          
          ---
          *Generated by Cognitive Decision Engine*
          EOF
      
      - name: Upload Decision Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-engine-results-${{ github.run_number }}
          path: |
            cognitive/decisions/
            cognitive/reports/decision_report.md
          retention-days: 30
      
      - name: Notify on High-Risk Decisions
        if: steps.risk.outcome == 'success'
        run: |
          HIGH_RISK=$(jq -r '.high_risk_count // 0' cognitive/decisions/risk_assessment.json)
          if [ "$HIGH_RISK" -gt 0 ]; then
            echo "⚠️ WARNING: $HIGH_RISK high-risk decisions detected"
            echo "Review required before executing actions"
          fi
