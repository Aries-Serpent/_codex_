name: Workflow Documentation Link Validation

# Link validation workflow with flexible strict mode:
# - PRs: Non-blocking (warn but allow merge) - helps catch issues early without blocking
# - Push to main: Strict mode (fails on errors) - ensures main branch quality
# - Manual runs: Configurable strict mode (default: strict)
# - Scheduled runs: Strict mode (weekly validation)
#
# This prevents PRs from being blocked by link validation failures while still
# maintaining quality standards for the main branch.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/**/*.md'
      - '.github/workflows/**/*.yml'
      - 'docs/**'
      - '**.md'

  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.md'
      - '.github/workflows/**/*.yml'

  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Fail workflow on broken links (default: true for manual runs)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  schedule:
    # Weekly validation on Sunday at 3 AM (strict mode)
    - cron: '0 3 * * 0'

permissions:
  contents: read
  pull-requests: write  # For PR comments

env:
  PYTHON_VERSION: '3.12'


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  validate-workflow-links:
    name: Validate Workflow Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow workflow-link-validation 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: ephemeral

      - name: Install dependencies
        run: |
          # No external dependencies needed for link validation
          echo "Link validation script is self-contained"

      - name: Validate links with intelligent parser
        id: validate
        env:
          # Strict mode: true for push to main and strict manual runs; false for PRs
          STRICT_MODE: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.strict_mode == 'true') }}
        run: |
          echo "STRICT_MODE=$STRICT_MODE"
          python .github/scripts/validate-links.py --fail-on-errors --report-file link-validation-report.json
        # Non-blocking for PRs (report but don't fail)
        # Strict mode for manual runs and scheduled checks
        continue-on-error: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.strict_mode == 'false') }}

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ⚠️ Workflow Documentation Link Validation - Issues Found

            Broken links were found in workflow documentation. These are **non-blocking warnings** for PRs but should be addressed.

            **Common fixes:**
            - Update relative paths to match file locations
            - Ensure linked files exist in the repository
            - Use GitHub URLs for files outside the workflows directory
            - Remove references to consolidated workflows (see Phase 2 consolidation docs)

            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            **Note:** This check is non-blocking for PRs. Manual validation runs with strict mode enabled will fail on broken links.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: link-validation-report
          path: |
            ${{ github.workspace }}/link-validation-report.json
            ${{ github.workspace }}/.github/workflows/*.md
            ${{ github.workspace }}/docs/**/*.md
            ${{ github.workspace }}/*.md
          if-no-files-found: warn
          retention-days: 7

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: validate-workflow-links
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Workflow Link Validation"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: workflow-link-validation.yml → rescue-comment job (S227)_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
