name: Workflow Documentation Link Validation
on:
  pull_request:
    branches:
    - main
    - develop
    paths:
    - .github/workflows/**/*.md
    - .github/workflows/**/*.yml
    - docs/**
    - '**.md'
  push:
    branches:
    - main
    paths:
    - .github/workflows/**/*.md
    - .github/workflows/**/*.yml
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Fail workflow on broken links (default: true for manual runs)'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
  schedule:
  - cron: 0 3 * * 0
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
env:
  PYTHON_VERSION: '3.12'
jobs:
  validate-workflow-links:
    name: Validate Workflow Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install PyYAML (required by setup-python-cached)
      run: pip install pyyaml --quiet
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow workflow-link-validation
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Set up cached Python environment
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: ephemeral
    - name: Install dependencies
      run: '# No external dependencies needed for link validation

        echo "Link validation script is self-contained"

        '
    - name: Validate links with intelligent parser
      id: validate
      env:
        STRICT_MODE: ${{ github.event_name != 'pull_request' && (github.event_name
          != 'workflow_dispatch' || inputs.strict_mode == 'true') }}
      run: 'echo "STRICT_MODE=$STRICT_MODE"

        python .github/scripts/validate-links.py --fail-on-errors --report-file link-validation-report.json

        '
      continue-on-error: ${{ github.event_name == 'pull_request' || (github.event_name
        == 'workflow_dispatch' && inputs.strict_mode == 'false') }}
    - name: Comment on PR
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: "const comment = `## ⚠️ Workflow Documentation Link Validation - Issues\
          \ Found\n\nBroken links were found in workflow documentation. These are\
          \ **non-blocking warnings** for PRs but should be addressed.\n\n**Common\
          \ fixes:**\n- Update relative paths to match file locations\n- Ensure linked\
          \ files exist in the repository\n- Use GitHub URLs for files outside the\
          \ workflows directory\n- Remove references to consolidated workflows (see\
          \ Phase 2 consolidation docs)\n\nSee the [workflow run](${{ github.server_url\
          \ }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\
          \n**Note:** This check is non-blocking for PRs. Manual validation runs with\
          \ strict mode enabled will fail on broken links.`;\n\ngithub.rest.issues.createComment({\n\
          \  issue_number: context.issue.number,\n  owner: context.repo.owner,\n \
          \ repo: context.repo.repo,\n  body: comment\n});\n"
    - name: Upload validation report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: link-validation-report
        path: '${{ github.workspace }}/link-validation-report.json

          ${{ github.workspace }}/.github/workflows/*.md

          ${{ github.workspace }}/docs/**/*.md

          ${{ github.workspace }}/*.md

          '
        if-no-files-found: warn
        retention-days: 14
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: validate-workflow-links
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Workflow Link Validation
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
