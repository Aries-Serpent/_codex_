name: Workflow Documentation Link Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/**/*.md'
      - '.github/workflows/**/*.yml'
      - 'docs/**'
      - '**.md'
  
  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.md'
      - '.github/workflows/**/*.yml'
  
  workflow_dispatch:
  
  schedule:
    # Weekly validation on Sunday at 3 AM
    - cron: '0 3 * * 0'

permissions:
  contents: read
  pull-requests: write  # For PR comments

env:
  PYTHON_VERSION: '3.12'

jobs:
  validate-workflow-links:
    name: Validate Workflow Documentation Links
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: ephemeral
      
      - name: Install dependencies
        run: |
          pip install PyYAML requests markdown-link-validator
      
      - name: Validate workflow documentation links
        id: validate
        run: |
          python << 'EOF'
          import os
          import re
          import yaml
          from pathlib import Path
          from collections import defaultdict
          
          def find_markdown_links(content):
              """Find all markdown links in content."""
              # Match [text](url) and [text]: url
              pattern = r'\[([^\]]+)\]\(([^\)]+)\)|\[([^\]]+)\]:\s*(\S+)'
              matches = re.findall(pattern, content)
              links = []
              for match in matches:
                  if match[1]:
                      links.append((match[0], match[1]))
                  elif match[3]:
                      links.append((match[2], match[3]))
              return links
          
          def validate_local_link(link, base_path):
              """Validate a local file link."""
              # Remove anchors
              link = link.split('#')[0]
              
              # Skip external URLs
              if link.startswith(('http://', 'https://', 'mailto:')):
                  return True, None
              
              # Skip empty or anchor-only links
              if not link or link.startswith('#'):
                  return True, None
              
              # Resolve relative path
              if link.startswith('/'):
                  full_path = Path(link[1:])
              else:
                  full_path = (base_path.parent / link).resolve()
              
              # Check if file exists
              if full_path.exists():
                  return True, None
              else:
                  return False, f"File not found: {full_path}"
          
          # Scan workflow documentation
          workflow_dir = Path('.github/workflows')
          docs_dir = Path('docs')
          
          broken_links = defaultdict(list)
          total_links = 0
          
          # Check workflow markdown files
          for md_file in workflow_dir.rglob('*.md'):
              content = md_file.read_text()
              links = find_markdown_links(content)
              
              for text, link in links:
                  total_links += 1
                  valid, error = validate_local_link(link, md_file)
                  if not valid:
                      broken_links[str(md_file)].append({
                          'text': text,
                          'link': link,
                          'error': error
                      })
          
          # Check YAML workflow files for documentation URLs
          for yml_file in workflow_dir.glob('*.yml'):
              if yml_file.name.endswith('.disabled'):
                  continue
              
              try:
                  with open(yml_file) as f:
                      data = yaml.safe_load(f)
                      
                  # Look for documentation fields
                  content = yml_file.read_text()
                  links = find_markdown_links(content)
                  
                  for text, link in links:
                      total_links += 1
                      valid, error = validate_local_link(link, yml_file)
                      if not valid:
                          broken_links[str(yml_file)].append({
                              'text': text,
                              'link': link,
                              'error': error
                          })
              except Exception as e:
                  print(f"Warning: Could not parse {yml_file}: {e}")
          
          # Generate report
          print(f"\n{'='*60}")
          print("WORKFLOW DOCUMENTATION LINK VALIDATION")
          print(f"{'='*60}\n")
          print(f"Total links checked: {total_links}")
          print(f"Broken links found: {sum(len(v) for v in broken_links.values())}\n")
          
          if broken_links:
              print("BROKEN LINKS:\n")
              for file, links in broken_links.items():
                  print(f"\n{file}:")
                  for link in links:
                      print(f"  - [{link['text']}]({link['link']})")
                      print(f"    Error: {link['error']}")
              
              # Set output for PR comment
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("## ❌ Broken Links Found\n\n")
                  for file, links in broken_links.items():
                      f.write(f"### {file}\n\n")
                      for link in links:
                          f.write(f"- `[{link['text']}]({link['link']})` - {link['error']}\n")
                      f.write("\n")
              
              # Fail the job
              exit(1)
          else:
              print("✅ All links are valid!")
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("## ✅ All Links Valid\n\n")
                  f.write(f"Validated {total_links} links in workflow documentation.\n")
          EOF
      
      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ❌ Workflow Documentation Link Validation Failed
            
            Broken links were found in workflow documentation. Please review the workflow run logs for details.
            
            **Common fixes:**
            - Update relative paths to match file locations
            - Ensure linked files exist in the repository
            - Use GitHub URLs for files outside the workflows directory
            
            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-validation-report
          path: |
            ${{ github.workspace }}/.github/workflows/*.md
          retention-days: 7
