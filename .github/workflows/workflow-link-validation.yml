name: Workflow Documentation Link Validation

# Link validation workflow with flexible strict mode:
# - PRs: Non-blocking (warn but allow merge) - helps catch issues early without blocking
# - Push to main: Strict mode (fails on errors) - ensures main branch quality
# - Manual runs: Configurable strict mode (default: strict)
# - Scheduled runs: Strict mode (weekly validation)
#
# This prevents PRs from being blocked by link validation failures while still
# maintaining quality standards for the main branch.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/**/*.md'
      - '.github/workflows/**/*.yml'
      - 'docs/**'
      - '**.md'

  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.md'
      - '.github/workflows/**/*.yml'

  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Fail workflow on broken links (default: true for manual runs)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  schedule:
    # Weekly validation on Sunday at 3 AM (strict mode)
    - cron: '0 3 * * 0'

permissions:
  contents: read
  pull-requests: write  # For PR comments

env:
  PYTHON_VERSION: '3.12'


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  validate-workflow-links:
    name: Validate Workflow Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow workflow-link-validation 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: ephemeral

      - name: Install dependencies
        run: |
          # No external dependencies needed for link validation
          echo "Link validation script is self-contained"

      - name: Validate links with intelligent parser
        id: validate
        env:
          # Strict mode: true for push to main and strict manual runs; false for PRs
          STRICT_MODE: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.strict_mode == 'true') }}
        run: |
          echo "STRICT_MODE=$STRICT_MODE"
          python .github/scripts/validate-links.py --fail-on-errors --report-file link-validation-report.json
        # Non-blocking for PRs (report but don't fail)
        # Strict mode for manual runs and scheduled checks
        continue-on-error: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.strict_mode == 'false') }}

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const comment = `## ⚠️ Workflow Documentation Link Validation - Issues Found

            Broken links were found in workflow documentation. These are **non-blocking warnings** for PRs but should be addressed.

            **Common fixes:**
            - Update relative paths to match file locations
            - Ensure linked files exist in the repository
            - Use GitHub URLs for files outside the workflows directory
            - Remove references to consolidated workflows (see Phase 2 consolidation docs)

            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            **Note:** This check is non-blocking for PRs. Manual validation runs with strict mode enabled will fail on broken links.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: link-validation-report
          path: |
            ${{ github.workspace }}/link-validation-report.json
            ${{ github.workspace }}/.github/workflows/*.md
            ${{ github.workspace }}/docs/**/*.md
            ${{ github.workspace }}/*.md
          if-no-files-found: warn
          retention-days: 7

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: validate-workflow-links
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Workflow Link Validation"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
