name: Workflow Documentation Link Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/**/*.md'
      - '.github/workflows/**/*.yml'
      - 'docs/**'
      - '**.md'
  
  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.md'
      - '.github/workflows/**/*.yml'
  
  workflow_dispatch:
  
  schedule:
    # Weekly validation on Sunday at 3 AM
    - cron: '0 3 * * 0'

permissions:
  contents: read
  pull-requests: write  # For PR comments

env:
  PYTHON_VERSION: '3.12'

jobs:
  validate-workflow-links:
    name: Validate Workflow Documentation Links
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: ephemeral
      
      - name: Install dependencies
        run: |
          # No external dependencies needed for link validation
          echo "Link validation script is self-contained"
      
      - name: Validate workflow documentation links
        id: validate
        run: |
          python scripts/validate_workflow_links.py --verbose
      
      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ❌ Workflow Documentation Link Validation Failed
            
            Broken links were found in workflow documentation. Please review the workflow run logs for details.
            
            **Common fixes:**
            - Update relative paths to match file locations
            - Ensure linked files exist in the repository
            - Use GitHub URLs for files outside the workflows directory
            
            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-validation-report
          path: |
            ${{ github.workspace }}/.github/workflows/*.md
          retention-days: 7
