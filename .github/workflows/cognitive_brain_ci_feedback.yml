# Cognitive Brain CI Feedback Loop
# Phase 1, Pre-commit 2 (S108): wires report_completion() to actual CI outcomes.
# Triggered after any workflow completes; maps the workflow name to pattern IDs
# via keyword matching, then calls brain.report_completion() for each match.
#
# §6 ADMIN_MANUAL_SETUP_GUIDE.md — permissions declared explicitly here so
# the workflow writes to .codex/ files correctly without requiring UI changes.
#
# PDA: ASSESS phase — CI outcome → brain.report_completion() → pattern update.
# AfterMath: closes the feedback loop identified in cognitive_brain_analysis.md.
#
# Pattern P-046: CI outcomes auto-reported to cognitive brain via keyword map.
# See: docs/coverage/COVERAGE_ROADMAP_40_TO_75.md

name: Cognitive Brain CI Feedback

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

# GROUNDED: Concurrency control prevents exponential cascade.
# This workflow fires on every workflow completion. Without concurrency control,
# its own completion triggers workflow-analytics-unified → which triggers this → ∞ queue.
# cancel-in-progress: true ensures only the latest run executes; duplicates are dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# §6 ADMIN_MANUAL_SETUP_GUIDE.md: explicit permissions block replaces the
# need to set "Read and write" manually in GitHub Settings → Actions.
# This is the least-privilege declaration for this specific workflow.
permissions:
  contents: write       # write .codex/ files (store_memory, session logs)
  pull-requests: write  # post @copilot follow-up comments via mcp_poster
  issues: write         # post issue comments for escalations
  actions: read         # read workflow_run metadata

jobs:
  report-outcome:
    name: Report CI Outcome to Cognitive Brain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pilot phase: internal actor only (Q3-B airtight system).
    # Expand to ORG_OWNER tier when Phase 5 StructuralPolicyManager ships.
    #
    # GROUNDED: Self-exclusion filter breaks the cascade loop.
    # Skip when the triggering workflow is this one or workflow-analytics-unified
    # to prevent A→B→A→B infinite re-trigger chains.
    if: |
      (github.actor == 'mbaetiong' || github.actor == 'github-actions[bot]') &&
      github.event.workflow_run.name != 'Cognitive Brain CI Feedback' &&
      github.event.workflow_run.name != 'Iterative Self-Healing CI' &&
      github.event.workflow_run.name != 'Cognitive Action & Decision (Unified)' &&
      github.event.workflow_run.name != 'Cognitive Analysis & Learning (Unified)' &&
      github.event.workflow_run.name != 'Workflow Analytics & Health (Unified)'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install cognitive brain dependencies
        run: pip install -e ".[dev]" --quiet

      - name: Report completion to Cognitive Brain
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'EOF'
          import os
          import sys

          sys.path.insert(0, "src")
          from codex.cognitive.agent_brain_api import AgentBrainAPI, ImprovementArea

          brain = AgentBrainAPI(agent_id="copilot-coding-agent")
          conclusion = os.environ["WORKFLOW_CONCLUSION"]
          workflow = os.environ["WORKFLOW_NAME"]
          sha = os.environ["HEAD_SHA"][:8]

          # Keyword → (pattern_id, ImprovementArea) mapping.
          # Pattern P-046: extend this map as new patterns are codified.
          PATTERN_KEYWORD_MAP = {
              "sharded":      ("P-038", ImprovementArea.CI_SELF_HEALING),
              "codeql":       ("P-039", ImprovementArea.SECURITY_REMEDIATION),
              "huggingface":  ("P-043", ImprovementArea.ML_PATTERN_FEEDING),
              "hf":           ("P-043", ImprovementArea.ML_PATTERN_FEEDING),
              "training":     ("P-043", ImprovementArea.ML_PATTERN_FEEDING),
              "coverage":     ("P-044", ImprovementArea.COVERAGE_IMPROVEMENT),
              "cognitive":    ("P-046", ImprovementArea.AGENT_CHAINING),
              "health":       ("P-047", ImprovementArea.CI_SELF_HEALING),
              "monitor":      ("P-047", ImprovementArea.CI_SELF_HEALING),
              "self.heal":    ("P-047", ImprovementArea.CI_SELF_HEALING),
          }

          workflow_lower = workflow.lower()
          matched = [
              (pid, area)
              for keyword, (pid, area) in PATTERN_KEYWORD_MAP.items()
              if keyword in workflow_lower
          ]

          for pattern_id, area in matched:
              brain.report_completion(
                  area=area,
                  step_id=f"{pattern_id}-{sha}",
                  outcome="success" if conclusion == "success" else "failure",
                  notes=f"Auto-reported by cognitive_brain_ci_feedback.yml: {workflow}",
              )
              print(f"✅ Reported {pattern_id} → {conclusion} for '{workflow}'")

          if not matched:
              print(f"ℹ️ No pattern match for workflow: '{workflow}'")
          EOF

      # ── mvkaran/gh-copilot@5694b7d7a242d1c025e40d0965a0c5c5e68f5fba — Intelligent failure analysis ─────────────
      # On ANY CI failure: ask Copilot to classify it, suggest a fix, and propose
      # a new pattern ID. Outputs structured JSON for downstream steps.
      - name: Copilot failure analysis (mvkaran/gh-copilot@5694b7d7a242d1c025e40d0965a0c5c5e68f5fba)
        id: copilot_analysis
        if: github.event.workflow_run.conclusion == 'failure'
        uses: mvkaran/gh-copilot@5694b7d7a242d1c025e40d0965a0c5c5e68f5fba
        with:
          copilot-token: ${{ secrets.CODEX_MASTER_KEY }}
          github-mcp-token: ${{ secrets.CODEX_MASTER_KEY }}
          timeout: "5"
          output-format: json
          output-schema: |
            {
              "pattern_id": "P-NEW or existing pattern e.g. P-038",
              "category": "CI_HEALTH|SECURITY_REMEDIATION|COVERAGE_IMPROVEMENT|ML_PATTERN_FEEDING|AGENT_CHAINING",
              "root_cause": "one-sentence root cause",
              "fix_suggestion": "one-sentence fix",
              "severity": "critical|high|medium|low",
              "is_known_pattern": true
            }
          system-prompt: |
            You are an expert CI/CD engineer for the Aries-Serpent/_codex_ Python repository.
            The cognitive brain pattern library lives in .codex/cognitive_brain/*.md.
            Known patterns: P-038 (shard crash), P-039 (CodeQL branches), P-042 (HF_REVISION leak),
            P-043 (HF mock), P-044 (coverage tests), P-046 (CI feedback loop).
            Return ONLY valid JSON matching the schema. No markdown fences.
          prompt: |
            A GitHub Actions workflow FAILED. Analyze the failure and return a structured JSON response.

            Workflow: ${{ github.event.workflow_run.name }}
            Conclusion: ${{ github.event.workflow_run.conclusion }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            SHA: ${{ github.event.workflow_run.head_sha }}
            Run URL: ${{ github.event.workflow_run.html_url }}

            Classify this failure against the known pattern library.
            If it matches a known pattern, return that pattern_id.
            If it's novel, propose a new pattern_id (P-047, P-048, etc.).

      - name: Store Copilot pattern analysis to cognitive brain
        if: >
          github.event.workflow_run.conclusion == 'failure' &&
          steps.copilot_analysis.outputs.validation-status == 'valid'
        env:
          COPILOT_ANALYSIS: ${{ steps.copilot_analysis.outputs.response }}
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          python - <<'PYEOF'
          import json, os, sys, time
          from pathlib import Path

          analysis_raw = os.environ.get("COPILOT_ANALYSIS", "{}")
          try:
              analysis = json.loads(analysis_raw)
          except json.JSONDecodeError:
              print("⚠️ Could not parse Copilot JSON — skipping store.")
              sys.exit(0)

          sys.path.insert(0, "src")
          from codex.cognitive.agent_brain_api import AgentBrainAPI
          brain = AgentBrainAPI(agent_id="copilot-coding-agent")

          pattern_id = analysis.get("pattern_id", "P-CANDIDATE")
          root_cause  = analysis.get("root_cause", "unknown")
          fix         = analysis.get("fix_suggestion", "")
          workflow    = os.environ.get("WORKFLOW_NAME", "")

          # Persist to .codex/cognitive_brain/ so next session picks it up
          brain_dir = Path(".codex/cognitive_brain")
          brain_dir.mkdir(parents=True, exist_ok=True)
          candidate_file = brain_dir / f"{pattern_id}-candidate.json"
          candidate_file.write_text(json.dumps({
              "ts": time.time(),
              "pattern_id": pattern_id,
              "workflow": workflow,
              "root_cause": root_cause,
              "fix_suggestion": fix,
              "analysis": analysis,
              "source": "mvkaran/gh-copilot@5694b7d7a242d1c025e40d0965a0c5c5e68f5fba",
          }, indent=2))
          print(f"✅ Stored Copilot analysis → {candidate_file}")
          print(f"   Pattern: {pattern_id} | Cause: {root_cause}")
          PYEOF

      - name: Post @copilot follow-up comment (requires CODEX_MASTER_KEY)
        # §7 ADMIN_MANUAL_SETUP_GUIDE.md — posts follow-up once secret is set.
        # No-ops gracefully when CODEX_MASTER_KEY is absent (no token = no post).
        if: >
          github.event.workflow_run.conclusion == 'success' &&
          (github.actor == 'mbaetiong' || github.actor == 'github-actions[bot]')
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "${CODEX_MASTER_KEY}" ] && [ -z "${CODEX_BACKUP_KEY}" ]; then
            echo "ℹ️ CODEX_MASTER_KEY not set — skipping @copilot comment."
            echo "   See .codex/docs/ADMIN_MANUAL_SETUP_GUIDE.md § 3 to enable."
            exit 0
          fi
          if [ -z "${PR_NUMBER}" ]; then
            echo "ℹ️ No PR associated with this workflow run — skipping comment."
            exit 0
          fi
          PROMPT_FILE=".github/copilot-prompts/active/PR-${PR_NUMBER}-followup.md"
          if [ ! -f "${PROMPT_FILE}" ]; then
            echo "ℹ️ No follow-up prompt file found at ${PROMPT_FILE} — skipping."
            exit 0
          fi
          python -m codex.github.mcp_poster post-comment \
            --repo "${{ github.repository }}" \
            --pr "${PR_NUMBER}" \
            --body-file "${PROMPT_FILE}"

      - name: Store failure as pattern candidate (PDA AfterMath)
        if: github.event.workflow_run.conclusion == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          python - <<'EOF'
          import os
          import sys

          sys.path.insert(0, "src")
          from codex.cognitive.agent_brain_api import AgentBrainAPI

          brain = AgentBrainAPI(agent_id="copilot-coding-agent")
          workflow = os.environ["WORKFLOW_NAME"]

          # PDA AfterMath: novel failures become pattern candidates.
          try:
              brain._brain.submit_learning(
                  type("LF", (), {
                      "pattern_id": "P-CANDIDATE",
                      "agent_id": "copilot-coding-agent",
                      "outcome": "failure",
                      "context": {
                          "workflow": workflow,
                          "note": "Review for new pattern",
                      },
                  })()
              )
          except Exception:
              pass  # best-effort

          print(f"📝 Stored failure candidate for pattern review: '{workflow}'")
          EOF
