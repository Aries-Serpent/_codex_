name: Phase 12.2 Compliance Check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  schedule:
    # Weekly: Monday 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compliance-check:
    name: Governance & Compliance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run compliance dashboard (check mode)
        id: compliance
        run: |
          python scripts/ci/phase_12_2_compliance_dashboard.py \
            --check \
            --report \
            --json > compliance-output.json
        continue-on-error: true

      - name: Capture compliance status
        id: status
        run: |
          if [ -f compliance-output.json ]; then
            STATUS=$(python -c "
          import json, sys
          with open('compliance-output.json') as f:
              d = json.load(f)
          print(d.get('governance_status', 'UNKNOWN'))
          ")
            SCORE=$(python -c "
          import json
          with open('compliance-output.json') as f:
              d = json.load(f)
          print(f\"{d.get('compliance_score', 0) * 100:.0f}%\")
          ")
          else
            STATUS="UNKNOWN"
            SCORE="0%"
          fi
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "score=${SCORE}" >> "$GITHUB_OUTPUT"
          echo "Governance Status: ${STATUS} (score: ${SCORE})"

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: governance-report
          path: |
            .codex/PHASE_12_2_COMPLIANCE_REPORT.md
            compliance-output.json
          retention-days: 30

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.status.outputs.status }}';
            const score = '${{ steps.status.outputs.score }}';
            const statusEmoji = { APPROVED: '✅', WARN: '⚠️', BLOCK: '🚫' }[status] || '❓';

            let body = `## ${statusEmoji} Phase 12.2 Compliance: **${status}**\n\n`;
            body += `**Score:** ${score}\n\n`;

            if (fs.existsSync('.codex/PHASE_12_2_COMPLIANCE_REPORT.md')) {
              const report = fs.readFileSync('.codex/PHASE_12_2_COMPLIANCE_REPORT.md', 'utf8');
              // Extract the requirements table section
              const tableMatch = report.match(/## Requirement Status\n\n[\s\S]*?\n\n---/);
              if (tableMatch) {
                body += tableMatch[0].replace('\n\n---', '');
              }
            }

            body += '\n\n*Generated by [Phase 12.2 Compliance Workflow](../actions)*';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if compliance blocked
        if: steps.compliance.outcome == 'failure'
        run: |
          echo "::error::Phase 12.2 compliance check FAILED. See governance-report artifact for details."
          exit 1
