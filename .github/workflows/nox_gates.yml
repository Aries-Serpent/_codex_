name: Nox Quality Gates
on:
  push:
    branches:
    - 0D_base_
    - main
    - master
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  pull_request:
    branches:
    - 0D_base_
    - main
    - master
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ fromJSON(vars.CODEX_TEST_TIMEOUT_MINUTES || '60') }}
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: live
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install nox and deps
      run: 'python -m pip install --upgrade pip

        pip install nox

        '
    - name: Run lint
      run: nox -s lint
    - name: Run typecheck (advisory)
      continue-on-error: true
      run: nox -s typecheck
    - name: Run tests
      run: nox -s tests
    - name: Security gates
      run: nox -s gates
    - name: Pre-commit (informational)
      run: nox -s precommit || true
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --type pip --workflow nox_gates
        --health 2>/dev/null || echo "{\"status\": \"cache health check skipped\"}"

        '
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
  rescue-comment:
    name: Post rescue comment on nox failure
    runs-on: ubuntu-latest
    needs: gates
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
  conditional-approval:
    name: "\u26A1 Auto-Approve if All Nox Gates Pass"
    needs: gates
    if: success() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Trigger auto-approve-workflows
      uses: actions/github-script@v9
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        REF_NAME: ${{ github.head_ref || github.ref }}
      with:
        script: "await github.rest.actions.createWorkflowDispatch({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  workflow_id: \"auto-approve-workflows.yml\"\
          ,\n  ref: process.env.REF_NAME,\n  inputs: {\n    approval_source: \"workflow-execution-gate\"\
          ,\n    approval_intent: \"auto_approve_action_required\",\n    target_pr:\
          \ \"${{ github.event.pull_request.number }}\",\n    approval_reason: \"\
          nox-gates-passed\"\n  }\n});\n"
    timeout-minutes: 30
