name: Nox Quality Gates

on:
  push:
    branches: ["0D_base_", "main", "master"]
  pull_request:
    branches: ["0D_base_", "main", "master"]
  workflow_dispatch:


permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'live'

      - name: Install nox and deps
        run: |
          python -m pip install --upgrade pip
          pip install nox
      - name: Run lint
        run: nox -s lint
      - name: Run typecheck
        run: nox -s typecheck
      - name: Run tests
        run: nox -s tests
      - name: Security gates
        run: nox -s gates
      - name: Pre-commit (informational)
        run: nox -s precommit || true

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow nox_gates --health 2>/dev/null || echo '{"status": "cache health check skipped"}'

  # ── rescue comment — posted on PR whenever nox gates fail ───────────────
  rescue-comment:
    name: Post rescue comment on nox failure
    runs-on: ubuntu-latest
    needs: gates
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Nox Quality Gates"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
