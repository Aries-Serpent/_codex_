name: Nox Quality Gates

on:
  push:
    branches: [ "0D_base_", "main", "master" ]
  pull_request:
    branches: [ "0D_base_", "main", "master" ]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.11'
          cache-tier: 'live'
      
      - name: Install nox and deps
        run: |
          python -m pip install --upgrade pip
          pip install nox
      - name: Run lint
        run: nox -s lint
      - name: Run typecheck
        run: nox -s typecheck
      - name: Run tests
        run: nox -s tests
      - name: Security gates
        run: nox -s gates
      - name: Pre-commit (informational)
        run: nox -s precommit || true
