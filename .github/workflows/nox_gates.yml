name: Nox Quality Gates

on:
  push:
    branches: [ "0D_base_", "main", "master" ]
  pull_request:
    branches: [ "0D_base_", "main", "master" ]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      
      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.cache/nox
          key: ${{ runner.os }}-${{ github.workflow }}-pip-nox-${{ hashFiles('**/requirements*.txt', 'pyproject.toml', 'noxfile.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.workflow }}-pip-nox-
            ${{ runner.os }}-pip-
      
      - name: Install nox and deps
        run: |
          python -m pip install --upgrade pip
          pip install nox
      - name: Run lint
        run: nox -s lint
      - name: Run typecheck
        run: nox -s typecheck
      - name: Run tests
        run: nox -s tests
      - name: Security gates
        run: nox -s gates
      - name: Pre-commit (informational)
        run: nox -s precommit || true
