name: Embedding Index Rebuild

# Phase 3: Nightly FAISS index rebuild — Tier-1 GROUNDED enforcement for corpus freshness.
# Runs nightly at 2 AM UTC and on workflow_dispatch (manual trigger for testing).
#
# Only .codex/embeddings/codex_index_meta.json is committed back to git.
# The FAISS binary index (.faiss) is git-ignored (too large) and rebuilt each run.
#
# Acceptance criteria (Phase 3):
#   - Build time < 5 minutes for ~10K chunks
#   - Model: all-MiniLM-L6-v2 (offline, Apache 2.0, ~80 MB)
#   - REQ-10: corpus health annotation emitted after each rebuild
#
# References: docs/plans/Agentic_AI_System/soft_to_GROUNDED.md Domain 4

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embedding-index-rebuild
  cancel-in-progress: true

jobs:
  # ── 💰 Cost Gate ─────────────────────────────────────────────────────────────
  # YELLOW tier: 15 min, ubuntu-latest — moderate due to scheduled frequency
  cost-gate:
    name: "💰 Cost Gate"
    uses: ./.github/workflows/cost-gate.yml
    with:
      workflow_name: "Embedding Index Rebuild"
      runner: "ubuntu-latest"
      timeout_minutes: 15
      matrix_count: 1
      pushes_to_ghcr: false
    permissions:
      contents: read
      pull-requests: write

  rebuild:
    name: Rebuild FAISS Embedding Index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: cost-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: "🔀 Resolve push target (chain: sub-PR → 0D_base_ → main)"
        id: resolve-target
        uses: ./.github/actions/resolve-push-target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Check RAG index freshness
        id: freshness
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path

          META = Path(".codex/embeddings/codex_index_meta.json")
          STALE_WARN_HOURS  = 25   # emit warning if older than 25 h
          STALE_ERROR_HOURS = 72   # emit error if older than 72 h

          if not META.exists():
              print("::warning::codex_index_meta.json not found — full rebuild required")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("freshness_status=missing\n")
              sys.exit(0)

          meta = json.loads(META.read_text())
          generated_at_str = meta.get("generated_at", "")
          try:
              # Handle both offset-aware and Z-suffix ISO strings
              ts = datetime.fromisoformat(generated_at_str.replace("Z", "+00:00"))
          except ValueError:
              print(f"::warning::Cannot parse generated_at={generated_at_str!r}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("freshness_status=unknown\n")
              sys.exit(0)

          now = datetime.now(timezone.utc)
          age_hours = (now - ts).total_seconds() / 3600

          status = "fresh"
          if age_hours > STALE_ERROR_HOURS:
              print(f"::error::RAG index is {age_hours:.1f}h old (>{STALE_ERROR_HOURS}h) — stale rebuild required")
              status = "stale_error"
          elif age_hours > STALE_WARN_HOURS:
              print(f"::warning::RAG index is {age_hours:.1f}h old (>{STALE_WARN_HOURS}h) — rebuilding to stay fresh")
              status = "stale_warn"
          else:
              print(f"✅ RAG index freshness OK: {age_hours:.1f}h old (threshold {STALE_WARN_HOURS}h)")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"freshness_status={status}\n")
              f.write(f"age_hours={age_hours:.1f}\n")
              f.write(f"generated_at={generated_at_str}\n")
          PYEOF

      - name: Install embedding dependencies
        run: pip install sentence-transformers faiss-cpu numpy --quiet

      - name: Rebuild embedding index
        id: rebuild
        run: |
          python scripts/ci/build_embeddings.py
          python3 -c "
          import json
          meta = json.load(open('.codex/embeddings/codex_index_meta.json'))
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f\"chunk_count={meta['chunk_count']}\n\")
              f.write(f\"build_time={meta['build_time_seconds']}\n\")
          "

      - name: Emit REQ-10 corpus health annotation (Tier-1 GROUNDED)
        run: |
          CHUNK_COUNT="${{ steps.rebuild.outputs.chunk_count }}"
          BUILD_TIME="${{ steps.rebuild.outputs.build_time }}"
          if [ -z "$CHUNK_COUNT" ] || [ "$CHUNK_COUNT" -lt 100 ]; then
            echo "::error::REQ-10 corpus health: chunk count ${CHUNK_COUNT} below threshold (expected ≥100)"
            exit 1
          else
            echo "✅ REQ-10 corpus health: ${CHUNK_COUNT} chunks indexed in ${BUILD_TIME}s"
          fi

      - name: Commit updated index metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TARGET: ${{ steps.resolve-target.outputs.branch }}
        run: |
          # Walk the staging chain: sub-PR → 0D_base_ → main  (resolved above)
          _TARGET="${PUSH_TARGET}"
          echo "🔀 Push target: $_TARGET (reason: ${{ steps.resolve-target.outputs.reason }})"
          cp .codex/embeddings/codex_index_meta.json /tmp/_index_meta_sync_
          git fetch origin "$_TARGET" --depth=1
          git checkout -fB _autogen_sync_ origin/"$_TARGET"  # S237: force-checkout (files already in /tmp)
          cp /tmp/_index_meta_sync_ .codex/embeddings/codex_index_meta.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .codex/embeddings/codex_index_meta.json
          git diff --staged --quiet || \
            git commit -m "chore(phase-3): update embedding index metadata [skip ci]"
          git push origin HEAD:"$_TARGET"
          echo "📤 Pushed to $_TARGET"

      - name: Post rebuild summary
        if: always()
        run: |
          echo "## 🧠 Embedding Index Rebuild" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ".codex/embeddings/codex_index_meta.json" ]; then
            python3 -c "
          import json
          meta = json.load(open('.codex/embeddings/codex_index_meta.json'))
          print(f'| Field | Value |')
          print(f'|-------|-------|')
          print(f'| Chunks | {meta[\"chunk_count\"]} |')
          print(f'| Model | {meta[\"model\"]} |')
          print(f'| Dimensions | {meta[\"dim\"]} |')
          print(f'| Build time | {meta[\"build_time_seconds\"]}s |')
          print(f'| Generated | {meta[\"generated_at\"]} |')
          " >> "$GITHUB_STEP_SUMMARY"
          echo "| Pre-build age | ${{ steps.freshness.outputs.age_hours }}h (status: ${{ steps.freshness.outputs.freshness_status }}) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Index metadata not found — build may have failed." >> "$GITHUB_STEP_SUMMARY"
          fi
