name: Embedding Index Rebuild
on:
  schedule:
  - cron: 0 2 * * *
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  cost-gate:
    name: "\U0001F4B0 Cost Gate"
    uses: ./.github/workflows/cost-gate.yml
    with:
      workflow_name: Embedding Index Rebuild
      runner: ubuntu-latest
      timeout_minutes: 15
      matrix_count: 1
      pushes_to_ghcr: false
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 60
  rebuild:
    name: Rebuild FAISS Embedding Index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: cost-gate
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: "\U0001F500 Resolve push target (chain: sub-PR \u2192 0D_base_ \u2192\
        \ main)"
      id: resolve-target
      uses: ./.github/actions/resolve-push-target
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.12.13
        cache: pip
    - name: Check RAG index freshness
      id: freshness
      run: "python3 - <<'PYEOF'\nimport json, os, sys\nfrom datetime import datetime,\
        \ timezone\nfrom pathlib import Path\n\nMETA = Path(\".codex/embeddings/codex_index_meta.json\"\
        )\nSTALE_WARN_HOURS  = 25   # emit warning if older than 25 h\nSTALE_ERROR_HOURS\
        \ = 72   # emit error if older than 72 h\n\nif not META.exists():\n    print(\"\
        ::warning::codex_index_meta.json not found \u2014 full rebuild required\"\
        )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\") as f:\n        f.write(\"\
        freshness_status=missing\\n\")\n    sys.exit(0)\n\nmeta = json.loads(META.read_text())\n\
        generated_at_str = meta.get(\"generated_at\", \"\")\ntry:\n    # Handle both\
        \ offset-aware and Z-suffix ISO strings\n    ts = datetime.fromisoformat(generated_at_str.replace(\"\
        Z\", \"+00:00\"))\nexcept ValueError:\n    print(f\"::warning::Cannot parse\
        \ generated_at={generated_at_str!r}\")\n    with open(os.environ[\"GITHUB_OUTPUT\"\
        ], \"a\") as f:\n        f.write(\"freshness_status=unknown\\n\")\n    sys.exit(0)\n\
        \nnow = datetime.now(timezone.utc)\nage_hours = (now - ts).total_seconds()\
        \ / 3600\n\nstatus = \"fresh\"\nif age_hours > STALE_ERROR_HOURS:\n    print(f\"\
        ::error::RAG index is {age_hours:.1f}h old (>{STALE_ERROR_HOURS}h) \u2014\
        \ stale rebuild required\")\n    status = \"stale_error\"\nelif age_hours\
        \ > STALE_WARN_HOURS:\n    print(f\"::warning::RAG index is {age_hours:.1f}h\
        \ old (>{STALE_WARN_HOURS}h) \u2014 rebuilding to stay fresh\")\n    status\
        \ = \"stale_warn\"\nelse:\n    print(f\"\u2705 RAG index freshness OK: {age_hours:.1f}h\
        \ old (threshold {STALE_WARN_HOURS}h)\")\n\nwith open(os.environ[\"GITHUB_OUTPUT\"\
        ], \"a\") as f:\n    f.write(f\"freshness_status={status}\\n\")\n    f.write(f\"\
        age_hours={age_hours:.1f}\\n\")\n    f.write(f\"generated_at={generated_at_str}\\\
        n\")\nPYEOF\n"
    - name: Install embedding dependencies
      run: pip install sentence-transformers faiss-cpu numpy --quiet
    - name: Rebuild embedding index
      id: rebuild
      run: "python scripts/ci/build_embeddings.py\npython3 -c \"\nimport json\nmeta\
        \ = json.load(open('.codex/embeddings/codex_index_meta.json'))\nimport os\n\
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:\n    f.write(f\\\"chunk_count={meta['chunk_count']}\\\
        n\\\")\n    f.write(f\\\"build_time={meta['build_time_seconds']}\\n\\\")\n\
        \"\n"
    - name: Emit REQ-10 corpus health annotation (Tier-1 GROUNDED)
      run: "CHUNK_COUNT=\"${{ steps.rebuild.outputs.chunk_count }}\"\nBUILD_TIME=\"\
        ${{ steps.rebuild.outputs.build_time }}\"\nif [ -z \"$CHUNK_COUNT\" ] || [\
        \ \"$CHUNK_COUNT\" -lt 100 ]; then\n  echo \"::error::REQ-10 corpus health:\
        \ chunk count ${CHUNK_COUNT} below threshold (expected \u2265100)\"\n  exit\
        \ 1\nelse\n  echo \"\u2705 REQ-10 corpus health: ${CHUNK_COUNT} chunks indexed\
        \ in ${BUILD_TIME}s\"\nfi\n"
    - name: "Active-PR guard \u2014 skip push when any open/draft PR targets the push\
        \ target"
      id: pr_guard
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
        PUSH_TARGET: ${{ steps.resolve-target.outputs.branch }}
      run: "_TARGET=\"${PUSH_TARGET:-main}\"\nif [ \"$_TARGET\" = \"main\" ] || [\
        \ \"$_TARGET\" = \"0D_base_\" ]; then\n  PR_COUNT=$(gh api \"repos/${REPO}/pulls?base=${_TARGET}&state=open&per_page=1\"\
        \ \\\n    --jq 'length' 2>/dev/null || echo \"0\")\n  if [ \"${PR_COUNT}\"\
        \ -gt \"0\" ]; then\n    echo \"pr_skip=true\" >> \"$GITHUB_OUTPUT\"\n   \
        \ echo \"\u26D4 ${PR_COUNT} open/draft PR(s) targeting \\`${_TARGET}\\` \u2014\
        \ embedding index push deferred.\" >> \"$GITHUB_STEP_SUMMARY\"\n  else\n \
        \   echo \"pr_skip=false\" >> \"$GITHUB_OUTPUT\"\n  fi\nelse\n  echo \"pr_skip=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Commit updated index metadata
      if: steps.pr_guard.outputs.pr_skip != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUSH_TARGET: ${{ steps.resolve-target.outputs.branch }}
      run: "# Walk the staging chain: sub-PR \u2192 0D_base_ \u2192 main  (resolved\
        \ above)\n_TARGET=\"${PUSH_TARGET}\"\necho \"\U0001F500 Push target: $_TARGET\
        \ (reason: ${{ steps.resolve-target.outputs.reason }})\"\ncp .codex/embeddings/codex_index_meta.json\
        \ /tmp/_index_meta_sync_\ngit fetch origin \"$_TARGET\" --depth=1\ngit checkout\
        \ -fB _autogen_sync_ origin/\"$_TARGET\"  # S237: force-checkout (files already\
        \ in /tmp)\ncp /tmp/_index_meta_sync_ .codex/embeddings/codex_index_meta.json\n\
        git config user.name \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\
        \ngit add -f .codex/embeddings/codex_index_meta.json\ngit diff --staged --quiet\
        \ || \\\n  git commit -m \"chore(phase-3): update embedding index metadata\
        \ [skip ci]\"\ngit push origin HEAD:\"$_TARGET\"\necho \"\U0001F4E4 Pushed\
        \ to $_TARGET\"\n"
    - name: Post rebuild summary
      if: always()
      run: "echo \"## \U0001F9E0 Embedding Index Rebuild\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\nif [ -f \".codex/embeddings/codex_index_meta.json\"\
        \ ]; then\n  python3 -c \"\nimport json\nmeta = json.load(open('.codex/embeddings/codex_index_meta.json'))\n\
        print(f'| Field | Value |')\nprint(f'|-------|-------|')\nprint(f'| Chunks\
        \ | {meta[\\\"chunk_count\\\"]} |')\nprint(f'| Model | {meta[\\\"model\\\"\
        ]} |')\nprint(f'| Dimensions | {meta[\\\"dim\\\"]} |')\nprint(f'| Build time\
        \ | {meta[\\\"build_time_seconds\\\"]}s |')\nprint(f'| Generated | {meta[\\\
        \"generated_at\\\"]} |')\n\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"| Pre-build\
        \ age | ${{ steps.freshness.outputs.age_hours }}h (status: ${{ steps.freshness.outputs.freshness_status\
        \ }}) |\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"Index metadata not found\
        \ \u2014 build may have failed.\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
