name: Agent Registry Validation

# Phase 1 — satisfies C1: validate AGENT_REGISTRY.yaml against
# .codex/schemas/AgentRegistrySchema.json on every PR and push to main.
# Also validates CODEX_MANIFEST.json integrity when present.
#
# Tier: GROUNDED — Tier-1 hard gate (exit 1 on schema violations or integrity failure).
# Promoted from Tier-2 canary after 2-sprint observation period.

on:
  pull_request:
    paths:
      - '.github/agents/AGENT_REGISTRY.yaml'
      - '.codex/schemas/**'
      - 'CODEX_MANIFEST.json'
      - 'scripts/ci/generate_manifest.py'
  push:
    branches:
      - main
    paths:
      - '.github/agents/AGENT_REGISTRY.yaml'
      - '.codex/schemas/**'
      - 'CODEX_MANIFEST.json'

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: agent-registry-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate Agent Registry + Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: pip install jsonschema pyyaml --quiet

      - name: Refresh CODEX_MANIFEST.json
        run: |
          # Regenerate the manifest on every validation run so generated_at is always fresh.
          # This keeps C2 (manifest current <24h) satisfied in e-to-d-transition-gate.
          python3 scripts/ci/generate_manifest.py
          echo "✅ CODEX_MANIFEST.json refreshed"

      - name: Validate AGENT_REGISTRY.yaml schema
        id: registry_validation
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import sys
          import yaml

          try:
              import jsonschema
          except ImportError:
              print("::warning::jsonschema not installed — skipping schema validation")
              sys.exit(0)

          schema_path = ".codex/schemas/AgentRegistrySchema.json"
          registry_path = ".github/agents/AGENT_REGISTRY.yaml"

          if not os.path.exists(schema_path):
              print(f"::warning::AgentRegistrySchema.json not found at {schema_path}")
              sys.exit(0)

          if not os.path.exists(registry_path):
              print(f"::warning::AGENT_REGISTRY.yaml not found at {registry_path}")
              sys.exit(0)

          with open(schema_path) as f:
              schema = json.load(f)
          with open(registry_path) as f:
              data = yaml.safe_load(f)

          errors = []

          # Top-level validation
          try:
              jsonschema.validate(data, schema)
          except jsonschema.ValidationError as e:
              errors.append(f"Top-level: {e.message}")

          # Per-agent validation
          agent_schema = schema.get("definitions", {}).get("AgentEntry", {})
          if agent_schema:
              for agent in data.get("agents", []):
                  try:
                      jsonschema.validate(agent, agent_schema)
                  except jsonschema.ValidationError as e:
                      errors.append(f"Agent '{agent.get('id', '?')}': {e.message}")

          # Check total_agents count matches actual
          declared = data.get("total_agents", 0)
          actual = len(data.get("agents", []))
          if declared != actual:
              errors.append(f"total_agents={declared} but actual count={actual}")

          output_file = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          if errors:
              error_summary = "; ".join(errors[:5])
              print(f"::error::agent-registry-validation: {len(errors)} schema issues found: {error_summary}")
              with open(output_file, "a") as f:
                  f.write("registry_valid=false\n")
                  f.write(f"error_count={len(errors)}\n")
              sys.exit(1)
          else:
              print(f"✅ AGENT_REGISTRY.yaml valid: {actual} agents, all schema-compliant")
              with open(output_file, "a") as f:
                  f.write("registry_valid=true\n")
                  f.write("error_count=0\n")
          PYEOF

      - name: Validate capability_tags quality
        id: tags_quality
        run: |
          python3 - << 'PYEOF'
          # Enforce capability_tags quality rules on every PR that touches AGENT_REGISTRY.yaml.
          # Rules (Tier-1 GROUNDED — hard gate):
          #   1. Every agent must have at least one capability_tag.
          #   2. Tags must be snake_case (a-z, 0-9, underscore only; no hyphens, spaces, commas).
          #   3. Tags must be >= 4 characters (prevents 'ml', 'ci' abbreviations).
          #   4. Tags must not end with common truncation suffixes (_storag, _detectio, etc.).
          import os, re, sys, yaml

          REGISTRY = ".github/agents/AGENT_REGISTRY.yaml"
          if not os.path.exists(REGISTRY):
              print("::warning::AGENT_REGISTRY.yaml not found — skipping capability_tags check")
              sys.exit(0)

          data = yaml.safe_load(open(REGISTRY))
          agents = data.get("agents", [])

          SNAKE_RE = re.compile(r'^[a-z][a-z0-9_]*$')
          TRUNCATION_SUFFIXES = ("_storag", "_detectio", "_managemen", "_implementa", "_coordinati")

          violations = []
          for a in agents:
              name = a.get("name", a.get("id", "?"))
              tags = a.get("capability_tags", [])
              if not tags:
                  violations.append(f"{name}: missing capability_tags")
                  continue
              if isinstance(tags, str):
                  tags = [t.strip() for t in tags.split(",")]
              for t in tags:
                  if not SNAKE_RE.match(t):
                      violations.append(f"{name}: malformed tag '{t}' (must be snake_case a-z/0-9/_)")
                  elif len(t) < 4:
                      violations.append(f"{name}: tag '{t}' too short (min 4 chars)")
                  elif any(t.endswith(sfx) for sfx in TRUNCATION_SUFFIXES):
                      violations.append(f"{name}: tag '{t}' appears truncated")

          gf = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          if violations:
              for v in violations:
                  print(f"::error::{v}")
              with open(gf, "a") as f:
                  f.write("tags_valid=false\n")
                  f.write(f"tag_violations={len(violations)}\n")
              print(f"\n❌ capability_tags quality: {len(violations)} violation(s)")
              sys.exit(1)
          else:
              print(f"✅ capability_tags quality: all {len(agents)} agents have valid tags")
              with open(gf, "a") as f:
                  f.write("tags_valid=true\n")
                  f.write("tag_violations=0\n")
          PYEOF

      - name: Validate CODEX_MANIFEST.json integrity
        id: manifest_validation
        run: |
          python3 - << 'PYEOF'
          import hashlib
          import json
          import os
          import sys

          try:
              import jsonschema
          except ImportError:
              jsonschema = None

          manifest_path = "CODEX_MANIFEST.json"
          schema_path = ".codex/schemas/CodexManifestSchema.json"

          if not os.path.exists(manifest_path):
              print("::error::CODEX_MANIFEST.json not found — run scripts/ci/generate_manifest.py")
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write("manifest_valid=absent\n")
              sys.exit(1)

          data = json.loads(open(manifest_path).read())

          # Verify integrity hash
          stored = data.pop("integrity_sha256", None)
          if not stored:
              print("::error::CODEX_MANIFEST.json missing integrity_sha256 field — regenerate with generate_manifest.py")
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write("manifest_valid=false\n")
              sys.exit(1)

          content = json.dumps(data, sort_keys=True, separators=(",", ":"))
          computed = hashlib.sha256(content.encode()).hexdigest()

          if computed != stored:
              print(f"::error::CODEX_MANIFEST.json integrity FAILED — regenerate with generate_manifest.py")
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write("manifest_valid=false\n")
              sys.exit(1)

          # Validate against schema if available
          if jsonschema is not None and os.path.exists(schema_path):
              try:
                  data["integrity_sha256"] = stored  # restore for schema validation
                  manifest_schema = json.load(open(schema_path))
                  jsonschema.validate(data, manifest_schema)
              except jsonschema.ValidationError as e:
                  print(f"::error::CODEX_MANIFEST.json schema validation failed: {e.message}")
                  sys.exit(1)

          print(f"✅ CODEX_MANIFEST.json integrity valid (sha256={stored[:8]}...)")
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write("manifest_valid=true\n")
          PYEOF

      - name: Post validation summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          REGISTRY_VALID: ${{ steps.registry_validation.outputs.registry_valid }}
          MANIFEST_VALID: ${{ steps.manifest_validation.outputs.manifest_valid }}
          ERROR_COUNT: ${{ steps.registry_validation.outputs.error_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const registryValid = process.env.REGISTRY_VALID;
            const manifestValid = process.env.MANIFEST_VALID;
            const errorCount = process.env.ERROR_COUNT || '0';

            // Only post a comment if there are issues to report
            if (registryValid === 'true' && manifestValid === 'true') {
              core.info('Registry and manifest validation passed — no comment needed');
              return;
            }

            let body = '## 🔍 Agent Registry Validation\n\n';

            if (registryValid !== 'true') {
              body += `⚠️ **AGENT_REGISTRY.yaml**: ${errorCount} schema issue(s) found\n`;
              body += '  Run: `python3 -c "import yaml,json,jsonschema; ..."`\n\n';
            }

            if (manifestValid === 'absent') {
              body += '⚠️ **CODEX_MANIFEST.json**: Not found — regenerate:\n';
              body += '  ```bash\n  python scripts/ci/generate_manifest.py\n  ```\n\n';
            } else if (manifestValid !== 'true') {
              body += '⚠️ **CODEX_MANIFEST.json**: Integrity check failed — regenerate:\n';
              body += '  ```bash\n  python scripts/ci/generate_manifest.py\n  ```\n\n';
            }

            body += `_[agent-registry-validation.yml] | Tier-1 GROUNDED gate — blocks merge on schema violations_`;
            body += `\n\n---\n_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Trigger embedding index refresh
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EMBEDDING_INDEX_AUTO_REBUILD != 'false'
        run: |
          gh workflow run embedding-index-rebuild.yml --ref main \
            && echo "✅ Triggered embedding-index-rebuild.yml — FAISS index will refresh" \
            || echo "::warning::Failed to trigger embedding index rebuild — run manually: gh workflow run embedding-index-rebuild.yml --ref main"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: validate-registry
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Agent Registry Validation"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
