name: GitHub Connector Readiness

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  connector-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      
      - name: Compute time bucket for cache key
        id: time_bucket
        run: |
          # Use hour-based time bucket for 1-hour TTL caching
          TIME_BUCKET=$(date -u +%Y%m%d%H)
          echo "time_bucket=$TIME_BUCKET" >> $GITHUB_OUTPUT
      
      - name: Check cache for recent successful check
        id: cache
        uses: actions/cache@v4
        with:
          path: .connector-check-success
          key: connector-check-${{ hashFiles('tools/connectors/github_connector_check.py') }}-${{ steps.time_bucket.outputs.time_bucket }}
          restore-keys: |
            connector-check-${{ hashFiles('tools/connectors/github_connector_check.py') }}-
      
      - name: Determine if check is needed
        id: skip_check
        run: |
          # Skip if we have a recent successful check (within 1 hour)
          if [ -f .connector-check-success ]; then
            LAST_CHECK=$(cat .connector-check-success)
            CURRENT_TIME=$(date +%s)
            TIME_DIFF=$((CURRENT_TIME - LAST_CHECK))
            
            if [ $TIME_DIFF -lt 3600 ]; then
              echo "✅ Connector check passed within last hour, skipping"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "⏰ Last check too old ($TIME_DIFF seconds), running check"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "📝 No recent check found, running check"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run connector readiness check
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          python tools/connectors/github_connector_check.py
      
      - name: Mark successful check
        if: steps.skip_check.outputs.skip != 'true' && success()
        run: |
          date +%s > .connector-check-success
          echo "✅ Saved timestamp for future cache hits"
