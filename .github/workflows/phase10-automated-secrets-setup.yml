name: Automated Phase 10 Secrets Setup
# Copilot Agent can trigger this workflow to inject ALL required secrets
# User authorization: mbaetiong granted FULL ACCESS via comment #3745423798

on:
  workflow_dispatch:
    inputs:
      gdrive_service_account_json:
        description: 'Google Drive Service Account JSON (entire file content)'
        required: true
        type: string
      google_client_id:
        description: 'Google OAuth Client ID'
        required: true
        type: string
      google_client_secret:
        description: 'Google OAuth Client Secret'
        required: true
        type: string
      force_regenerate_codex_key:
        description: 'Force regenerate CODEX_MASTER_KEY (warning: rotates key)'
        required: false
        type: boolean
        default: false
      notebooklm_webhook_url:
        description: 'Optional: NotebookLM webhook URL for notifications'
        required: false
        type: string

permissions:
  contents: read
  actions: write
  secrets: write

jobs:
  setup-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests PyNaCl
      
      - name: Automated Secrets Injection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_SA_JSON: ${{ inputs.gdrive_service_account_json }}
          GOOGLE_CLIENT_ID_INPUT: ${{ inputs.google_client_id }}
          GOOGLE_CLIENT_SECRET_INPUT: ${{ inputs.google_client_secret }}
          NOTEBOOKLM_WEBHOOK: ${{ inputs.notebooklm_webhook_url }}
          FORCE_CODEX_KEY: ${{ inputs.force_regenerate_codex_key }}
        run: |
          echo "🚀 Starting automated secrets setup"
          echo "====================================="
          
          # Set CODEX_MASTER_KEY (auto-generate or verify existing)
          if [ "$FORCE_CODEX_KEY" = "true" ]; then
            echo "🔑 Generating new CODEX_MASTER_KEY..."
            python3 scripts/phase10/automated_secrets_manager.py \
              --action generate-key \
              --name CODEX_MASTER_KEY \
              --key-length 32 \
              --method api \
              --force
          else
            echo "ℹ️  Verifying CODEX_MASTER_KEY..."
            if python3 scripts/phase10/automated_secrets_manager.py \
              --action verify \
              --name CODEX_MASTER_KEY; then
              echo "✅ CODEX_MASTER_KEY already exists"
            else
              echo "🔑 Generating CODEX_MASTER_KEY..."
              python3 scripts/phase10/automated_secrets_manager.py \
                --action generate-key \
                --name CODEX_MASTER_KEY \
                --key-length 32 \
                --method api
            fi
          fi
          
          # Set GDRIVE_SERVICE_ACCOUNT_JSON
          echo ""
          echo "📦 Setting GDRIVE_SERVICE_ACCOUNT_JSON..."
          echo "$GDRIVE_SA_JSON" | python3 scripts/phase10/automated_secrets_manager.py \
            --action set \
            --name GDRIVE_SERVICE_ACCOUNT_JSON \
            --value "$(cat)" \
            --method api \
            --force
          
          # Set GOOGLE_CLIENT_ID
          echo ""
          echo "🔐 Setting GOOGLE_CLIENT_ID..."
          echo "$GOOGLE_CLIENT_ID_INPUT" | python3 scripts/phase10/automated_secrets_manager.py \
            --action set \
            --name GOOGLE_CLIENT_ID \
            --value "$(cat)" \
            --method api \
            --force
          
          # Set GOOGLE_CLIENT_SECRET
          echo ""
          echo "🔐 Setting GOOGLE_CLIENT_SECRET..."
          echo "$GOOGLE_CLIENT_SECRET_INPUT" | python3 scripts/phase10/automated_secrets_manager.py \
            --action set \
            --name GOOGLE_CLIENT_SECRET \
            --value "$(cat)" \
            --method api \
            --force
          
          # Set optional NOTEBOOKLM_WEBHOOK_URL
          if [ -n "$NOTEBOOKLM_WEBHOOK" ]; then
            echo ""
            echo "🔔 Setting NOTEBOOKLM_WEBHOOK_URL..."
            echo "$NOTEBOOKLM_WEBHOOK" | python3 scripts/phase10/automated_secrets_manager.py \
              --action set \
              --name NOTEBOOKLM_WEBHOOK_URL \
              --value "$(cat)" \
              --method api \
              --force
          fi
      
      - name: Verify All Secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ""
          echo "🔍 Verifying all Phase 10 secrets..."
          echo "====================================="
          
          REQUIRED_SECRETS=(
            "CODEX_MASTER_KEY"
            "GDRIVE_SERVICE_ACCOUNT_JSON"
            "GOOGLE_CLIENT_ID"
            "GOOGLE_CLIENT_SECRET"
          )
          
          ALL_VERIFIED=true
          
          for SECRET in "${REQUIRED_SECRETS[@]}"; do
            if python3 scripts/phase10/automated_secrets_manager.py \
              --action verify \
              --name "$SECRET"; then
              echo "✅ $SECRET verified"
            else
              echo "❌ $SECRET missing"
              ALL_VERIFIED=false
            fi
          done
          
          echo ""
          if [ "$ALL_VERIFIED" = "true" ]; then
            echo "✅ All Phase 10 secrets configured successfully!"
            echo ""
            echo "Next steps:"
            echo "1. Trigger notebooklm-sync.yml workflow"
            echo "2. Create NotebookLM notebook"
            echo "3. Add XML source from Google Drive"
            echo "4. Configure AI Architect instructions"
          else
            echo "❌ Some secrets failed to configure"
            exit 1
          fi
      
      - name: Generate Summary
        if: always()
        run: |
          echo "## 📊 Phase 10 Secrets Setup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configured Secrets" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CODEX_MASTER_KEY" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GDRIVE_SERVICE_ACCOUNT_JSON" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GOOGLE_CLIENT_ID" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GOOGLE_CLIENT_SECRET" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. ⏸️ Trigger \`notebooklm-sync.yml\` workflow" >> $GITHUB_STEP_SUMMARY
          echo "2. ⏸️ Create NotebookLM notebook" >> $GITHUB_STEP_SUMMARY
          echo "3. ⏸️ Add Google Drive XML source" >> $GITHUB_STEP_SUMMARY
          echo "4. ⏸️ Configure AI Architect instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See: \`HUMAN_ADMIN_CONSOLIDATED_ACTION_TRACKER.md\` for full instructions" >> $GITHUB_STEP_SUMMARY

      - name: Audit Trail
        if: success()
        run: |
          mkdir -p .codex/audit/phase10
          cat > .codex/audit/phase10/secrets-setup-$(date +%Y%m%d-%H%M%S).log <<EOF
          Phase 10 Secrets Setup - Automated Injection
          =============================================
          Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Workflow Run: ${{ github.run_id }}
          Triggered By: ${{ github.actor }}
          Repository: ${{ github.repository }}
          
          Secrets Configured:
          - CODEX_MASTER_KEY: Generated/Verified
          - GDRIVE_SERVICE_ACCOUNT_JSON: Injected via workflow input
          - GOOGLE_CLIENT_ID: Injected via workflow input
          - GOOGLE_CLIENT_SECRET: Injected via workflow input
          - NOTEBOOKLM_WEBHOOK_URL: ${{ inputs.notebooklm_webhook_url != '' && 'Configured' || 'Skipped' }}
          
          Authorization: mbaetiong granted FULL ACCESS (comment #3745423798)
          Method: GitHub Actions API + PyNaCl encryption
          Status: SUCCESS
          
          Next Phase: NotebookLM Integration (HA-WF-001, HA-NB-001)
          EOF
          
          echo "✅ Audit trail saved to .codex/audit/phase10/"
