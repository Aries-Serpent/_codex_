name: Bi-weekly Research Digest

on:
  schedule:
    - cron: '0 10 */14 * *'  # Every 14 days at 10 AM UTC
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Additional keywords (comma-separated)'
        required: false
        default: ''
      max_papers:
        description: 'Maximum papers to analyze'
        required: false
        default: '20'

permissions:
  contents: write
  issues: write

jobs:
  research_integration:
    name: Discover and Integrate Research
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'common'
