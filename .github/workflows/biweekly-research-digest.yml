name: Bi-weekly Research Digest

on:
  schedule:
    - cron: '0 10 */14 * *'  # Every 14 days at 10 AM UTC
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Additional keywords (comma-separated)'
        required: false
        default: ''
      max_papers:
        description: 'Maximum papers to analyze'
        required: false
        default: '20'

permissions:
  contents: write
  issues: write

jobs:
  research_integration:
    name: Discover and Integrate Research
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install arxiv feedparser beautifulsoup4 requests
      
      - name: Discover Relevant Papers
        id: discover
        run: |
          MAX_PAPERS="${{ github.event.inputs.max_papers || '20' }}"
          KEYWORDS="${{ github.event.inputs.keywords || '' }}"
          
          python scripts/cognitive/research_integration_pipeline.py discover \
            --max-papers "$MAX_PAPERS" \
            --keywords "$KEYWORDS" \
            --output cognitive/research/discovered_papers.json \
            --since-days 14
        continue-on-error: true
      
      - name: Analyze Paper Relevance
        if: steps.discover.outcome == 'success'
        id: analyze
        run: |
          python scripts/cognitive/research_integration_pipeline.py analyze \
            --papers cognitive/research/discovered_papers.json \
            --output cognitive/research/analyzed_papers.json \
            --min-relevance 7.0
        continue-on-error: true
      
      - name: Assess Integration Feasibility
        if: steps.analyze.outcome == 'success'
        id: feasibility
        run: |
          python scripts/cognitive/research_integration_pipeline.py assess \
            --papers cognitive/research/analyzed_papers.json \
            --output cognitive/research/integration_roadmap.json \
            --check-code-availability \
            --estimate-complexity
        continue-on-error: true
      
      - name: Generate Integration Roadmap
        if: steps.feasibility.outcome == 'success'
        run: |
          python scripts/cognitive/research_integration_pipeline.py roadmap \
            --assessments cognitive/research/integration_roadmap.json \
            --output cognitive/research/implementation_plan.json \
            --prioritize
      
      - name: Generate Research Digest
        if: always()
        run: |
          mkdir -p cognitive/reports
          cat > cognitive/reports/research_digest.md << 'EOF'
          # Bi-weekly Research Integration Digest
          
          **Period**: $(date -d '14 days ago' +%Y-%m-%d) to $(date +%Y-%m-%d)
          **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## Discovery Summary
          
          | Metric | Value |
          |--------|-------|
          | Papers Discovered | $([ -f cognitive/research/discovered_papers.json ] && jq -r '. | length' cognitive/research/discovered_papers.json || echo "0") |
          | Papers Analyzed | $([ -f cognitive/research/analyzed_papers.json ] && jq -r '. | length' cognitive/research/analyzed_papers.json || echo "0") |
          | Integration Candidates | $([ -f cognitive/research/integration_roadmap.json ] && jq -r '.candidates | length' cognitive/research/integration_roadmap.json || echo "0") |
          
          ## Top Relevant Papers
          
          $([ -f cognitive/research/analyzed_papers.json ] && jq -r '.[] | select(.relevance_score >= 8.0) | "### \(.title)\n**Score**: \(.relevance_score)/10\n**Authors**: \(.authors | join(", "))\n**ArXiv**: \(.arxiv_id)\n**Abstract**: \(.abstract)\n**Relevance**: \(.relevance_reason)\n"' cognitive/research/analyzed_papers.json || echo "No highly relevant papers found")
          
          ## Integration Roadmap
          
          $([ -f cognitive/research/implementation_plan.json ] && jq -r '.priorities[] | "### Priority \(.priority): \(.title)\n**Feasibility**: \(.feasibility_score)/10\n**Estimated Effort**: \(.estimated_effort_weeks) weeks\n**Benefits**: \(.expected_benefits)\n**Prerequisites**: \(.prerequisites | join(", "))\n"' cognitive/research/implementation_plan.json || echo "No integration roadmap available")
          
          ## Code Availability
          
          Papers with available code:
          $([ -f cognitive/research/integration_roadmap.json ] && jq -r '.candidates[] | select(.code_available == true) | "- \(.title) (\(.code_repo))"' cognitive/research/integration_roadmap.json || echo "None found")
          
          ## Recommended Actions
          
          1. Review high-relevance papers (score ≥ 8.0)
          2. Investigate integration candidates with available code
          3. Prioritize low-effort, high-impact integrations
          4. Create implementation tickets for top 3 priorities
          
          ---
          *Generated by Research Integration Pipeline*
          EOF
      
      - name: Upload Research Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-digest-${{ github.run_number }}
          path: |
            cognitive/research/
            cognitive/reports/research_digest.md
          retention-days: 90
      
      - name: Commit Research Updates
        if: steps.feasibility.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add cognitive/research/
          git add cognitive/reports/research_digest.md
          git commit -m "chore(cognitive): Bi-weekly research digest - $(date +%Y-%m-%d)"
          git push
      
      - name: Create Integration Tracking Issue
        if: steps.feasibility.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CANDIDATES=$(jq -r '.candidates | length' cognitive/research/integration_roadmap.json)
          if [ "$CANDIDATES" -gt 0 ]; then
            # Get top 3 candidates
            TOP_PAPERS=$(jq -r '.priorities[:3] | .[] | "- [ ] **\(.title)** (Effort: \(.estimated_effort_weeks)w, Feasibility: \(.feasibility_score)/10)"' cognitive/research/implementation_plan.json)
            
            cat > /tmp/issue_body.md << EOF
          ## Research Integration Candidates - $(date +%Y-%m-%d)
          
          Found $CANDIDATES integration-ready research papers. Top priorities:
          
          $TOP_PAPERS
          
          **Full Report**: See artifact \`research-digest-${{ github.run_number }}\`
          
          **Next Steps**:
          1. Review feasibility assessments
          2. Create implementation plans for top candidates
          3. Allocate resources for integration
          
          /cc @maintainers
          EOF
            
            gh issue create \
              --title "🔬 Research Integration Candidates - $(date +%Y-%m-%d)" \
              --body-file /tmp/issue_body.md \
              --label "research,enhancement,cognitive-brain"
          fi
