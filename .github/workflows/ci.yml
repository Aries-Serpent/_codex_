name: ci

on:
  push:
    branches: ["main", "chore/bootstrap-governance-2025-10-24"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (e.g., ubuntu-latest or self-hosted)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch_selector:
    runs-on: ubuntu-latest
    outputs:
      runner_label: ${{ steps.select.outputs.runner_label }}
      use_self_hosted: ${{ steps.select.outputs.use_self_hosted }}
    steps:
      - id: select
        shell: bash
        run: |
          runner_label="$(jq -r '.inputs.runner // ""' "$GITHUB_EVENT_PATH")"
          default_runner='${{ vars.DEFAULT_RUNNER }}'

          if [ -z "$runner_label" ]; then
            runner_label="$default_runner"
          fi
          if [ -z "$runner_label" ]; then
            runner_label="ubuntu-latest"
          fi

          use_self_hosted=false
          if [ "$runner_label" = "self-hosted" ]; then
            use_self_hosted=true
          fi

          echo "runner_label=$runner_label" >> "$GITHUB_OUTPUT"
          echo "use_self_hosted=$use_self_hosted" >> "$GITHUB_OUTPUT"

  gh_hosted:
    needs: dispatch_selector
    # Schedule this job unless the manual run explicitly targets self-hosted.
    if: ${{ needs.dispatch_selector.outputs.use_self_hosted != 'true' }}
    runs-on: ${{ needs.dispatch_selector.outputs.runner_label || vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Debug runner info
        run: |
          echo "Runner name: ${{ runner.name }}"
          echo "Runner os: ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          echo "Runner labels: ${{ join(runner.labels, ',') }}"
      - name: Lint (placeholder)
        run: echo "lint passed"
      - name: Validate presence of governance files
        run: |
          if [ -f .github/CODEOWNERS ]; then
            echo "CODEOWNERS present"
          else
            echo "CODEOWNERS missing (non-blocking)"
          fi
          test -f SECURITY.md
          test -f README.md
          echo "governance files present"
      - name: Note existing disabled workflows (non-blocking)
        run: |
          ls -1 .github/workflows/*.disabled 2>/dev/null || true

  self_hosted:
    needs: dispatch_selector
    # Only schedule on manual dispatch when runner input or DEFAULT_RUNNER indicate self-hosted.
    if: ${{ needs.dispatch_selector.outputs.use_self_hosted == 'true' }}
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Debug runner info
        run: |
          echo "Runner name: ${{ runner.name }}"
          echo "Runner os: ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          echo "Runner labels: ${{ join(runner.labels, ',') }}"
      - name: Validate presence of governance files
        run: |
          if [ -f .github/CODEOWNERS ]; then
            echo "CODEOWNERS present"
          else
            echo "CODEOWNERS missing (non-blocking)"
          fi
          test -f SECURITY.md
          test -f README.md
          echo "self-hosted path OK"
