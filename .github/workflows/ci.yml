name: CI — Segmented Sessions (CPU-Only)

on:
  push:
    branches:
      - main
      - 0D_base_
      - 0C_base_
  pull_request:
    branches:
      - main
      - 0D_base_
      - 0C_base_

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || 'none' }}
  cancel-in-progress: true

env:
  # Global CPU posture and evidence logging defaults
  CODEX_FORCE_CPU: "1"
  CODEX_VENDOR_PURGE: "1"
  CODEX_DEPENDENCY_EVIDENCE_ENABLE: "1"
  CODEX_VENDOR_LOG_AGG: "pre-sync"
  CODEX_ALLOW_TRITON_CPU: "1"

jobs:
  tests-matrix:
    name: "${{ matrix.session.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        session:
          - name: baseline (tests)
            nox: tests
            cpu_minimal: "0"
          - name: ml (ml_tests)
            nox: ml_tests
            cpu_minimal: "1"
          - name: eval (eval_tests)
            nox: eval_tests
            cpu_minimal: "0"
          - name: hygiene (verify_hygiene)
            nox: verify_hygiene
            cpu_minimal: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate uv.lock
        run: |
          python - <<'PY'
          import sys, tomllib
          data=open('uv.lock','rb').read()
          try:
              tomllib.loads(data.decode('utf-8'))
          except Exception as e:
              print("ERROR: uv.lock TOML invalid:", e, file=sys.stderr)
              sys.exit(1)
          print("uv.lock TOML OK")
          PY

      - name: Upgrade pip and install nox
        run: |
          python -m pip install --upgrade pip
          pip install nox

      - name: Prepare artifacts directory
        run: |
          mkdir -p artifacts
          echo "# MIGRATION SUMMARY (auto-generated placeholder)" > artifacts/MIGRATION_SUMMARY.md

      - name: Show Python and OS
        run: |
          python --version
          uname -a
          df -h

      - name: Ensure vendor guard available
        run: |
          if [ ! -f scripts/vendor_guard.py ]; then
            echo "::warning ::scripts/vendor_guard.py not found (continuing)"
          else
            chmod +x scripts/vendor_guard.py
          fi

      - name: Vendor guard (pre-install quick probe)
        run: |
          python scripts/vendor_guard.py || (echo "::warning ::Vendor guard pre-install reported vendors; proceeding due to empty env" && true)

      # Environment bootstrap and evidence logging
      - name: Environment setup (CPU posture + evidence)
        env:
          CODEX_CPU_MINIMAL: "${{ matrix.session.cpu_minimal }}"
          CODEX_ABORT_ON_GPU_PULL: "0"
          CODEX_RELOCK_AFTER_VENDOR_PURGE: "1"
          CODEX_VENDOR_ENFORCE_LOCK_PRUNE: "0"
          CODEX_VENDOR_ENFORCE_LOCK_PRUNE_DRYRUN: "1"
          CODEX_SESSION_ID: "ci-${{ github.run_id }}-${{ github.job }}-${{ matrix.session.nox }}"
        run: |
          chmod +x scripts/setup.sh || true
          bash scripts/setup.sh

      - name: Run session — nox -s ${{ matrix.session.nox }}
        env:
          CODEX_CPU_MINIMAL: "${{ matrix.session.cpu_minimal }}"
          CODEX_SESSION_ID: "ci-${{ github.run_id }}-${{ github.job }}-${{ matrix.session.nox }}"
        run: |
          nox -s ${{ matrix.session.nox }} || (echo "::error ::nox session failed" && exit 1)

      - name: Vendor guard (post-session)
        if: always()
        run: |
          python scripts/vendor_guard.py || (echo "::error ::Vendor guard detected vendor packages post-session" && exit 1)

      - name: Disk snapshot
        if: always()
        run: |
          chmod +x scripts/disk_snapshot.sh || true
          ./scripts/disk_snapshot.sh || true

      - name: Evidence schema check
        if: always()
        run: |
          python scripts/check_dependency_evidence.py || true

      - name: Upload evidence and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.session.nox }}
          path: |
            .codex/evidence/dependency_ops.jsonl
            .codex/cache/setup_summary.json
            .codex/cache/maintenance_summary.json
            artifacts/**
          if-no-files-found: ignore

  config-validation:
    name: "Config validation (strict)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_FORCE_CPU: "1"
      CODEX_VENDOR_PURGE: "1"
      CODEX_DEPENDENCY_EVIDENCE_ENABLE: "1"
      CODEX_ALLOW_TRITON_CPU: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip and install nox
        run: |
          python -m pip install --upgrade pip
          pip install nox

      - name: Run config validation (strict)
        run: |
          nox -s config_validation -- --group all --strict --quiet --report artifacts/config_validation_report.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-validation-report
          path: artifacts/config_validation_report.json
          if-no-files-found: warn