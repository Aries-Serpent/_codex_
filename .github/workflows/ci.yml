name: ci

on:
  push:
    branches: ["main", "chore/bootstrap-governance-2025-10-24"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (e.g., ubuntu-latest or self-hosted)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gh_hosted:
    # Schedule this job unless the manual run explicitly targets self-hosted.
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.runner == 'self-hosted' || vars.DEFAULT_RUNNER == 'self-hosted')) }}
    runs-on: ${{ inputs.runner || vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Debug runner info
        run: |
          echo "Runner name: ${{ runner.name }}"
          echo "Runner os: ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          echo "Runner labels: ${{ join(runner.labels, ',') }}"
      - name: Lint (placeholder)
        run: echo "lint passed"
      - name: Validate presence of governance files
        run: |
          if [ -f .github/CODEOWNERS ]; then
            echo "CODEOWNERS present"
          else
            echo "CODEOWNERS missing (non-blocking)"
          fi
          test -f SECURITY.md
          test -f README.md
          echo "governance files present"
      - name: Note existing disabled workflows (non-blocking)
        run: |
          ls -1 .github/workflows/*.disabled 2>/dev/null || true

  self_hosted:
    # Only schedule on manual dispatch when runner input or DEFAULT_RUNNER indicate self-hosted.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.runner == 'self-hosted' || vars.DEFAULT_RUNNER == 'self-hosted') }}
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Debug runner info
        run: |
          echo "Runner name: ${{ runner.name }}"
          echo "Runner os: ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          echo "Runner labels: ${{ join(runner.labels, ',') }}"
      - name: Validate presence of governance files
        run: |
          if [ -f .github/CODEOWNERS ]; then
            echo "CODEOWNERS present"
          else
            echo "CODEOWNERS missing (non-blocking)"
          fi
          test -f SECURITY.md
          test -f README.md
          echo "self-hosted path OK"
