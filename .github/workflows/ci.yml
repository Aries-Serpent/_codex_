name: PR & CI Gates

on:
  pull_request:
    branches:
      - "0D_base_"
      - "main"
    paths:
      - "src/**"
      - "tests/**"
      - "noxfile.py"
      - "requirements*.txt"
      - "config/mypy.ini"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - "0D_base_"
      - "main"
    paths:
      - "src/**"
      - "tests/**"
      - "noxfile.py"
      - "requirements*.txt"
      - "config/mypy.ini"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Offline-first defaults for runtime libraries that might attempt network calls.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  CODEX_DETERMINISM: "1"
  CODEX_SEED: "42"
  CODEX_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CODEX_OPTIONAL_SOFTFAIL: "1"
  CODEX_CI_ENABLE_GITLEAKS: "0"

jobs:
  security:
    name: Security Scan (pip-audit + bandit + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install nox

      - name: Install gitleaks (binary)
        if: env.CODEX_CI_ENABLE_GITLEAKS == '1'
        run: |
          set -euxo pipefail
          ver="8.18.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run security session
        run: nox -s security

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            artifacts/security_report.json
            artifacts/bandit_report.txt
            artifacts/gitleaks_report.json
            artifacts/security_summary.json

  coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: security
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install nox

      - name: Run coverage session (pytest + per-target thresholds)
        run: |
          nox -s coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            artifacts/coverage.xml
            artifacts/htmlcov

  typing:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install nox

      - name: Run mypy session and write summary
        run: |
          nox -s typecheck

      - name: Upload typing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typing-artifacts
          path: artifacts/mypy_summary.txt

  env_and_docs:
    name: Env Snapshot & Docs Manifest
    runs-on: ubuntu-latest
    needs: typing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate environment snapshot
        run: |
          python tools/env_snapshot.py

      - name: Generate docs manifest
        run: |
          python scripts/generate_docs_manifest.py

      - name: Upload env/docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: env-docs-artifacts
          path: |
            artifacts/env_snapshot.json
            artifacts/docs_manifest.sha

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - security
      - coverage
      - typing
      - env_and_docs
    steps:
      - name: Generate summary
        run: |
          {
            echo "CI Gates executed."
            echo "- Security: see security-artifacts"
            echo "- Coverage: see coverage-artifacts"
            echo "- Typing: see typing-artifacts"
            echo "- Env/Docs: see env-docs-artifacts"
          } > ci_summary.txt

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ci_summary.txt
