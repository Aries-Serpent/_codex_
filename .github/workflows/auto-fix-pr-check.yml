name: PR Auto-Fix Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/*.yml'
      - 'pyproject.toml'
      - 'noxfile.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-report:
    name: Detect CI Issues & Post Fix Instructions
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow auto-fix-pr-check 2>/dev/null || echo "Cache health: check skipped"
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml

      - name: Create diagnostic directory
        run: mkdir -p .codex

      - name: Run diagnostic check with JSON output
        id: diagnostic
        run: |
          python scripts/ci/auto_fix_common_issues.py \
            --check-only \
            --json-output .codex/diagnostic-report.json
        continue-on-error: true

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-report-${{ github.event.pull_request.number }}
          path: .codex/diagnostic-report.json
          retention-days: 30

      - name: Read diagnostic report for summary
        if: always()
        id: read_report
        run: |
          if [ -f .codex/diagnostic-report.json ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            # Extract key metrics
            AUTO_FIXABLE=$(jq -r '.auto_fixable // 0' .codex/diagnostic-report.json)
            TOTAL_ISSUES=$(jq -r '.total_issues // 0' .codex/diagnostic-report.json)
            MANUAL_REVIEW=$(jq -r '.manual_review // 0' .codex/diagnostic-report.json)
            echo "auto_fixable=$AUTO_FIXABLE" >> $GITHUB_OUTPUT
            echo "total_issues=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
            echo "manual_review=$MANUAL_REVIEW" >> $GITHUB_OUTPUT
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Copilot Agent comment
        id: gen_comment
        if: steps.diagnostic.outcome == 'failure' && steps.read_report.outputs.report_exists == 'true'
        uses: actions/github-script@v7
        env:
          AUTO_FIXABLE: ${{ steps.read_report.outputs.auto_fixable }}
          TOTAL_ISSUES: ${{ steps.read_report.outputs.total_issues }}
          MANUAL_REVIEW: ${{ steps.read_report.outputs.manual_review }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Read diagnostic report
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('.codex/diagnostic-report.json', 'utf8'));
            } catch (error) {
              console.log('Could not read diagnostic report:', error);
              return; // Exit if we can't read the report
            }

            // Build summary table
            const groupedIssues = {};
            report.issues.forEach(issue => {
              const key = `${issue.pattern}-${issue.pattern_name}`;
              if (!groupedIssues[key]) {
                groupedIssues[key] = {
                  pattern: issue.pattern,
                  name: issue.pattern_name,
                  count: 0,
                  autoFix: issue.auto_fix_available,
                  severity: issue.severity
                };
              }
              groupedIssues[key].count++;
            });

            let summaryTable = '| Pattern | Type | Count | Auto-Fix | Severity |\n';
            summaryTable += '|---------|------|-------|----------|----------|\n';

            Object.values(groupedIssues).forEach(group => {
              summaryTable += `| ${group.pattern} | ${group.name} | ${group.count} | ${group.autoFix ? '✅ Yes' : '⚠️ Manual'} | ${group.severity === 'error' ? '🔴 Error' : '⚠️ Warning'} |\n`;
            });

            // Build critical issues section
            const autoFixableIssues = report.issues.filter(i => i.auto_fix_available);
            let criticalIssues = '#### 🔴 Auto-Fixable Issues (Must Fix Before Merge)\n\n';
            if (autoFixableIssues.length === 0) {
              criticalIssues += '_No auto-fixable issues detected._\n\n';
            } else {
              autoFixableIssues.slice(0, 10).forEach(issue => {
                criticalIssues += `- **${issue.file}${issue.line ? ':' + issue.line : ''}**\n`;
                criticalIssues += `  - Pattern ${issue.pattern}: ${issue.pattern_name}\n`;
                criticalIssues += `  - ${issue.message}\n\n`;
              });
              if (autoFixableIssues.length > 10) {
                criticalIssues += `_... and ${autoFixableIssues.length - 10} more issues_\n\n`;
              }
            }

            // Build manual review section
            const manualReviewIssues = report.issues.filter(i => !i.auto_fix_available);
            let manualIssues = '#### ⚠️ Manual Review Needed (Informational Only)\n\n';
            if (manualReviewIssues.length === 0) {
              manualIssues += '_No manual review issues detected._\n\n';
            } else {
              manualReviewIssues.slice(0, 5).forEach(issue => {
                manualIssues += `- **${issue.file}${issue.line ? ':' + issue.line : ''}**: ${issue.message}\n`;
              });
              if (manualReviewIssues.length > 5) {
                manualIssues += `_... and ${manualReviewIssues.length - 5} more informational warnings_\n\n`;
              }
            }

            // Build complete comment
            const comment = `## 🤖 Copilot Agent: Auto-Fix Instructions

            ### 📊 Diagnostic Summary

            ${summaryTable}

            **Total Issues**: ${report.total_issues} | **Auto-Fixable**: ${report.auto_fixable} | **Manual Review**: ${report.manual_review}

            ---

            ${criticalIssues}

            ${manualIssues}

            ---

            ## 🎯 Quick Fix Options

            ### Option A: One-Command Copilot Fix (Recommended)
            Copy and paste into Copilot Chat:

            \`\`\`
            @workspace Fix all auto-fixable CI issues in PR #${prNumber}:
            1. Run: python scripts/ci/auto_fix_common_issues.py
            2. Verify fixes: python scripts/ci/auto_fix_common_issues.py --check-only
            3. Run tests: nox -s tests
            4. Commit: "fix(ci): resolve auto-fixable issues [Copilot]"
            5. Push changes
            \`\`\`

            ### Option B: Local Fix
            \`\`\`bash
            # Checkout PR branch
            gh pr checkout ${prNumber}

            # Run auto-fix script
            python scripts/ci/auto_fix_common_issues.py

            # Verify changes
            git diff

            # Commit and push
            git add -A
            git commit -m "fix(ci): resolve auto-fixable issues"
            git push
            \`\`\`

            ### Option C: Manual Workflow Trigger
            1. Go to [Actions → Auto-Fix Common CI Issues](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/auto-fix-common-issues.yml)
            2. Click **Run workflow**
            3. Select this PR's branch
            4. Uncheck "Only check for issues"
            5. Run workflow

            ---

            ## 📋 Next Steps

            ${report.next_steps.map(step => `- ${step}`).join('\n')}

            ---

            **Diagnostic Report**: [Download Artifact](${runUrl})
            **Workflow Run**: [View Details](${runUrl})

            _This comment was auto-generated by the PR Auto-Fix Check workflow._`;

            // Post to consolidated PR Status Dashboard instead of standalone comment
            const status = report.auto_fixable > 0 ? 'failure' : (report.manual_review > 0 ? 'warning' : 'success');
            const summary = report.auto_fixable > 0
              ? `${report.auto_fixable} auto-fixable issue(s) detected — must fix before merge`
              : report.manual_review > 0
                ? `${report.manual_review} informational warning(s) — no blocking issues`
                : 'No CI issues detected';
            core.setOutput('status', status);
            core.setOutput('summary', summary);
            core.setOutput('comment_body', comment);

      - name: Post to PR Status Dashboard
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/post-pr-summary
        with:
          workflow-name: 'Auto-Fix PR Check'
          status: ${{ steps.gen_comment.outputs.status || (steps.diagnostic.outcome == 'failure' && 'warning' || 'success') }}
          summary: ${{ steps.gen_comment.outputs.summary || (steps.diagnostic.outcome == 'failure' && 'CI issues detected — see details' || 'No CI issues detected') }}
          details: ${{ steps.gen_comment.outputs.comment_body || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if auto-fixable issues found
        if: steps.diagnostic.outcome == 'failure' && steps.read_report.outputs.auto_fixable != '0'
        run: |
          echo "::error::Auto-fixable CI issues detected. See PR comment for fix instructions."
          echo "ℹ️  Manual review issues are informational only."
          exit 1

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: check-and-report
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Auto-Fix PR Check"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"******","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: auto-fix-pr-check.yml → rescue-comment job (S227)_"""
          _,comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100")
          existing_id=None; existing_body=""
          if isinstance(comments,list):
            for c in comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
