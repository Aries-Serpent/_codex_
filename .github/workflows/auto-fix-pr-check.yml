name: PR Auto-Fix Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/*.yml'
      - 'pyproject.toml'
      - 'noxfile.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-report:
    name: Detect CI Issues & Post Fix Instructions
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      checks: write
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml
      
      - name: Create diagnostic directory
        run: mkdir -p .codex
      
      - name: Run diagnostic check with JSON output
        id: diagnostic
        run: |
          python scripts/ci/auto_fix_common_issues.py \
            --check-only \
            --json-output .codex/diagnostic-report.json
        continue-on-error: true
      
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-report-${{ github.event.pull_request.number }}
          path: .codex/diagnostic-report.json
          retention-days: 30
      
      - name: Read diagnostic report for summary
        if: always()
        id: read_report
        run: |
          if [ -f .codex/diagnostic-report.json ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            # Extract key metrics
            AUTO_FIXABLE=$(jq -r '.auto_fixable // 0' .codex/diagnostic-report.json)
            TOTAL_ISSUES=$(jq -r '.total_issues // 0' .codex/diagnostic-report.json)
            MANUAL_REVIEW=$(jq -r '.manual_review // 0' .codex/diagnostic-report.json)
            echo "auto_fixable=$AUTO_FIXABLE" >> $GITHUB_OUTPUT
            echo "total_issues=$TOTAL_ISSUES" >> $GITHUB_OUTPUT
            echo "manual_review=$MANUAL_REVIEW" >> $GITHUB_OUTPUT
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate Copilot Agent comment
        if: steps.diagnostic.outcome == 'failure' && steps.read_report.outputs.report_exists == 'true'
        uses: actions/github-script@v7
        env:
          AUTO_FIXABLE: ${{ steps.read_report.outputs.auto_fixable }}
          TOTAL_ISSUES: ${{ steps.read_report.outputs.total_issues }}
          MANUAL_REVIEW: ${{ steps.read_report.outputs.manual_review }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            // Read diagnostic report
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('.codex/diagnostic-report.json', 'utf8'));
            } catch (error) {
              console.log('Could not read diagnostic report:', error);
              return; // Exit if we can't read the report
            }
            
            // Build summary table
            const groupedIssues = {};
            report.issues.forEach(issue => {
              const key = `${issue.pattern}-${issue.pattern_name}`;
              if (!groupedIssues[key]) {
                groupedIssues[key] = {
                  pattern: issue.pattern,
                  name: issue.pattern_name,
                  count: 0,
                  autoFix: issue.auto_fix_available,
                  severity: issue.severity
                };
              }
              groupedIssues[key].count++;
            });
            
            let summaryTable = '| Pattern | Type | Count | Auto-Fix | Severity |\n';
            summaryTable += '|---------|------|-------|----------|----------|\n';
            
            Object.values(groupedIssues).forEach(group => {
              summaryTable += `| ${group.pattern} | ${group.name} | ${group.count} | ${group.autoFix ? '✅ Yes' : '⚠️ Manual'} | ${group.severity === 'error' ? '🔴 Error' : '⚠️ Warning'} |\n`;
            });
            
            // Build critical issues section
            const autoFixableIssues = report.issues.filter(i => i.auto_fix_available);
            let criticalIssues = '#### 🔴 Auto-Fixable Issues (Must Fix Before Merge)\n\n';
            if (autoFixableIssues.length === 0) {
              criticalIssues += '_No auto-fixable issues detected._\n\n';
            } else {
              autoFixableIssues.slice(0, 10).forEach(issue => {
                criticalIssues += `- **${issue.file}${issue.line ? ':' + issue.line : ''}**\n`;
                criticalIssues += `  - Pattern ${issue.pattern}: ${issue.pattern_name}\n`;
                criticalIssues += `  - ${issue.message}\n\n`;
              });
              if (autoFixableIssues.length > 10) {
                criticalIssues += `_... and ${autoFixableIssues.length - 10} more issues_\n\n`;
              }
            }
            
            // Build manual review section
            const manualReviewIssues = report.issues.filter(i => !i.auto_fix_available);
            let manualIssues = '#### ⚠️ Manual Review Needed (Informational Only)\n\n';
            if (manualReviewIssues.length === 0) {
              manualIssues += '_No manual review issues detected._\n\n';
            } else {
              manualReviewIssues.slice(0, 5).forEach(issue => {
                manualIssues += `- **${issue.file}${issue.line ? ':' + issue.line : ''}**: ${issue.message}\n`;
              });
              if (manualReviewIssues.length > 5) {
                manualIssues += `_... and ${manualReviewIssues.length - 5} more informational warnings_\n\n`;
              }
            }
            
            // Build complete comment
            const comment = `## 🤖 Copilot Agent: Auto-Fix Instructions
            
### 📊 Diagnostic Summary

${summaryTable}

**Total Issues**: ${report.total_issues} | **Auto-Fixable**: ${report.auto_fixable} | **Manual Review**: ${report.manual_review}

---

${criticalIssues}

${manualIssues}

---

## 🎯 Quick Fix Options

### Option A: One-Command Copilot Fix (Recommended)
Copy and paste into Copilot Chat:

\`\`\`
@workspace Fix all auto-fixable CI issues in PR #${prNumber}:
1. Run: python scripts/ci/auto_fix_common_issues.py
2. Verify fixes: python scripts/ci/auto_fix_common_issues.py --check-only
3. Run tests: nox -s tests
4. Commit: "fix(ci): resolve auto-fixable issues [Copilot]"
5. Push changes
\`\`\`

### Option B: Local Fix
\`\`\`bash
# Checkout PR branch
gh pr checkout ${prNumber}

# Run auto-fix script
python scripts/ci/auto_fix_common_issues.py

# Verify changes
git diff

# Commit and push
git add -A
git commit -m "fix(ci): resolve auto-fixable issues"
git push
\`\`\`

### Option C: Manual Workflow Trigger
1. Go to [Actions → Auto-Fix Common CI Issues](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/auto-fix-common-issues.yml)
2. Click **Run workflow**
3. Select this PR's branch
4. Uncheck "Only check for issues"
5. Run workflow

---

## 📋 Next Steps

${report.next_steps.map(step => `- ${step}`).join('\n')}

---

**Diagnostic Report**: [Download Artifact](${runUrl})
**Workflow Run**: [View Details](${runUrl})

_This comment was auto-generated by the PR Auto-Fix Check workflow._`;
            
            // Post comment
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if auto-fixable issues found
        if: steps.diagnostic.outcome == 'failure' && steps.read_report.outputs.auto_fixable != '0'
        run: |
          echo "::error::Auto-fixable CI issues detected. See PR comment for fix instructions."
          echo "ℹ️  Manual review issues are informational only."
          exit 1
