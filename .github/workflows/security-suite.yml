name: Unified Security Suite

on:
  # Run on PRs and pushes to main branches
  pull_request:
    branches: ["main", "0D_base_"]
  push:
    branches: ["main", "0D_base_"]

  # Scheduled security scans
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

  # Manual trigger
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Specific security scan to run'
        required: false
        type: choice
        options:
          - all
          - dependencies
          - secrets
          - code
          - policy
        default: 'all'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  # Dependency scanning job
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    if: inputs.scan_type == 'all' || inputs.scan_type == 'dependencies' || inputs.scan_type == ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'live'
