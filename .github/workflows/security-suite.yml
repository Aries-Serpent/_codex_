name: Unified Security Suite

on:
  # Run on PRs and pushes to main branches
  pull_request:
    branches: ["main", "0D_base_"]
  push:
    branches: ["main", "0D_base_"]
  
  # Scheduled security scans
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Specific security scan to run'
        required: false
        type: choice
        options:
          - all
          - dependencies
          - secrets
          - code
          - policy
        default: 'all'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  # Dependency scanning job
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    if: inputs.scan_type == 'all' || inputs.scan_type == 'dependencies' || inputs.scan_type == ''
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety==3.2.* pip-audit==2.7.*

      - name: Run Safety check
        id: safety
        run: |
          safety check --json > safety-report.json || true
          safety check || echo "Safety found vulnerabilities"
        continue-on-error: true

      - name: Run pip-audit
        id: pip-audit
        run: |
          pip-audit --desc --format json > pip-audit-report.json || true
          pip-audit --desc || echo "pip-audit found vulnerabilities"
        continue-on-error: true

      - name: Upload dependency scan results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-scan-results
          path: |
            safety-report.json
            pip-audit-report.json
          retention-days: 90

      - name: Create issue for critical vulnerabilities
        if: steps.safety.outcome == 'failure' || steps.pip-audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔒 Critical Security Vulnerabilities Detected';
            const body = `## Security Alert
            
            Critical vulnerabilities were detected in project dependencies.
            
            **Scan Date**: ${new Date().toISOString()}
            **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### Action Required
            1. Review the scan results in workflow artifacts
            2. Update vulnerable dependencies
            3. Re-run security scan to verify fixes
            
            ### Resources
            - [Safety Database](https://github.com/pyupio/safety-db)
            - [pip-audit Documentation](https://github.com/pypa/pip-audit)
            
            ---
            *Auto-generated by Security Suite workflow*`;
            
            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies'
            });
            
            const existingIssue = issues.data.find(issue => issue.title === title);
            
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'dependencies', 'critical']
              });
            }

  # Secret scanning job
  secret-scan:
    name: Secret Security Scan
    runs-on: ubuntu-latest
    if: inputs.scan_type == 'all' || inputs.scan_type == 'secrets' || inputs.scan_type == ''
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true

      - name: Custom secret patterns check
        run: |
          echo "Checking for custom secret patterns..."
          
          # Check for common secret patterns
          PATTERNS=(
            "password\s*=\s*['\"][^'\"]{8,}['\"]"
            "api[_-]?key\s*=\s*['\"][^'\"]{16,}['\"]"
            "secret\s*=\s*['\"][^'\"]{16,}['\"]"
            "token\s*=\s*['\"][^'\"]{16,}['\"]"
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" . --exclude-dir={.git,node_modules,venv,.venv} --exclude="*.{yml,yaml,md}"; then
              echo "Found potential secret: $pattern"
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 1 ]; then
            echo "⚠️ Potential secrets found in code"
            exit 1
          fi
        continue-on-error: true

  # Code security scanning job
  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    if: inputs.scan_type == 'all' || inputs.scan_type == 'code' || inputs.scan_type == ''
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit==1.7.* bandit-sarif-formatter==1.1.*

      - name: Run Bandit security scan
        run: |
          bandit -r src/ -f sarif -o bandit-results.sarif || true
          bandit -r src/ -f screen || echo "Bandit found security issues"
        continue-on-error: true

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            p/owasp-top-ten
          generateSarif: "1"
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Policy and compliance check job
  policy-check:
    name: Security Policy Check
    runs-on: ubuntu-latest
    if: inputs.scan_type == 'all' || inputs.scan_type == 'policy' || inputs.scan_type == ''
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for required security files
        run: |
          echo "Checking for required security files..."
          REQUIRED_FILES=(
            "SECURITY.md"
            "CODE_OF_CONDUCT.md"
            ".github/CODEOWNERS"
          )
          
          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              MISSING=1
            else
              echo "✅ Found: $file"
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo "::warning::Some security policy files are missing"
          fi

      - name: Verify dependency pinning
        run: |
          echo "Checking for unpinned dependencies in workflows..."
          
          # Check workflow files for unpinned actions
          UNPINNED=$(grep -r "uses:.*@[^v0-9]" .github/workflows/ || true)
          
          if [ -n "$UNPINNED" ]; then
            echo "::warning::Found unpinned actions in workflows"
            echo "$UNPINNED"
          else
            echo "✅ All actions are properly pinned"
          fi

      - name: Check Python dependencies for known CVEs
        run: |
          pip install pip-audit==2.7.*
          pip-audit --requirement <(pip freeze) || echo "CVEs found in dependencies"

  # Security summary and reporting
  security-summary:
    name: Security Summary
    needs: [dependency-scan, secret-scan, code-scan, policy-check]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all scan results
        uses: actions/download-artifact@v4
        with:
          path: security-results/
        continue-on-error: true

      - name: Generate security summary
        run: |
          echo "# 🔒 Security Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date**: $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Scan | ${{ needs.code-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Policy Check | ${{ needs.policy-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [ "${{ needs.dependency-scan.result }}" == "success" ] && \
             [ "${{ needs.secret-scan.result }}" == "success" ] && \
             [ "${{ needs.code-scan.result }}" == "success" ] && \
             [ "${{ needs.policy-check.result }}" == "success" ]; then
            echo "### ✅ All Security Scans Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Security Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the individual scan results and address any findings." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR with security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const depStatus = '${{ needs.dependency-scan.result }}' === 'success' ? '✅' : '❌';
            const secretStatus = '${{ needs.secret-scan.result }}' === 'success' ? '✅' : '❌';
            const codeStatus = '${{ needs.code-scan.result }}' === 'success' ? '✅' : '❌';
            const policyStatus = '${{ needs.policy-check.result }}' === 'success' ? '✅' : '❌';
            
            const comment = `## 🔒 Security Suite Results
            
            | Scan Type | Status |
            |-----------|--------|
            | Dependency Scan | ${depStatus} |
            | Secret Scan | ${secretStatus} |
            | Code Scan | ${codeStatus} |
            | Policy Check | ${policyStatus} |
            
            **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            Download detailed reports from the [workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *This comment was automatically generated by the Unified Security Suite workflow*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail workflow if critical issues found
        if: |
          needs.dependency-scan.result == 'failure' ||
          needs.secret-scan.result == 'failure' ||
          needs.code-scan.result == 'failure'
        run: |
          echo "::error::Critical security issues detected"
          exit 1
