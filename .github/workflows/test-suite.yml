name: Testing Suite

"on":
  # Run on all PRs
  pull_request:
    branches: [main, develop]

  # Run on push to main
  push:
    branches: [main]

  # Manual trigger with test selection
  workflow_dispatch:
    inputs:
      test-scope:
        description: 'Test scope to run'
        required: true
        type: choice
        options:
          - 'all'
          - 'core'
          - 'rag'
          - 'auth'
          - 'integration'
          - 'determinism'
        default: 'all'
      python-version:
        description: 'Python version'
        required: false
        default: '3.12'
      fail-fast:
        description: 'Fail fast on first error'
        required: false
        type: boolean
        default: false
      xdist-workers:
        description: 'Number of xdist workers'
        required: false
        type: number
        default: 4
      xdist-dist:
        description: 'xdist distribution strategy'
        required: false
        type: choice
        options:
          - 'worksteal'
          - 'load'
          - 'loadfile'
          - 'each'
        default: 'worksteal'

  # Enable workflow_call for AI agent integration
  workflow_call:
    inputs:
      test-scope:
        description: 'Test scope to run'
        required: false
        type: string
        default: 'all'
      python-version:
        description: 'Python version'
        required: false
        type: string
        default: '3.12'

permissions:
  contents: read
  checks: write  # For test reporting
  pull-requests: write  # For PR comments

env:
  PYTHON_VERSION: '3.12'
  # PYTEST_ADDOPTS removed - environment variable causes pytest-xdist workers to crash during plugin initialization;
  # pytest options are passed directly on the command line instead to avoid these worker crashes.

jobs:
  # Job 1: Core Tests - Main test suite
  core-tests:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'core')) ||
      github.event_name == 'workflow_call'

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ matrix.python-version }}
          cache-tier: live  # Use live tier for critical tests

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Explicitly install pytest plugins BEFORE editable install to ensure availability
          pip install "pytest>=8.2.0,<9.0.0" "pytest-cov>=4.1.0,<6.0.0" "pytest-xdist>=3.5.0,<4.0.0" "pytest-timeout>=2.2.0,<3.0.0" "coverage>=7.5"
          pip install -e ".[test]"

      - name: Python interpreter and plugin diagnostics
        run: |
          python - << 'PY'
          import sys
          try:
              import xdist
              print(f"Controller sys.executable: {sys.executable}")
              print(f"xdist version: {xdist.__version__}")
          except ImportError:
              print("⚠️  xdist not available")
          
          try:
              import pytest_cov
              print(f"pytest-cov version: {pytest_cov.__version__}")
          except ImportError:
              print("⚠️  pytest-cov not available")
          
          try:
              import coverage
              print(f"coverage version: {coverage.__version__}")
          except ImportError:
              print("⚠️  coverage not available")
          PY
          
          echo ""
          python -m pytest --version

      - name: Show test collection diagnostics
        run: |
          echo "=== Test Collection Diagnostics ==="
          # Capture combined stdout and stderr for easier error handling and reporting
          COLLECT_OUTPUT="$(python -m pytest tests/ --collect-only -q 2>&1)"
          COLLECT_STATUS=$?
          printf '%s\n' "$COLLECT_OUTPUT" | head -50
          if [ "$COLLECT_STATUS" -ne 0 ]; then
            echo "⚠️  Test collection may have issues"
            echo "=== Full pytest output (stdout + stderr) ==="
            printf '%s\n' "$COLLECT_OUTPUT"
          fi
          echo ""
          echo "=== Test Directory Structure ==="
          find tests/ -name "test_*.py" -type f | wc -l | xargs echo "Total test files:"
          echo ""

      - name: Run core tests with coverage (layered fallbacks)
        run: |
          set -euo pipefail
          
          # Determine xdist configuration (use workflow inputs or defaults)
          XDIST_WORKERS="${{ github.event.inputs.xdist-workers || 4 }}"
          XDIST_DIST="${{ github.event.inputs.xdist-dist || 'worksteal' }}"
          
          echo "🔧 Configuration: workers=${XDIST_WORKERS}, dist=${XDIST_DIST}"
          
          # PRIMARY: Plugin-driven parallel run with pytest-cov and xdist
          if pytest tests/ \
            --color=yes \
            --verbose \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=junit.xml \
            -n "${XDIST_WORKERS}" \
            --dist="${XDIST_DIST}" \
            --maxfail=10; then
            echo "✅ Primary: Plugin-driven parallel run succeeded"
          else
            echo "⚠️  Primary failed; trying FALLBACK 1: coverage-run with reduced workers"
            
            # FALLBACK 1: Use coverage run with reduced parallelism
            if coverage run -m pytest tests/ \
              --color=yes \
              --verbose \
              --junitxml=junit.xml \
              -n 2 \
              --dist=load \
              --maxfail=10; then
              echo "✅ Fallback 1: Coverage-run parallel succeeded"
            else
              echo "⚠️  Fallback 1 failed; trying FALLBACK 2: sequential coverage-run"
              
              # FALLBACK 2: Sequential run without xdist
              if coverage run -m pytest tests/ \
                --color=yes \
                --verbose \
                --junitxml=junit.xml \
                --maxfail=10; then
                echo "✅ Fallback 2: Sequential coverage-run succeeded"
              else
                echo "❌ All fallback strategies failed"
                exit 1
              fi
            fi
          fi
        env:
          PYTHONPATH: ${{ github.workspace }}
          CODEX_FORCE_CPU: "1"
          RAG_EMBEDDING_PROVIDER: tfidf

      - name: Combine and report coverage
        if: always()
        run: |
          echo "📊 Combining coverage data from worker processes..."
          coverage combine || echo "⚠️  Coverage combine had issues (may be no .coverage.* files)"
          
          echo "📈 Generating coverage reports..."
          coverage html || echo "⚠️  HTML report generation had issues"
          coverage xml || echo "⚠️  XML report generation had issues"
          
          echo ""
          echo "📋 Coverage Summary:"
          coverage report || echo "⚠️  Coverage report had issues"
          
          echo ""
          echo "🎯 Checking coverage threshold (soft gate: ≥10%)..."
          if coverage report --fail-under=10; then
            echo "✅ Coverage meets or exceeds 10% threshold"
          else
            echo "⚠️  Soft gate: Coverage below 10% - this is expected during initial uplift phase"
          fi

      - name: Optional isolated plugin run (guarded)
        if: ${{ github.event.inputs.test-scope == 'core' && github.event_name == 'workflow_dispatch' }}
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: ${{ github.workspace }}
          CODEX_FORCE_CPU: "1"
          RAG_EMBEDDING_PROVIDER: tfidf
        run: |
          echo "🔒 Running isolated plugin test (PYTEST_DISABLE_PLUGIN_AUTOLOAD=1)"
          echo "This verifies explicit plugin loading works correctly"
          
          pytest tests/ \
            -p pytest_cov \
            -p xdist \
            --color=yes \
            --verbose \
            --cov=src \
            --cov-report=term \
            -n 2 \
            --dist=worksteal \
            --maxfail=10 || echo "⚠️  Isolated run failed - this is informational only"

      - name: Ensure test artifacts exist
        if: always()
        run: |
          # Guarantee all artifacts exist to prevent upload failures
          python scripts/ensure_test_artifacts.py --coverage --junit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          name: coverage-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload JUnit test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-report-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Generate test summary
        if: always()
        run: |
          echo "## Core Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Python Version:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show test counts from JUnit XML if available using Python for robust parsing
          if [ -f junit.xml ]; then
            python3 .github/scripts/parse_junit_xml.py junit.xml >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "See attached artifacts for detailed coverage reports." >> $GITHUB_STEP_SUMMARY

  # Job 2: RAG Tests - Specialized RAG testing
  rag-tests:
    name: RAG Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'rag'))

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ matrix.python-version }}
          cache-tier: common

      - name: Cache sentence transformers models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: ${{ runner.os }}-sentence-transformers-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-sentence-transformers-py${{ matrix.python-version }}-
            ${{ runner.os }}-sentence-transformers-

      - name: Install RAG dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,rag]"

      - name: Run RAG tests
        run: |
          pytest tests/rag/ \
            --cov=src/codex/rag \
            --cov-report=xml \
            -v

      - name: Upload RAG coverage
        uses: actions/upload-artifact@v6
        with:
          name: rag-coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  # Job 3: Auth Tests - Authentication & security tests
  auth-tests:
    name: Auth Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'auth'))

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ matrix.python-version }}
          cache-tier: common

      - name: Install auth dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test,auth]"

      - name: Run auth tests
        env:
          # Use test secrets (not real)
          TEST_JWT_SECRET: test_secret_key_for_testing_only
          TEST_MASTER_KEY: test_master_key_for_testing_only
        run: |
          pytest tests/auth/ tests/security/ \
            --cov=src/codex/auth \
            --cov=src/codex/security \
            --cov-report=xml \
            -v

      - name: Security scan of auth code
        run: |
          pip install bandit safety
          bandit -r src/codex/auth/ src/codex/security/ -f json -o /tmp/bandit-auth.json || true
          safety check --json > /tmp/safety-auth.json || true

      - name: Upload auth security report
        uses: actions/upload-artifact@v6
        with:
          name: auth-security-report-${{ matrix.python-version }}
          path: |
            /tmp/bandit-auth.json
            /tmp/safety-auth.json
          retention-days: 7

  # Job 4: Integration Tests - Cross-component testing
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'integration'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[all]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --cov=src \
            --cov-report=xml \
            --timeout=300 \
            -v

      - name: Upload integration coverage
        uses: actions/upload-artifact@v6
        with:
          name: integration-coverage
          path: coverage.xml
          retention-days: 7

  # Job 5: Determinism Tests - Ensure reproducibility
  determinism-tests:
    name: Determinism Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.test-scope == 'all' || inputs.test-scope == 'determinism'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common

      - name: Install dependencies
        run: |
          pip install -e ".[test]"

      - name: Run determinism tests (iteration 1)
        id: run1
        run: |
          pytest tests/determinism/ -v --json-report --json-report-file=/tmp/results1.json

      - name: Run determinism tests (iteration 2)
        id: run2
        run: |
          pytest tests/determinism/ -v --json-report --json-report-file=/tmp/results2.json

      - name: Compare results
        run: |
          python .github/scripts/compare_test_results.py /tmp/results1.json /tmp/results2.json

  # Summary job
  test-suite-summary:
    name: Test Suite Summary
    runs-on: ubuntu-latest
    needs: [core-tests, rag-tests, auth-tests, integration-tests, determinism-tests]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Testing Suite - Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Core Tests:** ${{ needs.core-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**RAG Tests:** ${{ needs.rag-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Auth Tests:** ${{ needs.auth-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Integration Tests:** ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Determinism Tests:** ${{ needs.determinism-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine overall status
          if [ "${{ needs.core-tests.result }}" == "success" ]; then
            echo "✅ All critical tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed - review individual job outputs" >> $GITHUB_STEP_SUMMARY
          fi
