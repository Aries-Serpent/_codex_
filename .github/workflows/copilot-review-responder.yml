name: "🤖 Copilot Review Responder"

# WHY TWO TRIGGERS:
# copilot-pull-request-reviewer[bot] submits a pull_request_review event with an
# EMPTY review body. The "## Pull request overview … generated N comments" summary
# is posted separately as a PR issue comment AFTER the review is submitted.
# Therefore we MUST listen on issue_comment:created to catch that summary comment.
# The pull_request_review trigger still fires and reacts 👍 to the review itself.
#
# Workflow behaviour:
#   pull_request_review (submitted):
#     → reacts 👍 to the review and all existing bot review/issue comments.
#   issue_comment (created) from a bot containing "generated N comments":
#     → reacts 👍 to the comment
#     → finds the most recent bot PR review (to build the review URL)
#     → posts "@copilot apply changes based on the comments in this thread (<review URL>)"
#
# Bot actors targeted: copilot-pull-request-reviewer[bot], copilot[bot],
#   github-copilot[bot], gemini-code-assist[bot], amazon-q[bot],
#   copilot-swe-agent[bot]
#
# Security:
#   - issue_comment trigger only fires for PR comments (checks pull_request.url).
#   - Continuation comment only posted when bot says "generated N > 0 comments".
#   - GROUNDED: no infinite loops — the continuation comment is @copilot apply
#     (a coding agent task), not another @copilot review.

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

# Concurrency: use PR number (available in both events) with fallback to run ID.
concurrency:
  group: copilot-review-responder-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write

jobs:
  respond-to-review:
    name: "Auto-respond to Copilot review"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fire when:
    #   A. pull_request_review submitted by a recognized bot  (body may be empty — see header)
    #   B. issue_comment created by a recognized bot on a PR containing "generated N comments"
    if: >-
      (github.event_name == 'pull_request_review' &&
       contains(fromJSON('["copilot-pull-request-reviewer[bot]","copilot[bot]","github-copilot[bot]","gemini-code-assist[bot]","copilot-swe-agent[bot]","amazon-q[bot]"]'), github.event.review.user.login))
      ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request.url != '' &&
       contains(fromJSON('["copilot-pull-request-reviewer[bot]","copilot[bot]","github-copilot[bot]","gemini-code-assist[bot]","copilot-swe-agent[bot]","amazon-q[bot]"]'), github.event.comment.user.login) &&
       contains(github.event.comment.body, 'generated') &&
       contains(github.event.comment.body, 'comments'))

    steps:
      - name: "👍 React to bot review and acknowledge bot comments"
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const eventName = context.eventName;

            // Bot actors whose comments we acknowledge with 👍
            const BOT_ACTORS = new Set([
              'copilot-pull-request-reviewer[bot]',
              'copilot[bot]',
              'github-copilot[bot]',
              'gemini-code-assist[bot]',
              'copilot-swe-agent[bot]',
              'amazon-q[bot]',
            ]);

            // Determine PR number for both event types
            const pr = eventName === 'pull_request_review'
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            // ── 1. React 👍 to the PR review itself (pull_request_review only) ──
            if (eventName === 'pull_request_review') {
              const reviewId = context.payload.review.id;
              try {
                await github.rest.reactions.createForPullRequestReview({
                  owner, repo, pull_number: pr, review_id: reviewId, content: '+1',
                });
                console.log(`👍 Reacted to review ${reviewId}`);
              } catch (e) {
                console.log(`Could not react to review ${reviewId}: ${e.message}`);
              }
            }

            // ── 2. Fetch all PR review comments and react 👍 to bot ones ──────
            let page = 1;
            const acknowledged = [];
            while (true) {
              const { data: comments } = await github.rest.pulls.listReviewComments({
                owner, repo, pull_number: pr, per_page: 100, page,
              });
              if (comments.length === 0) break;
              for (const comment of comments) {
                const actor = comment.user?.login ?? '';
                if (!BOT_ACTORS.has(actor)) continue;
                let alreadyReacted = false;
                try {
                  const { data: reactions } = await github.rest.reactions.listForPullRequestReviewComment({
                    owner, repo, comment_id: comment.id,
                  });
                  alreadyReacted = reactions.some(
                    r => r.content === '+1' && r.user?.login === 'github-actions[bot]'
                  );
                } catch (e) { /* ignore */ }
                if (!alreadyReacted) {
                  try {
                    await github.rest.reactions.createForPullRequestReviewComment({
                      owner, repo, comment_id: comment.id, content: '+1',
                    });
                    acknowledged.push(comment.id);
                    console.log(`👍 Acknowledged review comment ${comment.id} by ${actor}`);
                  } catch (e) {
                    console.log(`Could not react to comment ${comment.id}: ${e.message}`);
                  }
                }
              }
              page++;
            }

            // ── 3. Also acknowledge regular PR issue comments from bots ───────
            page = 1;
            while (true) {
              const { data: issueComments } = await github.rest.issues.listComments({
                owner, repo, issue_number: pr, per_page: 100, page,
              });
              if (issueComments.length === 0) break;
              for (const comment of issueComments) {
                const actor = comment.user?.login ?? '';
                if (!BOT_ACTORS.has(actor)) continue;
                let alreadyReacted = false;
                try {
                  const { data: reactions } = await github.rest.reactions.listForIssueComment({
                    owner, repo, comment_id: comment.id,
                  });
                  alreadyReacted = reactions.some(
                    r => r.content === '+1' && r.user?.login === 'github-actions[bot]'
                  );
                } catch (e) { /* ignore */ }
                if (!alreadyReacted) {
                  try {
                    await github.rest.reactions.createForIssueComment({
                      owner, repo, comment_id: comment.id, content: '+1',
                    });
                    acknowledged.push(comment.id);
                    console.log(`👍 Acknowledged issue comment ${comment.id} by ${actor}`);
                  } catch (e) {
                    console.log(`Could not react to issue comment ${comment.id}: ${e.message}`);
                  }
                }
              }
              page++;
            }
            console.log(`Total acknowledged: ${acknowledged.length} comment(s)`);

      - name: "💬 Post @copilot apply changes (issue_comment trigger only)"
        # This step only runs when triggered by the bot's overview issue comment
        # (which contains "generated N comments"). The pull_request_review event
        # has an empty review body, so we skip posting for that trigger.
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner       = context.repo.owner;
            const repo        = context.repo.repo;
            const pr          = context.payload.issue.number;
            const commentBody = context.payload.comment.body ?? '';
            const reviewer    = context.payload.comment.user.login;

            // Extract the "generated N comments" count
            const match = commentBody.match(/generated\s+(\d+)\s+comments?/i);
            const count = match ? parseInt(match[1], 10) : null;

            // Skip if the review explicitly generated 0 comments
            if (count !== null && count === 0) {
              console.log('Review generated 0 comments — skipping @copilot trigger.');
              return;
            }

            // Find the most recent bot PR review to build the review URL.
            // The review ID is not in the issue_comment payload, so we fetch it.
            const BOT_ACTORS = new Set([
              'copilot-pull-request-reviewer[bot]',
              'copilot[bot]',
              'github-copilot[bot]',
              'gemini-code-assist[bot]',
              'copilot-swe-agent[bot]',
              'amazon-q[bot]',
            ]);

            let reviewId = null;
            try {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr,
              });
              // Sort descending by submitted_at to get the most recent bot review
              const botReviews = reviews
                .filter(r => BOT_ACTORS.has(r.user?.login ?? ''))
                .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at));
              if (botReviews.length > 0) {
                reviewId = botReviews[0].id;
                console.log(`Found most recent bot review: ${reviewId} by ${botReviews[0].user.login}`);
              }
            } catch (e) {
              console.log(`Could not fetch PR reviews (non-fatal): ${e.message}`);
            }

            const countStr  = count !== null ? `${count}` : 'some';
            const reviewUrl = reviewId
              ? `https://github.com/${owner}/${repo}/pull/${pr}#pullrequestreview-${reviewId}`
              : `https://github.com/${owner}/${repo}/pull/${pr}`;

            const body = [
              `@copilot+claude-sonnet-4.6 apply changes based on the comments in [this thread](${reviewUrl})`,
              ``,
              `> 🤖 **Auto-triggered** by \`${reviewer}\` review (${countStr} comment(s) generated).`,
              `> All bot review comments have been acknowledged with 👍.`,
              `> Please address all review comments and resolve any open threads.`,
              '',
              '---',
              `_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr, body,
            });
            console.log(`@copilot apply posted for review ${reviewId ?? 'unknown'} (${countStr} comments).`);

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: respond-to-review
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Copilot Review Responder"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
