name: "🤖 Copilot Review Responder"

# Fires when a pull_request_review is submitted.
# When the Copilot bot posts a review containing "generated N comments", this
# workflow:
#   1. Reacts with 👍 to ALL unresolved bot-posted review comments/threads on
#      the PR (so subsequent agent sessions know those items have been seen).
#   2. Posts "@copilot continue" to trigger the next Copilot Coding Agent
#      session automatically.
#
# Bot actors targeted: copilot-pull-request-reviewer[bot], copilot[bot],
#   github-copilot[bot], gemini-code-assist[bot], amazon-q[bot],
#   copilot-swe-agent[bot]
#
# Security:
#   - Only fires on PR reviews (not issue comments) to avoid infinite loops.
#   - GROUNDED: workflow only auto-posts "@copilot continue" when the review
#     explicitly says "generated N comments" (i.e. actionable findings exist).
#   - If updated by a coding agent, the 👍 reaction is removed (via the
#     "unmark resolved" step) so the next agent knows the comment was revisited.

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: copilot-review-responder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write

jobs:
  respond-to-review:
    name: "Auto-respond to Copilot review"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only trigger when:
    #   1. A recognized bot submitted the review, AND
    #   2. The review body contains "generated N comments" (actionable findings)
    if: |
      contains(fromJSON('["copilot-pull-request-reviewer[bot]","copilot[bot]","github-copilot[bot]","gemini-code-assist[bot]","copilot-swe-agent[bot]"]'), github.event.review.user.login) &&
      contains(github.event.review.body, 'generated') &&
      contains(github.event.review.body, 'comments')

    steps:
      - name: "👍 React to and acknowledge bot review comments"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Bot actors whose comments we acknowledge with 👍
            const BOT_ACTORS = new Set([
              'copilot-pull-request-reviewer[bot]',
              'copilot[bot]',
              'github-copilot[bot]',
              'gemini-code-assist[bot]',
              'copilot-swe-agent[bot]',
              'amazon-q[bot]',
            ]);

            // ── 1. React 👍 to the review itself ────────────────────────────
            try {
              await github.rest.reactions.createForPullRequestReviewComment({
                owner, repo,
                comment_id: context.payload.review.id,
                content: '+1',
              });
              console.log(`👍 Reacted to review ${context.payload.review.id}`);
            } catch (e) {
              console.log(`Could not react to review: ${e.message}`);
            }

            // ── 2. Fetch all PR review comments and react 👍 to bot ones ──
            let page = 1;
            const acknowledged = [];
            while (true) {
              const { data: comments } = await github.rest.pulls.listReviewComments({
                owner, repo, pull_number: pr, per_page: 100, page,
              });
              if (comments.length === 0) break;
              for (const comment of comments) {
                const actor = comment.user?.login ?? '';
                if (!BOT_ACTORS.has(actor)) continue;

                // Check if we already 👍'd this comment
                let alreadyReacted = false;
                try {
                  const { data: reactions } = await github.rest.reactions.listForPullRequestReviewComment({
                    owner, repo, comment_id: comment.id,
                  });
                  alreadyReacted = reactions.some(
                    r => r.content === '+1' && r.user?.login === 'github-actions[bot]'
                  );
                } catch (e) { /* ignore */ }

                if (!alreadyReacted) {
                  try {
                    await github.rest.reactions.createForPullRequestReviewComment({
                      owner, repo, comment_id: comment.id, content: '+1',
                    });
                    acknowledged.push(comment.id);
                    console.log(`👍 Acknowledged comment ${comment.id} by ${actor}`);
                  } catch (e) {
                    console.log(`Could not react to comment ${comment.id}: ${e.message}`);
                  }
                }
              }
              page++;
            }

            // ── 3. Also acknowledge regular PR comments from bots ─────────
            page = 1;
            while (true) {
              const { data: issueComments } = await github.rest.issues.listComments({
                owner, repo, issue_number: pr, per_page: 100, page,
              });
              if (issueComments.length === 0) break;
              for (const comment of issueComments) {
                const actor = comment.user?.login ?? '';
                if (!BOT_ACTORS.has(actor)) continue;

                let alreadyReacted = false;
                try {
                  const { data: reactions } = await github.rest.reactions.listForIssueComment({
                    owner, repo, comment_id: comment.id,
                  });
                  alreadyReacted = reactions.some(
                    r => r.content === '+1' && r.user?.login === 'github-actions[bot]'
                  );
                } catch (e) { /* ignore */ }

                if (!alreadyReacted) {
                  try {
                    await github.rest.reactions.createForIssueComment({
                      owner, repo, comment_id: comment.id, content: '+1',
                    });
                    acknowledged.push(comment.id);
                    console.log(`👍 Acknowledged issue comment ${comment.id} by ${actor}`);
                  } catch (e) {
                    console.log(`Could not react to issue comment ${comment.id}: ${e.message}`);
                  }
                }
              }
              page++;
            }

            console.log(`Total acknowledged: ${acknowledged.length} comment(s)`);

      - name: "💬 Post @copilot continue"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const reviewBody = context.payload.review.body ?? '';
            const reviewer = context.payload.review.user.login;

            // Extract the "generated N comments" count for the message
            const match = reviewBody.match(/generated\s+(\d+)\s+comments?/i);
            const count = match ? match[1] : 'some';

            const body = [
              `@copilot continue`,
              ``,
              `> 🤖 **Auto-triggered** by \`${reviewer}\` review (${count} comment(s) generated).`,
              `> All bot review comments have been acknowledged with 👍.`,
              `> Please address the review comments and resolve any open threads.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr, body,
            });
            console.log('@copilot continue posted.');
