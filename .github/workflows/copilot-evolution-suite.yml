name: Copilot Evolution & Review (Unified)
on:
  pull_request:
    types:
    - opened
    - reopened
  issue_comment:
    types:
    - created
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        type: choice
        options:
        - evolution-only
        - review-only
        - full-suite
        default: full-suite
      evolution_mode:
        description: Evolution mode (for evolution runs)
        required: false
        default: adaptive
        type: choice
        options:
        - adaptive
        - aggressive
        - conservative
        - quantum_leap
      test_only:
        description: Run tests only (no evolution)
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  cascade_review:
    name: Cascade PR Review
    runs-on: ubuntu-latest
    if: 'github.event_name == ''pull_request'' ||

      (github.event_name == ''issue_comment'' && contains(github.event.comment.body,
      ''@cascade-review'')) ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''review-only''
      || inputs.mode == ''full-suite''))

      '
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: "\U0001F500 Resolve push target (chain: sub-PR \u2192 0D_base_ \u2192\
        \ main)"
      id: resolve-target
      uses: ./.github/actions/resolve-push-target
    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - name: Install Copilot CLI (if available)
      continue-on-error: true
      run: 'npm install -g @github/copilot@prerelease || echo "CLI installation skipped"

        copilot --version || echo "CLI not available - will use fallback mode"

        '
    - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Get PR information
      if: github.event_name == 'pull_request'
      id: pr
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: "echo \"pr_number=${{ github.event.pull_request.number }}\" >> $GITHUB_OUTPUT\n\
        {\n  echo 'pr_title<<EOF'\n  echo \"${PR_TITLE}\"\n  echo 'EOF'\n} >> \"$GITHUB_OUTPUT\"\
        \necho \"pr_author=${{ github.event.pull_request.user.login }}\" >> $GITHUB_OUTPUT\n"
    - name: Run cascade review
      run: "if [ -f \"scripts/copilot/cascade_review.py\" ]; then\n  python scripts/copilot/cascade_review.py\
        \ \\\n    --pr-number \"${{ steps.pr.outputs.pr_number || github.event.issue.number\
        \ }}\"\nelse\n  echo \"Cascade review script not found - using fallback\"\n\
        \  echo \"## \U0001F916 Copilot Cascade Review\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"Review mode: Cascade PR analysis\" >> $GITHUB_STEP_SUMMARY\nfi\n"
    - name: Upload review results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: '.codex/reviews/*.json

          .codex/reviews/*.md

          '
        if-no-files-found: ignore
        retention-days: 30
        name: cascade-review-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  self_evolution:
    name: Self-Evolution Pipeline
    runs-on: ubuntu-latest
    if: 'github.event_name == ''schedule'' ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''evolution-only''
      || inputs.mode == ''full-suite''))

      '
    outputs:
      evolution_performed: ${{ steps.evolve.outputs.performed }}
      test_results: ${{ steps.test.outputs.results }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: "\U0001F500 Resolve push target (chain: sub-PR \u2192 0D_base_ \u2192\
        \ main)"
      id: resolve-target
      uses: ./.github/actions/resolve-push-target
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Install evolution dependencies
      run: '# Pin pytest plugins (PR  #3248)

        # Pin pytest plugins before package install (PR  #3248 stability fix)

        pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0
        pytest-asyncio==1.3.0

        pip install numpy scipy pyyaml pytest

        '
    - name: Test integrated system
      id: test
      run: "if [ -f \"tests/copilot/test_evolution_system.py\" ]; then\n  pytest tests/copilot/test_evolution_system.py\
        \ -v --tb=short --timeout=300\n  echo \"results=passed\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"Evolution tests not found\"\n  echo \"results=skipped\" >>\
        \ $GITHUB_OUTPUT\nfi\n"
    - name: Run evolution pipeline
      id: evolve
      if: inputs.test_only != 'true' && steps.test.outputs.results == 'passed'
      run: "if [ -f \"scripts/copilot/evolution_pipeline.py\" ]; then\n  python scripts/copilot/evolution_pipeline.py\
        \ \\\n    --mode \"$EVOLUTION_MODE\" \\\n    --test-first\n  echo \"performed=true\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"Evolution pipeline script not found\"\n\
        \  echo \"performed=false\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Collect evolution metrics
      if: steps.evolve.outputs.performed == 'true'
      run: "if [ -f \".github/copilot-evolution/data/metrics.json\" ]; then\n  echo\
        \ \"## \U0001F4CA Evolution Metrics\" >> $GITHUB_STEP_SUMMARY\n  cat .github/copilot-evolution/data/metrics.json\
        \ >> $GITHUB_STEP_SUMMARY\nfi\n"
    - name: Upload evolution artifacts
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: '.github/copilot-evolution/data/*.json

          .github/copilot-evolution/logs/*.log

          .codex/evolution/*.json

          '
        if-no-files-found: ignore
        retention-days: 90
        name: evolution-artifacts-${{ github.run_number }}
    - name: Commit evolution updates
      if: steps.evolve.outputs.performed == 'true'
      run: "git config --local user.email \"github-actions[bot]@users.noreply.github.com\"\
        \ngit config --local user.name \"github-actions[bot]\"\n\nif [[ -n $(git status\
        \ --porcelain .github/copilot-evolution/) ]]; then\n  git add .github/copilot-evolution/\n\
        \  git commit -m \"\U0001F9EC Copilot self-evolution update [automated]\n\n\
        \  - Evolution mode: ${{ inputs.evolution_mode || 'adaptive' }}\n  - Triggered\
        \ by: ${{ github.event_name }}\n  - Timestamp: $(date -u +\"%Y-%m-%dT%H:%M:%SZ\"\
        )\"\n\n  # Walk the staging chain: sub-PR \u2192 0D_base_ \u2192 main  (resolved\
        \ above)\n  if [ \"${{ github.event_name }}\" = \"schedule\" ] || [ \"${{\
        \ github.ref_name }}\" = \"main\" ]; then\n    TARGET_REF=\"${{ steps.resolve-target.outputs.branch\
        \ }}\"\n    echo \"\U0001F500 Push target: ${TARGET_REF} (reason: ${{ steps.resolve-target.outputs.reason\
        \ }})\"\n  else\n    TARGET_REF=\"${{ github.ref_name }}\"\n  fi\n  echo \"\
        \U0001F504 Syncing local evolution commit onto origin/${TARGET_REF} before\
        \ push\"\n  git fetch origin \"${TARGET_REF}\"\n  git rebase \"origin/${TARGET_REF}\"\
        \n  git push origin HEAD:${TARGET_REF}\n  echo \"\u2705 Evolution updates\
        \ committed\"\nelse\n  echo \"\u2139\uFE0F  No evolution updates to commit\"\
        \nfi\n"
    timeout-minutes: 30
  unified_summary:
    name: Generate Unified Summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - cascade_review
    - self_evolution
    if: always()
    steps:
    - name: Generate comprehensive summary
      run: "echo \"## \U0001F916 Copilot Evolution & Review Summary\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Mode:** ${{ inputs.mode || github.event_name\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\necho \"\
        ### Job Status\" >> $GITHUB_STEP_SUMMARY\necho \"- Cascade Review: ${{ needs.cascade_review.result\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"- Self-Evolution: ${{ needs.self_evolution.result\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\nif [ \"\
        ${{ needs.self_evolution.outputs.evolution_performed }}\" == \"true\" ]; then\n\
        \  echo \"\u2705 Evolution pipeline executed successfully\" >> $GITHUB_STEP_SUMMARY\n\
        fi\nif [ \"${{ github.event_name }}\" == \"pull_request\" ]; then\n  echo\
        \ \"\U0001F4DD Cascade review completed for PR  #${{ github.event.pull_request.number\
        \ }}\" >> $GITHUB_STEP_SUMMARY\nfi\n"
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --type pip --workflow copilot-evolution-suite
        --health 2>/dev/null || echo ''{"status": "cache health check skipped"}''

        '
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: unified_summary
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
