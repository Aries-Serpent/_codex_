name: Copilot Evolution & Review (Unified)

on:
  # Self-evolution pipeline every 4 hours
  schedule:
    - cron: '0 */4 * * *'

  # Cascade review on PRs — opened/reopened only (not every push)
  # synchronize REMOVED (S155): fires on every commit push, triggering auto-commits
  # that conflict with agent report_progress pushes. The 4h schedule covers freshness.
  pull_request:
    types: [opened, reopened]

  # Manual triggers for specific tasks
  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - evolution-only
          - review-only
          - full-suite
        default: 'full-suite'
      evolution_mode:
        description: 'Evolution mode (for evolution runs)'
        required: false
        default: 'adaptive'
        type: choice
        options:
          - adaptive
          - aggressive
          - conservative
          - quantum_leap
      test_only:
        description: 'Run tests only (no evolution)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  cascade_review:
    name: Cascade PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@cascade-review')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'review-only' || inputs.mode == 'full-suite'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔀 Resolve push target (chain: sub-PR → 0D_base_ → main)"
        id: resolve-target
        uses: ./.github/actions/resolve-push-target

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Copilot CLI (if available)
        continue-on-error: true
        run: |
          npm install -g @github/copilot@prerelease || echo "CLI installation skipped"
          copilot --version || echo "CLI not available - will use fallback mode"

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Get PR information
        if: github.event_name == 'pull_request'
        id: pr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          {
            echo 'pr_title<<EOF'
            echo "${PR_TITLE}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "pr_author=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT

      - name: Run cascade review
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          if [ -f "scripts/copilot/cascade_review.py" ]; then
            python scripts/copilot/cascade_review.py \
              --pr-number "${{ steps.pr.outputs.pr_number || github.event.issue.number }}"
          else
            echo "Cascade review script not found - using fallback"
            echo "## 🤖 Copilot Cascade Review" >> $GITHUB_STEP_SUMMARY
            echo "Review mode: Cascade PR analysis" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascade-review-${{ github.run_number }}
          path: |
            .codex/reviews/*.json
            .codex/reviews/*.md
          if-no-files-found: ignore
          retention-days: 30

  self_evolution:
    name: Self-Evolution Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'evolution-only' || inputs.mode == 'full-suite'))
    outputs:
      evolution_performed: ${{ steps.evolve.outputs.performed }}
      test_results: ${{ steps.test.outputs.results }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔀 Resolve push target (chain: sub-PR → 0D_base_ → main)"
        id: resolve-target
        uses: ./.github/actions/resolve-push-target

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Install evolution dependencies
        run: |
          # Pin pytest plugins (PR #3248)
          # Pin pytest plugins before package install (PR #3248 stability fix)
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0



          pip install numpy scipy pyyaml pytest

      - name: Test integrated system
        id: test
        run: |
          if [ -f "tests/copilot/test_evolution_system.py" ]; then
            pytest tests/copilot/test_evolution_system.py -v --tb=short --timeout=300
            echo "results=passed" >> $GITHUB_OUTPUT
          else
            echo "Evolution tests not found"
            echo "results=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Run evolution pipeline
        id: evolve
        if: inputs.test_only != 'true' && steps.test.outputs.results == 'passed'
        env:
          EVOLUTION_MODE: ${{ inputs.evolution_mode || 'adaptive' }}
        run: |
          if [ -f "scripts/copilot/evolution_pipeline.py" ]; then
            python scripts/copilot/evolution_pipeline.py \
              --mode "$EVOLUTION_MODE" \
              --test-first
            echo "performed=true" >> $GITHUB_OUTPUT
          else
            echo "Evolution pipeline script not found"
            echo "performed=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect evolution metrics
        if: steps.evolve.outputs.performed == 'true'
        run: |
          if [ -f ".github/copilot-evolution/data/metrics.json" ]; then
            echo "## 📊 Evolution Metrics" >> $GITHUB_STEP_SUMMARY
            cat .github/copilot-evolution/data/metrics.json >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload evolution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-artifacts-${{ github.run_number }}
          path: |
            .github/copilot-evolution/data/*.json
            .github/copilot-evolution/logs/*.log
            .codex/evolution/*.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit evolution updates
        if: steps.evolve.outputs.performed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [[ -n $(git status --porcelain .github/copilot-evolution/) ]]; then
            git add .github/copilot-evolution/
            git commit -m "🧬 Copilot self-evolution update [automated]

            - Evolution mode: ${{ inputs.evolution_mode || 'adaptive' }}
            - Triggered by: ${{ github.event_name }}
            - Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            # Walk the staging chain: sub-PR → 0D_base_ → main  (resolved above)
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.ref_name }}" = "main" ]; then
              TARGET_REF="${{ steps.resolve-target.outputs.branch }}"
              echo "🔀 Push target: ${TARGET_REF} (reason: ${{ steps.resolve-target.outputs.reason }})"
            else
              TARGET_REF="${{ github.ref_name }}"
            fi
            echo "🔄 Syncing local evolution commit onto origin/${TARGET_REF} before push"
            git fetch origin "${TARGET_REF}"
            git rebase "origin/${TARGET_REF}"
            git push origin HEAD:${TARGET_REF}
            echo "✅ Evolution updates committed"
          else
            echo "ℹ️  No evolution updates to commit"
          fi

  unified_summary:
    name: Generate Unified Summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [cascade_review, self_evolution]
    if: always()

    steps:
      - name: Generate comprehensive summary
        run: |
          echo "## 🤖 Copilot Evolution & Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.mode || github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Cascade Review: ${{ needs.cascade_review.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Self-Evolution: ${{ needs.self_evolution.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.self_evolution.outputs.evolution_performed }}" == "true" ]; then
            echo "✅ Evolution pipeline executed successfully" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "📝 Cascade review completed for PR #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow copilot-evolution-suite --health 2>/dev/null || echo '{"status": "cache health check skipped"}'

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: unified_summary
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Copilot Evolution Suite"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: copilot-evolution-suite.yml → rescue-comment job (S227)_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
