name: Art_Authentication Tests

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
    paths:
      - 'src/codex/auth/**'
      - 'tests/auth/**'
      - '.github/workflows/auth-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/codex/auth/**'
      - 'tests/auth/**'
  workflow_dispatch:

jobs:
  test-authentication:
    name: Test Authentication Module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }} with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ matrix.python-version }}
          cache-tier: common

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin pytest plugins (PR #3248)
          # Pin pytest plugins before package install (PR #3248 stability fix)
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0



          pip install -e ".[test]"
          pip install httpx  # Additional dependency for auth tests

      - name: Run authentication tests
        run: |
          pytest tests/auth/ -v --cov=src/codex/auth --cov-report=xml --cov-report=term --timeout=300

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: authentication
          name: auth-coverage
          fail_ci_if_error: false

      - name: Test examples
        run: |
          # Test that examples run without errors (in demo mode)
          python examples/authentication/02_mfa_setup.py || true
          python examples/authentication/03_token_management.py
          python examples/authentication/04_complete_flow.py

      - name: Security scan
        run: |
          pip install bandit
          bandit -r src/codex/auth/ -ll -f json -o auth-security-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: auth-security-report-${{ matrix.python-version }}
          path: auth-security-report.json
          retention-days: 30

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test-authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          pip install httpx  # Additional dependency for auth tests

      - name: Run integration tests
        run: |
          pytest tests/auth/ -v -m "not slow" --tb=short

      - name: Test OAuth flow components
        run: |
          python -c "
          from src.codex.auth import OAuthManager, MFAProvider, TokenManager

          # Verify all components initialize correctly
          oauth = OAuthManager()
          mfa = MFAProvider()
          tokens = TokenManager()

          print('✓ All authentication components initialized successfully')
          "

      - name: Test MFA functionality
        run: |
          python -c "
          from src.codex.auth.mfa_provider import MFAProvider

          mfa = MFAProvider()
          secret = mfa.generate_totp_secret('test_user')
          code = mfa.generate_totp(secret.secret)
          valid = mfa.verify_totp(secret.secret, code, 'test_user')

          assert valid, 'MFA verification failed'
          print('✓ MFA functionality verified')
          "

      - name: Test token management
        run: |
          python -c "
          from src.codex.auth.token_manager import TokenManager, TokenType

          tokens = TokenManager()
          access_token = tokens.generate_access_token('test_user')
          claims = tokens.validate_token(access_token, TokenType.ACCESS)

          assert claims.sub == 'test_user', 'Token validation failed'
          print('✓ Token management verified')
          "

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow auth-tests --health 2>/dev/null || echo '{"status": "cache health check skipped"}'
