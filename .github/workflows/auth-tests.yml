name: Authentication Tests
'on':
  push:
    branches:
    - main
    - develop
    - copilot/**
    paths:
    - src/aries_serpent_core/auth/**
    - tests/auth/**
    - .github/workflows/auth-tests.yml
  pull_request:
    branches:
    - main
    - develop
    paths:
    - src/aries_serpent_core/auth/**
    - tests/auth/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  test-authentication:
    name: Test Authentication Module
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version:
        - 3.12.13
    steps:
    - name: Cache test results (Layer 3)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: always()
      with:
        path: .pytest_cache/
        key: ${{ runner.os }}-pytest-${{ github.sha }}
        restore-keys: '${{ runner.os }}-pytest-

          '
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Initialize with repository variables
      env:
        CODEX_CACHE_VERSION: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
        CODEX_TEST_TIMEOUT_MINUTES: ${{ vars.CODEX_TEST_TIMEOUT_MINUTES || '60' }}
        CODEX_LOG_LEVEL: ${{ vars.CODEX_LOG_LEVEL || 'INFO' }}
      run: 'echo "Auth test variables initialized:"

        echo "  CODEX_CACHE_VERSION=$CODEX_CACHE_VERSION"

        echo "  CODEX_TEST_TIMEOUT_MINUTES=$CODEX_TEST_TIMEOUT_MINUTES"

        echo "  CODEX_LOG_LEVEL=$CODEX_LOG_LEVEL"

        '
    - name: Set up Python ${{ matrix.python-version }} with tiered cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ matrix.python-version }}
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install dependencies
      run: "python -m pip install --upgrade pip\n# Install pytest plugins with security\
        \ updates (CVE-2025-71176)\n# Use versions from requirements-test.txt for\
        \ full compatibility\necho \"Installing pytest plugins with Python 3.12.13...\"\
        \npip install pytest==9.0.3 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0\
        \ pytest-asyncio==1.3.0\n \n# Verify installations\npython -c \"import pytest;\
        \ print(f'\u2713 pytest {pytest.__version__}')\"\npython -c \"import xdist;\
        \ print(f'\u2713 pytest-xdist {xdist.__version__}')\"\npython -c \"import\
        \ pytest_timeout; print(f'\u2713 pytest-timeout installed')\"\npython -c \"\
        import pytest_cov; print(f'\u2713 pytest-cov installed')\"\npython -c \"import\
        \ pytest_asyncio; print(f'\u2713 pytest-asyncio {pytest_asyncio.__version__}')\"\
        \n\npip install -e \".[dev]\"\npip install httpx  # Additional dependency\
        \ for auth tests\npip install bandit>=1.7.5  # Pre-install bandit for security\
        \ scan\n"
    - name: Cache coverage reports (Layer 4)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: coverage/
        key: ${{ runner.os }}-coverage-${{ github.sha }}
        restore-keys: '${{ runner.os }}-coverage-

          '
    - name: Run authentication tests
      run: |
        pytest tests/auth/ \
         -v --cov=codex.auth --cov-report=xml --cov-report=term --timeout=300 \
         --tb=short
        TEST_EXIT_CODE=$?

        if [ $TEST_EXIT_CODE -ne 0 ]; then
         echo "ERROR: Authentication tests failed with exit code $TEST_EXIT_CODE" >&2
         exit $TEST_EXIT_CODE
        fi

        echo "✓ Authentication tests passed"

    - name: Upload coverage reports
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: authentication
        fail_ci_if_error: false
        name: auth-coverage
    - name: Validate CODEX_MASTER_KEY Scopes
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: |
        set -euo pipefail
        python scripts/ci/test_codex_master_key_scopes.py --report-json .codex/scope_report.json
    - name: Run comprehensive CODEX_MASTER_KEY tests
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: |
        set -euo pipefail
        pytest tests/github/test_repo_variables_comprehensive.py -v --cov=scripts/ci --cov-report=term
        pytest tests/github/test_secrets_management.py -v --cov=scripts/ci --cov-append --cov-report=term
        pytest tests/github/test_workflow_approval_dispatch.py -v --cov=scripts/ci --cov-append --cov-report=term
        pytest tests/github/test_webhooks.py -v --cov=scripts/ci --cov-append --cov-report=term
        pytest tests/github/test_github_comprehensive_phase7a.py -v --cov=scripts/ci --cov-append --cov-report=term
    - name: Generate CODEX_MASTER_KEY coverage report
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: |
        set -euo pipefail
        pytest \
          tests/github/test_repo_variables_comprehensive.py \
          tests/github/test_secrets_management.py \
          tests/github/test_workflow_approval_dispatch.py \
          tests/github/test_webhooks.py \
          tests/github/test_github_comprehensive_phase7a.py \
          --cov=scripts/ci \
          --cov-report=json:coverage.json \
          --cov-report=term
    - name: Upload scope report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        path: .codex/scope_report.json
        retention-days: 30
        if-no-files-found: warn
        name: codex-master-key-scope-report-${{ matrix.python-version }}
    - name: Upload coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        path: coverage.json
        retention-days: 30
        if-no-files-found: warn
        name: codex-master-key-coverage-${{ matrix.python-version }}
    - name: Test examples
      run: |
        set -euo pipefail
        python examples/authentication/02_mfa_setup.py
        python examples/authentication/03_token_management.py
        python examples/authentication/04_complete_flow.py
    - name: Security scan
      id: security_scan
      run: |
       set -euo pipefail
       pip install bandit>=1.7.5
       python -c "import bandit; print(f'✓ bandit {bandit.__version__}')"
       mkdir -p security-reports
       bandit -r src/aries_serpent_core/auth/ -ll -f json -o auth-security-report.json -v 2>&1 | tee bandit-output.log
       BANDIT_EXIT_CODE=${PIPESTATUS[0]}
       if [ "$BANDIT_EXIT_CODE" -gt 1 ]; then
         echo "ERROR: bandit itself failed with code $BANDIT_EXIT_CODE" >&2
         echo "Bandit output:" >&2
         cat bandit-output.log >&2
         exit "$BANDIT_EXIT_CODE"
       fi
       if [ ! -f auth-security-report.json ]; then
         echo "ERROR: bandit failed to generate auth-security-report.json" >&2
         echo "Bandit output:" >&2
         cat bandit-output.log >&2
         exit 1
       fi
       python - <<'PY'
       import json
       from pathlib import Path
       report_path = Path('auth-security-report.json')
       with report_path.open('r', encoding='utf-8') as f:
           data = json.load(f)
       required_keys = ['metrics', 'results']
       missing = [k for k in required_keys if k not in data]
       if missing:
           raise ValueError(f'Missing keys in report: {missing}')
       results = data.get('results') or []
       if results:
           severities = {item.get('issue_severity', 'UNKNOWN').upper() for item in results if isinstance(item, dict)}
           if severities:
               raise SystemExit(f"Bandit reported findings with severities: {sorted(severities)}")
       print('✓ Security report JSON is valid and complete; no blocking findings found')
       PY
       echo "✓ Security scan completed successfully"
       echo "Report location: auth-security-report.json"
    - name: Verify security report exists before upload
      if: always()
      run: "if [ ! -f auth-security-report.json ]; then\n  echo \"ERROR: auth-security-report.json\
        \ not found before artifact upload\" >&2\n  ls -la auth-security-report.json\
        \ 2>&1 || true\n  exit 1\nfi\necho \"\u2713 Security report verified and ready\
        \ for upload\"\nls -lh auth-security-report.json\n"
    - name: Upload security report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      with:
        name: auth-security-report-${{ matrix.python-version }}
        path: auth-security-report.json
        retention-days: 30
        if-no-files-found: error
    timeout-minutes: 30
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test-authentication
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python (cached)
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Install dependencies
      run: "pip install --upgrade pip\n# Pin pytest plugins with security updates\
        \ (CVE-2025-71176)\n# Use versions from requirements-test.txt for full compatibility\n\
        pip install pytest==9.0.3 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0\
        \ pytest-asyncio==1.3.0\n \n# Verify installations\npython -c \"import pytest;\
        \ print(f'\u2713 pytest {pytest.__version__}')\"\npython -c \"import xdist;\
        \ print(f'\u2713 pytest-xdist {xdist.__version__}')\"\npython -c \"import\
        \ pytest_asyncio; print(f'\u2713 pytest-asyncio {pytest_asyncio.__version__}')\"\
        \n \npip install -e \".[dev]\"\npip install httpx  # Additional dependency\
        \ for auth tests\n"
    - name: Run integration tests
      run: "# Run integration tests with verbose output\npytest tests/auth/ -v -m\
        \ \"not slow\" --tb=short -x\nINTEGRATION_EXIT_CODE=$?\n\nif [ $INTEGRATION_EXIT_CODE\
        \ -ne 0 ]; then\n  echo \"ERROR: Integration tests failed with exit code $INTEGRATION_EXIT_CODE\"\
        \ >&2\n  exit $INTEGRATION_EXIT_CODE\nfi\n\necho \"\u2713 Integration tests\
        \ passed\"\n"
    - name: Test OAuth flow components
      run: "python -c \"\nfrom codex.auth import OAuthManager, MFAProvider, TokenManager\n\
        # Verify all components initialize correctly\noauth = OAuthManager()\nmfa\
        \ = MFAProvider()\ntokens = TokenManager()\nprint('\u2713 All authentication\
        \ components initialized successfully')\n\"\n"
    - name: Test MFA functionality
      run: "python -c \"\nfrom codex.auth.mfa_provider import MFAProvider\nmfa\
        \ = MFAProvider()\nsecret = mfa.generate_totp_secret('test_user')\ncode =\
        \ mfa.generate_totp(secret.secret)\nvalid = mfa.verify_totp(secret.secret,\
        \ code, 'test_user')\nassert valid, 'MFA verification failed'\nprint('\u2713\
        \ MFA functionality verified')\n\"\n"
    - name: Test token management
      run: "python -c \"\nfrom codex.auth.token_manager import TokenManager, TokenType\n\
        tokens = TokenManager()\naccess_token = tokens.generate_access_token('test_user')\n\
        claims = tokens.validate_token(access_token, TokenType.ACCESS)\nassert claims.sub\
        \ == 'test_user', 'Token validation failed'\nprint('\u2713 Token management\
        \ verified')\n\"\n"
    - name: Cache health report
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: 'python scripts/ci/generate_cache_keys.py --type pip --workflow auth-tests
        --health 2>/dev/null || echo ''{"status": "cache health check skipped"}''

        '
    timeout-minutes: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: integration-test
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Auth Tests
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
