name: Authentication Tests

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
    paths:
      - 'src/codex/auth/**'
      - 'tests/auth/**'
      - '.github/workflows/auth-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/codex/auth/**'
      - 'tests/auth/**'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test-authentication:
    name: Test Authentication Module
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }} with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ matrix.python-version }}
          cache-tier: common

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin pytest plugins (PR #3248)
          # Pin pytest plugins before package install (PR #3248 stability fix)
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0



          pip install -e ".[test]"
          pip install httpx  # Additional dependency for auth tests

      - name: Run authentication tests
        run: |
          pytest tests/auth/ -v --cov=src/codex/auth --cov-report=xml --cov-report=term --timeout=300

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: authentication
          name: auth-coverage
          fail_ci_if_error: false

      - name: Test examples
        run: |
          # Test that examples run without errors (in demo mode)
          python examples/authentication/02_mfa_setup.py || true
          python examples/authentication/03_token_management.py
          python examples/authentication/04_complete_flow.py

      - name: Security scan
        run: |
          pip install bandit
          bandit -r src/codex/auth/ -ll -f json -o auth-security-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: auth-security-report-${{ matrix.python-version }}
          path: auth-security-report.json
          retention-days: 30

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test-authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          pip install httpx  # Additional dependency for auth tests

      - name: Run integration tests
        run: |
          pytest tests/auth/ -v -m "not slow" --tb=short

      - name: Test OAuth flow components
        run: |
          python -c "
          from src.codex.auth import OAuthManager, MFAProvider, TokenManager

          # Verify all components initialize correctly
          oauth = OAuthManager()
          mfa = MFAProvider()
          tokens = TokenManager()

          print('✓ All authentication components initialized successfully')
          "

      - name: Test MFA functionality
        run: |
          python -c "
          from src.codex.auth.mfa_provider import MFAProvider

          mfa = MFAProvider()
          secret = mfa.generate_totp_secret('test_user')
          code = mfa.generate_totp(secret.secret)
          valid = mfa.verify_totp(secret.secret, code, 'test_user')

          assert valid, 'MFA verification failed'
          print('✓ MFA functionality verified')
          "

      - name: Test token management
        run: |
          python -c "
          from src.codex.auth.token_manager import TokenManager, TokenType

          tokens = TokenManager()
          access_token = tokens.generate_access_token('test_user')
          claims = tokens.validate_token(access_token, TokenType.ACCESS)

          assert claims.sub == 'test_user', 'Token validation failed'
          print('✓ Token management verified')
          "

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow auth-tests --health 2>/dev/null || echo '{"status": "cache health check skipped"}'

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: integration-test
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Auth Tests"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue:{pr_number} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: auth-tests.yml → rescue-comment job (S227)_\n\n_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
