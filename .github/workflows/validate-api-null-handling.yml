name: Validate API Null-Handling
true:
  pull_request:
    paths:
    - src/scripts/ci/**
    - scripts/ci/**
    - .github/workflows/validate-api-null-handling.yml
    branches:
    - main
    - develop
  push:
    branches:
    - main
    paths:
    - src/scripts/ci/**
    - scripts/ci/**
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Fail workflow on violations (default: true for main, false for
          PRs)'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
env:
  PYTHON_VERSION: '3.12'
jobs:
  validate-api-null-handling:
    name: Validate API Null-Handling (RP-001)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Check for unsafe API field handling patterns
      id: safety-check
      run: "set +e\n\necho \"Scanning for unsafe API null-handling patterns...\"\n\
        \nunsafe_get_replace=$(rg '\\.get\\([\"\\047][^\"'\\'']+[\"\\047][,\\)].*\\\
        .replace\\(' \\\n  --glob='scripts/ci/**' \\\n  --glob='src/scripts/ci/**'\
        \ \\\n  --type=python 2>/dev/null || true)\n\nunsafe_response_access=$(rg\
        \ 'response\\[\"[^\"]+\"\\]\\.replace\\(' \\\n  --glob='scripts/ci/**' \\\n\
        \  --glob='src/scripts/ci/**' \\\n  --type=python 2>/dev/null || true)\n\n\
        unsafe_datetime_parse=$(rg 'datetime\\.fromisoformat\\([^)]*\\[.*\\]\\.replace\\\
        (' \\\n  --glob='scripts/ci/**' \\\n  --glob='src/scripts/ci/**' \\\n  --type=python\
        \ 2>/dev/null || true)\n\nviolations_found=false\nviolation_count=0\n\nif\
        \ [ -n \"$unsafe_get_replace\" ]; then\n  echo \"Pattern 1: Unsafe .get().method()\
        \ calls:\"\n  echo \"$unsafe_get_replace\"\n  violations_found=true\n  violation_count=$((violation_count\
        \ + 1))\nfi\n\nif [ -n \"$unsafe_response_access\" ]; then\n  echo \"Pattern\
        \ 2: Unsafe dictionary access without null-check:\"\n  echo \"$unsafe_response_access\"\
        \n  violations_found=true\n  violation_count=$((violation_count + 1))\nfi\n\
        \nif [ -n \"$unsafe_datetime_parse\" ]; then\n  echo \"Pattern 3: Unsafe datetime\
        \ parsing:\"\n  echo \"$unsafe_datetime_parse\"\n  violations_found=true\n\
        \  violation_count=$((violation_count + 1))\nfi\n\nif [ \"$violations_found\"\
        \ = true ]; then\n  echo \"found-violations=true\" >> $GITHUB_OUTPUT\n  echo\
        \ \"violation-count=$violation_count\" >> $GITHUB_OUTPUT\nelse\n  echo \"\
        found-violations=false\" >> $GITHUB_OUTPUT\n  echo \"violation-count=0\" >>\
        \ $GITHUB_OUTPUT\n  echo \"No violations detected\"\nfi\n"
    - name: Run automated validation script
      id: auto-validator
      continue-on-error: true
      run: "if [ -f \"scripts/ci/validate_api_null_handling.py\" ]; then\n  echo \"\
        Running automated API null-handling validator...\"\n  python scripts/ci/validate_api_null_handling.py\
        \ --report\n  validator_exit=$?\n  echo \"validator-exit-code=$validator_exit\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"Automated validator not yet configured\"\
        \n  echo \"validator-exit-code=0\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Determine workflow outcome
      id: outcome
      run: "is_main_push=\"${{ github.event_name == 'push' && github.ref == 'refs/heads/main'\
        \ }}\"\nis_manual_strict=\"${{ github.event.inputs.strict_mode == 'true' }}\"\
        \nviolations_found=\"${{ steps.safety-check.outputs.found-violations }}\"\n\
        \nif [ \"$is_main_push\" = \"true\" ] || [ \"$is_manual_strict\" = \"true\"\
        \ ]; then\n  mode=\"strict\"\nelse\n  mode=\"lenient\"\nfi\n\necho \"mode=$mode\"\
        \ >> $GITHUB_OUTPUT\necho \"is_main_push=$is_main_push\" >> $GITHUB_OUTPUT\n\
        echo \"violations_found=$violations_found\" >> $GITHUB_OUTPUT\n"
    - name: Comment on PR with findings
      if: github.event_name == 'pull_request' && steps.safety-check.outputs.found-violations
        == 'true'
      uses: actions/github-script@v8
      with:
        script: "const violations = ${{ steps.safety-check.outputs.violation-count\
          \ }};\nconst comment = `## API Null-Handling Validation Report\n\nStatus:\
          \ Warnings Found (Non-blocking for PRs)\n\nFound ${violations} potential\
          \ unsafe API null-handling pattern(s).\n\nUse auto-fix: python scripts/ci/validate_api_null_handling.py\
          \ --fix`;\n\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: comment\n\
          });\n"
    - name: Fail workflow on strict mode violations
      if: steps.outcome.outputs.mode == 'strict' && steps.safety-check.outputs.found-violations
        == 'true'
      run: 'echo "API null-handling violations found in strict mode"

        exit 1

        '
    - name: Print validation summary
      run: 'mode="${{ steps.outcome.outputs.mode }}"

        violations="${{ steps.safety-check.outputs.found-violations }}"

        violation_count="${{ steps.safety-check.outputs.violation-count }}"

        echo ""

        echo "======================================================"

        echo "  API Null-Handling Validation Summary"

        echo "======================================================"

        echo "Mode:              $mode"

        echo "Violations Found:  $violations"

        echo "Violation Count:   $violation_count"

        echo "Event:             ${{ github.event_name }}"

        echo "Branch:            ${{ github.ref_name }}"

        echo "======================================================"

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
