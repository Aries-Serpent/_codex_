name: Trigger validations on approval
on:
  pull_request_review:
    types:
    - submitted
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write
  security-events: read
jobs:
  on-approval:
    name: Maintainer dispatch on approval
    # Loop guard: only fire on a genuine human approval. Skip automated "Auto-approved
    # low-risk changes" reviews (posted by auto-approve-workflows/self-approve) which
    # would otherwise re-trigger this workflow and create an unbounded approval loop.
    if: >-
      ${{ github.event.review.state == 'approved' &&
          github.event.review.user.type != 'Bot' &&
          !contains(github.event.review.body, 'Auto-approved low-risk changes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      REPO: ${{ github.repository }}
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Resolve PR context
      id: ctx
      env:
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        REVIEWER_LOGIN: ${{ github.event.review.user.login }}
      run: "PR_SHA=\"${{ github.event.pull_request.head.sha }}\"\nPR_NUM=\"${{ github.event.pull_request.number\
        \ }}\"\nPR_REF=\"$PR_HEAD_REF\"\nREVIEWER=\"$REVIEWER_LOGIN\"\necho \"pr_sha=${PR_SHA}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"pr_num=${PR_NUM}\" >> \"$GITHUB_OUTPUT\"\n\
        echo \"pr_ref=${PR_REF}\" >> \"$GITHUB_OUTPUT\"\necho \"reviewer=${REVIEWER}\"\
        \ >> \"$GITHUB_OUTPUT\"\nPR_BASE=\"${{ github.event.pull_request.base.ref }}\"\
        \necho \"pr_base=${PR_BASE}\" >> \"$GITHUB_OUTPUT\"\nif [ -z \"${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY\
        \ }}\" ]; then\n  echo \"::warning::CODEX_MASTER_KEY not set \u2014 workflow\
        \ dispatch and auto-approve will use github.token fallback (may 403)\"\n \
        \ echo \"token_tier=fallback\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"token_tier=master\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\necho \"Approval by ${REVIEWER} on PR  #${PR_NUM}\
        \ @ ${PR_SHA} (${PR_REF} -> ${PR_BASE})\"\n"
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        ref: ${{ github.event.pull_request.head.ref }}
    - name: Set up Python (for approve_pending_runs.py)
      uses: actions/setup-python@v7
      with:

        python-version: 3.12.13
    # Intent + frequency gate: only proceed when this approval is *actionable* —
    # a human-approved PR targeting `main` whose head SHA has not already been
    # dispatched. Prevents the workflow firing on every approval / unchanged SHA.
    - name: Gate — fire only when intended
      id: gate
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner = context.repo.owner;\nconst repo = context.repo.repo;\n\
          const prNumber = parseInt('${{ steps.ctx.outputs.pr_num }}', 10);\nconst\
          \ sha = '${{ steps.ctx.outputs.pr_sha }}';\nconst base = '${{ steps.ctx.outputs.pr_base\
          \ }}';\nconst sha8 = sha.slice(0, 8);\n\n// 1) Only act on PRs targeting the\
          \ main line — side/integration branches are handled by their own gates.\n\
          if (base !== 'main') {\n  core.info(`base=${base} (not main) — skipping dispatch`);\n\
          \  core.setOutput('proceed', 'false');\n  return;\n}\n\n// 2) Skip if this\
          \ exact SHA was already dispatched (repeat approvals on an unchanged head).\n\
          const marker = `<!-- trigger-on-approval-agent-resume sha=${sha8} -->`;\n\
          const comments = await github.paginate(github.rest.issues.listComments, {\
          \ owner, repo, issue_number: prNumber, per_page: 100 });\nif (comments.some(c\
          \ => (c.body || '').includes(marker))) {\n  core.info(`SHA ${sha8} already\
          \ dispatched — skipping`);\n  core.setOutput('proceed', 'false');\n  return;\n\
          }\n\ncore.info(`Intent satisfied: human approval on main-targeting PR @\
          \ ${sha8} — proceeding`);\ncore.setOutput('proceed', 'true');"
      continue-on-error: true
    - name: Dispatch unified approval hub
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner = context.repo.owner;\nconst repo = context.repo.repo;\n\
          const prNumber = parseInt('${{ steps.ctx.outputs.pr_num }}', 10);\nconst\
          \ prSha = '${{ steps.ctx.outputs.pr_sha }}';\nconst reviewer = '${{ steps.ctx.outputs.reviewer\
          \ }}';\n\ncore.info(`Dispatching auto-approve-workflows.yml for PR  #${prNumber}\
          \ @ ${prSha.slice(0,8)}`);\n\ntry {\n  await github.rest.actions.createWorkflowDispatch({\n\
          \    owner,\n    repo,\n    workflow_id: 'auto-approve-workflows.yml',\n\
          \    ref: 'main',\n    inputs: {\n      approval_source: 'trigger-on-approval',\n\
          \      approval_intent: 'dispatch_validation_suite',\n      target_pr: prNumber.toString(),\n\
          \      approval_reason: `Code review approval from @${reviewer}`,\n    \
          \  approval_ttl_hours: '2',\n      dry_run: 'false'\n    }\n  });\n  core.info('\u2705\
          \ auto-approve-workflows.yml dispatched');\n} catch (err) {\n  core.warning(`Hub\
          \ dispatch failed: ${err.message}`);\n}\n"
      continue-on-error: true
    - name: Dispatch Validation Pipeline (validate.yml)
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner = context.repo.owner;\nconst repo  = context.repo.repo;\n\
          const ref   = '${{ steps.ctx.outputs.pr_sha }}';\ncore.info(`Dispatching\
          \ validate.yml @ ${ref}`);\ntry {\n  await github.rest.actions.createWorkflowDispatch({\n\
          \    owner, repo,\n    workflow_id: 'validate.yml',\n    ref,\n    inputs:\
          \ { mode: 'fast' },\n  });\n  core.info('\u2705 validate.yml dispatched');\n\
          } catch (err) {\n  core.warning(`validate.yml dispatch failed: ${err.message}`);\n\
          }\n"
      continue-on-error: true
    - name: Dispatch Pre-Merge Validation (pre-merge-validation.yml)
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner = context.repo.owner;\nconst repo  = context.repo.repo;\n\
          const ref   = '${{ steps.ctx.outputs.pr_sha }}';\ncore.info(`Dispatching\
          \ pre-merge-validation.yml @ ${ref}`);\ntry {\n  await github.rest.actions.createWorkflowDispatch({\n\
          \    owner, repo,\n    workflow_id: 'pre-merge-validation.yml',\n    ref,\n\
          \    inputs: {},\n  });\n  core.info('\u2705 pre-merge-validation.yml dispatched');\n\
          } catch (err) {\n  core.warning(`pre-merge-validation.yml dispatch failed:\
          \ ${err.message}`);\n}\n"
      continue-on-error: true
    - name: Dispatch CodeQL Alert Fetcher (codeql-alert-fetcher.yml)
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        script: "const owner = context.repo.owner;\nconst repo  = context.repo.repo;\n\
          const ref   = '${{ steps.ctx.outputs.pr_sha }}';\ncore.info(`Dispatching\
          \ codeql-alert-fetcher.yml @ ${ref}`);\ntry {\n  await github.rest.actions.createWorkflowDispatch({\n\
          \    owner, repo,\n    workflow_id: 'codeql-alert-fetcher.yml',\n    ref,\n\
          \    inputs: {\n      state: 'open',\n      tool_name: 'CodeQL',\n     \
          \ max_pages: '10',\n      page_sleep_ms: '1000',\n      top_n: '30',\n \
          \   },\n  });\n  core.info('\u2705 codeql-alert-fetcher.yml dispatched');\n\
          } catch (err) {\n  // Non-fatal \u2014 CODEX_MASTER_KEY may be absent in\
          \ fork contexts\n  core.warning(`codeql-alert-fetcher.yml dispatch failed\
          \ (needs CODEX_MASTER_KEY/security_events): ${err.message}`);\n}\n"
      continue-on-error: true
    - name: Post @copilot continue (resume agent session)
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner    = context.repo.owner;\nconst repo     = context.repo.repo;\n\
          const prNumber = parseInt('${{ steps.ctx.outputs.pr_num }}', 10);\nconst\
          \ reviewer = '${{ steps.ctx.outputs.reviewer }}';\nconst sha      = '${{\
          \ steps.ctx.outputs.pr_sha }}';\n\n// Dedup: skip if a resume comment for\
          \ this SHA already exists (prevents re-post storms on repeat approvals).\n\
          try {\n  const marker = `<!-- trigger-on-approval-agent-resume sha=${sha.slice(0,8)}\
          \ -->`;\n  const comments = await github.paginate(github.rest.issues.listComments,\
          \ { owner, repo, issue_number: prNumber, per_page: 100 });\n  const already\
          \ = comments.some(c => (c.body || '').includes(marker));\n  if (already) {\n\
          \    core.info(`Resume comment for ${sha.slice(0,8)} already present — skipping`);\n\
          \    return;\n  }\n  const body = [\n    marker,\n    `## \u26A1 Approval\
          \ Dispatch \u2014 Copilot Resume`,\n    ``,\n    `PR  #${prNumber} approved\
          \ by **@${reviewer}** at \\`${sha.slice(0,8)}\\`.`,\n    ``,\n    `**Dispatched\
          \ workflows:**`,\n    `- \\`validate.yml\\` (fast mode) \u2705`,\n    `-\
          \ \\`pre-merge-validation.yml\\` \u2705`,\n    `- \\`codeql-alert-fetcher.yml\\\
          ` (requires CODEX_MASTER_KEY) \u2705`,\n    `- All \\`action_required\\` runs\
          \ auto-approved via \\`approve_pending_runs.py\\` \u2705`,\n    ``,\n    `@copilot\
          \ continue`,\n  ].join('\\n');\n  await github.rest.issues.createComment({ owner,\
          \ repo, issue_number: prNumber, body });\n  core.info('\u2705 @copilot continue\
          \ comment posted');\n} catch (err) {\n  core.warning(`Could not post @copilot\
          \ continue comment: ${err.message}`);\n}"
      continue-on-error: true
    - name: Summary
      if: always()
      run: 'echo "================================================================"
        | tee -a "$GITHUB_STEP_SUMMARY"

        echo "  Approval Dispatch Complete"                                     |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "================================================================" |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "  PR     :  #${{ steps.ctx.outputs.pr_num }}"                     |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "  HEAD   : ${{ steps.ctx.outputs.pr_sha }}"                      | tee
        -a "$GITHUB_STEP_SUMMARY"

        echo "  Token  : ${{ steps.ctx.outputs.token_tier }} (CODEX_MASTER_KEY chain)"
        | tee -a "$GITHUB_STEP_SUMMARY"

        echo ""                                                                 |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "  Steps executed:"                                                |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "    1. Dispatch unified approval hub    (auto-approve-workflows.yml)"
        | tee -a "$GITHUB_STEP_SUMMARY"

        echo "    2. validate.yml dispatched            (fast mode)"            |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "    3. pre-merge-validation.yml dispatched"                       |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "    4. codeql-alert-fetcher.yml dispatched (security_events scope)"
        | tee -a "$GITHUB_STEP_SUMMARY"

        echo "    5. @copilot continue posted           (agent session resume)" |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "================================================================" |
        tee -a "$GITHUB_STEP_SUMMARY"

        '
