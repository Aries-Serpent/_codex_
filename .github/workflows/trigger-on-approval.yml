name: Trigger validations on approval
on:
  pull_request_review:
    types:
    - submitted
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write
  security-events: read
jobs:
  on-approval:
    name: Maintainer dispatch on approval
    if: ${{ github.event.review.state == 'approved' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      REPO: ${{ github.repository }}
    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"
      - name: Resolve PR context
        id: ctx
      env:
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        REVIEWER_LOGIN: ${{ github.event.review.user.login }}
        run: "PR_SHA=\"${{ github.event.pull_request.head.sha }}\"\nPR_NUM=\"${{ github.event.pull_request.number\
        \ }}\"\nPR_REF=\"$PR_HEAD_REF\"\nREVIEWER=\"$REVIEWER_LOGIN\"\necho \"pr_sha=${PR_SHA}\"\
        \   >> \"$GITHUB_OUTPUT\"\necho \"pr_num=${PR_NUM}\"   >> \"$GITHUB_OUTPUT\"\
        \necho \"pr_ref=${PR_REF}\"   >> \"$GITHUB_OUTPUT\"\necho \"reviewer=${REVIEWER}\"\
        \ >> \"$GITHUB_OUTPUT\"\nif [ -z \"${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}\" ]; then\n\
        \  echo \"::warning::CODEX_MASTER_KEY not set \u2014 workflow dispatch and\
        \ auto-approve will use github.token fallback (may 403)\"\n  echo \"token_tier=fallback\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"token_tier=master\"  >> \"$GITHUB_OUTPUT\"\
        \nfi\necho \"Approval by ${REVIEWER} on PR  #${PR_NUM} @ ${PR_SHA} (${PR_REF})\"\
        \n"
      - name: Checkout
        uses: actions/checkout@v5
        with:
        persist-credentials: false
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python (for approve_pending_runs.py)
        uses: actions/setup-python@v6
        with:
        cache: pip
        python-version: 3.12.13
      - name: Dispatch unified approval hub
        uses: actions/github-script@v8
        with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner = context.repo.owner;\nconst repo = context.repo.repo;\n\
          const prNumber = parseInt('${{ steps.ctx.outputs.pr_num }}', 10);\nconst\
          \ prSha = '${{ steps.ctx.outputs.pr_sha }}';\nconst reviewer = '${{ steps.ctx.outputs.reviewer\
          \ }}';\n\ncore.info(`Dispatching auto-approve-workflows.yml for PR  #${prNumber}\
          \ @ ${prSha.slice(0,8)}`);\n\ntry {\n  await github.rest.actions.createWorkflowDispatch({\n\
        \    owner,\n    repo,\n    workflow_id: 'auto-approve-workflows.yml',\n\
        \    ref: 'main',\n    inputs: {\n      approval_source: 'trigger-on-approval',\n\
        \      approval_intent: 'dispatch_validation_suite',\n      target_pr: prNumber.toString(),\n\
        \      approval_reason: `Code review approval from @${reviewer}`,\n    \
        \  approval_ttl_hours: '2',\n      dry_run: 'false'\n    }\n  });\n  core.info('\u2705\
          \ auto-approve-workflows.yml dispatched');\n} catch (err) {\n  core.warning(`Hub\
        \ dispatch failed: ${err.message}`);\n}\n"
        continue-on-error: true
      - name: Dispatch Validation Pipeline (validate.yml)
        uses: actions/github-script@v8
        with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner = context.repo.owner;\nconst repo  = context.repo.repo;\n\
          const ref   = '${{ steps.ctx.outputs.pr_sha }}';\ncore.info(`Dispatching\
          \ validate.yml @ ${ref}`);\ntry {\n  await github.rest.actions.createWorkflowDispatch({\n\
        \    owner, repo,\n    workflow_id: 'validate.yml',\n    ref,\n    inputs:\
        \ { mode: 'fast' },\n  });\n  core.info('\u2705 validate.yml dispatched');\n\
        } catch (err) {\n  core.warning(`validate.yml dispatch failed: ${err.message}`);\n\
          }\n"
        continue-on-error: true
      - name: Dispatch Pre-Merge Validation (pre-merge-validation.yml)
        uses: actions/github-script@v8
        with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner = context.repo.owner;\nconst repo  = context.repo.repo;\n\
          const ref   = '${{ steps.ctx.outputs.pr_sha }}';\ncore.info(`Dispatching\
          \ pre-merge-validation.yml @ ${ref}`);\ntry {\n  await github.rest.actions.createWorkflowDispatch({\n\
        \    owner, repo,\n    workflow_id: 'pre-merge-validation.yml',\n    ref,\n\
        \    inputs: {},\n  });\n  core.info('\u2705 pre-merge-validation.yml dispatched');\n\
        } catch (err) {\n  core.warning(`pre-merge-validation.yml dispatch failed:\
          \ ${err.message}`);\n}\n"
        continue-on-error: true
      - name: Dispatch CodeQL Alert Fetcher (codeql-alert-fetcher.yml)
        uses: actions/github-script@v8
        with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        script: "const owner = context.repo.owner;\nconst repo  = context.repo.repo;\n\
          const ref   = '${{ steps.ctx.outputs.pr_sha }}';\ncore.info(`Dispatching\
          \ codeql-alert-fetcher.yml @ ${ref}`);\ntry {\n  await github.rest.actions.createWorkflowDispatch({\n\
        \    owner, repo,\n    workflow_id: 'codeql-alert-fetcher.yml',\n    ref,\n\
        \    inputs: {\n      state: 'open',\n      tool_name: 'CodeQL',\n     \
        \ max_pages: '10',\n      page_sleep_ms: '1000',\n      top_n: '30',\n \
          \   },\n  });\n  core.info('\u2705 codeql-alert-fetcher.yml dispatched');\n\
          } catch (err) {\n  // Non-fatal \u2014 CODEX_MASTER_KEY may be absent in\
          \ fork contexts\n  core.warning(`codeql-alert-fetcher.yml dispatch failed\
        \ (needs CODEX_MASTER_KEY/security_events): ${err.message}`);\n}\n"
        continue-on-error: true
      - name: Post @copilot continue (resume agent session)
        uses: actions/github-script@v8
        with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const owner    = context.repo.owner;\nconst repo     = context.repo.repo;\n\
          const prNumber = parseInt('${{ steps.ctx.outputs.pr_num }}', 10);\nconst\
          \ reviewer = '${{ steps.ctx.outputs.reviewer }}';\nconst sha      = '${{\
          \ steps.ctx.outputs.pr_sha }}';\n\nconst body = [\n  `<!-- trigger-on-approval-agent-resume\
          \ -->`,\n  `## \u26A1 Approval Dispatch \u2014 Copilot Resume`,\n  ``,\n\
          \  `PR  #${prNumber} approved by **@${reviewer}** at \\`${sha.slice(0,8)}\\\
        `.`,\n  ``,\n  `**Dispatched workflows:**`,\n  `- \\`validate.yml\\` (fast\
          \ mode) \u2705`,\n  `- \\`pre-merge-validation.yml\\` \u2705`,\n  `- \\\
          `codeql-alert-fetcher.yml\\` (requires CODEX_MASTER_KEY) \u2705`,\n  `-\
          \ All \\`action_required\\` runs auto-approved via \\`approve_pending_runs.py\\\
          ` \u2705`,\n  ``,\n  `@copilot continue`,\n].join('\\n');\n\ntry {\n  await\
        \ github.rest.issues.createComment({ owner, repo, issue_number: prNumber,\
          \ body });\n  core.info('\u2705 @copilot continue comment posted');\n} catch\
        \ (err) {\n  core.warning(`Could not post @copilot continue comment: ${err.message}`);\n\
          }\n"
        continue-on-error: true
      - name: Summary
        if: always()
        run: 'echo "================================================================"
        | tee -a "$GITHUB_STEP_SUMMARY"

        echo "  Approval Dispatch Complete"                                     |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "================================================================" |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "  PR     :  #${{ steps.ctx.outputs.pr_num }}"                     | tee
        -a "$GITHUB_STEP_SUMMARY"

        echo "  HEAD   : ${{ steps.ctx.outputs.pr_sha }}"                      | tee
        -a "$GITHUB_STEP_SUMMARY"

        echo "  Token  : ${{ steps.ctx.outputs.token_tier }} (CODEX_MASTER_KEY chain)"
        | tee -a "$GITHUB_STEP_SUMMARY"

        echo ""                                                                 |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "  Steps executed:"                                                |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "    1. Dispatch unified approval hub    (auto-approve-workflows.yml)"
        | tee -a "$GITHUB_STEP_SUMMARY"

        echo "    2. validate.yml dispatched            (fast mode)"            |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "    3. pre-merge-validation.yml dispatched"                       |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "    4. codeql-alert-fetcher.yml dispatched (security_events scope)"
        | tee -a "$GITHUB_STEP_SUMMARY"

        echo "    5. @copilot continue posted           (agent session resume)" |
        tee -a "$GITHUB_STEP_SUMMARY"

        echo "================================================================" |
        tee -a "$GITHUB_STEP_SUMMARY"

        '

