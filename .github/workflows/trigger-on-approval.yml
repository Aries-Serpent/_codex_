name: Trigger validations on approval
'on':
  pull_request_review:
    types:
    - submitted
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write
  security-events: read
jobs:
  on-approval:
    name: Maintainer dispatch on approval
    if: "${{ github.event.review.state == 'approved' &&\n    github.event.review.user.type\
      \ != 'Bot' &&\n    !contains(github.event.review.body, 'Auto-approved low-risk\
      \ changes') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      REPO: ${{ github.repository }}
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Resolve PR context
      id: ctx
      env:
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        REVIEWER_LOGIN: ${{ github.event.review.user.login }}
      run: "PR_SHA=\"${{ github.event.pull_request.head.sha }}\"\nPR_NUM=\"${{ github.event.pull_request.number\
        \ }}\"\nPR_REF=\"$PR_HEAD_REF\"\nREVIEWER=\"$REVIEWER_LOGIN\"\necho \"pr_sha=${PR_SHA}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"pr_num=${PR_NUM}\" >> \"$GITHUB_OUTPUT\"\n\
        echo \"pr_ref=${PR_REF}\" >> \"$GITHUB_OUTPUT\"\necho \"reviewer=${REVIEWER}\"\
        \ >> \"$GITHUB_OUTPUT\"\nPR_BASE=\"${{ github.event.pull_request.base.ref\
        \ }}\"\necho \"pr_base=${PR_BASE}\" >> \"$GITHUB_OUTPUT\"\nif [ -z \"${{ secrets.CODEX_MASTER_KEY\
        \ || secrets.CODEX_BACKUP_KEY }}\" ]; then\n  echo \"::warning::CODEX_MASTER_KEY\
        \ not set \u2014 workflow dispatch and auto-approve will use github.token\
        \ fallback (may 403)\"\n  echo \"token_tier=fallback\" >> \"$GITHUB_OUTPUT\"\
        \nelse\n  echo \"token_tier=master\" >> \"$GITHUB_OUTPUT\"\nfi\necho \"Approval\
        \ by ${REVIEWER} on PR  #${PR_NUM} @ ${PR_SHA} (${PR_REF} -> ${PR_BASE})\"\
        \n"
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        ref: ${{ github.event.pull_request.head.ref }}
    - name: Set up Python (for approve_pending_runs.py)
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: "Gate — fire only when intended"
      id: gate
      env:
        PR_NUMBER: ${{ steps.ctx.outputs.pr_num }}
        PR_SHA: ${{ steps.ctx.outputs.pr_sha }}
        PR_BASE: ${{ steps.ctx.outputs.pr_base }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const prNumber = parseInt(process.env.PR_NUMBER || '0', 10);
          const sha = process.env.PR_SHA || '';
          const base = process.env.PR_BASE || '';
          const sha8 = sha.slice(0, 8);

          if (base !== 'main') {
            core.info(`base=${base} (not main) — skipping dispatch`);
            core.setOutput('proceed', 'false');
            return;
          }

          const marker = `<!-- trigger-on-approval-agent-resume sha=${sha8} -->`;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number: prNumber,
            per_page: 100,
          });
          if (comments.some((c) => (c.body || '').includes(marker))) {
            core.info(`SHA ${sha8} already dispatched — skipping`);
            core.setOutput('proceed', 'false');
            return;
          }

          core.info(`Intent satisfied: human approval on main-targeting PR @ ${sha8} — proceeding`);
          core.setOutput('proceed', 'true');
      continue-on-error: true

    - name: Require wec:auto-approve label
      id: label_check
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.ctx.outputs.pr_num }}
      run: |
        python3 scripts/ci/require_wec_auto_approve.py --pr-number "$PR_NUMBER" --repo "$REPO"
    - name: Dispatch unified approval hub
      if: ${{ steps.gate.outputs.proceed == 'true' && steps.label_check.outcome ==
        'success' }}
      env:
        PR_NUMBER: ${{ steps.ctx.outputs.pr_num }}
        PR_SHA: ${{ steps.ctx.outputs.pr_sha }}
        REVIEWER: ${{ steps.ctx.outputs.reviewer }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const prNumber = parseInt(process.env.PR_NUMBER || '0', 10);
          const prSha = process.env.PR_SHA || '';
          const reviewer = process.env.REVIEWER || '';

          core.info(`Dispatching auto-approve-workflows.yml for PR  #${prNumber} @ ${prSha.slice(0,8)}`);

          try {
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'auto-approve-workflows.yml',
              ref: 'main',
              inputs: {
                approval_source: 'trigger-on-approval',
                approval_intent: 'dispatch_validation_suite',
                target_pr: prNumber.toString(),
                approval_reason: `Code review approval from @${reviewer}`,
                approval_ttl_hours: '2',
                dry_run: 'false'
              }
            });
            core.info('✅ auto-approve-workflows.yml dispatched');
          } catch (err) {
            core.warning(`Hub dispatch failed: ${err.message}`);
          }
      continue-on-error: true
    - name: Dispatch Validation Pipeline (validate.yml)
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      env:
        PR_SHA: ${{ steps.ctx.outputs.pr_sha }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: |
          const owner = context.repo.owner;
          const repo  = context.repo.repo;
          const ref   = process.env.PR_SHA || '';
          core.info(`Dispatching validate.yml @ ${ref}`);
          try {
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'validate.yml',
              ref,
              inputs: { mode: 'fast' },
            });
            core.info('✅ validate.yml dispatched');
          } catch (err) {
            core.warning(`validate.yml dispatch failed: ${err.message}`);
          }
      continue-on-error: true
    - name: Dispatch Pre-Merge Validation (pre-merge-validation.yml)
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      env:
        PR_SHA: ${{ steps.ctx.outputs.pr_sha }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: |
          const owner = context.repo.owner;
          const repo  = context.repo.repo;
          const ref   = process.env.PR_SHA || '';
          core.info(`Dispatching pre-merge-validation.yml @ ${ref}`);
          try {
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'pre-merge-validation.yml',
              ref,
              inputs: {},
            });
            core.info('✅ pre-merge-validation.yml dispatched');
          } catch (err) {
            core.warning(`pre-merge-validation.yml dispatch failed: ${err.message}`);
          }
      continue-on-error: true
    - name: Dispatch CodeQL Alert Fetcher (codeql-alert-fetcher.yml)
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      env:
        PR_SHA: ${{ steps.ctx.outputs.pr_sha }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        script: |
          const owner = context.repo.owner;
          const repo  = context.repo.repo;
          const ref   = process.env.PR_SHA || '';
          core.info(`Dispatching codeql-alert-fetcher.yml @ ${ref}`);
          try {
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'codeql-alert-fetcher.yml',
              ref,
              inputs: {
                state: 'open',
                tool_name: 'CodeQL',
                max_pages: '10',
                page_sleep_ms: '1000',
                top_n: '30',
              },
            });
            core.info('✅ codeql-alert-fetcher.yml dispatched');
          } catch (err) {
            core.warning(`codeql-alert-fetcher.yml dispatch failed (needs CODEX_MASTER_KEY/security_events): ${err.message}`);
          }
      continue-on-error: true
    - name: Post @copilot continue (resume agent session)
      if: ${{ steps.gate.outputs.proceed == 'true' }}
      env:
        PR_NUMBER: ${{ steps.ctx.outputs.pr_num }}
        PR_SHA: ${{ steps.ctx.outputs.pr_sha }}
        REVIEWER: ${{ steps.ctx.outputs.reviewer }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: |
          const owner    = context.repo.owner;
          const repo     = context.repo.repo;
          const prNumber = parseInt(process.env.PR_NUMBER || '0', 10);
          const reviewer = process.env.REVIEWER || '';
          const sha      = process.env.PR_SHA || '';

          try {
            const marker = `<!-- trigger-on-approval-agent-resume sha=${sha.slice(0,8)} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            const already = comments.some(c => (c.body || '').includes(marker));
            if (already) {
              core.info(`Resume comment for ${sha.slice(0,8)} already present — skipping`);
              return;
            }
            const body = [
              marker,
              '## ⚡ Approval Dispatch — Copilot Resume',
              '',
              `PR  #${prNumber} approved by **@${reviewer}** at \`${sha.slice(0,8)}\`.`,
              '',
              '**Dispatched workflows:**',
              '- `validate.yml` (fast mode) ✅',
              '- `pre-merge-validation.yml` ✅',
              '- `codeql-alert-fetcher.yml` (requires CODEX_MASTER_KEY) ✅',
              '- All `action_required` runs auto-approved via `approve_pending_runs.py` ✅',
              '',
              '@copilot continue',
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            core.info('✅ @copilot continue comment posted');
          } catch (err) {
            core.warning(`Could not post @copilot continue comment: ${err.message}`);
          }
      continue-on-error: true
    - name: Summary
      if: always()
      env:
        PR_NUMBER: ${{ steps.ctx.outputs.pr_num }}
        PR_SHA: ${{ steps.ctx.outputs.pr_sha }}
        TOKEN_TIER: ${{ steps.ctx.outputs.token_tier }}
      run: |
        echo "================================================================" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "  Approval Dispatch Complete" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "================================================================" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "  PR     :  #${PR_NUMBER}" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "  HEAD   : ${PR_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "  Token  : ${TOKEN_TIER} (CODEX_MASTER_KEY chain)" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "  Steps executed:" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "    1. Dispatch unified approval hub    (auto-approve-workflows.yml)" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "    2. validate.yml dispatched            (fast mode)" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "    3. pre-merge-validation.yml dispatched" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "    4. codeql-alert-fetcher.yml dispatched (security_events scope)" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "    5. @copilot continue posted           (agent session resume)" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "================================================================" | tee -a "$GITHUB_STEP_SUMMARY"
