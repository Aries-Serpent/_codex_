name: "Iterative Self-Healing CI"

# Phase 5 — Autonomous Self-Healing Loop (S154)
# ─────────────────────────────────────────────
# Triggered after any workflow completes with failure.
# Full D-00 protocol: triage → classify → fix → verify → commit.
# Tracks all attempts (success + failure) in .codex/healing_attempts/.
# Requires COPILOT_AGENT_AUTH_ENABLED=true by default for autonomous push.
# Runs up to 3 auto-heal iterations per failure event before escalating.

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'Workflow run ID to heal (leave blank for latest failed)'
        required: false
        type: string
      max_iterations:
        description: 'Maximum heal iterations (1-5)'
        required: false
        default: '3'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.head_ref || github.ref }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  triage:
    name: "D-00 Triage failure"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run when a workflow actually failed (not on success)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.name != 'Iterative Self-Healing CI' &&
        github.event.workflow_run.name != 'Cognitive Brain CI Feedback' &&
        github.event.workflow_run.name != 'Cognitive Action & Decision (Unified)' &&
        github.event.workflow_run.name != 'Cognitive Analysis & Learning (Unified)' &&
        github.event.workflow_run.name != 'Agent Variable Writer (Provenance-Chain)' &&
        github.event.workflow_run.name != 'Token Probe' &&
        github.event.workflow_run.name != 'Agent Vars Bootstrap' &&
        github.event.workflow_run.name != 'CODEX Manifest Auto-Refresh'
      )

    outputs:
      pattern:    ${{ steps.classify.outputs.pattern }}
      fixable:    ${{ steps.classify.outputs.fixable }}
      run_id:     ${{ steps.classify.outputs.run_id }}
      head_sha:   ${{ steps.classify.outputs.head_sha }}
      head_branch: ${{ steps.classify.outputs.head_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 50
          # Use delegated token when COPILOT_AGENT_AUTH_ENABLED=true (S154 Phase 5).
          # Falls back to GITHUB_TOKEN for environments without delegation.
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}

      - name: Set up Python (cached)
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Classify failure (D-00 — collect_telemetry --classify-run)
        id: classify
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id || inputs.target_run_id }}
          TRIGGERING_RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
          # Phase 5: confirm delegation state for downstream heal job
          AGENT_AUTH_ENABLED: ${{ vars.COPILOT_AGENT_AUTH_ENABLED || 'false' }}
        run: |
          # Resilient pip install: prefer venv binary but recreate the venv on cache miss
          # so the triage job never fails due to a missing venv and never pollutes the
          # system/user site-packages with an un-isolated install.
          # Root cause of 126 self-healing failures (CI health alert 2026-03-21):
          # .venv_ci/bin/pip was absent on cache misses, causing triage to exit 1
          # before classify-run could run, which marked the whole workflow as failed.
          if ! .venv_ci/bin/pip install requests --quiet 2>/dev/null; then
            python3 -m venv .venv_ci
            .venv_ci/bin/pip install requests --quiet
          fi
          echo "run_id=${TRIGGERING_RUN_ID}"       >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}"               >> "$GITHUB_OUTPUT"
          echo "head_branch=${HEAD_BRANCH}"         >> "$GITHUB_OUTPUT"

          # D-00: Use collect_telemetry --classify-run to categorise the failure.
          # The --classify-run flag (added S150) fetches run+jobs via the GitHub API
          # and returns one of 15 pattern names (ruff-*, import-*, yaml-*, etc.).
          PATTERN=$(python3 scripts/ci/collect_telemetry.py \
            --classify-run "$TRIGGERING_RUN_ID" \
            --owner Aries-Serpent --repo _codex_ \
            --token "$GH_TOKEN" 2>/dev/null || echo "unknown")

          echo "pattern=${PATTERN}" >> "$GITHUB_OUTPUT"

          # Expanded fixable patterns (Phase 5 — S154 + S163):
          # Added changelog-* (check_7 CHANGELOG cross-PR), pip-cache-* (sparse checkout),
          # policy-gate-* (pre-create pip cache fix), rebase-gate-* (branch gate),
          # auth-delegation (REQ-10 branch-diverged caused by scheduled bot commits).
          # integration-branch-direct-session: NOT fixable — structural redirect only.
          # self-healing: NOT fixable — cascade detection; see SELF_HEALING_001 pattern.
          case "$PATTERN" in
            ruff-*|import-*|yaml-*|timeout-config|unused-import|auto-fix|\
            changelog-*|pip-cache-*|policy-gate-*|rebase-gate-*|mypy-baseline|\
            auth-delegation|branch-diverged)
              echo "fixable=true"  >> "$GITHUB_OUTPUT"
              ;;
            self-healing)
              # Self-healing cascade detected (SELF_HEALING_001):
              # The triggering workflow is itself an Iterative Self-Healing CI run.
              # Most common root cause: .venv_ci/bin/pip absent on cache miss caused
              # triage to fail before classify-run could run (fixed in S172).
              # This pattern is not auto-fixable here — it indicates the self-healing
              # loop itself has an infrastructure issue.  Emit a clear summary for
              # the ci-health-alert-agent to detect and report.
              echo "fixable=false" >> "$GITHUB_OUTPUT"
              echo "### ⚠️ Self-Healing Cascade Detected (SELF_HEALING_001)" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "The failing workflow **is** an Iterative Self-Healing CI run." >> "$GITHUB_STEP_SUMMARY"
              echo "This is a cascade failure: the healer itself is failing." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Probable cause:** \`.venv_ci/bin/pip\` absent on venv cache miss." >> "$GITHUB_STEP_SUMMARY"
              echo "**Fix applied in S172:** on cache miss the venv is recreated with \`python3 -m venv .venv_ci\` (both triage and heal jobs)." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**If this persists:** Check \`.github/actions/setup-python-cached/action.yml\`" >> "$GITHUB_STEP_SUMMARY"
              echo "and verify \`.venv_ci/\` is created even on full cache miss." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "See: [\`SELF_HEALING_001\`](.codex/patterns/ci_failure_patterns.yaml)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            integration-branch-direct-session)
              # REQ-11: session on integration branch — non-fixable; needs sub-PR creation.
              # Post an informative escalation comment and skip auto-fix.
              echo "fixable=false" >> "$GITHUB_OUTPUT"
              echo "### 🚫 REQ-11: Integration-Branch Direct-Session Detected" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Pattern \`integration-branch-direct-session\` is **not auto-fixable**." >> "$GITHUB_STEP_SUMMARY"
              echo "The PR head is the staging integration branch (\`0D_base_\`)." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Fix:** Create a sub-PR targeting \`0D_base_\` instead:" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
              echo "gh workflow run copilot-session-chain.yml -f source_branch=0D_base_ -f session_title=\"<task>\"" >> "$GITHUB_STEP_SUMMARY"
              echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
              echo "See: [INTEGRATION_BRANCH_MODEL.md](.codex/docs/INTEGRATION_BRANCH_MODEL.md)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            coverage-timeout)
              # Coverage/test timeout failure (P19 pattern): pre-existing shadow-import
              # failures (config.openai_client, services.github.client) cause the
              # Resilient Validation Suite and Pre-Merge Validation to time out.
              # Not auto-fixable here — root cause is upstream module shadow imports.
              # Escalated to Copilot Coding Agent via copilot-escalation job.
              echo "fixable=false" >> "$GITHUB_OUTPUT"
              echo "### ⏱️ Coverage / Test Timeout (P19)" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Pattern \`coverage-timeout\` is **not auto-fixable** at this layer." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Root cause:** Pre-existing P19 shadow-import failures in" >> "$GITHUB_STEP_SUMMARY"
              echo "\`config.openai_client\` / \`services.github.client\` cause test-suite" >> "$GITHUB_STEP_SUMMARY"
              echo "timeouts in the Resilient Validation Suite and Pre-Merge Validation." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Affected test files:**" >> "$GITHUB_STEP_SUMMARY"
              echo "- \`tests/config/test_openai_client.py\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- \`tests/services/github/test_client.py\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- \`tests/services/test_github_client_phase9_1.py\`" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Action:** These failures pre-date this PR. Copilot escalation will" >> "$GITHUB_STEP_SUMMARY"
              echo "be triggered to investigate and fix the shadow-import root cause." >> "$GITHUB_STEP_SUMMARY"
              ;;
            unknown)
              # Pattern unrecognised by collect_telemetry.py classify-run.
              # This occurs when: (a) the run log is not yet available, (b) no
              # known keyword matches, or (c) classify-run itself failed.
              # Not auto-fixable — escalate to human + Copilot for investigation.
              echo "fixable=false" >> "$GITHUB_OUTPUT"
              echo "### ❓ Unknown Failure Pattern" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Pattern \`unknown\` — \`collect_telemetry.py --classify-run\` could not" >> "$GITHUB_STEP_SUMMARY"
              echo "identify the failure from the run logs." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Common causes:**" >> "$GITHUB_STEP_SUMMARY"
              echo "1. Run logs not yet available (retry in a few minutes)" >> "$GITHUB_STEP_SUMMARY"
              echo "2. New failure type not in the pattern keyword dictionary" >> "$GITHUB_STEP_SUMMARY"
              echo "3. \`classify-run\` itself threw an exception (check triage logs)" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Action:** To add this pattern, update \`PATTERN_KEYWORDS\` in" >> "$GITHUB_STEP_SUMMARY"
              echo "\`scripts/ci/collect_telemetry.py\` and add a \`case\` arm in this workflow." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "See: [\`docs/workflows/WORKFLOW_RACE_CONDITION_AUDIT.md\`](docs/workflows/WORKFLOW_RACE_CONDITION_AUDIT.md)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "fixable=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

          echo "### 🩺 D-00 Failure Triage"                              >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |"                                          >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|"                                          >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | [\`${TRIGGERING_RUN_ID}\`](https://github.com/Aries-Serpent/_codex_/actions/runs/${TRIGGERING_RUN_ID}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow | ${TRIGGERING_RUN_NAME} |"                   >> "$GITHUB_STEP_SUMMARY"
          echo "| Pattern | \`${PATTERN}\` |"                            >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${HEAD_BRANCH}\` |"                         >> "$GITHUB_STEP_SUMMARY"
          echo "| Agent Auth Enabled | \`${AGENT_AUTH_ENABLED}\` |"      >> "$GITHUB_STEP_SUMMARY"
          FIXABLE=$(grep '^fixable=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          echo "| Auto-fixable | \`${FIXABLE}\` |"                       >> "$GITHUB_STEP_SUMMARY"

  heal:
    name: "Auto-heal (iter ${{ matrix.iteration }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: triage
    if: needs.triage.outputs.fixable == 'true'

    strategy:
      max-parallel: 1
      matrix:
        iteration: [1, 2, 3]

    steps:
      - name: Checkout target branch (working tree)
        # Check out the TRIGGERING branch so fix scripts are applied to its actual
        # content, not main's content. This prevents accidentally committing
        # main→branch differences along with the fix.
        # Phase 5: COPILOT_AGENT_AUTH_ENABLED=true delegates the token so that
        # autonomous push succeeds without manual approval.
        uses: actions/checkout@v5
        with:
          fetch-depth: 50
          ref: ${{ needs.triage.outputs.head_branch || 'main' }}
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}

      - name: "🔀 Resolve push target (chain: sub-PR → 0D_base_ → main)"
        id: resolve-target
        # Inline resolution avoids executing a local composite action
        # (which would be from the potentially untrusted checked-out branch).
        # Uses only the gh CLI against the trusted GitHub API.
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          _0D_EXISTS=false
          if gh api "repos/${REPO}/branches/0D_base_" --silent 2>/dev/null; then
            _0D_EXISTS=true
            SUB_PR=$(gh pr list --repo "$REPO" --base "0D_base_" --state open \
              --json headRefName,updatedAt \
              --jq 'sort_by(.updatedAt) | reverse | .[0].headRefName // empty' \
              2>/dev/null || true)
            [ "$SUB_PR" = "null" ] && SUB_PR=""
          fi
          if [ -n "${SUB_PR:-}" ]; then
            echo "branch=$SUB_PR" >> "$GITHUB_OUTPUT"
            echo "reason=sub_pr"  >> "$GITHUB_OUTPUT"
          elif [ "$_0D_EXISTS" = "true" ]; then
            echo "branch=0D_base_"          >> "$GITHUB_OUTPUT"
            echo "reason=integration_branch" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main"    >> "$GITHUB_OUTPUT"
            echo "reason=default" >> "$GITHUB_OUTPUT"
          fi

      - name: Overlay trusted fix scripts from main (security)
        # SECURITY: workflow_run-triggered workflows must NEVER execute untrusted
        # PR code with elevated permissions. We overwrite the CI fix scripts with
        # verified main-branch versions after checking out the target branch, so
        # the working tree content is from the target branch but the scripts used
        # for fixing are always from the trusted default branch.
        run: |
          git fetch origin main --depth=5 --no-tags 2>/dev/null || true
          git restore --source=origin/main -- \
            scripts/ci/auto_fix_common_issues.py \
            scripts/ci/branch_rebase_check.py \
            scripts/ci/ci_triage_repro.sh \
            scripts/ci/session_wrapup_autofix.py \
            2>/dev/null \
            || echo "⚠️ Some scripts not found on origin/main — using target-branch versions"
          echo "✅ Trusted fix scripts overlaid from origin/main"
          # Record which scripts were overlaid so we can restore them before staging.
          # This prevents accidentally committing the trusted-main versions back into
          # the target branch when only fix outputs should be staged.
          echo "scripts/ci/auto_fix_common_issues.py scripts/ci/branch_rebase_check.py scripts/ci/ci_triage_repro.sh scripts/ci/session_wrapup_autofix.py" > /tmp/overlaid_scripts.txt

      - name: Set up Python (cached)
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install tools
        run: |
          # Resilient pip install: prefer venv binary but recreate the venv on cache miss
          # instead of installing to system/user site-packages (same fix as triage — S172).
          if ! .venv_ci/bin/pip install ruff black isort --quiet 2>/dev/null; then
            python3 -m venv .venv_ci
            .venv_ci/bin/pip install ruff black isort --quiet
          fi

      - name: D-07 — Run ci_triage_repro.sh (pre-heal baseline)
        id: pre_triage
        # Run the 7-check triage before applying the fix so we know the baseline state.
        # This catches cases where the failure is in a check we don't auto-fix (e.g.,
        # mypy_baseline=328 drift) so we avoid committing a no-op fix.
        continue-on-error: true
        run: |
          bash scripts/ci/ci_triage_repro.sh 2>&1 | tee /tmp/pre_triage.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "pre_triage_exit=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "### D-07 Pre-Heal Triage" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/pre_triage.txt | grep -E "✅|❌|PASS|FAIL|Summary" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Apply auto-fix
        id: apply_fix
        env:
          PATTERN: ${{ needs.triage.outputs.pattern }}
          HEAD_BRANCH: ${{ needs.triage.outputs.head_branch }}
          RUN_ID: ${{ needs.triage.outputs.run_id }}
          ITERATION: ${{ matrix.iteration }}
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
        run: |
          echo "Applying auto-fix for pattern: ${PATTERN} (iteration ${ITERATION})"

          # ── Branch-diverged / auth-delegation: call branch_rebase_check.py ──
          # These patterns fire when a PR branch is behind/diverged from its base
          # because scheduled bot workflows commit directly to main every 2-24 h.
          # branch_rebase_check.py --auto-merge-skip-ci resolves this via the
          # GitHub Merges API without any git checkout, then posts the rich helper
          # comment with conflict analysis + Copilot agent prompt to the PR and
          # updates the PR Status Dashboard section.
          if [[ "$PATTERN" == "auth-delegation" || "$PATTERN" == "branch-diverged" || "$PATTERN" == "rebase-gate"* ]]; then
            PR_NUMBER=$(gh pr list --head "${HEAD_BRANCH}" \
              --repo Aries-Serpent/_codex_ --json number -q '.[0].number' 2>/dev/null || echo "")
            if [ -n "$PR_NUMBER" ]; then
              echo "  Running branch_rebase_check.py --auto-merge-skip-ci for PR #${PR_NUMBER}…"
              python scripts/ci/branch_rebase_check.py \
                --repo Aries-Serpent/_codex_ \
                --pr "${PR_NUMBER}" \
                --auto-merge-skip-ci \
                --post-comment \
                --upsert-dashboard \
                --github-output \
                --github-summary \
                2>&1 | tee /tmp/fix_output.txt
              # The script merges via API — no local file changes to stage
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "✅ Branch rebase check/auto-merge complete" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  ⚠️ Could not determine PR number for branch ${HEAD_BRANCH}"
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # ── All other patterns: run auto_fix_common_issues.py with --pattern ──
            # The --pattern-name flag correctly runs only the matching pattern,
            # making each iteration faster and the diff more targeted.
            python scripts/ci/auto_fix_common_issues.py --pattern-name "${PATTERN}" \
              2>&1 | tee /tmp/fix_output.txt
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              # --pattern-name found no match; fall back to running all patterns
              python scripts/ci/auto_fix_common_issues.py \
                2>&1 | tee /tmp/fix_output.txt
            fi
          fi

          # Restore overlaid trusted scripts — only actual fix outputs should be staged
          if [ -f /tmp/overlaid_scripts.txt ]; then
            # shellcheck disable=SC2046
            git restore -- $(cat /tmp/overlaid_scripts.txt) 2>/dev/null || true
          fi
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No file changes produced for pattern \`${PATTERN}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            CHANGED_FILES=$(git diff --name-only | tr '\n' ',')
            echo "changed_files=${CHANGED_FILES}" >> "$GITHUB_OUTPUT"
            echo "✅ Changes produced: ${CHANGED_FILES}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: D-07 — Validate fix (ci_triage_repro.sh post-heal)
        id: validate
        if: steps.apply_fix.outputs.changed == 'true'
        run: |
          # Full YAML compliance check
          python3 - << 'PYEOF'
          import os, yaml, sys
          wf = ".github/workflows"
          errors = []
          for root, _, files in os.walk(wf):
              for f in files:
                  if f.endswith((".yml", ".yaml")):
                      path = os.path.join(root, f)
                      try:
                          yaml.safe_load(open(path))
                      except yaml.YAMLError as e:
                          errors.append(f"{path}: {e}")
          if errors:
              for e in errors:
                  print(f"❌ {e}")
              sys.exit(1)
          print(f"✅ All workflow files parse cleanly")
          PYEOF
          # Ruff check
          ruff check src/ --quiet 2>&1 | tee /tmp/ruff_output.txt
          # Run ci_triage_repro.sh for full 7-check validation
          bash scripts/ci/ci_triage_repro.sh 2>&1 | tee /tmp/post_triage.txt
          TRIAGE_EXIT=${PIPESTATUS[0]}
          echo "triage_exit=${TRIAGE_EXIT}" >> "$GITHUB_OUTPUT"
          if [ "${TRIAGE_EXIT}" -eq 0 ]; then
            echo "valid=true"  >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
          echo "### D-07 Post-Heal Triage" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/post_triage.txt | grep -E "✅|❌|PASS|FAIL|Summary" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Record attempt (success or failure)
        if: always()
        env:
          PATTERN:    ${{ needs.triage.outputs.pattern }}
          RUN_ID:     ${{ needs.triage.outputs.run_id }}
          HEAD_BRANCH: ${{ needs.triage.outputs.head_branch }}
          ITERATION:  ${{ matrix.iteration }}
          CHANGED:    ${{ steps.apply_fix.outputs.changed }}
          VALID:      ${{ steps.validate.outputs.valid }}
        run: |
          # Write attempt record to .codex/healing_attempts/ so future sessions
          # can review what was tried, what worked, and what failed.
          # Use Python json.dumps() to guarantee valid JSON regardless of special
          # characters (quotes, backslashes, etc.) in captured log text.
          ATTEMPT_DIR=".codex/healing_attempts"
          mkdir -p "${ATTEMPT_DIR}"
          export TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export ATTEMPT_FILE="${ATTEMPT_DIR}/${TIMESTAMP//[:T]/-}_${PATTERN}_iter${ITERATION}.json"
          export PRE_TRIAGE=$(cat /tmp/pre_triage.txt 2>/dev/null | grep -E 'Summary|✅|❌' | head -5 | tr '\n' '|' || true)
          export POST_TRIAGE=$(cat /tmp/post_triage.txt 2>/dev/null | grep -E 'Summary|✅|❌' | head -5 | tr '\n' '|' || true)
          export FIX_OUTPUT=$(cat /tmp/fix_output.txt 2>/dev/null | head -10 | tr '\n' '|' || true)
          python3 - << 'PYEOF'
          import json, os, sys
          data = {
              "timestamp":   os.environ["TIMESTAMP"],
              "run_id":      os.environ["RUN_ID"],
              "head_branch": os.environ["HEAD_BRANCH"],
              "pattern":     os.environ["PATTERN"],
              "iteration":   int(os.environ.get("ITERATION", 0) or 0),
              "changed":     os.environ.get("CHANGED", "false").lower() == "true",
              "valid":       os.environ.get("VALID", "false").lower() == "true",
              "workflow":    "iterative-self-healing-ci",
              "pre_triage":  os.environ.get("PRE_TRIAGE", ""),
              "post_triage": os.environ.get("POST_TRIAGE", ""),
              "fix_output":  os.environ.get("FIX_OUTPUT", ""),
          }
          with open(os.environ["ATTEMPT_FILE"], "w") as fh:
              json.dump(data, fh, indent=2)
          print(f"Attempt record: {os.environ['ATTEMPT_FILE']}")
          PYEOF

      - name: Commit and push fix (requires COPILOT_AGENT_AUTH_ENABLED=true)
        if: steps.apply_fix.outputs.changed == 'true' && steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          PATTERN:  ${{ needs.triage.outputs.pattern }}
          HEAD_BRANCH: ${{ needs.triage.outputs.head_branch }}
          CHANGED_FILES: ${{ steps.apply_fix.outputs.changed_files }}
          # Verify delegation is active before attempting autonomous push.
          # If COPILOT_AGENT_AUTH_ENABLED != 'true', the push will be attempted
          # anyway (CODEX_MASTER_KEY covers it), but a warning is emitted.
          AGENT_AUTH_ENABLED: ${{ vars.COPILOT_AGENT_AUTH_ENABLED || 'false' }}
        run: |
          if [ "${AGENT_AUTH_ENABLED}" != "true" ]; then
            echo "⚠️ COPILOT_AGENT_AUTH_ENABLED is not 'true' — autonomous push may fail."
            echo "   Set COPILOT_AGENT_AUTH_ENABLED=true via Agent Token Delegation workflow."
          fi
          # For PR branches push fixes back to the same branch.
          # For main / empty head_branch walk the staging chain instead.
          if [ -n "${HEAD_BRANCH}" ] && [ "${HEAD_BRANCH}" != "main" ]; then
            TARGET_BRANCH="${HEAD_BRANCH}"
          else
            TARGET_BRANCH="${{ steps.resolve-target.outputs.branch || 'main' }}"
            echo "🔀 Push target resolved: ${TARGET_BRANCH} (reason: ${{ steps.resolve-target.outputs.reason }})"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          # Stage only the files explicitly changed by the fix scripts
          # (plus the healing-attempts record). Avoid git add -A which would
          # stage every difference between HEAD and the remote.
          # We are already on the target branch (checked out in the first step),
          # so no git reset is needed — the working tree is already at the correct
          # branch tip and the fix-script changes are relative to that content.
          IFS=',' read -ra FILES <<< "${CHANGED_FILES}"
          for f in "${FILES[@]}"; do
            f="${f// /}"
            if [ -n "$f" ]; then
              git add -- "$f" 2>/dev/null || true
            fi
          done
          git add ".codex/healing_attempts/" 2>/dev/null || true
          git commit -m "self-heal(iter-${{ matrix.iteration }}): auto-fix ${PATTERN} [skip ci-if-no-change]

          Autonomous Phase 5 self-heal — pattern: ${PATTERN}
          Iteration: ${{ matrix.iteration }} | Run: https://github.com/Aries-Serpent/_codex_/actions/runs/${{ needs.triage.outputs.run_id }}
          COPILOT_AGENT_AUTH_ENABLED: ${AGENT_AUTH_ENABLED}"
          # Fast-forward push to the triggering branch. Because the working tree
          # was already checked out at origin/${TARGET_BRANCH}, the fix commit is
          # one commit ahead of origin/${TARGET_BRANCH} — the push is accepted.
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report iteration
        if: always()
        run: |
          echo "### Self-Heal Iteration ${{ matrix.iteration }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pattern: \`${{ needs.triage.outputs.pattern }}\`"      >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed: \`${{ steps.apply_fix.outputs.changed }}\`"   >> "$GITHUB_STEP_SUMMARY"
          echo "- Valid:   \`${{ steps.validate.outputs.valid }}\`"      >> "$GITHUB_STEP_SUMMARY"
          echo "- Files:   \`${{ steps.apply_fix.outputs.changed_files }}\`" >> "$GITHUB_STEP_SUMMARY"

  escalate:
    name: "Escalate to human"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: triage
    # Only escalate to human for patterns excluded from copilot-escalation
    # (self-healing cascades, unknown root-cause, or empty pattern).
    # All other fixable==false cases are handled by copilot-escalation first.
    # NOTE: keep this exclusion list in sync with copilot-escalation's
    # `pattern != 'self-healing'` / `pattern != 'unknown'` conditions below.
    if: >
      needs.triage.outputs.fixable == 'false' &&
      (needs.triage.outputs.pattern == 'self-healing' ||
       needs.triage.outputs.pattern == 'unknown' ||
       needs.triage.outputs.pattern == '')

    steps:
      - name: Post escalation comment with documented RCA
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          PATTERN:      ${{ needs.triage.outputs.pattern }}
          RUN_ID:       ${{ needs.triage.outputs.run_id }}
          HEAD_BRANCH:  ${{ needs.triage.outputs.head_branch }}
        run: |
          PR_NUMBER=$(gh pr list --head "${HEAD_BRANCH}" \
            --repo Aries-Serpent/_codex_ --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$PR_NUMBER" ]; then
            RUN_URL="https://github.com/Aries-Serpent/_codex_/actions/runs/${RUN_ID}"
            printf '%s\n' \
              "<!-- self-healing-escalation -->" \
              "## Self-Healing Escalation" "" \
              "**Pattern:** \`${PATTERN}\`" \
              "**Run:** ${RUN_URL}" \
              "**Branch:** \`${HEAD_BRANCH}\`" \
              "**Auto-fixable:** No (pattern not in fixable set)" "" \
              "### Why This Cannot Be Auto-Fixed" "" \
              "Pattern \`${PATTERN}\` is not yet in the autonomous self-healing fix library." \
              "Review \`.codex/healing_attempts/\` for previous fix attempts on this pattern." "" \
              "### Recommended Actions" "" \
              "1. Check the workflow run logs: ${RUN_URL}" \
              "2. Add pattern to the \`case\` statement in \`iterative-self-healing-ci.yml\`" \
              "3. Add a fix handler in \`scripts/ci/auto_fix_common_issues.py\`" "" \
              "*Posted by: iterative-self-healing-ci.yml (Phase 5 — S154)*" \
              "" \
              "---" \
              "_[🔗 Workflow run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_" \
              > /tmp/escalation_body.txt
            gh pr comment "$PR_NUMBER" --repo Aries-Serpent/_codex_ \
              --body-file /tmp/escalation_body.txt
          fi
          echo "### Escalated to human review" >> "$GITHUB_STEP_SUMMARY"
          echo "Pattern \`${PATTERN}\` is not auto-fixable." >> "$GITHUB_STEP_SUMMARY"
          echo "See PR #${PR_NUMBER:-N/A} for escalation comment." >> "$GITHUB_STEP_SUMMARY"

  # ── Job: Copilot Escalation — @copilot trigger for complex fixes (S182) ───
  # When auto-fix patterns cannot resolve the failure (fixable=false), this job
  # posts a structured @copilot prompt on the failing PR to trigger a Copilot
  # Coding Agent session for autonomous complex fix resolution.
  #
  # This is Layer 3 of the self-healing pipeline (see proposal §6):
  #   Layer 1: Detection (D-00 triage)
  #   Layer 2: Auto-fix (17 patterns, 3 iterations)
  #   Layer 3: Copilot escalation (this job)  ← NEW
  #   Layer 4: Human escalation (existing escalate job)
  #
  # The escalation respects the Session Concurrency Gate: if a session is
  # already active, the @copilot trigger will be handled by agent-auth-delegation's
  # session gate (queued if single-session mode).
  #
  # Blocked patterns: 'self-healing' and 'unknown' patterns where the root cause
  # is not diagnosable are excluded — these still go to human escalation only.
  copilot-escalation:
    name: "🤖 Copilot escalation"
    concurrency:
      group: copilot-escalation-pr-${{ github.event.pull_request.number || needs.triage.outputs.head_branch || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: triage
    if: >
      needs.triage.outputs.fixable == 'false' &&
      needs.triage.outputs.pattern != 'self-healing' &&
      needs.triage.outputs.pattern != 'unknown' &&
      needs.triage.outputs.pattern != 'unknown' &&
      needs.triage.outputs.pattern != ''
    steps:
      - name: "Checkout for pattern_recorder access"
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.triage.outputs.head_branch }}
          fetch-depth: 1

      - name: "Query high-recurrence + cross-PR patterns"
        id: high_rec
        env:
          CODEX_DB_PATH: ${{ env.CODEX_DB_PATH || '' }}
        run: |
          # Emit compact Markdown tables for (a) high-recurrence and
          # (b) cross-PR correlation (Phase 8 P3).
          # Falls back to empty string gracefully if DB absent or python fails.
          python3 - <<'PYEOF' > /tmp/_hr_output.txt 2>/dev/null || true
          import os, sys, json
          sys.path.insert(0, "scripts/ci")
          try:
              import pattern_recorder as pr
              db = os.environ.get("CODEX_DB_PATH", os.path.expanduser("~/.codex/cli_history.db"))
              conn = pr._open_db(db)

              # --- High-recurrence table ---
              rows = pr.high_recurrence(conn, min_occurrences=3, min_fix_rate=0.0)
              if rows:
                  lines = ["| Pattern | Total | Fix% |",
                           "|---------|-------|------|"]
                  for r in rows[:5]:
                      lines.append(f"| `{r['pattern_name']}` | {r['total']} | {r['fix_rate']*100:.0f}% |")
                  hr_table = "\n".join(lines)
              else:
                  hr_table = ""

              # --- Cross-PR correlation table (Phase 8 P3) ---
              cross = pr.cross_pr_correlation(conn, min_prs=2)
              if cross:
                  clines = ["| Pattern | PRs | Total |",
                            "|---------|-----|-------|"]
                  for r in cross[:5]:
                      clines.append(f"| `{r['pattern_name']}` | {r['pr_count']} | {r['total']} |")
                  cross_table = "\n".join(clines)
              else:
                  cross_table = ""

              print(f"HR_TABLE={hr_table}")
              print(f"CROSS_TABLE={cross_table}")
          except Exception as e:
              print(f"HR_TABLE=")
              print(f"CROSS_TABLE=")
          PYEOF

          # Parse outputs safely
          HR_TABLE=$(grep '^HR_TABLE=' /tmp/_hr_output.txt | cut -d'=' -f2- || echo "")
          CROSS_TABLE=$(grep '^CROSS_TABLE=' /tmp/_hr_output.txt | cut -d'=' -f2- || echo "")
          {
            echo "table<<HREOF"
            echo "$HR_TABLE"
            echo "HREOF"
            echo "cross_table<<CROSSEOF"
            echo "$CROSS_TABLE"
            echo "CROSSEOF"
          } >> "$GITHUB_OUTPUT"

      - name: "Snapshot pattern DB → workflow artifact (Phase 8 P2)"
        env:
          CODEX_DB_PATH: ${{ env.CODEX_DB_PATH || '' }}
        run: |
          # Export the pattern knowledge graph as JSON and upload as artifact.
          # This gives cross-run persistence without requiring git commits.
          python3 - <<'PYEOF' > /tmp/pattern_snapshot.json 2>/dev/null || echo '{}' > /tmp/pattern_snapshot.json
          import os, sys, json
          sys.path.insert(0, "scripts/ci")
          try:
              import pattern_recorder as pr
              db = os.environ.get("CODEX_DB_PATH", os.path.expanduser("~/.codex/cli_history.db"))
              conn = pr._open_db(db)
              snapshot = pr.export_json(conn)
              print(json.dumps(snapshot, indent=2))
          except Exception as e:
              print(json.dumps({"error": str(e), "patterns": [], "summary": {}}))
          PYEOF
          echo "Pattern DB snapshot written to /tmp/pattern_snapshot.json"
          wc -l /tmp/pattern_snapshot.json || true

      - name: "Upload pattern DB snapshot artifact"
        uses: actions/upload-artifact@v5
        with:
          name: pattern-db-snapshot-${{ github.run_id }}
          path: /tmp/pattern_snapshot.json
          retention-days: 90
          if-no-files-found: warn

      - name: "Post @copilot fix prompt on failing PR"
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          PATTERN:      ${{ needs.triage.outputs.pattern }}
          RUN_ID:       ${{ needs.triage.outputs.run_id }}
          HEAD_BRANCH:  ${{ needs.triage.outputs.head_branch }}
          HEAD_SHA:     ${{ needs.triage.outputs.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || 'manual-dispatch' }}
          HIGH_REC_TABLE: ${{ steps.high_rec.outputs.table }}
          CROSS_PR_TABLE: ${{ steps.high_rec.outputs.cross_table }}
        run: |
          PR_NUMBER=$(gh pr list --head "${HEAD_BRANCH}" \
            --repo Aries-Serpent/_codex_ --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No open PR found for branch '${HEAD_BRANCH}' — creating GitHub Issue for Copilot escalation"
            echo "### ⚠️ Copilot Escalation via Issue (no PR found)" >> "$GITHUB_STEP_SUMMARY"
            # GAP-043: Fall back to creating a GitHub Issue so the failure is never silently dropped
            # Write body to a temp file to avoid multi-line string YAML parse issues (actionlint).
            RUN_URL="https://github.com/Aries-Serpent/_codex_/actions/runs/${RUN_ID}"
            printf '@copilot Fix the failing CI workflow **%s** (run [#%s](%s)) on branch `%s`.\n\n' \
              "${WORKFLOW_NAME}" "${RUN_ID}" "${RUN_URL}" "${HEAD_BRANCH}" \
              > "${RUNNER_TEMP}/issue_body.md"
            printf 'Auto-fix patterns exhausted. Auto-created because no open PR was found.\n\n' \
              >> "${RUNNER_TEMP}/issue_body.md"
            printf 'Workflow: %s\nBranch: %s\nRun: %s\nSHA: %s\n\n' \
              "${WORKFLOW_NAME}" "${HEAD_BRANCH}" "${RUN_URL}" "${HEAD_SHA}" \
              >> "${RUNNER_TEMP}/issue_body.md"
            printf 'Steps:\n1. Review the failing run linked above\n2. Apply a targeted fix\n3. Push — CI will auto-close this issue on green\n' \
              >> "${RUNNER_TEMP}/issue_body.md"
            ISSUE_URL=$(gh issue create \
              --repo Aries-Serpent/_codex_ \
              --title "CI Failure: ${WORKFLOW_NAME} (run #${RUN_ID})" \
              --body-file "${RUNNER_TEMP}/issue_body.md" \
              --label "ci-failure" 2>/dev/null || echo "")
            if [ -n "$ISSUE_URL" ]; then
              echo "✅ Created escalation issue: ${ISSUE_URL}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ Could not create escalation issue (gh CLI unavailable or labels missing)" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          RUN_URL="https://github.com/Aries-Serpent/_codex_/actions/runs/${RUN_ID}"

          # ── Dedup guard: skip if a copilot-escalation comment was posted < 30 min ago ──
          ESCALATION_MARKER="<!-- copilot-escalation:${PR_NUMBER} -->"
          # Use a heredoc-fed jq expression to avoid double-quote nesting inside
          # the --jq flag argument (reviewer: jq program must not embed double
          # quotes in a double-quoted shell string — use single-quote wrapper).
          JQ_EXPR='[.comments[] | select(.body | contains("<!-- copilot-escalation:"))] | last | .createdAt // empty'
          LAST_ESC=$(gh pr view "$PR_NUMBER" --repo Aries-Serpent/_codex_ \
            --json comments --jq "$JQ_EXPR" \
            2>/dev/null || echo "")
          if [ -n "$LAST_ESC" ]; then
            NOW_TS=$(date +%s)
            LAST_TS=$(date -d "${LAST_ESC}" +%s 2>/dev/null || echo "0")
            ELAPSED=$(( NOW_TS - LAST_TS ))
            if [ "$ELAPSED" -lt 1800 ]; then
              echo "::notice::Skipping copilot-escalation — posted ${ELAPSED}s ago (< 30 min cooldown)"
              echo "### ⏭️ Copilot Escalation Skipped (cooldown)" >> "$GITHUB_STEP_SUMMARY"
              echo "Last escalation was ${ELAPSED}s ago. Cooldown: 1800s." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # Build structured @copilot prompt per proposal §6 (Phase 8 P3: includes cross-PR correlation)
          cat > "${RUNNER_TEMP}/copilot_escalation.txt" <<COPILOT_EOF
          <!-- copilot-escalation:${PR_NUMBER} -->
          ## 🤖 Copilot Self-Healing Escalation

          Auto-fix patterns exhausted for this failure. Requesting Copilot Coding Agent assistance.

          @copilot Fix the failing CI workflow "${WORKFLOW_NAME}" (run #${RUN_ID}).

          **Context:**
          - Workflow: \`${WORKFLOW_NAME}\`
          - Failed run: [${RUN_ID}](${RUN_URL})
          - Pattern: \`${PATTERN}\` (auto-fix not available or exhausted)
          - Branch: \`${HEAD_BRANCH}\`
          - Commit: \`${HEAD_SHA}\`

          **High-Recurrence Patterns (top recurring — from pattern DB):**
          ${HIGH_REC_TABLE:-_No high-recurrence patterns recorded yet._}

          **Cross-PR Correlation (patterns recurring across multiple PRs — Phase 8 P3):**
          ${CROSS_PR_TABLE:-_No cross-PR patterns detected yet._}

          **Instructions:**
          1. Load \`.codex/CODEBASE_AGENCY_POLICY.md\` and follow §0
          2. Check for open CI failure issues: \`gh issue list --label ci-failure --state open\` and \`gh issue list --label ci-health-alert --state open\`
          3. Analyze the failure logs at ${RUN_URL}
          4. Apply the minimal fix required
          5. Run self-review (5-pass) before committing
          6. Update \`docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md\`

          _Posted by: iterative-self-healing-ci.yml → copilot-escalation (S201 Phase 8 P3)_

          ---
          _[🔗 Workflow run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_
          COPILOT_EOF

          # Strip leading whitespace from heredoc (indented for readability)
          sed -i 's/^          //' "${RUNNER_TEMP}/copilot_escalation.txt"

          gh pr comment "$PR_NUMBER" --repo Aries-Serpent/_codex_ \
            --body-file "${RUNNER_TEMP}/copilot_escalation.txt"

          echo "### 🤖 Copilot Escalation Posted" >> "$GITHUB_STEP_SUMMARY"
          echo "Posted \`@copilot\` fix prompt on PR #${PR_NUMBER}." >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pattern | \`${PATTERN}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR | #${PR_NUMBER} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | [${RUN_ID}](${RUN_URL}) |" >> "$GITHUB_STEP_SUMMARY"
