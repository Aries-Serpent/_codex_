name: Scheduled Workflow Analytics

on:
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  
  workflow_dispatch:
    inputs:
      force_report:
        description: 'Force generate report even if healthy'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  weekly-analytics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyyaml
      
      - name: Run Weekly Analytics
        id: analytics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/workflow_analytics_runner.py \
            --analysis-period 100 \
            --status-filter all \
            --output-dir ".codex/reports" \
            --create-report true \
            --run-id "${{ github.run_id }}"
          
          # Read health status from output
          if [ -f "$GITHUB_OUTPUT" ]; then
            cat "$GITHUB_OUTPUT"
          fi
      
      - name: Check if Action Required
        id: check
        run: |
          HEALTH_STATUS="${{ steps.analytics.outputs.health_status }}"
          PATTERNS="${{ steps.analytics.outputs.patterns_detected }}"
          
          echo "Health status: $HEALTH_STATUS"
          echo "Patterns detected: $PATTERNS"
          
          if [ "$HEALTH_STATUS" != "HEALTHY" ] || [ "$PATTERNS" = "true" ] || [ "${{ inputs.force_report }}" = "true" ]; then
            echo "action_required=true" >> $GITHUB_OUTPUT
          else
            echo "action_required=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit Weekly Report
        if: steps.check.outputs.action_required == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .codex/reports/workflow_analytics_*.json
          git add .codex/reports/workflow_analytics_*.md
          
          git commit -m "chore: Weekly workflow analytics report

          Generated by scheduled workflow analytics
          Run ID: ${{ github.run_id }}
          Health Status: ${{ steps.analytics.outputs.health_status }}
          Patterns Detected: ${{ steps.analytics.outputs.patterns_detected }}
          
          [skip ci]" || echo "No changes to commit"
          
          git push || echo "No changes to push"
      
      - name: Create Health Alert Issue
        if: |
          steps.check.outputs.action_required == 'true' &&
          steps.analytics.outputs.health_status != 'HEALTHY'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_FILE=$(ls -t .codex/reports/workflow_analytics_*.md | head -1)
          HEALTH_STATUS="${{ steps.analytics.outputs.health_status }}"
          
          # Create issue with alert
          gh issue create \
            --title "⚠️ Weekly CI/CD Health Alert: Status $HEALTH_STATUS" \
            --body "## Automated Weekly Health Check

          **Status**: $HEALTH_STATUS
          **Patterns Detected**: ${{ steps.analytics.outputs.patterns_detected }}
          **Run ID**: ${{ github.run_id }}
          **Date**: $(date -u +"%Y-%m-%d")

          ### Summary

          The weekly workflow analytics scan has detected issues requiring attention.

          ### Actions Required

          1. Review the full analytics report (attached below)
          2. Investigate detected error patterns
          3. Consult the Error Pattern Database (`.codex/reports/ERROR_PATTERN_DATABASE.md`)
          4. Engage CI Testing Agent for remediation if needed

          ### Full Report

          $(cat \"$REPORT_FILE\")

          ---

          **Auto-generated by**: Scheduled Workflow Analytics
          **Next Scan**: Next Monday at 00:00 UTC" \
            --label "ci/cd,health-alert,automation,priority-high" \
            --assignee "mbaetiong"
      
      - name: Update Dashboard
        if: always()
        run: |
          # Update a CI health dashboard file
          REPORT_FILE=$(ls -t .codex/reports/workflow_analytics_*.json | head -1)
          
          if [ -f "$REPORT_FILE" ]; then
            # Extract key metrics
            HEALTH_STATUS=$(jq -r '.summary.health_status' "$REPORT_FILE")
            SUCCESS_RATE=$(jq -r '.summary.success_rate' "$REPORT_FILE")
            TOTAL_RUNS=$(jq -r '.summary.total_runs' "$REPORT_FILE")
            
            # Create/update dashboard badge data
            mkdir -p .codex/dashboard
            cat > .codex/dashboard/ci_health.json << EOF
          {
            "schemaVersion": 1,
            "label": "CI Health",
            "message": "$HEALTH_STATUS ($SUCCESS_RATE%)",
            "color": "$([ "$HEALTH_STATUS" = "HEALTHY" ] && echo "brightgreen" || echo "yellow")",
            "namedLogo": "github-actions",
            "lastUpdated": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "totalRuns": $TOTAL_RUNS
          }
          EOF
          fi
      
      - name: Upload Analytics Artifact
        uses: actions/upload-artifact@v6
        with:
          name: weekly-analytics-${{ github.run_id }}
          path: |
            .codex/reports/workflow_analytics_*.json
            .codex/reports/workflow_analytics_*.md
            .codex/dashboard/ci_health.json
          retention-days: 90
      
      - name: Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 📊 Weekly Workflow Analytics

          ### Status
          - **Health**: ${{ steps.analytics.outputs.health_status }}
          - **Patterns Detected**: ${{ steps.analytics.outputs.patterns_detected }}
          - **Action Required**: ${{ steps.check.outputs.action_required }}

          ### What Happens Next

          $(if [ "${{ steps.check.outputs.action_required }}" = "true" ]; then
            echo "- ✅ Report committed to repository"
            echo "- ✅ Check for created health alert issue"
            echo "- 📋 Review recommendations in the report"
          else
            echo "- ✅ CI/CD pipeline is healthy"
            echo "- 📊 Metrics updated in dashboard"
            echo "- 🔄 Next scan: Next Monday"
          fi)

          ### Resources
          - [Error Pattern Database](.codex/reports/ERROR_PATTERN_DATABASE.md)
          - [Workflow Analytics Agent](.github/agents/workflow-analytics-agent.md)
          - [CI Testing Agent](.github/agents/ci-testing-agent.md)
          EOF
