name: Adaptive Agent Delegation Framework
true:
  workflow_call:
    inputs:
      context_manifest:
        default: .codex/session_context_manifest.json
        type: string
      delegation_mode:
        default: parallel
        type: string
      max_agents:
        default: '5'
        type: string
  workflow_dispatch:
    inputs:
      context_manifest:
        default: .codex/session_context_manifest.json
        description: Path to session_context_manifest.json
        required: false
      delegation_mode:
        default: parallel
        description: Delegation mode
        options:
        - sequential
        - parallel
        - cascading
        required: true
        type: choice
      dry_run:
        default: false
        description: Dry run (no actual delegation)
        type: boolean
      max_agents:
        default: '5'
        description: Maximum agents to run in parallel
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
  pull-requests: read
jobs:
  load_context:
    name: Load Aggregated Context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    outputs:
      manifest_content: ${{ steps.load.outputs.manifest }}
      agents_to_delegate: ${{ steps.parse.outputs.agents }}
      delegation_count: ${{ steps.parse.outputs.count }}
      has_critical: ${{ steps.parse.outputs.has_critical }}
    steps:
    - name: Configure secret masking
      run: '[ -n "${MASTER_KEY}" ] && echo "::add-mask::${MASTER_KEY}"

        [ -n "${BACKUP_KEY}" ] && echo "::add-mask::${BACKUP_KEY}"'
      env:
        MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
        BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - id: load
      name: Load context manifest
      env:
        MANIFEST_PATH: ${{ inputs.context_manifest || '.codex/session_context_manifest.json'
          }}
      run: "if [ -f \"$MANIFEST_PATH\" ]; then\n  echo \"manifest=$(cat \"$MANIFEST_PATH\"\
        \ | jq -c .)\" >> $GITHUB_OUTPUT\n  echo \"\u2705 Loaded context from $MANIFEST_PATH\"\
        \nelse\n  echo \"\u26A0\uFE0F Manifest not found at $MANIFEST_PATH, using\
        \ empty context\"\n  echo \"manifest={}\" >> $GITHUB_OUTPUT\nfi\n"
    - id: parse
      name: Parse delegation recommendations
      env:
        MANIFEST: ${{ steps.load.outputs.manifest }}
        MAX_AGENTS: ${{ inputs.max_agents || 5 }}
      run: "AGENTS=$(echo \"$MANIFEST\" | jq -r '.delegation_recommendations[0].recommended_agents[]?'\
        \ 2>/dev/null | tr '\\n' ',' | sed 's/,$//')\n\nif [ -z \"$AGENTS\" ]; then\n\
        \  AGENTS=\"unified-coverage-agent,ci-auto-healer-agent,workflow-health-monitor\"\
        \nfi\n\nAGENT_COUNT=$(echo \"$AGENTS\" | tr ',' '\\n' | wc -l)\n\nif [ \"\
        $AGENT_COUNT\" -gt \"$MAX_AGENTS\" ]; then\n  AGENTS=$(echo \"$AGENTS\" |\
        \ tr ',' '\\n' | head -n \"$MAX_AGENTS\" | tr '\\n' ',')\nfi\n\necho \"agents=$AGENTS\"\
        \ >> $GITHUB_OUTPUT\necho \"count=$AGENT_COUNT\" >> $GITHUB_OUTPUT\n\nHAS_CRITICAL=$(echo\
        \ \"$AGENTS\" | grep -c \"security\\|auth\\|critical\" || echo \"0\")\necho\
        \ \"has_critical=$HAS_CRITICAL\" >> $GITHUB_OUTPUT\n\necho \"\U0001F4CB Delegating\
        \ to agents: $AGENTS\"\n"
    - name: Summary
      run: 'echo "## Context Load Summary" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Manifest Path:** ${{ inputs.context_manifest || ''.codex/session_context_manifest.json''
        }}" >> $GITHUB_STEP_SUMMARY

        echo "**Status:** Loaded" >> $GITHUB_STEP_SUMMARY

        '
  delegate_agents:
    if: ${{ needs.load_context.outputs.delegation_count > 0 }}
    name: Delegate to ${{ matrix.agent }}
    needs: load_context
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: ${{ fromJson(format('[{0}]', needs.load_context.outputs.agents_to_delegate))
          }}
      max-parallel: ${{ inputs.max_agents || 5 }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - id: init
      name: Initialize delegation context
      env:
        AGENT: ${{ matrix.agent }}
        DRY_RUN: ${{ inputs.dry_run || false }}
        DELEGATION_MODE: ${{ inputs.delegation_mode || 'parallel' }}
      run: "echo \"\U0001F680 Delegating to agent: $AGENT\"\necho \"   Mode: $DELEGATION_MODE\"\
        \necho \"   Dry run: $DRY_RUN\"\necho \"agent_name=$AGENT\" >> $GITHUB_OUTPUT\n"
    - id: task_manifest
      name: Generate agent task manifest
      env:
        AGENT_ID: ${{ matrix.agent }}
        DELEGATION_MODE: ${{ inputs.delegation_mode || 'parallel' }}
        DRY_RUN: ${{ inputs.dry_run || false }}
        MANIFEST_CONTENT: ${{ needs.load_context.outputs.manifest_content }}
      run: "cat > /tmp/agent_task.json << 'EOF'\n{\n  \"agent_id\": \"AGENT_ID_PLACEHOLDER\"\
        ,\n  \"task_type\": \"adaptive_delegation\",\n  \"phase\": \"phase_2_implementation\"\
        ,\n  \"context\": {\n    \"current_phase\": \"MANIFEST_PLACEHOLDER\",\n  \
        \  \"delegation_mode\": \"MODE_PLACEHOLDER\",\n    \"dry_run\": \"DRY_RUN_PLACEHOLDER\"\
        \n  },\n  \"expected_outputs\": [\n    \"agent_execution_summary\",\n    \"\
        results_artifact\",\n    \"completion_status\"\n  ]\n}\nEOF\n\n# Safe substitution\
        \ using sed\nsed -i \"s|AGENT_ID_PLACEHOLDER|$AGENT_ID|g\" /tmp/agent_task.json\n\
        sed -i \"s|MANIFEST_PLACEHOLDER|${MANIFEST_CONTENT//|/\\\\|}|g\" /tmp/agent_task.json\n\
        sed -i \"s|MODE_PLACEHOLDER|$DELEGATION_MODE|g\" /tmp/agent_task.json\nsed\
        \ -i \"s|DRY_RUN_PLACEHOLDER|$DRY_RUN|g\" /tmp/agent_task.json\n\necho \"\
        task_manifest=$(cat /tmp/agent_task.json | jq -c .)\" >> $GITHUB_OUTPUT\n"
    - id: delegate
      if: ${{ inputs.dry_run != 'true' }}
      name: Execute agent delegation (non-blocking)
      env:
        AGENT_NAME: ${{ steps.init.outputs.agent_name }}
      run: "TASK_ID=$(uuidgen | cut -c1-8)\necho \"\U0001F4EC Queuing agent: $AGENT_NAME\
        \ (task_id: $TASK_ID)\"\n\necho \"task_id=$TASK_ID\" >> $GITHUB_OUTPUT\necho\
        \ \"status=queued\" >> $GITHUB_OUTPUT\n\nmkdir -p .codex/delegation_tasks\n\
        cat > \".codex/delegation_tasks/${TASK_ID}.json\" << 'EOF'\n{\n  \"task_id\"\
        : \"TASK_ID_PLACEHOLDER\",\n  \"agent\": \"AGENT_PLACEHOLDER\",\n  \"queued_at\"\
        : \"TIMESTAMP_PLACEHOLDER\",\n  \"status\": \"queued\"\n}\nEOF\n\n# Safe substitution\n\
        sed -i \"s|TASK_ID_PLACEHOLDER|$TASK_ID|g\" \".codex/delegation_tasks/${TASK_ID}.json\"\
        \nsed -i \"s|AGENT_PLACEHOLDER|$AGENT_NAME|g\" \".codex/delegation_tasks/${TASK_ID}.json\"\
        \nsed -i \"s|TIMESTAMP_PLACEHOLDER|$(date -u +'%Y-%m-%dT%H:%M:%SZ')|g\" \"\
        .codex/delegation_tasks/${TASK_ID}.json\"\n"
    - if: always()
      name: Cache test results (Layer 3)
      uses: actions/cache@v5
      with:
        key: ${{ runner.os }}-pytest-${{ github.sha }}
        path: .pytest_cache/
        restore-keys: '${{ runner.os }}-pytest-

          '
    - if: ${{ inputs.dry_run == 'true' }}
      name: Dry-run output
      env:
        AGENT_NAME: ${{ steps.init.outputs.agent_name }}
        TASK_MANIFEST: ${{ steps.task_manifest.outputs.task_manifest }}
      run: "echo \"\U0001F9EA DRY RUN: Would delegate to $AGENT_NAME\"\necho \"  \
        \ Task manifest: $TASK_MANIFEST\"\n"
    - name: Summary
      run: 'echo "## Agent Delegation Step Summary" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Agent:** ${{ steps.init.outputs.agent_name }}" >> $GITHUB_STEP_SUMMARY

        echo "**Dry Run:** ${{ inputs.dry_run || false }}" >> $GITHUB_STEP_SUMMARY

        echo "**Status:** Delegated" >> $GITHUB_STEP_SUMMARY

        '
    timeout-minutes: 60
  coalesce_results:
    if: ${{ always() && inputs.dry_run != 'true' }}
    name: Coalesce Parallel Results
    needs:
    - load_context
    - delegate_agents
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - id: collect
      name: Collect parallel outputs
      run: "python3 << 'PYTHON_EOF'\nimport json\nimport os\nfrom pathlib import Path\n\
        from datetime import datetime, timezone\n\n# Initialize result collection\n\
        results = {\n    \"generated_at\": datetime.now(timezone.utc).isoformat(),\n\
        \    \"total_agents\": 0,\n    \"completed_agents\": 0,\n    \"failed_agents\"\
        : 0,\n    \"delegated_tasks\": [],\n    \"merged_output\": {},\n    \"next_actions\"\
        : []\n}\n\n# Collect task metadata\ntasks_dir = Path(\".codex/delegation_tasks\"\
        )\nif tasks_dir.exists():\n    for task_file in tasks_dir.glob(\"*.json\"\
        ):\n        try:\n            task = json.loads(task_file.read_text())\n \
        \           results[\"delegated_tasks\"].append(task)\n            results[\"\
        total_agents\"] += 1\n        except Exception as e:\n            print(f\"\
        \u26A0\uFE0F Failed to load {task_file}: {e}\")\n\n# Save aggregated results\n\
        output_file = Path(\".codex/delegation_results.json\")\noutput_file.write_text(json.dumps(results,\
        \ indent=2))\n\nprint(f\"\u2705 Coalesced results from {results['total_agents']}\
        \ agents\")\nprint(f\"   Output saved to: {output_file}\")\nPYTHON_EOF\n"
    - name: Generate delegation summary
      env:
        DELEGATION_MODE: ${{ inputs.delegation_mode || 'parallel' }}
        DELEGATION_COUNT: ${{ needs.load_context.outputs.delegation_count }}
      run: "{\n  echo \"## \U0001F3AF Agent Delegation Summary\"\n  echo \"\"\n  echo\
        \ \"**Timestamp:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')\"\n  echo \"**Mode:**\
        \ $DELEGATION_MODE\"\n  echo \"**Agents Delegated:** $DELEGATION_COUNT\"\n\
        \  echo \"\"\n\n  if [ -f \".codex/delegation_results.json\" ]; then\n   \
        \ echo \"**Results:** \u2705 Coalesced\"\n    echo \"\"\n    cat .codex/delegation_results.json\n\
        \  fi\n} | tee /tmp/delegation_summary.md\n\ncat /tmp/delegation_summary.md\
        \ >> $GITHUB_STEP_SUMMARY\n"
    - id: dashboard
      name: Generate dashboard
      run: "python3 scripts/ci/rapid_delegation_engine.py 2>/dev/null || echo \"\u2139\
        \uFE0F Dashboard generation skipped (optional)\"\n"
    - name: Summary
      run: 'echo "## Coalesce Results Summary" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Status:** Results coalesced" >> $GITHUB_STEP_SUMMARY

        '
    timeout-minutes: 60
  finalize:
    if: ${{ always() }}
    name: Finalize Delegation
    needs:
    - load_context
    - delegate_agents
    - coalesce_results
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Report delegation status
      env:
        DELEGATION_MODE: ${{ inputs.delegation_mode || 'parallel' }}
        DELEGATION_COUNT: ${{ needs.load_context.outputs.delegation_count }}
        DRY_RUN: ${{ inputs.dry_run || false }}
        MAX_PARALLEL: ${{ inputs.max_agents || 5 }}
      run: "echo \"\U0001F4CA Adaptive Agent Delegation Framework - Status Report\"\
        \necho \"\"\necho \"\u2705 Framework Components:\"\necho \"  1. Context Loading:\
        \ \u2705 COMPLETE\"\necho \"  2. Agent Delegation: \u2705 QUEUED ($DELEGATION_COUNT\
        \ agents)\"\necho \"  3. Result Coalescing: \u2705 COMPLETE\"\necho \"\"\n\
        echo \"\U0001F3AF Delegation Mode: $DELEGATION_MODE\"\necho \"\U0001F4E1 Max\
        \ Parallel: $MAX_PARALLEL\"\necho \"\U0001F512 Dry Run: $DRY_RUN\"\necho \"\
        \"\necho \"\U0001F4BE Output Locations:\"\necho \"  - .codex/delegation_results.json\"\
        \necho \"  - .codex/RAPID_DELEGATION_STATUS.md\"\necho \"  - .codex/delegation_tasks/*.json\"\
        \n"
    - name: Summary
      env:
        DELEGATION_MODE: ${{ inputs.delegation_mode || 'parallel' }}
        DELEGATION_COUNT: ${{ needs.load_context.outputs.delegation_count }}
      run: "echo \"## Adaptive Agent Delegation Complete\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"\u2705 **Status:** ${{ job.status\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"\U0001F4E4 **Agents Queued:** $DELEGATION_COUNT\"\
        \ >> $GITHUB_STEP_SUMMARY\necho \"\u2699\uFE0F **Mode:** $DELEGATION_MODE\"\
        \ >> $GITHUB_STEP_SUMMARY\n"
    timeout-minutes: 60
