name: PR Checks (Isolated Cache)
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - src/**
    - tests/**
    - pyproject.toml
    - requirements*.txt
    - .github/workflows/pr-checks.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  pr-test:
    name: PR Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
    - name: Restore cache from main (read-only)
      uses: actions/cache@v5
      with:
        path: /tmp/uv-cache
        key: uv-${{ runner.os }}-py3.11-test-${{ hashFiles('**/requirements*.txt',
          'pyproject.toml') }}
        restore-keys: 'uv-${{ runner.os }}-py3.11-test-

          uv-${{ runner.os }}-py3.11-

          '
    - name: Install UV
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies
      env:
        UV_CACHE_DIR: /tmp/uv-cache
      run: 'pip install pytest-timeout==2.4.0

        export PATH="$HOME/.cargo/bin:$PATH"

        # Install package with dev dependencies (includes all test requirements)

        uv pip install --system -e .[dev]

        '
    - name: Run tests with parallelization
      run: "python -m pytest tests/ \\\n  -n auto \\\n  --timeout=300 \\\n  --tb=short\
        \ \\\n  -x \\\n  --dist=loadscope \\\n  -v\n"
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --type pip --workflow pr-checks
        --health 2>/dev/null || echo ''{"status": "cache health check skipped"}''

        '
    - name: Generate CacheManager keys
      id: cache-keys
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --type pip --workflow pr-checks
        --github-output "$GITHUB_OUTPUT" 2>/dev/null || echo "cache_key=fallback-${{
        github.sha }}" >> "$GITHUB_OUTPUT"

        '
    - name: Run linting
      run: 'pip install ruff

        ruff check . --output-format=github

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: pr-test
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
