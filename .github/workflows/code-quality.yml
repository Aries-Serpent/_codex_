# Code Quality Analysis - Phase 2 CI Integration
# Based on REPO_ADMIN_IMPLEMENTATION_DECISIONS.md Section 4.3.2
# Gradual rollout: Observation → Warning → Enforcement

name: Code Quality Analysis

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  code-smells-observation:
    name: Code Smell Detection (Observation Mode)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for baseline comparison
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run Code Smell Detection
        id: smells
        run: |
          # Phase 1: Observation only - always succeeds
          codex-smell --format json --output .codex/reports/smells.json || true
          
          # Extract metrics for reporting
          if [ -f .codex/reports/smells.json ]; then
            echo "smells_found=true" >> $GITHUB_OUTPUT
          else
            echo "smells_found=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.smells.outputs.smells_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let smells = {long_functions: 0, high_complexity: 0, god_classes: 0};
            try {
              smells = JSON.parse(fs.readFileSync('.codex/reports/smells.json', 'utf8'));
            } catch (e) {
              console.log('Could not parse smells.json:', e);
            }
            
            const comment = `## 📊 Code Quality Report (Observation Mode)
            
            ### Code Smells Detected
            - 📏 **Long functions (>50 lines)**: ${smells.long_functions || 0}
            - 🔢 **High complexity methods**: ${smells.high_complexity || 0}
            - 🏛️ **Potential god classes**: ${smells.god_classes || 0}
            
            ### Analysis
            ${smells.summary || 'See full report for details.'}
            
            ---
            
            ℹ️ **This is Phase 1 (Observation Mode)**
            - These findings are informational only
            - They do not block merging
            - Use insights to improve code quality
            
            📖 See [Code Quality Guide](../blob/main/configs/code_quality.yaml) for thresholds
            `;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const existingComment = comments.find(c => 
              c.body.includes('Code Quality Report (Observation Mode)')
            );
            
            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
      
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: .codex/reports/smells.json
          retention-days: 30
  
  ast-similarity-ci:
    name: AST Similarity Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run AST Similarity Analysis
        env:
          AST_SIMILARITY_ENABLE: "1"  # Enable in CI (disabled locally by default)
        run: |
          # Create output directory
          mkdir -p audit_artifacts
          
          # Run similarity analysis if script exists
          if [ -f scripts/analysis/ast_signature_similarity.py ]; then
            python scripts/analysis/ast_signature_similarity.py || true
          else
            echo "AST similarity script not yet implemented - skipping"
          fi
        continue-on-error: true
      
      - name: Upload AST Similarity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ast-similarity-report
          path: audit_artifacts/ast_similarity.json
          retention-days: 30
          if-no-files-found: ignore

# Phase 2 will add:
# - Incremental analysis with baseline caching
# - Quality gate enforcement (warnings/errors)
# - Performance metrics tracking
