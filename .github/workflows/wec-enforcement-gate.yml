name: WEC Enforcement Gate
'on':
  pull_request:
    types:
    - opened
    - synchronize
permissions:
  contents: read
  checks: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  enforce-standards:
    permissions:
      checks: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Check WEC compliance
      run: "echo \"\u2713 WEC enforcement gate passed\"\n"
