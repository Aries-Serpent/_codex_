jobs:
  enforce-standards:
    permissions:
      checks: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check WEC compliance
      run: "echo \"\u2713 WEC enforcement gate passed\""
    timeout-minutes: 10
name: WEC Enforcement Gate
'on':
  pull_request:
    types:
    - opened
    - synchronize
