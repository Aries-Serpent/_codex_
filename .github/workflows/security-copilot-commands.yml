name: Security Copilot Commands

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  handle-command:
    if: contains(github.event.comment.body, '@copilot scan-summary')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Parse Command
        id: parse
        uses: actions/github-script@v8
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Safely write comment body to file using environment variable
            const commentBody = process.env.COMMENT_BODY;
            const tempFile = path.join(process.env.RUNNER_TEMP, 'comment_body.txt');
            fs.writeFileSync(tempFile, commentBody, 'utf8');
            console.log(`✓ Comment body written to ${tempFile}`);
            
            // Output temp file path for next steps
            core.setOutput('comment_file', tempFile);
      
      - name: Parse Command (Python)
        id: parse_result
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          COMMENT_FILE="${RUNNER_TEMP}/comment_body.txt"
          COMMAND_JSON="${RUNNER_TEMP}/command.json"
          
          python scripts/ci/copilot_security_agent_handoff.py parse-command \
            --comment-file "$COMMENT_FILE" \
            --output "$COMMAND_JSON"
          
          # Extract parse result for debugging
          python3 << 'EOF'
          import json
          import os
          
          cmd_file = os.path.join(os.environ['RUNNER_TEMP'], 'command.json')
          with open(cmd_file, 'r') as f:
              data = json.load(f)
              if data.get('valid'):
                  print(f"✓ Command parsed: {data.get('command')}")
                  print(f"  Query type: {data.get('query_type')}")
                  print(f"  Value: {data.get('value')}")
              else:
                  print("✗ No valid command found")
          EOF
      
      - name: Generate Response
        id: response
        if: steps.parse_result.outcome == 'success'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          COMMAND_JSON="${RUNNER_TEMP}/command.json"
          RESPONSE_MD="${RUNNER_TEMP}/response.md"
          
          python scripts/ci/copilot_security_agent_handoff.py generate-response \
            --query-json "$COMMAND_JSON" \
            --findings-json .codex/security-findings-comprehensive.json \
            --cache-dir .codex/security-cache \
            --output "$RESPONSE_MD"
          
          # Verify response was generated
          if [ -f "$RESPONSE_MD" ]; then
            echo "✓ Response generated ($(wc -l < "$RESPONSE_MD") lines)"
            # Set output for debugging
            RESPONSE=$(cat "$RESPONSE_MD")
            echo "response_length=${#RESPONSE}" >> $GITHUB_OUTPUT
          else
            echo "✗ Failed to generate response"
            exit 1
          fi
      
      - name: Post Comment
        if: steps.response.outcome == 'success'
        uses: actions/github-script@v8
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const responseFile = path.join(process.env.RUNNER_TEMP, 'response.md');
            const response = fs.readFileSync(responseFile, 'utf8');
            
            if (!response || response.length === 0) {
              console.log('Response is empty, skipping comment');
              return;
            }
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: response
              });
              console.log('✓ Posted security scan summary comment');
            } catch (error) {
              console.error('Failed to post comment:', error);
              throw error;
            }
      
      - name: Handle Errors
        if: failure()
        uses: actions/github-script@v8
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ Failed to generate security scan summary. Please check the workflow logs.'
            });

