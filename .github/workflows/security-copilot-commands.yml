name: Security Copilot Commands

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  handle-command:
    if: contains(github.event.comment.body, '@copilot scan-summary')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Parse Command
        id: parse
        run: |
          python scripts/ci/copilot_security_agent_handoff.py parse-command \
            --comment-body "${{ env.COMMENT_BODY }}" \
            --output /tmp/command.json
          
          # Extract parse result for debugging
          python3 << 'EOF'
          import json
          with open('/tmp/command.json', 'r') as f:
              data = json.load(f)
              if data.get('valid'):
                  print(f"✓ Command parsed: {data.get('command')}")
                  print(f"  Query type: {data.get('query_type')}")
                  print(f"  Value: {data.get('value')}")
              else:
                  print("✗ No valid command found")
          EOF
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
      
      - name: Generate Response
        id: response
        run: |
          python scripts/ci/copilot_security_agent_handoff.py generate-response \
            --query-json /tmp/command.json \
            --findings-json .codex/security-findings-comprehensive.json \
            --cache-dir .codex/security-cache \
            --output /tmp/response.md
          
          # Verify response was generated
          if [ -f /tmp/response.md ]; then
            echo "✓ Response generated ($(wc -l < /tmp/response.md) lines)"
            # Set output for debugging
            RESPONSE=$(cat /tmp/response.md)
            echo "response_length=${#RESPONSE}" >> $GITHUB_OUTPUT
          else
            echo "✗ Failed to generate response"
            exit 1
          fi
      
      - name: Post Comment
        if: steps.response.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const response = fs.readFileSync('/tmp/response.md', 'utf8');
            
            if (!response || response.length === 0) {
              console.log('Response is empty, skipping comment');
              return;
            }
            
            try {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: response
              });
              console.log('✓ Posted security scan summary comment');
            } catch (error) {
              console.error('Failed to post comment:', error);
              throw error;
            }
      
      - name: Handle Errors
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ Failed to generate security scan summary. Please check the workflow logs.'
            });
