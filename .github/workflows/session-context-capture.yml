name: Session Context Capture

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to capture context for'
        required: true
        type: number
      session_label:
        description: 'Session label/name'
        required: false
        type: string
        default: 'copilot-session'

permissions:
  contents: read
  pull-requests: read

jobs:
  capture-context:
    name: Capture Session Context
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Initialize with repository variables
        env:
          SESSION_CONTEXT_AUTO_CAPTURE: ${{ vars.SESSION_CONTEXT_AUTO_CAPTURE || 'true' }}
          COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS: ${{ vars.COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS || '128000' }}
          CODEX_LOG_LEVEL: ${{ vars.CODEX_LOG_LEVEL || 'INFO' }}
        run: |
          echo "Session context variables initialized:"
          echo "  SESSION_CONTEXT_AUTO_CAPTURE=$SESSION_CONTEXT_AUTO_CAPTURE"
          echo "  COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS=$COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS"
          echo "  CODEX_LOG_LEVEL=$CODEX_LOG_LEVEL"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pyyaml requests --quiet

      - name: Capture session context
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION_CONTEXT_AUTO_CAPTURE: ${{ vars.SESSION_CONTEXT_AUTO_CAPTURE || 'true' }}
          COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS: ${{ vars.COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS || '128000' }}
        run: |
          python scripts/ci/session_context_enrichment.py capture \
            --pr ${{ inputs.pr_number }} \
            --sha ${{ github.sha }} \
            --output .codex/session_contexts/session_${{ inputs.pr_number }}_latest.json \
            --max-tokens $COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS

      - name: Generate context summary
        id: summary
        run: |
          if [ -f ".codex/session_contexts/session_${{ inputs.pr_number }}_latest.md" ]; then
            echo "## 📋 Session Context Captured" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat ".codex/session_contexts/session_${{ inputs.pr_number }}_latest.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Analyze context loss
        id: loss_analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/session_context_enrichment.py analyze-loss \
            --pr ${{ inputs.pr_number }}

      - name: Upload context artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: session-context-pr${{ inputs.pr_number }}
          path: .codex/session_contexts/session_${{ inputs.pr_number }}_*.json
          retention-days: 30

  # Post context to PR
  post-context-comment:
    name: Post Context Summary to PR
    runs-on: ubuntu-latest
    needs: capture-context
    if: always()
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Download context artifact
        uses: actions/download-artifact@c850b930e6ba138408aa491e8a8d9adbdbc8db4f # v4
        with:
          name: session-context-pr${{ inputs.pr_number }}
          path: context

      - name: Post context to PR
        if: hashFiles('context/*.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read context file
            const contextFile = fs.readdirSync('context').find(f => f.endsWith('.json'));
            if (!contextFile) {
              console.log('No context file found');
              return;
            }

            const context = JSON.parse(fs.readFileSync(path.join('context', contextFile), 'utf8'));
            const marker = '<!-- session-context-capture -->';

            const body = [
              marker,
              '## 📋 Session Context Captured',
              '',
              `**Time:** ${context.timestamp}`,
              `**PR:** #${context.pr_number}`,
              `**SHA:** ${context.sha}`,
              '',
              '### 📝 PR State',
              `- **Title:** ${context.sections.pr_state.title || 'N/A'}`,
              `- **State:** ${context.sections.pr_state.state} (Draft: ${context.sections.pr_state.draft})`,
              `- **Branch:** \`${context.sections.pr_state.head_branch}\` → \`${context.sections.pr_state.base_branch}\``,
              '',
              '### ✅ Outstanding Tasks',
              context.sections.outstanding_tasks.map(t => `- [ ] ${t.description}`).join('\n') || '- No outstanding tasks',
              '',
              '### 🚨 Blocking Issues',
              context.sections.blocking_issues.map(i => `- **${i.type}** (${i.status}): ${i.name || i.author}`).join('\n') || '- No blocking issues',
              '',
              '---',
              `_Context captured for session handoff. Run at: [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: ${{ inputs.pr_number }},
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
