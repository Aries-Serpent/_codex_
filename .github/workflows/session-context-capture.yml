name: Session Context Capture
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to capture context for
        required: true
        type: number
      session_label:
        description: Session label/name
        required: false
        type: string
        default: copilot-session
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  capture-context:
    name: Capture Session Context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Initialize with repository variables
      env:
        SESSION_CONTEXT_AUTO_CAPTURE: ${{ vars.SESSION_CONTEXT_AUTO_CAPTURE || 'true'
          }}
        COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS: ${{ vars.COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS
          || '128000' }}
        CODEX_LOG_LEVEL: ${{ vars.CODEX_LOG_LEVEL || 'INFO' }}
      run: 'echo "Session context variables initialized:"

        echo "  SESSION_CONTEXT_AUTO_CAPTURE=$SESSION_CONTEXT_AUTO_CAPTURE"

        echo "  COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS=$COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS"

        echo "  CODEX_LOG_LEVEL=$CODEX_LOG_LEVEL"

        '
    - name: Setup Python
      uses: actions/setup-python@v6.3.0
      with:
        python-version: 3.12.13
        cache: pip
    - name: Install dependencies
      run: 'pip install pyyaml requests --quiet

        '
    - name: Capture session context
      id: capture
      env:
        GH_TOKEN: ${{ github.token }}
        SESSION_CONTEXT_AUTO_CAPTURE: ${{ vars.SESSION_CONTEXT_AUTO_CAPTURE || 'true'
          }}
        COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS: ${{ vars.COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS
          || '128000' }}
      run: "python scripts/ci/session_context_enrichment.py capture \\\n  --pr ${{\
        \ inputs.pr_number }} \\\n  --sha ${{ github.sha }} \\\n  --output .codex/session_contexts/session_${{\
        \ inputs.pr_number }}_latest.json \\\n  --max-tokens $COGNITIVE_BRAIN_MAX_CONTEXT_TOKENS\n"
    - name: Generate context summary
      id: summary
      run: "if [ -f \".codex/session_contexts/session_${{ inputs.pr_number }}_latest.md\"\
        \ ]; then\n  echo \"## \U0001F4CB Session Context Captured\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"\" >> $GITHUB_STEP_SUMMARY\n  cat \".codex/session_contexts/session_${{\
        \ inputs.pr_number }}_latest.md\" >> $GITHUB_STEP_SUMMARY\nfi\n"
    - name: Analyze context loss
      id: loss_analysis
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python scripts/ci/session_context_enrichment.py analyze-loss \\\n  --pr\
        \ ${{ inputs.pr_number }}\n"
    - name: Upload context artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: session-context-pr${{ inputs.pr_number }}
        path: .codex/session_contexts/session_${{ inputs.pr_number }}_*.json
        retention-days: 30
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  post-context-comment:
    name: Post Context Summary to PR
    runs-on: ubuntu-latest
    needs: capture-context
    if: always()
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
    - name: Download context artifact
      uses: actions/download-artifact@v5
      with:
        name: session-context-pr${{ inputs.pr_number }}
        path: context
    - name: Post context to PR
      if: hashFiles('context/*.json') != ''
      uses: actions/github-script@v8
      with:
        script: "const fs = require('fs');\nconst path = require('path');\n\n// Read\
          \ context file\nconst contextFile = fs.readdirSync('context').find(f =>\
          \ f.endsWith('.json'));\nif (!contextFile) {\n  console.log('No context\
          \ file found');\n  return;\n}\n\nconst context = JSON.parse(fs.readFileSync(path.join('context',\
          \ contextFile), 'utf8'));\nconst marker = '<!-- session-context-capture\
          \ -->';\n\nconst body = [\n  marker,\n  '## \U0001F4CB Session Context Captured',\n\
          \  '',\n  `**Time:** ${context.timestamp}`,\n  `**PR:** #${context.pr_number}`,\n\
          \  `**SHA:** ${context.sha}`,\n  '',\n  '### \U0001F4DD PR State',\n  `-\
          \ **Title:** ${context.sections.pr_state.title || 'N/A'}`,\n  `- **State:**\
          \ ${context.sections.pr_state.state} (Draft: ${context.sections.pr_state.draft})`,\n\
          \  `- **Branch:** \\`${context.sections.pr_state.head_branch}\\` \u2192\
          \ \\`${context.sections.pr_state.base_branch}\\``,\n  '',\n  '### \u2705\
          \ Outstanding Tasks',\n  context.sections.outstanding_tasks.map(t => `-\
          \ [ ] ${t.description}`).join('\\n') || '- No outstanding tasks',\n  '',\n\
          \  '### \U0001F6A8 Blocking Issues',\n  context.sections.blocking_issues.map(i\
          \ => `- **${i.type}** (${i.status}): ${i.name || i.author}`).join('\\n')\
          \ || '- No blocking issues',\n  '',\n  '---',\n  `_Context captured for\
          \ session handoff. Run at: [GitHub Actions](${{ github.server_url }}/${{\
          \ github.repository }}/actions/runs/${{ github.run_id }})_`,\n].join('\\\
          n');\n\nconst { data: comments } = await github.rest.issues.listComments({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  issue_number:\
          \ ${{ inputs.pr_number }},\n  per_page: 100,\n});\n\nconst existing = comments.find(c\
          \ => c.body && c.body.includes(marker));\nif (existing) {\n  await github.rest.issues.updateComment({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    comment_id:\
          \ existing.id,\n    body,\n  });\n} else {\n  await github.rest.issues.createComment({\n\
          \    issue_number: ${{ inputs.pr_number }},\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    body,\n  });\n}\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
