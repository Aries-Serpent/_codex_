name: Semgrep SAST (SARIF Upload)
on:
  push:
    branches:
    - main
    - develop
    - copilot/**
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  pull_request:
    branches:
    - main
    - develop
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  schedule:
  - cron: 0 3 * * *
  workflow_dispatch:
    inputs:
      fail-on-severity:
        description: Severity level to fail on
        required: false
        type: choice
        options:
        - CRITICAL
        - HIGH
        - MEDIUM
        - INFO
        default: HIGH
  workflow_call:
    inputs:
      fail-on-severity:
        description: Severity level to fail on
        required: false
        type: string
        default: HIGH
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  semgrep:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

    - name: Install Semgrep CLI
      run: |
        python -m pip install --upgrade pip
        pip install semgrep
        semgrep --version

    - name: Run Semgrep with SARIF output
      id: semgrep
      continue-on-error: true
      env:
        SEMGREP_TIMEOUT: '300'
        SEMGREP_RULES_TIMEOUT: '60'
      run: |
        set -euo pipefail
        echo "📋 Running Semgrep with SARIF output..."
        echo "Configuration: p/security-audit p/python p/owasp-top-ten"
        echo "Timeout: 300 seconds"
        echo ""

        export SEMGREP_TIMEOUT
        export SEMGREP_RULES_TIMEOUT

        rm -f semgrep.sarif

        echo "🔍 Starting Semgrep scan..."
        SCAN_EXIT_CODE=0
        semgrep --sarif \
          --config=p/security-audit \
          --config=p/python \
          --config=p/owasp-top-ten \
          --output=semgrep.sarif \
          --verbose \
          . || SCAN_EXIT_CODE=$?

        echo ""
        echo "Scan completed with exit code: $SCAN_EXIT_CODE"

        if [ -f "semgrep.sarif" ]; then
          FILE_SIZE=$(stat -c %s semgrep.sarif 2>/dev/null || stat -f %z semgrep.sarif 2>/dev/null || echo "unknown")
          echo "✅ SARIF file successfully created (${FILE_SIZE} bytes)"
        else
          echo "⚠️ Warning: SARIF file was not created by Semgrep (exit code: $SCAN_EXIT_CODE)"
          echo "This may happen if no violations were found or if there was a timeout"
        fi

        exit 0

    - name: Generate diagnostic report
      if: always()
      id: diagnostics
      run: |
        echo "## Semgrep Diagnostics" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### Environment" >> "$GITHUB_STEP_SUMMARY"
        echo "- Python: $(python --version)" >> "$GITHUB_STEP_SUMMARY"
        echo "- Semgrep: $(semgrep --version 2>&1)" >> "$GITHUB_STEP_SUMMARY"
        echo "- Semgrep Location: $(which semgrep)" >> "$GITHUB_STEP_SUMMARY"
        echo "- Working directory: $(pwd)" >> "$GITHUB_STEP_SUMMARY"
        echo "- Disk space: $(df -h . | tail -1 | awk '{print $4, "available"}')" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### File Generation Status" >> "$GITHUB_STEP_SUMMARY"

        if [ -f "semgrep.sarif" ]; then
          FILE_SIZE=$(stat -c %s "semgrep.sarif" 2>/dev/null || stat -f %z "semgrep.sarif" 2>/dev/null || echo "unknown")
          CHECKSUM=$(sha256sum semgrep.sarif 2>/dev/null | cut -d' ' -f1 || md5sum semgrep.sarif 2>/dev/null | cut -d' ' -f1 || echo "N/A")
          echo "✅ **SARIF file generated successfully**" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: semgrep.sarif" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: ${FILE_SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checksum: ${CHECKSUM}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if command -v jq >/dev/null 2>&1; then
            echo "### SARIF Content Analysis" >> "$GITHUB_STEP_SUMMARY"
            RESULT_COUNT=$(jq '.runs[0].results | length' semgrep.sarif 2>/dev/null || echo "0")
            echo "- Results found: ${RESULT_COUNT}" >> "$GITHUB_STEP_SUMMARY"

            if [ "$RESULT_COUNT" -gt 0 ]; then
              ERROR_COUNT=$(jq '[.runs[0].results[] | select(.level == "error")] | length' semgrep.sarif 2>/dev/null || echo "0")
              WARNING_COUNT=$(jq '[.runs[0].results[] | select(.level == "warning")] | length' semgrep.sarif 2>/dev/null || echo "0")
              NOTE_COUNT=$(jq '[.runs[0].results[] | select(.level == "note" or .level == "none")] | length' semgrep.sarif 2>/dev/null || echo "0")
              echo "  - Errors (CRITICAL): ${ERROR_COUNT}" >> "$GITHUB_STEP_SUMMARY"
              echo "  - Warnings (HIGH): ${WARNING_COUNT}" >> "$GITHUB_STEP_SUMMARY"
              echo "  - Notes (INFO): ${NOTE_COUNT}" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "⚠️ **SARIF file NOT found at expected location**" >> "$GITHUB_STEP_SUMMARY"
          echo "A fallback SARIF will be created in the next step" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "### File Search Results" >> "$GITHUB_STEP_SUMMARY"
        echo "Searching for SARIF files in current directory:" >> "$GITHUB_STEP_SUMMARY"
        if find . -maxdepth 1 -name "*.sarif" -type f 2>/dev/null | grep -q .; then
          find . -maxdepth 1 -name "*.sarif" -type f -exec ls -lh {} \; | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
        else
          echo "- No SARIF files found (will create fallback)" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "" >> "$GITHUB_STEP_SUMMARY"

        echo "### Directory Listing" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        ls -lah | head -30 >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Verify SARIF file exists
      if: always()
      continue-on-error: true
      run: |
        echo "🔍 Checking for semgrep.sarif file..."
        echo ""

        if [ -f "semgrep.sarif" ]; then
          echo "✅ semgrep.sarif file found"
          ls -lh semgrep.sarif
          echo ""
          echo "File validity check:"

          if [ ! -s "semgrep.sarif" ]; then
            echo "⚠️ Warning: SARIF file is empty (0 bytes)"
            echo "This is unusual but acceptable - fallback will be created"
          else
            if jq empty semgrep.sarif 2>/dev/null; then
              echo "✅ SARIF file is valid JSON"
              if jq '.runs | length' semgrep.sarif >/dev/null 2>&1; then
                RUN_COUNT=$(jq '.runs | length' semgrep.sarif)
                RESULT_COUNT=$(jq '.runs[0].results | length' semgrep.sarif 2>/dev/null || echo "0")
                echo "✅ SARIF structure is valid"
                echo "   - Runs: ${RUN_COUNT}"
                echo "   - Results: ${RESULT_COUNT}"
              fi
            else
              echo "❌ SARIF file is NOT valid JSON - fallback will be created"
              echo "JSON error:"
              jq empty semgrep.sarif 2>&1 | head -5
            fi
          fi
        else
          echo "ℹ️ semgrep.sarif not found at expected location"
          echo "This is normal if Semgrep didn't find any violations"
          echo "A fallback SARIF will be created in the next step"
          echo ""
          echo "Checking for any SARIF files in working directory..."
          if find . -maxdepth 1 -name "*.sarif" -type f 2>/dev/null | grep -q .; then
            echo "Found SARIF files:"
            find . -maxdepth 1 -name "*.sarif" -type f -exec ls -lh {} \;
          else
            echo "No SARIF files found in directory"
          fi
          echo ""
          echo "First 20 files in working directory:"
          ls -la | head -20
        fi

    - name: Create fallback SARIF if missing
      if: always()
      run: |
        SARIF_FILE="semgrep.sarif"
        CREATE_FALLBACK=false

        if [ ! -f "$SARIF_FILE" ]; then
          echo "📝 SARIF file not found, creating fallback..."
          CREATE_FALLBACK=true
        elif [ ! -s "$SARIF_FILE" ]; then
          echo "📝 SARIF file is empty, creating fallback..."
          CREATE_FALLBACK=true
        elif ! jq empty "$SARIF_FILE" 2>/dev/null; then
          echo "📝 SARIF file is invalid JSON, creating fallback..."
          cp "$SARIF_FILE" "${SARIF_FILE}.broken"
          CREATE_FALLBACK=true
        else
          echo "✅ Valid SARIF file already exists, skipping fallback"
          FILE_SIZE=$(stat -c %s "$SARIF_FILE" 2>/dev/null || stat -f %z "$SARIF_FILE" 2>/dev/null)
          RESULT_COUNT=$(jq '.runs[0].results | length' "$SARIF_FILE" 2>/dev/null || echo "0")
          echo "   - Size: ${FILE_SIZE} bytes"
          echo "   - Results: ${RESULT_COUNT}"
        fi

        if [ "$CREATE_FALLBACK" = true ]; then
          echo "Creating minimal valid SARIF file..."
          jq -n \
            --arg schema "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              "$schema": $schema,
              "version": "2.1.0",
              "runs": [{
                "tool": {
                  "driver": {
                    "name": "Semgrep",
                    "informationUri": "https://semgrep.dev",
                    "version": "1.45.0",
                    "rules": []
                  }
                },
                "results": [],
                "properties": {
                  "ScanTimestamp": $timestamp,
                  "ScanType": "FallbackEmpty"
                }
              }]
            }' > "$SARIF_FILE"

          echo "✅ Fallback SARIF file created"
          echo "   - Status: Empty results (no violations found)"

          if jq empty "$SARIF_FILE" 2>/dev/null; then
            echo "   - Validation: ✅ Valid JSON"
            ls -lh "$SARIF_FILE"
          else
            echo "   - Validation: ❌ Failed!"
            exit 1
          fi
        fi

    - name: Upload SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d
      if: always() && hashFiles('semgrep.sarif') != ''
      with:
        sarif_file: semgrep.sarif
        category: semgrep
        wait-for-processing: false

    - name: Parse Semgrep results for blocking
      if: always()
      id: parse
      shell: bash
      env:
        FAIL_SEVERITY: ${{ inputs.fail-on-severity || 'HIGH' }}
      run: |
        set -euo pipefail

        CRITICAL_COUNT=0
        HIGH_COUNT=0
        INFO_COUNT=0
        PARSE_STATUS="success"

        if [ -f "semgrep.sarif" ]; then
          if jq empty semgrep.sarif 2>/dev/null; then
            if jq '.runs[0].results' semgrep.sarif >/dev/null 2>&1; then
              echo "ℹ️ SARIF file is valid, extracting results..."
              CRITICAL_COUNT=$(jq '[.runs[0].results[] | select(.level == "error")] | length' semgrep.sarif 2>/dev/null || echo "0")
              HIGH_COUNT=$(jq '[.runs[0].results[] | select(.level == "warning")] | length' semgrep.sarif 2>/dev/null || echo "0")
              INFO_COUNT=$(jq '[.runs[0].results[] | select(.level == "note" or .level == "none")] | length' semgrep.sarif 2>/dev/null || echo "0")
            else
              echo "⚠️ Warning: SARIF structure is incomplete, using defaults"
              PARSE_STATUS="incomplete_structure"
            fi
          else
            echo "⚠️ Warning: SARIF file is invalid JSON, using defaults"
            PARSE_STATUS="invalid_json"
          fi
        else
          echo "⚠️ Warning: SARIF file does not exist, using defaults (fallback should have created it)"
          PARSE_STATUS="missing_file"
        fi

        CRITICAL_COUNT=${CRITICAL_COUNT:-0}
        HIGH_COUNT=${HIGH_COUNT:-0}
        INFO_COUNT=${INFO_COUNT:-0}

        echo "critical_findings=${CRITICAL_COUNT}" >> "$GITHUB_OUTPUT"
        echo "high_findings=${HIGH_COUNT}" >> "$GITHUB_OUTPUT"
        echo "info_findings=${INFO_COUNT}" >> "$GITHUB_OUTPUT"
        echo "parse_status=${PARSE_STATUS}" >> "$GITHUB_OUTPUT"

        echo ""
        echo "📊 Findings Summary:"
        echo "- CRITICAL: ${CRITICAL_COUNT}"
        echo "- HIGH: ${HIGH_COUNT}"
        echo "- INFO: ${INFO_COUNT}"
        echo "- Fail Severity: ${FAIL_SEVERITY}"
        echo "- Parse Status: ${PARSE_STATUS}"
        echo ""

        SHOULD_FAIL=false
        FAILURE_REASON=""

        if [[ "$FAIL_SEVERITY" == "CRITICAL" && "$CRITICAL_COUNT" -gt 0 ]]; then
          echo "::error::Semgrep found ${CRITICAL_COUNT} CRITICAL findings"
          SHOULD_FAIL=true
          FAILURE_REASON="Critical findings detected"
        elif [[ "$FAIL_SEVERITY" == "HIGH" && ( "$CRITICAL_COUNT" -gt 0 || "$HIGH_COUNT" -gt 0 ) ]]; then
          echo "::error::Semgrep found ${CRITICAL_COUNT} CRITICAL and ${HIGH_COUNT} HIGH findings"
          SHOULD_FAIL=true
          FAILURE_REASON="High/Critical findings detected"
        elif [[ "$FAIL_SEVERITY" == "MEDIUM" ]]; then
          if [[ "$CRITICAL_COUNT" -gt 0 || "$HIGH_COUNT" -gt 0 || "$INFO_COUNT" -gt 0 ]]; then
            echo "::warning::Semgrep found ${CRITICAL_COUNT} CRITICAL, ${HIGH_COUNT} HIGH, and ${INFO_COUNT} INFO findings"
          fi
          SHOULD_FAIL=false
        fi

        if [ "$SHOULD_FAIL" = true ]; then
          echo "❌ Workflow failing: ${FAILURE_REASON}"
          exit 1
        else
          echo "✅ Semgrep scan passed (blocking threshold not met)"
          echo "   Parse status: ${PARSE_STATUS}"
          exit 0
        fi

    - name: Summary
      if: always()
      env:
        JOB_STATUS: ${{ job.status }}
        FAIL_SEVERITY: ${{ inputs.fail-on-severity || 'HIGH' }}
        REPO: ${{ github.repository }}
        CRITICAL_FINDINGS: ${{ steps.parse.outputs.critical_findings || '0' }}
        HIGH_FINDINGS: ${{ steps.parse.outputs.high_findings || '0' }}
        INFO_FINDINGS: ${{ steps.parse.outputs.info_findings || '0' }}
        PARSE_STATUS: ${{ steps.parse.outputs.parse_status || 'unknown' }}
      run: |
        echo "## Semgrep Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**Status**: $( [ "$JOB_STATUS" = "success" ] && echo "✅ Passed" || echo "⚠️ Check Details" )" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**CRITICAL Findings:** ${CRITICAL_FINDINGS}" >> "$GITHUB_STEP_SUMMARY"
        echo "**HIGH Findings:** ${HIGH_FINDINGS}" >> "$GITHUB_STEP_SUMMARY"
        echo "**INFO Findings:** ${INFO_FINDINGS}" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**Fail Severity Level:** ${FAIL_SEVERITY}" >> "$GITHUB_STEP_SUMMARY"
        echo "**Parse Status:** ${PARSE_STATUS}" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if [ -f "semgrep.sarif" ]; then
          FILE_SIZE=$(stat -c %s "semgrep.sarif" 2>/dev/null || stat -f %z "semgrep.sarif" 2>/dev/null || echo "unknown")
          echo "✅ SARIF file was generated (${FILE_SIZE} bytes) and uploaded to GitHub Security" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "⚠️ SARIF file not found (fallback was not created successfully)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "[View scan results in GitHub Security tab](https://github.com/${REPO}/security/code-scanning)" >> "$GITHUB_STEP_SUMMARY"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
    timeout-minutes: 30
