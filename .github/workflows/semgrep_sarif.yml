name: Art_Semgrep SAST (SARIF Upload)

on:
  push:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow semgrep_sarif 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'live'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          echo "Running Semgrep security scan..."

          # Run semgrep with fallback configurations
          # Try primary configs first, fall back to auto if they fail
          semgrep scan \
            --config=p/security-audit \
            --config=p/python \
            --sarif \
            --output=semgrep-results.sarif \
            --verbose \
            2>&1 | tee semgrep-scan.log || {
              echo "Primary configs failed, falling back to auto..."
              semgrep scan \
                --config=auto \
                --sarif \
                --output=semgrep-results.sarif \
                --verbose \
                2>&1 | tee semgrep-scan-fallback.log
            }

          EXIT_CODE=$?

          # Also generate human-readable output
          if [ -f semgrep-results.sarif ]; then
            semgrep scan \
              --config=p/security-audit \
              --config=p/python \
              --text \
              --output=semgrep-results.txt \
              2>&1 || semgrep scan \
                --config=auto \
                --text \
                --output=semgrep-results.txt \
                2>&1 || true

            if [ -f semgrep-results.txt ]; then
              echo "=== Semgrep Results ==="
              cat semgrep-results.txt
            fi
          fi

          # Exit with actual code (continue-on-error prevents blocking)
          exit ${EXIT_CODE:-0}

      - name: Chunk SARIF results
        if: always() && hashFiles('semgrep-results.sarif') != ''
        run: |
          echo "🔧 Chunking SARIF to comply with GitHub 5000-result limit..."
          python scripts/chunk_sarif.py \
            semgrep-results.sarif \
            sarif-chunks/ \
            --chunk-size 4999 \
            --base-name semgrep \
            --verbose

      - name: Upload chunked SARIF to GitHub Security
        if: always() && hashFiles('sarif-chunks/*.sarif') != ''
        run: |
          echo "📤 Uploading SARIF chunks to GitHub Code Scanning..."

          CHUNKS=(sarif-chunks/*.sarif)
          CHUNK_COUNT=${#CHUNKS[@]}

          if [ "$CHUNK_COUNT" -eq 0 ]; then
            echo "⚠️  No SARIF files found to upload"
            exit 0
          fi

          echo "Found $CHUNK_COUNT chunk(s) to upload"

          for i in "${!CHUNKS[@]}"; do
            sarif_file="${CHUNKS[$i]}"
            chunk_num=$((i + 1))

            echo "Uploading chunk $chunk_num/$CHUNK_COUNT: $sarif_file"

            # Extract chunk suffix for category
            chunk_suffix=$(basename "$sarif_file" .sarif | sed 's/semgrep-chunk-//')

            # Upload via GitHub API
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/code-scanning/sarifs" \
              -F "sarif=@$sarif_file" \
              -F "commit_sha=${{ github.sha }}" \
              -F "ref=${{ github.ref }}" \
              -F "checkout_uri=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}" \
              -F "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -F "tool_name=Semgrep" \
              -F "category=semgrep-chunk-$chunk_suffix" \
              && echo "✅ Chunk $chunk_num uploaded" \
              || echo "❌ Chunk $chunk_num failed"
          done

          echo "✅ Upload complete: $CHUNK_COUNT chunks processed"
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: Upload Semgrep results as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results
          path: |
            semgrep-results.sarif
            semgrep-results.txt
            sarif-chunks/
          retention-days: 30

      - name: Comment on PR with findings
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔍 Semgrep Security Scan Results\n\n';

            try {
              // Check for chunking
              if (fs.existsSync('sarif-chunks')) {
                const chunkFiles = fs.readdirSync('sarif-chunks').filter(f => f.endsWith('.sarif'));
                if (chunkFiles.length > 1) {
                  comment += `📊 Results uploaded in **${chunkFiles.length} chunks** due to GitHub's 5000-result limit\n\n`;
                }
              }

              if (fs.existsSync('semgrep-results.txt')) {
                const results = fs.readFileSync('semgrep-results.txt', 'utf8');
                const lines = results.split('\n');
                const findingCount = lines.filter(l => l.includes('✗')).length;

                if (findingCount > 0) {
                  comment += `⚠️  Found **${findingCount}** potential security issues\n\n`;
                  const MAX_PREVIEW_LENGTH = 2000;
                  let preview = results;
                  if (results.length > MAX_PREVIEW_LENGTH) {
                    let safeCut = results.lastIndexOf('\n', MAX_PREVIEW_LENGTH);
                    if (safeCut === -1) {
                      safeCut = MAX_PREVIEW_LENGTH;
                    }
                    if (safeCut > 0) {
                      const codeUnit = results.charCodeAt(safeCut - 1);
                      if (codeUnit >= 0xDC00 && codeUnit <= 0xDFFF) {
                        safeCut -= 1;
                      }
                    }
                    preview = results.slice(0, safeCut) + '\n... (truncated; see artifact for full results) ...';
                  }
                  comment += '```\n' + preview + '\n```\n\n';
                  comment += 'See the uploaded artifacts for full details.';
                } else {
                  comment += '✅ No security issues found!\n';
                }
              } else {
                comment += '✅ Scan completed successfully\n';
              }
            } catch (error) {
              comment += '⚠️  Could not read scan results\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
