name: Semgrep SAST (SARIF Upload)

on:
  pull_request:
    branches: [ "0D_base_", "main", "master" ]
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep-sarif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install CPU-only PyTorch (required by Semgrep rules)
        run: |
          python -m pip install --upgrade pip
          # Use PyTorch CPU wheel; this is faster and avoids GPU deps.
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Semgrep SAST
        # v2 was not resolvable in the runner; use an available published version.
        uses: returntocorp/semgrep-action@v1
        with:
          # keep your existing inputs, for example:
          output: semgrep.sarif.json

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif.json
