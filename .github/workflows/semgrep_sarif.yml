name: Semgrep SAST (SARIF Upload)

on:
  push:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Python files
        id: detect_python
        run: |
          echo "Checking for Python files in the repo..."
          if git ls-files '*.py' | grep -q .; then
            echo "python_present=true" >> $GITHUB_ENV
            echo "Python files detected"
          else
            echo "python_present=false" >> $GITHUB_ENV
            echo "No Python files detected"
          fi

      - name: Cache pip (only if Python present)
        if: env.python_present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-
            ${{ runner.os }}-pip-

      - name: Install Python deps required by Semgrep rules (only if Python present)
        if: env.python_present == 'true'
        run: |
          python -m pip install --upgrade pip
          # Install Semgrep and its dependencies from requirements file
          if [ -f ".github/semgrep-requirements.txt" ]; then
            pip install -r .github/semgrep-requirements.txt
          else
            # Fallback: Install manually if requirements file not found
            pip install --no-cache-dir semgrep==1.146.0
            pip install --no-cache-dir torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          fi
          # Verify installations
          echo "Semgrep version:"
          semgrep --version
          echo "PyTorch version:"
          python -c "import torch; print(f'PyTorch {torch.__version__}')" || echo "::warning::PyTorch import failed"

      - name: Validate Semgrep configuration
        if: env.python_present == 'true'
        run: |
          echo "Validating Semgrep configuration..."
          if [ -f ".semgrep/semgrep.yml" ]; then
            semgrep --config .semgrep/semgrep.yml --validate || echo "::warning::Config validation returned warnings"
          else
            echo "No custom config found, using defaults"
          fi

      - name: Run Semgrep SAST
        # v2 was not resolvable in the runner; use an available published version.
        # Skip if no Python files are present
        if: env.python_present == 'true'
        run: |
          # Verify PyTorch is available for custom rules (non-blocking)
          if ! python -c "import torch; print('PyTorch available for Semgrep rules')" 2>/dev/null; then
            echo "::warning::PyTorch not available. Some custom Semgrep rules may not work."
          fi

          # Run semgrep with local config files
          semgrep --config semgrep_rules/python-security.yaml \
                  --config semgrep_rules/python-basic.yml \
                  --sarif --output semgrep.sarif.json \
                  || echo "::warning::Semgrep scan completed with findings"

          # Verify SARIF file was created
          if [ ! -f "semgrep.sarif.json" ]; then
            echo "::error::semgrep.sarif.json was not created"
            exit 1
          fi

          echo "SARIF file created successfully"
          ls -lh semgrep.sarif.json

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('semgrep.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif.json
          category: semgrep-custom-rules
