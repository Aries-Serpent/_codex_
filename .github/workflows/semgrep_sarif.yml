name: Semgrep SAST (SARIF Upload)

on:
  push:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'live'
