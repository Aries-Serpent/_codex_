name: Semgrep SAST (SARIF Upload)

on:
  push:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'src/**'
      - 'pyproject.toml'
      - '.semgrep/**'
      - 'semgrep_rules/**'
      - '.github/workflows/semgrep_sarif.yml'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'live'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
      
      - name: Run Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          echo "Running Semgrep security scan..."
          
          # Run semgrep with fallback configurations
          # Try primary configs first, fall back to auto if they fail
          semgrep scan \
            --config=p/security-audit \
            --config=p/python \
            --sarif \
            --output=semgrep-results.sarif \
            --verbose \
            2>&1 | tee semgrep-scan.log || {
              echo "Primary configs failed, falling back to auto..."
              semgrep scan \
                --config=auto \
                --sarif \
                --output=semgrep-results.sarif \
                --verbose \
                2>&1 | tee semgrep-scan-fallback.log
            }
          
          EXIT_CODE=$?
          
          # Also generate human-readable output
          if [ -f semgrep-results.sarif ]; then
            semgrep scan \
              --config=p/security-audit \
              --config=p/python \
              --text \
              --output=semgrep-results.txt \
              2>&1 || semgrep scan \
                --config=auto \
                --text \
                --output=semgrep-results.txt \
                2>&1 || true
            
            if [ -f semgrep-results.txt ]; then
              echo "=== Semgrep Results ==="
              cat semgrep-results.txt
            fi
          fi
          
          # Exit with actual code (continue-on-error prevents blocking)
          exit ${EXIT_CODE:-0}
      
      - name: Upload SARIF results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
      
      - name: Upload Semgrep results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep-results.sarif
            semgrep-results.txt
          retention-days: 30
      
      - name: Comment on PR with findings
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔍 Semgrep Security Scan Results\n\n';
            
            try {
              if (fs.existsSync('semgrep-results.txt')) {
                const results = fs.readFileSync('semgrep-results.txt', 'utf8');
                const lines = results.split('\n');
                const findingCount = lines.filter(l => l.includes('✗')).length;
                
                if (findingCount > 0) {
                  comment += `⚠️  Found **${findingCount}** potential security issues\n\n`;
                  const MAX_PREVIEW_LENGTH = 2000;
                  let preview = results;
                  if (results.length > MAX_PREVIEW_LENGTH) {
                    let safeCut = results.lastIndexOf('\n', MAX_PREVIEW_LENGTH);
                    if (safeCut === -1) {
                      safeCut = MAX_PREVIEW_LENGTH;
                    }
                    if (safeCut > 0) {
                      const codeUnit = results.charCodeAt(safeCut - 1);
                      if (codeUnit >= 0xDC00 && codeUnit <= 0xDFFF) {
                        safeCut -= 1;
                      }
                    }
                    preview = results.slice(0, safeCut) + '\n... (truncated; see artifact for full results) ...';
                  }
                  comment += '```\n' + preview + '\n```\n\n';
                  comment += 'See the uploaded artifacts for full details.';
                } else {
                  comment += '✅ No security issues found!\n';
                }
              } else {
                comment += '✅ Scan completed successfully\n';
              }
            } catch (error) {
              comment += '⚠️  Could not read scan results\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
