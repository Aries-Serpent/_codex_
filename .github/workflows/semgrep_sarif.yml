# [Workflow]: Semgrep SAST CI job
# Generated: 2025-12-20T12:00:00Z | Author: mbaetiong
# Updated: 2025-12-20 - Added version pinning, artifact upload, timeout, workflow_dispatch
name: Semgrep SAST

on:
  push:
    paths:
      - '**/*'
  pull_request:
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Detect Python files
        id: detect_python
        run: |
          echo "Checking for Python files in the repo..."
          if git ls-files '*.py' | grep -q .; then
            echo "python_present=true" >> $GITHUB_ENV
            echo "Python files detected"
          else
            echo "python_present=false" >> $GITHUB_ENV
            echo "No Python files detected"
          fi

      - name: Cache pip (only if Python present)
        if: env.python_present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps required by Semgrep rules (only if Python present)
        if: env.python_present == 'true'
        run: |
          python -m pip install --upgrade pip
          # Install semgrep CLI (pinned version for reproducibility)
          pip install --no-cache-dir semgrep==1.95.0
          # Install CPU-only PyTorch (pinned version, required by some Semgrep rules)
          pip install --no-cache-dir torch==2.1.2+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v2
        with:
          output: semgrep.sarif.json
          # If you use a custom config or path, add inputs here, e.g.:
          # config: .semgrep.yml
          # config: auto

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-results
          path: semgrep.sarif.json
          retention-days: 30

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif.json
