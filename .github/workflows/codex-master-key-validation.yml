name: CODEX_MASTER_KEY Scope Validation
true:
  pull_request:
    paths:
    - scripts/ci/_*.py
    - tests/github/test_*.py
    - .github/workflows/codex-master-key-validation.yml
  workflow_dispatch: null
permissions: read-all
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  validate_scopes:
    name: Validate Token Scopes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Validate CODEX_MASTER_KEY Scopes
      id: validate
      run: 'python scripts/ci/test_codex_master_key_scopes.py --report-json scope_report.json

        '
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      continue-on-error: true
    - name: Display scope validation results
      if: always()
      run: "if [ -f scope_report.json ]; then\n  echo \"=== CODEX_MASTER_KEY Scope\
        \ Report ===\"\n  python -m json.tool scope_report.json || cat scope_report.json\n\
        else\n  echo \"WARNING: scope_report.json not found\"\nfi\n"
    - name: Upload scope report
      uses: actions/upload-artifact@v5
      if: always()
      with:
        path: scope_report.json
        retention-days: 30
        if-no-files-found: warn
        name: codex-master-key-scopes
    - name: Check validation status
      if: always()
      run: "if [ -f scope_report.json ]; then\n  # Parse JSON to check if validation\
        \ passed\n  python -c \"\n  import json\n  with open('scope_report.json')\
        \ as f:\n    data = json.load(f)\n    if data.get('all_processes_covered')\
        \ == False:\n      print('\u26A0\uFE0F  Scope validation identified missing\
        \ scopes')\n      print('Missing scopes:', data.get('missing_scopes', []))\n\
        \    else:\n      print('\u2713 Scope validation passed')\n  \" || true\n\
        fi\n"
    timeout-minutes: 15
