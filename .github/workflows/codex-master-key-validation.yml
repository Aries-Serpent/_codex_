name: CODEX_MASTER_KEY Scope Validation

on:
  pull_request:
    paths:
      - 'scripts/ci/_*.py'
      - 'tests/github/test_*.py'
      - '.github/workflows/codex-master-key-validation.yml'
  workflow_dispatch:

permissions:
  read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_scopes:
    name: Validate Token Scopes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate CODEX_MASTER_KEY Scopes
        id: validate
        run: |
          python scripts/ci/test_codex_master_key_scopes.py --report-json scope_report.json
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        continue-on-error: true

      - name: Display scope validation results
        if: always()
        run: |
          if [ -f scope_report.json ]; then
            echo "=== CODEX_MASTER_KEY Scope Report ==="
            python -m json.tool scope_report.json || cat scope_report.json
          else
            echo "WARNING: scope_report.json not found"
          fi

      - name: Upload scope report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: codex-master-key-scopes
          path: scope_report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Check validation status
        if: always()
        run: |
          if [ -f scope_report.json ]; then
            # Parse JSON to check if validation passed
            python -c "
            import json
            with open('scope_report.json') as f:
              data = json.load(f)
              if data.get('all_processes_covered') == False:
                print('⚠️  Scope validation identified missing scopes')
                print('Missing scopes:', data.get('missing_scopes', []))
              else:
                print('✓ Scope validation passed')
            " || true
          fi
