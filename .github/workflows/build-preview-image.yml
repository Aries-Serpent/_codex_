name: Build & Push Preview Image
true:
  push:
    branches:
    - main
    paths:
    - Dockerfile.preview
    - src/codex/auth/**
    - cognitive_app/**
    - pyproject.toml
    - .devcontainer/**
  pull_request:
    paths:
    - Dockerfile.preview
    - src/codex/auth/**
    - cognitive_app/**
    - .devcontainer/**
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to GHCR (default: true on main)'
        required: false
        default: 'true'
        type: boolean
      image_tag:
        description: 'Image tag override (default: git SHA short)'
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  cost-gate:
    name: "\U0001F4B0 Cost Gate"
    uses: ./.github/workflows/cost-gate.yml
    with:
      workflow_name: Build & Push Preview Image
      runner: ubuntu-latest-m
      timeout_minutes: 30
      matrix_count: 2
      pushes_to_ghcr: true
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 60
  lint-dockerfile:
    name: Lint Dockerfile.preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: cost-gate
    steps:
    - uses: actions/checkout@v7
    - name: "Hadolint \u2014 Dockerfile linter"
      uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
      with:
        dockerfile: Dockerfile.preview
        failure-threshold: error
        ignore: DL3008,DL3013
  build:
    name: Build preview image (${{ matrix.target }})
    runs-on: ubuntu-latest-m
    timeout-minutes: 30
    needs: lint-dockerfile
    strategy:
      fail-fast: false
      matrix:
        target:
        - preview
        - preview-dev
    steps:
    - uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      with:
        platforms: arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      with:
        driver-opts: image=moby/buildkit:latest
    - name: Compute image tags
      id: tags
      run: "REPO=\"ghcr.io/$(echo \"${{ github.repository_owner }}\" | tr '[:upper:]'\
        \ '[:lower:]')/codex\"\nSHORT_SHA=\"${{ github.sha }}\"\nSHORT_SHA=\"${SHORT_SHA:0:7}\"\
        \nINPUT_TAG=\"${{ github.event.inputs.image_tag }}\"\nTAG=\"${INPUT_TAG:-$SHORT_SHA}\"\
        \nTARGET=\"${{ matrix.target }}\"\n\nif [[ \"${{ github.ref }}\" == \"refs/heads/main\"\
        \ ]]; then\n  echo \"tags=${REPO}/${TARGET}:latest,${REPO}/${TARGET}:${TAG}\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"should_push=true\" >> \"$GITHUB_OUTPUT\"\
        \n  # Multi-arch on main: build both amd64 and arm64\n  echo \"platforms=linux/amd64,linux/arm64\"\
        \ >> \"$GITHUB_OUTPUT\"\nelif [[ \"${{ github.event_name }}\" == \"workflow_dispatch\"\
        \ && \"${{ github.event.inputs.push_image }}\" == \"true\" ]]; then\n  echo\
        \ \"tags=${REPO}/${TARGET}:latest,${REPO}/${TARGET}:${TAG}\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"should_push=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"platforms=linux/amd64,linux/arm64\"\
        \ >> \"$GITHUB_OUTPUT\"\nelif [[ \"${{ github.event_name }}\" == \"workflow_dispatch\"\
        \ && \"${{ github.event.inputs.push_image }}\" != \"true\" ]]; then\n  # workflow_dispatch\
        \ with push_image=false (or unset): local smoke-test only.\n  # github.event.number\
        \ is EMPTY for workflow_dispatch \u2014 use run_id instead to\n  # guarantee\
        \ a unique, non-empty tag (fixes Copilot review r2920097250).\n  echo \"tags=${REPO}/${TARGET}:manual-${{\
        \ github.run_id }}-${TAG}\" >> \"$GITHUB_OUTPUT\"\n  echo \"should_push=false\"\
        \ >> \"$GITHUB_OUTPUT\"\n  # load=true is incompatible with multi-platform;\
        \ amd64 only for local runs\n  echo \"platforms=linux/amd64\" >> \"$GITHUB_OUTPUT\"\
        \nelse\n  # Pull request\n  echo \"tags=${REPO}/${TARGET}:pr-${{ github.event.number\
        \ }}-${TAG}\" >> \"$GITHUB_OUTPUT\"\n  echo \"should_push=false\" >> \"$GITHUB_OUTPUT\"\
        \n  # PR builds: amd64 only \u2014 load=true is incompatible with multi-platform\
        \ builds\n  echo \"platforms=linux/amd64\" >> \"$GITHUB_OUTPUT\"\nfi\necho\
        \ \"cache_key=${TARGET}-${{ hashFiles('Dockerfile.preview','pyproject.toml')\
        \ }}\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Log in to GHCR
      if: steps.tags.outputs.should_push == 'true'
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build (and push on main)
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
      with:
        context: .
        file: Dockerfile.preview
        target: ${{ matrix.target }}
        push: ${{ steps.tags.outputs.should_push == 'true' }}
        load: ${{ steps.tags.outputs.should_push != 'true' }}
        platforms: ${{ steps.tags.outputs.platforms }}
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha,scope=${{ steps.tags.outputs.cache_key }}
        cache-to: type=gha,scope=${{ steps.tags.outputs.cache_key }},mode=max
        labels: 'org.opencontainers.image.revision=${{ github.sha }}

          org.opencontainers.image.created=${{ github.event.head_commit.timestamp
          }}

          '
    - name: "Smoke-test \u2014 run health check"
      if: matrix.target == 'preview'
      run: "docker run --rm -d --name codex-preview-smoke -p 18765:8765 \\\n  -e CODEX_DB_PATH=/tmp/codex.db\
        \ \\\n  $(echo \"${{ steps.tags.outputs.tags }}\" | cut -d, -f1)\n\necho \"\
        Waiting for server to start\u2026\"\nfor i in $(seq 1 12); do\n  sleep 5\n\
        \  if curl -sf http://localhost:18765/api/health; then\n    echo \"\u2705\
        \ Health check passed\"\n    docker stop codex-preview-smoke\n    exit 0\n\
        \  fi\n  echo \"Attempt $i/12 \u2014 not ready yet\"\ndone\ndocker logs codex-preview-smoke\n\
        docker stop codex-preview-smoke\necho \"\u274C Health check timed out\"\n\
        exit 1\n"
  summary:
    name: Image build summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: always()
    steps:
    - name: Write summary
      run: "echo \"## \U0001F433 Preview Image Build Summary\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"| Target | Result |\" >> \"\
        $GITHUB_STEP_SUMMARY\"\necho \"|--------|--------|\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"| \\`preview\\` | ${{ needs.build.result == 'success' && '\u2705\
        \ passed' || '\u274C failed' }} |\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"|\
        \ \\`preview-dev\\` | ${{ needs.build.result == 'success' && '\u2705 passed'\
        \ || '\u274C failed' }} |\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"Images pushed to: \\`ghcr.io/aries-serpent/codex/preview\\`\" >>\
        \ \"$GITHUB_STEP_SUMMARY\"\necho \"Devcontainer spec: \\`.devcontainer/devcontainer.json\\\
        `\" >> \"$GITHUB_STEP_SUMMARY\"\n"
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: summary
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Build Preview Image
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
