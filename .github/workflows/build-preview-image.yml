name: Build & Push Preview Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.preview"
      - "src/codex/auth/**"
      - "cognitive_app/**"
      - "pyproject.toml"
      - ".devcontainer/**"
  pull_request:
    paths:
      - "Dockerfile.preview"
      - "src/codex/auth/**"
      - "cognitive_app/**"
      - ".devcontainer/**"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to GHCR (default: true on main)"
        required: false
        default: "true"
        type: boolean
      image_tag:
        description: "Image tag override (default: git SHA short)"
        required: false
        type: string

concurrency:
  group: preview-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ── Lint Dockerfile ──────────────────────────────────────────────────────────
  lint-dockerfile:
    name: Lint Dockerfile.preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint — Dockerfile linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.preview
          failure-threshold: error
          ignore: DL3008,DL3013  # apt pin / pip upgrade — acceptable in dev images

  # ── Build all targets ────────────────────────────────────────────────────────
  build:
    name: Build preview image (${{ matrix.target }})
    runs-on: ubuntu-latest-m
    timeout-minutes: 30
    needs: lint-dockerfile
    strategy:
      fail-fast: false
      matrix:
        target:
          - preview
          - preview-dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Compute image tags
        id: tags
        run: |
          REPO="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/codex"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          INPUT_TAG="${{ github.event.inputs.image_tag }}"
          TAG="${INPUT_TAG:-$SHORT_SHA}"
          TARGET="${{ matrix.target }}"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tags=${REPO}/${TARGET}:latest,${REPO}/${TARGET}:${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.push_image }}" == "true" ]]; then
            echo "tags=${REPO}/${TARGET}:latest,${REPO}/${TARGET}:${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REPO}/${TARGET}:pr-${{ github.event.number }}-${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "cache_key=${TARGET}-${{ hashFiles('Dockerfile.preview','pyproject.toml') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.tags.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.preview
          target: ${{ matrix.target }}
          push: ${{ steps.tags.outputs.should_push == 'true' }}
          # load=true exports the image to the local Docker daemon on PR builds so
          # the smoke-test step can run it without pulling from GHCR (which would
          # fail because the image has not been pushed yet on non-main branches).
          load: ${{ steps.tags.outputs.should_push != 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ steps.tags.outputs.cache_key }}
          cache-to:   type=gha,scope=${{ steps.tags.outputs.cache_key }},mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Smoke-test — run health check
        if: matrix.target == 'preview'
        run: |
          docker run --rm -d --name codex-preview-smoke -p 18765:8765 \
            -e CODEX_DB_PATH=/tmp/codex.db \
            $(echo "${{ steps.tags.outputs.tags }}" | cut -d, -f1)

          echo "Waiting for server to start…"
          for i in $(seq 1 12); do
            sleep 5
            if curl -sf http://localhost:18765/api/health; then
              echo "✅ Health check passed"
              docker stop codex-preview-smoke
              exit 0
            fi
            echo "Attempt $i/12 — not ready yet"
          done
          docker logs codex-preview-smoke
          docker stop codex-preview-smoke
          echo "❌ Health check timed out"
          exit 1

  # ── Publish summary ──────────────────────────────────────────────────────────
  summary:
    name: Image build summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## 🐳 Preview Image Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`preview\` | ${{ needs.build.result == 'success' && '✅ passed' || '❌ failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`preview-dev\` | ${{ needs.build.result == 'success' && '✅ passed' || '❌ failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Images pushed to: \`ghcr.io/aries-serpent/codex/preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Devcontainer spec: \`.devcontainer/devcontainer.json\`" >> "$GITHUB_STEP_SUMMARY"
