name: "PR Comment Review Gate"

# ────────────────────────────────────────────────────────────────────────────
# REQ-13 — Hardened Comment Review Gate (S227)
#
# Tier-1 GROUNDED enforcement: runs on every PR push and posts a live
# checklist of all unaddressed comments from:
#   • mbaetiong (BLOCKING — CI fails until addressed)
#   • github-actions[bot], copilot-pull-request-reviewer[bot],
#     github-advanced-security[bot], github-code-quality[bot] (BLOCKING)
#   • dependabot[bot], codecov[bot] etc. (WARNING)
#
# The checklist is upserted into a single PR comment (marker-based dedup).
# CI fails with exit code 1 if blocking comments remain unaddressed.
#
# Policy reference: .codex/CODEBASE_AGENCY_POLICY.md §0
# ────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

concurrency:
  group: comment-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ── Job 1: Scan all PR comments and post the live checklist ───────────────
  scan-and-post:
    name: "🔍 Scan PR comments"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Run on PR events or when mbaetiong posts a new comment
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'mbaetiong')

    outputs:
      exit_code: ${{ steps.scan.outputs.exit_code }}
      blocking_count: ${{ steps.scan.outputs.blocking_count }}
      warning_count: ${{ steps.scan.outputs.warning_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          sparse-checkout: scripts/ci/check_pr_comments.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Determine PR number
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Scan comments and post checklist
        id: scan
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          GITHUB_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          # Disable exit-on-error so we can capture the exit code explicitly.
          # check_pr_comments.py uses non-zero exit codes to signal unaddressed
          # comments (exit 1=blocking, 2=warning, 3=API error) which are expected
          # return values, not script failures.  Without set +e, set -e would
          # terminate the step before EXIT_CODE=$? is reached.
          set +e
          python3 scripts/ci/check_pr_comments.py \
            --pr "${{ steps.pr_info.outputs.pr_number }}" \
            --repo "${{ steps.pr_info.outputs.repo }}" \
            --post-checklist \
            --output-json /tmp/comment_review_report.json \
            --write-session-requirements /tmp/session_requirements.md
          EXIT_CODE=$?
          set -e

          # Parse counts from report
          BLOCKING=$(python3 -c "
          import json
          r = json.load(open('/tmp/comment_review_report.json'))
          print(len(r.get('unaddressed_blocking', [])))
          " 2>/dev/null || echo "0")
          WARNING=$(python3 -c "
          import json
          r = json.load(open('/tmp/comment_review_report.json'))
          print(len(r.get('unaddressed_warning', [])))
          " 2>/dev/null || echo "0")

          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "blocking_count=${BLOCKING}" >> "$GITHUB_OUTPUT"
          echo "warning_count=${WARNING}" >> "$GITHUB_OUTPUT"

          # Write step summary — use BLOCKING/WARNING counts, not EXIT_CODE,
          # because --write-session-requirements always exits 0 even when
          # blocking comments exist.
          echo "## 🔍 PR Comment Review Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${BLOCKING:-0}" -gt 0 ]; then
            echo "### 🚨 ${BLOCKING} blocking comment(s) unaddressed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Requirements written to session_requirements.md — injected into next Copilot session prompt." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${WARNING:-0}" -gt 0 ]; then
            echo "### ⚠️ ${WARNING} warning comment(s) unaddressed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ All comments addressed" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Return 0 always here — the gate job below enforces failure
          exit 0

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: comment-review-report-${{ steps.pr_info.outputs.pr_number }}-${{ github.run_id }}
          path: /tmp/comment_review_report.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload session requirements
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: session-requirements-${{ steps.pr_info.outputs.pr_number }}
          path: /tmp/session_requirements.md
          retention-days: 7
          if-no-files-found: warn

  # ── Job 2: Gate — fail CI if blocking comments are unaddressed ────────────
  gate:
    name: "🚦 Comment review gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: scan-and-post

    steps:
      - name: Enforce blocking comment requirement
        env:
          BLOCKING: ${{ needs.scan-and-post.outputs.blocking_count }}
          EXIT_CODE: ${{ needs.scan-and-post.outputs.exit_code }}
        run: |
          echo "Blocking unaddressed comments: ${BLOCKING}"
          echo "Exit code from scan: ${EXIT_CODE}"

          if [ "${EXIT_CODE}" = "1" ] || [ "${BLOCKING:-0}" -gt 0 ]; then
            echo "::error::${BLOCKING} blocking comment(s) from mbaetiong or CI bots are unaddressed."
            echo "::error::Review the PR comment checklist and address each item before committing."
            echo ""
            echo "### 🚨 CI GATE FAILED — Unaddressed Blocking Comments" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**${BLOCKING} blocking comment(s)** from \`mbaetiong\` or CI bots remain unaddressed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**To resolve:**" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Read every 🚨 row in the comment review checklist on this PR" >> "$GITHUB_STEP_SUMMARY"
            echo "2. Reply to each comment with your resolution" >> "$GITHUB_STEP_SUMMARY"
            echo "3. Push a new commit — this gate will re-scan automatically" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_[🔗 Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "### ✅ Comment Review Gate: PASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All blocking comments are addressed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_[🔗 Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_" >> "$GITHUB_STEP_SUMMARY"

  # ── Rescue comment on failure ─────────────────────────────────────────────
  rescue-comment:
    name: "Post gate failure notice"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scan-and-post, gate]
    if: failure()
    concurrency:
      group: ci-rescue-comment-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: false

    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        continue-on-error: true  # rescue comment is best-effort; don't mask the gate failure
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Comment Review Gate"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
