name: "🍎 Pages Health Guard (Self-Healing) - ENHANCED"
on:
  deployment_status: null
  workflow_dispatch:
    inputs:
      force_redeploy:
        description: Force redeploy even if health check passes (true/false)
        required: false
        default: 'false'
  schedule:
  - cron: '0 0 * * *'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
jobs:
  health-check:
    if: ${{ github.event.pull_request.number != 5328 }}
    name: "🔍 Check Pages health + self-heal if 404 + cognitive_app validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Resolve GitHub Pages URL
      id: resolve_url
      run: |
        OWNER="${{ github.repository_owner }}"
        REPO="${{ github.event.repository.name }}"
        PAGES_URL="https://${OWNER,,}.github.io/${REPO}/"
        echo "pages_url=${PAGES_URL}" >> "$GITHUB_OUTPUT"
        echo "📍 Pages URL: ${PAGES_URL}"
    - name: Check deployment event context
      id: deploy_context
      if: github.event_name == 'deployment_status'
      run: |
        DEPLOY_ENV="${{ github.event.deployment.environment }}"
        DEPLOY_STATE="${{ github.event.deployment_status.state }}"
        DEPLOY_URL="${{ github.event.deployment_status.target_url }}"
        DEPLOY_DESC="${{ github.event.deployment_status.description }}"
        echo "environment=${DEPLOY_ENV}"    >> "$GITHUB_OUTPUT"
        echo "state=${DEPLOY_STATE}"        >> "$GITHUB_OUTPUT"
        echo "target_url=${DEPLOY_URL}"     >> "$GITHUB_OUTPUT"
        echo "🚀 Deployment to '${DEPLOY_ENV}': ${DEPLOY_STATE}"
        echo "   URL: ${DEPLOY_URL}"
        echo "   Description: ${DEPLOY_DESC}"
        
        if [ "${DEPLOY_ENV}" != "github-pages" ]; then
          echo "skip_check=true" >> "$GITHUB_OUTPUT"
          echo "ℹ️  Not a github-pages deployment — skipping health check"
        elif [ "${DEPLOY_STATE}" != "success" ]; then
          echo "skip_check=true" >> "$GITHUB_OUTPUT"
          echo "ℹ️  Deployment state is '${DEPLOY_STATE}' (not success) — skipping"
        else
          echo "skip_check=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Check HTTP status of deployed site
      id: http_check
      if: steps.deploy_context.outputs.skip_check != 'true'
      run: |
        PAGES_URL="${{ steps.resolve_url.outputs.pages_url }}"
        echo "🔍 Checking: ${PAGES_URL}"
        FORCE="${{ github.event.inputs.force_redeploy || 'false' }}"
        
        MAX_ATTEMPTS=9
        SLEEP_SECS=10
        FINAL_CODE="000"
        for i in $(seq 1 ${MAX_ATTEMPTS}); do
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 20 \
            --retry 0 \
            -H "Cache-Control: no-cache" \
            "${PAGES_URL}" 2>/dev/null || echo "000")
          echo "  Attempt ${i}/${MAX_ATTEMPTS}: HTTP ${HTTP_CODE}"
          FINAL_CODE="${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "200" ] && [ "${FORCE}" != "true" ]; then
              break
          fi
          [ "${i}" -lt "${MAX_ATTEMPTS}" ] && sleep ${SLEEP_SECS}
        done
        
        echo "final_http_code=${FINAL_CODE}" >> "$GITHUB_OUTPUT"
        
        if [ "${FINAL_CODE}" = "200" ] && [ "${FORCE}" != "true" ]; then
          echo "site_healthy=true"  >> "$GITHUB_OUTPUT"
          echo "✅ Site is healthy (HTTP 200)" >> "$GITHUB_STEP_SUMMARY"
          echo "## ✅ Pages Health: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "Site at \`${PAGES_URL}\` returned **HTTP 200**." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "site_healthy=false" >> "$GITHUB_OUTPUT"
          REASON="HTTP ${FINAL_CODE}"
          [ "${FORCE}" = "true" ] && REASON="forced redeploy (manual override)"
          echo "❌ Site unhealthy: ${REASON}" >> "$GITHUB_STEP_SUMMARY"
          echo "## ❌ Pages Health: DEGRADED — triggering self-heal" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pages URL | \`${PAGES_URL}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HTTP status | **${FINAL_CODE}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: cognitive_app bundle health check
      id: bundle_check
      continue-on-error: true
      run: |
        PAGES_URL="${{ steps.resolve_url.outputs.pages_url }}"
        COGNITIVE_APP_URL="${PAGES_URL}cognitive_app/"
        
        echo "🔍 Checking cognitive_app bundle at: ${COGNITIVE_APP_URL}"
        
        BUNDLE_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
          --max-time 20 \
          "${COGNITIVE_APP_URL}" 2>/dev/null || echo "000")
        
        echo "  📦 cognitive_app entry: HTTP ${BUNDLE_CODE}"
        
        if [ "${BUNDLE_CODE}" = "200" ]; then
          echo "bundle_status=healthy" >> $GITHUB_OUTPUT
          echo "✅ cognitive_app bundle is accessible"
        else
          echo "bundle_status=degraded" >> $GITHUB_OUTPUT
          echo "⚠️  cognitive_app bundle check failed (HTTP ${BUNDLE_CODE})"
        fi
    - name: Validate React root element
      id: react_check
      continue-on-error: true
      run: |
        PAGES_URL="${{ steps.resolve_url.outputs.pages_url }}"
        COGNITIVE_APP_URL="${PAGES_URL}cognitive_app/"
        
        echo "🔍 Validating React root element..."
        
        ROOT_DIV=$(curl -sS \
          --max-time 20 \
          "${COGNITIVE_APP_URL}" 2>/dev/null | grep -c "id=\"root\"" || echo "0")
        
        if [ "${ROOT_DIV}" -gt 0 ]; then
          echo "root_div_status=healthy" >> $GITHUB_OUTPUT
          echo "✅ React root element found"
        else
          echo "root_div_status=missing" >> $GITHUB_OUTPUT
          echo "❌ React root element not found"
        fi
    - name: Enhanced health check summary
      if: always()
      run: |
        echo "## 🔍 Enhanced Pages & cognitive_app Health Check" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        PAGES_CODE="${{ steps.http_check.outputs.final_http_code || 'n/a' }}"
        BUNDLE_STATUS="${{ steps.bundle_check.outputs.bundle_status || 'skipped' }}"
        ROOT_STATUS="${{ steps.react_check.outputs.root_div_status || 'skipped' }}"
        
        echo "### Pages Status" >> $GITHUB_STEP_SUMMARY
        echo "- Main pages: HTTP ${PAGES_CODE}" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### cognitive_app Status" >> $GITHUB_STEP_SUMMARY
        echo "- Bundle: \`${BUNDLE_STATUS}\`" >> $GITHUB_STEP_SUMMARY
        echo "- React root: \`${ROOT_STATUS}\`" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Timestamp:** \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`" >> $GITHUB_STEP_SUMMARY
    - name: Trigger MkDocs rebuild (self-heal)
      id: trigger_rebuild
      if: steps.http_check.outputs.site_healthy == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🔄 Triggering pages-mkdocs.yml to restore the site…"
        if gh workflow run pages-mkdocs.yml \
          --ref main \
          --field reason="pages-health-guard-self-heal:${{ github.event_name }}:http${{ steps.http_check.outputs.final_http_code }}"; then
          echo "rebuild_triggered=true" >> "$GITHUB_OUTPUT"
        else
          echo "rebuild_triggered=false" >> "$GITHUB_OUTPUT"
          echo "⚠️  Failed to trigger pages-mkdocs.yml"
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Self-heal triggered:** \`pages-mkdocs.yml\` rebuild dispatched at $(date -u +%Y-%m-%dT%H:%M:%SZ)." >> $GITHUB_STEP_SUMMARY
    - name: Write enhanced telemetry
      if: always()
      run: |
        mkdir -p .codex/telemetry
        echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"event\":\"pages_health_check_enhanced\",\"trigger\":\"${{ github.event_name }}\",\"main_http_code\":\"${{ steps.http_check.outputs.final_http_code || 'n/a' }}\",\"pages_healthy\":\"${{ steps.http_check.outputs.site_healthy || 'n/a' }}\",\"cognitive_app_bundle\":\"${{ steps.bundle_check.outputs.bundle_status || 'skipped' }}\",\"react_root\":\"${{ steps.react_check.outputs.root_div_status || 'skipped' }}\",\"rebuild_triggered\":\"${{ steps.trigger_rebuild.outputs.rebuild_triggered || 'false' }}\"}" \
          >> .codex/telemetry/pages_health_log.jsonl 2>/dev/null || true
        echo "Enhanced telemetry logged"
      timeout-minutes: 15

    - name: Upload telemetry artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: pages-health-telemetry-${{ github.run_id }}
        path: .codex/telemetry/pages_health_log.jsonl
        retention-days: 30
        if-no-files-found: ignore
