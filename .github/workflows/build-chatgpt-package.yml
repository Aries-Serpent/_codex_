name: Build ChatGPT Project Package

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic subset to package (or select "custom" to use glob_filters)'
        required: true
        type: choice
        options:
          - zendesk
          - agents
          - quantum
          - docs
          - mcp
          - workflows
          - python_dev
          - testing
          - security
          - custom
      glob_filters:
        description: 'Optional comma-separated globs to override topic (e.g., "src/**/*.py,docs/*.md")'
        required: false
        type: string
      output_name:
        description: 'Output zip filename (default: package_<topic>.zip)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package Repository Subset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'ephemeral'
