name: Dependency Scan (template)

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC
  workflow_dispatch:


permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  depscan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'live'

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow dependency-scan --health 2>/dev/null || echo '{"status": "cache health check skipped"}'
