name: Validate & Bundle Status Artifacts (v1.2)

on:
  workflow_dispatch:
  push:
    branches: [ "0D_base_", "main", "master" ]
  pull_request:
    branches: [ "0D_base_", "main", "master" ]

jobs:
  status-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml pytest
      - name: Validate and bundle
        run: |
          python scripts/status/validate_and_publish.py > status_validation_summary.json
      - name: Upload bundle
        uses: actions/upload-artifact@v6
        with:
          name: status-artifacts-bundle
          path: |
            status_validation_summary.json
            audit_run_manifest.json
            audit_artifacts/**
            docs/templates/status/codex_status_template.schema_v1.2.json
            docs/templates/status/example_report_v1.2.json
