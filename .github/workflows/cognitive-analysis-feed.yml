name: Cognitive Analysis & Learning (Unified)
on:
  schedule:
  - cron: 0 2 * * *
  workflow_run:
    workflows:
    - Cognitive Action Executor
    - Cognitive Action & Decision (Unified)
    - Workflow Health Check
    types:
    - completed
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        type: choice
        options:
        - aftermath-only
        - pattern-feed-only
        - full-analysis
        default: full-analysis
      evaluation_mode:
        description: Evaluation depth (for aftermath)
        required: false
        type: choice
        options:
        - quick
        - full
        - deep
        default: full
      days_back:
        description: Days of history to analyze (for pattern feeding)
        required: false
        default: '30'
        type: choice
        options:
        - '7'
        - '14'
        - '30'
        - '60'
        - '90'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
jobs:
  aftermath_evaluator:
    name: Evaluate Outcomes and Learn
    runs-on: ubuntu-latest
    if: '(github.event_name == ''workflow_run'' && github.event.workflow_run.name
      == ''Cognitive Action Executor'') ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''aftermath-only''
      || inputs.mode == ''full-analysis''))

      '
    outputs:
      evaluation_complete: ${{ steps.evaluate.outputs.complete }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    - name: "\U0001F500 Resolve push target (chain: sub-PR \u2192 0D_base_ \u2192\
        \ main)"
      id: resolve-target
      uses: ./.github/actions/resolve-push-target
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow cognitive-analysis-feed
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Install dependencies
      run: 'pip install numpy scipy pyyaml

        '
    - name: Run aftermath evaluation
      id: evaluate
      env:
        EVALUATION_MODE: ${{ inputs.evaluation_mode || 'full' }}
      run: "if [ -f \"scripts/cognitive/aftermath_evaluator.py\" ]; then\n  python\
        \ scripts/cognitive/aftermath_evaluator.py \\\n    --mode \"$EVALUATION_MODE\"\
        \n  echo \"complete=true\" >> $GITHUB_OUTPUT\nelse\n  echo \"Aftermath evaluator\
        \ script not found\"\n  echo \"complete=false\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Commit learning updates
      if: steps.evaluate.outputs.complete == 'true'
      run: "git config --local user.email \"github-actions[bot]@users.noreply.github.com\"\
        \ngit config --local user.name \"github-actions[bot]\"\n\nif [[ -n $(git status\
        \ --porcelain cognitive/) ]]; then\n  # Walk the staging chain: sub-PR \u2192\
        \ 0D_base_ \u2192 main  (resolved above)\n  _TARGET=\"${{ steps.resolve-target.outputs.branch\
        \ }}\"\n  echo \"\U0001F500 Push target: $_TARGET (reason: ${{ steps.resolve-target.outputs.reason\
        \ }})\"\n  \n  # SECURITY: Validate target branch exists via API (no git fetch/checkout)\n\
        \  if gh api repos/${{ github.repository }}/branches/\"${_TARGET}\" --silent\
        \ 2>/dev/null; then\n    echo \"\u2705 Target branch validated via API: $_TARGET\"\
        \n  else\n    echo \"\u26A0\uFE0F Warning: Target branch not found via API;\
        \ continuing with git push\"\n  fi\n  \n  # Stage the updated files directly\
        \ (no git checkout needed)\n  git add cognitive/\n  \n  git commit -m \"\U0001F9E0\
        \ Update cognitive learning outcomes [automated]\n  \n  - Analysis period:\
        \ ${{ inputs.evaluation_mode || 'full' }}\n  - Triggered by: ${{ github.event_name\
        \ }}\n  - Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')\"\n  \n  git pull --rebase --autostash\
        \ --autostash --autostash origin \"$_TARGET\" || git pull --ff-only origin\
        \ \"$_TARGET\"\n  git push origin HEAD:\"$_TARGET\"\n  echo \"\u2705 Learning\
        \ updates pushed to $_TARGET\"\nelse\n  echo \"\u2139\uFE0F  No changes to\
        \ cognitive learning\"\nfi\n"
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
    - name: Upload evaluation results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: 'cognitive/evaluations/*.json

          cognitive/learning/*.json

          '
        if-no-files-found: ignore
        retention-days: 30
        name: aftermath-evaluation-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  feed_patterns:
    name: Extract & Feed Patterns
    runs-on: ubuntu-latest
    if: 'github.event_name == ''schedule'' ||

      (github.event_name == ''workflow_run'' && github.event.workflow_run.name ==
      ''Workflow Health Check'') ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''pattern-feed-only''
      || inputs.mode == ''full-analysis''))

      '
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    - name: "\U0001F500 Resolve push target (chain: sub-PR \u2192 0D_base_ \u2192\
        \ main)"
      id: resolve-target
      uses: ./.github/actions/resolve-push-target
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install requests numpy scipy pyyaml

        '
    - name: Extract workflow patterns
      env:
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        DAYS_BACK: ${{ inputs.days_back || '30' }}
      run: "if [ -f \"scripts/cognitive/extract_workflow_patterns.py\" ]; then\n \
        \ python scripts/cognitive/extract_workflow_patterns.py \\\n    --days-back\
        \ \"$DAYS_BACK\" \\\n    --repo ${{ github.repository }}\nelse\n  echo \"\
        Pattern extraction script not found\"\n  exit 0\nfi\n"
    - name: Commit cognitive brain updates
      run: "git config --local user.email \"github-actions[bot]@users.noreply.github.com\"\
        \ngit config --local user.name \"github-actions[bot]\"\n\nif [[ -n $(git status\
        \ --porcelain .codex/cognitive_brain/workflow_patterns.jsonl .codex/cognitive_brain/metadata.json)\
        \ ]]; then\n  # Walk the staging chain: sub-PR \u2192 0D_base_ \u2192 main\
        \  (resolved above)\n  # Route both workflow_patterns.jsonl and metadata.json\
        \ so that\n  # forward-sync-autogen.yml acts only as a safety-net (not primary\
        \ path).\n  _TARGET=\"${{ steps.resolve-target.outputs.branch }}\"\n  echo\
        \ \"\U0001F500 Push target: $_TARGET (reason: ${{ steps.resolve-target.outputs.reason\
        \ }})\"\n  \n  # SECURITY: Validate target branch exists via API (no git fetch)\n\
        \  if gh api repos/${{ github.repository }}/branches/\"${_TARGET}\" --silent\
        \ 2>/dev/null; then\n    echo \"\u2705 Target branch validated via API: $_TARGET\"\
        \n  else\n    echo \"\u26A0\uFE0F Warning: Target branch not found via API;\
        \ continuing with git push\"\n  fi\n  \n  # Stage the updated files directly\
        \ (no git checkout needed)\n  git add .codex/cognitive_brain/workflow_patterns.jsonl\
        \           .codex/cognitive_brain/metadata.json\n  \n  git commit -m \"\U0001F9E0\
        \ Update cognitive brain patterns [automated]\n  \n  - Analysis period: ${{\
        \ inputs.days_back || '30' }} days\n  - Triggered by: ${{ github.event_name\
        \ }}\n  - Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')\"\n  \n  git pull --rebase --autostash\
        \ --autostash --autostash origin \"$_TARGET\" || git pull --ff-only origin\
        \ \"$_TARGET\"\n  git push origin HEAD:\"$_TARGET\"\n  echo \"\u2705 Cognitive\
        \ brain updated on $_TARGET\"\nelse\n  echo \"\u2139\uFE0F  No changes to\
        \ cognitive brain\"\nfi\n"
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
    - name: Upload pattern artifacts
      uses: actions/upload-artifact@v7
      with:
        path: '.codex/cognitive_brain/patterns/*.json

          .codex/cognitive_brain/analysis/*.json

          '
        if-no-files-found: ignore
        retention-days: 60
        name: cognitive-patterns-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  generate_summary:
    name: Generate Analysis Summary
    runs-on: ubuntu-latest
    needs:
    - aftermath_evaluator
    - feed_patterns
    if: always()
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Install dependencies
      run: pip install pyyaml
    - name: Retrieve CB patterns for summary (IMP-013)
      id: cb_patterns
      continue-on-error: true
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
      run: "CB_BLOCK=$(python -m codex.github.mcp_poster retrieve-patterns --limit\
        \ 8 \\\n  2>/dev/null)\n{\n  echo 'cb_markdown<<CB_EOF'\n  echo \"$CB_BLOCK\"\
        \n  echo 'CB_EOF'\n} >> \"$GITHUB_OUTPUT\"\n"
    - name: Generate summary
      env:
        CB_PATTERNS: ${{ steps.cb_patterns.outputs.cb_markdown || '' }}
      run: "echo \"## \U0001F9E0 Cognitive Analysis & Learning Summary\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Mode:** ${{ inputs.mode || 'scheduled'\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"**Aftermath Evaluator:** ${{ needs.aftermath_evaluator.result\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"**Pattern Feeding:** ${{ needs.feed_patterns.result\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\necho \"\
        ### Execution Details\" >> $GITHUB_STEP_SUMMARY\necho \"- Evaluation Mode:\
        \ ${{ inputs.evaluation_mode || 'full' }}\" >> $GITHUB_STEP_SUMMARY\necho\
        \ \"- Analysis Period: ${{ inputs.days_back || '30' }} days\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')\" >> $GITHUB_STEP_SUMMARY\n\
        # Append CB patterns block when available (IMP-013)\nif [ -n \"$CB_PATTERNS\"\
        \ ]; then\n  echo \"\" >> $GITHUB_STEP_SUMMARY\n  echo \"---\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"\" >> $GITHUB_STEP_SUMMARY\n  echo \"$CB_PATTERNS\" >> $GITHUB_STEP_SUMMARY\n\
        fi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
