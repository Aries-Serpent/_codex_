name: Cognitive Analysis & Learning (Unified)

on:
  # Daily pattern feeding at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # After action execution completes
  workflow_run:
    workflows: ["Cognitive Action Executor", "Cognitive Action & Decision (Unified)", "Workflow Health Check"]
    types: [completed]

  # Manual trigger with full control
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - aftermath-only
          - pattern-feed-only
          - full-analysis
        default: 'full-analysis'
      evaluation_mode:
        description: 'Evaluation depth (for aftermath)'
        required: false
        type: choice
        options:
          - quick
          - full
          - deep
        default: 'full'
      days_back:
        description: 'Days of history to analyze (for pattern feeding)'
        required: false
        default: '30'
        type: choice
        options:
          - '7'
          - '14'
          - '30'
          - '60'
          - '90'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

# GROUNDED: Concurrency control prevents duplicate queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  aftermath_evaluator:
    name: Evaluate Outcomes and Learn
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Cognitive Action Executor') ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'aftermath-only' || inputs.mode == 'full-analysis'))
    outputs:
      evaluation_complete: ${{ steps.evaluate.outputs.complete }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: "🔀 Resolve push target (chain: sub-PR → 0D_base_ → main)"
        id: resolve-target
        uses: ./.github/actions/resolve-push-target

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow cognitive-analysis-feed 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Install dependencies
        run: |
          pip install numpy scipy pyyaml

      - name: Run aftermath evaluation
        id: evaluate
        env:
          EVALUATION_MODE: ${{ inputs.evaluation_mode || 'full' }}
        run: |
          if [ -f "scripts/cognitive/aftermath_evaluator.py" ]; then
            python scripts/cognitive/aftermath_evaluator.py \
              --mode "$EVALUATION_MODE"
            echo "complete=true" >> $GITHUB_OUTPUT
          else
            echo "Aftermath evaluator script not found"
            echo "complete=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit learning updates
        if: steps.evaluate.outputs.complete == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [[ -n $(git status --porcelain cognitive/) ]]; then
            # Walk the staging chain: sub-PR → 0D_base_ → main  (resolved above)
            _TARGET="${{ steps.resolve-target.outputs.branch }}"
            echo "🔀 Push target: $_TARGET (reason: ${{ steps.resolve-target.outputs.reason }})"
            cp -r cognitive/ /tmp/_cognitive_sync_
            git fetch origin "$_TARGET" --depth=1
            git checkout -fB _autogen_sync_ origin/"$_TARGET"  # S237: force-checkout (files already in /tmp)
            cp -r /tmp/_cognitive_sync_/. cognitive/
            git add cognitive/
            git commit -m "🧠 Update cognitive learning from aftermath evaluation [automated]

            - Evaluation mode: ${{ inputs.evaluation_mode || 'full' }}
            - Triggered by: ${{ github.event_name }}
            - Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            git pull --rebase --autostash origin "$_TARGET" || git pull --ff-only origin "$_TARGET"
            git push origin HEAD:"$_TARGET"
            echo "✅ Learning updates committed to $_TARGET"
          else
            echo "ℹ️  No learning updates to commit"
          fi

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: aftermath-evaluation-${{ github.run_number }}
          path: |
            cognitive/evaluations/*.json
            cognitive/learning/*.json
          if-no-files-found: ignore
          retention-days: 30

  feed_patterns:
    name: Extract & Feed Patterns
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Workflow Health Check') ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'pattern-feed-only' || inputs.mode == 'full-analysis'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: "🔀 Resolve push target (chain: sub-PR → 0D_base_ → main)"
        id: resolve-target
        uses: ./.github/actions/resolve-push-target

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scipy pyyaml

      - name: Extract workflow patterns
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          DAYS_BACK: ${{ inputs.days_back || '30' }}
        run: |
          if [ -f "scripts/cognitive/extract_workflow_patterns.py" ]; then
            python scripts/cognitive/extract_workflow_patterns.py \
              --days-back "$DAYS_BACK" \
              --repo ${{ github.repository }}
          else
            echo "Pattern extraction script not found"
            exit 0
          fi

      - name: Commit cognitive brain updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [[ -n $(git status --porcelain .codex/cognitive_brain/workflow_patterns.jsonl .codex/cognitive_brain/metadata.json) ]]; then
            # Walk the staging chain: sub-PR → 0D_base_ → main  (resolved above)
            # Route both workflow_patterns.jsonl and metadata.json so that
            # forward-sync-autogen.yml acts only as a safety-net (not primary path).
            _TARGET="${{ steps.resolve-target.outputs.branch }}"
            echo "🔀 Push target: $_TARGET (reason: ${{ steps.resolve-target.outputs.reason }})"
            cp .codex/cognitive_brain/workflow_patterns.jsonl /tmp/_patterns_sync_
            cp .codex/cognitive_brain/metadata.json          /tmp/_metadata_sync_
            git fetch origin "$_TARGET" --depth=1
            git checkout -fB _autogen_sync_ origin/"$_TARGET"  # S237: force-checkout (files already in /tmp)
            cp /tmp/_patterns_sync_ .codex/cognitive_brain/workflow_patterns.jsonl
            cp /tmp/_metadata_sync_ .codex/cognitive_brain/metadata.json
            git add .codex/cognitive_brain/workflow_patterns.jsonl \
                    .codex/cognitive_brain/metadata.json
            git commit -m "🧠 Update cognitive brain patterns [automated]

            - Analysis period: ${{ inputs.days_back || '30' }} days
            - Triggered by: ${{ github.event_name }}
            - Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            git pull --rebase --autostash origin "$_TARGET" || git pull --ff-only origin "$_TARGET"
            git push origin HEAD:"$_TARGET"
            echo "✅ Cognitive brain updated on $_TARGET"
          else
            echo "ℹ️  No changes to cognitive brain"
          fi

      - name: Upload pattern artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cognitive-patterns-${{ github.run_number }}
          path: |
            .codex/cognitive_brain/patterns/*.json
            .codex/cognitive_brain/analysis/*.json
          if-no-files-found: ignore
          retention-days: 60

  generate_summary:
    name: Generate Analysis Summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [aftermath_evaluator, feed_patterns]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Install dependencies
        run: pip install pyyaml

      # ── IMP-013: Inject CB patterns into step summary ──────────────────
      # retrieve-patterns surfaces the top-N pattern entries from the
      # cognitive brain so that any Copilot session that reads this
      # workflow's summary immediately has fresh context injected.
      - name: Retrieve CB patterns for summary (IMP-013)
        id: cb_patterns
        continue-on-error: true  # fail-open — never blocks summary
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
        run: |
          CB_BLOCK=$(python -m codex.github.mcp_poster retrieve-patterns --limit 8 \
            2>/dev/null)
          {
            echo 'cb_markdown<<CB_EOF'
            echo "$CB_BLOCK"
            echo 'CB_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate summary
        env:
          CB_PATTERNS: ${{ steps.cb_patterns.outputs.cb_markdown || '' }}
        run: |
          echo "## 🧠 Cognitive Analysis & Learning Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.mode || 'scheduled' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Aftermath Evaluator:** ${{ needs.aftermath_evaluator.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pattern Feeding:** ${{ needs.feed_patterns.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Execution Details" >> $GITHUB_STEP_SUMMARY
          echo "- Evaluation Mode: ${{ inputs.evaluation_mode || 'full' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis Period: ${{ inputs.days_back || '30' }} days" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          # Append CB patterns block when available (IMP-013)
          if [ -n "$CB_PATTERNS" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$CB_PATTERNS" >> $GITHUB_STEP_SUMMARY
          fi
