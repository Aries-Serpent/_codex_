name: OAuth App Management & Sync

on:
  schedule:
    - cron: '0 10 * * 0'  # Weekly on Sunday at 10 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-oauth-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install PyGithub requests

      - name: Validate OAuth apps
        id: validate
        run: |
          python scripts/github_oauth_app_sync.py --validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}

      - name: Sync OAuth configuration
        run: |
          python scripts/github_oauth_app_sync.py --sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}

      - name: Check app health
        id: health
        run: |
          python scripts/github_oauth_app_sync.py --health-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sync report
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const healthData = JSON.parse(fs.readFileSync('oauth_health_check.json', 'utf8'));

            let status = '✅';
            if (healthData.errors > 0) status = '❌';
            else if (healthData.warnings > 0) status = '⚠️';

            const body = `## ${status} OAuth App Sync Report

            **Date**: ${new Date().toISOString().split('T')[0]}
            **Status**: ${healthData.status}

            ### Metrics
            - **Apps Synced**: ${healthData.apps_synced}
            - **Configurations Updated**: ${healthData.configs_updated}
            - **Errors**: ${healthData.errors}
            - **Warnings**: ${healthData.warnings}

            ### OAuth Apps Status
            ${healthData.apps.map(app => `- ${app.name}: ${app.status}`).join('\n')}

            ### Next Actions
            ${healthData.next_actions.map(action => `- ${action}`).join('\n')}

            ---
            *Automated by auth-oauth-app-sync workflow*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Report] OAuth App Sync - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['security', 'oauth', 'report']
            });
