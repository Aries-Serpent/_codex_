name: Integration Gated

# Template gated workflow to run live integration tests only when enabled.
# To enable, set ENABLE_LIVE_TESTS=true and configure required secrets (in repo settings).
on:
  workflow_dispatch:
    inputs:
      enable:
        description: 'Enable live integration tests'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

jobs:
  gate-checks:
    name: Gate Checks
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check integration gates
        id: gate
        env:
          ENABLE_LIVE_TESTS: ${{ secrets.ENABLE_LIVE_TESTS }}
        run: |
          PROCEED="false"
          # Gate 1: Check if explicitly enabled via input
          if [[ "${{ github.event.inputs.enable }}" == "true" ]]; then
            PROCEED="true"
            echo "Integration tests enabled via workflow input"
          fi
          # Gate 2: Check if enabled via secret (ENABLE_LIVE_TESTS)
          if [[ "${ENABLE_LIVE_TESTS}" == "true" ]]; then
            PROCEED="true"
            echo "Integration tests enabled via ENABLE_LIVE_TESTS secret"
          fi
          echo "proceed=$PROCEED" >> $GITHUB_OUTPUT
          echo "Integration gate check complete: proceed=$PROCEED"

  integration:
    name: Run Integration Tests
    needs: gate-checks
    if: needs.gate-checks.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          pip install -e .
          if [ $? -ne 0 ]; then
            echo "⚠️ Package install with editable mode failed, trying regular install..."
            pip install .
          fi
          
      - name: Run integration tests (live)
        env:
          ENABLE_LIVE_TESTS: ${{ secrets.ENABLE_LIVE_TESTS }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e  # Don't exit on error
          pytest tests/integration -q --timeout=300
          INTEGRATION_STATUS=$?
          
          if [ $INTEGRATION_STATUS -eq 0 ]; then
            echo "✅ Integration tests passed"
          else
            echo "⚠️ Integration tests failed with code $INTEGRATION_STATUS"
          fi
          
          exit $INTEGRATION_STATUS
