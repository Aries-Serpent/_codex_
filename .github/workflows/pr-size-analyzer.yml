name: PR Size Analyzer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    outputs:
      pr_size:
        description: 'PR size category (small, medium, large, refactor)'
        value: ${{ jobs.analyze-size.outputs.pr_size }}
      changed_files_count:
        description: 'Number of changed files'
        value: ${{ jobs.analyze-size.outputs.changed_files_count }}
      validation_strategy:
        description: 'Recommended validation strategy'
        value: ${{ jobs.analyze-size.outputs.validation_strategy }}


concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  analyze-size:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_size: ${{ steps.analyze.outputs.pr_size }}
      changed_files_count: ${{ steps.analyze.outputs.changed_files_count }}
      validation_strategy: ${{ steps.analyze.outputs.validation_strategy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Analyze PR Size
        id: analyze
        run: |
          # Count changed files between base and head
          # Support both direct PR trigger and workflow_call
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            # When called via workflow_call, fetch base from event
            BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          fi
          HEAD_SHA="${{ github.sha }}"

          echo "Comparing $BASE_SHA...$HEAD_SHA"

          # Ensure we have the base ref
          git fetch origin "$BASE_SHA" 2>/dev/null || true

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null | wc -l)

          # If git diff failed, try alternative method
          if [ "$CHANGED_FILES" -eq 0 ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | wc -l)
          fi

          echo "changed_files_count=$CHANGED_FILES" >> $GITHUB_OUTPUT

          # Determine size tier and validation strategy
          if [ "$CHANGED_FILES" -lt 20 ]; then
            echo "pr_size=small" >> $GITHUB_OUTPUT
            echo "validation_strategy=full_validation" >> $GITHUB_OUTPUT
          elif [ "$CHANGED_FILES" -lt 100 ]; then
            echo "pr_size=medium" >> $GITHUB_OUTPUT
            echo "validation_strategy=targeted_tests" >> $GITHUB_OUTPUT
          elif [ "$CHANGED_FILES" -lt 500 ]; then
            echo "pr_size=large" >> $GITHUB_OUTPUT
            echo "validation_strategy=smoke_tests" >> $GITHUB_OUTPUT
          else
            echo "pr_size=refactor" >> $GITHUB_OUTPUT
            echo "validation_strategy=import_validation" >> $GITHUB_OUTPUT
          fi

      - name: Report PR Size
        run: |
          echo "### PR Size Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR Size:** ${{ steps.analyze.outputs.pr_size }}" >> $GITHUB_STEP_SUMMARY
          echo "**Changed Files:** ${{ steps.analyze.outputs.changed_files_count }}" >> $GITHUB_STEP_SUMMARY
          echo "**Validation Strategy:** ${{ steps.analyze.outputs.validation_strategy }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Also output to job log
          echo "================================"
          echo "PR Size: ${{ steps.analyze.outputs.pr_size }}"
          echo "Changed Files: ${{ steps.analyze.outputs.changed_files_count }}"
          echo "Strategy: ${{ steps.analyze.outputs.validation_strategy }}"
          echo "================================"

      - name: Post to PR Status Dashboard
        # Only post when triggered directly by PR, not via workflow_call
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-pr-summary
        with:
          workflow-name: 'PR Size Analysis'
          status: 'info'
          summary: '${{ steps.analyze.outputs.pr_size }} PR — ${{ steps.analyze.outputs.changed_files_count }} files — strategy: ${{ steps.analyze.outputs.validation_strategy }}'
          details: |
            | Field | Value |
            |-------|-------|
            | Size Category | `${{ steps.analyze.outputs.pr_size }}` (${{ steps.analyze.outputs.changed_files_count }} files) |
            | Validation Strategy | ${{ steps.analyze.outputs.validation_strategy }} |

            **Size Thresholds:** Small (<20) → Full validation · Medium (20-99) → Targeted · Large (100-499) → Smoke · Refactor (500+) → Import only

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: analyze-size
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "PR Size Analyzer"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: pr-size-analyzer.yml → rescue-comment job (S227)_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
