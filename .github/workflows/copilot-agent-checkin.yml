          // the same rescue ID \u2014 even when GitHub silently dropped the queued\
          \ session\n// after a new commit was pushed. Now we let hasResponse and\
          \ the\n// Copilot-acted-after-retrigger check handle deduplication correctly.\n\
          let latestRescue = null;\nfor (const c of comments) {\n  const body = c.body\
          \ || '';\n  if (rescueMarkerRe.test(body)) {\n    // Extract rescue ID from\
          \ PR-scoped, SHA-scoped, or -sha-suffixed marker.\n    const markerMatch\
          \ = body.match(/<!--\\s*ci-rescue(?:-sha)?:(\\d+(?::[0-9a-f]+)?)\\s*-->/);\n\
          \    const rescueId = markerMatch ? markerMatch[1] : String(c.databaseId);\n\
          \    // Always update latestRescue \u2014 we want the LAST rescue comment\
          \ in the list.\n    latestRescue = { id: rescueId, commentId: c.databaseId,\
          \ url: c.url || '', createdAt: c.createdAt || null, body };\n  }\n}\n\n\
          if (!latestRescue) {\n  core.info('No rescue comments found \u2014 missed-trigger\
