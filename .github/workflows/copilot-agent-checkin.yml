    - name: "Missed-trigger guard \u2014 re-trigger unanswered rescue comments"
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        GH_DISCUSSION_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          || secrets.GITHUB_TOKEN }}
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        SCAN_TABLE: ${{ env.SCAN_TABLE }}
        BLOCKING_COUNT: ${{ env.BLOCKING_COUNT || '0' }}
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          secrets.GITHUB_TOKEN }}
        script: "// Missed-trigger guard (S221 AfterMath fix):\n// When Copilot reacts\
          \ \U0001F440 to a rescue comment but no session starts\n// (e.g., a push\
          \ invalidates the queued session before it can begin),\n// session-done\
          \ PATH A never fires. This step fires on every push and\n// independently\
          \ scans for unanswered rescue comments.\nconst dryRun = (process.env.DRY_RUN\
          \ || 'false') === 'true';\n\n// S144 fix: If this push was made by a Copilot\
          \ agent bot, the session\n// is actively running. The session will post\
          \ \"Resolved at SHA\" when it\n// finishes. Firing a retrigger mid-session\
          \ creates competing sessions.\n// Human approval is pre-granted via COPILOT_AGENT_AUTH_ENABLED=true\
          \ and\n// \U0001F4B0 Cost Proposal Approved \u2014 sessions start immediately,\
          \ no gate needed.\nconst COPILOT_PUSH_ACTORS = new Set([\n  'copilot-swe-agent[bot]',\
          \ 'github-copilot[bot]', 'copilot[bot]',\n]);\nif (COPILOT_PUSH_ACTORS.has(context.actor))\
          \ {\n  core.info(`Push actor is Copilot agent (${context.actor}) \u2014\
          \ session is active. Skipping missed-trigger guard to avoid competing retriggers.\
          \ Pre-approval: COPILOT_AGENT_AUTH_ENABLED=true.`);\n  return;\n}\n\n//\
          \ Find the open PR for this branch\nlet prNumber = parseInt(process.env.PR_NUMBER\
          \ || '0', 10);\nif (!prNumber) {\n  try {\n    const branchName = context.ref_name\n\
          \        || (context.payload.ref || '').replace('refs/heads/', '')\n   \
          \     || '';\n    const prs = await github.rest.pulls.list({\n      owner:\
          \ context.repo.owner,\n      repo: context.repo.repo,\n      state: 'open',\n\
          \      head: `${context.repo.owner}:${branchName}`,\n      per_page: 1,\n\
          \    });\n    prNumber = prs.data[0]?.number || 0;\n  } catch(e) {\n   \
          \ core.info(`Could not find open PR: ${e.message}`);\n    return;\n  }\n\
          }\nif (!prNumber) {\n  core.info('No open PR found for this push \u2014\
          \ skipping missed-trigger guard.');\n  return;\n}\n\n// S226 fix: use GraphQL\
          \ `last: 100` to get the NEWEST 100 comments.\n// The prior REST issues.listComments(per_page:\
          \ 30) returned the OLDEST\n// 30 comments (ascending order), causing dedup\
          \ to miss retrigger markers\n// and Copilot \"Fixed in\" responses that\
          \ accumulated in newer comments.\n// This caused the guard to re-post the\
          \ same retrigger on every push.\nlet comments = [];\ntry {\n  const gql\
          \ = await github.graphql(\n    `query($owner: String!, $repo: String!, $pr:\
          \ Int!) {\n      repository(owner: $owner, name: $repo) {\n        pullRequest(number:\
          \ $pr) {\n          comments(last: 100) {\n            nodes {\n       \
          \       databaseId\n              createdAt\n              url\n       \
          \       body\n              author { login }\n            }\n          }\n\
          \        }\n      }\n    }`,\n    {\n      owner: context.repo.owner,\n\
          \      repo:  context.repo.repo,\n      pr:    prNumber,\n    }\n  );\n\
          \  comments = gql?.repository?.pullRequest?.comments?.nodes || [];\n} catch(e)\
          \ {\n  core.info(`Could not fetch PR comments: ${e.message}`);\n  return;\n\
          }\n\n// Find unanswered rescue comments.\n// Unified marker format (S294):\
          \ <!-- ci-rescue-sha:{pr_number}:{sha12} -->\n//   All workflows now use\
          \ this single canonical format.\n//   Posted by scripts/ci/post_rescue_comment.py\
          \ \u2014 called by every\n//   rescue-comment job via actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608\
          \ + python step.\n//   SHA-scoped: multiple workflows failing on the same\
          \ commit APPEND\n//   to the same comment rather than posting new threads.\n\
          //\n// Legacy formats (still recognised for backward compat with older comments):\n\
          //   <!-- ci-rescue:NNN -->              (pre-S294 PR-scoped)\n//   <!--\
          \ ci-rescue:NNN:sha12chars -->    (pre-S294 SHA-scoped)\n//\n// An \"answered\"\
          \ rescue comment already has:\n//   (a) a <!-- session-done-retrigger -->\
          \ dedup marker for its rescue ID, OR\n//   (b) a Copilot agent reply containing\
          \ resolution language after it.\n// Matches unified and all legacy formats:\n\
          //   <!-- ci-rescue-sha:3854:abc123def456 --> (S294 canonical \u2014 validate.yml\
          \ et al)\n//   <!-- ci-rescue:3854 -->                  (legacy PR-scoped)\n\
          //   <!-- ci-rescue:3854:abc123def456 -->      (legacy SHA-scoped)\nconst\
          \ rescueMarkerRe   = /<!--\\s*ci-rescue(?:-sha)?:\\d+(?::[0-9a-f]+)?\\s*-->/;\n\
          const retriggerMarkerRe = /<!--\\s*session-done-retrigger\\s*-->/;\n// Only\
