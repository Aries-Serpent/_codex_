          \ \u2014 no additional retrigger is needed.\n// Allow a retrigger only if\
          \ the RCA is older than 45 minutes AND still has\n// no Copilot response\
          \ (session was permanently dropped by GitHub).\nconst rcaHasCopilotCall\
          \ = /@copilot(?:\\+[a-z0-9.\\-]+)?/i.test(latestRescue.body);\nif (rcaHasCopilotCall)\
          \ {\n  // createdAt is now populated by the GraphQL query (was missing before\
          \ this fix,\n  // so ageMs was always Infinity and the grace period never\
          \ triggered).\n  const createdAt = latestRescue.createdAt ? new Date(latestRescue.createdAt)\
          \ : null;\n  const ageMs = createdAt ? Date.now() - createdAt.getTime()\
          \ : Infinity;\n  const GRACE_MS = 45 * 60 * 1000; // 45 minutes\n  if (ageMs\
          \ < GRACE_MS) {\n    core.info(\n      `Latest rescue comment already invokes\
          \ @copilot directly and is only ` +\n      `${Math.round(ageMs / 60000)}\
          \ min old \u2014 deferring retrigger (RCA is still live).`\n    );\n   \
          \ return;\n  }\n  core.info(\n    `Latest rescue comment invokes @copilot\
          \ but is ${Math.round(ageMs / 60000)} min old ` +\n    `(>${Math.round(GRACE_MS\
          \ / 60000)} min grace period) \u2014 checking if session responded.`\n \
          \ );\n}\n\n// Check if there is a Copilot agent response AFTER the rescue\
          \ comment that\n// explicitly resolves it. Accept both \"X in SHA\" and\
          \ \"X at SHA\" forms since\n// Copilot responses vary between \"Fixed in\
          \ <commit>\" and \"Fixed at <commit>\".\n// Using COPILOT_AGENT_LOGINS avoids\
          \ false-positives from github-actions[bot]\n// CI update comments that are\
          \ not resolution responses.\nconst rescueIndex = comments.findIndex(c =>\
          \ c.databaseId === latestRescue.commentId);\nconst hasResponse = rescueIndex\
          \ >= 0 && comments.slice(rescueIndex + 1).some(c => {\n  const login = c.author?.login\
          \ || '';\n  const body  = (c.body || '').toLowerCase();\n  return (\n  \
          \  COPILOT_AGENT_LOGINS.has(login) &&\n    (\n      body.includes('fixed\
          \ in')    || body.includes('fixed at')    ||\n      body.includes('addressed\
          \ in') || body.includes('addressed at') ||\n      body.includes('resolved\
          \ in')  || body.includes('resolved at')\n    )\n  );\n});\n\nif (hasResponse)\
          \ {\n  core.info(`Rescue comment ${latestRescue.id} already has a Copilot\
          \ resolution response \u2014 skipping.`);\n  return;\n}\n\n// S221-R1: Commit-resolution\
          \ check.\n// If a Copilot-agent commit was pushed to this PR branch AFTER\
          \ the rescue\n// comment was created, a session ran and addressed the issue.\
          \  Skip the\n// retrigger to avoid waking a new session for an already-resolved\
          \ problem.\n// This closes the gap where Copilot pushes a fix commit but\
          \ the closing\n// comment uses language not covered by the \"fixed in/at\"\
          \ regex above.\nif (latestRescue.createdAt) {\n  let prCommits = [];\n \
          \ try {\n    const commitsResp = await github.rest.pulls.listCommits({\n\
          \      owner: context.repo.owner,\n      repo:  context.repo.repo,\n   \
          \   pull_number: prNumber,\n      per_page: 30,\n    });\n    prCommits\
          \ = commitsResp.data || [];\n  } catch(e) {\n    core.info(`Could not fetch\
          \ PR commits for commit-resolution check: ${e.message}`);\n  }\n  const\
          \ rescueCreatedAt = new Date(latestRescue.createdAt);\n  const resolvedByCommit\
          \ = prCommits.some(c => {\n    // Check both the GitHub author login and\
          \ the git committer date.\n    const authorLogin    = c.author?.login  \
          \  || '';\n    const committerLogin = c.committer?.login || '';\n    const\
          \ committedAt    = c.commit?.committer?.date\n      ? new Date(c.commit.committer.date)\
          \ : null;\n    return (\n      (COPILOT_AGENT_LOGINS.has(authorLogin) ||\
          \ COPILOT_AGENT_LOGINS.has(committerLogin)) &&\n      committedAt !== null\
          \ &&\n      committedAt > rescueCreatedAt\n    );\n  });\n  if (resolvedByCommit)\
          \ {\n    core.info(\n      `Rescue ${latestRescue.id}: a Copilot-agent commit\
          \ was pushed after ` +\n      `${latestRescue.createdAt} \u2014 treating\
          \ as resolved, skipping retrigger.`\n    );\n    return;\n  }\n}\n\n// Dedup:\
          \ if a retrigger was already posted for this rescue, only skip posting\n\
          // ANOTHER retrigger if Copilot has taken some action (posted any comment)\
          \ after\n// that retrigger. If Copilot has NOT acted after the retrigger,\
          \ the queued\n// session was silently dropped (e.g. a new commit push invalidated\
          \ it), so we\n// allow a re-fire. This prevents the \"permanently blocked\"\
          \ bug where a single\n// retrigger post caused the guard to never fire again\
          \ for the same rescue.\nconst commentsAfterRescue = rescueIndex >= 0 ? comments.slice(rescueIndex\
          \ + 1) : [];\nconst retriggersForRescue = commentsAfterRescue.filter(c =>\
          \ {\n  const body = c.body || '';\n  return retriggerMarkerRe.test(body)\
          \ && body.includes(`rescue \\`${latestRescue.id}\\``);\n});\n\nif (retriggersForRescue.length\
          \ > 0) {\n  const lastRetrigger = retriggersForRescue[retriggersForRescue.length\
          \ - 1];\n  const lastRetriggerDbId = lastRetrigger.databaseId;\n  const\
          \ lastRetriggerIndex = comments.findIndex(c => c.databaseId === lastRetriggerDbId);\n\
          \  // Check if any Copilot agent comment appeared AFTER the last retrigger.\n\
          \  // If yes, Copilot is actively handling it \u2014 don't spam another\
          \ retrigger.\n  const copilotActedAfterRetrigger = lastRetriggerIndex >=\
          \ 0 &&\n    comments.slice(lastRetriggerIndex + 1).some(c =>\n      COPILOT_AGENT_LOGINS.has(c.author?.login\
          \ || '')\n    );\n  if (copilotActedAfterRetrigger) {\n    core.info(`Retrigger\
          \ already posted for rescue ${latestRescue.id} and Copilot has acted since\
          \ \u2014 not re-triggering.`);\n    return;\n  }\n  // S144 fix: Safety\
          \ cap \u2014 if \u22653 retriggers already posted for this rescue ID,\n\
          \  // halt to prevent infinite loops. The pre-approval (COPILOT_AGENT_AUTH_ENABLED=true,\n\
          \  // \U0001F4B0 Cost Proposal Approved) is in effect; operator review needed\
          \ if sessions\n  // are still not starting after 3 retriggers.\n  if (retriggersForRescue.length\
          \ >= 3) {\n    core.warning(`Safety cap: ${retriggersForRescue.length} retriggers\
          \ already posted for rescue ${latestRescue.id} \u2014 halting. Pre-approval\
          \ is active; operator review needed if sessions are not starting.`);\n \
          \   return;\n  }\n  // No Copilot action after the retrigger \u2014 session\
          \ was silently dropped.\n  core.info(`Previous retrigger for rescue ${latestRescue.id}\
          \ had no Copilot action \u2014 re-firing (session was dropped).`);\n}\n\n\
          // Post re-trigger comment \u2014 dynamic format: link + quote, not static\
          \ boilerplate.\n// Rationale: the rescue comment already contains all the\
          \ relevant details (which\n// workflow failed, run ID, steps to resolve).\
          \ Repeating them statically here\n// causes information drift if the rescue\
          \ comment is later updated (upsert model).\n// Instead: extract a compact\
          \ preview of the rescue body, build the URL from the\n// databaseId, and\
          \ bump Copilot with a direct link rather than a duplication.\n\n// Build\
          \ a URL for the rescue comment (GitHub format: /pull/{pr}#issuecomment-{id})\n\
          const rescueUrl = latestRescue.url ||\n  `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}#issuecomment-${latestRescue.commentId}`;\n\
          \n// Build a short preview of the rescue body (skip HTML comment markers,\
          \ take first\n// non-empty lines, limit to ~600 chars so the bump stays\
          \ concise).\nconst rescuePreviewLines = (latestRescue.body || '')\n  .split('\\\
          n')\n  .filter(l => !l.trim().startsWith('<!--') && l.trim().length > 0)\n\
          \  .slice(0, 8)\n  .join('\\n');\nconst rescuePreview = rescuePreviewLines.length\
          \ > 600\n  ? rescuePreviewLines.slice(0, 597) + '\u2026'\n  : rescuePreviewLines;\n\
          const quotedPreview = rescuePreview.split('\\n').map(l => `> ${l}`).join('\\\
          n');\n\n// Age of rescue comment (createdAt now populated by GraphQL query)\n\
          // Display as \"Xd Yh ago\" for ages >= 24h, \"Xh Ym ago\" for >= 60 min,\
          \ \"X min ago\" for shorter.\nfunction formatAge(ms) {\n  const totalMin\
          \ = Math.round(ms / 60000);\n  if (totalMin < 60) return `${totalMin} min\
          \ ago`;\n  const h = Math.floor(totalMin / 60);\n  if (h < 24) {\n    const\
          \ m = totalMin % 60;\n    return m > 0 ? `${h}h ${m}m ago` : `${h}h ago`;\n\
          \  }\n  const d = Math.floor(h / 24);\n  const rem = h % 24;\n  return rem\
          \ > 0 ? `${d}d ${rem}h ago` : `${d}d ago`;\n}\nconst rescueAge = latestRescue.createdAt\n\
          \  ? formatAge(Date.now() - new Date(latestRescue.createdAt).getTime())\n\
          \  : 'unknown age';\n\n// Scan table from the preceding scan-failing step\
          \ (may be empty if scan unavailable)\nconst scanTable = (process.env.SCAN_TABLE\
          \ || '').trim();\n// S300: include blocking-comments count in retrigger\
          \ for agent context\nconst blockingCountS221 = parseInt(process.env.BLOCKING_COUNT\
          \ || '0', 10);\nconst blockingNote = blockingCountS221 > 0\n  ? `\u26A0\uFE0F\
