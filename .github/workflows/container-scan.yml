name: Container Security Scan
true:
  pull_request:
    paths:
    - .config/Dockerfile*
    - docker/**
  push:
    paths:
    - .config/Dockerfile*
    - docker/**
  schedule:
  - cron: 0 5 * * 1
  workflow_dispatch: null
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
permissions:
  contents: read
  security-events: write
jobs:
  trivy-scan:
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    name: Trivy Scan — ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    steps:
    - name: Configure secret masking
      run: |
        echo "::add-mask::${{ secrets.CODEX_MASTER_KEY }}"
        echo "::add-mask::${{ secrets.CODEX_BACKUP_KEY }}"
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Build image for scanning
      run: 'docker build -f ${{ matrix.dockerfile }} -t codex-scan:${{ strategy.job-index
        }} . || true

        '
    - name: Run Trivy filesystem scan (fallback if build unavailable)
      uses: aquasecurity/trivy-action@0.35.0
      with:
        exit-code: '0'
        format: sarif
        output: trivy-results-${{ strategy.job-index }}.sarif
        scan-ref: .
        scan-type: fs
        severity: CRITICAL,HIGH
    - if: always()
      name: Upload SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results-${{ strategy.job-index }}.sarif
    - if: always()
      name: Upload scan artifact
      uses: actions/upload-artifact@v5
      with:
        name: trivy-scan-${{ github.run_id }}-${{ strategy.job-index }}
        path: trivy-results-${{ strategy.job-index }}.sarif
        retention-days: 30
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
        - .config/Dockerfile
        - docker/Dockerfile.cpu
        - docker/Dockerfile.gpu
    timeout-minutes: 30
