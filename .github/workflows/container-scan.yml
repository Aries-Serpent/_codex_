name: Container Security Scan
on:
  push:
    paths:
    - .config/Dockerfile*
    - docker/**
  pull_request:
    paths:
    - .config/Dockerfile*
    - docker/**
  schedule:
  - cron: 0 5 * * 1
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  trivy-scan:
    name: "Trivy Scan \u2014 ${{ matrix.dockerfile }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
        - .config/Dockerfile
        - docker/Dockerfile.cpu
        - docker/Dockerfile.gpu
    steps:
    - uses: actions/checkout@v5
    - name: Build image for scanning
      run: 'docker build -f ${{ matrix.dockerfile }} -t codex-scan:${{ strategy.job-index
        }} . || true

        '
    - name: Run Trivy filesystem scan (fallback if build unavailable)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results-${{ strategy.job-index }}.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'
    - name: Upload SARIF to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results-${{ strategy.job-index }}.sarif
    - name: Upload scan artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        path: trivy-results-${{ strategy.job-index }}.sarif
        retention-days: 30
        name: trivy-scan-${{ github.run_id }}-${{ strategy.job-index }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
