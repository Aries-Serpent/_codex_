name: unit-tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . || true
          pip install pytest
      
      - name: Run tests (fast defaults)
        env:
          ACCELERATE_TEST: "0"
          RUN_LORA_TESTS: "0"
          RUN_PERF_SMOKE: "0"
        run: |
          pytest -q
      
      - name: Upload junit (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: "**/junit*.xml"
          if-no-files-found: ignore
