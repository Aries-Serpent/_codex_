name: decode-validate-artifact
on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: 'Path to artifact JSON file'
        required: true
      schema_path:
        description: 'Optional: Path to schema JSON file'
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install jsonschema
      - name: Validate artifact
        run: |
          python scripts/space_traversal/decode_validate_and_extract.py \
            --input "${{ github.event.inputs.artifact_path }}" \
            --schema "${{ github.event.inputs.schema_path }}"
