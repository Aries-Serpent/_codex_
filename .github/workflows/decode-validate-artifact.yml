name: decode-validate-artifact
on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: 'Path to artifact JSON file'
        required: true
      schema_path:
        description: 'Optional: Path to schema JSON file'
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'ephemeral'
