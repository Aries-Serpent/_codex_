name: decode-validate-artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/space_traversal/**'
      - 'tests/fixtures/pasted.txt'
      - '.github/workflows/decode-validate-artifact.yml'
      - 'requirements-dev.txt'

jobs:
  validate-phase-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Decode artifact
        run: |
          PYTHONPATH="${PYTHONPATH}:$(pwd)" python scripts/space_traversal/decode_validate_and_extract.py --stable-output --generate-baseline
      - name: Run focused tests
        run: |
          pytest tests/space_traversal/test_artifact_pipeline.py -q
