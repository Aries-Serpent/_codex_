name: Post-Merge Validation (Optimized)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Optimized with caching and parallelization
# Target runtime: ≤ 10 minutes


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate-imports:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # v6.0.3

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.12.13
          cache-tier: 'live'

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow post-merge-validation-optimized 2>/dev/null || echo "Cache health: check skipped"
