name: Workflow Validator

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main, 0D_base_]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-workflows:
    name: Validate Workflow Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml==6.0.* jsonschema==4.23.*

      - name: Validate YAML syntax
        run: |
          echo "Validating YAML syntax for all workflows..."
          EXIT_CODE=0
          
          for file in .github/workflows/*.yml; do
            # Skip disabled workflows
            if [[ "$file" == *.disabled ]]; then
              echo "⏭️  Skipping disabled: $file"
              continue
            fi
            
            echo "Checking: $file"
            if python -c "import yaml; yaml.safe_load(open('$file'))" 2>/dev/null; then
              echo "✅ Valid YAML: $file"
            else
              echo "❌ Invalid YAML: $file"
              EXIT_CODE=1
            fi
          done
          
          exit $EXIT_CODE

      - name: Validate workflow structure
        run: |
          python << 'EOF'
          import yaml
          import sys
          from pathlib import Path
          
          errors = []
          warnings = []
          
          workflow_dir = Path('.github/workflows')
          workflow_files = [f for f in workflow_dir.glob('*.yml') if not f.name.endswith('.disabled')]
          
          print(f"Validating {len(workflow_files)} active workflows...\n")
          
          for workflow_file in workflow_files:
              with open(workflow_file) as f:
                  try:
                      workflow = yaml.safe_load(f)
                  except Exception as e:
                      errors.append(f"{workflow_file.name}: YAML parse error: {e}")
                      continue
              
              # Check required top-level keys
              if 'name' not in workflow:
                  errors.append(f"{workflow_file.name}: Missing 'name' field")
              
              if 'on' not in workflow:
                  errors.append(f"{workflow_file.name}: Missing 'on' (triggers) field")
              
              if 'jobs' not in workflow:
                  errors.append(f"{workflow_file.name}: Missing 'jobs' field")
              
              # Check jobs structure
              if 'jobs' in workflow:
                  jobs = workflow.get('jobs', {})
                  if not jobs:
                      warnings.append(f"{workflow_file.name}: No jobs defined")
                  
                  for job_name, job_config in jobs.items():
                      if not isinstance(job_config, dict):
                          errors.append(f"{workflow_file.name}: Job '{job_name}' is not a dictionary")
                          continue
                      
                      if 'runs-on' not in job_config and 'uses' not in job_config:
                          errors.append(f"{workflow_file.name}: Job '{job_name}' missing 'runs-on' or 'uses'")
                      
                      # Check for steps in non-reusable workflows
                      if 'uses' not in job_config and 'steps' not in job_config:
                          warnings.append(f"{workflow_file.name}: Job '{job_name}' has no steps")
              
              # Check for matrix configurations
              if 'jobs' in workflow:
                  for job_name, job_config in workflow.get('jobs', {}).items():
                      if isinstance(job_config, dict) and 'strategy' in job_config:
                          strategy = job_config['strategy']
                          if 'matrix' in strategy:
                              matrix = strategy['matrix']
                              if not matrix:
                                  warnings.append(f"{workflow_file.name}: Job '{job_name}' has empty matrix")
              
              print(f"✅ Validated: {workflow_file.name}")
          
          # Print summary
          print(f"\n{'='*60}")
          print(f"Validation Summary:")
          print(f"  Files checked: {len(workflow_files)}")
          print(f"  Errors: {len(errors)}")
          print(f"  Warnings: {len(warnings)}")
          print(f"{'='*60}\n")
          
          if errors:
              print("❌ ERRORS:")
              for error in errors:
                  print(f"  - {error}")
              print()
          
          if warnings:
              print("⚠️  WARNINGS:")
              for warning in warnings:
                  print(f"  - {warning}")
              print()
          
          if errors:
              sys.exit(1)
          
          print("✅ All workflows validated successfully!")
          EOF

      - name: Check for common issues
        run: |
          python << 'EOF'
          import yaml
          from pathlib import Path
          
          issues = []
          
          workflow_dir = Path('.github/workflows')
          workflow_files = [f for f in workflow_dir.glob('*.yml') if not f.name.endswith('.disabled')]
          
          for workflow_file in workflow_files:
              with open(workflow_file) as f:
                  try:
                      workflow = yaml.safe_load(f)
                  except:
                      continue
              
              # Check for unpinned actions
              content = open(workflow_file).read()
              if 'uses:' in content:
                  lines = content.split('\n')
                  for i, line in enumerate(lines, 1):
                      if 'uses:' in line and '@' in line:
                          # Check if using branch name instead of SHA/tag
                          if '@main' in line or '@master' in line:
                              issues.append(f"{workflow_file.name}:{i} - Using branch reference (@main/@master) instead of version tag")
              
              # Check for missing timeout-minutes
              if 'jobs' in workflow:
                  for job_name, job_config in workflow.get('jobs', {}).items():
                      if isinstance(job_config, dict):
                          if 'timeout-minutes' not in job_config:
                              # This is a warning, not an error
                              pass  # Don't fail on this
          
          if issues:
              print("⚠️  Potential issues found:")
              for issue in issues:
                  print(f"  - {issue}")
          else:
              print("✅ No common issues detected")
          EOF

      - name: Generate validation report
        if: always()
        run: |
          cat > workflow_validation_report.md << 'EOF'
          # Workflow Validation Report
          
          **Date**: $(date -Iseconds)
          **Branch**: ${{ github.ref_name }}
          **Commit**: ${{ github.sha }}
          
          ## Summary
          
          - Active workflows: $(find .github/workflows -name "*.yml" ! -name "*.disabled" | wc -l)
          - Disabled workflows: $(find .github/workflows -name "*.disabled" | wc -l)
          - Validation status: ${{ job.status }}
          
          ## Validated Workflows
          
          EOF
          
          for file in .github/workflows/*.yml; do
            if [[ "$file" != *.disabled ]]; then
              echo "- ✅ $(basename $file)" >> workflow_validation_report.md
            fi
          done
          
          echo "" >> workflow_validation_report.md
          echo "## Disabled Workflows (Monitoring Period)" >> workflow_validation_report.md
          echo "" >> workflow_validation_report.md
          
          for file in .github/workflows/*.disabled; do
            echo "- ⏸️  $(basename $file)" >> workflow_validation_report.md
          done
          
          cat workflow_validation_report.md

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-validation-report
          path: workflow_validation_report.md
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('workflow_validation_report.md', 'utf8');
            
            const comment = `## 🔍 Workflow Validation Results
            
            ${report}
            
            ---
            *Automated workflow validation by AI Assistant*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
