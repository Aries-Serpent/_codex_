name: "\U0001FA79 Secrets False-Positive Healer"
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - .github/agents/**/*.md
    - docs/**/*.md
    - .codex/docs/**/*.md
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to heal (default: current branch)'
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  heal-secrets-false-positives:
    name: "\U0001FA79 Heal Markdown Secret False-Positives (RP-007)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "github.event_name == 'workflow_dispatch' ||\n(github.event_name == 'pull_request'\
      \ &&\n github.event.pull_request.head.repo.full_name == github.repository)\n"
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout PR branch
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ inputs.branch || github.head_ref || github.event.pull_request.head.ref
          }}
        fetch-depth: 0
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13

    - name: Install detect-secrets
      run: pip install detect-secrets==1.5.0
    - name: "Run Pattern 35 \u2014 Markdown FP Secrets healer"
      id: heal
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: '# Run only Pattern 35 (Markdown FP Secrets) from the auto-fix script

        python scripts/ci/auto_fix_common_issues.py --pattern 35

        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

        '
    - name: Verify no real secrets remain
      id: verify
      run: "set +e\n# Scan .md files changed in the PR by diffing base..HEAD.\n# On\
        \ a clean CI checkout, git diff HEAD / --cached returns nothing, so\n# use\
        \ the PR base SHA (or HEAD~1 as fallback) to get the real diff set.\nBASE_SHA=\"\
        ${{ github.event.pull_request.base.sha }}\"\nif [ -z \"$BASE_SHA\" ]; then\n\
        \  BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo \"\")\nfi\nif [ -n\
        \ \"$BASE_SHA\" ]; then\n  ALL_MDS=$(git diff --name-only --diff-filter=ACM\
        \ \"$BASE_SHA\" HEAD | grep '\\.md$' || true)\nelse\n  ALL_MDS=$(git diff\
        \ HEAD --name-only --diff-filter=ACM | grep '\\.md$' || true)\nfi\n\nif [\
        \ -z \"$ALL_MDS\" ]; then\n  echo \"no_md_files=true\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"\u2705 No changed .md files to verify\"\n  exit 0\nfi\n\n# Run\
        \ detect-secrets-hook on the modified files\nOUTPUT=$(detect-secrets-hook\
        \ --baseline .secrets.baseline $ALL_MDS 2>&1)\nEXIT=$?\necho \"$OUTPUT\"\n\
        echo \"secrets_clean=$( [ $EXIT -eq 0 ] && echo 'true' || echo 'false' )\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Commit and push healed annotations
      if: (steps.verify.outputs.secrets_clean == 'true' || steps.verify.outputs.no_md_files
        == 'true')
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        TARGET_BRANCH: ${{ inputs.branch || github.head_ref || github.event.pull_request.head.ref
          }}
      run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"\
        github-actions[bot]@users.noreply.github.com\"\n\ngit add -A\nif git diff\
        \ --staged --quiet; then\n  echo \"\u2139\uFE0F  No pragma annotations needed\
        \ \u2014 files already clean.\"\nelse\n  TIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\"\
        )\n  git commit -m \"fix(secrets): annotate doc-example false positives [skip\
        \ ci] (RP-007)\"\n  pushed=false\n  for attempt in 1 2 3; do\n    if git push\
        \ origin \"HEAD:${TARGET_BRANCH}\"; then\n      echo \"\u2705 Pragma annotations\
        \ pushed to ${TARGET_BRANCH}\"\n      pushed=true\n      break\n    fi\n \
        \   echo \"\u26A0\uFE0F Push attempt ${attempt} failed; branch may have advanced.\
        \ Rebasing onto origin/${TARGET_BRANCH} and retrying...\"\n    if ! git fetch\
        \ origin \"${TARGET_BRANCH}\"; then\n      echo \"::error title=Fetch failed::Unable\
        \ to fetch origin/${TARGET_BRANCH} before retry.\"\n      exit 1\n    fi\n\
        \    if ! git rebase \"origin/${TARGET_BRANCH}\"; then\n      echo \"::error\
        \ title=Rebase failed::Unable to rebase onto origin/${TARGET_BRANCH}; manual\
        \ conflict resolution is required.\"\n      git rebase --abort || true\n \
        \     exit 1\n    fi\n  done\n  if [ \"$pushed\" = true ]; then\n    exit\
        \ 0\n  fi\n  echo \"::error title=Push failed::Unable to push healed annotations\
        \ after 3 attempts.\"\n  exit 1\nfi\n"
    - name: Post PR comment on heal success
      if: 'github.event_name == ''pull_request'' &&

        steps.verify.outputs.secrets_clean == ''true''

        '
      uses: actions/github-script@v8
      with:
        script: "const MARKER = '<!-- secrets-fp-healer -->';\nconst body = `${MARKER}\n\
          ## \u2705 Secrets False-Positive Healer Applied (RP-007)\n\nThe **Secrets\
          \ False-Positive Healer** detected and automatically annotated\ndocumentation\
          \ example lines flagged by \\`detect-secrets\\`.\n\n### What was fixed:\n\
          - Added \\`<!-- pragma: allowlist secret -->\\` to markdown table rows containing\
          \ example credential strings\n- Added \\`# pragma: allowlist secret\\` to\
          \ Python code block lines with example secrets\n\nThese are **documentation\
          \ examples**, not real credentials.\nThe \\`\U0001F510 Enforce Secrets Baseline\\\
          ` workflow should now pass.\n\n> **If you see a real secret was annotated:**\
          \ Rotate it immediately and remove from codebase.\n> The healer only annotates\
          \ lines in \\`.md\\` files inside table cells or labeled code blocks.\n\n\
          _Auto-generated by [Secrets False-Positive Healer](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;\n\
          \nconst { data: comments } = await github.rest.issues.listComments({\n \
          \ owner: context.repo.owner, repo: context.repo.repo,\n  issue_number: context.issue.number,\
          \ per_page: 100,\n});\nconst existing = comments.find(c => c.body && c.body.includes(MARKER));\n\
          if (existing) {\n  await github.rest.issues.updateComment({\n    owner:\
          \ context.repo.owner, repo: context.repo.repo,\n    comment_id: existing.id,\
          \ body,\n  });\n} else {\n  await github.rest.issues.createComment({\n \
          \   issue_number: context.issue.number,\n    owner: context.repo.owner,\
          \ repo: context.repo.repo,\n    body,\n  });\n}\n"
    - name: Fail if real secrets remain after heal attempt
      if: steps.verify.outputs.secrets_clean == 'false'
      run: 'echo "::error title=Real Secrets Detected::detect-secrets still reports  #
        pragma: allowlist secret violations after pragma annotation."

        echo ""

        echo "The healer could not resolve all violations because some flagged lines"

        echo "are NOT in documentation context (table rows or labeled code blocks)."

        echo ""

        echo "Remediation:"

        echo "  1. If false positive: manually add ''# pragma: allowlist secret''
        or ''<!-- pragma: allowlist secret -->''"

        echo "  2. If real secret: rotate it immediately and remove from codebase"

        echo "  3. Update baseline: detect-secrets scan --baseline .secrets.baseline"

        exit 1

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
