name: 🩹 Secrets False-Positive Healer

# RP-007: Markdown False-Positive Secrets Auto-Healer
#
# Triggered when detect-secrets flags lines in agent markdown documentation
# files that contain example credential strings (not real secrets).
#
# What it does:
#   1. Scans changed .md files for lines matching known credential patterns
#   2. Identifies lines that are inside markdown table cells or labeled code
#      blocks (documentation context, not real secrets)
#   3. Appends the appropriate pragma comment to each flagged line
#   4. Commits and pushes the fix back to the PR branch
#
# Complements secrets-baseline-enforcer.yml — does NOT replace it.
# Only applies pragma annotations in documentation-context lines.
# Real secrets must still be rotated immediately.

on:
  # Runs after secrets-baseline-enforcer fails on a PR or copilot branch
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/agents/**/*.md'
      - 'docs/**/*.md'
      - '.codex/docs/**/*.md'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to heal (default: current branch)'
        required: false
        type: string


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  heal-secrets-false-positives:
    name: 🩹 Heal Markdown Secret False-Positives (RP-007)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only heal PRs from the same repo (not forks — we need push access)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7 # v6.0.3
        with:
          ref: ${{ inputs.branch || github.head_ref || github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Run Pattern 35 — Markdown FP Secrets healer
        id: heal
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        run: |
          # Run only Pattern 35 (Markdown FP Secrets) from the auto-fix script
          python scripts/ci/auto_fix_common_issues.py --pattern 35
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Verify no real secrets remain
        id: verify
        run: |
          set +e
          # Scan .md files changed in the PR by diffing base..HEAD.
          # On a clean CI checkout, git diff HEAD / --cached returns nothing, so
          # use the PR base SHA (or HEAD~1 as fallback) to get the real diff set.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -n "$BASE_SHA" ]; then
            ALL_MDS=$(git diff --name-only --diff-filter=ACM "$BASE_SHA" HEAD | grep '\.md$' || true)
          else
            ALL_MDS=$(git diff HEAD --name-only --diff-filter=ACM | grep '\.md$' || true)
          fi

          if [ -z "$ALL_MDS" ]; then
            echo "no_md_files=true" >> "$GITHUB_OUTPUT"
            echo "✅ No changed .md files to verify"
            exit 0
          fi

          # Run detect-secrets-hook on the modified files
          OUTPUT=$(detect-secrets-hook --baseline .secrets.baseline $ALL_MDS 2>&1)
          EXIT=$?
          echo "$OUTPUT"
          echo "secrets_clean=$( [ $EXIT -eq 0 ] && echo 'true' || echo 'false' )" >> "$GITHUB_OUTPUT"

      - name: Commit and push healed annotations
        if: steps.verify.outputs.secrets_clean == 'true' || steps.verify.outputs.no_md_files == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          TARGET_BRANCH: ${{ inputs.branch || github.head_ref || github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "ℹ️  No pragma annotations needed — files already clean."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "fix(secrets): annotate doc-example false positives [skip ci] (RP-007)"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${TARGET_BRANCH}"; then
                echo "✅ Pragma annotations pushed to ${TARGET_BRANCH}"
                pushed=true
                break
              fi
              echo "⚠️ Push attempt ${attempt} failed; branch may have advanced. Rebasing onto origin/${TARGET_BRANCH} and retrying..."
              if ! git fetch origin "${TARGET_BRANCH}"; then
                echo "::error title=Fetch failed::Unable to fetch origin/${TARGET_BRANCH} before retry."
                exit 1
              fi
              if ! git rebase "origin/${TARGET_BRANCH}"; then
                echo "::error title=Rebase failed::Unable to rebase onto origin/${TARGET_BRANCH}; manual conflict resolution is required."
                git rebase --abort || true
                exit 1
              fi
            done
            if [ "$pushed" = true ]; then
              exit 0
            fi
            echo "::error title=Push failed::Unable to push healed annotations after 3 attempts."
            exit 1
          fi

      - name: Post PR comment on heal success
        if: |
          github.event_name == 'pull_request' &&
          steps.verify.outputs.secrets_clean == 'true'
        uses: actions/github-script@v8 # v9
        with:
          script: |
            const MARKER = '<!-- secrets-fp-healer -->';
            const body = `${MARKER}
            ## ✅ Secrets False-Positive Healer Applied (RP-007)

            The **Secrets False-Positive Healer** detected and automatically annotated
            documentation example lines flagged by \`detect-secrets\`.

            ### What was fixed:
            - Added \`<!-- pragma: allowlist secret -->\` to markdown table rows containing example credential strings
            - Added \`# pragma: allowlist secret\` to Python code block lines with example secrets

            These are **documentation examples**, not real credentials.
            The \`🔐 Enforce Secrets Baseline\` workflow should now pass.

            > **If you see a real secret was annotated:** Rotate it immediately and remove from codebase.
            > The healer only annotates lines in \`.md\` files inside table cells or labeled code blocks.

            _Auto-generated by [Secrets False-Positive Healer](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo,
                body,
              });
            }

      - name: Fail if real secrets remain after heal attempt
        if: steps.verify.outputs.secrets_clean == 'false'
        run: |
          echo "::error title=Real Secrets Detected::detect-secrets still reports violations after pragma annotation."
          echo ""
          echo "The healer could not resolve all violations because some flagged lines"
          echo "are NOT in documentation context (table rows or labeled code blocks)."
          echo ""
          echo "Remediation:"
          echo "  1. If false positive: manually add '# pragma: allowlist secret' or '<!-- pragma: allowlist secret -->'"
          echo "  2. If real secret: rotate it immediately and remove from codebase"
          echo "  3. Update baseline: detect-secrets scan --baseline .secrets.baseline"
          exit 1
