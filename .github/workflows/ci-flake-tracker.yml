name: CI Flake Rate Tracker

# Weekly report of flaky test rate across the last 50 workflow runs.
# Fails (blocks the weekly report job) if the 7-day flake rate exceeds 1 %.
#
# What counts as a flake:
#   A test job that re-ran and passed on retry, or a workflow run that
#   succeeded after a prior failure on the SAME commit SHA.
#
# Domain: D7 · Test System Maturity (completion rubric v1)
# Domain: D6 · CI/CD Health & Workflow Governance
# Evidence: flake rate tracked and gated → score 4 evidence for both D6 and D7

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      window_days:
        description: "Look-back window in days (default: 7)"
        type: string
        default: "7"
      flake_threshold:
        description: "Flake rate threshold % to fail (default: 1.0)"
        type: string
        default: "1.0"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: ci-flake-tracker
  cancel-in-progress: true

jobs:
  compute-flake-rate:
    name: "🔁 Compute CI Flake Rate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Compute flake rate
        id: flake
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          WINDOW_DAYS: ${{ inputs.window_days || '7' }}
          FLAKE_THRESHOLD: ${{ inputs.flake_threshold || '1.0' }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          import requests
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          window_days = int(os.environ.get("WINDOW_DAYS", "7"))
          threshold_pct = float(os.environ.get("FLAKE_THRESHOLD", "1.0"))

          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          base_url = f"https://api.github.com/repos/{repo}"

          since = (datetime.now(timezone.utc) - timedelta(days=window_days)).strftime("%Y-%m-%dT%H:%M:%SZ")

          # Fetch recent workflow runs
          runs_url = f"{base_url}/actions/runs"
          params = {"per_page": 100, "status": "completed", "created": f">={since}"}

          try:
              resp = requests.get(runs_url, headers=headers, params=params, timeout=30)
              resp.raise_for_status()
              runs = resp.json().get("workflow_runs", [])
          except Exception as exc:
              print(f"Could not fetch workflow runs: {exc}", file=sys.stderr)
              runs = []

          # Group by (workflow_id, head_sha) — detect same-commit retries
          from collections import defaultdict
          groups = defaultdict(list)
          for run in runs:
              key = (run["workflow_id"], run["head_sha"])
              groups[key].append(run["conclusion"])

          total_groups = len(groups)
          flaky_groups = sum(
              1 for conclusions in groups.values()
              if "failure" in conclusions and "success" in conclusions
          )

          flake_rate = (flaky_groups / total_groups * 100) if total_groups > 0 else 0.0
          status = "ok" if flake_rate <= threshold_pct else "exceeded"

          report = {
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "window_days": window_days,
              "total_run_groups": total_groups,
              "flaky_groups": flaky_groups,
              "flake_rate_pct": round(flake_rate, 2),
              "threshold_pct": threshold_pct,
              "status": status,
          }

          Path("reports/ci").mkdir(parents=True, exist_ok=True)
          Path("reports/ci/flake_rate_report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))

          gho = os.environ.get("GITHUB_OUTPUT", "")
          if gho:
              with open(gho, "a") as fh:
                  fh.write(f"flake_rate={round(flake_rate, 2)}\n")
                  fh.write(f"status={status}\n")
                  fh.write(f"flaky_groups={flaky_groups}\n")
          PYEOF

      - name: Upload flake report artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ci-flake-report-${{ github.run_id }}
          path: reports/ci/flake_rate_report.json
          retention-days: 90

      - name: Open GitHub Issue if threshold exceeded
        if: steps.flake.outputs.status == 'exceeded'
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        run: |
          FLAKE_RATE="${{ steps.flake.outputs.flake_rate }}"
          TITLE="⚠️ CI Flake Rate ${FLAKE_RATE}% exceeds 1% threshold ($(date +%Y-%m-%d))"
          BODY="The weekly CI flake rate check found **${FLAKE_RATE}%** flaky run groups in the last 7 days.

          **Threshold**: 1.0 %
          **Flaky groups**: ${{ steps.flake.outputs.flaky_groups }}

          Please investigate and fix or mark with \`@pytest.mark.flaky\` + ticket.

          Report artifact: \`ci-flake-report-${{ github.run_id }}\`
          "
          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "test:flaky,ci:flake-rate" \
            --repo "${{ github.repository }}" \
            2>/dev/null || echo "Issue creation skipped (label may not exist)"

      - name: Fail if threshold exceeded
        if: steps.flake.outputs.status == 'exceeded'
        run: |
          echo "::error::CI flake rate ${{ steps.flake.outputs.flake_rate }}% exceeds threshold 1.0%"
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🔁 CI Flake Rate Report"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Flake rate | ${{ steps.flake.outputs.flake_rate }}% |"
            echo "| Threshold | ${{ inputs.flake_threshold || '1.0' }}% |"
            echo "| Status | ${{ steps.flake.outputs.status == 'ok' && '✅ OK' || '❌ EXCEEDED' }} |"
            echo "| Flaky groups | ${{ steps.flake.outputs.flaky_groups }} |"
            echo "| Window | ${{ inputs.window_days || '7' }} days |"
          } >> "$GITHUB_STEP_SUMMARY"
