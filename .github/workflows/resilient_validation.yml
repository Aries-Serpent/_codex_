name: Resilient Validation Suite

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.codex/**'
      - 'src/**'
      - 'scripts/**'

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: false
    
    strategy:
      fail-fast: false
      matrix:
        test-group: [quick, documentation, integration, slow]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}
      
      - name: Install dependencies
        run: |
          # Step 1: Install pytest plugins FIRST with exact pinned versions
          # This prevents pip from upgrading/downgrading them during package install
          echo "📦 Installing pytest plugins with pinned versions..."
          pip install pytest==8.4.2 pytest-timeout==2.4.0 pytest-xdist==3.8.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0 pytest-mock==3.15.1
          
          # Step 2: Verify plugin installation BEFORE package install
          echo "✅ Verifying plugin installation..."
          python -c "import pytest; import xdist; from importlib.metadata import version; print(f'pytest={pytest.__version__}, pytest-xdist={xdist.__version__}, pytest-timeout={version(\"pytest-timeout\")}')"
          
          # Step 3: Install package AFTER plugins to avoid dependency conflicts
          echo "📦 Installing package with dev dependencies..."
          pip install -e .[dev]
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          npm install -g markdown-link-check
          
          # Step 4: Verify plugins are STILL available after package install
          echo "🔍 Final plugin verification (detecting version changes)..."
          python -c "import pytest; import xdist; from importlib.metadata import version; print(f'AFTER: pytest={pytest.__version__}, pytest-xdist={xdist.__version__}, pytest-timeout={version(\"pytest-timeout\")}')"
          
          # Step 5: Test that pytest recognizes plugin-provided arguments
          echo "🧪 Testing plugin argument recognition..."
          python -m pytest --version
          python -m pytest --help | grep -E "(--timeout|--numprocesses|-n )" || echo "⚠️ WARNING: Plugin arguments not found in help"
          
          # Step 6: Verify xdist workers can spawn successfully
          echo "🔧 Testing xdist worker spawn..."
          python -m pytest --co tests/test_data_split_utils.py -n 1 --timeout=10 2>&1 | head -10 || echo "✓ Worker spawn verification complete"
      
      - name: Run validation
        id: validate
        timeout-minutes: 45
        env:
          # Ensure xdist workers load plugins via entry points
          PYTEST_PLUGINS: "xdist.plugin,xdist.looponfail,pytest_timeout"
        run: |
          case "${{ matrix.test-group }}" in
            quick)
              # Quick tests: 60s timeout, parallel execution with 4 workers, fail after 20 failures
              python -m pytest tests/ -v -m "not slow and not integration" --timeout=60 --tb=short -n 4 --maxfail=20
              ;;
            documentation)
              npx markdown-link-check docs/**/*.md --retry --timeout 5000 || true
              python scripts/validate_docs.py --fix || echo "Doc validation warnings (non-blocking)"
              ;;
            integration)
              # Integration tests: 300s timeout, parallel with 2 workers, fail after 10 failures
              python -m pytest tests/ -v -m "integration and not slow" --timeout=300 --tb=short -n 2 --maxfail=10
              ;;
            slow)
              # Slow tests: 600s timeout, sequential execution, fail after 5 failures
              python -m pytest tests/ -v -m "slow" --timeout=600 --maxfail=5 --tb=short
              ;;
          esac
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ matrix.test-group }}
          path: |
            test-results/
            .coverage
            htmlcov/
          retention-days: 7
      
      - name: Comment on PR (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const group = '${{ matrix.test-group }}';
            const body = `⚠️ **Validation failed for \`${group}\` tests**
            
            ### Common fixes:
            - **Documentation**: Run \`bash scripts/fix_pr3248_dead_links.sh\`
            - **Tests**: Add \`@pytest.mark.slow\` for long-running tests
            - **Dependencies**: Run \`pip install -e .[dev]\` and \`pip check\`
            - **Timeouts**: Increase test timeout or optimize test logic
            
            📋 [View detailed logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
