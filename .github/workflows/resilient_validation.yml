name: Resilient Validation Suite

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.codex/**'
      - 'src/**'
      - 'scripts/**'

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: false
    
    strategy:
      fail-fast: false
      matrix:
        test-group: [quick, documentation, integration, slow]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}
      
      - name: Install dependencies
        run: |
          # Install pytest plugins FIRST before any other packages
          # This ensures they're registered globally and visible to xdist workers
          pip install pytest==8.4.2 pytest-timeout==2.4.0 pytest-xdist==3.8.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0 pytest-mock==3.15.1
          
          # Verify plugin installation and registration
          python -c "import sys; import pytest; import pytest_timeout; import xdist; print(f'✓ Plugins installed: pytest={pytest.__version__}')"
          
          # Install package AFTER plugins to avoid dependency conflicts
          pip install -e .[dev]
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          npm install -g markdown-link-check
          
          # Final verification that plugins are still available after package install
          python -m pytest --version
          python -m pytest --co --collect-only tests/test_data_split_utils.py 2>&1 | head -5 || echo "Plugin verification complete"
      
      - name: Run validation
        id: validate
        timeout-minutes: 45
        run: |
          case "${{ matrix.test-group }}" in
            quick)
              # Quick tests: 60s timeout, parallel execution with 4 workers, fail after 20 failures
              python -m pytest tests/ -v -m "not slow and not integration" --timeout=60 --tb=short -n 4 --maxfail=20
              ;;
            documentation)
              npx markdown-link-check docs/**/*.md --retry --timeout 5000 || true
              python scripts/validate_docs.py --fix || echo "Doc validation warnings (non-blocking)"
              ;;
            integration)
              # Integration tests: 300s timeout, parallel with 2 workers, fail after 10 failures
              python -m pytest tests/ -v -m "integration and not slow" --timeout=300 --tb=short -n 2 --maxfail=10
              ;;
            slow)
              # Slow tests: 600s timeout, sequential execution, fail after 5 failures
              python -m pytest tests/ -v -m "slow" --timeout=600 --maxfail=5 --tb=short
              ;;
          esac
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-${{ matrix.test-group }}
          path: |
            test-results/
            .coverage
            htmlcov/
          retention-days: 7
      
      - name: Comment on PR (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const group = '${{ matrix.test-group }}';
            const body = `⚠️ **Validation failed for \`${group}\` tests**
            
            ### Common fixes:
            - **Documentation**: Run \`bash scripts/fix_pr3248_dead_links.sh\`
            - **Tests**: Add \`@pytest.mark.slow\` for long-running tests
            - **Dependencies**: Run \`pip install -e .[dev]\` and \`pip check\`
            - **Timeouts**: Increase test timeout or optimize test logic
            
            📋 [View detailed logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
