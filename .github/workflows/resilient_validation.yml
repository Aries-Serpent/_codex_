name: Resilient Validation Suite

on:
  pull_request:
    # Only run on non-draft PRs by default. DRAFT mode: validation is optional.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.codex/**'
      - 'src/**'
      - 'scripts/**'


permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# ── Promotion check: is this PR merging 0D_base_ → main? ────────────────────
# Full suite (all test groups, sharded quick) runs only on promotion PRs.
# For all other PRs: simplified run (quick + docs, PR-scoped, max 60 min).
# This prevents the heavy integration/slow test matrix from consuming runners
# on every branch push while still giving promotion merges full coverage.

jobs:
  # ── WEC gate — skip when checkbox is unchecked OR PR is in DRAFT mode ───────
  wec-gate:
    name: "WEC gate — check resilient_validation.yml checkbox"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: "Read WEC checkbox and draft status from PR"
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Skip on DRAFT PRs — resilient validation is optional in draft mode
          IS_DRAFT="${{ github.event.pull_request.draft }}"
          if [ "$IS_DRAFT" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "📋 DRAFT PR — resilient_validation.yml is optional (skip=true)."
            exit 0
          fi

          BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body --jq '.body // ""' 2>/dev/null || echo "")

          # Extract only the WEC section to avoid false matches in code examples/comments.
          WEC_SECTION=$(echo "$BODY" | awk '
            /^## 🔄 Workflow Execution Checklist/ { found=1 }
            found && /^## / && !/^## 🔄 Workflow Execution Checklist/ { found=0 }
            found { print }
          ')

          # If WEC section is present AND resilient_validation.yml is explicitly unchecked, skip.
          if [ -n "$WEC_SECTION" ]; then
            if echo "$WEC_SECTION" | grep -qiE '^\s*-\s*\[\s*\]\s*resilient_validation\.yml'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "📋 WEC: resilient_validation.yml is UNCHECKED — skipping resilient validation."
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "📋 WEC gate passed — proceeding with resilient validation."

  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: wec-gate
    # Skip when WEC unchecked or PR is in DRAFT mode
    if: needs.wec-gate.outputs.skip != 'true'
    # Full suite (90 min, all groups) for 0D_base_ → main promotion.
    # Simplified (55 min, quick+docs only) for all other PRs.
    timeout-minutes: ${{ github.base_ref == 'main' && github.head_ref == '0D_base_' && 90 || 55 }}
    continue-on-error: false

    strategy:
      fail-fast: false
      matrix:
        # Full suite: all 5 groups. Simplified suite: quick + documentation + skills.
        test-group: ${{ (github.base_ref == 'main' && github.head_ref == '0D_base_') && fromJSON('["quick","documentation","skills","integration","slow"]') || fromJSON('["quick","documentation","skills"]') }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Fetch base ref for PR-scoped diff
        # Needed so `git diff origin/<base>...HEAD` works on shallow clones for non-promotion PRs.
        if: github.base_ref != 'main' || github.head_ref != '0D_base_'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Set up Python with shared cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          extras: 'dev'
          install-torch: 'true'
          install-preflight-extras: 'true'
          install-npm-tools: 'true'

      - name: Run validation
        id: validate
        env:
          IS_PROMOTION_PR: ${{ github.base_ref == 'main' && github.head_ref == '0D_base_' && 'true' || 'false' }}
        run: |
          # For non-promotion PRs, limit quick tests to files changed in this PR
          # (max 60 min budget) and skip integration/slow groups entirely.
          if [ "$IS_PROMOTION_PR" = "false" ] && [ "${{ matrix.test-group }}" = "quick" ]; then
            # Collect files changed in this PR to narrow test scope
            git fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null || true
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'tests/' 'src/' 'scripts/' 2>/dev/null | head -100 || true)
            if [ -n "$CHANGED_FILES" ]; then
              echo "Running scoped quick tests on changed paths..."
              python -m pytest $CHANGED_FILES -v -m "not slow and not integration" \
                --timeout=55 --tb=short --maxfail=20 \
                --cov=src --cov-report=xml --cov-report=json -q \
                || python -m pytest tests/ -v -m "not slow and not integration" \
                     --timeout=55 --tb=short --maxfail=20 \
                     --cov=src --cov-report=xml --cov-report=json -q
            else
              python -m pytest tests/ -v -m "not slow and not integration" \
                --timeout=55 --tb=short --maxfail=20 \
                --cov=src --cov-report=xml --cov-report=json -q
            fi
            exit 0
          fi

          case "${{ matrix.test-group }}" in
            quick)
              # Quick tests: 60s timeout, SEQUENTIAL execution (PR #3248 Attempt 15 - xdist worker isolation fix)
              # Removed -n 4 flag to avoid xdist worker subprocess plugin discovery issues
              python -m pytest tests/ -v -m "not slow and not integration" --timeout=60 --tb=short --maxfail=20 \
                --cov=src --cov-report=xml --cov-report=json -q
              ;;
            documentation)
              npx markdown-link-check docs/**/*.md --retry --timeout 5000 || true
              python scripts/validate_docs.py --fix || echo "Doc validation warnings (non-blocking)"
              ;;
            skills)
              # Skills registry tests: isolated nox session with coverage
              pip install nox --quiet
              nox -s skills --no-venv 2>/dev/null || \
                python -m pytest tests/skills/ -v --timeout=60 --tb=short --maxfail=10 \
                  --cov=src/codex/skills --cov-report=xml --cov-report=json -q
              ;;
            integration)
              # Integration tests: 300s timeout, SEQUENTIAL execution (PR #3248 Attempt 15)
              # Removed -n 2 flag to avoid xdist worker subprocess plugin discovery issues
              python -m pytest tests/ -v -m "integration and not slow" --timeout=300 --tb=short --maxfail=10
              ;;
            slow)
              # Slow tests: 600s timeout, sequential execution, fail after 5 failures
              python -m pytest tests/ -v -m "slow" --timeout=600 --maxfail=5 --tb=short
              ;;
          esac

      # HFIX-001 Step 5: Surface CI coverage numbers as PR comments (quick group only)
      - name: Post coverage to PR
        if: matrix.test-group == 'quick' && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@a01708271d42c5703d489b13eb503ba47c01e82a
        with:
          pytest-coverage-path: coverage.xml
          title: "📊 Coverage Report (quick tests)"
          badge-title: "Coverage"
          default-branch: "0D_base_"
          unique-id-for-comment: "quick-coverage"

      # HFIX-001 Step 2: Upload coverage artifact for local baseline verification
      - name: Upload coverage artifact
        if: matrix.test-group == 'quick' && always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-baseline
          path: |
            coverage.json
            coverage.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: validation-results-${{ matrix.test-group }}
          path: |
            test-results/
            .coverage
            htmlcov/
          retention-days: 7

      - name: Post rescue comment on validation failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Resilient Validation Suite (${{ matrix.test-group }})"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py

  # P11-04: Parallel test sharding (S100)
  # Splits the "quick" test group into 4 shards using pytest-split, reducing
  # wall-clock time from ~N min to ~N/4 min on the quick test suite.
  # Only runs on promotion PRs (0D_base_ → main) to avoid consuming runners
  # on every branch push.
  sharded-quick:
    name: Sharded quick tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: wec-gate
    # Only run full sharding for 0D_base_ → main promotion PRs, and only when WEC checked / not draft
    if: needs.wec-gate.outputs.skip != 'true' && github.base_ref == 'main' && github.head_ref == '0D_base_'
    runs-on: ubuntu-latest
    # P11-05: Increased from 55→75 min after repeated shard cancellations.
    # 14 k+ quick tests across 4 shards (~3.5 k each) + ~12 min setup overhead
    # fits comfortably within 75 min even on cold runners.
    timeout-minutes: 75
    continue-on-error: true  # Sharding is additive; do not block merges until stable
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        # P11-05: Doubled from 2→4 shards to halve per-shard test count (~3.5 k each).
        shard: [1, 2, 3, 4]
        total: [4]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python with shared cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          extras: 'dev'
          install-torch: 'true'
          install-preflight-extras: 'true'

      - name: Install pytest-split
        run: pip install pytest-split>=0.8 --quiet

      - name: Restore test durations cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .test_durations
          key: test-durations-${{ hashFiles('tests/**/*.py') }}
          restore-keys: |
            test-durations-

      - name: Run sharded quick tests
        id: shard-run
        run: |
          # DRQ-S105-001: Disable pytest-rerunfailures in sharded runs.
          # pytest-rerunfailures starts a background server socket thread; pytest-timeout
          # (thread mode, the default) injects Timeout into ALL threads including that
          # server thread, causing ValueError("I/O operation on closed file.") + "lost
          # sys.stderr" when the server thread tries to write after teardown.
          # Fix: -p no:rerunfailures eliminates the background thread.
          # DRQ-S105-003: --store-durations accumulates timing data so future runs use
          # least_duration correctly instead of falling back to count-based splitting.
          python -m pytest tests/ \
            -m "not slow and not integration" \
            --timeout=60 \
            --tb=short \
            --maxfail=20 \
            -p no:rerunfailures \
            --store-durations \
            --splits ${{ matrix.total }} \
            --group ${{ matrix.shard }} \
            --splitting-algorithm=least_duration \
            --durations-path=.test_durations \
            -q
          echo "Shard ${{ matrix.shard }}/${{ matrix.total }} exit: $?"

      - name: Save test durations cache
        if: always()
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c6158d  # v5
        with:
          path: .test_durations
          key: test-durations-${{ hashFiles('tests/**/*.py') }}

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: shard-results-${{ matrix.shard }}-of-${{ matrix.total }}
          path: |
            .test_durations
            test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Post rescue comment on shard failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Resilient Validation Suite / Shard ${{ matrix.shard }}/${{ matrix.total }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
