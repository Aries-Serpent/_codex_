name: Resilient Validation Suite
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    paths:
    - docs/**
    - tests/**
    - .codex/**
    - src/**
    - scripts/**
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  wec-gate:
    name: "WEC gate \u2014 check resilient_validation.yml checkbox"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
    - name: Read WEC checkbox and draft status from PR
      id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: "# Skip on DRAFT PRs \u2014 resilient validation is optional in draft mode\n\
        IS_DRAFT=\"${{ github.event.pull_request.draft }}\"\nif [ \"$IS_DRAFT\" =\
        \ \"true\" ]; then\n  echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"\U0001F4CB\
        \ DRAFT PR \u2014 resilient_validation.yml is optional (skip=true).\"\n  exit\
        \ 0\nfi\n\nBODY=$(gh pr view \"${PR_NUMBER}\" --repo \"${REPO}\" --json body\
        \ --jq '.body // \"\"' 2>/dev/null || echo \"\")\n\n# Extract only the WEC\
        \ section to avoid false matches in code examples/comments.\nWEC_SECTION=$(echo\
        \ \"$BODY\" | awk '\n  /^## \U0001F504 Workflow Execution Checklist/ { found=1\
        \ }\n  found && /^## / && !/^## \U0001F504 Workflow Execution Checklist/ {\
        \ found=0 }\n  found { print }\n')\n\n# If WEC section is present AND resilient_validation.yml\
        \ is explicitly unchecked, skip.\nif [ -n \"$WEC_SECTION\" ]; then\n  if echo\
        \ \"$WEC_SECTION\" | grep -qiE '^\\s*-\\s*\\[\\s*\\]\\s*resilient_validation\\\
        .yml'; then\n    echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n    echo \"\U0001F4CB\
        \ WEC: resilient_validation.yml is UNCHECKED \u2014 skipping resilient validation.\"\
        \n    exit 0\n  fi\nfi\n\necho \"skip=false\" >> \"$GITHUB_OUTPUT\"\necho\
        \ \"\U0001F4CB WEC gate passed \u2014 proceeding with resilient validation.\"\
        \n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: wec-gate
    if: needs.wec-gate.outputs.skip != 'true'
    timeout-minutes: ${{ github.base_ref == 'main' && github.head_ref == '0D_base_'
      && 90 || 55 }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        test-group: "${{\n  (github.base_ref == 'main' && github.head_ref == '0D_base_')\n\
          \  && fromJSON('[\"quick\",\"documentation\",\"skills\",\"integration\"\
          ,\"slow\"]')\n  || fromJSON('[\"quick\",\"documentation\",\"skills\"]')\n\
          }}"
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Fetch base ref for PR-scoped diff
      if: github.base_ref != 'main' || github.head_ref != '0D_base_'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: git fetch origin "$BASE_REF" --depth=1
    - name: Set up Python with shared cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        extras: dev
        install-torch: 'true'
        install-preflight-extras: 'true'
        install-npm-tools: 'true'
    - name: Run validation
      id: validate
      env:
        IS_PROMOTION_PR: ${{ github.base_ref == 'main' && github.head_ref == '0D_base_'
          && 'true' || 'false' }}
        PYTHONPATH: .:src
      run: "# For non-promotion PRs, limit quick tests to files changed in this PR\n\
        # (max 60 min budget) and skip integration/slow groups entirely.\nif [ \"\
        $IS_PROMOTION_PR\" = \"false\" ] && [ \"${{ matrix.test-group }}\" = \"quick\"\
        \ ]; then\n  # Collect files changed in this PR to narrow test scope\n  git\
        \ fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null || true\n  CHANGED_FILES=$(\n\
        \    git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'tests/'\
        \ 'src/' 'scripts/' \\\n      2>/dev/null | head -100 || true\n  )\n  if [\
        \ -n \"$CHANGED_FILES\" ]; then\n    echo \"Running scoped quick tests on\
        \ changed paths...\"\n    python -m pytest $CHANGED_FILES -v -m \"not slow\
        \ and not integration\" \\\n      --import-mode=importlib \\\n      --timeout=55\
        \ --tb=short --maxfail=20 \\\n      --cov=src --cov-report=xml --cov-report=json\
        \ -q \\\n      || python -m pytest tests/ -v -m \"not slow and not integration\"\
        \ \\\n           --import-mode=importlib \\\n           --timeout=55 --tb=short\
        \ --maxfail=20 \\\n           --cov=src --cov-report=xml --cov-report=json\
        \ -q\n  else\n    python -m pytest tests/ -v -m \"not slow and not integration\"\
        \ \\\n      --import-mode=importlib \\\n      --timeout=55 --tb=short --maxfail=20\
        \ \\\n      --cov=src --cov-report=xml --cov-report=json -q\n  fi\n  exit\
        \ 0\nfi\n\ncase \"${{ matrix.test-group }}\" in\n  quick)\n  # Quick tests:\
        \ 60s timeout, SEQUENTIAL execution (PR  #3248 Attempt 15 - xdist worker isolation\
        \ fix)\n  # Removed -n 4 flag to avoid xdist worker subprocess plugin discovery\
        \ issues\n    python -m pytest tests/ -v -m \"not slow and not integration\"\
        \ \\\n      --import-mode=importlib --timeout=60 --tb=short --maxfail=20 \\\
        \n      --cov=src --cov-report=xml --cov-report=json -q\n    ;;\n  documentation)\n\
        \    npx markdown-link-check docs/**/*.md --retry --timeout 5000 || true\n\
        \    python scripts/validate_docs.py --fix || echo \"Doc validation warnings\
        \ (non-blocking)\"\n    ;;\n  skills)\n  # Skills registry tests: isolated\
        \ nox session with coverage\n    pip install nox --quiet\n    nox -s skills\
        \ --no-venv 2>/dev/null || \\\n      python -m pytest tests/skills/ -v --timeout=60\
        \ --tb=short --maxfail=10 \\\n        --cov=src/codex/skills --cov-report=xml\
        \ --cov-report=json -q\n    ;;\n  integration)\n  # Integration tests: 300s\
        \ timeout, SEQUENTIAL execution (PR  #3248 Attempt 15)\n    # Removed -n 2\
        \ flag to avoid xdist worker subprocess plugin discovery issues\n    python\
        \ -m pytest tests/ -v -m \"integration and not slow\" \\\n      --import-mode=importlib\
        \ --timeout=300 --tb=short --maxfail=10\n    ;;\n  slow)\n  # Slow tests:\
        \ 600s timeout, sequential execution, fail after 5 failures\n    python -m\
        \ pytest tests/ -v -m \"slow\" \\\n      --import-mode=importlib --timeout=600\
        \ --maxfail=5 --tb=short\n    ;;\nesac\n"
    - name: Post coverage to PR
      if: matrix.test-group == 'quick' && github.event_name == 'pull_request'
      uses: MishaKav/pytest-coverage-comment@09c28b6767e12a048e0b23e821ed03133ee48a1a
      with:
        pytest-coverage-path: coverage.xml
        title: "\U0001F4CA Coverage Report (quick tests)"
        badge-title: Coverage
        default-branch: 0D_base_
        unique-id-for-comment: quick-coverage
    - name: Upload coverage artifact
      if: matrix.test-group == 'quick' && always()
      uses: actions/upload-artifact@v5
      with:
        path: 'coverage.json

          coverage.xml

          '
        retention-days: 30
        if-no-files-found: ignore
        name: coverage-baseline
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: 'test-results/

          .coverage

          htmlcov/

          '
        retention-days: 7
        name: validation-results-${{ matrix.test-group }}
    - name: Post rescue comment on validation failure
      if: failure() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Resilient Validation Suite (${{ matrix.test-group }})
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
  sharded-quick:
    name: Sharded quick tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: wec-gate
    if: needs.wec-gate.outputs.skip != 'true' && github.base_ref == 'main' && github.head_ref
      == '0D_base_'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        total:
        - 4
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python with shared cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        extras: dev
        install-torch: 'true'
        install-preflight-extras: 'true'
    - name: Install pytest-split
      run: pip install pytest-split>=0.8 --quiet
    - name: Restore test durations cache
      uses: actions/cache@v5
      with:
        path: .test_durations
        key: test-durations-${{ hashFiles('tests/**/*.py') }}
        restore-keys: 'test-durations-

          '
    - name: Run sharded quick tests
      id: shard-run
      env:
        PYTHONPATH: .:src
      run: "# DRQ-S105-001: Disable pytest-rerunfailures in sharded runs.\n# pytest-rerunfailures\
        \ starts a background server socket thread; pytest-timeout\n# (thread mode,\
        \ the default) injects Timeout into ALL threads including that\n# server thread,\
        \ causing ValueError(\"I/O operation on closed file.\") + \"lost\n# sys.stderr\"\
        \ when the server thread tries to write after teardown.\n# Fix: -p no:rerunfailures\
        \ eliminates the background thread.\n# DRQ-S105-003: --store-durations accumulates\
        \ timing data so future runs use\n# least_duration correctly instead of falling\
        \ back to count-based splitting.\npython -m pytest tests/ \\\n  -m \"not slow\
        \ and not integration\" \\\n  --import-mode=importlib \\\n  --timeout=60 \\\
        \n  --tb=short \\\n  --maxfail=20 \\\n  -p no:rerunfailures \\\n  --store-durations\
        \ \\\n  --splits ${{ matrix.total }} \\\n  --group ${{ matrix.shard }} \\\n\
        \  --splitting-algorithm=least_duration \\\n  --durations-path=.test_durations\
        \ \\\n  -q\necho \"Shard ${{ matrix.shard }}/${{ matrix.total }} exit: $?\"\
        \n"
    - name: Save test durations cache
      if: always()
      uses: actions/cache@v5
      with:
        path: .test_durations
        key: test-durations-${{ hashFiles('tests/**/*.py') }}
    - name: Upload shard results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: '.test_durations

          test-results/

          '
        retention-days: 3
        if-no-files-found: ignore
        name: shard-results-${{ matrix.shard }}-of-${{ matrix.total }}
    - name: Post rescue comment on shard failure
      if: failure() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Resilient Validation Suite / Shard ${{ matrix.shard }}/${{
          matrix.total }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
