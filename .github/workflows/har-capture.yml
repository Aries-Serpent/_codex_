name: HAR Cache Capture
# aais-cache: none  # Python referenced in template/doc strings only — no pip install

# Refreshes the Playwright-recorded HAR file used by the Cognitive App in
# offline / GitHub Pages mode.
#
# Triggers:
#   - Weekly schedule (Monday 03:00 UTC)
#   - Manual dispatch (force refresh or target a specific URL)
#   - Push to main touching har-capture.spec.ts or the seed HAR
#
# What it does:
#   1. Starts the cognitive_app Vite dev server + CLI API server
#   2. Runs the Playwright HAR capture spec (full app walkthrough)
#   3. Enriches the HAR with GitHub API responses (via App installation token)
#   4. Commits the updated HAR back to main via LFS
#
# Budget: ~8 min/run × 4 runs/month ≈ 32 min/month
# HAR stored in Git LFS — does NOT bloat the git object store.

on:
  push:
    branches: [main]
    paths:
      - cognitive_app/e2e/har-capture.spec.ts
      - cognitive_app/public/har-cache/api-demo.har
      - scripts/ci/generate_har_dataset.py
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      target-url:
        description: 'App URL to record against (default: localhost dev server)'
        required: false
        default: ''
      commit-back:
        description: 'Commit the updated HAR back to the branch'
        required: false
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

concurrency:
  group: har-capture
  cancel-in-progress: true

jobs:
  capture-har:
    name: '🎬 Record HAR — Cognitive App walkthrough'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write    # to commit HAR back
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          lfs: false       # LFS disabled — object may not exist on server
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}

      - name: "🔀 Resolve push target (chain: sub-PR → 0D_base_ → main)"
        id: resolve-target
        uses: ./.github/actions/resolve-push-target

      # ── Python + agent venv ──────────────────────────────────────────────
      - name: Setup agent environment (L6)
        uses: ./.github/actions/setup-agent-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
          install-editable: 'true'
          verify: 'false'

      # ── Node.js + npm cache ──────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cognitive_app/package-lock.json

      - name: Install cognitive_app dependencies
        working-directory: cognitive_app
        run: npm ci --prefer-offline

      # ── Install Playwright browsers ──────────────────────────────────────
      - name: Install Playwright Chromium
        working-directory: cognitive_app
        run: npx playwright install chromium --with-deps

      # ── Bootstrap HAR from GitHub API (Python, no browser needed) ────────
      - name: Bootstrap HAR from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          # Map Codespace-style secrets to plain names for github_app_auth.py
          GITHUB_APP_ID: ${{ secrets._GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_PEM: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets._GITHUB_APP_INSTALLATION_ID }}
          CODEX_NET_MODE: online_allowlist
          CODEX_ALLOWLIST_HOSTS: api.github.com
        run: |
          python scripts/ci/generate_har_dataset.py \
            --output cognitive_app/public/har-cache/api-demo.har \
            --repo Aries-Serpent/_codex_ \
            --merge-existing \
            || echo "::warning::HAR bootstrap failed — Playwright will overwrite with fresh recording"

      # ── Start CLI API server (background) ────────────────────────────────
      - name: Start CLI API server (:8765)
        working-directory: cognitive_app
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          GITHUB_APP_ID: ${{ secrets._GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_PEM: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets._GITHUB_APP_INSTALLATION_ID }}
        run: |
          nohup .venv_agent/bin/python -m uvicorn \
            cognitive_app.src.server.cli_api_server:app \
            --host 0.0.0.0 --port 8765 \
            > /tmp/cli_api.log 2>&1 &
          echo "CLI_API_PID=$!" >> "$GITHUB_ENV"
          # Wait for server to be ready
          for i in $(seq 1 15); do
            curl -sf http://localhost:8765/api/health > /dev/null 2>&1 && break
            echo "Waiting for CLI API server… ($i/15)"
            sleep 2
          done

      # ── Run Playwright HAR capture ────────────────────────────────────────
      - name: Run Playwright HAR capture
        working-directory: cognitive_app
        env:
          BASE_URL: ${{ inputs.target-url || 'http://localhost:5173' }}
          VITE_CLI_API_URL: 'http://localhost:8765'
          VITE_CODEX_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          VITE_GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY }}
          VITE_GITHUB_REPO: 'Aries-Serpent/_codex_'
          CI: 'true'
        run: |
          npx playwright test e2e/har-capture.spec.ts \
            --project=chromium \
            --reporter=list \
            || echo "::warning::Playwright walkthrough completed with some skipped steps"

      # ── Collect Playwright report ─────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-har-capture-report-${{ github.run_id }}
          path: |
            cognitive_app/playwright-report/
            cognitive_app/playwright-results.json
          retention-days: 30

      # ── Validate HAR ──────────────────────────────────────────────────────
      - name: Validate HAR file
        run: |
          python - << 'PYEOF'
          import json, sys
          from pathlib import Path
          har_path = Path("cognitive_app/public/har-cache/api-demo.har")
          if not har_path.exists():
              print("❌ HAR file not found!")
              sys.exit(1)
          har = json.loads(har_path.read_text())
          entries = har.get("log", {}).get("entries", [])
          print(f"✅ HAR valid — {len(entries)} entries recorded")
          if len(entries) < 3:
              print("::warning::HAR has fewer than 3 entries — walkthrough may have been incomplete")
          PYEOF

      # ── Commit HAR back to main ───────────────────────────────────────────
      - name: Commit updated HAR back to branch
        if: ${{ inputs.commit-back != false && github.event_name != 'pull_request' }}
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use CODEX_MASTER_KEY for push (elevated permissions for LFS + main)
          if [ -n "${CODEX_MASTER_KEY}" ]; then
            git remote set-url origin \
              "https://x-access-token:${CODEX_MASTER_KEY}@github.com/${{ github.repository }}.git"
          fi

          git add cognitive_app/public/har-cache/api-demo.har

          if git diff --cached --quiet; then
            echo "No HAR changes to commit."
          else
            ENTRY_COUNT=$(python3 -c "
          import json; from pathlib import Path
          h = json.loads(Path('cognitive_app/public/har-cache/api-demo.har').read_text())
          print(len(h.get('log',{}).get('entries',[])))
          " 2>/dev/null || echo "?")
            git commit -m "chore(har): refresh api-demo.har — ${ENTRY_COUNT} entries [skip ci]

          Recorded by: har-capture.yml (Playwright full walkthrough)
          Run: ${{ github.run_id }}
          Trigger: ${{ github.event_name }}"

            # Walk the staging chain: sub-PR → 0D_base_ → main  (resolved above)
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.ref_name }}" = "main" ]; then
              TARGET_REF="${{ steps.resolve-target.outputs.branch }}"
              echo "🔀 Push target: ${TARGET_REF} (reason: ${{ steps.resolve-target.outputs.reason }})"
            else
              TARGET_REF="${{ github.ref_name }}"
            fi
            echo "🔄 Re-basing HAR commit onto tip of ${TARGET_REF} before push"
            git fetch origin "${TARGET_REF}"
            git rebase "origin/${TARGET_REF}"
            git push origin HEAD:${TARGET_REF}
            echo "✅ HAR committed and pushed (LFS)"
          fi

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          python - << 'PYEOF'
          import json, os
          from pathlib import Path
          har_path = Path("cognitive_app/public/har-cache/api-demo.har")
          try:
              har = json.loads(har_path.read_text())
              entries = har.get("log", {}).get("entries", [])
              urls = [e["request"]["url"] for e in entries[:10]]
          except Exception:
              entries, urls = [], []

          lines = [
              "## 🎬 HAR Cache Capture",
              "",
              f"| Key | Value |",
              f"|-----|-------|",
              f"| **Entries recorded** | {len(entries)} |",
              f"| **Output** | `cognitive_app/public/har-cache/api-demo.har` (Git LFS) |",
              f"| **Trigger** | `{os.environ.get('GITHUB_EVENT_NAME', 'unknown')}` |",
              "",
              "### Sample captured endpoints",
          ] + [f"- `{u}`" for u in urls]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF
