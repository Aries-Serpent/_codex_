name: "\U0001F9F9 Codebase Health Sweep"
on:
  schedule:
  - cron: 15 2 * * *
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sweep (default: main AND 0D_base_)'
        required: false
        default: ''
      dry_run:
        description: "Dry run \u2014 detect but do not commit fixes"
        required: false
        type: boolean
        default: false
      patterns:
        description: Comma-separated pattern names to run (empty = all)
        required: false
        default: ''
  workflow_run:
    workflows:
    - "\U0001F504 Auto-Post @copilot review After Agent Session"
    types:
    - completed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
jobs:
  sweep-main:
    if: ${{ github.event.pull_request.number != 5328 && (github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success')) }}
    name: "\U0001F9F9 Sweep main"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout main
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: refs/heads/main
        fetch-depth: 10
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
    - name: "Rate gate \u2014 skip if swept within 6 hours"
      id: rate
      run: "# Check the last [skip ci] sweep commit on this branch\nLAST_SWEEP=$(git\
        \ log --oneline --grep=\"universal baseline sweep\\|codebase health sweep\\\
        |nightly sweep\" -1 --format=\"%cd\" --date=unix 2>/dev/null || echo \"0\"\
        )\nNOW=$(date +%s)\nELAPSED=$(( NOW - LAST_SWEEP ))\nif [ \"$ELAPSED\" -lt\
        \ 21600 ] && [ \"${{ github.event_name }}\" = \"schedule\" ]; then\n  echo\
        \ \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"\u23ED\uFE0F Skipping sweep\
        \ \u2014 last ran ${ELAPSED}s ago (< 6h)\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n\
        \  echo \"skip=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Set up Python
      if: steps.rate.outputs.skip != 'true'
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install tools
      if: steps.rate.outputs.skip != 'true'
      run: "PYTHON_BIN=\"${VENV_PYTHON:-.venv_ci/bin/python}\"\nif ! \"$PYTHON_BIN\"\
        \ -m pip install detect-secrets ruff --quiet 2>/dev/null; then\n  rm -rf .venv_ci\n\
        \  python3 -m venv --clear .venv_ci\n  PYTHON_BIN=\".venv_ci/bin/python\"\n\
        \  \"$PYTHON_BIN\" -m pip install detect-secrets ruff --quiet\nfi\n"
    - name: "Run sweep \u2014 main"
      id: sweep
      if: steps.rate.outputs.skip != 'true'
      env:
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        PATTERNS: ${{ github.event.inputs.patterns || '' }}
      run: "echo \"## \U0001F9F9 Codebase Health Sweep \u2014 main\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"**Triggered by:** ${{ github.event_name }}\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n\n# Step 1: Sync .secrets.baseline (SCP-RESCUE-5 prevention)\necho \"###\
        \ Step 1: Baseline sync\" >> \"$GITHUB_STEP_SUMMARY\"\npython scripts/ci/sync_tracked_files.py\
        \ --fix --manifest-only 2>&1 | tee /tmp/sweep_sync.txt\ncat /tmp/sweep_sync.txt\
        \ >> \"$GITHUB_STEP_SUMMARY\" || true\n\n# Step 2: All auto-fixable patterns\n\
        echo \"### Step 2: Auto-fix patterns\" >> \"$GITHUB_STEP_SUMMARY\"\nFIX_ARGS=\"\
        \"\nif [ -n \"$PATTERNS\" ]; then\n  FIX_ARGS=\"--pattern-name $PATTERNS\"\
        \nfi\npython scripts/ci/auto_fix_common_issues.py $FIX_ARGS 2>&1 | tee /tmp/sweep_fix.txt\n\
        cat /tmp/sweep_fix.txt >> \"$GITHUB_STEP_SUMMARY\" || true\n\n# Step 3: docs/ROADMAP.md\
        \ date sync\necho \"### Step 3: Doc metrics sync\" >> \"$GITHUB_STEP_SUMMARY\"\
        \npython scripts/tools/doc_metrics_sync.py --fix 2>&1 | tee /tmp/sweep_docs.txt\
        \ || \\\n  echo \"\u26A0\uFE0F doc_metrics_sync non-zero (non-blocking)\"\
        \ | tee -a /tmp/sweep_docs.txt\ncat /tmp/sweep_docs.txt >> \"$GITHUB_STEP_SUMMARY\"\
        \ || true\n\nif git diff --quiet; then\n  echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"\u2705 **main is clean** \u2014 no fixes needed\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nelse\n  echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\n  CHANGED_FILES=$(git\
        \ diff --name-only | tr '\\n' ' ')\n  echo \"changed_files=${CHANGED_FILES}\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"\U0001F4DD **Changed:** \\`${CHANGED_FILES}\\\
        `\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: "Active-PR guard \u2014 skip push when any open/draft PR targets main"
      id: pr_guard
      if: steps.rate.outputs.skip != 'true' && steps.sweep.outputs.changed == 'true'
        && github.event.inputs.dry_run != 'true'
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
      run: "# Any open or draft PR targeting main means we skip the push entirely.\n\
        # The old file-overlap approach was too narrow \u2014 it missed PRs that hadn't\n\
        # yet touched these files but would conflict after the sweep pushed them.\n\
        # Pattern D: check rate-limit remaining before paginated API call\nremaining=$(gh\
        \ api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo \"999\"\
        )\nif [ \"$remaining\" -lt 20 ]; then\n  echo \"::warning::Rate limit low\
        \ ($remaining remaining) \u2014 skipping PR conflict check, assuming safe\"\
        \n  echo \"pr_skip=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nPR_COUNT=$(gh\
        \ api \"repos/${REPO}/pulls?base=main&state=open&per_page=1\" \\\n  --jq 'length'\
        \ 2>/dev/null || echo \"0\")\nif [ \"${PR_COUNT}\" -gt \"0\" ]; then\n  echo\
        \ \"pr_skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"\u26D4 **Sweep push deferred**\
        \ \u2014 ${PR_COUNT} open/draft PR(s) targeting \\`main\\`.\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n  echo \"Push will resume once all active PRs are merged.\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nelse\n  echo \"pr_skip=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"\u2705 No\
        \ open/draft PRs targeting \\`main\\` \u2014 sweep push is safe.\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nfi\n"
    - name: "Commit sweep fixes \u2014 main"
      if: steps.rate.outputs.skip != 'true' && steps.sweep.outputs.changed == 'true'
        && github.event.inputs.dry_run != 'true' && steps.pr_guard.outputs.pr_skip
        != 'true'
      uses: ./.github/actions/commit-to-staging-chain
      with:
        message: "fix(ci): nightly codebase health sweep \u2014 staging chain [skip ci]"
        files: ".codex .secrets.baseline docs/admin requirements/lock.txt requirements/base.txt"
    - name: "Append PDA AfterMath entry \u2014 main"
      if: steps.rate.outputs.skip != 'true'
      env:
        CHANGED: ${{ steps.sweep.outputs.changed }}
        CHANGED_FILES: ${{ steps.sweep.outputs.changed_files }}
      run: "TIMESTAMP=$(date -u +\"%Y-%m-%dT%H:%MZ\")\nSTATUS=$( [ \"$CHANGED\" =\
        \ \"true\" ] && echo \"resolved\" || echo \"clean\" )\npython3 - <<PYEOF\n\
        import json, pathlib, datetime\nentry = {\n    \"type\": \"sweep\",\n    \"\
        timestamp\": \"$TIMESTAMP\",\n    \"session\": \"SWEEP-NIGHTLY\",\n    \"\
        branch\": \"main\",\n    \"pattern_id\": \"PLANSET-002-NIGHTLY-SWEEP\",\n\
        \    \"workflow\": \"codebase-health-sweep.yml\",\n    \"status\": \"$STATUS\"\
        ,\n    \"changed_files\": \"$CHANGED_FILES\".split() if \"$CHANGED_FILES\"\
        \ else [],\n    \"root_cause\": \"Scheduled nightly codebase health sweep\"\
        ,\n    \"fix_template\": \"sync_tracked_files --fix + auto_fix_common_issues\"\
        ,\n    \"verification_cmd\": \"python scripts/ci/auto_fix_common_issues.py\
        \ --check-only\",\n    \"copilot_ability_improvement\": \"Run nightly sweep\
        \ before starting any session on main to ensure clean baseline state.\"\n\
        }\npda_path = pathlib.Path(\".codex/aftermath/pda_iterations.jsonl\")\npda_path.parent.mkdir(parents=True,\
        \ exist_ok=True)\nwith open(pda_path, \"a\") as f:\n    f.write(json.dumps(entry)\
        \ + \"\\n\")\nprint(f\"\u2705 PDA AfterMath entry appended: {entry['pattern_id']}\
        \ ({entry['status']})\")\nPYEOF\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  sweep-staging:
    name: "\U0001F9F9 Sweep 0D_base_"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: 'github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch''

      '
    steps:
    - name: Check if 0D_base_ exists
      id: branch_check
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
      run: "if gh api \"repos/${{ github.repository }}/branches/0D_base_\" --silent\
        \ 2>/dev/null; then\n  echo \"exists=true\" >> \"$GITHUB_OUTPUT\"\nelse\n\
        \  echo \"exists=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"\u23ED\uFE0F 0D_base_\
        \ branch not found \u2014 skipping\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: Checkout 0D_base_
      if: steps.branch_check.outputs.exists == 'true'
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: refs/heads/0D_base_
        fetch-depth: 10
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
    - name: Set up Python
      if: steps.branch_check.outputs.exists == 'true'
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install tools
      if: steps.branch_check.outputs.exists == 'true'
      run: "PYTHON_BIN=\"${VENV_PYTHON:-.venv_ci/bin/python}\"\nif ! \"$PYTHON_BIN\"\
        \ -m pip install detect-secrets ruff --quiet 2>/dev/null; then\n  rm -rf .venv_ci\n\
        \  python3 -m venv --clear .venv_ci\n  PYTHON_BIN=\".venv_ci/bin/python\"\n\
        \  \"$PYTHON_BIN\" -m pip install detect-secrets ruff --quiet\nfi\n"
    - name: "Run sweep \u2014 0D_base_"
      id: sweep
      if: steps.branch_check.outputs.exists == 'true'
      run: "echo \"## \U0001F9F9 Codebase Health Sweep \u2014 0D_base_\" >> \"$GITHUB_STEP_SUMMARY\"\
        \npython scripts/ci/sync_tracked_files.py --fix --manifest-only 2>&1 | tee\
        \ /tmp/sweep_staging_sync.txt\ncat /tmp/sweep_staging_sync.txt >> \"$GITHUB_STEP_SUMMARY\"\
        \ || true\npython scripts/ci/auto_fix_common_issues.py 2>&1 | tee /tmp/sweep_staging_fix.txt\n\
        cat /tmp/sweep_staging_fix.txt >> \"$GITHUB_STEP_SUMMARY\" || true\npython\
        \ scripts/tools/doc_metrics_sync.py --fix 2>&1 || true\n\nif git diff --quiet;\
        \ then\n  echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"\u2705 **0D_base_\
        \ is clean**\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"changed=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"changed_files=$(git diff --name-only | tr\
        \ '\\n' ' ')\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: "Active-PR guard \u2014 skip push when any open/draft PR targets 0D_base_"
      id: pr_guard_staging
      if: steps.branch_check.outputs.exists == 'true' && steps.sweep.outputs.changed
        == 'true' && github.event.inputs.dry_run != 'true'
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
      run: "# Pattern D: check rate-limit remaining before paginated API call\nremaining=$(gh\
        \ api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo \"999\"\
        )\nif [ \"$remaining\" -lt 20 ]; then\n  echo \"::warning::Rate limit low\
        \ ($remaining remaining) \u2014 skipping PR conflict check for 0D_base_, assuming\
        \ safe\"\n  echo \"pr_skip=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nPR_COUNT=$(gh\
        \ api \"repos/${REPO}/pulls?base=0D_base_&state=open&per_page=1\" \\\n  --jq\
        \ 'length' 2>/dev/null || echo \"0\")\nif [ \"${PR_COUNT}\" -gt \"0\" ]; then\n\
        \  echo \"pr_skip=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"\u26D4 **0D_base_\
        \ sweep deferred** \u2014 ${PR_COUNT} open/draft PR(s) targeting \\`0D_base_\\\
        `.\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"pr_skip=false\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"\u2705 No open/draft PRs targeting \\`0D_base_\\` \u2014 sweep\
        \ push is safe.\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: "Commit sweep fixes \u2014 0D_base_"
      if: steps.branch_check.outputs.exists == 'true' && steps.sweep.outputs.changed
        == 'true' && github.event.inputs.dry_run != 'true' && steps.pr_guard_staging.outputs.pr_skip
        != 'true'
      run: "git config user.name  \"github-actions[bot]\"\ngit config user.email \"\
        github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit commit -m\
        \ \"fix(ci): nightly codebase health sweep \u2014 0D_base_ [skip ci]\nPatterns\
        \ applied: sync_tracked_files + auto_fix_common_issues\nGenerated by: .github/workflows/codebase-health-sweep.yml\"\
        \ngit pull --rebase --autostash origin 0D_base_ 2>/dev/null || true\ngit push\
        \ origin HEAD:refs/heads/0D_base_\necho \"\u2705 Sweep commit pushed to 0D_base_\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  report-manual-issues:
    name: "\U0001F4CB Report manual-only issues"
    runs-on: ubuntu-latest
    needs:
    - sweep-main
    - sweep-staging
    if: always() && github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: refs/heads/main
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install tools
      run: "PYTHON_BIN=\"${VENV_PYTHON:-.venv_ci/bin/python}\"\nif ! \"$PYTHON_BIN\"\
        \ -m pip install ruff --quiet 2>/dev/null; then\n  rm -rf .venv_ci\n  python3\
        \ -m venv --clear .venv_ci\n  PYTHON_BIN=\".venv_ci/bin/python\"\n  \"$PYTHON_BIN\"\
        \ -m pip install ruff --quiet\nfi\n"
    - name: Check for remaining manual-only issues
      id: manual_check
      run: "mkdir -p .codex\npython scripts/ci/auto_fix_common_issues.py --check-only\
        \ \\\n  --json-output .codex/health-sweep-report.json 2>&1 || true\nTOTAL=$(python3\
        \ -c \"import json; d=json.load(open('.codex/health-sweep-report.json'));\
        \ print(d.get('total_issues', 0))\" 2>/dev/null || echo \"0\")\nAUTO=$(python3\
        \ -c \"import json; d=json.load(open('.codex/health-sweep-report.json'));\
        \ print(d.get('auto_fixable', 0))\" 2>/dev/null || echo \"0\")\nMANUAL=$(python3\
        \ -c \"import json; d=json.load(open('.codex/health-sweep-report.json'));\
        \ print(d.get('manual_review', 0))\" 2>/dev/null || echo \"0\")\necho \"total=${TOTAL}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"auto_fixable=${AUTO}\" >> \"$GITHUB_OUTPUT\"\
        \necho \"manual_review=${MANUAL}\" >> \"$GITHUB_OUTPUT\"\necho \"\U0001F4CA\
        \ Health report: total=${TOTAL}, auto_fixable=${AUTO}, manual_review=${MANUAL}\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Open/update tracking issue for manual-only problems
      if: steps.manual_check.outputs.manual_review != '0'
      uses: actions/github-script@v8
      env:
        TOTAL: ${{ steps.manual_check.outputs.total }}
        MANUAL: ${{ steps.manual_check.outputs.manual_review }}
        AUTO: ${{ steps.manual_check.outputs.auto_fixable }}
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          secrets.GITHUB_TOKEN }}
        script: "const MARKER = '<!-- codebase-health-sweep-tracking -->';\nconst\
          \ date = new Date().toISOString().split('T')[0];\nconst body = `${MARKER}\n\
          ## \U0001F9F9 Codebase Health Sweep \u2014 Manual Issues Requiring Attention\n\
          \n**Date:** ${date}\n**Workflow:** [codebase-health-sweep.yml](${{ github.server_url\
          \ }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nAuto-fixable\
          \ patterns are applied automatically by the nightly sweep.\nThe following\
          \ issues require **manual review** by the Copilot coding agent:\n\n| Metric\
          \ | Count |\n|--------|-------|\n| Total issues found | ${process.env.TOTAL}\
          \ |\n| Auto-fixable (swept) | ${process.env.AUTO} |\n| Manual review needed\
          \ | ${process.env.MANUAL} |\n\n### To resolve:\n\\`\\`\\`bash\n# Check what\
          \ needs manual review\npython scripts/ci/auto_fix_common_issues.py --check-only\
          \ --json-output /tmp/report.json\njq '.issues[] | select(.auto_fix_available\
          \ == false)' /tmp/report.json\n\n# Run the Copilot agent for codebase-wide\
          \ healing\n# @copilot Please run auto_fix_common_issues.py --check-only\
          \ and fix ALL manual-review issues\n\\`\\`\\`\n\n_Auto-generated by \\`codebase-health-sweep.yml\\\
          `. Updates on each nightly run._`;\n\nconst { data: issues } = await github.rest.issues.listForRepo({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  state: 'open',\n\
          \  labels: ['ci-health', 'automation'],\n  per_page: 50,\n});\nconst existing\
          \ = issues.find(i => i.body && i.body.includes(MARKER));\nif (existing)\
          \ {\n  await github.rest.issues.update({\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    issue_number: existing.number,\n    body,\n\
          \  });\n  core.info(`Updated tracking issue  #${existing.number}`);\n} else\
          \ {\n  await github.rest.issues.create({\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    title: `\U0001F9F9 Codebase Health: ${process.env.MANUAL}\
          \ manual-review issues (${date})`,\n    body,\n    labels: ['ci-health',\
          \ 'automation', 'priority-high'],\n  });\n  core.info('Created new tracking\
          \ issue');\n}\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
