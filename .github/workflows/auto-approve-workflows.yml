name: "⚡ Auto-Approve Pending Workflow Runs"
# aais-cache: none  # No pip install — Python used for inline data processing (stdlib only)

# Automatically approves all `action_required` (awaiting-approval) workflow runs
# for opted-in PRs.  Supports four activation modes:
#
#   1. workflow_run  — fires after every Copilot coding agent session completes.
#                      Approves pending runs for the associated PR immediately.
#                      If the PR carries the `wec:auto-approve-once` label, the
#                      label is removed (and the PR body unchecked) after approval,
#                      effectively disabling auto-approve after this one session.
#
#   2. pull_request  — fires when a new commit is pushed to a PR branch.
#                      Guards against the window between push and agent session start.
#
#   3. schedule      — runs every 5 minutes.  Sweeps ALL open PRs unconditionally
#                      and approves any action_required runs for their HEAD SHA.
#                      No opt-in labels or PR body checkboxes required.
#
#   4. workflow_dispatch  — manual trigger with three option checkboxes:
#        • enable_persistent   Add `wec:auto-approve` label + tick the PR body
#                              checkbox.  Auto-approve will fire after EVERY future
#                              Copilot session and every 20-minute schedule sweep
#                              until the owner intentionally removes the label or
#                              unchecks the PR body checkbox (which the WEC gate
#                              detects and propagates as a label removal).
#        • enable_one_session  Add `wec:auto-approve-once` label.  Approves pending
#                              runs NOW and again at the next Copilot session, then
#                              automatically removes the label and unchecks the box.
#        • dry_run             List action_required runs without approving them.
#
# Labels used (created automatically on first use):
#   wec:auto-approve       Persistent opt-in.  Survives all PR body rewrites.
#   wec:auto-approve-once  Single-session opt-in.  Removed after next Copilot session.
#
# Token used: CODEX_MASTER_KEY (or CODEX_BACKUP_KEY) when available, falling back to github.token.
#   CODEX_* keys have `actions: write` scope required to approve workflow runs.
#   github.token fallback works for same-repo PRs (not forks); approval may be skipped/no-op
#   in contexts where the installation token lacks `actions: write`.
#
# S305 — created 2026-04-03 | S302 — schedule + dispatch overhaul 2026-04-06

on:
  # Handler for push events on feature branches (triggers approve-on-push job)
  push:
    branches:
      - 'copilot/**'
      - 'feature/**'

  # Primary: fires after every Copilot agent session (from the default branch).
  workflow_run:
    workflows: ["Copilot coding agent", "🔄 Auto-Post @copilot review After Agent Session"]
    types: [requested, in_progress, completed]

  # Secondary: fires on every new commit push to a PR branch.
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]

  # Hardened trigger: when a review is submitted on an active PR, re-run approver.
  # This helps clear large batches of newly queued action_required runs after owner approval.
  pull_request_review:
    types: [submitted]

  # Periodic sweep: approves pending runs on ALL open PRs every 5 minutes.
  # Schedule triggers run from the DEFAULT BRANCH and are NEVER action_required —
  # this is the primary autonomous approval mechanism.
  schedule:
    - cron: '*/5 * * * *'

  # Manual trigger with full control.
  workflow_dispatch:
    inputs:
      # ── Phase 3 Enhanced Approval Hub Inputs (8 new inputs) ──────────────────
      approval_source:
        description: 'Source of approval (trigger-on-approval, self-approve, agent-auth, workflow-gate, manual)'
        required: false
        type: choice
        options:
          - 'trigger-on-approval'
          - 'self-approve-pending-runs'
          - 'agent-auth-delegation'
          - 'workflow-execution-gate'
          - 'manual'
      approval_intent:
        description: 'Intent of approval (auto_approve, conditional, deny, force_deny)'
        required: false
        type: choice
        options:
          - 'auto_approve_action_required'
          - 'conditional_approve'
          - 'deny'
          - 'force_deny'
      target_run_id:
        description: 'GitHub workflow run ID to approve (optional, overrides auto-discovery)'
        required: false
        type: string
      target_pr:
        description: 'PR number for approval context (can override pr_number if both provided)'
        required: false
        type: string
      approval_reason:
        description: 'Human-readable reason for approval (docs, chore, hotfix, etc.)'
        required: false
        type: string
      approval_ttl_hours:
        description: 'TTL for single-session approval window (1-24 hours, default: 1)'
        required: false
        type: string
        default: '1'
      override_label:
        description: 'Force approval using label even without review (maintainer only, security: use with caution)'
        required: false
        type: string
      # ── Backward-compatible legacy inputs (preserved for existing workflows) ──
      pr_number:
        description: "PR number to apply auto-approve to (required for legacy mode)"
        required: false
        type: string
      enable_persistent:
        description: >
          Enable persistent auto-approve — approves after every Copilot session
          and every 20-minute sweep until explicitly disabled.
          Adds the 'wec:auto-approve' label and ticks the PR body checkbox.
        required: false
        default: false
        type: boolean
      enable_one_session:
        description: >
          Enable for ONE session only — approves pending runs now and after the
          next Copilot session, then automatically removes the opt-in.
          Adds the 'wec:auto-approve-once' label.
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run — list pending runs without approving them"
        required: false
        default: false
        type: boolean

# One approver run per PR (or one schedule sweep) at a time.
# Do NOT cancel in-progress so a new push doesn't kill an ongoing sweep.

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write        # approve workflow runs
  pull-requests: write  # read/edit PR body; add/remove labels
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Section 1a: Push Event Approval Handler
  # ─────────────────────────────────────────────────────────────────────────────
  # Handles approval on push events (workflow_dispatch is handled by evaluate-approval below).
  # This job allows the workflow to execute successfully when triggered by push events.

  approve-on-push:
    name: "⚡ Auto-Approve Pending Runs (Push Event)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve PR for current push
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Find the PR associated with this push branch
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --head "${{ github.ref_name }}" \
            --state open \
            --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::No open PR found for branch ${{ github.ref_name }} — skipping approval"
            echo "pr_number=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "✅ Found PR #$PR_NUMBER for branch ${{ github.ref_name }}"

      - name: Approve pending runs (if PR found)
        if: steps.resolve.outputs.pr_number
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail

          # Execute the approval script for this PR
          python scripts/ci/approve_pending_runs.py 2>&1 || {
            EXIT_CODE=$?
            echo "::warning::approval script exited with code $EXIT_CODE (non-fatal for push event)"
            exit 0
          }

  # ─────────────────────────────────────────────────────────────────────────────
  # Section 2: Enhanced Approval Rule Engine (5-tier priority system)
  # ─────────────────────────────────────────────────────────────────────────────
  # This new job implements the unified approval hub rule evaluation logic.
  # Only runs when invoked via workflow_dispatch with new approval_source input.

  evaluate-approval:
    name: "📋 Evaluate Approval Rules (5-tier priority)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.approval_source != ''
    outputs:
      approval_decision: ${{ steps.evaluate.outputs.decision }}
      rule_matched: ${{ steps.evaluate.outputs.rule }}
      confidence_score: ${{ steps.evaluate.outputs.confidence }}
      target_pr: ${{ steps.evaluate.outputs.target_pr }}
      should_proceed: ${{ steps.evaluate.outputs.should_proceed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "Evaluate 5-tier priority rule system"
        id: evaluate
        env:
          APPROVAL_SOURCE: ${{ github.event.inputs.approval_source }}
          APPROVAL_INTENT: ${{ github.event.inputs.approval_intent }}
          TARGET_PR: ${{ github.event.inputs.target_pr || github.event.inputs.pr_number }}
          OVERRIDE_LABEL: ${{ github.event.inputs.override_label }}
          APPROVAL_REASON: ${{ github.event.inputs.approval_reason }}
          APPROVAL_TTL_HOURS: ${{ github.event.inputs.approval_ttl_hours || '1' }}
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Validate inputs
          if [ -z "$TARGET_PR" ]; then
            echo "decision=SKIP" >> $GITHUB_OUTPUT
            echo "rule=no_target_pr" >> $GITHUB_OUTPUT
            echo "confidence=0.0" >> $GITHUB_OUTPUT
            echo "should_proceed=false" >> $GITHUB_OUTPUT
            echo "::warning::No target PR provided (target_pr or pr_number required)"
            exit 0
          fi

          # Sanitize approval_reason to prevent injection
          SAFE_REASON=$(echo "$APPROVAL_REASON" | sed 's/[^a-zA-Z0-9:_.-]/ /g' | head -c 256)

          # ─────────────────────────────────────────────────────────────────────────
          # Priority 1: Force Deny Intent (instant deny, no processing)
          # ─────────────────────────────────────────────────────────────────────────
          if [ "$APPROVAL_INTENT" = "force_deny" ]; then
            echo "decision=DENY" >> $GITHUB_OUTPUT
            echo "rule=force_deny_intent" >> $GITHUB_OUTPUT
            echo "confidence=1.0" >> $GITHUB_OUTPUT
            echo "target_pr=$TARGET_PR" >> $GITHUB_OUTPUT
            echo "should_proceed=false" >> $GITHUB_OUTPUT
            echo "⛔ Priority 1: Force deny requested — skipping all further evaluation"
            exit 0
          fi

          # ─────────────────────────────────────────────────────────────────────────
          # Priority 2: Persistent Label Rule (wec:auto-approve)
          # ─────────────────────────────────────────────────────────────────────────
          LABELS=$(gh pr view "$TARGET_PR" --repo "$REPO" --json labels -q '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -q "^wec:auto-approve$"; then
            echo "decision=APPROVE" >> $GITHUB_OUTPUT
            echo "rule=persistent_label_rule" >> $GITHUB_OUTPUT
            echo "confidence=1.0" >> $GITHUB_OUTPUT
            echo "target_pr=$TARGET_PR" >> $GITHUB_OUTPUT
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "✅ Priority 2: Persistent label 'wec:auto-approve' matched"
            exit 0
          fi

          # ─────────────────────────────────────────────────────────────────────────
          # Priority 3: Single-Session Label Rule (wec:auto-approve-once)
          # Time-limited approval window based on TTL
          # ─────────────────────────────────────────────────────────────────────────
          if echo "$LABELS" | grep -q "^wec:auto-approve-once$"; then
            CREATED_AT=$(gh pr view "$TARGET_PR" --repo "$REPO" --json createdAt -q '.createdAt' 2>/dev/null || echo "")
            if [ -z "$CREATED_AT" ]; then
              echo "decision=DENY" >> $GITHUB_OUTPUT
              echo "rule=single_session_label_no_timestamp" >> $GITHUB_OUTPUT
              echo "confidence=0.5" >> $GITHUB_OUTPUT
              echo "target_pr=$TARGET_PR" >> $GITHUB_OUTPUT
              echo "should_proceed=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            CREATED_TS=$(date -d "$CREATED_AT" +%s 2>/dev/null || echo "0")
            CURRENT_TS=$(date +%s)
            ELAPSED_HOURS=$(( (CURRENT_TS - CREATED_TS) / 3600 ))
            TTL_INT=${APPROVAL_TTL_HOURS:-1}

            if [ "$ELAPSED_HOURS" -le "$TTL_INT" ]; then
              echo "decision=APPROVE" >> $GITHUB_OUTPUT
              echo "rule=single_session_label_rule" >> $GITHUB_OUTPUT
              echo "confidence=1.0" >> $GITHUB_OUTPUT
              echo "target_pr=$TARGET_PR" >> $GITHUB_OUTPUT
              echo "should_proceed=true" >> $GITHUB_OUTPUT
              echo "✅ Priority 3: Single-session label within TTL ($ELAPSED_HOURS/$TTL_INT hours)"
              exit 0
            else
              echo "decision=DENY" >> $GITHUB_OUTPUT
              echo "rule=single_session_expired" >> $GITHUB_OUTPUT
              echo "confidence=0.95" >> $GITHUB_OUTPUT
              echo "target_pr=$TARGET_PR" >> $GITHUB_OUTPUT
              echo "should_proceed=false" >> $GITHUB_OUTPUT
              echo "⏰ Priority 3: Single-session label expired ($ELAPSED_HOURS > $TTL_INT hours)"
              exit 0
            fi
          fi

          # ─────────────────────────────────────────────────────────────────────────
          # Priority 4: Maintainer Approval Rule
          # Check if PR has been approved by maintainer (@mbaetiong)
          # ─────────────────────────────────────────────────────────────────────────
          APPROVER=$(gh pr view "$TARGET_PR" --repo "$REPO" --json reviews -q '.reviews[] | select(.state=="APPROVED") | .author.login' 2>/dev/null | head -1 || echo "")
          if [ "$APPROVER" = "mbaetiong" ]; then
            echo "decision=APPROVE" >> $GITHUB_OUTPUT
            echo "rule=maintainer_approval_rule" >> $GITHUB_OUTPUT
            echo "confidence=0.99" >> $GITHUB_OUTPUT
            echo "target_pr=$TARGET_PR" >> $GITHUB_OUTPUT
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "✅ Priority 4: Maintainer approval from @$APPROVER"
            exit 0
          fi

          # ─────────────────────────────────────────────────────────────────────────
          # Priority 5: Low-Risk Approval Reason Rule
          # Patterns: docs:, chore:, etc.
          # ─────────────────────────────────────────────────────────────────────────
          if [[ "$SAFE_REASON" =~ ^(docs|chore|test|refactor) ]]; then
            echo "decision=APPROVE" >> $GITHUB_OUTPUT
            echo "rule=low_risk_reason_rule" >> $GITHUB_OUTPUT
            echo "confidence=0.85" >> $GITHUB_OUTPUT
            echo "target_pr=$TARGET_PR" >> $GITHUB_OUTPUT
            echo "should_proceed=true" >> $GITHUB_OUTPUT
            echo "✅ Priority 5: Low-risk reason matched: $SAFE_REASON"
            exit 0
          fi

          # ─────────────────────────────────────────────────────────────────────────
          # Fallback: No matching rule — default DENY
          # ─────────────────────────────────────────────────────────────────────────
          echo "decision=DENY" >> $GITHUB_OUTPUT
          echo "rule=no_matching_rule" >> $GITHUB_OUTPUT
          echo "confidence=0.0" >> $GITHUB_OUTPUT
          echo "target_pr=$TARGET_PR" >> $GITHUB_OUTPUT
          echo "should_proceed=false" >> $GITHUB_OUTPUT
          echo "⛔ Fallback: No matching approval rule found"

  # ─────────────────────────────────────────────────────────────────────────────
  # Section 2b: Enhanced Approval Execution Job
  # ─────────────────────────────────────────────────────────────────────────────
  # This job executes the approval after rule evaluation, with token chain
  # resolution and audit logging.

  execute-approval:
    name: "⚡ Execute Approval Decision"
    needs: evaluate-approval
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      needs.evaluate-approval.outputs.should_proceed == 'true' &&
      needs.evaluate-approval.outputs.approval_decision == 'APPROVE'
    permissions:
      actions: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: "Resolve token chain (Tier 1-4 with fallbacks)"
        id: token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Tier 1: Cognitive Brain App token (not available in this job context)
          # (available in approve-original job via step id "app-token")

          # Tier 2: CODEX_MASTER_KEY (primary PAT)
          if [ -n "${{ secrets.CODEX_MASTER_KEY || '' }}" ]; then
            echo "token=${{ secrets.CODEX_MASTER_KEY }}" >> $GITHUB_OUTPUT
            echo "token_source=CODEX_MASTER_KEY" >> $GITHUB_OUTPUT
            echo "Resolved: Using CODEX_MASTER_KEY (Tier 2)"
            exit 0
          fi

          # Tier 3: CODEX_BACKUP_KEY (fallback PAT)
          if [ -n "${{ secrets.CODEX_BACKUP_KEY || '' }}" ]; then
            echo "token=${{ secrets.CODEX_BACKUP_KEY }}" >> $GITHUB_OUTPUT
            echo "token_source=CODEX_BACKUP_KEY" >> $GITHUB_OUTPUT
            echo "Resolved: Using CODEX_BACKUP_KEY (Tier 3)"
            exit 0
          fi

          # Tier 4: github.token (limited scope, same-repo only)
          echo "token=${{ github.token }}" >> $GITHUB_OUTPUT
          echo "token_source=github_token" >> $GITHUB_OUTPUT
          echo "Resolved: Using github.token (Tier 4, limited scope)"

      - name: "Approve workflow run(s)"
        id: approve
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.event.inputs.target_run_id }}
          TARGET_PR: ${{ needs.evaluate-approval.outputs.target_pr }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$TARGET_PR" ]; then
            echo "::warning::No target PR resolved — skipping approval execution"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN MODE: Would approve run $RUN_ID for PR #$TARGET_PR"
            exit 0
          fi

          # If specific run ID provided, approve that run
          if [ -n "$RUN_ID" ]; then
            gh run approve "$RUN_ID" 2>/dev/null && \
              echo "✅ Approved run #$RUN_ID" || \
              echo "⚠️ Could not approve run #$RUN_ID (may already be approved)"
            exit 0
          fi

          # Otherwise, discover and approve pending runs for this PR
          HEAD_SHA=$(gh pr view "$TARGET_PR" --repo "$REPO" --json headRefOid -q '.headRefOid' 2>/dev/null || echo "")
          if [ -z "$HEAD_SHA" ]; then
            echo "::warning::Could not resolve HEAD SHA for PR #$TARGET_PR"
            exit 0
          fi

          # High-volume detection: If >10 pending runs, use 6-pass approach
          PENDING_COUNT=$(gh run list --repo "$REPO" --status action_required --json databaseId 2>/dev/null | grep -c '.' || echo "0")

          if [ "$PENDING_COUNT" -ge 10 ]; then
            echo "📦 High-volume detected: $PENDING_COUNT pending runs; using 6-pass approach"
            for PASS in {1..6}; do
              echo "Pass $PASS/6..."
              BATCH=$(gh run list --repo "$REPO" --status action_required --json databaseId -q '.[].databaseId' 2>/dev/null | head -n 5 || echo "")
              for BATCH_RUN in $BATCH; do
                gh run approve "$BATCH_RUN" 2>/dev/null && echo "  ✅ Approved run #$BATCH_RUN" || true
                sleep 2  # 2-second delay between approvals
              done
              [ "$PASS" -lt 6 ] && sleep 12  # 12-second delay between passes
            done
          else
            echo "🔍 Finding action_required runs for SHA ${HEAD_SHA:0:12}..."
            RUNS=$(gh run list --repo "$REPO" --status action_required --json databaseId,name -q '.[]' 2>/dev/null || echo "")
            if [ -z "$RUNS" ]; then
              echo "ℹ️  No action_required runs found"
            else
              echo "$RUNS" | while read -r RUN_JSON; do
                RUN_ID=$(echo "$RUN_JSON" | jq -r '.databaseId' 2>/dev/null || echo "")
                RUN_NAME=$(echo "$RUN_JSON" | jq -r '.name' 2>/dev/null || echo "unknown")
                if [ -n "$RUN_ID" ]; then
                  gh run approve "$RUN_ID" 2>/dev/null && echo "✅ Approved: $RUN_NAME (#$RUN_ID)" || true
                fi
              done
            fi
          fi

      - name: "Log approval to audit trail"
        if: always() && needs.evaluate-approval.outputs.should_proceed == 'true'
        env:
          RULE_MATCHED: ${{ needs.evaluate-approval.outputs.rule_matched }}
          CONFIDENCE: ${{ needs.evaluate-approval.outputs.confidence_score }}
          TARGET_PR: ${{ needs.evaluate-approval.outputs.target_pr }}
          APPROVAL_SOURCE: ${{ github.event.inputs.approval_source }}
          APPROVAL_REASON: ${{ github.event.inputs.approval_reason }}
          TOKEN_SOURCE: ${{ steps.token.outputs.token_source }}
          REPO: ${{ github.repository }}
          TIMESTAMP: ${{ github.event.repository.updated_at }}
        run: |
          set -euo pipefail

          # Generate UUID for approval record
          APPROVAL_ID=$(uuidgen 2>/dev/null || python3 -c "import uuid; print(uuid.uuid4())")

          # Create audit log entry (JSONL format for append-only)
          cat >> .codex/approvals.jsonl << EOF
          {"approval_id":"$APPROVAL_ID","timestamp":"$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')","run_id":"${{ github.event.inputs.target_run_id }}","pr_number":"$TARGET_PR","approval_source":"$APPROVAL_SOURCE","rule_matched":"$RULE_MATCHED","confidence":$CONFIDENCE}
          EOF

          # Commit audit log (best effort, non-fatal if fails)
          git config user.name "GitHub Action" || true
          git config user.email "action@github.com" || true
          git add .codex/approvals.jsonl || true
          git commit -m "audit: Log approval via $APPROVAL_SOURCE (PR #$TARGET_PR, rule: $RULE_MATCHED)" || true
          git push || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Section 2c: Cleanup Job
  # ─────────────────────────────────────────────────────────────────────────────
  cleanup-single-session:
    name: "🧹 Cleanup Single-Session Label"
    needs: [evaluate-approval, execute-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      needs.evaluate-approval.outputs.should_proceed == 'true' &&
      (github.event.inputs.approval_source == 'self-approve-pending-runs' ||
       github.event.inputs.approval_source == 'trigger-on-approval')
    permissions:
      pull-requests: write
    steps:
      - name: Remove single-session label if present
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          TARGET_PR: ${{ needs.evaluate-approval.outputs.target_pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$TARGET_PR" ]; then
            exit 0
          fi

          # Only cleanup if single-session mode was used
          LABELS=$(gh pr view "$TARGET_PR" --repo "$REPO" --json labels -q '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -q "^wec:auto-approve-once$"; then
            gh pr edit "$TARGET_PR" --repo "$REPO" --remove-label "wec:auto-approve-once" 2>/dev/null && \
              echo "✅ Removed single-session label 'wec:auto-approve-once'" || \
              echo "⚠️ Could not remove label (non-fatal)"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Section 3: Telemetry & Monitoring
  # ─────────────────────────────────────────────────────────────────────────────
  publish-metrics:
    name: "📊 Publish Approval Metrics"
    needs: [evaluate-approval, execute-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && github.event.inputs.approval_source != ''
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: "Publish metrics to artifact"
        env:
          APPROVAL_SOURCE: ${{ github.event.inputs.approval_source }}
          RULE_MATCHED: ${{ needs.evaluate-approval.outputs.rule_matched }}
          CONFIDENCE: ${{ needs.evaluate-approval.outputs.confidence_score }}
          DECISION: ${{ needs.evaluate-approval.outputs.approval_decision }}
        run: |
          set -euo pipefail

          # Create metrics directory
          mkdir -p .codex/metrics

          # Append hourly metric (JSONL format)
          cat >> .codex/metrics/hourly.jsonl << EOF
          {"timestamp":"$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')","approval_source":"$APPROVAL_SOURCE","rule_matched":"$RULE_MATCHED","decision":"$DECISION","confidence":$CONFIDENCE}
          EOF

          # Commit metrics (best effort)
          git config user.name "GitHub Action" || true
          git config user.email "action@github.com" || true
          git add .codex/metrics/hourly.jsonl || true
          git commit -m "metric: Approval telemetry for $APPROVAL_SOURCE" || true
          git push || true

  # ─────────────────────────────────────────────────────────────────────────────
  # Section 4: Original Auto-Approve Job (backward compatibility)
  # ─────────────────────────────────────────────────────────────────────────────

  approve-original:
    name: "⚡ Approve pending workflow runs"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TRICKLE_POLITE_SLEEP: "1.0"   # scheduled workflow — not time-critical

    steps:
      # ── Step CB: Generate Cognitive Brain App token (highest privilege) ──────
      # The CB App is an installed admin app — its token is NOT subject to the
      # action_required restrictions that affect PATs from bot pushes.
      - name: "Generate Cognitive Brain App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        continue-on-error: true   # gracefully falls through to PAT
        with:
          app-id: ${{ secrets._GITHUB_APP_ID }}
          private-key: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}

      # ── Step 0: Configure persistent / one-session mode (workflow_dispatch only) ──
      - name: "Configure auto-approve mode"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          ENABLE_PERSISTENT: ${{ github.event.inputs.enable_persistent }}
          ENABLE_ONE_SESSION: ${{ github.event.inputs.enable_one_session }}
        run: |
          set -euo pipefail

          # ── Ensure labels exist in the repo ────────────────────────────────
          for LABEL in "wec:auto-approve" "wec:auto-approve-once"; do
            ENCODED="${LABEL//:/%3A}"
            gh api "repos/${REPO}/labels/${ENCODED}" &>/dev/null || \
              gh api --method POST "repos/${REPO}/labels" \
                -f name="${LABEL}" \
                -f color="0075ca" \
                -f description="Auto-Approve Pending Workflow Runs opt-in" \
                2>/dev/null || true
          done

          # ── Persistent mode ────────────────────────────────────────────────
          if [ "${ENABLE_PERSISTENT}" = "true" ]; then
            echo "⚙️  Persistent mode: adding 'wec:auto-approve' label..."
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
              -f 'labels[]=wec:auto-approve' 2>/dev/null || true

            echo "📝 Updating PR body: setting [x] auto-approve-workflows..."
            BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body -q '.body // ""' 2>/dev/null || echo "")
            printf '%s' "${BODY}" > /tmp/_aaw_body.txt
            python3 -c "import re,sys; b=open('/tmp/_aaw_body.txt').read(); b=re.sub(r'(?m)(^[ \t]*-[ \t]*\[) \]([ \t]+auto-approve-workflows)',r'\1x]\2',b); sys.stdout.write(b)" \
              > /tmp/_aaw_body_out.txt
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" \
              --body "$(cat /tmp/_aaw_body_out.txt)" \
              && echo "✅ PR body updated: [x] auto-approve-workflows" \
              || echo "::warning::Could not update PR body (non-fatal — label is the primary gate)."
          fi

          # ── One-session mode ───────────────────────────────────────────────
          if [ "${ENABLE_ONE_SESSION}" = "true" ]; then
            echo "⚙️  One-session mode: adding 'wec:auto-approve-once' label..."
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
              -f 'labels[]=wec:auto-approve-once' 2>/dev/null || true
            echo "✅ Label 'wec:auto-approve-once' added — will auto-disable after next Copilot session."
          fi

      # ── Step 1: Resolve target PR(s) and HEAD SHA(s) ───────────────────────
      - name: "Resolve target PR(s)"
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REVIEW_NUMBER: ${{ github.event.pull_request.number }}
          PR_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

          # ── Schedule: find ALL open PRs (unconditional — always-on) ─────────
          if [ "${EVENT_NAME}" = "schedule" ]; then
            echo "🕐 Schedule sweep — finding all open PRs..."

            # Pattern D: paginate with rate-limit guard (stop if remaining < 20)
            ALL_PRS=""
            page=1
            while true; do
              remaining=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo "999")
              if [ "$remaining" -lt 20 ]; then
                echo "::warning::Rate limit low ($remaining remaining) — stopping PR pagination at page $page"
                break
              fi
              batch=$(gh api "repos/${REPO}/pulls?state=open&per_page=100&page=${page}" \
                -q '.[].number' 2>/dev/null)
              [ -z "$batch" ] && break
              ALL_PRS="${ALL_PRS} ${batch}"
              count=$(echo "$batch" | wc -w)
              [ "$count" -lt 100 ] && break
              page=$(( page + 1 ))
              sleep "${GH_TRICKLE_POLITE_SLEEP:-1.0}"
            done
            ALL_PRS=$(echo "$ALL_PRS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs || echo "")

            if [ -z "${ALL_PRS}" ]; then
              echo "ℹ️  No open PRs found — nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Found open PRs: ${ALL_PRS}"
              echo "pr_list=${ALL_PRS}" >> "$GITHUB_OUTPUT"
              echo "mode=schedule"      >> "$GITHUB_OUTPUT"
              echo "skip=false"         >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # ── Single-PR path (workflow_run / pull_request / workflow_dispatch) ─
          echo "mode=single" >> "$GITHUB_OUTPUT"

          PR_NUM=""
          if   [ -n "${WR_PR_NUMBER:-}" ]; then PR_NUM="${WR_PR_NUMBER}"
          elif [ -n "${PR_NUMBER:-}"    ]; then PR_NUM="${PR_NUMBER}"
          elif [ -n "${PR_REVIEW_NUMBER:-}" ]; then PR_NUM="${PR_REVIEW_NUMBER}"
          elif [ -n "${INPUT_PR:-}"     ]; then PR_NUM="${INPUT_PR}"
          fi

          if [ -z "${PR_NUM}" ]; then
            echo "::warning::Could not determine PR number — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_SHA=""
          if   [ -n "${WR_HEAD_SHA:-}"  ]; then HEAD_SHA="${WR_HEAD_SHA}"
          elif [ -n "${PR_HEAD_SHA:-}"  ]; then HEAD_SHA="${PR_HEAD_SHA}"
          elif [ -n "${PR_REVIEW_HEAD_SHA:-}" ]; then HEAD_SHA="${PR_REVIEW_HEAD_SHA}"
          else
            HEAD_SHA=$(gh pr view "${PR_NUM}" --repo "${REPO}" \
              --json headRefOid -q '.headRefOid' 2>/dev/null || echo "")
          fi

          if [ -z "${HEAD_SHA}" ]; then
            echo "::warning::Could not determine HEAD SHA — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=${PR_NUM}"   >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}"  >> "$GITHUB_OUTPUT"
          echo "skip=false"            >> "$GITHUB_OUTPUT"
          echo "Resolved: PR #${PR_NUM}, SHA=${HEAD_SHA:0:12}"

      # ── Step 2+3: Check enabled and approve pending runs ───────────────────
      - name: "Approve pending (action_required) workflow runs"
        id: approve
        if: steps.resolve.outputs.skip != 'true'
        continue-on-error: true  # transient rate-limits must not fail the job
        uses: actions/github-script@v8 # v9
        env:
          MODE: ${{ steps.resolve.outputs.mode }}
          PR_LIST: ${{ steps.resolve.outputs.pr_list || '' }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number || '' }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha || '' }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          HIGH_VOLUME_THRESHOLD: ${{ vars.CODEX_AUTO_APPROVE_HIGH_VOLUME_THRESHOLD || '10' }}
          HIGH_VOLUME_MAX_PASSES: ${{ vars.CODEX_AUTO_APPROVE_MAX_PASSES || '6' }}
          PASS_DELAY_MS: ${{ vars.CODEX_AUTO_APPROVE_PASS_DELAY_MS || '12000' }}
          ACTIVE_AGENT_HINT: ${{ github.event.workflow_run.status || '' }}
          REPO: ${{ github.repository }}
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          script: |
            const [owner, repo] = process.env.REPO.split('/');
            const dryRun        = process.env.DRY_RUN === 'true';
            const mode          = process.env.MODE;
            const highVolumeThreshold = parseInt(process.env.HIGH_VOLUME_THRESHOLD || '10', 10);
            const configuredMaxPasses = parseInt(process.env.HIGH_VOLUME_MAX_PASSES || '6', 10);
            const passDelayMs = parseInt(process.env.PASS_DELAY_MS || '12000', 10);
            const activeAgentHint = (process.env.ACTIVE_AGENT_HINT || '').toLowerCase();

            // ── Helpers ──────────────────────────────────────────────────────
            // ALWAYS-ON: Copilot is mandated to approve on behalf of the human admin.
            // No opt-in labels or PR body checkboxes are required.
            async function isEnabled(_prNum) {
              return true;
            }

            async function getHeadSha(prNum) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: parseInt(prNum),
              });
              return pr.head.sha;
            }

            async function listActionRequiredRuns(headSha) {
              let allRuns = [], page = 1;
              while (true) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, status: 'action_required',
                  head_sha: headSha, per_page: 100, page,
                });
                allRuns = allRuns.concat(data.workflow_runs);
                if (data.workflow_runs.length < 100) break;
                page++;
              }
              return allRuns;
            }

            async function approvePR(prNum, headSha) {
              core.info(`\n── PR #${prNum} @ ${headSha.slice(0,12)} ──────────────────────`);

              // Enumerate action_required runs for this SHA
              let allRuns = await listActionRequiredRuns(headSha);

              core.info(`   Found ${allRuns.length} run(s) with status=action_required`);
              if (allRuns.length === 0) {
                core.info('   Nothing to approve.');
                return { prNum, headSha, approved: 0, skipped: 0, errors: 0, results: [] };
              }

              let approved = 0, skipped = 0, errors = 0;
              const results = [];

              const activeCopilotSession = activeAgentHint === 'requested' || activeAgentHint === 'in_progress';
              const maxPasses = (allRuns.length >= highVolumeThreshold || activeCopilotSession)
                ? Math.max(2, configuredMaxPasses)
                : 1;
              if (maxPasses > 1) {
                if (activeCopilotSession) {
                  core.info(`   Active Copilot agent session detected (${activeAgentHint}). Running up to ${maxPasses} approval passes.`);
                } else {
                  core.info(`   High-volume queue detected (>=${highVolumeThreshold}). Running up to ${maxPasses} approval passes.`);
                }
              }

              const processedRunIds = new Set();
              for (let pass = 1; pass <= maxPasses; pass++) {
                if (pass > 1) {
                  await new Promise(resolve => setTimeout(resolve, passDelayMs));
                  allRuns = await listActionRequiredRuns(headSha);
                  core.info(`   Pass ${pass}/${maxPasses}: found ${allRuns.length} remaining action_required run(s).`);
                  if (allRuns.length === 0) break;
                }

                for (const run of allRuns) {
                  if (processedRunIds.has(run.id)) continue;
                  processedRunIds.add(run.id);

                  const label = `${run.name || run.workflow_id} (run #${run.id})`;
                  if (dryRun) {
                    core.info(`[DRY] Would approve: ${label}`);
                    results.push({ label, status: '🔍 dry-run' });
                    approved++;
                    continue;
                  }
                  try {
                    await github.rest.actions.approveWorkflowRun({ owner, repo, run_id: run.id });
                    core.info(`✅ Approved: ${label}`);
                    results.push({ label, status: '✅ approved' });
                    approved++;
                  } catch (e) {
                    if (e.status === 422 || e.status === 409) {
                      core.info(`⏭️  Already processed: ${label}`);
                      results.push({ label, status: '⏭️ already processed' });
                      skipped++;
                    } else if (e.message && e.message.includes('not from a fork pull request')) {
                      // Same-repo PRs: approveWorkflowRun may return this message.
                      // Fallback: re-run the workflow run via REST using the same token.
                      core.info(`🔄 Same-repo PR — using REST rerun fallback for: ${label}`);
                      try {
                        await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {
                          owner,
                          repo,
                          run_id: run.id,
                        });
                        core.info(`✅ REST rerun requested: ${label}`);
                        results.push({ label, status: '✅ rerun (same-repo)' });
                        approved++;
                      } catch (rerunErr) {
                        core.info(`⏭️  REST rerun skipped (may already be approved): ${label}`);
                        results.push({ label, status: '⏭️ rerun skipped' });
                        skipped++;
                      }
                    } else {
                      core.warning(`❌ Failed to approve ${label}: ${e.message}`);
                      results.push({ label, status: `❌ error: ${e.message}` });
                      errors++;
                    }
                  }
                }
              }
              return { prNum, headSha, approved, skipped, errors, results };
            }

            // ── Build target list ─────────────────────────────────────────────
            let targets = [];  // [{prNum, headSha}]
            if (mode === 'schedule') {
              const prNums = process.env.PR_LIST.trim().split(/\s+/).filter(Boolean);
              core.info(`⏰ Schedule sweep (always-on): ${prNums.length} open PR(s) — ${prNums.join(', ')}`);
              for (const prNum of prNums) {
                // For schedule, label presence already confirmed — skip re-check
                try {
                  const headSha = await getHeadSha(prNum);
                  targets.push({ prNum, headSha });
                } catch (e) {
                  core.warning(`⚠️ Could not resolve head SHA for PR #${prNum} (${e?.message || String(e)}) — skipping`);
                }
              }
            } else {
              const prNum  = process.env.PR_NUMBER;
              const headSha = process.env.HEAD_SHA;
              // Always-on: no opt-in gate — Copilot approves on behalf of human admin.
              targets.push({ prNum, headSha });
            }

            // ── Approve all targets ───────────────────────────────────────────
            const allResults = [];
            let totalErrors = 0;
            for (const { prNum, headSha } of targets) {
              const r = await approvePR(prNum, headSha);
              allResults.push(r);
              totalErrors += r.errors;
            }

            // ── Job summary ───────────────────────────────────────────────────
            const lines = [
              `## ⚡ Auto-Approve — ${targets.length > 1 ? `${targets.length} PRs` : `PR #${targets[0].prNum}`}`,
              '',
              `| PR | HEAD SHA | Approved | Skipped | Errors |`,
              `|----|---------|---------|---------|--------|`,
            ];
            for (const r of allResults) {
              lines.push(`| #${r.prNum} | \`${r.headSha.slice(0,12)}\` | **${r.approved}** | ${r.skipped} | ${r.errors} |`);
            }
            lines.push('');
            lines.push(`_Mode: ${dryRun ? '🔍 DRY RUN' : '🚀 LIVE'} · Trigger: ${context.eventName} · ${new Date().toISOString()}_`);
            core.summary.addRaw('\n' + lines.join('\n') + '\n');
            await core.summary.write();

            if (totalErrors > 0) {
              core.setFailed(`${totalErrors} run(s) failed to be approved — check the logs above`);
            }

      # ── Step 3b: Active-agent monitor (60-minute window) ───────────────────
      # During an active Copilot coding/cloud-agent session, keep approving new
      # action_required runs and continuously verify that no workflow run fails.
      - name: "Monitor active Copilot session (60m)"
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Copilot coding agent' && github.event.workflow_run.status == 'in_progress'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          MONITOR_MINUTES: ${{ vars.CODEX_AUTO_APPROVE_MONITOR_MINUTES || '60' }}
          MONITOR_INTERVAL_SEC: ${{ vars.CODEX_AUTO_APPROVE_MONITOR_INTERVAL_SEC || '120' }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ]; then
            echo "ℹ️ No PR number resolved for active-session monitor; skipping."
            exit 0
          fi

          DURATION_SEC=$(( MONITOR_MINUTES * 60 ))
          START_TS=$(date +%s)
          END_TS=$(( START_TS + DURATION_SEC ))
          HAS_FAILURE=0

          echo "### ⏱️ Active Copilot Session Monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Window: ${MONITOR_MINUTES} minute(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Interval: ${MONITOR_INTERVAL_SEC}s" >> "$GITHUB_STEP_SUMMARY"

          while [ "$(date +%s)" -lt "${END_TS}" ]; do
            HEAD_SHA=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid -q '.headRefOid' 2>/dev/null || echo "")
            if [ -z "${HEAD_SHA}" ]; then
              echo "::warning::Could not resolve current PR head SHA for #${PR_NUMBER}; retrying."
              sleep "${MONITOR_INTERVAL_SEC}"
              continue
            fi

            echo "🔄 Monitor pass at $(date -u +%Y-%m-%dT%H:%M:%SZ) for SHA ${HEAD_SHA:0:12}"
            REPO="${REPO}" HEAD_SHA="${HEAD_SHA}" PR_NUMBER="${PR_NUMBER}" MAX_WAIT_SEC=15 \
              python scripts/ci/approve_pending_runs.py || true

            FAILURES=$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&status=completed&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="startup_failure") | "- #\(.id) \(.name) (\(.conclusion))"' 2>/dev/null || true)
            if [ -n "${FAILURES}" ]; then
              HAS_FAILURE=1
              echo "❌ Detected failing workflow run(s) during active session monitor window:"
              echo "${FAILURES}"
              {
                echo ""
                echo "#### ❌ Failures detected during active-session monitor"
                echo "${FAILURES}"
              } >> "$GITHUB_STEP_SUMMARY"
              break
            fi

            sleep "${MONITOR_INTERVAL_SEC}"
          done

          if [ "${HAS_FAILURE}" -eq 0 ]; then
            echo "✅ No workflow failures detected during active monitor window." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Workflow failures detected during active Copilot session monitor window."
            exit 1
          fi
