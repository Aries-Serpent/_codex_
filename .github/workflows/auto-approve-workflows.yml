name: "\u26A1 Auto-Approve Pending Workflow Runs"
'on':
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows:
      - Copilot coding agent
      - "\U0001F504 Auto-Post @copilot review After Agent Session"
    types: [requested, in_progress, completed]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      approval_source:
        description: Audit source; never independent approval authority
        required: false
        type: choice
        options:
          - trigger-on-approval
          - self-approve-pending-runs
          - agent-auth-delegation
          - workflow-execution-gate
          - manual
      approval_intent:
        description: Requested workflow-run inspection; denial always takes precedence
        required: false
        type: choice
        options: [auto_approve_action_required, conditional_approve, deny, force_deny]
      target_run_id:
        description: Optional exact run ID, constrained to the current PR head
        required: false
        type: string
      target_pr:
        description: Required PR number for manual dispatch
        required: false
        type: string
      approval_reason:
        description: Audit reason; never a substitute for independent current-head review
        required: false
        type: string
      approval_ttl_hours:
        description: Compatibility input; cannot extend the fixed one-hour once grant
        required: false
        type: string
        default: '1'
      dry_run:
        description: Inspect authorization without approving workflow runs
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  APPROVAL_INTENT: ${{ github.event.inputs.approval_intent || '' }}
jobs:
  approve-original:
    name: Approve independently reviewed pending workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the published default-branch workflow can receive approval credentials.
    if: >-
      endsWith(github.workflow_ref, format('@refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    permissions:
      contents: read
      actions: write
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted approval helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Approve only labelled current PR runs
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets._GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets._GITHUB_APP_INSTALLATION_ID }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.target_pr }}
          TARGET_RUN_ID: ${{ github.event.inputs.target_run_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_WAIT_SEC: '30'
        run: |
          set -euo pipefail
          python3 scripts/ci/approve_pending_runs.py
      - name: Upload approval decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: approval-decision
          path: approval-decision.json
          if-no-files-found: error
