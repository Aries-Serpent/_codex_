name: "\u26A1 Auto-Approve Pending Workflow Runs"
on:
  push:
    branches:
    - copilot/**
    - feature/**
  workflow_run:
    workflows:
    - Copilot coding agent
    - "\U0001F504 Auto-Post @copilot review After Agent Session"
    types:
    - requested
    - in_progress
    - completed
  pull_request:
    types:
    - synchronize
    - opened
    - reopened
    - ready_for_review
  pull_request_review:
    types:
    - submitted
  schedule:
  - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      approval_source:
        description: Source of approval (trigger-on-approval, self-approve, agent-auth,
          workflow-gate, manual)
        required: false
        type: choice
        options:
        - trigger-on-approval
        - self-approve-pending-runs
        - agent-auth-delegation
        - workflow-execution-gate
        - manual
      approval_intent:
        description: Intent of approval (auto_approve, conditional, deny, force_deny)
        required: false
        type: choice
        options:
        - auto_approve_action_required
        - conditional_approve
        - deny
        - force_deny
      target_run_id:
        description: GitHub workflow run ID to approve (optional, overrides auto-discovery)
        required: false
        type: string
      target_pr:
        description: PR number for approval context
        required: false
        type: string
      approval_reason:
        description: Human-readable reason for approval (docs, chore, hotfix, etc.)
        required: false
        type: string
      approval_ttl_hours:
        description: 'TTL for single-session approval window (1-24 hours, default:
          1)'
        required: false
        type: string
        default: '1'
      override_label:
        description: 'Force approval using label even without review (maintainer only,
          security: use with caution)'
        required: false
        type: string
      enable_persistent:
        description: "Enable persistent auto-approve \u2014 approves after every Copilot\
          \ session and every 20-minute sweep until explicitly disabled. Adds the\
          \ 'wec:auto-approve' label and ticks the PR body checkbox.\n"
        required: false
        default: false
        type: boolean
      enable_one_session:
        description: "Enable for ONE session only \u2014 approves pending runs now\
          \ and after the next Copilot session, then automatically removes the opt-in.\
          \ Adds the 'wec:auto-approve-once' label.\n"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run \u2014 list pending runs without approving them"
        required: false
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  actions: write
  pull-requests: write
  contents: read
jobs:
  approve-on-push:
    name: "\u26A1 Auto-Approve Pending Runs (Push Event)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Resolve PR for current push
      id: resolve
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
      run: "set -euo pipefail\n\n# Find the PR associated with this push branch\n\
        PR_NUMBER=$(gh pr list \\\n  --repo \"$REPO\" \\\n  --head \"${{ github.ref_name\
        \ }}\" \\\n  --state open \\\n  --json number -q '.[0].number' 2>/dev/null\
        \ || echo \"\")\n\nif [ -z \"$PR_NUMBER\" ]; then\n  echo \"::notice::No open\
        \ PR found for branch ${{ github.ref_name }} \u2014 skipping approval\"\n\
        \  echo \"pr_number=\" >> $GITHUB_OUTPUT\n  exit 0\nfi\n\necho \"pr_number=$PR_NUMBER\"\
        \ >> $GITHUB_OUTPUT\necho \"\u2705 Found PR  #$PR_NUMBER for branch ${{ github.ref_name\
        \ }}\"\n"
    - name: Approve pending runs (if PR found)
      if: steps.resolve.outputs.pr_number
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.sha }}
        PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
      run: "set -euo pipefail\n\n# Execute the approval script for this PR\npython\
        \ scripts/ci/approve_pending_runs.py 2>&1 || {\n  EXIT_CODE=$?\n  echo \"\
        ::warning::approval script exited with code $EXIT_CODE (non-fatal for push\
        \ event)\"\n  exit 0\n}\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  evaluate-approval:
    name: "\U0001F4CB Evaluate Approval Rules (5-tier priority)"
    runs-on: ubuntu-latest
    if: 'github.event_name == ''workflow_dispatch'' &&

      github.event.inputs.approval_source != ''''

      '
    outputs:
      approval_decision: ${{ steps.evaluate.outputs.decision }}
      rule_matched: ${{ steps.evaluate.outputs.rule }}
      confidence_score: ${{ steps.evaluate.outputs.confidence }}
      target_pr: ${{ steps.evaluate.outputs.target_pr }}
      should_proceed: ${{ steps.evaluate.outputs.should_proceed }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Evaluate 5-tier priority rule system
      id: evaluate
      env:
        APPROVAL_SOURCE: ${{ github.event.inputs.approval_source }}
        APPROVAL_INTENT: ${{ github.event.inputs.approval_intent }}
        TARGET_PR: ${{ github.event.inputs.target_pr }}
        OVERRIDE_LABEL: ${{ github.event.inputs.override_label }}
        APPROVAL_REASON: ${{ github.event.inputs.approval_reason }}
        APPROVAL_TTL_HOURS: ${{ github.event.inputs.approval_ttl_hours || '1' }}
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
      run: "set -euo pipefail\n\n# Validate inputs\nif [ -z \"$TARGET_PR\" ]; then\n\
        \  echo \"decision=SKIP\" >> $GITHUB_OUTPUT\n  echo \"rule=no_target_pr\"\
        \ >> $GITHUB_OUTPUT\n  echo \"confidence=0.0\" >> $GITHUB_OUTPUT\n  echo \"\
        should_proceed=false\" >> $GITHUB_OUTPUT\n  echo \"::warning::No target PR\
        \ provided\"\n  exit 0\nfi\n\n# Sanitize approval_reason to prevent injection\n\
        SAFE_REASON=$(echo \"$APPROVAL_REASON\" | sed 's/[^a-zA-Z0-9:_.-]/ /g' | head\
        \ -c 256)\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Prerequisite\
        \ Check (Phase 4): WEC Compliance Validation\n# Ensures PR has required workflows\
        \ checked in WEC block before auto-approval\n# \u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\necho \"\U0001F50D Phase 4: Checking WEC compliance as\
        \ approval prerequisite...\"\nif command -v python3 &> /dev/null; then\n \
        \ set +e\n  WEC_CHECK=$(python3 scripts/ci/session_wrapup_autofix.py \\\n\
        \    --pr-number \"$TARGET_PR\" \\\n    --check-wec-compliance \\\n    --merge-target\
        \ \"main\" 2>&1)\n  WEC_STATUS=$?\n  set -e\n  if [ \"$WEC_STATUS\" -eq 0\
        \ ] && echo \"$WEC_CHECK\" | grep -q \"WEC COMPLIANCE: PASSED\"; then\n  \
        \  echo \"\u2705 WEC compliance check passed \u2014 prerequisite satisfied\"\
        \n  elif [ \"$WEC_STATUS\" -eq 2 ]; then\n    echo \"\u26A0\uFE0F WEC check\
        \ skipped (script not available) \u2014 proceeding with approval evaluation\"\
        \n  else\n    echo \"\u26A0\uFE0F WEC compliance check did not pass \u2014\
        \ approval will proceed with caution\"\n    echo \"   Run: python3 scripts/ci/session_wrapup_autofix.py\
        \ --check-wec-compliance --pr-number $TARGET_PR\"\n  fi\nelse\n  echo \"\u26A0\
        \uFE0F Python3 not available \u2014 skipping WEC compliance check\"\nfi\n\n\
        # \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Priority 1: Force\
        \ Deny Intent (instant deny, no processing)\n# \u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\nif [ \"$APPROVAL_INTENT\" = \"force_deny\" ]; then\n \
        \ echo \"decision=DENY\" >> $GITHUB_OUTPUT\n  echo \"rule=force_deny_intent\"\
        \ >> $GITHUB_OUTPUT\n  echo \"confidence=1.0\" >> $GITHUB_OUTPUT\n  echo \"\
        target_pr=$TARGET_PR\" >> $GITHUB_OUTPUT\n  echo \"should_proceed=false\"\
        \ >> $GITHUB_OUTPUT\n  echo \"\u26D4 Priority 1: Force deny requested \u2014\
        \ skipping all further evaluation\"\n  exit 0\nfi\n\n# \u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\n# Priority 2: Persistent Label Rule (wec:auto-approve)\n\
        # \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nLABELS=$(gh pr view\
        \ \"$TARGET_PR\" --repo \"$REPO\" --json labels -q '.labels[].name' 2>/dev/null\
        \ || echo \"\")\nif echo \"$LABELS\" | grep -q \"^wec:auto-approve$\"; then\n\
        \  echo \"decision=APPROVE\" >> $GITHUB_OUTPUT\n  echo \"rule=persistent_label_rule\"\
        \ >> $GITHUB_OUTPUT\n  echo \"confidence=1.0\" >> $GITHUB_OUTPUT\n  echo \"\
        target_pr=$TARGET_PR\" >> $GITHUB_OUTPUT\n  echo \"should_proceed=true\" >>\
        \ $GITHUB_OUTPUT\n  echo \"\u2705 Priority 2: Persistent label 'wec:auto-approve'\
        \ matched\"\n  exit 0\nfi\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \n# Priority 3: Single-Session Label Rule (wec:auto-approve-once)\n# Time-limited\
        \ approval window based on TTL\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\nif echo \"$LABELS\" | grep -q \"^wec:auto-approve-once$\"; then\n\
        \  CREATED_AT=$(gh pr view \"$TARGET_PR\" --repo \"$REPO\" --json createdAt\
        \ -q '.createdAt' 2>/dev/null || echo \"\")\n  if [ -z \"$CREATED_AT\" ];\
        \ then\n    echo \"decision=DENY\" >> $GITHUB_OUTPUT\n    echo \"rule=single_session_label_no_timestamp\"\
        \ >> $GITHUB_OUTPUT\n    echo \"confidence=0.5\" >> $GITHUB_OUTPUT\n    echo\
        \ \"target_pr=$TARGET_PR\" >> $GITHUB_OUTPUT\n    echo \"should_proceed=false\"\
        \ >> $GITHUB_OUTPUT\n    exit 0\n  fi\n\n  CREATED_TS=$(date -d \"$CREATED_AT\"\
        \ +%s 2>/dev/null || echo \"0\")\n  CURRENT_TS=$(date +%s)\n  ELAPSED_HOURS=$((\
        \ (CURRENT_TS - CREATED_TS) / 3600 ))\n  TTL_INT=${APPROVAL_TTL_HOURS:-1}\n\
        \n  if [ \"$ELAPSED_HOURS\" -le \"$TTL_INT\" ]; then\n    echo \"decision=APPROVE\"\
        \ >> $GITHUB_OUTPUT\n    echo \"rule=single_session_label_rule\" >> $GITHUB_OUTPUT\n\
        \    echo \"confidence=1.0\" >> $GITHUB_OUTPUT\n    echo \"target_pr=$TARGET_PR\"\
        \ >> $GITHUB_OUTPUT\n    echo \"should_proceed=true\" >> $GITHUB_OUTPUT\n\
        \    echo \"\u2705 Priority 3: Single-session label within TTL ($ELAPSED_HOURS/$TTL_INT\
        \ hours)\"\n    exit 0\n  else\n    echo \"decision=DENY\" >> $GITHUB_OUTPUT\n\
        \    echo \"rule=single_session_expired\" >> $GITHUB_OUTPUT\n    echo \"confidence=0.95\"\
        \ >> $GITHUB_OUTPUT\n    echo \"target_pr=$TARGET_PR\" >> $GITHUB_OUTPUT\n\
        \    echo \"should_proceed=false\" >> $GITHUB_OUTPUT\n    echo \"\u23F0 Priority\
        \ 3: Single-session label expired ($ELAPSED_HOURS > $TTL_INT hours)\"\n  \
        \  exit 0\n  fi\nfi\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\
        # Priority 4: Maintainer Approval Rule\n# Check if PR has been approved by\
        \ maintainer (@mbaetiong)\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \nAPPROVER=$(gh pr view \"$TARGET_PR\" --repo \"$REPO\" --json reviews -q\
        \ '.reviews[] | select(.state==\"APPROVED\" and (.body | contains(\"Auto-approved\"\
        \ ) | not)) | .author.login' 2>/dev/null | head -1 || echo \"\")\nif [ \"$APPROVER\"\
        \ = \"mbaetiong\" ]; then\n  echo\
        \ \"decision=APPROVE\" >> $GITHUB_OUTPUT\n  echo \"rule=maintainer_approval_rule\"\
        \ >> $GITHUB_OUTPUT\n  echo \"confidence=0.99\" >> $GITHUB_OUTPUT\n  echo\
        \ \"target_pr=$TARGET_PR\" >> $GITHUB_OUTPUT\n  echo \"should_proceed=true\"\
        \ >> $GITHUB_OUTPUT\n  echo \"\u2705 Priority 4: Maintainer approval from\
        \ @$APPROVER\"\n  exit 0\nfi\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\n# Priority 5: Low-Risk Approval Reason Rule\n# Patterns: docs:, chore:,\
        \ etc.\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nif [[ \"$SAFE_REASON\"\
        \ =~ ^(docs|chore|test|refactor) ]]; then\n  echo \"decision=APPROVE\" >>\
        \ $GITHUB_OUTPUT\n  echo \"rule=low_risk_reason_rule\" >> $GITHUB_OUTPUT\n\
        \  echo \"confidence=0.85\" >> $GITHUB_OUTPUT\n  echo \"target_pr=$TARGET_PR\"\
        \ >> $GITHUB_OUTPUT\n  echo \"should_proceed=true\" >> $GITHUB_OUTPUT\n  echo\
        \ \"\u2705 Priority 5: Low-risk reason matched: $SAFE_REASON\"\n  exit 0\n\
        fi\n\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# Fallback:\
        \ No matching rule \u2014 default DENY\n# \u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\necho \"decision=DENY\" >> $GITHUB_OUTPUT\necho \"rule=no_matching_rule\"\
        \ >> $GITHUB_OUTPUT\necho \"confidence=0.0\" >> $GITHUB_OUTPUT\necho \"target_pr=$TARGET_PR\"\
        \ >> $GITHUB_OUTPUT\necho \"should_proceed=false\" >> $GITHUB_OUTPUT\necho\
        \ \"\u26D4 Fallback: No matching approval rule found\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  execute-approval:
    name: "\u26A1 Execute Approval Decision"
    needs: evaluate-approval
    runs-on: ubuntu-latest
    if: 'needs.evaluate-approval.outputs.should_proceed == ''true'' &&

      needs.evaluate-approval.outputs.approval_decision == ''APPROVE''

      '
    permissions:
      actions: write
      pull-requests: write
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Resolve token chain (Tier 1-4 with fallbacks)
      id: token
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\n# Tier 1: Cognitive Brain App token (not available\
        \ in this job context)\n# (available in approve-original job via step id \"\
        app-token\")\n\n# Tier 2: CODEX_MASTER_KEY (primary PAT)\nif [ -n \"${{ secrets.CODEX_MASTER_KEY\
        \ || '' }}\" ]; then\n  echo \"token=${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY\
        \ }}\" >> $GITHUB_OUTPUT\n  echo \"token_source=CODEX_MASTER_KEY\" >> $GITHUB_OUTPUT\n\
        \  echo \"Resolved: Using CODEX_MASTER_KEY (Tier 2)\"\n  exit 0\nfi\n\n# Tier\
        \ 3: CODEX_BACKUP_KEY (fallback PAT)\nif [ -n \"${{ secrets.CODEX_BACKUP_KEY\
        \ || '' }}\" ]; then\n  echo \"token=${{ secrets.CODEX_BACKUP_KEY }}\" >>\
        \ $GITHUB_OUTPUT\n  echo \"token_source=CODEX_BACKUP_KEY\" >> $GITHUB_OUTPUT\n\
        \  echo \"Resolved: Using CODEX_BACKUP_KEY (Tier 3)\"\n  exit 0\nfi\n\n# Tier\
        \ 4: github.token (limited scope, same-repo only)\necho \"token=${{ github.token\
        \ }}\" >> $GITHUB_OUTPUT\necho \"token_source=github_token\" >> $GITHUB_OUTPUT\n\
        echo \"Resolved: Using github.token (Tier 4, limited scope)\"\n"
    - name: Approve workflow run(s)
      id: approve
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        RUN_ID: ${{ github.event.inputs.target_run_id }}
        TARGET_PR: ${{ needs.evaluate-approval.outputs.target_pr }}
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        REPO: ${{ github.repository }}
      run: "set -euo pipefail\n\nif [ -z \"$TARGET_PR\" ]; then\n  echo \"::warning::No\
        \ target PR resolved \u2014 skipping approval execution\"\n  exit 0\nfi\n\n\
        if [ \"$DRY_RUN\" = \"true\" ]; then\n  echo \"\U0001F50D DRY RUN MODE: Would\
        \ approve run $RUN_ID for PR  #$TARGET_PR\"\n  exit 0\nfi\n\n# If specific\
        \ run ID provided, approve that run\nif [ -n \"$RUN_ID\" ]; then\n  gh run\
        \ approve \"$RUN_ID\" 2>/dev/null && \\\n    echo \"\u2705 Approved run  #$RUN_ID\"\
        \ || \\\n    echo \"\u26A0\uFE0F Could not approve run  #$RUN_ID (may already\
        \ be approved)\"\n  exit 0\nfi\n\n# Otherwise, discover and approve pending\
        \ runs for this PR\nHEAD_SHA=$(gh pr view \"$TARGET_PR\" --repo \"$REPO\"\
        \ --json headRefOid -q '.headRefOid' 2>/dev/null || echo \"\")\nif [ -z \"\
        $HEAD_SHA\" ]; then\n  echo \"::warning::Could not resolve HEAD SHA for PR\
        \  #$TARGET_PR\"\n  exit 0\nfi\n\n# High-volume detection: If >10 pending\
        \ runs, use 6-pass approach\nPENDING_COUNT=$(gh run list --repo \"$REPO\"\
        \ --status action_required --json databaseId 2>/dev/null | grep -c '.' ||\
        \ echo \"0\")\n\nif [ \"$PENDING_COUNT\" -ge 10 ]; then\n  echo \"\U0001F4E6\
        \ High-volume detected: $PENDING_COUNT pending runs; using 6-pass approach\"\
        \n  for PASS in {1..6}; do\n    echo \"Pass $PASS/6...\"\n    BATCH=$(gh run\
        \ list --repo \"$REPO\" --status action_required --json databaseId -q '.[].databaseId'\
        \ 2>/dev/null | head -n 5 || echo \"\")\n    for BATCH_RUN in $BATCH; do\n\
        \      gh run approve \"$BATCH_RUN\" 2>/dev/null && echo \"  \u2705 Approved\
        \ run  #$BATCH_RUN\" || true\n      sleep 2  # 2-second delay between approvals\n\
        \    done\n    [ \"$PASS\" -lt 6 ] && sleep 12  # 12-second delay between\
        \ passes\n  done\nelse\n  echo \"\U0001F50D Finding action_required runs for\
        \ SHA ${HEAD_SHA:0:12}...\"\n  RUNS=$(gh run list --repo \"$REPO\" --status\
        \ action_required --json databaseId,name -q '.[]' 2>/dev/null || echo \"\"\
        )\n  if [ -z \"$RUNS\" ]; then\n    echo \"\u2139\uFE0F  No action_required\
        \ runs found\"\n  else\n    echo \"$RUNS\" | while read -r RUN_JSON; do\n\
        \      RUN_ID=$(echo \"$RUN_JSON\" | jq -r '.databaseId' 2>/dev/null || echo\
        \ \"\")\n      RUN_NAME=$(echo \"$RUN_JSON\" | jq -r '.name' 2>/dev/null ||\
        \ echo \"unknown\")\n      if [ -n \"$RUN_ID\" ]; then\n        gh run approve\
        \ \"$RUN_ID\" 2>/dev/null && echo \"\u2705 Approved: $RUN_NAME (#$RUN_ID)\"\
        \ || true\n      fi\n    done\n  fi\nfi\n"
    - name: Log approval to audit trail
      if: always() && needs.evaluate-approval.outputs.should_proceed == 'true'
      env:
        RULE_MATCHED: ${{ needs.evaluate-approval.outputs.rule_matched }}
        CONFIDENCE: ${{ needs.evaluate-approval.outputs.confidence_score }}
        TARGET_PR: ${{ needs.evaluate-approval.outputs.target_pr }}
        APPROVAL_SOURCE: ${{ github.event.inputs.approval_source }}
        APPROVAL_REASON: ${{ github.event.inputs.approval_reason }}
        TOKEN_SOURCE: ${{ steps.token.outputs.token_source }}
        REPO: ${{ github.repository }}
        TIMESTAMP: ${{ github.event.repository.updated_at }}
      run: 'set -euo pipefail

        # Generate UUID for approval record

        APPROVAL_ID=$(uuidgen 2>/dev/null || python3 -c "import uuid; print(uuid.uuid4())")

        # Create audit log entry (JSONL format for append-only)

        cat >> .codex/approvals.jsonl << EOF

        {"approval_id":"$APPROVAL_ID","timestamp":"$(date -u +''%Y-%m-%dT%H:%M:%S.%3NZ'')","run_id":"${{
        github.event.inputs.target_run_id }}","pr_number":"$TARGET_PR","approval_source":"$APPROVAL_SOURCE","rule_matched":"$RULE_MATCHED","confidence":$CONFIDENCE}

        EOF

        # Commit audit log (best effort, non-fatal if fails)

        git config user.name "GitHub Action" || true

        git config user.email "action@github.com" || true

        git add .codex/approvals.jsonl || true

        git commit -m "audit: Log approval via $APPROVAL_SOURCE (PR  #$TARGET_PR,
        rule: $RULE_MATCHED)" || true

        git push || true

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  cleanup-single-session:
    name: "\U0001F9F9 Cleanup Single-Session Label"
    needs:
    - evaluate-approval
    - execute-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "always() &&\nneeds.evaluate-approval.outputs.should_proceed == 'true' &&\n\
      (github.event.inputs.approval_source == 'self-approve-pending-runs' ||\n github.event.inputs.approval_source\
      \ == 'trigger-on-approval')\n"
    permissions:
      pull-requests: write
    steps:
    - name: Remove single-session label if present
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        TARGET_PR: ${{ needs.evaluate-approval.outputs.target_pr }}
        REPO: ${{ github.repository }}
      run: "set -euo pipefail\n\nif [ -z \"$TARGET_PR\" ]; then\n  exit 0\nfi\n\n\
        # Only cleanup if single-session mode was used\nLABELS=$(gh pr view \"$TARGET_PR\"\
        \ --repo \"$REPO\" --json labels -q '.labels[].name' 2>/dev/null || echo \"\
        \")\nif echo \"$LABELS\" | grep -q \"^wec:auto-approve-once$\"; then\n  gh\
        \ pr edit \"$TARGET_PR\" --repo \"$REPO\" --remove-label \"wec:auto-approve-once\"\
        \ 2>/dev/null && \\\n    echo \"\u2705 Removed single-session label 'wec:auto-approve-once'\"\
        \ || \\\n    echo \"\u26A0\uFE0F Could not remove label (non-fatal)\"\nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  publish-metrics:
    name: "\U0001F4CA Publish Approval Metrics"
    needs:
    - evaluate-approval
    - execute-approval
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.approval_source != ''
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Publish metrics to artifact
      env:
        APPROVAL_SOURCE: ${{ github.event.inputs.approval_source }}
        RULE_MATCHED: ${{ needs.evaluate-approval.outputs.rule_matched }}
        CONFIDENCE: ${{ needs.evaluate-approval.outputs.confidence_score }}
        DECISION: ${{ needs.evaluate-approval.outputs.approval_decision }}
      run: 'set -euo pipefail

        # Create metrics directory

        mkdir -p .codex/metrics

        # Append hourly metric (JSONL format)

        cat >> .codex/metrics/hourly.jsonl << EOF

        {"timestamp":"$(date -u +''%Y-%m-%dT%H:%M:%S.%3NZ'')","approval_source":"$APPROVAL_SOURCE","rule_matched":"$RULE_MATCHED","decision":"$DECISION","confidence":$CONFIDENCE}

        EOF


        # Commit metrics (best effort)

        git config user.name "GitHub Action" || true

        git config user.email "action@github.com" || true

        git add .codex/metrics/hourly.jsonl || true

        git commit -m "metric: Approval telemetry for $APPROVAL_SOURCE" || true

        git push || true

        '
    timeout-minutes: 45
  approve-original:
    name: "\u26A1 Approve pending workflow runs"
    runs-on: ubuntu-latest
    env:
      GH_TRICKLE_POLITE_SLEEP: '1.0'
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    steps:
    - name: Generate Cognitive Brain App token
      id: app-token
      uses: actions/create-github-app-token@v1
      continue-on-error: true
      with:
        app-id: ${{ secrets._GITHUB_APP_ID }}
        private-key: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
    - name: Configure auto-approve mode
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY ||
          secrets.CODEX_BACKUP_KEY || github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.inputs.target_pr }}
        ENABLE_PERSISTENT: ${{ github.event.inputs.enable_persistent }}
        ENABLE_ONE_SESSION: ${{ github.event.inputs.enable_one_session }}
      run: "set -euo pipefail\n\n# \u2500\u2500 Ensure labels exist in the repo \u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\nfor LABEL in \"wec:auto-approve\" \"wec:auto-approve-once\"\
        ; do\n  ENCODED=\"${LABEL//:/%3A}\"\n  gh api \"repos/${REPO}/labels/${ENCODED}\"\
        \ &>/dev/null || \\\n    gh api --method POST \"repos/${REPO}/labels\" \\\n\
        \      -f name=\"${LABEL}\" \\\n      -f color=\"0075ca\" \\\n      -f description=\"\
        Auto-Approve Pending Workflow Runs opt-in\" \\\n      2>/dev/null || true\n\
        done\n\n# \u2500\u2500 Persistent mode \u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\nif [ \"${ENABLE_PERSISTENT}\" = \"true\" ]; then\n  echo\
        \ \"\u2699\uFE0F  Persistent mode: adding 'wec:auto-approve' label...\"\n\
        \  gh api --method POST \"repos/${REPO}/issues/${PR_NUMBER}/labels\" \\\n\
        \    -f 'labels[]=wec:auto-approve' 2>/dev/null || true\n\n  echo \"\U0001F4DD\
        \ Updating PR body: setting [x] auto-approve-workflows...\"\n  BODY=$(gh pr\
        \ view \"${PR_NUMBER}\" --repo \"${REPO}\" --json body -q '.body // \"\"'\
        \ 2>/dev/null || echo \"\")\n  printf '%s' \"${BODY}\" > /tmp/_aaw_body.txt\n\
        \  python3 -c \"import re,sys; b=open('/tmp/_aaw_body.txt').read(); b=re.sub(r'(?m)(^[\
        \ \\t]*-[ \\t]*\\[) \\]([ \\t]+auto-approve-workflows)',r'\\1x]\\2',b); sys.stdout.write(b)\"\
        \ \\\n    > /tmp/_aaw_body_out.txt\n  gh pr edit \"${PR_NUMBER}\" --repo \"\
        ${REPO}\" \\\n    --body \"$(cat /tmp/_aaw_body_out.txt)\" \\\n    && echo\
        \ \"\u2705 PR body updated: [x] auto-approve-workflows\" \\\n    || echo \"\
        ::warning::Could not update PR body (non-fatal \u2014 label is the primary\
        \ gate).\"\nfi\n\n# \u2500\u2500 One-session mode \u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\nif [ \"${ENABLE_ONE_SESSION}\" = \"true\" ]; then\n\
        \  echo \"\u2699\uFE0F  One-session mode: adding 'wec:auto-approve-once' label...\"\
        \n  gh api --method POST \"repos/${REPO}/issues/${PR_NUMBER}/labels\" \\\n\
        \    -f 'labels[]=wec:auto-approve-once' 2>/dev/null || true\n  echo \"\u2705\
        \ Label 'wec:auto-approve-once' added \u2014 will auto-disable after next\
        \ Copilot session.\"\nfi\n"
    - name: Resolve target PR(s)
      id: resolve
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY ||
          secrets.CODEX_BACKUP_KEY || github.token }}
        WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_REVIEW_NUMBER: ${{ github.event.pull_request.number }}
        PR_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUT_PR: ${{ github.event.inputs.target_pr }}
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
      run: "set -euo pipefail\necho \"dry_run=${DRY_RUN:-false}\" >> \"$GITHUB_OUTPUT\"\
        \n\n# \u2500\u2500 Schedule: find ALL open PRs (unconditional \u2014 always-on)\
        \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nif [ \"${EVENT_NAME}\"\
        \ = \"schedule\" ]; then\n  echo \"\U0001F550 Schedule sweep \u2014 finding\
        \ all open PRs...\"\n\n  # Pattern D: paginate with rate-limit guard (stop\
        \ if remaining < 20)\n  ALL_PRS=\"\"\n  page=1\n  while true; do\n    remaining=$(gh\
        \ api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo \"999\"\
        )\n    if [ \"$remaining\" -lt 20 ]; then\n      echo \"::warning::Rate limit\
        \ low ($remaining remaining) \u2014 stopping PR pagination at page $page\"\
        \n      break\n    fi\n    batch=$(gh api \"repos/${REPO}/pulls?state=open&per_page=100&page=${page}\"\
        \ \\\n      -q '.[].number' 2>/dev/null)\n    [ -z \"$batch\" ] && break\n\
        \    ALL_PRS=\"${ALL_PRS} ${batch}\"\n    count=$(echo \"$batch\" | wc -w)\n\
        \    [ \"$count\" -lt 100 ] && break\n    page=$(( page + 1 ))\n    sleep\
        \ \"${GH_TRICKLE_POLITE_SLEEP:-1.0}\"\n  done\n  ALL_PRS=$(echo \"$ALL_PRS\"\
        \ | tr ' ' '\\n' | sort -u | tr '\\n' ' ' | xargs || echo \"\")\n\n  if [\
        \ -z \"${ALL_PRS}\" ]; then\n    echo \"\u2139\uFE0F  No open PRs found \u2014\
        \ nothing to do.\"\n    echo \"skip=true\" >> \"$GITHUB_OUTPUT\"\n  else\n\
        \    echo \"Found open PRs: ${ALL_PRS}\"\n    echo \"pr_list=${ALL_PRS}\"\
        \ >> \"$GITHUB_OUTPUT\"\n    echo \"mode=schedule\"      >> \"$GITHUB_OUTPUT\"\
        \n    echo \"skip=false\"         >> \"$GITHUB_OUTPUT\"\n  fi\n  exit 0\n\
        fi\n\n# \u2500\u2500 Single-PR path (workflow_run / pull_request / workflow_dispatch)\
        \ \u2500\necho \"mode=single\" >> \"$GITHUB_OUTPUT\"\n\nPR_NUM=\"\"\nif  \
        \ [ -n \"${WR_PR_NUMBER:-}\" ]; then PR_NUM=\"${WR_PR_NUMBER}\"\nelif [ -n\
        \ \"${PR_NUMBER:-}\"    ]; then PR_NUM=\"${PR_NUMBER}\"\nelif [ -n \"${PR_REVIEW_NUMBER:-}\"\
        \ ]; then PR_NUM=\"${PR_REVIEW_NUMBER}\"\nelif [ -n \"${INPUT_PR:-}\"    \
        \ ]; then PR_NUM=\"${INPUT_PR}\"\nfi\n\nif [ -z \"${PR_NUM}\" ]; then\n  echo\
        \ \"::warning::Could not determine PR number \u2014 skipping.\"\n  echo \"\
        skip=true\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\nHEAD_SHA=\"\"\nif   [ -n\
        \ \"${WR_HEAD_SHA:-}\"  ]; then HEAD_SHA=\"${WR_HEAD_SHA}\"\nelif [ -n \"\
        ${PR_HEAD_SHA:-}\"  ]; then HEAD_SHA=\"${PR_HEAD_SHA}\"\nelif [ -n \"${PR_REVIEW_HEAD_SHA:-}\"\
        \ ]; then HEAD_SHA=\"${PR_REVIEW_HEAD_SHA}\"\nelse\n  HEAD_SHA=$(gh pr view\
        \ \"${PR_NUM}\" --repo \"${REPO}\" \\\n    --json headRefOid -q '.headRefOid'\
        \ 2>/dev/null || echo \"\")\nfi\n\nif [ -z \"${HEAD_SHA}\" ]; then\n  echo\
        \ \"::warning::Could not determine HEAD SHA \u2014 skipping.\"\n  echo \"\
        skip=true\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\necho \"pr_number=${PR_NUM}\"\
        \   >> \"$GITHUB_OUTPUT\"\necho \"head_sha=${HEAD_SHA}\"  >> \"$GITHUB_OUTPUT\"\
        \necho \"skip=false\"            >> \"$GITHUB_OUTPUT\"\necho \"Resolved: PR\
        \  #${PR_NUM}, SHA=${HEAD_SHA:0:12}\"\n"
    - name: Approve pending (action_required) workflow runs
      id: approve
      if: steps.resolve.outputs.skip != 'true'
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        MODE: ${{ steps.resolve.outputs.mode }}
        PR_LIST: ${{ steps.resolve.outputs.pr_list || '' }}
        PR_NUMBER: ${{ steps.resolve.outputs.pr_number || '' }}
        HEAD_SHA: ${{ steps.resolve.outputs.head_sha || '' }}
        DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        HIGH_VOLUME_THRESHOLD: ${{ vars.CODEX_AUTO_APPROVE_HIGH_VOLUME_THRESHOLD ||
          '10' }}
        HIGH_VOLUME_MAX_PASSES: ${{ vars.CODEX_AUTO_APPROVE_MAX_PASSES || '6' }}
        PASS_DELAY_MS: ${{ vars.CODEX_AUTO_APPROVE_PASS_DELAY_MS || '12000' }}
        ACTIVE_AGENT_HINT: ${{ github.event.workflow_run.status || '' }}
        REPO: ${{ github.repository }}
      with:
        github-token: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY
          || secrets.CODEX_BACKUP_KEY || github.token }}
        script: "const [owner, repo] = process.env.REPO.split('/');\nconst dryRun\
          \        = process.env.DRY_RUN === 'true';\nconst mode          = process.env.MODE;\n\
          const highVolumeThreshold = parseInt(process.env.HIGH_VOLUME_THRESHOLD ||\
          \ '10', 10);\nconst configuredMaxPasses = parseInt(process.env.HIGH_VOLUME_MAX_PASSES\
          \ || '6', 10);\nconst passDelayMs = parseInt(process.env.PASS_DELAY_MS ||\
          \ '12000', 10);\nconst activeAgentHint = (process.env.ACTIVE_AGENT_HINT\
          \ || '').toLowerCase();\n\n// \u2500\u2500 Helpers \u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\n// ALWAYS-ON: Copilot is mandated to approve on behalf of\
          \ the human admin.\n// No opt-in labels or PR body checkboxes are required.\n\
          async function isEnabled(_prNum) {\n  return true;\n}\n\nasync function\
          \ getHeadSha(prNum) {\n  const { data: pr } = await github.rest.pulls.get({\n\
          \    owner, repo, pull_number: parseInt(prNum),\n  });\n  return pr.head.sha;\n\
          }\n\nasync function listActionRequiredRuns(headSha) {\n  let allRuns = [],\
          \ page = 1;\n  while (true) {\n    const { data } = await github.rest.actions.listWorkflowRunsForRepo({\n\
          \      owner, repo, status: 'action_required',\n      head_sha: headSha,\
          \ per_page: 100, page,\n    });\n    allRuns = allRuns.concat(data.workflow_runs);\n\
          \    if (data.workflow_runs.length < 100) break;\n    page++;\n  }\n  return\
          \ allRuns;\n}\n\nasync function approvePR(prNum, headSha) {\n  core.info(`\\\
          n\u2500\u2500 PR  #${prNum} @ ${headSha.slice(0,12)} \u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500`);\n\n  // Enumerate action_required\
          \ runs for this SHA\n  let allRuns = await listActionRequiredRuns(headSha);\n\
          \n  core.info(`   Found ${allRuns.length} run(s) with status=action_required`);\n\
          \  if (allRuns.length === 0) {\n    core.info('   Nothing to approve.');\n\
          \    return { prNum, headSha, approved: 0, skipped: 0, errors: 0, results:\
          \ [] };\n  }\n\n  let approved = 0, skipped = 0, errors = 0;\n  const results\
          \ = [];\n\n  const activeCopilotSession = activeAgentHint === 'requested'\
          \ || activeAgentHint === 'in_progress';\n  const maxPasses = (allRuns.length\
          \ >= highVolumeThreshold || activeCopilotSession)\n    ? Math.max(2, configuredMaxPasses)\n\
          \    : 1;\n  if (maxPasses > 1) {\n    if (activeCopilotSession) {\n   \
          \   core.info(`   Active Copilot agent session detected (${activeAgentHint}).\
          \ Running up to ${maxPasses} approval passes.`);\n    } else {\n      core.info(`\
          \   High-volume queue detected (>=${highVolumeThreshold}). Running up to\
          \ ${maxPasses} approval passes.`);\n    }\n  }\n\n  const processedRunIds\
          \ = new Set();\n  for (let pass = 1; pass <= maxPasses; pass++) {\n    if\
          \ (pass > 1) {\n      await new Promise(resolve => setTimeout(resolve, passDelayMs));\n\
          \      allRuns = await listActionRequiredRuns(headSha);\n      core.info(`\
          \   Pass ${pass}/${maxPasses}: found ${allRuns.length} remaining action_required\
          \ run(s).`);\n      if (allRuns.length === 0) break;\n    }\n\n    for (const\
          \ run of allRuns) {\n      if (processedRunIds.has(run.id)) continue;\n\
          \      processedRunIds.add(run.id);\n\n      const label = `${run.name ||\
          \ run.workflow_id} (run  #${run.id})`;\n      if (dryRun) {\n        core.info(`[DRY]\
          \ Would approve: ${label}`);\n        results.push({ label, status: '\U0001F50D\
          \ dry-run' });\n        approved++;\n        continue;\n      }\n      try\
          \ {\n        await github.rest.actions.approveWorkflowRun({ owner, repo,\
          \ run_id: run.id });\n        core.info(`\u2705 Approved: ${label}`);\n\
          \        results.push({ label, status: '\u2705 approved' });\n        approved++;\n\
          \      } catch (e) {\n        if (e.status === 422 || e.status === 409)\
          \ {\n          core.info(`\u23ED\uFE0F  Already processed: ${label}`);\n\
          \          results.push({ label, status: '\u23ED\uFE0F already processed'\
          \ });\n          skipped++;\n        } else if (e.message && e.message.includes('not\
          \ from a fork pull request')) {\n          // Same-repo PRs: approveWorkflowRun\
          \ may return this message.\n          // Fallback: re-run the workflow run\
          \ via REST using the same token.\n          core.info(`\U0001F504 Same-repo\
          \ PR \u2014 using REST rerun fallback for: ${label}`);\n          try {\n\
          \            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun',\
          \ {\n              owner,\n              repo,\n              run_id: run.id,\n\
          \            });\n            core.info(`\u2705 REST rerun requested: ${label}`);\n\
          \            results.push({ label, status: '\u2705 rerun (same-repo)' });\n\
          \            approved++;\n          } catch (rerunErr) {\n            core.info(`\u23ED\
          \uFE0F  REST rerun skipped (may already be approved): ${label}`);\n    \
          \        results.push({ label, status: '\u23ED\uFE0F rerun skipped' });\n\
          \            skipped++;\n          }\n        } else {\n          core.warning(`\u274C\
          \ Failed to approve ${label}: ${e.message}`);\n          results.push({\
          \ label, status: `\u274C error: ${e.message}` });\n          errors++;\n\
          \        }\n      }\n    }\n  }\n  return { prNum, headSha, approved, skipped,\
          \ errors, results };\n}\n\n// \u2500\u2500 Build target list \u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\nlet targets = [];  // [{prNum,\
          \ headSha}]\nif (mode === 'schedule') {\n  const prNums = process.env.PR_LIST.trim().split(/\\\
          s+/).filter(Boolean);\n  core.info(`\u23F0 Schedule sweep (always-on): ${prNums.length}\
          \ open PR(s) \u2014 ${prNums.join(', ')}`);\n  for (const prNum of prNums)\
          \ {\n    // For schedule, label presence already confirmed \u2014 skip re-check\n\
          \    try {\n      const headSha = await getHeadSha(prNum);\n      targets.push({\
          \ prNum, headSha });\n    } catch (e) {\n      core.warning(`\u26A0\uFE0F\
          \ Could not resolve head SHA for PR  #${prNum} (${e?.message || String(e)})\
          \ \u2014 skipping`);\n    }\n  }\n} else {\n  const prNum  = process.env.PR_NUMBER;\n\
          \  const headSha = process.env.HEAD_SHA;\n  // Always-on: no opt-in gate\
          \ \u2014 Copilot approves on behalf of human admin.\n  targets.push({ prNum,\
          \ headSha });\n}\n\n// \u2500\u2500 Approve all targets \u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\nconst allResults = [];\nlet totalErrors = 0;\n\
          for (const { prNum, headSha } of targets) {\n  const r = await approvePR(prNum,\
          \ headSha);\n  allResults.push(r);\n  totalErrors += r.errors;\n}\n\n//\
          \ \u2500\u2500 Job summary \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst lines = [\n  `## \u26A1\
          \ Auto-Approve \u2014 ${targets.length > 1 ? `${targets.length} PRs` : `PR\
          \  #${targets[0].prNum}`}`,\n  '',\n  `| PR | HEAD SHA | Approved | Skipped\
          \ | Errors |`,\n  `|----|---------|---------|---------|--------|`,\n];\n\
          for (const r of allResults) {\n  lines.push(`|  #${r.prNum} | \\`${r.headSha.slice(0,12)}\\\
          ` | **${r.approved}** | ${r.skipped} | ${r.errors} |`);\n}\nlines.push('');\n\
          lines.push(`_Mode: ${dryRun ? '\U0001F50D DRY RUN' : '\U0001F680 LIVE'}\
          \ \xB7 Trigger: ${context.eventName} \xB7 ${new Date().toISOString()}_`);\n\
          core.summary.addRaw('\\n' + lines.join('\\n') + '\\n');\nawait core.summary.write();\n\
          \nif (totalErrors > 0) {\n  core.setFailed(`${totalErrors} run(s) failed\
          \ to be approved \u2014 check the logs above`);\n}\n"
    - name: Monitor active Copilot session (60m)
      if: github.event_name == 'workflow_run' && github.event.workflow_run.name ==
        'Copilot coding agent' && github.event.workflow_run.status == 'in_progress'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY ||
          secrets.CODEX_BACKUP_KEY || github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        MONITOR_MINUTES: ${{ vars.CODEX_AUTO_APPROVE_MONITOR_MINUTES || '60' }}
        MONITOR_INTERVAL_SEC: ${{ vars.CODEX_AUTO_APPROVE_MONITOR_INTERVAL_SEC ||
          '120' }}
      run: "set -euo pipefail\nif [ -z \"${PR_NUMBER}\" ]; then\n  echo \"\u2139\uFE0F\
        \ No PR number resolved for active-session monitor; skipping.\"\n  exit 0\n\
        fi\n\nDURATION_SEC=$(( MONITOR_MINUTES * 60 ))\nSTART_TS=$(date +%s)\nEND_TS=$((\
        \ START_TS + DURATION_SEC ))\nHAS_FAILURE=0\n\necho \"### \u23F1\uFE0F Active\
        \ Copilot Session Monitor\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"- PR:  #${PR_NUMBER}\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Window: ${MONITOR_MINUTES} minute(s)\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"- Interval: ${MONITOR_INTERVAL_SEC}s\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n\nwhile [ \"$(date +%s)\" -lt \"${END_TS}\"\
        \ ]; do\n  HEAD_SHA=$(gh pr view \"${PR_NUMBER}\" --repo \"${REPO}\" --json\
        \ headRefOid -q '.headRefOid' 2>/dev/null || echo \"\")\n  if [ -z \"${HEAD_SHA}\"\
        \ ]; then\n    echo \"::warning::Could not resolve current PR head SHA for\
        \  #${PR_NUMBER}; retrying.\"\n    sleep \"${MONITOR_INTERVAL_SEC}\"\n   \
        \ continue\n  fi\n\n  echo \"\U0001F504 Monitor pass at $(date -u +%Y-%m-%dT%H:%M:%SZ)\
        \ for SHA ${HEAD_SHA:0:12}\"\n  REPO=\"${REPO}\" HEAD_SHA=\"${HEAD_SHA}\"\
        \ PR_NUMBER=\"${PR_NUMBER}\" MAX_WAIT_SEC=15 \\\n    python scripts/ci/approve_pending_runs.py\
        \ || true\n\n  FAILURES=$(gh api \"repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&status=completed&per_page=100\"\
        \ \\\n    --jq '.workflow_runs[] | select(.conclusion==\"failure\" or .conclusion==\"\
        timed_out\" or .conclusion==\"startup_failure\") | \"-  #\\(.id) \\(.name)\
        \ (\\(.conclusion))\"' 2>/dev/null || true)\n  if [ -n \"${FAILURES}\" ];\
        \ then\n    HAS_FAILURE=1\n    echo \"\u274C Detected failing workflow run(s)\
        \ during active session monitor window:\"\n    echo \"${FAILURES}\"\n    {\n\
        \      echo \"\"\n      echo \"#### \u274C Failures detected during active-session\
        \ monitor\"\n      echo \"${FAILURES}\"\n    } >> \"$GITHUB_STEP_SUMMARY\"\
        \n    break\n  fi\n\n  sleep \"${MONITOR_INTERVAL_SEC}\"\ndone\n\nif [ \"\
        ${HAS_FAILURE}\" -eq 0 ]; then\n  echo \"\u2705 No workflow failures detected\
        \ during active monitor window.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\nelse\n\
        \  echo \"::error::Workflow failures detected during active Copilot session\
        \ monitor window.\"\n  exit 1\nfi\n"
    timeout-minutes: 30
