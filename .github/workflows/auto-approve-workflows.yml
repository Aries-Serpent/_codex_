name: "⚡ Auto-Approve Pending Workflow Runs"

# Automatically approves all `action_required` (awaiting-approval) workflow runs
# for opted-in PRs.  Supports four activation modes:
#
#   1. workflow_run  — fires after every Copilot coding agent session completes.
#                      Approves pending runs for the associated PR immediately.
#                      If the PR carries the `wec:auto-approve-once` label, the
#                      label is removed (and the PR body unchecked) after approval,
#                      effectively disabling auto-approve after this one session.
#
#   2. pull_request  — fires when a new commit is pushed to a PR branch.
#                      Guards against the window between push and agent session start.
#
#   3. schedule      — runs every 5 minutes.  Sweeps ALL open PRs unconditionally
#                      and approves any action_required runs for their HEAD SHA.
#                      No opt-in labels or PR body checkboxes required.
#
#   4. workflow_dispatch  — manual trigger with three option checkboxes:
#        • enable_persistent   Add `wec:auto-approve` label + tick the PR body
#                              checkbox.  Auto-approve will fire after EVERY future
#                              Copilot session and every 20-minute schedule sweep
#                              until the owner intentionally removes the label or
#                              unchecks the PR body checkbox (which the WEC gate
#                              detects and propagates as a label removal).
#        • enable_one_session  Add `wec:auto-approve-once` label.  Approves pending
#                              runs NOW and again at the next Copilot session, then
#                              automatically removes the label and unchecks the box.
#        • dry_run             List action_required runs without approving them.
#
# Labels used (created automatically on first use):
#   wec:auto-approve       Persistent opt-in.  Survives all PR body rewrites.
#   wec:auto-approve-once  Single-session opt-in.  Removed after next Copilot session.
#
# Token used: CODEX_MASTER_KEY (or CODEX_BACKUP_KEY) when available, falling back to github.token.
#   CODEX_* keys have `actions: write` scope required to approve workflow runs.
#   github.token fallback works for same-repo PRs (not forks); approval may be skipped/no-op
#   in contexts where the installation token lacks `actions: write`.
#
# S305 — created 2026-04-03 | S302 — schedule + dispatch overhaul 2026-04-06

on:
  # Primary: fires after every Copilot agent session (from the default branch).
  workflow_run:
    workflows: ["Copilot coding agent", "🔄 Auto-Post @copilot review After Agent Session"]
    types: [completed]

  # Secondary: fires on every new commit push to a PR branch.
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]

  # Periodic sweep: approves pending runs on ALL open PRs every 2 minutes.
  # Schedule triggers run from the DEFAULT BRANCH and are NEVER action_required —
  # this is the primary autonomous approval mechanism.
  schedule:
    - cron: '*/2 * * * *'

  # Manual trigger with full control.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to apply auto-approve to (required)"
        required: true
        type: string
      enable_persistent:
        description: >
          Enable persistent auto-approve — approves after every Copilot session
          and every 20-minute sweep until explicitly disabled.
          Adds the 'wec:auto-approve' label and ticks the PR body checkbox.
        required: false
        default: false
        type: boolean
      enable_one_session:
        description: >
          Enable for ONE session only — approves pending runs now and after the
          next Copilot session, then automatically removes the opt-in.
          Adds the 'wec:auto-approve-once' label.
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run — list pending runs without approving them"
        required: false
        default: false
        type: boolean

# One approver run per PR (or one schedule sweep) at a time.
# Do NOT cancel in-progress so a new push doesn't kill an ongoing sweep.
concurrency:
  group: auto-approve-workflows-${{ github.event_name == 'schedule' && 'schedule' || github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: write        # approve workflow runs
  pull-requests: write  # read/edit PR body; add/remove labels
  contents: read

jobs:
  auto-approve:
    name: "⚡ Approve pending workflow runs"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Step CB: Generate Cognitive Brain App token (highest privilege) ──────
      # The CB App is an installed admin app — its token is NOT subject to the
      # action_required restrictions that affect PATs from bot pushes.
      - name: "Generate Cognitive Brain App token"
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true   # gracefully falls through to PAT
        with:
          app-id: ${{ secrets._GITHUB_APP_ID }}
          private-key: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}

      # ── Step 0: Configure persistent / one-session mode (workflow_dispatch only) ──
      - name: "Configure auto-approve mode"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          ENABLE_PERSISTENT: ${{ github.event.inputs.enable_persistent }}
          ENABLE_ONE_SESSION: ${{ github.event.inputs.enable_one_session }}
        run: |
          set -euo pipefail

          # ── Ensure labels exist in the repo ────────────────────────────────
          for LABEL in "wec:auto-approve" "wec:auto-approve-once"; do
            ENCODED="${LABEL//:/%3A}"
            gh api "repos/${REPO}/labels/${ENCODED}" &>/dev/null || \
              gh api --method POST "repos/${REPO}/labels" \
                -f name="${LABEL}" \
                -f color="0075ca" \
                -f description="Auto-Approve Pending Workflow Runs opt-in" \
                2>/dev/null || true
          done

          # ── Persistent mode ────────────────────────────────────────────────
          if [ "${ENABLE_PERSISTENT}" = "true" ]; then
            echo "⚙️  Persistent mode: adding 'wec:auto-approve' label..."
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
              -f 'labels[]=wec:auto-approve' 2>/dev/null || true

            echo "📝 Updating PR body: setting [x] auto-approve-workflows..."
            BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body -q '.body // ""' 2>/dev/null || echo "")
            printf '%s' "${BODY}" > /tmp/_aaw_body.txt
            python3 -c "import re,sys; b=open('/tmp/_aaw_body.txt').read(); b=re.sub(r'(?m)(^[ \t]*-[ \t]*\[) \]([ \t]+auto-approve-workflows)',r'\1x]\2',b); sys.stdout.write(b)" \
              > /tmp/_aaw_body_out.txt
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" \
              --body "$(cat /tmp/_aaw_body_out.txt)" \
              && echo "✅ PR body updated: [x] auto-approve-workflows" \
              || echo "::warning::Could not update PR body (non-fatal — label is the primary gate)."
          fi

          # ── One-session mode ───────────────────────────────────────────────
          if [ "${ENABLE_ONE_SESSION}" = "true" ]; then
            echo "⚙️  One-session mode: adding 'wec:auto-approve-once' label..."
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
              -f 'labels[]=wec:auto-approve-once' 2>/dev/null || true
            echo "✅ Label 'wec:auto-approve-once' added — will auto-disable after next Copilot session."
          fi

      # ── Step 1: Resolve target PR(s) and HEAD SHA(s) ───────────────────────
      - name: "Resolve target PR(s)"
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

          # ── Schedule: find ALL open PRs (unconditional — always-on) ─────────
          if [ "${EVENT_NAME}" = "schedule" ]; then
            echo "🕐 Schedule sweep — finding all open PRs..."

            ALL_PRS=$(gh api --paginate \
              "repos/${REPO}/pulls?state=open&per_page=100" \
              -q '.[].number' 2>/dev/null | sort -u | tr '\n' ' ' | xargs || echo "")

            if [ -z "${ALL_PRS}" ]; then
              echo "ℹ️  No open PRs found — nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Found open PRs: ${ALL_PRS}"
              echo "pr_list=${ALL_PRS}" >> "$GITHUB_OUTPUT"
              echo "mode=schedule"      >> "$GITHUB_OUTPUT"
              echo "skip=false"         >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # ── Single-PR path (workflow_run / pull_request / workflow_dispatch) ─
          echo "mode=single" >> "$GITHUB_OUTPUT"

          PR_NUM=""
          if   [ -n "${WR_PR_NUMBER:-}" ]; then PR_NUM="${WR_PR_NUMBER}"
          elif [ -n "${PR_NUMBER:-}"    ]; then PR_NUM="${PR_NUMBER}"
          elif [ -n "${INPUT_PR:-}"     ]; then PR_NUM="${INPUT_PR}"
          fi

          if [ -z "${PR_NUM}" ]; then
            echo "::warning::Could not determine PR number — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_SHA=""
          if   [ -n "${WR_HEAD_SHA:-}"  ]; then HEAD_SHA="${WR_HEAD_SHA}"
          elif [ -n "${PR_HEAD_SHA:-}"  ]; then HEAD_SHA="${PR_HEAD_SHA}"
          else
            HEAD_SHA=$(gh pr view "${PR_NUM}" --repo "${REPO}" \
              --json headRefOid -q '.headRefOid' 2>/dev/null || echo "")
          fi

          if [ -z "${HEAD_SHA}" ]; then
            echo "::warning::Could not determine HEAD SHA — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=${PR_NUM}"   >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}"  >> "$GITHUB_OUTPUT"
          echo "skip=false"            >> "$GITHUB_OUTPUT"
          echo "Resolved: PR #${PR_NUM}, SHA=${HEAD_SHA:0:12}"

      # ── Step 2+3: Check enabled and approve pending runs ───────────────────
      - name: "Approve pending (action_required) workflow runs"
        id: approve
        if: steps.resolve.outputs.skip != 'true'
        continue-on-error: true  # transient rate-limits must not fail the job
        uses: actions/github-script@v9
        env:
          MODE: ${{ steps.resolve.outputs.mode }}
          PR_LIST: ${{ steps.resolve.outputs.pr_list || '' }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number || '' }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha || '' }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          REPO: ${{ github.repository }}
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          script: |
            const [owner, repo] = process.env.REPO.split('/');
            const dryRun        = process.env.DRY_RUN === 'true';
            const mode          = process.env.MODE;

            // ── Helpers ──────────────────────────────────────────────────────
            // ALWAYS-ON: Copilot is mandated to approve on behalf of the human admin.
            // No opt-in labels or PR body checkboxes are required.
            async function isEnabled(_prNum) {
              return true;
            }

            async function getHeadSha(prNum) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: parseInt(prNum),
              });
              return pr.head.sha;
            }

            async function approvePR(prNum, headSha) {
              core.info(`\n── PR #${prNum} @ ${headSha.slice(0,12)} ──────────────────────`);

              // Enumerate action_required runs for this SHA
              let allRuns = [], page = 1;
              while (true) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, status: 'action_required',
                  head_sha: headSha, per_page: 100, page,
                });
                allRuns = allRuns.concat(data.workflow_runs);
                if (data.workflow_runs.length < 100) break;
                page++;
              }

              core.info(`   Found ${allRuns.length} run(s) with status=action_required`);
              if (allRuns.length === 0) {
                core.info('   Nothing to approve.');
                return { prNum, headSha, approved: 0, skipped: 0, errors: 0, results: [] };
              }

              let approved = 0, skipped = 0, errors = 0;
              const results = [];
              for (const run of allRuns) {
                const label = `${run.name || run.workflow_id} (run #${run.id})`;
                if (dryRun) {
                  core.info(`[DRY] Would approve: ${label}`);
                  results.push({ label, status: '🔍 dry-run' });
                  approved++;
                  continue;
                }
                try {
                  await github.rest.actions.approveWorkflowRun({ owner, repo, run_id: run.id });
                  core.info(`✅ Approved: ${label}`);
                  results.push({ label, status: '✅ approved' });
                  approved++;
                } catch (e) {
                  if (e.status === 422 || e.status === 409) {
                    core.info(`⏭️  Already processed: ${label}`);
                    results.push({ label, status: '⏭️ already processed' });
                    skipped++;
                  } else if (e.message && e.message.includes('not from a fork pull request')) {
                    // Same-repo PRs: approveWorkflowRun API only works for fork PRs.
                    // Use gh run rerun to clear action_required state for same-repo PRs.
                    core.info(`🔄 Same-repo PR — using gh run rerun for: ${label}`);
                    try {
                      await exec.exec('gh', ['run', 'rerun', String(run.id), '--repo', `${owner}/${repo}`], {
                        env: { ...process.env, GH_TOKEN: process.env.GITHUB_TOKEN },
                        ignoreReturnCode: true,
                      });
                      core.info(`✅ gh run rerun succeeded: ${label}`);
                      results.push({ label, status: '✅ rerun (same-repo)' });
                      approved++;
                    } catch (rerunErr) {
                      core.info(`⏭️  gh run rerun skipped (may already be approved): ${label}`);
                      results.push({ label, status: '⏭️ rerun skipped' });
                      skipped++;
                    }
                  } else {
                    core.warning(`❌ Failed to approve ${label}: ${e.message}`);
                    results.push({ label, status: `❌ error: ${e.message}` });
                    errors++;
                  }
                }
              }
              return { prNum, headSha, approved, skipped, errors, results };
            }

            // ── Build target list ─────────────────────────────────────────────
            let targets = [];  // [{prNum, headSha}]
            if (mode === 'schedule') {
              const prNums = process.env.PR_LIST.trim().split(/\s+/).filter(Boolean);
              core.info(`⏰ Schedule sweep (always-on): ${prNums.length} open PR(s) — ${prNums.join(', ')}`);
              for (const prNum of prNums) {
                // For schedule, label presence already confirmed — skip re-check
                try {
                  const headSha = await getHeadSha(prNum);
                  targets.push({ prNum, headSha });
                } catch (e) {
                  core.warning(`⚠️ Could not resolve head SHA for PR #${prNum} (${e?.message || String(e)}) — skipping`);
                }
              }
            } else {
              const prNum  = process.env.PR_NUMBER;
              const headSha = process.env.HEAD_SHA;
              // Always-on: no opt-in gate — Copilot approves on behalf of human admin.
              targets.push({ prNum, headSha });
            }

            // ── Approve all targets ───────────────────────────────────────────
            const allResults = [];
            let totalErrors = 0;
            for (const { prNum, headSha } of targets) {
              const r = await approvePR(prNum, headSha);
              allResults.push(r);
              totalErrors += r.errors;
            }

            // ── Job summary ───────────────────────────────────────────────────
            const lines = [
              `## ⚡ Auto-Approve — ${targets.length > 1 ? `${targets.length} PRs` : `PR #${targets[0].prNum}`}`,
              '',
              `| PR | HEAD SHA | Approved | Skipped | Errors |`,
              `|----|---------|---------|---------|--------|`,
            ];
            for (const r of allResults) {
              lines.push(`| #${r.prNum} | \`${r.headSha.slice(0,12)}\` | **${r.approved}** | ${r.skipped} | ${r.errors} |`);
            }
            lines.push('');
            lines.push(`_Mode: ${dryRun ? '🔍 DRY RUN' : '🚀 LIVE'} · Trigger: ${context.eventName} · ${new Date().toISOString()}_`);
            core.summary.addRaw('\n' + lines.join('\n') + '\n');
            await core.summary.write();

            if (totalErrors > 0) {
              core.setFailed(`${totalErrors} run(s) failed to be approved — check the logs above`);
            }

      # ── Step 4: One-session cleanup after a Copilot agent session completes ─
      #
      # If the PR carried the `wec:auto-approve-once` label, it means the owner
      # wanted auto-approve for exactly ONE Copilot session.  Now that the session
      # has ended, remove the label and uncheck the PR body checkbox so the feature
      # is disabled for the next session.
      - name: "One-session cleanup"
        if: github.event_name == 'workflow_run' && steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            exit 0
          fi

          # Check whether the one-session label is still present
          HAS_ONCE=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
            --json labels -q '[.labels[].name] | join(",")' 2>/dev/null \
            | grep -qF 'wec:auto-approve-once' && echo "true" || echo "false")

          if [ "${HAS_ONCE}" != "true" ]; then
            exit 0
          fi

          echo "🔔 One-session mode complete — disabling auto-approve for PR #${PR_NUMBER}..."

          # Remove the one-session label
          gh api --method DELETE \
            "repos/${REPO}/issues/${PR_NUMBER}/labels/wec%3Aauto-approve-once" \
            2>/dev/null && echo "✅ Label 'wec:auto-approve-once' removed." \
            || echo "::warning::Could not remove label (may already be gone)."

          # Uncheck [x] auto-approve-workflows in the PR body
          BODY=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json body -q '.body // ""' 2>/dev/null || echo "")
          if [ -n "${BODY}" ]; then
            printf '%s' "${BODY}" > /tmp/_aaw_cleanup_body.txt
            python3 -c "import re,sys; b=open('/tmp/_aaw_cleanup_body.txt').read(); b=re.sub(r'(?m)(^[ \t]*-[ \t]*\[)x\]([ \t]+auto-approve-workflows)',r'\1 ]\2',b); sys.stdout.write(b)" \
              > /tmp/_aaw_cleanup_out.txt
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" \
              --body "$(cat /tmp/_aaw_cleanup_out.txt)" \
              && echo "✅ PR body updated: [ ] auto-approve-workflows (one-session complete)." \
              || echo "::warning::Could not update PR body (non-fatal)."
          fi

          echo "🏁 One-session auto-approve complete for PR #${PR_NUMBER}."
