name: Copilot Agent Environment Setup

# This workflow customizes the ephemeral GitHub Actions environment where GitHub Copilot's
# coding agent operates. It preinstalls dependencies, sets environment variables, and configures
# the development environment before the agent starts working on code changes or PRs.
#
# CRITICAL: The job MUST be named "copilot-setup-steps" for GitHub Copilot to recognise it.
# Secrets referenced in the job env: block are injected into COPILOT_AGENT_INJECTED_SECRET_NAMES
# making them available to the coding agent session.
#
# Documentation: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
# Policy: Follows .codex/CODEBASE_AGENCY_POLICY.md
# Updated: S108 — added CODEX_MASTER_KEY + CODEX_BACKUP_KEY secret injection
# CRITICAL FIX (Session 1294-1295): Added CCA version lock + removed hard-blocking exit 1 calls

"on":
  workflow_dispatch:
    inputs:
      environment_type:
        description: 'Environment type to setup'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - ml-heavy
          - security-scan
          - documentation
      lfs_mode:
        description: 'Git LFS mode (none=baseline, targeted=fetch specific paths, full=fetch all)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - targeted
          - full
      lfs_include_paths:
        description: 'Comma-separated patterns for targeted LFS fetch (e.g., "data/models/*,artifacts/*")'
        required: false
        default: ''
        type: string
      lfs_continue_on_error:
        description: 'Continue on LFS fetch error (guards against missing blobs failing entire setup)'
        required: false
        default: true
        type: boolean
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .codex/agent_environment_config.yaml
      - pyproject.toml
      - requirements*.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .codex/agent_environment_config.yaml

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  RUST_VERSION: "stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: "Copilot Agent Environment Preparation"
    runs-on: ${{ (vars.COPILOT_RUNNER_PROFILE != '' && vars.COPILOT_RUNNER_PROFILE) || 'ubuntu-latest' }}
    timeout-minutes: 59
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      CODEX_MASTER_KEY: "${{ secrets.CODEX_MASTER_KEY }}"
      CODEX_BACKUP_KEY: "${{ secrets.CODEX_BACKUP_KEY }}"
      # ── CCA VERSION LOCK & DEDUPLICATION (Session 1294 fix) ────────────────────
      # CRITICAL: These three variables MUST be set for multi-turn agentic loops.
      # Without them, the Copilot Cloud Agent (CCA) runtime:
      #   - Cannot activate PayloadDeduplicator (function call deduplication)
      #   - Cannot enforce TurnState isolation (turn-state segregation)
      #   - Falls back to unsafe defaults (no duplicate protection)
      # Result: Agent fast-fails on turn 2+ with "Duplicate function call ID" error.
      #
      # See .github/copilot-evolution/integrated_system.py for implementation:
      #   - PayloadDeduplicator (lines 43-164): Removes duplicate function calls
      #   - TurnState (lines 28-42): Isolates state between agentic turns
      #   - deduplicate_agentic_payload() (line 242): Public API for deduplication
      #
      # Reference: .codex/CODEBASE_AGENCY_POLICY.md § Session Integrity
      COPILOT_AGENT_CCA_VERSION_LOCK: "stable"
      COPILOT_AGENT_DEDUPLICATION_ENABLED: "true"
      COPILOT_AGENT_TURN_ISOLATION_ENABLED: "true"
      LFS_DIAGNOSTICS_ENABLED: "${{ github.event_name == 'workflow_dispatch' && (inputs.lfs_mode == 'full' || (inputs.lfs_mode == 'targeted' && inputs.lfs_include_paths != '')) }}"
      LFS_FETCH_ENABLED: "${{ github.event_name == 'workflow_dispatch' && (inputs.lfs_mode == 'full' || inputs.lfs_mode == 'targeted') }}"
      LFS_TARGETED_ENABLED: "${{ github.event_name == 'workflow_dispatch' && inputs.lfs_mode == 'targeted' && inputs.lfs_include_paths != '' }}"
      LFS_FULL_ENABLED: "${{ github.event_name == 'workflow_dispatch' && inputs.lfs_mode == 'full' }}"

    steps:
      # ============================================================================
      # Phase 1: Repository & Code Setup
      # ============================================================================
      - name: "📦 Checkout Repository (baseline: no LFS content)"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true
          clean: true
          show-progress: true

      - name: "🧠 Session Context Pre-load (memory + policy + accountability + PDA)"
        continue-on-error: true
        run: |
          python3 .github/scripts/session_preload.py || {
            echo "⚠️ session_preload.py failed (non-blocking) — agent will operate without preloaded context"
          }

      - name: "🔌 Session Access Probe (token inventory + rate limits)"
        id: access_probe
        continue-on-error: true
        env:
          CODEX_MASTER_KEY: "${{ secrets.CODEX_MASTER_KEY }}"
          CODEX_BACKUP_KEY: "${{ secrets.CODEX_BACKUP_KEY }}"
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          echo "::group::Session Access Probe"
          if ! python3 scripts/ci/session_access_probe.py; then
            echo "⚠️ Access probe failed (non-blocking) — agent will use local-FS fallback"
            echo "ACCESS_REST=unknown"          >> "$GITHUB_ENV"
            echo "ACCESS_GRAPHQL=unknown"       >> "$GITHUB_ENV"
            echo "ACCESS_GH_CLI=unknown"        >> "$GITHUB_ENV"
            echo "ACCESS_CODEQL_CLI=unknown"    >> "$GITHUB_ENV"
            echo "ACCESS_RECOMMENDED_METHOD=local_fs" >> "$GITHUB_ENV"
          fi
          echo "::endgroup::"

      - name: "🧠 Autonomous RAG Context Build (PR context + RAG query + incremental index)"
        id: rag_context
        continue-on-error: true
        env:
          CODEX_MASTER_KEY: "${{ secrets.CODEX_MASTER_KEY }}"
          CODEX_BACKUP_KEY: "${{ secrets.CODEX_BACKUP_KEY }}"
          GITHUB_TOKEN: "${{ github.token }}"
          GITHUB_PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          echo "::group::Autonomous RAG Context Build"
          if [ -n "${GITHUB_PR_NUMBER:-}" ]; then
            if ! python3 scripts/ci/autonomous_rag_context.py --pr "${GITHUB_PR_NUMBER}"; then
              echo "⚠️ RAG context build failed (non-blocking) — agent will use cached context"
            fi
          elif ! python3 scripts/ci/autonomous_rag_context.py; then
            echo "⚠️ RAG context build failed (non-blocking) — agent will use cached context"
          fi
          if [ -f .codex/session_access_strategy.json ]; then
            echo "--- Access Strategy ---"
            cat .codex/session_access_strategy.json
          fi
          echo "::endgroup::"

      - name: "⚙️ Configure git for non-interactive CI operation"
        run: |
          git config --global core.editor "true"
          git config --global advice.mergeConflict false
          echo "✅ git configured: core.editor=true, advice.mergeConflict=false"

      - name: "🔀 Fetch remote branch refs for PR diff support"
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --depth=1 2>/dev/null \
            && echo "✅ Remote branch refs fetched (as origin/*)" \
            || echo "⚠️ Remote ref fetch failed (non-blocking)"
          git branch -f main origin/main 2>/dev/null \
            && echo "✅ main available as local branch ref" \
            || echo "⚠️ Could not create local main ref (non-blocking)"
          BASE="${{ github.base_ref }}"
          if [ -n "$BASE" ] && [ "$BASE" != "main" ]; then
            git branch -f "$BASE" "origin/$BASE" 2>/dev/null \
              && echo "✅ $BASE available as local branch ref" \
              || echo "⚠️ Could not create local $BASE ref (non-blocking)"
          fi

      - name: "🔀 Merge Conflict Pre-Check (session start)"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          echo "── §0.4: Inspecting PR for merge conflicts ──"
          BASE="${BASE_REF}"
          
          if [ -n "$PR_NUMBER" ]; then
            MERGEABLE=$(gh pr view "$PR_NUMBER" --json mergeable -q .mergeable 2>/dev/null || echo "UNKNOWN")
            echo "PR #${PR_NUMBER} mergeable status: ${MERGEABLE}"
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "::warning::§0.4 MERGE CONFLICT DETECTED — PR #${PR_NUMBER} has merge conflicts with base branch '${BASE}'. Agent MUST resolve these before any other work."
              echo "COPILOT_MERGE_CONFLICT=true" >> "$GITHUB_ENV"
            elif [ "$MERGEABLE" = "MERGEABLE" ]; then
              echo "✅ No merge conflicts detected"
              echo "COPILOT_MERGE_CONFLICT=false" >> "$GITHUB_ENV"
            else
              echo "ℹ️ Mergeable status: ${MERGEABLE} (GitHub may still be computing)"
              echo "COPILOT_MERGE_CONFLICT=unknown" >> "$GITHUB_ENV"
            fi
          fi
          
          if [ -n "$BASE" ]; then
            BEHIND=$(git rev-list --count "HEAD..origin/${BASE}" 2>/dev/null || echo "0")
            AHEAD=$(git rev-list --count "origin/${BASE}..HEAD" 2>/dev/null || echo "0")
            echo "Branch status: ${BEHIND} behind, ${AHEAD} ahead of ${BASE}"
            if [ "$BEHIND" -gt 0 ]; then
              echo "::warning::§0.4 BRANCH DIVERGED — Branch is ${BEHIND} commit(s) behind '${BASE}'. Agent should rebase or merge base before starting work."
              echo "COPILOT_BRANCH_BEHIND=${BEHIND}" >> "$GITHUB_ENV"
            else
              echo "✅ Branch is up-to-date with ${BASE}"
              echo "COPILOT_BRANCH_BEHIND=0" >> "$GITHUB_ENV"
            fi
          fi
          
          if [ -n "$BASE" ] && git rev-parse "origin/${BASE}" >/dev/null 2>&1; then
            MERGE_BASE=$(git merge-base HEAD "origin/${BASE}" 2>/dev/null || echo "")
            if [ -n "$MERGE_BASE" ]; then
              CONFLICT_FILES=$(git merge-tree "$MERGE_BASE" HEAD "origin/${BASE}" 2>/dev/null | grep -c '<<<<<<< ' || echo "0")
              if [ "$CONFLICT_FILES" -gt 0 ]; then
                echo "::warning::§0.4 POTENTIAL CONFLICTS — merge-tree detected ${CONFLICT_FILES} file(s) with conflicts against '${BASE}'"
              else
                echo "✅ merge-tree: no file-level conflicts detected"
              fi
            fi
          fi
          
          echo "── §0.4 merge conflict pre-check complete ──"

      - name: "🚨 CI Failure Issue Check (session start)"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        run: |
          echo "── §0.2: Checking for open CI failure report issues ──"
          REPO="Aries-Serpent/_codex_"
          
          CI_FAILURES=$(gh issue list --repo "$REPO" --label "ci-failure" --state open \
            --json number,title,updatedAt --jq 'length' 2>/dev/null || echo "0")
          echo "Open ci-failure issues: ${CI_FAILURES}"
          
          HEALTH_ALERTS=$(gh issue list --repo "$REPO" --label "ci-health-alert" --state open \
            --json number,title,updatedAt --jq 'length' 2>/dev/null || echo "0")
          echo "Open ci-health-alert issues: ${HEALTH_ALERTS}"
          
          TOTAL=$((CI_FAILURES + HEALTH_ALERTS))
          echo "COPILOT_CI_FAILURE_ISSUES=${TOTAL}" >> "$GITHUB_ENV"
          
          if [ "$TOTAL" -gt 0 ]; then
            echo "::warning::§0.2 OPEN CI FAILURE ISSUES — ${TOTAL} open issue(s) found (${CI_FAILURES} ci-failure, ${HEALTH_ALERTS} ci-health-alert). Agent should review these for patterns affecting this PR."
            echo ""
            echo "── Open CI failure issues: ──"
            gh issue list --repo "$REPO" --label "ci-failure" --state open \
              --json number,title --jq '.[] | "#\(.number): \(.title)"' 2>/dev/null || true
            gh issue list --repo "$REPO" --label "ci-health-alert" --state open \
              --json number,title --jq '.[] | "#\(.number): \(.title)"' 2>/dev/null || true
          else
            echo "✅ No open CI failure report issues"
          fi
          
          echo "── §0.2 CI failure issue check complete ──"

      - name: "🔍 Validate repo JSON files (non-blocking)"
        continue-on-error: true
        run: |
          echo "── Validating JSON files in .codex/ and docs/ ──"
          FAIL=0
          INVALID_FILES=""
          
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::warning file=${f}::Invalid JSON detected (non-blocking): ${f}"
              INVALID_FILES="${INVALID_FILES}${f}\n"
              FAIL=$((FAIL + 1))
            fi
          done < <(find .codex docs -name "*.json" -not -path "*/__pycache__/*" -print0 2>/dev/null)
          
          if [ "$FAIL" -gt 0 ]; then
            echo "::warning::⚠️ Found ${FAIL} invalid JSON file(s) — these will be addressed by agent session"
            echo "--- Invalid JSON Files ---"
            printf "$INVALID_FILES"
            echo "--- Agent will remediate these errors ---"
          else
            echo "✅ All JSON files valid"
          fi

      - name: "🔑 Inject repo variable context for agent"
        continue-on-error: true
        run: |
          if [ ! -f .github/scripts/inject_context_vars.py ]; then
            echo "::warning::inject_context_vars.py not found (non-blocking)"
          else
            python3 .github/scripts/inject_context_vars.py || {
              echo "::warning::Failed to inject context vars (non-blocking) — agent will proceed with defaults"
            }
          fi

      - name: "⚙️ Inject cascade-control & tuning variables (live vars fallback)"
        continue-on-error: true
        env:
          CODEX_MAX_HEALER_RUNS_PER_HOUR: ${{ vars.CODEX_MAX_HEALER_RUNS_PER_HOUR }}
          CODEX_SWEEP_SKIP_MAIN: ${{ vars.CODEX_SWEEP_SKIP_MAIN }}
          CODEX_HEALER_SKIP_SKIPCI: ${{ vars.CODEX_HEALER_SKIP_SKIPCI }}
          COPILOT_RUNNER_PROFILE: ${{ vars.COPILOT_RUNNER_PROFILE }}
          CODEX_CACHE_VERSION: ${{ vars.CODEX_CACHE_VERSION }}
          COPILOT_AGENT_STATE: ${{ vars.COPILOT_AGENT_STATE }}
          CODEX_CI_LAST_GREEN_SHA: ${{ vars.CODEX_CI_LAST_GREEN_SHA }}
        run: |
          for var in \
            CODEX_MAX_HEALER_RUNS_PER_HOUR \
            CODEX_SWEEP_SKIP_MAIN \
            CODEX_HEALER_SKIP_SKIPCI \
            COPILOT_RUNNER_PROFILE \
            CODEX_CACHE_VERSION \
            COPILOT_AGENT_STATE \
            CODEX_CI_LAST_GREEN_SHA; do
            val="${!var}"
            if [ -n "$val" ]; then
              echo "${var}=${val}" >> "$GITHUB_ENV"
              echo "  ✅ ${var}=${val}"
            fi
          done
          echo "── Cascade-control var injection complete ──"

      - name: "🛡️ Install safe-git-show guard on PATH"
        continue-on-error: true
        run: |
          if [ ! -f scripts/ci/safe_git_show.sh ]; then
            echo "::warning::scripts/ci/safe_git_show.sh not found (non-blocking) — agent will proceed without guard"
          else
            install -m 0755 scripts/ci/safe_git_show.sh /usr/local/bin/safe_git_show.sh 2>/dev/null || {
              echo "::warning::Failed to install safe_git_show (non-blocking) — agent will proceed"
            }
            ln -sf /usr/local/bin/safe_git_show.sh /usr/local/bin/safe_git_show 2>/dev/null || true
            echo "✅ safe_git_show installed at $(command -v safe_git_show 2>/dev/null || echo 'UNKNOWN')"
          fi

      - name: "🔭 LFS diagnostics"
        if: ${{ env.LFS_DIAGNOSTICS_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          echo "Git version: $(git --version)"
          echo "LFS version: $(git lfs version 2>/dev/null || echo 'git-lfs not installed')"
          git status || true
          git lfs ls-files || true

      - name: "📥 Install git-lfs (if needed)"
        if: ${{ env.LFS_FETCH_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y git-lfs || {
                echo "::warning::Failed to install git-lfs (non-blocking)"
              }
            fi
          fi
          git lfs install --local || true

      - name: "🎯 Targeted LFS fetch & checkout (guarded)"
        if: ${{ env.LFS_TARGETED_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          INCLUDES="${{ inputs.lfs_include_paths }}"
          INCLUDES_CLEAN=$(echo "$INCLUDES" | tr -d ' ' | tr ',' ' ')
          echo "Targeted LFS includes: $INCLUDES_CLEAN"
          
          for i in 1 2 3; do
            echo "Attempt $i: git lfs fetch --include=\"$INCLUDES_CLEAN\" origin"
            if git lfs fetch --include="$INCLUDES_CLEAN" origin; then
              echo "git lfs fetch succeeded"
              break
            else
              echo "git lfs fetch failed on attempt $i (non-blocking)"
              sleep $((i * 5))
            fi
          done
          
          git lfs checkout --include="$INCLUDES_CLEAN" || true

      - name: "🌐 Full LFS fetch & checkout (guarded)"
        if: ${{ env.LFS_FULL_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: git lfs fetch --all origin"
            if git lfs fetch --all origin; then
              echo "git lfs fetch --all succeeded"
              break
            else
              echo "git lfs fetch --all failed on attempt $i (non-blocking)"
              sleep $((i * 5))
            fi
          done
          
          git lfs checkout || true

      - name: "🔍 Detect Environment Type"
        id: detect_env
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
          INPUT_ENV_TYPE: ${{ github.event.inputs.environment_type || 'standard' }}
        run: |
          ENV_TYPE="${INPUT_ENV_TYPE}"
          if [[ "$ENV_TYPE" == "standard" ]]; then
            if [[ "${HEAD_REF}" == *"ml"* ]] || [[ "${HEAD_REF}" == *"rag"* ]]; then
              ENV_TYPE="ml-heavy"
            elif [[ "${HEAD_REF}" == *"security"* ]] || [[ "${HEAD_REF}" == *"sec"* ]]; then
              ENV_TYPE="security-scan"
            elif [[ "${HEAD_REF}" == *"docs"* ]] || [[ "${HEAD_REF}" == *"documentation"* ]]; then
              ENV_TYPE="documentation"
            fi
          fi
          echo "environment_type=$ENV_TYPE" >> "$GITHUB_OUTPUT"
          echo "✅ Detected environment type: $ENV_TYPE"

      - name: "✅ Validate Environment Setup"
        continue-on-error: true
        run: |
          trap '' PIPE
          set +o pipefail
          
          echo "==================== Environment Validation ===================="
          echo "Python Version: $(python --version 2>&1)"
          echo "Pip Version: $(pip --version 2>&1)"
          echo "Node Version: $(node --version 2>/dev/null || echo 'Not installed')"
          echo "Rust Version: $(rustc --version 2>/dev/null || echo 'Not installed')"
          echo ""
          echo "==================== Installed Packages ===================="
          pip list 2>/dev/null | head -20 || true
          echo "..."
          echo ""
          echo "==================== Environment Variables ===================="
          env | grep -E "^(CODEX|PYTHON|RAG|CI|GITHUB|COPILOT)" | sort || true
          echo ""
          echo "==================== Disk Space ===================="
          df -h | grep -E "^/dev" || true
          echo ""
          echo "✅ Environment setup complete for type: ${{ steps.detect_env.outputs.environment_type }}"

      - name: "🏥 Run Health Check"
        continue-on-error: true
        run: |
          echo "Checking critical paths..."
          test -d src/codex && echo "✅ src/codex exists" || echo "⚠️ src/codex missing (non-blocking)"
          test -d .codex && echo "✅ .codex exists" || echo "⚠️ .codex missing (non-blocking)"
          test -d tests && echo "✅ tests exists" || echo "⚠️ tests missing (non-blocking)"
          test -f pyproject.toml && echo "✅ pyproject.toml exists" || echo "⚠️ pyproject.toml missing (non-blocking)"
          python -c "import codex; print('✅ codex package importable')" 2>/dev/null || echo "⚠️ codex package import failed (non-blocking)"
          which ruff && echo "✅ ruff available" || echo "⚠️ ruff not available (non-blocking)"
          which black && echo "✅ black available" || echo "⚠️ black not available (non-blocking)"
          which pytest && echo "✅ pytest available" || echo "⚠️ pytest not available (non-blocking)"

      - name: "📊 Session Lifecycle Metrics"
        continue-on-error: true
        run: |
          if [ -f scripts/session_tracker.py ]; then
            echo "──────── Session Lifecycle Metrics ────────"
            python scripts/session_tracker.py metrics || true
            echo ""
            # Write JSON metrics to GITHUB_STEP_SUMMARY
            METRICS_JSON=$(python scripts/session_tracker.py metrics --format json 2>/dev/null || echo '{}')
            echo "## 📊 Session Lifecycle Metrics" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            echo "$METRICS_JSON" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️  session_tracker.py not found — skipping metrics"
          fi

      # ============================================================================
      # Phase 8: Cache Preparation (Optional)
      # ============================================================================
      - name: "💾 Prepare Cache Artifacts"
        run: |
          mkdir -p .codex/cache
          mkdir -p .codex/sessions
          echo "✅ Cache directories prepared"

      - name: "📊 Accountability Auto-Update (session close hook)"
        continue-on-error: true
        env:
          CODEX_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Run accountability auto-update in dry-run mode during setup to
          # pre-validate the script. The actual --commit run is triggered at
          # session close by the agent itself or post-job hooks.
          if [ -f src/codex/session/accountability_autoupdate.py ]; then
            echo "✅ Accountability auto-update script available"
            python -m src.codex.session.accountability_autoupdate --dry-run 2>/dev/null \
              && echo "  → dry-run validation passed" \
              || echo "  ⚠️ dry-run validation skipped (non-blocking)"
          else
            echo "⚠️ accountability_autoupdate.py not found — skipping"
          fi

      # ============================================================================
      # Phase 9: Agent-Specific Initialization
      # ============================================================================
      - name: "🔄 Rotate Cognitive Brain Status Files"
        continue-on-error: true
        run: |
          if [ -f scripts/ci/rotate_cognitive_brain_status.py ]; then
            python scripts/ci/rotate_cognitive_brain_status.py --keep 50 --threshold 60 || true
          fi

      - name: "🤖 Initialize Cognitive Brain Context"
        continue-on-error: true   # Phase 3 hardening: optional init (ls|head SIGPIPE) must not block agent startup
        run: |
          if [ -f .github/agents/AGENT_REGISTRY.yaml ]; then
            echo "✅ Loading specialized agents from registry..."
            head -20 .github/agents/AGENT_REGISTRY.yaml || true
          fi
          if [ -d cognitive/ ]; then
            echo "✅ Cognitive brain components available"
            ls -la cognitive/ | head -10
          fi

      - name: "💻 Start CLI API Server (background)"
        # Sprint 2: auto-start FastAPI :8765 so the CLI tab is live when the
        # Copilot agent session begins. Guarded — non-blocking on missing deps.
        # Gap-fix (S112): export CODEX_CLI_API_URL so BrainClient + agents can
        # discover the server URL without hard-coding it.  Also add a retry loop
        # (up to 5 × 1 s) so slow startup does not produce a false-negative.
        continue-on-error: true
        run: |
          if [ ! -f cognitive_app/src/server/cli_api_server.py ]; then
            echo "⚠️ cli_api_server.py not found — skipping (non-blocking)"
            exit 0
          fi
          pip install fastapi uvicorn httpx ptyprocess --quiet 2>/dev/null || true
          # Explicitly forward auth tokens to the server process env.
          # Even though CODEX_MASTER_KEY is in the job env block, child processes
          # started with nohup inherit from the CURRENT step env — which already
          # has these values. The explicit assignment below makes the intent clear
          # and is idempotent.
          export CODEX_MASTER_KEY="${CODEX_MASTER_KEY:-}"
          export CODEX_BACKUP_KEY="${CODEX_BACKUP_KEY:-}"
          export AGENT_GITHUB_TOKEN="${GITHUB_TOKEN:-}"
          nohup uvicorn cognitive_app.src.server.cli_api_server:app \
            --host 0.0.0.0 \
            --port 8765 \
            --log-level warning \
            > "${RUNNER_TEMP}/cli_api_server.log" 2>&1 &
          CLI_API_PID=$!
          echo "CLI_API_SERVER_PID=${CLI_API_PID}" >> "$GITHUB_ENV"
          # Always export http://localhost:8765 — the server is started on that
          # fixed address above.  Deriving from COPILOT_CLI_BASE_URL was
          # misleading: if that variable pointed to a different host/port the
          # exported URL would be wrong while the health check (which always
          # hits localhost:8765) still passed.  Hard-code the actual address.
          echo "CODEX_CLI_API_URL=http://localhost:8765" >> "$GITHUB_ENV"
          # Retry health-check up to 5 s to accommodate slower startup
          SERVER_READY=0
          for i in 1 2 3 4 5; do
            sleep 1
            if curl -sf http://localhost:8765/api/health > /dev/null 2>&1; then
              SERVER_READY=1
              break
            fi
          done
          if [ "$SERVER_READY" = "1" ]; then
            echo "✅ CLI API Server ready on :8765 (PID=${CLI_API_PID})"
            echo "   BrainClient URL: http://localhost:8765"
            echo "   Import: from codex.agents.brain_client import BrainClient"
            # Report which auth token the server can use for GitHub API calls
            if [ -n "${CODEX_MASTER_KEY:-}" ]; then
              echo "   🔑 Auth: CODEX_MASTER_KEY active (full PAT — variables/secrets API ✅)"
            elif [ -n "${CODEX_BACKUP_KEY:-}" ]; then
              echo "   🔑 Auth: CODEX_BACKUP_KEY active (fallback PAT)"
            elif [ -n "${GITHUB_TOKEN:-}" ]; then
              echo "   🔑 Auth: GITHUB_TOKEN active (actions:write scope)"
            else
              echo "   ⚠️  No auth token — GitHub API calls will be unauthenticated (rate-limited)"
            fi
          else
            echo "⚠️ CLI API Server did not respond after 5 s — see RUNNER_TEMP/cli_api_server.log"
            cat "${RUNNER_TEMP}/cli_api_server.log" 2>/dev/null | tail -20 || true
          fi

      - name: "📊 Generate Environment Report (temp path)"
        id: gen_report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="${RUNNER_TEMP:-/tmp}"
          REPORT="$REPORT_DIR/.copilot-agent-environment-report.txt"
          {
            echo "==================== Copilot Agent Environment Report ===================="
            echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Environment Type: ${{ steps.detect_env.outputs.environment_type }}"
            echo "Runner: ${{ runner.os }} ${{ runner.arch }}"
            echo ""
            echo "Python: $(python --version)"
            echo "Node: $(node --version 2>/dev/null || echo 'N/A')"
            echo "Rust: $(rustc --version 2>/dev/null || echo 'N/A')"
            echo ""
            echo "Installed Packages: $(pip list | wc -l) packages"
            echo "Disk Space: $(df -h / | tail -1 | awk '{print $4}') available"
            echo ""
            echo "Status: ✅ Environment ready for Copilot agent operations"
          } > "$REPORT"
          echo "Report written to $REPORT"
          head -20 "$REPORT" || true
          echo "REPORT_PATH=$REPORT" >> "$GITHUB_OUTPUT"

      - name: "📤 Upload Environment Report"
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: copilot-agent-environment-report
          path: ${{ steps.gen_report.outputs.REPORT_PATH }}
          retention-days: 7
          if-no-files-found: warn

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: copilot-setup-steps
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Copilot Setup Steps"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
