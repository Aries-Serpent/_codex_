name: Copilot Agent Environment Setup

# This workflow customizes the ephemeral GitHub Actions environment where GitHub Copilot's
# coding agent operates. It preinstalls dependencies, sets environment variables, and configures
# the development environment before the agent starts working on code changes or PRs.
#
# CRITICAL: The job MUST be named "copilot-setup-steps" for GitHub Copilot to recognise it.
# Secrets referenced in the job env: block are injected into COPILOT_AGENT_INJECTED_SECRET_NAMES
# making them available to the coding agent session.
#
# Documentation: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
# Policy: Follows .codex/CODEBASE_AGENCY_POLICY.md
# Updated: S108 — added CODEX_MASTER_KEY + CODEX_BACKUP_KEY secret injection

on:
  workflow_dispatch:
    inputs:
      environment_type:
        description: 'Environment type to setup'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - ml-heavy
          - security-scan
          - documentation
      # Selectively reintroduce LFS behavior behind guards (safe defaults kept)
      lfs_mode:
        description: 'Git LFS mode (none=baseline, targeted=fetch specific paths, full=full=fetch all)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - targeted
          - full
      lfs_include_paths:
        description: 'Comma-separated patterns for targeted LFS fetch (e.g., "data/models/*,artifacts/*")'
        required: false
        default: ''
        type: string
      lfs_continue_on_error:
        description: 'Continue on LFS fetch error (guards against missing blobs failing entire setup)'
        required: false
        default: true
        type: boolean
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .codex/agent_environment_config.yaml
      - pyproject.toml
      - requirements*.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .codex/agent_environment_config.yaml

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  RUST_VERSION: "stable"  # Use stable to support Cargo.lock v4 format (requires 1.78+)


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  copilot-setup-steps:
    name: "Copilot Agent Environment Preparation"
    # AAIS-aligned autonomous runner switch.
    # Runner: ubuntu-latest-m (4-core / 16 GB RAM / 150 GB SSD)
    #   Group : AS Larger Runners | Platform: Linux x64
    #   Image : Ubuntu Latest (24.04) | Custom image generation: Enabled (Preview)
    #   Custom image generation (Preview) allows building a tailored runner snapshot
    #   with project dependencies pre-baked, cutting cold-start time to near zero.
    #   See docs/plans/larger-runners-upgrade.md § 5 for the custom-image build plan.
    #
    # Default: ubuntu-latest-m (provisioned 2026-03-05 — AS Larger Runners group).
    # Set repo variable COPILOT_RUNNER_PROFILE to override:
    #   ubuntu-latest-m → standard sessions (default)
    #   ubuntu-8-core   → ml-heavy sessions (PyTorch, RAG embeddings) if provisioned
    #   ubuntu-16-core  → security-scan / full Rust release builds if provisioned
    # The Cognitive Brain can set COPILOT_RUNNER_PROFILE via the Variables API
    # (using CODEX_MASTER_KEY) before dispatching a heavy session.
    # See: docs/plans/larger-runners-upgrade.md § 4 — Autonomous Switch
    #
    # Runner fallback chain:
    #   1. COPILOT_RUNNER_PROFILE repo variable (e.g. ubuntu-latest-m, ubuntu-8-core)
    #   2. ubuntu-latest — GitHub-hosted, always available, prevents "no runner" failures
    #
    # Root cause of "✅ Validate Environment Setup" failures (sessions f62db13c etc.):
    #   ubuntu-latest-m may not be available in all runner groups/regions, causing
    #   the job to fail before any step runs.  Falling back to ubuntu-latest ensures
    #   the Copilot agent session can always start; larger runners remain opt-in.
    runs-on: ${{ vars.COPILOT_RUNNER_PROFILE || 'ubuntu-latest' }}
    timeout-minutes: 59
    permissions:
      contents: read
      actions: write       # Required: trigger workflows, download artifacts, manage workflow runs
      issues: write        # Allow agent to post @copilot follow-up comments
      pull-requests: write # Allow agent to post PR review comments
      # NOTE: actions:write does NOT grant access to the Actions Variables API.
      # Variables API requires CODEX_MASTER_KEY (classic PAT, repo scope).
      # See docs/agent/COPILOT_TOKEN_GUIDE.md#permission-matrix
    # Baseline stability: skip LFS smudge and do not fetch LFS during initial checkout
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      # ── Cognitive Brain secret injection ──────────────────────────────────────
      # Referencing these org secrets here causes GitHub Copilot coding agent to
      # inject them as env vars (COPILOT_AGENT_INJECTED_SECRET_NAMES) so that
      # GitHubMCPPoster and structural_policy_manager can use them autonomously.
      # See: .codex/docs/ADMIN_MANUAL_SETUP_GUIDE.md § 3
      CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
      CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}

    steps:
      # ============================================================================
      # Phase 1: Repository & Code Setup
      # ============================================================================

      - name: "📦 Checkout Repository (baseline: no LFS content)"
        uses: actions/checkout@v5
        with:
          fetch-depth: 0                 # Full history; required by some tools and avoids HEAD ambiguity
          lfs: false                     # Baseline stability: avoid LFS fetch during setup
          persist-credentials: true      # Keep token for any subsequent git operations
          clean: true
          show-progress: true

      # Configure git for non-interactive operation in the CI agent environment.
      # core.editor=true: prevents 'git rebase --continue' and similar commands
      # from opening an interactive editor (e.g. nano) and hanging the runner.
      # advice.mergeConflict=false: suppresses verbose rebase/merge hint spam.
      - name: "⚙️ Configure git for non-interactive CI operation"
        run: |
          git config --global core.editor "true"
          git config --global advice.mergeConflict false
          echo "✅ git configured: core.editor=true, advice.mergeConflict=false"

      # Fix: actions/checkout only fetches the checked-out branch even with
      # fetch-depth: 0. The Copilot coding agent's internal diff (report_progress)
      # needs the PR base branch ref to be resolvable as a *local* branch name.
      # Without this, git fails:
      #   "fatal: ambiguous argument '<base_branch>': unknown revision"
      # Step 1: shallow-fetch all remote branch tips into remote tracking refs
      #         so 'origin/main' (and friends) resolve.
      # Step 2: promote 'origin/main' to a local branch ref so that bare 'main'
      #         also resolves (git-diff, git-log, git-show etc. require a local ref
      #         or the full 'origin/main' spelling; DWIM does NOT map 'main' →
      #         'refs/remotes/origin/main').
      # Step 3: promote the PR base branch (${{ github.base_ref }}) to a local ref
      #         so that 'git diff <base_ref>' always resolves — even when the base
      #         branch is not 'main' (e.g. copilot/resolve-failing-checks).
      # See: https://github.com/actions/checkout/issues/1262
      - name: "🔀 Fetch remote branch refs for PR diff support"
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --depth=1 2>/dev/null \
            && echo "✅ Remote branch refs fetched (as origin/*)" \
            || echo "⚠️ Remote ref fetch failed (non-blocking)"
          # Always promote 'main' to a local branch ref.
          git branch -f main origin/main 2>/dev/null \
            && echo "✅ main available as local branch ref" \
            || echo "⚠️ Could not create local main ref (non-blocking)"
          # Promote the PR base branch to a local ref so 'git diff <base_ref>'
          # resolves correctly regardless of which branch the PR targets.
          BASE="${{ github.base_ref }}"
          if [ -n "$BASE" ] && [ "$BASE" != "main" ]; then
            git branch -f "$BASE" "origin/$BASE" 2>/dev/null \
              && echo "✅ $BASE available as local branch ref" \
              || echo "⚠️ Could not create local $BASE ref (non-blocking)"
          fi

      # ── Merge Conflict Pre-Check (§0.4 CODEBASE_AGENCY_POLICY.md) ──────────
      # Every Copilot session MUST start conflict-free. This step detects existing
      # merge conflicts and branch divergence BEFORE the agent begins any work.
      # If conflicts are found, a warning annotation is emitted so the agent can
      # resolve them as its first action (per §0.4).
      - name: "🔀 Merge Conflict Pre-Check (session start)"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          echo "── §0.4: Inspecting PR for merge conflicts ──"
          BASE="${BASE_REF}"
          HEAD="${HEAD_REF}"

          # 1. Check PR mergeable status via GitHub API
          if [ -n "$PR_NUMBER" ]; then
            MERGEABLE=$(gh pr view "$PR_NUMBER" --json mergeable -q .mergeable 2>/dev/null || echo "UNKNOWN")
            echo "PR #${PR_NUMBER} mergeable status: ${MERGEABLE}"
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "::warning::§0.4 MERGE CONFLICT DETECTED — PR #${PR_NUMBER} has merge conflicts with base branch '${BASE}'. Agent MUST resolve these before any other work."
              echo "COPILOT_MERGE_CONFLICT=true" >> "$GITHUB_ENV"
            elif [ "$MERGEABLE" = "MERGEABLE" ]; then
              echo "✅ No merge conflicts detected"
              echo "COPILOT_MERGE_CONFLICT=false" >> "$GITHUB_ENV"
            else
              echo "ℹ️ Mergeable status: ${MERGEABLE} (GitHub may still be computing)"
              echo "COPILOT_MERGE_CONFLICT=unknown" >> "$GITHUB_ENV"
            fi
          fi

          # 2. Check branch divergence (behind/ahead)
          if [ -n "$BASE" ]; then
            BEHIND=$(git rev-list --count "HEAD..origin/${BASE}" 2>/dev/null || echo "0")
            AHEAD=$(git rev-list --count "origin/${BASE}..HEAD" 2>/dev/null || echo "0")
            echo "Branch status: ${BEHIND} behind, ${AHEAD} ahead of ${BASE}"
            if [ "$BEHIND" -gt 0 ]; then
              echo "::warning::§0.4 BRANCH DIVERGED — Branch is ${BEHIND} commit(s) behind '${BASE}'. Agent should rebase or merge base before starting work."
              echo "COPILOT_BRANCH_BEHIND=${BEHIND}" >> "$GITHUB_ENV"
            else
              echo "✅ Branch is up-to-date with ${BASE}"
              echo "COPILOT_BRANCH_BEHIND=0" >> "$GITHUB_ENV"
            fi
          fi

          # 3. Dry-run merge-tree check for potential file-level conflicts
          if [ -n "$BASE" ] && git rev-parse "origin/${BASE}" >/dev/null 2>&1; then
            MERGE_BASE=$(git merge-base HEAD "origin/${BASE}" 2>/dev/null || echo "")
            if [ -n "$MERGE_BASE" ]; then
              CONFLICT_FILES=$(git merge-tree "$MERGE_BASE" HEAD "origin/${BASE}" 2>/dev/null | grep -c '<<<<<<< ' || echo "0")
              if [ "$CONFLICT_FILES" -gt 0 ]; then
                echo "::warning::§0.4 POTENTIAL CONFLICTS — merge-tree detected ${CONFLICT_FILES} file(s) with conflicts against '${BASE}'"
              else
                echo "✅ merge-tree: no file-level conflicts detected"
              fi
            fi
          fi

          echo "── §0.4 merge conflict pre-check complete ──"

      # ── CI Failure Issue Check (§0.2 CODEBASE_AGENCY_POLICY.md) ─────────────
      # Check for open CI failure report issues that may contain relevant failure
      # patterns. These issues are auto-created by ci-failure-issue-creator.yml
      # and ci-health-monitor.yml when workflows fail on main.
      - name: "🚨 CI Failure Issue Check (session start)"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        run: |
          echo "── §0.2: Checking for open CI failure report issues ──"
          REPO="Aries-Serpent/_codex_"

          # Check for ci-failure issues (per-workflow failure reports)
          CI_FAILURES=$(gh issue list --repo "$REPO" --label "ci-failure" --state open \
            --json number,title,updatedAt --jq 'length' 2>/dev/null || echo "0")
          echo "Open ci-failure issues: ${CI_FAILURES}"

          # Check for ci-health-alert issues (high failure rate alerts)
          HEALTH_ALERTS=$(gh issue list --repo "$REPO" --label "ci-health-alert" --state open \
            --json number,title,updatedAt --jq 'length' 2>/dev/null || echo "0")
          echo "Open ci-health-alert issues: ${HEALTH_ALERTS}"

          TOTAL=$((CI_FAILURES + HEALTH_ALERTS))
          echo "COPILOT_CI_FAILURE_ISSUES=${TOTAL}" >> "$GITHUB_ENV"

          if [ "$TOTAL" -gt 0 ]; then
            echo "::warning::§0.2 OPEN CI FAILURE ISSUES — ${TOTAL} open issue(s) found (${CI_FAILURES} ci-failure, ${HEALTH_ALERTS} ci-health-alert). Agent should review these for patterns affecting this PR."

            # List issue titles for agent context
            echo ""
            echo "── Open CI failure issues: ──"
            gh issue list --repo "$REPO" --label "ci-failure" --state open \
              --json number,title --jq '.[] | "#\(.number): \(.title)"' 2>/dev/null || true
            gh issue list --repo "$REPO" --label "ci-health-alert" --state open \
              --json number,title --jq '.[] | "#\(.number): \(.title)"' 2>/dev/null || true
          else
            echo "✅ No open CI failure report issues"
          fi

          echo "── §0.2 CI failure issue check complete ──"

      - name: "🔍 Validate repo JSON files"
        run: |
          echo "── Validating JSON files in .codex/ and docs/ ──"
          FAIL=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error file=${f}::Invalid JSON: ${f}"
              FAIL=$((FAIL + 1))
            fi
          done < <(find .codex docs -name "*.json" -not -path "*/__pycache__/*" -print0 2>/dev/null)
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::${FAIL} invalid JSON file(s) found — fix before proceeding"
            exit 1
          fi
          echo "✅ All JSON files valid"

      # Guard: git show <base_sha> -- <file> exits 128 for files added after
      # the base commit.  Make the safe wrapper available on PATH so any CI
      # step or agent tool can call `safe_git_show.sh <ref> <file>` instead.
      - name: "🔑 Inject repo variable context for agent"
        run: |  # pragma: allowlist secret
          if [ -f .codex/agent_context.json ]; then
            echo "Injecting repo variable context from .codex/agent_context.json"
            # base64-encoded Python script: reads agent_context.json and writes all
            # COPILOT_*/CODEX_* repo variables into GITHUB_ENV so the Copilot agent
            # session sees them as environment variables.
            # Encoding avoids YAML heredoc/quote parsing issues (see WORKFLOW_BEST_PRACTICES.md).
            echo '' | base64 -d | python3  # pragma: allowlist secret
          else
            echo "No .codex/agent_context.json — skipping (run copilot-agent-vars-bootstrap first)"
          fi

      - name: "🛡️ Install safe-git-show guard on PATH"
        run: |
          if [ -f scripts/ci/safe_git_show.sh ]; then
            install -m 0755 scripts/ci/safe_git_show.sh /usr/local/bin/safe_git_show.sh
            echo "✅ safe_git_show.sh installed to /usr/local/bin"
          else
            echo "⚠️ scripts/ci/safe_git_show.sh not found (non-blocking)"
          fi

      # Guarded: selectively reintroduce LFS behavior if workflow_dispatch requested
      - name: "🔭 LFS diagnostics"
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.lfs_mode == 'full' || (inputs.lfs_mode == 'targeted' && inputs.lfs_include_paths != '')) }}
        run: |
          set -euo pipefail
          echo "Git version: $(git --version)"
          echo "LFS version: $(git lfs version || echo 'git-lfs not installed')"
          git status || true
          git lfs ls-files || true

      - name: "📥 Install git-lfs (if needed)"
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.lfs_mode == 'full' || inputs.lfs_mode == 'targeted') }}
        run: |
          set -euo pipefail
          if ! command -v git-lfs >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y git-lfs
            fi
          fi
          git lfs install --local || true

      - name: "🎯 Targeted LFS fetch & checkout (guarded)"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.lfs_mode == 'targeted' && inputs.lfs_include_paths != '' }}
        continue-on-error: ${{ inputs.lfs_continue_on_error }}
        run: |
          set -euo pipefail
          # Convert comma-separated include patterns into git-lfs include string
          INCLUDES="${{ inputs.lfs_include_paths }}"
          INCLUDES_CLEAN=$(echo "$INCLUDES" | tr -d ' ' | tr ',' ' ')
          echo "Targeted LFS includes: $INCLUDES_CLEAN"

          # Retry LFS fetch to handle transient network issues
          for i in 1 2 3; do
            echo "Attempt $i: git lfs fetch --include=\"$INCLUDES_CLEAN\" origin"
            if git lfs fetch --include="$INCLUDES_CLEAN" origin; then
              echo "git lfs fetch succeeded"
              break
            else
              echo "git lfs fetch failed on attempt $i"
              sleep $((i * 5))
            fi
          done

          # Checkout only targeted LFS files
          git lfs checkout --include="$INCLUDES_CLEAN" || true

      - name: "🌐 Full LFS fetch & checkout (guarded)"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.lfs_mode == 'full' }}
        continue-on-error: ${{ inputs.lfs_continue_on_error }}
        run: |
          set -euo pipefail
          # Retry LFS fetch --all; guarded to avoid hard failure if repository has missing blobs
          for i in 1 2 3; do
            echo "Attempt $i: git lfs fetch --all origin"
            if git lfs fetch --all origin; then
              echo "git lfs fetch --all succeeded"
              break
            else
              echo "git lfs fetch --all failed on attempt $i"
              sleep $((i * 5))
            fi
          done

          # Materialize LFS files
          git lfs checkout || true

      - name: "🔍 Detect Environment Type"
        id: detect_env
        env:
          HEAD_REF: ${{ github.head_ref }}
          INPUT_ENV_TYPE: ${{ github.event.inputs.environment_type || 'standard' }}
        run: |
          ENV_TYPE="${INPUT_ENV_TYPE}"
          # Auto-detect based on PR labels or branch name if not specified
          if [[ "$ENV_TYPE" == "standard" ]]; then
            if [[ "${HEAD_REF}" == *"ml"* ]] || [[ "${HEAD_REF}" == *"rag"* ]]; then
              ENV_TYPE="ml-heavy"
            elif [[ "${HEAD_REF}" == *"security"* ]] || [[ "${HEAD_REF}" == *"sec"* ]]; then
              ENV_TYPE="security-scan"
            elif [[ "${HEAD_REF}" == *"docs"* ]] || [[ "${HEAD_REF}" == *"documentation"* ]]; then
              ENV_TYPE="documentation"
            fi
          fi
          echo "environment_type=$ENV_TYPE" >> "$GITHUB_OUTPUT"
          echo "✅ Detected environment type: $ENV_TYPE"

      - name: "🧠 AAIS Runner Adequacy Check"
        id: runner_check
        # AAIS alignment: Runtime Introspection (Pillar 3 — Observability).
        # Classifies the active runner tier against the detected environment type,
        # emits an AAIS-formatted assessment, and sets runner_adequate output.
        # If the runner tier is insufficient, the step logs a clear recommendation
        # but does NOT fail — setup continues on whatever runner is available.
        # The runner_adequate output is consumed by "✅ Validate Environment Setup"
        # (Phase 7) which surfaces it in the AAIS environment summary.
        run: |
          set -euo pipefail

          # ── Detect runner hardware tier ────────────────────────────────────
          CPUS=$(nproc)
          MEM_KB=$(grep MemTotal /proc/meminfo 2>/dev/null | awk '{print $2}' || echo "0")
          MEM_GB=$(( ${MEM_KB:-0} / 1024 / 1024 ))

          if   [[ $CPUS -ge 16 ]]; then RUNNER_TIER="large"
          elif [[ $CPUS -ge  8 ]]; then RUNNER_TIER="medium"
          elif [[ $CPUS -ge  4 ]]; then RUNNER_TIER="standard-plus"
          else                          RUNNER_TIER="standard"
          fi

          echo "runner_tier=$RUNNER_TIER"  >> "$GITHUB_OUTPUT"
          echo "runner_cpus=$CPUS"         >> "$GITHUB_OUTPUT"
          echo "runner_mem_gb=$MEM_GB"     >> "$GITHUB_OUTPUT"

          # ── Map env type → minimum required tier ──────────────────────────
          ENV_TYPE="${{ steps.detect_env.outputs.environment_type }}"
          RUNNER_PROFILE="${{ vars.COPILOT_RUNNER_PROFILE || 'ubuntu-latest-m' }}"

          case "$ENV_TYPE" in
            ml-heavy)         MIN_TIER="medium"       ; MIN_CPUS=8  ; RECOMMENDED="ubuntu-8-core"    ;;
            security-scan)    MIN_TIER="standard-plus"; MIN_CPUS=4  ; RECOMMENDED="ubuntu-latest-m"  ;;
            documentation)    MIN_TIER="standard"     ; MIN_CPUS=2  ; RECOMMENDED="ubuntu-latest-m"  ;;
            *)                MIN_TIER="standard-plus"; MIN_CPUS=4  ; RECOMMENDED="ubuntu-latest-m"  ;;
          esac

          # ── AAIS Runtime Introspection output ─────────────────────────────
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  🧠 AAIS Runner Adequacy Assessment (Pillar 3: Observability) ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Active runner    : ${RUNNER_PROFILE} (${CPUS} vCPU / ${MEM_GB} GB RAM)"
          echo "║  Runner tier      : ${RUNNER_TIER}"
          echo "║  Environment type : ${ENV_TYPE}"
          echo "║  Required tier    : ${MIN_TIER} (≥ ${MIN_CPUS} vCPU)"
          echo "╠══════════════════════════════════════════════════════════════╣"

          if [[ $CPUS -ge $MIN_CPUS ]]; then
            echo "║  ✅ ADEQUATE — runner meets requirements for ${ENV_TYPE}"
            echo "runner_adequate=true" >> "$GITHUB_OUTPUT"
          else
            echo "║  ⚠️  UNDER-PROVISIONED — ${ENV_TYPE} needs ≥ ${MIN_CPUS} vCPU (got ${CPUS})"
            echo "║     → Set repo variable COPILOT_RUNNER_PROFILE=${RECOMMENDED}"
            echo "║     → See docs/plans/larger-runners-upgrade.md"
            echo "runner_adequate=false" >> "$GITHUB_OUTPUT"
          fi
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

      # ============================================================================
      # Phase 2: Language Runtimes Setup
      # ============================================================================

      - name: "🐍 Set up Python ${{ env.PYTHON_VERSION || '3.12' }}"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION || '3.12' }}
          # No automatic pip cache — managed explicitly below so keys match
          # the 4-layer hierarchy in .github/actions/setup-python-cached and
          # all CI workflows share the same cache entries.

      # ── Cache alignment: shared with .github/actions/setup-python-cached ────
      # L1 — pip download cache: same key format as setup-python-cached so
      # packages downloaded by any workflow are available to the agent session.
      - name: "💾 L1 — pip download cache (~/.cache/pip)"
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml', 'requirements/lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-py${{ env.PYTHON_VERSION }}-

      # L3 — installed venv (.venv_ci): same key as setup-python-cached (extras=dev).
      # Populating .venv_ci here means CI workflows immediately benefit from the
      # agent-warmed venv and vice-versa.
      - name: "💾 L3 — installed venv (.venv_ci)"
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: .venv_ci
          key: ${{ runner.os }}-venv-py${{ env.PYTHON_VERSION }}-extras=dev-torch=false-preflight=false-${{ hashFiles('pyproject.toml', 'requirements/lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-py${{ env.PYTHON_VERSION }}-extras=dev-torch=false-preflight=false-
            ${{ runner.os }}-venv-py${{ env.PYTHON_VERSION }}-extras=dev-torch=false-
            ${{ runner.os }}-venv-py${{ env.PYTHON_VERSION }}-extras=dev-

      - name: "📦 Set up Node.js ${{ env.NODE_VERSION || '20' }}"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION || '20' }}
          cache: 'npm'
        if: hashFiles('package.json') != ''

      - name: "🦀 Set up Rust ${{ env.RUST_VERSION || 'stable' }}"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION || 'stable' }}
        if: hashFiles('Cargo.toml') != ''

      # ============================================================================
      # Phase 3: System Dependencies
      # ============================================================================

      - name: "📚 Install System Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libssl-dev \
            sqlite3 \
            jq \
            ripgrep \
            fd-find
          # ML-specific dependencies
          if [[ "${{ steps.detect_env.outputs.environment_type }}" == "ml-heavy" ]]; then
            sudo apt-get install -y \
              libblas-dev \
              liblapack-dev \
              gfortran
          fi

      # ============================================================================
      # Phase 4: Python Dependencies (Environment-Specific)
      # ============================================================================

      - name: "🔧 Upgrade pip and install build tools"
        run: |
          # Create .venv_ci if it wasn't restored from cache, or if the
          # restored venv has a broken Python binary (cross-patch-version
          # cache artifact — see #3565/#3569 for the failure pattern).
          if [ ! -d ".venv_ci" ] || [ ! -x ".venv_ci/bin/python" ] || ! .venv_ci/bin/python --version &>/dev/null; then
            if [ -d ".venv_ci" ]; then
              echo "::warning::Stale or broken venv detected — rebuilding from scratch"
              chmod -R u+w .venv_ci 2>/dev/null || true
              rm -rf .venv_ci
            fi
            python -m venv .venv_ci
            if [ ! -x ".venv_ci/bin/python" ]; then
              echo "::error::Venv creation failed — .venv_ci/bin/python does not exist"
              exit 1
            fi
          fi
          .venv_ci/bin/pip install --cache-dir ~/.cache/pip -U pip setuptools wheel --quiet
          # Add venv to PATH for all subsequent steps in this job
          echo "$GITHUB_WORKSPACE/.venv_ci/bin" >> "$GITHUB_PATH"

      - name: "📦 Install Python Dependencies (Standard)"
        if: steps.detect_env.outputs.environment_type == 'standard'
        env:
          VENV_CACHE_HIT: ${{ steps.cache-venv.outputs.cache-hit }}
        run: |
          # Install core project deps into .venv_ci (skip full rebuild on exact cache hit)
          if [ "${VENV_CACHE_HIT}" != "true" ]; then
            pip install --cache-dir ~/.cache/pip \
              pytest==8.4.2 pytest-timeout==2.4.0 pytest-xdist==3.8.0 \
              pytest-cov==5.0.0 pytest-asyncio==1.3.0 pytest-mock==3.15.1 \
              pytest-randomly pytest-rerunfailures --quiet
            pip install --cache-dir ~/.cache/pip -e ".[dev]" --quiet
          else
            pip install --cache-dir ~/.cache/pip -e ".[dev]" --quiet
          fi
          # Install additional agent tooling
          pip install --cache-dir ~/.cache/pip \
            ruff black mypy --quiet

      - name: "🤖 Install Python Dependencies (ML-Heavy)"
        if: steps.detect_env.outputs.environment_type == 'ml-heavy'
        run: |
          # Force CPU-only PyTorch for faster installs
          pip install --cache-dir ~/.cache/pip \
            torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu --quiet
          # Install with ML extras
          pip install --cache-dir ~/.cache/pip -e ".[dev,ml]" --quiet
          # Install ML-specific tools
          pip install --cache-dir ~/.cache/pip \
            transformers sentence-transformers scikit-learn mlflow --quiet

      - name: "🔒 Install Python Dependencies (Security-Scan)"
        if: steps.detect_env.outputs.environment_type == 'security-scan'
        run: |
          pip install --cache-dir ~/.cache/pip -e ".[dev]" --quiet
          # Install security scanning tools
          pip install --cache-dir ~/.cache/pip \
            bandit safety pip-audit semgrep --quiet

      - name: "📝 Install Python Dependencies (Documentation)"
        if: steps.detect_env.outputs.environment_type == 'documentation'
        run: |
          pip install --cache-dir ~/.cache/pip -e ".[dev,docs]" --quiet
          # Install documentation tools
          pip install --cache-dir ~/.cache/pip \
            mkdocs mkdocs-material mkdocstrings mkdocstrings-python --quiet

      # ============================================================================
      # Phase 5: Rust Dependencies
      # ============================================================================

      - name: "🦀 Build Rust Components"
        if: hashFiles('Cargo.toml') != ''
        run: |
          cargo build --release
          echo "RUST_BACKTRACE=1" >> "$GITHUB_ENV"

      # ============================================================================
      # Phase 5b: L6 — Copilot Agent Lean Venv (.venv_agent)
      # ============================================================================
      # A purpose-built, cacheable virtualenv containing only what the Copilot
      # coding agent needs: lint, test, docs, auth, CI scripts.
      # No PyTorch / heavy ML — cold build ~75 s; cache hit ~4 s.
      # Pre-warmed weekly by build-agent-env-cache.yml so hits are the norm.

      - name: "🤖 L6 — Setup Copilot agent env (.venv_agent)"
        id: agent-env
        uses: ./.github/actions/setup-agent-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
          enable-brain-cache: 'true'
          install-editable: 'true'
          verify: 'true'

      - name: "ℹ️ Agent env cache status"
        run: |
          echo "Agent venv mode  : ${{ steps.agent-env.outputs.mode }}"
          echo "Agent venv python: ${{ steps.agent-env.outputs.venv-python }}"
          echo "Cache hit        : ${{ steps.agent-env.outputs.cache-hit }}"
          # Surface both venvs on PATH — agent scripts prefer .venv_agent
          # while existing test steps continue to use .venv_ci
          echo "AGENT_VENV_PATH=${GITHUB_WORKSPACE}/.venv_agent" >> "$GITHUB_ENV"

      # ============================================================================
      # Phase 6: Environment Variables & Configuration
      # ============================================================================

      - name: "⚙️ Set Codex Environment Variables"
        run: |
          # Core configuration
          echo "CODEX_ENV=copilot-agent" >> "$GITHUB_ENV"
          echo "CODEX_FORCE_CPU=1" >> "$GITHUB_ENV"
          echo "RAG_EMBEDDING_PROVIDER=tfidf" >> "$GITHUB_ENV"
          echo "PYTHONPATH=${{ github.workspace }}/src:$PYTHONPATH" >> "$GITHUB_ENV"
          # Logging configuration
          echo "CODEX_LOG_LEVEL=INFO" >> "$GITHUB_ENV"
          echo "CODEX_SESSION_LOG_DIR=${{ github.workspace }}/.codex/sessions" >> "$GITHUB_ENV"
          # Database paths
          echo "CODEX_DB_PATH=${{ github.workspace }}/.codex/codex.db" >> "$GITHUB_ENV"
          # Disable interactive prompts
          echo "DEBIAN_FRONTEND=noninteractive" >> "$GITHUB_ENV"
          echo "PIP_NO_INPUT=1" >> "$GITHUB_ENV"
          # GitHub-specific
          echo "CI=true" >> "$GITHUB_ENV"
          echo "GITHUB_COPILOT_AGENT=true" >> "$GITHUB_ENV"

      - name: "🔑 Export Auth Tokens to Agent Environment"
        # CRITICAL: CODEX_MASTER_KEY and CODEX_BACKUP_KEY are declared in the
        # job-level env: block (from org secrets) so they are available to steps
        # in this workflow — but they are NOT automatically written to GITHUB_ENV.
        # The Copilot agent process reads its environment from GITHUB_ENV, not the
        # job-level env block. This step bridges that gap.
        #
        # Token priority for GitHub API calls:
        #   1. CODEX_MASTER_KEY  — full PAT (repo scope); required for variables API
        #   2. CODEX_BACKUP_KEY  — fallback PAT
        #   3. GITHUB_TOKEN      — scoped installation token (actions:write only)
        #
        # See docs/agent/COPILOT_TOKEN_GUIDE.md for complete reference.
        run: |
          echo "── Auth token export ──────────────────────────────────────────"
          # Export CODEX_MASTER_KEY (full PAT — needed for variables/secrets API)
          if [ -n "${CODEX_MASTER_KEY:-}" ]; then
            echo "CODEX_MASTER_KEY=${CODEX_MASTER_KEY}" >> "$GITHUB_ENV"
            echo "  ✅ CODEX_MASTER_KEY → GITHUB_ENV (${#CODEX_MASTER_KEY} chars)"
          else
            echo "  ⚠️  CODEX_MASTER_KEY not set — variable writes will fall back to GITHUB_TOKEN"
            echo "     Set org secret CODEX_MASTER_KEY (classic PAT, repo scope)"
          fi
          # Export CODEX_BACKUP_KEY
          if [ -n "${CODEX_BACKUP_KEY:-}" ]; then
            echo "CODEX_BACKUP_KEY=${CODEX_BACKUP_KEY}" >> "$GITHUB_ENV"
            echo "  ✅ CODEX_BACKUP_KEY → GITHUB_ENV (${#CODEX_BACKUP_KEY} chars)"
          fi
          # Always export GITHUB_TOKEN under a stable name for agent use.
          # GITHUB_TOKEN is auto-provided by Actions and has actions:write (set above).
          echo "AGENT_GITHUB_TOKEN=${GITHUB_TOKEN}" >> "$GITHUB_ENV"
          echo "  ✅ AGENT_GITHUB_TOKEN → GITHUB_ENV (${#GITHUB_TOKEN} chars)"
          echo "     Scopes: actions:write (trigger workflows, manage runs, download artifacts)"
          echo "     NOTE: AGENT_GITHUB_TOKEN/GITHUB_TOKEN cannot access the variables API."
          echo "           Variable create/update/delete requires CODEX_MASTER_KEY (PAT, repo scope)."
          echo "── Auth token export complete ─────────────────────────────────"

      - name: "⚙️ Load Custom Agent Configuration"
        if: hashFiles('.codex/agent_environment_config.yaml') != ''
        run: |
          if [ -f .codex/agent_environment_config.yaml ]; then
            echo "✅ Loading custom agent configuration..."
            cat .codex/agent_environment_config.yaml
          fi

      # ============================================================================
      # Phase 7: Validation & Diagnostics
      # ============================================================================

      - name: "✅ Validate Environment Setup"
        run: |
          # ── Root-cause fix for Copilot Coding Agent "Validate Environment
          # Setup" failures (every session).
          # GitHub Actions bash defaults to `set -eo pipefail`.  When `pip list`
          # outputs 100+ packages and `head -20` closes the pipe after 20 lines,
          # pip receives SIGPIPE → exit 141 → pipefail treats the whole pipeline
          # as failed → the step exits non-zero → the Copilot agent reports
          # "custom setup step failed".
          #
          # Fix: suppress SIGPIPE (this is a diagnostic step, not a build step)
          # and guard every pipe command so partial reads never fail the step.
          trap '' PIPE          # ignore SIGPIPE for this step
          set +o pipefail       # don't fail on SIGPIPE in pipelines

          echo "==================== Environment Validation ===================="
          echo "Python Version: $(python --version 2>&1)"
          echo "Pip Version: $(pip --version 2>&1)"
          echo "Node Version: $(node --version 2>/dev/null || echo 'Not installed')"
          echo "Rust Version: $(rustc --version 2>/dev/null || echo 'Not installed')"
          echo ""
          echo "==================== Installed Packages ===================="
          pip list 2>/dev/null | head -20 || true
          echo "..."
          echo ""
          echo "==================== Environment Variables ===================="
          env | grep -E "^(CODEX|PYTHON|RAG|CI|GITHUB)" | sort || true
          echo ""
          echo "==================== Disk Space ===================="
          df -h | grep -E "^/dev" || true
          echo ""
          echo "==================== AAIS Runner Summary ===================="
          echo "Runner profile   : ${{ vars.COPILOT_RUNNER_PROFILE || 'ubuntu-latest-m' }}"
          echo "Runner tier      : ${{ steps.runner_check.outputs.runner_tier }}"
          echo "Runner CPUs      : ${{ steps.runner_check.outputs.runner_cpus }}"
          echo "Runner RAM (GB)  : ${{ steps.runner_check.outputs.runner_mem_gb }}"
          echo "Runner adequate  : ${{ steps.runner_check.outputs.runner_adequate }}"
          echo "✅ Environment setup complete for type: ${{ steps.detect_env.outputs.environment_type }}"

      - name: "🏥 Run Health Check"
        run: |
          echo "Checking critical paths..."
          test -d src/codex && echo "✅ src/codex exists" || echo "❌ src/codex missing"
          test -d .codex && echo "✅ .codex exists" || echo "❌ .codex missing"
          test -d tests && echo "✅ tests exists" || echo "❌ tests missing"
          test -f pyproject.toml && echo "✅ pyproject.toml exists" || echo "❌ pyproject.toml missing"
          # Verify Python imports work
          python -c "import codex; print('✅ codex package importable')" || echo "⚠️  codex package import failed"
          # Verify tools are available
          which ruff && echo "✅ ruff available" || echo "⚠️  ruff not available"
          which black && echo "✅ black available" || echo "⚠️  black not available"
          which pytest && echo "✅ pytest available" || echo "⚠️  pytest not available"

      - name: "📊 Session Lifecycle Metrics"
        continue-on-error: true
        run: |
          if [ -f scripts/session_tracker.py ]; then
            echo "──────── Session Lifecycle Metrics ────────"
            python scripts/session_tracker.py metrics || true
            echo ""
            # Write JSON metrics to GITHUB_STEP_SUMMARY
            METRICS_JSON=$(python scripts/session_tracker.py metrics --format json 2>/dev/null || echo '{}')
            echo "## 📊 Session Lifecycle Metrics" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            echo "$METRICS_JSON" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️  session_tracker.py not found — skipping metrics"
          fi

      # ============================================================================
      # Phase 8: Cache Preparation (Optional)
      # ============================================================================

      - name: "💾 Prepare Cache Artifacts"
        run: |
          mkdir -p .codex/cache
          mkdir -p .codex/sessions
          echo "✅ Cache directories prepared"

      - name: "📊 Accountability Auto-Update (session close hook)"
        continue-on-error: true
        env:
          CODEX_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Run accountability auto-update in dry-run mode during setup to
          # pre-validate the script. The actual --commit run is triggered at
          # session close by the agent itself or post-job hooks.
          if [ -f src/codex/session/accountability_autoupdate.py ]; then
            echo "✅ Accountability auto-update script available"
            python -m src.codex.session.accountability_autoupdate --dry-run 2>/dev/null \
              && echo "  → dry-run validation passed" \
              || echo "  ⚠️ dry-run validation skipped (non-blocking)"
          else
            echo "⚠️ accountability_autoupdate.py not found — skipping"
          fi

      # ============================================================================
      # Phase 9: Agent-Specific Initialization
      # ============================================================================

      - name: "🔄 Rotate Cognitive Brain Status Files"
        continue-on-error: true
        run: |
          if [ -f scripts/ci/rotate_cognitive_brain_status.py ]; then
            python scripts/ci/rotate_cognitive_brain_status.py --keep 50 --threshold 60 || true
          fi

      - name: "🤖 Initialize Cognitive Brain Context"
        run: |
          if [ -f .github/agents/AGENT_REGISTRY.yaml ]; then
            echo "✅ Loading specialized agents from registry..."
            head -20 .github/agents/AGENT_REGISTRY.yaml || true
          fi
          if [ -d cognitive/ ]; then
            echo "✅ Cognitive brain components available"
            ls -la cognitive/ | head -10
          fi

      - name: "💻 Start CLI API Server (background)"
        # Sprint 2: auto-start FastAPI :8765 so the CLI tab is live when the
        # Copilot agent session begins. Guarded — non-blocking on missing deps.
        # Gap-fix (S112): export CODEX_CLI_API_URL so BrainClient + agents can
        # discover the server URL without hard-coding it.  Also add a retry loop
        # (up to 5 × 1 s) so slow startup does not produce a false-negative.
        continue-on-error: true
        run: |
          if [ ! -f cognitive_app/src/server/cli_api_server.py ]; then
            echo "⚠️ cli_api_server.py not found — skipping (non-blocking)"
            exit 0
          fi
          pip install fastapi uvicorn httpx ptyprocess --quiet 2>/dev/null || true
          # Explicitly forward auth tokens to the server process env.
          # Even though CODEX_MASTER_KEY is in the job env block, child processes
          # started with nohup inherit from the CURRENT step env — which already
          # has these values. The explicit assignment below makes the intent clear
          # and is idempotent.
          export CODEX_MASTER_KEY="${CODEX_MASTER_KEY:-}"
          export CODEX_BACKUP_KEY="${CODEX_BACKUP_KEY:-}"
          export AGENT_GITHUB_TOKEN="${GITHUB_TOKEN:-}"
          nohup uvicorn cognitive_app.src.server.cli_api_server:app \
            --host 0.0.0.0 \
            --port 8765 \
            --log-level warning \
            > "${RUNNER_TEMP}/cli_api_server.log" 2>&1 &
          CLI_API_PID=$!
          echo "CLI_API_SERVER_PID=${CLI_API_PID}" >> "$GITHUB_ENV"
          # Always export http://localhost:8765 — the server is started on that
          # fixed address above.  Deriving from COPILOT_CLI_BASE_URL was
          # misleading: if that variable pointed to a different host/port the
          # exported URL would be wrong while the health check (which always
          # hits localhost:8765) still passed.  Hard-code the actual address.
          echo "CODEX_CLI_API_URL=http://localhost:8765" >> "$GITHUB_ENV"
          # Retry health-check up to 5 s to accommodate slower startup
          SERVER_READY=0
          for i in 1 2 3 4 5; do
            sleep 1
            if curl -sf http://localhost:8765/api/health > /dev/null 2>&1; then
              SERVER_READY=1
              break
            fi
          done
          if [ "$SERVER_READY" = "1" ]; then
            echo "✅ CLI API Server ready on :8765 (PID=${CLI_API_PID})"
            echo "   BrainClient URL: http://localhost:8765"
            echo "   Import: from codex.agents.brain_client import BrainClient"
            # Report which auth token the server can use for GitHub API calls
            if [ -n "${CODEX_MASTER_KEY:-}" ]; then
              echo "   🔑 Auth: CODEX_MASTER_KEY active (full PAT — variables/secrets API ✅)"
            elif [ -n "${CODEX_BACKUP_KEY:-}" ]; then
              echo "   🔑 Auth: CODEX_BACKUP_KEY active (fallback PAT)"
            elif [ -n "${GITHUB_TOKEN:-}" ]; then
              echo "   🔑 Auth: GITHUB_TOKEN active (actions:write scope)"
            else
              echo "   ⚠️  No auth token — GitHub API calls will be unauthenticated (rate-limited)"
            fi
          else
            echo "⚠️ CLI API Server did not respond after 5 s — see RUNNER_TEMP/cli_api_server.log"
            cat "${RUNNER_TEMP}/cli_api_server.log" 2>/dev/null | tail -20 || true
          fi

      - name: "📊 Generate Environment Report (temp path)"
        id: gen_report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="${RUNNER_TEMP:-/tmp}"
          REPORT="$REPORT_DIR/.copilot-agent-environment-report.txt"
          {
            echo "==================== Copilot Agent Environment Report ===================="
            echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Environment Type: ${{ steps.detect_env.outputs.environment_type }}"
            echo "Runner: ${{ runner.os }} ${{ runner.arch }}"
            echo ""
            echo "Python: $(python --version)"
            echo "Node: $(node --version 2>/dev/null || echo 'N/A')"
            echo "Rust: $(rustc --version 2>/dev/null || echo 'N/A')"
            echo ""
            echo "Installed Packages: $(pip list | wc -l) packages"
            echo "Disk Space: $(df -h / | tail -1 | awk '{print $4}') available"
            echo ""
            echo "Status: ✅ Environment ready for Copilot agent operations"
          } > "$REPORT"
          echo "Report written to $REPORT"
          head -20 "$REPORT" || true
          echo "REPORT_PATH=$REPORT" >> "$GITHUB_OUTPUT"

      - name: "📤 Upload Environment Report"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: copilot-agent-environment-report
          path: ${{ steps.gen_report.outputs.REPORT_PATH }}
          retention-days: 7
          if-no-files-found: warn

# ============================================================================
# Workflow Metadata
# ============================================================================
# Version: 1.1.0
# Created: 2026-01-28
# Updated: 2026-01-30
# Baseline stability maintained:
# - No LFS during initial checkout (lfs: false, GIT_LFS_SKIP_SMUDGE=1)
# - Environment report written to RUNNER_TEMP to avoid branch operations conflicts
# Selective adoption (guarded via workflow_dispatch inputs):
# - lfs_mode: targeted/full with retries and continue-on-error option
# - lfs_include_paths: limit LFS scope to required areas
# - lfs_continue_on_error: prevent setup failure on missing LFS blobs (404)
# Policy: .codex/CODEBASE_AGENCY_POLICY.md
# Integration: Cognitive Brain Phase objectives
# Documentation: .codex/cognitive_brain/AGENT_ENVIRONMENT_MANAGEMENT_PLANSET.md

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: copilot-setup-steps
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Copilot Setup Steps"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
