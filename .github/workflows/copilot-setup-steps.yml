name: Copilot Agent Environment Setup
'on':
  workflow_dispatch:
    inputs:
      environment_type:
        description: Environment type to setup
        required: false
        default: standard
        type: choice
        options:
        - standard
        - ml-heavy
        - security-scan
        - documentation
      lfs_mode:
        description: Git LFS mode (none=baseline, targeted=fetch specific paths, full=fetch all)
        required: false
        default: none
        type: choice
        options:
        - none
        - targeted
        - full
      lfs_include_paths:
        description: Comma-separated patterns for targeted LFS fetch (e.g., "data/models/*,artifacts/*")
        required: false
        default: ''
        type: string
      lfs_continue_on_error:
        description: Continue on LFS fetch error (guards against missing blobs failing entire setup)
        required: false
        default: true
        type: boolean
  push:
    paths:
    - .github/workflows/copilot-setup-steps.yml
    - .codex/agent_environment_config.yaml
    - pyproject.toml
    - requirements*.txt
  pull_request:
    paths:
    - .github/workflows/copilot-setup-steps.yml
    - .codex/agent_environment_config.yaml
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  RUST_VERSION: stable
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    name: Copilot Agent Environment Preparation
    runs-on: ${{ (vars.COPILOT_RUNNER_PROFILE != '' && vars.COPILOT_RUNNER_PROFILE)
      || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
      CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}

      # Required CCA configuration. Safe defaults if repo vars are unset.
      COPILOT_AGENT_CCA_VERSION_LOCK: ${{ vars.COPILOT_AGENT_CCA_VERSION_LOCK || 'stable' }}
      COPILOT_AGENT_DEDUPLICATION_ENABLED: ${{ vars.COPILOT_AGENT_DEDUPLICATION_ENABLED || 'true' }}
      COPILOT_AGENT_TURN_ISOLATION_ENABLED: ${{ vars.COPILOT_AGENT_TURN_ISOLATION_ENABLED || 'true' }}

      LFS_DIAGNOSTICS_ENABLED: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        (inputs.lfs_mode == 'full' ||
        (inputs.lfs_mode == 'targeted' &&
        inputs.lfs_include_paths != '')) }}
      LFS_FETCH_ENABLED: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        (inputs.lfs_mode == 'full' || inputs.lfs_mode == 'targeted') }}
      LFS_TARGETED_ENABLED: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        inputs.lfs_mode == 'targeted' &&
        inputs.lfs_include_paths != '' }}
      LFS_FULL_ENABLED: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        inputs.lfs_mode == 'full' }}
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    steps:
    - name: "📦 Checkout Repository (baseline: no LFS content)"
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        lfs: false
        clean: true
        show-progress: true
    - name: "🐍 Set up Python with cache"
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-copilot-setup-steps-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-copilot-setup-steps-
          ${{ runner.os }}-pip-
    - name: "🔒 Validate CCA lock variables"
      shell: bash
      env:
        LOCK: ${{ vars.COPILOT_AGENT_CCA_VERSION_LOCK || 'stable' }}
        DEDUP: ${{ vars.COPILOT_AGENT_DEDUPLICATION_ENABLED || 'true' }}
        ISO: ${{ vars.COPILOT_AGENT_TURN_ISOLATION_ENABLED || 'true' }}
      run: |
        fail=0

        if [[ "${LOCK}" != "stable" ]]; then
          echo "::error::COPILOT_AGENT_CCA_VERSION_LOCK must be 'stable' (got '${LOCK}')"
          fail=1
        fi

        if [[ "${DEDUP}" != "true" ]]; then
          echo "::error::COPILOT_AGENT_DEDUPLICATION_ENABLED must be 'true' (got '${DEDUP}')"
          fail=1
        fi

        if [[ "${ISO}" != "true" ]]; then
          echo "::error::COPILOT_AGENT_TURN_ISOLATION_ENABLED must be 'true' (got '${ISO}')"
          fail=1
        fi

        exit $fail
    # ⚠️ DO NOT REFACTOR THIS STEP — See docs/agent/COPILOT_SETUP_STEPS_GUARD.md
    # Canonical form: block scalar run: | with if ! ...; then syntax.
    # This step has been broken 4+ times by agents converting it to flow scalar
    # (|| { } syntax) or orphaning the run: key. yamllint 1.38.0 crashes on
    # flow scalar brace syntax. Canonical baseline: commit 12f7a861 / blob 8c84a8c1.
    # RULE: if you are fixing a CI failure, fix the failing file — NOT this step.
    - name: "🧠 Session Context Pre-load (memory + policy + accountability + PDA)"
      continue-on-error: true   # non-blocking: agent must start even if preload fails
      run: |
        if ! python3 .github/scripts/session_preload.py; then
          echo "⚠️ session_preload.py failed (non-blocking) — agent will operate without preloaded context"
        fi
    - name: "🔌 Session Access Probe (token inventory + rate limits)"
      id: access_probe
      continue-on-error: true
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        echo "::group::Session Access Probe"
        if ! python3 scripts/ci/session_access_probe.py; then
          echo "⚠️ Access probe failed (non-blocking) — agent will use local-FS fallback"
          echo "ACCESS_REST=unknown" >> "$GITHUB_ENV"
          echo "ACCESS_GRAPHQL=unknown" >> "$GITHUB_ENV"
          echo "ACCESS_GH_CLI=unknown" >> "$GITHUB_ENV"
          echo "ACCESS_CODEQL_CLI=unknown" >> "$GITHUB_ENV"
          echo "ACCESS_RECOMMENDED_METHOD=local_fs" >> "$GITHUB_ENV"
        fi
        echo "::endgroup::"
    - name: "🧠 Autonomous RAG Context Build (PR context + RAG query + incremental index)"
      id: rag_context
      continue-on-error: true
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        echo "::group::Autonomous RAG Context Build"
        if [ -n "${GITHUB_PR_NUMBER:-}" ]; then
          if ! python3 scripts/ci/autonomous_rag_context.py --pr "${GITHUB_PR_NUMBER}"; then
            echo "⚠️ RAG context build failed (non-blocking) — agent will use cached context"
          fi
        elif ! python3 scripts/ci/autonomous_rag_context.py; then
          echo "⚠️ RAG context build failed (non-blocking) — agent will use cached context"
        fi
        if [ -f .codex/session_access_strategy.json ]; then
          echo "--- Access Strategy ---"
          cat .codex/session_access_strategy.json
        fi
        echo "::endgroup::"
    - name: "Token contract warning gate"
      id: token_contract
      continue-on-error: true
      run: |
        python3 scripts/ci/check_token_contract.py
    - name: "Startup health packet"
      id: startup_health
      continue-on-error: true
      run: |
        python3 scripts/ci/startup_health.py
    - name: "\U0001F9E0 Phase 10.3: Context Scorer Invocation (pattern relevance scoring)"
      id: context_scorer
      continue-on-error: true
      env:
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        TASK_DESC_INPUT: ${{ github.event.pull_request.title || github.ref }}
      run: "echo \"::group::Phase 10.3 Context Scorer\"\n\n# Extract session metadata\
        \ for scoring\nTASK_DESC=\"$TASK_DESC_INPUT\"\nDOMAIN=\"CI/CD\"\nAGENT_TYPES=\"\
        cognitive-brain-session-injector\"\n\n# Check if context scorer is available\n\
        if [ ! -f scripts/ci/phase_10_3_context_scorer.py ]; then\n  echo \"\u26A0\
        \uFE0F Context scorer not found (non-blocking) \u2014 skipping pattern injection\"\
        \n  echo \"CONTEXT_SCORER_STATUS=not_found\" >> \"$GITHUB_ENV\"\n  echo \"\
        ::endgroup::\"\n  exit 0\nfi\n\n# Run context scorer with TF-IDF scoring\n\
        SCORER_OUTPUT=\".codex/phase_10_3_scored_patterns.json\"\nSCORER_START=$(date\
        \ +%s%N)\n\nif python3 scripts/ci/phase_10_3_context_scorer.py \\\n  --patterns\
        \ \".codex/patterns/ci_failure_patterns.yaml\" \\\n  --ltm-db \".codex/ltm.db\"\
        \ \\\n  --output \"$SCORER_OUTPUT\" \\\n  --top-k 15 \\\n  --min-score 0.65\
        \ \\\n  --task-desc \"$TASK_DESC\" \\\n  --domain \"$DOMAIN\" \\\n  --agent-types\
        \ \"$AGENT_TYPES\"; then\n\n  SCORER_END=$(date +%s%N)\n  SCORER_TIME_MS=$((\
        \ (SCORER_END - SCORER_START) / 1000000 ))\n\n  echo \"\u2705 Context scorer\
        \ completed in ${SCORER_TIME_MS}ms\"\n  echo \"CONTEXT_SCORER_TIME_MS=${SCORER_TIME_MS}\"\
        \ >> \"$GITHUB_ENV\"\n  echo \"CONTEXT_SCORER_STATUS=success\" >> \"$GITHUB_ENV\"\
        \n\n  # Extract metrics\n  if [ -f \"$SCORER_OUTPUT\" ]; then\n    PATTERN_COUNT=$(python3\
        \ -c \"import json; data=json.load(open('$SCORER_OUTPUT')); print(data.get('pattern_count',\
        \ 0))\" 2>/dev/null || echo \"0\")\n    AVG_SCORE=$(python3 -c \"import json;\
        \ data=json.load(open('$SCORER_OUTPUT')); val=data.get('avg_score', 0); print('{:.2f}'.format(val))\"\
        \ 2>/dev/null || echo \"0.00\")\n\n    echo \"CONTEXT_PATTERNS_COUNT=${PATTERN_COUNT}\"\
        \ >> \"$GITHUB_ENV\"\n    echo \"CONTEXT_PATTERNS_AVG_SCORE=${AVG_SCORE}\"\
        \ >> \"$GITHUB_ENV\"\n    echo \"\U0001F4CA Selected ${PATTERN_COUNT} patterns\
        \ (avg relevance: ${AVG_SCORE})\"\n  fi\nelse\n  echo \"\u26A0\uFE0F Context\
        \ scorer failed (non-blocking) \u2014 continuing without pattern injection\"\
        \n  echo \"CONTEXT_SCORER_STATUS=failed\" >> \"$GITHUB_ENV\"\nfi\n\necho \"\
        ::endgroup::\"\n"
    - name: "\U0001F489 Phase 10.3: Pattern Injection (inject context into system\
        \ prompt)"
      id: pattern_injection
      continue-on-error: true
      env:
        CONTEXT_PATTERNS_FILE: .codex/phase_10_3_scored_patterns.json
      run: "echo \"::group::Pattern Injection\"\n\nINJECT_START=$(date +%s%N)\n\n\
        # Only inject if scorer succeeded and patterns exist\nif [ ! -f \"$CONTEXT_PATTERNS_FILE\"\
        \ ] || [ \"$CONTEXT_SCORER_STATUS\" != \"success\" ]; then\n  echo \"\u2139\
        \uFE0F No patterns to inject (scorer status: $CONTEXT_SCORER_STATUS)\"\n \
        \ echo \"CONTEXT_INJECTION_STATUS=skipped\" >> \"$GITHUB_ENV\"\n  echo \"\
        ::endgroup::\"\n  exit 0\nfi\n\n# Create injection metadata file\nINJECTION_META=\"\
        .codex/phase_10_3_injection_metadata.json\"\npython3 << 'PYTHON_INJECT'\n\
        import json\nimport os\nfrom datetime import datetime\n\nscored_file = os.environ.get('CONTEXT_PATTERNS_FILE',\
        \ '')\nif not os.path.exists(scored_file):\n    print(\"\u2705 No patterns\
        \ to inject\")\n    exit(0)\n\n# Load scored patterns\nwith open(scored_file,\
        \ 'r', encoding='utf-8') as f:\n    scored_data = json.load(f)\n\npatterns\
        \ = scored_data.get('selected_patterns', [])\nif not patterns:\n    print(\"\
        \u2705 No patterns above threshold\")\n    exit(0)\n\n# Create injection metadata\n\
        metadata = {\n    'timestamp': datetime.now().isoformat(),\n    'injection_timestamp':\
        \ datetime.now().isoformat(),\n    'patterns_injected': len(patterns),\n \
        \   'avg_relevance_score': scored_data.get('avg_score', 0.0),\n    'execution_time_ms':\
        \ scored_data.get('execution_time_ms', 0),\n    'patterns': [\n        {\n\
        \            'id': p.get('pattern_id', ''),\n            'name': p.get('name',\
        \ ''),\n            'score': p.get('score', 0.0),\n            'improvement_area':\
        \ p.get('improvement_area', ''),\n        } for p in patterns\n    ]\n}\n\n\
        # Write injection metadata\nwith open(os.environ.get('INJECTION_META', '.codex/phase_10_3_injection_metadata.json'),\
        \ 'w', encoding='utf-8') as f:\n    json.dump(metadata, f, indent=2)\n\n#\
        \ Print summary\nprint(f\"\u2705 Injected {len(patterns)} patterns into session\
        \ context\")\nfor i, p in enumerate(patterns[:5], 1):\n    print(f\"  {i}.\
        \ {p.get('name', 'unknown')} (score: {p.get('score', 0.0):.2f})\")\nif len(patterns)\
        \ > 5:\n    print(f\"  ... and {len(patterns) - 5} more patterns\")\nPYTHON_INJECT\n\
        \n# Set environment variables for next steps\nif [ -f \"$INJECTION_META\"\
        \ ]; then\n  PATTERNS_INJECTED=$(python3 -c \"import json; data=json.load(open('$INJECTION_META'));\
        \ print(data.get('patterns_injected', 0))\" 2>/dev/null || echo \"0\")\n \
        \ echo \"PATTERNS_INJECTED=${PATTERNS_INJECTED}\" >> \"$GITHUB_ENV\"\n  echo\
        \ \"CONTEXT_INJECTION_STATUS=success\" >> \"$GITHUB_ENV\"\n  echo \"\u2705\
        \ Injection metadata: $INJECTION_META\"\nelse\n  echo \"CONTEXT_INJECTION_STATUS=failed\"\
        \ >> \"$GITHUB_ENV\"\nfi\n\nINJECT_END=$(date +%s%N)\nINJECT_TIME_MS=$(( (INJECT_END\
        \ - INJECT_START) / 1000000 ))\necho \"CONTEXT_INJECTION_TIME_MS=${INJECT_TIME_MS}\"\
        \ >> \"$GITHUB_ENV\"\necho \"\U0001F4CA Pattern injection completed in ${INJECT_TIME_MS}ms\"\
        \n\necho \"::endgroup::\"\n"
    - name: "\U0001F4C8 Phase 10.3: Performance Instrumentation (measure OODA improvement)"
      id: performance_instrumentation
      continue-on-error: true
      env:
        SCORER_TIME_ENV: ${{ env.CONTEXT_SCORER_TIME_MS }}
        INJECT_TIME_ENV: ${{ env.CONTEXT_INJECTION_TIME_MS }}
        PATTERNS_COUNT_ENV: ${{ env.CONTEXT_PATTERNS_COUNT }}
        PATTERNS_SCORE_ENV: ${{ env.CONTEXT_PATTERNS_AVG_SCORE }}
      run: "echo \"::group::Performance Instrumentation\"\n\nSCORER_TIME=\"$SCORER_TIME_ENV\"\
        \nINJECT_TIME=\"$INJECT_TIME_ENV\"\nPATTERNS_COUNT=\"$PATTERNS_COUNT_ENV\"\
        \nPATTERNS_SCORE=\"$PATTERNS_SCORE_ENV\"\n\n# Calculate total injection overhead\n\
        TOTAL_OVERHEAD_MS=0\nif [ -n \"$SCORER_TIME\" ] && [ -n \"$INJECT_TIME\" ];\
        \ then\n  TOTAL_OVERHEAD_MS=$(( ${SCORER_TIME:-0} + ${INJECT_TIME:-0} ))\n\
        fi\n\n# Create performance report\nPERF_REPORT=\".codex/phase_10_3_performance_metrics.json\"\
        \npython3 << 'PYTHON_PERF'\nimport json\nimport os\nfrom datetime import datetime\n\
        \nmetrics = {\n    'timestamp': datetime.now().isoformat(),\n    'context_scorer_time_ms':\
        \ int(os.environ.get('CONTEXT_SCORER_TIME_MS', '0') or '0'),\n    'pattern_injection_time_ms':\
        \ int(os.environ.get('CONTEXT_INJECTION_TIME_MS', '0') or '0'),\n    'patterns_count':\
        \ int(os.environ.get('CONTEXT_PATTERNS_COUNT', '0') or '0'),\n    'avg_relevance_score':\
        \ float(os.environ.get('CONTEXT_PATTERNS_AVG_SCORE', '0') or '0'),\n    'total_overhead_ms':\
        \ 0,\n    'ooda_baseline_ms': 2500,\n    'ooda_improvement_percent': 0,\n\
        }\n\n# Calculate totals\nmetrics['total_overhead_ms'] = metrics['context_scorer_time_ms']\
        \ + metrics['pattern_injection_time_ms']\n\n# Estimate OODA improvement (10%+\
        \ baseline with patterns)\nif metrics['patterns_count'] > 0 and metrics['avg_relevance_score']\
        \ > 0.65:\n    metrics['ooda_improvement_percent'] = 10.0 + (metrics['avg_relevance_score']\
        \ - 0.65) * 20.0\n\nmetrics['ooda_with_context_ms'] = int(\n    metrics['ooda_baseline_ms']\
        \ * (1.0 - metrics['ooda_improvement_percent'] / 100.0)\n)\n\n# Write metrics\n\
        with open(os.environ.get('PERF_REPORT', '.codex/phase_10_3_performance_metrics.json'),\
        \ 'w', encoding='utf-8') as f:\n    json.dump(metrics, f, indent=2)\n\n# Print\
        \ summary\nprint(\"\U0001F4CA PERFORMANCE METRICS\")\nprint(f\"  Scoring time:\
        \ {metrics['context_scorer_time_ms']}ms\")\nprint(f\"  Injection time: {metrics['pattern_injection_time_ms']}ms\"\
        )\nprint(f\"  Total overhead: {metrics['total_overhead_ms']}ms\")\nprint(f\"\
        \  Patterns injected: {metrics['patterns_count']}\")\nprint(f\"  Avg relevance:\
        \ {metrics['avg_relevance_score']:.2f}\")\nprint(f\"  OODA baseline: {metrics['ooda_baseline_ms']}ms\"\
        )\nprint(f\"  OODA with context: {metrics['ooda_with_context_ms']}ms\")\n\
        print(f\"  Improvement: {metrics['ooda_improvement_percent']:.1f}%\")\n\n\
        # Validate constraints\nif metrics['total_overhead_ms'] > 100:\n    print(f\"\
        \  \u26A0\uFE0F OVERHEAD ALERT: {metrics['total_overhead_ms']}ms > 100ms threshold\"\
        )\nelse:\n    print(f\"  \u2705 OVERHEAD OK: {metrics['total_overhead_ms']}ms\
        \ < 100ms\")\n\nif metrics['patterns_count'] < 10 or metrics['patterns_count']\
        \ > 20:\n    print(f\"  \u26A0\uFE0F PATTERN COUNT ALERT: {metrics['patterns_count']}\
        \ (target: 10-20)\")\nelse:\n    print(f\"  \u2705 PATTERN COUNT OK: {metrics['patterns_count']}\"\
        )\n\nif metrics['avg_relevance_score'] < 0.65:\n    print(f\"  \u26A0\uFE0F\
        \ RELEVANCE ALERT: {metrics['avg_relevance_score']:.2f} (target: >0.80)\"\
        )\nelif metrics['avg_relevance_score'] >= 0.80:\n    print(f\"  \u2705 RELEVANCE\
        \ OK: {metrics['avg_relevance_score']:.2f}\")\nelse:\n    print(f\"  \u26A0\
        \uFE0F RELEVANCE LOW: {metrics['avg_relevance_score']:.2f} (target: >0.80)\"\
        )\nPYTHON_PERF\n\necho \"\U0001F4C8 Metrics written to $PERF_REPORT\"\necho\
        \ \"::endgroup::\"\n"
    - name: "\U0001F500 Phase 10.3: A/B Test Tracking (record injection impact)"
      id: ab_test_tracking
      continue-on-error: true
      env:
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: "echo \"::group::A/B Test Tracking\"\n\nAB_TEST_LOG=\".codex/phase_10_3_ab_test_log.jsonl\"\
        \n\npython3 << 'PYTHON_AB'\nimport hashlib\nimport json\nimport os\nfrom datetime\
        \ import datetime\n\npr_num = os.environ.get('GITHUB_PR_NUMBER', 'unknown')\n\
        \n# Simple hash-based assignment (deterministic for same PR)\nhash_val = int(hashlib.md5(str(pr_num).encode()).hexdigest(),\
        \ 16)\ngroup = 'A' if hash_val % 2 == 0 else 'B'  # 50/50 split\n\n# Create\
        \ test record\nrecord = {\n    'timestamp': datetime.now().isoformat(),\n\
        \    'github_ref': os.environ.get('GITHUB_REF', 'unknown'),\n    'pr_number':\
        \ pr_num,\n    'test_group': group,\n    'context_scorer_status': os.environ.get('CONTEXT_SCORER_STATUS',\
        \ 'unknown'),\n    'patterns_injected': int(os.environ.get('CONTEXT_PATTERNS_COUNT',\
        \ '0') or '0'),\n    'avg_relevance_score': float(os.environ.get('CONTEXT_PATTERNS_AVG_SCORE',\
        \ '0') or '0'),\n    'injection_overhead_ms': (\n        int(os.environ.get('CONTEXT_SCORER_TIME_MS',\
        \ '0') or '0') +\n        int(os.environ.get('CONTEXT_INJECTION_TIME_MS',\
        \ '0') or '0')\n    ),\n}\n\n# Append to log\nlog_file = os.environ.get('AB_TEST_LOG',\
        \ '.codex/phase_10_3_ab_test_log.jsonl')\nos.makedirs(os.path.dirname(log_file)\
        \ or '.', exist_ok=True)\n\nwith open(log_file, 'a', encoding='utf-8') as\
        \ f:\n    f.write(json.dumps(record) + '\\n')\n\nprint(f\"\U0001F4CA A/B Test\
        \ Group: {group}\")\nprint(f\"   - Patterns injected: {record['patterns_injected']}\"\
        )\nprint(f\"   - Relevance score: {record['avg_relevance_score']:.2f}\")\n\
        print(f\"   - Injection overhead: {record['injection_overhead_ms']}ms\")\n\
        print(f\"   - Status: {record['context_scorer_status']}\")\n\n# Count records\
        \ for progress\ncount = 0\nif os.path.exists(log_file):\n    with open(log_file,\
        \ 'r', encoding='utf-8') as f:\n        count = len(f.readlines())\n\nprint(f\"\
        \   \U0001F4C8 Total A/B test sessions recorded: {count}\")\nPYTHON_AB\n\n\
        echo \"\u2705 A/B test record appended to $AB_TEST_LOG\"\necho \"::endgroup::\"\
        \n"
    - name: "\u2699\uFE0F Configure git for non-interactive CI operation"
      run: "git config --global core.editor \"true\"\ngit config --global advice.mergeConflict\
        \ false\necho \"\u2705 git configured: core.editor=true, advice.mergeConflict=false\"\
        \n"
    - name: "\U0001F500 Fetch remote branch refs for PR diff support"
      if: always()
      run: "git fetch origin '+refs/heads/*:refs/remotes/origin/*' --depth=1 2>/dev/null\
        \ \\\n  && echo \"\u2705 Remote branch refs fetched (as origin/*)\" \\\n \
        \ || echo \"\u26A0\uFE0F Remote ref fetch failed (non-blocking)\"\ngit branch\
        \ -f main origin/main 2>/dev/null \\\n  && echo \"\u2705 main available as\
        \ local branch ref\" \\\n  || echo \"\u26A0\uFE0F Could not create local main\
        \ ref (non-blocking)\"\nBASE=\"${{ github.base_ref }}\"\nif [ -n \"$BASE\"\
        \ ] && [ \"$BASE\" != \"main\" ]; then\n  git branch -f \"$BASE\" \"origin/$BASE\"\
        \ 2>/dev/null \\\n    && echo \"\u2705 $BASE available as local branch ref\"\
        \ \\\n    || echo \"\u26A0\uFE0F Could not create local $BASE ref (non-blocking)\"\
        \nfi\n"
    - name: "\U0001F500 Merge Conflict Pre-Check (session start)"
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      run: "echo \"\u2500\u2500 \xA70.4: Inspecting PR for merge conflicts \u2500\u2500\
        \"\nBASE=\"${BASE_REF}\"\n\nif [ -n \"$PR_NUMBER\" ]; then\n  MERGEABLE=$(gh\
        \ pr view \"$PR_NUMBER\" --json mergeable -q .mergeable 2>/dev/null || echo\
        \ \"UNKNOWN\")\n  echo \"PR  #${PR_NUMBER} mergeable status: ${MERGEABLE}\"\
        \n  if [ \"$MERGEABLE\" = \"CONFLICTING\" ]; then\n    echo \"::warning::\xA7\
        0.4 MERGE CONFLICT DETECTED \u2014 PR  #${PR_NUMBER}\"\n    echo \"  has merge\
        \ conflicts with base branch '${BASE}'.\"\n    echo \"  Agent MUST resolve\
        \ these before any other work.\"\n    echo \"COPILOT_MERGE_CONFLICT=true\"\
        \ >> \"$GITHUB_ENV\"\n  elif [ \"$MERGEABLE\" = \"MERGEABLE\" ]; then\n  \
        \  echo \"\u2705 No merge conflicts detected\"\n    echo \"COPILOT_MERGE_CONFLICT=false\"\
        \ >> \"$GITHUB_ENV\"\n  else\n    echo \"\u2139\uFE0F Mergeable status: ${MERGEABLE}\
        \ (GitHub may still be computing)\"\n    echo \"COPILOT_MERGE_CONFLICT=unknown\"\
        \ >> \"$GITHUB_ENV\"\n  fi\nfi\n\nif [ -n \"$BASE\" ]; then\n  BEHIND=$(git\
        \ rev-list --count \"HEAD..origin/${BASE}\" 2>/dev/null || echo \"0\")\n \
        \ AHEAD=$(git rev-list --count \"origin/${BASE}..HEAD\" 2>/dev/null || echo\
        \ \"0\")\n  echo \"Branch status: ${BEHIND} behind, ${AHEAD} ahead of ${BASE}\"\
        \n  if [ \"$BEHIND\" -gt 0 ]; then\n    echo \"::warning::\xA70.4 BRANCH DIVERGED\
        \ \u2014 Branch is ${BEHIND}\"\n    echo \"  commit(s) behind '${BASE}'.\"\
        \n    echo \"  Agent should rebase or merge base before starting work.\"\n\
        \    echo \"COPILOT_BRANCH_BEHIND=${BEHIND}\" >> \"$GITHUB_ENV\"\n  else\n\
        \    echo \"\u2705 Branch is up-to-date with ${BASE}\"\n    echo \"COPILOT_BRANCH_BEHIND=0\"\
        \ >> \"$GITHUB_ENV\"\n  fi\nfi\n\nif [ -n \"$BASE\" ] && git rev-parse \"\
        origin/${BASE}\" >/dev/null 2>&1; then\n  MERGE_BASE=$(git merge-base HEAD\
        \ \"origin/${BASE}\" 2>/dev/null || echo \"\")\n  if [ -n \"$MERGE_BASE\"\
        \ ]; then\n    CONFLICT_FILES=$(git merge-tree \"$MERGE_BASE\" HEAD \"origin/${BASE}\"\
        \ 2>/dev/null | grep -c '<<<<<<< ' || echo \"0\")\n    if [ \"$CONFLICT_FILES\"\
        \ -gt 0 ]; then\n      echo \"::warning::\xA70.4 POTENTIAL CONFLICTS \u2014\
        \ merge-tree detected ${CONFLICT_FILES} file(s) with conflicts against '${BASE}'\"\
        \n    else\n      echo \"\u2705 merge-tree: no file-level conflicts detected\"\
        \n    fi\n  fi\nfi\n\necho \"\u2500\u2500 \xA70.4 merge conflict pre-check\
        \ complete \u2500\u2500\"\n"
    - name: "\U0001F6A8 CI Failure Issue Check (session start)"
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "echo \"\u2500\u2500 \xA70.2: Checking for open CI failure report issues\
        \ \u2500\u2500\"\nREPO=\"Aries-Serpent/_codex_\"\n\nCI_FAILURES=$(gh issue\
        \ list --repo \"$REPO\" --label \"ci-failure\" --state open \\\n  --json number,title,updatedAt\
        \ --jq 'length' 2>/dev/null || echo \"0\")\necho \"Open ci-failure issues:\
        \ ${CI_FAILURES}\"\n\nHEALTH_ALERTS=$(gh issue list --repo \"$REPO\" --label\
        \ \"ci-health-alert\" --state open \\\n  --json number,title,updatedAt --jq\
        \ 'length' 2>/dev/null || echo \"0\")\necho \"Open ci-health-alert issues:\
        \ ${HEALTH_ALERTS}\"\n\nTOTAL=$((CI_FAILURES + HEALTH_ALERTS))\necho \"COPILOT_CI_FAILURE_ISSUES=${TOTAL}\"\
        \ >> \"$GITHUB_ENV\"\n\nif [ \"$TOTAL\" -gt 0 ]; then\n  echo \"::warning::\xA7\
        0.2 OPEN CI FAILURE ISSUES \u2014 ${TOTAL} open issue(s)\"\n  echo \"  found\
        \ (${CI_FAILURES} ci-failure, ${HEALTH_ALERTS} ci-health-alert).\"\n  echo\
        \ \"  Agent should review these for patterns affecting this PR.\"\n  echo\
        \ \"\"\n  echo \"\u2500\u2500 Open CI failure issues: \u2500\u2500\"\n  gh\
        \ issue list --repo \"$REPO\" --label \"ci-failure\" --state open \\\n   \
        \ --json number,title --jq '.[] | \"#\\(.number): \\(.title)\"' 2>/dev/null\
        \ || true\n  gh issue list --repo \"$REPO\" --label \"ci-health-alert\" --state\
        \ open \\\n    --json number,title --jq '.[] | \"#\\(.number): \\(.title)\"\
        ' 2>/dev/null || true\nelse\n  echo \"\u2705 No open CI failure report issues\"\
        \nfi\n\necho \"\u2500\u2500 \xA70.2 CI failure issue check complete \u2500\
        \u2500\"\n"
    - name: "\U0001F50D Validate repo JSON files (non-blocking)"
      continue-on-error: true
      run: "echo \"\u2500\u2500 Validating JSON files in .codex/ and docs/ \u2500\u2500\
        \"\nFAIL=0\nINVALID_FILES=\"\"\n\nwhile IFS= read -r -d '' f; do\n  if ! python3\
        \ -m json.tool \"$f\" > /dev/null 2>&1; then\n    echo \"::warning file=${f}::Invalid\
        \ JSON detected (non-blocking): ${f}\"\n    INVALID_FILES=\"${INVALID_FILES}${f}\\\
        n\"\n    FAIL=$((FAIL + 1))\n  fi\ndone < <(find .codex docs -name \"*.json\"\
        \ -not -path \"*/__pycache__/*\" -print0 2>/dev/null)\n\nif [ \"$FAIL\" -gt\
        \ 0 ]; then\n  echo \"::warning::\u26A0\uFE0F Found ${FAIL} invalid JSON file(s)\
        \ \u2014 these will be addressed by agent session\"\n  echo \"--- Invalid\
        \ JSON Files ---\"\n  printf '%s' \"$INVALID_FILES\"\n  echo \"--- Agent will\
        \ remediate these errors ---\"\nelse\n  echo \"\u2705 All JSON files valid\"\
        \nfi\n"
    - name: "\U0001F511 Inject repo variable context for agent"
      continue-on-error: true
      run: "if [ ! -f .github/scripts/inject_context_vars.py ]; then\n  echo \"::warning::inject_context_vars.py\
        \ not found (non-blocking)\"\nelse\n  python3 .github/scripts/inject_context_vars.py\
        \ || {\n    echo \"::warning::Failed to inject context vars (non-blocking)\
        \ \u2014 agent will proceed with defaults\"\n  }\nfi\n"
    - name: "\u2699\uFE0F Inject cascade-control & tuning variables (live vars fallback)"
      continue-on-error: true
      env:
        CODEX_MAX_HEALER_RUNS_PER_HOUR: ${{ vars.CODEX_MAX_HEALER_RUNS_PER_HOUR }}
        CODEX_SWEEP_SKIP_MAIN: ${{ vars.CODEX_SWEEP_SKIP_MAIN }}
        CODEX_HEALER_SKIP_SKIPCI: ${{ vars.CODEX_HEALER_SKIP_SKIPCI }}
        COPILOT_RUNNER_PROFILE: ${{ vars.COPILOT_RUNNER_PROFILE }}
        CODEX_CACHE_VERSION: ${{ vars.CODEX_CACHE_VERSION }}
        COPILOT_AGENT_STATE: ${{ vars.COPILOT_AGENT_STATE }}
        CODEX_CI_LAST_GREEN_SHA: ${{ vars.CODEX_CI_LAST_GREEN_SHA }}
      run: "for var in \\\n  CODEX_MAX_HEALER_RUNS_PER_HOUR \\\n  CODEX_SWEEP_SKIP_MAIN\
        \ \\\n  CODEX_HEALER_SKIP_SKIPCI \\\n  COPILOT_RUNNER_PROFILE \\\n  CODEX_CACHE_VERSION\
        \ \\\n  COPILOT_AGENT_STATE \\\n  CODEX_CI_LAST_GREEN_SHA; do\n  val=\"${!var}\"\
        \n  if [ -n \"$val\" ]; then\n    echo \"${var}=${val}\" >> \"$GITHUB_ENV\"\
        \n    echo \"  \u2705 ${var}=${val}\"\n  fi\ndone\necho \"\u2500\u2500 Cascade-control\
        \ var injection complete \u2500\u2500\"\n"
    - name: "\U0001F6E1\uFE0F Install safe-git-show guard on PATH"
      continue-on-error: true
      run: "if [ ! -f scripts/ci/safe_git_show.sh ]; then\n  echo \"::warning::scripts/ci/safe_git_show.sh\
        \ not found (non-blocking) \u2014 agent will proceed without guard\"\nelse\n\
        \  install -m 0755 scripts/ci/safe_git_show.sh /usr/local/bin/safe_git_show.sh\
        \ 2>/dev/null || {\n    echo \"::warning::Failed to install safe_git_show\
        \ (non-blocking) \u2014 agent will proceed\"\n  }\n  ln -sf /usr/local/bin/safe_git_show.sh\
        \ /usr/local/bin/safe_git_show 2>/dev/null || true\n  echo \"\u2705 safe_git_show\
        \ installed at $(command -v safe_git_show 2>/dev/null || echo 'UNKNOWN')\"\
        \nfi\n"
    - name: "\U0001F52D LFS diagnostics"
      if: ${{ env.LFS_DIAGNOSTICS_ENABLED == 'true' }}
      continue-on-error: true
      run: 'echo "Git version: $(git --version)"

        echo "LFS version: $(git lfs version 2>/dev/null || echo ''git-lfs not installed'')"

        git status || true

        git lfs ls-files || true

        '
    - name: "\U0001F4E5 Install git-lfs (if needed)"
      if: ${{ env.LFS_FETCH_ENABLED == 'true' }}
      continue-on-error: true
      run: "if ! command -v git-lfs >/dev/null 2>&1; then\n  if command -v apt-get\
        \ >/dev/null 2>&1; then\n    sudo apt-get update && sudo apt-get install -y\
        \ git-lfs || {\n      echo \"::warning::Failed to install git-lfs (non-blocking)\"\
        \n    }\n  fi\nfi\ngit lfs install --local || true\n"
    - name: "\U0001F3AF Targeted LFS fetch & checkout (guarded)"
      if: ${{ env.LFS_TARGETED_ENABLED == 'true' }}
      continue-on-error: true
      run: "INCLUDES=\"${{ inputs.lfs_include_paths }}\"\nINCLUDES_CLEAN=$(echo \"\
        $INCLUDES\" | tr -d ' ' | tr ',' ' ')\necho \"Targeted LFS includes: $INCLUDES_CLEAN\"\
        \n\nfor i in 1 2 3; do\n  echo \"Attempt $i: git lfs fetch --include=\\\"\
        $INCLUDES_CLEAN\\\" origin\"\n  if git lfs fetch --include=\"$INCLUDES_CLEAN\"\
        \ origin; then\n    echo \"git lfs fetch succeeded\"\n    break\n  else\n\
        \    echo \"git lfs fetch failed on attempt $i (non-blocking)\"\n    sleep\
        \ $((i * 5))\n  fi\ndone\n\ngit lfs checkout --include=\"$INCLUDES_CLEAN\"\
        \ || true\n"
    - name: "\U0001F310 Full LFS fetch & checkout (guarded)"
      if: ${{ env.LFS_FULL_ENABLED == 'true' }}
      continue-on-error: true
      run: "for i in 1 2 3; do\n  echo \"Attempt $i: git lfs fetch --all origin\"\n\
        \  if git lfs fetch --all origin; then\n    echo \"git lfs fetch --all succeeded\"\
        \n    break\n  else\n    echo \"git lfs fetch --all failed on attempt $i (non-blocking)\"\
        \n    sleep $((i * 5))\n  fi\ndone\n\ngit lfs checkout || true\n"
    - name: "\U0001F50D Detect Environment Type"
      id: detect_env
      continue-on-error: true
      env:
        HEAD_REF: ${{ github.head_ref }}
        INPUT_ENV_TYPE: ${{ github.event.inputs.environment_type || 'standard' }}
      run: "ENV_TYPE=\"${INPUT_ENV_TYPE}\"\nif [[ \"$ENV_TYPE\" == \"standard\" ]];\
        \ then\n  if [[ \"${HEAD_REF}\" == *\"ml\"* ]] || [[ \"${HEAD_REF}\" == *\"\
        rag\"* ]]; then\n    ENV_TYPE=\"ml-heavy\"\n  elif [[ \"${HEAD_REF}\" == *\"\
        security\"* ]] || [[ \"${HEAD_REF}\" == *\"sec\"* ]]; then\n    ENV_TYPE=\"\
        security-scan\"\n  elif [[ \"${HEAD_REF}\" == *\"docs\"* ]] || [[ \"${HEAD_REF}\"\
        \ == *\"documentation\"* ]]; then\n    ENV_TYPE=\"documentation\"\n  fi\n\
        fi\necho \"environment_type=$ENV_TYPE\" >> \"$GITHUB_OUTPUT\"\necho \"\u2705\
        \ Detected environment type: $ENV_TYPE\"\n"
    - name: "\u2705 Validate Environment Setup"
      continue-on-error: true
      run: "trap '' PIPE\nset +o pipefail\n\necho \"==================== Environment\
        \ Validation ====================\"\necho \"Python Version: $(python --version\
        \ 2>&1)\"\necho \"Pip Version: $(pip --version 2>&1)\"\necho \"Node Version:\
        \ $(node --version 2>/dev/null || echo 'Not installed')\"\necho \"Rust Version:\
        \ $(rustc --version 2>/dev/null || echo 'Not installed')\"\necho \"\"\necho\
        \ \"==================== Installed Packages ====================\"\npip list\
        \ 2>/dev/null | head -20 || true\necho \"...\"\necho \"\"\necho \"====================\
        \ Environment Variables ====================\"\nenv | grep -E \"^(CODEX|PYTHON|RAG|CI|GITHUB|COPILOT)\"\
        \ | sort || true\necho \"\"\necho \"==================== Disk Space ====================\"\
        \ndf -h | grep -E \"^/dev\" || true\necho \"\"\necho \"\u2705 Environment\
        \ setup complete for type: ${{ steps.detect_env.outputs.environment_type }}\"\
        \n"
    - name: "\U0001F3E5 Run Health Check"
      continue-on-error: true
      run: "echo \"Checking critical paths...\"\ntest -d src/codex && echo \"\u2705\
        \ src/codex exists\" || echo \"\u26A0\uFE0F src/codex missing (non-blocking)\"\
        \ntest -d .codex && echo \"\u2705 .codex exists\" || echo \"\u26A0\uFE0F .codex\
        \ missing (non-blocking)\"\ntest -d tests && echo \"\u2705 tests exists\"\
        \ || echo \"\u26A0\uFE0F tests missing (non-blocking)\"\ntest -f pyproject.toml\
        \ && echo \"\u2705 pyproject.toml exists\" || echo \"\u26A0\uFE0F pyproject.toml\
        \ missing (non-blocking)\"\npython -c \"import codex; print('\u2705 codex\
        \ package importable')\" 2>/dev/null || echo \"\u26A0\uFE0F codex package\
        \ import failed (non-blocking)\"\nwhich ruff && echo \"\u2705 ruff available\"\
        \ || echo \"\u26A0\uFE0F ruff not available (non-blocking)\"\nwhich black\
        \ && echo \"\u2705 black available\" || echo \"\u26A0\uFE0F black not available\
        \ (non-blocking)\"\nwhich pytest && echo \"\u2705 pytest available\" || echo\
        \ \"\u26A0\uFE0F pytest not available (non-blocking)\"\n"
    - name: "\U0001F4CA Session Lifecycle Metrics"
      continue-on-error: true
      run: "if [ -f scripts/session_tracker.py ]; then\n  echo \"\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500 Session Lifecycle Metrics \u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\"\n  python scripts/session_tracker.py metrics\
        \ || true\n  echo \"\"\n  # Write JSON metrics to GITHUB_STEP_SUMMARY\n  METRICS_JSON=$(python\
        \ scripts/session_tracker.py metrics --format json 2>/dev/null || echo '{}')\n\
        \  echo \"## \U0001F4CA Session Lifecycle Metrics\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n  echo '```json' >> \"$GITHUB_STEP_SUMMARY\"\n  echo \"$METRICS_JSON\" >>\
        \ \"$GITHUB_STEP_SUMMARY\"\n  echo '```' >> \"$GITHUB_STEP_SUMMARY\"\nelse\n\
        \  echo \"\u26A0\uFE0F  session_tracker.py not found \u2014 skipping metrics\"\
        \nfi\n"
    - name: "\U0001F4BE Prepare Cache Artifacts"
      run: "mkdir -p .codex/cache\nmkdir -p .codex/sessions\necho \"\u2705 Cache directories\
        \ prepared\"\n"
    - name: "\U0001F4CA Accountability Auto-Update (session close hook)"
      continue-on-error: true
      env:
        CODEX_SESSION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      run: "# Run accountability auto-update in dry-run mode during setup to\n# pre-validate\
        \ the script. The actual --commit run is triggered at\n# session close by\
        \ the agent itself or post-job hooks.\nif [ -f src/codex/session/accountability_autoupdate.py\
        \ ]; then\n  echo \"\u2705 Accountability auto-update script available\"\n\
        \  python -m src.codex.session.accountability_autoupdate --dry-run 2>/dev/null\
        \ \\\n    && echo \"  \u2192 dry-run validation passed\" \\\n    || echo \"\
        \  \u26A0\uFE0F dry-run validation skipped (non-blocking)\"\nelse\n  echo\
        \ \"\u26A0\uFE0F accountability_autoupdate.py not found \u2014 skipping\"\n\
        fi\n"
    - name: "\U0001F504 Rotate Cognitive Brain Status Files"
      continue-on-error: true
      run: "if [ -f scripts/ci/rotate_cognitive_brain_status.py ]; then\n  python\
        \ scripts/ci/rotate_cognitive_brain_status.py --keep 50 --threshold 60 ||\
        \ true\nfi\n"
    - name: "\U0001F916 Initialize Cognitive Brain Context"
      continue-on-error: true
      run: "if [ -f .github/agents/AGENT_REGISTRY.yaml ]; then\n  echo \"\u2705 Loading\
        \ specialized agents from registry...\"\n  head -20 .github/agents/AGENT_REGISTRY.yaml\
        \ || true\nfi\nif [ -d cognitive/ ]; then\n  echo \"\u2705 Cognitive brain\
        \ components available\"\n  ls -la cognitive/ | head -10\nfi\n"
    - name: "\U0001F4BB Start CLI API Server (background)"
      continue-on-error: true
      run: "if [ ! -f cognitive_app/src/server/cli_api_server.py ]; then\n  echo \"\
        \u26A0\uFE0F cli_api_server.py not found \u2014 skipping (non-blocking)\"\n\
        \  exit 0\nfi\npip install fastapi uvicorn httpx ptyprocess --quiet 2>/dev/null\
        \ || true\n# Explicitly forward auth tokens to the server process env.\n#\
        \ Even though CODEX_MASTER_KEY is in the job env block, child processes\n\
        # started with nohup inherit from the CURRENT step env \u2014 which already\n\
        # has these values. The explicit assignment below makes the intent clear\n\
        # and is idempotent.\nexport CODEX_MASTER_KEY=\"${CODEX_MASTER_KEY:-}\"\n\
        export CODEX_BACKUP_KEY=\"${CODEX_BACKUP_KEY:-}\"\nexport AGENT_GITHUB_TOKEN=\"\
        ${GITHUB_TOKEN:-}\"\nnohup uvicorn cognitive_app.src.server.cli_api_server:app\
        \ \\\n  --host 0.0.0.0 \\\n  --port 8765 \\\n  --log-level warning \\\n  >\
        \ \"${RUNNER_TEMP}/cli_api_server.log\" 2>&1 &\nCLI_API_PID=$!\necho \"CLI_API_SERVER_PID=${CLI_API_PID}\"\
        \ >> \"$GITHUB_ENV\"\n# Always export http://localhost:8765 \u2014 the server\
        \ is started on that\n# fixed address above.  Deriving from COPILOT_CLI_BASE_URL\
        \ was\n# misleading: if that variable pointed to a different host/port the\n\
        # exported URL would be wrong while the health check (which always\n# hits\
        \ localhost:8765) still passed.  Hard-code the actual address.\necho \"CODEX_CLI_API_URL=http://localhost:8765\"\
        \ >> \"$GITHUB_ENV\"\n# Retry health-check up to 5 s to accommodate slower\
        \ startup\nSERVER_READY=0\nfor i in 1 2 3 4 5; do\n  sleep 1\n  if curl -sf\
        \ http://localhost:8765/api/health > /dev/null 2>&1; then\n    SERVER_READY=1\n\
        \    break\n  fi\ndone\nif [ \"$SERVER_READY\" = \"1\" ]; then\n  echo \"\u2705\
        \ CLI API Server ready on :8765 (PID=${CLI_API_PID})\"\n  echo \"   BrainClient\
        \ URL: http://localhost:8765\"\n  echo \"   Import: from codex.agents.brain_client\
        \ import BrainClient\"\n  # Report which auth token the server can use for\
        \ GitHub API calls\n  if [ -n \"${CODEX_MASTER_KEY:-}\" ]; then\n    echo\
        \ \"   \U0001F511 Auth: CODEX_MASTER_KEY active (full PAT \u2014 variables/secrets\
        \ API \u2705)\"\n  elif [ -n \"${CODEX_BACKUP_KEY:-}\" ]; then\n    echo \"\
        \   \U0001F511 Auth: CODEX_BACKUP_KEY active (fallback PAT)\"\n  elif [ -n\
        \ \"${GITHUB_TOKEN:-}\" ]; then\n    echo \"   \U0001F511 Auth: GITHUB_TOKEN\
        \ active (actions:write scope)\"\n  else\n    echo \"   \u26A0\uFE0F  No auth\
        \ token \u2014 GitHub API calls will be unauthenticated (rate-limited)\"\n\
        \  fi\nelse\n  echo \"\u26A0\uFE0F CLI API Server did not respond after 5\
        \ s \u2014 see RUNNER_TEMP/cli_api_server.log\"\n  cat \"${RUNNER_TEMP}/cli_api_server.log\"\
        \ 2>/dev/null | tail -20 || true\nfi\n"
    - name: "\U0001F4CA Generate Environment Report (temp path)"
      id: gen_report
      if: always()
      shell: bash
      run: "set -euo pipefail\nREPORT_DIR=\"${RUNNER_TEMP:-/tmp}\"\nREPORT=\"$REPORT_DIR/copilot-agent-environment-report.txt\"\
        \n{\n  echo \"==================== Copilot Agent Environment Report ====================\"\
        \n  echo \"Generated: $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\"\n  echo \"Environment\
        \ Type: ${{ steps.detect_env.outputs.environment_type }}\"\n  echo \"Runner:\
        \ ${{ runner.os }} ${{ runner.arch }}\"\n  echo \"\"\n  echo \"Python: $(python\
        \ --version)\"\n  echo \"Node: $(node --version 2>/dev/null || echo 'N/A')\"\
        \n  echo \"Rust: $(rustc --version 2>/dev/null || echo 'N/A')\"\n  echo \"\
        \"\n  echo \"Installed Packages: $(pip list | wc -l) packages\"\n  echo \"\
        Disk Space: $(df -h / | tail -1 | awk '{print $4}') available\"\n  echo \"\
        \"\n  echo \"Status: \u2705 Environment ready for Copilot agent operations\"\
        \n} > \"$REPORT\"\ntest -s \"$REPORT\"\necho \"Report written to $REPORT\"\nhead -20 \"$REPORT\"\
        \ || true\necho \"REPORT_PATH=$REPORT\" >> \"$GITHUB_OUTPUT\"\n"
    - name: "\U0001F4E4 Upload Environment Report"
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.gen_report.outputs.REPORT_PATH }}
        retention-days: 14
        if-no-files-found: warn
        name: copilot-agent-environment-report
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: copilot-setup-steps
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Copilot Setup Steps
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
