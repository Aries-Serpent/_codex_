name: Pre-Flight CI Validation
on:
  pull_request:
    paths:
    - .github/workflows/**
    - tests/**
    - pytest.ini
    - pyproject.toml
    - scripts/ci/**
  push:
    branches:
    - main
    - copilot/**
    paths:
    - .github/workflows/**
    - tests/**
    - pytest.ini
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  pre-flight-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Setup Python (cached)
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Run pre-flight check
      id: pre_flight
      run: 'python scripts/ci/pre_flight_check.py

        '
      continue-on-error: true
    - name: Comment on PR with results (on failure)
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: "const MARKER = '<!-- pre-flight-validation-result -->';\nconst body\
          \ = `${MARKER}\\n## \u26A0\uFE0F Pre-Flight CI Validation Failed\n\nCommon\
          \ issues were detected that are likely to cause CI failures.\n\n### What\
          \ to do:\n\n1. **Run locally**:\n   \\`\\`\\`bash\n   python scripts/ci/pre_flight_check.py\n\
          \   \\`\\`\\`\n\n2. **Auto-fix (where possible)**:\n   \\`\\`\\`bash\n \
          \  python scripts/ci/pre_flight_check.py --fix\n   \\`\\`\\`\n\n3. **Review\
          \ changes** and commit fixes\n\n### Common Issues:\n\n- \u274C Pytest workflows\
          \ using explicit \\`-p\\` flags (causes double registration)\n- \u274C Missing\
          \ plugin version pinning in workflows\n- \u274C DummyOptimizer mocks missing\
          \ \\`param_groups\\` attribute\n- \u274C Module-level \\`pytest.importorskip()\\\
          ` in conftest.py\n\n**Correct approach**: Pin plugin versions, NO \\`-p\\\
          ` flags needed (see .codex/PR_3248_ROOT_CAUSE_ANALYSIS.md)\n\n### Reference:\n\
          \n- \U0001F4CB [CI Failure Tracking Log](.codex/CI_FAILURE_TRACKING_LOG.md)\n\
          - \U0001F4CB [Detailed logs](${{ github.server_url }}/${{ github.repository\
          \ }}/actions/runs/${{ github.run_id }})\n\n---\n_[\U0001F517 Workflow run](${{\
          \ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id\
          \ }})_\n`;\n\nconst { data: comments } = await github.rest.issues.listComments({\n\
          \  owner: context.repo.owner, repo: context.repo.repo,\n  issue_number:\
          \ context.issue.number, per_page: 100,\n});\nconst existing = comments.find(c\
          \ => c.body && c.body.includes(MARKER));\nif (existing) {\n  await github.rest.issues.updateComment({\n\
          \    owner: context.repo.owner, repo: context.repo.repo,\n    comment_id:\
          \ existing.id, body,\n  });\n} else {\n  await github.rest.issues.createComment({\n\
          \    issue_number: context.issue.number,\n    owner: context.repo.owner,\
          \ repo: context.repo.repo, body,\n  });\n}\n"
    - name: Fail if checks didn't pass
      if: steps.pre_flight.outcome == 'failure'
      run: "echo \"\u274C Pre-flight checks failed. See output above for details.\"\
        \nexit 1\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: pre-flight-validation
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Pre-Flight Validation
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
