name: Pre-Flight CI Validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/**'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'scripts/ci/**'
  push:
    branches:
      - main
      - 'copilot/**'
    paths:
      - '.github/workflows/**'
      - 'tests/**'
      - 'pytest.ini'


permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  pre-flight-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python (cached)
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Run pre-flight check
        id: pre_flight
        run: |
          python scripts/ci/pre_flight_check.py
        continue-on-error: true

      - name: Comment on PR with results (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const MARKER = '<!-- pre-flight-validation-result -->';
            const body = `${MARKER}\n## ⚠️ Pre-Flight CI Validation Failed

            Common issues were detected that are likely to cause CI failures.

            ### What to do:

            1. **Run locally**:
               \`\`\`bash
               python scripts/ci/pre_flight_check.py
               \`\`\`

            2. **Auto-fix (where possible)**:
               \`\`\`bash
               python scripts/ci/pre_flight_check.py --fix
               \`\`\`

            3. **Review changes** and commit fixes

            ### Common Issues:

            - ❌ Pytest workflows using explicit \`-p\` flags (causes double registration)
            - ❌ Missing plugin version pinning in workflows
            - ❌ DummyOptimizer mocks missing \`param_groups\` attribute
            - ❌ Module-level \`pytest.importorskip()\` in conftest.py

            **Correct approach**: Pin plugin versions, NO \`-p\` flags needed (see .codex/PR_3248_ROOT_CAUSE_ANALYSIS.md)

            ### Reference:

            - 📋 [CI Failure Tracking Log](.codex/CI_FAILURE_TRACKING_LOG.md)
            - 📋 [Detailed logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---
            _[🔗 Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo, body,
              });
            }

      - name: Fail if checks didn't pass
        if: steps.pre_flight.outcome == 'failure'
        run: |
          echo "❌ Pre-flight checks failed. See output above for details."
          exit 1

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: pre-flight-validation
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Pre-Flight Validation"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
