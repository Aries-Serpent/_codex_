name: Deploy Cognitive App (Manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (latest, git SHA, or tag)'
        required: false
        default: 'latest'
      force_rebuild:
        description: 'Force clean rebuild (rm node_modules + dist)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_npm_cache:
        description: 'Skip npm cache (fresh install)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      cache_busting:
        description: 'Add cache-busting query params'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      dry_run:
        description: 'Dry run (build only, no deploy)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      reason:
        description: 'Reason for deployment (for logging)'
        required: false
        default: 'Manual deployment'

concurrency:
  group: ${{ github.workflow }}-manual
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy Cognitive App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deployment_status: ${{ steps.deploy.outputs.status }}
      asset_count: ${{ steps.deploy.outputs.asset_count }}
      verification_result: ${{ steps.verify.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve target version
        id: resolve_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          if [ "$VERSION" = "latest" ]; then
            SHA=$(git rev-parse HEAD)
            TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
            if [ -n "$TAG" ]; then
              echo "target_sha=$SHA" >> $GITHUB_OUTPUT
              echo "target_tag=$TAG" >> $GITHUB_OUTPUT
              echo "target_version=$TAG" >> $GITHUB_OUTPUT
            else
              echo "target_sha=$SHA" >> $GITHUB_OUTPUT
              echo "target_version=${SHA:0:8}" >> $GITHUB_OUTPUT
            fi
          else
            # Assume it's a SHA or tag
            TARGET=$VERSION
            # Try to resolve as tag
            if git rev-parse "$TARGET" >/dev/null 2>&1; then
              SHA=$(git rev-parse "$TARGET")
              echo "target_sha=$SHA" >> $GITHUB_OUTPUT
              echo "target_version=$TARGET" >> $GITHUB_OUTPUT
            else
              echo "target_sha=$TARGET" >> $GITHUB_OUTPUT
              echo "target_version=${TARGET:0:8}" >> $GITHUB_OUTPUT
            fi
          fi
          
          echo "Target version: $(cat $GITHUB_OUTPUT | grep target_version | cut -d= -f2)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: ${{ github.event.inputs.skip_npm_cache == 'true' && 'false' || 'npm' }}
          cache-dependency-path: cognitive_app/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
