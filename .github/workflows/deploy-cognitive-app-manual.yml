name: Deploy Cognitive App (Manual)
true:
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy (latest, git SHA, or tag)
        required: false
        default: latest
      force_rebuild:
        description: Force clean rebuild (rm node_modules + dist)
        required: true
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      skip_npm_cache:
        description: Skip npm cache (fresh install)
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      cache_busting:
        description: Add cache-busting query params
        required: true
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      dry_run:
        description: Dry run (build only, no deploy)
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      reason:
        description: Reason for deployment (for logging)
        required: false
        default: Manual deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    name: Build and Deploy Cognitive App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deployment_status: ${{ steps.deploy.outputs.status }}
      asset_count: ${{ steps.deploy.outputs.asset_count }}
      verification_result: ${{ steps.verify.outputs.result }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Resolve target version
      id: resolve_version
      env:
        MANUAL_VERSION: ${{ github.event.inputs.version }}
      run: |
        VERSION="${MANUAL_VERSION}"

        if [ "$VERSION" = "latest" ]; then
          SHA=$(git rev-parse HEAD)
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            echo "target_sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "target_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "target_version=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "target_sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "target_version=${SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi
        else
          TARGET="$VERSION"
          if git rev-parse "$TARGET" >/dev/null 2>&1; then
            SHA=$(git rev-parse "$TARGET")
            echo "target_sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "target_version=$TARGET" >> "$GITHUB_OUTPUT"
          else
            echo "target_sha=$TARGET" >> "$GITHUB_OUTPUT"
            echo "target_version=${TARGET:0:8}" >> "$GITHUB_OUTPUT"
          fi
        fi

        echo "Target version: $(grep '^target_version=' "$GITHUB_OUTPUT" | cut -d= -f2-)"
    - name: Set up Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: ${{ github.event.inputs.skip_npm_cache == 'true' && 'false' || 'npm'
          }}
        cache-dependency-path: cognitive_app/package-lock.json
    - name: Set up Python 3.12
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Record deployment start
      env:
        TARGET_VERSION: ${{ steps.resolve_version.outputs.target_version }}
        DEPLOY_REASON: ${{ github.event.inputs.reason }}
      run: |
        python scripts/ci/deployment_history_tracker.py record           --type manual           --status started           --version "$TARGET_VERSION"           --reason "$DEPLOY_REASON"
    - name: Prepare build environment
      working-directory: cognitive_app
      env:
        TARGET_VERSION: ${{ steps.resolve_version.outputs.target_version }}
        FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        SKIP_NPM_CACHE: ${{ github.event.inputs.skip_npm_cache }}
        CACHE_BUSTING: ${{ github.event.inputs.cache_busting }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
        DEPLOY_REASON: ${{ github.event.inputs.reason }}
      run: |
        echo "📋 Build Configuration"
        echo "   Version:         ${TARGET_VERSION}"
        echo "   Force rebuild:   ${FORCE_REBUILD}"
        echo "   Skip npm cache:  ${SKIP_NPM_CACHE}"
        echo "   Cache busting:   ${CACHE_BUSTING}"
        echo "   Dry run:         ${DRY_RUN}"
        echo "   Reason:          ${DEPLOY_REASON}"
        echo ""

        echo "Current environment:"
        node --version
        npm --version
        echo ""
    - name: Clean build artifacts (force rebuild)
      if: github.event.inputs.force_rebuild == 'true'
      working-directory: cognitive_app
      run: "echo \"\U0001F9F9 Cleaning build artifacts...\"\nrm -rf node_modules dist\
        \ dist-test\necho \"\u2713 Cleaned node_modules and dist\"\n"
    - name: Pre-build validation
      working-directory: cognitive_app
      run: "echo \"\U0001F50D Pre-build validation...\"\npython ../scripts/ci/validate_cognitive_app_build.py\
        \ --pre-build-only\nif [ $? -ne 0 ]; then\n  echo \"\u274C Pre-build validation\
        \ failed\"\n  exit 1\nfi\necho \"\"\n"
    - name: Install dependencies
      working-directory: cognitive_app
      env:
        SKIP_NPM_CACHE: ${{ github.event.inputs.skip_npm_cache }}
      run: |
        echo "📦 Installing dependencies..."

        if [ "$SKIP_NPM_CACHE" = "true" ]; then
          echo "   Using fresh install (no cache)"
          npm install
        else
          echo "   Using cached install"
          npm ci --prefer-offline
        fi

        echo "✅ Dependencies installed"
        echo ""
    - name: TypeScript build
      working-directory: cognitive_app
      env:
        VITE_API_MODE: ${{ vars.COGNITIVE_APP_API_MODE || 'github' }}
        VITE_CLI_API_URL: ${{ vars.COGNITIVE_APP_API_URL || '' }}
        VITE_DOCS_FETCH_LIVE: 'true'
      run: "echo \"\U0001F3D7\uFE0F  Building cognitive_app...\"\necho \"   API mode:\
        \  ${VITE_API_MODE}\"\necho \"   CLI URL:   ${VITE_CLI_API_URL:-<not set>}\"\
        \necho \"\"\n\nnpm run build\n\nif [ $? -ne 0 ]; then\n  echo \"\u274C Build\
        \ failed\"\n  exit 1\nfi\n\necho \"\u2713 Build successful\"\necho \"\"\n"
    - name: Post-build validation
      working-directory: cognitive_app
      run: "echo \"\u2713 Post-build validation...\"\npython ../scripts/ci/validate_cognitive_app_build.py\
        \ --post-build-only\nif [ $? -ne 0 ]; then\n  echo \"\u274C Post-build validation\
        \ failed\"\n  exit 1\nfi\necho \"\"\n"
    - name: Apply cache busting
      if: github.event.inputs.cache_busting == 'true'
      env:
        DEPLOY_REASON: ${{ github.event.inputs.reason }}
      run: |
        echo "🔄 Applying cache-busting configuration..."
        python scripts/ci/cognitive_app_cache_invalidator.py           --url "https://aries-serpent.github.io/_codex_/cognitive_app/"           --reason "Manual deployment - ${DEPLOY_REASON}"
    - name: Deploy to site directory (non-dry-run)
      if: github.event.inputs.dry_run == 'false'
      id: deploy
      run: "echo \"\U0001F4E4 Deploying to site directory...\"\n\nmkdir -p site/cognitive_app\n\
        cp -r cognitive_app/dist/* site/cognitive_app/\n\n# Count assets\nASSET_COUNT=$(find\
        \ site/cognitive_app -type f | wc -l)\necho \"asset_count=$ASSET_COUNT\" >>\
        \ $GITHUB_OUTPUT\necho \"status=success\" >> $GITHUB_OUTPUT\n\necho \"\u2713\
        \ Deployed $ASSET_COUNT files to site/cognitive_app/\"\necho \"\"\n\n# List\
        \ deployed files\necho \"Deployed files:\"\nls -lah site/cognitive_app/ |\
        \ head -25\n"
    - name: Skip deploy (dry-run)
      if: github.event.inputs.dry_run == 'true'
      id: deploy-dryrun
      run: "echo \"\u23ED\uFE0F  DRY RUN - Skipping deployment\"\necho \"asset_count=0\"\
        \ >> $GITHUB_OUTPUT\necho \"status=dry_run\" >> $GITHUB_OUTPUT\necho \"\"\n\
        echo \"Build artifacts are available at:\"\nls -lah cognitive_app/dist/\n"
    - name: Record asset manifest for verification
      if: github.event.inputs.dry_run == 'false'
      working-directory: site/cognitive_app
      run: "echo \"\U0001F4CB Verifying deployed assets...\"\n\n# Create index of\
        \ deployed files\ncat > ../cognitive_app_deployment_manifest.txt << 'EOF'\n\
        DEPLOYMENT MANIFEST\n====================\nEOF\n\nfind . -type f | sort >>\
        \ ../cognitive_app_deployment_manifest.txt\n\necho \"\u2713 Deployment manifest\
        \ created\"\n"
    - name: Upload verifier artifact for deploy job
      if: github.event.inputs.dry_run == 'false'
      uses: actions/upload-artifact@v5
      with:
        name: cognitive-app-verifier
        path: 'scripts/ci/cognitive_app_asset_manifest_verifier.py

          cognitive_app/dist/manifest.json

          '
        retention-days: 1
    - name: Verify cognitive app deployment
      id: verify
      if: github.event.inputs.dry_run == 'false'
      run: "echo \"\u2705 Verifying deployment...\"\n\npython scripts/ci/verify_cognitive_app_deployment.py\
        \ \\\n  --url \"https://aries-serpent.github.io/_codex_/cognitive_app/\"\n\
        \nif [ $? -eq 0 ]; then\n  echo \"result=success\" >> $GITHUB_OUTPUT\nelse\n\
        \  echo \"result=verification_failed\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Upload artifact
      if: github.event.inputs.dry_run == 'false'
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
      with:
        path: site/
    - name: Record deployment completion
      if: always()
      env:
        DEPLOY_STATUS: ${{ steps.deploy.outputs.status || steps.deploy-dryrun.outputs.status || 'unknown' }}
        TARGET_VERSION: ${{ steps.resolve_version.outputs.target_version }}
        DEPLOY_REASON: ${{ github.event.inputs.reason }}
      run: |
        STATUS="${DEPLOY_STATUS}"

        python scripts/ci/deployment_history_tracker.py record           --type manual           --status "$STATUS"           --url "https://aries-serpent.github.io/_codex_/cognitive_app/"           --version "$TARGET_VERSION"           --reason "$DEPLOY_REASON"
    - name: Summary
      if: always()
      env:
        TARGET_VERSION: ${{ steps.resolve_version.outputs.target_version }}
        DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        CACHE_BUSTING: ${{ github.event.inputs.cache_busting }}
        DEPLOY_STATUS: ${{ steps.deploy.outputs.status || steps.deploy-dryrun.outputs.status || 'unknown' }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        echo "## 📊 Manual Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Version | ${TARGET_VERSION} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Type | Manual |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Mode | $([[ "${DRY_RUN_INPUT}" == "true" ]] && echo "Dry Run" || echo "Live Deployment") |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Force Rebuild | ${FORCE_REBUILD} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Cache Busting | ${CACHE_BUSTING} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Status | ${DEPLOY_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "View full logs: [Action Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    name: Deploy to GitHub Pages
    if: github.event.inputs.dry_run == 'false'
    needs: build-and-deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
    - name: Download verifier artifact
      uses: actions/download-artifact@v5
      with:
        name: cognitive-app-verifier
    - name: Verify deployed assets
      id: post_deploy_verify
      env:
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        echo "🔍 Post-deployment verification..."
        echo "Page URL: ${PAGE_URL}"

        python scripts/ci/cognitive_app_asset_manifest_verifier.py           --url "${PAGE_URL%/}/cognitive_app/"

        if [ $? -eq 0 ]; then
          echo "✅ Deployment verified"
        else
          echo "⚠️ Asset hash mismatch (may be CDN propagation delay)"
        fi
    - name: Final status
      env:
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        echo "## ✅ Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Cognitive App deployed to: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Verify at: [\`${PAGE_URL}cognitive_app/\`](${PAGE_URL}cognitive_app/)" >> "$GITHUB_STEP_SUMMARY"
