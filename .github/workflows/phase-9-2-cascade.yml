name: Phase 9.2 Self-Healing Cascade

# Triggers for cascade activation
on:
  # CI Failure Detection: Triggered by workflow failures
  workflow_run:
    workflows:
      - "CI"
      - "Tests"
      - "Linting"
      - "Security"
    types:
      - "completed"
  
  # Manual Trigger: PR comment with @copilot heal
  issue_comment:
    types:
      - "created"
  
  # Scheduled Validation: Daily cascade health check
  schedule:
    - cron: "0 2 * * *"  # 2 AM UTC daily

env:
  PYTHON_VERSION: "3.11"
  CODEX_WORKSPACE: ".codex"

permissions:
  contents: write           # Commit fixes to branch
  pull-requests: write      # Post PR comments
  workflows: read           # Read workflow runs
  actions: read            # Read CI logs
  statuses: read           # Read commit status

jobs:
  # ========================================================================
  # PHASE 9.2.1: Detect & Classify
  # ========================================================================
  
  detect-and-classify:
    name: Detect & Classify CI Failures
    runs-on: ubuntu-latest
    outputs:
      pattern_id: ${{ steps.classify.outputs.pattern_id }}
      pattern_name: ${{ steps.classify.outputs.pattern_name }}
      confidence: ${{ steps.classify.outputs.confidence }}
      agent: ${{ steps.classify.outputs.agent }}
      should_fix: ${{ steps.classify.outputs.should_fix }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff analysis

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyyaml requests

      - name: Extract Trigger Context
        id: trigger
        run: |
          echo "trigger_type=${{ github.event_name }}" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "failure_context=workflow_failure" >> $GITHUB_OUTPUT
            echo "pr_number=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            if [[ "${{ github.event.comment.body }}" =~ "@copilot heal"|"@copilot fix ci" ]]; then
              echo "failure_context=comment_trigger" >> $GITHUB_OUTPUT
              echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "failure_context=scheduled" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Failure Logs
        id: logs
        run: |
          python scripts/ci/phase_9_2_cascade_orchestrator.py \
            --fetch-logs \
            --pr-number "${{ steps.trigger.outputs.pr_number }}" \
            --output /tmp/failure-logs.json
          
          if [ -f /tmp/failure-logs.json ]; then
            echo "logs_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Classify Failure Pattern
        id: classify
        if: steps.logs.outputs.logs_available == 'true'
        run: |
          python scripts/ci/phase_9_2_pattern_router.py \
            --log-file /tmp/failure-logs.json \
            --config ".codex/phase_9_2_config.yaml" \
            --json > /tmp/routing_decision.json
          
          # Extract routing decision
          PATTERN=$(jq -r '.pattern_id' /tmp/routing_decision.json)
          CONFIDENCE=$(jq -r '.confidence' /tmp/routing_decision.json)
          AGENT=$(jq -r '.agent' /tmp/routing_decision.json)
          STATUS=$(jq -r '.status' /tmp/routing_decision.json)
          
          echo "pattern_id=$PATTERN" >> $GITHUB_OUTPUT
          echo "confidence=$CONFIDENCE" >> $GITHUB_OUTPUT
          echo "agent=$AGENT" >> $GITHUB_OUTPUT
          
          # Determine if should fix (confidence >= threshold)
          if [ "$STATUS" = "route" ] || [ "$STATUS" = "route_with_notification" ]; then
            echo "should_fix=true" >> $GITHUB_OUTPUT
          else
            echo "should_fix=false" >> $GITHUB_OUTPUT
          fi

      - name: Log Classification Decision
        if: always()
        run: |
          python scripts/ci/phase_9_1_decision_logger.py execute \
            --agent self-healing-orchestrator-agent \
            --decision-type pattern_classification \
            --context "Pattern: ${{ steps.classify.outputs.pattern_id }}" \
            --confidence "${{ steps.classify.outputs.confidence }}" \
            --outcome "SUCCESS"

  # ========================================================================
  # PHASE 9.2.2: Apply Auto-Fixes
  # ========================================================================
  
  apply-autofix:
    name: Apply Auto-Fix
    needs: detect-and-classify
    if: needs.detect-and-classify.outputs.should_fix == 'true'
    runs-on: ubuntu-latest
    outputs:
      fix_status: ${{ steps.fix.outputs.status }}
      fixed_files: ${{ steps.fix.outputs.fixed_files }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyyaml ruff pytest requests

      - name: Apply Auto-Fix (Pattern ${{ needs.detect-and-classify.outputs.pattern_id }})
        id: fix
        run: |
          python scripts/ci/auto_fix_common_issues.py \
            --pattern "${{ needs.detect-and-classify.outputs.pattern_id }}" \
            --dry-run=false \
            --json > /tmp/fix_result.json
          
          # Extract fix results
          STATUS=$(jq -r '.status' /tmp/fix_result.json)
          FIXED=$(jq -r '.files_fixed | length' /tmp/fix_result.json)
          
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "fixed_files=$FIXED" >> $GITHUB_OUTPUT
          
          # Save for verification
          cp /tmp/fix_result.json /tmp/fix_result_backup.json

      - name: Verify Fix Correctness
        id: verify
        if: steps.fix.outputs.status == 'success'
        run: |
          echo "Running verification suite..."
          
          # Run targeted tests
          pytest -xvs tests/ --timeout=60 --tb=short || true
          
          # Run linting checks
          ruff check src/ || true
          
          # Log verification result
          VERIFY_RESULT=$?
          
          if [ $VERIFY_RESULT -eq 0 ]; then
            echo "verification_passed=true" >> $GITHUB_OUTPUT
          else
            echo "verification_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit Fix
        id: commit
        if: steps.verify.outputs.verification_passed == 'true'
        run: |
          git config user.name "Phase 9.2 Cascade Bot"
          git config user.email "phase-9-2@github.actions"
          
          # Stage changes
          git add -A
          
          # Commit with metadata
          git commit -m "Phase 9.2 Auto-Fix: ${{ needs.detect-and-classify.outputs.pattern_id }}
          
          Pattern: ${{ needs.detect-and-classify.outputs.pattern_name }}
          Confidence: ${{ needs.detect-and-classify.outputs.confidence }}
          Fixed Files: ${{ steps.fix.outputs.fixed_files }}
          
          Decision ID: phase-9-2-fix-$(date +%s)
          Agent: self-healing-orchestrator-agent" || echo "No changes to commit"
          
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Push Changes
        if: steps.commit.outputs.sha != ''
        run: |
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  # ========================================================================
  # PHASE 9.2.3: Validate & Report
  # ========================================================================
  
  validate-and-report:
    name: Validate & Report Results
    needs: [detect-and-classify, apply-autofix]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate Report
        id: report
        run: |
          REPORT_FILE=".codex/phase_9_2_cascade_report_$(date +%Y%m%d_%H%M%S).md"
          
          cat > "$REPORT_FILE" << 'EOF'
          # Phase 9.2 Cascade Report
          
          ## Summary
          - **Pattern**: ${{ needs.detect-and-classify.outputs.pattern_id }} (${{ needs.detect-and-classify.outputs.pattern_name }})
          - **Confidence**: ${{ needs.detect-and-classify.outputs.confidence }}
          - **Fix Status**: ${{ needs.apply-autofix.outputs.fix_status }}
          - **Timestamp**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          ## Details
          - **Detected Patterns**: 
            - ID: ${{ needs.detect-and-classify.outputs.pattern_id }}
            - Agent: ${{ needs.detect-and-classify.outputs.agent }}
          
          ## Actions Taken
          - Fixed Files: ${{ needs.apply-autofix.outputs.fixed_files }}
          - Commit: ${{ needs.apply-autofix.outputs.commit_sha }}
          
          ## Next Steps
          - Verify CI passes with fixes
          - If verification fails, escalate to human review
          - Update Phase 9.1 decision log
          EOF
          
          echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT

      - name: Post PR Comment (If Fix Applied)
        if: needs.apply-autofix.outputs.fix_status == 'success' && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔄 Phase 9.2 Auto-Fix Applied

**Pattern**: ${{ needs.detect-and-classify.outputs.pattern_id }} — ${{ needs.detect-and-classify.outputs.pattern_name }}
**Confidence**: ${{ needs.detect-and-classify.outputs.confidence }}
**Status**: ✅ Fix Applied

### Fixed Issues
- Fixed ${{ needs.apply-autofix.outputs.fixed_files }} file(s)
- Commit: [\`${{ needs.apply-autofix.outputs.commit_sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.apply-autofix.outputs.commit_sha }})

### Next Steps
- CI will validate the fix automatically
- If all checks pass, the fix is complete
- If issues remain, this will escalate to human review

---
*Automated by Phase 9.2 Self-Healing Cascade*`
            });

      - name: Post PR Comment (If Escalation)
        if: needs.apply-autofix.outputs.fix_status != 'success' && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ⚠️ Phase 9.2 Escalation

**Pattern**: ${{ needs.detect-and-classify.outputs.pattern_id }} — ${{ needs.detect-and-classify.outputs.pattern_name }}
**Confidence**: ${{ needs.detect-and-classify.outputs.confidence }}
**Status**: 🚨 Requires Human Review

The auto-fix could not resolve this issue. Please review the failure logs and determine the appropriate fix.

### Debug Info
- Pattern ID: ${{ needs.detect-and-classify.outputs.pattern_id }}
- Agent: ${{ needs.detect-and-classify.outputs.agent }}
- Confidence: ${{ needs.detect-and-classify.outputs.confidence }}

---
*Automated by Phase 9.2 Self-Healing Cascade*`
            });

      - name: Update Metrics
        if: always()
        run: |
          python scripts/ci/phase_9_2_cascade_orchestrator.py \
            --update-metrics \
            --pattern "${{ needs.detect-and-classify.outputs.pattern_id }}" \
            --status "${{ needs.apply-autofix.outputs.fix_status }}" \
            --confidence "${{ needs.detect-and-classify.outputs.confidence }}"

      - name: Log Final Decision
        if: always()
        run: |
          python scripts/ci/phase_9_1_decision_logger.py execute \
            --agent self-healing-orchestrator-agent \
            --decision-type cascade_completion \
            --context "Pattern: ${{ needs.detect-and-classify.outputs.pattern_id }}, Status: ${{ needs.apply-autofix.outputs.fix_status }}" \
            --confidence "${{ needs.detect-and-classify.outputs.confidence }}" \
            --outcome "SUCCESS"

  # ========================================================================
  # PHASE 9.2.4: Escalation (On-Demand)
  # ========================================================================
  
  escalate-if-needed:
    name: Escalate to Human Review
    needs: [detect-and-classify, apply-autofix]
    if: |
      always() && 
      (needs.apply-autofix.outputs.fix_status == 'failed' || 
       needs.detect-and-classify.outputs.should_fix == 'false')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create Escalation Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Phase 9.2 Escalation: Manual Review Required",
              body: `## Escalation Details

Phase 9.2 Self-Healing Cascade could not automatically fix this issue.

**Pattern**: ${{ needs.detect-and-classify.outputs.pattern_id }}
**Confidence**: ${{ needs.detect-and-classify.outputs.confidence }}
**Status**: ESCALATED

### Required Actions
1. Review the CI failure logs
2. Understand the root cause
3. Apply appropriate fix manually or via specialist agent
4. Document the solution for future pattern learning

### Reference
- Pattern Router Decision: [View](.codex/phase_9_2_decisions.json)
- Failure Logs: [CI Logs](#)
- Phase 9.2 Docs: [Specification](.codex/PHASE_9_2_AUTOFIX_PATTERNS.md)

---
*Created by Phase 9.2 Self-Healing Cascade*`,
              labels: ["phase-9-2", "escalation", "requires-review"]
            });

      - name: Notify Phase 9.3 Router
        if: failure()
        run: |
          echo "Notifying Phase 9.3 Semantic Router for escalation..."
          # This would trigger the Phase 9.3 semantic routing system
          # For now, just log the escalation
          echo "Phase 9.2 Escalation: ${{ needs.detect-and-classify.outputs.pattern_id }}" >> .codex/phase_9_2_escalations.log
