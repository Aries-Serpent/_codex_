name: Consistency Checks
on:
  push:
    branches:
    - main
    - 0D_base_
    paths:
    - docs/**
    - '*.md'
    - .github/scripts/check-cross-references.py
    - .markdownlintrc
    - .github/workflows/consistency-checks.yml
  pull_request:
    branches:
    - main
    - 0D_base_
    paths:
    - docs/**
    - '*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
    - name: Install markdownlint
      run: npm install -g markdownlint-cli@latest
    - name: Run markdownlint
      id: markdownlint
      run: "echo \"## Markdownlint Report\" >> $GITHUB_STEP_SUMMARY\n\nif markdownlint\
        \ docs/*.md ./*.md 2>&1 | tee /tmp/md-lint-output.txt; then\n  echo \"✅ All\
        \ Markdown files pass linting\" >> $GITHUB_STEP_SUMMARY\n  echo \"status=success\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"### ❌ Issues Found\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"\\`\\`\\`\" >> $GITHUB_STEP_SUMMARY\n  cat /tmp/md-lint-output.txt\
        \ >> $GITHUB_STEP_SUMMARY\n  echo \"\\`\\`\\`\" >> $GITHUB_STEP_SUMMARY\n\
        \  echo \"status=failure\" >> $GITHUB_OUTPUT\n  exit 1\nfi\n"
      continue-on-error: true
    - name: Comment on PR (if markdown issues)
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: "const fs = require('fs');\nconst output = fs.readFileSync('/tmp/md-lint-output.txt',\
          \ 'utf8');\n\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: `## ⚠️\
          \ Markdown Linting Issues\\n\\n\\`\\`\\`\\n${output}\\`\\`\\`\\n\\nPlease\
          \ fix the linting errors. You can run \\`markdownlint --fix docs/*.md *.md\\\
          ` locally to auto-fix many issues.`\n});\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  cross-references:
    name: Cross-Reference Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Run cross-reference checker
      id: crossref
      run: "python3 .github/scripts/check-cross-references.py \\\n  --repo-root=\"\
        .\" \\\n  --format=text \\\n  --github-annotations \\\n  --fail-on-errors\
        \ 2>&1 | tee /tmp/crossref-report.txt || true\n"
    - name: Generate report
      if: always()
      run: 'echo "## Cross-Reference Validation Report" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        cat /tmp/crossref-report.txt >> $GITHUB_STEP_SUMMARY

        '
    - name: Upload report as artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: cross-reference-report
        path: /tmp/crossref-report.txt
        retention-days: 30
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  heading-hierarchy:
    name: Heading Hierarchy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Validate heading hierarchy
      id: heading
      run: "python3 - << 'EOF'\nimport re\nfrom pathlib import Path\n\ndef validate_heading_hierarchy(file_path):\n\
        \    \"\"\"Validate that headings follow proper hierarchy (no skips).\"\"\"\
        \n    issues = []\n    last_level = 0\n\n    with open(file_path, 'r', encoding='utf-8')\
        \ as f:\n        lines = f.readlines()\n\n    for line_num, line in enumerate(lines,\
        \ 1):\n        match = re.match(r'^(#+)\\s+(.+)$', line.strip())\n       \
        \ if match:\n            level = len(match.group(1))\n\n  # Check\
        \ if first heading is H1\n            if last_level == 0 and level != 1:\n\
        \                issues.append((line_num, level, f\"First heading should be\
        \ H1, got H{level}\"))\n\n  # Check for hierarchy jumps (e.g., H1\
        \ to H3 without H2)\n            if last_level > 0 and level > last_level\
        \ + 1:\n                issues.append((line_num, level, f\"Hierarchy jump\
        \ from H{last_level} to H{level}\"))\n\n            last_level = level\n\n\
        \    return issues\n\nall_issues = {}\nmd_files = list(Path('docs').rglob('*.md'))\
        \ + list(Path('.').glob('*.md'))\n\nfor md_file in sorted(set(md_files)):\n\
        \    if any(skip in str(md_file) for skip in ['node_modules', '.git', '.venv']):\n\
        \        continue\n\n    issues = validate_heading_hierarchy(md_file)\n  \
        \  if issues:\n        all_issues[md_file] = issues\n\nif all_issues:\n  \
        \  print(\"## ⚠️ Heading Hierarchy Issues Found\\n\")\n    for file_path,\
        \ issues in all_issues.items():\n        print(f\"\\n### {file_path}\")\n\
        \        for line, level, message in issues:\n            print(f\"  Line\
        \ {line}: {message}\")\n    exit(1)\nelse:\n    print(\"## ✅ All heading hierarchies\
        \ are valid!\")\n    exit(0)\nEOF\n"
      continue-on-error: true
    - name: Report heading results
      if: always()
      run: "echo \"## Heading Hierarchy Validation\" >> $GITHUB_STEP_SUMMARY\nif [\
        \ ${{ steps.heading.outcome }} = 'success' ]; then\n  echo \"✅ All heading\
        \ hierarchies are valid\" >> $GITHUB_STEP_SUMMARY\nelse\n  echo \"⚠️ Some\
        \ heading hierarchy issues found\" >> $GITHUB_STEP_SUMMARY\nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  consistency-summary:
    name: Consistency Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - markdownlint
    - cross-references
    - heading-hierarchy
    if: always()
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Generate consistency report
      run: 'cat << ''EOF'' > /tmp/consistency-summary.md

        # 📊 Consistency Checks Summary


        | Check | Status |

        |-------|--------|

        | Markdownlint | ${{ needs.markdownlint.result == ''success'' && ''✅'' ||
        ''⚠️'' }} |

        | Cross-References | ${{ needs.cross-references.result == ''success'' && ''✅''
        || ''⚠️'' }} |

        | Heading Hierarchy | ${{ needs.heading-hierarchy.result == ''success'' &&
        ''✅'' || ''⚠️'' }} |


        **Overall Status**: ${{ (needs.markdownlint.result == ''success'' && needs.cross-references.result
        == ''success'' && needs.heading-hierarchy.result == ''success'') && ''✅ PASSED''
        || ''⚠️ REVIEW NEEDED'' }}

        EOF


        cat /tmp/consistency-summary.md >> $GITHUB_STEP_SUMMARY

        '
    - name: Fail if any check failed
      if: 'needs.markdownlint.result == ''failure'' ||

        needs.cross-references.result == ''failure'' ||

        needs.heading-hierarchy.result == ''failure''

        '
      run: 'echo "❌ Some consistency checks failed"

        exit 1

        '
    - name: Success
      if: 'needs.markdownlint.result == ''success'' &&

        needs.cross-references.result == ''success'' &&

        needs.heading-hierarchy.result == ''success''

        '
      run: 'echo "✅ All consistency checks passed!"

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
