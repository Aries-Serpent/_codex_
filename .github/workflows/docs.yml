name: docs-build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skip_optional: [ "true" ]
        strict: [ "false" ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install minimal tooling
        run: |
          python -m pip install --upgrade pip
          pip install pdoc jinja2 pyyaml
      
      - name: Build docs (matrix)
        env:
          SKIP_OPTIONAL: ${{ matrix.skip_optional }}
          FAIL_ON_MISSING: ${{ matrix.strict }}
        run: |
          bash scripts/docs_build.sh
      
      - name: Upload docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.skip_optional }}-strict-${{ matrix.strict }}
          path: |
            artifacts/docs/**
            artifacts/docs_manifest.sha

  strict-on-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: |
          python -m pip install --upgrade pip
          pip install pdoc jinja2 pyyaml
          SKIP_OPTIONAL=false FAIL_ON_MISSING=true bash scripts/docs_build.sh
      
      - uses: actions/upload-artifact@v4
        with:
          name: docs-strict-main
          path: |
            artifacts/docs/**
            artifacts/docs_manifest.sha
