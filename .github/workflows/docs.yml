name: API Documentation Build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/build_api_docs.py'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-api-docs:
    name: Build API docs (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Core modules only - non-strict (graceful skip of missing optional modules)
          - mode: core-only
            python-version: '3.10'
            extras: ''
            fail-on-missing: ''
            description: 'Core modules (codex.cli, codex.logging)'
          
          # ML modules - strict (fail if any modules missing)
          - mode: ml-extras
            python-version: '3.11'
            extras: '[ml]'
            fail-on-missing: '--fail-on-missing'
            description: 'Core + ML modules (requires ML dependencies)'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdoc3

      - name: Install codex package${{ matrix.extras }}
        run: |
          if [ -n "${{ matrix.extras }}" ]; then
            pip install -e .${{ matrix.extras }}
          else
            pip install -e .
          fi

      - name: Build API documentation
        run: |
          python tools/build_api_docs.py \
            --output-dir artifacts/docs/api \
            --verbose \
            ${{ matrix.fail-on-missing }}

      - name: Upload API docs artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-${{ matrix.mode }}
          path: artifacts/docs/api/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "### API Documentation Build (${{ matrix.mode }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Description**: ${{ matrix.description }}" >> $GITHUB_STEP_SUMMARY
          echo "**Python**: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Extras**: ${{ matrix.extras || 'none' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Strict mode**: ${{ matrix.fail-on-missing && 'enabled' || 'disabled' }}" >> $GITHUB_STEP_SUMMARY
