name: codeql-fix-verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  enforce-codeql-fix-discipline:
    runs-on: ubuntu-latest
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'codeql')
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate repro-test presence for CodeQL PRs
        id: test-discovery
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Changed files:"
          echo "$CHANGED"

          TEST_FILES="$(echo "$CHANGED" | grep -E '(^tests/|_test\.py$|\.spec\.)' || true)"

          if [ -z "$TEST_FILES" ]; then
            echo "::error::CodeQL-labeled PR must include at least one repro/validation test."
            exit 1
          fi

          {
            echo "test_files<<EOF"
            echo "$TEST_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies and pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pytest

      - name: Verify pytest presence
        shell: bash
        run: |
          set -euo pipefail
          if ! python -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is required for CodeQL validation but was not found."
            exit 1
          fi

      - name: Run targeted repro tests with hardened runtime
        shell: bash
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail

          # Extra safety: run only under pull_request context (no privileged token escalation paths)
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::This workflow is restricted to pull_request context."
            exit 1
          fi

          echo "${{ steps.test-discovery.outputs.test_files }}" | while IFS= read -r t; do
            [ -z "$t" ] && continue
            if [ -f "$t" ]; then
              echo "Running pytest for $t (timeout 120s)"
              timeout 120s pytest -q "$t"
            else
              echo "::warning::Discovered test path '$t' not present in checkout; skipping."
            fi
          done
