name: Performance Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'src/codex/ast/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest-benchmark
      
      - name: Run benchmarks
        run: |
          pytest benchmarks/ \
            --benchmark-only \
            --benchmark-json=results.json \
            --benchmark-verbose
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results.json
          retention-days: 90
      
      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          echo "📊 Benchmark results:"
          python -c "
          import json
          with open('results.json') as f:
              data = json.load(f)
          for benchmark in data['benchmarks']:
              name = benchmark['name']
              mean = benchmark['stats']['mean']
              stddev = benchmark['stats']['stddev']
              print(f'{name}: {mean:.6f}s ± {stddev:.6f}s')
          "
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('results.json', 'utf8'));
            
            let comment = '## 📊 Performance Benchmark Results\n\n';
            comment += '| Benchmark | Mean Time | Std Dev |\n';
            comment += '|-----------|-----------|----------|\n';
            
            for (const bench of results.benchmarks) {
              const name = bench.name;
              const mean = bench.stats.mean.toFixed(6);
              const stddev = bench.stats.stddev.toFixed(6);
              comment += `| ${name} | ${mean}s | ±${stddev}s |\n`;
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
