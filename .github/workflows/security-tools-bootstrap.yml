name: Bootstrap Security Tools from Variables
on:
  workflow_dispatch:
    inputs:
      deploy_location:
        description: Where to deploy tools
        required: true
        type: choice
        options:
        - local-test
        - repository-commit
        - artifact-only
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  bootstrap-tools:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow security-tools-bootstrap
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: ephemeral
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
