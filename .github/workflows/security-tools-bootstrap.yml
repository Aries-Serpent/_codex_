name: Bootstrap Security Tools from Variables

on:
  workflow_dispatch:
    inputs:
      deploy_location:
        description: 'Where to deploy tools'
        required: true
        type: choice
        options:
          - local-test
          - repository-commit
          - artifact-only

permissions:
  contents: write

jobs:
  bootstrap-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'ephemeral'
