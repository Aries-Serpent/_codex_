name: Bootstrap Security Tools from Variables

on:
  workflow_dispatch:
    inputs:
      deploy_location:
        description: 'Where to deploy tools'
        required: true
        type: choice
        options:
          - local-test
          - repository-commit
          - artifact-only

permissions:
  contents: write


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow security-tools-bootstrap 2>/dev/null || echo "Cache health: check skipped"
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'ephemeral'
