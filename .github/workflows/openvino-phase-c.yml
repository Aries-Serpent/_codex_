name: "OpenVINO Phase C \u2014 Intel Arc iGPU Smoke Tests"
on:
  workflow_dispatch: null
  push:
    branches:
    - 0D_base_
    - main
    paths:
    - src/codex_ml/backends/openvino_backend.py
    - tests/smoke/test_openvino_backend_smoke.py
  pull_request:
    paths:
    - src/codex_ml/backends/openvino_backend.py
    - tests/smoke/test_openvino_backend_smoke.py
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  openvino-cpu-guard:
    name: "OpenVINO smoke (CPU-only runner \u2014 Phase B)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        extras: dev
    - name: Run Phase B smoke tests (no GPU required)
      run: 'python -m pytest tests/smoke/test_openvino_backend_smoke.py \

        -v --tb=short

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  openvino-arc-gpu:
    name: "OpenVINO smoke (Intel Arc iGPU \u2014 Phase C)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        extras: dev
    - name: Install OpenVINO runtime (if available)
      run: 'pip install openvino --disable-pip-version-check --no-warn-script-location
        --quiet || echo "openvino not available on this runner"

        '
    - name: Run Phase C smoke tests (skip if GPU absent)
      run: "python -m pytest tests/smoke/test_openvino_backend_smoke.py::TestOpenVINOPhaseC\
        \ \\\n  -v --tb=short \\\n  -rs  # show skip reasons\necho \"Phase C result:\
        \ $?\"\n"
    - name: Report GPU detection status
      if: always()
      run: "python -c \"\ntry:\n    from codex_ml.backends.openvino_backend import\
        \ is_available, DEVICES\n    print(f'OpenVINO devices: {DEVICES}')\n    print(f'GPU\
        \ available: {is_available(\\\"GPU\\\")}')\nexcept Exception as e:\n    print(f'OpenVINO\
        \ unavailable: {e}')\n\"\n"
    timeout-minutes: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: openvino-arc-gpu
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: OpenVINO Phase C
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
