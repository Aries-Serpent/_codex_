name: Secrets Baseline Check

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  secrets-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify .secrets.baseline present
        run: |
          if [ ! -f ".secrets.baseline" ]; then
            echo "::error title=Missing Secrets Baseline::.secrets.baseline not found"
            exit 1
          fi
          echo "[OK] .secrets.baseline present"
