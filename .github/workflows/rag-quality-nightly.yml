name: RAG Quality Nightly Gate
'on':
  workflow_dispatch: null
  schedule:
  - cron: 30 3 * * *
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  issues: write
jobs:
  freshness-check:
    name: RAG index freshness check (D4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - run: pip install -q pyyaml
    - name: Verify freshness SLA
      run: python scripts/rag/rag_rebuild_audit.py --check freshness
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
  quality-gate:
    name: Retrieval quality gate recall>=0.70 MRR>=0.60 (D4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - run: pip install -q -r requirements-dev.txt
    - name: Run retrieval benchmark against thresholds
      run: python scripts/rag/rag_rebuild_audit.py --check quality
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
  rebuild-audit:
    name: Index rebuild audit log (D4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - run: pip install -q pyyaml
    - name: Log rebuild audit entry
      run: python scripts/rag/rag_rebuild_audit.py --check audit
    - name: Upload audit log
      uses: actions/upload-artifact@v5
      with:
        path: reports/rag/rebuild_audit_latest.json
        name: rag-audit-${{ github.run_id }}
  gate-summary:
    name: D4 Gate Summary
    needs:
    - freshness-check
    - quality-gate
    - rebuild-audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Evaluate D4 exit criteria
      run: "python3 - <<'PYEOF'\nimport json\nfrom datetime import datetime, timezone\n\
        \nresults = {\n    \"freshness\": \"${{ needs.freshness-check.result }}\"\
        ,\n    \"quality\":   \"${{ needs.quality-gate.result }}\",\n    \"audit\"\
        :     \"${{ needs.rebuild-audit.result }}\",\n}\npassed = [k for k, v in results.items()\
        \ if v == \"success\"]\nfailed = [k for k, v in results.items() if v != \"\
        success\"]\nprint(json.dumps({\"generated_at\": datetime.now(timezone.utc).strftime(\"\
        %Y-%m-%dT%H:%M:%SZ\"),\n                  \"results\": results, \"passed\"\
        : len(passed), \"failed\": len(failed)}, indent=2))\nif not failed:\n    print(\"\
        ::notice::\u2705 D4 RAG Quality nightly gate passed\")\nelse:\n    print(f\"\
        ::warning::D4 RAG gate: {failed} failed\")\nPYEOF\n"
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
