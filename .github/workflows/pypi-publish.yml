# Prepared, inactive until maintainer commits/merges/pushes to main.
name: Publish Python Package to PyPI
'on':
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      package:
        description: Distribution to publish
        required: true
        type: choice
        options:
          - all
          - codex-ml
          - codex-cognitive-sdk
          - codex-contracts
          - codex-ml-evaluation
          - codex-ml-lora
          - codex-ml-telemetry
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.distribution.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SELECTED_DISTRIBUTION: >-
        ${{
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            path: .
            import: codex_ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            path: packages/cognitive_sdk
            import: codex_cognitive_sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            path: packages/contracts
            import: codex_contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            path: packages/evaluation
            import: codex_evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            path: packages/lora
            import: codex_lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            path: packages/telemetry
            import: codex_ml_telemetry
            release_tag_prefix: codex-ml-telemetry-v
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.SELECTED_DISTRIBUTION == 'true'
        with:
          persist-credentials: false

      - name: CacheManager health check
        if: env.SELECTED_DISTRIBUTION == 'true'
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow pypi-publish 2>/dev/null || echo "Cache health: check skipped"

      - name: Set up Python 3.12 with tiered cache
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.12.13
          cache-tier: common

      - name: Install build dependencies
        if: env.SELECTED_DISTRIBUTION == 'true'
        run: |
          python -m pip install --require-hashes -r requirements/lock-release.txt

      - name: Build package
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
          DISTRIBUTION_PATH: ${{ matrix.distribution.path }}
        run: |
          python -m build --no-isolation "$DISTRIBUTION_PATH" --outdir "dist/$DISTRIBUTION_NAME"

      - name: Validate release artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          python -m scripts.release.publishing_assurance validate-dist \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir "dist/$DISTRIBUTION_NAME"

      - name: Record retained build identity
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
          TARGET_ORIGIN: ${{ github.event_name == 'release' && 'pypi' || github.event.inputs.environment }}
        run: |
          python -m scripts.release.publishing_assurance record-build \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir "dist/$DISTRIBUTION_NAME" \
            --source-sha "$GITHUB_SHA" --origin "$TARGET_ORIGIN"

      - name: Install built wheel in isolated virtualenv
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
          IMPORT_NAME: ${{ matrix.distribution.import }}
          TARGET_ORIGIN: ${{ github.event_name == 'release' && 'pypi' || github.event.inputs.environment }}
        run: |
          python -m scripts.release.publishing_assurance install-artifacts \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir "dist/$DISTRIBUTION_NAME" \
            --work-dir "$RUNNER_TEMP/publishing-assurance/$DISTRIBUTION_NAME" \
            --source-sha "$GITHUB_SHA" --origin "$TARGET_ORIGIN" \
            --build-requirements requirements/lock-release.txt \
            --import-name "$IMPORT_NAME"

      - name: Record validated artifact checksums
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          cd "dist/$DISTRIBUTION_NAME"
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          sha256sum BUILD_IDENTITY.json >> SHA256SUMS

      - name: Upload artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-package-${{ matrix.distribution.name }}
          path: dist/${{ matrix.distribution.name }}/

  attest:
    name: Attest ${{ matrix.distribution.name }}
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            release_tag_prefix: codex-ml-telemetry-v
    env:
      SELECTED_DISTRIBUTION: >-
        ${{
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.SELECTED_DISTRIBUTION == 'true'
        with:
          persist-credentials: false

      - name: Download artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-${{ matrix.distribution.name }}
          path: dist/

      - name: Generate build provenance
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/attest-build-provenance@fbd636b8c13254d66ee710f814d9ca1d2d5b2f82
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  validate:
    name: Validate ${{ matrix.distribution.name }}
    needs:
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            release_tag_prefix: codex-ml-telemetry-v
    env:
      SELECTED_DISTRIBUTION: >-
        ${{
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.SELECTED_DISTRIBUTION == 'true'
        with:
          persist-credentials: false

      - name: Download artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-${{ matrix.distribution.name }}
          path: dist/

      - name: Validate downloaded artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python -m scripts.release.publishing_assurance validate-dist \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir dist

      - name: Verify release tag matches built version
        if: >-
          env.SELECTED_DISTRIBUTION == 'true' &&
          (github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi'))
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          python -m scripts.release.publishing_assurance validate-tag \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir dist \
            --tag "$RELEASE_TAG"

      - name: Verify artifact provenance
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          python -m scripts.release.publishing_assurance verify-attestation \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir dist \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pypi-publish.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"

  publish-testpypi:
    name: Publish ${{ matrix.distribution.name }} to TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'testpypi'
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            import: codex_ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            import: codex_cognitive_sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            import: codex_contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            import: codex_evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            import: codex_lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            import: codex_ml_telemetry
            release_tag_prefix: codex-ml-telemetry-v
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ matrix.distribution.name }}
    steps:
      - name: Download artifacts
        if: github.event.inputs.package == 'all' || github.event.inputs.package == matrix.distribution.name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist/
          name: python-package-${{ matrix.distribution.name }}
      - name: Verify exact validated artifact checksums
        if: github.event.inputs.package == 'all' || github.event.inputs.package == matrix.distribution.name
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          rm SHA256SUMS BUILD_IDENTITY.json
      - name: Publish to TestPyPI
        if: github.event.inputs.package == 'all' || github.event.inputs.package == matrix.distribution.name
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}

  publish-pypi:
    name: Publish ${{ matrix.distribution.name }} to PyPI
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'pypi' &&
      github.ref_type == 'tag')
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            import: codex_ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            import: codex_cognitive_sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            import: codex_contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            import: codex_evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            import: codex_lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            import: codex_ml_telemetry
            release_tag_prefix: codex-ml-telemetry-v
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.distribution.name }}
    steps:
      - name: Download artifacts
        if: >-
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist/
          name: python-package-${{ matrix.distribution.name }}
      - name: Verify exact validated artifact checksums
        if: >-
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          rm SHA256SUMS BUILD_IDENTITY.json
      - name: Publish to PyPI
        if: >-
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: false
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}

  verify-installation:
    name: Verify ${{ matrix.distribution.name }} (Python 3.12)
    needs:
      - publish-testpypi
      - publish-pypi
    if: >-
      always() && (
      (needs.publish-testpypi.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'testpypi') ||
      (needs.publish-pypi.result == 'success' &&
      (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'pypi' &&
      github.ref_type == 'tag'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET_ORIGIN: ${{ github.event_name == 'release' && 'pypi' || github.event.inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            import: codex_ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            import: codex_cognitive_sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            import: codex_contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            import: codex_evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            import: codex_lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            import: codex_ml_telemetry
            release_tag_prefix: codex-ml-telemetry-v
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: >-
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        with:
          persist-credentials: false

      - name: Set up Python 3.12 with tiered cache
        if: >-
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12.13'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}

      - name: Download retained validated artifacts
        if: >-
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-${{ matrix.distribution.name }}
          path: dist/

      - name: Create isolated verification environment
        if: >-
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python -m venv --clear "$RUNNER_TEMP/verify-${DISTRIBUTION_NAME}"

      - name: Install from TestPyPI
        if: >-
          needs.publish-testpypi.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          python -m scripts.release.publishing_assurance verify-published \
            --distribution "$DISTRIBUTION_NAME" --dist-dir dist \
            --source-sha "$GITHUB_SHA" --origin testpypi \
            --python-path "$RUNNER_TEMP/verify-${DISTRIBUTION_NAME}/bin/python"

      - name: Install from PyPI
        if: >-
          needs.publish-pypi.result == 'success' &&
          ((github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)))
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          python -m scripts.release.publishing_assurance verify-published \
            --distribution "$DISTRIBUTION_NAME" --dist-dir dist \
            --source-sha "$GITHUB_SHA" --origin pypi \
            --python-path "$RUNNER_TEMP/verify-${DISTRIBUTION_NAME}/bin/python"

      - name: Test installed import
        if: >-
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
          IMPORT_NAME: ${{ matrix.distribution.import }}
          ASSURANCE_SCRIPT: ${{ github.workspace }}/scripts/release/publishing_assurance.py
          RETAINED_DIST: ${{ github.workspace }}/dist
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/verify-${DISTRIBUTION_NAME}/bin/python" -I - <<'PY'
          import os
          import runpy
          from pathlib import Path
          assurance = runpy.run_path(os.environ["ASSURANCE_SCRIPT"])
          result = assurance["verify_installed_artifact"](
              os.environ["DISTRIBUTION_NAME"],
              Path(os.environ["RETAINED_DIST"]),
              source_sha=os.environ["GITHUB_SHA"],
              origin=os.environ["TARGET_ORIGIN"],
              import_name=os.environ["IMPORT_NAME"],
          )
          print(result)
          PY
