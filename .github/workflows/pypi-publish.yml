name: Publish Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: 'testpypi'

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishing


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false  # deployment: never cancel in-progress — leaves prod in unknown state
jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow pypi-publish 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python 3.12 with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: testpypi
      url: https://test.pypi.org/p/codex-ml

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: pypi
      url: https://pypi.org/p/codex-ml

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: false
  verify-installation:
    name: Verify Installation (Python 3.12)
    needs: [publish-testpypi, publish-pypi]
    if: always() && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up Python 3.12 with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common

      - name: Install from TestPyPI
        if: needs.publish-testpypi.result == 'success'
        run: |
          pip install --index-url https://test.pypi.org/simple/ \
                      --extra-index-url https://pypi.org/simple/ \
                      codex-ml

      - name: Install from PyPI
        if: needs.publish-pypi.result == 'success'
        run: pip install codex-ml

      - name: Test import
        run: |
          python -c "import codex_ml; print(f'Version: {codex_ml.__version__}')"

      - name: Run basic tests
        run: |
          python -c "from codex_ml import __version__; assert __version__ is not None"
