name: Publish Python Package to PyPI
on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
        - testpypi
        - pypi
        default: testpypi
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow pypi-publish
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Set up Python 3.12 with tiered cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Install build dependencies
      run: 'python -m pip install --upgrade pip

        pip install build twine

        '
    - name: Build package
      run: python -m build
    - name: Check distribution
      run: twine check dist/*
    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        path: dist/
        name: python-package-distributions
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment
      == 'testpypi'
    needs:
    - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: testpypi
      url: https://test.pypi.org/p/codex-ml
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v5
      with:
        path: dist/
        name: python-package-distributions
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        skip-existing: true
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.environment == 'pypi')
    needs:
    - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/codex-ml
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v5
      with:
        path: dist/
        name: python-package-distributions
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}
        skip-existing: false
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 45
  verify-installation:
    name: Verify Installation (Python 3.12)
    needs:
    - publish-testpypi
    - publish-pypi
    if: always() && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result
      == 'success')
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python 3.12 with tiered cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Install from TestPyPI
      if: needs.publish-testpypi.result == 'success'
      run: "pip install --index-url https://test.pypi.org/simple/ \\\n           \
        \ --extra-index-url https://pypi.org/simple/ \\\n            codex-ml\n"
    - name: Install from PyPI
      if: needs.publish-pypi.result == 'success'
      run: pip install codex-ml
    - name: Test import
      run: 'python -c "import codex_ml; print(f''Version: {codex_ml.__version__}'')"

        '
    - name: Run basic tests
      run: 'python -c "from codex_ml import __version__; assert __version__ is not
        None"

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
