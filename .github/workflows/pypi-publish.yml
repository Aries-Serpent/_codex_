name: Publish Python Package to PyPI

'on':
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      package:
        description: Distribution to publish
        required: true
        type: choice
        options:
          - all
          - codex-ml
          - codex-cognitive-sdk
          - codex-contracts
          - codex-ml-evaluation
          - codex-ml-lora
          - codex-ml-telemetry
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.distribution.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SELECTED_DISTRIBUTION: >-
        ${{
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            path: .
            import: codex_ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            path: packages/cognitive_sdk
            import: codex_cognitive_sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            path: packages/contracts
            import: codex_contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            path: packages/evaluation
            import: codex_evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            path: packages/lora
            import: codex_lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            path: packages/telemetry
            import: codex_ml_telemetry
            release_tag_prefix: codex-ml-telemetry-v
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED_DISTRIBUTION == 'true'
        with:
          persist-credentials: false

      - name: CacheManager health check
        if: env.SELECTED_DISTRIBUTION == 'true'
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow pypi-publish 2>/dev/null || echo "Cache health: check skipped"

      - name: Set up Python 3.12 with tiered cache
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.12.13
          cache-tier: common

      - name: Install build dependencies
        if: env.SELECTED_DISTRIBUTION == 'true'
        run: |
          python -m pip install --require-hashes -r requirements/lock-release.txt

      - name: Build package
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
          DISTRIBUTION_PATH: ${{ matrix.distribution.path }}
        run: |
          python -m build --no-isolation "$DISTRIBUTION_PATH" --outdir "dist/$DISTRIBUTION_NAME"

      - name: Validate release artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          python -m scripts.release.publishing_assurance validate-dist \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir "dist/$DISTRIBUTION_NAME"

      - name: Install built wheel in isolated virtualenv
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
          IMPORT_NAME: ${{ matrix.distribution.import }}
        run: |
          python -m scripts.release.publishing_assurance install-wheel \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir "dist/$DISTRIBUTION_NAME" \
            --work-dir "$RUNNER_TEMP/publishing-assurance/$DISTRIBUTION_NAME" \
            --import-name "$IMPORT_NAME"

      - name: Upload artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-package-${{ matrix.distribution.name }}
          path: dist/${{ matrix.distribution.name }}/

  attest:
    name: Attest ${{ matrix.distribution.name }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SELECTED_DISTRIBUTION: >-
        ${{
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - {name: codex-ml, release_tag_prefix: v}
          - {name: codex-cognitive-sdk, release_tag_prefix: codex-cognitive-sdk-v}
          - {name: codex-contracts, release_tag_prefix: codex-contracts-v}
          - {name: codex-ml-evaluation, release_tag_prefix: codex-ml-evaluation-v}
          - {name: codex-ml-lora, release_tag_prefix: codex-ml-lora-v}
          - {name: codex-ml-telemetry, release_tag_prefix: codex-ml-telemetry-v}
    steps:
      - name: Download artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/download-artifact@v8
        with:
          name: python-package-${{ matrix.distribution.name }}
          path: dist/

      - name: Attest release artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  validate:
    name: Validate ${{ matrix.distribution.name }}
    needs: [attest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELECTED_DISTRIBUTION: >-
        ${{
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - {name: codex-ml, release_tag_prefix: v}
          - {name: codex-cognitive-sdk, release_tag_prefix: codex-cognitive-sdk-v}
          - {name: codex-contracts, release_tag_prefix: codex-contracts-v}
          - {name: codex-ml-evaluation, release_tag_prefix: codex-ml-evaluation-v}
          - {name: codex-ml-lora, release_tag_prefix: codex-ml-lora-v}
          - {name: codex-ml-telemetry, release_tag_prefix: codex-ml-telemetry-v}
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED_DISTRIBUTION == 'true'
        with:
          persist-credentials: false

      - name: Download artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/download-artifact@v8
        with:
          name: python-package-${{ matrix.distribution.name }}
          path: dist/

      - name: Validate downloaded artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          python -m scripts.release.publishing_assurance validate-dist \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir dist

      - name: Verify release tag matches built version
        if: >-
          env.SELECTED_DISTRIBUTION == 'true' &&
          (github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi'))
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          python -m scripts.release.publishing_assurance validate-tag \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir dist \
            --tag "$RELEASE_TAG"

      - name: Verify artifact provenance
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          python -m scripts.release.publishing_assurance verify-attestation \
            --distribution "$DISTRIBUTION_NAME" \
            --dist-dir dist \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pypi-publish.yml" \
            --source-ref "$GITHUB_REF"

  publish-testpypi:
    name: Publish ${{ matrix.distribution.name }} to TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'testpypi'
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      SELECTED_DISTRIBUTION: >-
        ${{
          github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name
        }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            import: codex_ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            import: codex_cognitive_sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            import: codex_contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            import: codex_evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            import: codex_lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            import: codex_ml_telemetry
            release_tag_prefix: codex-ml-telemetry-v
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ matrix.distribution.name }}
    steps:
      - name: Download artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/download-artifact@v8
        with:
          name: python-package-${{ matrix.distribution.name }}
          path: dist/

      - name: Publish to TestPyPI
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
          skip-existing: true

  publish-pypi:
    name: Publish ${{ matrix.distribution.name }} to PyPI
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'pypi' &&
      github.ref_type == 'tag')
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      SELECTED_DISTRIBUTION: >-
        ${{
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            import: codex_ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            import: codex_cognitive_sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            import: codex_contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            import: codex_evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            import: codex_lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            import: codex_ml_telemetry
            release_tag_prefix: codex-ml-telemetry-v
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.distribution.name }}
    steps:
      - name: Download artifacts
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: actions/download-artifact@v8
        with:
          name: python-package-${{ matrix.distribution.name }}
          path: dist/

      - name: Publish to PyPI
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false

  verify-installation:
    name: Verify ${{ matrix.distribution.name }} (Python 3.12)
    needs:
      - publish-testpypi
      - publish-pypi
    if: >-
      always() && (
      (needs.publish-testpypi.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'testpypi') ||
      (needs.publish-pypi.result == 'success' &&
      (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'pypi' &&
      github.ref_type == 'tag'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SELECTED_DISTRIBUTION: >-
        ${{
          (github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, matrix.distribution.release_tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi' &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name)) ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi' &&
          startsWith(github.ref_name, matrix.distribution.release_tag_prefix) &&
          (github.event.inputs.package == 'all' ||
          github.event.inputs.package == matrix.distribution.name))
        }}
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: codex-ml
            import: codex_ml
            release_tag_prefix: v
          - name: codex-cognitive-sdk
            import: codex_cognitive_sdk
            release_tag_prefix: codex-cognitive-sdk-v
          - name: codex-contracts
            import: codex_contracts
            release_tag_prefix: codex-contracts-v
          - name: codex-ml-evaluation
            import: codex_evaluation
            release_tag_prefix: codex-ml-evaluation-v
          - name: codex-ml-lora
            import: codex_lora
            release_tag_prefix: codex-ml-lora-v
          - name: codex-ml-telemetry
            import: codex_ml_telemetry
            release_tag_prefix: codex-ml-telemetry-v
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED_DISTRIBUTION == 'true'
        with:
          persist-credentials: false

      - name: Set up Python 3.12 with tiered cache
        if: env.SELECTED_DISTRIBUTION == 'true'
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12.13'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}

      - name: Create isolated verification environment
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          python -m venv "$RUNNER_TEMP/verify-${DISTRIBUTION_NAME}"
          "$RUNNER_TEMP/verify-${DISTRIBUTION_NAME}/bin/python" -m pip install --upgrade pip

      - name: Install from TestPyPI
        if: >-
          env.SELECTED_DISTRIBUTION == 'true' &&
          needs.publish-testpypi.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'testpypi'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          "$RUNNER_TEMP/verify-${DISTRIBUTION_NAME}/bin/python" -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "$DISTRIBUTION_NAME"

      - name: Install from PyPI
        if: >-
          env.SELECTED_DISTRIBUTION == 'true' &&
          needs.publish-pypi.result == 'success' &&
          (github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.environment == 'pypi'))
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
        run: |
          "$RUNNER_TEMP/verify-${DISTRIBUTION_NAME}/bin/python" -m pip install "$DISTRIBUTION_NAME"

      - name: Test installed import
        if: env.SELECTED_DISTRIBUTION == 'true'
        env:
          DISTRIBUTION_NAME: ${{ matrix.distribution.name }}
          IMPORT_NAME: ${{ matrix.distribution.import }}
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/verify-${DISTRIBUTION_NAME}/bin/python" -I - <<'PY'
          import importlib
          import importlib.metadata as metadata
          import os

          distribution = os.environ["DISTRIBUTION_NAME"]
          module_name = os.environ["IMPORT_NAME"]
          module = importlib.import_module(module_name)
          installed_version = metadata.version(distribution)
          module_version = getattr(module, "__version__", installed_version)
          print(f"{distribution}=={installed_version}")
          assert installed_version
          assert module_version == installed_version
          PY
