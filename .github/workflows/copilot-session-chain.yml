name: "Copilot Session Chainer"

# Creates a continuation branch + PR to chain Copilot Coding Agent sessions.
# When a session is nearing timeout or has completed, trigger this workflow to
# spin up an adjacent session on a new PR — effectively leveraging a second
# runner ("secondary core processor") for parallel or sequential work.
#
# Usage:
#   1. From GitHub UI: Actions → Copilot Session Chainer → Run workflow
#   2. From CLI: gh workflow run copilot-session-chain.yml \
#        -f source_branch=copilot/update-ci-failure-triage-report \
#        -f continuation_prompt="@copilot continue with remaining Phase 5 tasks"
#   3. From within a Copilot session: post @copilot chain (if wired up)
#
# The chained session runs on its own runner instance, enabling true parallelism
# when multiple runner cores are available in the runner group.
#
# Created: S160 (PR #3628) — 2026-03-19

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch from the ending/current session'
        required: true
        type: string
      base_branch:
        description: 'Base branch for the continuation PR'
        required: false
        default: '0D_base_'
        type: string
      continuation_prompt:
        description: 'Task prompt for the chained session (posted as @copilot comment)'
        required: false
        default: '@copilot continue with next phase tasks for this PR'
        type: string
      chain_reason:
        description: 'Why is this session being chained? (logged for traceability)'
        required: false
        default: 'Session timeout approaching — continuing on adjacent runner'
        type: string

concurrency:
  group: copilot-session-chain-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  chain:
    name: "Chain to new Copilot session"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 1
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}

      - name: Create continuation branch
        id: branch
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SOURCE="${{ inputs.source_branch }}"
          # Derive a short chain suffix from source branch name
          SHORT_SOURCE=$(echo "$SOURCE" | sed 's|copilot/||' | cut -c1-30)
          CHAIN_BRANCH="copilot/${SHORT_SOURCE}-chain-${TIMESTAMP}"

          git checkout -b "$CHAIN_BRANCH"
          git push origin "$CHAIN_BRANCH"

          echo "chain_branch=${CHAIN_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "### Created branch" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${SOURCE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chain: \`${CHAIN_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create continuation PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
        run: |
          # Write PR body to file to avoid shell injection from user input
          cat > /tmp/pr_body.md << 'PREOF'
          ## 🔗 Chained Copilot Session

          **Source session branch:** `${{ inputs.source_branch }}`
          **Chain reason:** ${{ inputs.chain_reason }}
          **Base:** `${{ inputs.base_branch }}`

          This PR was automatically created by the Copilot Session Chainer workflow
          to continue work from the source session on an adjacent runner.

          ### Continuation Task

          ${{ inputs.continuation_prompt }}

          ---
          *Created by: copilot-session-chain.yml (S160)*
          PREOF

          PR_URL=$(gh pr create \
            --base "${{ inputs.base_branch }}" \
            --head "${{ steps.branch.outputs.chain_branch }}" \
            --title "chore: chained session from ${{ inputs.source_branch }}" \
            --body-file /tmp/pr_body.md \
            --repo "${{ github.repository }}")

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "### Created PR" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Copilot on new PR
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(echo "${{ steps.pr.outputs.pr_url }}" | grep -oE '[0-9]+$')
          # Write the continuation prompt to file to avoid shell injection
          cat > /tmp/copilot_prompt.md << 'CEOF'
          ${{ inputs.continuation_prompt }}

          ---
          🔗 *This is a chained session. Source: `${{ inputs.source_branch }}`*
          CEOF

          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/copilot_prompt.md

          echo "### Triggered Copilot" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prompt posted as comment" >> "$GITHUB_STEP_SUMMARY"

      - name: Log chain event
        run: |
          echo "### 🔗 Session Chain Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source Branch | \`${{ inputs.source_branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Chain Branch | \`${{ steps.branch.outputs.chain_branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Base | \`${{ inputs.base_branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Continuation PR | ${{ steps.pr.outputs.pr_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Reason | ${{ inputs.chain_reason }} |" >> "$GITHUB_STEP_SUMMARY"
