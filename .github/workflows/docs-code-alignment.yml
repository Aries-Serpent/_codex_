name: Docs-to-Code Alignment Check
on:
  schedule:
  - cron: 30 3 * * *
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  alignment-check:
    name: 📐 Docs-to-Code alignment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.13
        cache: pip
    - run: pip install -q pyyaml
    - name: Run alignment scan
      id: scan
      run: "python3 - <<'PYEOF'\n\"\"\"Scan documentation for code-path references\
        \ and verify they exist.\"\"\"\nimport json, os, re\nfrom datetime import\
        \ datetime, timezone\nfrom pathlib import Path\n\nDOC_DIRS = [\"docs\", \"\
        .codex\", \"README.md\"]\nCODE_PATH_RE = re.compile(\n    r'(?:src/|scripts/|tests/|tools/|apps/|training/)[\\\
        w/._-]+\\.(?:py|yml|yaml|json|toml|md)',\n)\nIGNORE_PATTERNS = {\".git\",\
        \ \"node_modules\", \"__pycache__\", \".nox\"}\n\ndef iter_docs():\n    for\
        \ d in DOC_DIRS:\n        p = Path(d)\n        if p.is_file():\n         \
        \   yield p\n        elif p.is_dir():\n            for f in p.rglob(\"*\"\
        ):\n                if f.is_file() and f.suffix in (\".md\", \".yaml\", \"\
        .yml\", \".rst\", \".txt\"):\n                    if not any(part in IGNORE_PATTERNS\
        \ for part in f.parts):\n                        yield f\n\nstale = []\nchecked\
        \ = 0\nfor doc in iter_docs():\n    try:\n        content = doc.read_text(errors=\"\
        replace\")\n    except Exception:\n        continue\n    for m in CODE_PATH_RE.finditer(content):\n\
        \        ref = m.group(0)\n        checked += 1\n        if not Path(ref).exists():\n\
        \            stale.append({\"doc\": str(doc), \"ref\": ref, \"line\": content[:m.start()].count(\"\
        \\n\") + 1})\n\nreport = {\n    \"generated_at\": datetime.now(timezone.utc).strftime(\"\
        %Y-%m-%dT%H:%M:%SZ\"),\n    \"docs_scanned\": sum(1 for _ in iter_docs()),\n\
        \    \"code_refs_checked\": checked,\n    \"stale_refs_found\": len(stale),\n\
        \    \"stale_refs\": stale[:50],  # cap at 50 for readability\n    \"passed\"\
        : len(stale) == 0,\n}\n\nPath(\"reports/docs\").mkdir(parents=True, exist_ok=True)\n\
        Path(\"reports/docs/alignment_latest.json\").write_text(json.dumps(report,\
        \ indent=2))\nprint(json.dumps(report, indent=2))\n\noutput = os.environ.get(\"\
        GITHUB_OUTPUT\", \"/dev/null\")\nwith open(output, \"a\") as f:\n    f.write(f\"\
        stale_count={len(stale)}\\n\")\n    f.write(f\"checked_count={checked}\\n\"\
        )\n\nif stale:\n    print(f\"::warning::Found {len(stale)} stale code references\
        \ in docs\")\n    for s in stale[:10]:\n        print(f\"::warning file={s['doc']},line={s['line']}::Stale\
        \ ref: {s['ref']}\")\nelse:\n    print(\"::notice::✅ All code references in\
        \ docs are valid\")\nPYEOF\n"
    - name: Post alignment summary
      if: always()
      run: "{\n  echo \"## \U0001F4D0 Docs-to-Code Alignment Report\"\n  echo \"\"\
        \n  echo \"| Metric | Value |\"\n  echo \"|--------|-------|\"\n  echo \"\
        | Code refs checked | ${{ steps.scan.outputs.checked_count }} |\"\n  echo\
        \ \"| Stale refs found | ${{ steps.scan.outputs.stale_count }} |\"\n  echo\
        \ \"\"\n  if [ \"${{ steps.scan.outputs.stale_count }}\" = \"0\" ]; then\n\
        \    echo \"✅ All documentation references point to valid code paths.\"\n\
        \  else\n    echo \"⚠️ Some documentation references point to paths that no\
        \ longer exist.\"\n    echo \"Review \\`reports/docs/alignment_latest.json\\\
        ` for details.\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload alignment report
      uses: actions/upload-artifact@v7.0.1
      with:
        name: docs-alignment-${{ github.run_id }}
        path: reports/docs/alignment_latest.json
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
