name: Docs-to-Code Alignment Check

# D9 exit criteria #5: Docs-to-code alignment check runs nightly.
# Verifies that documentation references to code paths, functions, and
# modules remain valid.  Reports stale references so they can be fixed.

on:
  schedule:
    - cron: "30 3 * * *"       # 03:30 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-code-alignment
  cancel-in-progress: true

jobs:
  alignment-check:
    name: "📐 Docs-to-Code alignment"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q pyyaml

      - name: Run alignment scan
        id: scan
        run: |
          python3 - <<'PYEOF'
          """Scan documentation for code-path references and verify they exist."""
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          DOC_DIRS = ["docs", ".codex", "README.md"]
          CODE_PATH_RE = re.compile(
              r'(?:src/|scripts/|tests/|tools/|apps/|training/)[\w/._-]+\.(?:py|yml|yaml|json|toml|md)',
          )
          IGNORE_PATTERNS = {".git", "node_modules", "__pycache__", ".nox"}

          def iter_docs():
              for d in DOC_DIRS:
                  p = Path(d)
                  if p.is_file():
                      yield p
                  elif p.is_dir():
                      for f in p.rglob("*"):
                          if f.is_file() and f.suffix in (".md", ".yaml", ".yml", ".rst", ".txt"):
                              if not any(part in IGNORE_PATTERNS for part in f.parts):
                                  yield f

          stale = []
          checked = 0
          for doc in iter_docs():
              try:
                  content = doc.read_text(errors="replace")
              except Exception:
                  continue
              for m in CODE_PATH_RE.finditer(content):
                  ref = m.group(0)
                  checked += 1
                  if not Path(ref).exists():
                      stale.append({"doc": str(doc), "ref": ref, "line": content[:m.start()].count("\n") + 1})

          report = {
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "docs_scanned": sum(1 for _ in iter_docs()),
              "code_refs_checked": checked,
              "stale_refs_found": len(stale),
              "stale_refs": stale[:50],  # cap at 50 for readability
              "passed": len(stale) == 0,
          }

          Path("reports/docs").mkdir(parents=True, exist_ok=True)
          Path("reports/docs/alignment_latest.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))

          output = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(output, "a") as f:
              f.write(f"stale_count={len(stale)}\n")
              f.write(f"checked_count={checked}\n")

          if stale:
              print(f"::warning::Found {len(stale)} stale code references in docs")
              for s in stale[:10]:
                  print(f"::warning file={s['doc']},line={s['line']}::Stale ref: {s['ref']}")
          else:
              print("::notice::✅ All code references in docs are valid")
          PYEOF

      - name: Post alignment summary
        if: always()
        run: |
          {
            echo "## 📐 Docs-to-Code Alignment Report"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Code refs checked | ${{ steps.scan.outputs.checked_count }} |"
            echo "| Stale refs found | ${{ steps.scan.outputs.stale_count }} |"
            echo ""
            if [ "${{ steps.scan.outputs.stale_count }}" = "0" ]; then
              echo "✅ All documentation references point to valid code paths."
            else
              echo "⚠️ Some documentation references point to paths that no longer exist."
              echo "Review \`reports/docs/alignment_latest.json\` for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload alignment report
        uses: actions/upload-artifact@v5
        with:
          name: docs-alignment-${{ github.run_id }}
          path: reports/docs/alignment_latest.json
