name: Batch CI Failure Triage
# Automated batch triage of post-merge CI/test failures with remediation suggestions
# Runs every hour, queries the LATEST failed workflow runs, and updates a single
# persistent issue (creating one only if none exists) so Copilot has fresh context.

on:
  workflow_dispatch:
    inputs:
      group_by:
        description: 'Grouping strategy'
        required: false
        type: choice
        options:
          - root_cause
          - workflow
          - severity
          - failure_type
        default: 'root_cause'
      max_runs:
        description: 'Max recent runs to inspect per workflow (1-20)'
        required: false
        type: number
        default: 5
  schedule:
    # Run every hour to capture new failures promptly
    - cron: '0 * * * *'

permissions:
  contents: read
  issues: write
  actions: read


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  batch-triage:
    name: Batch Triage CI Failures
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install Dependencies
        run: |
          pip install pyyaml click --quiet

      # ── Step 1: Gather LIVE failed workflow runs from GitHub API ─────────────
      - name: Fetch recent failed workflow runs
        id: fetch-failures
        uses: actions/github-script@v9
        with:
          script: |
            const maxRuns = Number('${{ inputs.max_runs || 5 }}') || 5;
            const lookbackHours = 25;  // slightly more than 1h schedule to avoid gaps
            const cutoff = new Date(Date.now() - lookbackHours * 60 * 60 * 1000);

            console.log(`Fetching failed workflow runs since ${cutoff.toISOString()} (last ${lookbackHours}h)`);

            // Get all workflows
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            console.log(`Found ${workflows.length} workflows`);

            const failures = [];

            for (const wf of workflows) {
              // Skip disabled or this very workflow to avoid self-loops
              if (wf.state !== 'active') continue;
              if (wf.name.includes('Batch CI Failure Triage')) continue;

              let runs;
              try {
                const resp = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf.id,
                  status: 'failure',
                  per_page: maxRuns,
                });
                runs = resp.data.workflow_runs || [];
              } catch (e) {
                console.warn(`Could not fetch runs for ${wf.name}: ${e.message}`);
                continue;
              }

              for (const run of runs) {
                // Only report on runs that are newer than the lookback window
                const runDate = new Date(run.created_at);
                if (runDate < cutoff && workflows.length > 20) continue;  // prune old for large repos

                // Get failed jobs for this run
                let failedJobs = [];
                try {
                  const jobsResp = await github.rest.actions.listJobsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                    filter: 'latest',
                    per_page: 30,
                  });
                  failedJobs = (jobsResp.data.jobs || []).filter(j => j.conclusion === 'failure');
                } catch (e) {
                  console.warn(`Could not fetch jobs for run ${run.id}: ${e.message}`);
                }

                if (run.conclusion !== 'failure' && failedJobs.length === 0) continue;

                // Determine failing step names
                const failingSteps = failedJobs.flatMap(j =>
                  (j.steps || []).filter(s => s.conclusion === 'failure').map(s => `${j.name} › ${s.name}`)
                );

                failures.push({
                  workflow_name: wf.name,
                  workflow_file: wf.path.replace('.github/workflows/', ''),
                  run_id: run.id,
                  run_url: run.html_url,
                  run_number: run.run_number,
                  created_at: run.created_at,
                  head_branch: run.head_branch,
                  head_sha: run.head_sha ? run.head_sha.substring(0, 8) : 'unknown',
                  pr_number: run.pull_requests && run.pull_requests.length > 0
                    ? run.pull_requests[0].number : null,
                  failed_jobs: failedJobs.map(j => j.name),
                  failing_steps: failingSteps,
                  logs_url: run.logs_url,
                });
              }
            }

            console.log(`Total recent failures found: ${failures.length}`);
            core.setOutput('failure_count', failures.length);
            core.setOutput('failures_json', JSON.stringify(failures));

      # ── Step 2: Build the triage report ─────────────────────────────────────
      - name: Build triage report
        id: build-report
        uses: actions/github-script@v9
        env:
          FAILURES_JSON: ${{ steps.fetch-failures.outputs.failures_json }}
        with:
          script: |
            const failures = JSON.parse(process.env.FAILURES_JSON || '[]');
            const now = new Date().toISOString();
            const repoUrl = context.payload.repository.html_url;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}`;

            if (failures.length === 0) {
              const body = `# ✅ CI Failure Triage Report\n\n` +
                `**Generated:** ${now}\n` +
                `**Status:** No failed workflow runs detected in the last 25 hours.\n\n` +
                `---\n*Triage run: ${runUrl}*`;
              core.setOutput('report_body', body);
              core.setOutput('has_failures', 'false');
              return;
            }

            // Group by workflow name
            const byWorkflow = {};
            for (const f of failures) {
              if (!byWorkflow[f.workflow_name]) byWorkflow[f.workflow_name] = [];
              byWorkflow[f.workflow_name].push(f);
            }

            let body = `# 🔴 CI Failure Triage Report\n\n`;
            body += `**Generated:** ${now}\n`;
            body += `**Repository:** ${context.repo.owner}/${context.repo.repo}\n`;
            body += `**Total Recent Failures:** ${failures.length}\n`;
            body += `**Affected Workflows:** ${Object.keys(byWorkflow).length}\n\n`;

            // Executive summary table
            body += `## Summary\n\n`;
            body += `| Workflow | Failures | Most Recent Run | Branch | PR |\n`;
            body += `|----------|----------|----------------|--------|----|\n`;
            for (const [wfName, runs] of Object.entries(byWorkflow)) {
              const latest = runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              const prLink = latest.pr_number
                ? `[#${latest.pr_number}](${context.payload.repository.html_url}/pull/${latest.pr_number})`
                : 'N/A';
              body += `| ${wfName} | ${runs.length} | [#${latest.run_number}](${latest.run_url}) (${latest.created_at.split('T')[0]}) | \`${latest.head_branch}\` | ${prLink} |\n`;
            }

            body += `\n---\n\n## Detailed Failure Analysis\n\n`;

            for (const [wfName, runs] of Object.entries(byWorkflow)) {
              const latestRun = runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              body += `### 🔴 ${wfName}\n\n`;
              body += `> **Most recent failure:** [Run #${latestRun.run_number}](${latestRun.run_url}) on branch \`${latestRun.head_branch}\` (commit \`${latestRun.head_sha}\`)\n\n`;

              if (latestRun.failed_jobs.length > 0) {
                body += `**Failed Jobs:**\n`;
                for (const job of latestRun.failed_jobs) {
                  body += `- ❌ \`${job}\`\n`;
                }
                body += `\n`;
              }

              if (latestRun.failing_steps.length > 0) {
                body += `**Failing Steps:**\n`;
                for (const step of latestRun.failing_steps.slice(0, 10)) {
                  body += `- \`${step}\`\n`;
                }
                body += `\n`;
              }

              body += `**Copilot Resolution Prompt:**\n`;
              body += `\`\`\`\n`;
              body += `@copilot Fix the failing CI workflow "${wfName}" (run #${latestRun.run_number}).\n`;
              body += `- Workflow file: .github/workflows/${latestRun.workflow_file}\n`;
              body += `- Failed jobs: ${latestRun.failed_jobs.join(', ') || 'see run'}\n`;
              if (latestRun.failing_steps.length > 0) {
                body += `- Failing steps: ${latestRun.failing_steps.slice(0, 5).join('; ')}\n`;
              }
              body += `- Run URL: ${latestRun.run_url}\n`;
              if (latestRun.pr_number) {
                body += `- Associated PR: ${context.payload.repository.html_url}/pull/${latestRun.pr_number}\n`;
              }
              body += `\`\`\`\n\n`;

              if (runs.length > 1) {
                body += `<details><summary>Previous failures (${runs.length - 1} more)</summary>\n\n`;
                for (const run of runs.slice(1)) {
                  body += `- [Run #${run.run_number}](${run.run_url}) — ${run.created_at} — branch \`${run.head_branch}\`\n`;
                }
                body += `\n</details>\n\n`;
              }

              body += `---\n\n`;
            }

            body += `\n*Triage run: ${runUrl} — Refresh by re-running [this workflow](${repoUrl}/actions/workflows/batch-ci-triage.yml)*\n`;

            // Truncate if too long for GitHub API (65535 char limit)
            if (body.length > 60000) {
              body = body.substring(0, 60000) + '\n\n... *(truncated — see workflow artifact for full report)*';
            }

            core.setOutput('report_body', body);
            core.setOutput('has_failures', failures.length > 0 ? 'true' : 'false');

      # ── Step 3: Upsert the triage issue (create or update, never duplicate) ──
      - name: Upsert triage issue
        id: upsert-issue
        uses: actions/github-script@v9
        env:
          REPORT_BODY: ${{ steps.build-report.outputs.report_body }}
          HAS_FAILURES: ${{ steps.build-report.outputs.has_failures }}
        with:
          script: |
            const body = process.env.REPORT_BODY || '*(no report generated)*';
            const hasFailures = process.env.HAS_FAILURES === 'true';
            const TRIAGE_LABEL = 'ci-triage';
            const TRIAGE_TITLE_PREFIX = '📊 CI Failure Triage Report';

            // Search for an existing OPEN triage issue to update
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: TRIAGE_LABEL,
              state: 'open',
              per_page: 10,
            });

            const triageIssue = (existingIssues.data || [])
              .find(i => i.title.startsWith(TRIAGE_TITLE_PREFIX) && !i.pull_request);

            const title = `${TRIAGE_TITLE_PREFIX} — updated ${new Date().toISOString().split('T')[0]}`;

            if (triageIssue) {
              // Update the existing issue body and title so there's only ever one
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: triageIssue.number,
                title: title,
                body: body,
                labels: hasFailures
                  ? [TRIAGE_LABEL, 'automated', 'batch-analysis']
                  : [TRIAGE_LABEL, 'automated'],
              });
              console.log(`Updated existing triage issue #${triageIssue.number}`);
              core.setOutput('issue_number', triageIssue.number);
            } else {
              // No existing issue — create one
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: hasFailures
                  ? [TRIAGE_LABEL, 'automated', 'batch-analysis']
                  : [TRIAGE_LABEL, 'automated'],
              });
              console.log(`Created new triage issue #${issue.data.number}`);
              core.setOutput('issue_number', issue.data.number);
            }

      - name: Upsert PR trigger comments for associated failures
        if: steps.build-report.outputs.has_failures == 'true'
        uses: actions/github-script@v9
        env:
          FAILURES_JSON: ${{ steps.fetch-failures.outputs.failures_json }}
          TRIAGE_ISSUE_NUMBER: ${{ steps.upsert-issue.outputs.issue_number }}
        with:
          script: |
            const failures = JSON.parse(process.env.FAILURES_JSON || '[]');
            const triageIssueNumber = process.env.TRIAGE_ISSUE_NUMBER || '';
            const marker = '<!-- batch-ci-triage-pr-trigger -->';
            const byPr = new Map();

            for (const failure of failures) {
              if (!failure.pr_number) continue;
              const entries = byPr.get(failure.pr_number) || [];
              entries.push(failure);
              byPr.set(failure.pr_number, entries);
            }

            console.log(`Preparing PR trigger comments for ${byPr.size} PR(s)`);

            for (const [prNumber, prFailures] of byPr.entries()) {
              const latestFailures = [...prFailures].sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at)
              );
              const workflowLines = latestFailures
                .slice(0, 10)
                .map(f => `- \`${f.workflow_name}\` · run #${f.run_number} · ${f.run_url}`);

              const promptLines = [
                marker,
                '## 🔴 Batch CI triage detected PR-associated failures',
                '',
                triageIssueNumber
                  ? `Live triage issue: #${triageIssueNumber}`
                  : 'Live triage issue: unavailable',
                '',
                '**Immediate Copilot resolution prompt:**',
                '```text',
                '@copilot continue',
                `Resolve the latest PR-associated CI failures detected by batch-ci-triage for PR #${prNumber}.`,
                ...workflowLines,
              ];

              const stepFailures = latestFailures
                .flatMap(f => (f.failing_steps || []).map(step => `- ${step}`))
                .slice(0, 10);
              if (stepFailures.length > 0) {
                promptLines.push('Top failing steps:');
                promptLines.push(...stepFailures);
              }

              promptLines.push('```');
              promptLines.push('');
              promptLines.push(
                'This comment is upserted by `batch-ci-triage.yml` so Copilot can be triggered immediately from the latest consolidated failure context.'
              );
              const body = promptLines.join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(prNumber),
                per_page: 100,
              });

              const existing = comments.find(comment => (comment.body || '').includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                console.log(`Updated PR trigger comment on #${prNumber}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(prNumber),
                  body,
                });
                console.log(`Created PR trigger comment on #${prNumber}`);
              }
            }

      # ── Step 4: Upload report artifact for reference ─────────────────────────
      - name: Save triage artifacts
        if: always()
        env:
          REPORT_BODY: ${{ steps.build-report.outputs.report_body }}
          FAILURES_JSON: ${{ steps.fetch-failures.outputs.failures_json }}
          TRIAGE_ISSUE_NUMBER: ${{ steps.upsert-issue.outputs.issue_number }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const failures = JSON.parse(process.env.FAILURES_JSON || '[]');
            const triageIssueNumber = process.env.TRIAGE_ISSUE_NUMBER || null;
            const generatedAt = new Date().toISOString();
            const groupedByPr = {};

            for (const failure of failures) {
              if (!failure.pr_number) continue;
              if (!groupedByPr[failure.pr_number]) groupedByPr[failure.pr_number] = [];
              groupedByPr[failure.pr_number].push(failure);
            }

            fs.writeFileSync('ci-triage-report.md', process.env.REPORT_BODY || '*(no report)*');
            fs.writeFileSync(
              'ci-triage-failures.json',
              JSON.stringify(
                {
                  generated_at: generatedAt,
                  triage_issue_number: triageIssueNumber,
                  failure_count: failures.length,
                  failures,
                },
                null,
                2,
              ),
            );
            fs.writeFileSync(
              'ci-triage-pr-triggers.json',
              JSON.stringify(
                {
                  generated_at: generatedAt,
                  triage_issue_number: triageIssueNumber,
                  pull_requests: Object.entries(groupedByPr).map(([pr_number, pr_failures]) => ({
                    pr_number: Number(pr_number),
                    failure_count: pr_failures.length,
                    workflows: pr_failures.map(failure => ({
                      workflow_name: failure.workflow_name,
                      run_number: failure.run_number,
                      run_url: failure.run_url,
                      failed_jobs: failure.failed_jobs,
                      failing_steps: failure.failing_steps,
                    })),
                  })),
                },
                null,
                2,
              ),
            );

      - name: Upload triage report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-triage-report-${{ github.run_id }}
          path: |
            ci-triage-report.md
            ci-triage-failures.json
            ci-triage-pr-triggers.json
          retention-days: 30

      - name: Generate job summary
        if: always()
        run: |
          FAILURES="${{ steps.fetch-failures.outputs.failure_count }}"
          echo "## 📊 CI Failure Triage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${FAILURES:-0}" -gt 0 ]; then
            echo "🔴 **${FAILURES} failed workflow run(s) detected** — issue updated/created." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No failures detected** — triage issue updated with clean status." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Issue: #\`${{ steps.upsert-issue.outputs.issue_number || 'N/A' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: \`ci-triage-report.md\`, \`ci-triage-failures.json\`, \`ci-triage-pr-triggers.json\`" >> $GITHUB_STEP_SUMMARY
