name: Pre-Merge Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Also run when PR is approved
  pull_request_review:
    types: [submitted]
  # Allow manual re-trigger for missed runs (e.g. after approval on new HEAD)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-validation:
    name: Final Pre-Merge Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python with shared cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          extras: 'dev'

      - name: Run auto-fix check
        id: autofix
        run: |
          python scripts/ci/auto_fix_common_issues.py --check-only --json-output /tmp/autofix_report.json
        continue-on-error: true

      - name: CI pattern pipeline (strict gate)
        id: pattern_pipeline
        run: |
          # Run the full detect→record→report pipeline in strict mode.
          # Exits 1 if any auto-fixable issues remain or high-recurrence patterns
          # exceed the threshold — blocks merge until fixed.
          python scripts/ci/ci_pattern_pipeline.py \
            --check-only \
            --strict \
            --artefact /tmp/pattern_pipeline_report.json
        continue-on-error: true

      - name: Verify agent batch-scan protocol coverage
        id: batch_scan_protocol
        run: |
          python scripts/ci/inject_batch_scan_protocol.py --dry-run
          # Fails (non-zero) if any applicable agent is missing the ⚡ section,
          # preventing new agents from being added without the protocol.
        continue-on-error: true

      - name: Mermaid diagram drift check
        id: mermaid_check
        run: |
          python scripts/ci/generate_mermaid.py --check
        continue-on-error: true

      - name: Run quick tests
        id: tests
        timeout-minutes: 5
        run: |
          # Run CI capability tests only — these are fast (~30s) and exercise
          # the key infrastructure without running the full 1500-test suite.
          # The full suite runs in Resilient Validation Suite / Art_Validation Pipeline.
          pytest tests/capabilities/ci_test/ -q --tb=short --timeout=60
        continue-on-error: true

      - name: Check code quality
        id: quality
        run: |
          python -m ruff check src/ tests/ --output-format=github || true
        continue-on-error: true

      - name: Session wrapup check
        id: session_wrapup
        run: |
          # Verify accountability report and CHANGELOG were updated this session
          # (REQ-4 / REQ-5 cognitive pre-flight gate — check-only, no writes).
          python scripts/ci/session_wrapup_autofix.py \
            --pr-number "${{ github.event.pull_request.number }}" \
            --sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --check
        continue-on-error: true

      - name: Upload validation reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pre-merge-validation-reports-${{ github.run_id }}
          path: |
            /tmp/autofix_report.json
            /tmp/pattern_pipeline_report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Post validation summary
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const checks = {
              autofix: '${{ steps.autofix.outcome }}',
              pattern_pipeline: '${{ steps.pattern_pipeline.outcome }}',
              batch_scan_protocol: '${{ steps.batch_scan_protocol.outcome }}',
              mermaid_check: '${{ steps.mermaid_check.outcome }}',
              tests: '${{ steps.tests.outcome }}',
              quality: '${{ steps.quality.outcome }}',
              session_wrapup: '${{ steps.session_wrapup.outcome }}',
            };

            // Only these three block the merge; the rest are informational warnings.
            const critical = ['autofix', 'pattern_pipeline', 'batch_scan_protocol'];
            const passed = critical.every(k => checks[k] === 'success');
            const emoji = passed ? '✅' : '❌';

            const MARKER = '<!-- pre-merge-validation-summary -->';
            const summary = `${MARKER}\n## ${emoji} Pre-Merge Validation Summary

            | Check | Status |
            |-------|--------|
            | Auto-Fix Issues | ${checks.autofix === 'success' ? '✅ Pass' : '❌ Fail'} |
            | CI Pattern Pipeline (strict) | ${checks.pattern_pipeline === 'success' ? '✅ Pass' : '❌ Fail'} |
            | Agent Batch-Scan Protocol | ${checks.batch_scan_protocol === 'success' ? '✅ Pass' : '❌ Fail'} |
            | Mermaid Diagram Drift | ${checks.mermaid_check === 'success' ? '✅ Pass' : '⚠️ Drift detected'} |
            | Quick Tests | ${checks.tests === 'success' ? '✅ Pass' : '⚠️ Warning'} |
            | Code Quality | ${checks.quality === 'success' ? '✅ Pass' : '⚠️ Warning'} |
            | Session Wrapup (REQ-4/5) | ${checks.session_wrapup === 'success' ? '✅ Pass' : '⚠️ Warning'} |

            ${passed ? '✅ **All required checks passed! Ready to merge.**' : '❌ **Some checks failed. Please review and fix.**'}

            ---

            **Note**: This is a quick pre-merge validation. Full test suite runs in other workflows.

            _Generated by Pre-Merge Validation workflow_`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existing.id, body: summary,
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner, repo: context.repo.repo,
                  body: summary,
                });
              }
            } catch (err) {
              core.warning(`Could not post validation summary comment (${err.status || err.message}). Continuing.`);
            }

      - name: Fail if critical checks failed
        if: steps.autofix.outcome != 'success' || steps.pattern_pipeline.outcome != 'success' || steps.batch_scan_protocol.outcome != 'success'
        run: |
          echo "::error::Pre-merge validation failed"
          if [ "${{ steps.autofix.outcome }}" != "success" ]; then
            echo "::error::Auto-fixable issues detected"
            if [ -f /tmp/autofix_report.json ]; then
              python3 scripts/ci/print_autofix_issues.py
            fi
            echo "Fix with: python scripts/ci/auto_fix_common_issues.py"
          fi
          if [ "${{ steps.pattern_pipeline.outcome }}" != "success" ]; then
            echo "::error::CI pattern pipeline (strict) failed — high-recurrence patterns or unfixed auto-fixable issues"
            if [ -f /tmp/pattern_pipeline_report.json ]; then
              python3 -c "import json,sys; r=json.load(open('/tmp/pattern_pipeline_report.json')); print(json.dumps(r.get('summary',{}), indent=2))"
            fi
            echo "Fix with: python scripts/ci/auto_fix_common_issues.py && python scripts/ci/ci_pattern_pipeline.py --strict"
          fi
          if [ "${{ steps.batch_scan_protocol.outcome }}" != "success" ]; then
            echo "::error::Agent batch-scan protocol check failed — one or more agent files are missing the ⚡ Parallel Batch Scanning Protocol section"
            echo "Fix with: python scripts/ci/inject_batch_scan_protocol.py"
          fi
          exit 1

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow pre-merge-validation 2>/dev/null || echo "Cache health: check skipped"

  # ── rescue comment — posted on PR whenever pre-merge validation fails ────────
  rescue-comment:
    name: Post rescue comment on pre-merge failure
    runs-on: ubuntu-latest
    needs: final-validation
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Pre-Merge Validation"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
