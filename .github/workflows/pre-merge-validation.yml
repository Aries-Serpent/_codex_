name: Pre-Merge Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Also run when PR is approved
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-validation:
    name: Final Pre-Merge Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin pytest plugins (PR #3248)
          # Pin pytest plugins before package install (PR #3248 stability fix)
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0



          pip install -e ".[dev]" || pip install -e .
          pip install ruff pyyaml pytest pytest-cov nox

      - name: Run auto-fix check
        id: autofix
        run: |
          python scripts/ci/auto_fix_common_issues.py --check-only
        continue-on-error: true

      - name: Run quick tests
        id: tests
        run: |
          # Run a subset of tests for quick validation
          pytest tests/ -v --tb=short -x --maxfail=3 --timeout=300 || true
        continue-on-error: true

      - name: Check code quality
        id: quality
        run: |
          python -m ruff check src/ tests/ --output-format=github || true
        continue-on-error: true

      - name: Post validation summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const checks = {
              autofix: '${{ steps.autofix.outcome }}',
              tests: '${{ steps.tests.outcome }}',
              quality: '${{ steps.quality.outcome }}'
            };

            const passed = Object.values(checks).every(v => v === 'success');
            const emoji = passed ? '✅' : '❌';

            const summary = `## ${emoji} Pre-Merge Validation Summary

            | Check | Status |
            |-------|--------|
            | Auto-Fix Issues | ${checks.autofix === 'success' ? '✅ Pass' : '❌ Fail'} |
            | Quick Tests | ${checks.tests === 'success' ? '✅ Pass' : '⚠️ Warning'} |
            | Code Quality | ${checks.quality === 'success' ? '✅ Pass' : '⚠️ Warning'} |

            ${passed ? '✅ **All required checks passed! Ready to merge.**' : '❌ **Some checks failed. Please review and fix.**'}

            ---

            **Note**: This is a quick pre-merge validation. Full test suite runs in other workflows.

            _Generated by Pre-Merge Validation workflow_`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail if critical checks failed
        if: steps.autofix.outcome != 'success'
        run: |
          echo "::error::Pre-merge validation failed - auto-fixable issues detected"
          exit 1

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow pre-merge-validation 2>/dev/null || echo "Cache health: check skipped"
