name: Security Gates (Bandit, Secrets, Dependencies)

on:
  push:
    branches: [ "0D_base_", "main", "master" ]
  pull_request:
    branches: [ "0D_base_", "main", "master" ]
  workflow_dispatch:

jobs:
  security-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets pip-audit

      - name: Bandit SAST
        run: |
          if [ -d src ]; then
            bandit -q -r src
          else
            echo "No src/ directory; skipping Bandit"
          fi

      - name: Secrets scan
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets audit .secrets.baseline --report --json > secrets_audit.json || true
          else
            detect-secrets scan > .secrets.baseline
            echo "Generated new baseline; please audit and commit"
          fi

      - name: Dependency audit
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || true
          else
            echo "No requirements.txt; skipping pip-audit"
          fi

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            .secrets.baseline
            secrets_audit.json
