name: Maturity Check

on:
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'scripts/maturity/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -e ".[dev]"
      
      - name: Update maturity from AST
        run: python scripts/maturity/update_from_ast.py
      
      - name: Upload maturity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maturity-report
          path: docs/maturity/MATURITY_REMAINING_WORK.md
