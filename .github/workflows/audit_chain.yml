name: Audit Integrity Chain

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  audit-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
      - name: Run full audit
        run: |
          bash scripts/audit/run_full_audit.sh
      - name: Generate capability matrix
        run: |
          python scripts/status/generate_capability_matrix_md.py
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audit-chain
          path: |
            audit_run_manifest.json
            audit_artifacts/**
            reports/capability_matrix_*.md
