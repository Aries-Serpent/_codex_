name: Scheduled Dependency Audit & SBOM

on:
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version to test (e.g., 3.11, 3.12)'
        required: false
        default: '3.11'
      enable_multiarch:
        description: 'Enable multi-arch builds for testing'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.python_version) || '3.11' }}
  ALLOW_MULTIARCH: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.enable_multiarch == 'true') && 'true' || 'false' }}

jobs:
  baseline-wheels:
    name: Generate Baseline Wheelhouse & Manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        platform: ['linux/amd64', 'linux/arm64']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wheelhouse (builder stage) for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
        with:
          context: .
          file: Dockerfile
          target: builder
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=./wheelhouse
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # build-args removed: Dockerfile does not support PYTHON_VERSION

      - name: Set up Python
        if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate wheel manifest
        if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
        run: |
          python scripts/ci/generate_wheel_manifest.py \
            --wheelhouse ./wheelhouse/tmp/wheels \
            --output ./wheelhouse/manifest-${{ matrix.platform }}.json \
            --platform ${{ matrix.platform }} \
            --python-version ${{ env.PYTHON_VERSION }}

      - name: Upload wheelhouse with manifest
        if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: baseline-wheelhouse-${{ replace(matrix.platform, '/', '-') }}
          path: ./wheelhouse
          retention-days: 30

  sbom-generation:
    name: Generate SBOM & Security Scan
    runs-on: ubuntu-latest
    needs: baseline-wheels
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        variant: ['cpu', 'gpu']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Dockerfile
        id: dockerfile
        run: |
          if [ "${{ matrix.variant }}" = "gpu" ]; then
            echo "file=Dockerfile.gpu" >> $GITHUB_OUTPUT
          else
            echo "file=Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build image for SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          platforms: linux/amd64
          target: runtime
          load: true
          tags: codex-ml:sbom-${{ matrix.variant }}
          cache-from: type=gha

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM with Syft
        run: |
          syft codex-ml:sbom-${{ matrix.variant }} \
            -o spdx-json=sbom-${{ matrix.variant }}.spdx.json \
            -o cyclonedx-json=sbom-${{ matrix.variant }}.cyclonedx.json \
            -o syft-json=sbom-${{ matrix.variant }}.syft.json

      - name: Install Grype
        uses: anchore/scan-action/download-grype@v3

      - name: Scan with Grype
        run: |
          grype codex-ml:sbom-${{ matrix.variant }} \
            --output sarif \
            --file grype-${{ matrix.variant }}.sarif \
            --fail-on critical
        continue-on-error: true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.variant }}
          path: |
            sbom-${{ matrix.variant }}.*.json
            grype-${{ matrix.variant }}.sarif
          retention-days: 90

      - name: Upload Grype SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-${{ matrix.variant }}.sarif
          category: grype-${{ matrix.variant }}

  upgrade-compatibility:
    name: Test Python ${{ matrix.python_version }} Compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test build with Python ${{ matrix.python_version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          target: builder
          cache-from: type=gha
          build-args: |
            PYTHON_VERSION=${{ matrix.python_version }}
        continue-on-error: ${{ matrix.python_version != '3.11' }}

      - name: Report compatibility
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Python ${{ matrix.python_version }} is compatible"
          else
            echo "⚠️ Python ${{ matrix.python_version }} compatibility issues detected"
          fi

  drift-detection:
    name: Detect Dependency Drift
    runs-on: ubuntu-latest
    needs: baseline-wheels
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Download current baseline (amd64)
        uses: actions/download-artifact@v4
        with:
          name: baseline-wheelhouse-linux-amd64
          path: ./current-baseline

      - name: Download previous baseline (if exists)
        continue-on-error: true
        run: |
          # Try to download from previous run
          # This would need to be stored in a persistent location
          echo "Previous baseline check skipped (first run or no storage configured)"

      - name: Compare manifests
        id: compare
        run: |
          if [ -f "./previous-baseline/manifest-linux-amd64.json" ] && [ -f "./current-baseline/manifest-linux-amd64.json" ]; then
            echo "Comparing wheel manifests..."

            # Simple diff check (can be enhanced with jq for detailed comparison)
            if ! diff -q ./previous-baseline/manifest-linux-amd64.json ./current-baseline/manifest-linux-amd64.json; then
              echo "drift_detected=true" >> $GITHUB_OUTPUT
              echo "⚠️ Dependency drift detected"
            else
              echo "drift_detected=false" >> $GITHUB_OUTPUT
              echo "✅ No dependency drift"
            fi
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Baseline comparison skipped (no previous baseline)"
          fi

      - name: Create drift alert issue
        if: steps.compare.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔍 Dependency Drift Detected',
              body: `Automated dependency audit detected changes in the wheelhouse baseline.

              **Action Required:**
              - Review the wheel manifest changes
              - Verify compatibility with current codebase
              - Update pinned versions if necessary

              **Artifacts:**
              - Current baseline: [Download from workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})

              **Workflow:** ${context.workflow}
              **Run:** ${context.runId}`,
              labels: ['dependencies', 'security', 'automated']
            });

  summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    needs: [baseline-wheels, sbom-generation, upgrade-compatibility, drift-detection]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Generate summary
        run: |
          echo "## Dependency Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Python Version Tested:** ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Multi-arch Enabled:** ${{ env.ALLOW_MULTIARCH }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Baseline Wheels: ${{ needs.baseline-wheels.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM Generation: ${{ needs.sbom-generation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Upgrade Compatibility: ${{ needs.upgrade-compatibility.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Drift Detection: ${{ needs.drift-detection.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:** Check the workflow run for SBOM files and wheel manifests." >> $GITHUB_STEP_SUMMARY
