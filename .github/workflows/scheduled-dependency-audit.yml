name: Scheduled Dependency Audit & SBOM
'on':
  pull_request:
    paths:
    - requirements*.txt
    - requirements/**
    - pyproject.toml
  schedule:
  - cron: 0 0 * * 1
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version to test (e.g., 3.11, 3.12)
        required: false
        default: '3.12'
      enable_multiarch:
        description: Enable multi-arch builds for testing
        required: false
        type: boolean
        default: false
env:
  PYTHON_VERSION: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.python_version)
    || '3.12' }}
  ALLOW_MULTIARCH: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.enable_multiarch
    == 'true') && 'true' || 'false' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  baseline-wheels:
    name: Generate Baseline Wheelhouse & Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        platform:
        - linux/amd64
        - linux/arm64
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - name: Build wheelhouse (builder stage) for ${{ matrix.platform }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
      with:
        context: .
        file: Dockerfile
        target: builder
        platforms: ${{ matrix.platform }}
        outputs: type=local,dest=./wheelhouse
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Set up Python
      if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: common
    - name: Cache Dependencies
      if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
      uses: actions/cache@v6
      with:
        path: '~/.cache/pip

          '
        key: ${{ runner.os }}-${{ github.workflow }}-${{ matrix.platform }}-pip-${{
          hashFiles('**/requirements*.txt', 'pyproject.toml') }}
        restore-keys: '${{ runner.os }}-${{ github.workflow }}-${{ matrix.platform
          }}-pip-

          ${{ runner.os }}-pip-

          '
    - name: Generate wheel manifest
      if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
      run: "python scripts/ci/generate_wheel_manifest.py \\\n  --wheelhouse ./wheelhouse/tmp/wheels\
        \ \\\n  --output ./wheelhouse/manifest-${{ matrix.platform }}.json \\\n  --platform\
        \ ${{ matrix.platform }} \\\n  --python-version ${{ env.PYTHON_VERSION }}\n"
    - name: Set safe artifact platform name
      id: safe-platform
      if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
      env:
        MATRIX_PLATFORM: ${{ matrix.platform }}
      run: echo "name=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
    - name: Upload wheelhouse with manifest
      if: ${{ matrix.platform == 'linux/amd64' || env.ALLOW_MULTIARCH == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        path: ./wheelhouse
        retention-days: 30
        name: baseline-wheelhouse-${{ steps.safe-platform.outputs.name }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  sbom-generation:
    name: Generate SBOM & Security Scan
    runs-on: ubuntu-latest
    needs: baseline-wheels
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        variant:
        - cpu
        - gpu
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - name: Determine Dockerfile
      id: dockerfile
      env:
        MATRIX_VARIANT: ${{ matrix.variant }}
      run: "if [ \"${{ matrix.variant }}\" = \"gpu\" ]; then\n  echo \"file=Dockerfile.gpu\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"file=Dockerfile\" >> $GITHUB_OUTPUT\n\
        fi\n"
    - name: Build image for SBOM
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        file: ${{ steps.dockerfile.outputs.file }}
        platforms: linux/amd64
        target: runtime
        load: true
        tags: codex-ml:sbom-${{ matrix.variant }}
        cache-from: type=gha
    - name: Install Syft
      uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
    - name: Generate SBOM with Syft
      env:
        MATRIX_VARIANT: ${{ matrix.variant }}
      run: "syft codex-ml:sbom-${{ matrix.variant }} \\\n  -o spdx-json=sbom-${{ matrix.variant\
        \ }}.spdx.json \\\n  -o cyclonedx-json=sbom-${{ matrix.variant }}.cyclonedx.json\
        \ \\\n  -o syft-json=sbom-${{ matrix.variant }}.syft.json\n"
    - name: Install Grype
      uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439
    - name: Scan with Grype
      env:
        MATRIX_VARIANT: ${{ matrix.variant }}
      run: "grype codex-ml:sbom-${{ matrix.variant }} \\\n  --output sarif \\\n  --file\
        \ grype-${{ matrix.variant }}.sarif \\\n  --fail-on critical\n"
      continue-on-error: true
    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v7
      with:
        path: 'sbom-${{ matrix.variant }}.*.json

          grype-${{ matrix.variant }}.sarif

          '
        retention-days: 90
        name: sbom-${{ matrix.variant }}
    - name: Upload Grype SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: grype-${{ matrix.variant }}.sarif
        category: grype-${{ matrix.variant }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  upgrade-compatibility:
    name: Test Python ${{ matrix.python_version }} Compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python_version:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - name: Test build with Python ${{ matrix.python_version }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        target: builder
        cache-from: type=gha
        build-args: 'PYTHON_VERSION=${{ matrix.python_version }}

          '
        continue-on-error: ${{ matrix.python_version != '3.11' }}
    - name: Report compatibility
      if: always()
      env:
        JOB_STATUS: ${{ job.status }}
      run: "if [ \"${{ job.status }}\" = \"success\" ]; then\n  echo \"\u2705 Python\
        \ ${{ matrix.python_version }} is compatible\"\nelse\n  echo \"\u26A0\uFE0F\
        \ Python ${{ matrix.python_version }} compatibility issues detected\"\nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  drift-detection:
    name: Detect Dependency Drift
    runs-on: ubuntu-latest
    needs: baseline-wheels
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Download current baseline (amd64)
      uses: actions/download-artifact@v8
      with:
        path: ./current-baseline
        name: baseline-wheelhouse-linux-amd64
    - name: Download previous baseline (if exists)
      continue-on-error: true
      run: '# Try to download from previous run

        # This would need to be stored in a persistent location

        echo "Previous baseline check skipped (first run or no storage configured)"

        '
    - name: Compare manifests
      id: compare
      run: "if [ -f \"./previous-baseline/manifest-linux-amd64.json\" ] && [ -f \"\
        ./current-baseline/manifest-linux-amd64.json\" ]; then\n  echo \"Comparing\
        \ wheel manifests...\"\n\n  # Simple diff check (can be enhanced with jq for\
        \ detailed comparison)\n  if ! diff -q ./previous-baseline/manifest-linux-amd64.json\
        \ ./current-baseline/manifest-linux-amd64.json; then\n    echo \"drift_detected=true\"\
        \ >> $GITHUB_OUTPUT\n    echo \"\u26A0\uFE0F Dependency drift detected\"\n\
        \  else\n    echo \"drift_detected=false\" >> $GITHUB_OUTPUT\n    echo \"\u2705\
        \ No dependency drift\"\n  fi\nelse\n  echo \"drift_detected=false\" >> $GITHUB_OUTPUT\n\
        \  echo \"\u2139\uFE0F Baseline comparison skipped (no previous baseline)\"\
        \nfi\n"
    - name: Create drift alert issue
      if: steps.compare.outputs.drift_detected == 'true'
      uses: actions/github-script@v9
      with:
        script: "github.rest.issues.create({\n  owner: context.repo.owner,\n  repo:\
          \ context.repo.repo,\n  title: '\U0001F50D Dependency Drift Detected',\n\
          \  body: `Automated dependency audit detected changes in the wheelhouse\
          \ baseline.\n\n  **Action Required:**\n  - Review the wheel manifest changes\n\
          \  - Verify compatibility with current codebase\n  - Update pinned versions\
          \ if necessary\n\n  **Artifacts:**\n  - Current baseline: [Download from\
          \ workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})\n\
          \n  **Workflow:** ${context.workflow}\n  **Run:** ${context.runId}`,\n \
          \ labels: ['dependencies', 'security', 'automated']\n});\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  dependency-audit:
    name: pip-audit + safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Install audit tools
      run: 'pip install pip-audit safety

        '
    - name: Run pip-audit (CRITICAL blocking)
      id: pip-audit
      run: "set -euo pipefail\nmkdir -p workbench/security\n\n# Run pip-audit with\
        \ multiple output formats\npip-audit \\\n  -r requirements.txt \\\n  -r requirements-dev.txt\
        \ \\\n  --format json \\\n  -o workbench/security/ci_pip_audit.json || true\n\
        \npip-audit \\\n  -r requirements.txt \\\n  -r requirements-dev.txt \\\n \
        \ --format cyclonedx-json \\\n  -o workbench/security/ci_pip_audit_cyclonedx.json\
        \ || true\n\n# Run with text output and check for CRITICAL\nif pip-audit -r\
        \ requirements.txt -r requirements-dev.txt 2>&1 | tee pip_audit_output.txt;\
        \ then\n  echo \"status=success\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\n\
        # Check for CRITICAL vulnerabilities\nif grep -i 'CRITICAL' pip_audit_output.txt;\
        \ then\n  echo \"::error::pip-audit found CRITICAL CVEs \u2014 blocking PR\"\
        \n  echo \"has_critical=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"status=failure\"\
        \ >> \"$GITHUB_OUTPUT\"\n  exit 1\nfi\n\n# Check for HIGH vulnerabilities\n\
        if grep -i 'HIGH' pip_audit_output.txt; then\n  echo \"::warning::pip-audit\
        \ found HIGH CVEs \u2014 review required\"\n  echo \"has_high=true\" >> \"\
        $GITHUB_OUTPUT\"\n  echo \"status=warning\" >> \"$GITHUB_OUTPUT\"\nelse\n\
        \  echo \"has_high=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Run safety check
      continue-on-error: true
      run: "mkdir -p workbench/security\nsafety check -r requirements.txt --json >\
        \ workbench/security/ci_safety_check.json 2>&1 || true\nsafety check -r requirements.txt\
        \ 2>&1 | tee safety_output.txt || true\n\n# Document any CRITICAL findings\n\
        if grep -iE 'CRITICAL' safety_output.txt; then\n  echo \"::error::safety found\
        \ CRITICAL issues\"\nelif grep -iE 'HIGH' safety_output.txt; then\n  echo\
        \ \"::warning::safety found HIGH issues\"\nfi\n"
    - name: Upload audit artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: 'workbench/security/ci_pip_audit.json

          workbench/security/ci_pip_audit_cyclonedx.json

          workbench/security/ci_safety_check.json

          '
        retention-days: 30
        name: dependency-audit-${{ github.run_id }}
    - name: Generate audit summary
      if: always()
      run: 'echo "## pip-audit Results" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Status:** ${{ steps.pip-audit.outputs.status }}" >> $GITHUB_STEP_SUMMARY

        echo "**CRITICAL Found:** ${{ steps.pip-audit.outputs.has_critical || ''false''
        }}" >> $GITHUB_STEP_SUMMARY

        echo "**HIGH Found:** ${{ steps.pip-audit.outputs.has_high || ''false'' }}"
        >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Audit Output" >> $GITHUB_STEP_SUMMARY

        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

        tail -20 pip_audit_output.txt 2>/dev/null || echo "No output available" >>
        $GITHUB_STEP_SUMMARY

        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 20
  summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
    - baseline-wheels
    - sbom-generation
    - upgrade-compatibility
    - drift-detection
    - dependency-audit
    if: always()
    permissions:
      contents: read
    steps:
    - name: Generate summary
      run: 'echo "## Dependency Audit Summary" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Python Version Tested:** ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY

        echo "**Multi-arch Enabled:** ${{ env.ALLOW_MULTIARCH }}" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Job Status" >> $GITHUB_STEP_SUMMARY

        echo "- Baseline Wheels: ${{ needs.baseline-wheels.result }}" >> $GITHUB_STEP_SUMMARY

        echo "- SBOM Generation: ${{ needs.sbom-generation.result }}" >> $GITHUB_STEP_SUMMARY

        echo "- Upgrade Compatibility: ${{ needs.upgrade-compatibility.result }}"
        >> $GITHUB_STEP_SUMMARY

        echo "- Drift Detection: ${{ needs.drift-detection.result }}" >> $GITHUB_STEP_SUMMARY

        echo "- pip-audit + safety: ${{ needs.dependency-audit.result }}" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Artifacts:** Check the workflow run for SBOM files and wheel manifests."
        >> $GITHUB_STEP_SUMMARY

        '
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow scheduled-dependency-audit
        2>/dev/null || echo "Cache health: check skipped"

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
