name: Scheduled Archival
on:
  schedule:
  - cron: 0 2 * * 0
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run mode (no actual archival)
        required: false
        default: 'true'
        type: boolean
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  cost-gate:
    name: 💰 Cost Gate
    uses: ./.github/workflows/cost-gate.yml
    with:
      workflow_name: Scheduled Archival
      runner: ubuntu-latest
      timeout_minutes: 60
      matrix_count: 3
      pushes_to_ghcr: false
  identify-candidates:
    name: Identify Archival Candidates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: cost-gate
    outputs:
      candidates: ${{ steps.find.outputs.candidates }}
      count: ${{ steps.find.outputs.count }}
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow scheduled-archival
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Find Archival Candidates
      id: find
      run: "echo \"## Archival Candidate Analysis\"\necho \"\"\n\n# Find markdown\
        \ files older than 90 days with no recent modifications\nCANDIDATES=$(find\
        \ . -name \"*.md\" -type f \\\n  -not -path \"./.git/*\" \\\n  -not -path\
        \ \"./.codex/archive/root-consolidation/deprecated-reports/misc/repo-owner-review/*\" \\\n  -not -path \"./archive/*\" \\\n  -not\
        \ -name \"README.md\" \\\n  -not -name \"AGENTS.md\" \\\n  -not -name \"CONTRIBUTING.md\"\
        \ \\\n  -not -name \"CHANGELOG.md\" \\\n  -mtime +90 2>/dev/null | head -20\
        \ || echo \"\")\n\nCOUNT=$(echo \"$CANDIDATES\" | grep -c \".\" || echo \"\
        0\")\n\necho \"Found $COUNT potential archival candidates\"\necho \"\"\n\n\
        if [ -n \"$CANDIDATES\" ]; then\n  echo \"### Candidates (older than 90 days):\"\
        \n  echo \"$CANDIDATES\" | while read -r file; do\n    if [ -n \"$file\" ];\
        \ then\n      LAST_MOD=$(git log -1 --format=\"%ar\" -- \"$file\" 2>/dev/null\
        \ || echo \"unknown\")\n      echo \"- \\`$file\\` (last modified: $LAST_MOD)\"\
        \n    fi\n  done\nfi\n\n# Output for GitHub Actions\n{\n  echo \"count=$COUNT\"\
        \n  echo \"candidates<<EOF\"\n  echo \"$CANDIDATES\"\n  echo \"EOF\"\n} >>\
        \ $GITHUB_OUTPUT\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  create-proposal:
    name: Create Archival Proposal
    runs-on: ubuntu-latest
    needs: identify-candidates
    if: ${{ needs.identify-candidates.outputs.count > 0 }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Create Archival Issue
      if: ${{ github.event.inputs.dry_run != 'true' }}
      uses: actions/github-script@v9
      with:
        script: "const candidates = `${{ needs.identify-candidates.outputs.candidates\
          \ }}`;\nconst count = \"${{ needs.identify-candidates.outputs.count }}\"\
          ;\n\nconst body = `## Archival Proposal\n\n**Generated**: ${new Date().toISOString().split(\"\
          T\")[0]}\n**Candidates**: ${count} files\n\n### Files Proposed for Archival\n\
          \nThe following files have not been modified in over 90 days and may be\
          \ candidates for archival:\n\n\\`\\`\\`\n${candidates}\n\\`\\`\\`\n\n###\
          \ Approval Required\n\n- [ ] Review each candidate file\n- [ ] Confirm no\
          \ active references exist\n- [ ] Approve archival by commenting \\`/approve-archival\\\
          `\n\n### Archival Process\n\n1. Files will be moved to \\`.codex/archive/root-consolidation/deprecated-reports/misc/repo-owner-review/archived/\\\
          `\n2. A redirect/reference will be added to original location\n3. Documentation\
          \ index will be updated\n\n---\n\nThis issue was automatically created by\
          \ the Scheduled Archival workflow.\n`;\n\nawait github.rest.issues.create({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  title: `[Archival]\
          \ ${count} files proposed for archival`,\n  body: body,\n  labels: [\"archival\"\
          , \"needs-review\"]\n});\n"
    - name: Dry Run Summary
      if: ${{ github.event.inputs.dry_run == 'true' }}
      run: 'echo "## Dry Run Summary"

        echo ""

        echo "Would create archival proposal for ${{ needs.identify-candidates.outputs.count
        }} files"

        echo ""

        echo "Files:"

        echo "${{ needs.identify-candidates.outputs.candidates }}"

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  compress-large-files:
    name: Compress Large Historical Files
    runs-on: ubuntu-latest
    needs: identify-candidates
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Find and Compress Large Files
      run: "echo \"## Large File Compression\"\necho \"\"\n\n# Find files larger than\
        \ 100KB in archive directories\nLARGE_FILES=$(find ./.codex/archive/root-consolidation/deprecated-reports/misc/repo-owner-review\
        \ -type f -size +100k 2>/dev/null || echo \"\")\n\nif [ -n \"$LARGE_FILES\"\
        \ ]; then\n  echo \"Found large files for potential compression:\"\n  echo\
        \ \"$LARGE_FILES\" | while read -r file; do\n    if [ -n \"$file\" ] && [\
        \ -f \"$file\" ]; then\n      SIZE=$(du -h \"$file\" | cut -f1)\n      echo\
        \ \"- $file ($SIZE)\"\n    fi\n  done\nelse\n  echo \"No large files found\
        \ for compression\"\nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
