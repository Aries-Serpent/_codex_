name: 🔐 Secrets Baseline Enforcer

# Continuously keeps .secrets.baseline in sync.
#
# On every push / PR:
#   1. Verifies .secrets.baseline exists and passes detect-secrets audit.
#   2. Runs sync_tracked_files.py --fix to re-hash CODEX_MANIFEST and
#      agent_context entries in the baseline.
#   3. If new false-positive secrets are found only in test/fixture files,
#      auto-adds `# pragma: allowlist secret` and commits the fix.
#   4. If genuine new secrets are detected, fails hard and posts a rescue
#      comment with remediation steps.
#
# This replaces secrets_baseline_check.yml.disabled (which was read-only).

'on':
  push:
    branches:
      - "automated/**"
      - "copilot/**"
      - "0D_base_"
      - "main"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  enforce-baseline:
    name: 🔐 Enforce Secrets Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          cache: pip
          python-version: "3.12.13"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Verify .secrets.baseline exists
        run: |
          if [ ! -f ".secrets.baseline" ]; then
            echo "::error title=Missing Baseline::.secrets.baseline not found — run: detect-secrets scan > .secrets.baseline"
            exit 1
          fi
          echo "✅ .secrets.baseline present"

      # ── Sync tracked-file hashes in baseline ──────────────────────────────
      - name: Sync tracked file hashes
        run: |
          python scripts/ci/sync_tracked_files.py --fix 2>&1 | tee /tmp/sync_output.txt
          if grep -q "FAIL\|ERROR" /tmp/sync_output.txt; then
            echo "::warning::sync_tracked_files reported issues — check output above"
          fi

      - name: Stage updated baseline after sync
        run: |
          # Stage the baseline updated by sync_tracked_files.py so detect-secrets-hook
          # doesn't fail with "baseline is unstaged" (SECRETS_BASELINE_001 fix)
          git add .secrets.baseline || true

      # ── Scan for new untracked secrets ────────────────────────────────────
      - name: Scan for new secrets not in baseline
        id: scan
        run: |
          set +e
          # detect-secrets scan against the current baseline
          # --list-all-plugins ensures consistent plugin set
          OUTPUT=$(detect-secrets-hook --baseline .secrets.baseline \
            $(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files) \
            2>&1)
          EXIT=$?
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" > /tmp/secrets_scan.txt

          # If the baseline was updated (but not yet staged), stage it now.
          # This handles the case where detect-secrets-hook auto-updates the baseline
          # for line-number consistency and makes it unstaged.
          if grep -q "Your baseline file.*is unstaged" /tmp/secrets_scan.txt || \
             grep -q "The baseline file was updated" /tmp/secrets_scan.txt; then
            git add .secrets.baseline
            echo "✅ Staged updated baseline"
          fi

          if [ "$EXIT" -ne 0 ]; then
            echo "::warning::detect-secrets found potential new secrets"
            cat /tmp/secrets_scan.txt
          else
            echo "✅ No new secrets detected"
          fi

      # ── Auto-fix false positives ───────────────────────────────────────────
      # Supports: test/fixture files, examples, .codex/ (all files), docs/accountability/, docs/reference/, k8s/, manifests/
      - name: Auto-fix false positives in test/fixture/documentation files
        id: autofix
        if: steps.scan.outputs.exit_code != '0'
        run: |
          FIXED=0
          while IFS= read -r line; do
            # Pattern: "Location:    path/to/file.py:NN"
            if [[ "$line" =~ ^Location:[[:space:]]+([^:]+):([0-9]+) ]]; then
              FILE="${BASH_REMATCH[1]}"
              LINENO="${BASH_REMATCH[2]}"
              # Auto-fix patterns — only file types that can safely accept trailing `# pragma: allowlist secret`:
              # 1. Test/fixture/example files (.py, .sh, .yml, .yaml, .md, .jsonl)
              # 2. .codex/aftermath/*.jsonl (structured logs, safe for trailing comments)
              # 3. .codex/ YAML/shell/Python/Markdown/JSONL only (not all JSON)
              # 4. docs/accountability/ YAML/shell/Python/Markdown/JSONL only
              # 5. docs/reference/ YAML/shell/Python/Markdown/JSONL only
              # 6. k8s/ and manifests/ YAML only (not JSON)
              if [[ "$FILE" =~ ^(((tests/|src/.*/tests/|examples/|fixtures/|\.github/misc/).+\.(py|sh|yml|yaml|md|jsonl))|test_.+(py|sh|yml|yaml|md|jsonl)|(\.codex/aftermath/.+\.jsonl)|(\.codex/.+\.(py|sh|yml|yaml|md|jsonl))|(docs/accountability/.+\.(py|sh|yml|yaml|md|jsonl))|(docs/reference/.+\.(py|sh|yml|yaml|md|jsonl))|(k8s/.+\.ya?ml)|(manifests/.+\.ya?ml))$ ]]; then
                echo "🔧 Adding pragma to $FILE:$LINENO"
                # Append pragma to the flagged line if not already present
                if ! sed -n "${LINENO}p" "$FILE" | grep -q "pragma: allowlist secret"; then
                  sed -i "${LINENO}s/\$/ # pragma: allowlist secret/" "$FILE"
                  echo "  ✅ Patched $FILE:$LINENO"
                else
                  echo "  ℹ️  Already has pragma: $FILE:$LINENO"
                fi
                FIXED=$((FIXED+1))
              else
                echo "::error title=Real Secret Found::$FILE:$LINENO — not a test/fixture/doc file; manual review required"
              fi
            fi
          done < /tmp/secrets_scan.txt

          echo "fixed=$FIXED" >> "$GITHUB_OUTPUT"
          if [ "$FIXED" -gt 0 ]; then
            echo "fixed_files=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Re-scan after auto-fix to confirm clean ───────────────────────────
      - name: Re-scan after pragma fixes
        if: steps.autofix.outputs.fixed_files == 'true'
        run: |
          detect-secrets-hook --baseline .secrets.baseline \
            $(git diff --name-only 2>/dev/null || echo "") \
            2>&1 | tee /tmp/rescan.txt || {
              echo "::error::Secrets still found after auto-fix — manual review required"
              cat /tmp/rescan.txt
              exit 1
            }
          echo "✅ Re-scan clean after auto-fix"

      # ── Commit pragma fixes + baseline sync ───────────────────────────────
      - name: Commit baseline + pragma fixes
        if: |
          steps.autofix.outputs.fixed_files == 'true' &&
          github.event_name != 'pull_request'
        run: |
          git config user.name  "copilot-swe-agent[bot]"
          git config user.email "198982749+Copilot@users.noreply.github.com"
          git add .secrets.baseline
          git add -u  # stage any pragma-patched files
          if ! git diff --cached --quiet; then
            git commit -m "fix(ci): auto-sync .secrets.baseline and add pragma to test false-positives [skip ci]"
            
            # ──────────────────────────────────────────────────────────────────
            # Handle non-fast-forward conflicts from concurrent workflows
            # Pattern: Fetch latest remote state, rebase if behind, then push
            # ──────────────────────────────────────────────────────────────────
            TARGET_BRANCH="main"
            REMOTE="origin"
            PUSH_ATTEMPTS=0
            MAX_ATTEMPTS=3
            
            while [ $PUSH_ATTEMPTS -lt $MAX_ATTEMPTS ]; do
              PUSH_ATTEMPTS=$((PUSH_ATTEMPTS + 1))
              echo "[Attempt $PUSH_ATTEMPTS/$MAX_ATTEMPTS] Pushing to $REMOTE/$TARGET_BRANCH..."
              
              # Try to push
              if git push $REMOTE $TARGET_BRANCH 2>&1 | tee /tmp/push_output.txt; then
                echo "✅ Committed baseline update and pushed to $REMOTE/$TARGET_BRANCH"
                exit 0
              fi
              
              # Push failed — check if it's a non-fast-forward error
              if grep -q "non-fast-forward\|rejected.*non-fast-forward" /tmp/push_output.txt; then
                echo "⚠️ [Attempt $PUSH_ATTEMPTS] Non-fast-forward conflict detected. Fetching latest and rebasing..."
                
                # Fetch latest remote state
                if ! git fetch $REMOTE $TARGET_BRANCH --no-tags 2>&1 | tee /tmp/fetch_output.txt; then
                  echo "::error title=Fetch Failed::Unable to fetch $REMOTE/$TARGET_BRANCH"
                  exit 1
                fi
                
                # Check if local is behind remote or if local is ahead
                if git merge-base --is-ancestor HEAD $REMOTE/$TARGET_BRANCH 2>/dev/null; then
                  echo "ℹ️  Local branch is behind remote; performing fast-forward merge..."
                  if ! git merge --ff-only $REMOTE/$TARGET_BRANCH; then
                    echo "::error title=Fast-Forward Merge Failed::Unable to fast-forward merge from $REMOTE/$TARGET_BRANCH"
                    exit 1
                  fi
                  echo "✅ Fast-forward merge successful"
                elif git log --oneline $REMOTE/$TARGET_BRANCH..HEAD 2>/dev/null | grep -q .; then
                  echo "ℹ️  Local has commits ahead of remote; rebasing onto $REMOTE/$TARGET_BRANCH..."
                  if ! git rebase $REMOTE/$TARGET_BRANCH; then
                    echo "::error title=Rebase Failed::Unable to rebase onto $REMOTE/$TARGET_BRANCH"
                    git rebase --abort || true
                    exit 1
                  fi
                  echo "✅ Rebase successful"
                fi
                
                # Retry push after merge/rebase
                continue
              else
                # Push failed for a different reason (not non-fast-forward)
                echo "::error title=Push Failed::Push failed (non-conflict reason): $(cat /tmp/push_output.txt | tail -5)"
                exit 1
              fi
            done
            
            # Exhausted retry attempts
            echo "::error title=Push Failed After Retries::Unable to push after $MAX_ATTEMPTS attempts"
            exit 1
          else
            echo "Nothing to commit"
          fi

      # ── Hard fail if genuine secrets remain unfixed ───────────────────────
      - name: Fail on genuine unfixed secrets
        if: |
          steps.scan.outputs.exit_code != '0' &&
          steps.autofix.outputs.fixed_files != 'true'
        run: |  # pragma: allowlist secret
          echo "::error title=Secrets Detected::New secrets found that are not in .secrets.baseline"  # pragma: allowlist secret
          echo ""
          echo "Captured detect-secrets output:"
          cat /tmp/secrets_scan.txt || true
          echo ""
          echo "Remediation options:"
          echo "  1. If false positive: add '# pragma: allowlist secret' to the flagged line."
          echo "  2. If real secret:   rotate it immediately and remove from codebase."
          echo "  3. Update baseline:  python scripts/ci/sync_tracked_files.py --fix && detect-secrets scan --baseline .secrets.baseline"
          exit 1

      # ── Always run sync_tracked_files after any changes ───────────────────
      - name: Final baseline integrity check
        run: |
          python scripts/ci/sync_tracked_files.py 2>&1
          echo "✅ Baseline integrity confirmed"

  # ── Rescue comment on failure ──────────────────────────────────────────────
  rescue-comment:
    name: Post rescue comment
    runs-on: ubuntu-latest
    needs: enforce-baseline
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    timeout-minutes: 5
    steps:
      - name: Post rescue comment
        uses: actions/github-script@v8  # v9
        with:
          github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          script: |
            const MAX_COMMENT_LENGTH = 65536; // GitHub comment body limit
            const MARKER = '<!-- secrets-baseline-enforcer -->';
            const RUN_MARKER = `<!-- secrets-baseline-enforcer-run:${context.runId} -->`;
            const secretsSettingsUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/settings/secrets`;
            const section = [
              RUN_MARKER,
              `## 🔐 Secrets Baseline Enforcer — Action Required`,
              ``,
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ``,
              `A new file added in this PR contains a string that \`detect-secrets\` flags.`,
              ``,
              `### Remediation`,
              `\`\`\`bash`,
              `# Option A — false positive in test/fixture file:`,
              `#   Add this comment to the flagged line:`,
              `#   # pragma: allowlist secret`,
              ``,
              `# Option B — update baseline (after adding pragma):`,
              `python scripts/ci/sync_tracked_files.py --fix`,
              `git add .secrets.baseline`,
              `git commit -m "fix(ci): update .secrets.baseline"`,
              `\`\`\``,
              ``,
              `> **Never** commit real secrets.  If a real credential was accidentally`,
              `> committed, rotate it immediately via [GitHub Settings → Secrets](${secretsSettingsUrl}).`,
            ].join('\n');

            let existing = null;
            for (let page = 1; ; page += 1) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
                page,
              });
              if (!Array.isArray(comments) || comments.length === 0) break;
              existing = comments.find(c =>
                (c.body || '').includes(MARKER) ||
                (c.body || '').includes('## 🔐 Secrets Baseline Enforcer — Action Required')
              );
              if (existing || comments.length < 100) break;
            }

            if (existing) {
              const existingBody = existing.body || '';
              if (existingBody.includes(RUN_MARKER)) {
                core.info(`Secrets baseline comment already contains run ${context.runId}; skipping duplicate.`);
              } else {
                const body = [
                  existingBody.includes(MARKER) ? existingBody.trimEnd() : `${MARKER}\n${existingBody.trimEnd()}`,
                  `---`,
                  section,
                ].join('\n').slice(0, MAX_COMMENT_LENGTH);
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${MARKER}\n${section}`,
              });
            }
