name: Workflow Compliance Audit (actionlint)

on:
  pull_request:
    paths:
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-workflows:
    name: actionlint — Workflow Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 1

      - name: Install actionlint
        run: |
          # Pinned version with fallback to latest
          PINNED="v1.7.7"

          # Download JSON file first, then parse (safer than curl | python3)
          RELEASES_JSON="/tmp/releases.json"
          curl -fsSL -o "$RELEASES_JSON" --max-time 10 \
            "https://api.github.com/repos/rhysd/actionlint/releases/latest" 2>/dev/null || true

          # Parse safely with python3 (file, not pipe)
          if [ -f "$RELEASES_JSON" ]; then
            LATEST=$(python3 -c \
              "import sys,json; print(json.load(open('$RELEASES_JSON'))['tag_name'])" \
              2>/dev/null || echo "${PINNED}")
          else
            LATEST="${PINNED}"
          fi

          TARGET="${LATEST:-${PINNED}}"
          VERSION="${TARGET#v}"

          # Download file first, then extract (safer than curl | tar)
          TARBALL="/tmp/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/${TARGET}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar xz -f "$TARBALL" -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/
          actionlint --version

      - name: Run actionlint on all workflows
        id: actionlint
        run: |
          mapfile -t WORKFLOW_FILES < <(find .github/workflows -maxdepth 1 -name '*.yml' | sort)
          actionlint -format '{{range $e := .}}::error file={{$e.Filepath}},line={{$e.Line}}::{{$e.Message}}{{end}}' "${WORKFLOW_FILES[@]}" 2>&1 | tee /tmp/actionlint_results.txt || true
          ERROR_COUNT=$(grep -c "::error" /tmp/actionlint_results.txt 2>/dev/null; true)
          echo "error_count=${ERROR_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${ERROR_COUNT}" -gt 0 ]; then
            echo "::error::actionlint found ${ERROR_COUNT} workflow compliance issue(s)"
            exit 1
          fi
          echo "✅ actionlint: 0 errors across $(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l) workflow files"

      - name: Post summary
        if: always()
        run: |
          {
            echo "## Workflow Compliance Audit (actionlint)"
            echo ""
            if [ -f /tmp/actionlint_results.txt ] && [ -s /tmp/actionlint_results.txt ]; then
              echo "\`\`\`"
              cat /tmp/actionlint_results.txt
              echo "\`\`\`"
            else
              TOTAL=$(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l)
              echo "✅ No issues found across ${TOTAL} workflow files."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: lint-workflows
    if: 'failure() && github.event_name == ''pull_request'' && github.event.pull_request.head.repo.full_name == github.repository'
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: Actionlint Workflow Audit
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py || true
