name: Workflow Compliance Audit (actionlint)

# Phase 6: Continuous workflow compliance linting with actionlint.
# Tier-1 hard gate: exits 1 on syntax errors in .github/workflows/*.yml
#
# actionlint checks:
#   - Workflow YAML syntax
#   - Expression syntax (${{ }})
#   - Job/step name correctness
#   - Unknown action references
#
# References:
#   docs/plans/Agentic_AI_System/soft_to_GROUNDED.md Domain 7
#   https://github.com/rhysd/actionlint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: actionlint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: "actionlint — Workflow Compliance"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install actionlint
        run: |
          # Pinned version with fallback to latest on API failure
          PINNED="v1.7.7"
          LATEST=$(curl -fsSL --max-time 10 https://api.github.com/repos/rhysd/actionlint/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])" 2>/dev/null \
            || echo "${PINNED}")
          TARGET="${LATEST:-${PINNED}}"
          VERSION="${TARGET#v}"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/${TARGET}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          sudo mv actionlint /usr/local/bin/
          actionlint --version

      - name: Run actionlint on all workflows
        id: actionlint
        run: |
          # Run and capture output; save to file for summary
          # shellcheck disable=SC2016  # Go template syntax, not shell variables
          actionlint \
            -format '{{range $e := .}}::error file={{$e.Filepath}},line={{$e.Line}}::{{$e.Message}}{{end}}' \
            .github/workflows/*.yml 2>&1 | tee /tmp/actionlint_results.txt || true

          ERROR_COUNT=$(grep -c "::error" /tmp/actionlint_results.txt 2>/dev/null; true)
          echo "error_count=${ERROR_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "${ERROR_COUNT}" -gt 0 ]; then
            echo "::error::actionlint found ${ERROR_COUNT} workflow compliance issue(s) — see annotations above"
            exit 1
          fi
          echo "✅ actionlint: 0 errors across $(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l) workflow files"

      - name: Post rescue comment on actionlint failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BRANCH_REF: ${{ github.head_ref }}
        with:
          script: |
            const MAX_COMMENT_LENGTH = 65536;
            const sha = context.payload.pull_request.head.sha;
            const shaShort = sha.substring(0, 12);
            const runId = '${{ github.run_id }}';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${runId}`;
            const branch = process.env.BRANCH_REF || '';
            const now = new Date().toISOString().replace('T', ' ').substring(0, 16) + 'Z';
            const marker = `<!-- ci-rescue-rca:${shaShort} -->`;
            const workflowName = 'Workflow Compliance Audit (actionlint)';

            const rescueBody = [
              '## 🚨 CI Rescue — @copilot Fix Required',
              '',
              `**Workflow:** \`${workflowName}\``,
              `**Run:** [${runId}](${runUrl})`,
              `**Branch:** \`${branch}\``,
              `**Commit:** \`${sha}\``,
              `**Time:** ${now}`,
              '',
              `@copilot The **${workflowName}** check is failing on commit \`${shaShort}\`.`,
              '',
              '**Steps to resolve:**',
              '1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)',
              `2. Check the failure logs: [${runId}](${runUrl})`,
              '3. Fix any `actionlint` errors in `.github/workflows/` — common fixes:',
              '   - Untrusted context values (e.g. `github.head_ref`) must be passed via env vars, not directly in `run:` scripts',
              '   - Use `env: MY_VAR: <context-value>` and reference `$MY_VAR` in the script',
              '4. Apply the minimal fix and push',
              '5. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`',
              '5. Verify all CI checks are green before concluding',
              '',
              '> **Note:** This comment is updated (not duplicated) for each subsequent',
              `> failure on commit \`${shaShort}\`. Each new failure appends a 🔄 section below.`,
              '',
              '_Posted by: actionlint-audit.yml → rescue comment (S213-cont2)_',
            ].join('\n');

            const fullBody = `${marker}\n${rescueBody}`;
            const appendSection = `\n\n---\n\n### 🔄 Failure Update — ${now}\n\n**Run:** [${runId}](${runUrl})\n\n@copilot \`${workflowName}\` failed again on the same commit \`${shaShort}\`. Please investigate [run #${runId}](${runUrl}) and apply the fix.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              const updated = (existing.body.trimEnd() + appendSection).substring(0, MAX_COMMENT_LENGTH);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: updated,
              });
              console.log(`Appended failure update to existing rescue comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
              console.log('Posted new rescue comment');
            }

      - name: Post summary
        if: always()
        run: |
          {
            echo "## Workflow Compliance Audit (actionlint)"
            echo ""
            if [ -f /tmp/actionlint_results.txt ] && [ -s /tmp/actionlint_results.txt ]; then
              echo "\`\`\`"
              cat /tmp/actionlint_results.txt
              echo "\`\`\`"
            else
              TOTAL=$(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l)
              echo "✅ No issues found across ${TOTAL} workflow files."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
