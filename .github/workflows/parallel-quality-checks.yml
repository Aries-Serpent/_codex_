---
name: Parallel Quality Checks (Optimized)

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - src/**
      - tests/**
      - scripts/**
      - pyproject.toml
      - .github/workflows/parallel-quality-checks.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  determine-scope:
    # Temporarily disabled for PR #5328 to reduce workflow queue
    if: ${{ github.event.pull_request.number != 5328 }}
    name: Determine Check Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-linting: ${{ steps.scope.outputs.run-linting }}
      run-types: ${{ steps.scope.outputs.run-types }}
      run-security: ${{ steps.scope.outputs.run-security }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine which checks to run
        id: scope
        run: |
          # Check if Python files changed
          if git diff --name-only origin/main..HEAD 2>/dev/null | grep -E '\.(py|pyi)$'; then
            echo "run-linting=true" >> $GITHUB_OUTPUT
            echo "run-types=true" >> $GITHUB_OUTPUT
            echo "run-security=true" >> $GITHUB_OUTPUT
          else
            echo "run-linting=false" >> $GITHUB_OUTPUT
            echo "run-types=false" >> $GITHUB_OUTPUT
            echo "run-security=false" >> $GITHUB_OUTPUT
          fi

  # Run all quality checks in parallel
  ruff-lint:
    name: Ruff Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: determine-scope
    if: needs.determine-scope.outputs.run-linting == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: pip install ruff
      - name: Run Ruff linting
        run: |
          echo "## Ruff Linting Results" >> $GITHUB_STEP_SUMMARY
          ruff check src/ tests/ --output-format=github >> $GITHUB_STEP_SUMMARY 2>&1 || true
          ruff check src/ tests/ --statistics >> $GITHUB_STEP_SUMMARY 2>&1 || true

  mypy-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: determine-scope
    if: needs.determine-scope.outputs.run-types == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install mypy
        run: pip install mypy
      - name: Run mypy type checking
        continue-on-error: true
        run: |
          echo "## Type Checking (mypy)" >> $GITHUB_STEP_SUMMARY
          mypy src/ --ignore-missing-imports --no-error-summary 2>&1 | tee mypy-output.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -20 mypy-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  bandit-security:
    name: Security Analysis (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: determine-scope
    if: needs.determine-scope.outputs.run-security == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run Bandit security analysis
        run: |
          echo "## Security Analysis (Bandit)" >> $GITHUB_STEP_SUMMARY
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt | tee bandit-output.txt

          CRITICAL_COUNT=$(jq '[.results[] | select(.severity == "HIGH" and .confidence == "HIGH")] | length' bandit-report.json 2>/dev/null || echo "0")
          echo "**Critical Issues:** ${CRITICAL_COUNT}" >> $GITHUB_STEP_SUMMARY
          tail -20 bandit-output.txt >> $GITHUB_STEP_SUMMARY || true

          if [ "${CRITICAL_COUNT}" -gt 0 ]; then
            echo "::error::Bandit found ${CRITICAL_COUNT} CRITICAL security issues"
            exit 1
          fi

  quality-summary:
    name: Quality Checks Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [determine-scope, ruff-lint, mypy-check, bandit-security]
    if: always()
    steps:
      - name: Generate quality summary
        run: |
          echo "## 📊 Quality Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Parallel Execution Results" >> $GITHUB_STEP_SUMMARY
          echo "- Ruff Linting: ${{ needs.ruff-lint.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type Checking (mypy): ${{ needs.mypy-check.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Analysis: ${{ needs.bandit-security.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time:** ~15 minutes (parallel execution instead of ~40 min sequential)" >> $GITHUB_STEP_SUMMARY
