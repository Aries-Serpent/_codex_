name: Autonomous Agent Runtime

on:
  workflow_dispatch:
    inputs:
      agent_task:
        description: 'Task for the autonomous agent to execute'
        required: true
        type: string
      model_preference:
        description: 'Preferred model (auto, gpt-4o, o1-mini, etc.)'
        required: false
        default: 'auto'
        type: string
      max_tokens:
        description: 'Maximum response tokens'
        required: false
        default: '8192'
        type: string

  # Allow triggering from other workflows
  workflow_call:
    inputs:
      agent_task:
        required: true
        type: string
      model_preference:
        required: false
        default: 'auto'
        type: string
    secrets:
      GITHUB_CODEX:
        required: true

jobs:
  execute-agent:
    name: Execute Autonomous Agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'common'
