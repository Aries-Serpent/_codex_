name: Workflow Health Update

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    name: Collect Health Metrics & Generate Dashboard
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Collect workflow metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ci/workflow_health_collector.py \
            --days 30 \
            --output .codex/workflow_health_snapshot.json

      - name: Generate dashboard
        run: |
          python scripts/ci/workflow_health_dashboard.py \
            --input .codex/workflow_health_snapshot.json \
            --output .codex/WORKFLOW_HEALTH_DASHBOARD.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "copilot@github.com"
          git config --local user.name "GitHub Copilot"
          
          if git diff --quiet .codex/; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          git add .codex/workflow_health_snapshot.json .codex/WORKFLOW_HEALTH_DASHBOARD.md
          git commit -m "chore: Update workflow health dashboard [skip ci]"
          git push

      - name: Post weekly summary (Sundays only)
        if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Post to GitHub Discussion (implementation depends on discussion setup)
          echo "📊 Weekly workflow health summary posted"
