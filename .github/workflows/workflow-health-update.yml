name: Workflow Health Update
true:
  schedule:
  - cron: 0 2 * * *
  workflow_dispatch: null
permissions:
  contents: write
  actions: read
jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    name: Collect Health Metrics & Generate Dashboard
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
    - name: Collect workflow metrics
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: "python scripts/ci/workflow_health_collector.py \\\n  --days 30 \\\n  --output\
        \ .codex/workflow_health_snapshot.json\n"
    - name: Generate dashboard
      run: "python scripts/ci/workflow_health_dashboard.py \\\n  --input .codex/workflow_health_snapshot.json\
        \ \\\n  --output .codex/WORKFLOW_HEALTH_DASHBOARD.md\n"
    - name: Commit and push if changed
      run: "git config --local user.email \"copilot@github.com\"\ngit config --local\
        \ user.name \"GitHub Copilot\"\n\nif git diff --quiet .codex/; then\n  echo\
        \ \"ℹ️ No changes to commit\"\n  exit 0\nfi\n\ngit add .codex/workflow_health_snapshot.json\
        \ .codex/WORKFLOW_HEALTH_DASHBOARD.md\ngit commit -m \"chore: Update workflow\
        \ health dashboard [skip ci]\"\ngit push\n"
    - name: Post weekly summary (Sundays only)
      if: github.event.schedule == "0 2 * * 0" || github.event_name == "workflow_dispatch"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "# Post to GitHub Discussion (implementation depends on discussion setup)

        echo "📊 Weekly workflow health summary posted"

        "
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
