# CodeQL Chunked Analysis Workflow
#
# Phase 19.0: 100% Coverage Push - CodeQL Solution
# Created: 2026-01-18
#
# This workflow solves the CodeQL 10MB size limit by:
# 1. Splitting the codebase into directory-based chunks
# 2. Running CodeQL analysis on each chunk separately
# 3. Merging SARIF results into a unified report
#
# Problem: Repository size is 22,786,897 bytes (22MB), exceeding 10MB limit
# Solution: Analyze chunks of ~2-4MB each, then merge results
#
# yamllint disable rule:line-length
---
name: CodeQL Chunked Analysis

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**/*.py"
      - "agents/**/*.py"
      - "training/**/*.py"
      - "scripts/**/*.py"
  pull_request:
    branches:
      - main
    paths:
      - "src/**/*.py"
      - "agents/**/*.py"
      - "training/**/*.py"
      - "scripts/**/*.py"
  schedule:
    # Weekly full scan on Monday at 6 AM UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      chunk:
        description: "Specific chunk to analyze (leave empty for all)"
        required: false
        default: ""
      full_scan:
        description: "Run full scan (ignore size limits)"
        type: boolean
        default: false

permissions:
  security-events: write
  contents: read
  actions: read

env:
  # Size limit per chunk in bytes (9MB to be safe)
  CHUNK_SIZE_LIMIT: 9000000

jobs:
  # Job 1: Determine which chunks need analysis
  chunk-discovery:
    name: Discover Chunks
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.discover.outputs.chunks }}
      should_run: ${{ steps.discover.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover and Size Chunks
        id: discover
        run: |
          # Define chunks with their paths
          declare -A CHUNKS
          CHUNKS[core]="src/codex/"
          CHUNKS[ml]="src/codex_ml/"
          CHUNKS[agents]="agents/"
          CHUNKS[training]="training/"
          CHUNKS[scripts]="scripts/"
          
          # Build chunk matrix
          CHUNK_JSON='['
          FIRST=true
          
          for name in "${!CHUNKS[@]}"; do
            path="${CHUNKS[$name]}"
            
            # Check if path exists
            if [ -d "$path" ]; then
              # Calculate size
              size=$(du -sb "$path" 2>/dev/null | cut -f1 || echo "0")
              
              # Add to matrix
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                CHUNK_JSON+=','
              fi
              
              CHUNK_JSON+="{\"name\":\"$name\",\"path\":\"$path\",\"size\":$size}"
              
              # Log size info
              size_mb=$(echo "scale=2; $size / 1048576" | bc)
              echo "Chunk '$name' ($path): ${size_mb}MB"
              
              # Warn if approaching limit
              if [ "$size" -gt 8000000 ]; then
                echo "::warning::Chunk '$name' is approaching 10MB limit (${size_mb}MB)"
              fi
            else
              echo "Path $path does not exist, skipping"
            fi
          done
          
          CHUNK_JSON+=']'
          
          echo "chunks=$CHUNK_JSON" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          
          echo "Chunk matrix: $CHUNK_JSON"

  # Job 2: Analyze each chunk in parallel
  analyze-chunk:
    name: Analyze ${{ matrix.chunk.name }}
    needs: chunk-discovery
    if: needs.chunk-discovery.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.chunk-discovery.outputs.chunks) }}
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: .codeql/codeql-config.yml
          queries: security-extended

      - name: Create chunk-specific paths file
        run: |
          echo "Analyzing chunk: ${{ matrix.chunk.name }}"
          echo "Path: ${{ matrix.chunk.path }}"
          echo "Size: ${{ matrix.chunk.size }} bytes"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python/chunk:${{ matrix.chunk.name }}"
          output: sarif-results
          upload: false

      - name: Upload Chunk SARIF
        uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ matrix.chunk.name }}
          path: sarif-results/*.sarif
          retention-days: 7

  # Job 3: Merge all SARIF results
  merge-results:
    name: Merge SARIF Results
    needs: analyze-chunk
    runs-on: ubuntu-latest
    if: always() && needs.analyze-chunk.result != 'cancelled'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download All SARIF Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sarif-*
          path: sarif-chunks
          merge-multiple: true

      - name: Merge SARIF Files
        run: |
          python scripts/merge_sarif.py \
            --input-dir sarif-chunks \
            --output merged-results.sarif \
            --validate

      - name: Upload Merged SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: merged-results.sarif
          category: full-chunked-analysis

      - name: Archive Merged Results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-merged-results
          path: merged-results.sarif
          retention-days: 30

  # Job 4: Generate size report
  size-report:
    name: Size Report
    needs: chunk-discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Size Report
        run: |
          echo "# CodeQL Chunk Size Report" > size-report.md
          echo "" >> size-report.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> size-report.md
          echo "" >> size-report.md
          echo "| Directory | Size (bytes) | Size (MB) | Status |" >> size-report.md
          echo "|-----------|--------------|-----------|--------|" >> size-report.md
          
          for dir in src/codex src/codex_ml agents training scripts tests; do
            if [ -d "$dir" ]; then
              size=$(du -sb "$dir" 2>/dev/null | cut -f1 || echo "0")
              size_mb=$(echo "scale=2; $size / 1048576" | bc)
              
              if [ "$size" -gt 9000000 ]; then
                status="⚠️ Warning"
              elif [ "$size" -gt 8000000 ]; then
                status="🟡 Approaching"
              else
                status="✅ OK"
              fi
              
              echo "| $dir | $size | ${size_mb}MB | $status |" >> size-report.md
            fi
          done
          
          # Total
          total=$(du -sb . --exclude='.git' 2>/dev/null | cut -f1 || echo "0")
          total_mb=$(echo "scale=2; $total / 1048576" | bc)
          echo "" >> size-report.md
          echo "**Total repository size:** ${total_mb}MB" >> size-report.md
          
          cat size-report.md
          
          echo "## Summary" >> "$GITHUB_STEP_SUMMARY"
          cat size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Size Report
        uses: actions/upload-artifact@v4
        with:
          name: codeql-size-report
          path: size-report.md
          retention-days: 30
