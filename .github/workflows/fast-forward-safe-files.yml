name: "\u26A1 Fast-Forward Safe Files to Main"
'on':
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to promote safe files FROM (required, e.g. 3856)
        type: number
        required: true
      target_branch:
        description: 'Branch to promote files INTO (default: main)'
        type: string
        default: main
        required: false
      merge_mode:
        description: 'How to apply the promotion: ''create-pr'' opens a new PR for
          review (safe default), ''direct-push'' commits straight to the target branch
          (maintainer only)

          '
        type: choice
        options:
        - create-pr
        - direct-push
        default: create-pr
        required: false
      files:
        description: 'Comma-separated list of specific files to promote. Leave blank
          to use the full allowlist from .codex/fast_forward_allowlist.yaml

          '
        type: string
        default: ''
        required: false
      dry_run:
        description: "Dry run \u2014 show what WOULD be promoted, make NO changes"
        type: boolean
        default: true
        required: false
      commit_message:
        description: Optional custom commit message (leave blank for auto-generated)
        type: string
        default: ''
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  preflight:
    name: "\U0001F50D Preflight \u2014 classify PR  #${{ inputs.pr_number }} files"
    runs-on: ubuntu-latest
    outputs:
      allowed_count: ${{ steps.classify.outputs.allowed_count }}
      denied_count: ${{ steps.classify.outputs.denied_count }}
      plan_json: ${{ steps.classify.outputs.plan_json }}
    steps:
    - name: Checkout (scripts + allowlist only)
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: 'scripts/ci/fast_forward_safe_files.py

          .codex/fast_forward_allowlist.yaml

          '
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.12
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Install PyYAML
      run: pip install pyyaml --quiet
    - name: Classify files (dry run)
      id: classify
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        FF_DRY_RUN: '1'
      run: "# Parse optional files list\nFILES_ARG=\"\"\nif [ -n \"${{ inputs.files\
        \ }}\" ]; then\n  # Convert comma-separated list to --files a b c\n  FILES=$(echo\
        \ \"${{ inputs.files }}\" | tr ',' ' ')\n  FILES_ARG=\"--files $FILES\"\n\
        fi\n\npython scripts/ci/fast_forward_safe_files.py \\\n  --repo \"$GITHUB_REPOSITORY\"\
        \ \\\n  --token \"$GITHUB_TOKEN\" \\\n  --pr \"${{ inputs.pr_number }}\" \\\
        \n  --target \"${{ inputs.target_branch || 'main' }}\" \\\n  --dry-run \\\n\
        \  --output /tmp/ff_plan.json \\\n  $FILES_ARG\n\n# Extract counts for preflight\
        \ gate\nALLOWED=$(python3 -c \"import json; d=json.load(open('/tmp/ff_plan.json'));\
        \ print(len(d.get('would_promote',[])))\")\nDENIED=$(python3 -c \"import json;\
        \ d=json.load(open('/tmp/ff_plan.json')); print(len(d.get('would_deny',[])))\"\
        )\nPLAN=$(cat /tmp/ff_plan.json)\n\necho \"allowed_count=$ALLOWED\" >> \"\
        $GITHUB_OUTPUT\"\necho \"denied_count=$DENIED\"   >> \"$GITHUB_OUTPUT\"\n\
        # Store compact JSON for downstream job\necho \"plan_json=$(echo $PLAN | python3\
        \ -c 'import sys,json; print(json.dumps(json.load(sys.stdin)))')\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Write preflight summary
      run: "python3 - <<'PYEOF'\nimport json, os\ndata = json.load(open('/tmp/ff_plan.json'))\n\
        promote  = data.get('would_promote', [])\nexclude  = data.get('would_exclude',\
        \ [])\ndeny     = data.get('would_deny', [])\nlines = [\n    \"## \u26A1 Fast-Forward\
        \ Preflight\\n\",\n    f\"**PR:**  #{data.get('pr_number', '?')}  \"\n   \
        \ f\"**Source:** `{data.get('pr_branch','?')}@{data.get('source_sha','?')[:8]}`\
        \  \"\n    f\"**Target:** `{data.get('target_branch','?')}`\\n\",\n    \"\
        ---\",\n    f\"### \u2705 Would promote ({len(promote)} files)\",\n]\nlines\
        \ += [f\"- `{f}`\" for f in promote] or [\"_none_\"]\nlines += [f\"\\n###\
        \ \u23ED\uFE0F Excluded \u2014 not in allowlist ({len(exclude)} files)\"]\n\
        lines += [f\"- `{f}`\" for f in exclude] or [\"_none_\"]\nlines += [f\"\\\
        n### \U0001F6AB Denied \u2014 blocked by denylist ({len(deny)} files)\"]\n\
        lines += [f\"- `{f}`\" for f in deny] or [\"_none_\"]\nif deny:\n    lines\
        \ += [\"\\n> \u26A0\uFE0F **Denied files will NOT be promoted.** Edit `.codex/fast_forward_allowlist.yaml`\
        \ to change this.\"]\nwith open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as\
        \ f:\n    f.write('\\n'.join(lines) + '\\n')\nPYEOF\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  promote:
    name: "\u26A1 Promote (${{ inputs.merge_mode || 'create-pr' }}, dry=${{ inputs.dry_run\
      \ }})"
    needs: preflight
    runs-on: ubuntu-latest
    if: needs.preflight.outputs.allowed_count != '0'
    steps:
    - name: Checkout (scripts + allowlist only)
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: 'scripts/ci/fast_forward_safe_files.py

          .codex/fast_forward_allowlist.yaml

          '
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.12
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Install PyYAML
      run: pip install pyyaml --quiet
    - name: Execute promotion
      id: promote
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: "# Parse optional files list\nFILES_ARG=()\nif [ -n \"${{ inputs.files\
        \ }}\" ]; then\n  IFS=',' read -ra _FILES <<< \"${{ inputs.files }}\"\n  FILES_ARG=(--files\
        \ \"${_FILES[@]}\")\nfi\n\n# Build dry-run flag\nDRY_FLAG=()\nif [ \"${{ inputs.dry_run\
        \ }}\" = \"true\" ]; then\n  DRY_FLAG=(--dry-run)\nfi\n\n# Build commit message\
        \ flag\nMSG_FLAG=()\nif [ -n \"${{ inputs.commit_message }}\" ]; then\n  MSG_FLAG=(--commit-message\
        \ \"${{ inputs.commit_message }}\")\nfi\n\npython scripts/ci/fast_forward_safe_files.py\
        \ \\\n  --repo \"$GITHUB_REPOSITORY\" \\\n  --token \"$GITHUB_TOKEN\" \\\n\
        \  --pr \"${{ inputs.pr_number }}\" \\\n  --target \"${{ inputs.target_branch\
        \ || 'main' }}\" \\\n  --merge-mode \"${{ inputs.merge_mode || 'create-pr'\
        \ }}\" \\\n  --output /tmp/ff_result.json \\\n  \"${DRY_FLAG[@]}\" \"${FILES_ARG[@]}\"\
        \ \"${MSG_FLAG[@]}\"\n"
    - name: Upload result artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: /tmp/ff_result.json
        retention-days: 30
        name: fast-forward-result-pr${{ inputs.pr_number }}-${{ github.run_id }}
    - name: Write result summary
      if: always()
      run: "[ -f /tmp/ff_result.json ] || { echo \"No result file.\" >> \"$GITHUB_STEP_SUMMARY\"\
        ; exit 0; }\npython3 - <<'PYEOF'\nimport json, os\ndata = json.load(open('/tmp/ff_result.json'))\n\
        status = data.get('status', 'unknown')\nicons = {\n    'dry-run': '\U0001F515\
        \ DRY RUN',\n    'pr-created': '\u2705 PR Created',\n    'direct-pushed':\
        \ '\U0001F680 Direct-Pushed',\n    'nothing-to-promote': '\u23ED\uFE0F Nothing\
        \ to Promote',\n}\nlabel = icons.get(status, f'\u2753 {status}')\nlines =\
        \ [f\"## \u26A1 Fast-Forward Result \u2014 {label}\\n\"]\nif status == 'pr-created':\n\
        \    lines += [\n        f\"**Fast-Forward PR:** [#{data['fast_forward_pr']}]({data['fast_forward_pr_url']})\"\
        ,\n        f\"**Staging branch:** `{data['staging_branch']}`\",\n        \"\
        \",\n    ]\nelif status == 'direct-pushed':\n    lines += [\n        f\"**Pushed\
        \ to:** `{data['target_branch']}`\",\n        f\"**New SHA:** `{data.get('new_sha','?')[:8]}`\"\
        ,\n        \"\",\n    ]\npromoted = data.get('files_promoted') or data.get('would_promote',\
        \ [])\nif promoted:\n    lines += [f\"### Files promoted ({len(promoted)})\"\
        ]\n    lines += [f\"- `{f}`\" for f in promoted]\nwith open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as f:\n    f.write('\\n'.join(lines) + '\\n')\nPYEOF\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
