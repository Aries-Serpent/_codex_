name: Data Quality & Determinism Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, "0D_base_", "copilot/integrate-codex-status-template", "master"]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'training/**'
      - 'tokenization/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation mode'
        required: true
        type: choice
        options:
          - validation-only
          - determinism-only
          - full-suite
        default: 'full-suite'

permissions:
  contents: read
  pull-requests: write

env:
  # Enforce deterministic behavior
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  RANDOM_SEED: "42"
  # Thread control for deterministic execution
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  # ML framework determinism
  TF_DETERMINISTIC_OPS: "1"
  CUBLAS_WORKSPACE_CONFIG: ":4096:8"


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # ── 💰 Cost Gate ─────────────────────────────────────────────────────────────
  # YELLOW/RED tier: 3 jobs × 60 min = 180 effective minutes
  cost-gate:
    name: "💰 Cost Gate"
    uses: ./.github/workflows/cost-gate.yml
    with:
      workflow_name: "Data Quality & Determinism Suite"
      runner: "ubuntu-latest"
      timeout_minutes: 60
      matrix_count: 3
      pushes_to_ghcr: false
    permissions:
      contents: read
      pull-requests: write

  data_validation:
    name: Data Validation (Manifest & Drift)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: cost-gate
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'validation-only' || inputs.mode == 'full-suite'))

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'ephemeral'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          # Install codex package with test dependencies
          # This includes codex_ml.data.validator and all required modules
          # Pin pytest plugins (PR #3248)
          # Pin pytest plugins before package install (PR #3248 stability fix)
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0


          pip install -e ".[test]"

      - name: Validate data manifests
        run: |
          # Use validate_dataset.py which exists in the repository
          if [ ! -f "scripts/validate_dataset.py" ]; then
            echo "❌ Error: Dataset validation script not found at scripts/validate_dataset.py"
            exit 1
          fi
          # Find and validate all dataset manifest files
          manifests=$(find data/ -name '*manifest*.json' -type f 2>/dev/null || true)
          if [ -z "$manifests" ]; then
            echo "⚠️  No dataset manifest files found in data/ — skipping validation"
            exit 0
          fi
          fail=0
          for manifest in $manifests; do
            echo "Validating: $manifest"
            python scripts/validate_dataset.py "$manifest" --check-splits || fail=1
          done
          exit $fail

      - name: Check for data drift
        run: |
          if [ -f "scripts/check_data_drift.py" ]; then
            python scripts/check_data_drift.py
          else
            echo "⚠️  Warning: Data drift check script not found - skipping drift analysis"
            echo "This is expected if drift detection is not yet implemented"
          fi

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: data-validation-results-${{ github.run_number }}
          path: |
            reports/validation/*.json
            reports/drift/*.json
          if-no-files-found: ignore
          retention-days: 30

  determinism_check:
    name: Determinism & Audit Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'determinism-only' || inputs.mode == 'full-suite'))

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space for CI
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h

          # Remove unnecessary packages to free space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          # Clean apt caches
          sudo apt-get clean

          # Remove Docker images if present
          docker rmi $(docker images -q) 2>/dev/null || true

          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'live'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Clear Python caches
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          rm -rf .pytest_cache
          echo "✅ Python caches cleared"

      - name: Run determinism validation
        run: |
          echo "=== Checking for deterministic behavior ==="
          echo "PYTHONHASHSEED=$PYTHONHASHSEED"
          echo "RANDOM_SEED=$RANDOM_SEED"
          echo "OMP_NUM_THREADS=$OMP_NUM_THREADS"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Determinism Check" >> $GITHUB_STEP_SUMMARY
          echo "- PYTHONHASHSEED: $PYTHONHASHSEED" >> $GITHUB_STEP_SUMMARY
          echo "- RANDOM_SEED: $RANDOM_SEED" >> $GITHUB_STEP_SUMMARY
          echo "- Thread count: $OMP_NUM_THREADS" >> $GITHUB_STEP_SUMMARY

      - name: Run determinism tests (first pass)
        id: test_pass1
        run: |
          set +e
          pytest tests/ -v -m determinism --tb=short --timeout=300 > determinism_pass1.log 2>&1
          echo "$?" > determinism_pass1_exit.txt
          set -e
          echo "✅ First pass complete (exit code: $(cat determinism_pass1_exit.txt))"

      - name: Run determinism tests (second pass)
        id: test_pass2
        run: |
          set +e
          pytest tests/ -v -m determinism --tb=short --timeout=300 > determinism_pass2.log 2>&1
          echo "$?" > determinism_pass2_exit.txt
          set -e
          echo "✅ Second pass complete (exit code: $(cat determinism_pass2_exit.txt))"

      - name: Compare results
        run: |
          EXIT1=$(cat determinism_pass1_exit.txt)
          EXIT2=$(cat determinism_pass2_exit.txt)

          # Check if logs exist
          if [ ! -f "determinism_pass1.log" ] || [ ! -f "determinism_pass2.log" ]; then
            echo "❌ Missing log files - determinism check failed"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Determinism check failed** - Missing log files" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Compare exit codes
          if [ "$EXIT1" != "$EXIT2" ]; then
            echo "❌ Exit codes differ - non-deterministic behavior"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Non-deterministic behavior** - Exit codes differ (pass1: $EXIT1, pass2: $EXIT2)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Handle exit code 5 (no tests collected) as success
          if [ "$EXIT1" = "5" ] && [ "$EXIT2" = "5" ]; then
            echo "⚠️  No determinism tests found (exit code 5) - skipping validation"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️  **No determinism tests found** - Tests are not yet implemented" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To implement determinism tests:" >> $GITHUB_STEP_SUMMARY
            echo "- Add @pytest.mark.determinism to tests in tests/templates/test_ml_template.py" >> $GITHUB_STEP_SUMMARY
            echo "- Remove @pytest.mark.skip decorators when tests are ready" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Handle exit code 2 (collection errors) when no tests with marker exist
          # Exit code 2 typically means internal error or collection failures
          # Check if the logs indicate "no tests collected" despite collection errors
          if [ "$EXIT1" = "2" ] && [ "$EXIT2" = "2" ]; then
            # Check if both logs show "0 selected" (no tests matched the marker)
            SELECTED1=$(grep -E "0 selected" determinism_pass1.log || echo "")
            SELECTED2=$(grep -E "0 selected" determinism_pass2.log || echo "")

            # If both runs had collection errors but 0 tests selected, treat as "no tests"
            if [ -n "$SELECTED1" ] && [ -n "$SELECTED2" ]; then
              echo "⚠️  Collection errors but no determinism tests selected (exit code 2)"
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️  **No determinism tests found** - Collection errors present but no tests selected" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Details:" >> $GITHUB_STEP_SUMMARY
              echo "- pytest returned exit code 2 (collection errors) instead of 5 (no tests collected)" >> $GITHUB_STEP_SUMMARY
              echo "- This occurs when other test files have import errors during collection" >> $GITHUB_STEP_SUMMARY
              echo "- No tests with @pytest.mark.determinism were found or executed" >> $GITHUB_STEP_SUMMARY
              echo "- Both test runs had identical results, so behavior is deterministic" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "To implement determinism tests:" >> $GITHUB_STEP_SUMMARY
              echo "- Add @pytest.mark.determinism to relevant test functions" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            # Otherwise, treat exit code 2 as a failure
            echo "❌ Collection errors during test execution (exit code 2)"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Collection errors detected** - Both runs failed with exit code 2" >> $GITHUB_STEP_SUMMARY
            echo "Exit code 2 indicates pytest internal errors or collection failures" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # If both runs failed with a non-zero exit code (excluding 2 and 5), treat as error
          if [ "$EXIT1" != "0" ]; then
            echo "❌ Both test runs failed with exit code $EXIT1"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Test failures detected** - Both runs failed with exit code $EXIT1" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Compare log outputs
          if diff -u determinism_pass1.log determinism_pass2.log > determinism_diff.log; then
            echo "✅ Deterministic behavior confirmed - results identical"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Determinism verified** - Test results are identical across runs" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Non-deterministic behavior detected - results differ"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️  **Warning**: Non-deterministic behavior detected" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            head -50 determinism_diff.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload determinism reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: determinism-reports-${{ github.run_number }}
          path: |
            determinism_pass1.log
            determinism_pass2.log
            determinism_diff.log
          if-no-files-found: ignore
          retention-days: 30

  unified_summary:
    name: Generate Unified Summary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [data_validation, determinism_check]
    if: always()

    steps:
      - name: Generate comprehensive summary
        run: |
          echo "## 🔬 Data Quality & Determinism Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.mode || github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Data Validation: ${{ needs.data_validation.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Determinism Check: ${{ needs.determinism_check.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Manifest validation completed" >> $GITHUB_STEP_SUMMARY
          echo "- Data drift analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "- Determinism tests run twice for comparison" >> $GITHUB_STEP_SUMMARY

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow data-quality-suite --health 2>/dev/null || echo '{"status": "cache health check skipped"}'

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: unified_summary
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Data Quality Suite"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
