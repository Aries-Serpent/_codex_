name: Art_Data Quality & Determinism Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, "0D_base_", "copilot/integrate-codex-status-template", "master"]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'training/**'
      - 'tokenization/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation mode'
        required: true
        type: choice
        options:
          - validation-only
          - determinism-only
          - full-suite
        default: 'full-suite'

permissions:
  contents: read
  pull-requests: write

env:
  # Enforce deterministic behavior
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  RANDOM_SEED: "42"
  # Thread control for deterministic execution
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  # ML framework determinism
  TF_DETERMINISTIC_OPS: "1"
  CUBLAS_WORKSPACE_CONFIG: ":4096:8"

jobs:
  data_validation:
    name: Data Validation (Manifest & Drift)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'validation-only' || inputs.mode == 'full-suite'))

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'ephemeral'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml pandas

      - name: Validate data manifests
        run: |
          if [ -f "scripts/validate_manifest.py" ]; then
            python scripts/validate_manifest.py --all
          else
            echo "Manifest validation script not found"
          fi

      - name: Check for data drift
        run: |
          if [ -f "scripts/check_data_drift.py" ]; then
            python scripts/check_data_drift.py
          else
            echo "Data drift check script not found"
          fi

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: data-validation-results-${{ github.run_number }}
          path: |
            reports/validation/*.json
            reports/drift/*.json
          if-no-files-found: ignore
          retention-days: 30

  determinism_check:
    name: Determinism & Audit Validation
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'determinism-only' || inputs.mode == 'full-suite'))

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space for CI
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h

          # Remove unnecessary packages to free space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean apt caches
          sudo apt-get clean

          # Remove Docker images if present
          docker rmi $(docker images -q) 2>/dev/null || true

          echo "=== Disk usage after cleanup ==="
          df -h

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'live'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Clear Python caches
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          rm -rf .pytest_cache
          echo "✅ Python caches cleared"

      - name: Run determinism validation
        run: |
          echo "=== Checking for deterministic behavior ==="
          echo "PYTHONHASHSEED=$PYTHONHASHSEED"
          echo "RANDOM_SEED=$RANDOM_SEED"
          echo "OMP_NUM_THREADS=$OMP_NUM_THREADS"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Determinism Check" >> $GITHUB_STEP_SUMMARY
          echo "- PYTHONHASHSEED: $PYTHONHASHSEED" >> $GITHUB_STEP_SUMMARY
          echo "- RANDOM_SEED: $RANDOM_SEED" >> $GITHUB_STEP_SUMMARY
          echo "- Thread count: $OMP_NUM_THREADS" >> $GITHUB_STEP_SUMMARY

      - name: Run determinism tests (first pass)
        id: test_pass1
        run: |
          pytest tests/ -v -m determinism --tb=short > determinism_pass1.log 2>&1 || true
          echo "✅ First pass complete"

      - name: Run determinism tests (second pass)
        id: test_pass2
        run: |
          pytest tests/ -v -m determinism --tb=short > determinism_pass2.log 2>&1 || true
          echo "✅ Second pass complete"

      - name: Compare results
        run: |
          if diff -u determinism_pass1.log determinism_pass2.log > determinism_diff.log; then
            echo "✅ Deterministic behavior confirmed - results identical"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Determinism verified** - Test results are identical across runs" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Non-deterministic behavior detected - results differ"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️  **Warning**: Non-deterministic behavior detected" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            head -50 determinism_diff.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload determinism reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: determinism-reports-${{ github.run_number }}
          path: |
            determinism_pass1.log
            determinism_pass2.log
            determinism_diff.log
          if-no-files-found: ignore
          retention-days: 30

  unified_summary:
    name: Generate Unified Summary
    runs-on: ubuntu-latest
    needs: [data_validation, determinism_check]
    if: always()

    steps:
      - name: Generate comprehensive summary
        run: |
          echo "## 🔬 Data Quality & Determinism Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.mode || github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Data Validation: ${{ needs.data_validation.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Determinism Check: ${{ needs.determinism_check.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Manifest validation completed" >> $GITHUB_STEP_SUMMARY
          echo "- Data drift analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "- Determinism tests run twice for comparison" >> $GITHUB_STEP_SUMMARY
