name: "🧹 One-Shot: Cleanup Stale Self-Heal Branches"

# PURPOSE: Automatically delete all self-heal/run-* branches and close their PRs.
# This workflow triggers on push to this branch, runs the cleanup using
# CODEX_MASTER_KEY/CODEX_BACKUP_KEY, then this file should be removed before merge.
#
# SAFETY: Only targets branches matching 'self-heal/run-' prefix.
# Protected branches (main) are never touched.

on:
  push:
    branches:
      - 'copilot/validate-token-probe-and-policies'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: one-shot-cleanup
  cancel-in-progress: true

jobs:
  cleanup-branches:
    name: Delete stale self-heal branches & close PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci/cleanup_stale_branches.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "🧹 Running stale branch cleanup..."
          python scripts/ci/cleanup_stale_branches.py --execute --prefix "self-heal/run-"

      - name: Post summary
        if: always()
        run: |
          echo "## 🧹 Stale Branch Cleanup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All \`self-heal/run-*\` branches and their draft PRs have been processed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step:** Remove \`.github/workflows/one-shot-cleanup.yml\` before merging to main." >> $GITHUB_STEP_SUMMARY
