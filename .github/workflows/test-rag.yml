name: RAG Module Tests

"on":
  push:
    branches: [main, develop, copilot/**]
    paths:
      - 'src/codex/rag/**'
      - 'tests/test_rag_**'
      - 'pyproject.toml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/codex/rag/**'
      - 'tests/test_rag_**'
      - 'pyproject.toml'


permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test-rag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      # Cache sentence-transformers models (small, ~400MB, high value)
      # This significantly reduces test time by avoiding model re-downloads
      - name: Cache sentence-transformers models
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/torch/sentence_transformers
          key: ${{ runner.os }}-sentence-transformers-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-sentence-transformers-py${{ matrix.python-version }}-
            ${{ runner.os }}-sentence-transformers-

      # Note: pip cache remains disabled due to disk space constraints with large ML dependencies
      # Caching pip packages consumes significant disk space (~3-5GB) when restoring
      # and compounds with build artifacts, causing "No space left on device" errors
      # during installation of torch, transformers, and other RAG dependencies.

      - name: Free disk space
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h
          echo ""
          echo "=== Removing large system packages ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo ""
          echo "=== Cleaning Docker and apt cache ==="
          sudo docker system prune --all --force --volumes
          sudo apt-get clean
          echo ""
          echo "=== Disk space AFTER cleanup ==="
          df -h

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install the main package FIRST (may install older plugin versions)
          pip install --no-cache-dir -e ".[rag,test]"
          # Then force reinstall pytest plugins with pinned versions
          # This ensures xdist workers have correct versions at consistent paths
          pip install --no-cache-dir --force-reinstall \
            pytest==9.0.2 \
            pytest-cov==7.0.0 \
            pytest-xdist==3.8.0 \
            pytest-timeout==2.3.1 \
            pytest-rerunfailures==14.0 \
            pytest-randomly==3.16.0 \
            'coverage>=7.10.6,<8'
          # Verify plugins are installed and discoverable
          python -c "import pytest_cov; import xdist; import pytest_timeout; print('All pytest plugins verified')"
          python -m pytest --version

      - name: Pre-download embedding models
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from sentence_transformers import SentenceTransformer
          import os
          cache_dir = os.path.expanduser('~/.cache/torch/sentence_transformers')
          os.makedirs(cache_dir, exist_ok=True)
          print('Pre-downloading sentence-transformers model...')
          # Use token only when non-empty to avoid 'Illegal header value b\"Bearer \"' error
          hf_token = os.getenv('HF_TOKEN') or None
          model = SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2',
                                      cache_folder=cache_dir,
                                      token=hf_token)
          print(f'Model cached successfully to {cache_dir}')
          "

      - name: Run RAG tests with coverage
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          RAG_OPENAI_KEY: ${{ secrets.RAG_OPENAI_KEY }}
        run: |
          # Ensure plugins are loaded before running tests
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"

          # Run RAG tests serially to avoid xdist worker plugin-discovery failures
          # (workers crash when pytest-cov/timeout aren't auto-discoverable in the worker env)
          #
          # --cov-config=tests/rag/.coveragerc scopes coverage to src/codex/rag only,
          # preventing the global .coveragerc `source=src` from diluting the line-rate.
          # (S235 fix: on main branch `--cov=src` was measuring all of src/ with only
          # RAG tests running → 5 % line-rate; this config isolates the RAG module.)
          python -m pytest tests/test_rag_*.py tests/rag/ \
            -v \
            --tb=short --timeout=300 \
            --cov=src/codex/rag \
            --cov-config=tests/rag/.coveragerc \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: rag-modules
          name: rag-coverage-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 30
          if-no-files-found: warn

      - name: Check coverage threshold
        run: |
          # Parse coverage from XML report
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          print(float(root.attrib['line-rate']) * 100)
          ")
          echo "Coverage: ${COVERAGE}%"
          # Minimum coverage threshold — raised incrementally each S-session.
          # Baseline is ~27.5%; raised from 27% → 30% in S195, 30% → 35% in S197, 35% → 40% in S198, 40% → 45% in S199, 45% → 50% in S200, 50% → 60% in S201 (2026-03-25), 60% → 70% in S203 (2026-03-25), 70% → 80% in S204 (2026-03-25), 80% → 85% in S209 (2026-03-26), 85% → 90% in S211 (2026-03-26), 90% → 95% in S212 (2026-03-26).
          # Long-term target achieved: 95%.
          if (( $(echo "$COVERAGE < 95" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below 95% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets 95% threshold"

      - name: Security scan
        run: |
          pip install bandit
          bandit -r src/codex/rag/ -f txt -o bandit-report.txt || true
          # Ensure file exists even if bandit fails or produces no output
          touch bandit-report.txt
          if [ -s bandit-report.txt ]; then
            cat bandit-report.txt
          else
            echo "No security issues found by Bandit" > bandit-report.txt
            cat bandit-report.txt
          fi

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow test-rag --health 2>/dev/null || echo '{"status": "cache health check skipped"}'

      - name: Upload security report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: security-report-${{ matrix.python-version }}
          path: bandit-report.txt
          retention-days: 30
          if-no-files-found: warn

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: test-rag
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Test RAG"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
