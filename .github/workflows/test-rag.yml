name: RAG Module Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths:
      - 'src/codex/rag/**'
      - 'tests/test_rag_**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/codex/rag/**'
      - 'tests/test_rag_**'
      - 'pyproject.toml'

jobs:
  test-rag:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rag,test]"
          pip install pytest-cov pytest-xdist
      
      - name: Run RAG tests with coverage
        run: |
          pytest tests/test_rag_*.py \
            --cov=src/codex/rag \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v \
            --tb=short
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: rag-modules
          name: rag-coverage-${{ matrix.python-version }}
      
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 30
      
      - name: Check coverage threshold
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below 90% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"
      
      - name: Security scan
        run: |
          pip install bandit
          bandit -r src/codex/rag/ -f txt -o bandit-report.txt || true
          cat bandit-report.txt
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report-${{ matrix.python-version }}
          path: bandit-report.txt
          retention-days: 30
