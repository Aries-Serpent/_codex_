name: Generate SBOM

on:
  workflow_dispatch:
  push:
    branches:
      - 0D_base_
      - main
      - develop
      - work
  pull_request:
    branches:
      - 0D_base_
      - main
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: CI diagnostic - list repo and show Makefile header
        run: |
          echo "Listing repo files:"
          ls -la
          echo "Show Makefile (first 200 lines):"
          sed -n '1,200p' Makefile || true

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'common'
