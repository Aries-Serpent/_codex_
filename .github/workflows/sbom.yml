name: Art_Generate SBOM
on:
  workflow_call:
    secrets:
      GH_TOKEN:
        description: GitHub token for API access
        required: false
  workflow_dispatch: {}
  push:
    branches:
    - 0D_base_
    - main
    - develop
    - work
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  pull_request:
    branches:
    - 0D_base_
    - main
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  release:
    types:
    - published
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Install SBOM tools
      run: 'pip install cyclonedx-bom pip-licenses --quiet

        echo "cyclonedx-bom $(cyclonedx-py --version 2>/dev/null || python -m cyclonedx.cli
        --version 2>/dev/null || echo ''installed'')"

        echo "pip-licenses $(pip-licenses --version 2>/dev/null || echo ''installed'')"

        '
    - name: Generate CycloneDX SBOM (JSON)
      run: "# Generate CycloneDX SBOM from installed Python packages\npython -m cyclonedx_py\
        \ env \\\n  --output-format json \\\n  --outfile sbom-cyclonedx.json \\\n\
        \  2>/dev/null || \\\npython -m cyclonedx.cli env \\\n  --output-format=json\
        \ \\\n  --outfile sbom-cyclonedx.json \\\n  2>/dev/null || \\\npip-licenses\
        \ \\\n  --format=json \\\n  --with-authors \\\n  --with-urls \\\n  --output-file\
        \ pip-licenses.json\necho \"SBOM generation complete\"\nls -la sbom-cyclonedx.json\
        \ pip-licenses.json 2>/dev/null || true\n"
    - name: Generate pip-licenses CSV report
      run: "pip-licenses \\\n  --format=csv \\\n  --with-authors \\\n  --with-urls\
        \ \\\n  --output-file sbom-licenses.csv || \\\npip list --format=columns >\
        \ sbom-licenses.csv\necho \"License report:\"\nhead -20 sbom-licenses.csv\n"
    - name: Validate SBOM exists and is non-empty
      run: "SBOM_FILE=\"\"\nif [ -f sbom-cyclonedx.json ]; then\n  SBOM_FILE=\"sbom-cyclonedx.json\"\
        \nelif [ -f pip-licenses.json ]; then\n  SBOM_FILE=\"pip-licenses.json\"\n\
        fi\nif [ -z \"$SBOM_FILE\" ]; then\n  echo \"\u26A0\uFE0F Warning: No SBOM\
        \ JSON generated (tool may not support this env); CSV fallback active\"\n\
        \  exit 0\nfi\nSIZE=$(wc -c < \"$SBOM_FILE\")\necho \"SBOM size: ${SIZE} bytes\"\
        \nif [ \"$SIZE\" -lt 100 ]; then\n  echo \"\u274C SBOM too small \u2014 generation\
        \ may have failed\"\n  exit 1\nfi\necho \"\u2705 SBOM validated: $SBOM_FILE\
        \ (${SIZE} bytes)\"\n"
    - name: Validate CycloneDX JSON structure (P2-03)
      run: "if [ ! -f sbom-cyclonedx.json ]; then\n  echo \"\u2139\uFE0F No CycloneDX\
        \ JSON found \u2014 skipping schema validation\"\n  exit 0\nfi\npython3 <<\
        \ 'PY'\nimport json\nimport sys\n\nwith open(\"sbom-cyclonedx.json\", \"r\"\
        , encoding=\"utf-8\") as f:\n    sbom = json.load(f)\n\n# CycloneDX minimal\
        \ required fields\nrequired_top_keys = {\"bomFormat\", \"specVersion\", \"\
        version\"}\nmissing = required_top_keys - set(sbom.keys())\nif missing:\n\
        \    print(f\"\u274C CycloneDX SBOM missing required top-level keys: {missing}\"\
        , file=sys.stderr)\n    sys.exit(1)\n\nif sbom.get(\"bomFormat\") != \"CycloneDX\"\
        :\n    print(f\"\u274C bomFormat is not 'CycloneDX': {sbom.get('bomFormat')}\"\
        , file=sys.stderr)\n    sys.exit(1)\n\ncomponents = sbom.get(\"components\"\
        , [])\nprint(f\"\u2705 CycloneDX SBOM valid \u2014 specVersion={sbom['specVersion']!r},\
        \ \"\n      f\"{len(components)} component(s) listed\")\nPY\n"
    - name: Upload SBOM artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: 'sbom-cyclonedx.json

          pip-licenses.json

          sbom-licenses.csv

          '
        if-no-files-found: warn
        retention-days: 90
        name: sbom-${{ github.run_id }}
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow sbom 2>/dev/null
        || echo "Cache health: check skipped"

        '
      env:
        GH_TOKEN: ${{ github.token }}
    timeout-minutes: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: sbom
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        token: ${{ github.token }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: SBOM Generation
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
