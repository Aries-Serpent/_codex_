name: Generate SBOM

on:
  workflow_dispatch:
  push:
    branches:
      - 0D_base_
      - main
      - develop
      - work
  pull_request:
    branches:
      - 0D_base_
      - main
  release:
    types: [published]

permissions:
  contents: read
  actions: write


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Install SBOM tools
        run: |
          pip install cyclonedx-bom pip-licenses --quiet
          echo "cyclonedx-bom $(cyclonedx-py --version 2>/dev/null || python -m cyclonedx.cli --version 2>/dev/null || echo 'installed')"
          echo "pip-licenses $(pip-licenses --version 2>/dev/null || echo 'installed')"

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          # Generate CycloneDX SBOM from installed Python packages
          python -m cyclonedx_py env \
            --output-format json \
            --outfile sbom-cyclonedx.json \
            2>/dev/null || \
          python -m cyclonedx.cli env \
            --output-format=json \
            --outfile sbom-cyclonedx.json \
            2>/dev/null || \
          pip-licenses \
            --format=json \
            --with-authors \
            --with-urls \
            --output-file pip-licenses.json
          echo "SBOM generation complete"
          ls -la sbom-cyclonedx.json pip-licenses.json 2>/dev/null || true

      - name: Generate pip-licenses CSV report
        run: |
          pip-licenses \
            --format=csv \
            --with-authors \
            --with-urls \
            --output-file sbom-licenses.csv || \
          pip list --format=columns > sbom-licenses.csv
          echo "License report:"
          head -20 sbom-licenses.csv

      - name: Validate SBOM exists and is non-empty
        run: |
          SBOM_FILE=""
          if [ -f sbom-cyclonedx.json ]; then
            SBOM_FILE="sbom-cyclonedx.json"
          elif [ -f pip-licenses.json ]; then
            SBOM_FILE="pip-licenses.json"
          fi
          if [ -z "$SBOM_FILE" ]; then
            echo "⚠️ Warning: No SBOM JSON generated (tool may not support this env); CSV fallback active"
            exit 0
          fi
          SIZE=$(wc -c < "$SBOM_FILE")
          echo "SBOM size: ${SIZE} bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "❌ SBOM too small — generation may have failed"
            exit 1
          fi
          echo "✅ SBOM validated: $SBOM_FILE (${SIZE} bytes)"

      - name: Validate CycloneDX JSON structure (P2-03)
        run: |
          if [ ! -f sbom-cyclonedx.json ]; then
            echo "ℹ️ No CycloneDX JSON found — skipping schema validation"
            exit 0
          fi
          python3 << 'PY'
          import json
          import sys

          with open("sbom-cyclonedx.json", "r", encoding="utf-8") as f:
              sbom = json.load(f)

          # CycloneDX minimal required fields
          required_top_keys = {"bomFormat", "specVersion", "version"}
          missing = required_top_keys - set(sbom.keys())
          if missing:
              print(f"❌ CycloneDX SBOM missing required top-level keys: {missing}", file=sys.stderr)
              sys.exit(1)

          if sbom.get("bomFormat") != "CycloneDX":
              print(f"❌ bomFormat is not 'CycloneDX': {sbom.get('bomFormat')}", file=sys.stderr)
              sys.exit(1)

          components = sbom.get("components", [])
          print(f"✅ CycloneDX SBOM valid — specVersion={sbom['specVersion']!r}, "
                f"{len(components)} component(s) listed")
          PY

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ github.run_id }}
          path: |
            sbom-cyclonedx.json
            pip-licenses.json
            sbom-licenses.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow sbom 2>/dev/null || echo "Cache health: check skipped"

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: sbom
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "SBOM Generation"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: sbom.yml → rescue-comment job (S227)_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
