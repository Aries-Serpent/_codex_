name: Generate SBOM

on:
  push:
    branches: [main, develop, work]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom

      - name: Generate SBOM
        run: |
          make -C config sbom
          echo "✅ SBOM generated"
          ls -lh dist/sbom.json

      - name: Validate SBOM
        run: |
          jq . dist/sbom.json > /dev/null && echo "✅ Valid JSON" || exit 1
          COMPONENTS=$(jq '.components | length' dist/sbom.json)
          echo "📦 Components: $COMPONENTS"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: dist/sbom.json
          retention-days: 90
          if-no-files-found: error

      - name: Attach to release (on release only)
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/sbom.json
          asset_name: sbom-${{ github.event.release.tag_name }}.json
          asset_content_type: application/json
