name: Generate SBOM

on:
  workflow_dispatch:
  push:
    branches:
      - 0D_base_
  pull_request:
    branches:
      - 0D_base_

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI diagnostic - list repo and show Makefile header
        run: |
          echo "Listing repo files:"
          ls -la
          echo "Show Makefile (first 200 lines):"
          sed -n '1,200p' Makefile || true

      - name: Ensure config artifacts
        run: |
          if [ -f Makefile ] && grep -qE '^[[:space:]]*config:' Makefile; then
            make config
          else
            echo "::warning::No 'config' target in Makefile; creating minimal config/"
            mkdir -p config
            [ -f config/sample-sbom-config.yaml ] || cat > config/sample-sbom-config.yaml <<'YAML'
apiVersion: v1
sbom:
  output: sbom.json
  format: cyclonedx
YAML
          fi

      # Example placeholder for your SBOM generation tool
      # Replace with the actual command/tool used in this repository
      - name: Generate SBOM (placeholder)
        run: |
          echo "Generating SBOM using config/sample-sbom-config.yaml"
          echo '{ "sbom": "placeholder" }' > sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
