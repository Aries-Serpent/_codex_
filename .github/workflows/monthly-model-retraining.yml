name: Monthly Model Retraining

on:
  schedule:
    - cron: '0 2 1 * *'  # 2 AM UTC on 1st of each month
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining even if improvement threshold not met'
        required: false
        default: 'false'
      improvement_threshold:
        description: 'Minimum improvement % to deploy (default: 2)'
        required: false
        default: '2'

permissions:
  contents: write
  issues: write

jobs:
  model_retraining:
    name: Retrain Cognitive Models
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'common'
