name: Monthly Model Retraining

on:
  schedule:
    - cron: '0 2 1 * *'  # 2 AM UTC on 1st of each month
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining even if improvement threshold not met'
        required: false
        default: 'false'
      improvement_threshold:
        description: 'Minimum improvement % to deploy (default: 2)'
        required: false
        default: '2'

permissions:
  contents: write
  issues: write

jobs:
  model_retraining:
    name: Retrain Cognitive Models
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn tensorflow torch pandas numpy joblib
      
      - name: Execute Model Retraining
        id: retrain
        run: |
          THRESHOLD="${{ github.event.inputs.improvement_threshold || '2' }}"
          FORCE="${{ github.event.inputs.force_retrain || 'false' }}"
          
          python scripts/cognitive/model_retraining_automation.py \
            --training-data cognitive/meta_learning/training_data/ \
            --current-models cognitive/models/ \
            --output-dir cognitive/models_new/ \
            --improvement-threshold "$THRESHOLD" \
            --force-retrain "$FORCE" \
            --output cognitive/retraining/results.json
        continue-on-error: true
      
      - name: Evaluate Model Performance
        if: steps.retrain.outcome == 'success'
        id: evaluate
        run: |
          python -c "
          import json
          from pathlib import Path
          
          results_file = Path('cognitive/retraining/results.json')
          if results_file.exists():
              with open(results_file) as f:
                  results = json.load(f)
              
              improvement = results.get('improvement_percentage', 0)
              threshold = float('${{ github.event.inputs.improvement_threshold || '2' }}')
              
              print(f'Model improvement: {improvement}%')
              print(f'Threshold: {threshold}%')
              
              if improvement >= threshold:
                  print('✅ Improvement threshold met - deploying new models')
                  with open(Path(os.environ['GITHUB_OUTPUT']), 'a') as f:
                      f.write(f'deploy=true\n')
                      f.write(f'improvement={improvement}\n')
              else:
                  print(f'❌ Improvement below threshold ({improvement}% < {threshold}%)')
                  with open(Path(os.environ['GITHUB_OUTPUT']), 'a') as f:
                      f.write(f'deploy=false\n')
                      f.write(f'improvement={improvement}\n')
          "
      
      - name: Deploy New Models
        if: steps.evaluate.outputs.deploy == 'true'
        run: |
          echo "🚀 Deploying new models with ${{ steps.evaluate.outputs.improvement }}% improvement"
          
          # Backup current models
          mkdir -p cognitive/models_backup/$(date +%Y%m)
          cp -r cognitive/models/* cognitive/models_backup/$(date +%Y%m)/
          
          # Deploy new models
          rm -rf cognitive/models/*
          cp -r cognitive/models_new/* cognitive/models/
          
          # Update deployment metadata
          cat > cognitive/models/deployment_info.json << EOF
          {
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "improvement_percentage": ${{ steps.evaluate.outputs.improvement }},
            "previous_version_backup": "models_backup/$(date +%Y%m)",
            "workflow_run": "${{ github.run_number }}"
          }
          EOF
      
      - name: Rollback on Failure
        if: steps.retrain.outcome == 'failure' && steps.evaluate.outputs.deploy == 'true'
        run: |
          echo "❌ Model deployment failed - keeping current models"
          rm -rf cognitive/models_new
      
      - name: Generate Retraining Report
        if: always()
        run: |
          mkdir -p cognitive/reports
          cat > cognitive/reports/monthly_retraining_report.md << 'EOF'
          # Monthly Model Retraining Report
          
          **Date**: $(date -u +"%B %Y")
          **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## Retraining Summary
          
          | Metric | Value |
          |--------|-------|
          | Retraining Status | ${{ steps.retrain.outcome }} |
          | Improvement | ${{ steps.evaluate.outputs.improvement || 'N/A' }}% |
          | Deployment | ${{ steps.evaluate.outputs.deploy == 'true' && '✅ Deployed' || '❌ Not Deployed' }} |
          | Threshold | ${{ github.event.inputs.improvement_threshold || '2' }}% |
          
          ## Model Performance
          
          $([ -f cognitive/retraining/results.json ] && jq -r '.performance_metrics' cognitive/retraining/results.json || echo "No metrics available")
          
          ## Training Details
          
          - **Training Samples**: $([ -f cognitive/retraining/results.json ] && jq -r '.training_samples // "N/A"' cognitive/retraining/results.json || echo "N/A")
          - **Training Time**: $([ -f cognitive/retraining/results.json ] && jq -r '.training_time_seconds // "N/A"' cognitive/retraining/results.json || echo "N/A")s
          - **Models Retrained**: $([ -f cognitive/retraining/results.json ] && jq -r '.models_count // "N/A"' cognitive/retraining/results.json || echo "N/A")
          
          ## Next Steps
          
          ${{ steps.evaluate.outputs.deploy == 'true' && '- Monitor new model performance over next 7 days\n- Rollback available in models_backup/' || '- Continue collecting training data\n- Review threshold settings if needed' }}
          
          ---
          *Generated by Monthly Model Retraining*
          EOF
      
      - name: Upload Retraining Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retraining-results-${{ github.run_number }}
          path: |
            cognitive/retraining/
            cognitive/reports/monthly_retraining_report.md
          retention-days: 180
      
      - name: Commit Model Updates
        if: steps.evaluate.outputs.deploy == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add cognitive/models/
          git add cognitive/models_backup/
          git add cognitive/reports/monthly_retraining_report.md
          git commit -m "chore(cognitive): Deploy retrained models - ${{ steps.evaluate.outputs.improvement }}% improvement"
          git push
      
      - name: Create Deployment Issue
        if: steps.evaluate.outputs.deploy == 'true'
        run: |
          echo "📊 New models deployed with ${{ steps.evaluate.outputs.improvement }}% improvement"
          echo "Consider creating tracking issue for performance monitoring"
