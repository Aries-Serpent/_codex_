name: Data Validation (Manifest & Drift)

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  data-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.11'
          cache-tier: 'ephemeral'

