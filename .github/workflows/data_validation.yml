name: Data Validation (Manifest & Drift)

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  data-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Validate dataset manifest (if present)
        run: |
          if [ -f configs/schemas/dataset_manifest.schema.json ] && [ -f data/manifest.json ]; then
            python tools/schema_validate.py --data data/manifest.json --schema configs/schemas/dataset_manifest.schema.json
          else
            echo "Skipping dataset manifest validation"
          fi

      - name: Drift check (if stats available)
        run: |
          if [ -f data/train.stats.json ] && [ -f data/new.stats.json ]; then
            python tools/data_drift_check.py --ref data/train.stats.json --cur data/new.stats.json --threshold 0.2 || true
          else
            echo "Skipping drift check"
          fi
