name: CodeQL Advanced
on:
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: go
          build-mode: autobuild
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        - language: rust
          build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@5e316336eb4f107009e477d4bfbfff13d7250fae
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended
        config-file: ./.codeql/codeql-config.yml
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: 'echo "No manual build configured; switch build-mode to ''autobuild'' or
        add build commands here."

        exit 1

        '
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5e316336eb4f107009e477d4bfbfff13d7250fae
      with:
        category: /language:${{ matrix.language }}/advanced
        upload: never
        output: codeql-sarif-advanced/${{ matrix.language }}
    - name: Upload CodeQL SARIF artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: codeql-sarif-advanced-${{ matrix.language }}
        path: codeql-sarif-advanced/${{ matrix.language }}
        if-no-files-found: warn
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: "python scripts/ci/generate_cache_keys.py \\\n  --type pip --workflow codeql-advanced\
        \ --health 2>/dev/null \\\n  || echo '{\"status\": \"cache health check skipped\"\
        }'\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  post-codeql-auto-approve:
    name: "\u26A1 Auto-approve pending runs after CodeQL Advanced"
    runs-on: ubuntu-latest
    needs: analyze
    if: 'always() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      actions: write
      pull-requests: read
    timeout-minutes: 5
    steps:
    - name: Approve pending runs when WEC pre-approval checkbox is checked
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: "set -euo pipefail\n\nif [ -z \"${PR_NUMBER}\" ]; then\n  echo \"No PR\
        \ number \u2014 skipping post-CodeQL auto-approve.\"\n  exit 0\nfi\n\nif !\
        \ gh api \"repos/${REPO}/actions/runs?per_page=1\" --silent 2>/dev/null; then\n\
        \  echo \"\u26A0\uFE0F  GH_TOKEN lacks actions:read/write \u2014 skipping.\"\
        \n  exit 0\nfi\n\nPR_BODY=$(gh pr view \"${PR_NUMBER}\" --repo \"${REPO}\"\
        \ \\\n  --json body -q '.body // \"\"' 2>/dev/null || echo \"\")\n\nSESSION_DONE_CHECKED=0\n\
        AUTO_APPROVE_CHECKED=0\nprintf '%s' \"$PR_BODY\" | grep -qiE '^\\-\\s*\\[x\\\
        ]\\s*copilot-agent-session-done\\.yml' \\\n  && SESSION_DONE_CHECKED=1 ||\
        \ true\nprintf '%s' \"$PR_BODY\" | grep -qiE '^\\-\\s*\\[x\\]\\s*auto-approve-workflows'\
        \ \\\n  && AUTO_APPROVE_CHECKED=1 || true\n\nif [ \"$SESSION_DONE_CHECKED\"\
        \ = \"0\" ] && [ \"$AUTO_APPROVE_CHECKED\" = \"0\" ]; then\n  echo \"No WEC\
        \ pre-approval checkbox checked \u2014 skipping.\"\n  exit 0\nfi\n\necho \"\
        \u26A1 WEC pre-approval detected \u2014 approving action_required runs for\
        \ SHA ${HEAD_SHA:0:12}...\"\n\nPENDING_BY_SHA=$(gh api \\\n  \"repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&status=action_required&per_page=100\"\
        \ \\\n  --jq '.workflow_runs[].id' 2>/dev/null || echo \"\")\n\nPENDING_BY_WFR=$(gh\
        \ api \\\n  \"repos/${REPO}/actions/runs?event=workflow_run&status=action_required&per_page=100\"\
        \ \\\n  --jq '.workflow_runs[] | select(.created_at | fromdateiso8601 > (now\
        \ - 3600)) | .id' \\\n  2>/dev/null || echo \"\")\n\nPENDING_RUNS=$(printf\
        \ \"%s\\n%s\\n\" \"$PENDING_BY_SHA\" \"$PENDING_BY_WFR\" \\\n  | sort -u |\
        \ grep -v '^[[:space:]]*$' || echo \"\")\n\nif [ -z \"$PENDING_RUNS\" ]; then\n\
        \  echo \"\u2705 No pending runs requiring approval.\"\n  exit 0\nfi\n\nAPPROVED=0\n\
        while IFS= read -r RUN_ID; do\n  [ -z \"$RUN_ID\" ] && continue\n  if gh api\
        \ --method POST \"repos/${REPO}/actions/runs/${RUN_ID}/approve\" \\\n    --silent\
        \ 2>/dev/null; then\n    echo \"  \u2705 Approved run #${RUN_ID}\"\n    APPROVED=$((APPROVED\
        \ + 1))\n  else\n    echo \"  \u26A0\uFE0F  Could not approve run #${RUN_ID}\
        \ (may already be approved)\"\n  fi\ndone <<< \"$PENDING_RUNS\"\n\necho \"\
        \u2705 Approved ${APPROVED} pending run(s).\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  rescue-comment:
    name: Post rescue comment on CodeQL Advanced failure
    runs-on: ubuntu-latest
    needs: analyze
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: CodeQL Advanced
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
