name: DependaBot Sheriff (Automated Consolidation)

# This workflow automatically consolidates Dependabot PRs
# Based on: https://github.com/kiba-d/dependabot-sheriff

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to merge into'
        required: false
        default: 'main'
        type: string
      assignee:
        description: 'GitHub username to assign the consolidated PR'
        required: false
        default: 'mbaetiong'
        type: string
      risk_level:
        description: 'Risk level filter (all, low, medium, high)'
        required: false
        default: 'low'
        type: choice
        options:
          - all
          - low
          - medium
          - high

  # Optional: Schedule weekly consolidation (commented out by default)
  # schedule:
  #   - cron: '0 10 * * 1'  # Every Monday at 10:00 UTC


permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  consolidate-dependabot-prs:
    name: Consolidate Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: "🔀 Resolve push target (chain: sub-PR → 0D_base_ → main)"
        id: resolve-target
        uses: ./.github/actions/resolve-push-target

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow dependabot-sheriff 2>/dev/null || echo "Cache health: check skipped"
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up GitHub CLI
        run: |
          # GitHub CLI is pre-installed on GitHub Actions runners
          gh --version

          # Authenticate with GitHub token
          echo "${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}" | gh auth login --with-token

      - name: Run DependaBot Sheriff
        id: consolidate
        env:
          BASE_BRANCH: ${{ inputs.base_branch != 'main' && inputs.base_branch || steps.resolve-target.outputs.branch }}
          DEPENDABOT_ASSIGNEE: ${{ inputs.assignee || 'mbaetiong' }}
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          # Make script executable
          chmod +x scripts/dependabot_sheriff.sh

          # Run the consolidation script
          ./scripts/dependabot_sheriff.sh

          # Capture exit code
          exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

          exit $exit_code

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dependabot-sheriff-logs
          path: .codex/logs/dependabot_sheriff_*.log
          retention-days: 30

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dependabot-sheriff-summary
          path: .codex/logs/dependabot_sheriff_summary_*.md
          retention-days: 30

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            // Find the latest log file
            const logFiles = fs.readdirSync('.codex/logs').filter(f => f.startsWith('dependabot_sheriff_'));

            if (logFiles.length === 0) {
              console.log('No log files found');
              return;
            }

            const latestLog = logFiles.sort().reverse()[0];
            const logPath = `.codex/logs/${latestLog}`;

            // Read last 50 lines of log
            const logContent = fs.readFileSync(logPath, 'utf8').split('\n').slice(-50).join('\n');

            // Create issue comment
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 DependaBot Sheriff Failed',
              body: `## DependaBot Sheriff Consolidation Failed

              **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              **Triggered by:** @${context.actor}
              **Date:** ${new Date().toISOString()}

              ### Error Log (last 50 lines)

              \`\`\`
              ${logContent}
              \`\`\`

              ### Next Steps

              1. Review the full log in the workflow artifacts
              2. Check for merge conflicts or failed CI checks
              3. Run the script manually if needed: \`./scripts/dependabot_sheriff.sh\`
              4. See troubleshooting guide: \`.codex/docs/DEPENDABOT_SHERIFF_GUIDE.md\`
              `,
              labels: ['dependabot', 'automation', 'bug']
            });

      - name: Post summary
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            // Find the latest summary file
            const summaryFiles = fs.readdirSync('.codex/logs').filter(f => f.startsWith('dependabot_sheriff_summary_'));

            if (summaryFiles.length === 0) {
              console.log('No summary files found');
              return;
            }

            const latestSummary = summaryFiles.sort().reverse()[0];
            const summaryPath = `.codex/logs/${latestSummary}`;
            const summaryContent = fs.readFileSync(summaryPath, 'utf8');

            // Post as job summary
            await core.summary
              .addRaw(summaryContent)
              .write();

            console.log('Summary posted successfully');
