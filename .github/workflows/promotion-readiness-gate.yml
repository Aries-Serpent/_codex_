name: Promotion Readiness Gate
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  promotion-readiness:
    name: "Promotion Readiness \u2014 0D_base_ \u2192 main"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Run promotion readiness gate
      id: gate
      run: "python scripts/ci/promotion_readiness_gate.py \\\n  --json-out .codex/promotion-readiness-report.json\n\
        GATE_EXIT=$?\necho \"exit_code=${GATE_EXIT}\" >> \"$GITHUB_OUTPUT\"\nexit\
        \ ${GATE_EXIT}\n"
      continue-on-error: true
    - name: Publish step summary
      if: always()
      run: "if [ -f .codex/promotion-readiness-report.json ]; then\n  python3 scripts/ci/promotion_readiness_summary.py\
        \ \\\n    --json-in .codex/promotion-readiness-report.json \\\n    --output\
        \ \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"## \u274C Promotion Readiness Gate\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n  echo \"Report file not generated \u2014 check\
        \ gate step logs.\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: Upload promotion readiness artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: .codex/promotion-readiness-report.json
        retention-days: 30
        if-no-files-found: warn
        name: promotion-readiness-report
    - name: Fail if gate blocked
      if: steps.gate.conclusion == 'failure' || steps.gate.outputs.exit_code != '0'
      run: "echo \"\u274C Promotion readiness gate failed \u2014 see step summary\
        \ for details.\"\nexit 1\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
