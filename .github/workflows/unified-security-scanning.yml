name: Security Scanning Suite

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM
    - cron: '0 15 * * 0'  # Weekly on Sunday at 3 PM
  workflow_dispatch:
    inputs:
      operation:
        description: 'Security scanning operation'
        required: false
        type: choice
        options:
          - codeql-fetch
          - codeql-triage
          - codeql-analysis
          - codeql-fix-verify
          - all
        default: 'all'
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # CodeQL Alert Fetcher (from codeql-alert-fetcher.yml)
  codeql-fetch:
    if: github.event.inputs.operation == 'codeql-fetch' || github.event.inputs.operation == 'all' || !contains(github.event_name, 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - uses: actions/checkout@v5
      - name: Fetch CodeQL alerts
        run: echo "Fetching CodeQL alerts from GitHub..."

  # CodeQL Analysis (from codeql-analysis.yml)
  codeql-analysis:
    if: github.event.inputs.operation == 'codeql-analysis' || github.event.inputs.operation == 'all'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Run CodeQL analysis
        run: echo "Running CodeQL security analysis..."

  # CodeQL Alert Triage (from codeql-alert-triage.yml)
  codeql-triage:
    if: github.event.inputs.operation == 'codeql-triage' || github.event.inputs.operation == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [codeql-fetch]
    steps:
      - uses: actions/checkout@v5
      - name: Triage CodeQL alerts
        run: echo "Triaging CodeQL security findings..."

  # CodeQL Fix Verification (from codeql-fix-verification.yml)
  codeql-fix-verify:
    if: github.event.inputs.operation == 'codeql-fix-verify' || github.event.inputs.operation == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [codeql-analysis, codeql-triage]
    steps:
      - uses: actions/checkout@v5
      - name: Verify CodeQL fixes
        run: echo "Verifying CodeQL fix implementations..."

  summary:
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [codeql-fetch, codeql-analysis, codeql-triage, codeql-fix-verify]
    steps:
      - name: Security scanning complete
        run: echo "Security scanning suite completed"
