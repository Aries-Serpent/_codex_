name: Cognitive Action & Decision (Unified)

on:
  schedule:
    - cron: '15 */6 * * *'  # Every 6 hours at :15 (decision engine)
  workflow_run:
    workflows: ["Cognitive Decision Engine"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - decision-only
          - action-only
          - full-cycle
        default: 'full-cycle'
      task_file:
        description: 'Task allocation file to execute (for action mode)'
        required: false
        default: 'cognitive/decisions/task_allocation.json'
      force_analysis:
        description: 'Force causal analysis even if no new data (for decision mode)'
        required: false
        default: 'false'
      risk_threshold:
        description: 'Risk threshold for decisions (0-1)'
        required: false
        default: '0.7'
      dry_run:
        description: 'Dry run mode (no actual execution)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write

# GROUNDED: Concurrency control prevents duplicate queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  decision_engine:
    name: Execute Decision Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'decision-only' || inputs.mode == 'full-cycle'))
    outputs:
      has_decisions: ${{ steps.decide.outputs.has_decisions }}
      task_file: ${{ steps.decide.outputs.task_file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow cognitive-action-decision 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Install cognitive brain dependencies
        run: |
          pip install numpy scipy pyyaml

      - name: Run decision engine
        id: decide
        env:
          FORCE_ANALYSIS: ${{ inputs.force_analysis || 'false' }}
          RISK_THRESHOLD: ${{ inputs.risk_threshold || '0.7' }}
        run: |
          if [ -f "scripts/cognitive/decision_engine.py" ]; then
            python scripts/cognitive/decision_engine.py \
              --force-analysis "$FORCE_ANALYSIS" \
              --risk-threshold "$RISK_THRESHOLD"
          else
            echo "Decision engine script not found"
            echo "has_decisions=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if decisions were made
          if [ -f "cognitive/decisions/task_allocation.json" ]; then
            echo "has_decisions=true" >> $GITHUB_OUTPUT
            echo "task_file=cognitive/decisions/task_allocation.json" >> $GITHUB_OUTPUT
          else
            echo "has_decisions=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload decision artifacts
        if: steps.decide.outputs.has_decisions == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cognitive-decisions-${{ github.run_number }}
          path: |
            cognitive/decisions/*.json
            cognitive/analysis/*.json
          retention-days: 30

  action_executor:
    name: Execute Allocated Actions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [decision_engine]
    if: |
      always() &&
      (needs.decision_engine.result == 'success' || needs.decision_engine.result == 'skipped') &&
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' ||
       github.event_name == 'workflow_dispatch' && (inputs.mode == 'action-only' || inputs.mode == 'full-cycle') ||
       needs.decision_engine.outputs.has_decisions == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Download decision artifacts (if from decision job)
        if: needs.decision_engine.outputs.has_decisions == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cognitive-decisions-${{ github.run_number }}
          path: cognitive/decisions/

      - name: Install action executor dependencies
        run: |
          pip install pyyaml

      - name: Execute actions
        env:
          TASK_FILE: ${{ inputs.task_file || needs.decision_engine.outputs.task_file || 'cognitive/decisions/task_allocation.json' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          if [ -f "scripts/cognitive/action_executor.py" ]; then
            python scripts/cognitive/action_executor.py \
              --task-file "$TASK_FILE" \
              --dry-run "$DRY_RUN"
          else
            echo "Action executor script not found"
            exit 0
          fi

      - name: Upload execution results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cognitive-execution-${{ github.run_number }}
          path: |
            cognitive/execution/*.json
            cognitive/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## 🧠 Cognitive Action & Decision Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.mode || 'scheduled' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Decision Engine:** ${{ needs.decision_engine.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action Executor:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
