name: Cognitive Action & Decision (Unified)
on:
  schedule:
  - cron: '15 2 * * *'
  workflow_run:
    workflows:
    - Cognitive Decision Engine
    types:
    - completed
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        type: choice
        options:
        - decision-only
        - action-only
        - full-cycle
        default: full-cycle
      task_file:
        description: Task allocation file to execute (for action mode)
        required: false
        default: cognitive/decisions/task_allocation.json
      force_analysis:
        description: Force causal analysis even if no new data (for decision mode)
        required: false
        default: 'false'
      risk_threshold:
        description: Risk threshold for decisions (0-1)
        required: false
        default: '0.7'
      dry_run:
        description: Dry run mode (no actual execution)
        required: false
        default: 'false'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  decision_engine:
    name: Execute Decision Engine
    runs-on: ubuntu-latest
    if: 'github.event_name == ''schedule'' ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''decision-only''
      || inputs.mode == ''full-cycle''))

      '
    outputs:
      has_decisions: ${{ steps.decide.outputs.has_decisions }}
      task_file: ${{ steps.decide.outputs.task_file }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow cognitive-action-decision
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Install cognitive brain dependencies
      run: 'pip install numpy scipy pyyaml

        '
    - name: Run decision engine
      id: decide
      env:
        FORCE_ANALYSIS: ${{ inputs.force_analysis || 'false' }}
        RISK_THRESHOLD: ${{ inputs.risk_threshold || '0.7' }}
      run: "if [ -f \"scripts/cognitive/decision_engine.py\" ]; then\n  python scripts/cognitive/decision_engine.py\
        \ \\\n    --force-analysis \"$FORCE_ANALYSIS\" \\\n    --risk-threshold \"\
        $RISK_THRESHOLD\"\nelse\n  echo \"Decision engine script not found\"\n  echo\
        \ \"has_decisions=false\" >> $GITHUB_OUTPUT\n  exit 0\nfi\n\n# Check if decisions\
        \ were made\nif [ -f \"cognitive/decisions/task_allocation.json\" ]; then\n\
        \  echo \"has_decisions=true\" >> $GITHUB_OUTPUT\n  echo \"task_file=cognitive/decisions/task_allocation.json\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"has_decisions=false\" >> $GITHUB_OUTPUT\n\
        fi\n"
    - name: Upload decision artifacts
      if: steps.decide.outputs.has_decisions == 'true'
      uses: actions/upload-artifact@v5
      with:
        path: 'cognitive/decisions/*.json

          cognitive/analysis/*.json

          '
        retention-days: 30
        name: cognitive-decisions-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  action_executor:
    name: Execute Allocated Actions
    runs-on: ubuntu-latest
    needs:
    - decision_engine
    if: "always() &&\n(needs.decision_engine.result == 'success' || needs.decision_engine.result\
      \ == 'skipped') &&\n(github.event_name == 'workflow_run' && github.event.workflow_run.conclusion\
      \ == 'success' ||\n github.event_name == 'workflow_dispatch' && (inputs.mode\
      \ == 'action-only' || inputs.mode == 'full-cycle') ||\n needs.decision_engine.outputs.has_decisions\
      \ == 'true')\n"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Download decision artifacts (if from decision job)
      if: needs.decision_engine.outputs.has_decisions == 'true'
      uses: actions/download-artifact@v5
      with:
        path: cognitive/decisions/
        name: cognitive-decisions-${{ github.run_number }}
    - name: Install action executor dependencies
      run: 'pip install pyyaml

        '
    - name: Execute actions
      env:
        TASK_FILE: ${{ inputs.task_file || needs.decision_engine.outputs.task_file
          || 'cognitive/decisions/task_allocation.json' }}
        DRY_RUN: ${{ inputs.dry_run || 'false' }}
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "if [ -f \"scripts/cognitive/action_executor.py\" ]; then\n  python scripts/cognitive/action_executor.py\
        \ \\\n    --task-file \"$TASK_FILE\" \\\n    --dry-run \"$DRY_RUN\"\nelse\n\
        \  echo \"Action executor script not found\"\n  exit 0\nfi\n"
    - name: Upload execution results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: 'cognitive/execution/*.json

          cognitive/logs/*.log

          '
        if-no-files-found: ignore
        retention-days: 30
        name: cognitive-execution-${{ github.run_number }}
    - name: Generate summary
      if: always()
      run: "echo \"## \U0001F9E0 Cognitive Action & Decision Summary\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Mode:** ${{ inputs.mode || 'scheduled'\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"**Decision Engine:** ${{ needs.decision_engine.result\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"**Action Executor:** ${{ job.status\
        \ }}\" >> $GITHUB_STEP_SUMMARY\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
