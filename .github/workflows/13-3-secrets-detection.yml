name: Secrets Detection & Remediation
on:
  pull_request:
    paths:
    - '**.py'
    - '**.ts'
    - '**.js'
    - '**.yaml'
    - '**.yml'
    - .env*
permissions:
  contents: read
  pull-requests: write
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  detect-secrets:
    name: Detect & Block Secrets
    runs-on: ubuntu-latest
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
    steps:
    - name: Mask secrets
      run: |
        echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"
    
      - name: Cache Python dependencies (Layer 1)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/checkout@v5
        with:
            persist-credentials: false
          fetch-depth: 0
      - id: secrets
        name: Run detect-secrets scan
        run: "pip install detect-secrets\noutput=$(detect-secrets scan --baseline .secrets.baseline\
        \ --all-files --string-multiline-detection)\nif echo \"$output\" | grep -q\
        \ '\"results\"'; then\n  echo \"❌ Secrets found in PR!\"\n  echo \"$output\"\
        \n  exit 1\nfi\n"
      - if: failure()
        name: Block merge on high-entropy findings
        uses: actions/github-script@v8
        with:
          script: "github.rest.pulls.createReview({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  pull_number: context.issue.number,\n  event:\
          \ 'REQUEST_CHANGES',\n  body: '❌ **Secrets detected in PR!**\\n\\nThis PR\
          \ contains high-entropy strings that may be credentials.\\n\\n**Actions\
          \ required:**\\n1. Remove all secrets from code\\n2. Force-push clean commits\\\
          n3. Request new review\\n\\n**Security Policy:** See SECURITY.md'\n})\n"
      - if: failure()
        name: Create security alert
        uses: actions/github-script@v8
        with:
          script: "github.rest.issues.createComment({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  issue_number: context.issue.number,\n  body:\
          \ '\U0001F510 **Automated Security Response**\\n\\nSecrets detected. This\
          \ PR has been blocked from merging.\\n\\nIf this is a false positive, maintainers\
          \ can dismiss the alert.'\n})\n"
    timeout-minutes: 30
