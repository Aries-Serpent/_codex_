name: Copilot Issue Triage

# Uses mvkaran/gh-copilot@5694b7d7a242d1c025e40d0965a0c5c5e68f5fba to automatically triage every new issue.
# Classifies type/severity, suggests labels, posts a structured summary,
# and applies labels via GitHub Actions.
#
# Requires:
#   secrets.CODEX_MASTER_KEY — fine-grained PAT with:
#     - Copilot Requests (for copilot-token)
#     - issues: write   (for label application + comment)
#   See .codex/docs/ADMIN_MANUAL_SETUP_GUIDE.md § 3

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  triage:
    name: AI Issue Triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run when a write key is available
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event.issue.user.type != 'Bot' &&
      !contains(github.event.issue.labels.*.name, 'ci-failure') &&
      !contains(github.event.issue.labels.*.name, 'automated')

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Analyze issue with GitHub Copilot
        id: triage
        uses: mvkaran/gh-copilot@5694b7d7a242d1c025e40d0965a0c5c5e68f5fba
        with:
          copilot-token: ${{ secrets.CODEX_MASTER_KEY }}
          github-mcp-token: ${{ secrets.CODEX_MASTER_KEY }}
          timeout: "5"
          output-format: json
          output-schema: |
            {
              "type": "bug|feature|documentation|question|security|ci-cd|cognitive-brain",
              "severity": "critical|high|medium|low",
              "labels": ["array of 1-3 existing GitHub label names"],
              "summary": "one-sentence summary of the issue",
              "affected_component": "src/codex/cognitive|src/codex_ml|CI|docs|tests|other",
              "needs_more_info": true,
              "cognitive_brain_relevant": false,
              "suggested_pattern_id": "P-NEW or null"
            }
          system-prompt: |
            You are an expert triage agent for the Aries-Serpent/_codex_ Python repository.
            Repository overview: AI cognitive brain system with ML training, CI/CD automation,
            RBAC (StructuralPolicyManager), GitHub Copilot integration, and coverage tooling.

            Available GitHub labels (use ONLY these exact strings):
              bug, enhancement, documentation, question, security, ci/cd,
              cognitive-brain, good first issue, help wanted, invalid, wontfix,
              priority: critical, priority: high, priority: medium, priority: low

            cognitive_brain_relevant = true if issue affects:
              src/codex/cognitive/, .github/workflows/cognitive_brain_*,
              StructuralPolicyManager, SessionContextInjector, AgentBrainAPI

            suggested_pattern_id: if this issue maps to a known CI/test pattern
            (P-038 shard crash, P-039 CodeQL, P-042 HF_REVISION, P-043 HF mock,
            P-044 coverage, P-046 CI feedback), return that ID. Otherwise null.

            Return ONLY valid JSON. No markdown fences. No explanation.
          prompt: |
            Triage this GitHub issue:

            Repository: ${{ github.repository }}
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
            Author: ${{ github.event.issue.user.login }}
            Body:
            ${{ github.event.issue.body }}

            Return a JSON triage object following the schema exactly.

      - name: Apply labels and post triage comment
        if: steps.triage.outputs.validation-status == 'valid'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TRIAGE_JSON: ${{ steps.triage.outputs.response }}
        with:
          github-token: ${{ secrets.CODEX_MASTER_KEY }}
          script: |
            const triage = JSON.parse(process.env.TRIAGE_JSON);

            // Apply labels (ignore any that don't exist yet)
            if (triage.labels && triage.labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: triage.labels,
                });
                core.info(`Applied labels: ${triage.labels.join(', ')}`);
              } catch (e) {
                core.warning(`Label apply failed: ${e.message}`);
              }
            }

            // Build triage comment
            const severityEmoji = {
              critical: '🔴', high: '🟠', medium: '🟡', low: '🟢'
            }[triage.severity] || '⚪';

            const typeEmoji = {
              bug: '🐛', feature: '✨', documentation: '📚',
              question: '❓', security: '🔒', 'ci-cd': '⚙️',
              'cognitive-brain': '🧠'
            }[triage.type] || '📌';

            const brainNote = triage.cognitive_brain_relevant
              ? `\n> 🧠 **Cognitive Brain relevant** — affects \`${triage.affected_component}\``
              : '';

            const patternNote = triage.suggested_pattern_id
              ? `\n> 📚 **Pattern match:** \`${triage.suggested_pattern_id}\` — see \`.codex/cognitive_brain/${triage.suggested_pattern_id}.md\``
              : '';

            const needsInfo = triage.needs_more_info
              ? `\n\n> ⚠️ **More information needed** — please provide additional context (logs, steps to reproduce, etc.)`
              : '';

            const bodyLines = [
              `### ${typeEmoji} AI Triage Summary`,
              '',
              '| Field | Value |',
              '|-------|-------|',
              `| **Type** | ${triage.type} |`,
              `| **Severity** | ${severityEmoji} ${triage.severity} |`,
              `| **Component** | \`${triage.affected_component}\` |`,
              `| **Summary** | ${triage.summary} |`,
            ];
            if (brainNote)   bodyLines.push(brainNote);
            if (patternNote) bodyLines.push(patternNote);
            if (needsInfo)   bodyLines.push(needsInfo);
            bodyLines.push('');
            bodyLines.push('<sub>🤖 Auto-triaged by [GitHub Copilot Action](https://github.com/marketplace/actions/github-copilot-action) (mvkaran/gh-copilot@5694b7d7a242d1c025e40d0965a0c5c5e68f5fba) — S108 cognitive brain integration</sub>');
            bodyLines.push('');
            bodyLines.push('---');
            bodyLines.push(`_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`);
            const body = bodyLines.join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.info(`✅ Triage comment posted on issue #${context.issue.number}`);

      - name: Fallback notice (if Copilot unavailable)
        if: steps.triage.outputs.validation-status != 'valid'
        run: |
          echo "⚠️ Copilot triage validation-status: ${{ steps.triage.outputs.validation-status }}"
          echo "Errors: ${{ steps.triage.outputs.validation-errors }}"
          echo "This is non-blocking — issue was created normally."
