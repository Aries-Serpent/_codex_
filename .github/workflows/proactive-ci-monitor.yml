name: "\U0001F50D Proactive CI Monitor"
true:
  schedule:
  - cron: 0 8 * * *
  workflow_dispatch:
    inputs:
      scope:
        description: Scan scope
        type: choice
        options:
        - all-open-prs
        - single-pr
        - recent-failures
        default: all-open-prs
        required: true
      target_pr:
        description: PR number (only when scope = single-pr, e.g. 3856)
        type: number
        default: 0
        required: false
      max_age_h:
        description: Max age of failed runs to include (hours)
        type: number
        default: 24
        required: false
      min_confidence:
        description: "Min pattern confidence to escalate [0.0\u20131.0]"
        type: string
        default: '0.5'
        required: false
      dry_run:
        description: "Dry run \u2014 analyse only, do NOT post any comments"
        type: boolean
        default: false
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
jobs:
  scan:
    name: Scan (${{ inputs.scope || 'scheduled/all-open-prs' }}, dry=${{ inputs.dry_run
      || 'false' }})
    runs-on: ubuntu-latest
    steps:
    - name: Checkout monitor script
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        sparse-checkout: scripts/ci/proactive_ci_monitor.py
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.12
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Build CLI arguments
      id: args
      shell: bash
      run: "ARGS=\"\"\nTARGET_PR=\"${{ inputs.target_pr || 0 }}\"\nif [ \"$TARGET_PR\"\
        \ != \"0\" ] && [ -n \"$TARGET_PR\" ]; then\n  ARGS=\"$ARGS --target-pr $TARGET_PR\"\
        \nfi\nARGS=\"$ARGS --max-age-h ${{ inputs.max_age_h || 24 }}\"\nARGS=\"$ARGS\
        \ --min-confidence ${{ inputs.min_confidence || '0.5' }}\"\nif [ \"${{ inputs.dry_run\
        \ }}\" = \"true\" ]; then\n  ARGS=\"$ARGS --dry-run\"\nfi\necho \"cli_args=$ARGS\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Run proactive CI monitor
      id: monitor
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: "python scripts/ci/proactive_ci_monitor.py \\\n  --repo \"$GITHUB_REPOSITORY\"\
        \ \\\n  --token \"$GITHUB_TOKEN\" \\\n  --output /tmp/proactive_report.json\
        \ \\\n  ${{ steps.args.outputs.cli_args }} || true\n\n# Ensure output file\
        \ exists (create fallback if script failed)\nif [ ! -f /tmp/proactive_report.json\
        \ ]; then\n  echo '{\"scanned_prs\": 0, \"failed_runs\": 0, \"escalated\"\
        : 0, \"skipped_transient\": 0, \"already_addressed\": 0, \"details\": []}'\
        \ > /tmp/proactive_report.json\nfi\n"
    - name: Upload scan report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: /tmp/proactive_report.json
        retention-days: 30
        name: proactive-ci-monitor-report-${{ github.run_id }}
    - name: Write job summary
      if: always()
      env:
        DRY_RUN_FLAG: ${{ inputs.dry_run || 'false' }}
      run: "[ -f /tmp/proactive_report.json ] || { echo \"No report generated.\" >>\
        \ \"$GITHUB_STEP_SUMMARY\"; exit 0; }\npython3 - <<'PYEOF'\nimport json, os,\
        \ sys\ntry:\n    data = json.load(open('/tmp/proactive_report.json'))\nexcept\
        \ Exception as e:\n    print(f\"Could not parse report: {e}\", file=sys.stderr)\n\
        \    sys.exit(0)\ndry  = os.environ.get('DRY_RUN_FLAG', 'false') == 'true'\n\
        mode = '\U0001F515 DRY RUN' if dry else '\U0001F514 LIVE'\nlines = [\n   \
        \ f\"## \U0001F50D Proactive CI Monitor \u2014 {mode}\\n\",\n    \"| Metric\
        \ | Count |\",\n    \"|--------|-------|\",\n    f\"| PRs scanned | **{data['scanned_prs']}**\
        \ |\",\n    f\"| Failed runs found | **{data['failed_runs']}** |\",\n    f\"\
        | Escalated to @copilot | **{data['escalated']}** |\",\n    f\"| Transient\
        \ (auto-skipped) | {data['skipped_transient']} |\",\n    f\"| Below confidence\
        \ threshold | {data.get('below_confidence', 0)} |\",\n    f\"| Already addressed\
        \ | {data['already_addressed']} |\",\n    \"\",\n]\ndetails = data.get('details',\
        \ [])\nif details:\n    lines += [\n        \"### Failure Details\",\n   \
        \     \"\",\n        \"| PR | SHA | Workflow | Pattern | Confidence | Action\
        \ |\",\n        \"|---|---|---|---|---|---|\",\n    ]\n    icons = {'escalated':'\U0001F6A8\
        ','dry-run':'\U0001F515','already-addressed':'\u2705','skipped-transient':'\u23ED\
        \uFE0F'}\n    for d in details[:30]:\n        icon = icons.get(d['action'],\
        \ '\u2753')\n        conf = f\"{d.get('confidence',0):.0%}\"\n        lines.append(\n\
        \            f\"|  #{d['pr']} | `{d['sha']}` | {d['workflow'][:38]} \"\n \
        \           f\"| `{d['pattern_id']}` | {conf} | {icon} {d['action']} |\"\n\
        \        )\n    if len(details) > 30:\n        lines.append(f\"\\n_\u2026\
        \ and {len(details)-30} more \u2014 download the artifact_\")\nwith open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as f:\n    f.write('\\n'.join(lines) + '\\n')\nPYEOF\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
