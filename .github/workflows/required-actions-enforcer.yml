name: "\U0001F516 Required Actions Version Enforcer"
'on':
  push:
    branches:
    - automated/**
    - copilot/**
    - 0D_base_
    - main
    paths:
    - .github/workflows/**
    - .github/misc/**
    - scripts/ci/enforce_actions_versions.py
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - .github/workflows/**
    - .github/misc/**
  schedule:
  - cron: 0 3 * * 0
  workflow_dispatch:
    inputs:
      fix:
        description: Auto-fix violations (true) or report only (false)
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  enforce-versions:
    name: "\U0001F516 Check Action Versions"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Check action versions (PR / push)
      if: "github.event_name != 'schedule' &&\ngithub.event.inputs.fix != 'true' &&\n\
        !(\n  github.event_name == 'push' &&\n  (\n    startsWith(github.ref, 'refs/heads/copilot/')\
        \ ||\n    startsWith(github.ref, 'refs/heads/automated/')\n  )\n)\n"
      run: 'python scripts/ci/enforce_actions_versions.py --summary

        '
      continue-on-error: true
    - name: Auto-fix action versions
      id: autofix
      if: "github.event_name == 'schedule' ||\ngithub.event.inputs.fix == 'true' ||\n\
        (\n  github.event_name == 'push' &&\n  (\n    startsWith(github.ref, 'refs/heads/copilot/')\
        \ ||\n    startsWith(github.ref, 'refs/heads/automated/')\n  )\n)\n"
      run: "autofix_json=$(\n  python scripts/ci/enforce_actions_versions.py --fix\
        \ --summary --json 2>/dev/null\n)\nviolations=$(\n  printf '%s' \"$autofix_json\"\
        \ |\n  python3 -c \"import json,sys; print(json.load(sys.stdin).get('total',\
        \ 0))\"\n)\necho \"violations=$violations\" >> \"$GITHUB_OUTPUT\"\nif git\
        \ diff --quiet; then\n  echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\nelse\n\
        \  echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Commit auto-fixed versions
      if: steps.autofix.outputs.changed == 'true'
      run: "git config user.name  \"copilot-swe-agent[bot]\"\ngit config user.email\
        \ \"198982749+Copilot@users.noreply.github.com\"\ngit add .github/workflows/\
        \ .github/misc/\nVIOLATIONS=\"${{ steps.autofix.outputs.violations }}\"\n\
        git commit -m \"fix(ci): auto-update ${VIOLATIONS} action version(s) to approved\
        \ pins [skip ci]\"\ngit push\necho \"\u2705 Committed action version fixes\"\
        \n"
    - name: Post PR annotation on violations
      if: 'failure() &&

        github.event_name == ''pull_request''

        '
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const { execSync } = require('child_process');\nlet violations =\
          \ [];\ntry {\n  const out = execSync(\n    'python scripts/ci/enforce_actions_versions.py\
          \ --json',\n    { encoding: 'utf8' }\n  );\n  violations = JSON.parse(out).violations\
          \ || [];\n} catch (_) {}\n\nif (violations.length === 0) return;\n\nconst\
          \ rows = violations.map(v =>\n  `| \\`${v.file}\\` | ${v.line} | \\`${v.action}\\\
          ` | \\`@${v.found}\\` | \\`@${v.expected}\\` |`\n).join('\\n');\n\nconst\
          \ body = [\n  `## \U0001F516 Required Actions Version Enforcer`,\n  ``,\n\
          \  `**${violations.length} workflow file(s)** use non-approved action versions.`,\n\
          \  ``,\n  `| File | Line | Action | Found | Expected |`,\n  `|------|------|--------|-------|----------|`,\n\
          \  rows,\n  ``,\n  `### Quick fix`,\n  `\\`\\`\\`bash`,\n  `python scripts/ci/enforce_actions_versions.py\
          \ --fix`,\n  `git add .github/`,\n  `git commit -m \"fix(ci): update action\
          \ versions to approved pins\"`,\n  `\\`\\`\\``,\n].join('\\n');\n\nawait\
          \ github.rest.issues.createComment({\n  owner: context.repo.owner,\n  repo:\
          \ context.repo.repo,\n  issue_number: context.issue.number,\n  body,\n});\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
