name: "🧹 Discussion Cleanup — Deduplicate Comments"

# Removes duplicate discussion comments caused by the _find_discussion_comment
# pagination bug (fixed in S297).  Keeps the NEWEST comment per dedup-marker
# group and deletes all older copies.
#
# Two execution modes
# ────────────────────
# A) MANIFEST MODE (recommended):
#    Copilot Agent runs `generate-manifest` locally, commits the manifest to
#    .codex/cleanup/, then triggers this workflow with manifest_path set.
#    The workflow reads the manifest and executes the deletions.
#    Advantage: full audit trail, maintainer can review the manifest before
#    execution, manifest is stamped with execution results.
#
# B) DIRECT MODE:
#    Workflow scans discussions itself and optionally executes in one step.
#    Faster but no persistent audit file.
#
# Targets (by default):
#   #3756 — Q&A / Agent Check-In thread  (was 724 comments, 513 duplicates)
#   #3673 — Agent Accountability Report  (was 278 comments, minor duplicates)

on:
  workflow_dispatch:
    inputs:
      # ── Manifest mode ──────────────────────────────────────────────────────
      manifest_path:
        description: |
          Path to a manifest file generated by `generate-manifest` command.
          When set, the workflow reads this file and executes deletions from it
          (manifest mode). Leave blank to use direct scan mode.
        required: false
        default: ""

      # ── Direct mode ────────────────────────────────────────────────────────
      discussion_numbers:
        description: "Space-separated discussion numbers (direct mode only, default: 3756 3673)"
        required: false
        default: "3756 3673"
      marker_prefix:
        description: "Only process markers starting with this prefix (empty = all)"
        required: false
        default: ""

      # ── Shared ─────────────────────────────────────────────────────────────
      execute:
        description: "'true' to actually delete (default: dry-run preview)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      delay_ms:
        description: "Milliseconds between deletions (default: 300)"
        required: false
        default: "300"

  # Weekly scheduled dry-run scan — surfaces any new duplicates for review
  schedule:
    - cron: "0 6 * * 5"   # 06:00 UTC every Friday

concurrency:
  group: discussion-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  discussions: write

jobs:
  cleanup:
    name: "🧹 Deduplicate Discussion Comments"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          cache: pip
          python-version: "3.12"

      # ── Mint the best available token for discussions:write ────────────────
      # Priority:
      #   1. GitHub App installation token (_GITHUB_APP_PRIVATE_KEY available) — has discussions:write
      #   2. CODEX_MASTER_KEY / CODEX_BACKUP_KEY PAT — has discussions:write if scoped
      #   3. github.token — limited scope, deletion may fail
      - name: "🔑 Resolve auth token for discussions:write"
        id: auth
        env:
          GITHUB_APP_PRIVATE_KEY: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets._GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets._GITHUB_APP_INSTALLATION_ID }}
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          pip install "PyJWT==2.8.0" "cryptography==44.0.2" --quiet
          RESOLVED_TOKEN=""
          # Try GitHub App installation token first (broadest scope)
          if [[ -n "${GITHUB_APP_PRIVATE_KEY}" && -n "${GITHUB_APP_ID}" && -n "${GITHUB_APP_INSTALLATION_ID}" ]]; then
            echo "ℹ️ Attempting GitHub App installation token mint..."
            INSTALL_TOKEN=$(python3 - <<'PYEOF'
          import os, time, json, sys
          try:
              import jwt
              key = os.environ["GITHUB_APP_PRIVATE_KEY"]
              app_id = os.environ["GITHUB_APP_ID"]
              inst_id = os.environ["GITHUB_APP_INSTALLATION_ID"]
              now = int(time.time())
              payload = {"iat": now - 60, "exp": now + 540, "iss": str(app_id)}
              app_jwt = jwt.encode(payload, key, algorithm="RS256")
              import urllib.request, urllib.error
              req = urllib.request.Request(
                  f"https://api.github.com/app/installations/{inst_id}/access_tokens",
                  method="POST",
                  data=json.dumps({}).encode(),
                  headers={
                      "Authorization": f"Bearer {app_jwt}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "codex-discussion-cleanup/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read())
                  print(data["token"])
              except urllib.error.HTTPError as http_err:
                  body = http_err.read().decode("utf-8", errors="replace")
                  print(f"APP_TOKEN_FAILED: HTTP {http_err.code} {http_err.reason} — {body}", file=sys.stderr)
                  print("")
          except Exception as e:
              print(f"APP_TOKEN_FAILED: {e}", file=sys.stderr)
              print("")
          PYEOF
          )
            if [[ -n "${INSTALL_TOKEN}" && "${INSTALL_TOKEN}" != "APP_TOKEN_FAILED"* ]]; then
              RESOLVED_TOKEN="${INSTALL_TOKEN}"
              echo "✅ GitHub App installation token acquired"
              echo "auth_source=github_app" >> "$GITHUB_OUTPUT"
            else
              echo "⚠️ App token mint failed — falling back to PAT"
            fi
          fi
          # Fallback to PAT
          if [[ -z "${RESOLVED_TOKEN}" ]]; then
            if [[ -n "${CODEX_MASTER_KEY}" ]]; then
              RESOLVED_TOKEN="${CODEX_MASTER_KEY}"
              echo "auth_source=codex_master_key" >> "$GITHUB_OUTPUT"
              echo "ℹ️ Using CODEX_MASTER_KEY"
            elif [[ -n "${CODEX_BACKUP_KEY}" ]]; then
              RESOLVED_TOKEN="${CODEX_BACKUP_KEY}"
              echo "auth_source=codex_backup_key" >> "$GITHUB_OUTPUT"
              echo "ℹ️ Using CODEX_BACKUP_KEY"
            else
              RESOLVED_TOKEN="${GITHUB_TOKEN_FALLBACK}"
              echo "auth_source=github_token" >> "$GITHUB_OUTPUT"
              echo "⚠️ Using github.token — delete may fail without discussions:write"
            fi
          fi
          echo "resolved_token=${RESOLVED_TOKEN}" >> "$GITHUB_OUTPUT"

      # ── Detect mode ────────────────────────────────────────────────────────
      - name: "Detect execution mode"
        id: mode
        run: |
          if [[ -n "${{ github.event.inputs.manifest_path }}" && \
                -f "${{ github.event.inputs.manifest_path }}" ]]; then
            echo "mode=manifest" >> "$GITHUB_OUTPUT"
            echo "manifest_path=${{ github.event.inputs.manifest_path }}" >> "$GITHUB_OUTPUT"
            echo "▶ Manifest mode: ${{ github.event.inputs.manifest_path }}"
          else
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            echo "▶ Direct mode (scan discussions: ${{ github.event.inputs.discussion_numbers || '3756 3673' }})"
          fi

      # ══════════════════════════════════════════════════════════════════════
      # MANIFEST MODE
      # ══════════════════════════════════════════════════════════════════════

      - name: "📋 [Manifest] Preview manifest contents"
        if: steps.mode.outputs.mode == 'manifest'
        env:
          MANIFEST: ${{ steps.mode.outputs.manifest_path }}
        run: |
          echo "## 📋 Manifest Contents" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
          # Show header + summary section only (not full comment list)
          python3 -c "
          import json, sys
          m = json.load(open('$MANIFEST'))
          preview = {k: v for k,v in m.items() if k != 'discussions'}
          disc_summary = {}
          for d, data in m.get('discussions',{}).items():
              groups = data.get('groups',[])
              disc_summary[d] = {
                  'total_comments': data.get('total_comments'),
                  'duplicate_groups': len(groups),
                  'to_delete': sum(
                      len([e for e in g.get('delete',[]) if not e.get('skip_reason')])
                      for g in groups
                  ),
                  'top_markers': [g['marker'] for g in groups[:5]],
              }
          preview['discussions_summary'] = disc_summary
          print(json.dumps(preview, indent=2))
          " >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: "🗑️ [Manifest] Execute deletions from manifest"
        if: |
          steps.mode.outputs.mode == 'manifest' &&
          github.event.inputs.execute == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
          MANIFEST: ${{ steps.mode.outputs.manifest_path }}
          DELAY_MS: ${{ github.event.inputs.delay_ms || '300' }}
        run: |
          echo "## 🗑️ Execution Results (manifest mode)" >> "$GITHUB_STEP_SUMMARY"
          python scripts/ci/discussion_cleanup.py execute-manifest \
            --manifest "$MANIFEST" \
            --delay-ms "$DELAY_MS" \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "🔎 [Manifest] Dry-run — no execute flag set"
        if: |
          steps.mode.outputs.mode == 'manifest' &&
          github.event.inputs.execute != 'true'
        env:
          MANIFEST: ${{ steps.mode.outputs.manifest_path }}
        run: |
          echo "## ℹ️ Dry-run — manifest loaded but execute=false" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 -c "
          import json
          m = json.load(open('$MANIFEST'))
          s = m.get('summary',{})
          print(f\"Would delete : {s.get('total_to_delete',0)}\")
          print(f\"Would skip   : {s.get('total_skipped',0)}\")
          print()
          print('Re-run with execute=true to apply.')
          " | tee -a "$GITHUB_STEP_SUMMARY"

      # ══════════════════════════════════════════════════════════════════════
      # DIRECT MODE
      # ══════════════════════════════════════════════════════════════════════

      - name: "🔍 [Direct] Dry-run scan — preview duplicates"
        if: steps.mode.outputs.mode == 'direct'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
          DISCUSSION_NUMBERS: ${{ github.event.inputs.discussion_numbers || '3756 3673' }}
          MARKER_PREFIX: ${{ github.event.inputs.marker_prefix || '' }}
        run: |
          echo "## 🔍 Dry-run Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for disc in $DISCUSSION_NUMBERS; do
            echo "### Discussion #${disc}" >> "$GITHUB_STEP_SUMMARY"
            python scripts/ci/discussion_cleanup.py scan \
              --discussion "$disc" \
              ${MARKER_PREFIX:+--marker-prefix "$MARKER_PREFIX"} \
              2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: "📊 [Direct] Statistics"
        if: steps.mode.outputs.mode == 'direct'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
          DISCUSSION_NUMBERS: ${{ github.event.inputs.discussion_numbers || '3756 3673' }}
        run: |
          echo "## 📊 Statistics" >> "$GITHUB_STEP_SUMMARY"
          for disc in $DISCUSSION_NUMBERS; do
            python scripts/ci/discussion_cleanup.py stats \
              --discussion "$disc" \
              2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          done

      - name: "🗑️ [Direct] Execute dedup"
        if: |
          steps.mode.outputs.mode == 'direct' &&
          github.event.inputs.execute == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
          DISCUSSION_NUMBERS: ${{ github.event.inputs.discussion_numbers || '3756 3673' }}
          MARKER_PREFIX: ${{ github.event.inputs.marker_prefix || '' }}
          DELAY_MS: ${{ github.event.inputs.delay_ms || '300' }}
        run: |
          echo "## 🗑️ Execution Results (direct mode)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python scripts/ci/discussion_cleanup.py dedup \
            --discussion $DISCUSSION_NUMBERS \
            ${MARKER_PREFIX:+--marker-prefix "$MARKER_PREFIX"} \
            --delay-ms "$DELAY_MS" \
            --execute \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Executed at $(date -u +%Y-%m-%dT%H:%MZ) — run \`${{ github.run_id }}\`_" >> "$GITHUB_STEP_SUMMARY"

      - name: "✅ [Direct] Post-execution statistics"
        if: |
          steps.mode.outputs.mode == 'direct' &&
          github.event.inputs.execute == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
          DISCUSSION_NUMBERS: ${{ github.event.inputs.discussion_numbers || '3756 3673' }}
        run: |
          echo "## ✅ Post-Cleanup Statistics" >> "$GITHUB_STEP_SUMMARY"
          for disc in $DISCUSSION_NUMBERS; do
            python scripts/ci/discussion_cleanup.py stats \
              --discussion "$disc" \
              2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          done

      # ── Scheduled run note ─────────────────────────────────────────────────
      - name: "📋 Scheduled run instructions"
        if: github.event_name == 'schedule'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️ **Scheduled weekly dry-run.** To execute cleanup:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Option A — Manifest mode (recommended):**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "# 1. Copilot generates manifest:" >> "$GITHUB_STEP_SUMMARY"
          echo "python scripts/ci/discussion_cleanup.py generate-manifest \\" >> "$GITHUB_STEP_SUMMARY"
          echo "    --discussions 3756 3673 \\" >> "$GITHUB_STEP_SUMMARY"
          echo "    --output .codex/cleanup/discussion_cleanup_manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "# 2. Trigger workflow with manifest:" >> "$GITHUB_STEP_SUMMARY"
          echo "gh workflow run discussion-cleanup.yml \\" >> "$GITHUB_STEP_SUMMARY"
          echo "    -f manifest_path=.codex/cleanup/discussion_cleanup_manifest.json \\" >> "$GITHUB_STEP_SUMMARY"
          echo "    -f execute=true" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Option B — Direct mode:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "gh workflow run discussion-cleanup.yml -f execute=true" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
