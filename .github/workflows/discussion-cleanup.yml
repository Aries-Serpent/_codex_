name: "\U0001F9F9 Discussion Cleanup \u2014 Deduplicate Comments"
true:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Path to a manifest file generated by `generate-manifest` command.

          When set, the workflow reads this file and executes deletions from it

          (manifest mode). Leave blank to use direct scan mode.

          '
        required: false
        default: ''
      discussion_numbers:
        description: 'Space-separated discussion numbers (direct mode only, default:
          3756 3673)'
        required: false
        default: 3756 3673
      marker_prefix:
        description: Only process markers starting with this prefix (empty = all)
        required: false
        default: ''
      execute:
        description: '''true'' to actually delete (default: dry-run preview)'
        required: false
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'
      delay_ms:
        description: 'Milliseconds between deletions (default: 300)'
        required: false
        default: '300'
  schedule:
  - cron: 0 6 * * 5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  discussions: write
jobs:
  cleanup:
    name: "\U0001F9F9 Deduplicate Discussion Comments"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Set up Python 3.12
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: "\U0001F511 Resolve auth token for discussions:write"
      id: auth
      env:
        GITHUB_APP_PRIVATE_KEY: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
        GITHUB_APP_ID: ${{ secrets._GITHUB_APP_ID }}
        GITHUB_APP_INSTALLATION_ID: ${{ secrets._GITHUB_APP_INSTALLATION_ID }}
        CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY
          }}
        CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        GITHUB_TOKEN_FALLBACK: ${{ github.token }}
      run: "pip install \"PyJWT==2.8.0\" \"cryptography==44.0.2\" --quiet\nRESOLVED_TOKEN=\"\
        \"\n# Try GitHub App installation token first (broadest scope)\nif [[ -n \"\
        ${GITHUB_APP_PRIVATE_KEY}\" && -n \"${GITHUB_APP_ID}\" && -n \"${GITHUB_APP_INSTALLATION_ID}\"\
        \ ]]; then\n  echo \"\u2139\uFE0F Attempting GitHub App installation token\
        \ mint...\"\n  INSTALL_TOKEN=$(python3 - <<'PYEOF'\nimport os, time, json,\
        \ sys\ntry:\n    import jwt\n    key = os.environ[\"GITHUB_APP_PRIVATE_KEY\"\
        ]\n    app_id = os.environ[\"GITHUB_APP_ID\"]\n    inst_id = os.environ[\"\
        GITHUB_APP_INSTALLATION_ID\"]\n    now = int(time.time())\n    payload = {\"\
        iat\": now - 60, \"exp\": now + 540, \"iss\": str(app_id)}\n    app_jwt =\
        \ jwt.encode(payload, key, algorithm=\"RS256\")\n    import urllib.request,\
        \ urllib.error\n    req = urllib.request.Request(\n        f\"https://api.github.com/app/installations/{inst_id}/access_tokens\"\
        ,\n        method=\"POST\",\n        data=json.dumps({}).encode(),\n     \
        \   headers={\n            \"Authorization\": f\"Bearer {app_jwt}\",\n   \
        \         \"Accept\": \"application/vnd.github+json\",\n            \"X-GitHub-Api-Version\"\
        : \"2022-11-28\",\n            \"User-Agent\": \"codex-discussion-cleanup/1.0\"\
        ,\n        },\n    )\n    try:\n        with urllib.request.urlopen(req, timeout=15)\
        \ as resp:\n            data = json.loads(resp.read())\n        print(data[\"\
        token\"])\n    except urllib.error.HTTPError as http_err:\n        body =\
        \ http_err.read().decode(\"utf-8\", errors=\"replace\")\n        print(f\"\
        APP_TOKEN_FAILED: HTTP {http_err.code} {http_err.reason} \u2014 {body}\",\
        \ file=sys.stderr)\n        print(\"\")\nexcept Exception as e:\n    print(f\"\
        APP_TOKEN_FAILED: {e}\", file=sys.stderr)\n    print(\"\")\nPYEOF\n)\n  if\
        \ [[ -n \"${INSTALL_TOKEN}\" && \"${INSTALL_TOKEN}\" != \"APP_TOKEN_FAILED\"\
        * ]]; then\n    RESOLVED_TOKEN=\"${INSTALL_TOKEN}\"\n    echo \"\u2705 GitHub\
        \ App installation token acquired\"\n    echo \"auth_source=github_app\" >>\
        \ \"$GITHUB_OUTPUT\"\n  else\n    echo \"\u26A0\uFE0F App token mint failed\
        \ \u2014 falling back to PAT\"\n  fi\nfi\n# Fallback to PAT\nif [[ -z \"${RESOLVED_TOKEN}\"\
        \ ]]; then\n  if [[ -n \"${CODEX_MASTER_KEY}\" ]]; then\n    RESOLVED_TOKEN=\"\
        ${CODEX_MASTER_KEY}\"\n    echo \"auth_source=codex_master_key\" >> \"$GITHUB_OUTPUT\"\
        \n    echo \"\u2139\uFE0F Using CODEX_MASTER_KEY\"\n  elif [[ -n \"${CODEX_BACKUP_KEY}\"\
        \ ]]; then\n    RESOLVED_TOKEN=\"${CODEX_BACKUP_KEY}\"\n    echo \"auth_source=codex_backup_key\"\
        \ >> \"$GITHUB_OUTPUT\"\n    echo \"\u2139\uFE0F Using CODEX_BACKUP_KEY\"\n\
        \  else\n    RESOLVED_TOKEN=\"${GITHUB_TOKEN_FALLBACK}\"\n    echo \"auth_source=github_token\"\
        \ >> \"$GITHUB_OUTPUT\"\n    echo \"\u26A0\uFE0F Using github.token \u2014\
        \ delete may fail without discussions:write\"\n  fi\nfi\necho \"resolved_token=${RESOLVED_TOKEN}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Detect execution mode
      id: mode
      run: "# Use Python script for safe input validation instead of shell logic\n\
        # This prevents code injection via shell metacharacters in inputs\n# See .github/scripts/validate_workflow_inputs.py\
        \ for validation logic\n\n# Validate manifest_path if provided\n# Capture\
        \ stdout only (stderr goes to /dev/null) to ensure clean JSON\nMANIFEST_VALIDATION=$(python3\
        \ .github/scripts/validate_workflow_inputs.py \\\n  --type manifest-path \\\
        \n  --value \"${{ github.event.inputs.manifest_path }}\" \\\n  2>/dev/null)\n\
        \n# Fallback if script fails or returns nothing\nif [[ -z \"$MANIFEST_VALIDATION\"\
        \ ]]; then\n  MANIFEST_VALIDATION='{\"valid\": false, \"mode\": \"direct\"\
        }'\nfi\n\nMODE=$(echo \"$MANIFEST_VALIDATION\" | python3 -c \"import sys,json;\
        \ print(json.load(sys.stdin)['mode'])\")\n\nif [[ \"$MODE\" == \"manifest\"\
        \ ]]; then\n  MANIFEST_PATH=$(echo \"$MANIFEST_VALIDATION\" | python3 -c \"\
        import sys,json; print(json.load(sys.stdin)['path'])\")\n  echo \"mode=manifest\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"manifest_path=${MANIFEST_PATH}\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"\u25B6 Manifest mode: ${MANIFEST_PATH}\"\nelse\n  echo \"mode=direct\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"\u25B6 Direct mode (scan discussions: ${{\
        \ github.event.inputs.discussion_numbers || '3756 3673' }})\"\nfi\n"
    - name: "\U0001F4CB [Manifest] Preview manifest contents"
      if: steps.mode.outputs.mode == 'manifest'
      env:
        MANIFEST: ${{ steps.mode.outputs.manifest_path }}
      run: "echo \"## \U0001F4CB Manifest Contents\" >> \"$GITHUB_STEP_SUMMARY\"\n\
        echo \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\\`\\`\\`json\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n# Show header + summary section only (not full comment list)\npython3 -c\
        \ \"\nimport json, sys\nm = json.load(open('$MANIFEST'))\npreview = {k: v\
        \ for k,v in m.items() if k != 'discussions'}\ndisc_summary = {}\nfor d, data\
        \ in m.get('discussions',{}).items():\n    groups = data.get('groups',[])\n\
        \    disc_summary[d] = {\n        'total_comments': data.get('total_comments'),\n\
        \        'duplicate_groups': len(groups),\n        'to_delete': sum(\n   \
        \         len([e for e in g.get('delete',[]) if not e.get('skip_reason')])\n\
        \            for g in groups\n        ),\n        'top_markers': [g['marker']\
        \ for g in groups[:5]],\n    }\npreview['discussions_summary'] = disc_summary\n\
        print(json.dumps(preview, indent=2))\n\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"\\`\\`\\`\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: "\U0001F5D1\uFE0F [Manifest] Execute deletions from manifest"
      if: 'steps.mode.outputs.mode == ''manifest'' &&

        github.event.inputs.execute == ''true''

        '
      env:
        GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
        MANIFEST: ${{ steps.mode.outputs.manifest_path }}
        DELAY_MS: ${{ github.event.inputs.delay_ms || '300' }}
      run: "echo \"## \U0001F5D1\uFE0F Execution Results (manifest mode)\" >> \"$GITHUB_STEP_SUMMARY\"\
        \npython scripts/ci/discussion_cleanup.py execute-manifest \\\n  --manifest\
        \ \"$MANIFEST\" \\\n  --delay-ms \"$DELAY_MS\" \\\n  2>&1 | tee -a \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - name: "\U0001F50E [Manifest] Dry-run \u2014 no execute flag set"
      if: 'steps.mode.outputs.mode == ''manifest'' &&

        github.event.inputs.execute != ''true''

        '
      env:
        MANIFEST: ${{ steps.mode.outputs.manifest_path }}
      run: "echo \"## \u2139\uFE0F Dry-run \u2014 manifest loaded but execute=false\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\npython3\
        \ -c \"\nimport json\nm = json.load(open('$MANIFEST'))\ns = m.get('summary',{})\n\
        print(f\\\"Would delete : {s.get('total_to_delete',0)}\\\")\nprint(f\\\"Would\
        \ skip   : {s.get('total_skipped',0)}\\\")\nprint()\nprint('Re-run with execute=true\
        \ to apply.')\n\" | tee -a \"$GITHUB_STEP_SUMMARY\"\n"
    - name: "\U0001F50D [Direct] Dry-run scan \u2014 preview duplicates"
      if: steps.mode.outputs.mode == 'direct'
      env:
        GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
        DISCUSSION_NUMBERS: ${{ github.event.inputs.discussion_numbers || '3756 3673'
          }}
        MARKER_PREFIX: ${{ github.event.inputs.marker_prefix || '' }}
      run: "echo \"## \U0001F50D Dry-run Scan\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"\" >> \"$GITHUB_STEP_SUMMARY\"\nfor disc in $DISCUSSION_NUMBERS; do\n\
        \  echo \"### Discussion  #${disc}\" >> \"$GITHUB_STEP_SUMMARY\"\n  python\
        \ scripts/ci/discussion_cleanup.py scan \\\n    --discussion \"$disc\" \\\n\
        \    ${MARKER_PREFIX:+--marker-prefix \"$MARKER_PREFIX\"} \\\n    2>&1 | tee\
        \ -a \"$GITHUB_STEP_SUMMARY\" || true\n  echo \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \ndone\n"
    - name: "\U0001F4CA [Direct] Statistics"
      if: steps.mode.outputs.mode == 'direct'
      env:
        GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
        DISCUSSION_NUMBERS: ${{ github.event.inputs.discussion_numbers || '3756 3673'
          }}
      run: "echo \"## \U0001F4CA Statistics\" >> \"$GITHUB_STEP_SUMMARY\"\nfor disc\
        \ in $DISCUSSION_NUMBERS; do\n  python scripts/ci/discussion_cleanup.py stats\
        \ \\\n    --discussion \"$disc\" \\\n    2>&1 | tee -a \"$GITHUB_STEP_SUMMARY\"\
        \ || true\ndone\n"
    - name: "\U0001F5D1\uFE0F [Direct] Execute dedup"
      if: 'steps.mode.outputs.mode == ''direct'' &&

        github.event.inputs.execute == ''true''

        '
      env:
        GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
        DISCUSSION_NUMBERS: ${{ github.event.inputs.discussion_numbers || '3756 3673'
          }}
        MARKER_PREFIX: ${{ github.event.inputs.marker_prefix || '' }}
        DELAY_MS: ${{ github.event.inputs.delay_ms || '300' }}
      run: "echo \"## \U0001F5D1\uFE0F Execution Results (direct mode)\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\npython scripts/ci/discussion_cleanup.py\
        \ dedup \\\n  --discussion $DISCUSSION_NUMBERS \\\n  ${MARKER_PREFIX:+--marker-prefix\
        \ \"$MARKER_PREFIX\"} \\\n  --delay-ms \"$DELAY_MS\" \\\n  --execute \\\n\
        \  2>&1 | tee -a \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"_Executed at $(date -u +%Y-%m-%dT%H:%MZ) \u2014 run \\`${{ github.run_id\
        \ }}\\`_\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: "\u2705 [Direct] Post-execution statistics"
      if: 'steps.mode.outputs.mode == ''direct'' &&

        github.event.inputs.execute == ''true''

        '
      env:
        GH_TOKEN: ${{ steps.auth.outputs.resolved_token }}
        DISCUSSION_NUMBERS: ${{ github.event.inputs.discussion_numbers || '3756 3673'
          }}
      run: "echo \"## \u2705 Post-Cleanup Statistics\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nfor disc in $DISCUSSION_NUMBERS; do\n  python scripts/ci/discussion_cleanup.py\
        \ stats \\\n    --discussion \"$disc\" \\\n    2>&1 | tee -a \"$GITHUB_STEP_SUMMARY\"\
        \ || true\ndone\n"
    - name: "\U0001F4CB Scheduled run instructions"
      if: github.event_name == 'schedule'
      run: "echo \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"---\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\u2139\uFE0F **Scheduled weekly dry-run.** To execute cleanup:\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"**Option A \u2014 Manifest mode (recommended):**\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\\`\\`\\`bash\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"# 1. Copilot\
        \ generates manifest:\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"python scripts/ci/discussion_cleanup.py\
        \ generate-manifest \\\\\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"    --discussions\
        \ 3756 3673 \\\\\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"    --output .codex/cleanup/discussion_cleanup_manifest.json\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"# 2. Trigger workflow with manifest:\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"gh workflow run discussion-cleanup.yml \\\\\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"    -f manifest_path=.codex/cleanup/discussion_cleanup_manifest.json\
        \ \\\\\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"    -f execute=true\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"\\`\\`\\`\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"**Option B \u2014 Direct mode:**\" >> \"$GITHUB_STEP_SUMMARY\"\n\
        echo \"\\`\\`\\`bash\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"gh workflow run\
        \ discussion-cleanup.yml -f execute=true\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"\\`\\`\\`\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 10
