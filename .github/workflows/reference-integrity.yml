name: "\U0001F517 Reference Integrity + Agent Size Gate"
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - .github/agents/**
    - .github/workflows/**
    - docs/**
    - scripts/**
    - src/**
    - .codex/**
    - tools/**
    - cognitive_app/**
  push:
    branches:
    - main
    - 0D_base_
  workflow_dispatch:
    inputs:
      scan_dirs:
        description: 'Space-separated list of directories to scan (default: all)'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  cross-reference-integrity:
    name: "\U0001F517 No broken internal links"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Run cross-reference check
      id: xref
      run: 'python scripts/ci/check_cross_references.py 2>&1 | tee /tmp/xref_report.txt

        exit ${PIPESTATUS[0]}

        '
    - name: Post failure annotation
      if: failure()
      run: "echo \"::error title=Broken Internal References::One or more internal\
        \ file references are broken. See job output for details. Fix by updating\
        \ all references BEFORE moving or deleting any file. Policy: Codebase Agency\
        \ Policy \xA72.\"\necho \"\"\necho \"VIOLATION SUMMARY:\"\ngrep \"FILE DOES\
        \ NOT EXIST\\|\U0001F4C4\\|line \" /tmp/xref_report.txt | head -30\n"
    - name: Post PR comment on failure
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: "const fs = require('fs');\nlet report = '';\ntry {\n  report = fs.readFileSync('/tmp/xref_report.txt',\
          \ 'utf8');\n} catch(e) { report = '(report not available)'; }\n\nconst lines\
          \ = report.split('\\n').filter(l =>\n  l.includes('FILE DOES NOT EXIST')\
          \ ||\n  l.includes('\U0001F4C4') ||\n  l.includes('line ') ||\n  l.includes('FIX\
          \ OPTIONS') ||\n  l.includes('NEVER move')\n).slice(0, 40).join('\\n');\n\
          \nawait github.rest.issues.createComment({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  issue_number: context.issue.number,\n  body:\
          \ `## \u274C Reference Integrity Gate \u2014 FAILED\\n\\n` +\n        `**Policy:**\
          \ Codebase Agency Policy \xA72 \u2014 Leave the codebase better than you\
          \ found it.\\n\\n` +\n        `One or more internal file references point\
          \ to files that do not exist. ` +\n        `This means a file was moved\
          \ or deleted without updating all references to it.\\n\\n` +\n        `\\\
          `\\`\\`\\n${lines}\\n\\`\\`\\`\\n\\n` +\n        `**Fix:** Update every\
          \ reference to point to the new location, ` +\n        `or restore the file\
          \ to its original path.\\n\\n` +\n        `**Rule:** Always run \\`python\
          \ scripts/ci/check_cross_references.py\\` ` +\n        `BEFORE moving or\
          \ deleting any file.\\n\\n---\\n_[\U0001F517 Workflow run](` +\n       \
          \ `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_\\\
          n`\n});\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  agent-file-size:
    name: "\U0001F4CF Agent files \u2264 30,000 chars"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Run agent file size check
      id: size
      run: 'python scripts/ci/check_agent_file_sizes.py 2>&1 | tee /tmp/size_report.txt

        exit ${PIPESTATUS[0]}

        '
    - name: Post failure annotation
      if: failure()
      run: 'echo "::error title=Agent File Size Limit Exceeded::One or more .github/agents/*.md
        files exceed 30,000 characters. GitHub Copilot custom agents silently STOP
        WORKING above this limit. Trim the file or move non-agent docs out of .github/agents/."

        cat /tmp/size_report.txt

        '
    - name: Post PR comment on failure
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: "const fs = require('fs');\nlet report = '';\ntry {\n  report = fs.readFileSync('/tmp/size_report.txt',\
          \ 'utf8');\n} catch(e) { report = '(report not available)'; }\n\nconst MARKER\
          \ = '<!-- agent-file-size-gate -->';\nconst body = MARKER + '\\n' +\n  \
          \      `## \u274C Agent File Size Gate \u2014 FAILED\\n\\n` +\n        `**Rule:**\
          \ GitHub Copilot custom agent \\`.md\\` files in \\`.github/agents/\\` `\
          \ +\n        `must NOT exceed **30,000 characters**. Files over this limit\
          \ cause the ` +\n        `custom agent to **silently stop working**.\\n\\\
          n` +\n        `\\`\\`\\`\\n${report}\\n\\`\\`\\`\\n\\n` +\n        `**Fix\
          \ options:**\\n` +\n        `1. Trim the file content to under 30,000 characters,\
          \ OR\\n` +\n        `2. If the file is NOT a registered custom agent (i.e.\
          \ it is a doc/planning ` +\n        `file), move it to \\`docs/\\` or \\\
          `.codex/docs/\\` \u2014 but ONLY AFTER running ` +\n        `\\`python scripts/ci/check_cross_references.py\\\
          ` to verify no references break.\\n`;\n\n// Upsert: update existing comment\
          \ in-place to avoid duplicate spam.\nlet existing = null;\nlet page = 1;\n\
          while (!existing && page <= 20) {\n  const { data: batch } = await github.rest.issues.listComments({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    issue_number:\
          \ context.issue.number,\n    per_page: 100,\n    page,\n  });\n  existing\
          \ = batch.find(c => (c.body || '').includes(MARKER));\n  if (existing ||\
          \ batch.length < 100) break;\n  page++;\n}\n\nif (existing) {\n  await github.rest.issues.updateComment({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    comment_id:\
          \ existing.id,\n    body,\n  });\n} else {\n  await github.rest.issues.createComment({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    issue_number:\
          \ context.issue.number,\n    body,\n  });\n}\n"
    timeout-minutes: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs:
    - cross-reference-integrity
    - agent-file-size
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Reference Integrity
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
