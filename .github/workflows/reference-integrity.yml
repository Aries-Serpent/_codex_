name: "🔗 Reference Integrity + Agent Size Gate"

# WHY THIS WORKFLOW EXISTS
# ────────────────────────
# Codebase Agency Policy §2: "Leave the codebase better than you found it."
#
# Violation pattern this workflow permanently prevents:
#   Moving or deleting a file WITHOUT updating all references to it.
#   This severs live cross-references for agents, CI, and humans.
#   A real violation occurred in PR #3661 (S173): 20 files were moved to
#   archive, breaking 75+ live cross-references. This workflow would have
#   blocked that commit before it entered the repo.
#
# TWO GATES run in parallel on every PR push:
#   Gate 1 — cross-reference-integrity:
#     Scans all .md/.yml/.yaml/.py files for internal path references.
#     Fails if ANY reference points to a file that does not exist.
#     No exceptions. No overrides without human approval.
#
#   Gate 2 — agent-file-size:
#     Scans all .github/agents/*.md files for the 30,000-char limit.
#     GitHub Copilot custom agents silently fail above this limit.
#     Fails if ANY top-level agent file exceeds the limit.
#
# ENFORCEMENT CHAIN (defense in depth):
#   1. pre-commit hook (.pre-commit-config.yaml) — blocks at git commit
#   2. This workflow — blocks at PR merge
#   Both must pass. If pre-commit is bypassed, CI catches it.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/agents/**"
      - ".github/workflows/**"
      - "docs/**"
      - "scripts/**"
      - "src/**"
      - ".codex/**"
      - "tools/**"
      - "cognitive_app/**"
  push:
    branches: [main, "0D_base_"]
  workflow_dispatch:
    inputs:
      scan_dirs:
        description: "Space-separated list of directories to scan (default: all)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reference-integrity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Cross-Reference Integrity ─────────────────────────────────────
  cross-reference-integrity:
    name: "🔗 No broken internal links"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run cross-reference check
        id: xref
        run: |
          python scripts/ci/check_cross_references.py 2>&1 | tee /tmp/xref_report.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure annotation
        if: failure()
        run: |
          echo "::error title=Broken Internal References::One or more internal file references are broken. See job output for details. Fix by updating all references BEFORE moving or deleting any file. Policy: Codebase Agency Policy §2."
          echo ""
          echo "VIOLATION SUMMARY:"
          grep "FILE DOES NOT EXIST\|📄\|line " /tmp/xref_report.txt | head -30

      - name: Post PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('/tmp/xref_report.txt', 'utf8');
            } catch(e) { report = '(report not available)'; }

            const lines = report.split('\n').filter(l =>
              l.includes('FILE DOES NOT EXIST') ||
              l.includes('📄') ||
              l.includes('line ') ||
              l.includes('FIX OPTIONS') ||
              l.includes('NEVER move')
            ).slice(0, 40).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Reference Integrity Gate — FAILED\n\n` +
                    `**Policy:** Codebase Agency Policy §2 — Leave the codebase better than you found it.\n\n` +
                    `One or more internal file references point to files that do not exist. ` +
                    `This means a file was moved or deleted without updating all references to it.\n\n` +
                    `\`\`\`\n${lines}\n\`\`\`\n\n` +
                    `**Fix:** Update every reference to point to the new location, ` +
                    `or restore the file to its original path.\n\n` +
                    `**Rule:** Always run \`python scripts/ci/check_cross_references.py\` ` +
                    `BEFORE moving or deleting any file.\n\n---\n_[🔗 Workflow run](` +
                    `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_\n`
            });

  # ── Gate 2: Agent File Size ────────────────────────────────────────────────
  agent-file-size:
    name: "📏 Agent files ≤ 30,000 chars"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run agent file size check
        id: size
        run: |
          python scripts/ci/check_agent_file_sizes.py 2>&1 | tee /tmp/size_report.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure annotation
        if: failure()
        run: |
          echo "::error title=Agent File Size Limit Exceeded::One or more .github/agents/*.md files exceed 30,000 characters. GitHub Copilot custom agents silently STOP WORKING above this limit. Trim the file or move non-agent docs out of .github/agents/."
          cat /tmp/size_report.txt

      - name: Post PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('/tmp/size_report.txt', 'utf8');
            } catch(e) { report = '(report not available)'; }

            const MARKER = '<!-- agent-file-size-gate -->';
            const body = MARKER + '\n' +
                    `## ❌ Agent File Size Gate — FAILED\n\n` +
                    `**Rule:** GitHub Copilot custom agent \`.md\` files in \`.github/agents/\` ` +
                    `must NOT exceed **30,000 characters**. Files over this limit cause the ` +
                    `custom agent to **silently stop working**.\n\n` +
                    `\`\`\`\n${report}\n\`\`\`\n\n` +
                    `**Fix options:**\n` +
                    `1. Trim the file content to under 30,000 characters, OR\n` +
                    `2. If the file is NOT a registered custom agent (i.e. it is a doc/planning ` +
                    `file), move it to \`docs/\` or \`.codex/docs/\` — but ONLY AFTER running ` +
                    `\`python scripts/ci/check_cross_references.py\` to verify no references break.\n`;

            // Upsert: update existing comment in-place to avoid duplicate spam.
            let existing = null;
            let page = 1;
            while (!existing && page <= 20) {
              const { data: batch } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
                page,
              });
              existing = batch.find(c => (c.body || '').includes(MARKER));
              if (existing || batch.length < 100) break;
              page++;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: [cross-reference-integrity, agent-file-size]
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Reference Integrity"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue:{pr_number} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: reference-integrity.yml → rescue-comment job (S227)_\n\n_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
