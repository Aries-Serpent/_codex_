name: "\U0001F510 Security Findings Copilot Handoff"
on:
  workflow_run:
    workflows:
    - Security Scanning Suite
    types:
    - completed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  create-findings-issue:
    name: Create Security Findings Issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop' || contains(github.event.workflow_run.head_branch, 'copilot'))
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Download security findings artifacts
      uses: actions/download-artifact@v5
      with:
        path: ./security-findings/
        name: security-suite-comprehensive-findings
      continue-on-error: true
    - name: Load and parse findings
      id: findings
      shell: bash
      run: "set -euo pipefail\n\nif [ ! -f ./security-findings/.codex/security-findings-comprehensive.json\
        \ ]; then\n    echo \"No comprehensive findings available - skipping issue\
        \ creation\"\n    echo \"issue_title=No Security Findings Available\" >> \"\
        $GITHUB_OUTPUT\"\n    exit 0\n  fi\n\n  # Parse findings\n  python3 << 'PYTHON_EOF'\
        \ >> \"$GITHUB_OUTPUT\"\n  import json\n\n  with open(\"./security-findings/.codex/security-findings-comprehensive.json\"\
        ) as f:\n    data = json.load(f)\n\n  summary = data.get(\"summary\", {})\n\
        \  print(f\"CRITICAL={summary.get('critical_count', 0)}\")\n  print(f\"HIGH={summary.get('high_count',\
        \ 0)}\")\n  print(f\"TOTAL={summary.get('total_findings', 0)}\")\n  print(f\"\
        AGENTS={len(summary.get('recommended_agent_handoffs', []))}\")\nPYTHON_EOF\n"
    - name: Create findings issue
      if: steps.findings.outputs.TOTAL != ''
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: "const fs = require('fs');\nconst findings = JSON.parse(fs.readFileSync('./security-findings/.codex/security-findings-comprehensive.json',\
          \ 'utf8'));\n\nconst summary = findings.summary;\nconst metadata = findings.scan_metadata;\n\
          \n// Build issue title\nlet title = `\U0001F510 [Auto] Security Findings`;\n\
          if (summary.critical_count > 0) {\n  title += ` \u2014 ${summary.critical_count}\
          \ CRITICAL`;\n}\nif (summary.high_count > 0) {\n  title += `, ${summary.high_count}\
          \ HIGH`;\n}\n\n// Build issue body\nlet body = `## Security Findings Report\\\
          n\\n`;\nbody += `**Commit:** [\\`${metadata.commit.substring(0, 12)}\\`](${findings.scan_metadata.run_url})\\\
          n`;\nbody += `**Run:** [#${metadata.run_id}](${metadata.run_url})\\n\\n`;\n\
          \n// Summary section\nbody += `## Summary\\n\\n`;\nbody += `| Severity |\
          \ Count |\\n`;\nbody += `|----------|-------|\\n`;\nbody += `| \U0001F534\
          \ CRITICAL | ${summary.critical_count} |\\n`;\nbody += `| \U0001F7E0 HIGH\
          \ | ${summary.high_count} |\\n`;\nbody += `| \U0001F7E1 MEDIUM | ${summary.medium_count}\
          \ |\\n`;\nbody += `| \U0001F7E2 LOW | ${summary.low_count} |\\n`;\nbody\
          \ += `| **TOTAL** | **${summary.total_findings}** |\\n\\n`;\n\n// Agent\
          \ assignments\nbody += `## Recommended Agent Handoffs\\n\\n`;\nfor (const\
          \ handoff of summary.recommended_agent_handoffs) {\n  body += `- [\\`${handoff.agent}\\\
          `](.github/agents/${handoff.agent}.md): ${handoff.findings_count} findings\\\
          n`;\n}\n\nbody += `\\n## Findings by Tool\\n\\n`;\nfor (const [tool, findings_list]\
          \ of Object.entries(findings.findings_by_tool)) {\n  if (Array.isArray(findings_list)\
          \ && findings_list.length > 0) {\n    body += `- **${tool}**: ${findings_list.length}\
          \ findings\\n`;\n  }\n}\n\nbody += `\\n## Next Steps\\n\\n`;\nbody += `1.\
          \ Review findings in [comprehensive report](${metadata.run_url}#artifacts)\\\
          n`;\nbody += `2. Assign to appropriate agent or create PR\\n`;\nbody +=\
          \ `3. Track remediation in this issue\\n\\n`;\n\nbody += `---\\n\\n`;\n\
          body += `_Automatically generated by Security Findings Copilot Handoff workflow_\\\
          n`;\n\n// Create labels\nconst labels = ['security-findings', 'copilot-actionable',\
          \ 'automated'];\nif (summary.critical_count > 0) {\n  labels.push('security-risk');\n\
          \  labels.push('priority-critical');\n}\nif (summary.high_count > 0) {\n\
          \  labels.push('priority-high');\n}\n\n// Create the issue\nconst issue\
          \ = await github.rest.issues.create({\n  owner: context.repo.owner,\n  repo:\
          \ context.repo.repo,\n  title: title,\n  body: body,\n  labels: labels,\n\
          });\n\nconsole.log(`\u2705 Created issue  #${issue.data.number}`);\ncore.setOutput('issue_number',\
          \ issue.data.number);\ncore.setOutput('issue_url', issue.data.html_url);\n"
    - name: Comment on PR if available
      if: github.event.workflow_run.event == 'pull_request'
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: "const fs = require('fs');\nconst findings = JSON.parse(fs.readFileSync('./security-findings/.codex/security-findings-comprehensive.json',\
          \ 'utf8'));\n\nconst summary = findings.summary;\n\n// Find PR from workflow\
          \ run\nconst runs = await github.rest.actions.listWorkflowRuns({\n  owner:\
          \ context.repo.owner,\n  repo: context.repo.repo,\n  workflow_id: '${{ github.event.workflow_run.workflow_id\
          \ }}',\n  run_number: '${{ github.event.workflow_run.run_number }}',\n});\n\
          \nif (runs.data.workflow_runs.length === 0) {\n  console.log('No workflow\
          \ run found');\n  return;\n}\n\nconst run = runs.data.workflow_runs[0];\n\
          const pull_requests = run.pull_requests || [];\n\nif (pull_requests.length\
          \ === 0) {\n  console.log('No PRs associated with this run');\n  return;\n\
          }\n\nconst pr_number = pull_requests[0].number;\n\n// Build comment\nlet\
          \ comment = `## \U0001F510 Security Findings Summary\\n\\n`;\ncomment +=\
          \ `| Finding Type | Count |\\n`;\ncomment += `|---|---|\\n`;\ncomment +=\
          \ `| Critical | ${summary.critical_count} |\\n`;\ncomment += `| High | ${summary.high_count}\
          \ |\\n`;\ncomment += `| Medium | ${summary.medium_count} |\\n`;\ncomment\
          \ += `| Low | ${summary.low_count} |\\n\\n`;\n\ncomment += `[View comprehensive\
          \ report](${findings.scan_metadata.run_url}#artifacts)\\n`;\n\n// Post comment\n\
          try {\n  await github.rest.issues.createComment({\n    issue_number: pr_number,\n\
          \    body: comment,\n  });\n  console.log(`\u2705 Posted comment to PR \
          \ #${pr_number}`);\n} catch (e) {\n  console.log(`Warning: Could not post\
          \ comment to PR: ${e.message}`);\n}\n"
