name: Progressive Validation Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Force full validation (ignore PR size)'
        required: false
        default: 'false'
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # Analyze PR size first
  analyze:
    uses: ./.github/workflows/pr-size-analyzer.yml
    permissions:
      contents: read
      pull-requests: write

  # Layer 1: Smoke Tests (Always run - fast validation)
  smoke-tests:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin pytest plugins (PR #3248)
          # Pin pytest plugins before package install (PR #3248 stability fix)
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0



          pip install pytest pytest-timeout

      - name: Run import validation
        id: imports
        continue-on-error: false
        run: |
          echo "Testing basic imports..."
          python -c "import sys; print(f'Python: {sys.version}')"

          # Test core module imports
          python -c "import pathlib; import json; import subprocess" || exit 1

          echo "✓ Import validation passed"

      - name: Run smoke tests
        run: |
          # Quick syntax and basic functionality tests
          # These should complete in <2 minutes
          pytest tests/ -k "smoke or quick" \
            --timeout=60 \
            -v \
            --tb=short \
            -x \
            || echo "smoke_failed=true" >> $GITHUB_OUTPUT

      - name: Report smoke results
        if: always()
        run: |
          echo "### Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Layer 1 validation" >> $GITHUB_STEP_SUMMARY
          echo "**Duration:** < 10 minutes" >> $GITHUB_STEP_SUMMARY

  # Layer 2: Unit Tests (Conditional based on PR size)
  unit-tests:
    needs: [analyze, smoke-tests]
    if: |
      needs.analyze.outputs.pr_size == 'small' ||
      needs.analyze.outputs.pr_size == 'medium' ||
      github.event.inputs.force_full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    strategy:
      matrix:
        shard: [1, 2, 3]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pytest-xdist
          pip install -e .

      - name: Run unit tests (shard ${{ matrix.shard }})
        run: |
          pytest tests/ \
            --timeout=180 \
            -m "not slow and not integration" \
            --dist=loadfile \
            -n auto \
            --shard-id=$((${{ matrix.shard }} - 1)) \
            --num-shards=3 \
            -v \
            || echo "unit_failed=true" >> $GITHUB_OUTPUT

      - name: Report unit results
        if: always()
        run: |
          echo "### Unit Test Results (Shard ${{ matrix.shard }})" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Layer 2 validation" >> $GITHUB_STEP_SUMMARY

  # Layer 3: Integration Tests (Only for small PRs or forced)
  integration-tests:
    needs: [analyze, unit-tests]
    if: |
      needs.analyze.outputs.pr_size == 'small' ||
      github.event.inputs.force_full == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install -e .

      - name: Run integration tests
        run: |
          pytest tests/ \
            --timeout=300 \
            -m "integration and not slow" \
            -v \
            --tb=short \
            || echo "integration_failed=true" >> $GITHUB_OUTPUT

      - name: Report integration results
        if: always()
        run: |
          echo "### Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Layer 3 validation" >> $GITHUB_STEP_SUMMARY

  # Layer 4: Slow Tests (Only on-demand or for small PRs with force)
  slow-tests:
    needs: [analyze, integration-tests]
    if: |
      github.event.inputs.force_full == 'true' &&
      needs.analyze.outputs.pr_size == 'small'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install -e .

      - name: Run slow tests
        run: |
          pytest tests/ \
            --timeout=600 \
            -m "slow" \
            -v \
            --tb=short \
            || echo "slow_failed=true" >> $GITHUB_OUTPUT

      - name: Report slow results
        if: always()
        run: |
          echo "### Slow Test Results" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Layer 4 validation" >> $GITHUB_STEP_SUMMARY

  # Summary and reporting
  validation-summary:
    needs: [analyze, smoke-tests, unit-tests, integration-tests, slow-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (needed for post-pr-summary action)
        uses: actions/checkout@v5

      - name: Generate summary
        id: gen-summary
        uses: actions/github-script@v8
        with:
          script: |
            const prSize = '${{ needs.analyze.outputs.pr_size }}';
            const validationStrategy = '${{ needs.analyze.outputs.validation_strategy }}';

            const layerResults = {
              smoke: '${{ needs.smoke-tests.result }}',
              unit: '${{ needs.unit-tests.result }}',
              integration: '${{ needs.integration-tests.result }}',
              slow: '${{ needs.slow-tests.result }}'
            };

            const statusEmoji = {
              'success': '✅',
              'failure': '❌',
              'skipped': '⏭️',
              'cancelled': '🚫'
            };

            const anyFailed = Object.values(layerResults).some(r => r === 'failure');
            const overallStatus = anyFailed ? 'failure' : 'success';

            const summaryLine = `${prSize} PR · ${validationStrategy} · smoke=${layerResults.smoke} unit=${layerResults.unit}`;
            const details = [
              `| Layer | Status | Notes |`,
              `|-------|--------|-------|`,
              `| 🔥 Smoke | ${statusEmoji[layerResults.smoke] || '❓'} ${layerResults.smoke} | Always runs |`,
              `| 🧪 Unit | ${statusEmoji[layerResults.unit] || '❓'} ${layerResults.unit} | Small/Medium PRs |`,
              `| 🔗 Integration | ${statusEmoji[layerResults.integration] || '❓'} ${layerResults.integration} | Small PRs only |`,
              `| 🐌 Slow | ${statusEmoji[layerResults.slow] || '❓'} ${layerResults.slow} | On-demand |`,
            ].join('\n');

            core.setOutput('status', overallStatus);
            core.setOutput('summary-line', summaryLine);
            core.setOutput('details', details);

      - name: Post to PR Status Dashboard
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-pr-summary
        with:
          workflow-name: 'Progressive Validation'
          status: ${{ steps.gen-summary.outputs.status }}
          summary: ${{ steps.gen-summary.outputs.summary-line }}
          details: ${{ steps.gen-summary.outputs.details }}

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: validation-summary
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Progressive Validation"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue:{pr_number} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: progressive-validation.yml → rescue-comment job (S227)_\n\n_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
