name: Enterprise Compliance & CodeQL

'on':
  pull_request:
    branches:
      - main
      - develop
      - 0D_base_
  push:
    branches:
      - main
      - develop
      - 0D_base_
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan
        run: bandit -r src -f json -c .bandit.yaml -o bandit-report.json || true

      - name: Upload Bandit results (JSON)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: bandit-report.json

  codeql:
    name: CodeQL Security Analysis (Matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze code
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          upload: never

  semgrep:
    name: Semgrep Custom Rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep --config semgrep/semgrep.yml src --sarif > semgrep-report.json || true

      - name: Upload Semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-report.json

  compliance-report:
    if: always()
    name: Generate Compliance Report
    needs:
      - codeql
      - bandit
      - semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create compliance dashboard
        run: |
          echo "# 🛡️ Compliance Audit Report"
          echo "Generated: $(date)"
          echo ""
          echo "## Security Scan Results"
          echo "- CodeQL: COMPLETE"
          echo "- Bandit: COMPLETE"
          echo "- Semgrep: COMPLETE"
          echo ""
          echo "## Next Steps"
          echo "1. Review security alerts in GitHub Security tab"
          echo "2. Address critical/high severity issues"
          echo "3. Create issues for medium/low severity findings"
