name: Enterprise Compliance & CodeQL
'on':
  pull_request:
    branches:
    - main
    - develop
  schedule:
  - cron: 0 2 * * 0
permissions:
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Cache Python dependencies (Layer 1)
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml')
          }}
        restore-keys: '${{ runner.os }}-pip-

          '
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Install Bandit
      run: pip install bandit
    - name: Run Bandit scan
      run: bandit -r src -f json -c .bandit.yaml -o bandit-report.json || true
    - if: always()
      name: Upload Bandit results (JSON)
      uses: actions/upload-artifact@v5
      with:
        path: bandit-report.json
        name: bandit-report
    timeout-minutes: 30
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml
    - uses: github/codeql-action/autobuild@v3
    - uses: github/codeql-action/analyze@v3
      with:
        category: /language:${{ matrix.language }}
        upload: never
    strategy:
      matrix:
        language:
        - python
        - javascript
    timeout-minutes: 30
  compliance-report:
    if: always()
    name: Generate Compliance Report
    needs:
    - codeql
    - bandit
    - semgrep
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Create compliance dashboard
      run: "echo \"# \U0001F6E1\uFE0F Compliance Audit Report\"\necho \"Generated:\
        \ $(date)\"\necho \"\"\necho \"## Security Scan Results\"\necho \"- CodeQL:\
        \ COMPLETE\"\necho \"- Bandit: COMPLETE\"\necho \"- Semgrep: COMPLETE\"\n\
        echo \"\"\necho \"## Next Steps\"\necho \"1. Review security alerts in GitHub\
        \ Security tab\"\necho \"2. Address critical/high severity issues\"\necho\
        \ \"3. Create issues for medium/low severity findings\"\n"
    timeout-minutes: 30
  semgrep:
    name: Semgrep Custom Rules
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install Semgrep
      run: pip install semgrep
    - name: Run Semgrep
      run: 'semgrep --config semgrep/semgrep.yml src --sarif > semgrep-report.json
        || true

        '
    - if: always()
      name: Upload Semgrep results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: semgrep-report.json
    timeout-minutes: 30
