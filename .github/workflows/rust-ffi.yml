name: rust-ffi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-ffi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build with maturin
        # Pin the v1 action to an immutable commit for auditability and reproducible CI behavior.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: build
          args: --release --manifest-path src/codex_core/Cargo.toml --out dist
          sccache: "true"

      - name: Install and test
        run: |
          pip install codex_core --no-index --find-links dist --force-reinstall
          python scripts/test_orchestrator.py

      - name: Write artifact metadata
        run: |
          cat > dist/ARTIFACT_METADATA.json <<EOF
          {
            "workflow": "rust-ffi",
            "os": "${{ runner.os }}",
            "python_version": "3.12",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "created_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload built wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: codex-core-wheel-${{ runner.os }}-py3.12
          path: dist/*
          if-no-files-found: error
