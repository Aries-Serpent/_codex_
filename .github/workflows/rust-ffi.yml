name: rust-ffi
on:
  push:
    branches:
    - main
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  pull_request:
    branches:
    - main
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${ vars.CODEX_CACHE_VERSION || "v2" }

    - name: Build with maturin
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
      with:
        command: build
        args: --release --manifest-path src/codex_core/Cargo.toml --out dist
        sccache: 'true'
    - name: Install and test
      run: 'pip install codex_core --no-index --find-links dist --force-reinstall

        python scripts/test_orchestrator.py

        '
    - name: Write artifact metadata
      run: "cat > dist/ARTIFACT_METADATA.json <<EOF\n{\n  \"workflow\": \"rust-ffi\"\
        ,\n  \"os\": \"${{ runner.os }}\",\n  \"python_version\": \"3.12\",\n  \"\
        sha\": \"${{ github.sha }}\",\n  \"ref\": \"${{ github.ref }}\",\n  \"created_at_utc\"\
        : \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\n}\nEOF\n"
    - name: Upload built wheel artifact
      uses: actions/upload-artifact@v4
      with:
        path: dist/*
        if-no-files-found: error
        name: codex-core-wheel-${{ runner.os }}-py3.12
    timeout-minutes: 45
