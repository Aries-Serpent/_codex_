name: rust-ffi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build with maturin
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          working-directory: src/codex_core
          sccache: "true"

      - name: Install and test
        run: |
          pip install codex_core --no-index --find-links dist --force-reinstall
          python scripts/test_orchestrator.py

      - name: Write artifact metadata
        run: |
          cat > dist/ARTIFACT_METADATA.json <<EOF
          {
            "workflow": "rust-ffi",
            "os": "${{ matrix.os }}",
            "python_version": "${{ matrix.python-version }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "created_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload built wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: codex-core-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
