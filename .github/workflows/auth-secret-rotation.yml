name: GitHub Secrets Rotation

on:
  schedule:
    - cron: '0 2 1 * *'  # Monthly on the 1st at 2 AM UTC
  workflow_dispatch:
    inputs:
      secrets_list:
        description: 'Comma-separated list of secrets to rotate (or "all")'
        required: false
        type: string
        default: 'all'

permissions:
  contents: write
  issues: write

jobs:
  rotate-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install PyGithub cryptography nacl

      - name: List secrets to rotate
        id: list
        run: |
          if [ "${{ github.event.inputs.secrets_list }}" = "all" ] || [ -z "${{ github.event.inputs.secrets_list }}" ]; then
            echo "secrets=TOKEN_SECRET_KEY,GITHUB_OAUTH_CLIENT_SECRET,SESSION_ENCRYPTION_KEY" >> $GITHUB_OUTPUT
          else
            echo "secrets=${{ github.event.inputs.secrets_list }}" >> $GITHUB_OUTPUT
          fi

      - name: Backup existing secrets
        run: |
          python scripts/github_secrets_sync.py --backup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}

      - name: Rotate secrets
        id: rotate
        run: |
          python scripts/github_secrets_sync.py --rotate --secrets "${{ steps.list.outputs.secrets }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          TOKEN_SECRET_KEY: ${{ secrets.TOKEN_SECRET_KEY }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}

      - name: Validate rotated secrets
        run: |
          python scripts/github_secrets_sync.py --validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}

      - name: Update dependent systems
        run: |
          python scripts/github_secrets_sync.py --sync-downstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rotation audit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const rotationData = JSON.parse(fs.readFileSync('rotation_results.json', 'utf8'));

            const body = `## 🔄 GitHub Secrets Rotation Complete

            **Date**: ${new Date().toISOString()}
            **Trigger**: ${context.eventName}

            ### Secrets Rotated
            ${rotationData.rotated.map(s => `- ✅ ${s.name} (${s.status})`).join('\n')}

            ### Validation Results
            ${rotationData.validations.map(v => `- ${v.passed ? '✅' : '❌'} ${v.test}`).join('\n')}

            ### Next Rotation
            Scheduled for: ${rotationData.next_rotation_date}

            ### Backup Location
            Secrets backed up to: ${rotationData.backup_location}

            ---
            *Automated by auth-secret-rotation workflow*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Audit] GitHub Secrets Rotation - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['security', 'secrets', 'audit', 'automated']
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## ⚠️ Secret Rotation Failed

            **Date**: ${new Date().toISOString()}
            **Workflow**: ${context.workflow}
            **Run**: ${context.runId}

            ### Action Required
            Manual intervention needed. Check workflow logs.

            **Rollback Available**: Previous secrets backed up and can be restored.

            ---
            *Automated alert from auth-secret-rotation workflow*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ALERT] Secret Rotation Failed - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['security', 'secrets', 'alert', 'urgent']
            });
