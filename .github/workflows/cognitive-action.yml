name: Cognitive Action Executor

on:
  workflow_run:
    workflows: ["Cognitive Decision Engine"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Task allocation file to execute'
        required: false
        default: 'cognitive/decisions/task_allocation.json'
      dry_run:
        description: 'Dry run mode (no actual execution)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  action_executor:
    name: Execute Allocated Actions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'common'
