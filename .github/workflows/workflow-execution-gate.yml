name: Workflow Execution Gate
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to execute gate for
        required: true
        type: number
      verbose_mode:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: workflow-gate
  cancel-in-progress: false

env:
  GATE_VERSION: "1.0"

jobs:
  gate-check:
    name: Workflow Execution Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"
      - name: Log token fallback tier selection
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # Determine which token tier is active
          if [ -n "${CODEX_MASTER_KEY:-}" ]; then
            TOKEN_TIER="TIER_1_MASTER_KEY"
          elif [ -n "${CODEX_BACKUP_KEY:-}" ]; then
            TOKEN_TIER="TIER_2_BACKUP_KEY"
          else
            TOKEN_TIER="TIER_3_GITHUB_TOKEN"
          fi

          # Emit telemetry event (non-sensitive, just the tier name)
          TELEMETRY_MSG="[TELEMETRY] ${TIMESTAMP} | workflow=workflow-execution-gate"
          TELEMETRY_MSG="${TELEMETRY_MSG} | job=gate-check | event=token-selection"
          TELEMETRY_MSG="${TELEMETRY_MSG} | tier=${TOKEN_TIER} | run_id=${{ github.run_id }}"
          echo "$TELEMETRY_MSG"

          # Store in workflow run summary
          echo "## 🔑 Token Fallback Tier" >> $GITHUB_STEP_SUMMARY
          echo "Selected tier: \`${TOKEN_TIER}\`" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp: \`${TIMESTAMP}\`" >> $GITHUB_STEP_SUMMARY
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/
            pyproject.toml
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Gate check
        run: |
          set -euo pipefail
          echo "✓ Gate check initialized successfully"
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "PR_NUMBER: ${{ inputs.pr_number }}"
          fi
          exit 0
      - name: Trigger auto-approve workflows (optional)
        continue-on-error: true
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -e
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "⚠️  No PR number provided, skipping auto-approve trigger"
            exit 0
          fi

          echo "Attempting to trigger auto-approve workflow for PR #$PR_NUMBER"
          gh workflow run auto-approve-workflows.yml \
            --repo Aries-Serpent/_codex_ \
            -f approval_source=workflow-execution-gate \
            -f target_pr="$PR_NUMBER" \
            && echo "✓ Auto-approve workflow triggered" || echo "⚠️  Auto-approve workflow trigger skipped (may already be running)"

          exit 0
      - name: Summary
        run: |
          echo "✓ Workflow gate check complete"
          exit 0
