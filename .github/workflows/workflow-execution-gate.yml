name: Workflow Execution Gate
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to parse checklist from
        required: true
        type: string
      triggered_by:
        description: Who triggered this gate (copilot/owner/manual)
        default: manual
        type: string
  pull_request_review:
    types:
    - submitted
  pull_request:
    types:
    - edited
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  detect-wec-changes:
    name: Detect WEC Checkbox Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.action == 'edited'
    outputs:
      newly_checked: ${{ steps.detect.outputs.newly_checked }}
      newly_unchecked: ${{ steps.detect.outputs.newly_unchecked }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    env:
      GH_TRICKLE_POLITE_SLEEP: '0.3'
      GH_TRICKLE_MIN_REMAINING: '50'
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        sparse-checkout: 'scripts/ci/

          pyproject.toml

          '
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.13
        cache: pip
    - name: "\U0001F50B Rate-limit pre-check"
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "python scripts/ci/github_api_trickle.py --status || {\n  echo \"::warning::All\
        \ GitHub API tokens exhausted \u2014 API steps will be skipped\"\n  echo \"\
        RATE_LIMITED=true\" >> \"$GITHUB_ENV\"\n}\n"
    - name: Detect WEC changes
      id: detect
      if: env.RATE_LIMITED != 'true'
      env:
        BODY_BEFORE: ${{ github.event.changes.body.from }}
        BODY_AFTER: ${{ github.event.pull_request.body }}
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
      run: "python scripts/ci/wec_enforcer.py --detect-changes > wec_changes.json\
        \ || true\nNEWLY_CHECKED=$(python3 -c \"import json,sys; d=json.load(open('wec_changes.json'));\
        \ print(json.dumps(d.get('newly_checked', [])))\" 2>/dev/null || echo \"[]\"\
        )\nNEWLY_UNCHECKED=$(python3 -c \"import json,sys; d=json.load(open('wec_changes.json'));\
        \ print(json.dumps(d.get('newly_unchecked', [])))\" 2>/dev/null || echo \"\
        []\")\nHAS_CHANGES=$(python3 -c \"import json,sys; d=json.load(open('wec_changes.json'));\
        \ print('true' if d.get('newly_checked') or d.get('newly_unchecked') else\
        \ 'false')\" 2>/dev/null || echo \"false\")\necho \"newly_checked=${NEWLY_CHECKED}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"newly_unchecked=${NEWLY_UNCHECKED}\" >> \"\
        $GITHUB_OUTPUT\"\necho \"has_changes=${HAS_CHANGES}\" >> \"$GITHUB_OUTPUT\"\
        \necho \"\u2705 Newly checked: ${NEWLY_CHECKED}\"\necho \"\u23ED\uFE0F Newly\
        \ unchecked: ${NEWLY_UNCHECKED}\"\n"
  cancel-unchecked:
    name: Cancel Runs for Unchecked Workflows
    needs: detect-wec-changes
    if: needs.detect-wec-changes.outputs.has_changes == 'true' && needs.detect-wec-changes.outputs.newly_unchecked
      != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        sparse-checkout: 'scripts/ci/

          pyproject.toml

          '
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.13
        cache: pip
    - name: Rate-limit pre-check
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "REMAINING=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null\
        \ || echo \"0\")\necho \"GitHub API rate limit remaining: ${REMAINING}\"\n\
        if [[ \"${REMAINING}\" =~ ^[0-9]+$ ]] && [ \"${REMAINING}\" -lt 50 ]; then\n\
        \  RESET_AT=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null ||\
        \ echo \"unknown\")\n  echo \"::warning::GitHub API rate limit critically\
        \ low (${REMAINING} remaining, resets at ${RESET_AT}). cancel-unchecked may\
        \ be throttled.\"\nfi\n"
    - name: Cancel in-progress runs for unchecked workflows
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_BRANCH: ${{ github.head_ref }}
        NEWLY_UNCHECKED: ${{ needs.detect-wec-changes.outputs.newly_unchecked }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: "echo \"Cancelling in-progress runs for unchecked workflows...\"\npython\
        \ scripts/ci/wec_enforcer.py \\\n  --cancel-unchecked \\\n  --pr \"${PR_NUMBER}\"\
        \ \\\n  --head-sha \"${HEAD_SHA}\" \\\n  --repo \"${REPO}\"\n"
    - name: Protect owner-selected flags from bot resets
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        NEWLY_UNCHECKED: ${{ needs.detect-wec-changes.outputs.newly_unchecked }}
        SENDER_LOGIN: ${{ github.event.sender.login }}
      run: "# Determine whether the edit came from an automated bot or a human owner.\n\
        # Bot logins end in \"[bot]\" (e.g. \"copilot-swe-agent[bot]\", \"github-actions[bot]\"\
        ).\nIS_BOT=false\nif printf '%s' \"${SENDER_LOGIN}\" | grep -qE '\\[bot\\\
        ]$'; then\n  IS_BOT=true\nfi\n\n# Flags that must NEVER be silently reset\
        \ by bots once the owner has set them.\nPROTECTED=\"auto-approve-workflows\"\
        \n\nfor FLAG in ${PROTECTED}; do\n  # Check whether this flag was in the unchecked\
        \ list (single-line Python avoids YAML indent issues)\n  WAS_RESET=$(python3\
        \ -c \"import json,sys; items=json.loads(sys.argv[1]); print('true' if sys.argv[2]\
        \ in items else 'false')\" \"${NEWLY_UNCHECKED}\" \"${FLAG}\" 2>/dev/null\
        \ || echo \"false\")\n\n  if [ \"${WAS_RESET}\" != \"true\" ]; then\n    continue\n\
        \  fi\n\n  if [ \"${IS_BOT}\" = \"true\" ]; then\n    # Bot accidentally reset\
        \ a protected flag \u2014 restore [x] in PR body.\n    echo \"\U0001F6E1\uFE0F\
        \  Bot (${SENDER_LOGIN}) reset protected flag '${FLAG}' \u2014 restoring...\"\
        \n    BODY=$(gh pr view \"${PR_NUMBER}\" --repo \"${REPO}\" --json body -q\
        \ '.body // \"\"' 2>/dev/null || echo \"\")\n    if [ -z \"${BODY}\" ]; then\n\
        \      echo \"::warning::Could not fetch PR body; cannot restore '${FLAG}'.\"\
        \n      continue\n    fi\n    printf '%s' \"${BODY}\" > \"${RUNNER_TEMP}/_wec_restore_body.txt\"\
        \n    # Replace '- [ ] <flag>' with '- [x] <flag>' (single-line Python, no\
        \ YAML indent issue)\n    python3 -c \"import re,sys,os; rt=os.environ.get('RUNNER_TEMP','/tmp');\
        \ f=sys.argv[1]; b=open(rt+'/_wec_restore_body.txt').read(); b=re.sub(r'(?m)(^[\
        \ \\t]*-[ \\t]*\\[) \\]([ \\t]+'+re.escape(f)+r')',r'\\1x]\\2',b); open(rt+'/_wec_restored_body.txt','w').write(b)\"\
        \ \"${FLAG}\"\n    gh pr edit \"${PR_NUMBER}\" --repo \"${REPO}\" \\\n   \
        \   --body \"$(cat \"${RUNNER_TEMP}/_wec_restored_body.txt\")\" \\\n     \
        \ && echo \"\u2705 Restored [x] ${FLAG} in PR body (bot reset blocked).\"\
        \ \\\n      || echo \"::warning::PR body restore failed \u2014 please manually\
        \ re-check [x] ${FLAG}.\"\n  else\n    # Human owner intentionally unchecked\
        \ \u2014 remove the persistent label too.\n    echo \"\u2139\uFE0F  Owner\
        \ (${SENDER_LOGIN}) unchecked '${FLAG}' \u2014 removing persistent label if\
        \ present.\"\n    gh api --method DELETE \\\n      \"repos/${REPO}/issues/${PR_NUMBER}/labels/wec:auto-approve\"\
        \ \\\n      2>/dev/null && echo \"\u2705 Label 'wec:auto-approve' removed.\"\
        \ \\\n      || echo \"\u2139\uFE0F  Label 'wec:auto-approve' was not present\
        \ (no-op).\"\n  fi\ndone\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  dispatch-checked:
    name: Dispatch & Auto-Approve Newly-Checked Workflows
    needs: detect-wec-changes
    if: needs.detect-wec-changes.outputs.has_changes == 'true' && needs.detect-wec-changes.outputs.newly_checked
      != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        sparse-checkout: 'scripts/ci/

          pyproject.toml

          '
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.13
        cache: pip
    - name: Rate-limit pre-check
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "REMAINING=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null\
        \ || echo \"0\")\necho \"GitHub API rate limit remaining: ${REMAINING}\"\n\
        if [[ \"${REMAINING}\" =~ ^[0-9]+$ ]] && [ \"${REMAINING}\" -lt 50 ]; then\n\
        \  RESET_AT=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null ||\
        \ echo \"unknown\")\n  echo \"::warning::GitHub API rate limit critically\
        \ low (${REMAINING} remaining, resets at ${RESET_AT}). dispatch-checked may\
        \ be throttled.\"\nfi\n"
    - name: Dispatch hub for WEC decision routing
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const newlyChecked = JSON.parse('${{ needs.detect-wec-changes.outputs.newly_checked\
          \ }}' || '[]');\nconst prNumber = parseInt('${{ github.event.pull_request.number\
          \ }}', 10);\nconst owner = context.repo.owner;\nconst repo = context.repo.repo;\n\
          \nif (!newlyChecked || newlyChecked.length === 0) {\n  core.info('No newly-checked\
          \ workflows \u2014 skipping dispatch');\n  return;\n}\n\ncore.info(`Dispatching\
          \ hub for ${newlyChecked.length} newly-checked workflows`);\n\nfor (const\
          \ workflow of newlyChecked) {\n  try {\n    await github.rest.actions.createWorkflowDispatch({\n\
          \      owner,\n      repo,\n      workflow_id: 'auto-approve-workflows.yml',\n\
          \      ref: 'main',\n      inputs: {\n        approval_source: 'workflow-execution-gate',\n\
          \        approval_intent: 'conditional_approve',\n        target_pr: prNumber.toString(),\n\
          \        approval_reason: `WEC checkbox decision: enable ${workflow}`,\n\
          \        approval_ttl_hours: '24',\n        dry_run: 'false'\n      }\n\
          \    });\n    core.info(`\u2705 Hub dispatch for '${workflow}'`);\n  } catch\
          \ (err) {\n    core.warning(`Hub dispatch failed for '${workflow}': ${err.message}`);\n\
          \  }\n}\n"
      continue-on-error: true
    - name: Persist owner-selected flags as labels
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        NEWLY_CHECKED: ${{ needs.detect-wec-changes.outputs.newly_checked }}
      run: "HAS_AUTO=$(python3 -c \"import json,sys; items=json.loads(sys.argv[1]);\
        \ print('true' if 'auto-approve-workflows' in items else 'false')\" \"${NEWLY_CHECKED}\"\
        \ 2>/dev/null || echo \"false\")\n\nif [ \"${HAS_AUTO}\" != \"true\" ]; then\n\
        \  exit 0\nfi\n\necho \"\U0001F3F7\uFE0F  Owner checked 'auto-approve-workflows'\
        \ \u2014 adding persistent label 'wec:auto-approve'...\"\n\n# Create label\
        \ in repo if it doesn't exist yet\ngh api \"repos/${REPO}/labels/wec%3Aauto-approve\"\
        \ &>/dev/null || \\\n  gh api --method POST \"repos/${REPO}/labels\" \\\n\
        \    -f name=\"wec:auto-approve\" \\\n    -f color=\"0075ca\" \\\n    -f description=\"\
        Owner opt-in: auto-approve all pending workflow runs for this PR\" \\\n  \
        \  2>/dev/null || true\n\n# Add label to this PR (idempotent \u2014 safe to\
        \ call even if already present)\ngh api --method POST \"repos/${REPO}/issues/${PR_NUMBER}/labels\"\
        \ \\\n  -f 'labels[]=wec:auto-approve' \\\n  2>/dev/null \\\n  && echo \"\u2705\
        \ Label 'wec:auto-approve' added to PR #${PR_NUMBER}.\" \\\n  || echo \"\u2139\
        \uFE0F  Label already present or could not be added (non-fatal).\"\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  validate-wec-integrity:
    name: Validate WEC Template Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        sparse-checkout: 'scripts/ci/

          pyproject.toml

          '
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.13
        cache: pip
    - name: Rate-limit pre-check
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "REMAINING=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null\
        \ || echo \"0\")\necho \"GitHub API rate limit remaining: ${REMAINING}\"\n\
        if [[ \"${REMAINING}\" =~ ^[0-9]+$ ]] && [ \"${REMAINING}\" -lt 50 ]; then\n\
        \  RESET_AT=$(gh api rate_limit --jq '.resources.core.reset' 2>/dev/null ||\
        \ echo \"unknown\")\n  echo \"::warning::GitHub API rate limit critically\
        \ low (${REMAINING} remaining, resets at ${RESET_AT}). validate-wec-integrity\
        \ may be throttled.\"\nfi\n"
    - name: Validate WEC template integrity
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number
          }}
      run: 'python scripts/ci/wec_enforcer.py --validate-body --pr "${PR_NUMBER}"

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  parse-checklist:
    name: Parse Workflow Checklist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: 'github.event_name == ''workflow_dispatch'' ||

      (github.event_name == ''pull_request_review'' && github.event.review.state ==
      ''approved'') ||

      (github.event_name == ''pull_request'' && github.event.action == ''edited'')

      '
    outputs:
      workflows_to_run: ${{ steps.parse.outputs.workflows_to_run }}
      workflows_to_skip: ${{ steps.parse.outputs.workflows_to_skip }}
      pr_number: ${{ steps.resolve-pr.outputs.pr_number }}
      has_checklist: ${{ steps.parse.outputs.has_checklist }}
      ff_approved: ${{ steps.parse-ff.outputs.ff_approved }}
      ff_files: ${{ steps.parse-ff.outputs.ff_files }}
      ff_merge_mode: ${{ steps.parse-ff.outputs.ff_merge_mode }}
      ff_dry_run: ${{ steps.parse-ff.outputs.ff_dry_run }}
    steps:
    - name: Resolve PR number
      id: resolve-pr
      env:
        PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
        PR_INPUT_NUMBER: ${{ github.event.inputs.pr_number }}
      run: "PR=\"${PR_EVENT_NUMBER:-$PR_INPUT_NUMBER}\"\nif [ -z \"$PR\" ]; then\n\
        \  echo \"::error::Could not determine PR number\"\n  exit 1\nfi\necho \"\
        pr_number=${PR}\" >> \"$GITHUB_OUTPUT\"\necho \"PR number: ${PR}\"\n"
    - name: Parse workflow checklist from PR body
      id: parse
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        RESOLVED_PR: ${{ steps.resolve-pr.outputs.pr_number }}
        GH_REPO: ${{ github.repository }}
      run: "PR=\"${RESOLVED_PR}\"\nBODY=$(gh pr view \"$PR\" --repo \"${GH_REPO}\"\
        \ --json body --jq '.body // \"\"')\n\n# Locate the Workflow Execution Checklist\
        \ section\nSECTION=$(echo \"$BODY\" | awk '\n  /^## \U0001F504 Workflow Execution\
        \ Checklist/ { found=1 }\n  found && /^## / && !/^## \U0001F504 Workflow Execution\
        \ Checklist/ { found=0 }\n  found { print }\n')\n\nif [ -z \"$SECTION\" ];\
        \ then\n  echo \"::notice::No Workflow Execution Checklist section found in\
        \ PR #${PR} body\"\n  echo \"has_checklist=false\" >> \"$GITHUB_OUTPUT\"\n\
        \  echo \"workflows_to_run=\" >> \"$GITHUB_OUTPUT\"\n  echo \"workflows_to_skip=\"\
        \ >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\n\necho \"has_checklist=true\" >> \"\
        $GITHUB_OUTPUT\"\n\n# Parse checked items: lines matching \"- [x] filename.yml\"\
        \nCHECKED=$(echo \"$SECTION\" | grep -oP '(?<=\\- \\[x\\] )\\S+\\.yml' | sort\
        \ -u | tr '\\n' ',')\nUNCHECKED=$(echo \"$SECTION\" | grep -oP '(?<=\\- \\\
        [ \\] )\\S+\\.yml' | sort -u | tr '\\n' ',')\n\n# Remove trailing comma\n\
        CHECKED=\"${CHECKED%,}\"\nUNCHECKED=\"${UNCHECKED%,}\"\n\necho \"workflows_to_run=${CHECKED}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"workflows_to_skip=${UNCHECKED}\" >> \"$GITHUB_OUTPUT\"\
        \n\necho \"\u2705 Workflows to run:  ${CHECKED:-<none>}\"\necho \"\u23ED\uFE0F\
        \ Workflows to skip: ${UNCHECKED:-<none>}\"\n"
    - name: Parse fast-forward section from PR body
      id: parse-ff
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        RESOLVED_PR: ${{ steps.resolve-pr.outputs.pr_number }}
        GH_REPO: ${{ github.repository }}
      run: "PR=\"${RESOLVED_PR}\"\nBODY=$(gh pr view \"$PR\" --repo \"${GH_REPO}\"\
        \ --json body --jq '.body // \"\"')\n\n# Check if the FF checkbox is ticked:\
        \  - [x] \u26A1 **Fast-Forward Approved**\nFF_APPROVED=\"false\"\nif echo\
        \ \"$BODY\" | grep -qP '^\\s*-\\s*\\[x\\].*Fast-Forward Approved'; then\n\
        \  FF_APPROVED=\"true\"\n  echo \"\u26A1 Fast-Forward Approved checkbox is\
        \ CHECKED\"\nelse\n  echo \"\u26A1 Fast-Forward Approved checkbox is unchecked\
        \ \u2014 skipping FF\"\nfi\necho \"ff_approved=${FF_APPROVED}\" >> \"$GITHUB_OUTPUT\"\
        \n\n# Extract inline config comments:\n#   <!-- FF_MERGE_MODE: create-pr -->\n\
        #   <!-- FF_FILES: .github/workflows/foo.yml, scripts/ci/bar.py -->\n#   <!--\
        \ FF_DRY_RUN: false -->\nFF_MERGE_MODE=$(echo \"$BODY\" | grep -oP '(?<=<!--\
        \ FF_MERGE_MODE: )\\S+(?= -->)' | head -1)\nFF_FILES=$(echo \"$BODY\" | grep\
        \ -oP '(?<=<!-- FF_FILES: ).*(?= -->)' | head -1 | xargs)\nFF_DRY_RUN=$(echo\
        \ \"$BODY\" | grep -oP '(?<=<!-- FF_DRY_RUN: )\\S+(?= -->)' | head -1)\n\n\
        # Parse explicit file list from FF_BLOCK_START \u2026 FF_BLOCK_END\nFF_BLOCK=$(echo\
        \ \"$BODY\" | awk '/FF_BLOCK_START/{found=1;next} /FF_BLOCK_END/{found=0}\
        \ found{print}' | grep -v '^$' | grep -v '^Files to' | tr '\\n' ',')\nFF_BLOCK=\"\
        ${FF_BLOCK%,}\"\n# Prefer explicit block over inline comment files\nif [ -n\
        \ \"$FF_BLOCK\" ]; then\n  FF_FILES=\"$FF_BLOCK\"\nfi\n\necho \"ff_merge_mode=${FF_MERGE_MODE:-create-pr}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"ff_files=${FF_FILES}\"                   \
        \    >> \"$GITHUB_OUTPUT\"\necho \"ff_dry_run=${FF_DRY_RUN:-false}\"     \
        \       >> \"$GITHUB_OUTPUT\"\n\necho \"   merge_mode=${FF_MERGE_MODE:-create-pr}\"\
        \necho \"   files=${FF_FILES:-<full allowlist>}\"\necho \"   dry_run=${FF_DRY_RUN:-false}\"\
        \n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  post-gate-summary:
    name: Post Execution Plan
    needs: parse-checklist
    if: always() && needs.parse-checklist.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    steps:
    - name: Build and post execution plan comment
      env:
        GH_REPO: ${{ github.repository }}
        GH_SERVER_URL: ${{ github.server_url }}
        GH_RUN_ID: ${{ github.run_id }}
        GATE_PR: ${{ needs.parse-checklist.outputs.pr_number }}
        GATE_TO_RUN: ${{ needs.parse-checklist.outputs.workflows_to_run }}
        GATE_TO_SKIP: ${{ needs.parse-checklist.outputs.workflows_to_skip }}
        GATE_HAS_CHECKLIST: ${{ needs.parse-checklist.outputs.has_checklist }}
        GATE_TRIGGER: ${{ github.event.inputs.triggered_by || github.event_name }}
      run: "PR=\"${GATE_PR}\"\nTO_RUN=\"${GATE_TO_RUN}\"\nTO_SKIP=\"${GATE_TO_SKIP}\"\
        \nHAS_CHECKLIST=\"${GATE_HAS_CHECKLIST}\"\nTRIGGER=\"${GATE_TRIGGER}\"\nRUN_URL=\"\
        https://github.com/${GH_REPO}/actions/runs/${GH_RUN_ID}\"\nMARKER=\"<!-- workflow-execution-gate:${PR}\
        \ -->\"\n\nif [ \"$HAS_CHECKLIST\" != \"true\" ]; then\n  printf '%s\\n' \\\
        \n    \"${MARKER}\" \\\n    \"## \u2699\uFE0F Workflow Execution Gate \u2014\
        \ No Checklist Found\" \\\n    \"\" \\\n    \"No '## \U0001F504 Workflow Execution\
        \ Checklist' section was found in the PR body.\" \\\n    \"All workflows will\
        \ follow their default triggers.\" \\\n    \"\" \\\n    \"_See: [Workflow\
        \ Checklist Wiring Plan](${GH_SERVER_URL}/${GH_REPO}/blob/0D_base_/docs/workflows/plans/WORKFLOW_CHECKLIST_WIRING_PLAN.md)_\"\
        \ \\\n    \"_[\U0001F517 Gate run](${RUN_URL}) \u2014 triggered by: ${TRIGGER}_\"\
        \ \\\n    > \"${RUNNER_TEMP}/gate_body.txt\"\n  BODY=$(cat \"${RUNNER_TEMP}/gate_body.txt\"\
        )\nelse\n  # Build table rows\n  TABLE_ROWS=\"\"\n  IFS=',' read -ra RUN_LIST\
        \ <<< \"$TO_RUN\"\n  for wf in \"${RUN_LIST[@]}\"; do\n    [ -z \"$wf\" ]\
        \ && continue\n    TABLE_ROWS=\"${TABLE_ROWS}\"$'\\n'\"| \u2705 WILL RUN |\
        \ \\`${wf}\\` |\"\n  done\n\n  IFS=',' read -ra SKIP_LIST <<< \"$TO_SKIP\"\
        \n  for wf in \"${SKIP_LIST[@]}\"; do\n    [ -z \"$wf\" ] && continue\n  \
        \  TABLE_ROWS=\"${TABLE_ROWS}\"$'\\n'\"| \u23ED\uFE0F SKIPPED | \\`${wf}\\\
        ` |\"\n  done\n\n  BODY_FILE=\"${RUNNER_TEMP}/wf_gate_body_${GITHUB_RUN_ID}.txt\"\
        \n  printf '%s\\n' \"${MARKER}\" \\\n    \"## \u2699\uFE0F Workflow Execution\
        \ Gate \u2014 Execution Plan\" \\\n    \"\" \\\n    \"| Status | Workflow\
        \ |\" \\\n    \"|--------|---------|${TABLE_ROWS}\" \\\n    \"\" \\\n    \"\
        > Workflows marked **SKIPPED** will not be triggered. This is controlled by\
        \ the\" \\\n    \"> \\`## \U0001F504 Workflow Execution Checklist\\` section\
        \ in the PR body.\" \\\n    \"\" \\\n    \"_[\U0001F517 Gate run](${RUN_URL})\
        \ \u2014 triggered by: ${TRIGGER}_\" \\\n    > \"${BODY_FILE}\"\n  BODY=$(cat\
        \ \"${BODY_FILE}\")\nfi\n\n# Upsert: find existing gate comment via paginated\
        \ REST API (S299 fix).\n# gh pr view --json comments uses GraphQL comments(first:100)\
        \ which only\n# returns the oldest 100 comments \u2014 misses the WEC anchor\
        \ when PR has\n# >100 comments, causing duplicate posts.  The paginated REST\
        \ API is used\n# instead to reliably search ALL comments regardless of thread\
        \ length.\nEXISTING_ID=$(python3 - << 'PYEOF'\nimport json, os, sys, urllib.request,\
        \ urllib.error\ntoken  = os.environ.get(\"GH_TOKEN\", \"\")\nrepo   = os.environ.get(\"\
        GH_REPO\", \"\")\npr     = os.environ.get(\"GATE_PR\", \"\")\nmarker = f\"\
        <!-- workflow-execution-gate:{pr} -->\"\nhdrs   = {\"Authorization\": f\"\
        Bearer {token}\",\n          \"Accept\": \"application/vnd.github+json\",\n\
        \          \"X-GitHub-Api-Version\": \"2022-11-28\"}\npage, found_id = 1,\
        \ \"\"\nwhile True:\n    url = (f\"https://api.github.com/repos/{repo}/issues/{pr}\"\
        \n           f\"/comments?per_page=100&page={page}\")\n    req = urllib.request.Request(url,\
        \ headers=hdrs)\n    try:\n        with urllib.request.urlopen(req, timeout=20)\
        \ as resp:\n            comments = json.loads(resp.read())\n    except urllib.error.HTTPError\
        \ as exc:\n        print(f\"::warning::WEC upsert lookup HTTP {exc.code}:\
        \ {exc.reason}\", file=sys.stderr)\n        break\n    except Exception as\
        \ exc:\n        print(f\"::warning::WEC upsert lookup error: {exc}\", file=sys.stderr)\n\
        \        break\n    if not isinstance(comments, list):\n        break\n  \
        \  for c in comments:\n        if (c.get(\"body\") or \"\").startswith(marker):\n\
        \            found_id = str(c[\"id\"])\n    if len(comments) < 100:\n    \
        \    break\n    page += 1\nprint(found_id)\nPYEOF\n)\n\nif [ -n \"$EXISTING_ID\"\
        \ ] && [ \"$EXISTING_ID\" != \"null\" ]; then\n  gh api \"repos/${GH_REPO}/issues/comments/${EXISTING_ID}\"\
        \ \\\n    -X PATCH --field body=\"$BODY\"\n  echo \"\u2705 Updated existing\
        \ gate comment (ID: ${EXISTING_ID})\"\nelse\n  gh pr comment \"$PR\" --repo\
        \ \"${GH_REPO}\" --body \"$BODY\"\n  echo \"\u2705 Created new gate comment\
        \ on PR #${PR}\"\nfi\n"
  fast-forward:
    name: "\u26A1 Fast-Forward Safe Files (mode=${{ needs.parse-checklist.outputs.ff_merge_mode\
      \ }})"
    needs: parse-checklist
    if: 'needs.parse-checklist.result == ''success'' &&

      needs.parse-checklist.outputs.ff_approved == ''true''

      '
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
    - name: Checkout fast-forward script
      uses: actions/checkout@v7.0.0
      with:
        sparse-checkout: 'scripts/ci/fast_forward_safe_files.py

          .codex/fast_forward_allowlist.yaml

          pyproject.toml

          '
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: 3.12.13
        cache: pip
    - name: Install PyYAML
      run: pip install pyyaml --quiet
    - name: "\u26A1 Execute fast-forward"
      id: ff
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        FF_PR: ${{ needs.parse-checklist.outputs.pr_number }}
        FF_MERGE_MODE: ${{ needs.parse-checklist.outputs.ff_merge_mode }}
        FF_DRY_RUN: ${{ needs.parse-checklist.outputs.ff_dry_run }}
        FF_FILES: ${{ needs.parse-checklist.outputs.ff_files }}
      run: "PR=\"${FF_PR}\"\nMERGE_MODE=\"${FF_MERGE_MODE}\"\nDRY_RUN=\"${FF_DRY_RUN}\"\
        \nFF_FILES_LIST=\"${FF_FILES}\"\n\n# Build optional --files arg as a Bash\
        \ array (avoids SC2089/SC2090)\nFILES_ARG=()\nif [ -n \"$FF_FILES_LIST\" ];\
        \ then\n  # Convert comma/space list to individual --files arguments\n  read\
        \ -ra _FILE_LIST <<< \"$(echo \"$FF_FILES_LIST\" | tr ',' ' ')\"\n  FILES_ARG=(--files\
        \ \"${_FILE_LIST[@]}\")\nfi\n\nDRY_FLAG=()\n[ \"$DRY_RUN\" = \"true\" ] &&\
        \ DRY_FLAG=(--dry-run)\n\npython scripts/ci/fast_forward_safe_files.py \\\n\
        \  --repo  \"$GITHUB_REPOSITORY\" \\\n  --token \"$GITHUB_TOKEN\" \\\n  --pr\
        \    \"$PR\" \\\n  --target main \\\n  --merge-mode \"$MERGE_MODE\" \\\n \
        \ --output \"${RUNNER_TEMP}/ff_result.json\" \\\n  \"${DRY_FLAG[@]}\" \"${FILES_ARG[@]}\"\
        \n"
    - name: Upload fast-forward result artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: wec-fast-forward-pr${{ needs.parse-checklist.outputs.pr_number }}-${{
          github.run_id }}
        path: ${{ runner.temp }}/ff_result.json
        retention-days: 30
    - name: Post fast-forward result comment to PR
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ needs.parse-checklist.outputs.pr_number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: "[ -f \"${RUNNER_TEMP}/ff_result.json\" ] || exit 0\n\npython3 - <<'PYEOF'\n\
        import json, os, subprocess\n\ndata     = json.load(open(os.environ.get('RUNNER_TEMP',\
        \ '/tmp') + '/ff_result.json'))\npr       = os.environ.get('PR', '?')\nrepo\
        \     = os.environ.get('GITHUB_REPOSITORY', '')\nrun_url  = f\"https://github.com/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}\"\
        \nstatus   = data.get('status', 'unknown')\nicons    = {'dry-run':'\U0001F515\
        ','pr-created':'\u2705','direct-pushed':'\U0001F680','nothing-to-promote':'\u23ED\
        \uFE0F'}\nlabel    = icons.get(status, f'\u2753 {status}')\nmarker   = f\"\
        <!-- wec-ff-result:{pr} -->\"\n\nlines = [\n    marker,\n    f\"## \u26A1\
        \ Fast-Forward Result \u2014 {label}\",\n    \"\",\n]\nif status == 'pr-created':\n\
        \    lines += [\n        f\"**Fast-forward PR:** [#{data['fast_forward_pr']}]({data['fast_forward_pr_url']})\"\
        ,\n        f\"**Staging branch:** `{data['staging_branch']}`\",\n        \"\
        \",\n    ]\nelif status == 'direct-pushed':\n    lines += [\n        f\"**Pushed\
        \ to:** `{data['target_branch']}`\",\n        f\"**New SHA:** `{data.get('new_sha','?')[:8]}`\"\
        ,\n        \"\",\n    ]\n\npromoted = data.get('files_promoted') or data.get('would_promote',\
        \ [])\nif promoted:\n    lines += [f\"### Files promoted ({len(promoted)})\"\
        , \"\"]\n    lines += [f\"- `{f}`\" for f in promoted]\nexcluded = data.get('files_excluded')\
        \ or data.get('would_exclude', [])\nif excluded:\n    lines += [f\"\\n###\
        \ Excluded \u2014 not in allowlist ({len(excluded)})\", \"\"]\n    lines +=\
        \ [f\"- `{f}`\" for f in excluded]\ndenied = data.get('files_denied') or data.get('would_deny',\
        \ [])\nif denied:\n    lines += [f\"\\n### \U0001F6AB Denied ({len(denied)})\"\
        , \"\"]\n    lines += [f\"- `{f}`\" for f in denied]\n\nlines += [\"\", f\"\
        _[\U0001F517 WEC gate run]({run_url})_\"]\nbody = '\\n'.join(lines)\n\n# Upsert\
        \ comment \u2014 paginated REST API (S299 fix: gh pr view --json comments\n\
        # only returns first 100 via GraphQL; REST pagination covers all comments).\n\
        import sys, urllib.request, urllib.error\ntoken = os.environ.get(\"GH_TOKEN\"\
        , \"\")\nhdrs  = {\"Authorization\": f\"Bearer {token}\",\n         \"Accept\"\
        : \"application/vnd.github+json\",\n         \"X-GitHub-Api-Version\": \"\
        2022-11-28\"}\npage_num, existing_id = 1, \"\"\nwhile True:\n    url = (f\"\
        https://api.github.com/repos/{repo}/issues/{pr}\"\n           f\"/comments?per_page=100&page={page_num}\"\
        )\n    req = urllib.request.Request(url, headers=hdrs)\n    try:\n       \
        \ with urllib.request.urlopen(req, timeout=20) as resp:\n            page_comments\
        \ = json.loads(resp.read())\n    except urllib.error.HTTPError as exc:\n \
        \       print(f\"::warning::WEC FF upsert lookup HTTP {exc.code}: {exc.reason}\"\
        , file=sys.stderr)\n        break\n    except Exception as exc:\n        print(f\"\
        ::warning::WEC FF upsert lookup error: {exc}\", file=sys.stderr)\n       \
        \ break\n    if not isinstance(page_comments, list):\n        break\n    for\
        \ c in page_comments:\n        if (c.get(\"body\") or \"\").startswith(marker):\n\
        \            existing_id = str(c[\"id\"])\n    if len(page_comments) < 100:\n\
        \        break\n    page_num += 1\ntry:\n    if existing_id:\n        subprocess.run(['gh',\
        \ 'api', f'repos/{repo}/issues/comments/{existing_id}',\n                \
        \        '-X', 'PATCH', '--field', f'body={body}'], check=True)\n    else:\n\
        \        subprocess.run(['gh', 'pr', 'comment', pr, '--repo', repo, '--body',\
        \ body], check=True)\nexcept subprocess.CalledProcessError as exc:\n    op\
        \ = \"update\" if existing_id else \"creation\"\n    print(f\"::warning::WEC\
        \ FF comment {op} failed (exit {exc.returncode}) \u2014 non-fatal, continuing.\"\
        , file=sys.stderr)\nPYEOF\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
