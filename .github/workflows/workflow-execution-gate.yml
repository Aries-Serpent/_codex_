name: Workflow Execution Gate
'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to execute gate for
        required: false
        type: number
      verbose_mode:
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: write
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
env:
  GATE_VERSION: '1.0'
jobs:
  gate-check:
    name: Workflow Execution Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
    steps:
      - name: Mask secrets
        shell: bash
        run: |
          if [ -n "${GH_TOKEN:-}" ]; then
            echo "::add-mask::${GH_TOKEN}"
          fi

      - name: Log token fallback tier selection
        shell: bash
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          if [ -n "${CODEX_MASTER_KEY:-}" ]; then
            TOKEN_TIER="TIER_1_MASTER_KEY"
          elif [ -n "${CODEX_BACKUP_KEY:-}" ]; then
            TOKEN_TIER="TIER_2_BACKUP_KEY"
          else
            TOKEN_TIER="TIER_3_GITHUB_TOKEN"
          fi
          TELEMETRY_MSG="[TELEMETRY] ${TIMESTAMP} | workflow=workflow-execution-gate"
          TELEMETRY_MSG="${TELEMETRY_MSG} | job=gate-check | event=token-selection"
          TELEMETRY_MSG="${TELEMETRY_MSG} | tier=${TOKEN_TIER} | run_id=${{ github.run_id }}"
          echo "$TELEMETRY_MSG"
          echo "## 🔑 Token Fallback Tier" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected tier: \`${TOKEN_TIER}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Timestamp: \`${TIMESTAMP}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            README.md
            pyproject.toml
            src/
            scripts/__init__.py
            scripts/ci/__init__.py
            scripts/ci/_token_resolver.py
            scripts/ci/
            .github/actions/setup-python-cached/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}

      - name: Gate check
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || github.event.issue.number || '' }}
        run: |
          set -euo pipefail
          echo "✓ Gate check initialized successfully"
          if [ -n "${PR_NUMBER}" ]; then
            echo "PR_NUMBER: ${PR_NUMBER}"
          fi
          exit 0

      - name: Trigger auto-approve workflows (optional)
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number || github.event.issue.number || '' }}
        run: |
          set -e
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "⚠️  No PR number provided, skipping auto-approve trigger"
            exit 0
          fi
          echo "Attempting to trigger auto-approve workflow for PR #$PR_NUMBER"
          gh workflow run auto-approve-workflows.yml \
            --repo Aries-Serpent/_codex_ \
            -f approval_source=workflow-execution-gate \
            -f target_pr="$PR_NUMBER" \
            && echo "✓ Auto-approve workflow triggered" \
            || echo "⚠️  Auto-approve workflow trigger skipped (may already be running)"
          exit 0

      - name: Summary
        run: |
          echo "✓ Workflow gate check complete"
          exit 0
