name: "🔀 Branch Rebase Gate"

# REQ-10 enforcement workflow.
#
# Purpose
# -------
# When a PR branch is BEHIND or DIVERGED from its base branch, the Copilot
# Coding Agent MUST rebase before starting any other work.  This workflow:
#
#   1. Detects diverged/behind state using the GitHub compare API.
#   2. Posts a "BRANCH_REBASE_REQUIRED" marker comment to the PR so the
#      agent sees it as present-tense instruction (not background memory).
#   3. Writes REQ-10 status to the job summary.
#   4. When the branch is subsequently updated and is no longer behind,
#      posts a "BRANCH_REBASE_RESOLVED" comment to clear the gate.
#
# Integration
# -----------
# The cognitive-preflight job in agent-auth-delegation.yml reads the
# BRANCH_REBASE_REQUIRED marker (REQ-10 step) and blocks agent activation
# if the marker is present and unresolved.
#
# Script: scripts/ci/branch_rebase_check.py
# Policy: .codex/CODEBASE_AGENCY_POLICY.md §0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write     # Required for auto-merge via GitHub Merges API
  pull-requests: write
  issues: write

concurrency:
  group: rebase-gate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  rebase-check:
    name: "🔀 REQ-10: Branch Rebase Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip dependabot PRs — they are always based on fresh commits
    if: github.actor != 'dependabot[bot]'

    outputs:
      rebase_required: ${{ steps.check.outputs.rebase_required }}
      rebase_status:   ${{ steps.check.outputs.rebase_status }}
      behind_by:       ${{ steps.check.outputs.behind_by }}
      base_branch:     ${{ steps.check.outputs.base_branch }}
      head_branch:     ${{ steps.check.outputs.head_branch }}

    steps:
      - name: "📥 Checkout (sparse — script only)"
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/branch_rebase_check.py
          sparse-checkout-cone-mode: false

      - name: "🗂️ Pre-create pip cache dir"
        run: mkdir -p ~/.cache/pip
        # setup-python@v5 post-step fails with "Cache folder doesn't exist on disk"
        # when no packages are installed (stdlib-only sparse checkout).
        # Pre-creating the directory prevents that transient post-step failure.

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No pip cache: sparse checkout contains only the rebase-check script
          # which uses stdlib only.  Enabling cache: 'pip' fails because no
          # requirements files exist in the checkout and ~/.cache/pip is never
          # created, causing the post-step to fail with "Cache folder doesn't
          # exist on disk".

      - name: "🔍 Check rebase status"
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ci/branch_rebase_check.py \
            --repo "${{ github.repository }}" \
            --pr  "${{ github.event.pull_request.number }}" \
            --post-comment \
            --auto-merge-skip-ci \
            --upsert-dashboard \
            --github-output \
            --github-summary
          # Script exits 0 always in non-hard-fail mode — status is in outputs
          echo "✅ Rebase check complete"

      - name: "🔴 Annotate when rebase required"
        if: steps.check.outputs.rebase_required == 'true'
        run: |
          BEHIND="${{ steps.check.outputs.behind_by }}"
          BASE="${{ steps.check.outputs.base_branch }}"
          HEAD="${{ steps.check.outputs.head_branch }}"
          echo "::error title=REQ-10 Rebase Required::Branch '${HEAD}' is ${BEHIND} commit(s) behind '${BASE}'. Rebase before starting agent work."

      - name: "✅ Confirm branch is up-to-date"
        if: steps.check.outputs.rebase_required == 'false'
        run: |
          STATUS="${{ steps.check.outputs.rebase_status }}"
          BASE="${{ steps.check.outputs.base_branch }}"
          HEAD="${{ steps.check.outputs.head_branch }}"
          echo "✅ REQ-10 PASS: Branch '${HEAD}' is ${STATUS} relative to '${BASE}' — no rebase needed."

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: rebase-check
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Branch Rebase Gate"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: branch-rebase-gate.yml → rescue-comment job (S227)_"""
          _,comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100")
          existing_id=None; existing_body=""
          if isinstance(comments,list):
            for c in comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
