name: ML Components Test Suite
'on':
  push:
    branches:
      - main
      - develop
    paths:
      - src/**/*.py
      - training/**/*.py
      - tests/**/*.py
      - requirements.txt
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-ml-components:
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.12'
        test-suite:
          - training
          - data
          - metrics
          - callbacks
          - checkpointing
          - integration
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ matrix.python-version }}
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2 pytest-cov==7.0.0 pytest-mock==3.14.0 pytest-timeout==2.4.0

      - name: Run ${{ matrix.test-suite }} tests
        run: |
          set -e
          pytest tests/${{ matrix.test-suite }}/ \
            -v \
            --cov=src \
            --cov=training \
            --cov-report=xml \
            --cov-report=term \
            --timeout=300 \
            -m "not slow"

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: always()
        with:
          file: ./coverage.xml
          flags: ${{ matrix.test-suite }}
          token: ${{ secrets.CODECOV_TOKEN }}
          name: ${{ matrix.test-suite }}-${{ matrix.python-version }}
          fail_ci_if_error: false
    timeout-minutes: 30

  test-integration-slow:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test-ml-components
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python with caching
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.2 pytest-timeout==2.4.0

      - name: Run integration tests
        run: |
          set -e
          pytest tests/integration/ \
            -v \
            -m "integration" \
            --timeout=600

      - name: Run all tests with coverage
        if: always()
        run: |
          set -e
          pytest tests/ \
            --cov=src \
            --cov=training \
            --cov-report=term \
            --cov-report=html \
            --cov-fail-under=70 \
            -m "not slow and not integration"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          path: htmlcov/
          name: coverage-report
    timeout-minutes: 30
