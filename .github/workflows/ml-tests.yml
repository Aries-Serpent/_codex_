name: ML Components Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**/*.py'
      - 'training/**/*.py'
      - 'tests/**/*.py'
      - 'requirements.txt'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC

jobs:
  test-ml-components:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11']
        test-suite:
          - training
          - data
          - metrics
          - callbacks
          - checkpointing
          - integration

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt || true
          pip install pytest==8.4.2 pytest-cov==7.0.0 pytest-mock==3.14.0 pytest-timeout==2.4.0

      - name: Run ${{ matrix.test-suite }} tests
        run: |
          pytest tests/${{ matrix.test-suite }}/ \
            -v \
            --cov=src \
            --cov=training \
            --cov-report=xml \
            --cov-report=term \
            --timeout=300 \
            -m "not slow" || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: ${{ matrix.test-suite }}
          name: ${{ matrix.test-suite }}-${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  test-integration-slow:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test-ml-components

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt || true
          pip install pytest==8.4.2 pytest-timeout==2.4.0

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            -m "integration" \
            --timeout=600 || true

  test-coverage-gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-ml-components

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt || true
          pip install pytest pytest-cov

      - name: Run all tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov=training \
            --cov-report=term \
            --cov-report=html \
            --cov-fail-under=70 \
            -m "not slow and not integration" || true

      - name: Archive coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
