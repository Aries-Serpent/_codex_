name: AST Analysis
on:
  pull_request:
    paths:
      - '**.py'
      - 'src/**'
      - 'agents/**'
      - 'scripts/**'
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run code smell detection
        id: smell-check
        continue-on-error: true
        run: |
          python << 'EOF'
          import sys
          from pathlib import Path
          from codex.ast import CodeSmellDetector, SmellSeverity
          
          detector = CodeSmellDetector()
          
          # Scan modified Python files
          errors = []
          warnings = []
          infos = []
          
          for py_file in Path('src').rglob('*.py'):
              try:
                  smells = detector.detect_file(str(py_file))
                  for smell in smells:
                      if smell.severity == SmellSeverity.ERROR:
                          errors.append((py_file, smell))
                          print(f'::error file={py_file},line={smell.line_start}::{smell.rule_id} {smell.message}')
                      elif smell.severity == SmellSeverity.WARNING:
                          warnings.append((py_file, smell))
                          print(f'::warning file={py_file},line={smell.line_start}::{smell.rule_id} {smell.message}')
                      else:
                          infos.append((py_file, smell))
              except Exception as e:
                  print(f'::warning file={py_file}::Failed to analyze: {e}')
          
          print(f'\n📊 Code Smell Summary:')
          print(f'  Errors: {len(errors)}')
          print(f'  Warnings: {len(warnings)}')
          print(f'  Info: {len(infos)}')
          
          # Block merge on error-level smells
          if errors:
              print(f'\n❌ Found {len(errors)} error-level code smells')
              sys.exit(1)
          else:
              print('\n✅ No error-level code smells found')
          EOF
      
      - name: Export knowledge graph
        if: always()
        run: |
          python << 'EOF'
          from pathlib import Path
          from codex.ast import parse_python, export_knowledge_graph, ExportFormat
          
          nodes = []
          for py_file in Path('src').rglob('*.py'):
              try:
                  tree = parse_python(str(py_file))
                  if tree:
                      nodes.append(tree)
              except Exception as e:
                  print(f'Warning: Failed to parse {py_file}: {e}')
          
          if nodes:
              export_knowledge_graph(nodes, ExportFormat.JSON, 'ast_report.json')
              print(f'✅ Exported knowledge graph with {len(nodes)} root nodes')
          else:
              print('⚠️  No nodes to export')
          EOF
      
      - name: Upload AST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ast-analysis-report
          path: ast_report.json
          if-no-files-found: warn
      
      - name: Check for blocking smells
        if: steps.smell-check.outcome == 'failure'
        run: |
          echo "::error::Code smell check failed - error-level smells found"
          exit 1
