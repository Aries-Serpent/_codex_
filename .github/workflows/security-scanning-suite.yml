name: Security Scanning Suite
'on':
  push:
    branches:
    - main
    - develop
    - copilot/**
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  pull_request:
    branches:
    - main
    - develop
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  schedule:
  - cron: 0 2 * * *
  - cron: 0 3 * * 0
  workflow_dispatch:
    inputs:
      scan-type:
        description: Security scan types
        required: true
        type: choice
        options:
        - all
        - codeql
        - dependency
        - semgrep
        - cve
        - containers
        - secrets
        default: all
      lane-id:
        description: Multi-lane orchestration lane id
        required: false
        type: string
        default: lane-security
      shard-id:
        description: Shard identifier within lane
        required: false
        type: string
        default: shard-0
      lane-mode:
        description: Enable multi-lane metadata contracts
        required: false
        type: choice
        options:
        - enabled
        - disabled
        default: enabled
      codeql-wave:
        description: Remediation wave marker
        required: false
        type: choice
        options:
        - false
        - wave0
        - wave1
        - wave2
        - wave3
        default: false
      deterministic-seed:
        description: Deterministic seed for reproducible planning
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      scan-type:
        description: Security scan type
        required: false
        type: string
        default: all
      lane-id:
        description: Multi-lane orchestration lane id
        required: false
        type: string
        default: lane-security
      shard-id:
        description: Shard identifier within lane
        required: false
        type: string
        default: shard-0
      lane-mode:
        description: Enable multi-lane metadata contracts
        required: false
        type: string
        default: enabled
      codeql-wave:
        description: Remediation wave marker
        required: false
        type: string
        default: false
      deterministic-seed:
        description: Deterministic seed for reproducible planning
        required: false
        type: string
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
  issues: write
  actions: read
env:
  PYTHON_VERSION: '3.12'
  SECURITY_ARTIFACT_SCHEMA_VERSION: 1.0.0
jobs:
  lane-metadata-contract:
    name: Lane Metadata Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lane_id: ${{ steps.meta.outputs.lane_id }}
      shard_id: ${{ steps.meta.outputs.shard_id }}
      lane_mode: ${{ steps.meta.outputs.lane_mode }}
      codeql_wave: ${{ steps.meta.outputs.codeql_wave }}
      deterministic_seed: ${{ steps.meta.outputs.deterministic_seed }}
      input_lock_sha256: ${{ steps.lock.outputs.input_lock_sha256 }}
      scan_type: ${{ steps.meta.outputs.scan_type }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Resolve lane metadata defaults safely
      id: meta
      shell: bash
      env:
        IN_SCAN_TYPE: ${{ github.event.inputs.scan-type || inputs.scan-type || 'all'
          }}
        IN_LANE_ID: ${{ github.event.inputs.lane-id || inputs.lane-id || 'lane-security'
          }}
        IN_SHARD_ID: ${{ github.event.inputs.shard-id || inputs.shard-id || 'shard-0'
          }}
        IN_LANE_MODE: ${{ github.event.inputs.lane-mode || inputs.lane-mode || 'enabled'
          }}
        IN_CODEQL_WAVE: ${{ github.event.inputs.codeql-wave || inputs.codeql-wave
          || 'off' }}
        IN_SEED: ${{ github.event.inputs.deterministic-seed || inputs.deterministic-seed
          || '' }}
      run: "set -euo pipefail\n\nLANE_ID=\"${IN_LANE_ID}\"\nSHARD_ID=\"${IN_SHARD_ID}\"\
        \nLANE_MODE=\"${IN_LANE_MODE}\"\nCODEQL_WAVE=\"${IN_CODEQL_WAVE}\"\nDETERMINISTIC_SEED=\"\
        ${IN_SEED}\"\nSCAN_TYPE=\"${IN_SCAN_TYPE}\"\n\nmkdir -p .codex/contracts\n\
        \ncat > .codex/contracts/lane-manifest.json <<EOF\n{\n  \"schema_version\"\
        : \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\",\n  \"workflow\": \"${GITHUB_WORKFLOW}\"\
        ,\n  \"run_id\": \"${GITHUB_RUN_ID}\",\n  \"run_number\": \"${GITHUB_RUN_NUMBER}\"\
        ,\n  \"run_attempt\": \"${GITHUB_RUN_ATTEMPT}\",\n  \"repository\": \"${GITHUB_REPOSITORY}\"\
        ,\n  \"ref\": \"${GITHUB_REF}\",\n  \"sha\": \"${GITHUB_SHA}\",\n  \"event_name\"\
        : \"${GITHUB_EVENT_NAME}\",\n  \"actor\": \"${GITHUB_ACTOR}\",\n  \"scan_type\"\
        : \"${SCAN_TYPE}\",\n  \"lane\": {\n    \"id\": \"${LANE_ID}\",\n    \"shard_id\"\
        : \"${SHARD_ID}\",\n    \"mode\": \"${LANE_MODE}\"\n  },\n  \"codeql_wave\"\
        : \"${CODEQL_WAVE}\",\n  \"deterministic_seed\": \"${DETERMINISTIC_SEED}\"\
        \n}\nEOF\n\necho \"lane_id=${LANE_ID}\" >> \"$GITHUB_OUTPUT\"\necho \"shard_id=${SHARD_ID}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"lane_mode=${LANE_MODE}\" >> \"$GITHUB_OUTPUT\"\
        \necho \"codeql_wave=${CODEQL_WAVE}\" >> \"$GITHUB_OUTPUT\"\necho \"deterministic_seed=${DETERMINISTIC_SEED}\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"scan_type=${SCAN_TYPE}\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Generate input lock
      id: lock
      shell: bash
      run: "set -euo pipefail\n\n{\n  echo \"${GITHUB_SHA}\"\n  find .github/workflows\
        \ -maxdepth 1 -type f -name '*.yml' | sort | xargs sha256sum || true\n  find\
        \ scripts/ci -maxdepth 1 -type f 2>/dev/null | sort | xargs sha256sum || true\n\
        } > .codex/contracts/input-lock.materialized.txt\n\nSHA=\"$(sha256sum .codex/contracts/input-lock.materialized.txt\
        \ | awk '{print $1}')\"\n\ncat > .codex/contracts/input-lock.json <<EOF\n\
        {\n  \"schema_version\": \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\",\n  \"input_lock_sha256\"\
        : \"${SHA}\",\n  \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n \
        \ \"repository\": \"${GITHUB_REPOSITORY}\",\n  \"run_id\": \"${GITHUB_RUN_ID}\"\
        ,\n  \"sha\": \"${GITHUB_SHA}\"\n}\nEOF\n\necho \"input_lock_sha256=${SHA}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Upload lane contract artifact
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-lane-contract
        path: '.codex/contracts/lane-manifest.json

          .codex/contracts/input-lock.json

          .codex/contracts/input-lock.materialized.txt

          '
        if-no-files-found: error
        retention-days: 90
  codeql-scan:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 60
    continue-on-error: ${{ matrix.language == 'javascript' || github.actor == 'dependabot[bot]'
      }}
    if: '(github.event_name == ''push'') ||

      (github.event_name == ''pull_request'') ||

      (github.event_name == ''schedule'') ||

      (github.event_name == ''workflow_dispatch'' && (github.event.inputs.scan-type
      == ''all'' || github.event.inputs.scan-type == ''codeql'')) ||

      (github.event_name == ''workflow_call'' && (inputs.scan-type == '''' || inputs.scan-type
      == ''all'' || inputs.scan-type == ''codeql''))

      '
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
        - python
        - javascript
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended,security-and-quality
        config-file: ./.github/codeql/codeql-config.yml
    - uses: github/codeql-action/autobuild@v3
    - name: Perform CodeQL Analysis
      id: codeql
      uses: github/codeql-action/analyze@v3
      with:
        category: /language:${{ matrix.language }}
        output: codeql-sarif/${{ matrix.language }}
        upload: never
    - name: Build CodeQL summary + lane metadata
      if: always()
      shell: bash
      run: "set -euo pipefail\nmkdir -p codeql-reports .codex/contracts\nSARIF_DIR=\"\
        codeql-sarif/${{ matrix.language }}\"\nSUMMARY=\"codeql-reports/codeql-${{\
        \ matrix.language }}-summary.md\"\n\n{\n  echo \"# CodeQL Report \u2014 ${{\
        \ matrix.language }}\"\n  echo \"\"\n  echo \"- **Repository:** \\`${{ github.repository\
        \ }}\\`\"\n  echo \"- **Commit:** \\`${{ github.sha }}\\`\"\n  echo \"- **Run:**\
        \ [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{\
        \ github.run_id }})\"\n  echo \"- **Job status:** ${{ job.status }}\"\n  echo\
        \ \"- **Analyze outcome:** ${{ steps.codeql.outcome }}\"\n  echo \"- **Lane\
        \ ID:** \\`${{ needs.lane-metadata-contract.outputs.lane_id }}\\`\"\n  echo\
        \ \"- **Shard ID:** \\`${{ needs.lane-metadata-contract.outputs.shard_id }}\\\
        `\"\n  echo \"- **CodeQL Wave:** \\`${{ needs.lane-metadata-contract.outputs.codeql_wave\
        \ }}\\`\"\n  echo \"- **Input Lock SHA:** \\`${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\\`\"\n  echo \"\"\n  if compgen -G \"$SARIF_DIR/*.sarif\" > /dev/null;\
        \ then\n    echo \"## SARIF files produced\"\n    echo \"\"\n    for f in\
        \ \"$SARIF_DIR\"/*.sarif; do\n      size=$(wc -c < \"$f\")\n      counts=$(python\
        \ -c \"import json,sys;d=json.load(open(sys.argv[1]));runs=d.get('runs',[]);rules=sum(len(r.get('tool',{}).get('driver',{}).get('rules',[]))\
        \ for r in runs);results=sum(len(r.get('results',[])) for r in runs);print(f'rules={rules},\
        \ results={results}')\" \"$f\" 2>/dev/null || echo \"rules=?, results=?\"\
        )\n      echo \"- \\`$(basename \"$f\")\\` (${size} bytes, ${counts})\"\n\
        \    done\n  else\n    echo \"_No SARIF files were produced for this language._\"\
        \n  fi\n} > \"$SUMMARY\"\n\ncat \"$SUMMARY\" >> \"$GITHUB_STEP_SUMMARY\"\n\
        \ncat > \".codex/contracts/output-contract-codeql-${{ matrix.language }}.json\"\
        \ <<EOF\n{\n  \"schema_version\": \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\"\
        ,\n  \"job\": \"codeql-scan\",\n  \"language\": \"${{ matrix.language }}\"\
        ,\n  \"lane_id\": \"${{ needs.lane-metadata-contract.outputs.lane_id }}\"\
        ,\n  \"shard_id\": \"${{ needs.lane-metadata-contract.outputs.shard_id }}\"\
        ,\n  \"input_lock_sha256\": \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\",\n  \"required_outputs\": [\n    \"codeql-sarif/${{ matrix.language\
        \ }}\",\n    \"codeql-reports/codeql-${{ matrix.language }}-summary.md\"\n\
        \  ],\n  \"status\": \"${{ job.status }}\"\n}\nEOF\n"
    - name: Upload CodeQL artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-codeql-${{ matrix.language }}
        path: 'codeql-sarif/${{ matrix.language }}/

          codeql-reports/codeql-${{ matrix.language }}-summary.md

          .codex/contracts/output-contract-codeql-${{ matrix.language }}.json

          '
        if-no-files-found: warn
        retention-days: 30
  semgrep:
    name: Semgrep SAST (SARIF Upload)
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 30
    if: '(github.event_name == ''push'') ||

      (github.event_name == ''pull_request'') ||

      (github.event_name == ''schedule'') ||

      (github.event_name == ''workflow_dispatch'' && (github.event.inputs.scan-type
      == ''all'' || github.event.inputs.scan-type == ''semgrep'')) ||

      (github.event_name == ''workflow_call'' && (inputs.scan-type == '''' || inputs.scan-type
      == ''all'' || inputs.scan-type == ''semgrep''))

      '
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      issues: write
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: live
    - name: Install Semgrep
      run: pip install semgrep
    - name: Run Semgrep scan (SARIF)
      id: semgrep
      continue-on-error: true
      run: "set -o pipefail\nsemgrep scan \\\n  --config=p/security-audit \\\n  --config=p/python\
        \ \\\n  --config=p/flask \\\n  --sarif \\\n  --output=semgrep-results.sarif\
        \ \\\n  2>&1 | tee semgrep-scan.log || {\n    echo \"Primary configs failed,\
        \ falling back to auto...\"\n    semgrep scan --config=auto --sarif --output=semgrep-results.sarif\
        \ 2>&1 | tee semgrep-scan-fallback.log\n  }\n"
    - name: Run Semgrep scan (JSON)
      continue-on-error: true
      run: "set -o pipefail\nsemgrep scan \\\n  --config=p/security-audit \\\n  --config=p/python\
        \ \\\n  --config=p/flask \\\n  --json \\\n  --output=semgrep-results.json\
        \ \\\n  2>&1 | tee semgrep-scan-json.log || {\n    echo \"Primary configs\
        \ failed for JSON output, falling back to auto...\"\n    semgrep scan --config=auto\
        \ --json --output=semgrep-results.json 2>&1 | tee semgrep-scan-json-fallback.log\n\
        \  }\n"
    - name: Chunk SARIF results
      if: always() && hashFiles('semgrep-results.sarif') != ''
      run: 'python scripts/chunk_sarif.py semgrep-results.sarif sarif-chunks/ --chunk-size
        4999 --base-name semgrep --verbose

        '
    - name: Upload chunked SARIF to GitHub Security
      if: always() && hashFiles('sarif-chunks/*.sarif') != ''
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "CHUNKS=(sarif-chunks/*.sarif)\nfor i in \"${!CHUNKS[@]}\"; do\n  sarif_file=\"\
        ${CHUNKS[$i]}\"\n  chunk_suffix=$(basename \"$sarif_file\" .sarif | sed 's/semgrep-chunk-//')\n\
        \  gh api \\\n    --method POST \\\n    -H \"Accept: application/vnd.github+json\"\
        \ \\\n    -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n    \"/repos/${{ github.repository\
        \ }}/code-scanning/sarifs\" \\\n    -F \"sarif=@$sarif_file\" \\\n    -F \"\
        commit_sha=${{ github.sha }}\" \\\n    -F \"ref=${{ github.ref }}\" \\\n \
        \   -F \"started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)\" \\\n    -F \"tool_name=Semgrep\"\
        \ \\\n    -F \"category=semgrep-chunk-$chunk_suffix\" \\\n    || true\ndone\n"
    - name: Generate Semgrep summary + contract
      if: always()
      shell: bash
      run: "set -euo pipefail\nRESULTS=0\nERRORS=0\nCHUNK_COUNT=0\n\nif [ -f semgrep-results.json\
        \ ]; then\n  RESULTS=$(python -c \"import json;d=json.load(open('semgrep-results.json'));print(len(d.get('results',[])\
        \ or []))\" 2>/dev/null || echo 0)\n  ERRORS=$(python -c \"import json;d=json.load(open('semgrep-results.json'));print(len(d.get('errors',[])\
        \ or []))\" 2>/dev/null || echo 0)\nfi\nif [ -d sarif-chunks ]; then\n  CHUNK_COUNT=$(find\
        \ sarif-chunks -name '*.sarif' 2>/dev/null | wc -l | tr -d ' ')\nfi\n\n{\n\
        \  echo \"# Semgrep SAST Report\"\n  echo \"\"\n  echo \"- **Findings (results):**\
        \ ${RESULTS}\"\n  echo \"- **Scanner errors:** ${ERRORS}\"\n  echo \"- **SARIF\
        \ chunks uploaded to GHAS:** ${CHUNK_COUNT}\"\n  echo \"- **Scan outcome:**\
        \ ${{ steps.semgrep.outcome }}\"\n  echo \"- **Lane ID:** \\`${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\\`\"\n  echo \"- **Shard ID:** \\`${{ needs.lane-metadata-contract.outputs.shard_id\
        \ }}\\`\"\n  echo \"- **Input Lock SHA:** \\`${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\\`\"\n} > semgrep-summary.md\ncat semgrep-summary.md >> \"$GITHUB_STEP_SUMMARY\"\
        \n\nmkdir -p .codex/contracts\ncat > .codex/contracts/output-contract-semgrep.json\
        \ <<EOF\n{\n  \"schema_version\": \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\"\
        ,\n  \"job\": \"semgrep\",\n  \"lane_id\": \"${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\",\n  \"shard_id\": \"${{ needs.lane-metadata-contract.outputs.shard_id\
        \ }}\",\n  \"input_lock_sha256\": \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\",\n  \"required_outputs\": [\n    \"semgrep-results.sarif\",\n    \"\
        semgrep-results.json\",\n    \"semgrep-summary.md\"\n  ],\n  \"status\": \"\
        ${{ job.status }}\"\n}\nEOF\n"
    - name: Upload Semgrep results artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-semgrep
        path: 'semgrep-results.sarif

          semgrep-results.json

          sarif-chunks/

          semgrep-scan.log

          semgrep-scan-fallback.log

          semgrep-scan-json.log

          semgrep-scan-json-fallback.log

          semgrep-summary.md

          .codex/contracts/output-contract-semgrep.json

          '
        if-no-files-found: warn
        retention-days: 30
  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 30
    if: '(github.event_name == ''push'') ||

      (github.event_name == ''pull_request'') ||

      (github.event_name == ''schedule'') ||

      (github.event_name == ''workflow_dispatch'' && (github.event.inputs.scan-type
      == ''all'' || github.event.inputs.scan-type == ''containers'')) ||

      (github.event_name == ''workflow_call'' && (inputs.scan-type == '''' || inputs.scan-type
      == ''all'' || inputs.scan-type == ''containers''))

      '
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
        - .config/Dockerfile
        - docker/Dockerfile.cpu
        - docker/Dockerfile.gpu
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Validate Dockerfile exists
      run: "if [ ! -f \"${{ matrix.dockerfile }}\" ]; then\n  echo \"\u274C Dockerfile\
        \ not found: ${{ matrix.dockerfile }}\"\n  exit 1\nfi\necho \"\u2705 Dockerfile\
        \ found: ${{ matrix.dockerfile }}\"\n"
    - name: Run Trivy filesystem scan (pre-build)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-fs-results-${{ strategy.job-index }}.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'
    - name: Build Docker image for scanning
      continue-on-error: true
      timeout-minutes: 15
      run: 'docker build -f ${{ matrix.dockerfile }} -t codex-scan:${{ strategy.job-index
        }} . 2>&1 | tee docker-build-${{ strategy.job-index }}.log || true

        '
    - name: Run Trivy image scan (if build succeeded)
      continue-on-error: true
      run: "if docker inspect codex-scan:${{ strategy.job-index }} &>/dev/null; then\n\
        \  echo \"Image found, scanning...\"\n  trivy image --severity CRITICAL,HIGH\
        \ --format sarif --output trivy-image-results-${{ strategy.job-index }}.sarif\
        \ codex-scan:${{ strategy.job-index }} || true\nelse\n  echo \"\u26A0\uFE0F\
        \ Docker image not found, skipping image scan\"\nfi\n"
    - name: Upload SARIF to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-fs-results-${{ strategy.job-index }}.sarif
        wait-for-processing: false
    - name: Generate container scan summary + contract
      if: always()
      shell: bash
      run: "set -euo pipefail\nmkdir -p .codex/contracts\n\n{\n  echo \"# Container\
        \ Security Scan Report\"\n  echo \"- **Dockerfile:** ${{ matrix.dockerfile\
        \ }}\"\n  echo \"- **Scan outcome:** ${{ job.status }}\"\n  echo \"- **Lane\
        \ ID:** \\`${{ needs.lane-metadata-contract.outputs.lane_id }}\\`\"\n  echo\
        \ \"- **Shard ID:** \\`${{ needs.lane-metadata-contract.outputs.shard_id }}\\\
        `\"\n  echo \"\"\n  if [ -f \"docker-build-${{ strategy.job-index }}.log\"\
        \ ]; then\n    echo \"## Docker Build Log\"\n    echo \"\\`\\`\\`\"\n    tail\
        \ -20 \"docker-build-${{ strategy.job-index }}.log\"\n    echo \"\\`\\`\\\
        `\"\n  fi\n} > container-scan-summary-${{ strategy.job-index }}.md\n\ncat\
        \ > .codex/contracts/output-contract-container-${{ strategy.job-index }}.json\
        \ <<'EOFJ'\n{\n  \"schema_version\": \"${{ env.SECURITY_ARTIFACT_SCHEMA_VERSION\
        \ }}\",\n  \"job\": \"container-scan\",\n  \"matrix_index\": \"${{ strategy.job-index\
        \ }}\",\n  \"dockerfile\": \"${{ matrix.dockerfile }}\",\n  \"lane_id\": \"\
        ${{ needs.lane-metadata-contract.outputs.lane_id }}\",\n  \"input_lock_sha256\"\
        : \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}\",\n  \"\
        status\": \"${{ job.status }}\"\n}\nEOFJ\n"
    - name: Upload container scan artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-container-${{ strategy.job-index }}
        path: 'trivy-fs-results-${{ strategy.job-index }}.sarif

          trivy-image-results-${{ strategy.job-index }}.sarif

          container-scan-summary-${{ strategy.job-index }}.md

          docker-build-${{ strategy.job-index }}.log

          .codex/contracts/output-contract-container-${{ strategy.job-index }}.json

          '
        if-no-files-found: warn
        retention-days: 30
  cve-scan:
    name: CVE & Dependency Audit
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 30
    if: '(github.event_name == ''pull_request'') ||

      (github.event_name == ''schedule'') ||

      (github.event_name == ''workflow_dispatch'' && (github.event.inputs.scan-type
      == ''all'' || github.event.inputs.scan-type == ''cve'')) ||

      (github.event_name == ''workflow_call'' && (inputs.scan-type == '''' || inputs.scan-type
      == ''all'' || inputs.scan-type == ''cve''))

      '
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ecosystem:
        - python
        - javascript
        - rust
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Cache Python dependencies (Layer 1)
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml')
          }}
        restore-keys: '${{ runner.os }}-pip-

          '
    - name: Cache Rust cargo-audit (Layer 2 - CVE Tools)
      if: matrix.ecosystem == 'rust'
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-audit
        key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION || '0.20' }}
        restore-keys: '${{ runner.os }}-cargo-audit-

          '
    - if: matrix.ecosystem == 'python'
      name: Scan Python dependencies (pip-audit)
      continue-on-error: true
      timeout-minutes: 10
      run: 'pip install pip-audit

        pip-audit --json --output python-cve-audit.json || true

        pip-audit --desc || true

        '
    - if: matrix.ecosystem == 'javascript' && hashFiles('package.json') != ''
      name: Scan JavaScript dependencies (npm audit)
      continue-on-error: true
      timeout-minutes: 10
      run: 'npm audit --json > javascript-cve-audit.json || true

        npm audit || true

        '
    - if: matrix.ecosystem == 'rust' && hashFiles('Cargo.toml') != ''
      name: Scan Rust dependencies (cargo-audit)
      continue-on-error: true
      timeout-minutes: 15
      run: "# Use cached binary if available, otherwise install\nif [ ! -f ~/.cargo/bin/cargo-audit\
        \ ]; then\n  cargo install cargo-audit --force --locked\nfi\ncargo audit --json\
        \ > rust-cve-audit.json || true\ncargo audit || true\n"
    - name: Generate CVE summary + contract
      if: always()
      shell: bash
      run: "set -euo pipefail\nmkdir -p .codex/contracts\n\n{\n  echo \"# CVE & Dependency\
        \ Audit Report\"\n  echo \"- **Ecosystem:** ${{ matrix.ecosystem }}\"\n  echo\
        \ \"- **Scan outcome:** ${{ job.status }}\"\n  echo \"- **Lane ID:** \\`${{\
        \ needs.lane-metadata-contract.outputs.lane_id }}\\`\"\n} > cve-scan-summary-${{\
        \ matrix.ecosystem }}.md\n\ncat > .codex/contracts/output-contract-cve-${{\
        \ matrix.ecosystem }}.json <<'EOFJ'\n{\n  \"schema_version\": \"${{ env.SECURITY_ARTIFACT_SCHEMA_VERSION\
        \ }}\",\n  \"job\": \"cve-scan\",\n  \"ecosystem\": \"${{ matrix.ecosystem\
        \ }}\",\n  \"lane_id\": \"${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\",\n  \"input_lock_sha256\": \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\",\n  \"status\": \"${{ job.status }}\"\n}\nEOFJ\n"
    - name: Upload CVE scan artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-cve-${{ matrix.ecosystem }}
        path: '*-cve-audit.json

          cve-scan-summary-${{ matrix.ecosystem }}.md

          .codex/contracts/output-contract-cve-${{ matrix.ecosystem }}.json

          '
        if-no-files-found: warn
        retention-days: 30
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 60
    if: '(github.event_name == ''schedule'') ||

      (github.event_name == ''workflow_dispatch'' && (github.event.inputs.scan-type
      == ''all'' || github.event.inputs.scan-type == ''dependency'')) ||

      (github.event_name == ''workflow_call'' && (inputs.scan-type == '''' || inputs.scan-type
      == ''all'' || inputs.scan-type == ''dependency''))

      '
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: common
    - name: Install security tools
      run: 'pip install --upgrade pip

        pip install safety pip-audit

        pip freeze > installed-packages.txt

        '
    - name: Run pip-audit and Safety
      continue-on-error: true
      run: 'pip-audit --format json --output pip-audit.json 2>&1 | tee pip-audit-json.log
        || true

        pip-audit --desc 2>&1 | tee pip-audit-report.txt || true

        pip-audit --format cyclonedx-json --output pip-audit-cyclonedx.json 2>&1 |
        tee pip-audit-cyclonedx.log || true

        safety check --json --output safety.json 2>&1 | tee safety-json.log || true

        safety check 2>&1 | tee safety-report.txt || true

        '
    - name: Generate dependency summary + contract
      if: always()
      shell: bash
      run: "set -euo pipefail\nPIP_AUDIT_COUNT=0\nSAFETY_COUNT=0\n\nif [ -f pip-audit.json\
        \ ]; then\n  PIP_AUDIT_COUNT=$(python -c \"import json;d=json.load(open('pip-audit.json'));print(sum(len(p.get('vulns',[]))\
        \ for p in (d.get('dependencies') or [])))\" 2>/dev/null || echo 0)\nfi\n\
        if [ -f safety.json ]; then\n  SAFETY_COUNT=$(python -c \"import json;d=json.load(open('safety.json'));print(len(d.get('vulnerabilities',[]))\
        \ if isinstance(d,dict) else len(d))\" 2>/dev/null || echo 0)\nfi\n\n{\n \
        \ echo \"# Dependency Scan Report\"\n  echo \"- **pip-audit vulnerabilities:**\
        \ ${PIP_AUDIT_COUNT}\"\n  echo \"- **Safety vulnerabilities:** ${SAFETY_COUNT}\"\
        \n  echo \"- **Lane ID:** \\`${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\\`\"\n  echo \"- **Input Lock SHA:** \\`${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\\`\"\n} > dependency-scan-summary.md\ncat dependency-scan-summary.md\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n\nmkdir -p .codex/contracts\ncat > .codex/contracts/output-contract-dependency.json\
        \ <<EOF\n{\n  \"schema_version\": \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\"\
        ,\n  \"job\": \"dependency-scan\",\n  \"lane_id\": \"${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\",\n  \"input_lock_sha256\": \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\",\n  \"required_outputs\": [\n    \"pip-audit.json\",\n    \"safety.json\"\
        ,\n    \"dependency-scan-summary.md\"\n  ],\n  \"status\": \"${{ job.status\
        \ }}\"\n}\nEOF\n"
    - name: Upload dependency artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-dependency
        path: 'pip-audit.json

          pip-audit-cyclonedx.json

          pip-audit-report.txt

          safety.json

          safety-report.txt

          installed-packages.txt

          dependency-scan-summary.md

          pip-audit-json.log

          pip-audit-cyclonedx.log

          safety-json.log

          .codex/contracts/output-contract-dependency.json

          '
        if-no-files-found: warn
        retention-days: 30
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 60
    if: '(github.event_name == ''workflow_dispatch'' && github.event.inputs.scan-type
      == ''all'') ||

      (github.event_name == ''workflow_call'' && (inputs.scan-type == '''' || inputs.scan-type
      == ''all''))

      '
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: ephemeral
    - name: Install detect-secrets
      run: 'pip install --upgrade pip

        pip install detect-secrets

        '
    - name: Run detect-secrets
      id: detect-secrets
      continue-on-error: true
      run: "detect-secrets scan --all-files --force-use-all-plugins \\\n  --exclude-files\
        \ '\\.codex/validation/' \\\n  --exclude-files '\\.venv_ci/' \\\n  --exclude-files\
        \ 'assets/manifest\\.json' \\\n  > .secrets.baseline 2> detect-secrets.log\n\
        SECRETS_COUNT=$(python -c \"import json;print(sum(len(v or []) for v in ((json.load(open('.secrets.baseline')).get('results')\
        \ or {}).values())))\" 2>/dev/null || echo \"0\")\necho \"secrets_found=$SECRETS_COUNT\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Generate secret summary + contract
      if: always()
      shell: bash
      run: "set -euo pipefail\npython - <<'PY'\nimport json\nout = {'results_by_file':\
        \ {}, 'files_with_secrets': 0, 'total_secrets': 0, 'plugins': []}\ntry:\n\
        \  with open('.secrets.baseline') as fh:\n    data = json.load(fh)\n  results\
        \ = data.get('results', {}) or {}\n  out['plugins'] = [p.get('name') for p\
        \ in (data.get('plugins_used') or [])]\n  out['files_with_secrets'] = len(results)\n\
        \  for fname, items in results.items():\n    out['results_by_file'][fname]\
        \ = len(items)\n    out['total_secrets'] += len(items)\nexcept Exception as\
        \ exc:\n  out['error'] = str(exc)\njson.dump(out, open('detect-secrets-summary.json','w'),\
        \ indent=2, sort_keys=True)\nPY\n\n{\n  echo \"# Secret Scan Report\"\n  echo\
        \ \"- **Secrets found:** ${{ steps.detect-secrets.outputs.secrets_found ||\
        \ 0 }}\"\n  echo \"- **Lane ID:** \\`${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\\`\"\n  echo \"- **Input Lock SHA:** \\`${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\\`\"\n} > secret-scan-summary.md\ncat secret-scan-summary.md >> \"$GITHUB_STEP_SUMMARY\"\
        \n\nmkdir -p .codex/contracts\ncat > .codex/contracts/output-contract-secrets.json\
        \ <<EOF\n{\n  \"schema_version\": \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\"\
        ,\n  \"job\": \"secret-scan\",\n  \"lane_id\": \"${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\",\n  \"input_lock_sha256\": \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\",\n  \"required_outputs\": [\n    \".secrets.baseline\",\n    \"detect-secrets-summary.json\"\
        ,\n    \"secret-scan-summary.md\"\n  ],\n  \"status\": \"${{ job.status }}\"\
        \n}\nEOF\n"
    - name: Upload secret scan artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-secrets
        path: '.secrets.baseline

          detect-secrets-summary.json

          detect-secrets.log

          secret-scan-summary.md

          .codex/contracts/output-contract-secrets.json

          '
        if-no-files-found: warn
        retention-days: 30
  sbom-generation:
    name: SBOM Generation
