          }}
      run: "set -euo pipefail\nmkdir -p .codex security .codex/contracts\n\npython\
        \ scripts/ci/aggregate_security_findings.py \\\n  --artifacts-dir security-suite-artifacts\
        \ \\\n  --output-json .codex/security-findings-comprehensive.json \\\n  --output-md\
        \ security-findings-comprehensive.md\n\npython scripts/ci/aggregate_security_findings.py\
        \ \\\n  --artifacts-dir security-suite-artifacts \\\n  --output-json .codex/security-findings-comprehensive.json\
        \ \\\n  --output-md security-findings-comprehensive.md \\\n  --output-csv\
        \ security/codeql-alert-inventory.csv \\\n  --output-priority-csv security/codeql-priority-queue.csv\
        \ \\\n  --output-family-csv security/codeql-family-index.csv \\\n  || true\n\
        \nif [ ! -f security/codeql-alert-inventory.csv ]; then\n  python - <<'PY'\n\
        import json, csv, os\nos.makedirs(\"security\", exist_ok=True)\np=\".codex/security-findings-comprehensive.json\"\
        \nrows=[]\ntry:\n  d=json.load(open(p))\n  findings=d.get(\"findings\",[])\
        \ or []\n  for i,f in enumerate(findings,1):\n    rows.append({\n      \"\
        alert_id\": f.get(\"id\", f\"agg-{i}\"),\n      \"tool\": f.get(\"tool\",\"\
        unknown\"),\n      \"rule_id\": f.get(\"rule_id\",\"\"),\n      \"severity\"\
        : f.get(\"severity\",\"\"),\n      \"file_path\": f.get(\"path\",\"\"),\n\
        \      \"start_line\": f.get(\"start_line\",\"\"),\n      \"end_line\": f.get(\"\
        end_line\",\"\"),\n      \"commit_sha\": d.get(\"metadata\",{}).get(\"commit_sha\"\
        ,\"\"),\n      \"run_id\": d.get(\"metadata\",{}).get(\"run_id\",\"\")\n \
        \   })\nexcept Exception:\n  pass\nwith open(\"security/codeql-alert-inventory.csv\"\
        ,\"w\",newline=\"\") as fh:\n  w=csv.DictWriter(fh,fieldnames=[\"alert_id\"\
        ,\"tool\",\"rule_id\",\"severity\",\"file_path\",\"start_line\",\"end_line\"\
        ,\"commit_sha\",\"run_id\"])\n  w.writeheader()\n  w.writerows(rows)\nPY\n\
        fi\n\n[ -f security/codeql-family-index.csv ] || echo \"family_id,rule_id,count\"\
        \ > security/codeql-family-index.csv\n[ -f security/codeql-priority-queue.csv\
        \ ] || echo \"family_id,priority_score,severity,reachable\" > security/codeql-priority-queue.csv\n\
        \npython - <<'PY'\nimport json, datetime, os, hashlib\nos.makedirs(\"security\"\
        , exist_ok=True)\n\nschema={\n  \"schema_version\":\"1.0.0\",\n  \"generated_at\"\
        :datetime.datetime.now(datetime.timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\"\
        ),\n  \"repository\":\"${{ github.repository }}\",\n  \"run_id\":\"${{ github.run_id\
        \ }}\",\n  \"sha\":\"${{ github.sha }}\",\n  \"lane_id\":\"${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\",\n  \"shard_id\":\"${{ needs.lane-metadata-contract.outputs.shard_id\
        \ }}\",\n  \"codeql_wave\":\"${{ needs.lane-metadata-contract.outputs.codeql_wave\
        \ }}\"\n}\njson.dump(schema, open(\"security/codeql-schema-version.json\"\
        ,\"w\"), indent=2)\n\nprov={\n  \"schema_version\":\"1.0.0\",\n  \"input_lock_sha256\"\
        :\"${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}\",\n  \"\
        source_run_id\":\"${{ github.run_id }}\",\n  \"source_sha\":\"${{ github.sha\
        \ }}\",\n  \"source_repository\":\"${{ github.repository }}\",\n  \"artifacts_pattern\"\
        :\"security-suite-*\"\n}\njson.dump(prov, open(\"security/artifact-provenance.json\"\
        ,\"w\"), indent=2)\n\nlock_material = \"\\n\".join([\n  \"${{ github.repository\
        \ }}\",\n  \"${{ github.sha }}\",\n  \"${{ github.run_id }}\",\n  \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\"\n])\nlock_hash = hashlib.sha256(lock_material.encode()).hexdigest()\n\
        json.dump({\n  \"schema_version\":\"1.0.0\",\n  \"remediation_input_lock_sha256\"\
        : lock_hash\n}, open(\"security/remediation-input-lock.json\",\"w\"), indent=2)\n\
        PY\n\npython -c \"\nimport json\nwith open('.codex/security-findings-comprehensive.json')\
        \ as f:\n  data = json.load(f)\nsummary = data.get('summary',{})\nprint(f\\\
        \"CRITICAL={summary.get('critical_count',0)}\\\")\nprint(f\\\"HIGH={summary.get('high_count',0)}\\\
        \")\nprint(f\\\"MEDIUM={summary.get('medium_count',0)}\\\")\nprint(f\\\"LOW={summary.get('low_count',0)}\\\
        \")\nprint(f\\\"TOTAL={summary.get('total_findings',0)}\\\")\n\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Upload comprehensive findings artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-comprehensive-findings
        path: '.codex/security-findings-comprehensive.json

          security-findings-comprehensive.md

          security/codeql-alert-inventory.csv

          security/codeql-family-index.csv

          security/codeql-priority-queue.csv

          security/codeql-schema-version.json

          security/artifact-provenance.json

          security/remediation-input-lock.json

          '
        if-no-files-found: warn
        retention-days: 90
    - name: Summary
      if: always()
      run: 'echo "## Security Findings Aggregation" >> "$GITHUB_STEP_SUMMARY"

        echo "" >> "$GITHUB_STEP_SUMMARY"

        echo "**Total Findings:** ${{ steps.aggregate.outputs.TOTAL || ''N/A'' }}"
        >> "$GITHUB_STEP_SUMMARY"

        echo "**Critical:** ${{ steps.aggregate.outputs.CRITICAL || ''0'' }}" >> "$GITHUB_STEP_SUMMARY"

        echo "**High:** ${{ steps.aggregate.outputs.HIGH || ''0'' }}" >> "$GITHUB_STEP_SUMMARY"

        echo "**Medium:** ${{ steps.aggregate.outputs.MEDIUM || ''0'' }}" >> "$GITHUB_STEP_SUMMARY"

        echo "**Low:** ${{ steps.aggregate.outputs.LOW || ''0'' }}" >> "$GITHUB_STEP_SUMMARY"

        echo "**Lane ID:** ${{ needs.lane-metadata-contract.outputs.lane_id }}" >>
        "$GITHUB_STEP_SUMMARY"

        echo "**Input Lock SHA:** ${{ needs.lane-metadata-contract.outputs.input_lock_sha256
        }}" >> "$GITHUB_STEP_SUMMARY"

        '
  validate-security-artifact-contract:
    name: Validate Security Artifact Contract
    runs-on: ubuntu-latest
    needs:
    - lane-metadata-contract
    - aggregate-all-findings
    if: always()
    timeout-minutes: 20
    steps:
    - name: Download comprehensive findings artifact
      uses: actions/download-artifact@v4
      continue-on-error: false
      with:
        name: security-suite-comprehensive-findings
        path: contract-input/
    - name: Debug contract input file listing
      if: always()
      run: 'echo "## Contract input files"

        find contract-input -maxdepth 5 -type f | sort

        '
    - name: Validate required files and schema
      shell: bash
      run: "set -euo pipefail\nREQUIRED=(\n  \"contract-input/.codex/security-findings-comprehensive.json\"\
        \n  \"contract-input/security-findings-comprehensive.md\"\n  \"contract-input/security/codeql-alert-inventory.csv\"\
        \n  \"contract-input/security/codeql-family-index.csv\"\n  \"contract-input/security/codeql-priority-queue.csv\"\
        \n  \"contract-input/security/codeql-schema-version.json\"\n  \"contract-input/security/artifact-provenance.json\"\
        \n  \"contract-input/security/remediation-input-lock.json\"\n)\n\nFAIL=0\n\
        for f in \"${REQUIRED[@]}\"; do\n  if [ ! -f \"$f\" ]; then\n    echo \"::error::Missing\
        \ required artifact contract file: $f\"\n    FAIL=1\n  fi\ndone\n\npython\
        \ - <<'PY'\nimport json,sys\ntry:\n  s=json.load(open(\"contract-input/security/codeql-schema-version.json\"\
        ))\n  p=json.load(open(\"contract-input/security/artifact-provenance.json\"\
        ))\n  l=json.load(open(\"contract-input/security/remediation-input-lock.json\"\
        ))\n  assert \"schema_version\" in s\n  assert \"input_lock_sha256\" in p\n\
        \  assert \"remediation_input_lock_sha256\" in l\n  print(\"Schema contract\
        \ validation passed\")\nexcept Exception as e:\n  print(f\"Schema validation\
        \ failed: {e}\")\n  sys.exit(1)\nPY\n\nif [ \"$FAIL\" -ne 0 ]; then\n  exit\
        \ 1\nfi\n"
    - name: Build contract report
      if: always()
      run: "{\n  echo \"# Security Artifact Contract Report\"\n  echo \"\"\n  echo\
        \ \"- **Status:** ${{ job.status }}\"\n  echo \"- **Lane ID:** ${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\"\n  echo \"- **Input Lock SHA:** ${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\"\n} > security-artifact-contract-report.md\ncat security-artifact-contract-report.md\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload contract report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-artifact-contract-report
        path: security-artifact-contract-report.md
        if-no-files-found: warn
        retention-days: 30
  cache-findings:
    name: Cache Security Findings
    runs-on: ubuntu-latest
    needs:
    - validate-security-artifact-contract
    if: ${{ needs.validate-security-artifact-contract.result == 'success' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Download comprehensive findings
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: security-suite-comprehensive-findings
        path: .
    - name: Cache Findings
      run: "set -euo pipefail\npython scripts/ci/security_cache_manager.py cache-findings\
        \ \\\n  --run-id \"${{ github.run_number }}\" \\\n  --commit-sha \"${{ github.sha\
        \ }}\" \\\n  --findings-path \".codex/security-findings-comprehensive.json\"\
        \n"
    - name: Generate Trend Analysis
      run: "set -euo pipefail\npython scripts/ci/security_findings_trend_analyzer.py\
        \ analyze \\\n  --cache-dir \".codex/security-cache\" \\\n  --output \".codex/security-findings-trend-report.md\"\
        \n"
    - name: Upload Cache Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: security-cache
        path: .codex/security-cache/
        if-no-files-found: warn
        retention-days: 90
    - name: Upload Trend Report
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: security-findings-trend-report
        path: .codex/security-findings-trend-report.md
        if-no-files-found: warn
        retention-days: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs:
    - security-suite-summary
    - aggregate-all-findings
    - validate-security-artifact-contract
    - cache-findings
    if: 'always() &&

      contains(join(needs.*.result, '',''), ''failure'') &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Security Scanning Suite
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
