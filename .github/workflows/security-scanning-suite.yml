        }
        EOF
    - name: Upload Semgrep results artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-semgrep
        path: |
          semgrep-results.sarif
          semgrep-results.json
          sarif-chunks/
          semgrep-scan.log
          semgrep-scan-fallback.log
          semgrep-scan-json.log
          semgrep-scan-json-fallback.log
          semgrep-summary.md
          .codex/contracts/output-contract-semgrep.json
        if-no-files-found: warn
        retention-days: 30
  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 30
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.scan_containers) ||
      (github.event_name == 'workflow_call' &&
        (inputs.scan-type == '' || inputs.scan-type == 'all' || inputs.scan-type == 'containers'))
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
        - .config/Dockerfile
        - docker/Dockerfile.cpu
        - docker/Dockerfile.gpu
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Validate Dockerfile exists
      run: "if [ ! -f \"${{ matrix.dockerfile }}\" ]; then\n  echo \"\u274C Dockerfile\
        \ not found: ${{ matrix.dockerfile }}\"\n  exit 1\nfi\necho \"\u2705 Dockerfile\
        \ found: ${{ matrix.dockerfile }}\"\n"
    - name: Run Trivy filesystem scan (pre-build)
      id: trivy-fs
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-fs-results-${{ strategy.job-index }}.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'
    - name: Build Docker image for scanning
      continue-on-error: true
      timeout-minutes: 15
      run: 'docker build -f ${{ matrix.dockerfile }} -t codex-scan:${{ strategy.job-index
        }} . 2>&1 | tee docker-build-${{ strategy.job-index }}.log || true

        '
    - name: Run Trivy image scan (if build succeeded)
      continue-on-error: true
      run: "if docker inspect codex-scan:${{ strategy.job-index }} &>/dev/null; then\n\
        \  echo \"Image found, scanning...\"\n  trivy image --severity CRITICAL,HIGH\
        \ --format sarif --output trivy-image-results-${{ strategy.job-index }}.sarif\
        \ codex-scan:${{ strategy.job-index }} || true\nelse\n  echo \"\u26A0\uFE0F\
        \ Docker image not found, skipping image scan\"\nfi\n"
    - name: Upload SARIF to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173
      with:
        sarif_file: trivy-fs-results-${{ strategy.job-index }}.sarif
        wait-for-processing: false
    - name: Generate container scan summary + contract
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .codex/contracts

        {
          echo "# Container Security Scan Report"
          echo "- **Dockerfile:** ${{ matrix.dockerfile }}"
          echo "- **Scan outcome:** ${{ job.status }}"
          echo "- **Lane ID:** `${{ needs.lane-metadata-contract.outputs.lane_id }}`"
          echo "- **Shard ID:** `${{ needs.lane-metadata-contract.outputs.shard_id }}`"
          if [ -f "docker-build-${{ strategy.job-index }}.log" ]; then
            echo "## Docker Build Log"
            echo '```'
            tail -20 "docker-build-${{ strategy.job-index }}.log"
            echo '```'
          fi
        } > "container-scan-summary-${{ strategy.job-index }}.md"

        cat > ".codex/contracts/output-contract-container-${{ strategy.job-index }}.json" <<EOF
        {
          "schema_version": "${SECURITY_ARTIFACT_SCHEMA_VERSION}",
          "job": "container-scan",
          "matrix_index": "${{ strategy.job-index }}",
          "dockerfile": "${{ matrix.dockerfile }}",
          "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
          "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
          "required_outputs": [
            "trivy-fs-results-${{ strategy.job-index }}.sarif",
            "container-scan-summary-${{ strategy.job-index }}.md"
          ],
          "scan_outcome": "${{ steps.trivy-fs.outcome }}",
          "status": "${{ job.status }}"
        }
        EOF
    - name: Upload container scan artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-container-${{ strategy.job-index }}
        path: |
          trivy-fs-results-${{ strategy.job-index }}.sarif
          trivy-image-results-${{ strategy.job-index }}.sarif
          container-scan-summary-${{ strategy.job-index }}.md
          docker-build-${{ strategy.job-index }}.log
          .codex/contracts/output-contract-container-${{ strategy.job-index }}.json
        if-no-files-found: warn
        retention-days: 30
  cve-scan:
    name: CVE & Dependency Audit
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 30
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.scan_cve) ||
      (github.event_name == 'workflow_call' &&
        (inputs.scan-type == '' || inputs.scan-type == 'all' || inputs.scan-type == 'cve'))
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ecosystem:
        - python
        - javascript
        - rust
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Cache Python dependencies (Layer 1)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml')
          }}
        restore-keys: '${{ runner.os }}-pip-

          '
    - name: Cache Rust cargo-audit (Layer 2 - CVE Tools)
      if: matrix.ecosystem == 'rust'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cargo/bin/cargo-audit
        key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION || '0.20' }}
        restore-keys: '${{ runner.os }}-cargo-audit-

          '
    - if: matrix.ecosystem == 'python'
      name: Scan Python dependencies (pip-audit)
      continue-on-error: true
      timeout-minutes: 10
      run: 'pip install pip-audit

        pip-audit --json --output python-cve-audit.json || true

        pip-audit --desc || true

        '
    - if: matrix.ecosystem == 'javascript' && hashFiles('package.json') != ''
      name: Scan JavaScript dependencies (npm audit)
      continue-on-error: true
      timeout-minutes: 10
      run: 'npm audit --json > javascript-cve-audit.json || true

        npm audit || true

        '
    - if: matrix.ecosystem == 'rust' && hashFiles('Cargo.toml') != ''
      name: Scan Rust dependencies (cargo-audit)
      continue-on-error: true
      timeout-minutes: 15
      run: "# Use cached binary if available, otherwise install\nif [ ! -f ~/.cargo/bin/cargo-audit\
        \ ]; then\n  cargo install cargo-audit --force --locked\nfi\ncargo audit --json\
        \ > rust-cve-audit.json || true\ncargo audit || true\n"
    - name: Generate CVE summary + contract
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .codex/contracts

        {
          echo "# CVE & Dependency Audit Report"
          echo "- **Ecosystem:** ${{ matrix.ecosystem }}"
          echo "- **Scan outcome:** ${{ job.status }}"
          echo "- **Lane ID:** `${{ needs.lane-metadata-contract.outputs.lane_id }}`"
        } > "cve-scan-summary-${{ matrix.ecosystem }}.md"

        cat > ".codex/contracts/output-contract-cve-${{ matrix.ecosystem }}.json" <<EOF
        {
          "schema_version": "${SECURITY_ARTIFACT_SCHEMA_VERSION}",
          "job": "cve-scan",
          "ecosystem": "${{ matrix.ecosystem }}",
          "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
          "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
          "required_outputs": [
            "cve-scan-summary-${{ matrix.ecosystem }}.md",
            "${{ matrix.ecosystem == 'python' && 'python-cve-audit.json' || matrix.ecosystem == 'javascript' && 'javascript-cve-audit.json' || 'rust-cve-audit.json' }}"
          ],
          "status": "${{ job.status }}"
        }
        EOF
    - name: Upload CVE scan artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-cve-${{ matrix.ecosystem }}
        path: |
          *-cve-audit.json
          cve-scan-summary-${{ matrix.ecosystem }}.md
          .codex/contracts/output-contract-cve-${{ matrix.ecosystem }}.json
        if-no-files-found: warn
        retention-days: 30
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 60
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.scan_dependency) ||
      (github.event_name == 'workflow_call' &&
        (inputs.scan-type == '' || inputs.scan-type == 'all' || inputs.scan-type == 'dependency'))
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: common
    - name: Install security tools
      run: 'pip install --upgrade pip

        pip install safety pip-audit

        pip freeze > installed-packages.txt

        '
    - name: Run pip-audit and Safety
      id: dependency-audit
      continue-on-error: true
      run: 'pip-audit --format json --output pip-audit.json 2>&1 | tee pip-audit-json.log
        || true

        pip-audit --desc 2>&1 | tee pip-audit-report.txt || true

        pip-audit --format cyclonedx-json --output pip-audit-cyclonedx.json 2>&1 |
        tee pip-audit-cyclonedx.log || true

        safety check --json --output safety.json 2>&1 | tee safety-json.log || true

        safety check 2>&1 | tee safety-report.txt || true

        '
    - name: Generate dependency summary + contract
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        PIP_AUDIT_COUNT=0
        SAFETY_COUNT=0

        if [ -f pip-audit.json ]; then
          PIP_AUDIT_COUNT=$(python - <<'PY' 2>/dev/null || echo 0
        import json

        with open("pip-audit.json", encoding="utf-8") as handle:
            data = json.load(handle)

        deps = data.get("dependencies") or []
        print(sum(len(p.get("vulns", [])) for p in deps))
        PY
        )
        fi

        if [ -f safety.json ]; then
          SAFETY_COUNT=$(python - <<'PY' 2>/dev/null || echo 0
        import json

        with open("safety.json", encoding="utf-8") as handle:
            data = json.load(handle)

        if isinstance(data, dict):
            print(len(data.get("vulnerabilities", [])))
        else:
            print(len(data))
        PY
        )
        fi

        {
          echo "# Dependency Scan Report"
          echo "- **pip-audit vulnerabilities:** ${PIP_AUDIT_COUNT}"
          echo "- **Safety vulnerabilities:** ${SAFETY_COUNT}"
          echo "- **Lane ID:** \`${{ needs.lane-metadata-contract.outputs.lane_id }}\`"
          echo "- **Input Lock SHA:** \`${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}\`"
        } > dependency-scan-summary.md
        cat dependency-scan-summary.md >> "$GITHUB_STEP_SUMMARY"

        mkdir -p .codex/contracts
        cat > .codex/contracts/output-contract-dependency.json <<EOF
        {
          "schema_version": "${SECURITY_ARTIFACT_SCHEMA_VERSION}",
          "job": "dependency-scan",
          "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
          "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
          "required_outputs": [
            "pip-audit.json",
            "safety.json",
            "dependency-scan-summary.md"
          ],
          "scan_outcome": "${{ steps.dependency-audit.outcome }}",
          "status": "${{ job.status }}"
        }
        EOF
    - name: Upload dependency artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-dependency
        path: |
          pip-audit.json
          pip-audit-cyclonedx.json
          pip-audit-report.txt
          safety.json
          safety-report.txt
          installed-packages.txt
          dependency-scan-summary.md
          pip-audit-json.log
          pip-audit-cyclonedx.log
          safety-json.log
          .codex/contracts/output-contract-dependency.json
        if-no-files-found: warn
        retention-days: 30
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 120
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.scan_secrets) ||
      (github.event_name == 'workflow_call' &&
        (inputs.scan-type == '' || inputs.scan-type == 'all' || inputs.scan-type == 'secrets'))
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: ephemeral
    - name: Install detect-secrets
      run: 'pip install --upgrade pip

        pip install detect-secrets

        '
    - name: Run detect-secrets
      id: detect-secrets
      continue-on-error: true
      run: "detect-secrets scan --all-files --force-use-all-plugins \\\n  --exclude-files\
        \ '\\.codex/validation/' \\\n  --exclude-files '\\.venv_ci/' \\\n  --exclude-files\
        \ 'assets/manifest\\.json' \\\n  > .secrets.baseline 2> detect-secrets.log\n\
        SECRETS_COUNT=$(python -c \"import json;print(sum(len(v or []) for v in ((json.load(open('.secrets.baseline')).get('results')\
        \ or {}).values())))\" 2>/dev/null || echo \"0\")\necho \"secrets_found=$SECRETS_COUNT\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Generate secret summary + contract
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import json

        summary = {"results_by_file": {}, "files_with_secrets": 0, "total_secrets": 0, "plugins": []}
        with open(".secrets.baseline", encoding="utf-8") as handle:
            data = json.load(handle)
        results = data.get("results", {}) or {}
        summary["plugins"] = [
            plugin.get("name") for plugin in data.get("plugins_used", [])
        ]
        summary["files_with_secrets"] = len(results)
        summary["results_by_file"] = {
            filename: len(items) for filename, items in results.items()
        }
        summary["total_secrets"] = sum(summary["results_by_file"].values())
        with open("detect-secrets-summary.json", "w", encoding="utf-8") as handle:
            json.dump(summary, handle, indent=2, sort_keys=True)
        PY

        {
          echo "# Secret Scan Report"
          echo "- **Secrets found:** ${{ steps.detect-secrets.outputs.secrets_found || 0 }}"
          echo "- **Lane ID:** `${{ needs.lane-metadata-contract.outputs.lane_id }}`"
          echo "- **Input Lock SHA:** `${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}`"
        } > secret-scan-summary.md
        cat secret-scan-summary.md >> "$GITHUB_STEP_SUMMARY"

        mkdir -p .codex/contracts
        cat > .codex/contracts/output-contract-secrets.json <<EOF
        {
          "schema_version": "${SECURITY_ARTIFACT_SCHEMA_VERSION}",
          "job": "secret-scan",
          "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
          "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
          "required_outputs": [
            ".secrets.baseline",
            "detect-secrets-summary.json",
            "secret-scan-summary.md"
          ],
          "scan_outcome": "${{ steps.detect-secrets.outcome }}",
          "status": "${{ job.status }}"
        }
        EOF
    - name: Upload secret scan artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-secrets
        path: |
          .secrets.baseline
          detect-secrets-summary.json
          detect-secrets.log
          secret-scan-summary.md
          .codex/contracts/output-contract-secrets.json
        if-no-files-found: warn
        retention-days: 30
  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 60
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.scan_sbom) ||
      (github.event_name == 'workflow_call' &&
        (inputs.scan-type == '' || inputs.scan-type == 'all' || inputs.scan-type == 'sbom'))
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: common
    - name: Install SBOM tools
      run: 'pip install --upgrade pip

        pip install cyclonedx-bom

        cyclonedx-py --version > sbom-tool-versions.txt 2>&1 || true

        python --version >> sbom-tool-versions.txt

        pip --version >> sbom-tool-versions.txt

        '
    - name: Generate SBOM
      run: 'set -euo pipefail

        cyclonedx-py environment --of JSON -o sbom.json 2>&1 | tee sbom-json.log

        cyclonedx-py environment --of XML -o sbom.xml 2>&1 | tee sbom-xml.log

        '
    - name: Generate SBOM summary + contract
      if: always()
      shell: bash
      run: "set -euo pipefail\nCOMPONENT_COUNT=0\nif [ -f sbom.json ]; then\n  COMPONENT_COUNT=$(python\
        \ -c \"import json;d=json.load(open('sbom.json'));print(len(d.get('components',[])\
        \ or []))\" 2>/dev/null || echo 0)\nfi\n{\n  echo \"# SBOM Report\"\n  echo\
        \ \"- **Components:** ${COMPONENT_COUNT}\"\n  echo \"- **Lane ID:** \\`${{\
        \ needs.lane-metadata-contract.outputs.lane_id }}\\`\"\n  echo \"- **Input\
        \ Lock SHA:** \\`${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\\`\"\n} > sbom-summary.md\ncat sbom-summary.md >> \"$GITHUB_STEP_SUMMARY\"\
        \n\nmkdir -p .codex/contracts\ncat > .codex/contracts/output-contract-sbom.json\
        \ <<EOF\n{\n  \"schema_version\": \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\"\
        ,\n  \"job\": \"sbom-generation\",\n  \"lane_id\": \"${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\",\n  \"input_lock_sha256\": \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\",\n  \"required_outputs\": [\n    \"sbom.json\",\n    \"sbom.xml\",\n\
        \    \"sbom-summary.md\"\n  ],\n  \"status\": \"${{ job.status }}\"\n}\nEOF\n"
    - name: Upload SBOM artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-sbom
        path: |
          sbom.json
          sbom.xml
          sbom-tool-versions.txt
          sbom-summary.md
          sbom-json.log
          sbom-xml.log
          .codex/contracts/output-contract-sbom.json
        if-no-files-found: warn
        retention-days: 90
  security-suite-summary:
    name: Security Suite Summary
    runs-on: ubuntu-latest
    needs:
    - lane-metadata-contract
    - codeql-scan
    - container-scan
    - cve-scan
    - dependency-scan
    - secret-scan
    - sbom-generation
    - semgrep
    if: always()
    timeout-minutes: 60
    steps:
    - name: Download all security-suite artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      with:
        path: security-suite-artifacts/
        pattern: security-suite-*
        merge-multiple: false
    - name: Audit artifact family presence (record evidence gaps)
      if: always()
      shell: bash
      env:
        SELECTED_SCANS: ${{ needs.lane-metadata-contract.outputs.selected_scans }}
      run: |
        set -euo pipefail
        # Record which expected artifact families are present vs missing. A missing
        # family is an EVIDENCE GAP (recorded), not a workflow failure — the
        # authoritative hard gate lives in validate-security-artifact-contract.
        mkdir -p security-suite-summary
        GAP_JSON="security-suite-summary/artifact-evidence-gap.json"
        GAP_MD="security-suite-summary/artifact-evidence-gap.md"
        python - <<'PY'
        import json, os
        from datetime import datetime, timezone

        root = "security-suite-artifacts"
        present = set()
        if os.path.isdir(root):
            present = {d for d in os.listdir(root) if os.path.isdir(os.path.join(root, d))}

        selected = {
            scan for scan in os.environ.get("SELECTED_SCANS", "").split(",") if scan
        }
        expected_by_scan = {
            "codeql": ["security-suite-codeql-python", "security-suite-codeql-javascript"],
            "semgrep": ["security-suite-semgrep"],
            "containers": [f"security-suite-container-{index}" for index in range(3)],
            "cve": [
                "security-suite-cve-python",
                "security-suite-cve-javascript",
                "security-suite-cve-rust",
            ],
            "dependency": ["security-suite-dependency"],
            "secrets": ["security-suite-secrets"],
            "sbom": ["security-suite-sbom"],
        }
        rows = []
        rows.append(
            {
                "family": "security-suite-lane-contract",
                "selected": True,
                "status": (
                    "present"
                    if "security-suite-lane-contract" in present
                    else "evidence_gap"
                ),
            }
        )
        for scan, names in expected_by_scan.items():
            for name in names:
                is_selected = scan in selected
                is_present = name in present
                rows.append(
                    {
                        "family": name,
                        "selected": is_selected,
                        "status": (
                            "skipped"
                            if not is_selected
                            else "present"
                            if is_present
                            else "evidence_gap"
                        ),
                    }
                )

        gaps = [row["family"] for row in rows if row["status"] == "evidence_gap"]
        report = {
            "schema_version": "1.0.0",
            "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
            "sha": os.environ.get("GITHUB_SHA", "unknown"),
            "selected_scans": sorted(selected),
            "families": rows,
            "evidence_gaps": gaps,
            "evidence_gap_count": len(gaps),
            "classification": "evidence_gap" if gaps else "complete",
        }
        with open("security-suite-summary/artifact-evidence-gap.json", "w") as fh:
            json.dump(report, fh, indent=2)

        lines = [
            "## Artifact Family Evidence Audit",
            "",
            "| Family | Selected | Status |",
            "|---|---:|---|",
        ]
        for r in rows:
            status = "**EVIDENCE GAP**" if r["status"] == "evidence_gap" else r["status"]
            lines.append(f"| `{r['family']}` | {r['selected']} | {status} |")
        lines.append("")
        if gaps:
            lines.append(f"**Evidence gaps recorded:** {len(gaps)} — " + ", ".join(f"`{g}`" for g in gaps))
            lines.append("")
            lines.append("_Missing families are recorded as evidence gaps, not treated as workflow failures._")
        else:
            lines.append("All expected artifact families present.")
        with open("security-suite-summary/artifact-evidence-gap.md", "w") as fh:
            fh.write("\n".join(lines) + "\n")

        print("\n".join(lines))
        PY
        cat "$GAP_MD" >> "$GITHUB_STEP_SUMMARY"
    - name: Record selected scans
      if: always()
      run: |
        echo "## Selected Security Scans" >> "$GITHUB_STEP_SUMMARY"
        echo "${{ needs.lane-metadata-contract.outputs.selected_scans || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
    - name: Build consolidated security summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        ARTIFACTS_URL="${RUN_URL}#artifacts"
        SECURITY_URL="${{ github.server_url }}/${{ github.repository }}/security/code-scanning"
        mkdir -p security-suite-summary .codex/contracts
        OUT="security-suite-summary/security-suite-summary.md"

        {
          echo "# 🔐 Security Scanning Suite Summary"
          echo ""
          echo "- **Repository:** \`${{ github.repository }}\`"
          echo "- **Commit:** \`${{ github.sha }}\`"
          echo "- **Workflow run:** [#${{ github.run_number }}](${RUN_URL})"
          echo "- **Artifacts:** [open dropdown](${ARTIFACTS_URL})"
          echo "- **GHAS code-scanning alerts:** [open](${SECURITY_URL})"
          echo "- **Selected scans:** \`${{ needs.lane-metadata-contract.outputs.selected_scans || 'none' }}\`"
          echo "- **Lane ID:** \`${{ needs.lane-metadata-contract.outputs.lane_id }}\`"
          echo "- **Shard ID:** \`${{ needs.lane-metadata-contract.outputs.shard_id }}\`"
          echo "- **CodeQL Wave:** \`${{ needs.lane-metadata-contract.outputs.codeql_wave }}\`"
          echo "- **Input Lock SHA:** \`${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}\`"
          echo ""
          echo "## Job Results"
          echo ""
          echo "| Job | Result |"
          echo "|---|---|"
          echo "| codeql-scan | ${{ needs.codeql-scan.result }} |"
          echo "| container-scan | ${{ needs.container-scan.result }} |"
          echo "| cve-scan | ${{ needs.cve-scan.result }} |"
          echo "| semgrep | ${{ needs.semgrep.result }} |"
          echo "| dependency-scan | ${{ needs.dependency-scan.result }} |"
          echo "| secret-scan | ${{ needs.secret-scan.result }} |"
          echo "| sbom-generation | ${{ needs.sbom-generation.result }} |"
        } > "${OUT}"
        cat "${OUT}" >> "${GITHUB_STEP_SUMMARY}"

        cat > .codex/contracts/output-contract-summary.json <<EOF
        {
          "schema_version": "${SECURITY_ARTIFACT_SCHEMA_VERSION}",
          "job": "security-suite-summary",
          "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
          "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
          "required_outputs": ["security-suite-summary/security-suite-summary.md"],
          "status": "${{ job.status }}"
        }
        EOF
    - name: Upload consolidated summary
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-summary
        path: |
          security-suite-summary/
          .codex/contracts/output-contract-summary.json
        if-no-files-found: warn
        retention-days: 30
  aggregate-all-findings:
    name: Aggregate All Security Findings
    runs-on: ubuntu-latest
    needs:
    - lane-metadata-contract
    - security-suite-summary
    if: always()
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download all security-suite artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      with:
        path: security-suite-artifacts/
        pattern: security-suite-*
        merge-multiple: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Run findings aggregator + normalized exports
      id: aggregate
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        AGENT_LANE_ID: ${{ needs.lane-metadata-contract.outputs.lane_id }}
        AGENT_SHARD_ID: ${{ needs.lane-metadata-contract.outputs.shard_id }}
        INPUT_LOCK_SHA256: ${{ needs.lane-metadata-contract.outputs.input_lock_sha256
          }}
        CODEQL_WAVE: ${{ needs.lane-metadata-contract.outputs.codeql_wave }}
        COPILOT_AGENT_GLOBAL_SEED: ${{ needs.lane-metadata-contract.outputs.deterministic_seed
          }}
      run: |
        set -euo pipefail
        mkdir -p .codex security .codex/contracts

        python scripts/ci/aggregate_security_findings.py \
          --artifacts-dir security-suite-artifacts \
          --output-json .codex/security-findings-comprehensive.json \
          --output-md security-findings-comprehensive.md \
          --output-csv security/codeql-alert-inventory.csv \
          --output-priority-csv security/codeql-priority-queue.csv \
          --output-family-csv security/codeql-family-index.csv

        python - <<'PY'
        import json
        from pathlib import Path

        Path("security").mkdir(exist_ok=True)
        with open(".codex/security-findings-comprehensive.json", encoding="utf-8") as handle:
            report = json.load(handle)
        schema = {
            "schema_version": "1.0.0",
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "sha": "${{ github.sha }}",
            "selected_scans": report["scan_metadata"]["selected_scans"],
        }
        with open("security/codeql-schema-version.json", "w", encoding="utf-8") as handle:
            json.dump(schema, handle, indent=2)
        provenance = {
            "schema_version": "1.0.0",
            "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
            "source_run_id": "${{ github.run_id }}",
            "source_sha": "${{ github.sha }}",
            "source_repository": "${{ github.repository }}",
            "artifacts_pattern": "security-suite-*",
        }
        with open("security/artifact-provenance.json", "w", encoding="utf-8") as handle:
            json.dump(provenance, handle, indent=2)
        PY

        python - <<'PY' >> "${GITHUB_OUTPUT}"
        import json

        with open(".codex/security-findings-comprehensive.json", encoding="utf-8") as handle:
            report = json.load(handle)
        summary = report["summary"]
        for key in ("critical", "high", "medium", "low"):
            print(f"{key.upper()}={summary[f'{key}_count']}")
        print(f"TOTAL={summary['total_findings']}")
        PY
    - name: Upload comprehensive findings artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-comprehensive-findings
        path: |
          .codex/security-findings-comprehensive.json
          security-findings-comprehensive.md
          security/codeql-alert-inventory.csv
          security/codeql-family-index.csv
          security/codeql-priority-queue.csv
          security/codeql-schema-version.json
          security/artifact-provenance.json
          security/remediation-input-lock.json
        if-no-files-found: warn
        retention-days: 90
    - name: Summary
      if: always()
      run: 'echo "## Security Findings Aggregation" >> "$GITHUB_STEP_SUMMARY"

        echo "" >> "$GITHUB_STEP_SUMMARY"

        echo "**Total Findings:** ${{ steps.aggregate.outputs.TOTAL || ''N/A'' }}"
        >> "$GITHUB_STEP_SUMMARY"

        echo "**Critical:** ${{ steps.aggregate.outputs.CRITICAL || ''0'' }}" >> "$GITHUB_STEP_SUMMARY"

        echo "**High:** ${{ steps.aggregate.outputs.HIGH || ''0'' }}" >> "$GITHUB_STEP_SUMMARY"

        echo "**Medium:** ${{ steps.aggregate.outputs.MEDIUM || ''0'' }}" >> "$GITHUB_STEP_SUMMARY"

        echo "**Low:** ${{ steps.aggregate.outputs.LOW || ''0'' }}" >> "$GITHUB_STEP_SUMMARY"

        echo "**Lane ID:** ${{ needs.lane-metadata-contract.outputs.lane_id }}" >>
        "$GITHUB_STEP_SUMMARY"

        echo "**Input Lock SHA:** ${{ needs.lane-metadata-contract.outputs.input_lock_sha256
        }}" >> "$GITHUB_STEP_SUMMARY"

        '
  validate-security-artifact-contract:
    name: Validate Security Artifact Contract
    runs-on: ubuntu-latest
    needs:
    - lane-metadata-contract
    - aggregate-all-findings
    if: always()
    timeout-minutes: 20
    steps:
    - name: Download comprehensive findings artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: false
      with:
        name: security-suite-comprehensive-findings
        path: contract-input/
    - name: Debug contract input file listing
      if: always()
      run: 'echo "## Contract input files"

        find contract-input -maxdepth 5 -type f | sort

        '
    - name: Validate required files and schema
      shell: bash
      run: "set -euo pipefail\nREQUIRED=(\n  \"contract-input/.codex/security-findings-comprehensive.json\"\
        \n  \"contract-input/security-findings-comprehensive.md\"\n  \"contract-input/security/codeql-alert-inventory.csv\"\
        \n  \"contract-input/security/codeql-family-index.csv\"\n  \"contract-input/security/codeql-priority-queue.csv\"\
        \n  \"contract-input/security/codeql-schema-version.json\"\n  \"contract-input/security/artifact-provenance.json\"\
        \n  \"contract-input/security/remediation-input-lock.json\"\n)\n\nFAIL=0\n\
        for f in \"${REQUIRED[@]}\"; do\n  if [ ! -f \"$f\" ]; then\n    echo \"::error::Missing\
        \ required artifact contract file: $f\"\n    FAIL=1\n  fi\ndone\n\npython\
        \ - <<'PY'\nimport json,sys\ntry:\n  s=json.load(open(\"contract-input/security/codeql-schema-version.json\"\
        ))\n  p=json.load(open(\"contract-input/security/artifact-provenance.json\"\
        ))\n  l=json.load(open(\"contract-input/security/remediation-input-lock.json\"\
        ))\n  assert \"schema_version\" in s\n  assert \"input_lock_sha256\" in p\n\
        \  assert \"remediation_input_lock_sha256\" in l\n  print(\"Schema contract\
        \ validation passed\")\nexcept Exception as e:\n  print(f\"Schema validation\
        \ failed: {e}\")\n  sys.exit(1)\nPY\n\nif [ \"$FAIL\" -ne 0 ]; then\n  exit\
        \ 1\nfi\n"
    - name: Build contract report
      if: always()
      run: "{\n  echo \"# Security Artifact Contract Report\"\n  echo \"\"\n  echo\
        \ \"- **Status:** ${{ job.status }}\"\n  echo \"- **Lane ID:** ${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\"\n  echo \"- **Input Lock SHA:** ${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\"\n} > security-artifact-contract-report.md\ncat security-artifact-contract-report.md\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload contract report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-artifact-contract-report
        path: security-artifact-contract-report.md
        if-no-files-found: error
        retention-days: 30
  cache-findings:
    name: Cache Security Findings
    runs-on: ubuntu-latest
    needs:
    - validate-security-artifact-contract
    if: ${{ needs.validate-security-artifact-contract.result == 'success' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Download comprehensive findings
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      continue-on-error: true
      with:
        name: security-suite-comprehensive-findings
        path: .
    - name: Cache Findings
      run: "set -euo pipefail\npython scripts/ci/security_cache_manager.py cache-findings\
        \ \\\n  --run-id \"${{ github.run_number }}\" \\\n  --commit-sha \"${{ github.sha\
        \ }}\" \\\n  --findings-path \".codex/security-findings-comprehensive.json\"\
        \n"
    - name: Generate Trend Analysis
      run: "set -euo pipefail\npython scripts/ci/security_findings_trend_analyzer.py\
        \ analyze \\\n  --cache-dir \".codex/security-cache\" \\\n  --output \".codex/security-findings-trend-report.md\"\
        \n"
    - name: Upload Cache Artifacts
      if: success()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-cache
        path: .codex/security-cache/
        if-no-files-found: error
        retention-days: 90
    - name: Upload Trend Report
      if: success()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-findings-trend-report
        path: .codex/security-findings-trend-report.md
        if-no-files-found: error
        retention-days: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs:
    - security-suite-summary
    - aggregate-all-findings
    - validate-security-artifact-contract
    - cache-findings
    if: 'always() &&

      contains(join(needs.*.result, '',''), ''failure'') &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Security Scanning Suite
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
