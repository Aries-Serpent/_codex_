name: Security Scanning Suite

"on":
  push:
    branches: [main, develop, copilot/**]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM
  workflow_dispatch:
    inputs:
      scan-type:
        description: 'Security scan type'
        required: true
        type: choice
        options:
          - 'all'
          - 'codeql'
          - 'dependency'
        default: 'all'
  workflow_call:
    inputs:
      scan-type:
        description: 'Security scan type'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read
  security-events: write
  issues: write

env:
  PYTHON_VERSION: '3.12'


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  codeql-scan:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # javascript/typescript: repo has no standalone JS build; allow this matrix leg to fail
    # without blocking the overall workflow (python must still pass).
    # Mirrors the identical guard in codeql-analysis.yml.
    continue-on-error: ${{ matrix.language == 'javascript' }}
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (inputs.scan-type == 'all' || inputs.scan-type == 'codeql')) ||
      github.event_name == 'workflow_call'
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript']
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
      - name: Summary
        if: always()
        run: |
          echo "## CodeQL - ${{ matrix.language }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (inputs.scan-type == 'all' || inputs.scan-type == 'dependency'))
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common
      - name: Install security tools
        run: pip install safety pip-audit
      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit --format json --output pip-audit.json || true
          pip-audit || echo "Vulnerabilities found"
      - name: Run Safety
        continue-on-error: true
        run: |
          safety check --json --output safety.json || true
          safety check || echo "Vulnerabilities found"
      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: dependency-scan-results
          path: |
            pip-audit.json
            safety.json
          retention-days: 30
      - name: Summary
        run: |
          echo "## Dependency Scan" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Complete" >> $GITHUB_STEP_SUMMARY

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.scan-type == 'all')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: ephemeral
      - name: Install tools
        run: pip install detect-secrets
      - name: Run detect-secrets
        id: detect-secrets
        continue-on-error: true
        run: |
          detect-secrets scan --all-files --force-use-all-plugins > .secrets.baseline
          SECRETS_COUNT=$(grep -c "filename" .secrets.baseline || echo "0")
          echo "secrets_found=$SECRETS_COUNT" >> $GITHUB_OUTPUT
      - name: Upload baseline
        uses: actions/upload-artifact@v5
        with:
          name: secrets-baseline
          path: .secrets.baseline
          retention-days: 30
      - name: Summary
        run: |
          echo "## Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo "**Secrets found:** ${{ steps.detect-secrets.outputs.secrets_found }}" >> $GITHUB_STEP_SUMMARY

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.scan-type == 'all')
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common
      - name: Install tools
        run: pip install cyclonedx-bom
      - name: Generate SBOM
        run: |
          # cyclonedx-bom v7.x changed the CLI: --format → --of, --outfile → -o
          cyclonedx-py environment --of JSON -o sbom.json
          cyclonedx-py environment --of XML -o sbom.xml
      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom-reports
          path: |
            sbom.json
            sbom.xml
          retention-days: 90
      - name: Summary
        run: |
          echo "## SBOM Generation" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Complete" >> $GITHUB_STEP_SUMMARY

  security-suite-summary:
    name: Security Suite Summary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [codeql-scan, dependency-scan, secret-scan, sbom-generation]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Security Scanning Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**CodeQL:** ${{ needs.codeql-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dependency:** ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Secrets:** ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**SBOM:** ${{ needs.sbom-generation.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow security-scanning-suite --health 2>/dev/null || echo '{"status": "cache health check skipped"}'

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: security-suite-summary
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Security Scanning Suite"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: security-scanning-suite.yml → rescue-comment job (S227)_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
