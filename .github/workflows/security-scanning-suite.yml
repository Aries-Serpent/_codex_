  security-suite-summary:
    name: Security Suite Summary
    runs-on: ubuntu-latest
    needs:
    - lane-metadata-contract
    - codeql-scan
    - container-scan
    - cve-scan
    - dependency-scan
    - secret-scan
    - sbom-generation
    - semgrep
    if: always()
    timeout-minutes: 60
    steps:
    - name: Download all security-suite artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        path: security-suite-artifacts/
        pattern: security-suite-*
        merge-multiple: false
    - name: Build consolidated security summary
      if: always()
      shell: bash
      run: "set -euo pipefail\nRUN_URL=\"${{ github.server_url }}/${{ github.repository\
        \ }}/actions/runs/${{ github.run_id }}\"\nARTIFACTS_URL=\"${RUN_URL}#artifacts\"\
        \nSECURITY_URL=\"${{ github.server_url }}/${{ github.repository }}/security/code-scanning\"\
        \nmkdir -p security-suite-summary .codex/contracts\nOUT=\"security-suite-summary/security-suite-summary.md\"\
        \n\n{\n  echo \"# \U0001F510 Security Scanning Suite Summary\"\n  echo \"\"\
        \n  echo \"- **Repository:** \\`${{ github.repository }}\\`\"\n  echo \"-\
        \ **Commit:** \\`${{ github.sha }}\\`\"\n  echo \"- **Workflow run:** [#${{\
        \ github.run_number }}](${RUN_URL})\"\n  echo \"- **Artifacts:** [open dropdown](${ARTIFACTS_URL})\"\
        \n  echo \"- **GHAS code-scanning alerts:** [open](${SECURITY_URL})\"\n  echo\
        \ \"- **Lane ID:** \\`${{ needs.lane-metadata-contract.outputs.lane_id }}\\\
        `\"\n  echo \"- **Shard ID:** \\`${{ needs.lane-metadata-contract.outputs.shard_id\
        \ }}\\`\"\n  echo \"- **CodeQL Wave:** \\`${{ needs.lane-metadata-contract.outputs.codeql_wave\
        \ }}\\`\"\n  echo \"- **Input Lock SHA:** \\`${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\\`\"\n  echo \"\"\n  echo \"## Job Results\"\n  echo \"\"\n  echo \"\
        | Job | Result |\"\n  echo \"|---|---|\"\n  echo \"| codeql-scan | ${{ needs.codeql-scan.result\
        \ }} |\"\n  echo \"| container-scan | ${{ needs.container-scan.result }} |\"\
        \n  echo \"| cve-scan | ${{ needs.cve-scan.result }} |\"\n  echo \"| semgrep\
        \ | ${{ needs.semgrep.result }} |\"\n  echo \"| dependency-scan | ${{ needs.dependency-scan.result\
        \ }} |\"\n  echo \"| secret-scan | ${{ needs.secret-scan.result }} |\"\n \
        \ echo \"| sbom-generation | ${{ needs.sbom-generation.result }} |\"\n  echo\
        \ \"\"\n} > \"$OUT\"\n\ncat \"$OUT\" >> \"$GITHUB_STEP_SUMMARY\"\n\ncat >\
        \ .codex/contracts/output-contract-summary.json <<EOF\n{\n  \"schema_version\"\
        : \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\",\n  \"job\": \"security-suite-summary\"\
        ,\n  \"lane_id\": \"${{ needs.lane-metadata-contract.outputs.lane_id }}\"\
        ,\n  \"input_lock_sha256\": \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\",\n  \"required_outputs\": [\n    \"security-suite-summary/security-suite-summary.md\"\
        \n  ],\n  \"status\": \"${{ job.status }}\"\n}\nEOF\n"
    - name: Upload consolidated summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-suite-summary
        path: 'security-suite-summary/

          .codex/contracts/output-contract-summary.json

          '
        if-no-files-found: warn
        retention-days: 30
  aggregate-all-findings:
    name: Aggregate All Security Findings
    runs-on: ubuntu-latest
    needs:
    - lane-metadata-contract
    - security-suite-summary
    if: always()
    timeout-minutes: 40
    permissions:
      contents: read
