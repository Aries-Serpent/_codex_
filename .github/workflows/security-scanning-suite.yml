name: Art_Security Scanning Suite
'on':
  push:
    branches:
      - main
      - 0D_base_
      - develop
      - "release/**"
      - "copilot/**"
    paths:
      - ".config/Dockerfile*"
      - "docker/**"
      - ".github/codeql/**"
      - ".github/workflows/security-scanning-suite.yml"
      - "pyproject.toml"
      - "requirements*.txt"
      - "package*.json"
  pull_request:
    branches:
      - main
      - 0D_base_
      - develop
      - "release/**"
    paths:
      - ".config/Dockerfile*"
      - "docker/**"
      - ".github/codeql/**"
      - ".github/workflows/security-scanning-suite.yml"
      - "pyproject.toml"
      - "requirements*.txt"
      - "package*.json"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      scan_codeql:
        description: Run CodeQL analysis (Python and JavaScript)
        required: false
        type: boolean
        default: true
      scan_semgrep:
        description: Run Semgrep SAST
        required: false
        type: boolean
        default: true
      scan_containers:
        description: Run Trivy container scans
        required: false
        type: boolean
        default: true
      scan_cve:
        description: Run ecosystem CVE audits
        required: false
        type: boolean
        default: true
      scan_dependency:
        description: Run dependency security audit
        required: false
        type: boolean
        default: true
      scan_secrets:
        description: Run full-repository secret scanning (may take over an hour)
        required: false
        type: boolean
        default: true
      scan_sbom:
        description: Generate software bill of materials
        required: false
        type: boolean
        default: true
      lane-id:
        description: Multi-lane orchestration lane id
        required: false
        type: string
        default: lane-security
      shard-id:
        description: Shard identifier within lane
        required: false
        type: string
        default: shard-0
      lane-mode:
        description: Enable multi-lane metadata contracts
        required: false
        type: choice
        options:
        - enabled
        - disabled
        default: enabled
      codeql-wave:
        description: Remediation wave marker
        required: false
        type: choice
        options:
        - "false"
        - wave0
        - wave1
        - wave2
        - wave3
        default: "false"
      deterministic-seed:
        description: Deterministic seed for reproducible planning
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      scan-type:
        description: Security scan type
        required: false
        type: string
        default: all
      lane-id:
        description: Multi-lane orchestration lane id
        required: false
        type: string
        default: lane-security
      shard-id:
        description: Shard identifier within lane
        required: false
        type: string
        default: shard-0
      lane-mode:
        description: Enable multi-lane metadata contracts
        required: false
        type: string
        default: enabled
      codeql-wave:
        description: Remediation wave marker
        required: false
        type: string
        default: "false"
      deterministic-seed:
        description: Deterministic seed for reproducible planning
        required: false
        type: string
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  security-events: write
  issues: write
  actions: read
env:
  PYTHON_VERSION: '3.12'
  SECURITY_ARTIFACT_SCHEMA_VERSION: 1.0.0
jobs:
  lane-metadata-contract:
    name: Lane Metadata Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lane_id: ${{ steps.meta.outputs.lane_id }}
      shard_id: ${{ steps.meta.outputs.shard_id }}
      lane_mode: ${{ steps.meta.outputs.lane_mode }}
      codeql_wave: ${{ steps.meta.outputs.codeql_wave }}
      deterministic_seed: ${{ steps.meta.outputs.deterministic_seed }}
      selected_scans: ${{ steps.meta.outputs.selected_scans }}
      input_lock_sha256: ${{ steps.lock.outputs.input_lock_sha256 }}
      scan_type: ${{ steps.meta.outputs.scan_type }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Resolve lane metadata defaults safely
      id: meta
      shell: bash
      env:
        IN_SCAN_TYPE: ${{ inputs.scan-type || 'all' }}
        IN_SCAN_CODEQL: ${{ github.event.inputs.scan_codeql || 'true' }}
        IN_SCAN_SEMGREP: ${{ github.event.inputs.scan_semgrep || 'true' }}
        IN_SCAN_CONTAINERS: ${{ github.event.inputs.scan_containers || 'true' }}
        IN_SCAN_CVE: ${{ github.event.inputs.scan_cve || 'true' }}
        IN_SCAN_DEPENDENCY: ${{ github.event.inputs.scan_dependency || 'true' }}
        IN_SCAN_SECRETS: ${{ github.event.inputs.scan_secrets || 'true' }}
        IN_SCAN_SBOM: ${{ github.event.inputs.scan_sbom || 'true' }}
        IN_LANE_ID: ${{ github.event.inputs.lane-id || inputs.lane-id || 'lane-security'
          }}
        IN_SHARD_ID: ${{ github.event.inputs.shard-id || inputs.shard-id || 'shard-0'
          }}
        IN_LANE_MODE: ${{ github.event.inputs.lane-mode || inputs.lane-mode || 'enabled'
          }}
        IN_CODEQL_WAVE: ${{ github.event.inputs.codeql-wave || inputs.codeql-wave
          || 'off' }}
        IN_SEED: ${{ github.event.inputs.deterministic-seed || inputs.deterministic-seed
          || '' }}
      run: |
        set -euo pipefail

        LANE_ID="${IN_LANE_ID}"
        SHARD_ID="${IN_SHARD_ID}"
        LANE_MODE="${IN_LANE_MODE}"
        CODEQL_WAVE="${IN_CODEQL_WAVE}"
        DETERMINISTIC_SEED="${IN_SEED}"
        SELECTED_SCANS=()

        add_scan() {
          local scan="$1"
          case ",${SELECTED_SCANS[*]}," in
            *,"${scan}",*) ;;
            *) SELECTED_SCANS+=("${scan}") ;;
          esac
        }

        case "${GITHUB_EVENT_NAME}" in
          workflow_dispatch)
            if [[ "${IN_SCAN_CODEQL}" == "true" ]]; then add_scan codeql; fi
            if [[ "${IN_SCAN_SEMGREP}" == "true" ]]; then add_scan semgrep; fi
            if [[ "${IN_SCAN_CONTAINERS}" == "true" ]]; then add_scan containers; fi
            if [[ "${IN_SCAN_CVE}" == "true" ]]; then add_scan cve; fi
            if [[ "${IN_SCAN_DEPENDENCY}" == "true" ]]; then add_scan dependency; fi
            if [[ "${IN_SCAN_SECRETS}" == "true" ]]; then add_scan secrets; fi
            if [[ "${IN_SCAN_SBOM}" == "true" ]]; then add_scan sbom; fi
            ;;
          workflow_call)
            case "${IN_SCAN_TYPE}" in
              all|"") SELECTED_SCANS=(codeql semgrep containers cve dependency secrets sbom) ;;
              codeql|semgrep|containers|cve|dependency|secrets|sbom) add_scan "${IN_SCAN_TYPE}" ;;
              *) echo "::error::Unsupported scan-type '${IN_SCAN_TYPE}'"; exit 1 ;;
            esac
            ;;
          push)
            SELECTED_SCANS=(semgrep containers)
            ;;
          pull_request)
            SELECTED_SCANS=(semgrep containers cve)
            ;;
          schedule)
            SELECTED_SCANS=(semgrep containers cve dependency)
            ;;
          *)
            echo "::error::Unsupported workflow event '${GITHUB_EVENT_NAME}'"
            exit 1
            ;;
        esac

        SELECTED_SCANS_CSV="$(IFS=,; echo "${SELECTED_SCANS[*]}")"
        SCAN_TYPE="${SELECTED_SCANS_CSV:-none}"
        export LANE_ID SHARD_ID LANE_MODE CODEQL_WAVE DETERMINISTIC_SEED
        export SCAN_TYPE SELECTED_SCANS_CSV
        mkdir -p .codex/contracts

        python - <<'PY'
        import json
        import os

        metadata = {
            "schema_version": os.environ["SECURITY_ARTIFACT_SCHEMA_VERSION"],
            "workflow": os.environ["GITHUB_WORKFLOW"],
            "run_id": os.environ["GITHUB_RUN_ID"],
            "run_number": os.environ["GITHUB_RUN_NUMBER"],
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "repository": os.environ["GITHUB_REPOSITORY"],
            "ref": os.environ["GITHUB_REF"],
            "sha": os.environ["GITHUB_SHA"],
            "event_name": os.environ["GITHUB_EVENT_NAME"],
            "actor": os.environ["GITHUB_ACTOR"],
            "scan_type": os.environ["SCAN_TYPE"],
            "selected_scans": os.environ["SELECTED_SCANS_CSV"].split(",")
            if os.environ["SELECTED_SCANS_CSV"]
            else [],
            "lane": {
                "id": os.environ["LANE_ID"],
                "shard_id": os.environ["SHARD_ID"],
                "mode": os.environ["LANE_MODE"],
            },
            "codeql_wave": os.environ["CODEQL_WAVE"],
            "deterministic_seed": os.environ["DETERMINISTIC_SEED"],
        }
        with open(".codex/contracts/lane-manifest.json", "w", encoding="utf-8") as handle:
            json.dump(metadata, handle, indent=2)
        PY

        {
          echo "lane_id=${LANE_ID}"
          echo "shard_id=${SHARD_ID}"
          echo "lane_mode=${LANE_MODE}"
          echo "codeql_wave=${CODEQL_WAVE}"
          echo "deterministic_seed=${DETERMINISTIC_SEED}"
          echo "scan_type=${SCAN_TYPE}"
          echo "selected_scans=${SELECTED_SCANS_CSV}"
        } >> "${GITHUB_OUTPUT}"
    - name: Generate input lock
      id: lock
      shell: bash
      run: "set -euo pipefail\n\n{\n  echo \"${GITHUB_SHA}\"\n  find .github/workflows\
        \ -maxdepth 1 -type f -name '*.yml' | sort | xargs sha256sum || true\n  find\
        \ scripts/ci -maxdepth 1 -type f 2>/dev/null | sort | xargs sha256sum || true\n\
        } > .codex/contracts/input-lock.materialized.txt\n\nSHA=\"$(sha256sum .codex/contracts/input-lock.materialized.txt\
        \ | awk '{print $1}')\"\n\ncat > .codex/contracts/input-lock.json <<EOF\n\
        {\n  \"schema_version\": \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\",\n  \"input_lock_sha256\"\
        : \"${SHA}\",\n  \"generated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n \
        \ \"repository\": \"${GITHUB_REPOSITORY}\",\n  \"run_id\": \"${GITHUB_RUN_ID}\"\
        ,\n  \"sha\": \"${GITHUB_SHA}\"\n}\nEOF\n\necho \"input_lock_sha256=${SHA}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Upload lane contract artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-lane-contract
        path: |
          .codex/contracts/lane-manifest.json
          .codex/contracts/input-lock.json
          .codex/contracts/input-lock.materialized.txt
        if-no-files-found: warn
        retention-days: 90
  codeql-scan:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 60
    # Keep CodeQL in the dedicated GA gate workflow for push/PR enforcement.
    # The general security suite can still run CodeQL for manual/reusable scans,
    # but it must not duplicate the automatic CodeQL gate uploads, mask scanner
    # failures, or silently drop a partial SARIF result.
    if: >
      (github.event_name == 'workflow_dispatch' &&
        inputs.scan_codeql) ||
      (github.event_name == 'workflow_call' &&
        (inputs.scan-type == '' || inputs.scan-type == 'all' || inputs.scan-type == 'codeql'))
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
        - python
        - javascript
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended,security-and-quality
        config-file: ./.github/codeql/codeql-config.yml
    - uses: github/codeql-action/autobuild@311b4ee155dcdab395044f00946f664bd51ff173
    - name: Perform CodeQL Analysis
      id: codeql
      uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173
      with:
        category: /language:${{ matrix.language }}
        output: codeql-sarif/${{ matrix.language }}
        upload: false
    - name: Validate CodeQL SARIF output
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        SARIF_DIR="codeql-sarif/${{ matrix.language }}"
        mkdir -p "$SARIF_DIR"
        shopt -s nullglob
        SARIF_FILES=("$SARIF_DIR"/*.sarif)

        if [ "${#SARIF_FILES[@]}" -eq 0 ]; then
          echo "::error::No SARIF files were produced for ${{ matrix.language }}; refusing to treat this as a silent pass."
          exit 1
        fi

        for sarif_file in "$SARIF_DIR"/*.sarif; do
          if ! jq empty "$sarif_file" >/dev/null 2>&1; then
            echo "::error::Malformed SARIF detected in $sarif_file; refusing to continue with a partial capture."
            exit 1
          fi
        done

        if [ "${{ steps.codeql.outcome }}" = "failure" ] && [ "${#SARIF_FILES[@]}" -gt 0 ]; then
          echo "CodeQL analysis failed after generating SARIF for ${{ matrix.language }}; preserving the genuine CodeQL failure."
          exit 1
        fi
    - name: Build CodeQL summary + lane metadata
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p codeql-reports .codex/contracts
        SARIF_DIR="codeql-sarif/${{ matrix.language }}"
        SUMMARY="codeql-reports/codeql-${{ matrix.language }}-summary.md"
        {
          echo "# CodeQL Report — ${{ matrix.language }}"
          echo ""
          echo "- **Repository:** \`${{ github.repository }}\`"
          echo "- **Commit:** \`${{ github.sha }}\`"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "- **Run:** [${{ github.run_id }}](${RUN_URL})"
          echo "- **Job status:** ${{ job.status }}"
          echo "- **Analyze outcome:** ${{ steps.codeql.outcome }}"
          echo "- **Lane ID:** \`${{ needs.lane-metadata-contract.outputs.lane_id }}\`"
          echo "- **Shard ID:** \`${{ needs.lane-metadata-contract.outputs.shard_id }}\`"
          echo "- **CodeQL Wave:** \`${{ needs.lane-metadata-contract.outputs.codeql_wave }}\`"
          echo "- **Input Lock SHA:** \`${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}\`"
          echo ""
          if compgen -G "$SARIF_DIR/*.sarif" > /dev/null; then
            echo "## SARIF files produced"
            echo ""
            for f in "$SARIF_DIR"/*.sarif; do
              size=$(wc -c < "$f")
              counts=$(python - "$f" <<'PY' 2>/dev/null || echo "rules=?, results=?"
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
          data = json.load(handle)

        runs = data.get("runs", [])
        rules = sum(
            len(r.get("tool", {}).get("driver", {}).get("rules", [])) for r in runs
        )
        results = sum(len(r.get("results", [])) for r in runs)
        print(f"rules={rules}, results={results}")
        PY
        )
              echo "- \`$(basename "$f")\` (${size} bytes, ${counts})"
            done
          else
            echo "_No SARIF files were produced for this language._"
          fi
        } > "$SUMMARY"

        cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

        cat > ".codex/contracts/output-contract-codeql-${{ matrix.language }}.json" <<EOF
        {
          "schema_version": "${SECURITY_ARTIFACT_SCHEMA_VERSION}",
          "job": "codeql-scan",
          "language": "${{ matrix.language }}",
          "lane_id": "${{ needs.lane-metadata-contract.outputs.lane_id }}",
          "shard_id": "${{ needs.lane-metadata-contract.outputs.shard_id }}",
          "input_lock_sha256": "${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}",
          "required_outputs": [
            "codeql-sarif/${{ matrix.language }}",
            "codeql-reports/codeql-${{ matrix.language }}-summary.md"
          ],
          "scan_outcome": "${{ steps.codeql.outcome }}",
          "status": "${{ job.status }}"
        }
        EOF
    - name: Upload CodeQL artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: security-suite-codeql-${{ matrix.language }}
        path: |
          codeql-sarif/${{ matrix.language }}/
          codeql-reports/codeql-${{ matrix.language }}-summary.md
          .codex/contracts/output-contract-codeql-${{ matrix.language }}.json
        if-no-files-found: warn
        retention-days: 30
  semgrep:
    name: Semgrep SAST (SARIF Upload)
    runs-on: ubuntu-latest
    needs: lane-metadata-contract
    timeout-minutes: 30
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.scan_semgrep) ||
      (github.event_name == 'workflow_call' &&
        (inputs.scan-type == '' || inputs.scan-type == 'all' || inputs.scan-type == 'semgrep'))
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: live
    - name: Install Semgrep
      run: pip install semgrep
    - name: Run Semgrep scan (SARIF)
      id: semgrep
      continue-on-error: true
      # Strip PYTHONPATH/PYTHONHOME so the external semgrep CLI does not inherit
      # repo-local src/ shadowing (it must resolve installed third-party packages,
      # not repo partial packages). Mirrors tests/security/test_semgrep_rules.py:40-41.
      env:
        PYTHONPATH: ""
        PYTHONHOME: ""
        SEMGREP_COLOR: never
        SEMGREP_DISABLE_LIVE_PROGRESS: "1"
      run: "set -o pipefail\nunset PYTHONPATH PYTHONHOME\nsemgrep scan \\\n  --config=p/security-audit \\\n  --config=p/python\
        \ \\\n  --config=p/flask \\\n  --sarif \\\n  --output=semgrep-results.sarif\
        \ \\\n  2>&1 | tee semgrep-scan.log || {\n    echo \"Primary configs failed,\
        \ falling back to auto...\"\n    semgrep scan --config=auto --sarif --output=semgrep-results.sarif\
        \ 2>&1 | tee semgrep-scan-fallback.log\n  }\n"
    - name: Run Semgrep scan (JSON)
      continue-on-error: true
      env:
        PYTHONPATH: ""
        PYTHONHOME: ""
        SEMGREP_COLOR: never
        SEMGREP_DISABLE_LIVE_PROGRESS: "1"
      run: "set -o pipefail\nunset PYTHONPATH PYTHONHOME\nsemgrep scan \\\n  --config=p/security-audit \\\n  --config=p/python\
        \ \\\n  --config=p/flask \\\n  --json \\\n  --output=semgrep-results.json\
        \ \\\n  2>&1 | tee semgrep-scan-json.log || {\n    echo \"Primary configs\
        \ failed for JSON output, falling back to auto...\"\n    semgrep scan --config=auto\
        \ --json --output=semgrep-results.json 2>&1 | tee semgrep-scan-json-fallback.log\n\
        \  }\n"
    - name: Ensure Semgrep SARIF is valid and uploadable
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        SARIF_FILE="semgrep-results.sarif"
        if [ ! -f "$SARIF_FILE" ] || [ ! -s "$SARIF_FILE" ] || ! jq empty "$SARIF_FILE" 2>/dev/null; then
          echo "Semgrep did not produce a valid SARIF payload; creating a minimal fallback stub."
          jq -n \
            --arg schema "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              "$schema": $schema,
              "version": "2.1.0",
              "runs": [{
                "tool": {
                  "driver": {
                    "name": "Semgrep",
                    "informationUri": "https://semgrep.dev",
                    "version": "latest",
                    "rules": []
                  }
                },
                "results": [],
                "properties": {
                  "ScanTimestamp": $timestamp,
                  "ScanType": "FallbackEmpty"
                }
              }]
            }' > "$SARIF_FILE"
        fi

        if jq empty "$SARIF_FILE" 2>/dev/null; then
          echo "Validated uploadable SARIF payload: $SARIF_FILE"
        else
          echo "Fallback SARIF validation failed" >&2
          exit 1
        fi
    - name: Chunk SARIF results
      if: always() && hashFiles('semgrep-results.sarif') != ''
      run: 'python scripts/chunk_sarif.py semgrep-results.sarif sarif-chunks/ --chunk-size
        4999 --base-name semgrep --verbose

        '
    - name: Upload chunked SARIF to GitHub Security
      if: always() && hashFiles('sarif-chunks/*.sarif') != ''
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
      run: "CHUNKS=(sarif-chunks/*.sarif)\nfor i in \"${!CHUNKS[@]}\"; do\n  sarif_file=\"\
        ${CHUNKS[$i]}\"\n  chunk_suffix=$(basename \"$sarif_file\" .sarif | sed 's/semgrep-chunk-//')\n\
        \  gh api \\\n    --method POST \\\n    -H \"Accept: application/vnd.github+json\"\
        \ \\\n    -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n    \"/repos/${{ github.repository\
        \ }}/code-scanning/sarifs\" \\\n    -F \"sarif=@$sarif_file\" \\\n    -F \"\
        commit_sha=${{ github.sha }}\" \\\n    -F \"ref=${{ github.ref }}\" \\\n \
        \   -F \"started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)\" \\\n    -F \"tool_name=Semgrep\"\
        \ \\\n    -F \"category=semgrep-chunk-$chunk_suffix\" \\\n    || true\ndone\n"
    - name: Generate Semgrep summary + contract
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        RESULTS=0
        ERRORS=0
        CHUNK_COUNT=0

        if [ -f semgrep-results.json ]; then
          RESULTS=$(python - <<'PY' 2>/dev/null || echo 0
        import json

        with open("semgrep-results.json", encoding="utf-8") as handle:
            data = json.load(handle)

        print(len(data.get("results", []) or []))
        PY
        )
          ERRORS=$(python - <<'PY' 2>/dev/null || echo 0
        import json

        with open("semgrep-results.json", encoding="utf-8") as handle:
            data = json.load(handle)

        print(len(data.get("errors", []) or []))
        PY
        )
        fi
        if [ -d sarif-chunks ]; then
          CHUNK_COUNT=$(find sarif-chunks -name '*.sarif' 2>/dev/null | wc -l | tr -d " ")
        fi

        {
          echo "# Semgrep SAST Report"
          echo ""
          echo "- **Findings (results):** ${RESULTS}"
          echo "- **Scanner errors:** ${ERRORS}"
          echo "- **SARIF chunks uploaded to GHAS:** ${CHUNK_COUNT}"
          echo "- **Scan outcome:** ${{ steps.semgrep.outcome }}"
          echo "- **Lane ID:** \`${{ needs.lane-metadata-contract.outputs.lane_id }}\`"
          echo "- **Shard ID:** \`${{ needs.lane-metadata-contract.outputs.shard_id }}\`"
          echo "- **Input Lock SHA:** \`${{ needs.lane-metadata-contract.outputs.input_lock_sha256 }}\`"
        } > semgrep-summary.md
        cat semgrep-summary.md >> "$GITHUB_STEP_SUMMARY"

        mkdir -p .codex/contracts
        cat > .codex/contracts/output-contract-semgrep.json <<EOF
        {
