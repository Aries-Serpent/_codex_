        \ -c \"import json;d=json.load(open('sbom.json'));print(len(d.get('components',[])\
        \ or []))\" 2>/dev/null || echo 0)\nfi\n{\n  echo \"# SBOM Report\"\n  echo\
        \ \"- **Components:** ${COMPONENT_COUNT}\"\n  echo \"- **Lane ID:** \\`${{\
        \ needs.lane-metadata-contract.outputs.lane_id }}\\`\"\n  echo \"- **Input\
        \ Lock SHA:** \\`${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
        \ }}\\`\"\n} > sbom-summary.md\ncat sbom-summary.md >> \"$GITHUB_STEP_SUMMARY\"\
        \n\nmkdir -p .codex/contracts\ncat > .codex/contracts/output-contract-sbom.json\
        \ <<EOF\n{\n  \"schema_version\": \"${SECURITY_ARTIFACT_SCHEMA_VERSION}\"\
        ,\n  \"job\": \"sbom-generation\",\n  \"lane_id\": \"${{ needs.lane-metadata-contract.outputs.lane_id\
        \ }}\",\n  \"input_lock_sha256\": \"${{ needs.lane-metadata-contract.outputs.input_lock_sha256\
