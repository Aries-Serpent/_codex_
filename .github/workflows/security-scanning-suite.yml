name: Security Scanning Suite

"on":
  push:
    branches: [main, develop, copilot/**]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM
  workflow_dispatch:
    inputs:
      scan-type:
        description: 'Security scan type'
        required: true
        type: choice
        options:
          - 'all'
          - 'codeql'
          - 'dependency'
          - 'semgrep'
        default: 'all'
  workflow_call:
    inputs:
      scan-type:
        description: 'Security scan type'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read
  security-events: write
  issues: write

env:
  PYTHON_VERSION: '3.12'


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  codeql-scan:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # javascript/typescript: repo has no standalone JS build; allow this matrix leg to fail
    # without blocking the overall workflow (python must still pass).
    # Mirrors the identical guard in codeql-analysis.yml.
    continue-on-error: ${{ matrix.language == 'javascript' }}
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (inputs.scan-type == 'all' || inputs.scan-type == 'codeql')) ||
      github.event_name == 'workflow_call'
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: github/codeql-action/init@5e316336eb4f107009e477d4bfbfff13d7250fae # v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@5e316336eb4f107009e477d4bfbfff13d7250fae # v4
      - uses: github/codeql-action/analyze@5e316336eb4f107009e477d4bfbfff13d7250fae # v4
        with:
          category: "/language:${{ matrix.language }}"
      - name: Summary
        if: always()
        run: |
          echo "## CodeQL - ${{ matrix.language }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (inputs.scan-type == 'all' || inputs.scan-type == 'dependency'))
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common
      - name: Install security tools
        run: pip install safety pip-audit
      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit --format json --output pip-audit.json || true
          pip-audit || echo "Vulnerabilities found"
      - name: Run Safety
        continue-on-error: true
        run: |
          safety check --json --output safety.json || true
          safety check || echo "Vulnerabilities found"
      - name: Upload results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dependency-scan-results
          path: |
            pip-audit.json
            safety.json
          retention-days: 30
      - name: Summary
        run: |
          echo "## Dependency Scan" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Complete" >> $GITHUB_STEP_SUMMARY

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.scan-type == 'all')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: ephemeral
      - name: Install tools
        run: pip install detect-secrets
      - name: Run detect-secrets
        id: detect-secrets
        continue-on-error: true
        run: |
          detect-secrets scan --all-files --force-use-all-plugins > .secrets.baseline
          SECRETS_COUNT=$(grep -c "filename" .secrets.baseline || echo "0")
          echo "secrets_found=$SECRETS_COUNT" >> $GITHUB_OUTPUT
      - name: Upload baseline
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: secrets-baseline
          path: .secrets.baseline
          retention-days: 30
      - name: Summary
        run: |
          echo "## Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo "**Secrets found:** ${{ steps.detect-secrets.outputs.secrets_found }}" >> $GITHUB_STEP_SUMMARY

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.scan-type == 'all')
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: common
      - name: Install tools
        run: pip install cyclonedx-bom
      - name: Generate SBOM
        run: |
          # cyclonedx-bom v7.x changed the CLI: --format → --of, --outfile → -o
          cyclonedx-py environment --of JSON -o sbom.json
          cyclonedx-py environment --of XML -o sbom.xml
      - name: Upload SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom-reports
          path: |
            sbom.json
            sbom.xml
          retention-days: 90
      - name: Summary
        run: |
          echo "## SBOM Generation" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Complete" >> $GITHUB_STEP_SUMMARY

  # ── Semgrep SAST ─────────────────────────────────────────────────────────
  # Consolidated from semgrep_sarif.yml (Phase 3.1, 2026-05-21).
  # The standalone semgrep_sarif.yml is archived to .github/workflow-archive/disabled/.
  semgrep:
    name: Semgrep SAST (SARIF Upload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (inputs.scan-type == 'all' || inputs.scan-type == 'semgrep')) ||
      (github.event_name == 'workflow_call' && (inputs.scan-type == '' || inputs.scan-type == 'all' || inputs.scan-type == 'semgrep'))
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow security-scanning-suite 2>/dev/null || echo "Cache health: check skipped"

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-tier: live

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          set -o pipefail
          semgrep scan \
            --config=p/security-audit \
            --config=p/python \
            --config=p/flask \
            --config=p/sqlalchemy \
            --sarif \
            --output=semgrep-results.sarif \
            2>&1 | tee semgrep-scan.log || {
              echo "Primary configs failed, falling back to auto..."
              set -o pipefail
              semgrep scan \
                --config=auto \
                --sarif \
                --output=semgrep-results.sarif \
                2>&1 | tee semgrep-scan-fallback.log
            }
          EXIT_CODE=$?
          exit ${EXIT_CODE:-0}

      - name: Chunk SARIF results
        if: always() && hashFiles('semgrep-results.sarif') != ''
        run: |
          python scripts/chunk_sarif.py \
            semgrep-results.sarif \
            sarif-chunks/ \
            --chunk-size 4999 \
            --base-name semgrep \
            --verbose

      - name: Upload chunked SARIF to GitHub Security
        if: always() && hashFiles('sarif-chunks/*.sarif') != ''
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          CHUNKS=(sarif-chunks/*.sarif)
          CHUNK_COUNT=${#CHUNKS[@]}
          echo "Uploading $CHUNK_COUNT SARIF chunk(s)..."
          for i in "${!CHUNKS[@]}"; do
            sarif_file="${CHUNKS[$i]}"
            chunk_num=$((i + 1))
            chunk_suffix=$(basename "$sarif_file" .sarif | sed 's/semgrep-chunk-//')
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/code-scanning/sarifs" \
              -F "sarif=@$sarif_file" \
              -F "commit_sha=${{ github.sha }}" \
              -F "ref=${{ github.ref }}" \
              -F "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -F "tool_name=Semgrep" \
              -F "category=semgrep-chunk-$chunk_suffix" \
              && echo "✅ Chunk $chunk_num uploaded" \
              || echo "❌ Chunk $chunk_num failed"
          done

      - name: Upload Semgrep results as artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: semgrep-results
          path: |
            semgrep-results.sarif
            sarif-chunks/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Semgrep SAST" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.semgrep.outcome }}" >> $GITHUB_STEP_SUMMARY

  security-suite-summary:
    name: Security Suite Summary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [codeql-scan, dependency-scan, secret-scan, sbom-generation, semgrep]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Security Scanning Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**CodeQL:** ${{ needs.codeql-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dependency:** ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Secrets:** ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**SBOM:** ${{ needs.sbom-generation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Semgrep:** ${{ needs.semgrep.result }}" >> $GITHUB_STEP_SUMMARY


      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --type pip --workflow security-scanning-suite --health 2>/dev/null || echo '{"status": "cache health check skipped"}'

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: security-suite-summary
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Security Scanning Suite"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
