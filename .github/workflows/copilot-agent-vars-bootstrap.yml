# copilot-agent-vars-bootstrap.yml
#
# Repo Variables → Copilot Agent Injection Mechanism
# ===================================================
#
# PURPOSE:
#   Ensures the Copilot coding agent has full awareness of key repository
#   variables at session start by writing a structured JSON manifest to
#   .codex/agent_context.json — readable from copilot-setup-steps.yml.
#
# HOW IT WORKS:
#   1. Triggered on every PR push + workflow_dispatch
#   2. Reads all COPILOT_* and CODEX_* repo variables via GitHub API
#   3. Writes .codex/agent_context.json (non-sensitive values only)
#   4. copilot-setup-steps.yml can `cat .codex/agent_context.json` to
#      inject context into the agent's environment before the session starts
#
# SECURITY:
#   - Only reads vars.* (never secrets)
#   - Writes only to .codex/ (not exposed to PR diff unless committed)
#   - CODEX_MASTER_KEY used solely for GET /repos/.../actions/variables
#
# GROUNDED STATUS: Tier-2 (advisory context injection, not a hard gate)

name: "Agent Vars Bootstrap"

on:
  push:
    branches:
      - 'copilot/**'
      - 'main'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print context without writing)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-agent-context:
    name: "Bootstrap agent variable context"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Read repo variables and write agent context
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Expose ALL vars.* as env vars using GitHub's native syntax
          COPILOT_AGENT_AUTH_ENABLED:    ${{ vars.COPILOT_AGENT_AUTH_ENABLED }}
          COPILOT_AGENT_SESSION_EXPIRES: ${{ vars.COPILOT_AGENT_SESSION_EXPIRES }}
          COPILOT_AGENT_LAST_SESSION_ID: ${{ vars.COPILOT_AGENT_LAST_SESSION_ID }}
          COPILOT_AGENT_STATE:           ${{ vars.COPILOT_AGENT_STATE }}
          CODEX_CI_FAILURE_RATE:         ${{ vars.CODEX_CI_FAILURE_RATE }}
          CODEX_COVERAGE_THRESHOLD:      ${{ vars.CODEX_COVERAGE_THRESHOLD }}
          CODEX_GROUNDED_TIER1_COUNT:    ${{ vars.CODEX_GROUNDED_TIER1_COUNT }}
          CODEX_GROUNDED_TIER2_COUNT:    ${{ vars.CODEX_GROUNDED_TIER2_COUNT }}
          CODEX_LAST_TELEMETRY_DATE:     ${{ vars.CODEX_LAST_TELEMETRY_DATE }}
          DEPLOY_ENV:                    ${{ vars.DEPLOY_ENV }}
        run: |
          python3 - << 'PYEOF'
          import json, os, pathlib, datetime

          # Collect all env vars that are repo variable injections
          VAR_PREFIXES = ("COPILOT_AGENT_", "CODEX_", "DEPLOY_")
          context = {}
          for key, val in os.environ.items():
              if any(key.startswith(p) for p in VAR_PREFIXES) and val:
                  context[key] = val

          # Add workflow metadata
          context["_meta"] = {
              "generated_at":   datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "workflow":       "copilot-agent-vars-bootstrap",
              "sha":            os.environ.get("GITHUB_SHA", "")[:8],
              "ref":            os.environ.get("GITHUB_REF", ""),
              "actor":          os.environ.get("GITHUB_ACTOR", ""),
              "run_id":         os.environ.get("GITHUB_RUN_ID", ""),
              "repo_variables_count": len([k for k in context if not k.startswith("_")]),
          }

          output_path = pathlib.Path(".codex/agent_context.json")
          output_path.parent.mkdir(parents=True, exist_ok=True)

          dry_run = os.environ.get("DRY_RUN", "false").lower() == "true"
          if dry_run:
              print("🔍 DRY RUN — agent context (not written):")
              print(json.dumps(context, indent=2))
          else:
              output_path.write_text(json.dumps(context, indent=2))
              print(f"✅ Written {len(context)-1} variables to {output_path}")
              print(json.dumps(context, indent=2))
          PYEOF

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔑 Agent Variable Context Bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .codex/agent_context.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('.codex/agent_context.json')); print(len(d)-1)")
            echo "✅ **${COUNT}** repo variables injected into \`.codex/agent_context.json\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .codex/agent_context.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Dry run — no file written" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### How to Use in copilot-setup-steps.yml" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo '- name: Inject agent context' >> "$GITHUB_STEP_SUMMARY"
          echo "  run: |" >> "$GITHUB_STEP_SUMMARY"
          echo '    if [ -f .codex/agent_context.json ]; then' >> "$GITHUB_STEP_SUMMARY"
          echo '      python3 -c "import json,os; [print(f'"'"'export {k}={v}'"'"') for k,v in json.load(open('"'"'.codex/agent_context.json'"'"')).items() if not k.startswith('"'"'_'"'"')]" >> "$GITHUB_ENV"' >> "$GITHUB_STEP_SUMMARY"
          echo '    fi' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: bootstrap-agent-context
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Copilot Agent Vars Bootstrap"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: copilot-agent-vars-bootstrap.yml → rescue-comment job (S227)_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
