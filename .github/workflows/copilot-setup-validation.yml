name: Copilot Setup Steps Validation
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    paths:
    - .github/workflows/copilot-setup-steps.yml
    - .github/workflows/copilot-setup-validation.yml
    - scripts/ci/validate_copilot_setup_steps.py
    - scripts/ci/validate_setup_steps_yaml.sh
    - scripts/ci/validate_copilot_dependencies.py
    - scripts/ci/validate_copilot_security.py
  push:
    branches:
    - main
    paths:
    - .github/workflows/copilot-setup-steps.yml
    - .github/workflows/copilot-setup-validation.yml
    - scripts/ci/validate_copilot_setup_steps.py
    - scripts/ci/validate_setup_steps_yaml.sh
    - scripts/ci/validate_copilot_dependencies.py
    - scripts/ci/validate_copilot_security.py
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  validate-copilot-setup:
    name: Copilot Setup Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13

    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install pyyaml yamllint

        '
    - name: Run Core Validation Tests
      id: core_validation
      run: "echo \"Running core validation tests...\"\npython scripts/ci/validate_copilot_setup_steps.py\
        \ \\\n  --json-output /tmp/core_validation.json \\\n  --repo-root .\n"
      continue-on-error: true
    - name: Run Integration Tests
      id: integration_tests
      run: "echo \"Running integration dependency tests...\"\npython scripts/ci/validate_copilot_dependencies.py\
        \ \\\n  --json-output /tmp/integration_tests.json \\\n  --repo-root .\n"
      continue-on-error: true
    - name: Run Security Tests
      id: security_tests
      run: "echo \"Running security and secrets validation...\"\npython scripts/ci/validate_copilot_security.py\
        \ \\\n  --json-output /tmp/security_tests.json \\\n  --repo-root .\n"
      continue-on-error: true
    - name: Run Legacy Shell Validation
      id: legacy_shell_validation
      run: 'echo "Running legacy shell-based validation..."

        bash scripts/ci/validate_setup_steps_yaml.sh

        '
      continue-on-error: true
    - name: Aggregate Results
      id: aggregate
      run: "echo \"Aggregating validation results...\"\n\n# Load test results\nif\
        \ [ -f /tmp/core_validation.json ]; then\n  CORE_PASSED=$(jq -r '.passed'\
        \ /tmp/core_validation.json)\n  CORE_TOTAL=$(jq -r '.total' /tmp/core_validation.json)\n\
        \  CORE_FAILED=$(jq -r '.failed' /tmp/core_validation.json)\nelse\n  CORE_PASSED=0\n\
        \  CORE_TOTAL=0\n  CORE_FAILED=0\nfi\n\nif [ -f /tmp/integration_tests.json\
        \ ]; then\n  INT_PASSED=$(jq -r '.passed' /tmp/integration_tests.json)\n \
        \ INT_TOTAL=$(jq -r '.total' /tmp/integration_tests.json)\n  INT_FAILED=$(jq\
        \ -r '.failed' /tmp/integration_tests.json)\nelse\n  INT_PASSED=0\n  INT_TOTAL=0\n\
        \  INT_FAILED=0\nfi\n\nif [ -f /tmp/security_tests.json ]; then\n  SEC_PASSED=$(jq\
        \ -r '.passed' /tmp/security_tests.json)\n  SEC_TOTAL=$(jq -r '.total' /tmp/security_tests.json)\n\
        \  SEC_FAILED=$(jq -r '.failed' /tmp/security_tests.json)\nelse\n  SEC_PASSED=0\n\
        \  SEC_TOTAL=0\n  SEC_FAILED=0\nfi\n\nTOTAL_PASSED=$((CORE_PASSED + INT_PASSED\
        \ + SEC_PASSED))\nTOTAL_TESTS=$((CORE_TOTAL + INT_TOTAL + SEC_TOTAL))\nTOTAL_FAILED=$((CORE_FAILED\
        \ + INT_FAILED + SEC_FAILED))\n\necho \"TOTAL_PASSED=$TOTAL_PASSED\" >> \"\
        $GITHUB_ENV\"\necho \"TOTAL_TESTS=$TOTAL_TESTS\" >> \"$GITHUB_ENV\"\necho\
        \ \"TOTAL_FAILED=$TOTAL_FAILED\" >> \"$GITHUB_ENV\"\n\nif [ \"$TOTAL_FAILED\"\
        \ -gt 0 ]; then\n  echo \"validation_status=failed\" >> \"$GITHUB_OUTPUT\"\
        \n  exit 1\nelse\n  echo \"validation_status=passed\" >> \"$GITHUB_OUTPUT\"\
        \n  exit 0\nfi\n"
      continue-on-error: true
    - name: Create Check Run (Core Validation)
      if: always()
      uses: actions/github-script@v8
      with:
        script: "const fs = require('fs');\n\nlet annotation_level = 'notice';\nlet\
          \ title = '\u2705 Core Validation Passed';\nlet summary = 'All core validation\
          \ tests passed.';\n\nif (fs.existsSync('/tmp/core_validation.json')) {\n\
          \  const results = JSON.parse(fs.readFileSync('/tmp/core_validation.json',\
          \ 'utf8'));\n  if (results.failed > 0) {\n    annotation_level = 'failure';\n\
          \    title = '\u274C Core Validation Failed';\n  }\n  summary = `${results.passed}/${results.total}\
          \ tests passed`;\n\n  // Add annotations for failed tests\n  if (results.failed\
          \ > 0) {\n    results.results\n      .filter(r => !r.passed && r.severity\
          \ === 'error')\n      .slice(0, 10)\n      .forEach(r => {\n        core.setFailed(`Core\
          \ Validation: ${r.name} \u2014 ${r.message}`);\n      });\n  }\n}\n\nconsole.log(`${title}:\
          \ ${summary}`);\n"
    - name: Create Check Run (Integration Tests)
      if: always()
      uses: actions/github-script@v8
      with:
        script: "const fs = require('fs');\n\nlet annotation_level = 'notice';\nlet\
          \ title = '\u2705 Integration Tests Passed';\nlet summary = 'All integration\
          \ tests passed.';\n\nif (fs.existsSync('/tmp/integration_tests.json')) {\n\
          \  const results = JSON.parse(fs.readFileSync('/tmp/integration_tests.json',\
          \ 'utf8'));\n  if (results.failed > 0) {\n    annotation_level = 'failure';\n\
          \    title = '\u274C Integration Tests Failed';\n  }\n  summary = `${results.passed}/${results.total}\
          \ tests passed`;\n\n  // Add annotations for failed tests\n  if (results.failed\
          \ > 0) {\n    results.results\n      .filter(r => !r.passed && r.severity\
          \ === 'error')\n      .slice(0, 10)\n      .forEach(r => {\n        core.setFailed(`Integration:\
          \ ${r.name} \u2014 ${r.message}`);\n      });\n  }\n}\n\nconsole.log(`${title}:\
          \ ${summary}`);\n"
    - name: Create Check Run (Security Tests)
      if: always()
      uses: actions/github-script@v8
      with:
        script: "const fs = require('fs');\n\nlet annotation_level = 'notice';\nlet\
          \ title = '\u2705 Security Tests Passed';\nlet summary = 'All security tests\
          \ passed.';\n\nif (fs.existsSync('/tmp/security_tests.json')) {\n  const\
          \ results = JSON.parse(fs.readFileSync('/tmp/security_tests.json', 'utf8'));\n\
          \  if (results.failed > 0) {\n    annotation_level = 'failure';\n    title\
          \ = '\u274C Security Tests Failed';\n  }\n  summary = `${results.passed}/${results.total}\
          \ tests passed`;\n\n  // Add annotations for failed tests\n  if (results.failed\
          \ > 0) {\n    results.results\n      .filter(r => !r.passed && r.severity\
          \ === 'error')\n      .slice(0, 10)\n      .forEach(r => {\n        core.setFailed(`Security:\
          \ ${r.name} \u2014 ${r.message}`);\n      });\n  }\n}\n\nconsole.log(`${title}:\
          \ ${summary}`);\n"
    - name: Post Summary Comment (if PR)
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: "const fs = require('fs');\n\nlet markdown = '## \U0001F916 Copilot\
          \ Setup Steps Validation\\n\\n';\nmarkdown += '### Test Results\\n\\n';\n\
          \nlet totalPassed = 0, totalTests = 0, totalFailed = 0;\n\n// Core validation\n\
          if (fs.existsSync('/tmp/core_validation.json')) {\n  const results = JSON.parse(fs.readFileSync('/tmp/core_validation.json',\
          \ 'utf8'));\n  const status = results.failed === 0 ? '\u2705' : '\u274C\
          ';\n  markdown += `| Phase | Status | Result |\\n`;\n  markdown += `|-------|--------|--------|\\\
          n`;\n  markdown += `| Core Validation | ${status} | ${results.passed}/${results.total}\
          \ passed |\\n`;\n  totalPassed += results.passed;\n  totalTests += results.total;\n\
          \  totalFailed += results.failed;\n}\n\n// Integration tests\nif (fs.existsSync('/tmp/integration_tests.json'))\
          \ {\n  const results = JSON.parse(fs.readFileSync('/tmp/integration_tests.json',\
          \ 'utf8'));\n  const status = results.failed === 0 ? '\u2705' : '\u274C\
          ';\n  markdown += `| Integration | ${status} | ${results.passed}/${results.total}\
          \ passed |\\n`;\n  totalPassed += results.passed;\n  totalTests += results.total;\n\
          \  totalFailed += results.failed;\n}\n\n// Security tests\nif (fs.existsSync('/tmp/security_tests.json'))\
          \ {\n  const results = JSON.parse(fs.readFileSync('/tmp/security_tests.json',\
          \ 'utf8'));\n  const status = results.failed === 0 ? '\u2705' : '\u274C\
          ';\n  markdown += `| Security | ${status} | ${results.passed}/${results.total}\
          \ passed |\\n`;\n  totalPassed += results.passed;\n  totalTests += results.total;\n\
          \  totalFailed += results.failed;\n}\n\nmarkdown += `\\n### Summary\\n`;\n\
          markdown += `**Total: ${totalPassed}/${totalTests} tests passed**\\n`;\n\
          \nif (totalFailed > 0) {\n  markdown += `\\n\u26A0\uFE0F **${totalFailed}\
          \ test(s) failed** \u2014 see details above.\\n`;\n} else {\n  markdown\
          \ += `\\n\u2705 **All validation tests passed!**\\n`;\n}\n\nmarkdown +=\
          \ `\\n### Merge Gates\\n`;\nmarkdown += `- ${totalFailed === 0 ? '\u2705\
          ' : '\u274C'} All automated tests pass\\n`;\nmarkdown += `- \u23F3 All 3\
          \ CCA variables present (validated by tests)\\n`;\nmarkdown += `- \u23F3\
          \ All 5 dependent workflows validate (validated by tests)\\n`;\nmarkdown\
          \ += `- ${totalFailed === 0 ? '\u2705' : '\u274C'} Security/secrets tests\
          \ pass\\n`;\nmarkdown += `- \u23F3 File size within acceptable range (validated\
          \ by tests)\\n`;\nmarkdown += `- \u23F3 At least 1 human reviewer approval\\\
          n`;\n\n// Post or update comment\nconst { data: comments } = await github.rest.issues.listComments({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  issue_number:\
          \ context.issue.number,\n});\n\nconst botComment = comments.find(comment\
          \ =>\n  comment.user.type === 'Bot' && comment.body.includes('Copilot Setup\
          \ Steps Validation')\n);\n\nif (botComment) {\n  await github.rest.issues.updateComment({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    comment_id:\
          \ botComment.id,\n    body: markdown\n  });\n} else {\n  await github.rest.issues.createComment({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    issue_number:\
          \ context.issue.number,\n    body: markdown\n  });\n}\n"
    - name: Block Merge on Failures
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: "// Request changes if critical tests failed\nawait github.rest.pulls.createReview({\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  pull_number:\
          \ context.issue.number,\n  event: 'REQUEST_CHANGES',\n  body: '\u274C Copilot\
          \ Setup Steps validation failed. Please review the test results and fix\
          \ the issues before requesting review.'\n});\n"
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: 'core_validation.json

          integration_tests.json

          security_tests.json

          '
        retention-days: 30
        name: validation-results
    - name: Set Final Status
      if: always()
      run: "if [ \"${{ steps.aggregate.outputs.validation_status }}\" = \"failed\"\
        \ ]; then\n  echo \"\u274C Validation failed \u2014 merge blocked\"\n  exit\
        \ 1\nelse\n  echo \"\u2705 Validation passed \u2014 merge allowed\"\n  exit\
        \ 0\nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
