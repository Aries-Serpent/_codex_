name: "📊 Post Phase 4-5 Summary to Discussion #4872"

# Posts the Phase 4-5 session summary to discussion #4872 (Production Readiness Campaign).
# Triggered manually or via workflow_dispatch to post comprehensive Phase 1-3 completion
# summary with metrics and next steps for Phase 4-5 validation.
#
# Architecture:
#   1. Read .codex/PHASE_4_5_DISCUSSION_POST.md
#   2. Post/upsert to discussion #4872 with metadata
#   3. Log success and provide update status
#
# Policy: Production Readiness Campaign coordination
# Discussion: https://github.com/Aries-Serpent/_codex_/discussions/4872

on:
  workflow_dispatch:
    inputs:
      force_post:
        description: "Force create new comment (skips upsert check)"
        required: false
        default: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  discussions: write
  pull-requests: read

jobs:
  post-to-discussion:
    name: "📊 Post to Discussion #4872"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Extract Phase 4-5 summary
        id: extract
        shell: python3 {0}
        run: |
          import os
          from pathlib import Path

          post_file = Path(".codex/PHASE_4_5_DISCUSSION_POST.md")
          output_file = Path(os.environ["GITHUB_OUTPUT"])

          def write_output(name: str, value: str) -> None:
              with output_file.open("a", encoding="utf-8") as handle:
                  handle.write(f"{name}={value}\n")

          def write_multiline_output(name: str, value: str) -> None:
              delimiter = "__PHASE_4_5_ENTRY__"
              with output_file.open("a", encoding="utf-8") as handle:
                  handle.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")

          if not post_file.exists():
              print(f"::error::PHASE_4_5_DISCUSSION_POST.md not found at {post_file}")
              write_output("should_post", "false")
              raise SystemExit(1)

          content = post_file.read_text(encoding="utf-8").strip()

          if not content:
              print("::error::PHASE_4_5_DISCUSSION_POST.md is empty")
              write_output("should_post", "false")
              raise SystemExit(1)

          write_output("should_post", "true")
          write_multiline_output("post_content", content)

          print(f"✅ Extracted Phase 4-5 post content ({len(content)} bytes)")

      - name: "🔑 Resolve auth token for discussions:write"
        id: auth
        env:
          GITHUB_APP_PRIVATE_KEY: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets._GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets._GITHUB_APP_INSTALLATION_ID }}
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          pip install "PyJWT==2.8.0" "cryptography==44.0.2" --quiet
          RESOLVED_TOKEN=""
          if [[ -n "${GITHUB_APP_PRIVATE_KEY}" && -n "${GITHUB_APP_ID}" && -n "${GITHUB_APP_INSTALLATION_ID}" ]]; then
            echo "ℹ️ Attempting GitHub App installation token mint..."
            INSTALL_TOKEN=$(python3 - <<'PYEOF'
          import os, time, json, sys
          try:
              import jwt
              key = os.environ["GITHUB_APP_PRIVATE_KEY"]
              app_id = os.environ["GITHUB_APP_ID"]
              inst_id = os.environ["GITHUB_APP_INSTALLATION_ID"]
              now = int(time.time())
              payload = {"iat": now - 60, "exp": now + 540, "iss": str(app_id)}
              app_jwt = jwt.encode(payload, key, algorithm="RS256")
              import urllib.request, urllib.error
              req = urllib.request.Request(
                  f"https://api.github.com/app/installations/{inst_id}/access_tokens",
                  method="POST",
                  data=json.dumps({}).encode(),
                  headers={
                       "Authorization": f"{app_jwt}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "codex-phase-4-5/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read())
                  print(data["token"])
              except urllib.error.HTTPError as http_err:
                  body = http_err.read().decode("utf-8", errors="replace")
                  print(f"APP_TOKEN_FAILED: HTTP {http_err.code} — {body}", file=sys.stderr)
                  print("")
          except Exception as e:
              print(f"APP_TOKEN_FAILED: {e}", file=sys.stderr)
              print("")
          PYEOF
          )
            if [[ -n "${INSTALL_TOKEN}" && "${INSTALL_TOKEN}" != "APP_TOKEN_FAILED"* ]]; then
              RESOLVED_TOKEN="${INSTALL_TOKEN}"
              echo "✅ GitHub App installation token acquired"
              echo "auth_source=github_app" >> "$GITHUB_OUTPUT"
            else
              echo "⚠️ App token mint failed — falling back to PAT"
            fi
          fi
          if [[ -z "${RESOLVED_TOKEN}" ]]; then
            if [[ -n "${CODEX_MASTER_KEY}" ]]; then
              RESOLVED_TOKEN="${CODEX_MASTER_KEY}"
              echo "auth_source=codex_master_key" >> "$GITHUB_OUTPUT"
            elif [[ -n "${CODEX_BACKUP_KEY}" ]]; then
              RESOLVED_TOKEN="${CODEX_BACKUP_KEY}"
              echo "auth_source=codex_backup_key" >> "$GITHUB_OUTPUT"
            else
              RESOLVED_TOKEN="${GITHUB_TOKEN_FALLBACK}"
              echo "auth_source=github_token" >> "$GITHUB_OUTPUT"
              echo "⚠️ Using github.token — discussion write may fail without discussions:write"
            fi
          fi
          echo "::add-mask::${RESOLVED_TOKEN}"
          echo "resolved_token=${RESOLVED_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: "Post to GitHub Discussion #4872"
        if: steps.extract.outputs.should_post == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          POST_CONTENT: ${{ steps.extract.outputs.post_content }}
          FORCE_POST: ${{ inputs.force_post || 'false' }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        with:
          github-token: ${{ steps.auth.outputs.resolved_token }}
          script: |
            const encode = encodeURIComponent;
            const discussionNumber = 4872;
            const postContent = (process.env.POST_CONTENT || '').trim();
            if (!postContent) {
              core.error('Empty post content — cannot proceed');
              throw new Error('Empty phase 4-5 content');
            }

            const branch = process.env.REF || '';
            const sha = (process.env.SHA || '').slice(0, 7);
            const timestamp = new Date().toISOString();
            const contractMarker = `<!-- codex-phase-4-5:v1 -->`;
            const metadataLine = `> **Posted:** ${timestamp} · branch \`${branch}\` · sha \`${sha}\``;
            const body = `${contractMarker}\n${metadataLine}\n\n${postContent}`;

            let discussionId = '';
            try {
              const discussion = await github.graphql(`
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    discussion(number: $number) { id }
                  }
                }
              `, {
                owner: context.repo.owner,
                name: context.repo.repo,
                number: discussionNumber,
              });
              discussionId = discussion.repository.discussion.id;
            } catch (e) {
              core.error(`Could not fetch discussion #${discussionNumber}: ${e.message}`);
              throw new Error(`Failed to fetch discussion #${discussionNumber}`);
            }

            let existingComment = null;
            let cursor = null;
            while (discussionId) {
              const page = await github.graphql(`
                query($id: ID!, $cursor: String) {
                  node(id: $id) {
                    ... on Discussion {
                      comments(last: 100, before: $cursor) {
                        nodes { id body url }
                        pageInfo { hasPreviousPage startCursor }
                      }
                    }
                  }
                }
              `, { id: discussionId, cursor });
              const comments = page.node.comments.nodes || [];
              for (const comment of [...comments].reverse()) {
                if ((comment.body || '').includes(contractMarker)) {
                  existingComment = comment;
                  break;
                }
              }
              if (existingComment || !page.node.comments.pageInfo.hasPreviousPage) {
                break;
              }
              cursor = page.node.comments.pageInfo.startCursor;
            }

            try {
              if (existingComment && process.env.FORCE_POST !== 'true') {
                const result = await github.graphql(`
                  mutation($commentId: ID!, $body: String!) {
                    updateDiscussionComment(input: { commentId: $commentId, body: $body }) {
                      comment { id url }
                    }
                  }
                `, {
                  commentId: existingComment.id,
                  body,
                });
                core.info(
                  `✅ Updated Phase 4-5 summary in discussion #${discussionNumber}: ` +
                  `${result.updateDiscussionComment.comment.url}`
                );
                return;
              }

              const result = await github.graphql(`
                mutation($discussionId: ID!, $body: String!) {
                  addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                    comment { id url }
                  }
                }
              `, {
                discussionId,
                body,
              });
              core.info(
                `✅ Posted Phase 4-5 summary to discussion #${discussionNumber}: ` +
                `${result.addDiscussionComment.comment.url}`
              );
            } catch (e) {
              core.error(`Failed to post discussion comment: ${e.message}`);
              core.info('Body preview (first 200 chars): ' + body.slice(0, 200));
              throw e;
            }

      - name: Log success
        if: success()
        run: |
          echo "✅ Phase 4-5 summary posted to discussion #4872"
          echo "📊 Status: Phase 1-3 complete, Phase 4-5 executing"
          echo "🔗 Discussion: https://github.com/Aries-Serpent/_codex_/discussions/4872"
