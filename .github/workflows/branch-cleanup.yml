name: 🌿 Branch Cleanup
true:
  schedule:
  - cron: 0 2 * * 0
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — show what would be deleted without deleting
        required: false
        type: boolean
        default: true
      delete_merged:
        description: Delete fully-merged branches
        required: false
        type: boolean
        default: true
      delete_stale:
        description: Delete stale merged branches (inactive > stale_days)
        required: false
        type: boolean
        default: false
      stale_days:
        description: Stale threshold in days (for delete_stale)
        required: false
        type: number
        default: 30
      delete_by_prefix:
        description: Delete merged branches matching target prefixes
        required: false
        type: boolean
        default: true
      prefixes:
        description: Comma-separated branch prefixes to target
        required: false
        type: string
        default: copilot/,self-heal/run-,dependabot/,fix/,chore/,ci/
      post_issue:
        description: Open a GitHub issue with the cleanup report
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  cleanup:
    name: 🌿 Branch Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    steps:
    - name: 📥 Checkout (sparse — script only)
      uses: actions/checkout@v7
      with:
        sparse-checkout: 'scripts/ci/branch_cleanup.py

          '
        sparse-checkout-cone-mode: false
    - name: 🐍 Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.12.13
    - name: 🌿 Run branch cleanup
      id: cleanup
      env:
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        INPUT_PREFIXES: ${{ inputs.prefixes }}
        INPUT_STALE_DAYS: ${{ inputs.stale_days || 30 }}
      run: "# Build argument list using an array to avoid SC2089/SC2090\nARGS=()\n\
        \n# Strategy flags\n# On schedule: always delete merged + by-prefix (safe\
        \ defaults)\nif [ \"${{ github.event_name }}\" = \"schedule\" ]; then\n  ARGS+=(--delete-merged\
        \ --delete-by-prefix)\n  ARGS+=(--prefixes \"copilot/,self-heal/run-,dependabot/,fix/,chore/,ci/\"\
        )\n  ARGS+=(--execute)\nelse\n  # Manual dispatch — respect inputs\n  [ \"\
        ${{ inputs.delete_merged }}\" = \"true\" ]     && ARGS+=(--delete-merged)\n\
        \  [ \"${{ inputs.delete_stale }}\"  = \"true\" ]     && ARGS+=(--delete-stale\
        \ --stale-days \"$INPUT_STALE_DAYS\")\n  [ \"${{ inputs.delete_by_prefix }}\"\
        \ = \"true\" ]  && ARGS+=(--delete-by-prefix --prefixes \"$INPUT_PREFIXES\"\
        )\n  [ \"${{ inputs.dry_run }}\" != \"true\" ]          && ARGS+=(--execute)\n\
        fi\n\nARGS+=(--json-output /tmp/branch_cleanup_report.json --github-summary)\n\
        \necho \"Running: python scripts/ci/branch_cleanup.py ${ARGS[*]}\"\npython\
        \ scripts/ci/branch_cleanup.py \"${ARGS[@]}\"\n"
    - name: 📋 Post issue report (optional)
      if: 'inputs.post_issue == ''true'' && always()

        '
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "if [ ! -f /tmp/branch_cleanup_report.json ]; then\n  echo \"No report\
        \ file found — skipping issue creation\"\n  exit 0\nfi\n\n# Build issue body\
        \ from JSON report\nTIMESTAMP=$(python3 -c \"import json; d=json.load(open('/tmp/branch_cleanup_report.json'));\
        \ print(d['timestamp'][:19]+'Z')\" 2>/dev/null || echo \"unknown\")\nTO_DEL=$(python3\
        \ -c \"import json; d=json.load(open('/tmp/branch_cleanup_report.json'));\
        \ print(d['summary']['to_delete'])\" 2>/dev/null || echo \"?\")\nDELETED=$(python3\
        \ -c \"import json; d=json.load(open('/tmp/branch_cleanup_report.json'));\
        \ print(d['summary']['deleted'])\" 2>/dev/null || echo \"?\")\nSTALE=$(python3\
        \ -c \"import json; d=json.load(open('/tmp/branch_cleanup_report.json'));\
        \ print(d['summary']['stale_warn'])\" 2>/dev/null || echo \"?\")\nDRY_RUN=$(python3\
        \ -c \"import json; d=json.load(open('/tmp/branch_cleanup_report.json'));\
        \ print(d.get('dry_run', True))\" 2>/dev/null || echo \"True\")\n\nMODE=\"\
        Dry-run\"\n[ \"${DRY_RUN}\" = \"False\" ] && MODE=\"Execute\"\n\n# Build body\
        \ using printf to avoid multiline YAML indentation issues\nBODY=$(printf '##\
        \ Branch Cleanup Report — %s\\n\\nMode: %s\\nEligible for deletion: %s\\nActually\
        \ deleted: %s\\nStale (needs review): %s\\n\\nSee workflow run for full log.\\\
        n\\n_Auto-generated by branch-cleanup.yml_' \\\n  \"${TIMESTAMP}\" \"${MODE}\"\
        \ \"${TO_DEL}\" \"${DELETED}\" \"${STALE}\")\n\ngh issue create \\\n  --repo\
        \ \"${{ github.repository }}\" \\\n  --title \"\U0001F33F Branch Cleanup Report\
        \ — ${TIMESTAMP} (${MODE})\" \\\n  --body \"${BODY}\" \\\n  --label \"maintenance\"\
        \ \\\n  || echo \"⚠️  Could not create issue (label may not exist) — continuing\"\
        \n"
    - name: 📦 Upload JSON report as artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: branch-cleanup-report-${{ github.run_number }}
        path: /tmp/branch_cleanup_report.json
        retention-days: 30
        if-no-files-found: ignore
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
