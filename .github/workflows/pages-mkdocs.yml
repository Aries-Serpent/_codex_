# GitHub Pages Deployment Workflow (MkDocs)
#
# Builds and deploys documentation to GitHub Pages using MkDocs.
# Requires GitHub Pages to be enabled in repository settings with source: "GitHub Actions"
#
# Detection Report:
# - Found: mkdocs.yml (MkDocs configuration)
# - Found: docs/ directory with markdown files
# - Build type: MkDocs with Material theme

name: Deploy Pages (MkDocs)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # For git-revision-date plugin if used
          
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'live'
