name: Art_CodeQL GA Security Gate
'on':
  push:
    branches:
    - main
    - develop
    - release/**
  pull_request:
    branches:
    - main
    - develop
    - release/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run mode (no blocking)
        type: boolean
        default: false
      severity_threshold:
        description: Minimum severity to block (critical, high, medium)
        type: choice
        options:
        - critical
        - high
        - medium
        default: high
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write
  statuses: write
env:
  PYTHON_VERSION: '3.12'
  CODEQL_SEVERITY_THRESHOLD: ${{ github.event.inputs.severity_threshold || 'high'
    }}
jobs:
  codeql-analysis:
    name: CodeQL Scan & Gate Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      critical_count: ${{ steps.analyze.outputs.critical_count }}
      high_count: ${{ steps.analyze.outputs.high_count }}
      medium_count: ${{ steps.analyze.outputs.medium_count }}
      alerts_blocked: ${{ steps.gate-decision.outputs.blocked }}
      gate_status: ${{ steps.gate-decision.outputs.status }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173
      with:
        languages: python, javascript
        queries: security-extended, security-and-quality
        config-file: ./.github/codeql/codeql-config.yml
    - name: Autobuild
      uses: github/codeql-action/autobuild@311b4ee155dcdab395044f00946f664bd51ff173
    - name: Perform CodeQL Analysis
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173
      with:
        category: python-security-gate-${{ github.run_id }}-${{ github.run_attempt }}
        # Default CodeQL setup is enabled for this repository, so SARIF upload from
        # this advanced configuration is rejected by Code Scanning. Export the SARIF
        # to the workspace instead; the Parse/artifact steps below consume it.
        upload: false
        output: results
    - name: Validate CodeQL output exists
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if ! find . -name '*.sarif' -type f | grep -q .; then
          echo "No CodeQL SARIF artifacts were produced; treating this as a workflow failure instead of a silent pass."
          echo "This usually indicates a CodeQL analysis error, timeout, or no-build scenario." >&2
          exit 1
        fi
    - name: Validate active security references
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        required=(
          ".codex/security/code_scanning_inventory/manifest.json"
          ".codex/security/code_scanning_inventory/api_inventory_summary.json"
          "docs/ci/SECURITY_ENFORCEMENT_GATES.md"
        )
        for file in "${required[@]}"; do
          if [ ! -s "$file" ]; then
            echo "::error::Missing or empty active security reference: $file"
            exit 1
          fi
        done
    - name: Parse CodeQL Results
      id: analyze
      shell: bash
      run: |
        set +e
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        root = Path('.')
        sarif_files = sorted(p for p in root.rglob('*.sarif') if p.is_file() and p.stat().st_size > 0)
        critical = 0
        high = 0
        medium = 0

        def normalize(value: object) -> str:
            return str(value or '').strip().lower()

        if not sarif_files:
            print('::error::No SARIF files were produced after CodeQL analysis; refusing to treat this as a no-alert result because it can mask a silent scanner failure.')
            raise SystemExit(1)

        valid_sarif_count = 0
        for sarif_path in sarif_files:
            try:
                data = json.loads(sarif_path.read_text(encoding='utf-8'))
            except Exception as exc:
                print(f'::error::Malformed SARIF file at {sarif_path}: {exc}')
                raise SystemExit(1)
            if not isinstance(data, dict):
                print(f'::error::SARIF document at {sarif_path} is not a JSON object.')
                raise SystemExit(1)
            valid_sarif_count += 1
            for run in data.get('runs') or []:
                if not isinstance(run, dict):
                    continue
                for result in run.get('results') or []:
                    if not isinstance(result, dict):
                        continue
                    level = normalize(result.get('level'))
                    severity = normalize((result.get('properties') or {}).get('severity'))
                    if level in {'error', 'fatal', 'fatal-error'} or severity in {'error', 'fatal', 'critical'}:
                        critical += 1
                    elif level == 'warning' or severity in {'warning', 'high'}:
                        high += 1
                    elif level == 'note' or severity in {'note', 'medium'}:
                        medium += 1

        if valid_sarif_count == 0:
            print('::error::No valid SARIF documents were parsed from the CodeQL output; this would silently hide the repository alert inventory.')
            raise SystemExit(1)

        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
            fh.write(f'critical_count={critical}\n')
            fh.write(f'high_count={high}\n')
            fh.write(f'medium_count={medium}\n')

        summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
        if summary_path:
            lines = [
                '## CodeQL Alert Analysis',
                '| Severity | Count |',
                '|----------|-------|',
                f'| Critical | {critical} |',
                f'| High | {high} |',
                f'| Medium | {medium} |',
            ]
            with open(summary_path, 'a', encoding='utf-8') as fh:
                fh.write('\n'.join(lines) + '\n')
        print(f'critical={critical} high={high} medium={medium}')
        PY
    - name: Upload CodeQL results artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: codeql-ga-sarif-${{ github.run_id }}
        path: |
          results/**
          **/*.sarif
        if-no-files-found: warn
        retention-days: 30
    - name: Gate Decision & Policy Enforcement
      id: gate-decision
      shell: bash
      env:
        CRITICAL: ${{ steps.analyze.outputs.critical_count || 0 }}
        HIGH: ${{ steps.analyze.outputs.high_count || 0 }}
        MEDIUM: ${{ steps.analyze.outputs.medium_count || 0 }}
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        SEVERITY_THRESHOLD: ${{ env.CODEQL_SEVERITY_THRESHOLD }}
      run: |
        BLOCKED=false
        STATUS="PASS"
        REASON=""

        # Enforce a mutually-exclusive severity threshold.
        if [ "$SEVERITY_THRESHOLD" = "critical" ]; then
          if [ "$CRITICAL" -gt 0 ]; then
            BLOCKED=true
            STATUS="FAIL"
            REASON="Critical vulnerabilities detected ($CRITICAL)"
          fi
        elif [ "$SEVERITY_THRESHOLD" = "high" ]; then
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            BLOCKED=true
            STATUS="FAIL"
            REASON="Critical or high severity vulnerabilities detected ($CRITICAL critical / $HIGH high)"
          fi
        elif [ "$SEVERITY_THRESHOLD" = "medium" ]; then
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$MEDIUM" -gt 0 ]; then
            BLOCKED=true
            STATUS="FAIL"
            REASON="Critical, high, or medium severity vulnerabilities detected ($CRITICAL critical / $HIGH high / $MEDIUM medium)"
          fi
        fi

        # Override if dry-run mode
        if [ "$DRY_RUN" = "true" ]; then
          BLOCKED=false
          STATUS="DRY_RUN"
          REASON="Dry-run mode enabled (gate not enforced)"
        fi

        echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "reason=$REASON" >> "$GITHUB_OUTPUT"
        echo "### Gate Decision: $STATUS" >> "$GITHUB_STEP_SUMMARY"
        echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

        if [ "$BLOCKED" = "true" ] && [ "$DRY_RUN" != "true" ]; then
          exit 1
        fi
    - name: Create PR Comment with Gate Status
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: |
          const critical = '${{ steps.analyze.outputs.critical_count }}';
          const high = '${{ steps.analyze.outputs.high_count }}';
          const medium = '${{ steps.analyze.outputs.medium_count }}';
          const blocked = '${{ steps.gate-decision.outputs.blocked }}';
          const status = '${{ steps.gate-decision.outputs.status }}';
          const threshold = '${{ env.CODEQL_SEVERITY_THRESHOLD }}' || 'high';
          const isBlocking = (severity) => {
            if (threshold === 'critical') return severity === 'Critical';
            if (threshold === 'high') return severity === 'Critical' || severity === 'High';
            if (threshold === 'medium') return ['Critical', 'High', 'Medium'].includes(severity);
            return false;
          };

          let comment = `## 🔐 CodeQL GA Security Gate\n\n`;
          comment += `**Gate Status**: ${status === 'FAIL' ? '❌ BLOCKED' : status === 'PASS' ? '✅ PASSED' : '⚠️ ' + status}\n\n`;
          comment += `### Alert Summary\n`;
          comment += `| Severity | Count | Status |\n`;
          comment += `|----------|-------|--------|\n`;
          comment += `| Critical | ${critical} | ${isBlocking('Critical') ? '❌ Blocking' : '✅ Clear'} |\n`;
          comment += `| High | ${high} | ${isBlocking('High') ? '❌ Blocking' : '✅ Clear'} |\n`;
          comment += `| Medium | ${medium} | ${isBlocking('Medium') ? '❌ Blocking' : 'ℹ️ Logged'} |\n\n`;

          if (blocked === 'true') {
            comment += `### Action Required\n`;
            comment += `This PR cannot be merged until CodeQL vulnerabilities are resolved.\n\n`;
            comment += `**Resources**:\n`;
            comment += `- [Security inventory manifest](.codex/security/code_scanning_inventory/manifest.json)\n`;
            comment += `- [API inventory summary](.codex/security/code_scanning_inventory/api_inventory_summary.json)\n`;
            comment += `- [Security enforcement guide](docs/ci/SECURITY_ENFORCEMENT_GATES.md)\n`;
            comment += `- [Security Alerts](https://github.com/${{ github.repository }}/security/code-scanning)\n`;
          } else {
            comment += `### Status\n`;
            comment += `✅ All CodeQL security checks passed.\n`;
          }

          comment += `\n---\n*Gate v1.0.0 - Phase 6 Lane 1*\n`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    - name: Log Gate Decision to Audit Trail
      if: always()
      shell: bash
      run: "mkdir -p .codex/security/gate_audit\n\nAUDIT_LOG=\".codex/security/gate_audit/gate_$(date\
        \ +%Y%m%dT%H%M%SZ).json\"\n\ncat > \"$AUDIT_LOG\" << EOF\n{\n  \"timestamp\"\
        : \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\n  \"event\": \"${{ github.event_name\
        \ }}\",\n  \"repository\": \"${{ github.repository }}\",\n  \"branch\": \"\
        ${{ github.ref }}\",\n  \"commit\": \"${{ github.sha }}\",\n  \"pr_number\"\
        : ${{ github.event.number || -1 }},\n  \"actor\": \"${{ github.actor }}\"\
        ,\n  \"gate_status\": \"${{ steps.gate-decision.outputs.status || 'UNKNOWN' }}\",\n  \"\
        blocked\": ${{ steps.gate-decision.outputs.blocked || 'false' }},\n  \"reason\": \"${{\
        \ steps.gate-decision.outputs.reason || '' }}\",\n  \"critical_alerts\": ${{ steps.analyze.outputs.critical_count\
        \ || 0 }},\n  \"high_alerts\": ${{ steps.analyze.outputs.high_count || 0 }},\n  \"medium_alerts\"\
        : ${{ steps.analyze.outputs.medium_count || 0 }},\n  \"severity_threshold\": \"\
        ${{ env.CODEQL_SEVERITY_THRESHOLD }}\",\n  \"dry_run\": ${{ github.event.inputs.dry_run\
        \ || false }},\n  \"gate_version\": \"1.0.0-phase-6-lane-1\"\n}\nEOF\n\necho\
        \ \"Audit trail recorded: $AUDIT_LOG\"\n"
    - name: Upload Gate Audit Logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: codeql-ga-gate-audit-${{ github.run_id }}
        path: .codex/security/gate_audit/
        retention-days: 90
    timeout-minutes: 45
  create-issue-on-alert:
    name: Create Issue for New Alerts
    runs-on: ubuntu-latest
    needs: codeql-analysis
    if: needs.codeql-analysis.outputs.alerts_blocked == 'true' && github.event_name
      == 'push'
    permissions:
      issues: write
      security-events: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Create Security Alert Issue
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "const critical = '${{ needs.codeql-analysis.outputs.critical_count\
          \ }}';\nconst high = '${{ needs.codeql-analysis.outputs.high_count }}';\n\
          \nconst issueTitle = `\U0001F510 CodeQL Security Alert: ${critical} Critical\
          \ + ${high} High`;\n\nconst issueBody = `## CodeQL Security Alert\n\n**Branch**:\
          \ \\`${{ github.ref }}\\`  \n**Commit**: \\`${{ github.sha }}\\`  \n**Author**:\
          \ @${{ github.actor }}  \n\n### Alert Summary\n- **Critical Alerts**: ${critical}\n\
          - **High Alerts**: ${high}\n- **Timestamp**: ${new Date().toISOString()}\n\
          \n### Required Actions\n1. Fix or suppress all critical/high alerts\n2.\
          \ Run local CodeQL scan to verify\n3. Update PR with remediation\n4. Request\
          \ approval from @${{ github.repository_owner }} if suppression needed\n\n### Resources\n- [Security inventory](.codex/security/code_scanning_inventory/api_inventory_summary.json)\n- [Security enforcement guide](docs/ci/SECURITY_ENFORCEMENT_GATES.md)\n- [Security Dashboard](https://github.com/${{ github.repository }}/security/code-scanning)\n\n### SLA\n- **Critical**: 1 hour resolution\n- **High**: 4 hours resolution\n\
          \n---\n*Automated by CodeQL GA Security Gate (Phase 6 Lane 1)*`;\n\nconst\
          \ issue = await github.rest.issues.create({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  title: issueTitle,\n  body: issueBody,\n\
          \  labels: ['\U0001F510 security', 'codeql', 'blocking'],\n  });\n\nconsole.log(`Created issue: ${issue.data.html_url}`);\n"
    timeout-minutes: 30
  report-summary:
    name: Summary Report
    runs-on: ubuntu-latest
    needs: codeql-analysis
    if: always()
    steps:
    - name: Generate Gate Summary
      shell: bash
      run: 'echo "## CodeQL GA Security Gate - Final Report" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Gate Status**: ${{ needs.codeql-analysis.outputs.gate_status }}" >>
        $GITHUB_STEP_SUMMARY

        echo "**Blocked**: ${{ needs.codeql-analysis.outputs.alerts_blocked }}" >>
        $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Alert Counts" >> $GITHUB_STEP_SUMMARY

        echo "- Critical: ${{ needs.codeql-analysis.outputs.critical_count }}" >>
        $GITHUB_STEP_SUMMARY

        echo "- High: ${{ needs.codeql-analysis.outputs.high_count }}" >> $GITHUB_STEP_SUMMARY

        echo "- Medium: ${{ needs.codeql-analysis.outputs.medium_count }}" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Phase 6 Lane 1** - CodeQL GA Deployment Ready" >> $GITHUB_STEP_SUMMARY

        '
    timeout-minutes: 30
