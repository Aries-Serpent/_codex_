name: mypy Baseline (Type-Check Anti-Regression)

# Runs mypy against src/ and enforces that the error count never exceeds the
# stored .mypy_baseline.  This is a ratchet gate: once errors are fixed and the
# baseline is lowered, it cannot go back up.
#
# Priority 2 deliverable (AAIS 95→100): adds mypy coverage to CI (+2 AAIS pts).
# Baseline: 1152 errors (established 2026-03-14, Session 41, PR #3580).

on:
  pull_request:
    paths:
      - 'src/**'
      - '.mypy_baseline'
      - 'mypy.ini'
      - 'pyproject.toml'
      - 'scripts/ci/mypy_baseline.py'
      - '.github/workflows/mypy-baseline.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.mypy_baseline'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mypy-baseline-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  mypy-baseline:
    name: "🔎 mypy Anti-Regression Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── SHA-drift diagnostic ────────────────────────────────────────────
      # GitHub Actions creates an internal *merge commit* for pull-request
      # runs (the hypothetical result of merging the PR branch into the base
      # branch).  git log -1 therefore returns a SHA that does NOT exist in
      # the PR branch history.  This step surfaces the discrepancy so that
      # any unexpected mypy count change can be traced back to the merge
      # commit rather than confusing it with a real regression.
      - name: 🔍 SHA drift diagnostic
        run: |
          echo "### SHA Drift Diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | SHA |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`github.sha\` (trigger) | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`git log -1\` (checked out) | \`$(git log -1 --format=%H)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          TRIGGER="${{ github.sha }}"
          CHECKEDOUT="$(git log -1 --format=%H)"
          if [ "$TRIGGER" != "$CHECKEDOUT" ]; then
            echo "⚠️  **SHA drift detected** — CI is running on a GitHub merge-preview" >> "$GITHUB_STEP_SUMMARY"
            echo "commit (\`${CHECKEDOUT:0:12}\`), not the PR branch HEAD (\`${TRIGGER:0:12}\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "mypy error counts may differ from local runs on the PR branch." >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "⚠️  SHA drift: trigger=$TRIGGER checkedout=$CHECKEDOUT"
            echo "   (CI is on merge-preview commit — mypy count may differ from local run)"
          else
            echo "✅  No SHA drift: trigger and checked-out SHA match."
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # NOTE: no cache: pip here — intentional.  The mypy gate must run in a
          # clean, reproducible environment so the error count is stable across
          # runners.  Any cached site-packages from other jobs (torch, pydantic,
          # etc.) cause phantom type errors that inflate the count by ~160,
          # making the baseline gate unreliable.  We use an explicit venv below.

      - name: Install mypy and stubs in isolated venv
        run: |
          python -m venv /tmp/mypy-venv --clear
          /tmp/mypy-venv/bin/pip install --quiet "mypy>=1.8.0" types-PyYAML types-requests

      - name: Run mypy baseline gate
        id: mypy_gate
        run: |
          /tmp/mypy-venv/bin/python scripts/ci/mypy_baseline.py --require-baseline 2>&1 | tee /tmp/mypy_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post mypy summary
        if: always()
        run: |
          {
            echo "## 🔎 mypy Anti-Regression Gate"
            echo ""
            if [ -f /tmp/mypy_output.txt ]; then
              echo '```'
              cat /tmp/mypy_output.txt
              echo '```'
            fi
            BASELINE=$(cat .mypy_baseline 2>/dev/null || echo "unknown")
            echo ""
            echo "**Baseline:** \`${BASELINE}\` errors (stored in \`.mypy_baseline\`)"
            echo ""
            echo "_To lower the baseline after fixing errors: \`python scripts/ci/mypy_baseline.py --update\`_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if regression detected
        if: steps.mypy_gate.outputs.exit_code != '0'
        run: |
          echo "::error::mypy type-error count exceeds baseline. See summary for details."
          exit 1

  # ── rescue comment — posted on PR whenever mypy baseline regression fails ─
  rescue-comment:
    name: Post rescue comment on mypy failure
    runs-on: ubuntu-latest
    needs: mypy-baseline
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "mypy Baseline Gate"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Run locally: `python scripts/ci/mypy_baseline.py` — check if type-error count exceeds baseline\n4. Fix any new type errors introduced by this PR\n5. If intentional: run `python scripts/ci/mypy_baseline.py --update` to raise the baseline\n6. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n\n_Posted by: mypy-baseline.yml → rescue-comment job (S217)_

---
_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
