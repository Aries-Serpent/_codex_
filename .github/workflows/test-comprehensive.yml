name: Comprehensive Tests with Caching

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      # Multi-tier caching strategy for optimal performance
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/sentence_transformers
          key: ${{ runner.os }}-models-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-models-
      
      - name: Cache pytest
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pytest-
      
      - name: Free disk space
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune --all --force --volumes || true
          sudo apt-get clean
          echo "=== Disk space AFTER cleanup ==="
          df -h
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test]" || pip install -e .
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-retry
      
      - name: Install optional RAG dependencies
        continue-on-error: true
        run: |
          pip install sentence-transformers faiss-cpu scikit-learn
      
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --timeout=300 \
            --timeout-method=thread \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -v \
            --tb=short \
            -n auto \
            --dist=loadfile \
            --maxfail=5 \
            --reruns=2 \
            --reruns-delay=1
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          CODEX_FORCE_CPU: "1"
          RAG_EMBEDDING_PROVIDER: tfidf
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          name: coverage-${{ matrix.python-version }}
          fail_ci_if_error: false
      
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14
      
      - name: Security scan with bandit
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt -o bandit-report.txt || true
          cat bandit-report.txt || echo "No security issues found"
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-${{ matrix.python-version }}
          path: bandit-report.*
          retention-days: 14
      
      - name: Check disk space after run
        if: always()
        run: |
          echo "=== Final disk space ==="
          df -h
          echo "=== Cache sizes ==="
          du -sh ~/.cache/pip || echo "No pip cache"
          du -sh ~/.cache/huggingface || echo "No HuggingFace cache"
  
  # Summary job to enforce requirements
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ Tests failed"
            exit 1
          elif [[ "${{ needs.test.result }}" == "cancelled" ]]; then
            echo "⚠️ Tests cancelled"
            exit 1
          else
            echo "✅ All tests passed"
          fi
      
      - name: Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Matrix: Python 3.9, 3.10, 3.11, 3.12" >> $GITHUB_STEP_SUMMARY
          echo "- Caching: pip + models + pytest" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: Uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
