name: "📦 Dependabot Auto-Absorb"

# Automatically cherry-picks single-file Dependabot bump PRs into the
# currently active Copilot coding-agent branch, eliminating the need for
# a separate session just to absorb trivial version bumps (e.g. Dockerfile
# base-image upgrades, single-action pin updates).
#
# Trigger:  pull_request event from dependabot[bot] with exactly 1 changed file
# Safety:   Dry-run mode can be activated via the workflow_dispatch input.
#
# Policy: .codex/CODEBASE_AGENCY_POLICY.md §2 (absorb ALL codebase issues)

on:
  pull_request:
    types: [opened, synchronize, reopened]

  # Allow manual triggering for testing / replaying missed events.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot PR number to absorb"
        required: true
        type: string
      target_branch:
        description: "Branch to cherry-pick into (default: current default branch)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run (no commit)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: dependabot-auto-absorb-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  absorb:
    name: "📦 Cherry-pick single-file Dependabot bump"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only run for Dependabot PRs (pull_request trigger) or manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.actor == 'dependabot[bot]'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can cherry-pick cleanly.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # Always check out the PR base (main) initially; the chain-routing
          # step below will switch to the correct staging branch before the
          # cherry-pick so commits never land directly on main when a deeper
          # staging layer is active.
          ref: ${{ inputs.target_branch || github.base_ref }}

      - name: "🔀 Resolve push target (chain: sub-PR → 0D_base_ → main)"
        id: resolve-target
        # Only resolve when no explicit target was given; explicit inputs are honoured as-is.
        if: ${{ inputs.target_branch == '' }}
        uses: ./.github/actions/resolve-push-target

      - name: "🔍 Verify single-file change"
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'workflow_dispatch') {
              prNumber = parseInt(core.getInput('pr_number') || '${{ inputs.pr_number }}');
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 10,
            });

            core.setOutput('pr_number', prNumber);
            core.setOutput('file_count', files.length);
            core.setOutput('is_single_file', files.length === 1 ? 'true' : 'false');
            core.setOutput('changed_file', files.length === 1 ? files[0].filename : '');

            if (files.length === 1) {
              console.log(`✅ Single-file bump detected: ${files[0].filename}`);
            } else {
              console.log(`ℹ️  ${files.length} files changed — skipping auto-absorb (not a single-file bump)`);
            }

            // Fetch head SHA for the PR
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr_title', pr.title);

      - name: "🍒 Cherry-pick into active branch"
        if: steps.check.outputs.is_single_file == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          HEAD_SHA: ${{ steps.check.outputs.head_sha }}
          CHANGED_FILE: ${{ steps.check.outputs.changed_file }}
          PR_NUMBER: ${{ steps.check.outputs.pr_number }}
          PR_TITLE: ${{ steps.check.outputs.pr_title }}
          # Chain routing: explicit input → resolved chain tip → PR base branch.
          # The composite action walks: latest sub-PR → 0D_base_ → main.
          TARGET_BRANCH: ${{ inputs.target_branch || steps.resolve-target.outputs.branch || github.base_ref }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch the working tree to the chain-resolved target BEFORE cherry-picking
          # so the commit lands on the correct staging branch, not on main.
          # The initial checkout used fetch-depth=0 so HEAD_SHA is already present.
          git fetch origin "${TARGET_BRANCH}" --depth=1
          git checkout -B _dep_absorb_ origin/"${TARGET_BRANCH}"
          # Ensure the source commit is reachable after the branch switch.
          git fetch origin "${HEAD_SHA}" 2>/dev/null || true

          echo "Cherry-picking ${HEAD_SHA} (${CHANGED_FILE}) from PR #${PR_NUMBER} into ${TARGET_BRANCH}…"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "🔍 DRY RUN — would cherry-pick ${HEAD_SHA}"
            git cherry-pick --no-commit "${HEAD_SHA}" || true
            echo "Diff preview:"
            git diff --cached --stat || true
            git cherry-pick --abort 2>/dev/null || true
            echo "✅ Dry run complete — no commit made."
            exit 0
          fi

          # Attempt cherry-pick; abort cleanly on conflict.
          if git cherry-pick "${HEAD_SHA}"; then
            echo "✅ Cherry-pick succeeded: ${CHANGED_FILE}"
            # Push the cherry-picked commit back to the target branch.
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          else
            echo "⚠️  Cherry-pick conflict — aborting auto-absorb for PR #${PR_NUMBER}"
            git cherry-pick --abort
            exit 0  # Non-fatal: let the human merge manually.
          fi

      - name: "📝 Annotate job summary"
        if: always()
        env:
          IS_SINGLE: ${{ steps.check.outputs.is_single_file }}
          CHANGED_FILE: ${{ steps.check.outputs.changed_file }}
          PR_NUMBER: ${{ steps.check.outputs.pr_number }}
          PR_TITLE: ${{ steps.check.outputs.pr_title }}
        run: |
          {
            echo "## 📦 Dependabot Auto-Absorb"
            echo ""
            if [ "${IS_SINGLE}" = "true" ]; then
              echo "✅ **Absorbed:** \`${CHANGED_FILE}\` from [PR #${PR_NUMBER}](https://github.com/${{ github.repository }}/pull/${PR_NUMBER})"
              echo ""
              echo "> ${PR_TITLE}"
            else
              echo "ℹ️  **Skipped:** PR #${PR_NUMBER} has ${{ steps.check.outputs.file_count }} changed files (not a single-file bump)."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: absorb
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Dependabot Auto-Absorb"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"******","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: dependabot-auto-absorb.yml → rescue-comment job (S227)_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
