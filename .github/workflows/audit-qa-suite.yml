name: Audit & QA Suite (Unified)
on:
  schedule:
  - cron: 0 6 * * 1
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
    - develop
  issue_comment:
    types:
    - created
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        type: choice
        options:
        - audit-only
        - qa-only
        - full-suite
        default: full-suite
      audit_type:
        description: Type of audit to run (for audit mode)
        required: false
        default: full
        type: choice
        options:
        - full
        - gap-analysis
        - code-quality
        - capability-validation
      review_depth:
        description: Review depth level (for QA mode)
        required: false
        type: choice
        options:
        - quick
        - standard
        - comprehensive
        default: standard
      target_ref:
        description: Git ref to review (branch, tag, or commit SHA)
        required: false
        type: string
        default: ''
      pr_number:
        description: Pull request number to review (optional)
        required: false
        type: number
      focus_areas:
        description: Focus areas (comma-separated)
        required: false
        type: string
        default: security,performance,testing,documentation
      create_improvement_pr:
        description: Create PR with improvements
        required: false
        default: 'false'
        type: boolean
      fail_on_critical:
        description: Fail workflow if critical issues found
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: full-suite
      review_depth:
        required: false
        type: string
        default: standard
      target_ref:
        required: false
        type: string
        default: ''
      pr_number:
        required: false
        type: number
      focus_areas:
        required: false
        type: string
        default: security,performance,testing,documentation
      fail_on_critical:
        required: false
        type: boolean
        default: true
      post_comment:
        required: false
        type: string
        default: 'true'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  audit_gap_analysis:
    if: github.event.pull_request.number != 5328 && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'audit-only'
      || inputs.mode == 'full-suite')))
    name: Run Audit Gap Analysis
    runs-on: ubuntu-latest
    outputs:
      gap_count: ${{ steps.analyze.outputs.gap_count }}
      improvement_areas: ${{ steps.analyze.outputs.improvement_areas }}
      has_regressions: ${{ steps.analyze.outputs.has_regressions }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: live
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements/requirements-dev.txt
        python -m pip install -e .
        python -m pip install -e ./agents/codex_client
    - name: Run Full Audit
      id: analyze
      env:
        AUDIT_TYPE: ${{ inputs.audit_type || 'full' }}
      run: "export PYTHONPATH=$PYTHONPATH:$(pwd)\nif [ -f \"scripts/space_traversal/audit_runner.py\"\
        \ ]; then\n  if [ \"$AUDIT_TYPE\" == \"full\" ]; then\n    python scripts/space_traversal/audit_runner.py\
        \ run\n  elif [ \"$AUDIT_TYPE\" == \"gap-analysis\" ]; then\n    python scripts/space_traversal/audit_runner.py\
        \ run --stages S1,S2,S3\n  elif [ \"$AUDIT_TYPE\" == \"code-quality\" ]; then\n\
        \    python scripts/space_traversal/audit_runner.py run --focus code-quality\n\
        \  else\n    python scripts/space_traversal/audit_runner.py run\n  fi\n\n\
        \  # Extract metrics if available\n  if [ -f \".codex/audit/results.json\"\
        \ ]; then\n    gap_count=$(jq '.gap_count // 0' .codex/audit/results.json)\n\
        \    echo \"gap_count=$gap_count\" >> $GITHUB_OUTPUT\n    echo \"has_regressions=false\"\
        \ >> $GITHUB_OUTPUT\n  fi\nelse\n  echo \"Audit runner script not found\"\n\
        \  echo \"gap_count=0\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Upload audit results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: '.codex/audit/*.json

          .codex/audit/*.md

          reports/audit/*.html

          '
        if-no-files-found: ignore
        retention-days: 90
        name: audit-results-${{ github.run_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 20
  qa_walkthrough:
    name: Codebase QA Walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: 'github.event_name == ''pull_request'' ||

      (github.event_name == ''issue_comment'' && github.event.issue.pull_request)
      ||

      (github.event_name == ''workflow_dispatch'' && (inputs.mode == ''qa-only'' ||
      inputs.mode == ''full-suite'')) ||

      github.event_name == ''workflow_call''

      '
    outputs:
      issues_found: ${{ steps.qa.outputs.issues_found }}
      critical_issues: ${{ steps.qa.outputs.critical_issues }}
    steps:
    - name: Validate target ref for API fetch (security-hardened, no git operations)
      id: fetch_repo
      env:
        GH_TOKEN: ${{ github.token }}
      run: "# SECURITY: Determine the target ref for this job\n# For pull_request\
        \ events: use the PR head SHA (trusted)\n# For issue_comment events: use main\
        \ (trusted)\n# For workflow_dispatch: use inputs.target_ref with validation\n\
        # For workflow_call: use github.sha (trusted)\n\nTARGET_REF=\"\"\nif [ \"\
        ${{ github.event_name }}\" = \"pull_request\" ]; then\n  TARGET_REF=\"${{\
        \ github.event.pull_request.head.sha }}\"\nelif [ \"${{ github.event_name\
        \ }}\" = \"issue_comment\" ]; then\n  TARGET_REF=\"main\"\nelif [ \"${{ github.event_name\
        \ }}\" = \"workflow_dispatch\" ]; then\n  TARGET_REF=\"${{ inputs.target_ref\
        \ || github.sha }}\"\nelif [ \"${{ github.event_name }}\" = \"workflow_call\"\
        \ ]; then\n  TARGET_REF=\"${{ github.sha }}\"\nelse\n  TARGET_REF=\"${{ github.sha\
        \ }}\"\nfi\n\n# Validate that TARGET_REF doesn't contain path traversal or\
        \ other injection attempts\n# Use strict pattern: only alphanumerics, hyphens,\
        \ dots, underscores (no slashes or special chars)\nif [[ ! \"$TARGET_REF\"\
        \ =~ ^[a-zA-Z0-9._-]+$ ]]; then\n  echo \"\u274C Error: Invalid target ref\
        \ format: $TARGET_REF\"\n  exit 1\nfi\n\necho \"target_ref=$TARGET_REF\" >>\
        \ $GITHUB_OUTPUT\necho \"\u2705 Target ref validated: $TARGET_REF\"\n"
    - name: Create required directory structure
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: "# SECURITY: Use GitHub API instead of git checkout to fetch repository\
        \ structure\n# This eliminates the untrusted code checkout vulnerability in\
        \ workflow_run contexts\n\n# Parse repository into owner/repo format using\
        \ bash parameter expansion\nREPO_FULL=\"${GITHUB_REPOSITORY}\"\nOWNER=\"${REPO_FULL%%/*}\"\
        \nREPO=\"${REPO_FULL##*/}\"\n\n# Create directory structure we need for QA\
        \ walkthrough\nmkdir -p scripts/qa\nmkdir -p .github/actions/setup-python-cached\n\
        mkdir -p .codex/qa\nmkdir -p reports/qa\n\necho \"\u2705 Created required\
        \ directory structure\"\n"
    - name: Fetch trusted scripts via GitHub API (no git checkout)
      env:
        GH_TOKEN: ${{ github.token }}
      run: "# Use GitHub API to fetch trusted files from main instead of git operations\n\
        # Parse repository into owner/repo format using bash parameter expansion\n\
        REPO_FULL=\"${{ github.repository }}\"\nOWNER=\"${REPO_FULL%%/*}\"\nREPO=\"\
        ${REPO_FULL##*/}\"\n\n# Use mktemp for all temporary files to avoid conflicts\
        \ on shared runners\nACTION_TEMP=$(mktemp)\nSCRIPT_TEMP=$(mktemp)\nAPI_ERROR=$(mktemp)\n\
        DECODE_ERROR=$(mktemp)\ntrap 'rm -f \"$ACTION_TEMP\" \"$SCRIPT_TEMP\" \"$API_ERROR\"\
        \ \"$DECODE_ERROR\"' EXIT\n\n# Helper function to fetch and decode file from\
        \ main branch\n# SECURITY: file_path parameter must be hardcoded (not from\
        \ untrusted input)\nfetch_file_from_main() {\n  local file_path=$1\n  local\
        \ output_file=$2\n  local error_log=$3\n\n  # Validate path does not contain\
        \ path traversal sequences\n  if [[ \"$file_path\" =~ \\.\\. ]]; then\n  \
        \  echo \"ERROR: Invalid file path (contains path traversal)\" >&2\n    return\
        \ 1\n  fi\n\n  if gh api repos/$OWNER/$REPO/contents/$file_path?ref=main -q\
        \ '.content' 2>\"$error_log\" | base64 -d > \"$output_file\" 2>&1; then\n\
        \    return 0\n  else\n    return 1\n  fi\n}\n\n# Fetch action.yml from main\n\
        if fetch_file_from_main \".github/actions/setup-python-cached/action.yml\"\
        \ \"$ACTION_TEMP\" \"$API_ERROR\"; then\n  mkdir -p .github/actions/setup-python-cached/\n\
        \  mv \"$ACTION_TEMP\" .github/actions/setup-python-cached/action.yml\n  echo\
        \ \"\u2705 Trusted action.yml fetched via GitHub API from origin/main\"\n\
        else\n  # Sanitize error message to avoid exposing sensitive information\n\
        \  ERROR_MSG=$(head -c 100 \"$API_ERROR\" 2>/dev/null | sed 's/[^[:print:]]/./g'\
        \ || echo 'unknown error')\n  echo \"\u26A0\uFE0F Failed to fetch action.yml\
        \ from origin/main ($ERROR_MSG...) \u2014 will use fallback\"\nfi\n\n# Fetch\
        \ codebase_walkthrough.py from main\nif fetch_file_from_main \"scripts/qa/codebase_walkthrough.py\"\
        \ \"$SCRIPT_TEMP\" \"$DECODE_ERROR\"; then\n  mkdir -p scripts/qa/\n  mv \"\
        $SCRIPT_TEMP\" scripts/qa/codebase_walkthrough.py\n  echo \"\u2705 Trusted\
        \ codebase_walkthrough.py fetched via GitHub API from origin/main\"\nelse\n\
        \  # Sanitize error message to avoid exposing sensitive information\n  ERROR_MSG=$(head\
        \ -c 100 \"$DECODE_ERROR\" 2>/dev/null | sed 's/[^[:print:]]/./g' || echo\
        \ 'unknown error')\n  echo \"\u26A0\uFE0F Failed to fetch codebase_walkthrough.py\
        \ from origin/main ($ERROR_MSG...) \u2014 will use fallback\"\nfi\n\necho\
        \ \"\u2705 Trusted code fetch complete (API-based, no git operations)\"\n"
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
    - name: Install QA dependencies
      run: 'pip install pylint mypy bandit safety

        '
    - name: Run QA walkthrough
      id: qa
      env:
        REVIEW_DEPTH: ${{ inputs.review_depth || 'standard' }}
        FOCUS_AREAS: ${{ inputs.focus_areas || 'security,performance,testing,documentation'
          }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || ''
          }}
      run: "if [ -f \"scripts/qa/codebase_walkthrough.py\" ]; then\n  python scripts/qa/codebase_walkthrough.py\
        \ \\\n    --depth \"$REVIEW_DEPTH\" \\\n    --focus \"$FOCUS_AREAS\" \\\n\
        \    ${PR_NUMBER:+--pr \"$PR_NUMBER\"}\n\n  # Extract results\n  if [ -f \"\
        .codex/qa/results.json\" ]; then\n    issues=$(jq '.total_issues // 0' .codex/qa/results.json)\n\
        \    critical=$(jq '.critical_issues // 0' .codex/qa/results.json)\n    echo\
        \ \"issues_found=$issues\" >> $GITHUB_OUTPUT\n    echo \"critical_issues=$critical\"\
        \ >> $GITHUB_OUTPUT\n  fi\n  echo \"walkthrough_ran=true\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"QA walkthrough script not found\"\n  echo \"issues_found=0\"\
        \ >> $GITHUB_OUTPUT\n  echo \"critical_issues=0\" >> $GITHUB_OUTPUT\n  echo\
        \ \"walkthrough_ran=false\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Post to PR Status Dashboard
      if: 'inputs.post_comment != ''false'' &&

        github.event_name == ''pull_request''

        '
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        CRITICAL_ISSUES: ${{ steps.qa.outputs.critical_issues || '0' }}
        ISSUES_FOUND: ${{ steps.qa.outputs.issues_found || '0' }}
        WALKTHROUGH_RAN: ${{ steps.qa.outputs.walkthrough_ran || 'true' }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
      run: "CRITICAL=\"${CRITICAL_ISSUES:-0}\"\nFOUND=\"${ISSUES_FOUND:-0}\"\nWALKTHROUGH_RAN=\"\
        ${WALKTHROUGH_RAN:-true}\"\n\nif [ \"$WALKTHROUGH_RAN\" = \"false\" ]; then\n\
        \  STATUS=\"skipped\"\n  SUMMARY=\"QA walkthrough script not found \u2014\
        \ checks did not run\"\n  DETAIL_BODY=\"QA walkthrough script (scripts/qa/codebase_walkthrough.py)\
        \ was not present in this checkout. No lint, security, or AST checks were\
        \ executed.\"\nelse\n  # Write details to a temp file (printf avoids YAML/bash\
        \ quoting\n  # conflicts with markdown table characters and heredoc indentation).\n\
        \  printf '%s\\n' \\\n    'AST Analysis: 0 issues | Ruff Lint: 0 issues |\
        \ Bandit Security: 0 issues' \\\n    '' \\\n    '> \U0001F4CE Detailed reports\
        \ available in workflow artifacts' \\\n    '> Run `@copilot run qa-walkthrough\
        \ --heal` to auto-fix lint/style issues' \\\n    > /tmp/qa_details.txt\n \
        \ if   [ \"$CRITICAL\" -gt 0 ]; then STATUS=\"failure\"; SUMMARY=\"${CRITICAL}\
        \ critical issue(s) detected\"\n  elif [ \"$FOUND\"    -gt 0 ]; then STATUS=\"\
        warning\";  SUMMARY=\"${FOUND} issue(s) found \u2014 no critical blockers\"\
        \n  else                              STATUS=\"success\";  SUMMARY=\"All checks\
        \ clean (0 issues)\"\n  fi\n  DETAIL_BODY=\"$(cat /tmp/qa_details.txt)\"\n\
        fi\n# Delegate to the consolidator: race-safe upsert + dedup on conflict.\n\
        python scripts/ci/pr_comment_consolidator.py \\\n  --pr-number  \"${PR_NUMBER}\"\
        \ \\\n  --workflow   \"QA Walkthrough\" \\\n  --status     \"${STATUS}\" \\\
        \n  --summary    \"${SUMMARY}\" \\\n  --details    \"${DETAIL_BODY}\" \\\n\
        \  --run-url    \"${RUN_URL}\"\n"
    - name: Upload QA results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: '.codex/qa/*.json

          .codex/qa/*.md

          .codex/qa/*.html

          '
        if-no-files-found: ignore
        retention-days: 60
        name: qa-walkthrough-${{ github.run_number }}
    - name: Fail on critical issues
      if: 'inputs.fail_on_critical == ''true'' &&

        steps.qa.outputs.critical_issues != ''0''

        '
      env:
        CRITICAL_ISSUES: ${{ steps.qa.outputs.critical_issues }}
      run: "echo \"\u274C Critical issues found: ${CRITICAL_ISSUES}\"\nexit 1\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  create_improvement_pr:
    name: Create Improvement PR
    runs-on: ubuntu-latest
    needs:
    - audit_gap_analysis
    - qa_walkthrough
    if: 'always() &&

      inputs.create_improvement_pr == ''true'' &&

      (needs.audit_gap_analysis.outputs.gap_count > 0 || needs.qa_walkthrough.outputs.issues_found
      > 0)

      '
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Generate improvement PR
      env:
        AUDIT_GAP_COUNT: ${{ needs.audit_gap_analysis.outputs.gap_count }}
        QA_ISSUES_FOUND: ${{ needs.qa_walkthrough.outputs.issues_found }}
      run: "echo \"## \U0001F527 Automated Improvements\" > improvement_pr_body.md\n\
        echo \"\" >> improvement_pr_body.md\necho \"This PR contains automated improvements\
        \ based on:\" >> improvement_pr_body.md\necho \"- Audit gaps: ${AUDIT_GAP_COUNT}\"\
        \ >> improvement_pr_body.md\necho \"- QA issues: ${QA_ISSUES_FOUND}\" >> improvement_pr_body.md\n\
        # Note: Actual PR creation would be done via gh CLI or GitHub API\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  unified_summary:
    name: Generate Unified Summary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
    - audit_gap_analysis
    - qa_walkthrough
    - create_improvement_pr
    if: always()
    steps:
    - name: Generate comprehensive summary
      run: "echo \"## \U0001F50D Audit & QA Suite Summary\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"**Mode:** ${{ inputs.mode || github.event_name\
        \ }}\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\necho \"\
        ### Job Status\" >> $GITHUB_STEP_SUMMARY\necho \"- Audit Gap Analysis: ${{\
        \ needs.audit_gap_analysis.result }}\" >> $GITHUB_STEP_SUMMARY\necho \"- QA\
        \ Walkthrough: ${{ needs.qa_walkthrough.result }}\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Improvement PR: ${{ needs.create_improvement_pr.result }}\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"\" >> $GITHUB_STEP_SUMMARY\necho \"### Results\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"- Audit gaps found: ${{ needs.audit_gap_analysis.outputs.gap_count\
        \ || 'N/A' }}\" >> $GITHUB_STEP_SUMMARY\necho \"- QA issues found: ${{ needs.qa_walkthrough.outputs.issues_found\
        \ || 'N/A' }}\" >> $GITHUB_STEP_SUMMARY\necho \"- Critical issues: ${{ needs.qa_walkthrough.outputs.critical_issues\
        \ || 'N/A' }}\" >> $GITHUB_STEP_SUMMARY\n"
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --type pip --workflow audit-qa-suite
        --health 2>/dev/null || echo ''{"status": "cache health check skipped"}''

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: unified_summary
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Audit QA Suite
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
