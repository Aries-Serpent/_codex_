name: Rust-Python Hybrid Swarm CI/CD
on:
  push:
    branches:
    - main
    - develop
    - copilot/**
    paths-ignore:
    - docs/**
    - '**.md'
    - .codex/notes/**
    - .codex/sessions/**
    - .github/copilot-prompts/**
  pull_request:
    branches:
    - main
    paths-ignore:
    - docs/**
    - '**.md'
    - .codex/notes/**
    - .codex/sessions/**
    - .github/copilot-prompts/**
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  cost-gate:
    name: "\U0001F4B0 Cost Gate"
    uses: ./.github/workflows/cost-gate.yml
    with:
      workflow_name: Rust Swarm CI
      runner: ubuntu-latest
      timeout_minutes: 60
      matrix_count: 3
      pushes_to_ghcr: false
  rust_tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    needs: cost-gate
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
