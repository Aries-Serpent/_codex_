name: Rust-Python Hybrid Swarm CI/CD
'on':
  push:
    branches:
    - main
    - develop
    - copilot/**
    paths-ignore:
    - docs/**
    - '**.md'
    - .codex/**
    - .github/copilot-prompts/**
  pull_request:
    branches:
    - main
    paths-ignore:
    - docs/**
    - '**.md'
    - .codex/**
    - .github/copilot-prompts/**
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  cost-gate:
    name: "\U0001F4B0 Cost Gate"
    uses: ./.github/workflows/cost-gate.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      workflow_name: Rust Swarm CI
      runner: ubuntu-latest
      timeout_minutes: 60
      matrix_count: 3
      pushes_to_ghcr: false
  rust_tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    needs: cost-gate
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
    - name: Free disk space
      run: |
        echo "=== Before cleanup ==="
        df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo docker rmi $(docker images -q) || true
        echo "=== After cleanup ==="
        df -h
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    - name: Validate Cargo.toml features
      run: python scripts/ci/validate_cargo_features.py
    - name: Run cargo fmt
      run: cargo fmt --all -- --check
    - name: Run cargo clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: Run unit tests
      run: cargo test --lib --release --locked --verbose
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rust-test-results
        path: target/release/deps/*.log
  rust_benchmarks:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    needs: rust_tests
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
    - name: Run benchmarks
      timeout-minutes: 12
      run: |
        timeout 10m cargo bench --bench swarm_benchmarks -- \
          --sample-size 10 \
          --measurement-time 5 \
          --warm-up-time 1

        estimate_count="$(find target/criterion -type f -name estimates.json | wc -l)"
        if [ "${estimate_count}" -eq 0 ]; then
          echo "❌ Criterion produced no benchmark estimates"
          exit 1
        fi
        echo "✅ Criterion produced ${estimate_count} benchmark estimate files"
    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: target/criterion/
        if-no-files-found: error
  code_coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    needs: rust_tests
    steps:
    - name: Free disk space
      run: |
        echo "=== Before cleanup ==="
        df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo docker rmi $(docker images -q) || true
        echo "=== After cleanup ==="
        df -h
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
    - name: Install tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Generate coverage
      run: |
        mkdir -p coverage
        cargo tarpaulin --out Lcov --out Xml --output-dir coverage --release --timeout 600

        # Verify coverage files were created
        if [ -f coverage/lcov.info ]; then
          echo "✅ Coverage generated: lcov.info"
          ls -lh coverage/lcov.info
        else
          echo "⚠️ Warning: lcov.info not generated"
        fi

        if [ -f coverage/cobertura.xml ]; then
          echo "✅ Coverage generated: cobertura.xml"
          ls -lh coverage/cobertura.xml
        else
          echo "⚠️ Warning: cobertura.xml not generated"
        fi
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        fail_ci_if_error: false
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/
        if-no-files-found: warn
  python_integration:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    needs: rust_tests
    steps:
    - name: Free disk space
      run: |
        echo "=== Before cleanup ==="
        df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
        sudo docker rmi $(docker images -q) || true
        echo "=== After cleanup ==="
        df -h
    - uses: actions/checkout@v7
    - name: Set up Python 3.12 with tiered cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
    - name: Install maturin and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pytest pytest-cov setuptools wheel virtualenv
    - name: Build Python extension with maturin
      run: |
        maturin build --release --features extension-module
        pip install target/wheels/*.whl
        python -c "import codex_swarm; print('✅ codex_swarm extension imported successfully')"
    - name: Run integration tests
      run: python -m pytest tests/rust_integration/ -v --junitxml=test-results/rust-integration.xml
    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-results
        path: test-results/rust-integration.xml
        if-no-files-found: error
  performance_regression:
    name: Benchmark Result Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 30
    needs:
    - rust_benchmarks
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download benchmark results
      uses: actions/download-artifact@v8
      with:
        name: benchmark-results
        path: target/criterion
    - name: Verify benchmark results exist
      run: |
        estimate_count="$(find target/criterion -type f -name estimates.json | wc -l)"
        if [ "${estimate_count}" -eq 0 ]; then
          echo "❌ Downloaded artifact contains no Criterion estimates"
          exit 1
        fi
        echo "✅ Validating ${estimate_count} Criterion estimate files"
        python -c "import json, pathlib; files=list(pathlib.Path('target/criterion').rglob('estimates.json')); invalid=[str(path) for path in files if json.loads(path.read_text())['mean']['point_estimate'] <= 0]; assert files and not invalid, f'invalid benchmark estimates: {invalid}'"
        mkdir -p coverage
        printf 'Benchmark Validation Report\n=================================\n\nStatus: PASS\nValidated estimate files: %s\n' \
          "${estimate_count}" > coverage/benchmark_validation_report.txt
    - name: Comment on PR
      if: ${{ github.event_name == 'pull_request' && hashFiles('coverage/benchmark_validation_report.txt')
        != '' }}
      uses: actions/github-script@v9
      with:
        script: "const fs = require('fs');\nconst results = fs.readFileSync('coverage/benchmark_validation_report.txt',\
          \ 'utf8');\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: `## \U0001F4CA\
          \ Benchmark Results\\n\\n\\`\\`\\`\\n${results}\\n\\`\\`\\``\n});\n"
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
    - name: Run cargo audit
      uses: rustsec/audit-check@69366f00c59eabb3c207528bdd9e103ccbdf1e3c
      with:
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    - name: Run cargo deny (if available)
      run: |
        if ! command -v cargo-deny &> /dev/null; then
          cargo install cargo-deny --locked
        fi
        cargo deny check advisories
  documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
    - name: Build Rust docs
      run: |
        cargo doc --no-deps --document-private-items --all-features
    - name: Upload documentation
      uses: actions/upload-artifact@v7
      with:
        name: rust-documentation
        path: target/doc/
  release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    needs:
    - rust_tests
    - python_integration
    - code_coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python-version:
        - '3.12'
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ matrix.python-version }}
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
    - name: Install maturin
      run: pip install maturin
    - name: Build wheel
      run: maturin build --release
    - name: Upload wheel
      uses: actions/upload-artifact@v7
      with:
        name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
        path: target/wheels/*.whl
  status_check:
    name: Overall Status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    needs:
    - rust_tests
    - rust_benchmarks
    - performance_regression
    - code_coverage
    - python_integration
    - security_audit
    if: always()
    steps:
    - name: Checkout for cache health
      uses: actions/checkout@v7
      with:
        sparse-checkout: scripts/ci
    - name: Cache health report
      continue-on-error: true
      run: |
        pip install -q pip 2>/dev/null
        python scripts/ci/generate_cache_keys.py --type cargo --workflow rust_swarm_ci --health 2>/dev/null || echo '{"status": "cache health check skipped"}'
    - name: Check all jobs
      env:
        RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
        RUST_BENCHMARKS_RESULT: ${{ needs.rust_benchmarks.result }}
        BENCHMARK_VALIDATION_RESULT: ${{ needs.performance_regression.result }}
        CODE_COVERAGE_RESULT: ${{ needs.code_coverage.result }}
        PYTHON_INTEGRATION_RESULT: ${{ needs.python_integration.result }}
        SECURITY_AUDIT_RESULT: ${{ needs.security_audit.result }}
      run: |
        echo "All required jobs completed"
        if [[ "${RUST_TESTS_RESULT}" != "success" ]]; then
          echo "❌ Rust tests failed"
          exit 1
        fi
        if [[ "${RUST_BENCHMARKS_RESULT}" != "success" ]]; then
          echo "❌ Rust benchmarks failed"
          exit 1
        fi
        if [[ "${BENCHMARK_VALIDATION_RESULT}" != "success" ]]; then
          echo "❌ Benchmark result validation failed"
          exit 1
        fi
        if [[ "${PYTHON_INTEGRATION_RESULT}" != "success" ]]; then
          echo "❌ Python integration tests failed"
          exit 1
        fi
        if [[ "${CODE_COVERAGE_RESULT}" != "success" ]]; then
          echo "❌ Coverage check failed"
          exit 1
        fi
        if [[ "${SECURITY_AUDIT_RESULT}" != "success" ]]; then
          echo "❌ Security audit failed"
          exit 1
        fi
        echo "✅ All checks passed"
