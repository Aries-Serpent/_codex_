name: Rust-Python Hybrid Swarm CI/CD

on:
  push:
    branches: [main, develop, 'copilot/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.codex/notes/**'
      - '.codex/sessions/**'
      - '.github/copilot-prompts/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.codex/notes/**'
      - '.codex/sessions/**'
      - '.github/copilot-prompts/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Enforce deterministic test execution
  RUST_TEST_THREADS: "1"


permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # ── 💰 Cost Gate ─────────────────────────────────────────────────────────────
  # RED tier: multiple jobs × 60 min = 180+ effective minutes
  cost-gate:
    name: "💰 Cost Gate"
    uses: ./.github/workflows/cost-gate.yml
    with:
      workflow_name: "Rust Swarm CI"
      runner: "ubuntu-latest"
      timeout_minutes: 60
      matrix_count: 3
      pushes_to_ghcr: false
    permissions:
      contents: read
      pull-requests: write

  rust_tests:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: cost-gate

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker rmi $(docker images -q) || true
          echo "=== After cleanup ==="
          df -h

      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate Cargo.toml features
        run: python scripts/ci/validate_cargo_features.py

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --lib --release --locked --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rust-test-results
          path: target/release/deps/*.log

  rust_benchmarks:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: rust_tests

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6

      - name: Run benchmarks
        timeout-minutes: 12
        continue-on-error: true
        run: |
          # Run benchmarks with timeout to prevent hanging
          # Reduced sample size and measurement time for faster CI execution
          timeout 10m cargo bench --bench swarm_benchmarks -- \
            --sample-size 10 \
            --measurement-time 5 \
            --warm-up-time 1 \
            || echo "⚠️ Benchmarks timed out or failed - not blocking CI"

          # Verify Criterion results exist
          if [ -d "target/criterion" ]; then
            echo "✅ Criterion results generated"
            find target/criterion -name "*.json" | head -5
          else
            echo "⚠️ Warning: No Criterion results found in target/criterion"
            mkdir -p target/criterion
          fi

          # Generate benchmark summary report
          echo "# Rust Swarm Benchmark Results" > benchmark_results.txt
          echo "" >> benchmark_results.txt
          echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> benchmark_results.txt
          echo "Commit: ${GITHUB_SHA:0:8}" >> benchmark_results.txt
          echo "" >> benchmark_results.txt

          if [ -d "target/criterion" ] && [ "$(find target/criterion -name '*.json' -print0 | grep -zc .)" -gt 0 ]; then
            echo "## Benchmark Summary" >> benchmark_results.txt
            echo "" >> benchmark_results.txt
            find target/criterion -name "*.json" -print0 | while IFS= read -r -d '' file; do
              echo "- $(basename "$(dirname "$file")"): Found JSON results" >> benchmark_results.txt
            done
          else
            echo "⚠️  No benchmark data available (timeout or failure)" >> benchmark_results.txt
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: |
            benchmark_results.txt
            target/criterion/
          if-no-files-found: warn

  code_coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: rust_tests

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker rmi $(docker images -q) || true
          echo "=== After cleanup ==="
          df -h

      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: |
          mkdir -p coverage
          cargo tarpaulin --out Lcov --out Xml --output-dir coverage --release --timeout 600

          # Verify coverage files were created
          if [ -f coverage/lcov.info ]; then
            echo "✅ Coverage generated: lcov.info"
            ls -lh coverage/lcov.info
          else
            echo "⚠️ Warning: lcov.info not generated"
          fi

          if [ -f coverage/cobertura.xml ]; then
            echo "✅ Coverage generated: cobertura.xml"
            ls -lh coverage/cobertura.xml
          else
            echo "⚠️ Warning: cobertura.xml not generated"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  python_integration:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: rust_tests

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker rmi $(docker images -q) || true
          echo "=== After cleanup ==="
          df -h

      - uses: actions/checkout@v5

      - name: Set up Python 3.12 with tiered cache
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6

      - name: Install maturin and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-cov setuptools wheel virtualenv

      - name: Build Python extension with maturin
        run: |
          # Build and install the extension using extension-module feature
          # This avoids linking libpython which causes issues in CI
          maturin build --release --features extension-module || {
            echo "⚠️ Maturin build failed"
            exit 1
          }
          pip install target/wheels/*.whl || {
            echo "⚠️ Wheel installation failed, continuing without Python extension"
            exit 0
          }

          # Verify the extension can be imported using a heredoc to avoid quoting issues
          python - <<'PY'
          try:
              import codex_engine
              print("✅ Extension imported successfully")
          except ImportError as e:
              print(f"⚠️ Import failed: {e}")
              print("This is expected if Python bindings are not configured")
              raise SystemExit(0)
          PY

      - name: Run integration tests
        continue-on-error: true
        run: |
          # Check if integration tests exist
          if [ -d "tests/integration" ]; then
            python -m pytest tests/integration/ -v --cov-report=html --cov-report=term || echo "Integration tests completed with issues"
          else
            echo "⚠️ No integration tests found in tests/integration/"
            echo "Creating placeholder for future tests"
            mkdir -p tests/integration
          fi

          # Ensure htmlcov directory exists for artifact upload
          if [ ! -d "htmlcov" ]; then
            mkdir -p htmlcov
            cat > htmlcov/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Integration Test Coverage Report</title></head>
          <body>
          <h1>Integration Test Coverage Report</h1>
          <p>No coverage data available - tests not run or no tests found</p>
          </body>
          </html>
          EOF
          fi

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-results
          path: htmlcov/
          if-no-files-found: warn

  performance_regression:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [rust_benchmarks]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history for comparison

      - name: Download benchmark results
        uses: actions/download-artifact@v5
        with:
          name: benchmark-results

      - name: Verify benchmark results exist
        run: |
          echo "=== Downloaded benchmark artifacts ==="
          ls -lah

          if [ -f "benchmark_results.txt" ]; then
            echo "✅ Found benchmark_results.txt"
            head -10 benchmark_results.txt
          else
            echo "❌ benchmark_results.txt not found"
            echo "Available files:"
            find . -name "*.txt" -o -name "*.json"
            exit 1
          fi

      - name: Compare with baseline
        run: |
          # Create coverage directory for report output
          mkdir -p coverage

          # Check if comparison script exists
          if [ -f "scripts/validate_benchmarks.py" ]; then
            echo "Running benchmark validation..."
            python scripts/validate_benchmarks.py || {
              echo "⚠️ Benchmark validation failed or no baseline exists"
              echo "This is expected for first run or when benchmarks change"
              echo "Storing current results as baseline for future comparison"

              # Create a simple report indicating baseline establishment
              {
                echo "Benchmark Validation Report"
                echo "================================="
                echo ""
                echo "Status:  Baseline Establishment"
                echo "This is the first run or baseline files are missing."
                echo "Current benchmark results will serve as the baseline for future comparisons."
                echo ""
                echo "Next runs will compare against this baseline to detect performance regressions."
              } > coverage/benchmark_validation_report.txt
            }
          else
            echo "⚠️ scripts/validate_benchmarks.py not found"
            echo "Skipping regression comparison"
            echo "Benchmark results recorded for future comparison"
            mkdir -p coverage
            echo "Benchmark validation skipped - validation script not found" > coverage/benchmark_validation_report.txt
          fi

      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' && hashFiles('coverage/benchmark_validation_report.txt') != '' }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('coverage/benchmark_validation_report.txt', 'utf8');
            const MARKER = '<!-- benchmark-results-v1 -->';
            const body = `${MARKER}\n## 📊 Benchmark Results\n\n\`\`\`\n${results}\n\`\`\`\n\n---\n_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;

            // Retry loop — benchmark results update on every matrix shard
            // and every re-run, making concurrent races likely over a long
            // PR lifecycle. Retries with linear back-off (2s/4s/6s).
            for (let attempt = 0; attempt <= 3; attempt++) {
              try {
                // Paginate through all comments to find the marker, regardless of
                // comment count (PRs with >100 comments would miss older marker comments).
                let existing = null;
                let page = 1;
                while (!existing) {
                  const { data: batch } = await github.rest.issues.listComments({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: context.issue.number, per_page: 100, page,
                  });
                  existing = batch.find(c => c.body && c.body.includes(MARKER)) || null;
                  if (batch.length < 100) break;
                  page++;
                }
                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    comment_id: existing.id, body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner, repo: context.repo.repo, body,
                  });
                }
                break; // success
              } catch (e) {
                if (attempt === 3) throw e;
                await new Promise(r => setTimeout(r, (attempt + 1) * 2000));
              }
            }

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6

      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        continue-on-error: true   # Emit advisory warnings without blocking CI; review RUSTSEC advisories separately
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: Run cargo deny (if available)
        continue-on-error: true
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install cargo-deny --locked
          fi
          cargo deny check advisories

  documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6

      - name: Build Rust docs
        run: |
          cargo doc --no-deps --document-private-items --all-features

      - name: Upload documentation
        uses: actions/upload-artifact@v5
        with:
          name: rust-documentation
          path: target/doc/

  release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [rust_tests, python_integration, code_coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: maturin build --release

      - name: Upload wheel
        uses: actions/upload-artifact@v5
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: target/wheels/*.whl

  status_check:
    name: Overall Status
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [rust_tests, rust_benchmarks, code_coverage, python_integration, security_audit]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Checkout for cache health
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci

      - name: Cache health report
        continue-on-error: true
        run: |
          pip install -q pip 2>/dev/null
          python scripts/ci/generate_cache_keys.py --type cargo --workflow rust_swarm_ci --health 2>/dev/null || echo '{"status": "cache health check skipped"}'

      - name: Check all jobs
        run: |
          echo "All required jobs completed"
          # Treat "skipped" as neutral — jobs are skipped when the cost gate
          # blocks execution on non-approved RED-tier PRs.  Only "failure"
          # indicates an actual test regression.
          if [[ "${{ needs.rust_tests.result }}" == "failure" ]]; then
            echo "❌ Rust tests failed"
            exit 1
          elif [[ "${{ needs.rust_tests.result }}" == "skipped" ]]; then
            echo "⚠️  Rust tests skipped (cost gate blocked execution)"
          fi
          if [[ "${{ needs.code_coverage.result }}" == "failure" ]]; then
            echo "⚠️  Coverage check failed"
          fi
          echo "✅ All checks passed"

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: status_check
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Rust Swarm CI"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
