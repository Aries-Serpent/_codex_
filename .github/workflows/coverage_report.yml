name: Coverage Report

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.11'
          cache-tier: 'live'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest>=9.0,<10' 'pytest-cov>=7.0,<8' 'coverage>=7.10.6,<8' jsonschema==4.23.* pyyaml==6.0.* weasyprint==62.*
      - name: Run tests with coverage
        run: |
          coverage run -m pytest -q || true
          coverage json -o .coverage.json
      - name: Generate coverage HTML report
        run: |
          coverage html -d htmlcov || true
      - name: Generate function index PDF (72 DPI, black & white)
        run: |
          python tools/coverage_html_to_pdf.py --input-dir htmlcov --output coverage_functions.pdf --dpi 72 || true
      - name: Extract per-module coverage
        run: |
          python tools/coverage_extract.py --coverage-json .coverage.json --out coverage_modules.json || true
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        with:
          name: coverage-artifacts
          path: |
            .coverage.json
            coverage_modules.json
            coverage_functions.pdf
