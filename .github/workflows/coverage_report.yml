name: Coverage Report

on:
  pull_request:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage jsonschema pyyaml
      - name: Run tests with coverage
        run: |
          coverage run -m pytest -q || true
          coverage json -o .coverage.json
      - name: Extract per-module coverage
        run: |
          python tools/coverage_extract.py --coverage-json .coverage.json --out coverage_modules.json || true
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            .coverage.json
            coverage_modules.json
