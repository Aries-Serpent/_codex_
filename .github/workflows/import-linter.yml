name: Import Linter

# Enforces architectural layer contracts defined in `.importlinter`.
# Blocks PRs when import rules are violated (e.g., api → training internals,
# agents importing model weights directly).
#
# Domain: D1 · Platform Architecture & Boundaries (completion rubric v1)
# Evidence: blocks PRs on layer-contract violations + circular import detection → score 5 evidence

on:
  pull_request:
    branches: [main, develop, "0D_base_"]
    paths:
      - "src/**"
      - "agents/**"
      - "codex_ml/**"
      - ".importlinter"
      - "pyproject.toml"
      - "setup.cfg"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "agents/**"
      - "codex_ml/**"
      - ".importlinter"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: import-linter-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-imports:
    name: "🏗️ Import Architecture Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install import-linter
        run: pip install import-linter --quiet

      - name: Install project (editable, no heavy deps)
        run: pip install -e ".[dev]" --quiet --no-deps 2>/dev/null || pip install -e . --quiet --no-deps

      - name: Run import-linter
        id: lint
        run: |
          lint-imports --config .importlinter 2>&1 | tee /tmp/import_lint_results.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        continue-on-error: true

      - name: Post PR comment on violation
        if: >
          github.event_name == 'pull_request' &&
          steps.lint.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY="## 🏗️ Import Architecture Violation

          The import-linter found layer-contract violations.  Please fix before merging.

          \`\`\`
          $(cat /tmp/import_lint_results.txt | head -60)
          \`\`\`

          **Contracts checked** (see \`.importlinter\`):
          - Core layering: utils → data → models → training → api
          - API must not import training internals
          - Agents must use cognitive\_app runtime for model weights
          "
          gh pr comment "$PR_NUMBER" --body "$BODY" 2>/dev/null || true

      - name: Fail on violation
        if: steps.lint.outputs.exit_code != '0'
        run: |
          echo "::error::Import architecture contracts violated. See results above."
          exit 1

      - name: Check for circular imports
        id: circular
        run: |
          python3 - <<'PYEOF'
          """Detect circular imports in src/ packages via DFS on the import graph."""
          import ast, sys, os
          from pathlib import Path
          from collections import defaultdict

          def module_name(path: Path, root: Path) -> str:
              rel = path.relative_to(root)
              parts = list(rel.with_suffix("").parts)
              if parts[-1] == "__init__":
                  parts = parts[:-1]
              return ".".join(parts)

          def build_graph(src_root: Path) -> dict[str, set[str]]:
              graph: dict[str, set[str]] = defaultdict(set)
              py_files = list(src_root.rglob("*.py"))
              all_modules = set()
              for f in py_files:
                  all_modules.add(module_name(f, src_root))
              for f in py_files:
                  mod = module_name(f, src_root)
                  try:
                      tree = ast.parse(f.read_text(errors="replace"))
                  except SyntaxError:
                      continue
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          for alias in node.names:
                              if alias.name in all_modules:
                                  graph[mod].add(alias.name)
                      elif isinstance(node, ast.ImportFrom) and node.module:
                          target = node.module
                          if target in all_modules:
                              graph[mod].add(target)
                          # Also check parent packages
                          parts = target.split(".")
                          for i in range(1, len(parts)):
                              parent = ".".join(parts[:i])
                              if parent in all_modules:
                                  graph[mod].add(parent)
              return graph

          def find_cycles(graph: dict[str, set[str]]) -> list[list[str]]:
              WHITE, GRAY, BLACK = 0, 1, 2
              color = defaultdict(int)
              cycles = []
              path: list[str] = []

              def dfs(u: str) -> None:
                  color[u] = GRAY
                  path.append(u)
                  for v in sorted(graph.get(u, [])):
                      if color[v] == GRAY:
                          idx = path.index(v)
                          cycle = path[idx:] + [v]
                          cycles.append(cycle)
                      elif color[v] == WHITE:
                          dfs(v)
                  path.pop()
                  color[u] = BLACK

              for node in sorted(graph):
                  if color[node] == WHITE:
                      dfs(node)
              return cycles

          src = Path("src")
          if not src.exists():
              print("⚠️ src/ directory not found — skipping circular import check")
              sys.exit(0)

          graph = build_graph(src)
          cycles = find_cycles(graph)

          if cycles:
              print(f"❌ Found {len(cycles)} circular import chain(s):")
              for c in cycles[:10]:
                  print(f"  → {' → '.join(c)}")
              if len(cycles) > 10:
                  print(f"  ... and {len(cycles) - 10} more")
              sys.exit(1)
          else:
              print(f"✅ No circular imports detected across {len(graph)} modules in src/")
          PYEOF
        continue-on-error: true

      - name: Fail on circular imports
        if: steps.circular.outcome == 'failure'
        run: |
          echo "::error::Circular imports detected in src/. See results above."
          exit 1

      - name: Summary on success
        if: steps.lint.outputs.exit_code == '0' && steps.circular.outcome != 'failure'
        run: |
          echo "✅ All import architecture contracts passed (layer rules + circular import check)."
          cat /tmp/import_lint_results.txt
