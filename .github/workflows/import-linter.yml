name: Import Linter
on:
  pull_request:
    branches:
    - main
    - develop
    - 0D_base_
    paths:
    - src/**/*.py
    - .importlinter
  push:
    branches:
    - main
    paths:
    - src/**/*.py
    - .importlinter
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  lint-imports:
    if: ${{ github.event.pull_request.number != 5328 }}
    name: "\U0001F517 Import Layer Boundary Check"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache: pip
    - name: Install import-linter
      run: 
        cache-tier: common
        cache-version: ${ vars.CODEX_CACHE_VERSION || "v2" }'pip install import-linter --quiet

        '
    - name: Run import-linter
      run: lint-imports
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-import_linter-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-import_linter-
            ${{ runner.os }}-pip-
    timeout-minutes: 15
