# Self-Healing CI Integration Workflow
#
# This workflow integrates the self-healing engine into CI/CD
# to automatically detect and suggest fixes for common issues.
#
# Implements: R6 - Integrate self-healing into CI/CD

name: Self-Healing CI

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to analyze'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze-failure:
    name: Analyze Failed Run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          
      - name: Run Self-Healing Analysis
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_FORCE_CPU: "1"
        run: |
          python -c "
          import json
          import sys
          sys.path.insert(0, '.')
          
          from agents.self_healing import SelfHealingEngine, IssueType
          
          engine = SelfHealingEngine(repo_path='.')
          report = engine.run_health_check()
          
          print('## Self-Healing Analysis Report')
          print(f'Health Score: {report.health_score}/100')
          print(f'Issues Found: {len(report.issues)}')
          print()
          
          if report.issues:
              print('### Issues Detected')
              for issue in report.issues:
                  print(f'- **{issue.issue_type.value}** ({issue.severity.value}): {issue.description}')
                  if issue.suggested_fix:
                      print(f'  - Suggested fix: {issue.suggested_fix}')
              print()
          
          if report.recommendations:
              print('### Recommendations')
              for rec in report.recommendations:
                  print(f'- {rec}')
          
          # Output for GitHub Actions
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'health_score={report.health_score}\n')
              f.write(f'issues_count={len(report.issues)}\n')
          "
          
      - name: Create Issue for Critical Findings
        if: steps.analyze.outputs.issues_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const healthScore = '${{ steps.analyze.outputs.health_score }}';
            const issuesCount = '${{ steps.analyze.outputs.issues_count }}';
            
            if (parseInt(issuesCount) > 0 && parseInt(healthScore) < 70) {
              // Only create issue for significant problems
              console.log(`Health score ${healthScore} with ${issuesCount} issues - consider manual review`);
            }

  suggest-fixes:
    name: Suggest Automated Fixes
    runs-on: ubuntu-latest
    needs: analyze-failure
    if: ${{ needs.analyze-failure.outputs.issues_count > 0 }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate Fix Suggestions
        run: |
          echo "## Automated Fix Suggestions"
          echo ""
          echo "Based on the self-healing analysis, the following fixes are suggested:"
          echo ""
          echo "1. Review the issues identified in the analysis"
          echo "2. Apply suggested fixes where appropriate"
          echo "3. Run tests to verify fixes"
          echo "4. Submit changes for review"
