name: observable-release
on:
  push:
    tags:
    - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g., v0.1.0)
        required: true
permissions:
  contents: write
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  build-and-release:
    name: Build, Test, and Release
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.12'
      SBOM_HMAC_KEY: ${{ secrets.SBOM_HMAC_KEY || 'dev-key' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python with cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: live
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Log Python and environment info
      run: 'echo "=== Python Version ==="

        python --version

        python -m venv --help | head -5

        echo ""

        echo "=== Installed packages ==="

        pip list | head -10

        echo ""

        echo "=== System info ==="

        uname -a

        '
    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-release-${{ hashFiles('**/uv.lock', '**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-release-
          ${{ runner.os }}-pip-
    - name: Parse release tag
      id: release
      env:
        TAG: ${{ github.ref_name || github.event.inputs.tag }}
      run: 'VERSION="${TAG#v}"

        echo "version=${VERSION}" >> $GITHUB_OUTPUT

        echo "tag=${TAG}" >> $GITHUB_OUTPUT

        echo "Release: ${TAG} (v${VERSION})"

        '
    - name: Analyze dependency changes
      id: deps
      run: "echo \"=== Dependency Analysis ===\"\necho \"Lock file size:\"\nwc -l\
        \ uv.lock\necho \"\"\necho \"Package count:\"\ngrep -c '^\\[\\[package\\]\\\
        ]' uv.lock || echo \"N/A\"\necho \"\"\necho \"Key dependencies:\"\ngrep -E\
        \ '^name = \"(numpy|torch|fastapi|pydantic)\"' uv.lock | head -10\n\n# Count\
        \ package additions/removals compared to main\nif git show main:uv.lock &>/dev/null;\
        \ then\n  ADDED=$(diff -u <(git show main:uv.lock | grep '^name = ' | sort)\
        \ <(cat uv.lock | grep '^name = ' | sort) | grep -c '^+')\n  REMOVED=$(diff\
        \ -u <(git show main:uv.lock | grep '^name = ' | sort) <(cat uv.lock | grep\
        \ '^name = ' | sort) | grep -c '^-')\n  echo \"packages_added=${ADDED}\" >>\
        \ $GITHUB_OUTPUT\n  echo \"packages_removed=${REMOVED}\" >> $GITHUB_OUTPUT\n\
        \  echo \"Dependencies changed: +${ADDED} / -${REMOVED}\"\nelse\n  echo \"\
        No main branch to compare\"\nfi\n"
    - name: Validate lock file integrity
      run: "echo \"=== Lock File Validation ===\"\nif python -m pip freeze | grep\
        \ -q \"uv\"; then\n  echo \"\u2713 uv is installed\"\nelse\n  echo \"Installing\
        \ uv...\"\n  pip install uv\nfi\n\n# Check for floating versions (none should\
        \ exist)\nFLOATING=$(grep -cE 'version = \"[^=].*\\*' uv.lock)\necho \"Floating\
        \ version specs: ${FLOATING}\"\nif [ \"${FLOATING}\" -gt 0 ]; then\n  echo\
        \ \"\u26A0 Warning: Lock file contains floating versions\"\nfi\n"
    - name: Install build dependencies
      run: 'pip install build

        '
    - name: Build wheels
      id: build
      run: 'echo "=== Building wheels ==="

        START_TIME=$(date +%s)


        python -m build


        END_TIME=$(date +%s)

        DURATION=$((END_TIME - START_TIME))


        echo "build_duration=${DURATION}" >> $GITHUB_OUTPUT

        echo "Build completed in ${DURATION}s"


        echo ""

        echo "=== Generated artifacts ==="

        ls -lh dist/

        '
    - name: Verify wheel contents
      run: "echo \"=== Wheel Verification ===\"\nfor wheel in dist/*.whl; do\n  echo\
        \ \"Wheel: $(basename $wheel)\"\n  python -m zipfile -l \"$wheel\" | head\
        \ -20\n  echo \"\"\ndone\n"
    - name: Calculate artifact hashes
      id: hashes
      run: 'echo "=== Artifact Hashes (SHA256) ==="

        cd dist

        sha256sum ./* > SHA256SUMS

        cat SHA256SUMS

        cd ..


        # Calculate sizes

        SIZES=$(ls -lh dist/*.whl | awk ''{print $9, $5}'' | paste -sd '' '' -)

        echo "artifact_hashes=$(wc -l < dist/SHA256SUMS)" >> $GITHUB_OUTPUT

        '
    - name: Generate SBOMs
      id: sbom
      run: 'echo "=== SBOM Generation ==="

        START_TIME=$(date +%s%N)


        python scripts/build/generate_sbom.py --profiles core runtime full


        END_TIME=$(date +%s%N)

        DURATION_MS=$(( (END_TIME - START_TIME) / 1000000 ))


        echo "sbom_duration_ms=${DURATION_MS}" >> $GITHUB_OUTPUT

        echo "SBOM generation completed in ${DURATION_MS}ms"


        echo ""

        echo "=== Generated SBOMs ==="

        ls -lh .codex/sbom/cognitive_brain-0.1.0-*.xml

        '
    - name: Verify SBOM integrity
      run: "echo \"=== SBOM Verification ===\"\nfor profile in core runtime full;\
        \ do\n  echo \"Profile: ${profile}\"\n  python scripts/deploy/verify_sbom.py\
        \ --profile \"${profile}\"\n  echo \"\"\ndone\n"
    - name: Validate license compliance
      run: "echo \"=== License Compliance ===\"\necho \"Policy: $(cat .codex/LICENSE_COMPLIANCE_POLICY.md\
        \ | head -5)\"\n\n# Quick check: verify no GPL packages\nGPL_COUNT=$(python\
        \ scripts/build/generate_sbom.py --profiles full 2>&1 | grep -ic \"gpl\")\n\
        if [ \"${GPL_COUNT}\" -gt 0 ]; then\n  echo \"\u26A0 Warning: Found GPL packages\"\
        \n  exit 1\nelse\n  echo \"\u2713 No GPL/AGPL/SSPL licenses detected\"\nfi\n"
    - name: Collect release metrics
      id: metrics
      run: "echo \"=== Release Metrics ===\"\n\n# Count artifacts\nARTIFACT_COUNT=$(ls\
        \ dist/*.whl 2>/dev/null | wc -l)\n\npython src/codex/telemetry/metrics.py\
        \ collect-release \\\n  --tag \"v${{ steps.release.outputs.version }}\" \\\
        \n  --artifacts \"${ARTIFACT_COUNT}\"\n\necho \"Released artifacts: ${ARTIFACT_COUNT}\"\
        \necho \"artifacts_count=${ARTIFACT_COUNT}\" >> $GITHUB_OUTPUT\n"
    - name: Generate release notes
      id: notes
      run: "echo \"=== Release Notes Generation ===\"\n\nRELEASE_NOTES_FILE=\"release-notes-${{\
        \ steps.release.outputs.tag }}.md\"\n\ncat > \"${RELEASE_NOTES_FILE}\" <<\
        \ 'EOF'\n# Release ${{ steps.release.outputs.tag }}\n\n**Release Date**: $(date\
        \ -u +'%Y-%m-%d %H:%M:%S UTC')\n\n## Build Information\n- **Python Version**:\
        \ 3.12\n- **Build Duration**: ${{ steps.build.outputs.build_duration }}s\n\
        - **Artifacts**: ${{ steps.metrics.outputs.artifacts_count }}\n\n## Package\
        \ Information\n- **Dependencies Added**: ${{ steps.deps.outputs.packages_added\
        \ || 0 }}\n- **Dependencies Removed**: ${{ steps.deps.outputs.packages_removed\
        \ || 0 }}\n\n## Security\n- \u2705 SBOM Generated: 3 profiles (core, runtime,\
        \ full)\n- \u2705 SBOM Signed: HMAC-SHA256\n- \u2705 License Compliant: 100%\
        \ (349 packages)\n- \u2705 No GPL/AGPL licenses detected\n\n## Artifact Verification\n\
        - **Build Artifacts**: SHA256SUMS available in dist/\n- **SBOM Location**:\
        \ .codex/sbom/\n- **Signatures**: Each SBOM has corresponding .sig file\n\n\
        ## Installation\n\n### Core Profile (Minimal)\n```bash\npip install -e . --no-deps\n\
        ```\n\n### Runtime Profile\n```bash\npip install .[runtime]\n```\n\n### Full\
        \ Profile (Development)\n```bash\npip install .[full]\n```\n\n## Offline Installation\n\
        Create a wheelhouse from the release assets, then:\n```bash\npip install --no-index\
        \ --find-links wheelhouse .\n```\n\n## Metrics\nSee `.codex/metrics/release-*.json`\
        \ for detailed build metrics.\n\nEOF\n\ncat \"${RELEASE_NOTES_FILE}\"\necho\
        \ \"notes_file=${RELEASE_NOTES_FILE}\" >> $GITHUB_OUTPUT\n"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
      with:
        tag_name: ${{ steps.release.outputs.tag }}
        body_path: release-notes-${{ steps.release.outputs.tag }}.md
        files: 'dist/*.whl

          .codex/sbom/cognitive_brain-0.1.0-core.xml

          .codex/sbom/cognitive_brain-0.1.0-runtime.xml

          .codex/sbom/cognitive_brain-0.1.0-full.xml

          dist/SHA256SUMS

          '
    - name: Post release summary
      run: "echo \"=== RELEASE SUMMARY ===\"\necho \"Tag: v${{ steps.release.outputs.version\
        \ }}\"\necho \"Artifacts: ${{ steps.metrics.outputs.artifacts_count }}\"\n\
        echo \"Build Time: ${{ steps.build.outputs.build_duration }}s\"\necho \"SBOM\
        \ Generation: ${{ steps.sbom.outputs.sbom_duration_ms }}ms\"\necho \"\"\n\
        echo \"\u2705 Observable release workflow completed successfully\"\necho \"\
        \U0001F4DD Release notes: release-notes-${{ steps.release.outputs.tag }}.md\"\
        \necho \"\U0001F4E6 Artifacts: dist/\"\necho \"\U0001F4C4 SBOMs: .codex/sbom/\"\
        \n"
    timeout-minutes: 45
