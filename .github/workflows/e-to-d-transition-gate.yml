name: E→D Transition Readiness Gate

# Phase 4: 5-condition FSM check for E→D operating model transition.
# Tier-1 GROUNDED gate: emits core.setFailed when score < 5/5.
#
# The 5 conditions must ALL be satisfied before any agent is promoted to D_CAPABLE:
#   C1: AGENT_REGISTRY.yaml present in repo root area
#   C2: CODEX_MANIFEST.json valid + generated within last 24h
#   C3: Tier-3 (SOFT) policy count ≤ 2 in GROUNDED_VS_SOFT_ENFORCEMENT.md
#   C4: agent-handoff-gate.yml deployed (Phase 2 complete)
#   C5: GROUNDED Tier-1 gate count ≥ 8 in GROUNDED_VS_SOFT_ENFORCEMENT.md
#
# References: docs/plans/Agentic_AI_System/soft_to_GROUNDED.md Domain 5

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: e-to-d-transition-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  transition-readiness:
    name: "\U0001F504 E\u2192D Transition Readiness Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      readiness_score: ${{ steps.check.outputs.score }}
      model_capable: ${{ steps.check.outputs.capable }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Check 5 transition conditions
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const conditions = [];

            // C1: AGENT_REGISTRY.yaml present and covers all active agents
            const registryPath = '.github/agents/AGENT_REGISTRY.yaml';
            const registryExists = fs.existsSync(registryPath);
            conditions.push({
              id: 'C1',
              label: 'AGENT_REGISTRY.yaml present with full coverage',
              pass: registryExists
            });

            // C2: CODEX_MANIFEST.json valid and current (<24h)
            let manifestOk = false;
            if (fs.existsSync('CODEX_MANIFEST.json')) {
              try {
                const m = JSON.parse(fs.readFileSync('CODEX_MANIFEST.json', 'utf8'));
                const ageMs = Date.now() - new Date(m.generated_at).getTime();
                const has24hWindow = ageMs < 24 * 60 * 60 * 1000;
                const hasIntegrity = typeof m.integrity_sha256 === 'string' && m.integrity_sha256.length === 64;
                manifestOk = has24hWindow && hasIntegrity;
              } catch (e) {
                core.warning(`CODEX_MANIFEST.json parse error: ${e.message}`);
              }
            }
            conditions.push({
              id: 'C2',
              label: 'CODEX_MANIFEST.json valid + current (<24h)',
              pass: manifestOk
            });

            // C3: Tier-3 (SOFT) policy count <= 2
            const gvsPath = '.codex/docs/GROUNDED_VS_SOFT_ENFORCEMENT.md';
            const gvsDoc = fs.existsSync(gvsPath)
              ? fs.readFileSync(gvsPath, 'utf8')
              : '';
            const softCount = (gvsDoc.match(/\u274C \*\*SOFT\*\*/g) || []).length;
            conditions.push({
              id: 'C3',
              label: `Tier-3 count \u22642 (current: ${softCount})`,
              pass: softCount <= 2
            });

            // C4: agent-handoff-gate.yml deployed (Phase 2 complete)
            const handoffGate = fs.existsSync('.github/workflows/agent-handoff-gate.yml');
            conditions.push({
              id: 'C4',
              label: 'agent-handoff-gate.yml deployed (Phase 2 complete)',
              pass: handoffGate
            });

            // C5: GROUNDED Tier-1 gate count >= 8
            const tier1Count = (gvsDoc.match(/\u2705 \*\*GROUNDED\*\*/g) || []).length;
            conditions.push({
              id: 'C5',
              label: `Tier-1 gates \u22658 (current: ${tier1Count})`,
              pass: tier1Count >= 8
            });

            const score = conditions.filter(c => c.pass).length;
            const capable = score === 5;

            // Write job summary
            let summary = `## \U0001F504 E\u2192D Transition Readiness: ${score}/5\n\n`;
            summary += `| ID | Condition | Status |\n|----|-----------|---------|\n`;
            for (const c of conditions) {
              summary += `| ${c.id} | ${c.label} | ${c.pass ? '\u2705' : '\u274C'} |\n`;
            }
            summary += `\n**Operating Model:** ${capable ? '\U0001F7E2 D_CAPABLE unlocked' : '\U0001F7E1 E (continue building)'}\n`;
            summary += `\n_Tier-1 GROUNDED gate: score < 5 blocks PR._\n`;
            await core.summary.addRaw(summary).write();

            core.setOutput('score', score.toString());
            core.setOutput('capable', capable.toString());

            // Tier-1 GROUNDED gate: block PR when score < 5/5
            if (!capable) {
              core.setFailed(`E\u2192D transition not ready: ${score}/5 conditions met`);
            }

      - name: Emit demotion annotations for non-compliant agents
        if: always()
        run: |
          python3 - <<'PY'
          import yaml, sys, os
          registry_path = ".github/agents/AGENT_REGISTRY.yaml"
          if not os.path.exists(registry_path):
              sys.exit(0)
          with open(registry_path) as f:
              data = yaml.safe_load(f)
          agents = data.get("agents", [])
          demotions = []
          for a in agents:
              tier = a.get("enforcement_tier", "SOFT")
              model = a.get("autonomy_model", "E")
              # D_CAPABLE agents that lack structured handoff are demotion candidates
              if model == "D_CAPABLE" and a.get("handoff_protocol") != "structured":
                  demotions.append(f"{a.get('id','?')}: D_CAPABLE without structured handoff")
              # GROUNDED agents without accepts_handoff_from are incomplete
              if tier == "GROUNDED" and not a.get("accepts_handoff_from"):
                  demotions.append(f"{a.get('id','?')}: GROUNDED but no accepts_handoff_from")
          if demotions:
              print(f"::warning::Demotion candidates ({len(demotions)}):")
              for d in demotions:
                  print(f"::warning::  - {d}")
          else:
              print("No demotion candidates found.")
          PY

      - name: Post readiness to PR Status Dashboard
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-pr-summary
        with:
          workflow-name: 'E→D Transition Readiness'
          status: ${{ steps.check.outputs.capable == 'true' && 'success' || 'info' }}
          summary: 'Score ${{ steps.check.outputs.score }}/5 · ${{ steps.check.outputs.capable == ''true'' && ''D_CAPABLE unlocked 🟢'' || ''E model (conditions not yet met) 🟡'' }}'
          details: |
            **Score:** ${{ steps.check.outputs.score }}/5 | **D_CAPABLE:** ${{ steps.check.outputs.capable }}

            Tier-1 GROUNDED gate — run `e-to-d-transition-gate.yml` for full condition breakdown.

            _Phase 4 FSM | [e-to-d-transition-gate.yml]_

  # Self-heal C2: when CODEX_MANIFEST.json is stale (> 24h), automatically regenerate
  # and push a fresh manifest so the next E→D gate run passes C2.
  # This runs ONLY when the transition-readiness job fails and the score was 4/5
  # (i.e., exactly one condition failed, most likely C2 — manifest staleness).
  heal-stale-manifest:
    name: "🔧 Self-Heal: Refresh CODEX_MANIFEST.json (C2 recovery)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [transition-readiness]
    # Fire when: gate failed AND score was 4 (one condition short — likely C2)
    if: >-
      failure() &&
      needs.transition-readiness.outputs.readiness_score == '4' &&
      github.event_name == 'pull_request'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install minimal deps
        run: pip install pyyaml --quiet

      - name: Check if C2 (manifest staleness) is the failing condition
        id: c2-check
        run: |
          python3 - <<'PY'
          import json, time, os, sys
          if not os.path.exists('CODEX_MANIFEST.json'):
              print('MANIFEST_MISSING=true')
              sys.exit(0)
          m = json.load(open('CODEX_MANIFEST.json'))
          generated_at = m.get('generated_at', '')
          age_h = None
          try:
              from datetime import datetime, timezone
              ts = datetime.fromisoformat(generated_at.replace('Z', '+00:00'))
              age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
              stale = age_h > 23.5
          except Exception:
              stale = True
          age_str = f'{age_h:.1f}h' if age_h is not None else 'unknown'
          print(f'Manifest age: {age_str} — {"STALE" if stale else "FRESH"}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'stale={"true" if stale else "false"}\n')
          PY

      - name: Regenerate CODEX_MANIFEST.json
        if: steps.c2-check.outputs.stale == 'true'
        run: python scripts/ci/generate_manifest.py

      - name: Commit and push refreshed manifest
        if: steps.c2-check.outputs.stale == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # SCP-RESCUE-5: sync .secrets.baseline before staging so the
          # CODEX_MANIFEST hashed_secret is always consistent with the new manifest.
          python3 scripts/ci/sync_tracked_files.py --fix --manifest-only || \
            echo "⚠️  sync_tracked_files non-zero (non-blocking)"
          git add CODEX_MANIFEST.json .secrets.baseline
          if git diff --cached --quiet; then
            echo "Manifest already up-to-date"
          else
            git commit -m "chore(manifest): auto-heal C2 — refresh CODEX_MANIFEST.json [skip ci]"
            git pull --rebase --autostash origin "${HEAD_REF}" 2>/dev/null || true
            git push origin "HEAD:${HEAD_REF}"
            echo "✅ CODEX_MANIFEST.json refreshed — C2 will pass on re-run"
          fi

      - name: Post healing notice to PR
        if: steps.c2-check.outputs.stale == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: [
                '🔧 **C2 Self-Heal Triggered**: `CODEX_MANIFEST.json` was stale (>24h) causing the E→D gate to fail.',
                '',
                'The manifest has been automatically regenerated and pushed. The E→D gate will re-run and should pass C2 on the next push or manual re-run.',
                '',
                '> **Next step:** Re-run the `E→D Transition Readiness Gate` check from the Actions tab, or push a new commit to trigger it automatically.',
              '',
              '---',
              `_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
              ].join('\n'),
            });

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: [transition-readiness, heal-stale-manifest]
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "E-to-D Transition Gate"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
