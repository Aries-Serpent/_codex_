name: App Package Download

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application to package'
        required: true
        type: choice
        options:
          - 'zd_voice_lines'
          - 'audio_transcriber_ui'
          - 'all'
        default: 'zd_voice_lines'
      branch:
        description: 'Branch to package from'
        required: true
        type: choice
        options:
          - 'main'
          - '0D_base_'
          - 'copilot/add-zd-voice-lines-console-app'
        default: 'copilot/add-zd-voice-lines-console-app'
      custom_branch:
        description: 'Custom branch name (overrides dropdown selection if provided)'
        required: false
        type: string
        default: ''
      include_dependencies:
        description: 'Include requirements.txt for dependencies'
        required: false
        type: boolean
        default: true
      package_format:
        description: 'Package format'
        required: true
        type: choice
        options:
          - 'zip'
          - 'tar.gz'
        default: 'zip'

permissions:
  contents: read
  actions: read


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  package-app:
    name: Package Application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Determine target branch
        id: branch
        run: |
          CUSTOM_BRANCH="${{ github.event.inputs.custom_branch }}"
          SELECTED_BRANCH="${{ github.event.inputs.branch }}"

          if [ -n "$CUSTOM_BRANCH" ]; then
            BRANCH="$CUSTOM_BRANCH"
            echo "Using custom branch: $BRANCH"
          else
            BRANCH="$SELECTED_BRANCH"
            echo "Using selected branch: $BRANCH"
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 1

      - name: Verify apps directory exists
        run: |
          if [ ! -d "apps" ]; then
            echo "❌ Error: apps directory not found in branch ${{ steps.branch.outputs.branch }}"
            exit 1
          fi
          echo "✅ apps directory found"
          ls -la apps/

      - name: Discover available applications
        id: discover
        run: |
          echo "## 📦 Available Applications" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "apps/dev" ]; then
            echo "### apps/dev/" >> $GITHUB_STEP_SUMMARY
            ls -1 apps/dev/*.py 2>/dev/null | while read -r file; do
              basename "$file"
              echo "- \`$(basename "$file")\`" >> $GITHUB_STEP_SUMMARY
            done
          fi

          # Count total apps
          TOTAL_APPS=$(find apps -name "*.py" -type f | wc -l)
          echo "total_apps=$TOTAL_APPS" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total applications found**: $TOTAL_APPS" >> $GITHUB_STEP_SUMMARY

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Create package directory
        run: |
          mkdir -p package_staging
          echo "Created staging directory for packaging"

      - name: Package selected application
        id: package
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          BRANCH="${{ steps.branch.outputs.branch }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          echo "📦 Packaging application: $APP_NAME"
          echo "📍 From branch: $BRANCH"

          if [ "$APP_NAME" = "all" ]; then
            # Package all applications
            PACKAGE_NAME="codex_apps_all_${BRANCH//\//_}_${TIMESTAMP}"
            cp -r apps/* package_staging/
            echo "Packaged all applications"
          elif [ "$APP_NAME" = "zd_voice_lines" ]; then
            # Package Zendesk Voice Lines app
            PACKAGE_NAME="zendesk_voice_lines_${BRANCH//\//_}_${TIMESTAMP}"

            if [ ! -d "apps/dev" ]; then
              echo "❌ Error: apps/dev directory not found"
              exit 1
            fi

            # Copy main application and supporting files
            cp apps/dev/zd_voice_lines.py package_staging/

            # Copy documentation if exists
            if [ -d "apps/dev/docs" ]; then
              mkdir -p package_staging/docs
              cp -r apps/dev/docs/* package_staging/docs/
            fi

            # Copy additional markdown files
            for file in apps/dev/*.md; do
              if [ -f "$file" ]; then
                cp "$file" package_staging/
              fi
            done

            # Copy test file if exists
            if [ -f "apps/dev/test_api_client.py" ]; then
              cp apps/dev/test_api_client.py package_staging/
            fi

            # Copy __init__.py if exists
            if [ -f "apps/dev/__init__.py" ]; then
              cp apps/dev/__init__.py package_staging/
            fi

            echo "Packaged Zendesk Voice Lines application"
          elif [ "$APP_NAME" = "audio_transcriber_ui" ]; then
            # Package Audio Transcriber UI app
            PACKAGE_NAME="audio_transcriber_ui_${BRANCH//\//_}_${TIMESTAMP}"

            if [ ! -f "apps/dev/audio_transcriber_ui.py" ]; then
              echo "❌ Error: apps/dev/audio_transcriber_ui.py not found"
              exit 1
            fi

            cp apps/dev/audio_transcriber_ui.py package_staging/

            if [ -f "requirements-audio-transcription.txt" ]; then
              cp requirements-audio-transcription.txt package_staging/
            fi

            # Copy shared audio workflow module needed by the UI
            mkdir -p package_staging/services/audio/workflow
            cp src/services/audio/workflow/transcription_workflow.py package_staging/services/audio/workflow/

            # Add package markers for portable execution
            mkdir -p package_staging/services
            touch package_staging/services/__init__.py
            touch package_staging/services/audio/__init__.py
            cp apps/dev/templates/audio_workflow_init.py package_staging/services/audio/workflow/__init__.py

            if [ -d "apps/dev/docs" ]; then
              mkdir -p package_staging/docs
              cp -r apps/dev/docs/* package_staging/docs/
              # Promote the audio-specific guide to package root for quick access
              if [ -f "apps/dev/docs/AUDIO_TRANSCRIBER_USER_GUIDE.md" ]; then
                cp apps/dev/docs/AUDIO_TRANSCRIBER_USER_GUIDE.md package_staging/USER_GUIDE.md
              fi
            fi

            for file in apps/dev/*.md; do
              if [ -f "$file" ]; then
                cp "$file" package_staging/
              fi
            done

            echo "Packaged Audio Transcriber UI application"
          else
            echo "❌ Error: Unknown application name: $APP_NAME"
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

          # List packaged files
          echo "## 📋 Packaged Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find package_staging -type f | sed 's|package_staging/||' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate requirements.txt
        if: ${{ github.event.inputs.include_dependencies == 'true' }}
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          if [ "$APP_NAME" = "audio_transcriber_ui" ]; then
            cat > package_staging/requirements.txt << 'EOF'
          # Audio Transcriber UI dependencies
          # Python 3.12+ required
          numpy>=2.4.5,<3

          # Optional transcription backends (recommended)
          faster-whisper==1.1.1
          pyannote.audio==3.3.2
          ffmpeg-python==0.2.0
          EOF
            echo "✅ Generated requirements.txt for Audio Transcriber UI" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          cat > package_staging/requirements.txt << 'EOF'
          # Zendesk Voice Lines Application Dependencies
          # Python 3.12+ required

          # Core dependencies (included in Python standard library)
          # - tkinter (GUI framework)
          # - json (JSON parsing)
          # - csv (CSV export)

          # External dependencies
          requests>=2.32.4  # HTTP client for Zendesk API

          # Optional dependencies for Excel export
          pandas>=2.1.0     # Data manipulation and Excel export
          openpyxl>=3.1.0   # Excel file format support

          # Development dependencies (optional)
          pytest>=8.2.0     # Testing framework
          pytest-mock>=3.12.0  # Mock support for tests
          ruff>=0.1.15      # Linting
          black>=24.0.0     # Code formatting
          EOF

          echo "✅ Generated requirements.txt" >> $GITHUB_STEP_SUMMARY

      - name: Generate README for package
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          BRANCH="${{ steps.branch.outputs.branch }}"
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S UTC")
          APP_NAME="${{ github.event.inputs.app_name }}"
          APP_ENTRY="zd_voice_lines.py"
          APP_DESCRIPTION="Zendesk Voice Lines GUI application"
          QUICK_TEST_NOTE="python test_api_client.py"

          if [ "$APP_NAME" = "audio_transcriber_ui" ]; then
            APP_ENTRY="audio_transcriber_ui.py"
            APP_DESCRIPTION="Audio Transcriber desktop UI application"
            QUICK_TEST_NOTE="python audio_transcriber_ui.py"
          elif [ "$APP_NAME" = "all" ]; then
            APP_ENTRY="(multiple apps)"
            APP_DESCRIPTION="all applications under apps/"
            QUICK_TEST_NOTE="python <selected_app>.py"
          fi

          cat > package_staging/PACKAGE_INFO.md << EOF
          # Codex Application Package

          **Package**: $PACKAGE_NAME
          **Source Branch**: $BRANCH
          **Generated**: $TIMESTAMP
          **Repository**: Aries-Serpent/_codex_

          ## 📦 Contents

          This package contains the ${APP_DESCRIPTION} and supporting documentation.

          ### Main Application

          - \`${APP_ENTRY}\` - Main application entrypoint

          ### Documentation

          - \`README.md\` - Quick start guide
          - \`USER_GUIDE.md\` - Complete user manual
          - \`DEVELOPMENT.md\` - Developer documentation
          - \`APPLICATION_SPEC.md\` - Technical specification
          - \`QUICK_REFERENCE.md\` - Command reference
          - \`UI_MOCKUP.md\` - Interface layout diagrams
          - \`CHANGELOG.md\` - Version history

          ### Testing

           - \`test_api_client.py\` - Component tests (when packaging zd_voice_lines)

          ## 🚀 Quick Start

          ### Prerequisites

           - Python 3.12 or higher
           - tkinter (usually included with Python)
           - ffmpeg installed on PATH (required for MP3/MP4 conversion in transcription workflows)

          ### Installation

          1. Extract this package to your desired location
          2. Install dependencies:
             \`\`\`bash
             # Pin pytest plugins (PR #3248)
             # Pin pytest plugins before package install (PR #3248 stability fix)
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0


             pip install -r requirements.txt
             \`\`\`

           3. Run the application:
              \`\`\`bash
              python ${APP_ENTRY}
              \`\`\`

          ### Quick Test

          Run component tests to verify installation:

           \`\`\`bash
           ${QUICK_TEST_NOTE}
           \`\`\`

           Expected output: \`7 passed, 0 failed\` (zd_voice_lines package only)

          ## 📚 Documentation

           - For detailed usage instructions, see \`docs/USER_GUIDE.md\`
           - For development information, see \`docs/DEVELOPMENT.md\`
           - For API reference, see \`APPLICATION_SPEC.md\`

          ## 🔗 Resources

          - **Repository**: https://github.com/Aries-Serpent/_codex_
          - **Source Branch**: $BRANCH
          - **Zendesk API Docs**: https://developer.zendesk.com/api-reference/

          ## 📝 License

          MIT License - See repository for full license text

          ---

          **Generated by**: GitHub Actions App Package Download Workflow
          **Workflow Run**: [#\${{ github.run_number }}](\${{ github.server_url }}/\${{ github.repository }}/actions/runs/\${{ github.run_id }})
          EOF

          echo "✅ Generated PACKAGE_INFO.md" >> $GITHUB_STEP_SUMMARY

      - name: Create ZIP package
        if: ${{ github.event.inputs.package_format == 'zip' }}
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          cd package_staging
          zip -r "../${PACKAGE_NAME}.zip" .
          cd ..

          # Calculate size
          SIZE=$(du -h "${PACKAGE_NAME}.zip" | cut -f1)
          echo "package_file=${PACKAGE_NAME}.zip" >> $GITHUB_OUTPUT
          echo "package_size=$SIZE" >> $GITHUB_OUTPUT

          echo "## 📦 Package Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Format**: ZIP" >> $GITHUB_STEP_SUMMARY
          echo "- **Filename**: \`${PACKAGE_NAME}.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $SIZE" >> $GITHUB_STEP_SUMMARY

      - name: Create TAR.GZ package
        if: ${{ github.event.inputs.package_format == 'tar.gz' }}
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          cd package_staging
          tar -czf "../${PACKAGE_NAME}.tar.gz" .
          cd ..

          # Calculate size
          SIZE=$(du -h "${PACKAGE_NAME}.tar.gz" | cut -f1)
          echo "package_file=${PACKAGE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          echo "package_size=$SIZE" >> $GITHUB_OUTPUT

          echo "## 📦 Package Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Format**: TAR.GZ" >> $GITHUB_STEP_SUMMARY
          echo "- **Filename**: \`${PACKAGE_NAME}.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $SIZE" >> $GITHUB_STEP_SUMMARY

      - name: Upload package as artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_name }}.${{ github.event.inputs.package_format }}
          retention-days: 30
          compression-level: 0  # Already compressed

      - name: Generate download instructions
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📥 Download Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Method 1: GitHub UI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Navigate to this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Scroll to the **Artifacts** section at the bottom" >> $GITHUB_STEP_SUMMARY
          echo "3. Click on \`$PACKAGE_NAME\` to download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Method 2: GitHub CLI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gh run download ${{ github.run_id }} --name $PACKAGE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Method 3: Direct Link" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Visit: [\${{ github.server_url }}/\${{ github.repository }}/actions/runs/\${{ github.run_id }}](\${{ github.server_url }}/\${{ github.repository }}/actions/runs/\${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact Retention**: 30 days" >> $GITHUB_STEP_SUMMARY

      - name: Generate package manifest
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          BRANCH="${{ steps.branch.outputs.branch }}"

          cat > package_manifest.json << EOF
          {
            "package_name": "$PACKAGE_NAME",
            "application": "${{ github.event.inputs.app_name }}",
            "source_branch": "$BRANCH",
            "repository": "${{ github.repository }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "format": "${{ github.event.inputs.package_format }}",
            "include_dependencies": ${{ github.event.inputs.include_dependencies }},
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}"
          }
          EOF

          echo "✅ Generated package manifest" >> $GITHUB_STEP_SUMMARY

      - name: Upload package manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.package.outputs.package_name }}-manifest
          path: package_manifest.json
          retention-days: 90

      - name: Final summary
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          APP_ENTRY="zd_voice_lines.py"
          if [ "$APP_NAME" = "audio_transcriber_ui" ]; then
            APP_ENTRY="audio_transcriber_ui.py"
          elif [ "$APP_NAME" = "all" ]; then
            APP_ENTRY="<selected_app>.py"
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Packaging Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your application package is ready for download!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the package using one of the methods above" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the package contents" >> $GITHUB_STEP_SUMMARY
          echo "3. Follow the instructions in \`PACKAGE_INFO.md\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Install dependencies with \`pip install -r requirements.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "5. Run the application with \`python ${APP_ENTRY}\`" >> $GITHUB_STEP_SUMMARY
