name: App Package Download

'on':
  workflow_dispatch:
    inputs:
      app_name:
        description: Application to package
        required: true
        type: choice
        options:
          - offline_zip_keymaster
          - offline-zip-keymaster
          - all
        default: offline_zip_keymaster
      branch:
        description: Branch to package from (must be a predefined safe branch)
        required: true
        type: choice
        options:
          - main
          - 0D_base_
        default: main
      package_format:
        description: Package format
        required: true
        type: choice
        options:
          - zip
        default: zip
      include_dependencies:
        description: Include dependency metadata in the packaged archive
        required: false
        type: boolean
        default: true
      include_build_bundle:
        description: Include the minimal source bundle used to build the package
        required: false
        type: boolean
        default: true
      offline_wheelhouse:
        description: Produce a local wheelhouse bundle for offline installation support
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-windows-gui-exe:
    name: Build Windows GUI EXE bundle via Wine container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      BRANCH: ${{ github.event.inputs.branch }}
      PACKAGE_FORMAT: ${{ github.event.inputs.package_format }}
      INCLUDE_DEPS: ${{ github.event.inputs.include_dependencies }}
      INCLUDE_BUILD_BUNDLE: ${{ github.event.inputs.include_build_bundle }}
      OFFLINE_WHEELHOUSE: ${{ github.event.inputs.offline_wheelhouse }}
    steps:
      - name: Validate target app and branch
        shell: bash
        run: |
          set -euo pipefail
          case "$APP_NAME" in
            offline_zip_keymaster|offline-zip-keymaster|all)
              ;;
            *)
              echo "Unsupported app target: $APP_NAME"
              exit 1
              ;;
          esac
          case "$BRANCH" in
            main|0D_base_)
              ;;
            *)
              echo "Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Prepare repo-local packaging directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/pyinstaller dist/windows-app release packages/offline_zip_keymaster
          rm -rf .artifacts/pyinstaller/* dist/windows-app/* release/* packages/offline_zip_keymaster/*

          if [[ "$APP_NAME" == "offline_zip_keymaster" || "$APP_NAME" == "offline-zip-keymaster" || "$APP_NAME" == "all" ]]; then
            cp -R src/offline_zip_keymaster packages/offline_zip_keymaster/
            cp -R scripts packages/offline_zip_keymaster/
            cp pyproject.toml packages/offline_zip_keymaster/pyproject.toml
            cp src/offline_zip_keymaster/README.md packages/offline_zip_keymaster/README.md
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build and Cache Wine Builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.windows-pyinstaller
          load: true
          tags: wine-pyinstaller:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Windows GUI executable in Wine container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows-app .artifacts/pyinstaller
          docker run --rm \
            -v "$GITHUB_WORKSPACE/dist:/src/dist" \
            -v "$GITHUB_WORKSPACE/.artifacts/pyinstaller:/src/.artifacts/pyinstaller" \
            -w /src \
            wine-pyinstaller:latest
          test -f dist/windows-app/run_offline_zip_keymaster.exe
          file dist/windows-app/run_offline_zip_keymaster.exe | grep -E 'PE32\+|PE32|PE/'

      - name: Headless smoke test the Windows GUI binary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64
          export DISPLAY=:99
          xvfb-run -a timeout 20s wine dist/windows-app/run_offline_zip_keymaster.exe --help >/tmp/offline_zip_keymaster_help.txt 2>&1 || {
            cat /tmp/offline_zip_keymaster_help.txt || true
            exit 1
          }
          grep -Ei 'Offline ZIP Keymaster|Usage|Default behavior' /tmp/offline_zip_keymaster_help.txt

      - name: Generate GUI bundle metadata
        shell: python
        run: |
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("dist/windows-app")
          exe = root / "run_offline_zip_keymaster.exe"
          if not exe.exists():
              raise FileNotFoundError(f"Missing EXE: {exe}")
          digest = hashlib.sha256(exe.read_bytes()).hexdigest()
          readme = root / "README.txt"
          readme.write_text(
              "Double-click run_offline_zip_keymaster.exe to launch the GUI.\n"
              "This bundle is self-contained and does not require the repository, GitHub variables, "
              "or network access.\n",
              encoding="utf-8",
          )
          manifest = {
              "app_name": "offline_zip_keymaster",
              "entry_point": "run_offline_zip_keymaster.exe",
              "launch_mode": "GUI",
              "source_branch": os.environ.get("BRANCH", "main"),
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "sha256": digest,
              "artifact_type": "self-contained-gui-exe",
              "requires_repo": False,
              "requires_network": False,
              "files": ["run_offline_zip_keymaster.exe", "README.txt", "manifest.json"],
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

      - name: Validate self-contained bundle contract
        shell: python
        run: |
          import json
          from pathlib import Path

          bundle_dir = Path("dist/windows-app")
          exe = bundle_dir / "run_offline_zip_keymaster.exe"
          readme = bundle_dir / "README.txt"
          manifest_path = bundle_dir / "manifest.json"

          if not exe.exists():
              raise FileNotFoundError(f"Missing packaged EXE: {exe}")
          if not readme.exists():
              raise FileNotFoundError(f"Missing README: {readme}")
          if not manifest_path.exists():
              raise FileNotFoundError(f"Missing manifest: {manifest_path}")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["artifact_type"] == "self-contained-gui-exe", manifest
          assert manifest["launch_mode"] == "GUI", manifest
          assert manifest["requires_repo"] is False, manifest
          assert manifest["requires_network"] is False, manifest
          assert "run_offline_zip_keymaster.exe" in manifest["files"], manifest
          assert "double-click" in readme.read_text(encoding="utf-8").lower(), readme.read_text(encoding="utf-8")

      - name: Create self-contained runtime ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release runtime_bundle
          rm -rf runtime_bundle/*
          cp dist/windows-app/run_offline_zip_keymaster.exe runtime_bundle/
          cp dist/windows-app/README.txt runtime_bundle/
          cp dist/windows-app/manifest.json runtime_bundle/
          test "$(find runtime_bundle -maxdepth 1 -type f | wc -l)" -eq 3
          zip -j release/run_offline_zip_keymaster_self_contained.zip \
            runtime_bundle/run_offline_zip_keymaster.exe \
            runtime_bundle/README.txt \
            runtime_bundle/manifest.json

      - name: Verify runtime ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f release/run_offline_zip_keymaster_self_contained.zip
          rm -rf .artifacts/zip_verify
          mkdir -p .artifacts/zip_verify
          unzip -q release/run_offline_zip_keymaster_self_contained.zip -d .artifacts/zip_verify
          test -f .artifacts/zip_verify/run_offline_zip_keymaster.exe
          test -f .artifacts/zip_verify/README.txt
          test -f .artifacts/zip_verify/manifest.json
          test "$(find .artifacts/zip_verify -maxdepth 1 -type f | wc -l)" -eq 3
          ! find .artifacts/zip_verify -type d -name .codex | grep -q .
          ls -l .artifacts/zip_verify

      - name: Upload runtime ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-zip-keymaster-gui-${{ github.run_id }}
          path: release/run_offline_zip_keymaster_self_contained.zip
          if-no-files-found: error
          retention-days: 30

      - name: Summarize runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          echo "## ✅ GUI runtime bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Primary artifact**: run_offline_zip_keymaster_self_contained.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build path**: Ubuntu `ubuntu-latest` + Wine-backed Windows container" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Launch mode**: GUI, double-click the bundled EXE" >> "$GITHUB_STEP_SUMMARY"
          ls -l release

  prepare-build-bundle:
    name: Build support bundle
    runs-on: ubuntu-latest
    needs: build-windows-gui-exe
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      BRANCH: ${{ github.event.inputs.branch }}
      INCLUDE_DEPS: ${{ github.event.inputs.include_dependencies }}
      OFFLINE_WHEELHOUSE: ${{ github.event.inputs.offline_wheelhouse }}
      INCLUDE_BUILD_BUNDLE: ${{ github.event.inputs.include_build_bundle }}
    if: ${{ github.event.inputs.include_build_bundle }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Prepare minimal build bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_bundle release .artifacts/wheelhouse
          rm -rf build_bundle/* release/* .artifacts/wheelhouse/*

          cp -R src build_bundle/
          cp scripts/security/offline_zip_keymaster.py build_bundle/src/offline_zip_keymaster/offline_zip_keymaster.py
          cp src/offline_zip_keymaster/README.md build_bundle/src/offline_zip_keymaster/README.md
          cp pyproject.toml build_bundle/pyproject.toml

          if [[ "$INCLUDE_DEPS" == "true" ]]; then
            python - <<'PY'
            import json
            from pathlib import Path
            pyproject = Path('pyproject.toml').read_text(encoding='utf-8')
            dependency_lines = []
            current = None
            for line in pyproject.splitlines():
                if line.startswith('dependencies = ['):
                    current = 'dependencies'
                    continue
                if current == 'dependencies' and line.strip() == ']':
                    current = None
                    continue
                if current == 'dependencies':
                    dependency_lines.append(line.strip().strip(',').strip('"'))
            manifest = {
                'artifact_type': 'dependency-metadata',
                'include_dependencies': True,
                'dependencies': [item for item in dependency_lines if item],
            }
            (Path('build_bundle') / 'dependency_manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
            PY
          fi

          if [[ "$OFFLINE_WHEELHOUSE" == "true" ]]; then
            python -m pip install --upgrade pip wheel
            python -m pip wheel . --wheel-dir .artifacts/wheelhouse
            cp .artifacts/wheelhouse/*.whl build_bundle/src/offline_zip_keymaster/ 2>/dev/null || true
          fi

          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('build_bundle')
          entries = []
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  entries.append({
                      'path': str(path.relative_to(root)),
                      'sha256': digest,
                  })
          manifest = {
              'package_name': 'offline_zip_keymaster_build_bundle',
              'app_name': 'offline_zip_keymaster',
              'source_branch': os.environ.get('BRANCH', 'main'),
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'artifact_type': 'build-support',
              'files': entries,
          }
          (root / 'build_bundle_manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          cd build_bundle
          zip -r ../release/offline_zip_keymaster_build_bundle.zip src pyproject.toml build_bundle_manifest.json dependency_manifest.json 2>/dev/null || zip -r ../release/offline_zip_keymaster_build_bundle.zip src pyproject.toml build_bundle_manifest.json

      - name: Upload build bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-zip-keymaster-build-${{ github.run_id }}
          path: release/offline_zip_keymaster_build_bundle.zip
          if-no-files-found: error
          retention-days: 30

      - name: Summarize build bundle
        shell: bash
        run: |
          set -euo pipefail
          echo "## 🧩 Build support bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact**: offline_zip_keymaster_build_bundle.zip" >> "$GITHUB_STEP_SUMMARY"
          ls -l release
