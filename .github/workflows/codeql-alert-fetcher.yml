name: 🔍 CodeQL Alert Fetcher

# WEC opt-in — Security section (index 30)
#
# Purpose
# -------
# Fetch ALL open security alerts (CodeQL, Dependabot, secret scanning) plus
# community health, security policy, and CodeQL analysis provenance using
# CODEX_MASTER_KEY (which holds the security_events scope unavailable to sandbox
# tokens).  Uploads a rich, agent-ready artifact so the Copilot coding agent
# can plan and execute codebase-wide security + quality remediations within the
# same session, without any additional API calls.
#
# Why a separate workflow?
# ------------------------
# The Copilot sandbox token (GITHUB_TOKEN / AGENT_GITHUB_TOKEN) permanently lacks
# security_events scope → every direct call returns HTTP 403.  The only path is to
# run as a first-class GitHub Actions workflow using secrets.CODEX_MASTER_KEY.
#
# Rate-limit hardening
# --------------------
# - fetch_codeql_alerts.py inserts a configurable per-page sleep (PAGE_SLEEP_MS ms).
# - The workflow exits 0 (neutral) when the rate-limit is exhausted so it does NOT
#   block the WEC gate or count as a failing check.
# - Re-run after the reset window (~1 hr) to get fresh results.
#
# Artifacts produced (90-day retention)
# --------------------------------------
#   security-snapshot-{run_id}/
#     # CodeQL / code-scanning
#     codeql/alerts_raw.json          — full CodeQL alert JSON array
#     codeql/alerts_by_rule.md        — grouped by rule ID (paste into session notes)
#     codeql/alerts_fixable.md        — top-N prioritised fix list
#     codeql/alerts_summary.json      — machine-readable counts by rule / severity
#     # Dependabot
#     dependabot/alerts_open.json     — open Dependabot vulnerability alerts
#     dependabot/alerts_critical.json — critical + high only
#     dependabot/summary.json         — counts by severity / ecosystem
#     # Secret scanning
#     secrets/alerts_open.json        — open secret scanning alerts
#     secrets/alerts_active.json      — validity=active confirmed secrets
#     secrets/summary.json            — counts by type / validity
#     # Security policy & community health
#     policy/community_profile.json   — community health endpoint
#     policy/security_policy.json     — resolved policy file (path + content)
#     # Analysis provenance
#     analyses/recent.json            — last 100 code-scanning analysis runs
#     analyses/default_setup.json     — CodeQL default-setup status
#     # Consolidated agent context
#     AGENT_SECURITY_CONTEXT.md       — single-file summary for Copilot agent
#     run_metadata.json               — run parameters + timestamps
#
# Activation
# ----------
# Check the "🔒 Opt-In: Security & Quality > codeql-alert-fetcher.yml" box in the
# WEC block of the PR description, then push.  The workflow-execution-gate.yml will
# arm it.  Alternatively, dispatch manually:
#
#   gh workflow run codeql-alert-fetcher.yml \
#       --ref copilot/fix-timeline-structure \
#       -f state=open -f max_pages=10 -f page_sleep_ms=1000

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline stages to execute'
        required: false
        type: choice
        options:
          - collect,autofix,prompt   # full pipeline (recommended default)
          - collect_only             # fetch snapshot artifact only
          - collect,autofix          # fetch + request Copilot Autofix per alert
          - collect,prompt           # fetch + post @copilot fix prompt
          - autofix_only             # re-trigger Copilot Autofix (no fresh collect)
          - prompt_only              # re-post @copilot prompt (no fresh collect)
        default: 'collect,autofix,prompt'
      state:
        description: 'Alert state to fetch (collect stages only)'
        required: false
        type: choice
        options: [open, dismissed, fixed, auto_dismissed]
        default: open
      tool_name:
        description: 'Code-scanning tool filter'
        required: false
        type: string
        default: CodeQL
      max_pages:
        description: 'Max pages (1–100, each page = 100 alerts)'
        required: false
        type: string
        default: '10'
      page_sleep_ms:
        description: 'Sleep between pages (milliseconds, min 500)'
        required: false
        type: string
        default: '1000'
      top_n:
        description: 'Top N alerts in the fixable priority list'
        required: false
        type: string
        default: '30'
      include_dependabot:
        description: 'Include Dependabot alerts in snapshot (collect stages)'
        required: false
        type: boolean
        default: true
      include_secrets:
        description: 'Include secret-scanning alerts in snapshot (collect stages)'
        required: false
        type: boolean
        default: true
      autofix_max_alerts:
        description: 'Max alerts to request Copilot Autofix for (autofix stage)'
        required: false
        type: string
        default: '20'
      pr_number:
        description: 'PR to post @copilot prompt on (prompt stage; empty = create issue)'
        required: false
        type: string
        default: ''

  # Also fires when the WEC gate arms this workflow via repository_dispatch
  repository_dispatch:
    types: [codeql-alert-fetcher]

concurrency:
  group: codeql-alert-fetcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write        # create escalation issues when no PR context
  pull-requests: write # post @copilot comment on triggering PR
  # security-events: read is NOT needed here — CODEX_MASTER_KEY provides it via REST.
  # We explicitly do NOT request security-events on github.token to avoid confusion.

jobs:
  fetch-alerts:
    name: Fetch Security Snapshot → Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Token chain: CODEX_MASTER_KEY required for security_events scope.
      # Falls back to CODEX_BACKUP_KEY; github.token will 403 on code-scanning API.
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Validate token availability
        id: token_check
        run: |
          if [ -z "$CODEX_MASTER_KEY" ]; then
            echo "::warning::CODEX_MASTER_KEY is not set — code-scanning API requires security_events scope."
            echo "::warning::Set the secret and re-run, or use a local shell: GH_TOKEN=\$CODEX_MASTER_KEY python scripts/ci/fetch_codeql_alerts.py"
            echo "token_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "token_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit early (neutral) when no token
        if: steps.token_check.outputs.token_available == 'false'
        run: |
          echo "Skipping fetch — no token with security_events scope available."
          exit 0

      - name: Checkout repository
        if: steps.token_check.outputs.token_available == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          token: ${{ secrets.CODEX_MASTER_KEY || github.token }}

      - name: Set up Python
        if: steps.token_check.outputs.token_available == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          cache: pip
          python-version: '3.12'

      - name: Resolve pipeline stages & fetch parameters
        if: steps.token_check.outputs.token_available == 'true'
        id: params
        env:
          INPUT_PIPELINE:      ${{ github.event.inputs.pipeline || github.event.client_payload.pipeline || 'collect,autofix,prompt' }}
          INPUT_STATE:         ${{ github.event.inputs.state || github.event.client_payload.state || 'open' }}
          INPUT_TOOL:          ${{ github.event.inputs.tool_name || github.event.client_payload.tool_name || 'CodeQL' }}
          INPUT_MAX_PAGES:     ${{ github.event.inputs.max_pages || github.event.client_payload.max_pages || '10' }}
          INPUT_PAGE_SLEEP_MS: ${{ github.event.inputs.page_sleep_ms || github.event.client_payload.page_sleep_ms || '1000' }}
          INPUT_TOP_N:         ${{ github.event.inputs.top_n || github.event.client_payload.top_n || '30' }}
          INPUT_AUTOFIX_MAX:   ${{ github.event.inputs.autofix_max_alerts || github.event.client_payload.autofix_max_alerts || '20' }}
          INPUT_PR_NUMBER:     ${{ github.event.inputs.pr_number || github.event.client_payload.pr_number || '' }}
        run: |
          PIPELINE="${INPUT_PIPELINE:-collect,autofix,prompt}"

          # Derive boolean flags for each stage
          DO_COLLECT="false"
          DO_AUTOFIX="false"
          DO_PROMPT="false"
          case "$PIPELINE" in
            collect_only)            DO_COLLECT="true" ;;
            collect,autofix)         DO_COLLECT="true"; DO_AUTOFIX="true" ;;
            collect,prompt)          DO_COLLECT="true"; DO_PROMPT="true" ;;
            collect,autofix,prompt)  DO_COLLECT="true"; DO_AUTOFIX="true"; DO_PROMPT="true" ;;
            autofix_only)            DO_AUTOFIX="true" ;;
            prompt_only)             DO_PROMPT="true" ;;
            *)                       DO_COLLECT="true"; DO_AUTOFIX="true"; DO_PROMPT="true" ;;
          esac

          STATE="${INPUT_STATE:-open}"
          TOOL="${INPUT_TOOL:-CodeQL}"

          # Clamp max_pages 1–100
          MAX_PAGES="${INPUT_MAX_PAGES:-10}"
          if [ "$MAX_PAGES" -lt 1 ] 2>/dev/null; then MAX_PAGES=1; fi
          if [ "$MAX_PAGES" -gt 100 ] 2>/dev/null; then MAX_PAGES=100; fi

          # Clamp page_sleep_ms ≥ 500
          PAGE_SLEEP_MS="${INPUT_PAGE_SLEEP_MS:-1000}"
          if [ "$PAGE_SLEEP_MS" -lt 500 ] 2>/dev/null; then PAGE_SLEEP_MS=500; fi
          PAGE_SLEEP_SECS=$(echo "scale=3; $PAGE_SLEEP_MS / 1000" | bc)

          TOP_N="${INPUT_TOP_N:-30}"
          AUTOFIX_MAX="${INPUT_AUTOFIX_MAX:-20}"

          echo "pipeline=$PIPELINE"         >> "$GITHUB_OUTPUT"
          echo "do_collect=$DO_COLLECT"     >> "$GITHUB_OUTPUT"
          echo "do_autofix=$DO_AUTOFIX"     >> "$GITHUB_OUTPUT"
          echo "do_prompt=$DO_PROMPT"       >> "$GITHUB_OUTPUT"
          echo "state=$STATE"               >> "$GITHUB_OUTPUT"
          echo "tool=$TOOL"                 >> "$GITHUB_OUTPUT"
          echo "max_pages=$MAX_PAGES"       >> "$GITHUB_OUTPUT"
          echo "page_sleep=$PAGE_SLEEP_SECS" >> "$GITHUB_OUTPUT"
          echo "top_n=$TOP_N"               >> "$GITHUB_OUTPUT"
          echo "autofix_max=$AUTOFIX_MAX"   >> "$GITHUB_OUTPUT"
          echo "pr_number=${INPUT_PR_NUMBER}" >> "$GITHUB_OUTPUT"

          ARTIFACT_NAME="security-snapshot-${{ github.run_id }}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "out_dir=.codex/artifacts/security_snapshot" >> "$GITHUB_OUTPUT"
          echo "codeql_dir=.codex/artifacts/security_snapshot/codeql" >> "$GITHUB_OUTPUT"
          echo "dep_dir=.codex/artifacts/security_snapshot/dependabot" >> "$GITHUB_OUTPUT"
          echo "sec_dir=.codex/artifacts/security_snapshot/secrets" >> "$GITHUB_OUTPUT"
          echo "policy_dir=.codex/artifacts/security_snapshot/policy" >> "$GITHUB_OUTPUT"
          echo "analyses_dir=.codex/artifacts/security_snapshot/analyses" >> "$GITHUB_OUTPUT"

          echo "Parameters resolved:"
          echo "  pipeline=$PIPELINE  (collect=$DO_COLLECT  autofix=$DO_AUTOFIX  prompt=$DO_PROMPT)"
          echo "  state=$STATE  tool=$TOOL  max_pages=$MAX_PAGES"
          echo "  page_sleep_ms=$PAGE_SLEEP_MS  top_n=$TOP_N  autofix_max=$AUTOFIX_MAX"
          echo "  artifact_name=$ARTIFACT_NAME"

      - name: Create output directories
        if: steps.token_check.outputs.token_available == 'true' && steps.params.outputs.do_collect == 'true'
        run: |
          mkdir -p \
            "${{ steps.params.outputs.codeql_dir }}" \
            "${{ steps.params.outputs.dep_dir }}" \
            "${{ steps.params.outputs.sec_dir }}" \
            "${{ steps.params.outputs.policy_dir }}" \
            "${{ steps.params.outputs.analyses_dir }}"

      # ── Restore snapshot cache (skips re-download when same SHA) ──────────
      - name: Restore security snapshot cache
        if: steps.token_check.outputs.token_available == 'true'
        id: cache_restore
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.params.outputs.out_dir }}
          key: security-snapshot-${{ github.repository_id }}-${{ github.sha }}
          restore-keys: |
            security-snapshot-${{ github.repository_id }}-

      # ── CodeQL / code-scanning ──────────────────────────────────────────────
      - name: Fetch CodeQL alerts
        if: >
          steps.token_check.outputs.token_available == 'true' &&
          steps.params.outputs.do_collect == 'true' &&
          steps.cache_restore.outputs.cache-hit != 'true'
        id: fetch_codeql
        run: |
          python scripts/ci/fetch_codeql_alerts.py \
            --state "${{ steps.params.outputs.state }}" \
            --tool "${{ steps.params.outputs.tool }}" \
            --max-pages "${{ steps.params.outputs.max_pages }}" \
            --page-sleep "${{ steps.params.outputs.page_sleep }}" \
            --top-n "${{ steps.params.outputs.top_n }}" \
            --out-dir "${{ steps.params.outputs.codeql_dir }}"
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
          CODEX_API_CACHE_DIR: ${{ runner.temp }}/codex_gh_api_cache
        continue-on-error: true

      - name: Check for rate-limit exhaustion (CodeQL)
        if: >
          steps.token_check.outputs.token_available == 'true' &&
          steps.params.outputs.do_collect == 'true' &&
          steps.cache_restore.outputs.cache-hit != 'true' &&
          steps.fetch_codeql.outcome == 'failure'
        run: |
          echo "::warning::fetch_codeql_alerts.py exited non-zero — possible rate-limit exhaustion."
          echo "::warning::Partial results (if any) are still uploaded."

      # ── Supplemental security data (analyses, Dependabot, secrets, policy) ──
      # Uses fetch_security_snapshot.py which:
      #   • Reads from TTL disk cache in $RUNNER_TEMP/codex_gh_api_cache
      #   • Sleeps when X-RateLimit-Remaining drops below --min-remaining
      #   • Retries 429/403 with Retry-After, network errors with back-off
      - name: Fetch supplemental security data
        if: >
          steps.token_check.outputs.token_available == 'true' &&
          steps.params.outputs.do_collect == 'true' &&
          steps.cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          python scripts/ci/fetch_security_snapshot.py \
            --types dependabot,secrets,policy,analyses \
            --out-dir "${{ steps.params.outputs.out_dir }}" \
            --cache-dir "$RUNNER_TEMP/codex_gh_api_cache" \
            --cache-ttl 3600 \
            --max-pages "${{ steps.params.outputs.max_pages }}" \
            --page-sleep "${{ steps.params.outputs.page_sleep }}" \
            --top-n "${{ steps.params.outputs.top_n }}"
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      # ── Consolidated agent context ──────────────────────────────────────────
      - name: Generate AGENT_SECURITY_CONTEXT.md
        if: >
          steps.token_check.outputs.token_available == 'true' &&
          steps.params.outputs.do_collect == 'true' &&
          steps.cache_restore.outputs.cache-hit != 'true'
        run: |
          python scripts/ci/fetch_security_snapshot.py \
            --types context \
            --out-dir "${{ steps.params.outputs.out_dir }}" \
            --top-n "${{ steps.params.outputs.top_n }}" \
            --no-cache
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      # ── Run metadata ────────────────────────────────────────────────────────
      - name: Write run metadata
        if: steps.token_check.outputs.token_available == 'true' && steps.params.outputs.do_collect == 'true'
        run: |
          OUT_DIR="${{ steps.params.outputs.out_dir }}"
          python3 - <<PYEOF
          import json, os
          from datetime import datetime, timezone
          meta = {
              "run_id": "${{ github.run_id }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "triggered_by": "${{ github.actor }}",
              "ref": "${{ github.ref }}",
              "state": "${{ steps.params.outputs.state }}",
              "tool": "${{ steps.params.outputs.tool }}",
              "max_pages": "${{ steps.params.outputs.max_pages }}",
              "page_sleep_secs": "${{ steps.params.outputs.page_sleep }}",
              "top_n": "${{ steps.params.outputs.top_n }}",
              "pipeline": "${{ steps.params.outputs.pipeline }}",
              "cache_hit": "${{ steps.cache_restore.outputs.cache-hit }}",
              "includes_dependabot": True,
              "includes_secrets": True,
              "includes_policy": True,
              "includes_analyses": True,
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%MZ"),
          }
          out = os.path.join("$OUT_DIR", "run_metadata.json")
          with open(out, "w") as f:
              json.dump(meta, f, indent=2)
          print("Run metadata written.")
          PYEOF

      # ── Upload artifact ─────────────────────────────────────────────────────
      - name: Upload security snapshot artifact
        if: steps.token_check.outputs.token_available == 'true' && steps.params.outputs.do_collect == 'true' && always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ steps.params.outputs.artifact_name }}
          path: ${{ steps.params.outputs.out_dir }}/
          retention-days: 90
          if-no-files-found: warn

      # ── Save snapshot cache (so autofix_only / prompt_only can reuse) ───────
      - name: Save security snapshot cache
        if: >
          steps.token_check.outputs.token_available == 'true' &&
          steps.params.outputs.do_collect == 'true' &&
          steps.cache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.params.outputs.out_dir }}
          key: security-snapshot-${{ github.repository_id }}-${{ github.sha }}

      # ── Stage: autofix ───────────────────────────────────────────────────────
      # Requests GitHub Copilot Autofix for each open CodeQL alert that is at
      # critical/error/high severity and hasn't been requested in a prior run.
      # Skips alerts recorded in autofix/state.json (persisted across runs via cache).
      - name: Restore autofix state cache
        if: steps.token_check.outputs.token_available == 'true' && steps.params.outputs.do_autofix == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.params.outputs.out_dir }}/autofix
          key: autofix-state-${{ github.repository_id }}-${{ github.sha }}
          restore-keys: |
            autofix-state-${{ github.repository_id }}-

      - name: Request Copilot Autofixes
        if: steps.token_check.outputs.token_available == 'true' && steps.params.outputs.do_autofix == 'true'
        id: autofix
        continue-on-error: true
        run: |
          python scripts/ci/fetch_security_snapshot.py \
            --types autofix \
            --out-dir "${{ steps.params.outputs.out_dir }}" \
            --cache-dir "$RUNNER_TEMP/codex_gh_api_cache" \
            --cache-ttl 3600 \
            --autofix-max "${{ steps.params.outputs.autofix_max }}" \
            --autofix-severities "critical,error,high" \
            --autofix-inter-sleep 2.0 \
            --page-sleep "${{ steps.params.outputs.page_sleep }}"
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}

      - name: Save autofix state cache
        if: steps.token_check.outputs.token_available == 'true' && steps.params.outputs.do_autofix == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.params.outputs.out_dir }}/autofix
          key: autofix-state-${{ github.repository_id }}-${{ github.sha }}

      # ── Stage: prompt ────────────────────────────────────────────────────────
      # Posts a structured @copilot prompt to the triggering PR (upsert via
      # magic comment sentinel) so the agent can begin remediation immediately.
      # When no PR context exists, creates a labelled GitHub issue instead.
      - name: Post @copilot fix prompt
        if: steps.token_check.outputs.token_available == 'true' && steps.params.outputs.do_prompt == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ steps.params.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          OUT_DIR: ${{ steps.params.outputs.out_dir }}
          ARTIFACT_NAME: ${{ steps.params.outputs.artifact_name }}
          TOP_N: ${{ steps.params.outputs.top_n }}
        run: |
          set -euo pipefail

          CONTEXT_FILE="${OUT_DIR}/AGENT_SECURITY_CONTEXT.md"
          CODEQL_FILE="${OUT_DIR}/codeql/alerts_fixable.md"

          # Build the @copilot prompt body
          PROMPT_BODY=$(python3 - <<'PYEOF'
          import os, json
          from pathlib import Path
          from datetime import datetime, timezone

          out_dir   = Path(os.environ["OUT_DIR"])
          repo      = os.environ["REPO"]
          run_id    = os.environ["RUN_ID"]
          artifact  = os.environ["ARTIFACT_NAME"]
          top_n     = os.environ.get("TOP_N", "30")
          run_url   = f"https://github.com/{repo}/actions/runs/{run_id}"
          now       = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%MZ")

          def load_json(p, default=None):
              try: return json.loads(Path(p).read_text())
              except Exception: return default or {}

          codeql_s  = load_json(out_dir / "codeql/alerts_summary.json")
          dep_s     = load_json(out_dir / "dependabot/summary.json")
          sec_s     = load_json(out_dir / "secrets/summary.json")
          autofix_r = load_json(out_dir / "autofix/results.json", [])
          autofix_ok = [r for r in autofix_r if r.get("autofix_status") not in ("unsupported","not_found")]

          lines = [
              "<!-- codex-security-prompt -->",
              "@copilot Please remediate the security and code quality issues listed below.",
              "This prompt was generated automatically by the **🔍 CodeQL Alert Fetcher** workflow.",
              "",
              f"**Snapshot:** [{run_id}]({run_url}) | **Generated:** {now}",
              "",
              "---",
              "",
              "## 📋 Summary",
              "",
              f"| Area | Count |",
              f"|------|-------|",
              f"| CodeQL alerts | {codeql_s.get('total','?')} |",
              f"| Dependabot vulnerabilities | {dep_s.get('total','?')} ({dep_s.get('by_severity',{}).get('critical',0)} critical) |",
              f"| Secret scanning | {sec_s.get('total','?')} ({sec_s.get('active_confirmed',0)} active) |",
          ]
          if autofix_ok:
              lines += [
                  f"| Copilot Autofix requested | {len(autofix_ok)} alerts |",
              ]
          lines += [
              "",
              "## 🎯 Immediate Actions Required",
              "",
              "1. **Download the security snapshot artifact** from the run above.",
              f"2. **Open `AGENT_SECURITY_CONTEXT.md`** — full priority breakdown.",
              f"3. **Open `codeql/alerts_fixable.md`** — top-{top_n} prioritised CodeQL fixes with file:line locations.",
              f"4. **Open `dependabot/alerts_critical.json`** — packages to upgrade.",
              f"5. **Open `secrets/alerts_active.json`** — secrets to revoke immediately.",
          ]
          if autofix_ok:
              lines += [
                  "",
                  f"6. **Check the Security tab** for {len(autofix_ok)} Copilot Autofix suggestion(s) — review and commit.",
              ]
          lines += [
              "",
              "## 🔧 Fix Priority Order",
              "",
              "Follow the order in `codeql/alerts_fixable.md`. For each alert:",
              "  a. Read the rule_id and message for context",
              "  b. Apply the fix in the target file",
              "  c. Run `ruff check --fix` + `pre-commit run --files <changed>`",
              "  d. Commit with message: `fix(security): <rule_id> in <file>`",
              "",
              f"**Reference:** `docs/reference/SECURITY_API_REFERENCE.md` has per-rule fix patterns.",
              "",
              "> This prompt was auto-posted by the CodeQL Alert Fetcher workflow. Reply or update the checklist to re-trigger.",
          ]
          print("\n".join(lines))
          PYEOF
          )

          SENTINEL="<!-- codex-security-prompt -->"

          post_or_upsert_pr_comment() {
            local PR="$1"
            # Check for existing sentinel comment
            EXISTING_ID=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"${SENTINEL}\")) | .id" \
              2>/dev/null | head -1 || true)

            if [ -n "$EXISTING_ID" ]; then
              echo "Updating existing prompt comment #${EXISTING_ID} on PR #${PR}…"
              gh api "repos/${REPO}/issues/comments/${EXISTING_ID}" \
                -X PATCH -f body="$PROMPT_BODY"
            else
              echo "Posting new prompt comment on PR #${PR}…"
              gh pr comment "$PR" --repo "$REPO" --body "$PROMPT_BODY"
            fi
          }

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "0" ]; then
            echo "Posting @copilot prompt to PR #${PR_NUMBER}…"
            post_or_upsert_pr_comment "$PR_NUMBER"
          else
            # Try to find an open PR for the current branch
            HEAD_BRANCH="${GITHUB_REF_NAME:-}"
            AUTO_PR=""
            if [ -n "$HEAD_BRANCH" ]; then
              AUTO_PR=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
                --json number --jq '.[0].number' 2>/dev/null || true)
            fi

            if [ -n "$AUTO_PR" ] && [ "$AUTO_PR" != "null" ]; then
              echo "Auto-detected PR #${AUTO_PR} for branch ${HEAD_BRANCH}."
              post_or_upsert_pr_comment "$AUTO_PR"
            else
              # No PR — create a labelled issue instead
              echo "No PR context found — creating GitHub issue…"
              ISSUE_TITLE="🔍 Security Snapshot: $(date -u +%Y-%m-%d) — Action Required"
              gh issue create \
                --repo "$REPO" \
                --title "$ISSUE_TITLE" \
                --body "$PROMPT_BODY" \
                --label "security,copilot" 2>/dev/null || \
              gh issue create \
                --repo "$REPO" \
                --title "$ISSUE_TITLE" \
                --body "$PROMPT_BODY" || \
              echo "::warning::Could not create issue — label may not exist. Prompt body logged above."
            fi
          fi

      - name: Print download instructions
        if: steps.token_check.outputs.token_available == 'true' && always()
        run: |
          echo ""
          echo "================================================================"
          echo "  Security Snapshot Artifact Ready"
          echo "================================================================"
          echo "  Artifact : ${{ steps.params.outputs.artifact_name }}"
          echo "  Pipeline : ${{ steps.params.outputs.pipeline }}"
          echo "  Cache hit: ${{ steps.cache_restore.outputs.cache-hit }}"
          echo "  Run URL  : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "  To review in-session (Copilot MCP tools):"
          echo ""
          echo "  1. github-mcp-server-actions_list"
          echo "       method=list_workflow_run_artifacts"
          echo "       resource_id=${{ github.run_id }}"
          echo ""
          echo "  2. github-mcp-server-actions_get"
          echo "       method=download_workflow_run_artifact"
          echo "       resource_id=<ARTIFACT_ID from step 1>"
          echo ""
          echo "  3. Start with AGENT_SECURITY_CONTEXT.md for the full picture."
          echo "     Then open codeql/alerts_fixable.md for actionable fix list."
          echo "================================================================"

