name: "📚 Documentation Freshness Check"
# aais-cache: none  # Python referenced in template/doc strings only — no pip install

# Warns when docs in key directories have date headers older than threshold.
# P0 docs (admin, agent): 60-day threshold (CRITICAL)
# P1 docs (ops, ci, mcp): 90-day threshold (IMPORTANT)
# Non-blocking (warning only) — never fails a PR over stale informational docs.
# Runs on push to main and weekly schedule. Generates PR comments for stale docs.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      cutoff_days_p0:
        description: "Days before today to consider P0 docs stale (default: 60)"
        required: false
        default: "60"
        type: string
      cutoff_days_p1:
        description: "Days before today to consider P1 docs stale (default: 90)"
        required: false
        default: "90"
        type: string


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness-audit:
    name: "📚 Doc Freshness Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7 # v6.0.3

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v6 # v6
        with:
          python-version: "3.12.13"
          # No pip cache: script uses stdlib only

      - name: "📊 Calculate cutoff dates"
        id: cutoff
        run: |
          DAYS_P0="${{ inputs.cutoff_days_p0 || '60' }}"
          DAYS_P1="${{ inputs.cutoff_days_p1 || '90' }}"
          CUTOFF_P0=$(date -d "-${DAYS_P0} days" +%Y-%m-%d)
          CUTOFF_P1=$(date -d "-${DAYS_P1} days" +%Y-%m-%d)
          echo "cutoff_p0=${CUTOFF_P0}" >> "$GITHUB_OUTPUT"
          echo "cutoff_p1=${CUTOFF_P1}" >> "$GITHUB_OUTPUT"
          echo "🔍 P0 threshold (60 days): ${CUTOFF_P0}"
          echo "🔍 P1 threshold (90 days): ${CUTOFF_P1}"

      - name: "🔍 Check critical docs (P0 — admin, agent) [60-day threshold]"
        id: check_p0
        run: |
          python3 scripts/ci/update_doc_freshness.py \
            --dirs docs/admin docs/agent docs/how-to \
            --cutoff "${{ steps.cutoff.outputs.cutoff_p0 }}" \
            --check-only 2>&1 | tee /tmp/p0_stale.txt
          echo "stale_count=$(grep -c '^STALE:' /tmp/p0_stale.txt || true)" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: "🔍 Check developer docs (P1 — ops, ci, mcp) [90-day threshold]"
        id: check_p1
        run: |
          python3 scripts/ci/update_doc_freshness.py \
            --dirs docs/ops docs/ci docs/mcp \
            --cutoff "${{ steps.cutoff.outputs.cutoff_p1 }}" \
            --check-only 2>&1 | tee /tmp/p1_stale.txt
          echo "stale_count=$(grep -c '^STALE:' /tmp/p1_stale.txt || true)" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: "📋 Job Summary"
        if: always()
        run: |
          {
            echo "## 📚 Documentation Freshness Audit"
            echo ""
            echo "**P0 Threshold (Critical):** ${{ steps.cutoff.outputs.cutoff_p0 }} (60 days ago)"
            echo "**P1 Threshold (Important):** ${{ steps.cutoff.outputs.cutoff_p1 }} (90 days ago)"
            echo ""
            P0_COUNT="${{ steps.check_p0.outputs.stale_count || 0 }}"
            P1_COUNT="${{ steps.check_p1.outputs.stale_count || 0 }}"
            TOTAL=$((P0_COUNT + P1_COUNT))
            if [ "$TOTAL" -eq 0 ]; then
              echo "✅ **All critical docs are fresh** — no docs older than threshold found."
            else
              echo "⚠️  **${TOTAL} stale doc(s) found** (non-blocking warning)."
              echo ""
              echo "### P0 — Admin/Agent Docs ($P0_COUNT stale)"
              cat /tmp/p0_stale.txt || true
              echo ""
              echo "### P1 — Ops/CI/MCP Docs ($P1_COUNT stale)"
              cat /tmp/p1_stale.txt || true
              echo ""
              echo "**To update:** \`python3 scripts/ci/update_doc_freshness.py --dirs docs/admin --cutoff $(date -d '-60 days' +%Y-%m-%d)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "📣 Emit warning annotation (non-blocking)"
        if: steps.check_p0.outputs.stale_count != '0'
        run: |
          echo "::warning title=Stale Docs Detected::${{ steps.check_p0.outputs.stale_count }} admin/agent docs are older than 60 days. Run: python3 scripts/ci/update_doc_freshness.py --dirs docs/admin docs/agent --cutoff ${{ steps.cutoff.outputs.cutoff_p0 }}"

      - name: "💬 Generate PR comment for stale docs"
        if: github.event_name == 'pull_request' && (steps.check_p0.outputs.stale_count != '0' || steps.check_p1.outputs.stale_count != '0')
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const P0_COUNT = parseInt("${{ steps.check_p0.outputs.stale_count || 0 }}");
            const P1_COUNT = parseInt("${{ steps.check_p1.outputs.stale_count || 0 }}");

            let body = "## 📚 Documentation Freshness Alert\n\n";
            if (P0_COUNT > 0) {
              body += `⚠️ **${P0_COUNT} P0 doc(s) are stale** (not updated in 60 days)\n\n`;
            }
            if (P1_COUNT > 0) {
              body += `⚠️ **${P1_COUNT} P1 doc(s) are stale** (not updated in 90 days)\n\n`;
            }
            body += "### 🔧 Stale Documents\n";
            body += "```\n";

            const fs = require('fs');
            if (fs.existsSync('/tmp/p0_stale.txt')) {
              body += fs.readFileSync('/tmp/p0_stale.txt', 'utf8');
            }
            if (fs.existsSync('/tmp/p1_stale.txt')) {
              body += fs.readFileSync('/tmp/p1_stale.txt', 'utf8');
            }
            body += "```\n\n";
            body += "### 🔗 Related\n";
            body += "- Update script: `scripts/ci/update_doc_freshness.py`\n";
            body += "- [Documentation Freshness Policy](https://github.com/Aries-Serpent/_codex_/blob/main/docs/admin/)\n";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
