name: "📚 Documentation Freshness Check"
# aais-cache: none  # Python referenced in template/doc strings only — no pip install

# Warns when docs in key directories have date headers older than 90 days.
# Non-blocking (warning only) — never fails a PR over stale informational docs.
# Runs on push to main and weekly schedule.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC
  workflow_dispatch:
    inputs:
      cutoff_days:
        description: "Days before today to consider stale (default: 90)"
        required: false
        default: "90"
        type: string

concurrency:
  group: doc-freshness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness-audit:
    name: "📚 Doc Freshness Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: "🐍 Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          # No pip cache: script uses stdlib only

      - name: "📊 Calculate cutoff date"
        id: cutoff
        run: |
          DAYS="${{ inputs.cutoff_days || '90' }}"
          CUTOFF=$(date -d "-${DAYS} days" +%Y-%m-%d)
          echo "cutoff=${CUTOFF}" >> "$GITHUB_OUTPUT"
          echo "Checking for docs not updated since: ${CUTOFF}"

      - name: "🔍 Check critical docs (P0 — admin, agent)"
        id: check_p0
        run: |
          python3 scripts/ci/update_doc_freshness.py \
            --dirs docs/admin docs/agent docs/how-to \
            --cutoff "${{ steps.cutoff.outputs.cutoff }}" \
            --check-only 2>&1 | tee /tmp/p0_stale.txt
          echo "stale_count=$(grep -c '^STALE:' /tmp/p0_stale.txt || true)" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: "🔍 Check developer docs (P1 — ops, ci, mcp)"
        id: check_p1
        run: |
          python3 scripts/ci/update_doc_freshness.py \
            --dirs docs/ops docs/ci docs/mcp \
            --cutoff "${{ steps.cutoff.outputs.cutoff }}" \
            --check-only 2>&1 | tee /tmp/p1_stale.txt
          echo "stale_count=$(grep -c '^STALE:' /tmp/p1_stale.txt || true)" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: "📋 Job Summary"
        if: always()
        run: |
          {
            echo "## 📚 Documentation Freshness Audit"
            echo ""
            echo "**Cutoff:** ${{ steps.cutoff.outputs.cutoff }} (90 days ago)"
            echo ""
            P0_COUNT="${{ steps.check_p0.outputs.stale_count || 0 }}"
            P1_COUNT="${{ steps.check_p1.outputs.stale_count || 0 }}"
            TOTAL=$((P0_COUNT + P1_COUNT))
            if [ "$TOTAL" -eq 0 ]; then
              echo "✅ **All critical docs are fresh** — no docs older than 90 days found."
            else
              echo "⚠️  **${TOTAL} stale doc(s) found** (non-blocking warning)."
              echo ""
              echo "### P0 — Admin/Agent Docs ($P0_COUNT stale)"
              cat /tmp/p0_stale.txt || true
              echo ""
              echo "### P1 — Ops/CI/MCP Docs ($P1_COUNT stale)"
              cat /tmp/p1_stale.txt || true
              echo ""
              echo "**To update:** \`python3 scripts/ci/update_doc_freshness.py --dirs docs/admin --cutoff $(date -d '-90 days' +%Y-%m-%d)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "📣 Emit warning annotation (non-blocking)"
        if: steps.check_p0.outputs.stale_count != '0'
        run: |
          echo "::warning title=Stale Docs Detected::${{ steps.check_p0.outputs.stale_count }} admin/agent docs are older than 90 days. Run: python3 scripts/ci/update_doc_freshness.py --dirs docs/admin docs/agent --cutoff ${{ steps.cutoff.outputs.cutoff }}"
