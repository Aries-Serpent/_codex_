name: Documentation Freshness Check
true:
  schedule:
  - cron: 0 9 1 * *
  workflow_dispatch: null
permissions:
  contents: read
  issues: write
jobs:
  check-freshness:
    name: Check Documentation Freshness
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Run doc freshness validation
      run: "python3 << 'PYTHON_EOF'\nimport json\nimport datetime\nfrom pathlib import\
        \ Path\n\n# Load ownership registry\nregistry_path = Path('.codex/DOC_OWNERSHIP_REGISTRY.json')\n\
        if not registry_path.exists():\n    print(\"❌ DOC_OWNERSHIP_REGISTRY.json\
        \ not found\")\n    exit(1)\n\nwith open(registry_path) as f:\n    registry\
        \ = json.load(f)\n\ntoday = datetime.date.today()\nstale_docs = []\n\n# Check\
        \ critical docs\ncritical_docs = registry.get('root_level_documentation',\
        \ {})\nfor doc_path, info in critical_docs.items():\n    if not Path(doc_path).exists():\n\
        \        print(f\"⚠️  Missing: {doc_path}\")\n        continue\n\n    last_reviewed\
        \ = datetime.date.fromisoformat(info.get('last_reviewed', '2020-01-01'))\n\
        \    days_old = (today - last_reviewed).days\n    sla_days = info.get('sla_days',\
        \ 90)\n\n    if days_old > sla_days:\n        stale_docs.append({\n      \
        \      'file': doc_path,\n            'owner': info.get('owner'),\n      \
        \      'days_old': days_old,\n            'sla': sla_days\n        })\n\n\
        if stale_docs:\n    print(f\"\\n⚠️  Found {len(stale_docs)} stale critical\
        \ documentation files:\")\n    for doc in stale_docs:\n        print(f\" \
        \ - {doc['file']}: {doc['days_old']} days old (SLA: {doc['sla']} days)\")\n\
        \        print(f\"    Owner: {doc['owner']}\")\n\n    # Would create GitHub\
        \ issue here in real implementation\nelse:\n    print(\"✅ All critical documentation\
        \ is fresh!\")\n\nPYTHON_EOF\n"
    - if: always()
      name: Report results
      run: 'echo "Documentation Freshness Check Complete"

        echo "See .codex/DOC_OWNERSHIP_REGISTRY.json for ownership and SLA details"

        '
    timeout-minutes: 30
