name: CI Health Monitor
true:
  schedule:
  - cron: 0 */6 * * *
  workflow_dispatch: null
  push:
    branches:
    - main
    - copilot/**
    paths:
    - .github/workflows/**
    - scripts/validate_ci_health.sh
    - scripts/catalog_workflows.py
    - scripts/ci/collect_telemetry.py
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install requests

        pip install -e . --quiet 2>/dev/null || echo "Package install skipped"

        '
    - name: Collect telemetry and classify failures
      id: telemetry
      env:
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          secrets.GITHUB_TOKEN }}
      run: "python scripts/ci/collect_telemetry.py \\\n  --owner Aries-Serpent \\\n\
        \  --repo _codex_ \\\n  --branch main \\\n  --days 7 \\\n  --output /tmp/telemetry_report.json\
        \ \\\n  --token \"$GITHUB_TOKEN\" || {\n    echo \"::warning::Telemetry collection\
        \ failed \u2014 check token permissions\"\n    echo '{\"summary\":{\"total_runs\"\
        :0,\"failed_runs\":0,\"failure_rate\":0},\"pattern_distribution\":{}}' > /tmp/telemetry_report.json\n\
        \  }\n\n# Extract metrics via base64-encoded script.\n# NOTE: base64 encoding\
        \ is required here because GitHub Actions YAML cannot\n# handle multi-line\
        \ python3 -c strings or << 'EOF' heredocs inside run: | blocks\n# (the <<\
        \ sequence is a YAML merge key at column 0; embedded quotes break parsing).\n\
        # Fix (S145): previous version used chr(34)+\"key\"+chr(34) lookups which\
        \ embedded\n# literal quote characters into the dict key, so failed_runs/total_runs\
        \ always\n# returned 0 while failure_rate was computed correctly. Replaced\
        \ with plain string keys.\nMETRICS=$(echo ''\
        \ | base64 -d | python3) || METRICS='FAILURE_RATE=0\\nFAILED_RUNS=0\\nTOTAL_RUNS=0'\
        \  # pragma: allowlist secret\neval \"$(echo -e \"$METRICS\")\"\n\n\necho\
        \ \"failure_rate=${FAILURE_RATE}\" >> \"$GITHUB_OUTPUT\"\necho \"failed_runs=${FAILED_RUNS}\"\
        \   >> \"$GITHUB_OUTPUT\"\necho \"total_runs=${TOTAL_RUNS}\"     >> \"$GITHUB_OUTPUT\"\
        \n\n# Threshold: alert if failure rate exceeds CODEX_CI_FAILURE_THRESHOLD.\n\
        # Wired to repo variable (P2.3); falls back to 10% (degraded level) if unset.\n\
        # Cascade suppression (issue #3669): when >50% of failures are classified\
        \ as\n# 'self-healing' (a cascade from iterative-self-healing-ci.yml), the\
        \ raw\n# failure rate is inflated by automated remediation runs \u2014 NOT\
        \ real regressions.\n# In that case we double the effective threshold to avoid\
        \ false-positive alerts.\nTHRESHOLD=\"${{ vars.CODEX_CI_FAILURE_THRESHOLD\
        \ || '10' }}\"\n# Read cascade_detected from telemetry JSON.\n# One-liner\
        \ kept intentionally compact: reads a single nested boolean key and\n# prints\
        \ 'true'/'false'. Failure-safe: falls back to 'false' on any error so\n# the\
        \ threshold check always runs. Logic: d['cascade_analysis']['cascade_detected'].\n\
        CASCADE_DETECTED=$(python3 -c \"import json,sys;d=json.load(open('/tmp/telemetry_report.json'));print('true'\
        \ if d.get('cascade_analysis',{}).get('cascade_detected',False) else 'false')\"\
        \ 2>/dev/null || echo 'false')\necho \"cascade_detected=${CASCADE_DETECTED}\"\
        \ >> \"$GITHUB_OUTPUT\"\nif [ \"${CASCADE_DETECTED}\" = \"true\" ]; then\n\
        \  # Use 2\xD7 threshold for cascade runs \u2014 they are expected self-healing\
        \ overhead\n  EFFECTIVE_THRESHOLD=$(python3 -c \"print(float('${THRESHOLD}')\
        \ * 2)\" 2>/dev/null || echo \"${THRESHOLD}\")\n  echo \"::notice::Self-healing\
        \ cascade detected \u2014 using effective threshold ${EFFECTIVE_THRESHOLD}%\
        \ (2\xD7 base ${THRESHOLD}%)\"\nelse\n  EFFECTIVE_THRESHOLD=\"${THRESHOLD}\"\
        \nfi\nif python3 -c \"import sys; sys.exit(0 if float('${FAILURE_RATE}') >\
        \ float('${EFFECTIVE_THRESHOLD}') else 1)\"; then\n  echo \"alert_required=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"::warning::CI failure rate ${FAILURE_RATE}%\
        \ exceeds effective threshold ${EFFECTIVE_THRESHOLD}% (cascade=${CASCADE_DETECTED})\"\
        \nelse\n  echo \"alert_required=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Write job summary
      if: always()
      run: "FAILURE_RATE=\"${{ steps.telemetry.outputs.failure_rate }}\"\nFAILED_RUNS=\"\
        ${{ steps.telemetry.outputs.failed_runs }}\"\nTOTAL_RUNS=\"${{ steps.telemetry.outputs.total_runs\
        \ }}\"\nALERT=\"${{ steps.telemetry.outputs.alert_required }}\"\n\necho \"\
        ## \U0001F3E5 CI Health Monitor Report\" >> \"$GITHUB_STEP_SUMMARY\"\necho\
        \ \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"**Report date:** $(date -u '+%Y-%m-%d\
        \ %H:%M UTC')\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"### Summary\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"| Metric | Value |\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"|--------|-------|\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"| Total Runs (7d) | ${TOTAL_RUNS} |\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"| Failed Runs | ${FAILED_RUNS} |\" >>\
        \ \"$GITHUB_STEP_SUMMARY\"\necho \"| Failure Rate | ${FAILURE_RATE}% |\" >>\
        \ \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\nif [\
        \ \"$ALERT\" = \"true\" ]; then\n  THRESHOLD=\"${{ vars.CODEX_CI_FAILURE_THRESHOLD\
        \ || '10' }}\"\n  echo \"### \u26A0\uFE0F Alert: Failure rate exceeds ${THRESHOLD}%\
        \ threshold\" >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"### \u2705 Health:\
        \ Failure rate within acceptable range\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n\
        \necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"### Pattern Distribution\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\n\npython3\
        \ - <<'PYEOF'\nimport json, os\ntry:\n    with open('/tmp/telemetry_report.json')\
        \ as f:\n        d = json.load(f)\n    dist = d.get('pattern_distribution',\
        \ {})\n    if dist:\n        with open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as s:\n            s.write(\"| Pattern | Count |\\n\")\n          \
        \  s.write(\"|---------|-------|\\n\")\n            for pat, cnt in sorted(dist.items(),\
        \ key=lambda x: x[1], reverse=True):\n                s.write(f\"| {pat} |\
        \ {cnt} |\\n\")\n    else:\n        with open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as s:\n            s.write(\"_No failures detected or telemetry unavailable._\\\
        n\")\nexcept Exception as e:\n    pass\nPYEOF\n"
    - name: Create alert issue if failure rate is critical
      if: steps.telemetry.outputs.alert_required == 'true'
      uses: actions/github-script@v8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: "const failureRate    = '${{ steps.telemetry.outputs.failure_rate\
          \ }}';\nconst failedRuns     = '${{ steps.telemetry.outputs.failed_runs\
          \ }}';\nconst totalRuns      = '${{ steps.telemetry.outputs.total_runs }}';\n\
          const cascadeDetected = '${{ steps.telemetry.outputs.cascade_detected }}'\
          \ === 'true';\n\n// Load pattern distribution and cascade analysis from\
          \ telemetry report\nconst fs = require('fs');\nlet patternTable = '';\n\
          let cascadeSection = '';\ntry {\n  const report = JSON.parse(fs.readFileSync('/tmp/telemetry_report.json',\
          \ 'utf8'));\n  const dist   = report.pattern_distribution || {};\n  const\
          \ rows   = Object.entries(dist)\n    .sort((a, b) => b[1] - a[1])\n    .map(([pat,\
          \ cnt]) => `| ${pat} | ${cnt} |`)\n    .join('\\n');\n  patternTable = rows\n\
          \    ? `| Pattern | Count |\\n|---------|-------|\\n${rows}`\n    : '_No\
          \ patterns detected._';\n\n  // Include cascade analysis when detected (issue\
          \ #3669 fix)\n  const ca = report.cascade_analysis || {};\n  if (ca.cascade_detected)\
          \ {\n    cascadeSection = [\n      '',\n      '### \u26A0\uFE0F Self-Healing\
          \ Cascade Detected',\n      '',\n      `Self-healing failures account for\
          \ **${(ca.cascade_rate * 100).toFixed(1)}%** ` +\n      `of all failures\
          \ (${ca.self_healing_count}/${ca.total_failures}).`,\n      '',\n      '**Root\
          \ Cause:**',\n      ca.root_cause || '_Unknown_',\n      '',\n      '**Recommended\
          \ Action:**',\n      ca.recommended_action || '_See .codex/patterns/ci_failure_patterns.yaml_',\n\
          \      '',\n      '> Note: The effective alert threshold was doubled to\
          \ 2\xD7 base because',\n      '> a cascade was active. The rate still exceeded\
          \ this elevated threshold.',\n    ].join('\\n');\n  }\n} catch(e) {\n  patternTable\
          \ = '_Pattern data unavailable._';\n}\n\n// Dedup: skip if an open alert\
          \ issue was created in the last 24h\nconst since = new Date(Date.now() -\
          \ 24 * 60 * 60 * 1000).toISOString();\nconst { data: issues } = await github.rest.issues.listForRepo({\n\
          \  owner: context.repo.owner,\n  repo:  context.repo.repo,\n  state: 'open',\n\
          \  labels: 'ci-health-alert',\n  since,\n});\nif (issues.length > 0) {\n\
          \  core.info(`Skipping issue creation \u2014 open alert issue #${issues[0].number}\
          \ already exists.`);\n  return;\n}\n\nconst body = [\n  '## \U0001F6A8 CI\
          \ Health Alert',\n  '',\n  'Telemetry analysis for the past 7 days has detected\
          \ concerning patterns.',\n  '',\n  '### Summary',\n  '',\n  `- **Total Runs:**\
          \ ${totalRuns}`,\n  `- **Failed Runs:** ${failedRuns}`,\n  `- **Failure\
          \ Rate:** ${failureRate}%`,\n  '',\n  '### Pattern Distribution',\n  '',\n\
          \  patternTable,\n  cascadeSection,\n  '',\n  '### Recommended Actions',\n\
          \  '',\n  '- \u26A0\uFE0F **Critical:** Failure rate exceeds threshold -\
          \ immediate investigation required',\n  '',\n  `**Report:** Telemetry collected\
          \ on ${new Date().toISOString().slice(0, 10)}`,\n].join('\\n');\n\nconst\
          \ { data: issue } = await github.rest.issues.create({\n  owner:  context.repo.owner,\n\
          \  repo:   context.repo.repo,\n  title:  `CI Health Alert: High Failure\
          \ Rate Detected`,\n  body,\n  labels: ['ci-health-alert'],\n});\ncore.info(`Created\
          \ alert issue #${issue.number}: ${issue.html_url}`);\n"
    - name: Update CODEX_CI_FAILURE_RATE repo variable
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
        FAILURE_RATE: ${{ steps.telemetry.outputs.failure_rate }}
        CODEX_CI_FAILURE_THRESHOLD: ${{ vars.CODEX_CI_FAILURE_THRESHOLD || '10' }}
      run: "# Sprint 1: auto-update repo variable with current failure rate so\n#\
        \ agents and dashboards always see a fresh value without re-running telemetry.\n\
        # Thresholds wired to CODEX_CI_FAILURE_THRESHOLD (P2.3):\n#   degraded : rate\
        \ >= THRESHOLD\n#   critical : rate >= 2 * THRESHOLD\nRATE=\"${FAILURE_RATE:-0}\"\
        \nTHRESHOLD=\"${CODEX_CI_FAILURE_THRESHOLD:-10}\"\nSTATUS=\"ok\"\nif python3\
        \ -c \"import sys; sys.exit(0 if float('${RATE}') >= float('${THRESHOLD}')\
        \ * 2 else 1)\" 2>/dev/null; then\n  STATUS=\"critical\"\nelif python3 -c\
        \ \"import sys; sys.exit(0 if float('${RATE}') >= float('${THRESHOLD}') else\
        \ 1)\" 2>/dev/null; then\n  STATUS=\"degraded\"\nfi\n# Store rate and status\
        \ together so dashboards get both in one variable.\nVALUE=\"${RATE}:${STATUS}\"\
        \nPAYLOAD=\"{\\\"value\\\":\\\"${VALUE}\\\"}\"\n# Try PATCH (update existing)\
        \ then POST (create new) as fallback\nHTTP_STATUS=$(curl -s -o /dev/null -w\
        \ \"%{http_code}\" \\\n  -X PATCH \\\n  -H \"Authorization: Bearer ${GH_TOKEN}\"\
        \ \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/Aries-Serpent/_codex_/actions/variables/CODEX_CI_FAILURE_RATE\"\
        \ \\\n  -d \"${PAYLOAD}\" 2>/dev/null) || HTTP_STATUS=0\nif [ \"${HTTP_STATUS}\"\
        \ = \"404\" ]; then\n  curl -s -X POST \\\n    -H \"Authorization: Bearer\
        \ ${GH_TOKEN}\" \\\n    -H \"Accept: application/vnd.github+json\" \\\n  \
        \  \"https://api.github.com/repos/Aries-Serpent/_codex_/actions/variables\"\
        \ \\\n    -d \"{\\\"name\\\":\\\"CODEX_CI_FAILURE_RATE\\\",\\\"value\\\":\\\
        \"${VALUE}\\\"}\" \\\n    > /dev/null 2>&1 || true\nfi\necho \"CODEX_CI_FAILURE_RATE\
        \ updated to ${RATE}% (status=${STATUS}, http=${HTTP_STATUS})\"\n"
    - name: Write CODEX_CI_LAST_GREEN_SHA when CI is healthy
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
        FAILURE_RATE: ${{ steps.telemetry.outputs.failure_rate }}
        CODEX_CI_FAILURE_THRESHOLD: ${{ vars.CODEX_CI_FAILURE_THRESHOLD || '10' }}
      run: "# P2.6: write CODEX_CI_LAST_GREEN_SHA when failure rate is below threshold.\n\
        # Enables bisect commands: git bisect good \"$CODEX_CI_LAST_GREEN_SHA\"\n\
        RATE=\"${FAILURE_RATE:-0}\"\nTHRESHOLD=\"${CODEX_CI_FAILURE_THRESHOLD:-10}\"\
        \nif python3 -c \"import sys; sys.exit(0 if float('${RATE}') < float('${THRESHOLD}')\
        \ else 1)\" 2>/dev/null; then\n  SHA=\"${{ github.sha }}\"\n  # SHA is always\
        \ a 40-char hex string from github.sha \u2014 safe to embed in JSON.\n  PAYLOAD=\"\
        {\\\"value\\\":\\\"${SHA}\\\"}\"\n  HTTP_STATUS=$(curl -s -o /dev/null -w\
        \ \"%{http_code}\" \\\n    -X PATCH \\\n    -H \"Authorization: Bearer ${GH_TOKEN}\"\
        \ \\\n    -H \"Accept: application/vnd.github+json\" \\\n    \"https://api.github.com/repos/Aries-Serpent/_codex_/actions/variables/CODEX_CI_LAST_GREEN_SHA\"\
        \ \\\n    -d \"${PAYLOAD}\" 2>/dev/null) || HTTP_STATUS=0\n  if [ \"${HTTP_STATUS}\"\
        \ = \"404\" ]; then\n    curl -s -X POST \\\n      -H \"Authorization: Bearer\
        \ ${GH_TOKEN}\" \\\n      -H \"Accept: application/vnd.github+json\" \\\n\
        \      \"https://api.github.com/repos/Aries-Serpent/_codex_/actions/variables\"\
        \ \\\n      -d \"{\\\"name\\\":\\\"CODEX_CI_LAST_GREEN_SHA\\\",\\\"value\\\
        \":\\\"${SHA}\\\"}\" \\\n      > /dev/null 2>&1 || true\n  fi\n  echo \"CODEX_CI_LAST_GREEN_SHA\
        \ updated to ${SHA} (rate=${RATE}% < threshold=${THRESHOLD}%, http=${HTTP_STATUS})\"\
        \nelse\n  echo \"CI health degraded (rate=${RATE}% >= threshold=${THRESHOLD}%)\
        \ \u2014 CODEX_CI_LAST_GREEN_SHA not updated\"\nfi\n"
    - name: "\U0001F511 Sprint 5: Backup key health check"
      if: always()
      continue-on-error: true
      env:
        BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
      run: "# Sprint 5: validate CODEX_BACKUP_KEY is functional on each monitor run.\n\
        # A non-empty BACKUP_KEY that returns HTTP 200 on the user endpoint is healthy.\n\
        if [ -z \"${BACKUP_KEY}\" ]; then\n  echo \"::warning::CODEX_BACKUP_KEY is\
        \ not set \u2014 backup key health: MISSING\"\n  echo \"backup_key_status=missing\"\
        \ >> \"$GITHUB_STEP_SUMMARY\" 2>/dev/null || true\n  exit 0\nfi\nHTTP=$(curl\
        \ -s -o /dev/null -w \"%{http_code}\" \\\n  -H \"Authorization: Bearer ${BACKUP_KEY}\"\
        \ \\\n  \"https://api.github.com/user\" 2>/dev/null) || HTTP=0\nif [ \"${HTTP}\"\
        \ = \"200\" ]; then\n  echo \"\u2705 CODEX_BACKUP_KEY healthy (HTTP ${HTTP})\"\
        \n  echo \"| Backup Key | \u2705 HTTP ${HTTP} |\" >> \"$GITHUB_STEP_SUMMARY\"\
        \ 2>/dev/null || true\nelse\n  echo \"::warning::CODEX_BACKUP_KEY probe returned\
        \ HTTP ${HTTP} \u2014 may need rotation\"\n  echo \"| Backup Key | \u26A0\uFE0F\
        \ HTTP ${HTTP} \u2014 check rotation |\" >> \"$GITHUB_STEP_SUMMARY\" 2>/dev/null\
        \ || true\nfi\n"
    - name: Cache health report
      if: always()
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow ci-health-monitor
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Enforcement gap scan + KPI dashboard
      if: always()
      continue-on-error: true
      run: 'python3 scripts/ci/auto_promote_tier.py --check-only 2>/dev/null || true

        pip install pyyaml --quiet 2>/dev/null || true

        python3 scripts/ci/enforcement_kpi_dashboard.py

        '
    - name: 'P-047: Cognitive Brain CI feedback dispatch'
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
        FAILURE_RATE: ${{ steps.telemetry.outputs.failure_rate }}
        FAILED_RUNS: ${{ steps.telemetry.outputs.failed_runs }}
        TOTAL_RUNS: ${{ steps.telemetry.outputs.total_runs }}
        CODEX_CI_FAILURE_THRESHOLD: ${{ vars.CODEX_CI_FAILURE_THRESHOLD || '10' }}
      run: "RATE=\"${FAILURE_RATE:-0}\"\nTHRESHOLD=\"${CODEX_CI_FAILURE_THRESHOLD:-10}\"\
        \nSTATUS=\"ok\"\nif python3 -c \"import sys; sys.exit(0 if float('${RATE}')\
        \ >= float('${THRESHOLD}') * 2 else 1)\" 2>/dev/null; then\n  STATUS=\"critical\"\
        \nelif python3 -c \"import sys; sys.exit(0 if float('${RATE}') >= float('${THRESHOLD}')\
        \ else 1)\" 2>/dev/null; then\n  STATUS=\"degraded\"\nfi\n# Load pattern distribution\
        \ for payload\nPATTERNS=$(python3 <<'PATTERNS_EOF' 2>/dev/null || echo '{}')\n\
        import json, sys\ntry:\n    d = json.load(open(\"${{ runner.temp }}/telemetry_report.json\"\
        ))\n    print(json.dumps(d.get(\"pattern_distribution\", {})))\nexcept Exception:\n\
        \    print(\"{}\")\nPATTERNS_EOF\nPAYLOAD=$(python3 <<PAYLOAD_EOF 2>/dev/null)\
        \ || PAYLOAD='{\"event_type\":\"cognitive-brain-ci-update\",\"client_payload\"\
        :{\"source\":\"ci-health-monitor\",\"status\":\"unknown\"}}'\nimport json,\
        \ sys\npayload = {\n    \"event_type\": \"cognitive-brain-ci-update\",\n \
        \   \"client_payload\": {\n        \"source\": \"ci-health-monitor\",\n  \
        \      \"failure_rate\": \"${RATE}\",\n        \"failed_runs\": \"${FAILED_RUNS}\"\
        ,\n        \"total_runs\": \"${TOTAL_RUNS}\",\n        \"status\": \"${STATUS}\"\
        ,\n        \"threshold\": \"${THRESHOLD}\",\n        \"sha\": \"${{ github.sha\
        \ }}\",\n        \"run_id\": \"${{ github.run_id }}\",\n        \"pattern_distribution\"\
        : ${PATTERNS},\n    }\n}\nprint(json.dumps(payload))\nPAYLOAD_EOF\nHTTP_STATUS=$(curl\
        \ -s -o /dev/null -w \"%{http_code}\" \\\n  -X POST \\\n  -H \"Authorization:\
        \ Bearer ${GH_TOKEN}\" \\\n  -H \"Accept: application/vnd.github+json\" \\\
        \n  \"https://api.github.com/repos/${{ github.repository }}/dispatches\" \\\
        \n  -d \"${PAYLOAD}\" 2>/dev/null) || HTTP_STATUS=0\necho \"P-047 cognitive\
        \ brain feedback dispatch: status=${STATUS} rate=${RATE}% http=${HTTP_STATUS}\"\
        \n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
  rescue-comment-push:
    name: Post rescue comment on push failure
    runs-on: ubuntu-latest
    needs: health-check
    if: failure() && github.event_name == 'push'
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: CI Health Monitor
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.ref_name }}
      run: python scripts/ci/post_rescue_comment.py
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
