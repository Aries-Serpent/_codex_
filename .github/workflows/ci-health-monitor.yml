name: CI Health Monitor

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'copilot/**'
    paths:
      - '.github/workflows/**'
      - 'scripts/validate_ci_health.sh'
      - 'scripts/catalog_workflows.py'
      - 'scripts/ci/collect_telemetry.py'

permissions:
  contents: write
  issues: write
  pull-requests: write

# GROUNDED: concurrency control — only one health check runs at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e . --quiet 2>/dev/null || echo "Package install skipped"

      - name: Collect telemetry and classify failures
        id: telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN }}
        run: |  # pragma: allowlist secret
          python scripts/ci/collect_telemetry.py \
            --owner Aries-Serpent \
            --repo _codex_ \
            --branch main \
            --days 7 \
            --output /tmp/telemetry_report.json \
            --token "$GITHUB_TOKEN" || {
              echo "::warning::Telemetry collection failed — check token permissions"
              echo '{"summary":{"total_runs":0,"failed_runs":0,"failure_rate":0},"pattern_distribution":{}}' > /tmp/telemetry_report.json
            }

          # Extract metrics via base64-encoded script.
          # NOTE: base64 encoding is required here because GitHub Actions YAML cannot
          # handle multi-line python3 -c strings or << 'EOF' heredocs inside run: | blocks
          # (the << sequence is a YAML merge key at column 0; embedded quotes break parsing).
          # Fix (S145): previous version used chr(34)+"key"+chr(34) lookups which embedded
          # literal quote characters into the dict key, so failed_runs/total_runs always
          # returned 0 while failure_rate was computed correctly. Replaced with plain string keys.
          METRICS=$(echo '' | base64 -d | python3) || METRICS='FAILURE_RATE=0\nFAILED_RUNS=0\nTOTAL_RUNS=0'  # pragma: allowlist secret
          eval "$(echo -e "$METRICS")"


          echo "failure_rate=${FAILURE_RATE}" >> "$GITHUB_OUTPUT"
          echo "failed_runs=${FAILED_RUNS}"   >> "$GITHUB_OUTPUT"
          echo "total_runs=${TOTAL_RUNS}"     >> "$GITHUB_OUTPUT"

          # Threshold: alert if failure rate exceeds CODEX_CI_FAILURE_THRESHOLD.
          # Wired to repo variable (P2.3); falls back to 10% (degraded level) if unset.
          # Cascade suppression (issue #3669): when >50% of failures are classified as
          # 'self-healing' (a cascade from iterative-self-healing-ci.yml), the raw
          # failure rate is inflated by automated remediation runs — NOT real regressions.
          # In that case we double the effective threshold to avoid false-positive alerts.
          THRESHOLD="${{ vars.CODEX_CI_FAILURE_THRESHOLD || '10' }}"
          # Read cascade_detected from telemetry JSON.
          # One-liner kept intentionally compact: reads a single nested boolean key and
          # prints 'true'/'false'. Failure-safe: falls back to 'false' on any error so
          # the threshold check always runs. Logic: d['cascade_analysis']['cascade_detected'].
          CASCADE_DETECTED=$(python3 -c "import json,sys;d=json.load(open('/tmp/telemetry_report.json'));print('true' if d.get('cascade_analysis',{}).get('cascade_detected',False) else 'false')" 2>/dev/null || echo 'false')
          echo "cascade_detected=${CASCADE_DETECTED}" >> "$GITHUB_OUTPUT"
          if [ "${CASCADE_DETECTED}" = "true" ]; then
            # Use 2× threshold for cascade runs — they are expected self-healing overhead
            EFFECTIVE_THRESHOLD=$(python3 -c "print(float('${THRESHOLD}') * 2)" 2>/dev/null || echo "${THRESHOLD}")
            echo "::notice::Self-healing cascade detected — using effective threshold ${EFFECTIVE_THRESHOLD}% (2× base ${THRESHOLD}%)"
          else
            EFFECTIVE_THRESHOLD="${THRESHOLD}"
          fi
          if python3 -c "import sys; sys.exit(0 if float('${FAILURE_RATE}') > float('${EFFECTIVE_THRESHOLD}') else 1)"; then
            echo "alert_required=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CI failure rate ${FAILURE_RATE}% exceeds effective threshold ${EFFECTIVE_THRESHOLD}% (cascade=${CASCADE_DETECTED})"
          else
            echo "alert_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        if: always()
        run: |
          FAILURE_RATE="${{ steps.telemetry.outputs.failure_rate }}"
          FAILED_RUNS="${{ steps.telemetry.outputs.failed_runs }}"
          TOTAL_RUNS="${{ steps.telemetry.outputs.total_runs }}"
          ALERT="${{ steps.telemetry.outputs.alert_required }}"

          echo "## 🏥 CI Health Monitor Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total Runs (7d) | ${TOTAL_RUNS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Failed Runs | ${FAILED_RUNS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Failure Rate | ${FAILURE_RATE}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ALERT" = "true" ]; then
            THRESHOLD="${{ vars.CODEX_CI_FAILURE_THRESHOLD || '10' }}"
            echo "### ⚠️ Alert: Failure rate exceeds ${THRESHOLD}% threshold" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Health: Failure rate within acceptable range" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pattern Distribution" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PYEOF'
          import json, os
          try:
              with open('/tmp/telemetry_report.json') as f:
                  d = json.load(f)
              dist = d.get('pattern_distribution', {})
              if dist:
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
                      s.write("| Pattern | Count |\n")
                      s.write("|---------|-------|\n")
                      for pat, cnt in sorted(dist.items(), key=lambda x: x[1], reverse=True):
                          s.write(f"| {pat} | {cnt} |\n")
              else:
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
                      s.write("_No failures detected or telemetry unavailable._\n")
          except Exception as e:
              pass
          PYEOF

      - name: Create alert issue if failure rate is critical
        if: steps.telemetry.outputs.alert_required == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const failureRate    = '${{ steps.telemetry.outputs.failure_rate }}';
            const failedRuns     = '${{ steps.telemetry.outputs.failed_runs }}';
            const totalRuns      = '${{ steps.telemetry.outputs.total_runs }}';
            const cascadeDetected = '${{ steps.telemetry.outputs.cascade_detected }}' === 'true';

            // Load pattern distribution and cascade analysis from telemetry report
            const fs = require('fs');
            let patternTable = '';
            let cascadeSection = '';
            try {
              const report = JSON.parse(fs.readFileSync('/tmp/telemetry_report.json', 'utf8'));
              const dist   = report.pattern_distribution || {};
              const rows   = Object.entries(dist)
                .sort((a, b) => b[1] - a[1])
                .map(([pat, cnt]) => `| ${pat} | ${cnt} |`)
                .join('\n');
              patternTable = rows
                ? `| Pattern | Count |\n|---------|-------|\n${rows}`
                : '_No patterns detected._';

              // Include cascade analysis when detected (issue #3669 fix)
              const ca = report.cascade_analysis || {};
              if (ca.cascade_detected) {
                cascadeSection = [
                  '',
                  '### ⚠️ Self-Healing Cascade Detected',
                  '',
                  `Self-healing failures account for **${(ca.cascade_rate * 100).toFixed(1)}%** ` +
                  `of all failures (${ca.self_healing_count}/${ca.total_failures}).`,
                  '',
                  '**Root Cause:**',
                  ca.root_cause || '_Unknown_',
                  '',
                  '**Recommended Action:**',
                  ca.recommended_action || '_See .codex/patterns/ci_failure_patterns.yaml_',
                  '',
                  '> Note: The effective alert threshold was doubled to 2× base because',
                  '> a cascade was active. The rate still exceeded this elevated threshold.',
                ].join('\n');
              }
            } catch(e) {
              patternTable = '_Pattern data unavailable._';
            }

            // Dedup: skip if an open alert issue was created in the last 24h
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'ci-health-alert',
              since,
            });
            if (issues.length > 0) {
              core.info(`Skipping issue creation — open alert issue #${issues[0].number} already exists.`);
              return;
            }

            const body = [
              '## 🚨 CI Health Alert',
              '',
              'Telemetry analysis for the past 7 days has detected concerning patterns.',
              '',
              '### Summary',
              '',
              `- **Total Runs:** ${totalRuns}`,
              `- **Failed Runs:** ${failedRuns}`,
              `- **Failure Rate:** ${failureRate}%`,
              '',
              '### Pattern Distribution',
              '',
              patternTable,
              cascadeSection,
              '',
              '### Recommended Actions',
              '',
              '- ⚠️ **Critical:** Failure rate exceeds threshold - immediate investigation required',
              '',
              `**Report:** Telemetry collected on ${new Date().toISOString().slice(0, 10)}`,
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `CI Health Alert: High Failure Rate Detected`,
              body,
              labels: ['ci-health-alert'],
            });
            core.info(`Created alert issue #${issue.number}: ${issue.html_url}`);

      - name: Update CODEX_CI_FAILURE_RATE repo variable
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN }}
          FAILURE_RATE: ${{ steps.telemetry.outputs.failure_rate }}
          CODEX_CI_FAILURE_THRESHOLD: ${{ vars.CODEX_CI_FAILURE_THRESHOLD || '10' }}
        run: |
          # Sprint 1: auto-update repo variable with current failure rate so
          # agents and dashboards always see a fresh value without re-running telemetry.
          # Thresholds wired to CODEX_CI_FAILURE_THRESHOLD (P2.3):
          #   degraded : rate >= THRESHOLD
          #   critical : rate >= 2 * THRESHOLD
          RATE="${FAILURE_RATE:-0}"
          THRESHOLD="${CODEX_CI_FAILURE_THRESHOLD:-10}"
          STATUS="ok"
          if python3 -c "import sys; sys.exit(0 if float('${RATE}') >= float('${THRESHOLD}') * 2 else 1)" 2>/dev/null; then
            STATUS="critical"
          elif python3 -c "import sys; sys.exit(0 if float('${RATE}') >= float('${THRESHOLD}') else 1)" 2>/dev/null; then
            STATUS="degraded"
          fi
          # Store rate and status together so dashboards get both in one variable.
          VALUE="${RATE}:${STATUS}"
          PAYLOAD="{\"value\":\"${VALUE}\"}"
          # Try PATCH (update existing) then POST (create new) as fallback
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Aries-Serpent/_codex_/actions/variables/CODEX_CI_FAILURE_RATE" \
            -d "${PAYLOAD}" 2>/dev/null) || HTTP_STATUS=0
          if [ "${HTTP_STATUS}" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Aries-Serpent/_codex_/actions/variables" \
              -d "{\"name\":\"CODEX_CI_FAILURE_RATE\",\"value\":\"${VALUE}\"}" \
              > /dev/null 2>&1 || true
          fi
          echo "CODEX_CI_FAILURE_RATE updated to ${RATE}% (status=${STATUS}, http=${HTTP_STATUS})"

      - name: Write CODEX_CI_LAST_GREEN_SHA when CI is healthy
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN }}
          FAILURE_RATE: ${{ steps.telemetry.outputs.failure_rate }}
          CODEX_CI_FAILURE_THRESHOLD: ${{ vars.CODEX_CI_FAILURE_THRESHOLD || '10' }}
        run: |
          # P2.6: write CODEX_CI_LAST_GREEN_SHA when failure rate is below threshold.
          # Enables bisect commands: git bisect good "$CODEX_CI_LAST_GREEN_SHA"
          RATE="${FAILURE_RATE:-0}"
          THRESHOLD="${CODEX_CI_FAILURE_THRESHOLD:-10}"
          if python3 -c "import sys; sys.exit(0 if float('${RATE}') < float('${THRESHOLD}') else 1)" 2>/dev/null; then
            SHA="${{ github.sha }}"
            # SHA is always a 40-char hex string from github.sha — safe to embed in JSON.
            PAYLOAD="{\"value\":\"${SHA}\"}"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Aries-Serpent/_codex_/actions/variables/CODEX_CI_LAST_GREEN_SHA" \
              -d "${PAYLOAD}" 2>/dev/null) || HTTP_STATUS=0
            if [ "${HTTP_STATUS}" = "404" ]; then
              curl -s -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/Aries-Serpent/_codex_/actions/variables" \
                -d "{\"name\":\"CODEX_CI_LAST_GREEN_SHA\",\"value\":\"${SHA}\"}" \
                > /dev/null 2>&1 || true
            fi
            echo "CODEX_CI_LAST_GREEN_SHA updated to ${SHA} (rate=${RATE}% < threshold=${THRESHOLD}%, http=${HTTP_STATUS})"
          else
            echo "CI health degraded (rate=${RATE}% >= threshold=${THRESHOLD}%) — CODEX_CI_LAST_GREEN_SHA not updated"
          fi

      - name: "🔑 Sprint 5: Backup key health check"
        if: always()
        continue-on-error: true
        env:
          BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        run: |
          # Sprint 5: validate CODEX_BACKUP_KEY is functional on each monitor run.
          # A non-empty BACKUP_KEY that returns HTTP 200 on the user endpoint is healthy.
          if [ -z "${BACKUP_KEY}" ]; then
            echo "::warning::CODEX_BACKUP_KEY is not set — backup key health: MISSING"
            echo "backup_key_status=missing" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            exit 0
          fi
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${BACKUP_KEY}" \
            "https://api.github.com/user" 2>/dev/null) || HTTP=0
          if [ "${HTTP}" = "200" ]; then
            echo "✅ CODEX_BACKUP_KEY healthy (HTTP ${HTTP})"
            echo "| Backup Key | ✅ HTTP ${HTTP} |" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          else
            echo "::warning::CODEX_BACKUP_KEY probe returned HTTP ${HTTP} — may need rotation"
            echo "| Backup Key | ⚠️ HTTP ${HTTP} — check rotation |" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

      - name: Cache health report
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow ci-health-monitor 2>/dev/null || echo "Cache health: check skipped"


      - name: Enforcement gap scan + KPI dashboard
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/ci/auto_promote_tier.py --check-only 2>/dev/null || true
          pip install pyyaml --quiet 2>/dev/null || true
          python3 scripts/ci/enforcement_kpi_dashboard.py

      # P-047: Cognitive Brain Feedback Loop
      # Dispatches a repository_dispatch event so the cognitive brain system can
      # ingest the latest CI health metrics without polling. The payload includes
      # failure_rate, pattern_distribution, and a health status string that maps
      # to CODEX_CI_FAILURE_RATE (ok / degraded / critical).
      # Keyword map: "cognitive-brain" pattern in collect_telemetry.py PATTERN_KEYWORDS.
      - name: "P-047: Cognitive Brain CI feedback dispatch"
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN }}
          FAILURE_RATE: ${{ steps.telemetry.outputs.failure_rate }}
          FAILED_RUNS: ${{ steps.telemetry.outputs.failed_runs }}
          TOTAL_RUNS: ${{ steps.telemetry.outputs.total_runs }}
          CODEX_CI_FAILURE_THRESHOLD: ${{ vars.CODEX_CI_FAILURE_THRESHOLD || '10' }}
        run: |
          RATE="${FAILURE_RATE:-0}"
          THRESHOLD="${CODEX_CI_FAILURE_THRESHOLD:-10}"
          STATUS="ok"
          if python3 -c "import sys; sys.exit(0 if float('${RATE}') >= float('${THRESHOLD}') * 2 else 1)" 2>/dev/null; then
            STATUS="critical"
          elif python3 -c "import sys; sys.exit(0 if float('${RATE}') >= float('${THRESHOLD}') else 1)" 2>/dev/null; then
            STATUS="degraded"
          fi
          # Load pattern distribution for payload
          PATTERNS=$(python3 <<'PATTERNS_EOF' 2>/dev/null || echo '{}')
          import json, sys
          try:
              d = json.load(open("${{ runner.temp }}/telemetry_report.json"))
              print(json.dumps(d.get("pattern_distribution", {})))
          except Exception:
              print("{}")
          PATTERNS_EOF
          PAYLOAD=$(python3 <<PAYLOAD_EOF 2>/dev/null) || PAYLOAD='{"event_type":"cognitive-brain-ci-update","client_payload":{"source":"ci-health-monitor","status":"unknown"}}'
          import json, sys
          payload = {
              "event_type": "cognitive-brain-ci-update",
              "client_payload": {
                  "source": "ci-health-monitor",
                  "failure_rate": "${RATE}",
                  "failed_runs": "${FAILED_RUNS}",
                  "total_runs": "${TOTAL_RUNS}",
                  "status": "${STATUS}",
                  "threshold": "${THRESHOLD}",
                  "sha": "${{ github.sha }}",
                  "run_id": "${{ github.run_id }}",
                  "pattern_distribution": ${PATTERNS},
              }
          }
          print(json.dumps(payload))
          PAYLOAD_EOF
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "${PAYLOAD}" 2>/dev/null) || HTTP_STATUS=0
          echo "P-047 cognitive brain feedback dispatch: status=${STATUS} rate=${RATE}% http=${HTTP_STATUS}"

  rescue-comment-push:
    name: Post rescue comment on push failure
    runs-on: ubuntu-latest
    needs: health-check
    if: failure() && github.event_name == 'push'
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "CI Health Monitor"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: python scripts/ci/post_rescue_comment.py
