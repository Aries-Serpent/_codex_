name: CI Health Monitor

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - 'copilot/**'
    paths:
      - '.github/workflows/**'
      - 'scripts/validate_ci_health.sh'
      - 'scripts/catalog_workflows.py'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      
      - name: Run CI Health Validation
        id: health
        run: |
          bash scripts/validate_ci_health.sh > /tmp/health_report.txt 2>&1 || true
          cat /tmp/health_report.txt
          
          # Extract statistics
          ACTIVE=$(grep "Active workflows:" /tmp/health_report.txt | awk '{print $3}')
          DISABLED=$(grep "Disabled workflows:" /tmp/health_report.txt | awk '{print $3}')
          TARGET=$(grep "Target:" /tmp/health_report.txt | awk '{print $2}')
          
          echo "active_count=$ACTIVE" >> $GITHUB_OUTPUT
          echo "disabled_count=$DISABLED" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          
          # Check if we have syntax errors
          if grep -q "❌" /tmp/health_report.txt; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update workflow inventory
        run: |
          python3 scripts/catalog_workflows.py
          echo "✅ Inventory updated"
      
      - name: Generate health report
        run: |
          cat > /tmp/ci_health_report.md << 'REPORT'
          # CI Health Report
          
          **Generated**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Branch**: ${{ github.ref_name }}
          **Commit**: ${{ github.sha }}
          
          ## Workflow Statistics
          
          - **Active Workflows**: ${{ steps.health.outputs.active_count }}
          - **Disabled Workflows**: ${{ steps.health.outputs.disabled_count }}
          - **Total Workflows**: $((${{ steps.health.outputs.active_count }} + ${{ steps.health.outputs.disabled_count }}))
          - **Target**: ${{ steps.health.outputs.target }} active workflows
          - **Status**: ${{ steps.health.outputs.active_count <= steps.health.outputs.target && '✅ Target Met' || '⚠️ Target Not Met' }}
          
          ## Consolidation Progress
          
          - **Original Count**: 67 workflows
          - **Current Count**: ${{ steps.health.outputs.active_count }} workflows
          - **Workflows Consolidated**: $(( 67 - ${{ steps.health.outputs.active_count }} ))
          - **Progress**: $(( (67 - ${{ steps.health.outputs.active_count }}) * 100 / 19 ))%
          
          ## Health Status
          
          ${{ steps.health.outputs.has_errors == 'false' && '✅ **EXCELLENT** - All workflows have valid YAML syntax' || '⚠️ **NEEDS ATTENTION** - Some workflows have syntax errors' }}
          
          ## Recent Changes
          
          - Last commit: ${{ github.event.head_commit.message }}
          - Author: ${{ github.event.head_commit.author.name }}
          
          ## Quick Actions
          
          - [View Workflow Inventory](.github/workflow-archive/WORKFLOW_INVENTORY.yaml)
          - [View Consolidation Report](.github/workflow-archive/CONSOLIDATION_REPORT.md)
          - [Restore Workflow](.github/workflows/workflow-restore.yml)
          
          ---
          *This report is automatically generated by the CI Health Monitor*
          REPORT
          
          cat /tmp/ci_health_report.md
          cat /tmp/ci_health_report.md >> $GITHUB_STEP_SUMMARY
      
      - name: Commit updated inventory
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/copilot/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet .github/workflow-archive/; then
            echo "No changes to commit"
          else
            git add .github/workflow-archive/WORKFLOW_INVENTORY.yaml
            git add .github/workflow-archive/INVENTORY_SUMMARY.md
            git commit -m "chore(ci): update workflow inventory [skip ci]

            Auto-generated by CI Health Monitor
            
            Active: ${{ steps.health.outputs.active_count }}
            Disabled: ${{ steps.health.outputs.disabled_count }}
            Status: ${{ steps.health.outputs.has_errors == 'false' && 'Healthy' || 'Issues Detected' }}"
            
            git push
          fi
      
      - name: Create issue on critical errors
        if: steps.health.outputs.has_errors == 'true' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/health_report.txt', 'utf8');
            
            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-health,automated'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 CI Health Issues Detected',
                body: `## CI Health Report\n\n` +
                      `**Status**: ⚠️ Issues Detected\n\n` +
                      `**Details**:\n\`\`\`\n${report}\n\`\`\`\n\n` +
                      `**Action Required**: Please review and fix the workflow syntax errors.\n\n` +
                      `**Resources**:\n` +
                      `- [CI Health Validation Script](scripts/validate_ci_health.sh)\n` +
                      `- [Workflow Inventory](.github/workflow-archive/WORKFLOW_INVENTORY.yaml)\n` +
                      `- [Consolidation Report](.github/workflow-archive/CONSOLIDATION_REPORT.md)`,
                labels: ['ci-health', 'automated', 'urgent']
              });
            }
      
      - name: Post status to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/ci_health_report.md', 'utf8');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
  
  trend-analysis:
    runs-on: ubuntu-latest
    needs: health-check
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 100
      
      - name: Analyze workflow trends
        run: |
          echo "=== Workflow Consolidation Trends ==="
          
          # Count workflows in recent commits
          for commit in $(git log --oneline -n 10 | awk '{print $1}'); do
            git checkout $commit 2>/dev/null || continue
            COUNT=$(find .github/workflows -name "*.yml" 2>/dev/null | wc -l)
            DATE=$(git show -s --format=%ci $commit | cut -d' ' -f1)
            echo "$DATE,$commit,$COUNT"
          done > /tmp/workflow_trend.csv
          
          git checkout ${{ github.ref_name }}
          
          echo ""
          echo "Recent workflow count trend:"
          cat /tmp/workflow_trend.csv
      
      - name: Upload trend data
        uses: actions/upload-artifact@v6
        with:
          name: workflow-trends-${{ github.run_number }}
          path: /tmp/workflow_trend.csv
          retention-days: 90
