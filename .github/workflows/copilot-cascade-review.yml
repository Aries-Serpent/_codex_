name: Copilot Cascade PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  cascade-review:
    # Only run on PRs or when @cascade-review is mentioned
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && 
       contains(github.event.comment.body, '@cascade-review'))
    
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install Copilot CLI (if available)
        continue-on-error: true
        run: |
          npm install -g @github/copilot@prerelease || echo "CLI installation skipped"
          copilot --version || echo "CLI not available - will use fallback mode"
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install -r .github/copilot-cascade/requirements.txt
      
      - name: Get changed files
        id: files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Get changed files in PR
            FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tr '\n' ',' | sed 's/,$//')
          else
            FILES="all"
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Execute cascade review
        id: cascade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CHANGED_FILES: ${{ steps.files.outputs.files }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import asyncio
          import json
          import os
          import sys
          from pathlib import Path
          
          # Add cascade module to path
          sys.path.insert(0, '.github/copilot-cascade')
          
          try:
              from cli_integration import cascade_task
              
              async def main():
                  pr_number = os.environ.get('PR_NUMBER', 'unknown')
                  changed_files_str = os.environ.get('CHANGED_FILES', '')
                  
                  # Parse changed files
                  files = []
                  if changed_files_str and changed_files_str != 'all':
                      changed = [f.strip() for f in changed_files_str.split(',') if f.strip()]
                      
                      for file_path in changed:
                          if os.path.exists(file_path):
                              try:
                                  with open(file_path, 'r', encoding='utf-8') as f:
                                      content = f.read()
                                  
                                  # Determine language from extension
                                  ext = os.path.splitext(file_path)[1]
                                  lang_map = {
                                      '.py': 'python',
                                      '.js': 'javascript',
                                      '.ts': 'typescript',
                                      '.yml': 'yaml',
                                      '.yaml': 'yaml',
                                      '.json': 'json',
                                      '.md': 'markdown'
                                  }
                                  lang = lang_map.get(ext, 'text')
                                  
                                  files.append({
                                      'path': file_path,
                                      'content': content[:5000],  # Limit size
                                      'language': lang
                                  })
                              except Exception as e:
                                  print(f"Warning: Could not read {file_path}: {e}")
                  
                  # Build review task
                  task = {
                      'id': f'pr_{pr_number}',
                      'type': 'full_pr_review',
                      'files': files,
                      'requirements': [
                          'Check code quality',
                          'Identify security issues',
                          'Suggest improvements',
                          'Review for best practices'
                      ]
                  }
                  
                  # Execute cascade
                  print(f"Starting cascade review for PR {pr_number} with {len(files)} files")
                  results = await cascade_task(task)
                  
                  # Save results
                  with open('cascade_results.json', 'w') as f:
                      json.dump(results, f, indent=2, default=str)
                  
                  print(f"Cascade complete: {results.get('verification', {}).get('status', 'unknown')}")
                  print(json.dumps(results, indent=2, default=str))
                  
                  return 0
                  
          except Exception as e:
              print(f"Cascade error: {e}")
              import traceback
              traceback.print_exc()
              
              # Save error state
              with open('cascade_results.json', 'w') as f:
                  json.dump({
                      'error': str(e),
                      'status': 'failed'
                  }, f)
              
              return 1
          
          exit_code = asyncio.run(main())
          sys.exit(exit_code)
          PYTHON_SCRIPT
      
      - name: Post review comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let results;
            
            try {
              const content = fs.readFileSync('cascade_results.json', 'utf8');
              results = JSON.parse(content);
            } catch (e) {
              console.log('Error loading results:', e);
              results = { error: 'Failed to load cascade results', status: 'unknown' };
            }
            
            // Build review comment
            let comment = '## 🤖 Cascade AI Review\n\n';
            
            if (results.error) {
              comment += `⚠️ **Error**: ${results.error}\n\n`;
              comment += '_The cascade system encountered an error. This may be due to CLI unavailability or configuration issues._\n';
            } else {
              const verification = results.verification || {};
              const status = verification.status || 'unknown';
              const confidence = ((verification.confidence || 0) * 100).toFixed(1);
              
              // Status emoji
              const statusEmoji = status === 'verified' ? '✅' : status === 'partial' ? '⚠️' : '❌';
              
              comment += `${statusEmoji} **Status**: ${status}\n`;
              comment += `📊 **Confidence**: ${confidence}%\n`;
              comment += `🎯 **Tokens Used**: ${results.total_tokens || 0}\n`;
              comment += `⏱️ **Execution Time**: ${(results.total_time || 0).toFixed(2)}s\n`;
              
              // Budget status
              if (results.budget_status) {
                const budget = results.budget_status;
                comment += `💰 **Budget**: ${budget.used || 0}/${budget.total || 0} tokens (${(budget.utilization || 0).toFixed(1)}%)\n`;
              }
              
              comment += '\n';
              
              // Subtask results
              if (results.subtasks && results.subtasks.length > 0) {
                comment += '### Review Results\n\n';
                
                let successCount = 0;
                for (const subtask of results.subtasks) {
                  if (subtask.status === 'success' || subtask.status === 'primary' || subtask.status === 'fallback') {
                    successCount++;
                  }
                }
                
                comment += `📝 **Subtasks**: ${successCount}/${results.subtasks.length} completed\n\n`;
                
                // Show first few results
                for (let i = 0; i < Math.min(3, results.subtasks.length); i++) {
                  const subtask = results.subtasks[i];
                  const emoji = subtask.status === 'success' ? '✅' : 
                               subtask.status === 'fallback' ? '🔄' : '❌';
                  
                  comment += `<details>\n`;
                  comment += `<summary>${emoji} ${subtask.task_id} (${subtask.status})</summary>\n\n`;
                  
                  if (subtask.output) {
                    const output = subtask.output.substring(0, 500);
                    comment += '```\n' + output + (subtask.output.length > 500 ? '\n...(truncated)' : '') + '\n```\n';
                  }
                  
                  if (subtask.error) {
                    comment += `\n**Error**: ${subtask.error}\n`;
                  }
                  
                  comment += '</details>\n\n';
                }
                
                if (results.subtasks.length > 3) {
                  comment += `_...and ${results.subtasks.length - 3} more subtasks_\n\n`;
                }
              }
              
              // Recommendations
              if (verification.recommendations && verification.recommendations.length > 0) {
                comment += '### 💡 Recommendations\n\n';
                for (const rec of verification.recommendations) {
                  comment += `- ${rec}\n`;
                }
                comment += '\n';
              }
            }
            
            comment += '\n---\n';
            comment += '_Generated by [Cascade AI Review System](.github/copilot-cascade/README.md)_\n';
            comment += '_Phase 1: Architecture framework active (CLI integration in fallback mode)_';
            
            // Post comment
            const issueNumber = context.issue?.number || context.payload.pull_request?.number;
            
            if (issueNumber) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: comment
                });
                console.log(`Posted review comment to issue #${issueNumber}`);
              } catch (error) {
                console.error('Failed to post comment:', error);
              }
            } else {
              console.log('No issue number found, skipping comment post');
            }
      
      - name: Upload cascade results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascade-review-results
          path: cascade_results.json
          retention-days: 30
