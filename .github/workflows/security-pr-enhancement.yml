name: Security PR Enhancement
'on':
  pull_request:
    types:
    - opened
    - synchronize
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  enhance-pr-security:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork }}
    name: PR Security Enhancement
    runs-on: ubuntu-latest
    steps:
    - name: Fail-closed guard for untrusted PR contexts
      shell: bash
      env:
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        CURRENT_REPO: ${{ github.repository }}
        PR_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: "set -euo pipefail\nif [[ \"${PR_HEAD_REPO}\" != \"${CURRENT_REPO}\" ]]\
        \ || [[ \"${PR_IS_FORK}\" == \"true\" ]]; then\n  echo \"::error::Fail-closed:\
        \ refusing to execute or mutate PR metadata for forked or external repository\
        \ PRs.\"\n  exit 1\nfi\necho \"Trusted same-repository PR confirmed: ${PR_HEAD_REPO}\"\
        \n"
    - name: Mask secrets
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: 'echo "::add-mask::$(echo "$GH_TOKEN" | head -c 10)"

        '
    - name: Checkout trusted base branch
      uses: actions/checkout@v5
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.pull_request.base.ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -q pyyaml

        '
    - id: findings
      name: Generate security findings section
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
      run: "set -euo pipefail\nmkdir -p .codex .codex/security-live\n\npython scripts/ci/fetch_security_snapshot.py\
        \ \\\n  --types dependabot,secrets,analyses \\\n  --out-dir .codex/security-live\
        \ \\\n  --cache-dir .codex/security-cache \\\n  --cache-ttl 1800\n\npython3\
        \ - <<'PY'\nimport json\nfrom datetime import datetime, timezone\nfrom pathlib\
        \ import Path\n\nroot = Path('.codex/security-live')\nfindings = []\n\nfor\
        \ alert_file, tool in [\n    (root / 'dependabot' / 'alerts_open.json', 'dependabot'),\n\
        \    (root / 'secrets' / 'alerts_open.json', 'secret-scanning'),\n]:\n   \
        \ if not alert_file.exists():\n        continue\n    payload = json.loads(alert_file.read_text())\n\
        \    if not isinstance(payload, list):\n        continue\n    for item in\
        \ payload:\n        if tool == 'dependabot':\n            vuln = item.get('security_vulnerability')\
        \ or {}\n            pkg = (item.get('dependency') or {}).get('package') or\
        \ {}\n            findings.append({\n                'cwe': vuln.get('ghsa_id')\
        \ or 'CWE-UNKNOWN',\n                'severity': (vuln.get('severity') or\
        \ 'LOW').upper(),\n                'description': vuln.get('description')\
        \ or f\"Dependabot alert in {pkg.get('name', 'dependency')}\",\n         \
        \       'file_path': pkg.get('name') or 'dependency',\n                'line_number':\
        \ 0,\n                'tool': 'dependabot',\n                'fix_recommendation':\
        \ 'Upgrade the affected dependency to the minimum fixed version.',\n     \
        \           'confidence': 0.9,\n            })\n        else:\n          \
        \  findings.append({\n                'cwe': 'CWE-798',\n                'severity':\
        \ 'HIGH',\n                'description': f\"Active secret scan finding: {item.get('secret_type',\
        \ 'unknown')}\",\n                'file_path': item.get('secret_type') or\
        \ 'secret-scanning',\n                'line_number': 0,\n                'tool':\
        \ 'secret-scanning',\n                'fix_recommendation': 'Revoke the leaked\
        \ secret and rotate it through the approved secret manager.',\n          \
        \      'confidence': 0.95,\n            })\n\nsummary = {\n    'timestamp':\
        \ datetime.now(timezone.utc).isoformat(),\n    'scan_duration_seconds': 0,\n\
        \    'total_findings': len(findings),\n    'by_severity': {},\n    'by_tool':\
        \ {},\n    'status': 'scan_complete' if findings else 'no_findings',\n}\n\
        for finding in findings:\n    summary['by_severity'][finding['severity']]\
        \ = summary['by_severity'].get(finding['severity'], 0) + 1\n    summary['by_tool'][finding['tool']]\
        \ = summary['by_tool'].get(finding['tool'], 0) + 1\n\nPath('.codex/security-findings-comprehensive.json').write_text(\n\
        \    json.dumps({'findings': findings, 'metadata': summary}, indent=2),\n\
        \    encoding='utf-8',\n)\nPY\n\npython scripts/ci/security_pr_formatter.py\
        \ generate \\\n  --findings .codex/security-findings-comprehensive.json \\\
        \n  --output pr-findings.md \\\n  --limit 5\n\necho \"## \U0001F510 Security\
        \ Findings Report\" >> \"$GITHUB_STEP_SUMMARY\"\ncat pr-findings.md >> \"\
        $GITHUB_STEP_SUMMARY\"\n"
    - id: read-findings
      name: Read findings content
      run: "if [ -f \"pr-findings.md\" ]; then\n  echo \"\u2705 Findings file exists\"\
        \nelse\n  echo \"\u2139\uFE0F  Findings file will be created during generation\"\
        \nfi\n"
    - name: Update PR body with findings section
      if: ${{ github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.head.repo.fork }}
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const fs = require('fs');\nconst pr = context.payload.pull_request;\n\
          const repoName = `${context.repo.owner}/${context.repo.repo}`;\nconst isTrustedRepo\
          \ = pr?.head?.repo?.full_name === repoName && pr?.head?.repo?.fork === false;\n\
          \nif (!isTrustedRepo) {\n  core.setFailed('Fail-closed: refusing to mutate\
          \ PR metadata for forked or external repository PRs.');\n  return;\n}\n\n\
          let findingsContent = 'No security findings detected.';\nif (fs.existsSync('pr-findings.md'))\
          \ {\n  findingsContent = fs.readFileSync('pr-findings.md', 'utf8');\n}\n\
          \nconst body = pr.body || '';\nlet newBody = body.replace(/## \U0001F510\
          \ Security Findings[\\s\\S]*?(?=##|$)/m, '');\nnewBody = newBody.trim();\n\
          \nconst hasWEC = body.includes('\U0001F504 Workflow Execution Checklist')\
          \ || body.includes('Workflow Execution Checklist');\nlet updatedBody = '';\n\
          if (hasWEC) {\n  updatedBody = newBody.replace(\n    /(## \U0001F504 Workflow\
          \ Execution Checklist[\\s\\S]*?)(?=##|$)/m,\n    '$1\\n\\n## \U0001F510\
          \ Security Findings\\n\\n' + findingsContent\n  );\n  if (updatedBody ===\
          \ newBody) {\n    updatedBody = newBody + '\\n\\n## \U0001F510 Security\
          \ Findings\\n\\n' + findingsContent;\n  }\n} else {\n  updatedBody = newBody\
          \ + '\\n\\n## \U0001F510 Security Findings\\n\\n' + findingsContent;\n}\n\
          \ntry {\n  await github.rest.pulls.update({\n    owner: context.repo.owner,\n\
          \    repo: context.repo.repo,\n    pull_number: pr.number,\n    body: updatedBody,\n\
          \  });\n  console.log('\u2705 PR body updated with security findings (WEC-aware)');\n\
          } catch (error) {\n  console.error('\u274C Failed to update PR body:', error.message);\n\
          \  if (error.status === 422) {\n    console.log('\u26A0\uFE0F  PR body update\
          \ rejected (likely due to size limits)');\n  }\n  core.setFailed(error.message);\n\
          }\n"
    - if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository
        && !github.event.pull_request.head.repo.fork }}
      name: Add PR comment with summary
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: "const fs = require('fs');\nconst owner = context.repo.owner;\nconst\
          \ repo = context.repo.repo;\nconst issue_number = context.issue.number;\n\
          const anchor = '<!-- security-findings-detected -->';\nconst pr = context.payload.pull_request;\n\
          const repoName = `${context.repo.owner}/${context.repo.repo}`;\nconst isTrustedRepo\
          \ = pr?.head?.repo?.full_name === repoName && pr?.head?.repo?.fork === false;\n\
          \nif (!isTrustedRepo) {\n  core.setFailed('Fail-closed: refusing to post\
          \ PR comments for forked or external repository PRs.');\n  return;\n}\n\n\
          let findingsContent = '';\nif (fs.existsSync('pr-findings.md')) {\n  findingsContent\
          \ = fs.readFileSync('pr-findings.md', 'utf8');\n}\n\nif (findingsContent\
          \ && findingsContent.trim()) {\n  const lines = [\n    anchor,\n    '',\n\
          \    '## \U0001F510 Security Findings Detected',\n    '',\n    'This PR\
          \ has the following security findings from automated scans:',\n    '',\n\
          \    findingsContent,\n    '',\n    '**Note**: This is an automated scan\
          \ for informational purposes. Please review carefully and address any critical\
          \ or high-severity findings before merging.'\n  ];\n  const comment = lines.join('\\\
          n');\n\n  try {\n    const comments = await github.paginate(github.rest.issues.listComments,\
          \ {\n      owner,\n      repo,\n      issue_number,\n      per_page: 100,\n\
          \    });\n\n    const existing = comments.find((commentItem) => commentItem.user?.login\
          \ === 'github-actions[bot]' && commentItem.body?.includes(anchor));\n\n\
          \    if (existing) {\n      await github.rest.issues.updateComment({\n \
          \       owner,\n        repo,\n        comment_id: existing.id,\n      \
          \  body: comment,\n      });\n      console.log(`\u2705 Updated security\
          \ findings comment #${existing.id}`);\n    } else {\n      await github.rest.issues.createComment({\n\
          \        owner,\n        repo,\n        issue_number,\n        body: comment,\n\
          \      });\n      console.log('\u2705 Security findings comment added to\
          \ PR');\n    }\n  } catch (error) {\n    console.log('\u26A0\uFE0F  Could\
          \ not add comment:', error.message);\n  }\n}\n"
    timeout-minutes: 30
  validate-findings-json:
    name: Validate Findings JSON
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
    - name: Fail-closed guard for untrusted PR contexts
      shell: bash
      env:
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        CURRENT_REPO: ${{ github.repository }}
        PR_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: "set -euo pipefail\nif [[ \"${PR_HEAD_REPO}\" != \"${CURRENT_REPO}\" ]]\
        \ || [[ \"${PR_IS_FORK}\" == \"true\" ]]; then\n  echo \"::error::Fail-closed:\
        \ refusing to validate findings for forked or external repository PRs.\"\n\
        \  exit 1\nfi\necho \"Trusted same-repository PR confirmed: ${PR_HEAD_REPO}\"\
        \n"
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.pull_request.base.ref }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${ vars.CODEX_CACHE_VERSION || "v3" }
    - name: Validate findings JSON structure
      run: "python3 - <<'PY'\nimport json\nfrom pathlib import Path\n\nfindings_file\
        \ = Path('.codex/security-findings-comprehensive.json')\nif findings_file.exists():\n\
        \    try:\n        with findings_file.open() as f:\n            data = json.load(f)\n\
        \        if isinstance(data, dict):\n            if 'findings' in data and\
        \ 'metadata' in data:\n                print('\u2705 Findings JSON structure\
        \ is valid')\n                print(f\"  - Total findings: {len(data.get('findings',\
        \ []))}\")\n                if 'metadata' in data and 'timestamp' in data['metadata']:\n\
        \                    print(f\"  - Last updated: {data['metadata']['timestamp']}\"\
        )\n            else:\n                print(\"\u26A0\uFE0F  Expected 'findings'\
        \ and 'metadata' keys in JSON\")\n        else:\n            print('\u26A0\
        \uFE0F  Findings file should contain a JSON object')\n    except json.JSONDecodeError\
        \ as exc:\n        print(f'\u274C Invalid JSON: {exc}')\n        raise SystemExit(1)\n\
        else:\n    print('\u2139\uFE0F  No findings file found (will be created if\
        \ needed)')\nPY\n"
    - name: Verify live findings agree with GitHub Security snapshot
      run: "python3 - <<'PY'\nimport json\nfrom pathlib import Path\n\nfindings_file\
        \ = Path('.codex/security-findings-comprehensive.json')\nlive_dir = Path('.codex/security-live')\n\
        if not findings_file.exists():\n    print('\u2139\uFE0F No findings JSON generated;\
        \ skipping live-evidence verification.')\n    raise SystemExit(0)\n\ndata\
        \ = json.loads(findings_file.read_text())\nartifact_total = len(data.get('findings',\
        \ []))\nlive_total = 0\nfor candidate in [\n    live_dir / 'dependabot' /\
        \ 'alerts_open.json',\n    live_dir / 'secrets' / 'alerts_open.json',\n]:\n\
        \    if not candidate.exists():\n        continue\n    try:\n        payload\
        \ = json.loads(candidate.read_text())\n        if isinstance(payload, list):\n\
        \            live_total += len(payload)\n    except Exception:\n        pass\n\
        if live_total and abs(live_total - artifact_total) > 0:\n    raise SystemExit(f'\u274C\
        \ Artifact total ({artifact_total}) does not match live GHAS total ({live_total}).')\n\
        print(f'\u2705 Live GHAS evidence agrees with the normalized findings artifact:\
        \ {artifact_total} findings.')\nPY\n"
    timeout-minutes: 15
