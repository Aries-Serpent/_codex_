name: Machine Readable Maintenance PR
true:
  schedule:
  - cron: 30 6 * * 1
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  maintenance-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: '3.12'
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        python -m pip install -e .[dev]

        '
    - name: Rebuild machine-readable artifacts
      run: 'python -m tools.docs_agent.inventory --json

        python -m tools.docs_agent.build_index --json

        '
    - name: Drift summary
      run: 'echo "Maintenance workflow ran in read-only mode."

        '
    timeout-minutes: 30
