name: Pre-Release Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, release/*, "release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to validate (e.g., 0.1.0)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Check if this is a release preparation PR
  is-release-pr:
    name: Detect release PR
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.check.outputs.is-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check if release PR
        id: check
        env:
          BRANCH_REF: ${{ github.head_ref || github.ref }}
        run: |
          # Check if branch matches release pattern
          if [[ "${BRANCH_REF}" == *"release"* ]] || \
             [[ "${BRANCH_REF}" == *"v0.1"* ]]; then
            echo "is-release=true" >> $GITHUB_OUTPUT
            
            # Extract version from pyproject.toml
            VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "🚀 This is a release PR for v${VERSION}"
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "is-release=false" >> $GITHUB_OUTPUT
          fi

  # Validate version bump
  validate-version:
    name: Validate version bump
    needs: is-release-pr
    if: needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version in pyproject.toml
        id: version
        run: |
          CURRENT_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Current version: ${CURRENT_VERSION}"

      - name: Verify version is higher than last release
        run: |
          CURRENT_VERSION="${{ steps.version.outputs.version }}"
          
          # Get last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LAST_VERSION="${LAST_TAG#v}"
          
          echo "Last release: ${LAST_VERSION}"
          echo "Current version: ${CURRENT_VERSION}"
          
          # Compare versions (simple numeric comparison)
          if [[ "${CURRENT_VERSION}" > "${LAST_VERSION}" ]] || [[ "${CURRENT_VERSION}" == "${LAST_VERSION}" ]]; then
            echo "✅ Version is valid"
          else
            echo "❌ Version must be higher than last release"
            exit 1
          fi

  # Validate CHANGELOG update
  validate-changelog:
    name: Validate CHANGELOG.md
    needs: [is-release-pr, validate-version]
    if: needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check CHANGELOG updated
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          
          # Check for version section in CHANGELOG
          if grep -q "## \[${VERSION}\]" CHANGELOG.md || \
             grep -q "## ${VERSION}" CHANGELOG.md; then
            echo "✅ CHANGELOG.md updated for v${VERSION}"
          else
            echo "❌ CHANGELOG.md missing entry for v${VERSION}"
            echo "   Add a section like: ## [${VERSION}] - $(date +%Y-%m-%d)"
            exit 1
          fi

      - name: Validate CHANGELOG format
        run: |
          # Check for standard sections
          CHANGELOG=$(cat CHANGELOG.md)
          
          if echo "$CHANGELOG" | grep -q "### Added\|### Changed\|### Fixed\|### Security"; then
            echo "✅ CHANGELOG has standard sections"
          else
            echo "⚠️  CHANGELOG should include: Added, Changed, Fixed, Security sections"
          fi

  # Validate release notes
  validate-release-notes:
    name: Validate release notes
    needs: [is-release-pr, validate-version]
    if: needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for release notes
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          
          # Look for release notes file
          if [ -f "RELEASE_NOTES.md" ] || \
             [ -f ".codex/RELEASE_NOTES_v${VERSION}.md" ] || \
             [ -f "docs/releases/v${VERSION}.md" ]; then
            echo "✅ Release notes found"
          else
            echo "⚠️  No dedicated release notes found"
            echo "   Consider creating: docs/releases/v${VERSION}.md"
          fi

      - name: Validate release notes content
        run: |
          # Check CHANGELOG for content
          if [ -s CHANGELOG.md ]; then
            LINES=$(wc -l < CHANGELOG.md)
            if [ $LINES -gt 20 ]; then
              echo "✅ CHANGELOG has sufficient content"
            else
              echo "⚠️  CHANGELOG is quite short (${LINES} lines)"
            fi
          fi

  # Validate P0 gate
  validate-p0-gate:
    name: Validate P0 Gate
    needs: is-release-pr
    if: needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: "P0.1: Profile alignment"
        id: p0-1
        run: |
          if [ -f ".codex/PROFILE_DRIFT_AUDIT.json" ]; then
            echo "✅ P0.1.1: Profile drift audit found"
            echo "pass=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  P0.1.1: Profile drift audit missing"
            echo "pass=false" >> $GITHUB_OUTPUT
          fi

      - name: "P0.2: Manifest structure"
        id: p0-2
        run: |
          if [ -f ".codex/PROFILE_DEPENDENCY_MANIFEST.md" ]; then
            echo "✅ P0.1.3: Profile manifest found"
            echo "pass=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  P0.1.3: Profile manifest missing"
            echo "pass=false" >> $GITHUB_OUTPUT
          fi

      - name: P0 Summary
        run: |
          echo "P0 Gate Status:"
          echo "  P0.1 (Profile Alignment): ${{ steps.p0-1.outputs.pass || 'unknown' }}"
          echo "  P0.2 (Manifest): ${{ steps.p0-2.outputs.pass || 'unknown' }}"

  # Validate P1 gate
  validate-p1-gate:
    name: Validate P1 Gate
    needs: is-release-pr
    if: needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: "P1.3: SBOM present"
        id: p1-3
        run: |
          if [ -f "sbom.json" ] || [ -f ".codex/sbom.json" ]; then
            echo "✅ P1.3: SBOM found"
            echo "pass=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  P1.3: SBOM not found (will be generated at release)"
            echo "pass=false" >> $GITHUB_OUTPUT
          fi

      - name: P1 Summary
        run: |
          echo "P1 Gate Status:"
          echo "  P1.3 (SBOM): ${{ steps.p1-3.outputs.pass || 'unknown' }}"

  # Validate P2 gate (deployment automation)
  validate-p2-gate:
    name: Validate P2 Gate
    needs: is-release-pr
    if: needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: "P2.2.1: Release workflow"
        id: p2-1
        run: |
          if [ -f ".github/workflows/release-to-pypi.yml" ]; then
            echo "✅ P2.2.1: Release workflow found"
            echo "pass=true" >> $GITHUB_OUTPUT
          else
            echo "❌ P2.2.1: Release workflow missing"
            exit 1
          fi

      - name: "P2.2.2: Smoke tests"
        id: p2-2
        run: |
          if [ -f ".github/workflows/smoke-tests-deployment.yml" ]; then
            echo "✅ P2.2.2: Smoke tests workflow found"
            echo "pass=true" >> $GITHUB_OUTPUT
          else
            echo "❌ P2.2.2: Smoke tests workflow missing"
            exit 1
          fi

      - name: "P2.2.3: Deployment guide"
        id: p2-3
        run: |
          if [ -f "docs/deployment/DEPLOYMENT_GUIDE.md" ]; then
            echo "✅ P2.2.3: Deployment guide found"
            echo "pass=true" >> $GITHUB_OUTPUT
          else
            echo "❌ P2.2.3: Deployment guide missing"
            exit 1
          fi

      - name: "P2.2.4: Rollback procedures"
        id: p2-4
        run: |
          if [ -f "scripts/deploy/rollback_release.py" ] && \
             [ -f "docs/deployment/ROLLBACK_CHECKLIST.md" ]; then
            echo "✅ P2.2.4: Rollback procedures found"
            echo "pass=true" >> $GITHUB_OUTPUT
          else
            echo "❌ P2.2.4: Rollback procedures missing"
            exit 1
          fi

      - name: P2 Summary
        run: |
          echo "P2 Gate Status:"
          echo "  P2.2.1 (Release workflow): ${{ steps.p2-1.outputs.pass }}"
          echo "  P2.2.2 (Smoke tests): ${{ steps.p2-2.outputs.pass }}"
          echo "  P2.2.3 (Deployment guide): ${{ steps.p2-3.outputs.pass }}"
          echo "  P2.2.4 (Rollback): ${{ steps.p2-4.outputs.pass }}"

  # Validate manifest integrity
  validate-manifest:
    name: Validate manifest integrity
    needs: is-release-pr
    if: needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check manifest template
        run: |
          if [ -f ".codex/RELEASE_MANIFEST_TEMPLATE.json" ]; then
            python -c "import json; json.load(open('.codex/RELEASE_MANIFEST_TEMPLATE.json'))" && \
            echo "✅ Manifest template valid JSON"
          else
            echo "⚠️  Manifest template not found (will use default)"
          fi

  # Validate release artifacts
  validate-artifacts:
    name: Validate release artifacts
    needs: is-release-pr
    if: needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for wheel build script
        run: |
          if [ -f "pyproject.toml" ] && grep -q "\[build-system\]" pyproject.toml; then
            echo "✅ Project configured for wheel builds"
          else
            echo "❌ Build system not configured"
            exit 1
          fi

  # Post results as PR comment
  post-results:
    name: Post validation results
    needs: [is-release-pr, validate-version, validate-changelog, validate-p0-gate, validate-p1-gate, validate-p2-gate, validate-manifest]
    if: always() && needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Build results summary
        id: summary
        run: |
          echo "## ✅ Pre-Release Validation Results

          ### Version Check
          - Version: ${{ needs.validate-version.outputs.version }}
          - Status: ${{ needs.validate-version.result }}

          ### Checklist
          - [ ] CHANGELOG.md updated: ${{ needs.validate-changelog.result }}
          - [ ] Release notes present: ${{ needs.validate-release-notes.result }}
          - [ ] P0 Gate validated: ${{ needs.validate-p0-gate.result }}
          - [ ] P1 Gate validated: ${{ needs.validate-p1-gate.result }}
          - [ ] P2 Gate validated: ${{ needs.validate-p2-gate.result }}
          - [ ] Manifest integrity: ${{ needs.validate-manifest.result }}
          - [ ] Artifacts ready: ${{ needs.validate-artifacts.result }}

          ### Next Steps
          Once all checks pass:
          1. Get code review approval
          2. Merge to main
          3. Git tag: \`git tag -a v${{ needs.validate-version.outputs.version }} -m 'Release v${{ needs.validate-version.outputs.version }}'\`
          4. Push tag: \`git push origin v${{ needs.validate-version.outputs.version }}\`
          5. This triggers release-to-pypi.yml workflow" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const summary = `## ✅ Pre-Release Validation Complete
            
            **Version**: v${{ needs.validate-version.outputs.version }}
            
            ### Status
            - Version bump: ✅
            - CHANGELOG: ✅
            - P0 Gate: ✅
            - P1 Gate: ✅
            - P2 Gate: ✅
            
            ### Ready for Release
            When ready to release:
            1. Merge this PR to main
            2. Create tag: \`git tag -a v${{ needs.validate-version.outputs.version }}\`
            3. Push tag: \`git push origin v${{ needs.validate-version.outputs.version }}\`
            
            This will trigger the release workflow.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  # Final gate decision
  final-gate-decision:
    name: Final gate decision
    needs: [is-release-pr, validate-version, validate-changelog, validate-p2-gate]
    if: always() && needs.is-release-pr.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Determine release readiness
        run: |
          if [[ "${{ needs.validate-version.result }}" == "success" ]] && \
             [[ "${{ needs.validate-changelog.result }}" == "success" ]] && \
             [[ "${{ needs.validate-p2-gate.result }}" == "success" ]]; then
            echo "✅ RELEASE GATE PASSED"
            echo "Release is ready to proceed when tag is pushed"
            exit 0
          else
            echo "❌ RELEASE GATE FAILED"
            echo "Please fix issues before creating release"
            exit 1
          fi

      - name: Set check status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const checkStatus = {
              name: 'Pre-Release Validation',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Pre-Release Validation',
                summary: 'All gates passed. Release is authorized when tag is pushed.',
                text: 'See workflow for details.'
              }
            };
            
            if ('${{ needs.validate-version.result }}' !== 'success') {
              checkStatus.conclusion = 'failure';
            }
