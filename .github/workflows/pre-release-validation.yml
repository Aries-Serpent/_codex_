name: Pre-Release Validation
on:
  pull_request:
    branches:
    - main
    - release/*
    - release/**
    types:
    - opened
    - synchronize
    - reopened
    paths-ignore:
    - '**.md'
    - docs/**
    - .codex/**
    - LICENSE
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate (e.g., 0.1.0)
        required: false
        type: string
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
env:
  PYTHON_VERSION: '3.12'
jobs:
  final-gate-decision:
    if: always() && needs.is-release-pr.outputs.is-release == 'true'
    name: Final gate decision
    needs:
    - is-release-pr
    - validate-version
    - validate-changelog
    - validate-p2-gate
    runs-on: ubuntu-latest
    steps:
    - name: Determine release readiness
      run: "if [[ \"${{ needs.validate-version.result }}\" == \"success\" ]] && \\\
        \n   [[ \"${{ needs.validate-changelog.result }}\" == \"success\" ]] && \\\
        \n   [[ \"${{ needs.validate-p2-gate.result }}\" == \"success\" ]]; then\n\
        \  echo \"\u2705 RELEASE GATE PASSED\"\n  echo \"Release is ready to proceed\
        \ when tag is pushed\"\n  exit 0\nelse\n  echo \"\u274C RELEASE GATE FAILED\"\
        \n  echo \"Please fix issues before creating release\"\n  exit 1\nfi\n"
    - if: always()
      name: Set check status
      uses: actions/github-script@v8
      with:
        script: "const checkStatus = {\n  name: 'Pre-Release Validation',\n  head_sha:\
          \ context.sha,\n  status: 'completed',\n  conclusion: 'success',\n  output:\
          \ {\n    title: 'Pre-Release Validation',\n    summary: 'All gates passed.\
          \ Release is authorized when tag is pushed.',\n    text: 'See workflow for\
          \ details.'\n  }\n};\n\nif ('${{ needs.validate-version.result }}' !== 'success')\
          \ {\n  checkStatus.conclusion = 'failure';\n}\n"
    timeout-minutes: 30
  is-release-pr:
    name: Detect release PR
    outputs:
      is-release: ${{ steps.check.outputs.is-release }}
      version: ${{ steps.check.outputs.version }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - env:
        BRANCH_REF: ${{ github.head_ref || github.ref }}
      id: check
      name: Check if release PR
      run: "# Check if branch matches release pattern\nif [[ \"${BRANCH_REF}\" ==\
        \ *\"release\"* ]] || \\\n   [[ \"${BRANCH_REF}\" == *\"v0.1\"* ]]; then\n\
        \  echo \"is-release=true\" >> $GITHUB_OUTPUT\n\n  # Extract version from\
        \ pyproject.toml\n  VERSION=$(grep '^version = ' pyproject.toml | cut -d'\"\
        ' -f2)\n  echo \"version=${VERSION}\" >> $GITHUB_OUTPUT\n  echo \"\U0001F680\
        \ This is a release PR for v${VERSION}\"\nelse\n  echo \"is-release=false\"\
        \ >> $GITHUB_OUTPUT\n  echo \"is-release=false\" >> $GITHUB_OUTPUT\nfi\n"
    timeout-minutes: 30
  post-results:
    if: always() && needs.is-release-pr.outputs.is-release == 'true'
    name: Post validation results
    needs:
    - is-release-pr
    - validate-version
    - validate-changelog
    - validate-release-notes
    - validate-p0-gate
    - validate-p1-gate
    - validate-p2-gate
    - validate-manifest
    - validate-artifacts
    runs-on: ubuntu-latest
    steps:
    - id: summary
      name: Build results summary
      run: "echo \"## \u2705 Pre-Release Validation Results\n### Version Check\n-\
        \ Version: ${{ needs.validate-version.outputs.version }}\n- Status: ${{ needs.validate-version.result\
        \ }}\n### Checklist\n- [ ] CHANGELOG.md updated: ${{ needs.validate-changelog.result\
        \ }}\n- [ ] Release notes present: ${{ needs.validate-release-notes.result\
        \ }}\n- [ ] P0 Gate validated: ${{ needs.validate-p0-gate.result }}\n- [ ]\
        \ P1 Gate validated: ${{ needs.validate-p1-gate.result }}\n- [ ] P2 Gate validated:\
        \ ${{ needs.validate-p2-gate.result }}\n- [ ] Manifest integrity: ${{ needs.validate-manifest.result\
        \ }}\n- [ ] Artifacts ready: ${{ needs.validate-artifacts.result }}\n### Next\
        \ Steps\nOnce all checks pass:\n1. Get code review approval\n2. Merge to main\n\
        3. Git tag: \\`git tag -a v${{ needs.validate-version.outputs.version }} -m\
        \ 'Release v${{ needs.validate-version.outputs.version }}'\\`\n4. Push tag:\
        \ \\`git push origin v${{ needs.validate-version.outputs.version }}\\`\n5.\
        \ This triggers release-to-pypi.yml workflow\" >> $GITHUB_OUTPUT\n"
    - if: github.event_name == 'pull_request'
      name: Comment on PR
      uses: actions/github-script@v8
      with:
        script: "const summary = `## \u2705 Pre-Release Validation Complete\n\n**Version**:\
          \ v${{ needs.validate-version.outputs.version }}\n\n### Status\n- Version\
          \ bump: \u2705\n- CHANGELOG: \u2705\n- P0 Gate: \u2705\n- P1 Gate: \u2705\
          \n- P2 Gate: \u2705\n\n### Ready for Release\nWhen ready to release:\n1.\
          \ Merge this PR to main\n2. Create tag: \\`git tag -a v${{ needs.validate-version.outputs.version\
          \ }}\\`\n3. Push tag: \\`git push origin v${{ needs.validate-version.outputs.version\
          \ }}\\`\n\nThis will trigger the release workflow.`;\n\ngithub.rest.issues.createComment({\n\
          \  issue_number: context.issue.number,\n  owner: context.repo.owner,\n \
          \ repo: context.repo.repo,\n  body: summary\n});\n"
    timeout-minutes: 30
  validate-artifacts:
    if: needs.is-release-pr.outputs.is-release == 'true'
    name: Validate release artifacts
    needs: is-release-pr
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Check for wheel build script
      run: "if [ -f \"pyproject.toml\" ] && grep -q \"\\[build-system\\]\" pyproject.toml;\
        \ then\n  echo \"\u2705 Project configured for wheel builds\"\nelse\n  echo\
        \ \"\u274C Build system not configured\"\n  exit 1\nfi\n"
    timeout-minutes: 15
  validate-changelog:
    if: needs.is-release-pr.outputs.is-release == 'true'
    name: Validate CHANGELOG.md
    needs:
    - is-release-pr
    - validate-version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Check CHANGELOG updated
      run: "VERSION=\"${{ needs.validate-version.outputs.version }}\"\n\n# Check for\
        \ version section in CHANGELOG\nif grep -q \"## \\[${VERSION}\\]\" CHANGELOG.md\
        \ || \\\n   grep -q \"## ${VERSION}\" CHANGELOG.md; then\n  echo \"\u2705\
        \ CHANGELOG.md updated for v${VERSION}\"\nelse\n  echo \"\u274C CHANGELOG.md\
        \ missing entry for v${VERSION}\"\n  echo \"   Add a section like:  ## [${VERSION}]\
        \ - $(date +%Y-%m-%d)\"\n  exit 1\nfi\n"
    - name: Validate CHANGELOG format
      run: "# Check for standard sections\nCHANGELOG=$(cat CHANGELOG.md)\n\nif echo\
        \ \"$CHANGELOG\" | grep -q \"### Added\\|### Changed\\|### Fixed\\|### Security\"\
        ; then\n  echo \"\u2705 CHANGELOG has standard sections\"\nelse\n  echo \"\
        \u26A0\uFE0F  CHANGELOG should include: Added, Changed, Fixed, Security sections\"\
        \nfi\n"
    timeout-minutes: 15
  validate-manifest:
    if: needs.is-release-pr.outputs.is-release == 'true'
    name: Validate manifest integrity
    needs: is-release-pr
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Check manifest template
      run: "if [ -f \".codex/RELEASE_MANIFEST_TEMPLATE.json\" ]; then\n  python -c\
        \ \"import json; json.load(open('.codex/RELEASE_MANIFEST_TEMPLATE.json'))\"\
        \ && \\\n  echo \"\u2705 Manifest template valid JSON\"\nelse\n  echo \"\u26A0\
        \uFE0F  Manifest template not found (will use default)\"\nfi\n"
    timeout-minutes: 15
  validate-p0-gate:
    if: needs.is-release-pr.outputs.is-release == 'true'
    name: Validate P0 Gate
    needs: is-release-pr
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - id: p0-1
      name: 'P0.1: Profile alignment'
      run: "if [ -f \".codex/PROFILE_DRIFT_AUDIT.json\" ]; then\n  echo \"\u2705 P0.1.1:\
        \ Profile drift audit found\"\n  echo \"pass=true\" >> $GITHUB_OUTPUT\nelse\n\
        \  echo \"\u26A0\uFE0F  P0.1.1: Profile drift audit missing\"\n  echo \"pass=false\"\
        \ >> $GITHUB_OUTPUT\nfi\n"
    - id: p0-2
      name: 'P0.2: Manifest structure'
      run: "if [ -f \".codex/PROFILE_DEPENDENCY_MANIFEST.md\" ]; then\n  echo \"\u2705\
        \ P0.1.3: Profile manifest found\"\n  echo \"pass=true\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"\u26A0\uFE0F  P0.1.3: Profile manifest missing\"\n  echo \"\
        pass=false\" >> $GITHUB_OUTPUT\nfi\n"
    - name: P0 Summary
      run: 'echo "P0 Gate Status:"

        echo "  P0.1 (Profile Alignment): ${{ steps.p0-1.outputs.pass || ''unknown''
        }}"

        echo "  P0.2 (Manifest): ${{ steps.p0-2.outputs.pass || ''unknown'' }}"

        '
    timeout-minutes: 15
  validate-p1-gate:
    if: needs.is-release-pr.outputs.is-release == 'true'
    name: Validate P1 Gate
    needs: is-release-pr
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - id: p1-3
      name: 'P1.3: SBOM present'
      run: "if [ -f \"sbom.json\" ] || [ -f \".codex/sbom.json\" ]; then\n  echo \"\
        \u2705 P1.3: SBOM found\"\n  echo \"pass=true\" >> $GITHUB_OUTPUT\nelse\n\
        \  echo \"\u26A0\uFE0F  P1.3: SBOM not found (will be generated at release)\"\
        \n  echo \"pass=false\" >> $GITHUB_OUTPUT\nfi\n"
    - name: P1 Summary
      run: 'echo "P1 Gate Status:"

        echo "  P1.3 (SBOM): ${{ steps.p1-3.outputs.pass || ''unknown'' }}"

        '
    timeout-minutes: 15
  validate-p2-gate:
    if: needs.is-release-pr.outputs.is-release == 'true'
    name: Validate P2 Gate
    needs: is-release-pr
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - id: p2-1
      name: 'P2.2.1: Release workflow'
      run: "if [ -f \".github/workflows/release-to-pypi.yml\" ]; then\n  echo \"\u2705\
        \ P2.2.1: Release workflow found\"\n  echo \"pass=true\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"\u274C P2.2.1: Release workflow missing\"\n  exit 1\nfi\n"
    - id: p2-2
      name: 'P2.2.2: Smoke tests'
      run: "if [ -f \".github/workflows/smoke-tests-deployment.yml\" ]; then\n  echo\
        \ \"\u2705 P2.2.2: Smoke tests workflow found\"\n  echo \"pass=true\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"\u274C P2.2.2: Smoke tests workflow missing\"\n  exit 1\nfi\n"
    - id: p2-3
      name: 'P2.2.3: Deployment guide'
      run: "if [ -f \"docs/deployment/DEPLOYMENT_GUIDE.md\" ]; then\n  echo \"\u2705\
        \ P2.2.3: Deployment guide found\"\n  echo \"pass=true\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"\u274C P2.2.3: Deployment guide missing\"\n  exit 1\nfi\n"
    - id: p2-4
      name: 'P2.2.4: Rollback procedures'
      run: "if [ -f \"scripts/deploy/rollback_release.py\" ] && \\\n   [ -f \"docs/deployment/ROLLBACK_CHECKLIST.md\"\
        \ ]; then\n  echo \"\u2705 P2.2.4: Rollback procedures found\"\n  echo \"\
        pass=true\" >> $GITHUB_OUTPUT\nelse\n  echo \"\u274C P2.2.4: Rollback procedures\
        \ missing\"\n  exit 1\nfi\n"
    - name: P2 Summary
      run: 'echo "P2 Gate Status:"

        echo "  P2.2.1 (Release workflow): ${{ steps.p2-1.outputs.pass }}"

        echo "  P2.2.2 (Smoke tests): ${{ steps.p2-2.outputs.pass }}"

        echo "  P2.2.3 (Deployment guide): ${{ steps.p2-3.outputs.pass }}"

        echo "  P2.2.4 (Rollback): ${{ steps.p2-4.outputs.pass }}"

        '
    timeout-minutes: 15
  validate-release-notes:
    if: needs.is-release-pr.outputs.is-release == 'true'
    name: Validate release notes
    needs:
    - is-release-pr
    - validate-version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Check for release notes
      run: "VERSION=\"${{ needs.validate-version.outputs.version }}\"\n\n# Look for\
        \ release notes file\nif [ -f \"RELEASE_NOTES.md\" ] || \\\n   [ -f \".codex/RELEASE_NOTES_v${VERSION}.md\"\
        \ ] || \\\n   [ -f \"docs/releases/v${VERSION}.md\" ]; then\n  echo \"\u2705\
        \ Release notes found\"\nelse\n  echo \"\u26A0\uFE0F  No dedicated release\
        \ notes found\"\n  echo \"   Consider creating: docs/releases/v${VERSION}.md\"\
        \nfi\n"
    - name: Validate release notes content
      run: "# Check CHANGELOG for content\nif [ -s CHANGELOG.md ]; then\n  LINES=$(wc\
        \ -l < CHANGELOG.md)\n  if [ $LINES -gt 20 ]; then\n    echo \"\u2705 CHANGELOG\
        \ has sufficient content\"\n  else\n    echo \"\u26A0\uFE0F  CHANGELOG is\
        \ quite short (${LINES} lines)\"\n  fi\nfi\n"
    timeout-minutes: 60
  validate-version:
    if: needs.is-release-pr.outputs.is-release == 'true'
    name: Validate version bump
    needs: is-release-pr
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
    - id: version
      name: Check version in pyproject.toml
      run: "CURRENT_VERSION=$(grep '^version = ' pyproject.toml | cut -d'\"' -f2)\n\
        echo \"version=${CURRENT_VERSION}\" >> $GITHUB_OUTPUT\necho \"\U0001F4E6 Current\
        \ version: ${CURRENT_VERSION}\"\n"
    - name: Verify version is higher than last release
      run: "CURRENT_VERSION=\"${{ steps.version.outputs.version }}\"\n\n# Get last\
        \ tag\nLAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo \"v0.0.0\"\
        )\nLAST_VERSION=\"${LAST_TAG#v}\"\n\necho \"Last release: ${LAST_VERSION}\"\
        \necho \"Current version: ${CURRENT_VERSION}\"\n\n# Compare versions (simple\
        \ numeric comparison)\nif [[ \"${CURRENT_VERSION}\" > \"${LAST_VERSION}\"\
        \ ]] || [[ \"${CURRENT_VERSION}\" == \"${LAST_VERSION}\" ]]; then\n  echo\
        \ \"\u2705 Version is valid\"\nelse\n  echo \"\u274C Version must be higher\
        \ than last release\"\n  exit 1\nfi\n"
    timeout-minutes: 15
