name: CODEX Manifest Auto-Refresh
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
  schedule:
  - cron: '0 1 * * *'
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  validate-pr-manifest:
    name: Validate PR manifest (read-only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
    - name: Checkout PR head without publication credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
        token: ${{ github.token }}
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
    - name: Install minimal deps
      run: pip install pyyaml --quiet
    - name: Validate manifest generation and integrity without publishing
      # PR validation must not invoke --fix-all compliance automation or PR-body updates.
      # Verify the committed manifest first; regeneration rewrites its hash.
      run: |
        python scripts/ci/generate_manifest.py --verify-integrity
        python scripts/ci/generate_manifest.py
        python scripts/ci/generate_manifest.py --verify-integrity

  refresh-manifest:
    name: "\U0001F504 Refresh CODEX_MANIFEST.json"
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' &&
      (github.actor != 'github-actions[bot]' || github.event_name == 'schedule')
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
    - name: Checkout main for target resolution
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: main
        fetch-depth: 1
        token: ${{ github.token }}
    - name: "\U0001F500 Resolve push target (chain: sub-PR \u2192 0D_base_ \u2192\
        \ main)"
      id: resolve-target
      uses: ./.github/actions/resolve-push-target
      with:
        ensure-exists: 'true'
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13

    - name: Install minimal deps
      run: python -I -m pip install pyyaml detect-secrets --quiet
    - name: Checkout resolved target as data only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        repository: ${{ github.repository }}
        ref: ${{ steps.resolve-target.outputs.branch }}
        path: _manifest_target
        fetch-depth: 1
        token: ${{ github.token }}
    - name: Generate and sync target data with trusted main tooling
      id: refresh
      env:
        TARGET_ROOT: ${{ github.workspace }}/_manifest_target
      # Keep cwd/tooling on the immutable main checkout, never the sub-PR.
      # -I also prevents target PYTHONPATH/sitecustomize/module shadowing.
      run: |
        python -I scripts/ci/generate_manifest.py --repo-root "$TARGET_ROOT"
        python -I scripts/ci/sync_tracked_files.py --repo-root "$TARGET_ROOT" --fix --manifest-only --quiet
        python -I scripts/ci/generate_manifest.py --repo-root "$TARGET_ROOT" --verify-integrity
    - name: Publish generated manifest paths
      env:
        TARGET_REF: ${{ steps.resolve-target.outputs.branch }}
        TARGET_ROOT: ${{ github.workspace }}/_manifest_target
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
      run: |
        git -C "$TARGET_ROOT" config user.name "github-actions[bot]"
        git -C "$TARGET_ROOT" config user.email "github-actions[bot]@users.noreply.github.com"
        git -C "$TARGET_ROOT" add -- \
          CODEX_MANIFEST.json \
          .secrets.baseline

        # Only commit if there are actual changes
        if git -C "$TARGET_ROOT" diff --cached --quiet; then
          echo "All files already up-to-date — no commit needed"
        else
          git -C "$TARGET_ROOT" commit -m "chore(manifest): auto-refresh CODEX_MANIFEST.json [skip ci]"

          # Generation and publication use the same resolved branch.
          echo "🔀 Push target: ${TARGET_REF}"

          # Active-PR guard (inline — avoids composite action checkout overhead)
          PR_SKIP=false
          if [ "${TARGET_REF}" = "main" ] || [ "${TARGET_REF}" = "0D_base_" ]; then
            PR_COUNT=$(
              gh api \
                "repos/${{ github.repository }}/pulls?base=${TARGET_REF}&state=open&per_page=1" \
                --jq 'length' 2>/dev/null || echo "0"
            )
            if [ "${PR_COUNT}" -gt "0" ]; then
              PR_SKIP=true
              echo "⛔ ${PR_COUNT} open/draft PR(s) targeting ${TARGET_REF} — deferring push." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "The manifest will auto-refresh once all active PRs are merged." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ "${PR_SKIP}" = "true" ]; then
            echo "⛔ Push skipped — active PR(s) detected on ${TARGET_REF}."
          else
            if [ -n "${GH_TOKEN:-}" ]; then
              git -C "$TARGET_ROOT" remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            else
              echo "::warning::GH_TOKEN unavailable; continuing without reconfiguring remote"
            fi
            # A concurrent target update must reject this normal fast-forward push.
            # Regenerate from the new tip on the next run; never rebase generated files.
            git -C "$TARGET_ROOT" push origin "HEAD:${TARGET_REF}"
            echo "✅ CODEX_MANIFEST.json + compliance files refreshed and pushed to ${TARGET_REF}"

            # Re-trigger MkDocs Pages build explicitly after the [skip ci] commit.
            # [skip ci] prevents GitHub Actions workflows (including pages-mkdocs.yml) from
            # running on the auto-refresh push, but the branch-mode pages-build-deployment
            # (internal GitHub Pages service) is NOT skipped and would serve raw files → 404.
            # This explicit workflow_dispatch call bypasses [skip ci] and ensures the MkDocs
            # site is always rebuilt after a manifest refresh to main.
            if [ "${TARGET_REF}" = "main" ]; then
              echo "🔄 Triggering pages-mkdocs.yml rebuild to prevent branch-mode 404…"
              if gh workflow run pages-mkdocs.yml \
                --ref main \
                --field reason="post-manifest-refresh-pages-heal" \
                2>/dev/null; then
                echo "✅ pages-mkdocs.yml rebuild triggered"
              else
                echo "⚠️  Could not trigger pages-mkdocs.yml (non-fatal; pages-health-guard.yml will self-heal)"
              fi

              echo "⚡ Triggering auto-approve-workflows.yml (manifest sync gate)..."
              if gh workflow run auto-approve-workflows.yml \
                --ref "${TARGET_REF}" \
                -f approval_source=workflow-execution-gate \
                -f approval_intent=auto_approve_action_required \
                -f target_pr="${{ github.event.pull_request.number }}" \
                -f approval_reason="codex-manifest-refresh-passed" \
                2>/dev/null; then
                echo "✅ auto-approve-workflows.yml triggered (manifest sync)"
              else
                echo "⚠️  Could not trigger auto-approve-workflows.yml (non-fatal)"
              fi
            fi
          fi
        fi
    timeout-minutes: 30

  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: validate-pr-manifest
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.actor != ''dependabot[bot]'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: main
        token: ${{ github.token }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: CODEX Manifest Refresh
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
