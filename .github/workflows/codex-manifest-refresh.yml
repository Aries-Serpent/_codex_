name: CODEX Manifest Auto-Refresh
on:
  pull_request:
    types:
    - opened
    - reopened
  schedule:
  - cron: '0 1 * * *'
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: read
  actions: write
jobs:
  refresh-manifest:
    name: "\U0001F504 Refresh CODEX_MANIFEST.json"
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule'
    steps:
    - name: Checkout PR branch (or main on schedule)
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ github.head_ref || 'main' }}
        fetch-depth: 1
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
    - name: "\U0001F500 Resolve push target (chain: sub-PR \u2192 0D_base_ \u2192\
        \ main)"
      id: resolve-target
      uses: ./.github/actions/resolve-push-target
    - name: Set up Python with caching
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13

    - name: Install minimal deps
      run: pip install pyyaml --quiet
    - name: Regenerate CODEX_MANIFEST.json
      id: refresh
      run: 'python scripts/ci/generate_manifest.py

        python3 -c ''import json; d=json.load(open("CODEX_MANIFEST.json")); print("generated_at="+d["generated_at"])''
        >> "$GITHUB_OUTPUT"

        '
    - name: "Update compliance files (REQ-4/5 \u2014 PR runs only)"
      env:
        PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id
          }}
        GIT_SHA: ${{ github.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: "if [ \"${EVENT_NAME}\" = \"schedule\" ]; then\n  echo \"Scheduled run\
        \ \u2014 skipping PR-scoped compliance update (no PR payload)\"\nelse\n  python\
        \ scripts/ci/session_wrapup_autofix.py \\\n    --pr-number \"${PR_NUMBER}\"\
        \ \\\n    --sha \"${GIT_SHA:0:8}\" \\\n    --run-url \"${RUN_URL}\" \\\n \
        \   --fix-all\nfi\n"
    - name: Sync all tracked files (manifest integrity + .secrets.baseline + changelog)
      env:
        HEAD_REF: ${{ github.head_ref || 'main' }}
        EVENT_NAME: ${{ github.event_name }}
      run: "# sync_tracked_files.py atomically:\n#   1. Recomputes CODEX_MANIFEST.json\
        \ integrity_sha256 after generate_manifest.py\n#   2. Re-scans .secrets.baseline\
        \ for the updated manifest hash\n#   3. Validates CHANGELOG.md has a non-empty\
        \ [Unreleased] section\n#   4. Adds an auto-sync stub to AGENT_ACCOUNTABILITY_REPORT.md\
        \ if needed\n# This eliminates the manual \"update .secrets.baseline\" step\
        \ that agents\n# frequently forget, which was a recurring P-B / P-E cascade\
        \ failure pattern.\nif python -m detect_secrets --version >/dev/null 2>&1;\
        \ then\n  python scripts/ci/sync_tracked_files.py --fix --manifest-only --quiet\n\
        \  echo \"\u2705 sync_tracked_files.py applied manifest + baseline sync\"\n\
        else\n  echo \"\u2139\uFE0F  detect-secrets not installed \u2014 skipping\
        \ .secrets.baseline sync\"\n  echo \"   Install: pip install detect-secrets\"\
        \nfi\ngit config user.name  \"github-actions[bot]\"\ngit config user.email\
        \ \"github-actions[bot]@users.noreply.github.com\"\ngit add CODEX_MANIFEST.json\
        \ \\\n        .secrets.baseline \\\n        docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md\
        \ \\\n        CHANGELOG.md\n# Only commit if there are actual changes\nif\
        \ git diff --cached --quiet; then\n  echo \"All files already up-to-date \u2014\
        \ no commit needed\"\nelse\n  git commit -m \"chore(manifest): auto-refresh\
        \ CODEX_MANIFEST.json [skip ci]\"\n  # For schedule/dispatch runs walk the\
        \ staging chain; for PR runs use the PR branch.\n  if [ \"${EVENT_NAME}\"\
        \ = \"schedule\" ] || [ -z \"${HEAD_REF}\" ]; then\n    TARGET_REF=\"${{ steps.resolve-target.outputs.branch\
        \ }}\"\n    echo \"\U0001F500 Push target: ${TARGET_REF} (reason: ${{ steps.resolve-target.outputs.reason\
        \ }})\"\n  else\n    TARGET_REF=\"${HEAD_REF}\"\n  fi\n\n  # \u2500\u2500\
        \ Active-PR guard (inline \u2014 avoids composite action checkout overhead)\
        \ \u2500\n  # Skip push to main/0D_base_ if ANY open or draft PR exists targeting\n\
        \  # that branch.  The old file-overlap approach was insufficient: it missed\n\
        \  # PRs that hadn't yet touched manifest files but would conflict once the\n\
        \  # auto-refresh pushed a new generated_at + integrity_sha.\n  PR_SKIP=false\n\
        \  if [ \"${TARGET_REF}\" = \"main\" ] || [ \"${TARGET_REF}\" = \"0D_base_\"\
        \ ]; then\n    PR_COUNT=$(gh api \\\n      \"repos/${{ github.repository }}/pulls?base=${TARGET_REF}&state=open&per_page=1\"\
        \ \\\n      --jq 'length' 2>/dev/null || echo \"0\")\n    if [ \"${PR_COUNT}\"\
        \ -gt \"0\" ]; then\n      PR_SKIP=true\n      echo \"\u26D4 ${PR_COUNT} open/draft\
        \ PR(s) targeting ${TARGET_REF} \u2014 deferring push.\" \\\n        | tee\
        \ -a \"$GITHUB_STEP_SUMMARY\"\n      echo \"The manifest will auto-refresh\
        \ once all active PRs are merged.\" \\\n        >> \"$GITHUB_STEP_SUMMARY\"\
        \n    fi\n  fi\n  # \u2500\u2500 end active-PR guard \u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\n\n  if [ \"${PR_SKIP}\" = \"true\" ]; then\n   \
        \ echo \"\U0001F6AB Push skipped \u2014 active PR(s) detected on ${TARGET_REF}.\"\
        \n  else\n    git pull --rebase --autostash origin \"${TARGET_REF}\" 2>/dev/null\
        \ || true\n    git push origin \"HEAD:${TARGET_REF}\"\n    echo \"\u2705 CODEX_MANIFEST.json\
        \ + compliance files refreshed and pushed to ${TARGET_REF}\"\n\n  # Re-trigger\
        \ MkDocs Pages build explicitly after the [skip ci] commit.\n  # [skip ci]\
        \ prevents GitHub Actions workflows (including pages-mkdocs.yml) from\n  \
        \  # running on the auto-refresh push, but the branch-mode pages-build-deployment\n\
        \  # (internal GitHub Pages service) is NOT skipped and would serve raw files\
        \ \u2192 404.\n  # This explicit workflow_dispatch call bypasses [skip ci]\
        \ and ensures the MkDocs\n  # site is always rebuilt after a manifest refresh\
        \ to main.\n    if [ \"${TARGET_REF}\" = \"main\" ]; then\n      echo \"\U0001F504\
        \ Triggering pages-mkdocs.yml rebuild to prevent branch-mode 404\u2026\"\n\
        \      gh workflow run pages-mkdocs.yml \\\n        --ref main \\\n      \
        \  --field reason=\"post-manifest-refresh-pages-heal\" 2>/dev/null \\\n  \
        \      && echo \"\u2705 pages-mkdocs.yml rebuild triggered\" \\\n        ||\
        \ echo \"\u26A0\uFE0F  Could not trigger pages-mkdocs.yml (non-fatal; pages-health-guard.yml\
        \ will self-heal)\"\n\n  # Auto-approve pending runs (manifest sync gate)\n\
        \      echo \"\u26A1 Triggering auto-approve-workflows.yml (manifest sync\
        \ gate)...\"\n      gh workflow run auto-approve-workflows.yml \\\n      \
        \  --ref \"${TARGET_REF}\" \\\n        -f approval_source=workflow-execution-gate\
        \ \\\n        -f approval_intent=auto_approve_action_required \\\n       \
        \ -f target_pr=\"${{ github.event.pull_request.number }}\" \\\n        -f\
        \ approval_reason=\"codex-manifest-refresh-passed\" 2>/dev/null \\\n     \
        \   && echo \"\u2705 auto-approve-workflows.yml triggered (manifest sync)\"\
        \ \\\n        || echo \"\u26A0\uFE0F  Could not trigger auto-approve-workflows.yml\
        \ (non-fatal)\"\n    fi\n  fi\nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    timeout-minutes: 30
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: refresh-manifest
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: CODEX Manifest Refresh
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
