name: Copilot PR Session Injector

# Uses mvkaran/gh-copilot@v1.0.0 to enrich every new PR with:
#   1. Cognitive brain context injection (relevant patterns, session history)
#   2. Structured PR analysis (affected components, risk level, test coverage gaps)
#   3. A ready-to-use @copilot prompt seeded with the analysis
#
# This replaces the manual "post S109 follow-up" step — every PR gets
# a Copilot-generated cognitive brain briefing automatically.
#
# Requires:
#   secrets.CODEX_MASTER_KEY — fine-grained PAT with:
#     - Copilot Requests (for copilot-token)
#     - pull-requests: write (for PR comment)
#   See .codex/docs/ADMIN_MANUAL_SETUP_GUIDE.md § 3

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  inject-context:
    name: Inject Cognitive Brain Context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Grounded: fetch base branch ref so git diff origin/<base>...HEAD resolves.
      # actions/checkout only fetches the checked-out branch even with fetch-depth: 0.
      # Without this, non-default base branches (e.g. 0D_base_) cause exit 128.
      # See: https://github.com/actions/checkout/issues/1262
      - name: "🔀 Fetch base branch ref for diff"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "${BASE_REF}" --depth=1 2>/dev/null \
            && echo "✅ Base branch '${BASE_REF}' fetched" \
            || echo "⚠️ Base branch fetch failed — diffs will use fallback"

      - name: Collect changed files and PR metadata
        id: meta
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null | head -50 | tr '\n' ',' | sed 's/,$//')
          echo "changed_files=${CHANGED}" >> $GITHUB_OUTPUT

          # Detect cognitive brain touch
          BRAIN_TOUCHED=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null | grep -c "cognitive\|mcp_session\|structural_policy\|session_hook" || true)
          : ${BRAIN_TOUCHED:=0}
          echo "brain_touched=${BRAIN_TOUCHED}" >> $GITHUB_OUTPUT

          # Detect CI touch
          CI_TOUCHED=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null | grep -c "\.github/workflows" || true)
          : ${CI_TOUCHED:=0}
          echo "ci_touched=${CI_TOUCHED}" >> $GITHUB_OUTPUT

      - name: Analyze PR with GitHub Copilot
        id: pr_analysis
        continue-on-error: true
        uses: mvkaran/gh-copilot@v1.0.0
        with:
          copilot-token: ${{ secrets.CODEX_MASTER_KEY }}
          github-mcp-token: ${{ secrets.CODEX_MASTER_KEY }}
          timeout: "5"
          output-format: json
          output-schema: |
            {
              "risk_level": "critical|high|medium|low",
              "affected_components": ["array of component paths"],
              "relevant_patterns": ["e.g. P-038, P-042"],
              "test_coverage_gaps": ["list of untested areas or empty array"],
              "cognitive_brain_impact": "none|low|medium|high",
              "review_focus": "one sentence on what reviewer should focus on",
              "suggested_copilot_task": "one sentence task for @copilot to continue"
            }
          system-prompt: |
            You are a senior code reviewer for the Aries-Serpent/_codex_ Python repository.
            Core modules: src/codex/cognitive/ (brain, RBAC, session injection),
            src/codex_ml/ (ML training, HF models), src/codex/github/ (MCP poster, discussions),
            tests/ (pytest, coverage tracking), .github/workflows/ (CI/CD).

            Known patterns: P-038 (shard crash), P-039 (CodeQL), P-042 (HF_REVISION),
            P-043 (HF mock), P-044 (pure coverage tests), P-046 (CI feedback).

            cognitive_brain_impact levels:
              none: no cognitive/ files touched
              low: docs or tests only
              medium: session_hook, mcp_session_bridge
              high: structural_policy_manager, agent_brain_api, planset_orchestrator

            Return ONLY valid JSON. No markdown fences.
          prompt: |
            Analyze this pull request for the _codex_ repository:

            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            Author: ${{ github.event.pull_request.user.login }}
            Base: ${{ github.base_ref }} ← Head: ${{ github.head_ref }}
            Changed files (${{ steps.meta.outputs.brain_touched }} cognitive brain files,
            ${{ steps.meta.outputs.ci_touched }} CI files):
            ${{ steps.meta.outputs.changed_files }}

            PR Description:
            ${{ github.event.pull_request.body }}

            Provide a structured analysis JSON.

      - name: Post cognitive brain briefing on PR
        id: briefing
        if: steps.pr_analysis.outputs.validation-status == 'valid'
        uses: actions/github-script@v7
        env:
          ANALYSIS_JSON: ${{ steps.pr_analysis.outputs.response }}
          BRAIN_TOUCHED: ${{ steps.meta.outputs.brain_touched }}
          CI_TOUCHED: ${{ steps.meta.outputs.ci_touched }}
        with:
          github-token: ${{ secrets.CODEX_MASTER_KEY }}
          script: |
            const analysis = JSON.parse(process.env.ANALYSIS_JSON);
            const brainTouched = parseInt(process.env.BRAIN_TOUCHED || '0') > 0;
            const ciTouched    = parseInt(process.env.CI_TOUCHED    || '0') > 0;

            const riskEmoji = {
              critical: '🔴', high: '🟠', medium: '🟡', low: '🟢'
            }[analysis.risk_level] || '⚪';

            const impactEmoji = {
              high: '🧠🔴', medium: '🧠🟡', low: '🧠🟢', none: ''
            }[analysis.cognitive_brain_impact] || '';

            const patterns = analysis.relevant_patterns?.length
              ? analysis.relevant_patterns.map(p => `\`${p}\``).join(', ')
              : '_none detected_';

            const gaps = analysis.test_coverage_gaps?.length
              ? analysis.test_coverage_gaps.map(g => `- ${g}`).join('\n')
              : '- None identified';

            const components = analysis.affected_components?.length
              ? analysis.affected_components.map(c => `\`${c}\``).join(', ')
              : '_unknown_';

            const brainBadge = brainTouched ? ' 🧠 **Cognitive Brain files modified**' : '';
            const ciBadge    = ciTouched    ? ' ⚙️ **CI/CD files modified**'            : '';

            // Build @copilot follow-up seeded with analysis
            const copilotTask = analysis.suggested_copilot_task || 'Continue implementation following the plan.';

            const gapsText = analysis.test_coverage_gaps?.length
              ? analysis.test_coverage_gaps.map(g => `- ${g}`).join('\n            ')
              : '- None identified';

            const bodyLines = [
              '## 🧠 Cognitive Brain PR Briefing',
              '',
              `${riskEmoji} **Risk:** ${analysis.risk_level}${impactEmoji ? ' · ' + impactEmoji : ''}${brainBadge}${ciBadge}`,
              '',
              '| Field | Value |',
              '|-------|-------|',
              `| **Affected components** | ${components} |`,
              `| **Relevant patterns** | ${patterns} |`,
              `| **Cognitive brain impact** | ${analysis.cognitive_brain_impact} |`,
              `| **Review focus** | ${analysis.review_focus} |`,
              '',
              '### 🔍 Test Coverage Gaps',
              gapsText,
              '',
              '---',
              '',
              '### 🤖 Suggested @copilot continuation task',
              `> ${copilotTask}`,
              '',
              'To trigger immediately, reply with:',
              '```',
              `@copilot ${copilotTask}`,
              '```',
              '',
              `<sub>Generated by [GitHub Copilot Action](https://github.com/marketplace/actions/github-copilot-action) (mvkaran/gh-copilot@v1.0.0) · S108 Cognitive Brain Integration · \`.github/workflows/copilot-pr-session-injector.yml\`</sub>`,
            ];
            const body = bodyLines.join('\n');

            // Store for dashboard posting
            core.setOutput('body', body);
            core.info(`✅ Cognitive brain briefing prepared for PR #${context.payload.pull_request.number}`);

      - name: Post to PR Status Dashboard
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/post-pr-summary
        with:
          workflow-name: 'Copilot PR Session Injector'
          status: 'info'
          summary: ${{ steps.pr_analysis.outputs.validation-status == 'valid' && '🧠 Cognitive brain briefing prepared' || 'Cognitive brain analysis skipped (token unavailable)' }}
          details: ${{ steps.briefing.outputs.body || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback (Copilot unavailable or key missing)
        if: steps.pr_analysis.outcome == 'failure' || steps.pr_analysis.outputs.validation-status != 'valid'
        run: |
          echo "ℹ️ Copilot PR analysis skipped — status: ${{ steps.pr_analysis.outputs.validation-status }}"
          echo "Ensure CODEX_MASTER_KEY has 'Copilot Requests' fine-grained permission."
          echo "See .codex/docs/ADMIN_MANUAL_SETUP_GUIDE.md § 3"

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: inject-context
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Copilot PR Session Injector"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"******","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: copilot-pr-session-injector.yml → rescue-comment job (S227)_"""
          _,comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100")
          existing_id=None; existing_body=""
          if isinstance(comments,list):
            for c in comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
