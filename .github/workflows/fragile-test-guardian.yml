name: Fragile Test Guardian
true:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    paths:
    - tests/**/*.py
    - .github/workflows/fragile-test-guardian.yml
    - .codex/scripts/fragile_tests_scan.py
  push:
    branches:
    - main
    paths:
    - tests/**/*.py
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  PYTHON_VERSION: '3.11'
  CI_CONTEXT: fragile-test-guardian
jobs:
  detect-fragile-imports:
    name: Detect Fragile Imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      fragile_files: ${{ steps.scan.outputs.fragile_files }}
      fragile_count: ${{ steps.scan.outputs.fragile_count }}
      has_violations: ${{ steps.scan.outputs.has_violations }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Run fragile tests scan
      id: scan
      run: "set +e  # Don't exit on error, we want to capture results\n\npython .codex/scripts/fragile_tests_scan.py\
        \ > scan_output.txt 2>&1\nSCAN_EXIT=$?\n\n# Parse results\nFRAGILE_COUNT=$(python3\
        \ << 'EOF'\nimport json\nfrom pathlib import Path\ntry:\n    data = json.loads(Path('.codex/fragile_tests.json').read_text())\n\
        \    print(len(data))\nexcept:\n    print(0)\nEOF\n)\n\necho \"fragile_files=$(cat\
        \ .codex/fragile_tests.json | base64 -w0)\" >> $GITHUB_OUTPUT\necho \"fragile_count=$FRAGILE_COUNT\"\
        \ >> $GITHUB_OUTPUT\n\nif [ $FRAGILE_COUNT -gt 0 ]; then\n    echo \"has_violations=true\"\
        \ >> $GITHUB_OUTPUT\nelse\n    echo \"has_violations=false\" >> $GITHUB_OUTPUT\n\
        fi\n\ncat scan_output.txt\n"
    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: fragile-tests-scan
        path: .codex/fragile_tests.json
        retention-days: 30
  detect-unhandled-flaky:
    name: Detect Unhandled Flaky Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      unhandled_flaky: ${{ steps.detect.outputs.unhandled_count }}
      has_flaky_violations: ${{ steps.detect.outputs.has_violations }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Detect unhandled flaky tests
      id: detect
      run: "# shellcheck disable=SC1036,SC1088,SC2283\npython3 << 'PYTHON_SCRIPT'\n\
        import re\nimport json\nfrom pathlib import Path\n\n# Flaky patterns that\
        \ should be marked with @pytest.mark.flaky\nFLAKY_PATTERNS = {\n    'async_operations':\
        \ r'(@pytest\\.mark\\.asyncio|asyncio\\.run|await |async def)',\n    'network_calls':\
        \ r'(requests\\.|http\\.|socket\\.|urlopen)',\n    'file_io': r'(open\\(|Path\\\
        (|os\\.path\\.|os\\.mkdir|os\\.remove)',\n    'datetime_dependent': r'(datetime\\\
        .now|time\\.time|timezone|utcnow)',\n    'random_values': r'(random\\.|np\\\
        .random|torch\\.rand)',\n}\n\nFLAKY_MARKER = r'@pytest\\.mark\\.flaky'\n\n\
        violations = []\ntest_files = sorted(Path('tests').rglob('test_*.py'))\n\n\
        for test_file in test_files[:100]:  # Sample first 100 files for speed\n \
        \   try:\n        content = test_file.read_text(encoding='utf-8', errors='ignore')\n\
        \    except:\n        continue\n    \n    # Check if file has flaky markers\n\
        \    has_flaky_marker = bool(re.search(FLAKY_MARKER, content))\n    \n   \
        \ # Check for flaky patterns\n    has_flaky_patterns = False\n    for pattern_name,\
        \ pattern in FLAKY_PATTERNS.items():\n        if re.search(pattern, content):\n\
        \            has_flaky_patterns = True\n            \n            # Only report\
        \ if no flaky marker AND many instances\n            if not has_flaky_marker\
        \ and len(re.findall(pattern, content)) > 2:\n                violations.append({\n\
        \                    'file': str(test_file.relative_to(Path.cwd())),\n   \
        \                 'pattern': pattern_name,\n                    'instances':\
        \ len(re.findall(pattern, content))\n                })\n                break\n\
        \n# Output results\nprint(f\"Unhandled flaky tests found: {len(violations)}\"\
        )\n\noutput_file = Path('.codex/phase5_unhandled_flaky.json')\noutput_file.parent.mkdir(parents=True,\
        \ exist_ok=True)\noutput_file.write_text(json.dumps(violations, indent=2))\n\
        \n# Set GitHub Output\nwith open(Path.home() / '.github_output', 'a') as f:\n\
        \    f.write(f'unhandled_count={len(violations)}\\n')\n    f.write(f'has_violations={\"\
        true\" if len(violations) > 0 else \"false\"}\\n')\n\nif len(violations) >\
        \ 0:\n    print(\"\\n\u274C Unhandled flaky tests detected:\")\n    for v\
        \ in violations[:5]:\n        print(f\"  - {v['file']}: {v['pattern']} ({v['instances']}\
        \ instances)\")\nPYTHON_SCRIPT\n\n# Read output file\nif [ -f .codex/phase5_unhandled_flaky.json\
        \ ]; then\n    COUNT=$(python3 -c \"import json; print(len(json.load(open('.codex/phase5_unhandled_flaky.json'))))\"\
        )\n    echo \"unhandled_count=$COUNT\" >> $GITHUB_OUTPUT\n    if [ $COUNT\
        \ -gt 0 ]; then\n        echo \"has_violations=true\" >> $GITHUB_OUTPUT\n\
        \    else\n        echo \"has_violations=false\" >> $GITHUB_OUTPUT\n    fi\n\
        else\n    echo \"unhandled_count=0\" >> $GITHUB_OUTPUT\n    echo \"has_violations=false\"\
        \ >> $GITHUB_OUTPUT\nfi\n"
    - name: Upload flaky detection results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: unhandled-flaky-tests
        path: .codex/phase5_unhandled_flaky.json
        retention-days: 30
  check-docstring-coverage:
    name: Check Docstring Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      docstring_coverage: ${{ steps.coverage.outputs.coverage_pct }}
      missing_docstrings: ${{ steps.coverage.outputs.missing_count }}
      coverage_regressed: ${{ steps.coverage.outputs.regressed }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Analyze docstring coverage
      id: coverage
      run: "# shellcheck disable=SC1036,SC1088,SC2283\npython3 << 'PYTHON_SCRIPT'\n\
        import ast\nimport json\nfrom pathlib import Path\n\ntest_files = list(Path('tests').rglob('test_*.py'))\n\
        \ntotal_tests = 0\ndocumented_tests = 0\nmissing_docstrings = []\n\nfor test_file\
        \ in test_files[:200]:  # Sample\n    try:\n        content = test_file.read_text(encoding='utf-8',\
        \ errors='ignore')\n        tree = ast.parse(content)\n    except:\n     \
        \   continue\n    \n    for node in ast.walk(tree):\n        if isinstance(node,\
        \ ast.FunctionDef) and node.name.startswith('test_'):\n            total_tests\
        \ += 1\n            if ast.get_docstring(node):\n                documented_tests\
        \ += 1\n            else:\n                missing_docstrings.append({\n \
        \                   'file': str(test_file.relative_to(Path.cwd())),\n    \
        \                'function': node.name\n                })\n\ncoverage_pct\
        \ = int(100 * documented_tests / total_tests) if total_tests > 0 else 0\n\n\
        print(f\"Docstring Coverage: {coverage_pct}% ({documented_tests}/{total_tests})\"\
        )\nprint(f\"Missing docstrings: {len(missing_docstrings)}\")\n\n# Save to\
        \ file\noutput = Path('.codex/phase5_docstring_coverage.json')\noutput.parent.mkdir(parents=True,\
        \ exist_ok=True)\noutput.write_text(json.dumps({\n    'coverage_pct': coverage_pct,\n\
        \    'total_tests': total_tests,\n    'documented': documented_tests,\n  \
        \  'missing_count': len(missing_docstrings),\n    'missing_docstrings': missing_docstrings[:20]\n\
        }, indent=2))\n\n# Check against baseline (Phase 5 target: >90%)\nregressed\
        \ = 'true' if coverage_pct < 90 else 'false'\n\nwith open(Path.home() / '.github_output',\
        \ 'a') as f:\n    f.write(f'coverage_pct={coverage_pct}\\n')\n    f.write(f'missing_count={len(missing_docstrings)}\\\
        n')\n    f.write(f'regressed={regressed}\\n')\nPYTHON_SCRIPT\n\n# Read results\n\
        import json\nresult = json.load(open('.codex/phase5_docstring_coverage.json'))\n\
        echo \"coverage_pct=$(python3 -c \\\"print($result['coverage_pct'])\\\")\"\
        \ >> $GITHUB_OUTPUT\necho \"missing_count=$(python3 -c \\\"print($result['missing_count'])\\\
        \")\" >> $GITHUB_OUTPUT\necho \"regressed=$(python3 -c \\\"print('true' if\
        \ $result['coverage_pct'] < 90 else 'false')\\\")\" >> $GITHUB_OUTPUT\n"
    - name: Upload coverage results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: docstring-coverage
        path: .codex/phase5_docstring_coverage.json
        retention-days: 30
  report-violations:
    name: Report Test Violations
    runs-on: ubuntu-latest
    needs:
    - detect-fragile-imports
    - detect-unhandled-flaky
    - check-docstring-coverage
    permissions:
      pull-requests: write
    if: always() && github.event_name == 'pull_request'
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v5
    - name: Generate violation report
      id: report
      run: "# Compile violation summary\nVIOLATION_SUMMARY=\"\"\n\n# Check fragile\
        \ imports\nif [ -f \"fragile-tests-scan/.codex/fragile_tests.json\" ]; then\n\
        \    COUNT=$(python3 -c \"import json; print(len(json.load(open('fragile-tests-scan/.codex/fragile_tests.json'))))\"\
        )\n    if [ $COUNT -gt 0 ]; then\n        VIOLATION_SUMMARY=\"${VIOLATION_SUMMARY}###\
        \ \u274C Fragile Imports (${COUNT} files)\n\\`\\`\\`\n$(head -20 fragile-tests-scan/.codex/fragile_tests.json)\n\
        \\`\\`\\`\nAdd \\`pytest.importorskip()\\` guards for optional packages.\n\
        \n\"\n    fi\nfi\n\n# Check unhandled flaky\nif [ -f \"unhandled-flaky-tests/.codex/phase5_unhandled_flaky.json\"\
        \ ]; then\n    COUNT=$(python3 -c \"import json; print(len(json.load(open('unhandled-flaky-tests/.codex/phase5_unhandled_flaky.json'))))\"\
        \ || echo \"0\")\n    if [ $COUNT -gt 0 ]; then\n        VIOLATION_SUMMARY=\"\
        ${VIOLATION_SUMMARY}### \u26A0\uFE0F Unhandled Flaky Tests (${COUNT} detected)\n\
        Mark with \\`@pytest.mark.flaky\\` or stabilize with mocks/fixtures.\n\n\"\
        \n    fi\nfi\n\n# Check docstring coverage\nif [ -f \"docstring-coverage/.codex/phase5_docstring_coverage.json\"\
        \ ]; then\n    COVERAGE=$(python3 -c \"import json; print(json.load(open('docstring-coverage/.codex/phase5_docstring_coverage.json'))['coverage_pct'])\"\
        )\n    MISSING=$(python3 -c \"import json; print(json.load(open('docstring-coverage/.codex/phase5_docstring_coverage.json'))['missing_count'])\"\
        )\n    if [ $COVERAGE -lt 90 ]; then\n        VIOLATION_SUMMARY=\"${VIOLATION_SUMMARY}###\
        \ \U0001F4DA Docstring Coverage (${COVERAGE}%, missing ${MISSING})\nTarget:\
        \ >90%. Add docstrings to all test functions.\n\n\"\n    fi\nfi\n\necho \"\
        violation_summary<<EOF\" >> $GITHUB_ENV\necho \"$VIOLATION_SUMMARY\" >> $GITHUB_ENV\n\
        echo \"EOF\" >> $GITHUB_ENV\n"
    - name: Comment on PR
      if: env.violation_summary != ''
      uses: actions/github-script@v8
      with:
        script: "const violations = process.env.violation_summary || \"No violations\
          \ detected\";\n\ngithub.rest.issues.createComment({\n  issue_number: context.issue.number,\n\
          \  owner: context.repo.owner,\n  repo: context.repo.repo,\n  body: `## \U0001F9EA\
          \ Fragile Test Guardian Report\n\n${violations}\n\n**Phase 5 Lane 2 Enforcement**\
          \ (Advisory in Phase 5, Blocking in Phase 6)\n\nFor details, see:\n- [Audit\
          \ Report](.codex/PHASE_5_FLAKY_TEST_AUDIT_REPORT.md)\n- [Remediation Guide](.codex/PHASE_5_FLAKY_TEST_REMEDIATION.json)`\n\
          });\n"
    - name: Set status
      uses: actions/github-script@v8
      with:
        script: "const fragile = '${{ needs.detect-fragile-imports.outputs.has_violations\
          \ }}' === 'true';\nconst flaky = '${{ needs.detect-unhandled-flaky.outputs.has_flaky_violations\
          \ }}' === 'true';\nconst docstring = '${{ needs.check-docstring-coverage.outputs.coverage_regressed\
          \ }}' === 'true';\n\nconst state = (fragile || flaky || docstring) ? 'success'\
          \ : 'success';\nconst description = `Fragile: ${fragile ? '\u274C' : '\u2705\
          '} | Flaky: ${flaky ? '\u274C' : '\u2705'} | Docstring: ${docstring ? '\u274C\
          ' : '\u2705'}`;\n\ngithub.rest.repos.createCommitStatus({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  sha: context.sha,\n  state: 'success',  //\
          \ Phase 5: advisory only\n  context: 'Fragile Test Guardian',\n  description:\
          \ description\n});\n"
    timeout-minutes: 30
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs:
    - detect-fragile-imports
    - detect-unhandled-flaky
    - check-docstring-coverage
    permissions: {}
    if: always()
    steps:
    - name: Print Phase 5 Summary
      run: 'echo "## Phase 5 Lane 2: Flaky Test Guardian Summary"

        echo ""

        echo "### Fragile Imports"

        echo "- Detected: ${{ needs.detect-fragile-imports.outputs.fragile_count }}
        files"

        echo "- Status: ${{ needs.detect-fragile-imports.outputs.has_violations }}"

        echo ""

        echo "### Unhandled Flaky Tests"

        echo "- Detected: ${{ needs.detect-unhandled-flaky.outputs.unhandled_flaky
        }}"

        echo "- Status: ${{ needs.detect-unhandled-flaky.outputs.has_flaky_violations
        }}"

        echo ""

        echo "### Docstring Coverage"

        echo "- Coverage: ${{ needs.check-docstring-coverage.outputs.docstring_coverage
        }}%"

        echo "- Missing: ${{ needs.check-docstring-coverage.outputs.missing_docstrings
        }}"

        echo ""

        echo "**Status**: Phase 5 Advisory (non-blocking)"

        echo "**Phase 6**: Violations will block merge"

        '
    timeout-minutes: 30
