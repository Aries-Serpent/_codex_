name: "🚨 Deferral Language Gate"

# Enforces the AI Codebase Agency Policy:
#   Any deferral language in PR body or commit messages triggers a hard failure
#   and forces the agent to reload policy + memory before continuing.
#
# Policy: .codex/CODEBASE_AGENCY_POLICY.md
# Script: scripts/ci/check_deferral_language.py
#
# ML enhancement (opt-in):
#   Set repository/environment variable DEFERRAL_SCANNER_ML=1 to enable the
#   TF-IDF + LogisticRegression classifier as a second-pass detector.
#   Regex patterns always run regardless of this flag.

on:
  pull_request:
    # 'edited' intentionally omitted: report_progress updates the PR body on
    # every push, which fires 'edited' alongside 'synchronize'. With
    # cancel-in-progress the two runs race and one gets cancelled — the CI
    # dashboard then reports the latest run as "cancelled" (looks like a failure).
    # Removing 'edited' eliminates the double-trigger. The deferral check still
    # scans the full PR body on every 'synchronize' event (push), so coverage
    # is identical.
    types: [opened, synchronize, reopened]

concurrency:
  group: deferral-gate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  deferral-language-check:
    name: "🚨 Deferral Language Policy Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5

      - name: "🗂️ Pre-create pip cache dir"
        run: mkdir -p ~/.cache/pip
        # setup-python@v5 post-step fails with "Cache folder doesn't exist on disk"
        # when no packages were installed (the default when DEFERRAL_SCANNER_ML=0).
        # Pre-creating the directory prevents that transient post-step failure.

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # No pip cache: scikit-learn is only installed when DEFERRAL_SCANNER_ML=1
          # (which is off by default).  In the common case nothing is installed,
          # ~/.cache/pip is never created, and the post-step fails with
          # "Cache folder doesn't exist on disk".  Cache is not worth the
          # fragility given the conditional install.

      - name: "📦 Install ML dependencies (if DEFERRAL_SCANNER_ML=1)"
        if: ${{ vars.DEFERRAL_SCANNER_ML == '1' || env.DEFERRAL_SCANNER_ML == '1' }}
        run: |
          pip install --quiet scikit-learn

      - name: "📝 Write PR body to file"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          echo "PR body written ($(wc -c < /tmp/pr_body.txt) bytes)"

      - name: "🔍 Scan PR body for deferral language"
        id: scan_pr_body
        env:
          DEFERRAL_SCANNER_ML: ${{ vars.DEFERRAL_SCANNER_ML || '0' }}
        run: |
          python scripts/ci/check_deferral_language.py --pr-body /tmp/pr_body.txt
        continue-on-error: true

      - name: "🔍 Scan last 10 commit messages for deferral language"
        id: scan_commits
        env:
          DEFERRAL_SCANNER_ML: ${{ vars.DEFERRAL_SCANNER_ML || '0' }}
        run: |
          python scripts/ci/check_deferral_language.py --git-log
        continue-on-error: true

      # GAP FIXED (S173 PR #3661): The gate previously only scanned PR body +
      # commit messages. Agent deferral language appeared in PR *comments* -- e.g.
      # "Confirm the 3576 are pre-existing, not introduced by this PR" -- which
      # was not caught. This step fetches the last 50 agent-posted PR comments
      # (copilot-swe-agent[bot], github-copilot[bot], copilot[bot]) via the
      # GitHub API and scans them for deferral language.
      - name: "🔍 Fetch agent-posted PR comments for deferral scan"
        id: fetch_pr_comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Fetching last 50 PR comments for PR #${PR_NUMBER}..."
          gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=50" \
            --jq '.[] | select(
              .user.login == "copilot-swe-agent[bot]" or
              .user.login == "github-copilot[bot]" or
              .user.login == "copilot[bot]" or
              .user.login == "Copilot"
            ) | {body: .body, user: {login: .user.login}}' \
            > /tmp/pr_comments.jsonl || echo '{}' > /tmp/pr_comments.jsonl
          LINE_COUNT=$(wc -l < /tmp/pr_comments.jsonl)
          echo "Fetched ${LINE_COUNT} agent comment(s) for deferral scan"

      - name: "🔍 Scan agent PR comments for deferral language"
        id: scan_pr_comments
        env:
          DEFERRAL_SCANNER_ML: ${{ vars.DEFERRAL_SCANNER_ML || '0' }}
        run: |
          if [ -s /tmp/pr_comments.jsonl ]; then
            python scripts/ci/check_deferral_language.py --pr-comments /tmp/pr_comments.jsonl
          else
            echo "No agent comments to scan."
          fi
        continue-on-error: true

      - name: "📊 Evaluate results and enforce policy"
        env:
          PR_SCAN: ${{ steps.scan_pr_body.outcome }}
          COMMIT_SCAN: ${{ steps.scan_commits.outcome }}
          COMMENT_SCAN: ${{ steps.scan_pr_comments.outcome }}
        run: |
          set -euo pipefail
          FAIL=0

          if [ "$PR_SCAN" = "failure" ]; then
            echo "::error::PR body contains deferral language -- policy violation"
            echo "::error::MANDATORY: Load .codex/CODEBASE_AGENCY_POLICY.md and docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md"
            FAIL=1
          fi

          if [ "$COMMIT_SCAN" = "failure" ]; then
            echo "::error::Commit message(s) contain deferral language -- policy violation"
            echo "::error::MANDATORY: Load .codex/CODEBASE_AGENCY_POLICY.md and docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md"
            FAIL=1
          fi

          if [ "$COMMENT_SCAN" = "failure" ]; then
            echo "::error::Agent PR comment(s) contain deferral language -- policy violation"
            echo "::error::Root cause: Agent said 'pre-existing' or similar in a PR comment."
            echo "::error::MANDATORY: Load .codex/CODEBASE_AGENCY_POLICY.md and docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "================================================================"
            echo "  CODEBASE AGENCY POLICY VIOLATION"
            echo "  Deferral language detected. Required actions:"
            echo "  1. Load .codex/CODEBASE_AGENCY_POLICY.md"
            echo "  2. Load docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md"
            echo "  3. Load all stored session memories"
            echo "  4. Fix the deferred issue immediately -- no exceptions"
            echo "================================================================"
            exit 1
          fi

          echo "OK No deferral language detected -- policy compliant"

  # ── rescue comment — posted on PR whenever the deferral gate fails ──────────
  # Same SHA-scoped pattern as validate.yml rescue-comment (S202).
  rescue-comment:
    name: Post rescue comment on deferral failure
    runs-on: ubuntu-latest
    needs: deferral-language-check
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Deferral Language Gate"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue:{pr_number} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Root cause:** Deferral language detected in PR body, commit messages, or agent comments.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues, never defer)\n2. Review failure logs: [{run_id}]({run_url})\n3. Remove any deferral phrases from PR body / commit messages / agent comments\n4. Fix the deferred issue immediately — no exceptions\n5. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n\n_Posted by: deferral-language-gate.yml → rescue-comment job (S217)_\n\n_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on the same commit `{sha_short}`. Please investigate [run #{run_id}]({run_url}) and fix."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
