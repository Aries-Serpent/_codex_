name: Token Rotation & Security Audit

on:
  schedule:
    # Run monthly on the 1st at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      audit-only:
        description: 'Run audit only (no rotation)'
        required: false
        type: boolean
        default: true
      force-rotation:
        description: 'Force token rotation even if not expired'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  token-audit:
    name: Security Token Audit
    runs-on: ubuntu-latest
    
    outputs:
      rotation-needed: ${{ steps.audit.outputs.rotation_needed }}
      audit-status: ${{ steps.audit.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'common'
