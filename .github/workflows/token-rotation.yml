name: Token Rotation & Security Audit

on:
  schedule:
    # Run monthly on the 1st at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      audit-only:
        description: 'Run audit only (no rotation)'
        required: false
        type: boolean
        default: true
      force-rotation:
        description: 'Force token rotation even if not expired'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  token-audit:
    name: Security Token Audit
    runs-on: ubuntu-latest
    
    outputs:
      rotation-needed: ${{ steps.audit.outputs.rotation_needed }}
      audit-status: ${{ steps.audit.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install cryptography pyyaml python-dateutil
      
      - name: Run token security audit
        id: audit
        env:
          CODEX_GHP_TOKEN_BASE64: ${{ secrets.CODEX_GHP_TOKEN_BASE64 }}
          CODEX_GHP_TOKEN_CONFIG: ${{ secrets.CODEX_GHP_TOKEN_CONFIG }}
          FORCE_ROTATION: ${{ github.event.inputs.force-rotation }}
        run: |
          echo "🔍 Running token security audit..."
          
          python3 << 'AUDIT_EOF'
          import os
          import sys
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          
          # Check if token decoder is available
          decoder_path = Path('scripts/security/copilot_token_decoder.py')
          if not decoder_path.exists():
              print("❌ Token decoder not found")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("rotation_needed=true\n")
                  f.write("status=decoder_missing\n")
              sys.exit(0)
          
          # Import decoder
          sys.path.insert(0, 'scripts/security')
          try:
              from copilot_token_decoder import CodexTokenDecoder
              
              # Check token configuration
              has_base64 = bool(os.getenv('CODEX_GHP_TOKEN_BASE64'))
              has_config = bool(os.getenv('CODEX_GHP_TOKEN_CONFIG'))
              force_rotation = os.getenv('FORCE_ROTATION', 'false').lower() == 'true'
              
              audit_results = {
                  'timestamp': datetime.utcnow().isoformat(),
                  'has_base64_token': has_base64,
                  'has_encrypted_token': has_config,
                  'decoder_functional': True,
                  'force_rotation': force_rotation,
              }
              
              # Determine if rotation is needed
              rotation_needed = False
              status = "healthy"
              
              if force_rotation:
                  rotation_needed = True
                  status = "force_rotation"
                  print("⚠️ Force rotation requested")
              elif not has_base64 and not has_config:
                  rotation_needed = True
                  status = "no_tokens"
                  print("⚠️ No tokens configured")
              elif has_base64 and not has_config:
                  rotation_needed = True
                  status = "upgrade_needed"
                  print("⚠️ Only base64 token found, upgrade to encrypted recommended")
              else:
                  print("✅ Token configuration healthy")
              
              audit_results['rotation_needed'] = rotation_needed
              audit_results['status'] = status
              
              # Save audit results
              with open('token_audit_results.json', 'w') as f:
                  json.dump(audit_results, f, indent=2)
              
              # Set outputs
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"rotation_needed={'true' if rotation_needed else 'false'}\n")
                  f.write(f"status={status}\n")
              
              print(f"\n📊 Audit Results:")
              print(f"  - Status: {status}")
              print(f"  - Rotation Needed: {rotation_needed}")
              print(f"  - Has Base64: {has_base64}")
              print(f"  - Has Encrypted: {has_config}")
              
          except Exception as e:
              print(f"❌ Audit failed: {e}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("rotation_needed=true\n")
                  f.write("status=audit_failed\n")
              sys.exit(1)
          AUDIT_EOF
      
      - name: Upload audit results
        uses: actions/upload-artifact@v6
        with:
          name: token-audit-results-${{ github.run_number }}
          path: token_audit_results.json
          retention-days: 90
      
      - name: Add audit to summary
        if: always()
        run: |
          echo "# 🔐 Token Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.audit.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Rotation Needed:** ${{ steps.audit.outputs.rotation_needed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f token_audit_results.json ]; then
            echo "## Detailed Results" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat token_audit_results.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
  
  create-rotation-issue:
    name: Create Token Rotation Issue
    needs: token-audit
    if: needs.token-audit.outputs.rotation-needed == 'true' && github.event.inputs.audit-only != 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Create rotation reminder issue
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ needs.token-audit.outputs.audit-status }}';
            const runNumber = '${{ github.run_number }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            
            let title = '🔐 Token Rotation Required';
            let body = `## Token Security Audit Alert\n\n`;
            body += `**Audit Run:** [#${runNumber}](${runUrl})\n`;
            body += `**Status:** \`${status}\`\n`;
            body += `**Date:** ${new Date().toISOString().split('T')[0]}\n\n`;
            
            body += `### Required Actions\n\n`;
            
            if (status === 'no_tokens') {
              body += `⚠️ **Critical:** No tokens are currently configured.\n\n`;
              body += `1. Run the token encryption tool locally\n`;
              body += `2. Configure \`CODEX_GHP_TOKEN_BASE64\` or \`CODEX_GHP_TOKEN_CONFIG\` secrets\n`;
              body += `3. Verify token retrieval works in workflows\n`;
            } else if (status === 'upgrade_needed') {
              body += `⚠️ **Recommended:** Upgrade to encrypted token storage.\n\n`;
              body += `1. Run the token encryption tool with AES-256-GCM option\n`;
              body += `2. Configure \`CODEX_GHP_TOKEN_CONFIG\` secret\n`;
              body += `3. Optionally remove \`CODEX_GHP_TOKEN_BASE64\` after verification\n`;
            } else if (status === 'force_rotation') {
              body += `🔄 **Scheduled:** Manual token rotation requested.\n\n`;
              body += `1. Generate a new GitHub Personal Access Token\n`;
              body += `2. Re-run the token encryption tool\n`;
              body += `3. Update secrets in repository settings\n`;
            }
            
            body += `\n### Documentation\n\n`;
            body += `- [Admin Token Setup Guide](docs/admin/security/ADMIN_TOKEN_SETUP.md)\n`;
            body += `- [Token Encryption Tool](scripts/security/token_encryption_tool.py)\n`;
            body += `- [Security Best Practices](SECURITY.md)\n\n`;
            
            body += `### Verification Steps\n\n`;
            body += `After updating tokens:\n`;
            body += `1. Run the [Bootstrap Security Tools](${runUrl.split('/actions/')[0]}/actions/workflows/security-tools-bootstrap.yml) workflow\n`;
            body += `2. Verify token decoder works: \`python3 -c "from scripts.security.copilot_token_decoder import copilot_get_github_token_safe; print('✅' if copilot_get_github_token_safe() else '❌')"\`\n`;
            body += `3. Close this issue once verification passes\n\n`;
            
            body += `---\n`;
            body += `*This issue was automatically created by the Token Rotation & Security Audit workflow.*`;
            
            // Search for existing open rotation issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,token-rotation',
              per_page: 1
            });
            
            if (issues.data.length > 0) {
              // Update existing issue
              const issueNumber = issues.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `## 🔄 Updated Audit Results\n\n${body}`
              });
              console.log(`Updated existing issue #${issueNumber}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'token-rotation', 'automated']
              });
              console.log('Created new token rotation issue');
            }
