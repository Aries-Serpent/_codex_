name: "\U0001F504 Auto-Post @copilot review After Agent Session"
on:
  workflow_run:
    workflows:
    - Copilot coding agent
    - CodeQL
    types:
    - completed
concurrency:
  group: auto-post-copilot-review-${{ github.event.workflow_run.pull_requests[0] &&
    github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id
    }}
  cancel-in-progress: true
permissions:
  pull-requests: write
  issues: write
  contents: write
  security-events: read
jobs:
  preflight-autofix:
    name: "Pre-flight auto-fix (\U0001F504 Auto-Post gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: 'github.event.workflow_run.pull_requests != null &&

      github.event.workflow_run.pull_requests[0] != null

      '
    outputs:
      autofix_ran: ${{ steps.autofix.outputs.autofix_ran }}
    steps:
    # codeql[actions/untrusted-checkout/critical] trusted scripts are restored from origin/main before execution
    - name: Checkout PR branch
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 2
        persist-credentials: false
    - name: Overlay trusted scripts from main (security)
      run: "git fetch origin main --depth=3 --no-tags 2>/dev/null || true\ngit restore\
        \ --source=origin/main -- \\\n  scripts/ci/session_wrapup_autofix.py \\\n\
        \  scripts/ci/sync_tracked_files.py \\\n  2>/dev/null || echo \"\u26A0\uFE0F\
        \ Some scripts not on origin/main \u2014 using checkout versions\"\necho \"\
        \u2705 Trusted scripts overlaid from origin/main\"\n"
    # codeql[actions/untrusted-checkout/high] this step executes only trusted scripts overlaid from origin/main
    - name: "Auto-fix pre-flight REQ-4/5 when \U0001F504 Auto-Post checkbox is checked"
      id: autofix
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id
          }}
        GIT_SHA: ${{ github.event.workflow_run.head_sha }}
      run: "set -euo pipefail\necho \"autofix_ran=false\" >> \"$GITHUB_OUTPUT\"\n\n\
        if [ -z \"${PR_NUMBER}\" ]; then\n  echo \"No PR number \u2014 skipping pre-flight\
        \ auto-fix.\"\n  exit 0\nfi\n\n# Check if the \U0001F504 Auto-Post checkbox\
        \ is checked in the PR body\nPR_BODY=$(gh pr view \"${PR_NUMBER}\" \\\n  --repo\
        \ \"${{ github.repository }}\" \\\n  --json body -q '.body // \"\"' 2>/dev/null\
        \ || echo \"\")\n\nif ! printf '%s' \"$PR_BODY\" | grep -qiE '\\-\\s*\\[x\\\
        ]\\s*.*Auto-Post.*@copilot'; then\n  echo \"\U0001F504 Auto-Post checkbox\
        \ not checked \u2014 skipping pre-flight auto-fix.\"\n  exit 0\nfi\n\necho\
        \ \"\U0001F504 Auto-Post checkbox is CHECKED \u2014 running pre-flight auto-fix...\"\
        \n\n# Determine which REQ fixes are needed by inspecting the last commit\n\
        LAST_COMMIT_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo \"\
        \")\nFIX_ARGS=\"\"\n\nif ! echo \"$LAST_COMMIT_FILES\" | grep -q \"AGENT_ACCOUNTABILITY_REPORT.md\"\
        ; then\n  FIX_ARGS=\"$FIX_ARGS --fix-accountability\"\n  echo \"  REQ-4: AGENT_ACCOUNTABILITY_REPORT.md\
        \ needs auto-fix\"\nelse\n  echo \"  REQ-4: AGENT_ACCOUNTABILITY_REPORT.md\
        \ already updated \u2014 OK\"\nfi\n\nif ! echo \"$LAST_COMMIT_FILES\" | grep\
        \ -q \"CHANGELOG.md\"; then\n  FIX_ARGS=\"$FIX_ARGS --fix-changelog\"\n  echo\
        \ \"  REQ-5: CHANGELOG.md needs auto-fix\"\nelse\n  echo \"  REQ-5: CHANGELOG.md\
        \ already updated \u2014 OK\"\nfi\n\n# MANDATORY session-close gate (S177):\
        \ ALWAYS refresh PR description with\n# scorecard + follow-up + WEC \u2014\
        \ regardless of whether REQ-4/5 need fixing.\n# This was the root cause of\
        \ stale PR bodies: when REQ-4/5 were already\n# satisfied, the early-exit\
        \ skipped --fix-all which includes update_pr_description().\necho \"\U0001F4CA\
        \ Refreshing PR description (scorecard + follow-up + WEC)...\"\npython3 scripts/ci/session_wrapup_autofix.py\
        \ \\\n  --update-pr-description \\\n  --pr-number \"${PR_NUMBER}\" \\\n  ||\
        \ echo \"\u26A0\uFE0F  PR description update failed (non-fatal \u2014 continuing)\"\
        \n\nif [ -z \"$FIX_ARGS\" ]; then\n  echo \"\u2705 REQ-4/5 already satisfied\
        \ \u2014 no requirement files need fixing.\"\nelse\n  # Run the session_wrapup_autofix.py\
        \ script with --fix-all\n  # This covers ALL missing components in one call:\n\
        \  #   REQ-4  \u2014 AGENT_ACCOUNTABILITY_REPORT.md\n  #   REQ-5  \u2014 CHANGELOG.md\n\
        \  #   REQ-6  \u2014 .secrets.baseline \u2194 CODEX_MANIFEST.json sync\n \
        \ #   WEC    \u2014 PR body Workflow Execution Checklist block\n  python3\
        \ scripts/ci/session_wrapup_autofix.py \\\n    --pr-number \"${PR_NUMBER}\"\
        \ \\\n    --sha \"${GIT_SHA:0:8}\" \\\n    --run-url \"${RUN_URL}\" \\\n \
        \   --fix-all\nfi\n\n# SCP-RESCUE-5: sync_tracked_files is the authoritative\
        \ tool for\n# computing the correct detect-secrets hashed_secret for CODEX_MANIFEST.\n\
        # Run it here (after session_wrapup_autofix) to guarantee .secrets.baseline\n\
        # is never stale regardless of which other bot workflows ran during the session.\n\
        python3 scripts/ci/sync_tracked_files.py --fix --manifest-only || \\\n  echo\
        \ \"\u26A0\uFE0F  sync_tracked_files non-zero (non-blocking)\"\n\n# Commit\
        \ and push the auto-fixed files back to the branch\n# Reconfigure remote with\
        \ token since persist-credentials: false was used on checkout.\ngit remote\
        \ set-url origin \"https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git\"\
        \ngit config user.name  \"github-actions[bot]\"\ngit config user.email \"\
        github-actions[bot]@users.noreply.github.com\"\ngit add docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md\
        \ CHANGELOG.md .secrets.baseline 2>/dev/null || true\n\nif git diff --cached\
        \ --quiet; then\n  echo \"\u2705 No changes to commit \u2014 files already\
        \ satisfied requirements.\"\nelse\n  git commit -m \"fix(docs): auto-post\
        \ pre-flight auto-fix: REQ-4/5 [auto-post-copilot-review][skip ci]\"\n  git\
        \ pull --rebase --autostash origin \"${TARGET_BRANCH}\" || true\n  git push\
        \ origin HEAD:refs/heads/\"${TARGET_BRANCH}\"\n  echo \"\u2705 Pre-flight\
        \ auto-fix committed and pushed to ${TARGET_BRANCH}.\"\n  echo \"autofix_ran=true\"\
        \ >> \"$GITHUB_OUTPUT\"\nfi\n"
  post-review-trigger:
    name: Post @copilot review after agent session
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight-autofix
    env:
      GH_TRICKLE_POLITE_SLEEP: '0.5'
    if: 'always() &&

      github.event.workflow_run.pull_requests != null &&

      github.event.workflow_run.pull_requests[0] != null

      '
    steps:
    - name: Re-trigger unanswered rescue comments OR post @copilot review
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          secrets.GITHUB_TOKEN }}
        script: "// Gate check: proceed if EITHER the WEC checkbox is checked OR COPILOT_AGENT_AUTH_ENABLED\
          \ is set.\n// This ensures the workflow always posts @copilot review when\
          \ the user explicitly selects\n// `- [x] copilot-agent-session-done.yml`\
          \ in the PR Workflow Execution Checklist,\n// even when COPILOT_AGENT_AUTH_ENABLED\
          \ is unset (e.g. token unavailable environment).\n\n// When triggered by\
          \ CodeQL completion, skip the @copilot review post entirely.\n// The auto-approve-pending-runs\
          \ and compile-bot-feedback jobs handle CodeQL triggers.\nconst triggeringWorkflow\
          \ = context.payload.workflow_run.name;\nif (triggeringWorkflow === 'CodeQL')\
          \ {\n  console.log(`Triggered by \"${triggeringWorkflow}\" \u2014 skipping\
          \ @copilot review post (auto-approve + compile-bot-feedback handle this\
          \ trigger).`);\n  return;\n}\n\nconst authEnabled = '${{ vars.COPILOT_AGENT_AUTH_ENABLED\
          \ }}';\nconst owner = context.repo.owner;\nconst repo  = context.repo.repo;\n\
          const prs   = context.payload.workflow_run.pull_requests;\nif (!prs || prs.length\
          \ === 0) {\n  console.log('No associated PRs \u2014 skipping.');\n  return;\n\
          }\nconst pr = prs[0].number;\n\n// Fetch PR body to check the WEC checkbox\
          \ for copilot-agent-session-done.yml\nlet wecChecked = false;\ntry {\n \
          \ const { data: prDataForWec } = await github.rest.pulls.get({ owner, repo,\
          \ pull_number: pr });\n  const prBody = prDataForWec.body || '';\n  // Match:\
          \ `- [x] copilot-agent-session-done.yml` (case-insensitive, optional leading\
          \ spaces)\n  wecChecked = /[-*]\\s*\\[x\\]\\s*copilot-agent-session-done\\\
          .yml/i.test(prBody);\n  console.log(`WEC checkbox (copilot-agent-session-done.yml):\
          \ ${wecChecked}`);\n} catch (e) {\n  console.log(`Could not fetch PR body\
          \ for WEC check (non-fatal): ${e.message}`);\n}\n\nif (!wecChecked && authEnabled\
          \ !== 'true' && authEnabled !== '1') {\n  console.log('copilot-agent-session-done.yml\
          \ WEC checkbox not checked AND COPILOT_AGENT_AUTH_ENABLED not set \u2014\
          \ skipping.');\n  return;\n}\n\n// Verify the PR is still open\nlet prData;\n\
          try {\n  const { data } = await github.rest.pulls.get({ owner, repo, pull_number:\
          \ pr });\n  prData = data;\n} catch (e) {\n  console.log(`Could not fetch\
          \ PR ${pr}: ${e.message}`);\n  return;\n}\nif (prData.state !== 'open')\
          \ {\n  console.log(`PR #${pr} is ${prData.state} \u2014 skipping.`);\n \
          \ return;\n}\n\n// \u2500\u2500 STEP 1: Fetch the last 20 PR comments to\
          \ check for unaddressed rescue \u2500\u2500\n// Uses GraphQL because REST\
          \ listComments returns pages in ascending order\n// (per_page:5 gives OLDEST\
          \ 5, not newest).\n// Includes rateLimit check to circuit-break if remaining\
          \ < 20.\nlet allNodes = [];\ntry {\n  const result = await github.graphql(\n\
          \    `query($owner: String!, $repo: String!, $pr: Int!) {\n      rateLimit\
          \ {\n        remaining\n        resetAt\n      }\n      repository(owner:\
          \ $owner, name: $repo) {\n        pullRequest(number: $pr) {\n         \
          \ comments(last: 20) {\n            nodes {\n              id\n        \
          \      databaseId\n              body\n              createdAt\n       \
          \       author { login }\n            }\n          }\n        }\n      }\n\
          \    }`,\n    { owner, repo, pr }\n  );\n  // Circuit-break if rate limit\
          \ is low\n  const rlRemaining = result?.rateLimit?.remaining ?? 999;\n \
          \ const rlResetAt = result?.rateLimit?.resetAt ?? 'unknown';\n  if (rlRemaining\
          \ < 20) {\n    core.warning(`GraphQL rate limit low (${rlRemaining} remaining,\
          \ resets ${rlResetAt}) \u2014 skipping comment analysis`);\n    return;\n\
          \  }\n  allNodes = result?.repository?.pullRequest?.comments?.nodes || [];\n\
          } catch (e) {\n  console.log(`Could not fetch PR comments (non-blocking):\
          \ ${e.message}`);\n}\n\n// \u2500\u2500 STEP 2: Find unanswered CI rescue\
          \ comments \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\n// A rescue comment is any comment containing \"## \U0001F6A8\
          \ CI Rescue\", posted by\n// any author EXCEPT the coding agent itself (to\
          \ avoid treating agent quotes\n// of the rescue marker as a new rescue).\
          \  This covers:\n//   - github-actions[bot] (automated CI via GITHUB_TOKEN)\n\
          //   - Any human admin using a PAT (e.g. the repo owner's token shows their\
          \ login)\n// An \"answer\" is any subsequent @copilot bot reply that contains\
          \ \"Fixed in\"\n// or \"Addressed in\" after the rescue comment.\n//\n//\
          \ Key insight: when the agent pushes new commits, GitHub may silently drop\n\
          // the queued session tied to an older rescue comment.  We detect this case\n\
          // by checking whether a rescue comment has NO bot reply AFTER it.\nconst\
          \ RESCUE_MARKER = '## \U0001F6A8 CI Rescue';\nconst AGENT_LOGINS = new Set([\n\
          \  'copilot-swe-agent[bot]',\n  'github-copilot[bot]',\n  'copilot[bot]',\n\
          ]);\n\n// Find the most-recent unanswered rescue comment (from any non-agent\
          \ author)\nlet pendingRescueComment = null;\nfor (let i = allNodes.length\
          \ - 1; i >= 0; i--) {\n  const node = allNodes[i];\n  const body = node.body\
          \ || '';\n  const authorLogin = node.author?.login || '';\n\n  // Accept\
          \ rescue comments from ANY author except the coding agent\n  // (to avoid\
          \ treating agent's quote-reply as a new rescue)\n  if (body.includes(RESCUE_MARKER)\
          \ && !AGENT_LOGINS.has(authorLogin)) {\n    // Check if any agent comment\
          \ AFTER this rescue comment addresses it\n    const answeredAfter = allNodes.slice(i\
          \ + 1).some(later => {\n      const laterLogin = later.author?.login ||\
          \ '';\n      const laterBody  = (later.body || '').toLowerCase();\n    \
          \  return (\n        AGENT_LOGINS.has(laterLogin) &&\n        (laterBody.includes('fixed\
          \ in') || laterBody.includes('addressed in'))\n      );\n    });\n\n   \
          \ if (!answeredAfter) {\n      pendingRescueComment = node;\n      break;\
          \  // use the most-recent unanswered rescue\n    }\n  }\n}\n\nif (pendingRescueComment)\
          \ {\n  // \u2500\u2500 PATH A: Re-trigger the unanswered rescue comment\
          \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\n  // Post a targeted @copilot continue comment\
          \ that references the rescue\n  // comment so the new session picks it up\
          \ immediately.\n  const rescueUrl = `https://github.com/${owner}/${repo}/pull/${pr}#issuecomment-${pendingRescueComment.databaseId}`;\n\
          \  const retriggerBody = [\n    `@copilot+claude-haiku-4.5 /plan`,\n\
          \    ``,\n    `<!-- session-done-retrigger -->`,\n    `A previous agent\
          \ session pushed new commits after the CI rescue comment below`,\n    `was\
          \ posted, which caused GitHub to silently drop the queued rescue session.`,\n\
          \    ``,\n    `**Please address the rescue comment immediately:**`,\n  \
          \  `${rescueUrl}`,\n    ``,\n    `> **💡 Parallel execution:** Use the \\`task\\` tool to delegate independent subtasks to Custom Agents (e.g. \\`ci-auto-healer-agent\\`, \\`ci-testing-agent\\`, \\`unified-coverage-agent\\`) to work in parallel.`,\n    ``,\n    `> _Auto-posted by \\`copilot-agent-session-done.yml\\\
          ` (session-done retrigger path)_`,\n  '',\n  '---',\n  `_[\U0001F517 Workflow\
          \ run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,\n\
          \  ].join('\\n');\n\n  // Guard: don't re-post if we already re-triggered\
          \ this rescue comment\n  const alreadyRetriggered = allNodes.some(c => {\n\
          \    const body = c.body || '';\n    return body.includes('<!-- session-done-retrigger\
          \ -->') &&\n      body.includes(`issuecomment-${pendingRescueComment.databaseId}`);\n\
          \  });\n  if (alreadyRetriggered) {\n    console.log(\n      `Rescue comment\
          \ ${pendingRescueComment.databaseId} was already re-triggered \u2014 skipping.`\n\
          \    );\n  } else {\n    await github.rest.issues.createComment({\n    \
          \  owner, repo, issue_number: pr, body: retriggerBody,\n    });\n    console.log(\n\
          \      `Re-triggered rescue comment ${pendingRescueComment.databaseId} on\
          \ PR #${pr}.`\n    );\n    return;  // don't also post review\n  }\n}\n\n\
          // \u2500\u2500 PATH B: No pending rescue \u2014 post \"@copilot review\"\
          \ as usual \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Guard 1:\
          \ do not post if the most recent comment is already a review trigger\nconst\
          \ reviewTriggers = new Set([\n  '@copilot review',\n  '@copilot+claude-haiku-4.5 /plan',\n  '@copilot+claude-haiku-4.5\
          \ review',\n]);\nconst recentTriggerCount = allNodes.slice(-10).filter(c\
          \ => {\n  const body = (c.body || '').trim();\n  return reviewTriggers.has(body);\n\
          }).length;\n\n// Guard 2: review-loop detection \u2014 if 3+ of the last\
          \ 10 comments are\n// @copilot review triggers with no meaningful work in\
          \ between, break the\n// loop by posting a diagnostic comment instead of\
          \ another review trigger.\nif (recentTriggerCount >= 3) {\n  const loopBreaker\
          \ = [\n    `@copilot+claude-haiku-4.5 /plan`,\n    ``,\n    `<!-- session-done-loop-break\
          \ -->`,\n    `\u26A0\uFE0F **Review-loop detected**: ${recentTriggerCount}\
          \ consecutive \\`@copilot review\\` triggers`,\n    `were posted without\
          \ a resolved rescue or meaningful commit in between.`,\n    ``,\n    `**Possible\
          \ causes:**`,\n    `1. A CI failure is blocking the session from completing\
          \ work`,\n    `2. The agent is not receiving the review trigger (token issue)`,\n\
          \    `3. The rescue comment chain is exhausted without a fix`,\n    ``,\n\
          \    `**Requested action:** Please check the latest CI failure and address\
          \ it directly.`,\n    `Check \\`docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md\\\
          ` for patterns.`,\n    ``,\n    `> _Auto-posted by \\`copilot-agent-session-done.yml\\\
          ` (loop-break guard)_`,\n  '',\n  '---',\n  `_[\U0001F517 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,\n\
          \  ].join('\\n');\n\n  // Only post loop-breaker once per review-loop cycle\n\
          \  const alreadyBroke = allNodes.slice(-5).some(c => {\n    return (c.body\
          \ || '').includes('<!-- session-done-loop-break -->');\n  });\n  if (!alreadyBroke)\
          \ {\n    await github.rest.issues.createComment({\n      owner, repo, issue_number:\
          \ pr, body: loopBreaker,\n    });\n    console.log(`Loop-break comment posted\
          \ to PR #${pr} (${recentTriggerCount} review triggers detected).`);\n  }\
          \ else {\n    console.log(`Loop-break already posted \u2014 skipping to\
          \ avoid double-loop.`);\n  }\n  return;\n}\n\nconst alreadyPosted = allNodes.slice(-5).some(c\
          \ => {\n  const body = (c.body || '').trim();\n  // Only treat agent-posted\
          \ review triggers as \"already posted\".\n  // A human writing exactly \"\
          @copilot+claude-haiku-4.5 review\" would\n  // be intentional and should\
          \ NOT suppress a new trigger.\n  return reviewTriggers.has(body) && AGENT_LOGINS.has(c.author?.login\
          \ || '');\n});\nif (alreadyPosted) {\n  console.log('Most recent comment\
          \ is already a \"@copilot review\" \u2014 skipping to avoid loop.');\n \
          \ return;\n}\n\n// P2-A (S299): SHA-scoped dedup marker \u2014 one session-done\
          \ trigger per commit.\n// When two workflow_run events fire for the same\
          \ SHA (e.g. Copilot coding agent\n// + CodeQL), without this guard both\
          \ would post \"@copilot review\" a few seconds\n// apart. The marker is\
          \ stored as an HTML comment inside the trigger body so it\n// is not rendered\
          \ but can be searched across allNodes.\n// Note: allNodes is limited to\
          \ last 20 comments (GraphQL comments(last:20)) so\n// the scan is bounded\
          \ O(20) and does not degrade on large comment histories.\nconst rawHeadSha\
          \ = context.payload.workflow_run.head_sha || '';\nif (!rawHeadSha) {\n \
          \ console.log('head_sha is unavailable \u2014 skipping SHA-scoped dedup\
          \ check and proceeding without marker.');\n}\nconst sessionDoneSha = rawHeadSha.slice(0,\
          \ 12);\nconst SESSION_DONE_MARKER = rawHeadSha\n  ? `<!-- session-done-dedup:${sessionDoneSha}\
          \ -->`\n  : '';\nif (SESSION_DONE_MARKER) {\n  const alreadyTriggeredForSha\
          \ = allNodes.some(c =>\n    (c.body || '').includes(SESSION_DONE_MARKER)\n\
          \  );\n  if (alreadyTriggeredForSha) {\n    console.log(`Session-done trigger\
          \ already posted for SHA ${sessionDoneSha} \u2014 skipping duplicate.`);\n\
          \    return;\n  }\n}\n\nconst reviewBody = SESSION_DONE_MARKER\n  ? `@copilot+claude-haiku-4.5 /plan\\n\\nreview\\n\\n${SESSION_DONE_MARKER}`\n  : '@copilot+claude-haiku-4.5 /plan';\n\
          \nawait github.rest.issues.createComment({\n  owner, repo, issue_number:\
          \ pr,\n  body: reviewBody,\n});\nconsole.log(`@copilot review posted to\
          \ PR #${pr}${sessionDoneSha ? ` (SHA ${sessionDoneSha})` : ''}.`);\n"
  auto-approve-pending-runs:
    name: "\u26A1 Auto-Approve pending workflow runs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight-autofix
    if: 'github.event.workflow_run.pull_requests != null &&

      github.event.workflow_run.pull_requests[0] != null

      '
    steps:
    - name: Approve all action_required workflow runs for head SHA
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        REPO: ${{ github.repository }}
      run: "set -euo pipefail\n\nif [ -z \"${PR_NUMBER}\" ]; then\n  echo \"No PR\
        \ number \u2014 skipping auto-approve.\"\n  exit 0\nfi\n\n# Check which checkboxes\
        \ are ticked.\n# Auto-approve is enabled when EITHER:\n#   1. `- [x] auto-approve-workflows`\
        \ is checked (explicit approval, always approve)\n#   2. `- [x] copilot-agent-session-done.yml`\
        \ is checked (WEC pre-approval)\n#      The WEC checkbox IS the maintainer's\
        \ pre-approval \u2014 checking it means \"run\n#      this workflow and approve\
        \ whatever it needs\", eliminating the\n#      \"This workflow is awaiting\
        \ approval from a maintainer\" gate.\nPR_BODY=$(gh pr view \"${PR_NUMBER}\"\
        \ \\\n  --repo \"${REPO}\" \\\n  --json body -q '.body // \"\"' 2>/dev/null\
        \ || echo \"\")\n\nAUTO_APPROVE_CHECKED=0\nSESSION_DONE_CHECKED=0\nprintf\
        \ '%s' \"$PR_BODY\" | grep -qiE '^\\-\\s*\\[x\\]\\s*auto-approve-workflows'\
        \ && AUTO_APPROVE_CHECKED=1 || true\nprintf '%s' \"$PR_BODY\" | grep -qiE\
        \ '^\\-\\s*\\[x\\]\\s*copilot-agent-session-done\\.yml' && SESSION_DONE_CHECKED=1\
        \ || true\n\nif [ \"$AUTO_APPROVE_CHECKED\" = \"0\" ] && [ \"$SESSION_DONE_CHECKED\"\
        \ = \"0\" ]; then\n  echo \"\u26A1 Neither auto-approve-workflows nor copilot-agent-session-done.yml\
        \ is checked \u2014 skipping.\"\n  exit 0\nfi\n\nif [ \"$AUTO_APPROVE_CHECKED\"\
        \ = \"1\" ]; then\n  echo \"\u26A1 auto-approve-workflows is CHECKED \u2014\
        \ approving pending runs for SHA ${HEAD_SHA:0:12}...\"\nelse\n  echo \"\u26A1\
        \ copilot-agent-session-done.yml WEC checkbox is CHECKED (pre-approval) \u2014\
        \ auto-approving pending runs for SHA ${HEAD_SHA:0:12}...\"\nfi\n\n# Fetch\
        \ all workflow runs for this commit that require approval\nPENDING_RUNS=$(gh\
        \ api \\\n  \"repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&status=action_required&per_page=100\"\
        \ \\\n  --jq '.workflow_runs[].id' 2>/dev/null || echo \"\")\n\nif [ -z \"\
        $PENDING_RUNS\" ]; then\n  echo \"\u2705 No pending workflow runs requiring\
        \ approval for SHA ${HEAD_SHA:0:12}.\"\n  printf '### \u26A1 Auto-Approve\\\
        n\\nNo action_required runs found for commit `%s`.\\n' \"${HEAD_SHA:0:12}\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n  exit 0\nfi\n\nAPPROVED=0\nFAILED=0\nSUMMARY_LINES=\"\
        \"\n\nwhile IFS= read -r RUN_ID; do\n  [ -z \"$RUN_ID\" ] && continue\n  RUN_NAME=$(gh\
        \ api \"repos/${REPO}/actions/runs/${RUN_ID}\" --jq '.name // \"unknown\"\
        ' 2>/dev/null || echo \"unknown\")\n  if gh api --method POST \"repos/${REPO}/actions/runs/${RUN_ID}/approve\"\
        \ 2>/dev/null; then\n    echo \"  \u2705 Approved run #${RUN_ID} (${RUN_NAME})\"\
        \n    APPROVED=$((APPROVED + 1))\n    SUMMARY_LINES=\"${SUMMARY_LINES}\\n-\
        \ \u2705 Run [#${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})\
        \ \u2014 ${RUN_NAME}\"\n  else\n    echo \"  \u26A0\uFE0F  Failed to approve\
        \ run #${RUN_ID} (${RUN_NAME}) \u2014 may require owner approval\"\n    FAILED=$((FAILED\
        \ + 1))\n    SUMMARY_LINES=\"${SUMMARY_LINES}\\n- \u26A0\uFE0F Run [#${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})\
        \ \u2014 ${RUN_NAME} (approval failed)\"\n  fi\ndone <<< \"$PENDING_RUNS\"\
        \n\nprintf '### \u26A1 Auto-Approve Results\\n\\n**Approved:** %d | **Failed:**\
        \ %d\\n%b\\n' \\\n  \"$APPROVED\" \"$FAILED\" \"$SUMMARY_LINES\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n\nif [ \"$APPROVED\" -gt 0 ]; then\n  echo \"\u2705 Auto-approved ${APPROVED}\
        \ pending workflow run(s) for PR #${PR_NUMBER}.\"\nfi\nif [ \"$FAILED\" -gt\
        \ 0 ]; then\n  echo \"\u26A0\uFE0F  ${FAILED} run(s) could not be approved\
        \ \u2014 owner approval may be required.\"\nfi\n"
  compile-bot-feedback:
    name: "Compile bot feedback \u2192 @copilot continue thread"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: post-review-trigger
    if: 'always() &&

      github.event.workflow_run.pull_requests != null &&

      github.event.workflow_run.pull_requests[0] != null

      '
    steps:
    - name: Collect bot findings and post consolidated @copilot continue comment
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          secrets.GITHUB_TOKEN }}
        script: "const owner = context.repo.owner;\nconst repo  = context.repo.repo;\n\
          const prs   = context.payload.workflow_run.pull_requests;\nif (!prs || prs.length\
          \ === 0) return;\nconst prNumber = prs[0].number;\nconst MAX_COMMENT_LENGTH\
          \ = 65536;\n// Branch-head SHA used for a SHA-scoped upsert marker.\n//\n\
          // Use the PR head SHA (not workflow_run.head_sha) because pull_request\n\
          // workflow_run events often carry ephemeral merge-preview SHAs.  Those\n\
          // merge-preview SHAs can change within one agent session even when the\n\
          // PR branch head has not, causing multiple @mbaetiong continuation\n//\
          \ comments instead of one same-session thread.\nlet headSha = (context.payload.workflow_run.head_sha\
          \ || '').slice(0, 12);\n\n// Gate: only run when copilot-agent-session-done.yml\
          \ WEC checkbox is checked\nlet wecChecked = false;\ntry {\n  const { data:\
          \ prInfo } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber\
          \ });\n  if (prInfo.state !== 'open') { console.log(`PR #${prNumber} is\
          \ closed \u2014 skipping.`); return; }\n  wecChecked = /[-*]\\s*\\[x\\]\\\
          s*copilot-agent-session-done\\.yml/i.test(prInfo.body || '');\n  const prHeadSha\
          \ = (prInfo.head && prInfo.head.sha) ? prInfo.head.sha : '';\n  headSha\
          \ = (prHeadSha || context.payload.workflow_run.head_sha || '').slice(0,\
          \ 12);\n} catch (e) {\n  console.log(`Cannot fetch PR for gate check: ${e.message}`);\
          \ return;\n}\nconst authEnabled = '${{ vars.COPILOT_AGENT_AUTH_ENABLED }}';\n\
          if (!wecChecked && authEnabled !== 'true' && authEnabled !== '1') {\n  console.log('WEC\
          \ checkbox not checked \u2014 skipping compile-bot-feedback.'); return;\n\
          }\n\n// \u2500\u2500 Collect PR Review comments from Copilot AI reviewer\
          \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\nconst BOT_REVIEW_AUTHORS = new Set([\n  'copilot-pull-request-reviewer[bot]',\n\
          \  'github-copilot[bot]',\n  'copilot[bot]',\n]);\nconst BOT_COMMENT_AUTHORS\
          \ = new Set([\n  'github-actions[bot]',\n  'copilot-pull-request-reviewer[bot]',\n\
          \  'github-copilot[bot]',\n  'github-code-quality[bot]',\n  'github-advanced-security[bot]',\n\
          ]);\n// Quality/security markers commonly emitted by CI bots\nconst BOT_CONTENT_MARKERS\
          \ = [\n  '<!-- code-quality-report -->',\n  '<!-- security-findings -->',\n\
          \  '<!-- ci-code-quality',     // upserted code-quality section marker\n\
          \  'semgrep',\n  'codeql',\n  '\U0001F512 security',\n  '\u26A0\uFE0F code\
          \ quality',\n  'code scanning',\n  'code quality',\n  'security scan',\n\
          \  'potential problem',\n  'github-code-quality',\n];\n\nlet findings =\
          \ [];\n\n// 1. PR review comments (Copilot AI review findings)\ntry {\n\
          \  const reviews = await github.paginate(github.rest.pulls.listReviews,\
          \ {\n    owner, repo, pull_number: prNumber, per_page: 50,\n  });\n  for\
          \ (const review of reviews) {\n    const login = review.user?.login || '';\n\
          \    if (!BOT_REVIEW_AUTHORS.has(login)) continue;\n    // Collect the review\
          \ body if it has content\n    if (review.body && review.body.trim().length\
          \ > 20) {\n      findings.push({ source: `Copilot AI Review (${review.submitted_at?.slice(0,10)})`,\
          \ body: review.body.trim() });\n    }\n  }\n\n  // Also collect inline review\
          \ comments (diff comments)\n  const reviewComments = await github.paginate(github.rest.pulls.listReviewComments,\
          \ {\n    owner, repo, pull_number: prNumber, per_page: 100, sort: 'created',\
          \ direction: 'desc',\n  });\n  const recent = reviewComments.slice(0, 20);\n\
          \  for (const rc of recent) {\n    const login = rc.user?.login || '';\n\
          \    if (!BOT_REVIEW_AUTHORS.has(login)) continue;\n    findings.push({\
          \ source: `Copilot Review Comment (${rc.path}:${rc.line || rc.original_line\
          \ || '?'})`, body: rc.body.trim() });\n  }\n} catch (e) {\n  console.log(`Could\
          \ not fetch reviews (non-fatal): ${e.message}`);\n}\n\n// 2. Issue comments\
          \ from quality/security bots\ntry {\n  const { data: issueComments } = await\
          \ github.rest.issues.listComments({\n    owner, repo, issue_number: prNumber,\n\
          \    per_page: 50, sort: 'created', direction: 'desc',\n  });\n  // direction:'desc'\
          \ gives newest-first; take the first 30 (most recent)\n  const recent =\
          \ issueComments.slice(0, 30);\n  for (const c of recent) {\n    const login\
          \ = c.user?.login || '';\n    const body  = c.body || '';\n    const isBotAuthor\
          \ = BOT_COMMENT_AUTHORS.has(login);\n    const hasBotMarker = BOT_CONTENT_MARKERS.some(m\
          \ => body.toLowerCase().includes(m.toLowerCase()));\n    // Skip the compile-thread\
          \ itself to avoid re-including old compilations\n    // (matches both legacy\
          \ `<!-- compiled-bot-feedback -->` and new SHA-scoped variant)\n    if (body.includes('<!--\
          \ compiled-bot-feedback')) continue;\n    if ((isBotAuthor || hasBotMarker)\
          \ && body.trim().length > 40) {\n      // Truncate very long bot comments\
          \ to first 500 chars\n      const excerpt = body.length > 500 ? body.slice(0,\
          \ 497) + '\u2026' : body;\n      findings.push({ source: `Bot Comment (${login},\
          \ ${c.created_at?.slice(0,10)})`, body: excerpt });\n    }\n  }\n} catch\
          \ (e) {\n  console.log(`Could not fetch issue comments (non-fatal): ${e.message}`);\n\
          }\n\nif (findings.length === 0) {\n  console.log(`No bot findings detected\
          \ for PR #${prNumber} \u2014 skipping compile-bot-feedback.`);\n  return;\n\
          }\n\n// \u2500\u2500 Build compiled continuation comment \u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\nconst findingsList = findings\n  .map((f, i) => `**${i\
          \ + 1}. ${f.source}**\\n\\n> ${(f.body || '').replace(/\\n/g, '\\n> ')}`)\n\
          \  .join('\\n\\n---\\n\\n');\n\nconst PR_MARKER = `<!-- compiled-bot-feedback:pr-${prNumber}\
          \ -->`;\nconst HEAD_MARKER = `<!-- compiled-bot-feedback-head:${headSha}\
          \ -->`;\nconst RUN_MARKER = `<!-- compiled-bot-feedback-run:${context.runId}\
          \ -->`;\nconst MARKER_PREFIX = `<!-- compiled-bot-feedback`;\nconst compiledBody\
          \ = [\n  PR_MARKER,\n  HEAD_MARKER,\n  `@copilot continue with all current\
          \ priority 1, 2, 3, and 4 tasks as well as addressing all code quality and\
          \ security concerns listed below.`,\n  ``,\n  `**\U0001F4CB Bot-reported\
          \ findings (${findings.length} item${findings.length > 1 ? 's' : ''}):**`,\n\
          \  ``,\n  findingsList,\n  ``,\n  `---`,\n  `> _Compiled by \\`copilot-agent-session-done.yml\\\
          ` \xB7 compile-bot-feedback job_`,\n  `> _[\U0001F517 Workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId})_`,\n\
          ].join('\\n');\n\n// Upsert guard: scan every PR comment page for either\
          \ the new PR-scoped\n// marker or any legacy compiled-bot-feedback marker.\
          \  A busy PR can have\n// more than 100 comments, so newest-only GraphQL\
          \ windows can miss the\n// existing thread and create another @copilot request\
          \ for the same issue.\n// PR-scoped upsert keeps all same-session bot findings\
          \ in one appended\n// thread even when follow-up [skip ci] commits change\
          \ the branch head SHA.\n// Rate-limit guard: check remaining before each\
          \ page; break if < 20.\nlet existingCommentId = null;\nlet existingCommentBody\
          \ = '';\ntry {\n  for (let page = 1; ; page += 1) {\n    // Rate-limit guard\
          \ before each page\n    try {\n      const rl = await github.rest.rateLimit.get();\n\
          \      const remaining = rl.data?.resources?.core?.remaining ?? 999;\n \
          \     if (remaining < 20) {\n        core.warning(`REST rate limit low (${remaining}\
          \ remaining) \u2014 stopping upsert scan at page ${page}`);\n        break;\n\
          \      }\n    } catch (_) { /* non-fatal \u2014 proceed */ }\n\n    const\
          \ { data: comments } = await github.rest.issues.listComments({\n      owner,\
          \ repo, issue_number: prNumber, per_page: 100, page,\n    });\n    if (!Array.isArray(comments)\
          \ || comments.length === 0) break;\n    for (const comment of comments)\
          \ {\n      const body = comment.body || '';\n      if (body.includes(PR_MARKER)\
          \ || body.includes(MARKER_PREFIX)) {\n        existingCommentId = comment.id;\n\
          \        existingCommentBody = body;\n      }\n    }\n    if (comments.length\
          \ < 100) break;\n  }\n} catch (e) {\n  console.log(`Upsert lookup failed\
          \ (non-fatal): ${e.message}`);\n}\n\nif (existingCommentId) {\n  if (existingCommentBody.includes(RUN_MARKER))\
          \ {\n    console.log(`compile-bot-feedback already appended run ${context.runId}\
          \ for SHA ${headSha} on PR #${prNumber} \u2014 skipping duplicate.`);\n\
          \    return;\n  }\n  let normalizedExistingBody = existingCommentBody.trimEnd();\n\
          \  if (!normalizedExistingBody.includes(PR_MARKER)) {\n    normalizedExistingBody\
          \ = `${PR_MARKER}\\n${normalizedExistingBody}`;\n  }\n  if (!normalizedExistingBody.includes(HEAD_MARKER))\
          \ {\n    normalizedExistingBody = normalizedExistingBody.replace(PR_MARKER,\
          \ `${PR_MARKER}\\n${HEAD_MARKER}`);\n  }\n  const appendParts = [normalizedExistingBody];\n\
          \  appendParts.push(\n    ``,\n    `---`,\n    RUN_MARKER,\n    `### \U0001F504\
          \ Same-session bot feedback update`,\n    ``,\n    `Additional request/run:\
          \ [#${context.runId}](https://github.com/${owner}/${repo}/actions/runs/${context.runId})`,\n\
          \    ``,\n    findingsList,\n    ``,\n    `> _Appended by \\`copilot-agent-session-done.yml\\\
          ` \xB7 compile-bot-feedback job_`,\n  );\n  const appendBody = appendParts.join('\\\
          n');\n  await github.rest.issues.updateComment({\n    owner, repo, comment_id:\
          \ existingCommentId, body: appendBody.slice(0, MAX_COMMENT_LENGTH),\n  });\n\
          \  console.log(`Appended ${findings.length} bot finding(s) to existing @copilot\
          \ continue comment #${existingCommentId} for PR #${prNumber}.`);\n  return;\n\
          }\n\nawait github.rest.issues.createComment({\n  owner, repo, issue_number:\
          \ prNumber, body: `${compiledBody}\\n${RUN_MARKER}`,\n});\nconsole.log(`Compiled\
          \ ${findings.length} bot finding(s) into @copilot continue comment on PR\
          \ #${prNumber}.`);\n"
  append-code-quality-to-rescue:
    name: Append code-quality findings to rescue comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: 'github.event.workflow_run.pull_requests != null &&

      github.event.workflow_run.pull_requests[0] != null &&

      contains(github.event.workflow_run.name, ''CodeQL'')

      '
    steps:
    - name: Fetch alerts and upsert into rescue comment
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          secrets.GITHUB_TOKEN }}
        script: "const owner    = context.repo.owner;\nconst repo     = context.repo.repo;\n\
          const prs      = context.payload.workflow_run.pull_requests;\nconst prNumber\
          \ = prs[0].number;\nconst headSha  = context.payload.workflow_run.head_sha\
          \ || '';\nconst headShort = headSha.slice(0, 12);\nconst now      = new\
          \ Date().toISOString();\n\n// \u2500\u2500 1. Fetch open code scanning alerts\
          \ for this SHA \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\nlet alerts = [];\ntry {\n  // Use REST API \u2014\
          \ requires security-events:read permission (set on workflow).\n  const {\
          \ data } = await github.rest.codeScanning.listAlertsForRepo({\n    owner,\
          \ repo, ref: headSha, state: 'open', per_page: 20,\n  });\n  alerts = data\
          \ || [];\n} catch (e) {\n  // 403 means Advanced Security is not enabled\
          \ or token lacks permission.\n  // 404 means no alerts endpoint for this\
          \ repo.  Both are non-fatal.\n  console.log(`Code scanning alerts unavailable\
          \ (${e.status || e.message}) \u2014 skipping.`);\n  return;\n}\n\nif (alerts.length\
          \ === 0) {\n  console.log(`No open code scanning alerts for SHA ${headShort}\
          \ \u2014 nothing to append.`);\n  return;\n}\n\n// \u2500\u2500 2. Build\
          \ the quality section \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Dedup\
          \ marker \u2014 one section per SHA (keyed by sha12 + alert count to\n//\
          \ refresh if new alerts appear on the same commit after a re-scan).\nconst\
          \ QUALITY_MARKER = `<!-- ci-code-quality:${headShort}:${alerts.length} -->`;\n\
          \nconst alertLines = alerts.slice(0, 15).map(a => {\n  const rule = a.rule?.id\
          \ || 'unknown';\n  const desc = a.rule?.description || a.most_recent_instance?.message?.text\
          \ || 'See alert';\n  const file = a.most_recent_instance?.location?.path\
          \ || '';\n  const line = a.most_recent_instance?.location?.start_line ||\
          \ '';\n  const loc  = file ? ` \xB7 \\`${file}${line ? ':' + line : ''}\\\
          `` : '';\n  return `- **${rule}**${loc} \u2014 ${desc} ([view](${a.html_url}))`;\n\
          });\nif (alerts.length > 15) alertLines.push(`- _\u2026and ${alerts.length\
          \ - 15} more \u2014 [view all](https://github.com/${owner}/${repo}/security/code-scanning)_`);\n\
          \nconst qualitySection = [\n  ``,\n  `---`,\n  ``,\n  QUALITY_MARKER,\n\
          \  `<details><summary>\U0001F535 <code>github-code-quality</code> \u2014\
          \ ${alerts.length} alert(s) \xB7 ${now}</summary>`,\n  ``,\n  `**${alerts.length}\
          \ open alert(s) on commit \\`${headShort}\\`** \u2014 fix before merging:`,\n\
          \  ``,\n  ...alertLines,\n  ``,\n  `> Run \\`python -m ruff check .\\` +\
          \ \\`python -m mypy src\\` locally, or view the`,\n  `> [Security \u2192\
          \ Code scanning](https://github.com/${owner}/${repo}/security/code-scanning)\
          \ tab.`,\n  ``,\n  `</details>`,\n].join('\\n');\n\n// \u2500\u2500 3. Find\
          \ existing rescue comment for this SHA \u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Rate-limit\
          \ guard: check remaining before each page.\nconst rescueMarker = `<!-- ci-rescue-sha:${prNumber}:${headShort}\
          \ -->`;\nlet page = 1, existingComment = null;\nwhile (!existingComment)\
          \ {\n  // Rate-limit guard before each page\n  try {\n    const rl = await\
          \ github.rest.rateLimit.get();\n    const rlRemaining = rl.data?.resources?.core?.remaining\
          \ ?? 999;\n    if (rlRemaining < 20) {\n      core.warning(`REST rate limit\
          \ low (${rlRemaining} remaining) \u2014 stopping rescue scan at page ${page}`);\n\
          \      break;\n    }\n  } catch (_) { /* non-fatal \u2014 proceed */ }\n\
          \n  const { data: batch } = await github.rest.issues.listComments({\n  \
          \  owner, repo, issue_number: prNumber, per_page: 100, page,\n  });\n  if\
          \ (!batch || batch.length === 0) break;\n  existingComment = batch.find(c\
          \ => (c.body || '').includes(rescueMarker));\n  if (batch.length < 100)\
          \ break;\n  page++;\n}\n\n// \u2500\u2500 4. Upsert \u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \nif (existingComment) {\n  // Idempotent: skip if same marker already present\
          \ (same alert count)\n  if (existingComment.body.includes(QUALITY_MARKER))\
          \ {\n    console.log(`Quality section for SHA ${headShort} already up-to-date\
          \ \u2014 skipping.`);\n    return;\n  }\n  // Remove any previous quality\
          \ section (different alert count) and re-append.\n  // Regex matches the\
          \ exact marker format: <!-- ci-code-quality:{sha12}:{N} -->\n  // {12} is\
          \ intentional: headShort is always sha.slice(0,12) \u2014 exactly 12 hex\
          \ chars.\n  const withoutOldQuality = existingComment.body.replace(\n  \
          \  /\\n\\n---\\n\\n<!-- ci-code-quality:[a-f0-9]{12}:\\d+ -->[^]*$/,\n \
          \   ''\n  );\n  const updated = (withoutOldQuality.trimEnd() + qualitySection).slice(0,\
          \ 65536);\n  await github.rest.issues.updateComment({\n    owner, repo,\
          \ comment_id: existingComment.id, body: updated,\n  });\n  console.log(`\u2705\
          \ Appended/updated ${alerts.length} code scanning alert(s) in rescue comment\
          \ for SHA ${headShort}.`);\n} else {\n  // No rescue comment yet (CI passed\
          \ but quality issues found) \u2014 create standalone\n  const standaloneBody\
          \ = [\n    rescueMarker,\n    `## \U0001F535 Code Quality Findings \u2014\
          \ @copilot Fix Required`,\n    ``,\n    `**Branch:** \\`${context.payload.workflow_run.head_branch}\\\
          ` | **Commit:** \\`${headSha}\\``,\n    ``,\n    `@copilot Code scanning\
          \ found **${alerts.length} alert(s)** on commit \\`${headShort}\\` that\
          \ must be resolved before this PR can merge.`,\n    ``,\n    `<details><summary>\U0001F4CB\
          \ Steps to resolve</summary>`,\n    ``,\n    `1. Load \\`.codex/CODEBASE_AGENCY_POLICY.md\\\
          ` (\xA70 \u2014 fix ALL issues found)`,\n    `2. Review each alert linked\
          \ below and apply the minimal fix`,\n    `3. Push the fix and confirm the\
          \ Security tab shows 0 open alerts`,\n    `4. Update \\`docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md\\\
          ``,\n    ``,\n    `</details>`,\n    ``,\n    `---`,\n    ``,\n    QUALITY_MARKER,\n\
          \    `<details><summary>\U0001F535 <code>github-code-quality</code> \u2014\
          \ ${alerts.length} alert(s) \xB7 ${now}</summary>`,\n    ``,\n    `**${alerts.length}\
          \ open alert(s) on commit \\`${headShort}\\`:**`,\n    ``,\n    ...alertLines,\n\
          \    ``,\n    `</details>`,\n  ].join('\\n');\n  const { data: created }\
          \ = await github.rest.issues.createComment({\n    owner, repo, issue_number:\
          \ prNumber, body: standaloneBody.slice(0, 65536),\n  });\n  console.log(`\u2705\
          \ Created quality-findings comment: ${created.html_url}`);\n}\n"
