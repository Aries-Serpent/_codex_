name: "🔄 Auto-Post @copilot review After Agent Session"

# Fires when a GitHub Coding Agent (copilot-swe-agent[bot]) workflow run
# completes on a PR branch.  If the PR is open and Agent Token Delegation
# is enabled (COPILOT_AGENT_AUTH_ENABLED repo variable = 'true'), this
# workflow either:
#
#   A) Re-triggers any unanswered CI rescue comment (priority path), OR
#   B) Posts "@copilot review" to start a review cycle
#
# WHY the rescue-comment re-trigger is needed:
#   When an agent session is running and a new @copilot rescue comment arrives,
#   GitHub queues the rescue session.  If the running session then pushes NEW
#   commits to the branch, GitHub invalidates the queued session (it was tied to
#   the earlier commit context).  Without re-triggering, that rescue comment is
#   silently dropped and no new session starts.
#
# Loop (review path):
#   Coding agent commits → workflow_run completed → post "@copilot review"
#     → Copilot review generates N comments
#       → copilot-review-responder.yml fires
#         → post "@copilot apply changes based on the comments in the review thread"
#           → coding agent session starts → loop repeats
#
# Guard: does NOT post if the most-recent comment is already "@copilot review"
# (prevents infinite review-review loops when the agent didn't push changes).

on:
  workflow_run:
    # Trigger when the Copilot coding agent session completes.
    # The dynamic "Copilot coding agent" workflow (path: dynamic/copilot-swe-agent/copilot)
    # is the actual agent session; its runs carry pull_requests context for the PR under work.
    # NOTE: workflow_run listeners only execute from the default branch (main).
    workflows: ["Copilot coding agent"]
    types: [completed]

concurrency:
  # Use PR number if available, fall back to workflow_run ID to avoid
  # unrelated runs sharing the same concurrency key (null PR number issue).
  # cancel-in-progress: false ensures a queued re-trigger isn't dropped when
  # two sessions end in rapid succession.
  group: auto-post-copilot-review-${{ github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  # ── Job 1: Auto-fix pre-flight requirements when 🔄 checkbox is checked ─────
  # When `- [x] 🔄 Auto-Post @copilot review After Agent Session` is checked in
  # the PR body, this job runs session_wrapup_autofix.py to ensure REQ-4/REQ-5
  # (accountability report + CHANGELOG touched in last commit) are satisfied
  # before the review trigger is posted.  Commit is tagged [skip ci] to avoid
  # triggering another full workflow run.
  preflight-autofix:
    name: "Pre-flight auto-fix (🔄 Auto-Post gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: |
      github.event.workflow_run.pull_requests != null &&
      github.event.workflow_run.pull_requests[0] != null
    outputs:
      autofix_ran: ${{ steps.autofix.outputs.autofix_ran }}

    steps:
      - name: "Checkout PR branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          fetch-depth: 2

      - name: "Auto-fix pre-flight REQ-4/5 when 🔄 Auto-Post checkbox is checked"
        id: autofix
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "autofix_ran=false" >> "$GITHUB_OUTPUT"

          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number — skipping pre-flight auto-fix."
            exit 0
          fi

          # Check if the 🔄 Auto-Post checkbox is checked in the PR body
          PR_BODY=$(gh pr view "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --json body -q '.body // ""' 2>/dev/null || echo "")

          if ! printf '%s' "$PR_BODY" | grep -qiE '\-\s*\[x\]\s*.*Auto-Post.*@copilot'; then
            echo "🔄 Auto-Post checkbox not checked — skipping pre-flight auto-fix."
            exit 0
          fi

          echo "🔄 Auto-Post checkbox is CHECKED — running pre-flight auto-fix..."

          # Determine which REQ fixes are needed by inspecting the last commit
          LAST_COMMIT_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          FIX_ARGS=""

          if ! echo "$LAST_COMMIT_FILES" | grep -q "AGENT_ACCOUNTABILITY_REPORT.md"; then
            FIX_ARGS="$FIX_ARGS --fix-accountability"
            echo "  REQ-4: AGENT_ACCOUNTABILITY_REPORT.md needs auto-fix"
          else
            echo "  REQ-4: AGENT_ACCOUNTABILITY_REPORT.md already updated — OK"
          fi

          if ! echo "$LAST_COMMIT_FILES" | grep -q "CHANGELOG.md"; then
            FIX_ARGS="$FIX_ARGS --fix-changelog"
            echo "  REQ-5: CHANGELOG.md needs auto-fix"
          else
            echo "  REQ-5: CHANGELOG.md already updated — OK"
          fi

          if [ -z "$FIX_ARGS" ]; then
            echo "✅ All pre-flight requirements already satisfied — no auto-fix needed."
            exit 0
          fi

          # Run the session_wrapup_autofix.py script (offline, idempotent)
          python3 scripts/ci/session_wrapup_autofix.py \
            --pr-number "${PR_NUMBER}" \
            --sha "${GIT_SHA:0:8}" \
            --run-url "${RUN_URL}" \
            ${FIX_ARGS}

          # Commit and push the auto-fixed files back to the branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md CHANGELOG.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✅ No changes to commit — files already satisfied requirements."
          else
            git commit -m "fix(docs): auto-post pre-flight auto-fix: REQ-4/5 [auto-post-copilot-review][skip ci]"
            git pull --rebase origin "${TARGET_BRANCH}" || true
            git push origin HEAD:refs/heads/"${TARGET_BRANCH}"
            echo "✅ Pre-flight auto-fix committed and pushed to ${TARGET_BRANCH}."
            echo "autofix_ran=true" >> "$GITHUB_OUTPUT"
          fi

  post-review-trigger:
    name: "Post @copilot review after agent session"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight-autofix
    # Only fire when:
    #   1. The workflow_run was associated with a PR (not a plain branch push)
    #   2. COPILOT_AGENT_AUTH_ENABLED is enabled
    if: |
      github.event.workflow_run.pull_requests != null &&
      github.event.workflow_run.pull_requests[0] != null

    steps:
      - name: "Re-trigger unanswered rescue comments OR post @copilot review"
        uses: actions/github-script@v8
        with:
          # Must use CODEX_MASTER_KEY (PAT for @mbaetiong) so the comment appears as a
          # human user that GitHub Copilot will respond to.  github-actions[bot] comments
          # are silently ignored by Copilot Coding Agent.
          # Fallback to CODEX_BACKUP_KEY, then GITHUB_TOKEN as a graceful-degradation last
          # resort (the comment will still be posted; Copilot may not pick it up immediately
          # but the comment serves as a record for manual review).
          github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN }}
          script: |
            // Check repo variable COPILOT_AGENT_AUTH_ENABLED
            const authEnabled = '${{ vars.COPILOT_AGENT_AUTH_ENABLED }}';
            if (authEnabled !== 'true' && authEnabled !== '1') {
              console.log('COPILOT_AGENT_AUTH_ENABLED not set — skipping.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              console.log('No associated PRs — skipping.');
              return;
            }

            const pr = prs[0].number;

            // Verify the PR is still open
            let prData;
            try {
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: pr });
              prData = data;
            } catch (e) {
              console.log(`Could not fetch PR ${pr}: ${e.message}`);
              return;
            }
            if (prData.state !== 'open') {
              console.log(`PR #${pr} is ${prData.state} — skipping.`);
              return;
            }

            // ── STEP 1: Fetch the last 20 PR comments to check for unaddressed rescue ──
            // Uses GraphQL because REST listComments returns pages in ascending order
            // (per_page:5 gives OLDEST 5, not newest).
            let allNodes = [];
            try {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $pr: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      comments(last: 20) {
                        nodes {
                          id
                          databaseId
                          body
                          createdAt
                          author { login }
                        }
                      }
                    }
                  }
                }`,
                { owner, repo, pr }
              );
              allNodes = result?.repository?.pullRequest?.comments?.nodes || [];
            } catch (e) {
              console.log(`Could not fetch PR comments (non-blocking): ${e.message}`);
            }

            // ── STEP 2: Find unanswered CI rescue comments ──────────────────────────
            // A rescue comment is any comment containing "## 🚨 CI Rescue", posted by
            // any author EXCEPT the coding agent itself (to avoid treating agent quotes
            // of the rescue marker as a new rescue).  This covers:
            //   - github-actions[bot] (automated CI via GITHUB_TOKEN)
            //   - Any human admin using a PAT (e.g. the repo owner's token shows their login)
            // An "answer" is any subsequent @copilot bot reply that contains "Fixed in"
            // or "Addressed in" after the rescue comment.
            //
            // Key insight: when the agent pushes new commits, GitHub may silently drop
            // the queued session tied to an older rescue comment.  We detect this case
            // by checking whether a rescue comment has NO bot reply AFTER it.
            const RESCUE_MARKER = '## 🚨 CI Rescue';
            const AGENT_LOGINS = new Set([
              'copilot-swe-agent[bot]',
              'github-copilot[bot]',
              'copilot[bot]',
            ]);

            // Find the most-recent unanswered rescue comment (from any non-agent author)
            let pendingRescueComment = null;
            for (let i = allNodes.length - 1; i >= 0; i--) {
              const node = allNodes[i];
              const body = node.body || '';
              const authorLogin = node.author?.login || '';

              // Accept rescue comments from ANY author except the coding agent
              // (to avoid treating agent's quote-reply as a new rescue)
              if (body.includes(RESCUE_MARKER) && !AGENT_LOGINS.has(authorLogin)) {
                // Check if any agent comment AFTER this rescue comment addresses it
                const answeredAfter = allNodes.slice(i + 1).some(later => {
                  const laterLogin = later.author?.login || '';
                  const laterBody  = (later.body || '').toLowerCase();
                  return (
                    AGENT_LOGINS.has(laterLogin) &&
                    (laterBody.includes('fixed in') || laterBody.includes('addressed in'))
                  );
                });

                if (!answeredAfter) {
                  pendingRescueComment = node;
                  break;  // use the most-recent unanswered rescue
                }
              }
            }

            if (pendingRescueComment) {
              // ── PATH A: Re-trigger the unanswered rescue comment ────────────────
              // Post a targeted @copilot continue comment that references the rescue
              // comment so the new session picks it up immediately.
              const rescueUrl = `https://github.com/${owner}/${repo}/pull/${pr}#issuecomment-${pendingRescueComment.databaseId}`;
              const retriggerBody = [
                `@copilot+claude-sonnet-4.6 continue`,
                ``,
                `<!-- session-done-retrigger -->`,
                `A previous agent session pushed new commits after the CI rescue comment below`,
                `was posted, which caused GitHub to silently drop the queued rescue session.`,
                ``,
                `**Please address the rescue comment immediately:**`,
                `${rescueUrl}`,
                ``,
                `> _Auto-posted by \`copilot-agent-session-done.yml\` (session-done retrigger path)_`,
              '',
              '---',
              `_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
              ].join('\n');

              // Guard: don't re-post if we already re-triggered this rescue comment
              const alreadyRetriggered = allNodes.some(c => {
                const body = c.body || '';
                return body.includes('<!-- session-done-retrigger -->') &&
                  body.includes(`issuecomment-${pendingRescueComment.databaseId}`);
              });
              if (alreadyRetriggered) {
                console.log(
                  `Rescue comment ${pendingRescueComment.databaseId} was already re-triggered — skipping.`
                );
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr, body: retriggerBody,
                });
                console.log(
                  `Re-triggered rescue comment ${pendingRescueComment.databaseId} on PR #${pr}.`
                );
                return;  // don't also post review
              }
            }

            // ── PATH B: No pending rescue — post "@copilot review" as usual ────────
            // Guard 1: do not post if the most recent comment is already a review trigger
            const reviewTriggers = new Set([
              '@copilot review',
              '@copilot+claude-sonnet-4.6 review',
            ]);
            const recentTriggerCount = allNodes.slice(-10).filter(c => {
              const body = (c.body || '').trim();
              return reviewTriggers.has(body);
            }).length;

            // Guard 2: review-loop detection — if 3+ of the last 10 comments are
            // @copilot review triggers with no meaningful work in between, break the
            // loop by posting a diagnostic comment instead of another review trigger.
            if (recentTriggerCount >= 3) {
              const loopBreaker = [
                `@copilot+claude-sonnet-4.6 continue`,
                ``,
                `<!-- session-done-loop-break -->`,
                `⚠️ **Review-loop detected**: ${recentTriggerCount} consecutive \`@copilot review\` triggers`,
                `were posted without a resolved rescue or meaningful commit in between.`,
                ``,
                `**Possible causes:**`,
                `1. A CI failure is blocking the session from completing work`,
                `2. The agent is not receiving the review trigger (token issue)`,
                `3. The rescue comment chain is exhausted without a fix`,
                ``,
                `**Requested action:** Please check the latest CI failure and address it directly.`,
                `Check \`docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md\` for patterns.`,
                ``,
                `> _Auto-posted by \`copilot-agent-session-done.yml\` (loop-break guard)_`,
              '',
              '---',
              `_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
              ].join('\n');

              // Only post loop-breaker once per review-loop cycle
              const alreadyBroke = allNodes.slice(-5).some(c => {
                return (c.body || '').includes('<!-- session-done-loop-break -->');
              });
              if (!alreadyBroke) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr, body: loopBreaker,
                });
                console.log(`Loop-break comment posted to PR #${pr} (${recentTriggerCount} review triggers detected).`);
              } else {
                console.log(`Loop-break already posted — skipping to avoid double-loop.`);
              }
              return;
            }

            const alreadyPosted = allNodes.slice(-5).some(c => {
              const body = (c.body || '').trim();
              // Only treat agent-posted review triggers as "already posted".
              // A human writing exactly "@copilot+claude-sonnet-4.6 review" would
              // be intentional and should NOT suppress a new trigger.
              return reviewTriggers.has(body) && AGENT_LOGINS.has(c.author?.login || '');
            });
            if (alreadyPosted) {
              console.log('Most recent comment is already a "@copilot review" — skipping to avoid loop.');
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr,
              body: '@copilot+claude-sonnet-4.6 review',
            });
            console.log(`@copilot review posted to PR #${pr}.`);
