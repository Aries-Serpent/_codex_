name: "🔄 Auto-Post @copilot review After Agent Session"

# Fires when a GitHub Coding Agent (copilot-swe-agent[bot]) workflow run
# completes on a PR branch.  If the PR is open and Agent Token Delegation
# is enabled (COPILOT_AGENT_AUTH_ENABLED repo variable = 'true'), this
# workflow posts "@copilot review" to the PR so that Copilot Review starts
# immediately after the agent commits changes.
#
# Loop:
#   Coding agent commits → workflow_run completed → post "@copilot review"
#     → Copilot review generates N comments
#       → copilot-review-responder.yml fires
#         → post "@copilot apply changes based on the comments in [this thread](URL)"
#           → coding agent session starts → loop repeats
#
# Guard: does NOT post if the most-recent issue comment on the PR is already
# "@copilot review" (prevents infinite review-review loops if no new commits
# were pushed between two reviews).

on:
  workflow_run:
    # Trigger after Copilot setup steps complete (proxy for agent session end)
    workflows: ["Copilot Setup Steps"]
    types: [completed]

concurrency:
  # Use PR number if available, fall back to workflow_run ID to avoid
  # unrelated runs sharing the same concurrency key (null PR number issue).
  group: auto-post-copilot-review-${{ github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write

jobs:
  post-review-trigger:
    name: "Post @copilot review after agent session"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only fire when:
    #   1. The workflow_run was associated with a PR (not a plain branch push)
    #   2. COPILOT_AGENT_AUTH_ENABLED is enabled
    if: |
      github.event.workflow_run.pull_requests != null &&
      github.event.workflow_run.pull_requests[0] != null

    steps:
      - name: "Check COPILOT_AGENT_AUTH_ENABLED and post @copilot review"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Check repo variable COPILOT_AGENT_AUTH_ENABLED
            const authEnabled = '${{ vars.COPILOT_AGENT_AUTH_ENABLED }}';
            if (authEnabled !== 'true' && authEnabled !== '1') {
              console.log('COPILOT_AGENT_AUTH_ENABLED not set — skipping @copilot review post.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              console.log('No associated PRs — skipping.');
              return;
            }

            const pr = prs[0].number;

            // Verify the PR is still open
            let prData;
            try {
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: pr });
              prData = data;
            } catch (e) {
              console.log(`Could not fetch PR ${pr}: ${e.message}`);
              return;
            }
            if (prData.state !== 'open') {
              console.log(`PR #${pr} is ${prData.state} — skipping.`);
              return;
            }

            // Guard: do not post if the most recent comment is already "@copilot review"
            // (prevents a review→review loop when the agent didn't push any changes).
            // Uses GraphQL comments(last: 5) to reliably fetch the newest comments —
            // REST listComments returns pages in ascending order, so per_page:5 gives
            // the OLDEST 5 comments, not the newest.
            try {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $pr: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      comments(last: 5) {
                        nodes {
                          body
                          author { login }
                        }
                      }
                    }
                  }
                }`,
                { owner, repo, pr }
              );
              const nodes = result?.repository?.pullRequest?.comments?.nodes || [];
              // Guard against both old "@copilot review" and new "@copilot+claude-sonnet-4.6 review" formats
              const alreadyPosted = nodes.some(c => {
                const body = (c.body || '').trim();
                return (body === '@copilot review' || body === '@copilot+claude-sonnet-4.6 review') &&
                  c.author?.login === 'github-actions[bot]';
              });
              if (alreadyPosted) {
                console.log('Most recent comment is already a "@copilot review" — skipping to avoid loop.');
                return;
              }
            } catch (e) {
              console.log(`Could not check recent comments (non-blocking): ${e.message}`);
            }

            // Post "@copilot review"
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr,
              body: '@copilot+claude-sonnet-4.6 review',
            });
            console.log(`@copilot review posted to PR #${pr}.`);
