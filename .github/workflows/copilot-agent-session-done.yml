name: "🔄 Auto-Post @copilot review After Agent Session"

# Fires when a GitHub Coding Agent (copilot-swe-agent[bot]) workflow run
# completes on a PR branch.  If the PR is open and Agent Token Delegation
# is enabled (COPILOT_AGENT_AUTH_ENABLED repo variable = 'true'), this
# workflow either:
#
#   A) Re-triggers any unanswered CI rescue comment (priority path), OR
#   B) Posts "@copilot review" to start a review cycle
#
# WHY the rescue-comment re-trigger is needed:
#   When an agent session is running and a new @copilot rescue comment arrives,
#   GitHub queues the rescue session.  If the running session then pushes NEW
#   commits to the branch, GitHub invalidates the queued session (it was tied to
#   the earlier commit context).  Without re-triggering, that rescue comment is
#   silently dropped and no new session starts.
#
# Loop (review path):
#   Coding agent commits → workflow_run completed → post "@copilot review"
#     → Copilot review generates N comments
#       → copilot-review-responder.yml fires
#         → post "@copilot apply changes based on the comments in the review thread"
#           → coding agent session starts → loop repeats
#
# Guard: does NOT post if the most-recent comment is already "@copilot review"
# (prevents infinite review-review loops when the agent didn't push changes).

on:
  workflow_run:
    # Trigger when the Copilot coding agent session completes.
    # The dynamic "Copilot coding agent" workflow (path: dynamic/copilot-swe-agent/copilot)
    # is the actual agent session; its runs carry pull_requests context for the PR under work.
    # NOTE: workflow_run listeners only execute from the default branch (main).
    workflows: ["Copilot coding agent"]
    types: [completed]

concurrency:
  # Use PR number if available, fall back to workflow_run ID to avoid
  # unrelated runs sharing the same concurrency key (null PR number issue).
  # cancel-in-progress: false ensures a queued re-trigger isn't dropped when
  # two sessions end in rapid succession.
  group: auto-post-copilot-review-${{ github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  # ── Job 1: Auto-fix pre-flight requirements when 🔄 checkbox is checked ─────
  # When `- [x] 🔄 Auto-Post @copilot review After Agent Session` is checked in
  # the PR body, this job runs session_wrapup_autofix.py to ensure REQ-4/REQ-5
  # (accountability report + CHANGELOG touched in last commit) are satisfied
  # before the review trigger is posted.  Commit is tagged [skip ci] to avoid
  # triggering another full workflow run.
  preflight-autofix:
    name: "Pre-flight auto-fix (🔄 Auto-Post gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: |
      github.event.workflow_run.pull_requests != null &&
      github.event.workflow_run.pull_requests[0] != null
    outputs:
      autofix_ran: ${{ steps.autofix.outputs.autofix_ran }}

    steps:
      - name: "Checkout PR branch"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          fetch-depth: 2

      - name: "Auto-fix pre-flight REQ-4/5 when 🔄 Auto-Post checkbox is checked"
        id: autofix
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "autofix_ran=false" >> "$GITHUB_OUTPUT"

          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number — skipping pre-flight auto-fix."
            exit 0
          fi

          # Check if the 🔄 Auto-Post checkbox is checked in the PR body
          PR_BODY=$(gh pr view "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --json body -q '.body // ""' 2>/dev/null || echo "")

          if ! printf '%s' "$PR_BODY" | grep -qiE '\-\s*\[x\]\s*.*Auto-Post.*@copilot'; then
            echo "🔄 Auto-Post checkbox not checked — skipping pre-flight auto-fix."
            exit 0
          fi

          echo "🔄 Auto-Post checkbox is CHECKED — running pre-flight auto-fix..."

          # Determine which REQ fixes are needed by inspecting the last commit
          LAST_COMMIT_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          FIX_ARGS=""

          if ! echo "$LAST_COMMIT_FILES" | grep -q "AGENT_ACCOUNTABILITY_REPORT.md"; then
            FIX_ARGS="$FIX_ARGS --fix-accountability"
            echo "  REQ-4: AGENT_ACCOUNTABILITY_REPORT.md needs auto-fix"
          else
            echo "  REQ-4: AGENT_ACCOUNTABILITY_REPORT.md already updated — OK"
          fi

          if ! echo "$LAST_COMMIT_FILES" | grep -q "CHANGELOG.md"; then
            FIX_ARGS="$FIX_ARGS --fix-changelog"
            echo "  REQ-5: CHANGELOG.md needs auto-fix"
          else
            echo "  REQ-5: CHANGELOG.md already updated — OK"
          fi

          if [ -z "$FIX_ARGS" ]; then
            echo "✅ All pre-flight requirements already satisfied — no auto-fix needed."
            exit 0
          fi

          # Run the session_wrapup_autofix.py script with --fix-all
          # This covers ALL missing components in one call:
          #   REQ-4  — AGENT_ACCOUNTABILITY_REPORT.md
          #   REQ-5  — CHANGELOG.md
          #   REQ-6  — .secrets.baseline ↔ CODEX_MANIFEST.json sync
          #   WEC    — PR body Workflow Execution Checklist block
          python3 scripts/ci/session_wrapup_autofix.py \
            --pr-number "${PR_NUMBER}" \
            --sha "${GIT_SHA:0:8}" \
            --run-url "${RUN_URL}" \
            --fix-all

          # Commit and push the auto-fixed files back to the branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md CHANGELOG.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✅ No changes to commit — files already satisfied requirements."
          else
            git commit -m "fix(docs): auto-post pre-flight auto-fix: REQ-4/5 [auto-post-copilot-review][skip ci]"
            git pull --rebase origin "${TARGET_BRANCH}" || true
            git push origin HEAD:refs/heads/"${TARGET_BRANCH}"
            echo "✅ Pre-flight auto-fix committed and pushed to ${TARGET_BRANCH}."
            echo "autofix_ran=true" >> "$GITHUB_OUTPUT"
          fi

  post-review-trigger:
    name: "Post @copilot review after agent session"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight-autofix
    # Only fire when:
    #   1. The workflow_run was associated with a PR (not a plain branch push)
    if: |
      github.event.workflow_run.pull_requests != null &&
      github.event.workflow_run.pull_requests[0] != null

    steps:
      - name: "Re-trigger unanswered rescue comments OR post @copilot review"
        uses: actions/github-script@v8
        with:
          # Must use CODEX_MASTER_KEY (PAT for @mbaetiong) so the comment appears as a
          # human user that GitHub Copilot will respond to.  github-actions[bot] comments
          # are silently ignored by Copilot Coding Agent.
          # Fallback to CODEX_BACKUP_KEY, then GITHUB_TOKEN as a graceful-degradation last
          # resort (the comment will still be posted; Copilot may not pick it up immediately
          # but the comment serves as a record for manual review).
          github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN }}
          script: |
            // Gate check: proceed if EITHER the WEC checkbox is checked OR COPILOT_AGENT_AUTH_ENABLED is set.
            // This ensures the workflow always posts @copilot review when the user explicitly selects
            // `- [x] copilot-agent-session-done.yml` in the PR Workflow Execution Checklist,
            // even when COPILOT_AGENT_AUTH_ENABLED is unset (e.g. token unavailable environment).
            const authEnabled = '${{ vars.COPILOT_AGENT_AUTH_ENABLED }}';
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const prs   = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              console.log('No associated PRs — skipping.');
              return;
            }
            const pr = prs[0].number;

            // Fetch PR body to check the WEC checkbox for copilot-agent-session-done.yml
            let wecChecked = false;
            try {
              const { data: prDataForWec } = await github.rest.pulls.get({ owner, repo, pull_number: pr });
              const prBody = prDataForWec.body || '';
              // Match: `- [x] copilot-agent-session-done.yml` (case-insensitive, optional leading spaces)
              wecChecked = /[-*]\s*\[x\]\s*copilot-agent-session-done\.yml/i.test(prBody);
              console.log(`WEC checkbox (copilot-agent-session-done.yml): ${wecChecked}`);
            } catch (e) {
              console.log(`Could not fetch PR body for WEC check (non-fatal): ${e.message}`);
            }

            if (!wecChecked && authEnabled !== 'true' && authEnabled !== '1') {
              console.log('copilot-agent-session-done.yml WEC checkbox not checked AND COPILOT_AGENT_AUTH_ENABLED not set — skipping.');
              return;
            }

            // Verify the PR is still open
            let prData;
            try {
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: pr });
              prData = data;
            } catch (e) {
              console.log(`Could not fetch PR ${pr}: ${e.message}`);
              return;
            }
            if (prData.state !== 'open') {
              console.log(`PR #${pr} is ${prData.state} — skipping.`);
              return;
            }

            // ── STEP 1: Fetch the last 20 PR comments to check for unaddressed rescue ──
            // Uses GraphQL because REST listComments returns pages in ascending order
            // (per_page:5 gives OLDEST 5, not newest).
            let allNodes = [];
            try {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $pr: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      comments(last: 20) {
                        nodes {
                          id
                          databaseId
                          body
                          createdAt
                          author { login }
                        }
                      }
                    }
                  }
                }`,
                { owner, repo, pr }
              );
              allNodes = result?.repository?.pullRequest?.comments?.nodes || [];
            } catch (e) {
              console.log(`Could not fetch PR comments (non-blocking): ${e.message}`);
            }

            // ── STEP 2: Find unanswered CI rescue comments ──────────────────────────
            // A rescue comment is any comment containing "## 🚨 CI Rescue", posted by
            // any author EXCEPT the coding agent itself (to avoid treating agent quotes
            // of the rescue marker as a new rescue).  This covers:
            //   - github-actions[bot] (automated CI via GITHUB_TOKEN)
            //   - Any human admin using a PAT (e.g. the repo owner's token shows their login)
            // An "answer" is any subsequent @copilot bot reply that contains "Fixed in"
            // or "Addressed in" after the rescue comment.
            //
            // Key insight: when the agent pushes new commits, GitHub may silently drop
            // the queued session tied to an older rescue comment.  We detect this case
            // by checking whether a rescue comment has NO bot reply AFTER it.
            const RESCUE_MARKER = '## 🚨 CI Rescue';
            const AGENT_LOGINS = new Set([
              'copilot-swe-agent[bot]',
              'github-copilot[bot]',
              'copilot[bot]',
            ]);

            // Find the most-recent unanswered rescue comment (from any non-agent author)
            let pendingRescueComment = null;
            for (let i = allNodes.length - 1; i >= 0; i--) {
              const node = allNodes[i];
              const body = node.body || '';
              const authorLogin = node.author?.login || '';

              // Accept rescue comments from ANY author except the coding agent
              // (to avoid treating agent's quote-reply as a new rescue)
              if (body.includes(RESCUE_MARKER) && !AGENT_LOGINS.has(authorLogin)) {
                // Check if any agent comment AFTER this rescue comment addresses it
                const answeredAfter = allNodes.slice(i + 1).some(later => {
                  const laterLogin = later.author?.login || '';
                  const laterBody  = (later.body || '').toLowerCase();
                  return (
                    AGENT_LOGINS.has(laterLogin) &&
                    (laterBody.includes('fixed in') || laterBody.includes('addressed in'))
                  );
                });

                if (!answeredAfter) {
                  pendingRescueComment = node;
                  break;  // use the most-recent unanswered rescue
                }
              }
            }

            if (pendingRescueComment) {
              // ── PATH A: Re-trigger the unanswered rescue comment ────────────────
              // Post a targeted @copilot continue comment that references the rescue
              // comment so the new session picks it up immediately.
              const rescueUrl = `https://github.com/${owner}/${repo}/pull/${pr}#issuecomment-${pendingRescueComment.databaseId}`;
              const retriggerBody = [
                `@copilot+claude-sonnet-4.6 continue`,
                ``,
                `<!-- session-done-retrigger -->`,
                `A previous agent session pushed new commits after the CI rescue comment below`,
                `was posted, which caused GitHub to silently drop the queued rescue session.`,
                ``,
                `**Please address the rescue comment immediately:**`,
                `${rescueUrl}`,
                ``,
                `> _Auto-posted by \`copilot-agent-session-done.yml\` (session-done retrigger path)_`,
              '',
              '---',
              `_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
              ].join('\n');

              // Guard: don't re-post if we already re-triggered this rescue comment
              const alreadyRetriggered = allNodes.some(c => {
                const body = c.body || '';
                return body.includes('<!-- session-done-retrigger -->') &&
                  body.includes(`issuecomment-${pendingRescueComment.databaseId}`);
              });
              if (alreadyRetriggered) {
                console.log(
                  `Rescue comment ${pendingRescueComment.databaseId} was already re-triggered — skipping.`
                );
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr, body: retriggerBody,
                });
                console.log(
                  `Re-triggered rescue comment ${pendingRescueComment.databaseId} on PR #${pr}.`
                );
                return;  // don't also post review
              }
            }

            // ── PATH B: No pending rescue — post "@copilot review" as usual ────────
            // Guard 1: do not post if the most recent comment is already a review trigger
            const reviewTriggers = new Set([
              '@copilot review',
              '@copilot+claude-sonnet-4.6 review',
            ]);
            const recentTriggerCount = allNodes.slice(-10).filter(c => {
              const body = (c.body || '').trim();
              return reviewTriggers.has(body);
            }).length;

            // Guard 2: review-loop detection — if 3+ of the last 10 comments are
            // @copilot review triggers with no meaningful work in between, break the
            // loop by posting a diagnostic comment instead of another review trigger.
            if (recentTriggerCount >= 3) {
              const loopBreaker = [
                `@copilot+claude-sonnet-4.6 continue`,
                ``,
                `<!-- session-done-loop-break -->`,
                `⚠️ **Review-loop detected**: ${recentTriggerCount} consecutive \`@copilot review\` triggers`,
                `were posted without a resolved rescue or meaningful commit in between.`,
                ``,
                `**Possible causes:**`,
                `1. A CI failure is blocking the session from completing work`,
                `2. The agent is not receiving the review trigger (token issue)`,
                `3. The rescue comment chain is exhausted without a fix`,
                ``,
                `**Requested action:** Please check the latest CI failure and address it directly.`,
                `Check \`docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md\` for patterns.`,
                ``,
                `> _Auto-posted by \`copilot-agent-session-done.yml\` (loop-break guard)_`,
              '',
              '---',
              `_[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
              ].join('\n');

              // Only post loop-breaker once per review-loop cycle
              const alreadyBroke = allNodes.slice(-5).some(c => {
                return (c.body || '').includes('<!-- session-done-loop-break -->');
              });
              if (!alreadyBroke) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr, body: loopBreaker,
                });
                console.log(`Loop-break comment posted to PR #${pr} (${recentTriggerCount} review triggers detected).`);
              } else {
                console.log(`Loop-break already posted — skipping to avoid double-loop.`);
              }
              return;
            }

            const alreadyPosted = allNodes.slice(-5).some(c => {
              const body = (c.body || '').trim();
              // Only treat agent-posted review triggers as "already posted".
              // A human writing exactly "@copilot+claude-sonnet-4.6 review" would
              // be intentional and should NOT suppress a new trigger.
              return reviewTriggers.has(body) && AGENT_LOGINS.has(c.author?.login || '');
            });
            if (alreadyPosted) {
              console.log('Most recent comment is already a "@copilot review" — skipping to avoid loop.');
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr,
              body: '@copilot+claude-sonnet-4.6 review',
            });
            console.log(`@copilot review posted to PR #${pr}.`);

  # ── Job 3: Auto-approve all pending workflow runs on last commit SHA ────────
  # Fires when `- [x] auto-approve-workflows` is checked in the PR body.
  # Trigger point: after the "Copilot [finished work] on behalf of [mbaetiong]"
  # event (i.e., immediately after this workflow_run trigger fires).
  # Uses: GET /repos/{owner}/{repo}/actions/runs?head_sha={sha}&status=action_required
  #       POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve
  # Requires: CODEX_MASTER_KEY or CODEX_BACKUP_KEY with workflow approval scope.
  auto-approve-pending-runs:
    name: "⚡ Auto-Approve pending workflow runs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight-autofix
    if: |
      github.event.workflow_run.pull_requests != null &&
      github.event.workflow_run.pull_requests[0] != null
    steps:
      - name: "Approve all action_required workflow runs for head SHA"
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number — skipping auto-approve."
            exit 0
          fi

          # Check whether the auto-approve-workflows checkbox is ticked
          PR_BODY=$(gh pr view "${PR_NUMBER}" \
            --repo "${REPO}" \
            --json body -q '.body // ""' 2>/dev/null || echo "")

          if ! printf '%s' "$PR_BODY" | grep -qiE '^\-\s*\[x\]\s*auto-approve-workflows'; then
            echo "⚡ auto-approve-workflows not checked — skipping."
            exit 0
          fi

          echo "⚡ auto-approve-workflows is CHECKED — approving pending runs for SHA ${HEAD_SHA:0:12}..."

          # Fetch all workflow runs for this commit that require approval
          PENDING_RUNS=$(gh api \
            "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&status=action_required&per_page=100" \
            --jq '.workflow_runs[].id' 2>/dev/null || echo "")

          if [ -z "$PENDING_RUNS" ]; then
            echo "✅ No pending workflow runs requiring approval for SHA ${HEAD_SHA:0:12}."
            printf '### ⚡ Auto-Approve\n\nNo action_required runs found for commit `%s`.\n' "${HEAD_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          APPROVED=0
          FAILED=0
          SUMMARY_LINES=""

          while IFS= read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue
            RUN_NAME=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.name // "unknown"' 2>/dev/null || echo "unknown")
            if gh api --method POST "repos/${REPO}/actions/runs/${RUN_ID}/approve" 2>/dev/null; then
              echo "  ✅ Approved run #${RUN_ID} (${RUN_NAME})"
              APPROVED=$((APPROVED + 1))
              SUMMARY_LINES="${SUMMARY_LINES}\n- ✅ Run [#${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) — ${RUN_NAME}"
            else
              echo "  ⚠️  Failed to approve run #${RUN_ID} (${RUN_NAME}) — may require owner approval"
              FAILED=$((FAILED + 1))
              SUMMARY_LINES="${SUMMARY_LINES}\n- ⚠️ Run [#${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID}) — ${RUN_NAME} (approval failed)"
            fi
          done <<< "$PENDING_RUNS"

          printf '### ⚡ Auto-Approve Results\n\n**Approved:** %d | **Failed:** %d\n%b\n' \
            "$APPROVED" "$FAILED" "$SUMMARY_LINES" >> "$GITHUB_STEP_SUMMARY"

          if [ "$APPROVED" -gt 0 ]; then
            echo "✅ Auto-approved ${APPROVED} pending workflow run(s) for PR #${PR_NUMBER}."
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "⚠️  ${FAILED} run(s) could not be approved — owner approval may be required."
          fi

  # ── Job 4: Compile bot feedback into a single @copilot continue comment ─────
  # Fires after the agent session completes.  Collects all Code Quality, Security,
  # and Copilot AI review findings from bot comments / PR reviews that have NOT
  # already been compiled into a continue comment.  Posts a single thread as
  # @mbaetiong directing Copilot to continue with ALL tasks + the bot concerns.
  #
  # Bot comment sources detected:
  #   - github-copilot[bot] / copilot-pull-request-reviewer[bot] review COMMENTS (PR reviews)
  #   - github-actions[bot] comments that include quality/security markers
  #   - Any comment containing the <!-- code-quality-report --> or <!-- security-findings --> markers
  #
  # Guard: does NOT post if the most recent compile comment is identical to what
  # would be posted (de-duplicate by SHA fingerprint).
  compile-bot-feedback:
    name: "Compile bot feedback → @copilot continue thread"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: post-review-trigger
    if: |
      github.event.workflow_run.pull_requests != null &&
      github.event.workflow_run.pull_requests[0] != null

    steps:
      - name: "Collect bot findings and post consolidated @copilot continue comment"
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const prs   = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) return;
            const prNumber = prs[0].number;

            // Gate: only run when copilot-agent-session-done.yml WEC checkbox is checked
            let wecChecked = false;
            try {
              const { data: prInfo } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (prInfo.state !== 'open') { console.log(`PR #${prNumber} is closed — skipping.`); return; }
              wecChecked = /[-*]\s*\[x\]\s*copilot-agent-session-done\.yml/i.test(prInfo.body || '');
            } catch (e) {
              console.log(`Cannot fetch PR for gate check: ${e.message}`); return;
            }
            const authEnabled = '${{ vars.COPILOT_AGENT_AUTH_ENABLED }}';
            if (!wecChecked && authEnabled !== 'true' && authEnabled !== '1') {
              console.log('WEC checkbox not checked — skipping compile-bot-feedback.'); return;
            }

            // ── Collect PR Review comments from Copilot AI reviewer ──────────────
            const BOT_REVIEW_AUTHORS = new Set([
              'copilot-pull-request-reviewer[bot]',
              'github-copilot[bot]',
              'copilot[bot]',
            ]);
            const BOT_COMMENT_AUTHORS = new Set([
              'github-actions[bot]',
              'copilot-pull-request-reviewer[bot]',
              'github-copilot[bot]',
            ]);
            // Quality/security markers commonly emitted by CI bots
            const BOT_CONTENT_MARKERS = [
              '<!-- code-quality-report -->',
              '<!-- security-findings -->',
              'semgrep',
              'codeql',
              '🔒 security',
              '⚠️ code quality',
              'code scanning',
              'code quality',
              'security scan',
            ];

            let findings = [];

            // 1. PR review comments (Copilot AI review findings)
            try {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: prNumber, per_page: 50,
              });
              for (const review of reviews) {
                const login = review.user?.login || '';
                if (!BOT_REVIEW_AUTHORS.has(login)) continue;
                // Collect the review body if it has content
                if (review.body && review.body.trim().length > 20) {
                  findings.push({ source: `Copilot AI Review (${review.submitted_at?.slice(0,10)})`, body: review.body.trim() });
                }
              }

              // Also collect inline review comments (diff comments)
              const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: prNumber, per_page: 100, sort: 'created', direction: 'desc',
              });
              const recent = reviewComments.slice(0, 20);
              for (const rc of recent) {
                const login = rc.user?.login || '';
                if (!BOT_REVIEW_AUTHORS.has(login)) continue;
                findings.push({ source: `Copilot Review Comment (${rc.path}:${rc.line || rc.original_line || '?'})`, body: rc.body.trim() });
              }
            } catch (e) {
              console.log(`Could not fetch reviews (non-fatal): ${e.message}`);
            }

            // 2. Issue comments from quality/security bots
            try {
              const { data: issueComments } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber, per_page: 50,
              });
              // Only look at the last 30 comments
              const recent = issueComments.slice(-30);
              for (const c of recent) {
                const login = c.user?.login || '';
                const body  = c.body || '';
                const isBotAuthor = BOT_COMMENT_AUTHORS.has(login);
                const hasBotMarker = BOT_CONTENT_MARKERS.some(m => body.toLowerCase().includes(m.toLowerCase()));
                // Skip the compile-thread itself to avoid re-including old compilations
                if (body.includes('<!-- compiled-bot-feedback -->')) continue;
                if ((isBotAuthor || hasBotMarker) && body.trim().length > 40) {
                  // Truncate very long bot comments to first 500 chars
                  const excerpt = body.length > 500 ? body.slice(0, 497) + '…' : body;
                  findings.push({ source: `Bot Comment (${login}, ${c.created_at?.slice(0,10)})`, body: excerpt });
                }
              }
            } catch (e) {
              console.log(`Could not fetch issue comments (non-fatal): ${e.message}`);
            }

            if (findings.length === 0) {
              console.log(`No bot findings detected for PR #${prNumber} — skipping compile-bot-feedback.`);
              return;
            }

            // ── Build compiled continuation comment ──────────────────────────────
            const findingsList = findings
              .map((f, i) => `**${i + 1}. ${f.source}**\n\n> ${(f.body || '').replace(/\n/g, '\n> ')}`)
              .join('\n\n---\n\n');

            const compiledBody = [
              `<!-- compiled-bot-feedback -->`,
              `@copilot continue with all current priority 1, 2, 3, and 4 tasks as well as addressing all code quality and security concerns listed below.`,
              ``,
              `**📋 Bot-reported findings (${findings.length} item${findings.length > 1 ? 's' : ''}):**`,
              ``,
              findingsList,
              ``,
              `---`,
              `> _Compiled by \`copilot-agent-session-done.yml\` · compile-bot-feedback job_`,
              `> _[🔗 Workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            // Guard: don't re-post the same finding set within the last 5 comments
            try {
              const { data: recentComments } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber, per_page: 5,
              });
              const alreadyPosted = (recentComments || []).some(c =>
                (c.body || '').includes('<!-- compiled-bot-feedback -->')
              );
              if (alreadyPosted) {
                console.log(`compile-bot-feedback already posted recently for PR #${prNumber} — skipping.`);
                return;
              }
            } catch (e) {
              console.log(`Guard check failed (non-fatal): ${e.message}`);
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber, body: compiledBody,
            });
            console.log(`Compiled ${findings.length} bot finding(s) into @copilot continue comment on PR #${prNumber}.`);
