name: Generate PR Follow-Up Prompt

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow pr-followup-generator 2>/dev/null || echo "Cache health: check skipped"
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[github]"

      - name: Extract PR number
        id: pr_number
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate follow-up prompt
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          PR_NUMBER="${{ steps.pr_number.outputs.pr_number }}"
          echo "🚀 Generating follow-up prompt for PR #${PR_NUMBER}"

          python scripts/generate_pr_followup.py \
            "${PR_NUMBER}" \
            --template comprehensive \
            --json-output

          echo "✅ Follow-up prompt generated successfully"

      - name: Commit and push prompt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/copilot-prompts/active/

          if ! git diff --cached --quiet; then
            git commit -m "chore: Generate follow-up prompt for PR #${{ steps.pr_number.outputs.pr_number }}"
            git push
            echo "✅ Follow-up prompt committed and pushed"
          else
            echo "ℹ️ No changes to commit"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr_number.outputs.pr_number }};
            const body = `✅ Follow-up prompt has been generated for this PR.

            📄 View the prompt at: \`.github/copilot-prompts/active/PR-${prNumber}-followup.md\`

            You can use this prompt to continue work on this PR or track follow-up tasks.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
