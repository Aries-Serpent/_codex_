name: Generate PR Follow-Up Prompt

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow pr-followup-generator 2>/dev/null || echo "Cache health: check skipped"
      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[github]"

      - name: Extract PR number
        id: pr_number
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate follow-up prompt
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          PR_NUMBER="${{ steps.pr_number.outputs.pr_number }}"
          echo "🚀 Generating follow-up prompt for PR #${PR_NUMBER}"

          python scripts/generate_pr_followup.py \
            "${PR_NUMBER}" \
            --template comprehensive \
            --json-output

          echo "✅ Follow-up prompt generated successfully"

      - name: Commit and push prompt
        id: push_prompt
        env:
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/copilot-prompts/active/

          if ! git diff --cached --quiet; then
            git commit -m "chore: Generate follow-up prompt for PR #${{ steps.pr_number.outputs.pr_number }}"
            # Bounded retry: up to 3 pull-rebase+push attempts before failing.
            # This handles non-fast-forward errors (e.g. another workflow pushing
            # concurrently) without silently suppressing the error.
            PUSHED=false
            for attempt in 1 2 3; do
              git pull --rebase origin "$TARGET_REF" || true
              if git push; then
                echo "✅ Follow-up prompt committed and pushed (attempt ${attempt})"
                PUSHED=true
                break
              fi
              echo "⚠️ Push attempt ${attempt} failed; retrying in ${attempt}s..."
              sleep "$attempt"
            done
            if [ "$PUSHED" = "false" ]; then
              echo "❌ Failed to push follow-up prompt after 3 attempts" >&2
              exit 1
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.push_prompt.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr_number.outputs.pr_number }};
            const MARKER = '<!-- pr-followup-prompt-generated -->';
            const body = `${MARKER}\n✅ Follow-up prompt has been generated for this PR.

            📄 View the prompt at: \`.github/copilot-prompts/active/PR-${prNumber}-followup.md\`

            You can use this prompt to continue work on this PR or track follow-up tasks.`;

            // Retry loop — guards against concurrent posts on fast-following
            // trigger events (e.g. push + workflow_run firing simultaneously).
            for (let attempt = 0; attempt <= 3; attempt++) {
              try {
                // Paginate through all comments to find the marker, regardless of
                // comment count (PRs with >100 comments would miss older marker comments).
                let existing = null;
                let page = 1;
                while (!existing) {
                  const { data: batch } = await github.rest.issues.listComments({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: prNumber, per_page: 100, page,
                  });
                  existing = batch.find(c => c.body && c.body.includes(MARKER)) || null;
                  if (batch.length < 100) break;
                  page++;
                }
                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    comment_id: existing.id, body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: prNumber, body,
                  });
                }
                break; // success
              } catch (e) {
                if (attempt === 3) throw e;
                await new Promise(r => setTimeout(r, (attempt + 1) * 2000));
              }
            }

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: generate
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "PR Follow-up Generator"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"******","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: pr-followup-generator.yml → rescue-comment job (S227)_"""
          _,comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100")
          existing_id=None; existing_body=""
          if isinstance(comments,list):
            for c in comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
