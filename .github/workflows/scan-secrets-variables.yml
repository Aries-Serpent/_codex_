name: Scan and Report GitHub Secrets and Variables

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      include_env_vars:
        description: 'Include environment variable scanning'
        required: false
        type: boolean
        default: true
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan-and-report:
    name: Scan Secrets and Variables
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'common'
