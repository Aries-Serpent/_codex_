name: Scan and Report GitHub Secrets and Variables

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      include_env_vars:
        description: 'Include environment variable scanning'
        required: false
        type: boolean
        default: true
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan-and-report:
    name: Scan Secrets and Variables
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
            ${{ runner.os }}-${{ github.workflow }}-pip-gh-
            ${{ runner.os }}-pip-

      - name: Scan for ${{ secrets.* }} patterns
        id: scan_secrets
        run: |
          echo "Scanning for secrets patterns..."
          # Find all files excluding .git directory and binary files
          find . -type f -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './.hypothesis/*' -not -path './build/*' \
            -not -path './dist/*' -not -path './.nox/*' \
            -not -path './.pytest_cache/*' -not -path './__pycache__/*' \
            2>/dev/null | while read -r file; do
              if file "$file" | grep -q text; then
                grep -oE '\$\{\{ secrets\.[A-Za-z0-9_.]+ \}\}' "$file" 2>/dev/null || true
              fi
          done | sed 's/.*secrets\.//; s/}}.*//' | sort -u > extracted_secrets.txt || true
          
          if [ ! -s extracted_secrets.txt ] || ! grep -q '[A-Za-z0-9_]' extracted_secrets.txt; then
            echo "No secrets patterns found" > extracted_secrets.txt
          fi
          
          echo "Found $(wc -l < extracted_secrets.txt) unique secret references"

      - name: Scan for ${{ vars.* }} patterns
        id: scan_vars
        run: |
          echo "Scanning for variables patterns..."
          find . -type f -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './.hypothesis/*' -not -path './build/*' \
            -not -path './dist/*' -not -path './.nox/*' \
            -not -path './.pytest_cache/*' -not -path './__pycache__/*' \
            2>/dev/null | while read -r file; do
              if file "$file" | grep -q text; then
                grep -oE '\$\{\{ vars\.[A-Za-z0-9_.]+ \}\}' "$file" 2>/dev/null || true
              fi
          done | sed 's/.*vars\.//; s/}}.*//' | sort -u > extracted_vars.txt || true
          
          if [ ! -s extracted_vars.txt ] || ! grep -q '[A-Za-z0-9_]' extracted_vars.txt; then
            echo "No variables patterns found" > extracted_vars.txt
          fi
          
          echo "Found $(wc -l < extracted_vars.txt) unique variable references"

      - name: Scan for environment variables ($VAR or ${VAR})
        id: scan_env_vars
        if: inputs.include_env_vars != false
        run: |
          echo "Scanning for environment variable patterns..."
          # Scan for $VAR or ${VAR} patterns, excluding common false positives
          find . -type f \
            -not -path './.git/*' -not -path './node_modules/*' \
            -not -path './.hypothesis/*' -not -path './build/*' \
            -not -path './dist/*' -not -path './.nox/*' \
            -not -path './.pytest_cache/*' -not -path './__pycache__/*' \
            \( -name "*.yml" -o -name "*.yaml" -o -name "*.sh" -o -name "*.py" \) \
            2>/dev/null | while read -r file; do
              if file "$file" | grep -q text; then
                # Match $VAR or ${VAR} patterns
                grep -oE '\$\{?[A-Z_][A-Z0-9_]+\}?' "$file" 2>/dev/null || true
              fi
          done | sed 's/\${\?\([A-Z_][A-Z0-9_]*\)}\?/\1/' | \
          grep -E '^[A-Z_][A-Z0-9_]+$' | \
          # Filter out common false positives
          grep -vE '^(PATH|HOME|USER|SHELL|PWD|OLDPWD|TERM|LANG|LC_|TMP|TEMP)$' | \
          sort -u > extracted_env_vars.txt || true
          
          if [ ! -s extracted_env_vars.txt ] || ! grep -q '[A-Z0-9_]' extracted_env_vars.txt; then
            echo "No environment variables found" > extracted_env_vars.txt
          fi
          
          echo "Found $(wc -l < extracted_env_vars.txt) unique environment variable references"

      - name: Retrieve repository secrets
        id: repo_secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Retrieving repository secrets..."
          gh secret list --repo ${{ github.repository }} --json name 2>/dev/null | \
            jq -r '.[].name' | sort -u > repo_secrets.txt || echo "Unable to list secrets (may require admin permissions)" > repo_secrets.txt
          
          echo "Found $(wc -l < repo_secrets.txt) configured repository secrets"

      - name: Retrieve repository variables
        id: repo_vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Retrieving repository variables..."
          gh variable list --repo ${{ github.repository }} --json name 2>/dev/null | \
            jq -r '.[].name' | sort -u > repo_vars.txt || echo "Unable to list variables (may require admin permissions)" > repo_vars.txt
          
          echo "Found $(wc -l < repo_vars.txt) configured repository variables"

      - name: Retrieve organization secrets (if applicable)
        id: org_secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Retrieving organization secrets..."
          ORG_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          gh secret list --org "$ORG_NAME" --json name 2>/dev/null | \
            jq -r '.[].name' | sort -u > org_secrets.txt || echo "Unable to list org secrets (may require admin permissions or org may not exist)" > org_secrets.txt
          
          echo "Organization: $ORG_NAME"
          echo "Found $(wc -l < org_secrets.txt) configured organization secrets"

      - name: Retrieve organization variables (if applicable)
        id: org_vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Retrieving organization variables..."
          ORG_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          gh variable list --org "$ORG_NAME" --json name 2>/dev/null | \
            jq -r '.[].name' | sort -u > org_vars.txt || echo "Unable to list org variables (may require admin permissions or org may not exist)" > org_vars.txt
          
          echo "Organization: $ORG_NAME"
          echo "Found $(wc -l < org_vars.txt) configured organization variables"

      - name: Generate report
        id: generate_report
        run: |
          echo "Generating comprehensive report..."
          
          # Create report header with proper variable expansion
          cat > report.md << EOF
          # GitHub Secrets and Variables Usage Report
          
          **Generated:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")  
          **Repository:** ${{ github.repository }}  
          **Commit:** ${{ github.sha }}  
          **Workflow Run:** ${{ github.run_id }}
          
          ---
          
          ## 📊 Extracted from Codebase
          
          ### 🔐 Expected Secrets (from \\\${{ secrets.* }})
          
          EOF
          
          if grep -q '[A-Z0-9_]' extracted_secrets.txt 2>/dev/null; then
            sed 's/^/- `/' extracted_secrets.txt | sed 's/$/`/' >> report.md
          else
            echo "*No secrets references found in codebase*" >> report.md
          fi
          
          cat >> report.md << EOF
          
          ### 📦 Expected Variables (from \\\${{ vars.* }})
          
          EOF
          
          if grep -q '[A-Z0-9_]' extracted_vars.txt 2>/dev/null; then
            sed 's/^/- `/' extracted_vars.txt | sed 's/$/`/' >> report.md
          else
            echo "*No variables references found in codebase*" >> report.md
          fi
          
          cat >> report.md << 'EOF'
          
          ### 🌍 Expected Environment Variables (from $VAR or ${VAR})
          
          EOF
          
          if grep -q '[A-Z0-9_]' extracted_env_vars.txt 2>/dev/null; then
            sed 's/^/- `/' extracted_env_vars.txt | sed 's/$/`/' >> report.md
            echo "" >> report.md
            echo "> **Note:** Only scanned workflow files (.yml, .yaml), shell scripts (.sh), and Python files (.py)" >> report.md
          else
            echo "*No environment variables found in scanned files*" >> report.md
          fi
          
          cat >> report.md << 'EOF'
          
          ---
          
          ## ✅ Verification Against GitHub Settings
          
          ### 🔐 Repository Secrets (Configured)
          
          EOF
          
          if grep -q '[A-Z0-9_]' repo_secrets.txt 2>/dev/null && ! grep -q "Unable to list" repo_secrets.txt; then
            sed 's/^/- ✓ `/' repo_secrets.txt | sed 's/$/`/' >> report.md
          else
            echo "*Unable to retrieve or no secrets configured*" >> report.md
          fi
          
          cat >> report.md << 'EOF'
          
          ### 📦 Repository Variables (Configured)
          
          EOF
          
          if grep -q '[A-Z0-9_]' repo_vars.txt 2>/dev/null && ! grep -q "Unable to list" repo_vars.txt; then
            sed 's/^/- ✓ `/' repo_vars.txt | sed 's/$/`/' >> report.md
          else
            echo "*Unable to retrieve or no variables configured*" >> report.md
          fi
          
          cat >> report.md << 'EOF'
          
          ### 🏢 Organization Secrets (Configured)
          
          EOF
          
          if grep -q '[A-Z0-9_]' org_secrets.txt 2>/dev/null && ! grep -q "Unable to list" org_secrets.txt; then
            sed 's/^/- ✓ `/' org_secrets.txt | sed 's/$/`/' >> report.md
          else
            echo "*Unable to retrieve or no organization secrets configured*" >> report.md
          fi
          
          cat >> report.md << 'EOF'
          
          ### 🏢 Organization Variables (Configured)
          
          EOF
          
          if grep -q '[A-Z0-9_]' org_vars.txt 2>/dev/null && ! grep -q "Unable to list" org_vars.txt; then
            sed 's/^/- ✓ `/' org_vars.txt | sed 's/$/`/' >> report.md
          else
            echo "*Unable to retrieve or no organization variables configured*" >> report.md
          fi
          
          cat >> report.md << 'EOF'
          
          ---
          
          ## 📚 Expected Variables Reference
          
          For a comprehensive list of all expected secrets and variables, see:
          - **[Current Expected Variables](../../docs/security/CURRENT_EXPECTED_VARIABLES.md)**
          - **[Token Encryption Tool Review](../../docs/security/token_encryption_tool_review_2026-01-01.md)**
          - **[Admin Token Setup Guide](../../docs/admin/security/ADMIN_TOKEN_SETUP.md)**
          
          ### Core Secrets Expected
          
          **Token Management**:
          - `CODEX_GHP_TOKEN_BASE64` - Base64 encoded GitHub token (recommended)
          - `CODEX_GHP_TOKEN_CONFIG` - Combined AES-256-GCM config (most secure)
          - `GITHUB_TOKEN` - Auto-provided by GitHub Actions
          - `GH_TOKEN` - GitHub token (alias for CLI operations)
          
          **API Keys**:
          - `GITHUB_CODEX` - OpenAI API key for codex operations
          - `OPENAI_API_KEY` - Direct OpenAI API access
          - `PINECONE_API_KEY` - Pinecone vector database
          
          **Testing & Optional**:
          - `ENABLE_LIVE_TESTS` - Enable live API integration tests
          - `GITLEAKS_LICENSE` - Gitleaks Pro license (optional)
          - `CODEX_MASTER_KEY` - Master encryption key (planned)
          
          ### Core Variables Expected
          
          **Agent Configuration**:
          - `CODEX_AGENT_NAME` - Agent identifier
          - `CODEX_API_VERSION` - API version string
          - `CODEX_LOG_LEVEL` - Logging verbosity
          - `CODEX_ORG_NAME` - Organization name
          - `CODEX_REPO_ID` - Repository identifier
          
          **Security Tool Bootstrap**:
          - `CODEX_SECURITY_ENCRYPTION_TOOL_B64` - Base64 encryption tool
          - `CODEX_SECURITY_DECODER_MODULE_B64` - Base64 decoder module
          - `CODEX_SECURITY_ADMIN_GUIDE_B64` - Base64 admin guide
          - `CODEX_SECURITY_MANIFEST_JSON` - Security manifest
          
          **Metadata**:
          - `GENESIS_TIMESTAMP` - Repository creation time
          - `RUNS_ON` - Default runner label
          
          ---
          
          ## ⚠️ Summary of Missing Items
          
          ### 🔐 Missing Secrets
          
          EOF
          
          # Calculate missing secrets
          if [ -f extracted_secrets.txt ] && grep -q '[A-Z0-9_]' extracted_secrets.txt; then
            cat repo_secrets.txt org_secrets.txt 2>/dev/null | grep -v "Unable to list" | sort -u > all_secrets.txt
            comm -23 <(sort extracted_secrets.txt) <(sort all_secrets.txt) > missing_secrets.txt
            
            if [ -s missing_secrets.txt ] && grep -q '[A-Z0-9_]' missing_secrets.txt; then
              sed 's/^/- ❌ `/' missing_secrets.txt | sed 's/$/`/' >> report.md
            else
              echo "*All referenced secrets are configured* ✅" >> report.md
            fi
          else
            echo "*No secrets to verify*" >> report.md
          fi
          
          cat >> report.md << 'EOF'
          
          ### 📦 Missing Variables
          
          EOF
          
          # Calculate missing variables
          if [ -f extracted_vars.txt ] && grep -q '[A-Z0-9_]' extracted_vars.txt; then
            cat repo_vars.txt org_vars.txt 2>/dev/null | grep -v "Unable to list" | sort -u > all_vars.txt
            comm -23 <(sort extracted_vars.txt) <(sort all_vars.txt) > missing_vars.txt
            
            if [ -s missing_vars.txt ] && grep -q '[A-Z0-9_]' missing_vars.txt; then
              sed 's/^/- ❌ `/' missing_vars.txt | sed 's/$/`/' >> report.md
            else
              echo "*All referenced variables are configured* ✅" >> report.md
            fi
          else
            echo "*No variables to verify*" >> report.md
          fi
          
          cat >> report.md << 'EOF'
          
          ---
          
          ## 📝 Notes
          
          - **Environment Variables**: Not centrally managed in GitHub settings. They may need to be set in:
            - Workflow files (using `env:` blocks)
            - Repository or organization variables
            - Runner environment
            - External configurations
          
          - **Permissions**: Some information may be unavailable due to permission restrictions. Admin access may be required to view all secrets and variables.
          
          - **Security**: This report does not expose secret values, only their names and configuration status.
          
          ---
          
          *Generated by GitHub Actions workflow: `scan-secrets-variables.yml`*
          EOF
          
          echo "Report generated successfully"
          
          # Display summary
          echo "=== Report Summary ==="
          echo "Secrets referenced: $(grep -c '[A-Z0-9_]' extracted_secrets.txt 2>/dev/null || echo 0)"
          echo "Variables referenced: $(grep -c '[A-Z0-9_]' extracted_vars.txt 2>/dev/null || echo 0)"
          echo "Environment variables found: $(grep -c '[A-Z0-9_]' extracted_env_vars.txt 2>/dev/null || echo 0)"

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-secrets-variables-report
          path: |
            report.md
            extracted_secrets.txt
            extracted_vars.txt
            extracted_env_vars.txt
            repo_secrets.txt
            repo_vars.txt
            org_secrets.txt
            org_vars.txt
          retention-days: 90

      - name: Display report preview
        run: |
          echo "=== Report Preview ==="
          head -n 50 report.md
          echo ""
          echo "Full report available in artifacts: github-secrets-variables-report"
