name: Autonomous Codebase Management
on:
  schedule:
  - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: monitor
        type: choice
        options:
        - monitor
        - execute
        - report
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  owner-guard:
    name: Owner Approval Guard
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.guard.outputs.approved }}
    steps:
    - name: Cache test results (Layer 3)
      uses: actions/cache@v6
      if: always()
      with:
        path: .pytest_cache/
        key: ${{ runner.os }}-pytest-${{ github.sha }}
        restore-keys: '${{ runner.os }}-pytest-

          '
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        sparse-checkout: '.github

          scripts/ci

          '
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow autonomous-agent
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Check Owner Approval
      id: guard
      env:
        TOOL_KEY: autonomous-agent
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "if bash scripts/ci/owner_approval_guard.sh; then\n  echo \"approved=true\"\
        \ >> $GITHUB_OUTPUT\n  echo \"\u2705 Owner approval valid for autonomous operations\"\
        \nelse\n  echo \"approved=false\" >> $GITHUB_OUTPUT\n  echo \"\u26A0\uFE0F\
        \ Owner approval not found - workflow will skip execution\"\nfi\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
  autonomous-agent:
    name: Autonomous Agent Execution
    needs: owner-guard
    if: needs.owner-guard.outputs.approved == 'true' || github.event.inputs.mode ==
      'monitor'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
    - name: Set up Python 3.12 with tiered cache
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: live
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -e ".[dev]" || pip install -e .

        '
    - name: Run Autonomous Agent
      env:
        MODE: ${{ github.event.inputs.mode || 'monitor' }}
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
      run: "echo \"Running in mode: $MODE\"\ncase \"$MODE\" in\n  monitor)\n    echo\
        \ \"\U0001F4CA Monitoring mode - collecting metrics only\"\n    python -c\
        \ \"print('Monitoring complete')\"\n    ;;\n  execute)\n    echo \"\u26A1\
        \ Execute mode - performing autonomous operations\"\n    python -c \"print('Execution\
        \ complete')\"\n    ;;\n  report)\n    echo \"\U0001F4DD Report mode - generating\
        \ status report\"\n    python -c \"print('Report complete')\"\n    ;;\nesac\n"
    - name: Audit Log
      if: always()
      run: 'mkdir -p .codex/evidence

        echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"workflow\": \"autonomous-agent\",
        \"mode\": \"${{ github.event.inputs.mode || ''monitor'' }}\", \"status\":
        \"${{ job.status }}\"}" >> .codex/evidence/autonomous_runs.jsonl

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 30
