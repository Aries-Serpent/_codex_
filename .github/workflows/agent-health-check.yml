name: Agent Orchestration Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: agent-health-check
  cancel-in-progress: true

jobs:
  success-rate:
    name: 7-day orchestration success rate (D3 #1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Compute rolling success rate from compliance log
        id: metrics
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          log_path = Path("reports/orchestration/orchestration_compliance.log.md")
          cutoff = datetime.now(timezone.utc) - timedelta(days=7)
          total = success = 0

          if log_path.exists():
              for line in log_path.read_text().splitlines():
                  if "|" not in line or "timestamp" in line.lower():
                      continue
                  parts = [p.strip() for p in line.split("|") if p.strip()]
                  if len(parts) < 4:
                      continue
                  try:
                      ts = datetime.fromisoformat(parts[0].replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if ts < cutoff:
                      continue
                  total += 1
                  if "success" in parts[3].lower():
                      success += 1

          rate = round(success / total * 100, 1) if total else 100.0
          print(f"7-day window: {total} tasks, {success} success → {rate}%")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"rate={rate}\ntotal={total}\nsuccess={success}\n")

          os.makedirs("reports/orchestration", exist_ok=True)
          report = {
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "window_days": 7,
              "total_tasks": total,
              "success_tasks": success,
              "success_rate_pct": rate,
              "threshold_pct": 95.0,
              "gate_passed": rate >= 95.0,
          }
          with open("reports/orchestration/health_latest.json", "w") as f:
              json.dump(report, f, indent=2)
          PYEOF

      - name: Upload health report
        uses: actions/upload-artifact@v5
        with:
          name: agent-health-${{ github.run_id }}
          path: reports/orchestration/health_latest.json

      - name: Evaluate 95% threshold
        env:
          RATE: ${{ steps.metrics.outputs.rate }}
        run: |
          python3 -c "
          import os
          rate = float(os.environ.get('RATE', '100'))
          if rate >= 95.0:
              print(f'::notice::✅ D3 exit criteria #1 met: {rate}% >= 95%')
          else:
              print(f'::warning::D3 success rate {rate}% below 95% threshold')
          "

  ooda-loop-validation:
    name: OODA loop nightly validation (D3 #5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements-dev.txt
      - name: Validate OODA loop components present
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path

          # Verify OODA loop core components are importable and present.
          # required: must exist or job fails.
          # optional: generated at runtime; absence is a warning, not a failure.
          required_checks = [
              ("scripts/cognitive/actions", "monitoring_actions.py"),
              ("scripts/cognitive/sensors", "monitoring_sensor.py"),
              (".codex/config", "monitoring.yaml"),
          ]
          optional_checks = [
              ("reports/orchestration", "orchestration_compliance.log.md"),
          ]
          missing = []
          for directory, fname in required_checks:
              p = Path(directory) / fname
              if not p.exists():
                  missing.append(str(p))
              else:
                  print(f"✅ {p}")

          for directory, fname in optional_checks:
              p = Path(directory) / fname
              if not p.exists():
                  print(f"::warning::Optional OODA artefact absent (generated at runtime): {p}")
              else:
                  print(f"✅ {p}")

          if missing:
              print(f"::warning::OODA components missing: {missing}")
              sys.exit(1)
          else:
              print("::notice::✅ D3 exit criteria #5 met: OODA loop components all present")
          PYEOF
