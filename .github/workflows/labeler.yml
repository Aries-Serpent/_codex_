name: PR Labeler
on:
  pull_request_target:
    branches:
    - 0D_base_
    - copilot/integrate-codex-status-template
    - main
    - master
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/labeler@v7
      with:
        configuration-path: .github/labeler.yml
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow labeler 2>/dev/null
        || echo "Cache health: check skipped"

        '
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: triage
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        ref: ${{ github.sha }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: PR Labeler
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
