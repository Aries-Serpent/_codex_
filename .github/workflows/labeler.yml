name: PR Labeler
on:
  pull_request_target:
    branches: [ "0D_base_", "copilot/integrate-codex-status-template", "main", "master" ]

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
