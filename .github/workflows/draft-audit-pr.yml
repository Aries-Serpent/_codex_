name: draft-audit-pr

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Draft PR title"
        required: true
        default: "Audit artifacts & diffs (auto)"
      base:
        description: "Base branch"
        required: false
        default: "main"

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.11'
          cache-tier: 'common'

