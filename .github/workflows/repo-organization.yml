name: Repository Organization & Cleanup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'analyze'
        type: choice
        options:
          - analyze
          - organize
          - archive
          - full-cleanup
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        default: 'true'
        type: boolean
      archive_older_than_days:
        description: 'Archive files older than N days'
        required: false
        default: '90'
        type: string

permissions:
  contents: write
  pull-requests: write


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  analyze-structure:
    name: Analyze Repository Structure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      root_files: ${{ steps.analyze.outputs.root_files }}
      orphan_files: ${{ steps.analyze.outputs.orphan_files }}
      archive_candidates: ${{ steps.analyze.outputs.archive_candidates }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow repo-organization 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'

      - name: Analyze repository structure
        id: analyze
        run: |
          root_files=$(find . -maxdepth 1 -type f | wc -l)
          orphan_files=$(find . -maxdepth 2 -name "*.py" -not -path "./.venv*" | wc -l)
          archive_candidates=$(find . -maxdepth 2 -name "*.bak" -o -name "*.old" 2>/dev/null | wc -l || echo "0")
          echo "root_files=${root_files}" >> "$GITHUB_OUTPUT"
          echo "orphan_files=${orphan_files}" >> "$GITHUB_OUTPUT"
          echo "archive_candidates=${archive_candidates}" >> "$GITHUB_OUTPUT"
