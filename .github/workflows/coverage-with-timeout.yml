---
name: Coverage with Timeout Guards
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  workflow_dispatch:
    inputs:
      shard_count:
        description: Number of shards for parallel execution
        required: false
        default: '4'
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  coverage-with-timeout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        # Pin pytest plugins (PR  #3248)

        # Pin pytest plugins before package install (PR  #3248 stability fix)

        pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0
        pytest-asyncio==1.3.0

        pip install pytest pytest-cov pytest-timeout pytest-xdist

        pip install -e .

        '
    - name: Configure pytest timeout
      run: '# Create pytest configuration with timeout settings

        cat > pytest_timeout.ini <<EOF

        [pytest]

        timeout = 420  # 7 minutes per test

        timeout_method = thread

        EOF

        echo "Pytest timeout configuration created"

        cat pytest_timeout.ini

        '
    - name: Run coverage with timeout (Shard ${{ matrix.shard }})
      id: coverage
      continue-on-error: true
      run: |
        # Calculate shard parameters
        SHARD_INDEX=${{ matrix.shard }}
        TOTAL_SHARDS=4
    - name: Check for timeouts
      if: steps.coverage.outputs.coverage_failed == 'true'
      run: 'echo '::warning::Coverage collection encountered issues (timeout or test
        failure)'

        echo 'This may indicate slow tests or hanging operations.'

        echo 'Review the test output above for timeout messages.'

        '
    - name: Upload coverage artifact (shard ${{ matrix.shard }})
      if: always()
      uses: actions/upload-artifact@v5
      with:
        path: 'coverage_shard_${{ matrix.shard }}.xml

          htmlcov_shard_${{ matrix.shard }}/

          .coverage

          '
        retention-days: 14
        name: coverage-shard-${{ matrix.shard }}
    - name: Upload timeout logs
      if: steps.coverage.outputs.coverage_failed == 'true'
      uses: actions/upload-artifact@v5
      with:
        path: 'pytest_timeout.ini

          *.log

          '
        retention-days: 14
        name: timeout-logs-shard-${{ matrix.shard }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  merge-coverage:
    needs: coverage-with-timeout
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: always()
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install coverage tools
      run: 'python -m pip install --upgrade pip

        pip install coverage

        '
    - name: Download all coverage artifacts
      uses: actions/download-artifact@v5
      with:
        pattern: coverage-shard-*
        path: coverage-shards
    - name: Merge coverage reports
      id: merge
      continue-on-error: true
      run: |
        # Find all coverage XML files
        COVERAGE_FILES=$(find coverage-shards -name\
    - name: Upload combined coverage
      if: steps.merge.outputs.merge_succeeded == 'true'
      uses: actions/upload-artifact@v5
      with:
        path: 'coverage_combined.xml

          htmlcov_combined/

          '
        retention-days: 30
        name: coverage-combined
    - name: Generate coverage summary
      if: steps.merge.outputs.merge_succeeded == 'true'
      run: "echo \"## Coverage Report Summary\" >> $GITHUB_STEP_SUMMARY\necho \"\"\
        \ >> $GITHUB_STEP_SUMMARY\necho \"Coverage data collected from ${{ strategy.job-total\
        \ }} shards\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
        \nif [ -f coverage_combined.xml ]; then\n  # Extract coverage percentage from\
        \ XML\n  COVERAGE=$(python -c \"\nimport xml.etree.ElementTree as ET\ntree\
        \ = ET.parse('coverage_combined.xml')\nroot = tree.getroot()\nline_rate =\
        \ float(root.attrib.get('line-rate', 0))\nprint(f'{line_rate * 100:.1f}')\n\
        \" 2>/dev/null || echo \"N/A\")\n\n  echo \"**Overall Coverage:** ${COVERAGE}%\"\
        \ >> $GITHUB_STEP_SUMMARY\nelse\n  echo \"**Status:** Coverage data could\
        \ not be merged\" >> $GITHUB_STEP_SUMMARY\nfi\n\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"### Timeout Protection\" >> $GITHUB_STEP_SUMMARY\necho \"- Per-test\
        \ timeout: 7 minutes\" >> $GITHUB_STEP_SUMMARY\necho \"- Job timeout: 30 minutes\"\
        \ >> $GITHUB_STEP_SUMMARY\necho \"- Shard isolation: Enabled\" >> $GITHUB_STEP_SUMMARY\n"
    - name: Report degraded mode
      if: steps.merge.outputs.merge_failed == 'true'
      run: 'echo "## ⚠️ Coverage Collection - Degraded Mode" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "Coverage collection encountered issues, likely due to test timeouts."
        >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Recommendations:**" >> $GITHUB_STEP_SUMMARY

        echo "1. Review timeout logs in artifacts" >> $GITHUB_STEP_SUMMARY

        echo "2. Identify slow or hanging tests" >> $GITHUB_STEP_SUMMARY

        echo "3. Consider splitting slow tests into separate jobs" >> $GITHUB_STEP_SUMMARY

        echo "4. Add explicit timeouts to slow operations" >> $GITHUB_STEP_SUMMARY

        echo "::warning::Coverage collection in degraded mode - partial data available"

        '
  rescue-comment:
    name: Post rescue comment on coverage failure
    runs-on: ubuntu-latest
    needs: coverage-with-timeout
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
        fetch-depth: 1
    - name: Post or update rescue comment
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_NAME: Coverage with Timeout Guards
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
          github.run_id }}
        BRANCH: ${{ github.head_ref }}
      run: python scripts/ci/post_rescue_comment.py
