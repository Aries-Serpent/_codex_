name: Coverage with Timeout Guards

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      shard_count:
        description: 'Number of shards for parallel execution'
        required: false
        default: '4'
        type: string


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  coverage-with-timeout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30  # Global timeout for the entire job

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin pytest plugins (PR #3248)
          # Pin pytest plugins before package install (PR #3248 stability fix)
          pip install pytest==8.4.2 pytest-xdist==3.8.0 pytest-timeout==2.4.0 pytest-cov==5.0.0 pytest-asyncio==1.3.0



          pip install pytest pytest-cov pytest-timeout pytest-xdist
          pip install -e .

      - name: Configure pytest timeout
        run: |
          # Create pytest configuration with timeout settings
          cat > pytest_timeout.ini <<EOF
          [pytest]
          timeout = 420  # 7 minutes per test
          timeout_method = thread
          EOF

          echo "Pytest timeout configuration created"
          cat pytest_timeout.ini

      - name: Run coverage with timeout (Shard ${{ matrix.shard }})
        id: coverage
        continue-on-error: true
        run: |
          # Calculate shard parameters
          SHARD_INDEX=${{ matrix.shard }}
          TOTAL_SHARDS=${{ strategy.job-total }}

          echo "Running shard $SHARD_INDEX of $TOTAL_SHARDS"

          # Run pytest with timeout plugin and coverage
          pytest \
            -c pytest_timeout.ini \
            --timeout=420 \
            --cov=src \
            --cov-report=xml:coverage_shard_${SHARD_INDEX}.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov_shard_${SHARD_INDEX} \
            --dist=loadfile \
            -n auto \
            --durations=10 \
            --shard-id=$((SHARD_INDEX - 1)) \
            --num-shards=${TOTAL_SHARDS} \
            tests/ || echo "coverage_failed=true" >> $GITHUB_OUTPUT

      - name: Check for timeouts
        if: steps.coverage.outputs.coverage_failed == 'true'
        run: |
          echo "::warning::Coverage collection encountered issues (timeout or test failure)"
          echo "This may indicate slow tests or hanging operations."
          echo "Review the test output above for timeout messages."

      - name: Upload coverage artifact (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            coverage_shard_${{ matrix.shard }}.xml
            htmlcov_shard_${{ matrix.shard }}/
            .coverage
          retention-days: 7

      - name: Upload timeout logs
        if: steps.coverage.outputs.coverage_failed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: timeout-logs-shard-${{ matrix.shard }}
          path: |
            pytest_timeout.ini
            *.log
          retention-days: 7

  merge-coverage:
    needs: coverage-with-timeout
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install coverage tools
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Merge coverage reports
        id: merge
        continue-on-error: true
        run: |
          # Find all coverage XML files
          COVERAGE_FILES=$(find coverage-shards -name "coverage_shard_*.xml" | wc -l)
          echo "Found $COVERAGE_FILES coverage files"

          if [ "$COVERAGE_FILES" -eq 0 ]; then
            echo "::error::No coverage files found to merge"
            echo "merge_failed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Combine coverage data
          cd coverage-shards
          coverage combine coverage-shard-*/.coverage || true
          coverage xml -o ../coverage_combined.xml || true
          coverage html -d ../htmlcov_combined || true
          coverage report || true

          cd ..

          if [ -f coverage_combined.xml ]; then
            echo "merge_succeeded=true" >> $GITHUB_OUTPUT
            echo "✓ Coverage merge succeeded"
          else
            echo "merge_failed=true" >> $GITHUB_OUTPUT
            echo "::warning::Coverage merge produced no output"
          fi

      - name: Upload combined coverage
        if: steps.merge.outputs.merge_succeeded == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-combined
          path: |
            coverage_combined.xml
            htmlcov_combined/
          retention-days: 30

      - name: Generate coverage summary
        if: steps.merge.outputs.merge_succeeded == 'true'
        run: |
          echo "## Coverage Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage data collected from ${{ strategy.job-total }} shards" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f coverage_combined.xml ]; then
            # Extract coverage percentage from XML
            COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage_combined.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          print(f'{line_rate * 100:.1f}')
          " 2>/dev/null || echo "N/A")

            echo "**Overall Coverage:** ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Coverage data could not be merged" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Timeout Protection" >> $GITHUB_STEP_SUMMARY
          echo "- Per-test timeout: 7 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- Job timeout: 30 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- Shard isolation: Enabled" >> $GITHUB_STEP_SUMMARY

      - name: Report degraded mode
        if: steps.merge.outputs.merge_failed == 'true'
        run: |
          echo "## ⚠️ Coverage Collection - Degraded Mode" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage collection encountered issues, likely due to test timeouts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Recommendations:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review timeout logs in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Identify slow or hanging tests" >> $GITHUB_STEP_SUMMARY
          echo "3. Consider splitting slow tests into separate jobs" >> $GITHUB_STEP_SUMMARY
          echo "4. Add explicit timeouts to slow operations" >> $GITHUB_STEP_SUMMARY

          echo "::warning::Coverage collection in degraded mode - partial data available"

  # ── rescue comment — posted on PR whenever coverage-with-timeout fails ──────
  rescue-comment:
    name: Post rescue comment on coverage failure
    runs-on: ubuntu-latest
    needs: coverage-with-timeout
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Coverage with Timeout Guards"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-rca:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Identify failing test(s) or timeout(s) from the shard logs\n4. Apply the minimal fix and push\n5. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n6. Verify all CI checks are green before concluding\n\n_Posted by: coverage-with-timeout.yml → rescue-comment job (S220)_

---
_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Please investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
