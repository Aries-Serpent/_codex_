name: CI Checkpoint Validation

# AAIS Compliance task D.5 — added S172 PR #3661
# Validates that key codebase invariants hold on every PR push and on schedule.
# Reports results to GitHub Step Summary.  Triggers ci-health-alert-agent when
# thresholds are breached.

on:
  pull_request:
    branches:
      - main
      - 'copilot/**'
      - '0D_base_'
    paths:
      - 'scripts/ci/**'
      - '.codex/patterns/**'
      - '.github/agents/AGENT_REGISTRY.yaml'
      - 'requirements*.txt'
      - 'requirements/**'
      - 'pyproject.toml'
  push:
    branches:
      - main
  schedule:
    # Run daily at 06:00 UTC — lightweight complement to ci-health-monitor (every 6h)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      fail_on_threshold_breach:
        description: 'Fail workflow when a threshold is breached (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-checkpoint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-checkpoints:
    name: "📋 CI Checkpoint Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install minimal dependencies
        run: |
          pip install pyyaml requests --quiet

      # ── Checkpoint 1: AAIS pattern library coverage ─────────────────────
      - name: "CP-1: Pattern library — verify SELF_HEALING_001 present"
        id: cp1_pattern_library
        run: |
          python3 - <<'PYEOF'
          import yaml, sys
          with open('.codex/patterns/ci_failure_patterns.yaml') as f:
              content = f.read()
          required = ['SELF_HEALING_001', 'DOC_METRICS_001', 'PREFLIGHT_001']
          missing = [p for p in required if p not in content]
          if missing:
              print(f"❌ CP-1 FAIL: missing patterns: {missing}")
              sys.exit(1)
          # Count total patterns
          count = content.count('pattern_id:')
          print(f"✅ CP-1 PASS: {count} patterns in library, required patterns present")
          PYEOF

      # ── Checkpoint 2: AGENT_REGISTRY — packaging-validation-agent registered ─
      - name: "CP-2: AGENT_REGISTRY — packaging-validation-agent registered"
        id: cp2_agent_registry
        run: |
          python3 - <<'PYEOF'
          import sys
          with open('.github/agents/AGENT_REGISTRY.yaml') as f:
              content = f.read()
          checks = {
              'packaging-validation-agent': 'id: packaging-validation-agent',
              'ci-health-alert-agent v1.1.0': "version: 1.1.0",
          }
          all_ok = True
          for label, needle in checks.items():
              if needle in content:
                  print(f"✅ CP-2 PASS: {label} registered")
              else:
                  print(f"❌ CP-2 FAIL: {label} not found (needle: {needle!r})")
                  all_ok = False
          if not all_ok:
              sys.exit(1)
          PYEOF

      # ── Checkpoint 3: requirements files — no known-vulnerable NLTK ─────
      - name: "CP-3: Requirements — NLTK >= 3.9.4 in all lock files"
        id: cp3_nltk_version
        run: |
          python3 - <<'PYEOF'
          import re, sys
          from pathlib import Path

          LOCK_FILES = [
              'requirements/lock.txt',
              'requirements/lock-eval.txt',
              'requirements-eval.txt',
          ]
          VULNERABLE = re.compile(r'nltk==3\.9\.[0-3]\b', re.I)
          MINIMUM_OK  = re.compile(r'nltk==3\.9\.([4-9]|\d{2})', re.I)
          all_ok = True
          for path in LOCK_FILES:
              p = Path(path)
              if not p.exists():
                  print(f"⚠️  CP-3 SKIP: {path} not found")
                  continue
              content = p.read_text()
              vuln_match = VULNERABLE.search(content)
              ok_match   = MINIMUM_OK.search(content)
              if vuln_match:
                  print(f"❌ CP-3 FAIL: {path} contains vulnerable {vuln_match.group()}")
                  all_ok = False
              elif ok_match:
                  print(f"✅ CP-3 PASS: {path} has {ok_match.group()}")
              else:
                  print(f"⚠️  CP-3 SKIP: {path} — nltk not pinned (may be absent from this lock)")
          if not all_ok:
              sys.exit(1)
          PYEOF

      # ── Checkpoint 4: iterative-self-healing-ci.yml — venv recreation ───
      - name: "CP-4: iterative-self-healing-ci.yml uses venv recreation (not system pip fallback)"
        id: cp4_venv_recreation
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path

          wf = Path('.github/workflows/iterative-self-healing-ci.yml').read_text()
          # Correct pattern: recreate venv
          if 'python3 -m venv .venv_ci' not in wf:
              print("❌ CP-4 FAIL: iterative-self-healing-ci.yml missing 'python3 -m venv .venv_ci'")
              sys.exit(1)
          # Incorrect pattern: global pip fallback (should NOT be present)
          if '|| pip install' in wf:
              print("❌ CP-4 FAIL: iterative-self-healing-ci.yml still has '|| pip install' system-pip fallback")
              sys.exit(1)
          print("✅ CP-4 PASS: venv recreation pattern found, no system-pip fallback")
          PYEOF

      # ── Checkpoint 5: AAIS scorer — honest calibration gates present ────
      - name: "CP-5: AAIS scorer — honest calibration gates present"
        id: cp5_aais_scorer
        run: |
          python3 - <<'PYEOF'
          import sys
          from pathlib import Path

          scorer = Path('scripts/ci/aais_v4_scorer.py').read_text()
          checks = {
              'CODEX_OPEN_CRITICAL_ALERTS env var': 'CODEX_OPEN_CRITICAL_ALERTS',
              'CODEX_CI_FAILURE_RATE env var': 'CODEX_CI_FAILURE_RATE',
              'max(0, int(...)) clamp': 'max(0, int(',
              'max(0.0, float(...)) clamp': 'max(0.0, float(',
          }
          all_ok = True
          for label, needle in checks.items():
              if needle in scorer:
                  print(f"✅ CP-5 PASS: {label}")
              else:
                  print(f"❌ CP-5 FAIL: {label} not found")
                  all_ok = False
          if not all_ok:
              sys.exit(1)
          PYEOF

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          {
            echo "## 📋 CI Checkpoint Validation Results"
            echo ""
            echo "| Checkpoint | Status |"
            echo "|-----------|--------|"
            echo "| CP-1: Pattern library (SELF_HEALING_001 + 2 more) | ${{ steps.cp1_pattern_library.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| CP-2: AGENT_REGISTRY (packaging-validation-agent) | ${{ steps.cp2_agent_registry.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| CP-3: NLTK ≥ 3.9.4 in all lock files | ${{ steps.cp3_nltk_version.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| CP-4: venv recreation (not system-pip fallback) | ${{ steps.cp4_venv_recreation.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| CP-5: AAIS scorer honest calibration gates | ${{ steps.cp5_aais_scorer.outcome == 'success' && '✅ PASS' || '❌ FAIL' }} |"
            echo ""
            echo "> Generated by \`ci-checkpoint-validation.yml\` (S172 AAIS Compliance task D.5)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if threshold breach and fail_on_threshold_breach=true
        if: >
          inputs.fail_on_threshold_breach == 'true' &&
          (
            steps.cp1_pattern_library.outcome == 'failure' ||
            steps.cp2_agent_registry.outcome == 'failure' ||
            steps.cp3_nltk_version.outcome == 'failure' ||
            steps.cp4_venv_recreation.outcome == 'failure' ||
            steps.cp5_aais_scorer.outcome == 'failure'
          )
        run: |
          echo "❌ One or more checkpoints failed and fail_on_threshold_breach=true"
          exit 1

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: validate-checkpoints
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "CI Checkpoint Validation"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: python scripts/ci/post_rescue_comment.py
