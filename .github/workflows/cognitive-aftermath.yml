name: Cognitive AfterMath Evaluator

on:
  workflow_run:
    workflows: ["Cognitive Action Executor"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      evaluation_mode:
        description: 'Evaluation mode (quick|full|deep)'
        required: false
        default: 'full'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  aftermath_evaluator:
    name: Evaluate Outcomes and Learn
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: 3.11
          cache-tier: 'common'
