name: Auto-Fix Common CI Issues

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only check for issues (do not fix)'
        required: false
        type: boolean
        default: false
      pattern:
        description: 'Specific pattern to run (1-8, or leave empty for all)'
        required: false
        type: choice
        options:
          - 'all'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'

  # Run on PR to detect issues early
  pull_request:
    paths:
      - 'tests/**/*.py'
      - 'src/**/*.py'
      - '.github/workflows/*.yml'

# Allow one concurrent run per PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-fix:
    name: Detect and Fix Common Issues
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write  # Need write to push fixes
      pull-requests: write  # Need write to comment on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better analysis
          # Fall back to the built-in GITHUB_TOKEN when neither repo secret is
          # set (e.g. forks, new installations).  GITHUB_TOKEN always has
          # contents:write on the owner's own repos so the push step below still
          # works; on forks the push will be skipped by the if-condition anyway.
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}

      - name: CacheManager health check
        continue-on-error: true
        run: |
          python scripts/ci/generate_cache_keys.py --health --workflow auto-fix-common-issues 2>/dev/null || echo "Cache health: check skipped"
      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: common
          cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyyaml

      - name: Run auto-fix script (check mode)
        id: check
        run: |
          python scripts/ci/auto_fix_common_issues.py --check-only
        continue-on-error: true

      - name: Apply fixes (if not check-only)
        if: |
          steps.check.outcome == 'failure' &&
          github.event_name == 'workflow_dispatch' &&
          !inputs.check_only
        run: |
          python scripts/ci/auto_fix_common_issues.py

      - name: Commit and push fixes
        # Only push when: (a) fixes are available, (b) triggered manually,
        # (c) not in check-only mode.  The workflow_dispatch trigger already
        # guarantees this only runs from the Actions UI (not on forks or PRs).
        if: |
          steps.check.outcome == 'failure' &&
          github.event_name == 'workflow_dispatch' &&
          !inputs.check_only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(ci): auto-fix common CI issues

          Applied automatic fixes for:
          - Unused imports (ruff F401)
          - Coverage threshold alignment (70%)
          - YAML validation

          Generated by: .github/workflows/auto-fix-common-issues.yml"

            git push
          fi

      # Serialise rescue comments across all workflows on the same PR
      # to prevent simultaneous creation races (RCP-01).
      - name: Comment on PR (if auto-fixable issues found)
        if: |
          github.event_name == 'pull_request' &&
          steps.check.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const MARKER = '<!-- auto-fix-ci-issues -->';
            const message = `${MARKER}\n## ❌ Auto-Fixable CI Issues Detected

            The auto-fix script detected issues that can be automatically fixed:

            | Pattern | Description | Auto-Fix | Causes CI Failure |
            |---------|-------------|----------|-------------------|
            | 1 | Unused imports | ✅ Yes (ruff) | ✅ Yes |
            | 4 | Coverage thresholds | ✅ Yes | ✅ Yes |
            | 8 | CodeQL alerts | ✅ Yes (ruff) | ✅ Yes |

            ### Informational Warnings (Do NOT cause CI failure):

            | Pattern | Description | Auto-Fix |
            |---------|-------------|----------|
            | 2 | Unused variables | ⚠️ Manual review |
            | 3 | YAML indentation | ⚠️ Manual review |
            | 5 | Tokenizer fallbacks | ⚠️ Manual review |
            | 6 | Test assertions | ⚠️ Manual review |
            | 7 | Redundant imports | ⚠️ Manual review |

            ### To apply automatic fixes:

            \`\`\`bash
            # Locally
            python scripts/ci/auto_fix_common_issues.py

            # Via workflow
            # Go to Actions > Auto-Fix Common CI Issues > Run workflow
            \`\`\`

            **Note:** Manual review patterns are informational only and do not cause CI failures.

            See the workflow logs for details.

            _[🔗 Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: message,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner, repo: context.repo.repo,
                body: message,
              });
            }

      - name: Fail if auto-fixable issues found (PR only)
        if: |
          github.event_name == 'pull_request' &&
          steps.check.outcome == 'failure'
        run: |
          echo "❌ Auto-fixable CI issues detected. Run auto-fix script to resolve."
          echo "ℹ️  Manual review warnings do not cause CI failure."
          exit 1

  # ── rescue comment — posted on PR whenever this workflow fails ──────────
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: auto-fix
    if: |
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post or append @copilot rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Auto-Fix Common Issues"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; pr_number=int(os.environ["PR_NUMBER"])
          repo=os.environ["REPO"]; commit_sha=os.environ["COMMIT_SHA"]
          run_id=os.environ["RUN_ID"]; run_url=os.environ["RUN_URL"]
          workflow=os.environ["WORKFLOW_NAME"]; branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue:{pr_number}:run-{run_id} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          rescue_body=f"""## 🚨 CI Rescue — Root Cause Analysis\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** check is failing on commit `{sha_short}`.\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n> **Note:** This comment is dedicated to Run ID `{run_id}`. Additional failures within the same run are appended below. A new push creates a new comment for the new run.\n\n_Posted by: auto-fix-common-issues.yml → rescue-comment job (S266)_\n\n_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments) < 100: break
            page+=1
          if existing_id:
            append_section=f"\n\n---\n\n### 🔄 Additional Failure — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` also failed in run `{run_id}`. See [run #{run_id}]({run_url}) for details."
            updated=(existing_body.rstrip()+append_section)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id} (run {run_id})")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted new rescue comment for run {run_id}: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
