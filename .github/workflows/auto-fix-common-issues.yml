name: Auto-Fix Common CI Issues
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Only check for issues (do not fix)
        required: false
        type: boolean
        default: false
      pattern:
        description: Specific pattern to run (1-8, or leave empty for all)
        required: false
        type: choice
        options:
        - all
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        - '7'
        - '8'
  pull_request:
    paths:
    - tests/**/*.py
    - src/**/*.py
    - .github/workflows/*.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  auto-fix:
    if: ${{ github.event.pull_request.number != 5328 }}
    name: Detect and Fix Common Issues
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
    - name: CacheManager health check
      continue-on-error: true
      run: 'python scripts/ci/generate_cache_keys.py --health --workflow auto-fix-common-issues
        2>/dev/null || echo "Cache health: check skipped"

        '
    - name: Set up Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v2' }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install ruff pyyaml

        '
    - name: Run auto-fix script (check mode)
      id: check
      run: 'python scripts/ci/auto_fix_common_issues.py --check-only

        '
      continue-on-error: true
    - name: Apply fixes (if not check-only)
      if: 'steps.check.outcome == ''failure'' &&

        github.event_name == ''workflow_dispatch'' &&

        !inputs.check_only

        '
      run: 'python scripts/ci/auto_fix_common_issues.py

        '
    - name: Commit and push fixes
      if: 'steps.check.outcome == ''failure'' &&

        github.event_name == ''workflow_dispatch'' &&

        !inputs.check_only

        '
      run: 'git config user.name \"github-actions[bot]\"

        git config user.email \"

        '
    - name: Comment on PR (if auto-fixable issues found)
      if: 'github.event_name == ''pull_request'' &&

        steps.check.outcome == ''failure''

        '
      uses: actions/github-script@v8
      with:
        script: "const MARKER = '<!-- auto-fix-ci-issues -->';\nconst message = `${MARKER}\\\
          \ n## \u274C Auto-Fixable CI Issues Detected\n\nThe auto-fix script detected\
          \ issues  that can be automatically fixed:\n\n| Pattern | Description |\
          \ Auto-Fix  | Causes CI Failure |\n|---------|-------------|----------|-------------------|\n\
          \ | 1 | Unused imports | \u2705 Yes (ruff) | \u2705 Yes |\n| 4 | Coverage\
          \ thresholds  | \u2705 Yes | \u2705 Yes |\n| 8 | CodeQL alerts | \u2705\
          \ Yes (ruff) | \u2705 Yes |\n\n###  Informational Warnings (Do NOT cause\
          \ CI failure):\n\n| Pattern | Description  | Auto-Fix |\n|---------|-------------|----------|\n\
          | 2 | Unused variables  | \u26A0\uFE0F Manual review |\n| 3 | YAML indentation\
          \ | \u26A0\uFE0F Manual review |\n| 5  | Tokenizer fallbacks | \u26A0\uFE0F\
          \ Manual review |\n| 6 | Test assertions | \u26A0\uFE0F  Manual review |\n\
          | 7 | Redundant imports | \u26A0\uFE0F Manual review |\n\n### To  apply\
          \ automatic fixes:\n\n\\`\\`\\`bash\n# Locally\npython scripts/ci/auto_fix_common_issues.py\n\
          \ \n# Via workflow\n# Go to Actions > Auto-Fix Common CI Issues > Run workflow\n\
          \ \\`\\`\\`\n\n**Note:** Manual review patterns are informational only and\
          \  do not cause CI failures.\n\nSee the workflow logs for details.\n\n_[\U0001F517\
          \  Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;\n\
          \ \nconst { data: comments } = await github.rest.issues.listComments({\n\
          \  owner: context.repo.owner, repo: context.repo.repo,\n  issue_number:\
          \ context.issue.number,  per_page: 100,\n});\nconst existing = comments.find(c\
          \ => c.body && c.body.includes(MARKER));\n if (existing) {\n  await github.rest.issues.updateComment({\n\
          \    owner:  context.repo.owner, repo: context.repo.repo,\n    comment_id:\
          \ existing.id,  body: message,\n  });\n} else {\n  await github.rest.issues.createComment({\n\
          \     issue_number: context.issue.number,\n    owner: context.repo.owner,\
          \  repo: context.repo.repo,\n    body: message,\n  });\n}\n"
    - name: "Apply and push fixes on PR (Detect\u2192Heal\u2192Commit)"
      id: pr_heal
      if: 'github.event_name == ''pull_request'' &&

        github.event.pull_request.head.repo.full_name == github.repository &&

        steps.check.outcome == ''failure'' &&

        !startsWith(github.head_ref, ''copilot/'')

        '
      env:
        GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        TARGET_BRANCH: ${{ github.head_ref }}
      run: 'git config user.name \"github-actions[bot]\"

        git config user.email \"

        '
    - name: Re-check after heal (fail only if manual issues remain)
      if: 'github.event_name == ''pull_request'' &&

        steps.check.outcome == ''failure''

        '
      id: recheck
      run: 'python scripts/ci/auto_fix_common_issues.py --check-only

        '
      continue-on-error: true
    - name: Fail if un-healable issues remain (PR only)
      if: 'github.event_name == ''pull_request'' &&

        steps.recheck.outcome == ''failure'' &&

        steps.pr_heal.outputs.healed != ''true'' &&

        !startsWith(github.head_ref, ''copilot/'')

        '
      run: "echo \"\u274C Manual-review CI issues remain after auto-fix. See PR comment\
        \ for remediation steps.\"\necho \"\u2139\uFE0F  All auto-fixable issues have\
        \ been applied. Only manual-review items remain.\"\nexit 1\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
  rescue-comment:
    name: Post rescue comment on failure
    runs-on: ubuntu-latest
    needs: auto-fix
    if: 'failure() &&

      github.event_name == ''pull_request'' &&

      github.event.pull_request.head.repo.full_name == github.repository

      '
    permissions:
      pull-requests: write
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        persist-credentials: false
        token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
          }}
        fetch-depth: 1
    - name: Post or update rescue comment
      run: python scripts/ci/post_rescue_comment.py
    timeout-minutes: 30
