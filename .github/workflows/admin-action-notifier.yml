name: Admin Action Notifier (Reusable)
on:
  workflow_call:
    inputs:
      gap_id:
        description: Short gap identifier (e.g. T-03, SEC-01)
        required: true
        type: string
      probe_url:
        description: Full GitHub API URL to probe (GET). Uses CODEX_MASTER_KEY.
        required: true
        type: string
      expected_ok_status:
        description: 'HTTP status code that means the gap is CLOSED (default: 200)'
        required: false
        type: string
        default: '200'
      issue_title:
        description: GitHub issue title (must uniquely identify this gap)
        required: true
        type: string
      issue_body_md:
        description: Full Markdown body for the GitHub issue (problem description
          + fix steps)
        required: true
        type: string
      issue_label:
        description: Label to attach to the issue
        required: false
        type: string
        default: admin-action-required
      assignee:
        description: GitHub login to assign the issue to
        required: false
        type: string
        default: mbaetiong
    outputs:
      scope_ok:
        description: true if probe returned expected status, false if gap still open,
          unknown if inconclusive
        value: ${{ jobs.probe-and-notify.outputs.scope_ok }}
      issue_number:
        description: GitHub issue number created/updated (empty if none)
        value: ${{ jobs.probe-and-notify.outputs.issue_number }}
permissions:
  contents: read
  issues: write
  security-events: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  probe-and-notify:
    name: "Probe ${{ inputs.gap_id }} \u2014 ${{ inputs.issue_title }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope_ok: ${{ steps.probe.outputs.scope_ok }}
      issue_number: ${{ steps.notify.outputs.issue_number }}
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
      REPO: ${{ github.repository }}
    steps:
    - name: Mask secrets
      run: 'echo "::add-mask::$(echo $GH_TOKEN | head -c 10)"

        '
    - name: Probe ${{ inputs.gap_id }} endpoint
      id: probe
      env:
        PROBE_URL: ${{ inputs.probe_url }}
        EXPECTED_OK: ${{ inputs.expected_ok_status }}
      run: "HTTP_STATUS=$(curl -s -o \"${RUNNER_TEMP}/admin_probe_response.json\"\
        \ -w \"%{http_code}\" \\\n  -H \"Authorization: Bearer ${GH_TOKEN}\" \\\n\
        \  -H \"Accept: application/vnd.github+json\" \\\n  -H \"X-GitHub-Api-Version:\
        \ 2022-11-28\" \\\n  \"${PROBE_URL}\")\n\necho \"HTTP_STATUS=${HTTP_STATUS}\"\
        \ >> \"$GITHUB_ENV\"\necho \"http_status=${HTTP_STATUS}\"  >> \"$GITHUB_OUTPUT\"\
        \n\nRESPONSE_FILE=\"${RUNNER_TEMP}/admin_probe_response.json\"\nexport RESPONSE_FILE\
        \  # must be exported so the Python subprocess can read os.environ\nRESPONSE_MSG=$(python3\
        \ -c \\\n  \"import json,sys,os; d=json.load(open(os.environ['RESPONSE_FILE']));\
        \ print(d.get('message','(no message)'))\" \\\n  2>/dev/null || echo \"(no\
        \ message)\")\necho \"RESPONSE_MSG=${RESPONSE_MSG}\" >> \"$GITHUB_ENV\"\n\
        echo \"response_msg=${RESPONSE_MSG}\"  >> \"$GITHUB_OUTPUT\"\n\nif [ \"${HTTP_STATUS}\"\
        \ = \"${EXPECTED_OK}\" ]; then\n  echo \"scope_ok=true\"    >> \"$GITHUB_OUTPUT\"\
        \n  echo \"\u2705 ${{ inputs.gap_id }} CLOSED \u2014 HTTP ${HTTP_STATUS} (expected\
        \ ${EXPECTED_OK})\"\nelif [ \"${HTTP_STATUS}\" = \"403\" ] || [ \"${HTTP_STATUS}\"\
        \ = \"401\" ]; then\n  echo \"scope_ok=false\"   >> \"$GITHUB_OUTPUT\"\n \
        \ echo \"\u26A0\uFE0F  ${{ inputs.gap_id }} OPEN \u2014 HTTP ${HTTP_STATUS}:\
        \ ${RESPONSE_MSG}\"\nelse\n  echo \"scope_ok=unknown\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"\u2139\uFE0F  ${{ inputs.gap_id }} INCONCLUSIVE \u2014 HTTP ${HTTP_STATUS}:\
        \ ${RESPONSE_MSG}\"\nfi\n"
    - name: Create or update issue for ${{ inputs.gap_id }}
      id: notify
      if: steps.probe.outputs.scope_ok == 'false'
      uses: actions/github-script@v8
      env:
        GAP_ID: ${{ inputs.gap_id }}
        ISSUE_TITLE: ${{ inputs.issue_title }}
        ISSUE_BODY: ${{ inputs.issue_body_md }}
        ISSUE_LABEL: ${{ inputs.issue_label }}
        ASSIGNEE: ${{ inputs.assignee }}
        HTTP_STATUS: ${{ env.HTTP_STATUS }}
        RESPONSE_MSG: ${{ env.RESPONSE_MSG }}
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const { owner, repo } = context.repo;\nconst title  = process.env.ISSUE_TITLE;\n\
          const label  = process.env.ISSUE_LABEL;\nconst body   = [\n  process.env.ISSUE_BODY,\n\
          \  '',\n  '---',\n  `_Auto-managed by \\`admin-action-notifier.yml\\` \xB7\
          \ Gap: \\`${process.env.GAP_ID}\\` \xB7 Probe: HTTP \\`${process.env.HTTP_STATUS}\\\
          ` \u2014 ${process.env.RESPONSE_MSG}_`,\n  `_Last checked: ${new Date().toISOString()}_`,\n\
          ].join('\\n');\n\n// Ensure label exists\ntry {\n  await github.rest.issues.createLabel({\n\
          \    owner, repo,\n    name: label,\n    color: 'e11d48',\n    description:\
          \ 'Requires manual admin action to unblock CI automation',\n  });\n} catch\
          \ (_) { /* label already exists \u2014 ignore */ }\n\n// Find existing open\
          \ issue for this gap\nlet existing = null;\nconst open = await github.rest.issues.listForRepo({\n\
          \  owner, repo, state: 'open', labels: label, per_page: 50,\n});\nexisting\
          \ = open.data.find(i => i.title === title);\n\nlet issueNum;\nif (existing)\
          \ {\n  await github.rest.issues.update({ owner, repo, issue_number: existing.number,\
          \ body });\n  issueNum = existing.number;\n  core.info(`\u21A9\uFE0F  Updated\
          \ existing issue  #${issueNum} for ${process.env.GAP_ID}`);\n} else {\n\
          \  const created = await github.rest.issues.create({\n    owner, repo, title,\
          \ body,\n    labels:    [label],\n    assignees: [process.env.ASSIGNEE],\n\
          \  });\n  issueNum = created.data.number;\n  core.info(`\u2705 Created issue\
          \  #${issueNum}: ${created.data.html_url}`);\n  core.notice(`Admin action\
          \ required (${process.env.GAP_ID}) \u2014 see issue  #${issueNum}`);\n}\n\
          core.setOutput('issue_number', String(issueNum));\n"
    - name: Auto-close issue for ${{ inputs.gap_id }} (gap resolved)
      if: steps.probe.outputs.scope_ok == 'true'
      uses: actions/github-script@v8
      env:
        ISSUE_TITLE: ${{ inputs.issue_title }}
        ISSUE_LABEL: ${{ inputs.issue_label }}
        GAP_ID: ${{ inputs.gap_id }}
      with:
        github-token: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY ||
          github.token }}
        script: "const { owner, repo } = context.repo;\nconst open = await github.rest.issues.listForRepo({\n\
          \  owner, repo, state: 'open', labels: process.env.ISSUE_LABEL, per_page:\
          \ 50,\n});\nconst existing = open.data.find(i => i.title === process.env.ISSUE_TITLE);\n\
          if (existing) {\n  await github.rest.issues.createComment({\n    owner,\
          \ repo, issue_number: existing.number,\n    body: [\n      `## \u2705 ${process.env.GAP_ID}\
          \ Gap Closed`,\n      '',\n      `Probe returned expected HTTP status \u2014\
          \ the admin action has been completed.`,\n      '',\n      `_Auto-resolved\
          \ by \\`admin-action-notifier.yml\\` at ${new Date().toISOString()}_`,\n\
          \    ].join('\\n'),\n  });\n  await github.rest.issues.update({\n    owner,\
          \ repo, issue_number: existing.number,\n    state: 'closed', state_reason:\
          \ 'completed',\n  });\n  core.info(`\u2705 Auto-closed issue  #${existing.number}\
          \ for ${process.env.GAP_ID}`);\n} else {\n  core.info(`\u2139\uFE0F  No\
          \ open ${process.env.GAP_ID} issue found \u2014 nothing to close`);\n}\n"
    - name: Step summary
      if: always()
      env:
        GAP_ID: ${{ inputs.gap_id }}
        SCOPE_OK: ${{ steps.probe.outputs.scope_ok }}
        ISSUE_NUM: ${{ steps.notify.outputs.issue_number }}
        HTTP_STATUS: ${{ steps.probe.outputs.http_status }}
        EXPECTED_OK: ${{ inputs.expected_ok_status }}
        RESPONSE_MSG: ${{ steps.probe.outputs.response_msg }}
      run: "{\n  echo \"## \U0001F510 Admin Action Gate \u2014 \\`${GAP_ID}\\`\"\n\
        \  echo \"\"\n  echo \"| Field | Value |\"\n  echo \"|-------|-------|\"\n\
        \  echo \"| Gap ID | \\`${GAP_ID}\\` |\"\n  echo \"| Probe HTTP status | \\\
        `${HTTP_STATUS}\\` |\"\n  echo \"| Expected status | \\`${EXPECTED_OK}\\`\
        \ |\"\n  echo \"| Gap status | \\`${SCOPE_OK}\\` |\"\n  [ -n \"${ISSUE_NUM}\"\
        \ ] && echo \"| Issue |  #${ISSUE_NUM} |\"\n  echo \"\"\n  case \"${SCOPE_OK}\"\
        \ in\n    true)    echo \"### \u2705 Gap CLOSED \u2014 probe returned expected\
        \ status (HTTP ${EXPECTED_OK})\" ;;\n    false)   echo \"### \u26A0\uFE0F\
        \ Gap OPEN \u2014 admin action required (HTTP ${HTTP_STATUS} instead of ${EXPECTED_OK})\"\
        \n              echo \"\"\n              echo \"**Error Details:** \\`${RESPONSE_MSG}\\\
        `\"\n              [ -n \"${ISSUE_NUM}\" ] && echo \"**Fix Steps:** See issue\
        \  #${ISSUE_NUM} for click-by-click instructions\"\n              ;;\n   \
        \ unknown) echo \"### \u2139\uFE0F Inconclusive probe \u2014 unexpected HTTP\
        \ ${HTTP_STATUS}\"\n              echo \"\"\n              echo \"**Error\
        \ Details:** \\`${RESPONSE_MSG}\\`\"\n              echo \"**Action:** Check\
        \ workflow logs for details, or run workflow again\"\n              ;;\n \
        \ esac\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
