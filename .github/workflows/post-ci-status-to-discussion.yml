name: "🧠 Post CI Status to Discussions"

# Posts a tokenized Cognitive-Brain continuation chain and CI pattern summary
# to https://github.com/Aries-Serpent/_codex_/discussions on every push to
# the active development branches, and on any PR merge to main.
#
# Three discussion targets:
#   #3673 — Accountability Report (existing thread, upserted each session)
#   Auto-create — CI Pattern Summary (new comment per push with cross-PR data)
#   Auto-create — Continuation Chain (new comment per push for next-session pickup)
#
# Policy: PRIORITY 0 — feeds the cognitive brain search/scan loop
# Discussion: https://github.com/Aries-Serpent/_codex_/discussions

on:
  push:
    branches:
      - "copilot/**"
      - "0D_base_"
    paths:
      - "scripts/ci/pattern_recorder.py"
      - "scripts/cognitive/**"
      - "CODEX_MANIFEST.json"
      - "docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md"
      - ".codex/docs/COGNITIVE_BRAIN_STATUS_*.md"
  workflow_dispatch:
    inputs:
      discussion_number:
        description: "Discussion number to post to (default: 3673)"
        required: false
        default: "3673"
      upsert:
        description: "Upsert existing comment instead of creating new one"
        required: false
        default: "true"
        type: boolean
      post_continuation:
        description: "Post continuation chain"
        required: false
        default: "true"
        type: boolean
      post_pattern_summary:
        description: "Post CI pattern summary"
        required: false
        default: "true"
        type: boolean

concurrency:
  group: post-ci-status-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  discussions: write
  pull-requests: read

env:
  DISCUSSION_NUMBER: ${{ github.event.inputs.discussion_number || '3673' }}
  REPO: ${{ github.repository }}

jobs:
  post-ci-status:
    name: "🧠 Post CI Status to Discussion #${{ github.event.inputs.discussion_number || '3673' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          # Install project in editable mode for mcp_poster imports
          pip install --quiet -e ".[test]" 2>/dev/null || pip install --quiet -e "." 2>/dev/null || true

      # -----------------------------------------------------------------------
      # Step 1: Build the tokenized continuation chain
      # -----------------------------------------------------------------------
      - name: Build continuation chain
        id: build_chain
        if: ${{ github.event.inputs.post_continuation != 'false' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          COPILOT_SESSION_ID: ${{ github.run_id }}
        run: |
          python scripts/cognitive/continuation_chain.py \
            --manifest CODEX_MANIFEST.json \
            --sha "$GITHUB_SHA" \
            --session-id "$GITHUB_RUN_ID" \
            --output /tmp/continuation_chain.md
          echo "chain_path=/tmp/continuation_chain.md" >> "$GITHUB_OUTPUT"
          echo "✅ Continuation chain built ($(wc -l < /tmp/continuation_chain.md) lines)"

      # -----------------------------------------------------------------------
      # Step 2: Post continuation chain to Discussion
      # -----------------------------------------------------------------------
      - name: Post continuation chain to Discussion
        if: >
          steps.build_chain.outcome == 'success' &&
          github.event.inputs.post_continuation != 'false'
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        run: |
          UPSERT="${{ github.event.inputs.upsert || 'true' }}"
          UPSERT_FLAG=""
          if [ "$UPSERT" = "true" ]; then
            UPSERT_FLAG="--upsert"
          fi
          python scripts/cognitive/continuation_chain.py \
            --manifest CODEX_MANIFEST.json \
            --sha "${{ github.sha }}" \
            --session-id "${{ github.run_id }}" \
            --post-to-discussion \
            --repo "$REPO" \
            --discussion-number "$DISCUSSION_NUMBER" \
            $UPSERT_FLAG \
          && echo "✅ Continuation chain posted to discussion #$DISCUSSION_NUMBER" \
          || echo "⚠️ Continuation chain post failed (token permissions?)"

      # -----------------------------------------------------------------------
      # Step 3: Build CI pattern summary (if pattern DB exists)
      # -----------------------------------------------------------------------
      - name: Build CI pattern summary
        id: build_summary
        if: ${{ github.event.inputs.post_pattern_summary != 'false' }}
        env:
          CODEX_DB_PATH: ${{ runner.temp }}/codex_patterns.db
        run: |
          # If there's no existing DB, skip gracefully
          python - <<'PYEOF'
          import os, sys, importlib.util, json
          from pathlib import Path

          db_path = os.environ.get("CODEX_DB_PATH", "")
          if not db_path or not Path(db_path).exists():
              print("ℹ️  No pattern DB found at CODEX_DB_PATH — generating stub summary")
              summary = """## CI Pattern Summary\n\n_No pattern DB available for this run._\n\n"""
              summary += "The pattern DB is populated by `pattern_recorder.py record` during CI.\n"
              Path("/tmp/pattern_summary.md").write_text(summary)
              sys.exit(0)

          # Load recorder
          spec = importlib.util.spec_from_file_location(
              "pr", Path("scripts/ci/pattern_recorder.py")
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          conn = mod._open_db(db_path)
          try:
              high_rec = mod.high_recurrence(conn)
              cross_pr = mod.cross_pr_correlation(conn, min_prs=2)
              trend = mod.pattern_trend(conn, days=7)
          finally:
              conn.close()

          total_7d = sum(r.get("count", 0) for r in trend)
          lines = [
              "## 🔴 CI Pattern Summary",
              "",
              f"**7-day occurrences:** {total_7d}",
              "",
          ]

          if high_rec:
              lines += [
                  "### High-Recurrence Patterns",
                  "| Pattern | Total | Fix% |",
                  "|---------|-------|------|",
              ]
              for r in high_rec[:10]:
                  lines.append(
                      f"| {r['pattern_name']} | {r['total']} | {r['fix_rate']*100:.0f}% |"
                  )

          if cross_pr:
              lines += [
                  "",
                  "### Cross-PR Recurring Patterns",
                  "| Pattern | PRs | Total |",
                  "|---------|-----|-------|",
              ]
              for r in cross_pr[:10]:
                  lines.append(f"| {r['pattern_name']} | {r['pr_count']} | {r['total']} |")

          Path("/tmp/pattern_summary.md").write_text("\n".join(lines))
          print(f"✅ Pattern summary built ({len(high_rec)} high-rec, {len(cross_pr)} cross-PR)")
          PYEOF

      # -----------------------------------------------------------------------
      # Step 4: Post CI pattern summary to Discussion (upsert by run ID marker)
      # -----------------------------------------------------------------------
      - name: Post CI pattern summary to Discussion
        if: >
          steps.build_summary.outcome == 'success' &&
          github.event.inputs.post_pattern_summary != 'false'
        env:
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
        run: |
          python -m codex.github.mcp_poster post-ci-pattern-summary \
            --repo "$REPO" \
            --number "$DISCUSSION_NUMBER" \
            --body-file /tmp/pattern_summary.md \
            --session-id "run-${{ github.run_id }}" \
          && echo "✅ Pattern summary posted to discussion #$DISCUSSION_NUMBER" \
          || echo "⚠️ Pattern summary post failed (token permissions?)"

      # -----------------------------------------------------------------------
      # Step 5: Emit GitHub Actions step summary
      # -----------------------------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## 🧠 CI Status → Discussions

          | Step | Status |
          |------|--------|
          | Build continuation chain | ${{ steps.build_chain.outcome || 'skipped' }} |
          | Build CI pattern summary | ${{ steps.build_summary.outcome || 'skipped' }} |

          **Discussion:** https://github.com/${{ github.repository }}/discussions/${{ env.DISCUSSION_NUMBER }}

          > Posts are idempotent — each run upserts by session marker to avoid thread spam.
          SUMMARY

  rescue-comment-push:
    name: Post rescue comment on push failure
    runs-on: ubuntu-latest
    needs: post-ci-status
    if: failure() && github.event_name == 'push'
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post @copilot rescue comment to associated PR
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Post CI Status to Discussion"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; repo=os.environ["REPO"]
          commit_sha=os.environ["COMMIT_SHA"]; run_id=os.environ["RUN_ID"]
          run_url=os.environ["RUN_URL"]; workflow=os.environ["WORKFLOW_NAME"]
          branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-push:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          owner=repo.split("/")[0]
          _,prs=gh("GET",f"/repos/{repo}/pulls?state=open&head={owner}:{branch}&per_page=10")
          if not prs or not isinstance(prs,list):
            print(f"No open PR for branch {branch} — skipping rescue comment"); sys.exit(0)
          pr_number=prs[0]["number"]
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** workflow failed on push to `{branch}` (commit `{sha_short}`).\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: rescue-comment-push job (S237)_\n\n_[🔗 Workflow run]({run_url})_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments)<100: break
            page+=1
          if existing_id:
            append=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
