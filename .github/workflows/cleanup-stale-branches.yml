name: Cleanup Stale Self-Heal Branches
'on':
  schedule:
  - cron: 0 3 * * 0
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run \u2014 show what would be deleted without deleting"
        required: false
        type: boolean
        default: false
      prefix:
        description: 'Branch prefix to match (default: self-heal/run-)'
        required: false
        type: string
        default: self-heal/run-
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  cleanup:
    name: Delete stale branches & close PRs
    runs-on: ubuntu-latest
    steps:
    - name: Cache Python dependencies (Layer 1)
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml')
          }}
        restore-keys: '${{ runner.os }}-pip-

          '
    - uses: actions/checkout@v5
      with:
        sparse-checkout: 'scripts/ci/cleanup_stale_branches.py

          '
        sparse-checkout-cone-mode: false
    - name: Setup Python
      uses: ./.github/actions/setup-python-cached
      with:
        python-version: 3.12.13
        cache-tier: common
        cache-version: ${{ vars.CODEX_CACHE_VERSION || 'v3' }}
    - name: Run cleanup
      env:
        GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: "PREFIX=\"${{ inputs.prefix || 'self-heal/run-' }}\"\nDRY_RUN=\"${{ inputs.dry_run\
        \ }}\"\n\nARGS=\"--prefix ${PREFIX}\"\n\n# Schedule runs always execute; manual\
        \ runs respect the dry_run input\nif [ \"${{ github.event_name }}\" = \"schedule\"\
        \ ] || [ \"${DRY_RUN}\" != \"true\" ]; then\n  ARGS=\"${ARGS} --execute\"\n\
        fi\n\npython scripts/ci/cleanup_stale_branches.py ${ARGS}\n"
    env:
      GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token
        }}
    timeout-minutes: 10
