name: "📋 Post Accountability Report to Discussion"

# Triggered automatically after the cognitive-preflight self-healing commit,
# or manually. Posts the latest session entry from the accountability report
# to the [Ongoing] Copilot Coding Agent Accountability Report discussion #3673.
#
# Architecture:
#   1. Extract the most recent session entry from AGENT_ACCOUNTABILITY_REPORT.md
#   2. Post as a new comment on discussion #3673 (or update existing if same PR)
#   3. The markdown file remains as an audit trail but is no longer the primary
#      accountability surface — the Discussion thread is.
#
# Policy: PRIORITY 0 — hardened systematic process (see PR #3676 comment)
# Discussion: https://github.com/Aries-Serpent/_codex_/discussions/3673

on:
  push:
    branches:
      - "copilot/**"
      - "0D_base_"
    paths:
      - "docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to include in the report (optional)"
        required: false
        default: ""
      force_post:
        description: "Force post even if a comment for this session was already posted"
        required: false
        default: false
        type: boolean

concurrency:
  group: post-accountability-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  discussions: write
  pull-requests: read

jobs:
  post-to-discussion:
    name: "📋 Post to Discussion #3673"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 5

      - name: Extract latest session entry
        id: extract
        shell: python3 {0}
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          report_path = Path("docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md")
          if not report_path.exists():
              print("::warning::AGENT_ACCOUNTABILITY_REPORT.md not found — skipping")
              sys.exit(0)

          content = report_path.read_text(encoding="utf-8")

          # Split on ALL recognised H2 session heading formats:
          #   - "## SESSION SUMMARY — ..." (legacy/auto-generated format)
          #   - "## Session S\d+ — ..."    (current per-session format S205+)
          # Both patterns are anchored to line-start after a newline.
          SESSION_HEADING = re.compile(
              r'\n(?=## (?:SESSION SUMMARY|Session S\d+) — )'
          )
          parts = SESSION_HEADING.split(content)

          # Find the most recent real session entry
          latest = None
          for part in reversed(parts):
              stripped = part.strip()
              if re.match(r'^## (?:SESSION SUMMARY|Session S\d+) — ', stripped):
                  latest = stripped
                  break

          if not latest:
              print("::warning::No session entry found in report — skipping")
              # Fall back to last 50 lines of the file
              lines = content.strip().splitlines()
              latest = "\n".join(lines[-50:]) if len(lines) > 50 else content

          # Extract session ID from heading for deduplication (handles both formats)
          heading_match = re.match(
              r'^## (?:SESSION SUMMARY|Session \S+) — (.+?)$', latest, re.MULTILINE
          )
          session_id = heading_match.group(1).strip() if heading_match else "unknown"

          # Write outputs
          output_file = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(output_file, "a") as f:
              f.write(f"session_id={session_id[:100]}\n")

          # Write entry to a workspace-safe temp file (avoids multiline output issues)
          entry_file = os.environ.get("RUNNER_TEMP", "/tmp") + "/accountability_entry.md"
          with open(entry_file, "w", encoding="utf-8") as f:
              f.write(latest)

          print(f"✅ Extracted session entry: {session_id[:80]}")

      - name: Post to GitHub Discussion #3673
        uses: actions/github-script@v8
        env:
          SESSION_ID: ${{ steps.extract.outputs.session_id }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
          FORCE_POST: ${{ inputs.force_post || 'false' }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read the extracted entry from RUNNER_TEMP
            const runnerTemp = process.env.RUNNER_TEMP || '/tmp';
            const entryPath = path.join(runnerTemp, 'accountability_entry.md');
            let entryContent = '';
            try {
              entryContent = fs.readFileSync(entryPath, 'utf8');
            } catch (e) {
              core.warning('No entry file found — skipping discussion post');
              return;
            }

            if (!entryContent.trim()) {
              core.warning('Empty entry content — skipping discussion post');
              return;
            }

            const sessionId = process.env.SESSION_ID || 'unknown';
            const prNumber  = process.env.PR_NUMBER || '';
            const sha       = (process.env.SHA || '').slice(0, 7);
            const ref       = process.env.REF || '';
            const forcePost = process.env.FORCE_POST === 'true';

            // Deduplication marker — unique per session
            const DEDUP_MARKER = `<!-- accountability-session: ${sessionId.slice(0, 80)} -->`;

            // Build the discussion comment body
            const prRef   = prNumber ? ` (PR #${prNumber})` : '';
            const header  = [
              DEDUP_MARKER,
              `## 📋 Session Accountability Entry${prRef}`,
              ``,
              `> **Branch:** \`${ref}\` · **SHA:** \`${sha}\` · **Posted:** ${new Date().toISOString()}`,
              `> **Policy:** [CODEBASE_AGENCY_POLICY.md](.codex/CODEBASE_AGENCY_POLICY.md)`,
              ``,
            ].join('\n');

            const body = header + entryContent;

            // Discussion node ID for #3673 — fetch via GraphQL
            const DISCUSSION_NUMBER = 3673;
            let discussionId;
            try {
              const result = await github.graphql(`
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    discussion(number: $number) {
                      id
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                name:  context.repo.repo,
                number: DISCUSSION_NUMBER,
              });
              discussionId = result.repository.discussion.id;
            } catch (e) {
              core.warning(`Could not fetch discussion #${DISCUSSION_NUMBER}: ${e.message}`);
              core.warning('Ensure GITHUB_TOKEN has discussions:write permission');
              return;
            }

            if (!discussionId) {
              core.warning(`Discussion #${DISCUSSION_NUMBER} not found`);
              return;
            }

            // Check for existing comment with same dedup marker
            if (!forcePost) {
              try {
                const existing = await github.graphql(`
                  query($id: ID!, $cursor: String) {
                    node(id: $id) {
                      ... on Discussion {
                        comments(first: 50, after: $cursor) {
                          nodes { id body }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }
                `, { id: discussionId });

                const comments = existing.node.comments.nodes || [];
                const found = comments.find(c => (c.body || '').includes(DEDUP_MARKER));
                if (found) {
                  core.info(`Discussion comment already posted for session: ${sessionId.slice(0, 60)}`);
                  core.info('Use force_post=true to repost');
                  return;
                }
              } catch (e) {
                core.warning(`Could not check existing comments: ${e.message}`);
              }
            }

            // Post the new comment
            try {
              await github.graphql(`
                mutation($discussionId: ID!, $body: String!) {
                  addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                    comment { id url }
                  }
                }
              `, {
                discussionId,
                body,
              });
              core.info(`✅ Posted accountability entry to discussion #${DISCUSSION_NUMBER}`);
            } catch (e) {
              core.warning(`Failed to post discussion comment: ${e.message}`);
              core.info('Body preview (first 200 chars): ' + body.slice(0, 200));
            }

  rescue-comment-push:
    name: Post rescue comment on push failure
    runs-on: ubuntu-latest
    needs: post-to-discussion
    if: failure() && github.event_name == 'push'
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Post @copilot rescue comment to associated PR
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Post Accountability to Discussion"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error, datetime
          token=os.environ["GH_TOKEN"]; repo=os.environ["REPO"]
          commit_sha=os.environ["COMMIT_SHA"]; run_id=os.environ["RUN_ID"]
          run_url=os.environ["RUN_URL"]; workflow=os.environ["WORKFLOW_NAME"]
          branch=os.environ["BRANCH"]
          now=datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"); sha_short=commit_sha[:12]
          MARKER=f"<!-- ci-rescue-push:{sha_short} -->"
          API="https://api.github.com"
          HDRS={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}
          def gh(method,path,body=None):
            url=f"{API}{path}"; data=json.dumps(body).encode() if body else None
            req=urllib.request.Request(url,data=data,headers=HDRS,method=method)
            try:
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,json.loads(r.read())
            except urllib.error.HTTPError as e: return e.code,{}
          owner=repo.split("/")[0]
          _,prs=gh("GET",f"/repos/{repo}/pulls?state=open&head={owner}:{branch}&per_page=10")
          if not prs or not isinstance(prs,list):
            print(f"No open PR for branch {branch} — skipping rescue comment"); sys.exit(0)
          pr_number=prs[0]["number"]
          rescue_body=f"""## 🚨 CI Rescue — @copilot Fix Required\n\n**Workflow:** `{workflow}`\n**Run:** [{run_id}]({run_url})\n**Branch:** `{branch}`\n**Commit:** `{commit_sha}`\n**Time:** {now}\n\n@copilot The **{workflow}** workflow failed on push to `{branch}` (commit `{sha_short}`).\n\n**Steps to resolve:**\n1. Load `.codex/CODEBASE_AGENCY_POLICY.md` (§0 — fix ALL issues found)\n2. Check the failure logs: [{run_id}]({run_url})\n3. Apply the minimal fix and push\n4. Update `docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md`\n5. Verify all CI checks are green before concluding\n\n_Posted by: rescue-comment-push job (S237)_"""
          existing_id=None; existing_body=""
          page=1
          while not existing_id:
            _,page_comments=gh("GET",f"/repos/{repo}/issues/{pr_number}/comments?per_page=100&page={page}")
            if not isinstance(page_comments,list) or not page_comments: break
            for c in page_comments:
              if MARKER in (c.get("body") or ""): existing_id=c["id"]; existing_body=c.get("body",""); break
            if existing_id or len(page_comments)<100: break
            page+=1
          if existing_id:
            append=f"\n\n---\n\n### 🔄 Failure Update — {now}\n\n**Run:** [{run_id}]({run_url})\n\n@copilot `{workflow}` failed again on `{sha_short}`. Investigate [run #{run_id}]({run_url})."
            updated=(existing_body.rstrip()+append)[:65536]
            status,_=gh("PATCH",f"/repos/{repo}/issues/comments/{existing_id}",{"body":updated})
            if status in (200,201): print(f"✅ Appended to rescue comment #{existing_id}")
            else: existing_id=None
          if not existing_id:
            status,resp=gh("POST",f"/repos/{repo}/issues/{pr_number}/comments",{"body":f"{MARKER}\n{rescue_body}"})
            if status in (200,201): print(f"✅ Posted rescue comment: {resp.get('html_url','(no url)')}")
            else: print(f"❌ Failed: HTTP {status}"); sys.exit(1)
          PYEOF
