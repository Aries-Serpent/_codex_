name: "📋 Post Accountability Report to Discussion"

# Triggered automatically after the cognitive-preflight self-healing commit,
# or manually. Posts the latest session entry from the accountability report
# to the [Ongoing] Copilot Coding Agent Accountability Report discussion #3673.
#
# Architecture:
#   1. Extract the most recent session entry from AGENT_ACCOUNTABILITY_REPORT.md
#   2. Post as a new comment on discussion #3673 (or update existing if same PR)
#   3. The markdown file remains as an audit trail but is no longer the primary
#      accountability surface — the Discussion thread is.
#
# Policy: PRIORITY 0 — hardened systematic process (see PR #3676 comment)
# Discussion: https://github.com/Aries-Serpent/_codex_/discussions/3673

on:
  push:
    branches:
      - "copilot/**"
      - "0D_base_"
    paths:
      - "docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to include in the report (optional)"
        required: false
        default: ""
      force_post:
        description: "Force post even if a comment for this session was already posted"
        required: false
        default: false
        type: boolean

concurrency:
  group: post-accountability-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  discussions: write
  pull-requests: read

jobs:
  post-to-discussion:
    name: "📋 Post to Discussion #3673"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Extract latest session entry
        id: extract
        shell: python3 {0}
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          report_path = Path("docs/accountability/AGENT_ACCOUNTABILITY_REPORT.md")
          if not report_path.exists():
              print("::warning::AGENT_ACCOUNTABILITY_REPORT.md not found — skipping")
              sys.exit(0)

          content = report_path.read_text(encoding="utf-8")

          # Split on ALL recognised H2 session heading formats:
          #   - "## SESSION SUMMARY — ..." (legacy/auto-generated format)
          #   - "## Session S\d+ — ..."    (current per-session format S205+)
          # Both patterns are anchored to line-start after a newline.
          SESSION_HEADING = re.compile(
              r'\n(?=## (?:SESSION SUMMARY|Session S\d+) — )'
          )
          parts = SESSION_HEADING.split(content)

          # Find the most recent real session entry
          latest = None
          for part in reversed(parts):
              stripped = part.strip()
              if re.match(r'^## (?:SESSION SUMMARY|Session S\d+) — ', stripped):
                  latest = stripped
                  break

          if not latest:
              print("::warning::No session entry found in report — skipping")
              # Fall back to last 50 lines of the file
              lines = content.strip().splitlines()
              latest = "\n".join(lines[-50:]) if len(lines) > 50 else content

          # Extract session ID from heading for deduplication (handles both formats)
          heading_match = re.match(
              r'^## (?:SESSION SUMMARY|Session \S+) — (.+?)$', latest, re.MULTILINE
          )
          session_id = heading_match.group(1).strip() if heading_match else "unknown"

          # Write outputs
          output_file = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(output_file, "a") as f:
              f.write(f"session_id={session_id[:100]}\n")

          # Write entry to a workspace-safe temp file (avoids multiline output issues)
          entry_file = os.environ.get("RUNNER_TEMP", "/tmp") + "/accountability_entry.md"
          with open(entry_file, "w", encoding="utf-8") as f:
              f.write(latest)

          print(f"✅ Extracted session entry: {session_id[:80]}")

      - name: "🔑 Resolve auth token for discussions:write"
        # S303: Mint GitHub App installation token first (has discussions:write).
        # Falls back to CODEX_MASTER_KEY / CODEX_BACKUP_KEY / github.token.
        # Now that api.github.com/installation/token is in the network allowlist,
        # the App token path succeeds when _GITHUB_APP_* secrets are injected.
        id: auth
        env:
          GITHUB_APP_PRIVATE_KEY: ${{ secrets._GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets._GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets._GITHUB_APP_INSTALLATION_ID }}
          CODEX_MASTER_KEY: ${{ secrets.CODEX_MASTER_KEY }}
          CODEX_BACKUP_KEY: ${{ secrets.CODEX_BACKUP_KEY }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          pip install "PyJWT==2.8.0" "cryptography==44.0.2" --quiet
          RESOLVED_TOKEN=""
          if [[ -n "${GITHUB_APP_PRIVATE_KEY}" && -n "${GITHUB_APP_ID}" && -n "${GITHUB_APP_INSTALLATION_ID}" ]]; then
            echo "ℹ️ Attempting GitHub App installation token mint..."
            INSTALL_TOKEN=$(python3 - <<'PYEOF'
          import os, time, json, sys
          try:
              import jwt
              key = os.environ["GITHUB_APP_PRIVATE_KEY"]
              app_id = os.environ["GITHUB_APP_ID"]
              inst_id = os.environ["GITHUB_APP_INSTALLATION_ID"]
              now = int(time.time())
              payload = {"iat": now - 60, "exp": now + 540, "iss": str(app_id)}
              app_jwt = jwt.encode(payload, key, algorithm="RS256")
              import urllib.request, urllib.error
              req = urllib.request.Request(
                  f"https://api.github.com/app/installations/{inst_id}/access_tokens",
                  method="POST",
                  data=json.dumps({}).encode(),
                  headers={
                      "Authorization": f"Bearer {app_jwt}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "codex-accountability/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read())
                  print(data["token"])
              except urllib.error.HTTPError as http_err:
                  body = http_err.read().decode("utf-8", errors="replace")
                  print(f"APP_TOKEN_FAILED: HTTP {http_err.code} — {body}", file=sys.stderr)
                  print("")
          except Exception as e:
              print(f"APP_TOKEN_FAILED: {e}", file=sys.stderr)
              print("")
          PYEOF
          )
            if [[ -n "${INSTALL_TOKEN}" && "${INSTALL_TOKEN}" != "APP_TOKEN_FAILED"* ]]; then
              RESOLVED_TOKEN="${INSTALL_TOKEN}"
              echo "✅ GitHub App installation token acquired"
              echo "auth_source=github_app" >> "$GITHUB_OUTPUT"
            else
              echo "⚠️ App token mint failed — falling back to PAT"
            fi
          fi
          if [[ -z "${RESOLVED_TOKEN}" ]]; then
            if [[ -n "${CODEX_MASTER_KEY}" ]]; then
              RESOLVED_TOKEN="${CODEX_MASTER_KEY}"
              echo "auth_source=codex_master_key" >> "$GITHUB_OUTPUT"
            elif [[ -n "${CODEX_BACKUP_KEY}" ]]; then
              RESOLVED_TOKEN="${CODEX_BACKUP_KEY}"
              echo "auth_source=codex_backup_key" >> "$GITHUB_OUTPUT"
            else
              RESOLVED_TOKEN="${GITHUB_TOKEN_FALLBACK}"
              echo "auth_source=github_token" >> "$GITHUB_OUTPUT"
              echo "⚠️ Using github.token — discussion write may fail without discussions:write"
            fi
          fi
          echo "resolved_token=${RESOLVED_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Post to GitHub Discussion #3673
        uses: actions/github-script@v9
        env:
          SESSION_ID: ${{ steps.extract.outputs.session_id }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
          FORCE_POST: ${{ inputs.force_post || 'false' }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        with:
          github-token: ${{ steps.auth.outputs.resolved_token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read the extracted entry from RUNNER_TEMP
            const runnerTemp = process.env.RUNNER_TEMP || '/tmp';
            const entryPath = path.join(runnerTemp, 'accountability_entry.md');
            let entryContent = '';
            try {
              entryContent = fs.readFileSync(entryPath, 'utf8');
            } catch (e) {
              core.warning('No entry file found — skipping discussion post');
              return;
            }

            if (!entryContent.trim()) {
              core.warning('Empty entry content — skipping discussion post');
              return;
            }

            const sessionId = process.env.SESSION_ID || 'unknown';
            const prNumber  = process.env.PR_NUMBER || '';
            const sha       = (process.env.SHA || '').slice(0, 7);
            const ref       = process.env.REF || '';
            const forcePost = process.env.FORCE_POST === 'true';

            // Deduplication marker — unique per session
            const DEDUP_MARKER = `<!-- accountability-session: ${sessionId.slice(0, 80)} -->`;

            // Build the discussion comment body
            const prRef   = prNumber ? ` (PR #${prNumber})` : '';
            const header  = [
              DEDUP_MARKER,
              `## 📋 Session Accountability Entry${prRef}`,
              ``,
              `> **Branch:** \`${ref}\` · **SHA:** \`${sha}\` · **Posted:** ${new Date().toISOString()}`,
              `> **Policy:** [CODEBASE_AGENCY_POLICY.md](.codex/CODEBASE_AGENCY_POLICY.md)`,
              ``,
            ].join('\n');

            const body = header + entryContent;

            // RC-4 (S300): Find or create a per-PR scoped discussion instead of
            // posting to the shared global discussion #3673. This allows each PR to
            // have its own isolated accountability thread without hardcoded numbers.
            const prNum   = prNumber ? parseInt(prNumber, 10) : 0;
            let discussionId;
            let resolvedDiscussionNumber = 3673; // fallback to global discussion

            if (prNum > 0) {
              // Search for an existing per-PR discussion titled
              // "📋 Agent Accountability — PR #<N>"
              const targetTitle = `📋 Agent Accountability — PR #${prNum}`;
              try {
                const searchResult = await github.graphql(`
                  query($owner: String!, $name: String!, $first: Int!) {
                    repository(owner: $owner, name: $name) {
                      discussions(first: $first, orderBy: { field: CREATED_AT, direction: DESC }) {
                        nodes { id number title }
                      }
                    }
                  }
                `, { owner: context.repo.owner, name: context.repo.repo, first: 50 });
                const discussions = searchResult.repository.discussions.nodes || [];
                const found = discussions.find(d => d.title === targetTitle);
                if (found) {
                  discussionId = found.id;
                  resolvedDiscussionNumber = found.number;
                  core.info(`RC-4: Found per-PR discussion #${found.number} for PR #${prNum}`);
                }
              } catch (e) {
                core.warning(`RC-4: Could not search discussions: ${e.message}`);
              }
            }

            // If no per-PR discussion found, fall back to global discussion #3673
            if (!discussionId) {
              const DISCUSSION_NUMBER = 3673;
              try {
                const result = await github.graphql(`
                  query($owner: String!, $name: String!, $number: Int!) {
                    repository(owner: $owner, name: $name) {
                      discussion(number: $number) { id }
                    }
                  }
                `, {
                  owner: context.repo.owner,
                  name:  context.repo.repo,
                  number: DISCUSSION_NUMBER,
                });
                discussionId = result.repository.discussion.id;
                resolvedDiscussionNumber = DISCUSSION_NUMBER;
                core.info(`RC-4: Using fallback global discussion #${DISCUSSION_NUMBER}`);
              } catch (e) {
                core.warning(`Could not fetch discussion #${DISCUSSION_NUMBER}: ${e.message}`);
                core.warning('Ensure GITHUB_TOKEN has discussions:write permission');
                return;
              }
            }

            if (!discussionId) {
              core.warning(`No suitable discussion found for accountability entry`);
              return;
            }

            // Check for existing comment with same dedup marker
            // Uses last:50 (most-recent 50 comments, backward search). Per-PR discussions
            // are newly created so this safely covers all comments. For global #3673 fallback,
            // comments accumulate; 50 covers ~25 sessions. If a per-PR discussion grows beyond
            // 50 comments, force_post=true can bypass the dedup.
            if (!forcePost) {
              try {
                const existing = await github.graphql(`
                  query($id: ID!) {
                    node(id: $id) {
                      ... on Discussion {
                        comments(last: 50) {
                          nodes { id body }
                        }
                      }
                    }
                  }
                `, { id: discussionId });

                const comments = existing.node.comments.nodes || [];
                const found = comments.find(c => (c.body || '').includes(DEDUP_MARKER));
                if (found) {
                  core.info(`Discussion comment already posted for session: ${sessionId.slice(0, 60)}`);
                  core.info('Use force_post=true to repost');
                  return;
                }
              } catch (e) {
                core.warning(`Could not check existing comments: ${e.message}`);
              }
            }

            // Post the new comment
            try {
              await github.graphql(`
                mutation($discussionId: ID!, $body: String!) {
                  addDiscussionComment(input: { discussionId: $discussionId, body: $body }) {
                    comment { id url }
                  }
                }
              `, {
                discussionId,
                body,
              });
              core.info(`✅ Posted accountability entry to discussion #${resolvedDiscussionNumber}`);
            } catch (e) {
              core.warning(`Failed to post discussion comment: ${e.message}`);
              core.info('Body preview (first 200 chars): ' + body.slice(0, 200));
            }

  rescue-comment-push:
    name: Post rescue comment on push failure
    runs-on: ubuntu-latest
    needs: post-to-discussion
    if: failure() && github.event_name == 'push'
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CODEX_MASTER_KEY || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Post or update rescue comment
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY || github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: "Post Accountability to Discussion"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: python scripts/ci/post_rescue_comment.py
