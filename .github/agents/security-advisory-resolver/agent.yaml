name: security-advisory-resolver
version: 1.0.0
description: 'Automatically investigate and resolve security advisories from cargo
  audit, pip-audit, and other security scanning tools. Tests compatibility of updates
  and creates fix PRs.

  '
metadata:
  author: copilot
  created: 2026-01-11
  category: security
  priority: medium
  estimated_effort: 3-4 days
triggers:
  events:
  - security_scan
  - dependabot_alert
  - manual
  - scheduled
capabilities:
- scan_advisories
- analyze_impact
- generate_fixes
- create_pr
input:
  required:
  - advisory_id: string
  optional:
  - ecosystem: string
  - auto_fix: boolean
  - dry_run: boolean
output:
  success:
    advisory_resolved: boolean
    updated_packages: list[object]
    test_results: object
    pr_url: string
  failure:
    reason: string
    no_patch_available: boolean
    recommended_mitigation: string
    tracking_issue: string
integrations:
  cognitive_brain:
    pattern_storage: true
    security_patterns_category: true
  github:
    pr_creation: true
    issue_creation: true
    security_alerts: true
constraints:
  max_advisory_age_days: 30
  require_tests_pass: true
  require_human_approval_for:
  - major_version_bumps
  - dependency_replacement
  - transitive_only_advisories
security:
  code_execution: sandboxed
  file_access: dependency_files_only
  network_access: advisory_databases_only
  secret_handling: never_access
id: security-advisory-resolver
status: active
maturity: beta
dependencies: []
