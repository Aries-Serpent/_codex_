name: Test Coverage Enforcer
description: Enforce test coverage thresholds and generate missing tests
author: Codex Team
inputs:
  check-coverage:
    description: Whether to check coverage against thresholds
    required: false
    default: 'true'
  threshold:
    description: Minimum line coverage threshold (percentage)
    required: false
    default: '80'
  auto-generate:
    description: Automatically generate test templates for uncovered code
    required: false
    default: 'false'
  fail-below-threshold:
    description: Fail the build if coverage is below threshold
    required: false
    default: 'true'
  source-path:
    description: Path to source code to analyze
    required: false
    default: src
  config-path:
    description: Path to agent configuration file
    required: false
    default: .github/agents/test-coverage-enforcer/config/agent_config.yaml
  output-format:
    description: Report format (text, json, html)
    required: false
    default: text
  output-file:
    description: Output file for coverage report
    required: false
    default: coverage_report.txt
outputs:
  coverage-percentage:
    description: Current overall coverage percentage
    value: ${{ steps.enforce.outputs.coverage }}
  passed:
    description: Whether coverage enforcement passed
    value: ${{ steps.enforce.outputs.passed }}
  issues-found:
    description: Number of coverage issues found
    value: ${{ steps.enforce.outputs.issues }}
  suggestions-generated:
    description: Number of test suggestions generated
    value: ${{ steps.enforce.outputs.suggestions }}
runs:
  using: composite
  steps:
  - name: Set up Python
    uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
    with:
      python-version: '3.11'
  - name: Install dependencies
    shell: bash
    run: 'python -m pip install --upgrade pip

      pip install coverage pytest pytest-cov pyyaml

      '
  - name: Install agent
    shell: bash
    run: '# Add agent to Python path

      export PYTHONPATH="${GITHUB_WORKSPACE}/.github/agents/test-coverage-enforcer:${PYTHONPATH}"

      echo "PYTHONPATH=${PYTHONPATH}" >> $GITHUB_ENV

      '
  - name: Run coverage analysis
    shell: bash
    id: analyze
    env:
      SOURCE_PATH: ${{ inputs.source-path }}
    run: |
      python -m pytest         --cov="$SOURCE_PATH"         --cov-report=json:coverage.json         --cov-report=term         -v || true
      echo "Coverage analysis completed"
  - name: Enforce coverage thresholds
    shell: bash
    id: enforce
    env:
      SOURCE_PATH: ${{ inputs.source-path }}
      CHECK_COVERAGE: ${{ inputs.check-coverage }}
      THRESHOLD: ${{ inputs.threshold }}
      OUTPUT_FORMAT: ${{ inputs.output-format }}
      OUTPUT_FILE: ${{ inputs.output-file }}
      FAIL_BELOW_THRESHOLD: ${{ inputs.fail-below-threshold }}
    run: |
      cd "$GITHUB_WORKSPACE/.github/agents/test-coverage-enforcer"

      if [ "$CHECK_COVERAGE" = "true" ]; then
        python -m src.agent enforce           --path "$SOURCE_PATH"           --threshold "$THRESHOLD"           --format "$OUTPUT_FORMAT"           --output "$OUTPUT_FILE" > enforcement_output.txt

        COVERAGE=$(grep -oP 'Current coverage: \K[\d.]+' enforcement_output.txt || echo "0")
        PASSED=$(grep -q "PASSED" enforcement_output.txt && echo "true" || echo "false")

        echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
        echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"
        echo "issues=0" >> "$GITHUB_OUTPUT"
        echo "suggestions=0" >> "$GITHUB_OUTPUT"

        cat enforcement_output.txt

        if [ "$FAIL_BELOW_THRESHOLD" = "true" ] && [ "$PASSED" = "false" ]; then
          echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        fi
      else
        echo "Coverage checking disabled"
        echo "coverage=0" >> "$GITHUB_OUTPUT"
        echo "passed=true" >> "$GITHUB_OUTPUT"
        echo "issues=0" >> "$GITHUB_OUTPUT"
        echo "suggestions=0" >> "$GITHUB_OUTPUT"
      fi
  - name: Generate test suggestions
    shell: bash
    if: inputs.auto-generate == 'true'
    env:
      SOURCE_PATH: ${{ inputs.source-path }}
    run: |
      cd "$GITHUB_WORKSPACE/.github/agents/test-coverage-enforcer"
      python -m src.agent generate-tests         --path "$SOURCE_PATH"         > test_suggestions.txt
      echo "Test suggestions generated:"
      cat test_suggestions.txt
  - name: Upload coverage report
    uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
    if: always()
    with:
      name: coverage-report
      path: '${{ inputs.output-file }}

        coverage.json

        .coverage

        '
      retention-days: 30
  - name: Comment on PR
    uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325
    if: always()
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      ISSUE_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      REPOSITORY_NAME: ${{ github.event.repository.name }}
      COVERAGE: ${{ steps.enforce.outputs.coverage }}
      PASSED: ${{ steps.enforce.outputs.passed }}
      THRESHOLD: ${{ inputs.threshold }}
      OUTPUT_FILE: ${{ inputs.output-file }}
    with:
      script: |
        const fs = require('fs');
        if (process.env.GITHUB_EVENT_NAME !== 'pull_request') {
          return;
        }

        const coverage = process.env.COVERAGE;
        const passed = process.env.PASSED;
        const threshold = process.env.THRESHOLD;
        const issueNumber = Number(process.env.ISSUE_NUMBER || '0');
        const owner = process.env.REPOSITORY_OWNER;
        const repo = process.env.REPOSITORY_NAME;

        const status = passed === 'true' ? '✅ PASS' : '❌ FAIL';
        const icon = passed === 'true' ? '✅' : '❌';

        let reportContent = '';
        try {
          reportContent = fs.readFileSync(process.env.OUTPUT_FILE, 'utf8');
        } catch (e) {
          reportContent = 'Report not available';
        }

        const body = [
          `## ${icon} Test Coverage Report`,
          '',
          `**Status:** ${status}`,
          `**Current Coverage:** ${coverage}%`,
          `**Threshold:** ${threshold}%`,
          '',
          '<details>',
          '<summary>View Full Report</summary>',
          '',
          '```',
          reportContent,
          '```',
          '',
          '</details>',
          '',
          '---',
          '*Generated by Test Coverage Enforcer Agent*'
        ].join('\n');

        await github.rest.issues.createComment({
          issue_number: issueNumber,
          owner,
          repo,
          body
        });
id: test-coverage-enforcer
status: active
maturity: beta
capabilities: []
triggers:
  events:
  - manual
dependencies: []
