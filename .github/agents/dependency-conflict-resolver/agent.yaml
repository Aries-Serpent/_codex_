name: 'Dependency Conflict Resolver'
description: 'Enforce dependency conflict thresholds and generate missing tests'
author: 'Codex Team'

inputs:
  check-coverage:
    description: 'Whether to check coverage against thresholds'
    required: false
    default: 'true'

  threshold:
    description: 'Minimum compatibility score threshold (percentage)'
    required: false
    default: '80'

  auto-generate:
    description: 'Automatically generate resolution strategys for conflicting dependencies'
    required: false
    default: 'false'

  fail-below-threshold:
    description: 'Fail the build if coverage is below threshold'
    required: false
    default: 'true'

  source-path:
    description: 'Path to source code to analyze'
    required: false
    default: 'src'

  config-path:
    description: 'Path to agent configuration file'
    required: false
    default: '.github/agents/test-coverage-enforcer/config/agent_config.yaml'

  output-format:
    description: 'Report format (text, json, html)'
    required: false
    default: 'text'

  output-file:
    description: 'Output file for coverage report'
    required: false
    default: 'coverage_report.txt'

outputs:
  coverage-percentage:
    description: 'Current overall coverage percentage'
    value: ${{ steps.enforce.outputs.coverage }}

  passed:
    description: 'Whether coverage enforcement passed'
    value: ${{ steps.enforce.outputs.passed }}

  issues-found:
    description: 'Number of coverage issues found'
    value: ${{ steps.enforce.outputs.issues }}

  suggestions-generated:
    description: 'Number of test suggestions generated'
    value: ${{ steps.enforce.outputs.suggestions }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@7f65d1b8a9c4e9c8f2e2c2e2c2e2c2e2c2e2c2e2
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install coverage pytest pytest-cov pyyaml

    - name: Install agent
      shell: bash
      run: |
        # Add agent to Python path
        export PYTHONPATH="${GITHUB_WORKSPACE}/.github/agents/test-coverage-enforcer:${PYTHONPATH}"
        echo "PYTHONPATH=${PYTHONPATH}" >> $GITHUB_ENV

    - name: Run coverage analysis
      shell: bash
      id: analyze
      env:
        SOURCE_PATH: ${{ inputs.source-path }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        python -m pytest \
          --cov=$SOURCE_PATH \
          --cov-report=json:coverage.json \
          --cov-report=term \
          -v || true

        echo "Coverage analysis completed"

    - name: Enforce version constraints
      shell: bash
      id: enforce
      env:
        SOURCE_PATH: ${{ inputs.source-path }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        cd $GITHUB_WORKSPACE/.github/agents/test-coverage-enforcer

        # Run enforcement
        if [ "${{ inputs.check-coverage }}" == "true" ]; then
          python -m src.agent enforce \
            --path "$SOURCE_PATH" \
            --threshold ${{ inputs.threshold }} \
            --format ${{ inputs.output-format }} \
            --output "${{ inputs.output-file }}" > enforcement_output.txt

          ENFORCEMENT_EXIT_CODE=$?

          # Parse output
          COVERAGE=$(grep -oP 'Current coverage: \K[\d.]+' enforcement_output.txt || echo "0")
          PASSED=$(grep -q "PASSED" enforcement_output.txt && echo "true" || echo "false")

          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "issues=0" >> $GITHUB_OUTPUT
          echo "suggestions=0" >> $GITHUB_OUTPUT

          # Display output
          cat enforcement_output.txt

          # Exit with enforcement result if fail-below-threshold is true
          if [ "${{ inputs.fail-below-threshold }}" == "true" ] && [ "${PASSED}" == "false" ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${{ inputs.threshold }}%"
            exit 1
          fi
        else
          echo "Coverage checking disabled"
          echo "coverage=0" >> $GITHUB_OUTPUT
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "issues=0" >> $GITHUB_OUTPUT
          echo "suggestions=0" >> $GITHUB_OUTPUT
        fi

    - name: Generate test suggestions
      shell: bash
      if: inputs.auto-generate == 'true'
      env:
        SOURCE_PATH: ${{ inputs.source-path }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        cd $GITHUB_WORKSPACE/.github/agents/test-coverage-enforcer

        python -m src.agent generate-tests \
          --path "$SOURCE_PATH" \
          > test_suggestions.txt

        echo "Test suggestions generated:"
        cat test_suggestions.txt

    - name: Upload coverage report
      uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b
      if: always()
      with:
        name: coverage-report
        path: |
          ${{ inputs.output-file }}
          coverage.json
          .coverage
        retention-days: 30

    - name: Comment on PR
      env:
        COVERAGE: ${{ steps.enforce.outputs.coverage }}
        PASSED: ${{ steps.enforce.outputs.passed }}
        THRESHOLD: ${{ inputs.threshold }}
        OUTPUT_FILE: ${{ inputs.output-file }}
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          const coverage = process.env.COVERAGE;
          const passed = process.env.PASSED;
          const threshold = process.env.THRESHOLD;

          const status = passed === 'true' ? '✅ PASS' : '❌ FAIL';
          const icon = passed === 'true' ? '✅' : '❌';

          let reportContent = '';
          try {
            reportContent = fs.readFileSync(process.env.OUTPUT_FILE, 'utf8');
          } catch (e) {
            reportContent = 'Report not available';
          }

          const body = `## ${icon} dependency conflict Report

          **Status:** ${status}
          **Current Coverage:** ${coverage}%
          **Threshold:** ${threshold}%

          <details>
          <summary>View Full Report</summary>

          \`\`\`
          ${reportContent}
          \`\`\`

          </details>

          ---
          *Generated by Dependency Conflict Resolver Agent*`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
