name: Dependency Conflict Resolver
description: Enforce dependency conflict thresholds and generate missing tests
author: Codex Team
inputs:
  check-coverage:
    description: Whether to check coverage against thresholds
    required: false
    default: 'true'
  threshold:
    description: Minimum compatibility score threshold (percentage)
    required: false
    default: '80'
  auto-generate:
    description: Automatically generate resolution strategys for conflicting dependencies
    required: false
    default: 'false'
  fail-below-threshold:
    description: Fail the build if coverage is below threshold
    required: false
    default: 'true'
  source-path:
    description: Path to source code to analyze
    required: false
    default: src
  config-path:
    description: Path to agent configuration file
    required: false
    default: .github/agents/test-coverage-enforcer/config/agent_config.yaml
  output-format:
    description: Report format (text, json, html)
    required: false
    default: text
  output-file:
    description: Output file for coverage report
    required: false
    default: coverage_report.txt
outputs:
  coverage-percentage:
    description: Current overall coverage percentage
    value: ${{ steps.enforce.outputs.coverage }}
  passed:
    description: Whether coverage enforcement passed
    value: ${{ steps.enforce.outputs.passed }}
  issues-found:
    description: Number of coverage issues found
    value: ${{ steps.enforce.outputs.issues }}
  suggestions-generated:
    description: Number of test suggestions generated
    value: ${{ steps.enforce.outputs.suggestions }}
runs:
  using: composite
  steps:
  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: '3.11'
  - name: Install dependencies
    shell: bash
    run: 'python -m pip install --upgrade pip

      pip install coverage pytest pytest-cov pyyaml

      '
  - name: Install agent
    shell: bash
    run: '# Add agent to Python path

      export PYTHONPATH="${GITHUB_WORKSPACE}/.github/agents/test-coverage-enforcer:${PYTHONPATH}"

      echo "PYTHONPATH=${PYTHONPATH}" >> $GITHUB_ENV

      '
  - name: Run coverage analysis
    shell: bash
    id: analyze
    env:
      SOURCE_PATH: ${{ inputs.source-path }}
      OUTPUT_FILE: ${{ inputs.output-file }}
    run: "python -m pytest \\\n  --cov=$SOURCE_PATH \\\n  --cov-report=json:coverage.json\
      \ \\\n  --cov-report=term \\\n  -v || true\n\necho \"Coverage analysis completed\"\
      \n"
  - name: Enforce version constraints
    shell: bash
    id: enforce
    env:
      SOURCE_PATH: ${{ inputs.source-path }}
      OUTPUT_FILE: ${{ inputs.output-file }}
      CHECK_COVERAGE: ${{ inputs.check-coverage }}
      THRESHOLD: ${{ inputs.threshold }}
      OUTPUT_FORMAT: ${{ inputs.output-format }}
      FAIL_BELOW_THRESHOLD: ${{ inputs.fail-below-threshold }}
    run: "cd $GITHUB_WORKSPACE/.github/agents/test-coverage-enforcer\n\n# Run enforcement\n\
      if [ \"$CHECK_COVERAGE\" == \"true\" ]; then\n  python -m src.agent enforce\
      \ \\\n    --path \"$SOURCE_PATH\" \\\n    --threshold \"$THRESHOLD\" \\\n  \
      \  --format \"$OUTPUT_FORMAT\" \\\n    --output \"$OUTPUT_FILE\" > enforcement_output.txt\n\
      \n  ENFORCEMENT_EXIT_CODE=$?\n\n  # Parse output\n  COVERAGE=$(grep -oP 'Current\
      \ coverage: \\K[\\d.]+' enforcement_output.txt || echo \"0\")\n  PASSED=$(grep\
      \ -q \"PASSED\" enforcement_output.txt && echo \"true\" || echo \"false\")\n\
      \n  echo \"coverage=${COVERAGE}\" >> $GITHUB_OUTPUT\n  echo \"passed=${PASSED}\"\
      \ >> $GITHUB_OUTPUT\n  echo \"issues=0\" >> $GITHUB_OUTPUT\n  echo \"suggestions=0\"\
      \ >> $GITHUB_OUTPUT\n\n  # Display output\n  cat enforcement_output.txt\n\n\
      \  # Exit with enforcement result if fail-below-threshold is true\n  if [ \"\
      $FAIL_BELOW_THRESHOLD\" == \"true\" ] && [ \"${PASSED}\" == \"false\" ]; then\n\
      \    echo \"::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%\"\
      \n    exit 1\n  fi\nelse\n  echo \"Coverage checking disabled\"\n  echo \"coverage=0\"\
      \ >> $GITHUB_OUTPUT\n  echo \"passed=true\" >> $GITHUB_OUTPUT\n  echo \"issues=0\"\
      \ >> $GITHUB_OUTPUT\n  echo \"suggestions=0\" >> $GITHUB_OUTPUT\nfi\n"
  - name: Generate test suggestions
    shell: bash
    if: inputs.auto-generate == 'true'
    env:
      SOURCE_PATH: ${{ inputs.source-path }}
      OUTPUT_FILE: ${{ inputs.output-file }}
    run: "cd $GITHUB_WORKSPACE/.github/agents/test-coverage-enforcer\n\npython -m\
      \ src.agent generate-tests \\\n  --path \"$SOURCE_PATH\" \\\n  > test_suggestions.txt\n\
      \necho \"Test suggestions generated:\"\ncat test_suggestions.txt\n"
  - name: Upload coverage report
    uses: actions/upload-artifact@v5
    if: always()
    with:
      name: coverage-report
      path: '${{ inputs.output-file }}

        coverage.json

        .coverage

        '
      retention-days: 30
  - name: Comment on PR
    env:
      COVERAGE: ${{ steps.enforce.outputs.coverage }}
      PASSED: ${{ steps.enforce.outputs.passed }}
      THRESHOLD: ${{ inputs.threshold }}
      OUTPUT_FILE: ${{ inputs.output-file }}
    uses: actions/github-script@v8
    if: github.event_name == 'pull_request' && always()
    with:
      script: "const fs = require('fs');\nconst coverage = process.env.COVERAGE;\n\
        const passed = process.env.PASSED;\nconst threshold = process.env.THRESHOLD;\n\
        \nconst status = passed === 'true' ? '\u2705 PASS' : '\u274C FAIL';\nconst\
        \ icon = passed === 'true' ? '\u2705' : '\u274C';\n\nlet reportContent = '';\n\
        try {\n  reportContent = fs.readFileSync(process.env.OUTPUT_FILE, 'utf8');\n\
        } catch (e) {\n  reportContent = 'Report not available';\n}\n\nconst body\
        \ = `## ${icon} dependency conflict Report\n\n**Status:** ${status}\n**Current\
        \ Coverage:** ${coverage}%\n**Threshold:** ${threshold}%\n\n<details>\n<summary>View\
        \ Full Report</summary>\n\n\\`\\`\\`\n${reportContent}\n\\`\\`\\`\n\n</details>\n\
        \n---\n*Generated by Dependency Conflict Resolver Agent*`;\n\ngithub.rest.issues.createComment({\n\
        \  issue_number: context.issue.number,\n  owner: context.repo.owner,\n  repo:\
        \ context.repo.repo,\n  body: body\n});\n"
id: dependency-conflict-resolver
status: active
maturity: beta
capabilities: []
triggers:
  events:
  - manual
dependencies: []
