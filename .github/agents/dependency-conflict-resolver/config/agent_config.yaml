---
name: Dependency Conflict Resolver Agent
description: Detects, diagnoses, and resolves Python dependency conflicts with schema validation
version: 1.0.0-phase-9.1
updated: 2026-07-03
cognitive_integration_level: 1
aais_contribution: +1.0 points
batch: phase-9-1

runner_compatibility:
  default: ubuntu-latest
  large: ubuntu-latest-large

conflict_detection:
  enabled: true
  severity_threshold: LOW
  detection_modes:
    - version_incompatibility
    - circular_dependency
    - missing_dependency
    - conflicting_pins
    - platform_mismatch
    - deprecated_version
    - schema_incompatibility

schema_validation:
  enabled: true
  strict_mode: false
  supported_schemas:
    - docs_agent_v1
    - ml_pipeline_v1
    - ci_config_v1

version_matrix:
  generate_on_conflict: true
  matrix_depth: 5
  analyze_compatibility_across_versions: true

auto_resolution: false
confidence_scoring: true
min_confidence_for_execution: 0.85

analysis:
  include_circular_deps: true
  include_deprecated_versions: true
  include_deprecated_warnings: true
  max_analysis_depth: 10

output:
  formats:
    - json
    - text
    - html
  default_format: json
  include_recommendations: true
  include_version_matrices: true
