# Service Integration Tester Agent Configuration
# Version: 1.0.0

agent_name: service-integration-tester
version: "1.0.0"
description: "Tests service integrations, validates API contracts, and ensures cross-component compatibility"

# Component reuse configuration
component_reuse:
  base_component: integration-test-runner
  reuse_percentage: 60
  extensions:
    - name: pii-scrubber
      purpose: "Privacy-safe mock data generation"
      reuse_percentage: 20
    - name: rag-index-manager
      purpose: "Service endpoint discovery"
      reuse_percentage: 20

# Testing configuration
testing:
  # Default timeout for endpoint tests (milliseconds)
  default_timeout_ms: 5000
  
  # Maximum number of retries for failed tests
  max_retries: 3
  
  # Delay between retries (milliseconds)
  retry_delay_ms: 1000
  
  # Enable/disable PII scrubbing
  scrub_pii: true
  
  # PII scrubbing mode: token, hash, semantic
  pii_scrubbing_mode: token
  
  # Generate mock data for POST/PUT/PATCH requests
  auto_generate_mock_data: true

# Thresholds
thresholds:
  # Maximum acceptable response time (milliseconds)
  max_response_time_ms: 5000
  
  # Minimum acceptable success rate (0.0 to 1.0)
  min_success_rate: 0.95
  
  # Fail fast on first error
  fail_fast: false
  
  # Performance degradation threshold (percentage)
  performance_degradation_threshold: 0.20  # 20%

# Authentication
authentication:
  # Default auth type: bearer, api_key, basic, none
  default_type: bearer
  
  # Token/key sources (environment variables)
  token_env_vars:
    - API_TOKEN
    - BEARER_TOKEN
    - AUTH_TOKEN
  
  # API key header name
  api_key_header: X-API-Key

# Endpoint discovery
endpoint_discovery:
  # Common endpoints to always check
  common_endpoints:
    - path: /health
      method: GET
      description: Health check endpoint
    - path: /status
      method: GET
      description: Service status endpoint
    - path: /ready
      method: GET
      description: Readiness probe
    - path: /metrics
      method: GET
      description: Metrics endpoint
    - path: /version
      method: GET
      description: Version information
  
  # OpenAPI spec locations to search
  spec_locations:
    - openapi.yaml
    - openapi.json
    - swagger.yaml
    - swagger.json
    - docs/api.yaml
  
  # Enable automatic endpoint discovery
  auto_discover: true

# Mock data generation
mock_data:
  # Default schemas for common entities
  default_schemas:
    user:
      id: uuid
      name: name
      email: email
      created_at: timestamp
      active: bool
    
    product:
      id: uuid
      name: string
      price: float
      available: bool
      created_at: timestamp
    
    order:
      id: uuid
      user_id: uuid
      total: float
      status: string
      created_at: timestamp
  
  # Privacy-safe email domains
  safe_email_domains:
    - example.com
    - test.com
    - mock.local

# Reporting
reporting:
  # Report format: text, json, html, markdown
  default_format: text
  
  # Include detailed error messages
  include_errors: true
  
  # Include response times
  include_timings: true
  
  # Include PII-scrubbed payloads
  include_payloads: false
  
  # Group results by service
  group_by_service: true
  
  # Generate summary statistics
  include_summary: true

# Cognitive Brain Integration
cognitive_brain:
  enabled: true
  
  # Metrics to track
  metrics:
    - test_count
    - success_rate
    - failure_rate
    - avg_response_time_ms
    - min_response_time_ms
    - max_response_time_ms
    - total_response_time_ms
    - services_tested
    - endpoints_tested
    - contracts_validated
    - pii_instances_scrubbed
    - mock_data_generated
  
  # Reporting interval
  reporting_interval: daily
  
  # Storage configuration
  storage:
    type: sqlite
    path: .codex/sessions/agent_metrics.db
    
    # Retention policy
    retention_days: 90
  
  # Learning from failures
  learn_from_failures: true
  
  # Pattern detection
  detect_patterns: true
  
  # Anomaly detection
  detect_anomalies: true
  
  # Performance baseline tracking
  track_baselines: true

# Integration with other agents
agent_integration:
  # Call test-coverage-monitor after testing
  test_coverage_monitor:
    enabled: true
    threshold: 0.90
  
  # Call performance-regression-detector
  performance_regression_detector:
    enabled: true
    baseline_file: .codex/performance_baselines.json
  
  # Call pii-scrubber for all payloads
  pii_scrubber:
    enabled: true
    mode: token
  
  # Use rag-index-manager for endpoint discovery
  rag_index_manager:
    enabled: true
    index_path: .codex/endpoint_index/

# Logging
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  
  # Log file path
  file: .codex/logs/service_integration_tester.log
  
  # Log rotation
  rotate:
    max_bytes: 10485760  # 10MB
    backup_count: 5
  
  # Include timestamps
  include_timestamps: true
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Performance testing
performance:
  # Enable performance testing
  enabled: true
  
  # Number of iterations for performance tests
  iterations: 5
  
  # Warmup iterations (not counted)
  warmup_iterations: 2
  
  # Percentiles to calculate
  percentiles:
    - 50
    - 75
    - 90
    - 95
    - 99
  
  # Track performance trends
  track_trends: true
  
  # Baseline comparison
  compare_to_baseline: true

# CI/CD Integration
ci_cd:
  # Fail build on test failure
  fail_on_failure: true
  
  # Fail build on slow responses
  fail_on_slow_responses: true
  
  # Generate GitHub Actions annotations
  github_annotations: true
  
  # Comment on pull requests
  comment_on_pr: true
  
  # Upload artifacts
  upload_artifacts: true

# Advanced options
advanced:
  # Enable HTTP/2
  http2: false
  
  # Follow redirects
  follow_redirects: true
  
  # Max redirects to follow
  max_redirects: 5
  
  # Verify SSL certificates
  verify_ssl: true
  
  # Custom headers for all requests
  custom_headers: {}
  
  # Proxy configuration
  proxy: null
  
  # User agent
  user_agent: "ServiceIntegrationTester/1.0.0"
