agent:
  name: github-testing-orchestrator-agent
  version: 1.0.0
  description: Orchestrates comprehensive test suites for Phase 10 NotebookLM integration
  responsibilities:
    - HA-TEST-001  # End-to-end sync validation
    - HA-TEST-002  # Security scanning verification
    - HA-TEST-003  # AI Architect testing
    - HA-TEST-004  # Performance benchmarking
    - HA-TEST-005  # Error handling validation
    - HA-TEST-006  # Documentation accuracy

test_suites:
  e2e_sync:
    enabled: true
    timeout_seconds: 600
    retry_attempts: 3
    target_latency_seconds: 300
    
  security_scan:
    enabled: true
    scanners:
      - secretlint
      - detect-secrets
      - repomix-builtin
    fail_on_secrets_found: true
    
  ai_architect:
    enabled: true
    test_queries:
      - "What is the current cognitive brain health?"
      - "Analyze dependency vulnerabilities"
      - "Security audit summary"
    target_accuracy: 0.95
    
  performance:
    enabled: true
    max_bundle_size_mb: 5
    target_compression_ratio: 0.70
    max_consolidation_time_seconds: 120
    
  error_handling:
    enabled: true
    test_scenarios:
      - workflow_failure
      - api_timeout
      - invalid_config
      - network_error
      
  documentation:
    enabled: true
    check_links: true
    validate_examples: true
    test_troubleshooting: true

reporting:
  format: json
  output_dir: .reports/testing-orchestrator
  include_logs: true
  create_artifacts: true
  
github:
  api_base_url: https://api.github.com
  default_repo: Aries-Serpent/_codex_
  workflow_file: notebooklm-sync.yml
