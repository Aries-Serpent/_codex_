name: performance-monitor-agent
version: 1.0.0
description: Real-time performance tracking, latency monitoring, and throughput optimization
author: Cognitive Brain V10 Team
created: 2026-01-03

capabilities:
  - Continuous latency monitoring (p95 < 100ms)
  - Throughput optimization (>1000 req/s)
  - Resource usage prediction
  - Automatic performance regression detection
  - Real-time alerting

integration:
  cognitive_brain: true
  pda_loop: true
  aftermath: true
  
  phase8_10:
    - PerformanceBenchmarkSuite
    - MonitoringObservability
  
  external:
    - Prometheus metrics
    - OpenTelemetry traces

triggers:
  - pull_request
  - push
  - schedule: "0 */1 * * *"  # Every hour
  - workflow_dispatch

config:
  random_seed: 47  # PERF_MONITOR_SEED
  validation_seed: 42
  wandb_mode: offline
  
  thresholds:
    latency_p95_ms: 100.0
    latency_p99_ms: 200.0
    throughput_rps: 1000.0
    cpu_percent: 80.0
    memory_mb: 8192.0
  
  regression_detection:
    enabled: true
    threshold_percent: 10.0
  
  alerting:
    enabled: true
    severities: [info, warning, critical]

metrics:
  - latency_p50
  - latency_p95
  - latency_p99
  - throughput_rps
  - cpu_usage
  - memory_usage
  - alerts_generated
  - regressions_detected

performance_targets:
  latency_p95: "<100ms"
  throughput: ">1000 req/s"
  accuracy: ">95%"
  overhead: "<5%"

test_requirements:
  min_tests: 15
  coverage: ">90%"
  deterministic: true
  seed: 47
