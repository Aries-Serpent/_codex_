# Test Assertion Updater Agent Configuration
# Version: 1.0.0
# Status: Active

name: test-assertion-updater
version: 1.0.0
description: >
  Automatically detect and fix test assertion mismatches when implementation 
  evolves while preserving test intent and coverage.

# Agent metadata
metadata:
  author: copilot
  created: 2026-01-11
  category: test-automation
  priority: high
  estimated_effort: 3-5 days

# Trigger conditions
triggers:
  - type: workflow_failure
    workflow: CI Tests
    job_name_pattern: "test*"
    failure_type: assertion_error
    
  - type: manual
    command: "@copilot fix test assertion"
    
  - type: scheduled
    cron: "0 3 * * *"  # Daily at 3 AM
    scope: all_failing_tests

# Capabilities
capabilities:
  parse_failures:
    enabled: true
    frameworks:
      - pytest
      - unittest
    output_formats:
      - terminal
      - json
      - xml
      
  analyze_code:
    enabled: true
    tools:
      - ast
      - libcst
    max_file_size_kb: 500
    
  generate_fixes:
    enabled: true
    strategies:
      - string_pattern_match
      - structure_transform
      - type_conversion
    validation_required: true
    
  validate_fixes:
    enabled: true
    tools:
      - hypothesis
      - pytest
    min_examples: 100
    
  auto_commit:
    enabled: true
    require_validation: true
    commit_message_template: |
      fix(tests): update assertion in {test_name}
      
      - Previous: expected {old_value}
      - Updated: expected {new_value}
      - Reason: implementation evolved ({change_type})
      
      Validated with {validation_method}
      Auto-generated by test-assertion-updater agent

# Input/Output specifications
input:
  required:
    - pytest_output: string  # Raw pytest failure output
  optional:
    - test_file: path  # Specific test file to analyze
    - implementation_file: path  # Related implementation file
    - max_fixes: integer  # Maximum fixes to generate (default: 10)

output:
  success:
    fixes_applied: integer
    tests_now_passing: list[string]
    validation_results: object
    commit_sha: string
  failure:
    reason: string
    manual_review_required: boolean
    suggested_actions: list[string]

# Integration points
integrations:
  cognitive_brain:
    pattern_storage: true
    learning_enabled: true
    pattern_categories:
      - test_assertion_evolution
      - error_message_changes
      
  github:
    pr_comments: true
    status_checks: true
    auto_commit: true
    
  ci_pipeline:
    trigger_on_failure: true
    retry_after_fix: true

# Constraints and limits
constraints:
  max_concurrent_fixes: 5
  timeout_seconds: 300
  max_iterations: 3
  require_human_approval_for:
    - breaking_changes
    - test_deletion
    - coverage_reduction

# Error handling
error_handling:
  on_parse_failure:
    action: log_and_skip
    notify: false
    
  on_analysis_failure:
    action: flag_for_review
    notify: true
    
  on_validation_failure:
    action: revert_and_report
    notify: true
    max_retries: 2
    
  on_commit_failure:
    action: create_pr_instead
    notify: true

# Monitoring and metrics
monitoring:
  metrics:
    - fixes_generated
    - fixes_validated
    - fixes_committed
    - validation_failure_rate
    - average_fix_time
  
  alerts:
    - condition: validation_failure_rate > 0.3
      action: disable_auto_commit
      notify: maintainers

# Security
security:
  code_execution: sandboxed
  file_access: test_files_only
  network_access: none
  secret_handling: never_access
