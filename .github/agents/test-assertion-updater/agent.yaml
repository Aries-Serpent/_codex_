name: test-assertion-updater
version: 1.0.0
description: 'Automatically detect and fix test assertion mismatches when implementation
  evolves while preserving test intent and coverage.

  '
metadata:
  author: copilot
  created: 2026-01-11
  category: test-automation
  priority: high
  estimated_effort: 3-5 days
triggers:
  events:
  - workflow_failure
  - manual
  - scheduled
capabilities:
- parse_failures
- analyze_code
- generate_fixes
- validate_fixes
- auto_commit
input:
  required:
  - pytest_output: string
  optional:
  - test_file: path
  - implementation_file: path
  - max_fixes: integer
output:
  success:
    fixes_applied: integer
    tests_now_passing: list[string]
    validation_results: object
    commit_sha: string
  failure:
    reason: string
    manual_review_required: boolean
    suggested_actions: list[string]
integrations:
  cognitive_brain:
    pattern_storage: true
    learning_enabled: true
    pattern_categories:
    - test_assertion_evolution
    - error_message_changes
  github:
    pr_comments: true
    status_checks: true
    auto_commit: true
  ci_pipeline:
    trigger_on_failure: true
    retry_after_fix: true
constraints:
  max_concurrent_fixes: 5
  timeout_seconds: 300
  max_iterations: 3
  require_human_approval_for:
  - breaking_changes
  - test_deletion
  - coverage_reduction
error_handling:
  on_parse_failure:
    action: log_and_skip
    notify: false
  on_analysis_failure:
    action: flag_for_review
    notify: true
  on_validation_failure:
    action: revert_and_report
    notify: true
    max_retries: 2
  on_commit_failure:
    action: create_pr_instead
    notify: true
monitoring:
  metrics:
  - fixes_generated
  - fixes_validated
  - fixes_committed
  - validation_failure_rate
  - average_fix_time
  alerts:
  - condition: validation_failure_rate > 0.3
    action: disable_auto_commit
    notify: maintainers
security:
  code_execution: sandboxed
  file_access: test_files_only
  network_access: none
  secret_handling: never_access
id: test-assertion-updater
status: active
maturity: beta
dependencies: []
