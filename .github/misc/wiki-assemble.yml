name: Wiki Assembly & Documentation

on:
  workflow_dispatch:
    inputs:
      include_api_docs:
        description: 'Include API documentation'
        required: false
        default: 'true'
        type: boolean
      include_mermaid:
        description: 'Include Mermaid diagrams'
        required: false
        default: 'true'
        type: boolean
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'scripts/space_traversal/wiki_generator.py'

permissions:
  contents: write
  actions: read

jobs:
  assemble-wiki:
    name: Generate Wiki Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'common'
