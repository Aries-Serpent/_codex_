name: Zendesk Quantum Packaging

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version override"
        required: false
        default: "1.0.0"
      package:
        description: "Package to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - core
          - rag
          - metrics
          - agent
          - testing
          - bundle
      include_bundle:
        description: "Include zendesk-complete-bundle"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: ./.github/actions/setup-python-cached
        with:
          python-version: '3.12'
          cache-tier: 'ephemeral'
