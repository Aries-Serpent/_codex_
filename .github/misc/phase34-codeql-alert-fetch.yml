name: Art_Phase 34 - CodeQL Alert Fetch

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum pages to fetch (100 alerts per page)'
        default: '60'
        required: false
        type: string
      severity_filter:
        description: 'Filter by severity (optional)'
        required: false
        type: choice
        options:
          - 'all'
          - 'critical'
          - 'high'
          - 'medium'
          - 'low'
        default: 'all'

permissions:
  security-events: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  fetch-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Debug Workflow Inputs
        if: runner.debug == '1'
        run: |
          echo "::group::Workflow Debug Information"
          echo "Workflow: phase34-codeql-alert-fetch"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Max pages: ${{ github.event.inputs.max_pages }}"
          echo "Severity filter: ${{ github.event.inputs.severity_filter }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "::endgroup::"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch CodeQL Alerts
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          echo "Fetching CodeQL alerts..."

          # Determine severity filter
          SEVERITY_ARG=""
          if [ "${{ github.event.inputs.severity_filter }}" != "all" ]; then
            SEVERITY_ARG="--severity ${{ github.event.inputs.severity_filter }}"
          fi

          # Run fetch script
          python scripts/security/fetch_codeql_alerts.py \
            --owner Aries-Serpent \
            --repo _codex_ \
            --state open \
            --max-pages ${{ github.event.inputs.max_pages }} \
            --output-dir .codex/security \
            $SEVERITY_ARG \
            --verbose

      - name: Verify Alert Data
        run: |
          echo "Alert inventory files:"
          ls -lh .codex/security/

          if [ -f .codex/security/alert_inventory.json ]; then
            echo "Total alerts fetched:"
            jq '.total_alerts' .codex/security/alert_inventory.json

            echo "Alerts by severity:"
            jq '.alerts | group_by(.severity) | map({severity: .[0].severity, count: length})' \
              .codex/security/alert_inventory.json
          fi

      - name: Generate Summary Report
        run: |
          if [ -f .codex/security/alert_summary.md ]; then
            echo "## CodeQL Alert Fetch Summary" >> $GITHUB_STEP_SUMMARY
            cat .codex/security/alert_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit Alert Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain .codex/security/)" ]; then
            git add .codex/security/
            ALERT_COUNT=$(jq -r '.total_alerts // 0' .codex/security/alert_inventory.json 2>/dev/null || echo 'N/A')
            git commit -m "data: Phase 34 CodeQL alert inventory ($ALERT_COUNT alerts fetched)"
            git push
            echo "✅ Alert data committed to repository"
          else
            echo "ℹ️ No changes to commit"
          fi

      - name: Upload Alert Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: codeql-alert-inventory
          path: |
            .codex/security/alert_inventory.json
            .codex/security/alert_summary.md
            .codex/security/alert_inventory.csv
          retention-days: 30
          if-no-files-found: warn

      - name: Create Issue for Analysis
        if: success()
        env:
          GH_TOKEN: ${{ secrets.CODEX_MASTER_KEY || secrets.CODEX_BACKUP_KEY }}
        run: |
          # Check if alert data exists
          if [ ! -f .codex/security/alert_inventory.json ]; then
            echo "No alert data found, skipping issue creation"
            exit 0
          fi

          TOTAL_ALERTS=$(jq -r '.total_alerts // 0' .codex/security/alert_inventory.json)

          if [ "$TOTAL_ALERTS" -gt 0 ]; then
            # Build issue body using echo to avoid YAML heredoc parsing issues
            {
              echo "## CodeQL Alert Fetch Complete"
              echo ""
              echo "Alert inventory has been fetched and committed to the repository."
              echo ""
              echo "**Total Alerts:** $TOTAL_ALERTS"
              echo "**Location:** .codex/security/alert_inventory.json"
              echo "**Artifacts:** Available in workflow run"
              echo ""
              echo "### Next Steps"
              echo ""
              echo "@copilot Please analyze the alert data and proceed with Phase 34 execution:"
              echo ""
              echo "1. Review alert distribution by severity and pattern"
              echo "2. Extract P0/P1 (critical/high) alerts for immediate attention"
              echo "3. Generate automated fixes using security codemods"
              echo "4. Create PRs for high-confidence fixes"
              echo "5. Update progress dashboard"
              echo ""
              echo "**Commands:**"
              echo "See .codex/plans/CODEQL_ALERT_RESOLUTION_PLANSET.md for execution commands"
              echo ""
              echo "**References:**"
              echo "- Master Planset: .codex/plans/CODEQL_ALERT_RESOLUTION_PLANSET.md"
              echo "- Agent Spec: .github/agents/codeql-alert-resolution-agent.md"
              echo "- Execution Plan: .codex/security/EXECUTION_PLAN_WITH_TOKEN_ACCESS.md"
            } > /tmp/issue_body.md

            # Create issue
            gh issue create \
              --title "[Phase 34] CodeQL Alert Analysis Required - $TOTAL_ALERTS alerts fetched" \
              --body-file /tmp/issue_body.md \
              --label "security,phase-34,ai-agent" \
              --assignee mbaetiong || echo "Issue creation skipped (may already exist)"
          fi
