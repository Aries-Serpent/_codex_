# Inactive proposal. Do not move into .github/workflows without review and authorization.
name: Proposed CDX SQLite Pilot Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PILOT_SOURCE: .codex/archive/root-consolidation/temp-outputs/mutants
      PILOT_OUTPUT: ${{ runner.temp }}/cdx-pilot
    steps:
      - name: Checkout selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned secret scanners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PILOT_OUTPUT" "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLo "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          printf '%s  %s\n' "$expected" "$asset" | sha256sum --check --status
          tar -xzf "$asset" gitleaks
          install -m 0755 gitleaks "$PILOT_OUTPUT/gitleaks"
          python3 -m venv "$PILOT_OUTPUT/venv"
          "$PILOT_OUTPUT/venv/bin/python" -m pip install --disable-pip-version-check \
            'detect-secrets==1.5.0'
          printf '%s\n' "$PILOT_OUTPUT" "$PILOT_OUTPUT/venv/bin" >> "$GITHUB_PATH"
          "$PILOT_OUTPUT/gitleaks" version
          "$PILOT_OUTPUT/venv/bin/detect-secrets" --version

      - name: Run both secret scanners and write redacted evidence
        id: scan
        shell: bash
        run: |
          set -u
          "$PILOT_OUTPUT/gitleaks" dir --no-banner --redact \
            --report-format json --report-path "$PILOT_OUTPUT/gitleaks.json" \
            "$PILOT_SOURCE"
          gitleaks_status=$?
          "$PILOT_OUTPUT/venv/bin/detect-secrets" scan --all-files "$PILOT_SOURCE" \
            > "$PILOT_OUTPUT/detect-secrets.json"
          detect_status=$?
          python3 - "$PILOT_OUTPUT" "$GITHUB_SHA" "$gitleaks_status" "$detect_status" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path

          out = Path(sys.argv[1])
          gitleaks_status, detect_status = map(int, sys.argv[3:5])
          gitleaks_path = out / "gitleaks.json"
          detect_path = out / "detect-secrets.json"
          gitleaks = json.loads(gitleaks_path.read_text()) if gitleaks_path.exists() else []
          detect = json.loads(detect_path.read_text()) if detect_path.exists() else {}
          source_root = Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["PILOT_SOURCE"]
          source_files = [
              path for path in source_root.rglob("*")
              if path.is_file() and not path.is_symlink()
          ]
          plugins = Counter(
              hit.get("type", "unknown")
              for hits in detect.get("results", {}).values()
              for hit in hits
          )
          rule_counts = Counter(hit.get("RuleID", "unknown") for hit in gitleaks)
          clean = (
              gitleaks_status == 0
              and detect_status == 0
              and not gitleaks
              and not detect.get("results")
          )
          version = subprocess.run(
              [str(out / "gitleaks"), "version"], check=True, capture_output=True, text=True
          ).stdout.strip()
          evidence = {
              "source_sha": sys.argv[2],
              "source_path": os.environ["PILOT_SOURCE"],
              "source_file_count": len(source_files),
              "source_raw_bytes": sum(path.stat().st_size for path in source_files),
              "status": "scanners_passed" if clean else "blocked_or_scanner_error",
              "gitleaks_version": version,
              "gitleaks_exit_code": gitleaks_status,
              "gitleaks_findings": len(gitleaks),
              "gitleaks_rule_counts": dict(rule_counts),
              "detect_secrets_exit_code": detect_status,
              "detect_secrets_version": "1.5.0",
              "detect_secrets_findings": sum(plugins.values()),
              "detect_secrets_plugin_counts": dict(plugins),
              "archive_generated": False,
              "archive_sha256": None,
              "merkle_root_sha256": None,
          }
          (out / "evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"clean={'true' if clean else 'false'}\n")
          PY

      - name: Pack twice and verify reproducibility
        id: pack
        if: steps.scan.outputs.clean == 'true'
        shell: bash
        run: |
          set -euo pipefail
          first="$PILOT_OUTPUT/first.cdx.sqlite"
          second="$PILOT_OUTPUT/second.cdx.sqlite"
          start="$(date +%s%N)"
          python3 -m scripts.archive.codex_packer "$PILOT_SOURCE" "$first" \
            > "$PILOT_OUTPUT/pack-first.json"
          middle="$(date +%s%N)"
          python3 -m scripts.archive.codex_packer "$PILOT_SOURCE" "$second" \
            > "$PILOT_OUTPUT/pack-second.json"
          finish="$(date +%s%N)"
          python3 - "$PILOT_OUTPUT" "$start" "$middle" "$finish" <<'PY'
          import hashlib
          import json
          import statistics
          import sys
          import time
          from pathlib import Path

          from scripts.archive.codex_query import CodexArchiveQuery
          from scripts.archive.codex_rehydrate import verify_archive

          out = Path(sys.argv[1])
          start, middle, finish = map(int, sys.argv[2:5])
          first_result = json.loads((out / "pack-first.json").read_text())
          second_result = json.loads((out / "pack-second.json").read_text())
          if first_result["merkle_root_sha256"] != second_result["merkle_root_sha256"]:
              raise SystemExit("two pack runs produced different Merkle roots")
          first = out / "first.cdx.sqlite"
          second = out / "second.cdx.sqlite"
          first_verify = verify_archive(first)
          second_verify = verify_archive(second)
          query_times = []
          with CodexArchiveQuery(first) as query:
              for _ in range(10):
                  before = time.perf_counter()
                  query.list_tree(prefix="src")
                  query_times.append((time.perf_counter() - before) * 1000)
          evidence_path = out / "evidence.json"
          evidence = json.loads(evidence_path.read_text())
          archive_bytes = first.stat().st_size
          source_root = Path(".codex/archive/root-consolidation/temp-outputs/mutants")
          source_files = [p for p in source_root.rglob("*") if p.is_file() and not p.is_symlink()]
          source_bytes = sum(p.stat().st_size for p in source_files)
          second_sha256 = hashlib.sha256(second.read_bytes()).hexdigest()
          evidence.update({
              "status": "verified",
              "archive_generated": True,
              "source_file_count": len(source_files),
              "source_raw_bytes": source_bytes,
              "archive_size_bytes": archive_bytes,
              "compression_ratio": source_bytes / archive_bytes if archive_bytes else None,
              "pack_duration_seconds": (finish - start) / 1e9,
              "first_pack_duration_seconds": (middle - start) / 1e9,
              "second_pack_duration_seconds": (finish - middle) / 1e9,
              "query_latency_ms_median": statistics.median(query_times),
              "integrity_results": [first_verify["integrity_check"], second_verify["integrity_check"]],
              "merkle_root_sha256": first_result["merkle_root_sha256"],
              "reproducible": True,
              "archive_sha256": [
                  hashlib.sha256(first.read_bytes()).hexdigest(),
                  second_sha256,
              ],
          })
          evidence_path.write_text(json.dumps(evidence, indent=2) + "\n")
          PY
          mkdir -p "$PILOT_OUTPUT/verified"
          cp "$first" "$second" "$PILOT_OUTPUT/verified/"

      - name: Upload source-bound evidence and successful archives
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cdx-pilot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cdx-pilot/evidence.json
            ${{ runner.temp }}/cdx-pilot/verified/*.cdx.sqlite
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed if scanners or packing did not pass
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.scan.outputs.clean }}" != "true" ]]; then
            echo "Pilot blocked: secret scanners did not both pass with zero findings."
            exit 1
          fi
          if [[ "${{ steps.pack.outcome }}" != "success" ]]; then
            echo "Pilot blocked: both archive packs and integrity/reproducibility checks must pass."
            exit 1
          fi
