# PHASE 7A WAVE 3 LANE 3.2: COMPREHENSIVE MUTATION TESTING CONFIG
# Mutation testing validates test quality by introducing bugs (mutations)
# and checking if tests catch them.

[mutmut]
# Paths to mutate - all source code (critical modules first)
source_paths = src/

# Test command for mutation testing
tests_dir = tests/

# Mutation operator types
mutation_types = string,keyword,operator,number,literal,dict,set,list,index,decorator,same_node,attribute,assignment,slice

# Timeout settings
test_time_multiplier = 2.0
test_time_base = 10.0

# Paths to exclude from mutation
exclude_patterns =
    __pycache__
    *.pyc
    */tests/*
    */test_*
    */mock*
    */stub*
    */fixtures/*
    *__init__.py
    */conftest.py

# Cache and output settings
cache_only = False
show_times = False
swallow_output = True
rerun_all = False

# Parallel execution
use_coverage = False

# Modules to prioritize (security-critical, business logic)
# Run mutation testing on these first
mutation_priority_modules =
    src/rag/
    src/security/
    src/auth/
    src/api/
    src/core/
