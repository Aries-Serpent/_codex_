# Machine-readable ML Test Score map for _codex_.
#
# This YAML mirrors docs/tests/ml_test_score_mapping.md, but is suitable for
# automation via tools/codex_mltest_runner.py.
#
# Structure:
#   categories:
#     <category_name>:
#       description: "..."
#       tests:
#         - "tests/..."
#
# Categories:
#   - data
#   - model
#   - infrastructure
#   - regression
#   - performance

categories:
  data:
    description: "Dataset handling, determinism, splitting, preprocessing."
    tests:
      - "tests/codex_ml/test_dataloader_determinism.py"
      - "tests/codex_ml/test_simple_dataset.py"

  model:
    description: "Model construction and forward behavior, training loop basics, evaluation logic."
    tests:
      - "tests/codex_ml/test_tokenization_basic.py"
      - "tests/codex_ml/test_model_factory.py"
      - "tests/codex_ml/test_training_loop_smoke.py"
      - "tests/codex_ml/test_eval_smoke.py"
      - "tests/codex_ml/test_minimal_train_cli.py"
      - "tests/codex_ml/test_eval_minimal_cli.py"

  infrastructure:
    description: "Tooling, orchestration, config loading, logging, checkpointing, registries."
    tests:
      - "tests/tools/test_codex_gap_registry.py"
      - "tests/tools/test_codex_yaml_gap_check.py"
      - "tests/tools/test_codex_task_sequence_runner.py"
      - "tests/tools/test_codex_hardship_and_capability_validators.py"
      - "tests/tools/test_codex_mltest_map_and_runner.py"
      - "tests/tools/test_codex_experiment_index.py"
      - "tests/codex_ml/test_config_integration.py"
      - "tests/codex_ml/test_config_loader.py"
      - "tests/codex_ml/test_logging_registry.py"
      - "tests/codex_ml/test_checkpoint_utils.py"
      - "tests/codex_ml/test_mlflow_wrapper_stub.py"
      - "tests/codex_ml/test_registry_basic.py"
      - "tests/codex_ml/test_cli_utils_run_context.py"
      - "tests/codex_ml/test_codex_env_cli.py"
      - "tests/codex_ml/test_metrics_logger.py"

  regression:
    description: "Targeted tests for previously fixed bugs (currently empty, reserved for future)."
    tests: []

  performance:
    description: "Performance or scale-focused tests (currently empty, reserved for future)."
    tests: []
