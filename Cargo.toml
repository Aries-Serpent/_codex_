[package]
name = "codex-swarm-engine"
version = "0.1.0"
edition = "2021"
authors = ["Aries Serpent"]
description = "Rust orchestration layer for Codex AI Agent Swarm"
license = "MIT"

[lib]
name = "codex_engine"
crate-type = ["cdylib", "rlib"]  # cdylib for Python import; rlib for Rust tests

[dependencies]
# Python-Rust Interop
# PyO3 Configuration Notes:
# - The 'extension-module' feature is intentionally NOT specified here
# - During builds, maturin automatically adds 'extension-module' to create Python extensions
# - For 'cargo test', we compile without 'extension-module' to allow standard Rust linking
# - This approach enables both Python extension builds (via maturin) and native Rust tests
# - The abi3-py38 feature ensures compatibility with Python 3.8+
#
# IMPORTANT CI/CD REQUIREMENTS:
# - ALL Python extension builds MUST use maturin (not cargo directly)
# - CI workflow (.github/workflows/rust_swarm_ci.yml) correctly uses maturin
# - Local builds: Use 'maturin develop' or 'maturin build' commands
# - Do NOT use 'cargo build' for Python extensions as it will not add 'extension-module'
# - Test workflow validates this configuration is working correctly
#
# Verification:
# - Rust-only tests: 'cargo test' (no extension-module feature)
# - Python integration: 'maturin develop' (adds extension-module automatically)
# - Both modes tested in CI to ensure compatibility
pyo3 = { version = "0.24.1", features = ["abi3-py38"] }
pyo3-async-runtimes = { version = "0.24", features = ["tokio-runtime"] }

# Async Runtime & Parallelism
tokio = { version = "1.36", features = ["full", "tracing"] }
rayon = "1.8.1"  # For CPU-bound data preprocessing
dashmap = "6.2.1"  # Concurrent hash map for swarm state aggregation

# Data Serialization & Compression
serde = { version = "1.0.197", features = ["derive"] }
rmp-serde = "1.1.2"  # Binary serialization for agent state
lz4 = "1.24.0"  # Fast compression for real-time agent streams
zstd = { version = "0.13.0", features = ["zstdmt"] }  # High-ratio compression
flate2 = "1.1"  # DEFLATE compression for Compression module

# System Interfaces & Communication
crossbeam = "0.8.4"  # Multi-producer, multi-consumer channels
parking_lot = "0.12"  # Fast synchronization primitives
anyhow = "1.0.80"  # Flexible error handling
tracing = "0.1.40"  # High-performance instrumentation
tracing-subscriber = "0.3.18"

[build-dependencies]
pyo3-build-config = "0.29.2"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "swarm_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = true

[tool.maturin]
module-name = "codex_engine"
python-source = "src"

[features]
default = []
# Python bindings feature - enables extension-module for proper Python extension building
# Use: maturin build --features extension-module
# The extension-module feature is required for creating Python extensions that don't link libpython
# `python` is kept as a convenience alias for `extension-module`.
python = ["extension-module"]
extension-module = ["pyo3/extension-module"]
