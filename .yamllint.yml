extends: default

rules:
  line-length:
    max: 140
    level: warning
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  document-start:
    present: false
  # Allow aligned env variable blocks in GitHub Actions workflows (e.g., padded colon spacing)
  colons:
    max-spaces-after: -1
    max-spaces-before: 0
  # Allow both indented and non-indented sequence styles (GitHub Actions uses both)
  indentation:
    spaces: 2
    indent-sequences: whatever
    check-multi-line-strings: false
