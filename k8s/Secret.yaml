apiVersion: v1
kind: Secret
metadata:
  name: aries-serpent-secrets
  namespace: aries-serpent
  labels:
    app: aries-serpent
    version: 0.1.0
type: Opaque
data:
  # NOTE: These are placeholder values (base64 encoded). Replace with actual secret values during deployment.
  # To generate valid base64: echo -n "your-value" | base64
  
  # API Key (replace placeholder)
  API_KEY: cGxhY2Vob2xkZXItYXBpLWtleQ==  # placeholder-api-key
  
  # Database password (replace placeholder)
  DB_PASSWORD: cGxhY2Vob2xkZXItZGItcGFzc3dvcmQ=  # placeholder-db-password
  
  # OAuth secret (replace placeholder)
  OAUTH_SECRET: cGxhY2Vob2xkZXItb2F1dGgtc2VjcmV0  # placeholder-oauth-secret
  
  # JWT secret key (replace placeholder)
  JWT_SECRET_KEY: cGxhY2Vob2xkZXItand0LXNlY3JldC1rZXk=  # placeholder-jwt-secret-key

---
apiVersion: v1
kind: Secret
metadata:
  name: aries-serpent-docker-secret
  namespace: aries-serpent
  labels:
    app: aries-serpent
    version: 0.1.0
type: kubernetes.io/dockercfg
data:
  # NOTE: This is a placeholder for Docker registry credentials.
  # Replace with actual .dockercfg content (base64 encoded) if using private registry.
  # To use: add imagePullSecrets in pod spec pointing to this secret.
  .dockercfg: e30=  # placeholder: {}
