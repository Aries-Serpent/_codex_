[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
no_implicit_optional = False
strict_optional = False
plugins =

[mypy-typer.*]
ignore_missing_imports = True

[mypy-tomli.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True
