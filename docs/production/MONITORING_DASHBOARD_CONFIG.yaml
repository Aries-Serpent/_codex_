---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerting-rules
  namespace: monitoring
data:
  production-alerts.yml: |
    groups:
    - name: production_critical
      interval: 30s
      rules:
      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

      # High Latency
      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High latency detected"
          description: "p99 latency is {{ $value }}s for {{ $labels.service }}"

      # Health Check Failed
      - alert: HealthCheckFailed
        expr: up{job="production"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Health check failed"
          description: "{{ $labels.instance }} has been down for 1 minute"

      # Resource Exhaustion
      - alert: CPUHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High CPU utilization"
          description: "CPU is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: MemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory utilization"
          description: "Memory is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

    - name: production_warning
      interval: 30s
      rules:
      # Elevated Error Rate
      - alert: ElevatedErrorRate
        expr: rate(http_requests_errors_total[5m]) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated error rate"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

      # Elevated Latency
      - alert: ElevatedLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated latency"
          description: "p95 latency is {{ $value }}s for {{ $labels.service }}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: true

    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: true

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
    name: grafana
  selector:
    app: grafana

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: prometheus
  selector:
    app: prometheus
