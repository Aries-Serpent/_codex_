    status: partial
    enforcement_gaps:
      - "No CI test gate verifying STM→LTM pipeline is functional end-to-end"
    notes: "memory-sync-agent responsible for STM→LTM at 80% capacity. Add test."
    archive_safe: false

  # ── Agent Registry Validation ──────────────────────────────────────────────
  - id: EXP-006
    source_document: .github/agents/AGENT_ECOSYSTEM_MAP.md
    expectation: "AGENT_REGISTRY.yaml must be the canonical source of truth for all active agents"
    enforcement:
      type: workflow
