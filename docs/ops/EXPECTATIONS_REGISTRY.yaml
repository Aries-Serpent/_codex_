      check: "grep 'CODEX_OPEN_CRITICAL_ALERTS\\|CODEX_CI_FAILURE_RATE' scripts/ci/aais_v4_scorer.py"
    status: enforced
    notes: "Fixed S172 PR #3661 — alert count clamps + CI failure rate penalty applied"
    archive_safe: true

  # ── Cognitive Brain Memory Pipeline ────────────────────────────────────────
  - id: EXP-005
    source_document: .github/agents/COGNITIVE_BRAIN_STATUS_V5.md
    expectation: "Cognitive Brain must have SQLiteMemory with STM→LTM pipeline"
