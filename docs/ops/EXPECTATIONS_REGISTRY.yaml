  # ── Enforcement-First Archive Rule ─────────────────────────────────────────
  - id: EXP-014
    source_document: docs/ops/CONSOLIDATION_PLANSET_S174.md
    expectation: "Before any file is archived, ALL expectations in it must be registered here with status: enforced"
    enforcement:
      type: script
      location: scripts/ci/check_expectations.py
      check: "python scripts/ci/check_expectations.py --no-missing-blocks-archive"
    status: missing
    enforcement_gaps:
      - "check_expectations.py not yet implemented"
