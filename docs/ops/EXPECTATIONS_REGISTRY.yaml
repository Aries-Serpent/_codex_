  # ── Self-Healing Cascade Root Cause ────────────────────────────────────────
  - id: EXP-007
    source_document: .codex/patterns/ci_failure_patterns.yaml
    expectation: "SELF_HEALING_001 pattern: venv recreation (python3 -m venv .venv_ci) on cache miss — NOT pip fallback"
    enforcement:
