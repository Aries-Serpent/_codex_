# Expectations Registry
#
# PURPOSE
# -------
# Every documented expectation (rule, threshold, requirement) that lives in
# .github/agents/ documentation files is registered here with:
#   - The source document where it is described
#   - The CI/code enforcement point that actually enforces it
#   - Verification status (is the enforcement real and working?)
#
# ENFORCEMENT-FIRST RULE (from docs/ops/NO_AUTO_PR_GUIDE.md)
# ----------------------------------------------------------
# Before any document is archived or moved, ALL expectations in that document
# MUST be registered here AND their enforcement must be verified (status: enforced).
# A document with unverified expectations MUST NOT be archived.
# CI gate: scripts/ci/check_expectations.py --strict
#
# STATUS VALUES
# -------------
#   enforced    - CI/code enforcement exists and is verified working
#   partial     - Some enforcement exists; gaps noted in enforcement_gaps
#   missing     - No enforcement — BLOCKS archive of source_document
#   deferred    - Deliberately not enforced; reason required in notes
#
# HOW TO ADD A NEW EXPECTATION
# ----------------------------
#   1. Identify the documented expectation (rule/threshold/requirement)
#   2. Find or create the CI enforcement point
#   3. Add an entry below with status: enforced
#   4. Run: python scripts/ci/check_expectations.py
#
# FORMAT
# ------
# - id: EXP-NNN                          # Sequential, never reuse
#   source_document: path/to/doc.md      # Where the expectation is documented
#   expectation: "description"           # What must be true
#   enforcement:
#     type: workflow|script|code|config  # Type of enforcement
#     location: path/to/enforcer         # File or workflow enforcing it
#     check: "grep/command to verify"    # Optional: how to verify it exists
#   status: enforced|partial|missing|deferred
#   enforcement_gaps: []                 # Required when status != enforced
#   notes: ""                            # Optional context
#   archive_safe: true|false             # Can source_document be archived?

version: "1.0"
updated: "2026-03-21"
policy: "docs/ops/NO_AUTO_PR_GUIDE.md"
checker: "scripts/ci/check_expectations.py"

expectations:

  # ── Agent File Size (30,000 char limit) ────────────────────────────────────
  - id: EXP-001
    source_document: .github/agents/AGENT_ECOSYSTEM_MAP.md
    expectation: "Custom agent .md files in .github/agents/ must not exceed 30,000 characters"
    enforcement:
      type: script
      location: scripts/ci/check_agent_file_sizes.py
      check: "python scripts/ci/check_agent_file_sizes.py --strict"
    status: enforced
    notes: "30k limit enforced by check_agent_file_sizes.py; pre-commit hook added S173"
    archive_safe: false  # AGENT_ECOSYSTEM_MAP.md itself is over 30k — cannot archive until trimmed OR enforcement covers all agents

  # ── Coverage Threshold ──────────────────────────────────────────────────────
  - id: EXP-002
    source_document: .github/agents/AI_AGENT_INTUITIVENESS_SCORE_V2.md
    expectation: "Test coverage must be >= 90% (target); fail_under=80 is the enforced minimum"
    enforcement:
      type: config
      location: pyproject.toml
      check: "grep 'fail_under = 80' pyproject.toml"
    status: partial
    enforcement_gaps:
      - "Documented target is 90% but pyproject.toml only enforces 80% (fail_under=80)"
      - "Gap tracked in S173 priority list: close coverage gap 72%→80% first, then raise to 90%"
    notes: "Coverage gap 72%→80% is S173 P1. Raise fail_under to 90 once 80 is met."
    archive_safe: false  # partial enforcement — gap must close before archive

  # ── ML Model Accuracy ──────────────────────────────────────────────────────
  - id: EXP-003
    source_document: .github/agents/archive/oversized-docs/PHASE_8_ROADMAP.md
    expectation: "ML model accuracy must be >= 84% and coherence >= 0.650"
    enforcement:
      type: workflow
      location: .github/workflows/autonomy-phase-ci-matrix.yml
      check: "grep -n 'accuracy\\|coherence\\|0.65\\|84' .github/workflows/autonomy-phase-ci-matrix.yml"
    status: partial
    enforcement_gaps:
      - "autonomy-phase-ci-matrix.yml references accuracy but threshold is not explicitly enforced as a gate"
    notes: "Phase 8 metrics. Verify gate exists in autonomy-phase-ci-matrix.yml."
    archive_safe: false

  # ── AAIS Score Honest Calibration ──────────────────────────────────────────
  - id: EXP-004
    source_document: .github/agents/AI_AGENT_INTUITIVENESS_SCORE_V2.md
    expectation: "AAIS scorer must apply honest three-gate calibration using live env vars (not file-existence-only)"
    enforcement:
